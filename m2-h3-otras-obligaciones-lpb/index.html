<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Módulo 2 · Área 2: otras obligaciones, intercambio de información y Lista de Personas Bloqueadas en las 12 DCG (Bancos como eje), con simulador de reactivos.">
<title>2.1.6 Otras obligaciones · 2.1.7 Intercambio de información · 2.1.8 Lista de personas bloqueadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}

{"meta":{"titulo":"2.1.6 Otras obligaciones · 2.1.7 Intercambio de información · 2.1.8 Lista de personas bloqueadas","descripcion":"Módulo 2 · Área 2: otras obligaciones, intercambio de información y Lista de Personas Bloqueadas en las 12 DCG (Bancos como eje), con simulador de reactivos.","repo":"mapa-m2-s3","clave":"m2s3","ruta":"financiero","modulo":"Módulo 2 · Certificación CNBV PLD/FT","unidad":"subtemas","eyebrow":"Temario CNBV agosto 2026 · 2.1.6 · 2.1.7 · 2.1.8 · 12 DCG (Bancos al 28-ago-2024)","h1_antes":"2.1.6 Otras obligaciones ·","h1_resaltado":"2.1.7 Intercambio de información","h1_despues":"· 2.1.8 Lista de personas bloqueadas","intro":"<b>¿Qué más cumplo, con quién comparto y a quién bloqueo?<\/b> Tres temas del 2.1, en el orden del temario. Bancos es el eje; cada diferencia se aprende <b>sujeto por sujeto<\/b> como «igual que Bancos, salvo…». El color de cada sujeto es el de su familia (agrupación didáctica de 360Educa: orienta, no explica; las diferencias cortan dentro de las familias). Orden sugerido: mapa → Modo recitar → trampas → cifras → simulacro de 30.","resumen_portada":"Manual, metodología, capacitación, reserva, conservación y auditoría; quién puede intercambiar información y con quién, y qué hacer cuando un cliente aparece en la LPB.","fuente":"Fuente: las 12 Disposiciones de carácter general en PLD/FT de la bibliografía del temario CNBV (agosto 2026): Bancos (art. 115 LIC) compiladas al 28-ago-2024; SOFOM, Casas de bolsa, Fondos, SOCAP y SOFIPO 2021; Asesores, Uniones, Centros cambiarios y Transmisores 2023; Casas de cambio 2019; ITF (art. 58 LRITF) 2018. La reforma a Bancos del DOF 10-jul-2026 (posterior al temario) no toca estos tres temas."},"trampas":[{"titulo":"La LPB no es parte de la identificación del cliente.","texto":"En ninguna de las 11 DCG que la prevén está en el capítulo de identificación: tiene <b>capítulo propio<\/b> (Bancos Cap. XV, 70ª–75ª). El cotejo contra la lista es un <b>mecanismo<\/b> que va en el Manual (70ª). Si aparece un Cliente o Usuario: <b>suspender de inmediato<\/b> y remitir, <b>dentro de las 24 horas<\/b> desde que conoce la información, un <b>reporte de Operación Inusual<\/b> con la leyenda «Lista de Personas Bloqueadas» (72ª). No es un reporte autónomo. <b>Asesores en inversiones no tiene LPB<\/b>: cero menciones en su DCG."},{"titulo":"Tres reportes de 24 horas que no son el mismo.","texto":"<b>1)<\/b> Capítulo de la LPB (Bancos 72ª): el cliente <b>ya está<\/b> en la lista → suspender + OI en 24 h con leyenda «Lista de Personas Bloqueadas». <b>2)<\/b> Inusuales, 41ª 2º párrafo: operaciones <b>anteriores<\/b> a la notificación de la LPB, intentos posteriores o terceros a favor del listado → OI en 24 h. <b>3)<\/b> «Reporte de 24 horas» de la 41ª 1er párrafo (se estudia en 2.1.3): sospecha al pretenderse una operación; se reporta <b>la acepte o no<\/b>. Bancos dice que «<b>podrá<\/b> no realizar» la operación, reporta en 24 h con leyenda LD o FT y, si la acepta, también; en las otras diez DCG las 24 h y la leyenda única se ligan expresamente a que <b>decida aceptar<\/b>, y si no la realiza reporta «en los términos» de la disposición; ITF (art. 73) cuenta desde la alerta, en tres supuestos."},{"titulo":"Ni «10 años para todos» ni «todos intercambian».","texto":"Conservación: <b>10 años<\/b> en 11 DCG; <b>Asesores, 5 años<\/b> (37ª). Y no confundas los 10 años de operaciones y expedientes con los <b>5 años<\/b> del EBR (21ª-4) y del informe de auditoría (60ª). Intercambio: <b>Asesores, SOCAP, Uniones, Centros cambiarios y Transmisores no lo prevén<\/b> en ninguna modalidad; entre entidades del mismo tipo sólo Bancos, SOFIPO e ITF, con respuesta en <b>30 días naturales<\/b> (no hábiles)."}],"secciones":[{"tipo":"mapa","id":"mapa","nav":"Mapa 2.1.6–2.1.8","titulo":"Los tres temas en 20 subtemas","intro":"Tres ramas, una por tema del temario y en su orden, con ritmo <b>11 · 3 · 6 = 20<\/b>. «Otras obligaciones» es una lista suelta: para recordarla va en tres bloques <b>dentro<\/b> de 2.1.6 (3 · 4 · 4). Toca un subtema para ver su contenido y su disposición en Bancos.","centro":{"t":"2.1.6 · 2.1.7 · 2.1.8","s":"20 subtemas<br>11 · 3 · 6"},"ramas":[{"letra":"2.1.6","titulo":"Otras obligaciones","pregunta":"¿Qué más debo cumplir?","ritmo":"¿Qué más?","corto":"2.1.6","color":"principal","items":[{"etiqueta":"64ª–65ª","nombre":"Manual de Cumplimiento","sub":"A · Lo escribo y lo enseño","verbo":"Escribo","desc":"Políticas de identificación, conocimiento y riesgos que se remiten a la Comisión; sus cambios van en 20 días hábiles desde que los aprueba el comité de auditoría.","panel":"2.1.6 · Manual de Cumplimiento","puntos":["Lo elabora la Entidad y lo <b>remite a la Comisión<\/b> por medios electrónicos (64ª).","Incluye la metodología EBR y el procedimiento para abrir, limitar o terminar relaciones; desde 2024, lo relativo al <b>139 Quáter<\/b> CPF.","Modificaciones, con ejemplar completo: <b>dentro de los 20 días hábiles<\/b> siguientes a que las apruebe el <b>comité de auditoría<\/b> (64ª; 43ª I).","La Comisión puede requerir modificaciones (65ª).","Los <b>20 días hábiles<\/b> son iguales en las 12 DCG; cambia <b>quién aprueba<\/b> (en Asesores, el Representante elabora y desde ahí corre el plazo)."],"ir":"#t2-1-6","destacado":true},{"etiqueta":"21ª-1 a 21ª-6","nombre":"Enfoque basado en riesgo de la Entidad","sub":"A · Lo escribo y lo enseño","verbo":"Mido","desc":"La Entidad evalúa sus propios riesgos por productos, clientes, zonas, transacciones y canales; la metodología va en el Manual u otro documento y su información se conserva 5 años.","panel":"2.1.6 · Enfoque basado en riesgo de la Entidad","puntos":["Elementos: <b>productos y servicios, Clientes y Usuarios, países o áreas geográficas, transacciones y canales<\/b> (21ª-1).","Datos de <b>al menos 12 meses<\/b>; ajustes a políticas por nuevos riesgos en <b>no más de 12 meses<\/b>; revisión a más tardar <b>12 meses<\/b> desde los resultados.","Información conservada <b>≥ 5 años<\/b> (21ª-4). Sin envío autónomo: va en el Manual o en otro documento referido en él (64ª); si es otro documento, sólo queda a disposición de la Comisión.","Sólo Bancos exige indicadores específicos de <b>400 Bis y 139 Quáter<\/b> (2024). ITF añade la <b>Infraestructura Tecnológica<\/b>.","El grado de riesgo del <b>cliente<\/b> es otro tema (2.1.2)."],"ir":"#t2-1-6","destacado":false},{"etiqueta":"49ª–50ª","nombre":"Capacitación y difusión","sub":"A · Lo escribo y lo enseño","verbo":"Enseño","desc":"Cursos al menos una vez al año para consejeros, directivos y empleados, con constancias y evaluación; el personal nuevo de atención al público, antes o al ingresar.","panel":"2.1.6 · Capacitación y difusión","puntos":["Programa <b>al menos una vez al año<\/b>, incluidas áreas de atención al público o administración de recursos (49ª).","Contenido: Manual, actividades y productos, y Riesgos de la Entidad; difusión de las Disposiciones y de tipologías.","<b>Constancias<\/b>, evaluaciones y medidas para quien no apruebe (50ª).","Personal nuevo de atención al público o de administración de recursos: <b>antes o al mismo tiempo<\/b> que ingresa.","Asesores persona física: toma ella misma <b>al menos un curso anual<\/b>."],"ir":"#t2-1-6","destacado":false},{"etiqueta":"52ª–53ª","nombre":"Reserva y confidencialidad","sub":"B · Lo callo, lo guardo y lo reviso","verbo":"Callo","desc":"Absoluta confidencialidad sobre los reportes y prohibición de alertar al cliente; reportar no viola contratos ni genera responsabilidad y no es indicio fundado de delito.","panel":"2.1.6 · Reserva y confidencialidad","puntos":["Consejeros, Comité, OC, directivos, empleados y apoderados: <b>absoluta confidencialidad<\/b>, salvo autoridad facultada o el intercambio del Cap. XIII (52ª).","Prohibido alertar: I reportes · II requerimientos · III aseguramientos antes de ejecutarse · IV <b>contenido de la LPB<\/b>.","Enviar reportes <b>no viola<\/b> restricciones y no genera responsabilidad; los reportes <b>no son indicios fundados<\/b> de delito (53ª).","Asesores: sólo dos prohibiciones (reportes y requerimientos). ITF: la información <b>no sirve como prueba penal<\/b> hasta recabarse conforme a la ley."],"ir":"#t2-1-6","destacado":false},{"etiqueta":"59ª","nombre":"Conservación de información","sub":"B · Lo callo, lo guardo y lo reviso","verbo":"Guardo","desc":"Documentos de operaciones, expedientes, registros y copias de reportes se guardan al menos 10 años; el expediente, toda la relación y 10 años después. Asesores: 5 años.","panel":"2.1.6 · Conservación de información","puntos":["<b>≥ 10 años<\/b> desde la ejecución de la Operación (59ª).","Expediente del Cliente: <b>toda la relación y 10 años<\/b> desde que termina; datos de Usuarios, 10 años desde su operación.","Copia de los reportes y su soporte; puede ser en medios electrónicos.","<b>5 años<\/b>: información del EBR (21ª-4) e informe de auditoría (60ª).","<b>Asesores: 5 años<\/b> (37ª), no 10."],"ir":"#t2-1-6","destacado":true},{"etiqueta":"60ª","nombre":"Auditoría o revisión anual","sub":"B · Lo callo, lo guardo y lo reviso","verbo":"Reviso","desc":"Auditoría interna o auditor externo independiente dictamina cada año la efectividad del cumplimiento; el informe se remite a la Comisión en 60 días naturales.","panel":"2.1.6 · Auditoría o revisión anual","puntos":["Periodo <b>enero a diciembre<\/b> (o desde que notificó el inicio de operaciones).","Informe a la <b>dirección general y al Comité<\/b>; ningún miembro del Comité participa en la valoración.","Conservar <b>≥ 5 años<\/b>; remitir a la Comisión <b>dentro de 60 días naturales<\/b> tras el cierre del ejercicio.","El auditor que firma, con <b>certificación vigente<\/b> (2024): sólo Bancos e ITF lo exigen.","<b>Asesores no tiene<\/b> revisión anual."],"ir":"#t2-1-6","destacado":false},{"etiqueta":"54ª; 66ª","nombre":"Información a requerimiento de la autoridad","sub":"B · Lo callo, lo guardo y lo reviso","verbo":"Entrego","desc":"Toda la información y documentación que pida la Secretaría por conducto de la Comisión, en copia simple y archivo electrónico, en el plazo que fije la autoridad.","panel":"2.1.6 · Información a requerimiento de la autoridad","puntos":["Información y documentación sobre los reportes, expedientes y cualquier dato del Cliente o Usuario (54ª).","<b>Copia simple<\/b> (certificada si se pide) y archivo electrónico; a la Comisión, <b>en sobre cerrado<\/b>.","<b>Ninguna DCG fija un plazo en días<\/b>: es el que la autoridad establezca.","ITF: sin «sobre cerrado»; por los medios que determine la CNBV (arts. 89 y 93)."],"ir":"#t2-1-6","destacado":false},{"etiqueta":"63ª","nombre":"Comisionistas, agentes y terceros","sub":"C · Hasta dónde llego","verbo":"Delego","desc":"Si opera por comisionistas, la Entidad sigue siendo responsable del expediente como si operara directamente, y debe identificar al comisionista en cada operación.","panel":"2.1.6 · Comisionistas, agentes y terceros","puntos":["Bancos: responsable de recabar y conservar datos y documentos como si operara directamente; <b>identificar al comisionista<\/b> (63ª).","SOCAP, SOFIPO y Fondos: riesgo país de comisionistas <b>extranjeros<\/b>.","Casas de bolsa: regula lo inverso, la CB <b>como comisionista de bancos<\/b>.","Transmisores: <b>Agentes Relacionados<\/b> (49ª–50ª Bis), con aviso a la Comisión.","No lo prevén: SOFOM, Asesores, Uniones, Casas de cambio y Centros cambiarios."],"ir":"#t2-1-6","destacado":false},{"etiqueta":"21ª-1; 69ª-2","nombre":"Nuevos productos y modelos novedosos","sub":"C · Hasta dónde llego","verbo":"Innovo","desc":"Antes de lanzar productos, canales o zonas nuevos, la Entidad evalúa sus riesgos; para un modelo novedoso, presenta esa evaluación con su solicitud de autorización.","panel":"2.1.6 · Nuevos productos y modelos novedosos","puntos":["Evaluar riesgos <b>antes del lanzamiento<\/b> de productos, servicios, tipos de clientes, zonas, canales o transacciones (21ª-1).","Modelo novedoso: presentar el resultado <b>con la solicitud<\/b> y ajustarse a la autorización (69ª-2).","El detalle de modelos novedosos se estudia en 2.1.11."],"ir":"#t2-1-6","destacado":false},{"etiqueta":"58ª","nombre":"Grupo financiero y oficinas en el extranjero","sub":"C · Hasta dónde llego","verbo":"Extiendo","desc":"En la medida de lo posible, aplicar las Disposiciones en oficinas y filiales en el extranjero; si es imposible, informarlo a la Secretaría en no más de 20 días hábiles.","panel":"2.1.6 · Grupo financiero y oficinas en el extranjero","puntos":["Oficinas, sucursales, agencias y <b>filiales en el extranjero<\/b>, «en la medida de lo posible» (58ª).","Si es imposible: informar por escrito a la Secretaría, por conducto de la Comisión, en <b>no más de 20 días hábiles<\/b>.","Grupo: políticas <b>consistentes<\/b> (64ª), EBR e intercambio de grupo (62ª Sexies).","<b>SOCAP y SOFIPO<\/b> no prevén oficinas en el extranjero; Asesores, sin filiales; ITF, todas sus oficinas."],"ir":"#t2-1-6","destacado":false},{"etiqueta":"57ª; 67ª–69ª-1","nombre":"Clave, control y personal","sub":"C · Hasta dónde llego","verbo":"Me registro","desc":"Clave de acceso al sistema de la Comisión al iniciar operaciones, a nombre del OC; canal de avisos al OC y, en algunos sujetos, aviso de quién ejerce el control.","panel":"2.1.6 · Clave, control y personal","puntos":["Clave de acceso: <b>tenerla al iniciar operaciones<\/b>, a nombre del OC (69ª-1).","SOFOM no regulada, Centros y Transmisores: pedirla <b>dentro de 20 días hábiles tras su registro<\/b>.","Selección de personal y <b>canal de avisos<\/b> directo al área del OC (57ª).","Información incompleta o con errores <b>es incumplimiento<\/b> (67ª).","Control: informar quién lo ejerce en <b>10 días hábiles<\/b> (SOFOM, SOCAP, SOFIPO, CC, TD; Centros: 20 tras el registro o 10 tras el aviso); <b>Bancos no lo prevé<\/b>."],"ir":"#t2-1-6","destacado":false}]},{"letra":"2.1.7","titulo":"Intercambio de información","pregunta":"¿Con quién comparto?","ritmo":"¿Con quién?","corto":"2.1.7","color":"oscuro","items":[{"etiqueta":"61ª–62ª","nombre":"Entre entidades del mismo tipo","sub":"Mismo tipo · 3 sujetos","verbo":"Comparto","desc":"Bancos pueden intercambiar información de operaciones y antecedentes sólo para prevenir 139 Quáter, 400 Bis CPF y 52 LIC; la respuesta va en no más de 30 días naturales.","panel":"2.1.7 · Entre entidades del mismo tipo","puntos":["Finalidad <b>única<\/b>: prevenir 139 Quáter, 400 Bis CPF y 52 LIC (62ª).","Lo piden <b>funcionarios autorizados<\/b>, con motivo y clase de información.","Respuesta <b>en no más de 30 días naturales<\/b> desde la solicitud.","Puede compartirse <b>sin solicitud previa<\/b> y por plataforma tecnológica.","Sólo lo prevén <b>Bancos, SOFIPO e ITF<\/b> (SOFIPO e ITF: respuesta por escrito firmado).","62ª Quáter: intercambio <b>obligatorio<\/b> («deberán») de transferencias por plataforma; sólo Bancos."],"ir":"#t2-1-7","destacado":true},{"etiqueta":"62ª Sexies","nombre":"Dentro del grupo financiero","sub":"Grupo · 7 sujetos","verbo":"Convengo","desc":"Las entidades de un grupo financiero pueden intercambiar información con las demás del grupo si celebran un convenio y avisan a la Comisión antes de hacerlo.","panel":"2.1.7 · Dentro del grupo financiero","puntos":["Cualquier tipo de información de operaciones y antecedentes; en Bancos también <b>estadística de reportes<\/b> y circunstancias del dictamen.","Requisitos: <b>convenio<\/b> (confidencialidad y cargos autorizados) y <b>aviso previo a la Comisión<\/b>.","Lo prevén Bancos, SOFOM, Casas de bolsa, Fondos (55-1ª), SOFIPO, Casas de cambio e ITF.","No lo prevén: Asesores, SOCAP, Uniones, Centros cambiarios y Transmisores."],"ir":"#t2-1-7","destacado":false},{"etiqueta":"62ª Bis, Ter, Quinquies, Octies","nombre":"Con entidades extranjeras","sub":"Frontera · 2 sujetos","verbo":"Cruzo","desc":"Sólo Bancos e ITF pueden intercambiar con entidades financieras extranjeras, con convenio y aviso previo; compartir el contenido de la LPB, sólo Bancos.","panel":"2.1.7 · Con entidades extranjeras","puntos":["Bancos: con EF extranjeras por operaciones con USD (62ª Bis: convenio y aviso previo) o con análogas en formato oficial (62ª Ter: convenio, aviso previo y copia del formato a la Secretaría).","62ª Octies: antecedentes de Clientes y estadística de reportes (37ª y 41ª) y del dictamen de OI, con filiales, entidades donde invierte y corresponsales.","62ª Quinquies: <b>contenido de la LPB<\/b> con oficinas, filiales, corresponsales y EF de su grupo: <b>sólo Bancos<\/b>.","ITF (art. 81): sólo con las EF extranjeras que <b>determine la Secretaría<\/b>; sin intercambio de la LPB."],"ir":"#t2-1-7","destacado":false}]},{"letra":"2.1.8","titulo":"Lista de personas bloqueadas","pregunta":"¿A quién bloqueo y qué hago?","ritmo":"¿A quién?","corto":"2.1.8","color":"negro","items":[{"etiqueta":"2ª XXI; 70ª","nombre":"Qué es y mecanismos","sub":"Cap. XV","verbo":"Detecto","desc":"La lista del art. 115 LIC la da la Secretaría a través de la Comisión; la Entidad adopta mecanismos, previstos en su Manual, para detectar clientes, usuarios y terceros.","panel":"2.1.8 · Qué es y mecanismos","puntos":["Lista del <b>art. 115, párrafo noveno, LIC<\/b> (2ª XXI).","La Secretaría la pone a disposición <b>a través de la Comisión<\/b>, con sus actualizaciones (70ª).","Mecanismos para identificar a Clientes o Usuarios, a <b>terceros<\/b> que actúen por ellos y sus operaciones pasadas, actuales o pretendidas; van en el <b>Manual<\/b>.","<b>Sólo Bancos<\/b>: para la LPB no son Usuarios quienes cobran cheques de cuenta corriente ajena ni quienes reciben apoyos gubernamentales.","<b>Capítulo propio<\/b>, no el de identificación. <b>Asesores no tiene LPB<\/b>."],"ir":"#t2-1-8","destacado":true},{"etiqueta":"71ª","nombre":"Supuestos de inclusión","sub":"Siete fracciones","verbo":"Incluyo","desc":"La Secretaría podrá incluir listas de la ONU, de autoridades extranjeras o nacionales, sentenciados, quienes realicen o encubran FT u ORPI y contribuyentes del 69-B CFF.","panel":"2.1.8 · Supuestos de inclusión","puntos":["I listas de la <b>ONU<\/b> (1267 y 1373) · II autoridades extranjeras u organismos que determine la Secretaría · III autoridades nacionales con indicios suficientes.","IV quienes <b>estén compurgando sentencia<\/b> por FT u ORPI · V quienes hayan realizado o realicen actividades de FT u ORPI · VI quienes oculten información sobre recursos ilícitos.","VII contribuyentes del <b>69-B, cuarto párrafo, CFF<\/b> (2022).","SOFOM, CB, SOCAP, Uniones, CC y TD añaden «<b>en proceso<\/b>» (IV) y «<b>pretendan realizar<\/b>» (V).","Es facultad: la Secretaría «<b>podrá<\/b>» incluir."],"ir":"#t2-1-8","destacado":false},{"etiqueta":"72ª I–II","nombre":"Suspensión y reporte de 24 horas","sub":"Mismo flujo en 11 DCG","verbo":"Suspendo","desc":"Si un cliente o usuario aparece en la lista: suspender de inmediato todo acto u operación y remitir en 24 horas un reporte de Operación Inusual con la leyenda de la LPB.","panel":"2.1.8 · Suspensión y reporte de 24 horas","puntos":["I <b>Suspender de manera inmediata<\/b> cualquier acto, operación o servicio.","II Reporte de <b>Operación Inusual<\/b> a la Secretaría, por conducto de la Comisión, <b>dentro de las 24 horas<\/b> desde que conoce la información.","Leyenda «<b>Lista de Personas Bloqueadas<\/b>» en la descripción. No es un reporte autónomo.","El mismo flujo en las 11 DCG que tienen LPB (cambia a quién alcanza; ITF suspende también «actividad»)."],"ir":"#t2-1-8","destacado":true},{"etiqueta":"72ª últ. párr.; 73ª","nombre":"Aviso al cliente y audiencia ante la UIF","sub":"10 · 10 · 10 · 15","verbo":"Aviso","desc":"La Entidad avisa de inmediato al cliente; éste tiene 10 días hábiles de audiencia ante el Titular de la UIF, que resuelve en 10 y notifica en 15 días hábiles.","panel":"2.1.8 · Aviso al cliente y audiencia ante la UIF","puntos":["Aviso <b>inmediato<\/b>, por escrito o medios digitales, con <b>fundamentos y causa<\/b> y que puede acudir a la autoridad en <b>10 días hábiles<\/b>.","Audiencia ante el <b>Titular de la UIF<\/b>: <b>10 días hábiles<\/b> desde que conoce la suspensión, ampliable <b>una sola vez<\/b> por igual lapso, a petición de parte.","Resolución en <b>10 días hábiles<\/b>; notificación por oficio en <b>15 días hábiles<\/b>.","Los 15 días hábiles sólo están en Bancos, Fondos, SOFIPO, Centros e ITF."],"ir":"#t2-1-8","destacado":false},{"etiqueta":"74ª–75ª","nombre":"Salida de la lista y reanudación","sub":"Cinco supuestos","verbo":"Reanudo","desc":"La Secretaría elimina a quien la autoridad retira, al absuelto o que compurgó, por resolución o determinación; la Entidad reanuda de inmediato las operaciones.","panel":"2.1.8 · Salida de la lista y reanudación","puntos":["Eliminación: retiro de las listas o no se actualizan fr. V–VI · absolución o condena compurgada · resolución de la 73ª · determinación judicial o administrativa · <b>69-B párrafo sexto<\/b>.","La Entidad <b>reanuda inmediatamente<\/b> los actos, operaciones o servicios.","75ª: la Secretaría puede autorizar el acceso a ciertos recursos (resolución <b>1452 (2002)<\/b> de la ONU) y obligaciones contraídas con la Entidad."],"ir":"#t2-1-8","destacado":false},{"etiqueta":"38ª XIV; 41ª; 43ª V; 51ª X; 52ª IV","nombre":"La LPB en otros capítulos","sub":"Dónde más aparece","verbo":"Cruzo listas","desc":"La lista reaparece como criterio de inusual, reporte de 24 horas por operaciones previas, función del Comité, alerta del sistema y prohibición de alertar al cliente.","panel":"2.1.8 · La LPB en otros capítulos","puntos":["38ª XIV: criterio de OI · 41ª 2º párrafo: OI en 24 h por operaciones <b>anteriores a la notificación<\/b>, intentos o terceros.","43ª V: el Comité se asegura de que los sistemas contengan la LPB · 51ª X: alertas.","52ª IV: prohibido alertar sobre su contenido · 62ª Quinquies: intercambio (sólo Bancos).","<b>No aparece en el capítulo de identificación<\/b>. Asesores: en ninguno."],"ir":"#t2-1-8","destacado":false}]}],"frase":{"titulo omo «exclusivo de Bancos»."},{"tipo":"tarjetas","id":"t2-1-7","nav":"2.1.7 Intercambio","titulo":"2.1.7 · Intercambio de información","intro":"<b>Cinco puertas: grupo · mismo tipo · extranjeras · transferencias · LPB = 7 · 3 · 2 · 1 · 1 sujetos.<\/b> Intercambiar es facultad («podrán») en todas las modalidades, salvo las transferencias de Bancos (62ª Quáter), el único intercambio obligatorio. <b>Para estudiarlo a fondo, abre el <a href=\"../m2-h3-explorador-217/index.html\">Explorador del intercambio 2.1.7<\/a><\/b>: matriz por sujeto, asistente «¿Puedo compartir esto?», requisitos lado a lado y práctica.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Mismo tipo","subtitulo":"Bancos 61ª–62ª · 3 sujetos","filas":[{"k":"Quién","v":"<b>Bancos, SOFIPO e ITF<\/b>"},{"k":"Para qué","v":"Bancos: 139 Quáter, 400 Bis CPF y 52 LIC · SOFIPO: sólo 139 Quáter y 400 Bis · ITF: 139 Quáter, 400 Bis y delitos contra sus Clientes o la propia ITF"},{"k":"Cómo","v":"Pide un <b>funcionario autorizado<\/b>, con motivo y clase de información · puede compartirse sin solicitud previa"},{"k":"Plazo","v":"Respuesta en <b>no más de 30 días naturales<\/b> desde la solicitud"},{"k":"Sin","v":"Convenio de confidencialidad y cargos ni aviso previo a la Comisión (entre bancos: plataforma y términos que convengan, 62ª VI)"}]},{"encabezado":true,"color":"oscuro","titulo":"Grupo financiero","subtitulo":"Bancos 62ª Sexies · 7 sujetos","filas":[{"k":"Quién","v":"Bancos, SOFOM, Casas de bolsa, Fondos (<b>55-1ª<\/b>), SOFIPO, Casas de cambio e ITF"},{"k":"Requisitos","v":"<b>Convenio<\/b> y <b>aviso previo a la Comisión<\/b>"},{"k":"Qué","v":"Operaciones (Fondos: sólo Clientes; CC: sólo Usuarios; ITF: operaciones, actividades y servicios con Clientes); sólo Bancos añade antecedentes o actividad conocida, estadística de reportes y circunstancias del dictamen"}]},{"encabezado":true,"color":"negro","titulo":"Frontera","subtitulo":"Bancos 62ª Bis, Ter, Octies · 2 sujetos","filas":[{"k":"Quién", ","l":"2.1.6 Otras obligaciones","tema":"2.1.6"},{"k":"i","l":"2.1.7 Intercambio","tema":"2.1.7"},{"k":"l","l":"2.1.8 LPB","tema":"2.1.8"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Cifras y trampas","tipos":["cifra","trampa"]}],"banco":[{"id":"C001","tema":"2.1.6","tipo":"caso","q":"El área de archivo de un banco propone destruir la documentación que acredita una operación de un cliente cuando hayan pasado seis años desde que se ejecutó. ¿Qué periodo mínimo de conservación, contado a partir de la ejecución de la Operación, exige la DCG de Bancos?","a":"No menos de diez años, contados desde la ejecución de la Operación","o":["No menos de siete años, contados desde la ejecución de la Operación","No menos de cinco años, contados desde la ejecución de la Operación","No menos de diez años, contados desde la ejecución de la Operación","No menos de diez años, contados desde la fecha en que se remite a la Comisión el reporte correspondiente"],"x":"La 59ª de Bancos obliga a conservar, por un periodo no menor a diez años contado desde la ejecución de la Operación, la documentación de la operación, los registros históricos y la copia de los reportes con su soporte; el expediente del Cliente se guarda toda la vigencia de la relación y diez años más. Los cinco años son el plazo de otras piezas (metodología de riesgos e informe de auditoría), no el de las operaciones.","ref":"Bancos 59ª I-IV; 21ª-4; 60ª","par":"C002"},{"id":"C002","tema":"2.1.6","tipo":"caso","q":"El área de archivo de un asesor en inversiones propone destruir la documentación que acredita una operación de un cliente cuando hayan pasado seis años desde que se ejecutó. ¿Qué periodo mínimo de conservación, contado a partir de la ejecución de la Operación, exige la DCG de Asesores en inversiones?","a":"No menos de cinco años, contados desde la ejecución de la Operación","o":["No menos de siete años, contados desde la ejecución de la Operación","No menos de diez años, contados desde la fecha en que se remite a la Comisión el reporte correspondiente","No menos de cinco años, contados desde la ejecución de la Operación","No menos de diez años, contados desde la ejecución de la Operación"],"x":"La 37ª de Asesores en inversiones fija un periodo no menor a cinco años desde la ejecución de la Operación, y aplica el mismo plazo al expediente una vez concluida la relación. Es la excepción frente a las demás DCG que regulan operaciones y expedientes (diez años), por lo que con seis años de antigüedad ese asesor ya podría destruirla.","ref":"Asesores en inversiones 37ª","par":"C001"},{"id":"C003","tema":"2.1.6","tipo":"caso","q":"Al cierre del ejercicio, la dirección general de un banco pregunta si debe enviar a la Comisión el informe de la revisión anual de cumplimiento en materia de PLD/FT. ¿Qué dispone la DCG de Bancos?","a":"Debe remitirlo a la Comisión dentro de los sesenta días naturales siguientes al cierre del ejercicio al que corresponda la revisión","o":["Debe remitirlo a la Comisión dentro de los sesenta días naturales siguientes al cierre del ejercicio al que corresponda la revisión","Su DCG no prevé revisión o auditoría anual de cumplimiento ni, por tanto, informe alguno que presentar o remitir","Sólo debe conservarlo cinco años y exhibirlo si la Comisión lo solicita, porque no existe obligación de remitirlo por iniciativa propia","Debe remitirlo a la Comisión dentro de los treinta días hábiles siguientes al cierre del ejercicio al que corresponda la revisión"],"x":"La 60ª de Bancos exige revisión anual (auditoría interna o auditor externo independiente), informe a la dirección general y al Comité, conservación por no menos de cinco años y remisión a la Comisión dentro de los sesenta días naturales siguientes al cierre del ejercicio. Los sesenta días son naturales, no hábiles, y la remisión es obligatoria, no sólo a requerimiento.","ref":"Bancos 60ª","par":"C004"},{"id":"C004","tema":"2.1.6","tipo":"caso","q":"Al cierre del ejercicio, el Representante de un asesor en inversiones persona moral pregunta si debe enviar a la Comisión el informe de la revisión anual de cumplimiento en materia de PLD/FT. ¿Qué dispone la DCG de Asesores en inversiones?","a":"Su DCG no prevé revisión o auditoría anual de cumplimiento ni, por tanto, informe alguno que presentar o remitir","o":["Sólo debe conservarlo cinco años y exhibirlo si la Comisión lo solicita, porque no existe obligación de remitirlo por iniciativa propia","Debe remitirlo a la Comisión dentro de los treinta días hábiles siguientes al cierre del ejercicio al que corresponda la revisión","Su DCG no prevé revisión o auditoría anual de cumplimiento ni, por tanto, informe alguno que presentar o remitir","Debe remitirlo a la Comisión dentro de los sesenta días naturales siguientes al cierre del ejercicio al que corresponda la revisión"],"x":"La DCG de Asesores en inversiones no contiene revisión o auditoría anual de cumplimiento, ni informe ni remisión a la Comisión: es el único sujeto del bloque sin esa obligación. Los sesenta días naturales y la conservación de cinco años pertenecen a la regla de Bancos (60ª) y de los demás sujetos que sí la prevén.","ref":"Asesores en inversiones (sin disposición equivalente a la 60ª de Bancos)","par":"C003"},{"id":"C005","tema":"2.1.6","tipo":"caso","q":"Un banco contrató a un auditor externo independiente para la revisión anual de cumplimiento PLD/FT. ¿Debe el auditor que elabora y firma el informe contar con la certificación de la CNBV prevista en el artículo 4, fracción X, de su ley?","a":"Sí: la disposición exige que el auditor que elabora y firma el informe cuente con la certificación vigente del artículo 4, fracción X, de la Ley de la CNBV","o":["Sí, pero sólo cuando la entidad forma parte de un grupo financiero y debe tomar en cuenta las revisiones de las demás entidades del grupo","No: la disposición no impone ese requisito al auditor que elabora y firma el informe de la revisión anual","Sí, pero sólo cuando la revisión la realiza un auditor externo independiente y no el área de auditoría interna de la entidad, caso en el cual basta con que el responsable sea contador público","Sí: la disposición exige que el auditor que elabora y firma el informe cuente con la certificación vigente del artículo 4, fracción X, de la Ley de la CNBV"],"x":"El último párrafo de la 60ª de Bancos (añadido el 28 de agosto de 2024) exige que quien elabora y firma el informe tenga la certificación vigente, sin distinguir entre auditoría interna y externa ni entre entidades de grupo o no. Sólo Bancos e ITF imponen este requisito.","ref":"Bancos 60ª, último párrafo","par":"C006"},{"id":"C006","tema":"2.1.6","tipo":"caso","q":"Una SOFOM contrató a un auditor externo independiente para la revisión anual de cumplimiento PLD/FT. ¿Debe el auditor que elabora y firma el informe contar con la certificación de la CNBV prevista en el artículo 4, fracción X, de su ley?","a":"No: la disposición no impone ese requisito al auditor que elabora y firma el informe de la revisión anual","o":["Sí, pero sólo cuando la revisión la realiza un auditor externo independiente y no el área de auditoría interna de la entidad, caso en el cual basta con que el responsable sea contador público","Sí: la disposición exige que el auditor que elabora y firma el informe cuente con la certificación vigente del artículo 4, fracción X, de la Ley de la CNBV","Sí, pero sólo cuando la entidad forma parte de un grupo financiero y debe tomar en cuenta las revisiones de las demás entidades del grupo","No: la disposición no impone ese requisito al auditor que elabora y firma el informe de la revisión anual"],"x":"La 52ª de SOFOM regula la revisión anual (primer periodo desde el registro ante la CONDUSEF, informe a la dirección general y al Comité, cinco años de conservación y sesenta días naturales para remitirlo), pero no exige certificación del auditor. Ese requisito es propio de Bancos (60ª) y de las ITF (art. 76).","ref":"SOFOM 52ª; Bancos 60ª","par":"C005"},{"id":"C007","tema":"2.1.6","tipo":"cifra","q":"Se inscribió en el registro del artículo 128 de la Ley General de Sociedades Mercantiles la transmisión de acciones de una SOFOM por más del 2 % de su capital social pagado. ¿En qué plazo debe remitir a la Secretaría, por conducto del Supervisor, la información de esa transmisión?","a":"Dentro de los tres días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","o":["Dentro de los tres días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","Dentro de los diez días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","Dentro de los veinte días hábiles siguientes a la fecha en que los accionistas comuniquen la transmisión al presidente del consejo de administración","Dentro de los diez días hábiles siguientes a la fecha en que los accionistas informen a la administración sobre el control que ejercen en lo individual o en grupo"],"x":"La 53ª de SOFOM fija tres días hábiles contados desde la inscripción en el registro del artículo 128 de la LGSM de la transmisión de acciones por más del 2 % del capital pagado. No debe confundirse con los diez días hábiles que corren para informar quién ejerce el Control y sus cambios, que se cuentan desde que los accionistas lo comunican a la administración.","ref":"SOFOM 53ª","par":"C008"},{"id":"C008","tema":"2.1.6","tipo":"cifra","q":"Se inscribió en el registro del artículo 128 de la Ley General de Sociedades Mercantiles la transmisión de acciones de una casa de cambio por más del 2 % de su capital social pagado. ¿En qué plazo debe remitir a la Secretaría, por conducto de la Comisión, la información de esa transmisión?","a":"Dentro de los diez días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","o":["Dentro de los diez días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","Dentro de los tres días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","Dentro de los diez días hábiles siguientes a la fecha en que los accionistas informen a la administración sobre el control que ejercen en lo individual o en grupo","Dentro de los veinte días hábiles siguientes a la fecha en que los accionistas comuniquen la transmisión al presidente del consejo de administración"],"x":"La 52a de Casas de cambio concede diez días hábiles desde la inscripción de la transmisión de acciones por más del 2 % del capital pagado, frente a los tres días hábiles de SOFOM, Centros cambiarios y Transmisores de dinero. Los diez días son los mismos que corren para informar cambios en quién ejerce el control.","ref":"Casas de cambio 52a; SOFOM 53ª","par":"C007"},{"id":"C009","tema":"2.1.6","tipo":"caso","q":"Un banco está por iniciar operaciones y debe obtener de la Comisión la clave para acceder al sistema electrónico de envío de reportes. ¿Qué establece su DCG sobre el momento de solicitarla y tenerla?","a":"Debe solicitar a la Comisión la clave de acceso al sistema electrónico y contar con ella al momento de iniciar operaciones, actualizada a nombre del Oficial de Cumplimiento","o":["Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los veinte días hábiles posteriores a su registro","Debe solicitar a la Comisión la clave de acceso al sistema electrónico y contar con ella al momento de iniciar operaciones, actualizada a nombre del Oficial de Cumplimiento","Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los diez días hábiles posteriores a que designe a su Oficial de Cumplimiento, y mantenerla a nombre del consejo de administración","Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los quince días hábiles siguientes a la fecha en que inicie operaciones"],"x":"La 69ª-1 de Bancos exige solicitar la clave y contar con ella al momento de iniciar operaciones, y mantenerla actualizada a nombre del Oficial de Cumplimiento (o del interino). El plazo de veinte días hábiles posteriores al registro no es de Bancos: lo tienen Centros cambiarios, Transmisores de dinero y las SOFOM no reguladas.","ref":"Bancos 69ª-1","par":"C010"},{"id":"C010","tema":"2.1.6","tipo":"caso","q":"Un centro cambiario acaba de obtener su registro y debe obtener de la Comisión la clave para acceder al sistema electrónico de envío de reportes. ¿Qué establece su DCG sobre el momento de solicitarla?","a":"Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los veinte días hábiles posteriores a su registro","o":["Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los veinte días hábiles posteriores a su registro","Debe solicitar a la Comisión la clave de acceso al sistema electrónico y contar con ella al momento de iniciar operaciones, actualizada a nombre del Oficial de Cumplimiento","Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los diez días hábiles posteriores a que designe a su Oficial de Cumplimiento, y mantenerla a nombre del consejo de administración","Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los quince días hábiles siguientes a la fecha en que inicie operaciones"],"x":"La 56ª Bis de Centros cambiarios obliga a solicitar la clave dentro de los veinte días hábiles posteriores a su registro, y a mantenerla a nombre del Oficial de Cumplimiento. A diferencia de Bancos (69ª-1), no se exige tenerla al iniciar operaciones; el mismo plazo posterior al registro rige para Transmisores de dinero y SOFOM no reguladas.","ref":"Centros cambiarios 56ª Bis; Bancos 69ª-1","par":"C009"},{"id":"C011","tema":"2.1.6","tipo":"caso","q":"Un banco abrió una sucursal en un país donde la legislación local impide aplicar las Disposiciones de PLD/FT mexicanas, y ya agotó las gestiones para lograrlo. ¿Qué debe hacer según su DCG?","a":"Informar por escrito a la Secretaría, por conducto de la Comisión, en un plazo no mayor a veinte días hábiles posteriores a la conclusión de sus gestiones","o":["Informar por escrito a la Comisión, en un plazo no mayor a diez días hábiles contados desde que la oficina en el extranjero inicie operaciones, acompañando el dictamen del auditor externo independiente","Cerrar la oficina en el extranjero, porque la aplicación de las Disposiciones fuera del país es obligatoria sin excepción","Informar por escrito a la Secretaría, por conducto de la Comisión, en un plazo no mayor a veinte días hábiles posteriores a la conclusión de sus gestiones","Nada específico, porque su DCG no contiene la regla de procurar aplicar las Disposiciones en oficinas en el extranjero ni el aviso por imposibilidad"],"x":"La 58ª de Bancos obliga a procurar, en la medida de lo posible, aplicar las Disposiciones en oficinas, sucursales, agencias y filiales en el extranjero; si es imposible, se informa por escrito a la Secretaría, por conducto de la Comisión, en no más de veinte días hábiles tras concluir las gestiones. No es una prohibición absoluta ni exige cerrar la oficina.","ref":"Bancos 58ª","par":"C012"},{"id":"C012","tema":"2.1.6","tipo":"caso","q":"Una SOCAP abrió una oficina en un país donde la legislación local impide aplicar las Disposiciones de PLD/FT mexicanas, y ya agotó las gestiones para lograrlo. ¿Qué establece su DCG sobre ese supuesto?","a":"Nada específico, porque su DCG no contiene la regla de procurar aplicar las Disposiciones en oficinas en el extranjero ni el aviso por imposibilidad","o":["Nada específico, porque su DCG no contiene la regla de procurar aplicar las Disposiciones en oficinas en el extranjero ni el aviso por imposibilidad","Informar por escrito a la Secretaría, por conducto de la Comisión, en un plazo no mayor a veinte días hábiles posteriores a la conclusión de sus gestiones","Cerrar la oficina en el extranjero, porque la aplicación de las Disposiciones fuera del país es obligatoria sin excepción","Informar por escrito a la Comisión, en un plazo no mayor a diez días hábiles contados desde que la oficina en el extranjero inicie operaciones, acompañando el dictamen del auditor externo independiente"],"x":"La DCG de las SOCAP no trae una disposición equivalente a la 58ª de Bancos: ni la regla de procurar aplicar las Disposiciones en oficinas en el extranjero ni el aviso de veinte días hábiles por imposibilidad. Sólo se refiere a esas oficinas al regular la facultad de supervisión de la Comisión (69ª).","ref":"SOCAP (sin disposición equivalente a la 58ª de Bancos; 69ª); Bancos 58ª","par":"C011"},{"id":"C013","tema":"2.1.6","tipo":"caso","q":"Una SOFIPO contrató a un comisionista que ofrece sus productos desde otro país. ¿Qué dispone su DCG sobre el riesgo del país donde opera ese comisionista?","a":"Debe tomar en cuenta la información disponible sobre el nivel de Riesgo del país donde opere el comisionista, además de ser responsable de los datos de las operaciones","o":["Debe obtener la autorización previa de la Secretaría para contratar a cada comisionista extranjero, comunicarla a la Comisión y verificar cada año el nivel de Riesgo del país con una auditoría externa","Su DCG no contiene una regla sobre Operaciones realizadas a través de comisionistas contratados, por lo que no prevé ponderar el Riesgo del país","Debe informar a la Comisión el nivel de Riesgo del país en un plazo de veinte días hábiles posteriores a la contratación del comisionista","Debe tomar en cuenta la información disponible sobre el nivel de Riesgo del país donde opere el comisionista, además de ser responsable de los datos de las operaciones"],"x":"La 65ª de las SOFIPO hace responsable a la Entidad de recabar, registrar y conservar los datos de las operaciones por comisionistas, la obliga a identificar al comisionista en cada operación y, si es extranjero, a tomar en cuenta el nivel de Riesgo del país. Misma regla en SOCAP (65ª); no hay autorización previa ni aviso con plazo.","ref":"SOFIPO 65ª","par":"C014"},{"id":"C014","tema":"2.1.6","tipo":"caso","q":"Una unión de crédito contrató a un comisionista que ofrece sus productos desde otro país. ¿Qué dispone su DCG sobre el riesgo del país donde opera ese comisionista?","a":"Su DCG no contiene una regla sobre Operaciones realizadas a través de comisionistas contratados, por lo que no prevé ponderar el Riesgo del país","o":["Debe informar a la Comisión el nivel de Riesgo del país en un plazo de veinte días hábiles posteriores a la contratación del comisionista","Debe obtener la autorización previa de la Secretaría para contratar a cada comisionista extranjero, comunicarla a la Comisión y verificar cada año el nivel de Riesgo del país con una auditoría externa","Su DCG no contiene una regla sobre Operaciones realizadas a través de comisionistas contratados, por lo que no prevé ponderar el Riesgo del país","Debe tomar en cuenta la información disponible sobre el nivel de Riesgo del país donde opere el comisionista, además de ser responsable de los datos de las operaciones"],"x":"La DCG de Uniones de crédito no regula las Operaciones a través de comisionistas contratados (su 10ª sólo trata los mandatos y comisiones que la propia Unión realiza), por lo que no contiene la regla de ponderar el Riesgo del país. Esa ponderación existe para SOFIPO, SOCAP y Fondos de inversión.","ref":"Uniones de crédito (sin disposición equivalente); SOFIPO 65ª","par":"C013"},{"id":"C015","tema":"2.1.6","tipo":"caso","q":"Un banco modificó su Manual de Cumplimiento y debe remitir a la Comisión las modificaciones junto con un ejemplar completo. ¿Qué plazo establece su DCG y desde cuándo corre?","a":"Dentro de los veinte días hábiles siguientes a la fecha en que su comité de auditoría las apruebe","o":["Dentro de los veinte días hábiles siguientes a la fecha en que su Representante las elabore","Dentro de los veinte días hábiles siguientes a la fecha en que su comité de auditoría las apruebe","Dentro de los veinte días naturales siguientes a la fecha en que su comité de auditoría las apruebe","Dentro de los treinta días hábiles siguientes a la fecha en que su consejo de administración las apruebe"],"x":"La 64ª de Bancos concede veinte días hábiles contados desde que el comité de auditoría aprueba las modificaciones (43ª I). El plazo es uniforme en todas las DCG; lo que cambia es el punto de partida, que en Bancos es la aprobación del comité de auditoría.","ref":"Bancos 64ª; 43ª I","par":"C016"},{"id":"C016","tema":"2.1.6","tipo":"caso","q":"Un asesor en inversiones persona moral modificó su Manual de Cumplimiento y debe remitir a la Comisión las modificaciones junto con un ejemplar completo. ¿Qué plazo establece su DCG y desde cuándo corre?","a":"Dentro de los veinte días hábiles siguientes a la fecha en que su Representante las elabore","o":["Dentro de los veinte días hábiles siguientes a la fecha en que su comité de auditoría las apruebe","Dentro de los treinta días hábiles siguientes a la fecha en que su consejo de administración las apruebe","Dentro de los veinte días hábiles siguientes a la fecha en que su Representante las elabore","Dentro de los veinte días naturales siguientes a la fecha en que su comité de auditoría las apruebe"],"x":"La 38ª de Asesores en inversiones concede veinte días hábiles contados desde que su Representante elabora las modificaciones (30ª II), porque no hay aprobación de un comité de auditoría. El plazo es el mismo que en Bancos; cambia el hecho que lo inicia.","ref":"Asesores en inversiones 38ª; 30ª II; Bancos 64ª","par":"C015"},{"id":"C017","tema":"2.1.6","tipo":"caso","q":"Un directivo de un banco se entera de que existe una orden de aseguramiento, aún no ejecutada, sobre las cuentas de un cliente y piensa avisarle. ¿Qué establece la DCG de Bancos sobre su deber de reserva?","a":"Está estrictamente prohibido alertar al cliente o a un tercero sobre la existencia o presentación de órdenes de aseguramiento antes de que sean ejecutadas","o":["Su reserva prohíbe sólo alertar sobre los reportes y sobre los requerimientos de información o documentación, sin referirse a órdenes de aseguramiento","Está estrictamente prohibido alertar al cliente o a un tercero sobre la existencia o presentación de órdenes de aseguramiento antes de que sean ejecutadas","Puede avisarle, siempre que lo haga por escrito, con la autorización previa del Comité de Comunicación y Control y dejando constancia de que la orden aún no ha sido ejecutada","Puede avisarle una vez que la Comisión haya recibido el reporte de Operación Inusual correspondiente a ese cliente"],"x":"La 52ª de Bancos prohíbe alertar sobre los reportes (I), sobre los requerimientos (II), sobre órdenes de aseguramiento antes de ejecutarse (III) y sobre el contenido de la LPB (IV). La prohibición III no admite salvedad alguna, ni siquiera con autorización del Comité; las salvedades del primer párrafo (autoridad facultada e intercambio del Capítulo XIII) se refieren a la confidencialidad de los reportes.","ref":"Bancos 52ª III","par":"C018"},{"id":"C018","tema":"2.1.6","tipo":"caso","q":"Un directivo de un asesor en inversiones persona moral se entera de que existe una orden de aseguramiento, aún no ejecutada, sobre las cuentas de un cliente y piensa avisarle. ¿Qué establece la DCG de Asesores en inversiones sobre su deber de reserva?","a":"Su reserva prohíbe sólo alertar sobre los reportes y sobre los requerimientos de información o documentación, sin referirse a órdenes de aseguramiento","o":["Puede avisarle una vez que la Comisión haya recibido el reporte de Operación Inusual correspondiente a ese cliente","Su reserva prohíbe sólo alertar sobre los reportes y sobre los requerimientos de información o documentación, sin referirse a órdenes de aseguramiento","Puede avisarle, siempre que lo haga por escrito, con la autorización previa del Comité de Comunicación y Control y dejando constancia de que la orden aún no ha sido ejecutada","Está estrictamente prohibido alertar al cliente o a un tercero sobre la existencia o presentación de órdenes de aseguramiento antes de que sean ejecutadas"],"x":"La 28ª de Asesores en inversiones sólo contiene dos prohibiciones: alertar sobre los reportes y sobre los requerimientos de información o documentación. A diferencia de Bancos (52ª), no menciona órdenes de aseguramiento ni la LPB, y tampoco trae la salvedad del intercambio de información.","ref":"Asesores en inversiones 28ª; Bancos 52ª","par":"C017"},{"id":"C019","tema":"2.1.6","tipo":"caso","q":"Al diseñar la metodología de evaluación de Riesgos de su banco, el responsable de cumplimiento pregunta si debe establecer indicadores específicos de los delitos de los artículos 400 Bis y 139 Quáter del Código Penal Federal para cada elemento de Riesgo. ¿Qué responde la DCG de Bancos?","a":"Sí: debe establecer indicadores específicos relacionados con el artículo 400 Bis y con el 139 Quáter del Código Penal Federal para cada elemento de Riesgo","o":["No: la Comisión fija esos indicadores y la entidad se limita a aplicarlos sin modificarlos ni complementarlos","No: su DCG no exige indicadores específicos de esos delitos por elemento de Riesgo; bastan los indicadores asociados a cada elemento","Sí: debe establecer indicadores específicos relacionados con el artículo 400 Bis y con el 139 Quáter del Código Penal Federal para cada elemento de Riesgo","Sí, pero sólo del 139 Quáter para cada elemento de Riesgo, pues los indicadores del 400 Bis se evalúan únicamente en el Manual de Cumplimiento y no en la metodología"],"x":"La 21ª-2 de Bancos, con la reforma de agosto de 2024, obliga a establecer indicadores específicos del 400 Bis y del 139 Quáter para cada uno de los elementos de Riesgo (productos y servicios, Clientes y Usuarios, países, transacciones y canales). Es un añadido exclusivo de Bancos.","ref":"Bancos 21ª-2","par":"C020"},{"id":"C020","tema":"2.1.6","tipo":"caso","q":"Al diseñar la metodología de evaluación de Riesgos de su SOFOM, el responsable de cumplimiento pregunta si debe establecer indicadores específicos de los delitos de los artículos 400 Bis y 139 Quáter del Código Penal Federal para cada elemento de Riesgo. ¿Qué responde la DCG de SOFOM?","a":"No: su DCG no exige indicadores específicos de esos delitos por elemento de Riesgo; bastan los indicadores asociados a cada elemento","o":["Sí, pero sólo del 139 Quáter para cada elemento de Riesgo, pues los indicadores del 400 Bis se evalúan únicamente en el Manual de Cumplimiento y no en la metodología","No: su DCG no exige indicadores específicos de esos delitos por elemento de Riesgo; bastan los indicadores asociados a cada elemento","Sí: debe establecer indicadores específicos relacionados con el artículo 400 Bis y con el 139 Quáter del Código Penal Federal para cada elemento de Riesgo","No: la Comisión fija esos indicadores y la entidad se limita a aplicarlos sin modificarlos ni complementarlos"],"x":"La 17ª-2 de SOFOM exige identificar elementos e indicadores asociados y medir su efecto, pero no trae el párrafo de indicadores específicos del 400 Bis y del 139 Quáter por elemento, que sólo está en Bancos (21ª-2, reforma de 2024). La diferencia se aprende como «igual que Bancos, salvo los indicadores específicos de 2024».","ref":"SOFOM 17ª-2; Bancos 21ª-2","par":"C019"},{"id":"C021","tema":"2.1.6","tipo":"trampa","q":"Señala la afirmación sobre la metodología de evaluación de Riesgos de un banco que NO es correcta.","a":"Debe remitirse a la Comisión como documento autónomo, separado del Manual de Cumplimiento y con un plazo propio de envío","o":["Debe remitirse a la Comisión como documento autónomo, separado del Manual de Cumplimiento y con un plazo propio de envío","La información generada con motivo del capítulo debe conservarse por un plazo no menor a cinco años y ponerse a disposición de la Comisión","Su diseño debe estar establecido en el Manual de Cumplimiento o en otro documento o manual elaborado por la propia entidad","La entidad debe evaluar sus Riesgos con antelación al lanzamiento o uso de nuevos productos, servicios, canales de envío o distribución"],"x":"La metodología no tiene envío autónomo ni plazo propio: va en el Manual o en otro documento referido en él (64ª); el Manual se remite a la Comisión y los documentos distintos sólo quedan a su disposición. Las otras tres afirmaciones son texto de la 21ª-1 y la 21ª-4.","ref":"Bancos 21ª-1; 21ª-4; 64ª"},{"id":"C022","tema":"2.1.6","tipo":"caso","q":"Un banco contrata a una persona que trabajará en atención al público. ¿Cuándo debe recibir capacitación en la materia según la DCG de Bancos?","a":"De manera previa o simultánea a su ingreso o al inicio de sus actividades en esa área","o":["Dentro de los seis meses posteriores a su contratación, siempre que el Comité haya aprobado su perfil","En el siguiente curso anual de la entidad, aun cuando ya haya iniciado sus actividades en atención al público","Dentro de los veinte días hábiles siguientes a su ingreso, con constancia de participación y evaluación posterior","De manera previa o simultánea a su ingreso o al inicio de sus actividades en esa área"],"x":"La 50ª de Bancos exige que quienes vayan a laborar en áreas de atención al público o de administración de recursos reciban la capacitación antes o al mismo tiempo que su ingreso o inicio de actividades. El curso anual de la 49ª no sustituye esa capacitación inicial.","ref":"Bancos 50ª, segundo párrafo; 49ª"},{"id":"C023","tema":"2.1.6","tipo":"caso","q":"Una empleada de un banco duda en enviar un reporte a la Secretaría porque su contrato le impone confidencialidad sobre la información de los clientes. ¿Qué dispone la DCG de Bancos?","a":"El envío de reportes no constituye violación a restricciones de revelación impuestas por vía contractual o por disposición legal, ni implica responsabilidad","o":["Puede enviarlo, pero responde por la restricción contractual si la Comisión considera que el reporte es un indicio fundado de delito","Debe obtener la aprobación del Comité y notificar al cliente una vez enviado, para dejar constancia de la excepción a la confidencialidad pactada en el contrato","El envío de reportes no constituye violación a restricciones de revelación impuestas por vía contractual o por disposición legal, ni implica responsabilidad","Debe recabar antes la autorización por escrito del cliente, pues la confidencialidad contractual sólo cede ante él"],"x":"La 53ª de Bancos protege el envío de reportes frente a restricciones contractuales o legales de revelación y excluye responsabilidad; además, los reportes no se consideran indicios fundados de la comisión de un delito. No requiere consentimiento del cliente ni aviso posterior.","ref":"Bancos 53ª"},{"id":"C024","tema":"2.1.6","tipo":"caso","q":"La Comisión requiere a un banco copia del expediente de identificación de un cliente. ¿Cómo debe presentar la documentación según la DCG de Bancos?","a":"Directamente en la unidad administrativa de la Comisión que se designe, contenida en sobre cerrado","o":["Por correo electrónico al buzón que designe el Oficial de Cumplimiento, sin sobre, para agilizar la revisión de la autoridad","Directamente en la unidad administrativa de la Comisión que se designe, contenida en sobre cerrado","En copia simple y sin archivos electrónicos, porque los archivos en medios electrónicos sólo se entregan a la Secretaría","En original certificado ante notario en todos los casos, ya que la copia simple sólo se admite para los reportes de Operaciones Inusuales"],"x":"La 54ª de Bancos ordena entregar a la Comisión la información directamente en la unidad que se designe y en sobre cerrado, en copia simple (certificada si se solicita) y en archivos electrónicos susceptibles de mostrarse con la aplicación que señale la Secretaría. La DCG no fija un número de días: el plazo lo establece la Comisión.","ref":"Bancos 54ª"},{"id":"C025","tema":"2.1.6","tipo":"cifra","q":"Un banco obtuvo los resultados de la implementación de su metodología de evaluación de Riesgos. Aunque no surjan nuevos riesgos ni se actualice la evaluación nacional de riesgos, ¿en qué plazo máximo debe revisar y actualizar la metodología?","a":"En un plazo no mayor a doce meses a partir de que cuente con los resultados de su implementación","o":["En un plazo no mayor a cinco años, que es el periodo en que debe conservar la información generada","En un plazo no mayor a veinticuatro meses a partir de que cuente con los resultados de su implementación","En un plazo no mayor a doce meses a partir de que cuente con los resultados de su implementación","En un plazo no mayor a seis meses a partir de que la Comisión apruebe el Manual de Cumplimiento"],"x":"La 21ª-4 de Bancos exige revisar y actualizar ante nuevos Riesgos, al actualizarse la evaluación nacional o a más tardar doce meses después de contar con los resultados; consta por escrito y queda a disposición de la Secretaría y la Comisión. Los cinco años son el plazo de conservación, no de revisión.","ref":"Bancos 21ª-4"},{"id":"C026","tema":"2.1.6","tipo":"trampa","q":"Respecto de la conservación de información en un banco, señala la afirmación que NO es correcta.","a":"Toda la información que conserva por PLD/FT, incluidos la generada con la metodología de riesgos y el informe de la revisión anual, se guarda diez años","o":["La información generada con motivo de la metodología de evaluación de Riesgos se conserva por un plazo no menor a cinco años","El informe de la revisión anual de cumplimiento se conserva por un plazo no menor a cinco años, además de remitirse a la Comisión","La documentación de las operaciones y los registros históricos se conservan por un periodo no menor a diez años contado desde la ejecución de la Operación","Toda la información que conserva por PLD/FT, incluidos la generada con la metodología de riesgos y el informe de la revisión anual, se guarda diez años"],"x":"No existe un plazo único de diez años: operaciones, expedientes, registros y copias de reportes se guardan diez años (59ª), pero el informe de auditoría (60ª) y la información de la metodología de riesgos (21ª-4) se conservan cinco años. Confundirlos es la trampa de «diez años para todos».","ref":"Bancos 59ª; 60ª; 21ª-4"},{"id":"C027","tema":"2.1.6","tipo":"caso","q":"Un asesor en inversiones que actúa como persona física pregunta cómo cumple la obligación de capacitación en PLD/FT. ¿Qué dispone su DCG?","a":"Debe tomar él mismo, al menos, un curso de capacitación anual que contenga lo señalado en la disposición","o":["Debe tomar él mismo, al menos, un curso de capacitación anual que contenga lo señalado en la disposición","Debe designar a un Representante que tome el curso por él y expida la constancia de participación","Debe tomar un curso cada seis meses, con evaluación y constancia emitidas por la Comisión","Queda exento, porque la obligación de capacitación sólo alcanza a los asesores en inversiones personas morales"],"x":"La 25ª de Asesores en inversiones dirige los programas a las personas morales y, para las personas físicas, ordena que tomen al menos un curso de capacitación anual. El Representante sólo existe en las personas morales (30ª).","ref":"Asesores en inversiones 25ª, último párrafo"},{"id":"C028","tema":"2.1.6","tipo":"caso","q":"Un banco realiza operaciones a través de comisionistas contratados conforme al artículo 46 Bis-1 de la Ley de Instituciones de Crédito. ¿Qué obligación tiene el banco respecto de los datos y documentos de esas operaciones?","a":"Es responsable de recabar, registrar y conservar los datos y documentos como si operara directamente, e identificar al comisionista que tramitó cada Operación","o":["Es responsable de recabar, registrar y conservar los datos y documentos como si operara direc
