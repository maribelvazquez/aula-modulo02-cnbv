tamente, e identificar al comisionista que tramitó cada Operación","Debe recabar un expediente simplificado, porque se presume que el comisionista validó la identidad de cada cliente y conserva la documentación que lo acredita","Sólo debe conservar los datos del propio comisionista, porque el expediente de los clientes atendidos lo integra y guarda éste","La responsabilidad de recabar y conservar los datos se traslada al comisionista, que debe identificar al banco en cada Operación realizada, quedando éste como mero receptor"],"x":"La 63ª de Bancos mantiene la responsabilidad en la Entidad: los detalles y características de lo que recaba deben ser los mismos que si operara directamente, y por cada Operación debe identificar al comisionista. No se traslada la obligación al comisionista.","ref":"Bancos 63ª"},{"id":"C029","tema":"2.1.6","tipo":"caso","q":"Un transmisor de dinero opera a través de Agentes Relacionados y Personas Jurídicas Coadyuvantes. ¿Qué debe remitir a la Comisión respecto de ellos según su DCG?","a":"Un aviso con la información de los Agentes Relacionados, Personas Jurídicas Coadyuvantes y demás entes con los que tenga relación contractual, en los plazos que la Comisión establezca","o":["El expediente de identificación de cada usuario atendido por sus agentes, dentro de los veinte días hábiles posteriores a cada operación","Un aviso con la información de los Agentes Relacionados, Personas Jurídicas Coadyuvantes y demás entes con los que tenga relación contractual, en los plazos que la Comisión establezca","Una constancia anual de capacitación de cada agente, firmada por el Oficial de Cumplimiento del propio transmisor","Nada, porque la responsabilidad de esas operaciones recae exclusivamente en los agentes y no en el transmisor"],"x":"La 50ª Bis de Transmisores de dinero ordena remitir a la Comisión un aviso con la información de los Agentes Relacionados, Personas Jurídicas Coadyuvantes, otros transmisores y entidades financieras con relación contractual, y de los terceros con que operen. El transmisor sigue siendo responsable del cumplimiento (50ª) y debe verificar su honorabilidad (49ª).","ref":"Transmisores de dinero 49ª; 50ª; 50ª Bis"},{"id":"C030","tema":"2.1.6","tipo":"caso","q":"Una casa de bolsa ofrece productos de una institución de crédito en su carácter de comisionista de ésta. ¿Quién recaba los datos del expediente de identificación de esos clientes y quién lo conserva según la DCG de Casas de bolsa?","a":"La casa de bolsa recaba y registra los datos y documentos y conserva el expediente en lugar del banco, manteniéndolo a disposición de éste, de la Secretaría y de la Comisión","o":["La casa de bolsa recaba y registra los datos y documentos y conserva el expediente en lugar del banco, manteniéndolo a disposición de éste, de la Secretaría y de la Comisión","El banco recaba los datos y conserva el expediente; la casa de bolsa sólo identifica al cliente y envía los documentos","Ambas conservan una copia completa del expediente, la casa de bolsa por diez años y el banco por cinco años","La casa de bolsa integra el expediente, pero debe entregarlo al banco en cinco días hábiles y éste lo conserva"],"x":"La 62ª de Casas de bolsa regula el supuesto inverso al de Bancos: cuando actúa como comisionista de instituciones de crédito, recaba y registra los datos y conserva el expediente en lugar del banco, con la salvedad de que debe estar siempre a disposición del banco, la Secretaría o la Comisión. En Bancos, en cambio, la 63ª regula a los comisionistas que contrata el banco y lo hace responsable de los datos.","ref":"Casas de bolsa 62ª; Bancos 63ª"},{"id":"C031","tema":"2.1.6","tipo":"caso","q":"Un banco planea lanzar un nuevo canal de distribución digital para sus productos. ¿Cuándo debe evaluar los Riesgos asociados según su DCG?","a":"Con antelación al lanzamiento o uso del nuevo canal de envío o distribución","o":["Dentro de los doce meses posteriores al lanzamiento, junto con la revisión periódica de la metodología de Riesgos","Dentro de los veinte días hábiles siguientes al lanzamiento, dando aviso a la Comisión del resultado obtenido","Cuando la Comisión lo requiera en su siguiente visita de inspección, mediante el programa de supervisión anual","Con antelación al lanzamiento o uso del nuevo canal de envío o distribución"],"x":"La 21ª-1 de Bancos exige llevar a cabo la evaluación de Riesgos con antelación al lanzamiento o uso de nuevos productos, servicios, tipos de Clientes o Usuarios, países o áreas geográficas, canales y transacciones. Los doce meses son el plazo de revisión de la metodología, no el de evaluación previa.","ref":"Bancos 21ª-1, último párrafo"},{"id":"C032","tema":"2.1.6","tipo":"caso","q":"Una ITF quiere encomendar la revisión anual de cumplimiento a una persona ajena a su estructura. ¿Quién puede realizarla conforme a su DCG?","a":"El área de auditoría interna o un tercero independiente, con un responsable que suscriba la revisión y cuente con la certificación del artículo 4, fracción X, de la Ley de la CNBV","o":["El Comité de Comunicación y Control, por ser el órgano responsable de dictaminar la efectividad de las medidas de control","El Oficial de Cumplimiento, siempre que informe sus resultados al administrador único dentro de los veinte días hábiles","Sólo un auditor externo independiente, porque el área de auditoría interna no puede evaluar la efectividad del cumplimiento","El área de auditoría interna o un tercero independiente, con un responsable que suscriba la revisión y cuente con la certificación del artículo 4, fracción X, de la Ley de la CNBV"],"x":"El artículo 76 de la DCG de ITF admite auditoría interna o un «tercero independiente», exige que quien suscriba la revisión tenga la certificación del artículo 4, fracción X, de la LCNBV y que el informe se presente al administrador único o a la dirección general y, en su caso, al Comité. En él no participa ningún miembro del Comité.","ref":"ITF art. 76"},{"id":"C033","tema":"2.1.7","tipo":"caso","q":"Un banco recibe de otro banco una solicitud de antecedentes de un cliente para fortalecer la prevención de los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé la DCG de Bancos?","a":"Pueden intercambiarla; la respuesta la remiten funcionarios autorizados en un plazo que no debe exceder de 30 días naturales contados desde la solicitud","o":["Pueden intercambiarla sólo con convenio previo sobre confidencialidad y cargos y aviso previo a la Comisión, y la respuesta debe remitirse en un plazo de 30 días hábiles","Pueden intercambiarla únicamente a través de la Secretaría, que recaba la información y la entrega a la entidad que la solicitó","Pueden intercambiarla; la respuesta la remiten funcionarios autorizados en un plazo que no debe exceder de 30 días naturales contados desde la solicitud","Su DCG no contiene capítulo ni disposición que regule el intercambio de información entre entidades del mismo tipo"],"x":"La 62ª de Bancos permite el intercambio entre dos o más Entidades, pedido por funcionarios autorizados con motivo y clase de información, y respondido en no más de 30 días naturales. Entre entidades del mismo tipo no se exige convenio ni aviso previo; esos requisitos son de grupo financiero y de entidades extranjeras.","ref":"Bancos 62ª I-III","par":"C034"},{"id":"C034","tema":"2.1.7","tipo":"caso","q":"Una SOCAP recibe de otra SOCAP una solicitud de antecedentes de un cliente para fortalecer la prevención de los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé la DCG de las SOCAP?","a":"Su DCG no contiene capítulo ni disposición que regule el intercambio de información entre entidades del mismo tipo","o":["Pueden intercambiarla sólo con convenio previo sobre confidencialidad y cargos y aviso previo a la Comisión, y la respuesta debe remitirse en un plazo de 30 días hábiles","Su DCG no contiene capítulo ni disposición que regule el intercambio de información entre entidades del mismo tipo","Pueden intercambiarla únicamente a través de la Secretaría, que recaba la información y la entrega a la entidad que la solicitó","Pueden intercambiarla; la respuesta la remiten funcionarios autorizados en un plazo que no debe exceder de 30 días naturales contados desde la solicitud"],"x":"La DCG de las SOCAP no tiene capítulo ni disposición de intercambio de información de PLD/FT (tampoco dentro de grupo ni con extranjeras). Los 30 días naturales de respuesta existen sólo en Bancos (62ª), SOFIPO (64ª) e ITF (art. 78).","ref":"SOCAP (sin disposición de intercambio); Bancos 62ª","par":"C033"},{"id":"C035","tema":"2.1.7","tipo":"caso","q":"Dos bancos acuerdan intercambiar información de un cliente para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Cómo se lleva a cabo el intercambio según la DCG de Bancos?","a":"Se realiza mediante la plataforma tecnológica que las propias entidades establezcan, conforme a términos que aseguren la confidencialidad de la información","o":["Se realiza en el formato oficial que emita la Secretaría y a través de los medios que ésta señale, con copia a la Comisión antes de que se efectúe el intercambio","Se realiza mediante escrito firmado por los funcionarios autorizados, sin que su DCG prevea una plataforma tecnológica","Se realiza por oficio de la Comisión, que recaba la información de la entidad requerida y la entrega a la solicitante","Se realiza mediante la plataforma tecnológica que las propias entidades establezcan, conforme a términos que aseguren la confidencialidad de la información"],"x":"La 62ª VI de Bancos dispone que el intercambio se realiza mediante la plataforma tecnológica que establezcan las Entidades, siempre que se asegure la confidencialidad. La solicitud y la respuesta pueden remitirse de forma electrónica o digital, y también puede compartirse información sin solicitud previa.","ref":"Bancos 62ª II, III, V, VI","par":"C036"},{"id":"C036","tema":"2.1.7","tipo":"caso","q":"Dos SOFIPO acuerdan intercambiar información de un cliente para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Cómo se lleva a cabo el intercambio según la DCG de las SOFIPO?","a":"Se realiza mediante escrito firmado por los funcionarios autorizados, sin que su DCG prevea una plataforma tecnológica","o":["Se realiza por oficio de la Comisión, que recaba la información de la entidad requerida y la entrega a la solicitante","Se realiza en el formato oficial que emita la Secretaría y a través de los medios que ésta señale, con copia a la Comisión antes de que se efectúe el intercambio","Se realiza mediante la plataforma tecnológica que las propias entidades establezcan, sin que la solicitud deba constar por escrito ni la respuesta deba ir firmada","Se realiza mediante escrito firmado por los funcionarios autorizados, sin que su DCG prevea una plataforma tecnológica"],"x":"La 64ª de las SOFIPO conserva el núcleo de Bancos (funcionarios autorizados, 30 días naturales), pero la solicitud se hace mediante escrito y la respuesta por escrito firmado por funcionarios autorizados. No prevé plataforma tecnológica, estadística de reportes ni intercambio obligatorio de transferencias.","ref":"SOFIPO 64ª II-III; Bancos 62ª VI","par":"C035"},{"id":"C037","tema":"2.1.7","tipo":"caso","q":"Una casa de bolsa y otra entidad financiera del mismo grupo financiero quieren compartir información de las operaciones de sus clientes para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé la DCG de Casas de bolsa?","a":"Pueden intercambiarla si celebran un convenio sobre el tratamiento confidencial y los cargos de los funcionarios autorizados, e informan a la Comisión antes de que se realice","o":["Pueden intercambiarla sin necesidad de convenio, bastando que informen a la Comisión, en el formato oficial, dentro de los 30 días naturales siguientes al intercambio","Su DCG no contiene disposición que regule el intercambio de información dentro de un grupo financiero","Pueden intercambiarla si celebran un convenio sobre el tratamiento confidencial y los cargos de los funcionarios autorizados, e informan a la Comisión antes de que se realice","Pueden intercambiarla únicamente mediante solicitud por escrito firmado, con respuesta en un plazo de 30 días naturales"],"x":"La 61ª-1 de Casas de bolsa permite el intercambio dentro del grupo financiero de información sobre las Operaciones con Clientes y Usuarios, siempre que celebren un convenio (confidencialidad y cargos) y informen a la Comisión antes del intercambio, conservando el soporte. A diferencia de Bancos, no incluye estadística de reportes.","ref":"Casas de bolsa 61ª-1; Bancos 62ª Sexies","par":"C038"},{"id":"C038","tema":"2.1.7","tipo":"caso","q":"Una unión de crédito y otra entidad financiera del mismo grupo financiero quieren compartir información de las operaciones de sus clientes para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé la DCG de Uniones de crédito?","a":"Su DCG no contiene disposición que regule el intercambio de información dentro de un grupo financiero","o":["Su DCG no contiene disposición que regule el intercambio de información dentro de un grupo financiero","Pueden intercambiarla si celebran un convenio sobre el tratamiento confidencial y los cargos de los funcionarios autorizados, e informan a la Comisión antes de que se realice","Pueden intercambiarla únicamente mediante solicitud por escrito firmado, con respuesta en un plazo de 30 días naturales","Pueden intercambiarla sin necesidad de convenio, bastando que informen a la Comisión, en el formato oficial, dentro de los 30 días naturales siguientes al intercambio"],"x":"La DCG de Uniones de crédito no regula el intercambio de información, ni entre entidades del mismo tipo ni dentro del grupo ni con extranjeras. El convenio con aviso previo a la Comisión existe en Bancos, SOFOM, Casas de bolsa, Fondos, SOFIPO, Casas de cambio e ITF.","ref":"Uniones de crédito (sin disposición de intercambio); Casas de bolsa 61ª-1","par":"C037"},{"id":"C039","tema":"2.1.7","tipo":"caso","q":"Un banco desea compartir el contenido de la Lista de Personas Bloqueadas con un corresponsal en el extranjero para fortalecer la prevención de operaciones ilícitas. ¿Qué prevé la DCG de Bancos?","a":"Puede hacerlo, estableciendo en su Manual de Cumplimiento, o en otro documento, las medidas que garanticen el tratamiento confidencial del contenido de la lista","o":["No puede hacerlo, porque la reserva prohíbe alertar sobre el contenido de la Lista de Personas Bloqueadas sin admitir excepción alguna","Sólo puede compartirla con entidades financieras de su mismo grupo financiero que estén facultadas para ello, nunca con entidades, filiales o corresponsales del exterior","Su DCG no contiene disposición que autorice compartir el contenido de la Lista de Personas Bloqueadas con entidades del exterior","Puede hacerlo, estableciendo en su Manual de Cumplimiento, o en otro documento, las medidas que garanticen el tratamiento confidencial del contenido de la lista"],"x":"La 62ª Quinquies de Bancos permite intercambiar el contenido de la LPB con oficinas de representación, filiales del exterior, entidades del exterior donde invierte, corresponsales y entidades de su grupo financiero, bajo medidas de confidencialidad previstas en el Manual. La 52ª IV exceptúa expresamente ese intercambio de la prohibición de alertar.","ref":"Bancos 62ª Quinquies; 52ª IV","par":"C040"},{"id":"C040","tema":"2.1.7","tipo":"caso","q":"Una SOFOM desea compartir el contenido de la Lista de Personas Bloqueadas con un corresponsal en el extranjero para fortalecer la prevención de operaciones ilícitas. ¿Qué prevé la DCG de SOFOM?","a":"Su DCG no contiene disposición que autorice compartir el contenido de la Lista de Personas Bloqueadas con entidades del exterior","o":["Puede hacerlo, estableciendo en su Manual de Cumplimiento, o en otro documento, las medidas que garanticen el tratamiento confidencial del contenido de la lista","Sólo puede compartirla con entidades financieras de su mismo grupo financiero que estén facultadas para ello, nunca con entidades, filiales o corresponsales del exterior","Su DCG no contiene disposición que autorice compartir el contenido de la Lista de Personas Bloqueadas con entidades del exterior","No puede hacerlo, porque la reserva prohíbe alertar sobre el contenido de la Lista de Personas Bloqueadas sin admitir excepción alguna"],"x":"La DCG de SOFOM no tiene una disposición equivalente a la 62ª Quinquies de Bancos: sólo admite el intercambio dentro del grupo financiero (52ª-1) y no regula el intercambio con entidades extranjeras ni la LPB. Compartir el contenido de la lista es exclusivo de Bancos.","ref":"SOFOM (sin disposición equivalente); Bancos 62ª Quinquies","par":"C039"},{"id":"C041","tema":"2.1.7","tipo":"caso","q":"Un banco recibe de otro banco una solicitud de información sobre un cliente, motivada por una disputa comercial entre ambos. ¿Puede responderla con base en el capítulo de intercambio de información de su DCG?","a":"No: el intercambio debe limitarse única y exclusivamente a fortalecer la prevención y detección de los supuestos de los artículos 139 Quáter y 400 Bis del Código Penal Federal y 52 de la Ley","o":["Sí, siempre que la solicite un funcionario autorizado y el banco obtenga el consentimiento del cliente antes de responder","No: el intercambio debe limitarse única y exclusivamente a fortalecer la prevención y detección de los supuestos de los artículos 139 Quáter y 400 Bis del Código Penal Federal y 52 de la Ley","Sí, si la respuesta se remite dentro de los 30 días naturales siguientes a la solicitud, sin importar el motivo que la origine","Sí, previo convenio con el banco solicitante y aviso a la Comisión en el formato oficial que ésta expida"],"x":"La 62ª de Bancos limita el intercambio a los casos cuya finalidad sea fortalecer las medidas para prevenir y detectar operaciones que pudieran actualizar el 139 Quáter o el 400 Bis del CPF y el 52 de la LIC. No basta con que la solicite un funcionario autorizado ni con respetar el plazo.","ref":"Bancos 62ª, primer párrafo"},{"id":"C042","tema":"2.1.7","tipo":"cifra","q":"Un banco recibió de otra entidad una solicitud de información de un cliente por motivos de prevención de operaciones ilícitas. ¿Qué plazo máximo tiene para responder según la DCG de Bancos?","a":"Un plazo que no debe exceder de 30 días naturales, contados a partir de la fecha en que se hubiere solicitado la información","o":["Un plazo que no debe exceder de 15 días hábiles, contados a partir de la fecha en que se hubiere solicitado la información","Un plazo que no debe exceder de 30 días naturales, contados a partir de la fecha en que se hubiere solicitado la información","Un plazo que no debe exceder del día hábil bancario siguiente, por tratarse de un intercambio mediante plataforma tecnológica","Un plazo que no debe exceder de 30 días hábiles, contados a partir de la fecha en que se hubiere recibido la información"],"x":"La 62ª III de Bancos fija que la respuesta se remita en un plazo que no exceda de 30 días naturales contados desde la solicitud. La trampa habitual es leerlos como hábiles; los plazos de día hábil bancario pertenecen a otro intercambio (el obligatorio de transferencias, 62ª Quáter).","ref":"Bancos 62ª III"},{"id":"C043","tema":"2.1.7","tipo":"trampa","q":"¿En cuál de estos intercambios de información de un banco NO se exige convenio ni aviso previo a la Comisión?","a":"Con otra entidad del mismo tipo, conforme al intercambio general del capítulo, que no exige convenio ni aviso previo","o":["Con entidades financieras que formen parte de su mismo grupo financiero, mediante un convenio sobre confidencialidad y cargos y aviso previo a la Comisión","Con otra entidad del mismo tipo, conforme al intercambio general del capítulo, que no exige convenio ni aviso previo","Con entidades financieras extranjeras por una operación en dólares entre ambas, con convenio sobre confidencialidad y cargos y aviso previo a la Comisión","Con instituciones financieras del exterior que sean sus filiales, con convenio sobre confidencialidad y cargos y aviso previo a la Comisión"],"x":"Entre entidades del mismo tipo la 62ª sólo exige funcionarios autorizados, motivo y clase de información y plazo de respuesta. El convenio con aviso previo a la Comisión se exige dentro de grupo (62ª Sexies) y con extranjeras (62ª Bis, Ter y Octies).","ref":"Bancos 62ª; 62ª Bis; 62ª Sexies; 62ª Octies"},{"id":"C044","tema":"2.1.7","tipo":"caso","q":"Un banco intercambia información de clientes y operaciones con una entidad financiera extranjera análoga, en el formato oficial de la Secretaría. Además del convenio y del aviso previo a la Comisión, ¿qué debe hacer?","a":"Enviar a la Secretaría, a través de la Comisión, copia del formato con la información intercambiada, de forma previa o simultánea al intercambio","o":["Enviar a la Comisión copia del formato dentro de los treinta días naturales siguientes al intercambio de la información","Enviar a la Secretaría, a través de la Comisión, copia del formato con la información intercambiada, de forma previa o simultánea al intercambio","Publicar el convenio en su Manual de Cumplimiento y notificar el contenido del formato al Comité de Comunicación y Control","Obtener la autorización expresa de la Secretaría para cada intercambio, previa opinión de la Comisión y del Comité"],"x":"La 62ª Ter exige, con entidades financieras extranjeras análogas, convenio sobre confidencialidad y cargos, aviso previo a la Comisión y copia del formato a la Secretaría, por conducto de la Comisión, antes o al mismo tiempo que el intercambio, y que derive de una Operación entre ellas. Sin esa copia a la Secretaría el intercambio no cumple la 62ª Ter, aunque exista convenio y aviso previo.","ref":"Bancos 62ª Ter"},{"id":"C045","tema":"2.1.7","tipo":"cifra","q":"Un banco envió una transferencia internacional de fondos y debe cumplir el intercambio obligatorio de transferencias previsto en su DCG. ¿Cuándo debe cargar la información de esa transferencia en la plataforma autorizada?","a":"Al cierre de operación de la plataforma del mismo día hábil al de su envío o recepción","o":["Dentro de las veinticuatro horas siguientes a que la Secretaría le requiera la información de esa transferencia","A más tardar el día hábil bancario siguiente a aquel en que envió o recibió la transferencia en cuestión","Dentro de los diez días hábiles siguientes al cierre del mes en que se envió o recibió la transferencia","Al cierre de operación de la plataforma del mismo día hábil al de su envío o recepción"],"x":"La 62ª Quáter IV de Bancos obliga («deberán») a cargar la información de las transferencias al cierre de operación de la plataforma del mismo día hábil. El día hábil bancario siguiente es el plazo para cargar la documentación de los clientes, y las consultas de Usuarios sólo proceden durante los dos días hábiles bancarios siguientes a la transferencia.","ref":"Bancos 62ª Quáter IV, V, X"},{"id":"C046","tema":"2.1.7","tipo":"caso","q":"Un banco quiere compartir con su filial en el exterior estadística de reportes de Operaciones Inusuales y las circunstancias que consideró al dictaminar una de ellas. ¿Qué exige su DCG?","a":"Convenio con la filial sobre confidencialidad y cargos de los funcionarios, aviso previo a la Comisión, medios electrónicos y formato oficial que emita la Secretaría","o":["Sólo aviso a la Comisión dentro de los treinta días naturales posteriores a compartirla, sin necesidad de convenio con la filial","Convenio con la filial sobre confidencialidad y cargos de los funcionarios, aviso previo a la Comisión, medios electrónicos y formato oficial que emita la Secretaría","Autorización de la Unidad de Inteligencia Financiera para cada envío, solicitada por conducto del Oficial de Cumplimiento","Nada: esa estadística únicamente puede compartirse dentro del grupo financiero y nunca con entidades del exterior"],"x":"La 62ª Octies permite intercambiar antecedentes de Clientes y Usuarios y estadística de reportes y dictámenes de OI con filiales del exterior, entidades del exterior donde invierte y corresponsales, con convenio, aviso previo a la Comisión, medios electrónicos y formato oficial de la Secretaría. La estadística de reportes y dictámenes es exclusiva del intercambio de Bancos.","ref":"Bancos 62ª Octies"},{"id":"C047","tema":"2.1.7","tipo":"caso","q":"Una ITF quiere intercambiar información de sus Clientes con una entidad financiera extranjera. ¿Con cuáles puede hacerlo según su DCG?","a":"Únicamente con las entidades financieras extranjeras que determine la Secretaría, con convenio y aviso previo a la CNBV","o":["Con cualquier entidad financiera extranjera que sea filial de la ITF, sin necesidad de convenio ni de aviso previo","Únicamente con las entidades financieras extranjeras que determine la Secretaría, con convenio y aviso previo a la CNBV","Con ninguna: las ITF sólo pueden intercambiar información con otras ITF y con entidades financieras nacionales","Con cualquier entidad financiera extranjera con la que mantenga una relación de corresponsalía, con aviso previo a la CNBV"],"x":"El artículo 81 de la DCG de ITF limita el intercambio con entidades financieras extranjeras a las que determine la Secretaría, con convenio, aviso previo a la CNBV, copia del formato a la Secretaría y derivado de una Operación. No prevé el intercambio de la LPB, exclusivo de Bancos.","ref":"ITF art. 81"},{"id":"C048","tema":"2.1.7","tipo":"trampa","q":"¿Cuál de los siguientes sujetos NO tiene en su DCG ninguna disposición de intercambio de información de PLD/FT, ni entre entidades del mismo tipo ni dentro de un grupo financiero?","a":"Transmisores de dinero","o":["Transmisores de dinero","SOFOM, que prevén el intercambio dentro de un grupo financiero con convenio y aviso previo a la Comisión","Fondos de inversión, que prevén el intercambio dentro de un grupo financiero con convenio y aviso previo a la Comisión","Casas de cambio, que prevén el intercambio dentro de un grupo financiero con convenio y aviso previo a la Comisión"],"x":"Asesores en inversiones, SOCAP, Uniones de crédito, Centros cambiarios y Transmisores de dinero no regulan el intercambio de información de PLD/FT. Casas de cambio (51ª-1), SOFOM (52ª-1) y Fondos (55-1ª) lo prevén sólo dentro del grupo financiero. No es verdad que todos los sujetos puedan intercambiar información.","ref":"Transmisores de dinero (sin disposición); Casas de cambio 51ª-1; SOFOM 52ª-1; Fondos de inversión 55-1ª"},{"id":"C049","tema":"2.1.8","tipo":"caso","q":"Al cotejar su base de clientes con la Lista de Personas Bloqueadas, el área de cumplimiento de un banco encuentra a uno de ellos. ¿Qué debe hacer según la DCG de Bancos?","a":"Suspender de inmediato todo acto, operación o servicio con él y remitir en 24 horas un reporte de Operación Inusual con la leyenda «Lista de Personas Bloqueadas»","o":["Suspender de inmediato todo acto, operación o servicio con él y remitir en 24 horas un reporte de Operación Inusual con la leyenda «Lista de Personas Bloqueadas»","Remitir en 24 horas un reporte autónomo de Lista de Personas Bloqueadas y suspender el servicio sólo hasta que la UIF resuelva sobre la inclusión del cliente","Su DCG no regula la Lista de Personas Bloqueadas, por lo que no prevé ni la suspensión ni el reporte con esa leyenda","Suspender el servicio y remitir en tres días hábiles un reporte de Operaciones Relevantes con la leyenda de la lista"],"x":"La 72ª de Bancos ordena suspender de inmediato todo acto, operación o servicio con el Cliente o Usuario y remitir a la Secretaría, por conducto de la Comisión, dentro de las veinticuatro horas desde que conozca la información, un reporte de Operación Inusual (41ª) con la leyenda «Lista de Personas Bloqueadas». No es un reporte autónomo.","ref":"Bancos 72ª I-II","par":"C050"},{"id":"C050","tema":"2.1.8","tipo":"caso","q":"Al cotejar su base de clientes con la Lista de Personas Bloqueadas, el Representante de un asesor en inversiones encuentra a uno de ellos. ¿Qué debe hacer según la DCG de Asesores en inversiones?","a":"Su DCG no regula la Lista de Personas Bloqueadas, por lo que no prevé ni la suspensión ni el reporte con esa leyenda","o":["Remitir en 24 horas un reporte autónomo de Lista de Personas Bloqueadas y suspender el servicio sólo hasta que la UIF resuelva sobre la inclusión del cliente","Suspender el servicio y remitir en tres días hábiles un reporte de Operaciones Relevantes con la leyenda de la lista","Su DCG no regula la Lista de Personas Bloqueadas, por lo que no prevé ni la suspensión ni el reporte con esa leyenda","Suspender de inmediato todo acto, operación o servicio con él y remitir en 24 horas un reporte de Operación Inusual con la leyenda «Lista de Personas Bloqueadas»"],"x":"La DCG de Asesores en inversiones no menciona la Lista de Personas Bloqueadas: no tiene capítulo, definición, criterio de Operación Inusual, reporte con leyenda, alerta ni prohibición de alertar. La suspensión inmediata y el reporte de 24 horas son obligaciones de los otros once sujetos del bloque.","ref":"Asesores en inversiones (sin disposición); Bancos 72ª","par":"C049"},{"id":"C051","tema":"2.1.8","tipo":"caso","q":"La Unidad de Inteligencia Financiera emitió su resolución sobre la inclusión de un cliente de un banco en la Lista de Personas Bloqueadas. ¿Qué plazo prevé la DCG de Bancos para notificarla por oficio al interesado?","a":"Dentro de los quince días hábiles siguientes al de su emisión","o":["Dentro de los quince días hábiles siguientes al de su emisión","Dentro de los diez días hábiles siguientes a que el interesado se presente a la audiencia","Su DCG no fija un plazo para notificar por oficio la resolución al interesado","Dentro de los treinta días naturales siguientes a que el interesado tenga conocimiento de la suspensión"],"x":"La 73ª II de Bancos obliga al Titular de la UIF a resolver en diez días hábiles desde que el interesado se presenta, y a notificar por oficio dentro de quince días hábiles siguientes a la emisión. Los diez días hábiles son el plazo para resolver, no el de la notificación.","ref":"Bancos 73ª II","par":"C052"},{"id":"C052","tema":"2.1.8","tipo":"caso","q":"La Unidad de Inteligencia Financiera emitió su resolución sobre la inclusión de un cliente de una SOFOM en la Lista de Personas Bloqueadas. ¿Qué plazo prevé la DCG de SOFOM para notificarla por oficio al interesado?","a":"Su DCG no fija un plazo para notificar por oficio la resolución al interesado","o":["Su DCG no fija un plazo para notificar por oficio la resolución al interesado","Dentro de los diez días hábiles siguientes a que el interesado se presente a la audiencia","Dentro de los treinta días naturales siguientes a que el interesado tenga conocimiento de la suspensión","Dentro de los quince días hábiles siguientes al de su emisión"],"x":"La 64ª II de SOFOM fija diez días hábiles para que el Titular de la UIF resuelva, pero no trae el plazo de quince días hábiles para notificar por oficio que sí aparece en Bancos, Fondos, SOFIPO, Centros cambiarios e ITF. Tampoco lo traen Casas de bolsa, SOCAP, Uniones, Casas de cambio ni Transmisores.","ref":"SOFOM 64ª II; Bancos 73ª II","par":"C051"},{"id":"C053","tema":"2.1.8","tipo":"caso","q":"Un banco suspendió los servicios a un cliente por aparecer en la Lista de Personas Bloqueadas y le avisa por escrito. ¿Qué debe informarle según la DCG de Bancos?","a":"Los fundamentos y la causa o causas de su inclusión y que, dentro de los diez días hábiles siguientes a recibir el escrito, puede acudir ante la autoridad competente","o":["Los fundamentos y la causa o causas de su inclusión y que, dentro de los diez días hábiles siguientes a recibir el escrito, puede acudir ante la autoridad competente","Los fundamentos de la inclusión y que la UIF resolverá su caso dentro de los quince días hábiles siguientes a la audiencia, sin necesidad de que el cliente acuda a ella","Que podrá acudir ante la autoridad competente para efectos del procedimiento ante la UIF, sin que se prevea informarle fundamentos ni causas de la inclusión","Únicamente que sus servicios fueron suspendidos, porque informar la causa de la inclusión está prohibido por el deber de reserva"],"x":"La 72ª, último párrafo, de Bancos exige avisar de inmediato, por escrito o por medios digitales, informando los fundamentos y la causa o causas de la inclusión y que dentro de los diez días hábiles siguientes a recibir el escrito podrá acudir ante la autoridad competente. La reserva (52ª IV) exceptúa expresamente ese aviso.","ref":"Bancos 72ª, último párrafo; 52ª IV","par":"C054"},{"id":"C054","tema":"2.1.8","tipo":"caso","q":"Un transmisor de dinero suspendió los servicios a un usuario por aparecer en la Lista de Personas Bloqueadas y le avisa por escrito. ¿Qué debe informarle según la DCG de Transmisores de dinero?","a":"Que podrá acudir ante la autoridad competente para efectos del procedimiento ante la UIF, sin que se prevea informarle fundamentos ni causas de la inclusión","o":["Los fundamentos de la inclusión y que la UIF resolverá su caso dentro de los quince días hábiles siguientes a la audiencia, sin necesidad de que el cliente acuda a ella","Los fundamentos y la causa o causas de su inclusión y que, dentro de los diez días hábiles siguientes a recibir el escrito, puede acudir ante la autoridad competente","Únicamente que sus servicios fueron suspendidos, porque informar la causa de la inclusión está prohibido por el deber de reserva","Que podrá acudir ante la autoridad competente para efectos del procedimiento ante la UIF, sin que se prevea informarle fundamentos ni causas de la inclusión"],"x":"La 62ª de Transmisores de dinero sólo exige informar al usuario, de inmediato y por escrito o medios digitales, que podrá acudir ante la autoridad competente para efectos de la 63ª. No trae el contenido reforzado de Bancos (fundamentos, causas y diez días hábiles); tampoco lo traen SOFOM, Casas de cambio ni Centros cambiarios.","ref":"Transmisores de dinero 62ª; Bancos 72ª","par":"C053"},{"id":"C055","tema":"2.1.8","tipo":"caso","q":"Una persona está sujeta a proceso penal por financiamiento al terrorismo y todavía no hay sentencia. ¿Puede la Secretaría incluirla en la Lista de Personas Bloqueadas por el supuesto de quienes se relacionan con una sentencia penal, conforme a la DCG de SOCAP?","a":"Sí: la fracción IV alcanza a quienes se encuentren en proceso o estén compurgando sentencia por esos delitos","o":["Sí: la fracción IV alcanza a quienes se encuentren en proceso o estén compurgando sentencia por esos delitos","No: la Lista de Personas Bloqueadas sólo se integra con personas de listas del Consejo de Seguridad de la ONU y de autoridades extranjeras","No: la fracción IV alcanza únicamente a quienes estén compurgando sentencia por esos delitos","Sí, pero sólo si además aparece en la lista de contribuyentes del cuarto párrafo del artículo 69-B del Código Fiscal de la Federación"],"x":"La 74ª IV de las SOCAP permite incluir a quienes «se encuentren en proceso o estén compurgando sentencia» por financiamiento al terrorismo u operaciones con recursos de procedencia ilícita. Bancos, Fondos, SOFIPO, Centros cambiarios e ITF sólo mencionan a quienes compurgan sentencia.","ref":"SOCAP 74ª IV; SOFIPO 74ª IV","par":"C056"},{"id":"C056","tema":"2.1.8","tipo":"caso","q":"Una persona está sujeta a proceso penal por financiamiento al terrorismo y todavía no hay sentencia. ¿Puede la Secretaría incluirla en la Lista de Personas Bloqueadas por el supuesto de quienes se relacionan con una sentencia penal, conforme a la DCG de SOFIPO?","a":"No: la fracción IV alcanza únicamente a quienes estén compurgando sentencia por esos delitos","o":["Sí, pero sólo si además aparece en la lista de contribuyentes del cuarto párrafo del artículo 69-B del Código Fiscal de la Federación","No: la Lista de Personas Bloqueadas sólo se integra con personas de listas del Consejo de Seguridad de la ONU y de autoridades extranjeras","Sí: la fracción IV alcanza a quienes se encuentren en proceso o estén compurgando sentencia por esos delitos","No: la fracción IV alcanza únicamente a quienes estén compurgando sentencia por esos delitos"],"x":"La 74ª IV de las SOFIPO reproduce el texto de Bancos: sólo quienes estén compurgando sentencia por financiamiento al terrorismo u operaciones con recursos de procedencia ilícita. La mención a quienes están «en proceso» aparece en SOFOM, Casas de bolsa, SOCAP, Uniones, Casas de cambio y Transmisores.","ref":"SOFIPO 74ª IV; SOCAP 74ª IV","par":"C055"},{"id":"C057","tema":"2.1.8","tipo":"caso","q":"Una autoridad nacional competente determinó que una persona pretende realizar actividades relacionadas con el financiamiento al terrorismo, aunque aún no las ha realizado. ¿Puede la Secretaría incluirla en la Lista de Personas Bloqueadas por la fracción V conforme a la DCG de Casas de bolsa?","a":"Sí: la fracción V alcanza a quienes hayan realizado, realicen o pretendan realizar esas actividades","o":["No: la fracción V alcanza sólo a quienes hayan realizado o realicen esas actividades","Sí: la fracción V alcanza a quienes hayan realizado, realicen o pretendan realizar esas actividades","Sí, pero sólo si además la persona se encuentra compurgando sentencia por esos delitos en el Código Penal Federal","No: la Lista de Personas Bloqueadas sólo recoge las listas de la ONU y las de autoridades extranjeras o de organismos internacionales"],"x":"La 70ª V de Casas de bolsa incluye a quienes las autoridades nacionales competentes determinen que «hayan realizado, realicen o pretendan realizar» actividades relacionadas con FT u ORPI. La redacción de Bancos (71ª V) sólo dice «hayan realizado o realicen».","ref":"Casas de bolsa 70ª V; Bancos 71ª V","par":"C058"},{"id":"C058","tema":"2.1.8","tipo":"caso","q":"Una autoridad nacional competente determinó que una persona pretende realizar actividades relacionadas con el financiamiento al terrorismo, aunque aún no las ha realizado. ¿Puede la Secretaría incluirla en la Lista de Personas Bloqueadas por la fracción V conforme a la DCG de Bancos?","a":"No: la fracción V alcanza sólo a quienes hayan realizado o realicen esas actividades","o":["No: la Lista de Personas Bloqueadas sólo recoge las listas de la ONU y las de autoridades extranjeras o de organismos internacionales","Sí, pero sólo si además la persona se encuentra compurgando sentencia por esos delitos en el Código Penal Federal","Sí: la fracción V alcanza a quienes hayan realizado, realicen o pretendan realizar esas actividades","No: la fracción V alcanza sólo a quienes hayan realizado o realicen esas actividades"],"x":"La 71ª V de Bancos sólo alcanza a quienes las autoridades nacionales competentes determinen que «hayan realizado o realicen» actividades relacionadas con FT u ORPI; no incluye a quienes pretendan realizarlas, expresión que sí traen SOFOM, Casas de bolsa, SOCAP, Uniones, Casas de cambio y Transmisores. Es la diferencia entre «hayan realizado o realicen» y «hayan realizado, realicen o pretendan realizar».","ref":"Bancos 71ª V; Casas de bolsa 70ª V","par":"C057"},{"id":"C059","tema":"2.1.8","tipo":"memoria","q":"Según la DCG de Bancos, ¿quién pone a disposición de las Entidades la Lista de Personas Bloqueadas y sus actualizaciones?","a":"La Secretaría, a través de la Comisión","o":["La Secretaría, a través de la Comisión","La Comisión, directamente, con base en las listas que le comuniquen las autoridades extranjeras","El Consejo de Seguridad de la ONU, por conducto de la Secretaría de Relaciones Exteriores y de la Comisión","La Unidad de Inteligencia Financiera, mediante oficio dirigido a cada Entidad cuando la actualiza"],"x":"La 70ª de Bancos dispone que la Secretaría pone a disposición de las Entidades, a través de la Comisión, la LPB y sus actualizaciones. La definición está en la 2ª XXI: es la lista a que se refiere el artículo 115, párrafo noveno, de la LIC.","ref":"Bancos 70ª, primer párrafo; 2ª XXI"},{"id":"C060","tema":"2.1.8","tipo":"caso","q":"Un banco quiere verificar si un tercero que actúa por cuenta de uno de sus clientes aparece en la Lista de Personas Bloqueadas. ¿Qué exige su DCG?","a":"Adoptar mecanismos para identificar a los Clientes o Usuarios en la lista, a terceros que actúen en su nombre o por su cuenta y sus operaciones, previstos en el Manual de Cumplimiento","o":["Consultar la lista únicamente al abrir el contrato, sin revisar las operaciones posteriores que realice o pretenda realizar el cliente","Sólo mecanismos para identificar a los Clientes, porque los terceros que actúan por cuenta de ellos no pueden quedar incluidos en la lista","Adoptar mecanismos para identificar a los Clientes o Usuarios en la lista, a terceros que actúen en su nombre o por su cuenta y sus operaciones, previstos en el Manual de Cumplimiento","Mecanismos descritos en un documento separado del Manual de Cumplimiento, que debe remitirse cada año a la Unidad de Inteligencia Financiera"],"x":"La 70ª de Bancos obliga a adoptar e implementar mecanismos que identifiquen a los Clientes o Usuarios en la lista, a cualquier tercero que actúe en su nombre o por su cuenta y a las Operaciones que hayan realizado, realicen o pretendan realizar; esos mecanismos deben estar en el Manual de Cumplimiento. No se remiten por separado: viven en el Manual, que sí se envía a la Comisión.","ref":"Bancos 70ª, segundo párrafo"},{"id":"C061","tema":"2.1.8","tipo":"trampa","q":"¿Cuál afirmación sobre la ubicación y el efecto de la Lista de Personas Bloqueadas en la DCG de Bancos es correcta?","a":"Tiene capítulo propio; el cotejo es un mecanismo previsto en el Manual y su consecuencia es suspender y enviar un reporte de Operación Inusual, no un reporte autónomo","o":["Se regula en las disposiciones generales y su consecuencia es un reporte autónomo de Lista de Personas Bloqueadas, enviado a la Secretaría en 24 horas, sin suspender los servicios del cliente","Se regula únicamente en el capítulo de Operaciones Inusuales, que fija el procedimiento completo de suspensión, audiencia y salida de la lista","Forma parte del capítulo de identificación de Clientes, como un dato más que debe incorporarse al expediente de identificación de cada uno","Tiene capítulo propio; el cotejo es un mecanismo previsto en el Manual y su consecuencia es suspender y enviar un reporte de Operación Inusual, no un reporte autónomo"],"x":"La LPB no es parte de la política de identificación: tiene su propio Capítulo XV (70ª a 75ª). La consecuencia de identificar a un listado no es un reporte autónomo, sino una Operación Inusual con la leyenda «Lista de Personas Bloqueadas»; además aparece en los criterios de OI (38ª XIV), el Comité (43ª V) y las alertas (51ª X).","ref":"Bancos Cap. XV 70ª-75ª; 38ª XIV; 43ª V; 51ª X; 72ª"},{"id":"C062","tema":"2.1.8","tipo":"memoria","q":"Una persona figura en una lista derivada de las resoluciones 1267 (1999) y 1373 (2001) del Consejo de Seguridad de la ONU. ¿En qué supuesto de la 71ª de Bancos puede la Secretaría incluirla en la Lista de Personas Bloqueadas?","a":"En la fracción I, relativa a las listas derivadas de esas resoluciones y a las demás que emitan el Consejo de Seguridad o las organizaciones internacionales","o":["En la fracción III, que exige que una autoridad nacional competente dé a conocer indicios suficientes de relación con esos delitos","En la fracción I, relativa a las listas derivadas de esas resoluciones y a las demás que emitan el Consejo de Seguridad o las organizaciones internacionales","En la fracción VII, relativa a quienes aparezcan en la lista de contribuyentes del cuarto párrafo del artículo 69-B del Código Fiscal de la Federación","En la fracción IV, relativa a quienes estén compurgando sentencia por financiamiento al terrorismo u operaciones con recursos de procedencia ilícita"],"x":"La fracción I de la 71ª de Bancos remite a las listas derivadas de las resoluciones 1267 (1999) y sucesivas y 1373 (2001) del Consejo de Seguridad de la ONU y a las que emitan otras organizaciones internacionales. La Secretaría «podrá» incluirlas; no es automático.","ref":"Bancos 71ª I"},{"id":"C063","tema":"2.1.8","tipo":"caso","q":"Un contribuyente aparece en la lista del cuarto párrafo del artículo 69-B del Código Fiscal de la Federación. ¿Qué prevé la DCG de Bancos?","a":"La Secretaría puede incluirlo en la Lista de Personas Bloqueadas (71ª VII) y debe eliminarlo si se encuentra en el supuesto del sexto párrafo del 69-B (74ª V)","o":["Debe suspenderse automáticamente a todo contribuyente de esa lista, sin que la Secretaría tenga que incluirlo en la Lista de Personas Bloqueadas","Se le incluye en la Lista de Personas Bloqueadas únicamente si además está compurgando sentencia por operaciones con recursos de procedencia ilícita y la Comisión lo confirma por oficio","La Secretaría puede incluirlo en la Lista de Personas Bloqueadas (71ª VII) y debe eliminarlo si se encuentra en el supuesto del sexto párrafo del 69-B (74ª V)","La DCG no lo considera, pues la lista del 69-B sólo da lugar a un reporte de Operaciones Relevantes y no a la Lista de Personas Bloqueadas"],"x":"La fracción VII de la 71ª de Bancos (añadida en 2022) permite incluir a quienes aparezcan en la lista del cuarto párrafo del 69-B del CFF, y la 74ª V ordena su eliminación en el supuesto del sexto párrafo. En ambos casos es la Secretaría quien actúa.","ref":"Bancos 71ª VII; 74ª V"},{"id":"C064","tema":"2.1.8","tipo":"caso","q":"Una persona fue incluida en la Lista de Personas Bloqueadas por estar compurgando sentencia por operaciones con recursos de procedencia ilícita. Tiempo después, el juez penal dicta sentencia absolutoria. ¿Qué dispone la DCG de Bancos para la Secretaría?","a":"Debe eliminarla de la Lista de Personas Bloqueadas, porque el juez penal dictó sentencia absolutoria en el supuesto de la fracción IV de la 71ª","o":["Debe eliminarla sólo si el interesado lo solicita dentro de los diez días hábiles siguientes a la sentencia, mediante la audiencia ante la UIF","Debe sustituir su inclusión por la de la fracción V, mientras las autoridades nacionales determinan si realizó actividades relacionadas","Puede mantenerla en la lista hasta que la Comisión confirme la sentencia absolutoria y la Unidad de Inteligencia Financiera la notifique por oficio","Debe eliminarla de la Lista de Personas Bloqueadas, porque el juez penal dictó sentencia absolutoria en el supuesto de la fracción IV de la 71ª"],"x":"La 74ª II obliga a la Secretaría a eliminar de la LPB a quien, estando en el supuesto de la fracción IV de la 71ª, obtenga sentencia absolutoria o compurgue su condena. No depende de una solicitud ni de confirmación de la Comisión.","ref":"Bancos 74ª II; 71ª IV"},{"id":"C065","tema":"2.1.8","tipo":"cifra","q":"Un banco identifica el lunes a las 10:00 horas que un cliente aparece en la Lista de Personas Bloqueadas. ¿En qué plazo debe remitir el reporte a la Secretaría, por conducto de la Comisión?","a":"Dentro de las veinticuatro horas contadas a partir de que conozca la información, como reporte de Operación Inusual con la leyenda «Lista de Personas Bloqueadas»","o":["Dentro de las veinticuatro horas siguientes a la notificación de la resolución que emita la Unidad de Inteligencia Financiera","Dentro de los tres días hábiles siguientes a que conozca la información, como reporte de Operación Relevante con la leyenda de la lista","Dentro de las cuarenta y ocho horas contadas a partir de que conozca la información, como reporte de Operación Inusual con la leyenda de la lista","Dentro de las veinticuatro horas contadas a partir de que conozca la información, como reporte de Operación Inusual con la leyenda «Lista de Personas Bloqueadas»"],"x":"La 72ª II de Bancos fija veinticuatro horas desde que la Entidad conoce que un Cliente o Usuario está en la LPB; el reporte es una Operación Inusual conforme a la 41ª, con la leyenda en la columna de descripción. La resolución de la UIF es posterior y no inicia ese plazo.","ref":"Bancos 72ª II"},{"id":"C066","tema":"2.1.8","tipo":"trampa","q":"Un banco celebró una operación con un cliente antes de que la Lista de Personas Bloqueadas le fuera notificada, y el cliente aparece después en ella. ¿Qué reporte corresponde por esa operación anterior?","a":"Un reporte de Operación Inusual en el plazo de 24 horas, por haber celebrado la operación con anterioridad a la notificación de la lista (41ª, segundo párrafo)","o":["Ninguno, porque las operaciones celebradas antes de la notificación de la lista quedan fuera del alcance de la DCG y no se reportan","El «Reporte de 24 horas LD» del primer párrafo de la 41ª, porque la operación debe tratarse como una sospecha fundada de lavado de dinero","Un reporte de Operación Inusual en el plazo de 24 horas, por haber celebrado la operación con anterioridad a la notificación de la lista (41ª, segundo párrafo)","El reporte mensual de Operaciones Relevantes, dentro de los quince días hábiles siguientes al último día hábil del mes inmediato anterior, sin leyenda alguna sobre la lista"],"x":"La 41ª, segundo párrafo, obliga a reportar como Operación Inusual, en el mismo plazo de 24 horas, las operaciones celebradas antes de la notificación de la LPB, los intentos posteriores y los terceros que actúen a favor del listado. No se confunde con el «Reporte de 24 horas» del primer párrafo ni con el reporte de la 72ª, cuya leyenda es la de la lista.","ref":"Bancos 41ª, segundo párrafo; 72ª"},{"id":"C067","tema":"2.1.8","tipo":"trampa","q":"Un banco identifica a un cliente en la Lista de Personas Bloqueadas y elabora el reporte correspondiente. ¿Qué leyenda debe insertar en la columna de descripción de la Operación?","a":"«Lista de Personas Bloqueadas»","o":["«Lista de Personas Bloqueadas»","«Operación Interna Preocupante», porque el cliente es una persona que debe ser reportada de inmediato","«Reporte de 24 horas LD», porque el reporte debe presentarse en un plazo de veinticuatro horas","«Reporte de 24 horas FT», porque la lista incluye a personas vinculadas con financiamiento al terrorismo"],"x":"La 72ª II de Bancos ordena insertar la leyenda «Lista de Personas Bloqueadas» en el reporte de OI. Las leyendas «Reporte de 24 horas LD» o «FT» son de la 41ª, primer párrafo, cuando la entidad tiene sospechas fundadas sobre una operación que se pretende realizar.","ref":"Bancos 72ª II; 41ª, primer párrafo"},{"id":"C068","tema":"2.1.8","tipo":"cifra","q":"Una persona incluida en la Lista de Personas Bloqueadas quiere hacer valer sus derechos ante la Unidad de Inteligencia Financiera. ¿De qué plazo dispone para manifestar, aportar pruebas y alegar, y qué ocurre si necesita más tiempo?","a":"Diez días hábiles desde que conoce la suspensión; a petición de parte, el Titular de la UIF puede ampliarlo por una sola ocasión hasta por el mismo lapso","o":["Quince días hábiles desde que recibe el aviso del banco, prorrogables las veces que lo justifiquen las circunstancias particulares del caso","Diez días hábiles desde que conoce la suspensión; a petición de parte, el Titular de la UIF puede ampliarlo por una sola ocasión hasta por el mismo lapso","Diez días hábiles desde que conoce la suspensión, sin posibilidad de ampliación porque el procedimiento concluye con la resolución de la autoridad","Diez días hábiles desde que conoce la suspensión, ampliables de oficio por el Titular de la UIF cuantas veces estime necesario"],"x":"La 73ª I de Bancos otorga audiencia ante el Titular de la UIF para que el interesado, en diez días hábiles desde que conoce la suspensión, manifieste, pruebe y alegue; la ampliación procede a petición de parte, por una sola vez y por el mismo lapso. Luego la UIF resuelve en diez días hábiles y notifica en quince.","ref":"Bancos 73ª I"},{"id":"C069","tema":"2.1.8","tipo":"caso","q":"Un empleado de un banco comenta a un cliente que su nombre aparecerá en la próxima actualización de la Lista de Personas Bloqueadas. ¿Qué dispone la DCG de Bancos?","a":"Está estrictamente prohibido alertar a Clientes, Usuarios o terceros sobre el contenido de la Lista de Personas Bloqueadas, sin perjuicio de la 62ª Quinquies y del aviso de la 72ª","o":["Puede hacerlo si el cliente es un tercero que actúa por cuenta de otro, porque la prohibición sólo protege a los Clientes y Usuarios que ya aparezcan en la lista","Puede hacerlo siempre que se lo informe por escrito y dentro de los diez días hábiles siguientes a que la Secretaría la actualice","Está estrictamente prohibido alertar a Clientes, Usuarios o terceros sobre el contenido de la Lista de Personas Bloqueadas, sin perjuicio de la 62ª Quinquies y del aviso de la 72ª","Puede hacerlo si el cliente aún no ha realizado operaciones con la entidad, pues la prohibición sólo alcanza a quienes ya son Clientes"],"x":"La 52ª IV de Bancos prohíbe alertar a Clientes, Usuarios o terceros sobre el contenido de la LPB. Sólo exceptúa el intercambio autorizado por la 62ª Quinquies y el aviso que el banco da al suspender los servicios (72ª, último párrafo).","ref":"Bancos 52ª IV"},{"id":"C070","tema":"2.1.8","tipo":"caso","q":"El procedimiento ante la UIF resolvió la eliminación de una persona de la Lista de Personas Bloqueadas. ¿Qué debe hacer el banco respecto de los actos, operaciones o servicios que había suspendido?","a":"Reanudarlos inmediatamente con el Cliente o Usuario de que se trate","o":["Reanudarlos sólo con autorización expresa de la Comisión, previa solicitud presentada por el Oficial de Cumplimiento","Reanudarlos después de un periodo de observación de doce meses, con alertas reforzadas sobre las operaciones del cliente","Reanudarlos inmediatamente con el Cliente o Usuario de que se trate","Reanudarlos dentro de los diez días hábiles siguientes a que reciba el oficio con la resolución de la UIF"],"x":"La 74ª de Bancos, último párrafo, ordena reanudar inmediatamente los actos, operaciones o servicios cuando se elimine a la persona de la LPB; la eliminación procede, entre otros supuestos, por resolución del procedimiento de la 73ª (74ª III). No hay plazo de espera ni autorización adicional de la Comisión.","ref":"Bancos 74ª, último párrafo; 74ª III"},{"id":"C071","tema":"2.1.8","tipo":"memoria","q":"Una persona incluida en la Lista de Personas Bloqueadas solicita acceder a ciertos recursos que necesita. ¿En qué términos puede la Secretaría autorizar ese acceso según la DCG de Bancos?","a":"Conforme a los tratados internacionales celebrados por México y a la resolución 1452 (2002) del Consejo de Seguridad de la ONU","o":["Conforme a la resolución 1267 (1999) del Consejo de Seguridad de la ONU, que es la única que prevé excepciones","Conforme a la resolución que emita el Titular de la UIF en la audiencia, que debe autorizarlo siempre que el interesado lo pida","Conforme a la solicitud del banco a la Comisión, que la autoriza dentro de los diez días hábiles siguientes a recibirla","Conforme a los tratados internacionales celebrados por México y a la resolución 1452 (2002) del Consejo de Seguridad de la ONU"],"x":"La 75ª de Bancos permite a la Secretaría autorizar, sin perjuicio del capítulo, el acceso a determinados recursos, derechos, bienes, actos, operaciones o servicios a los Clientes o Usuarios en la LPB, en términos de tratados internacionales y de la resolución 1452 (2002) de la ONU, y a las Entidades respecto de obligaciones contraídas con ellos. Es una excepción que concede la Secretaría, no la Entidad.","ref":"Bancos 75ª I"},{"id":"C072","tema":"2.1.8","tipo":"caso","q":"En una sucursal de un banco, una persona distinta del titular cobra un cheque emitido con cargo a una cuenta corriente de esa misma sucursal. Para efectos del capítulo de la Lista de Personas Bloqueadas, ¿cómo la considera la DCG de Bancos?","a":"No se le considera Usuario, porque el cobro de ese cheque es una de las operaciones excluidas del concepto de Usuario para el capítulo","o":["Se le considera Cliente, porque la sucursal librada mantiene una cuenta en la que el cheque se carga a su valor","No se le considera Usuario, porque el cobro de ese cheque es una de las operaciones excluidas del concepto de Usuario para el capítulo","Se le considera Usuario, por lo que el banco debe cotejarla contra la lista antes de pagar el cheque en ventanilla","Se le considera Usuario sólo si el importe del cheque alcanza el umbral de las Operaciones Relevantes de la Entidad"],"x":"La 70ª, tercer párrafo, de Bancos excluye del concepto de Usuario, para el capítulo de la LPB, a quien cobra cheques de cuenta corriente en sucursales de la Entidad librada siendo distinto del titular y a quien recibe recursos de programas gubernamentales de apoyo. Esta exclusión es exclusiva de Bancos.","ref":"Bancos 70ª, I-II"},{"id":"C073","tema":"2.1.7","tipo":"caso","par":"C074","q":"Una casa de cambio que no forma parte de ningún grupo financiero quiere intercambiar con otra casa de cambio información de operaciones de un usuario para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé su DCG?","o":["Pueden intercambiarla con solicitud de funcionario autorizado y respuesta en no más de 30 días naturales, igual que entre bancos","No contiene esa modalidad: su único intercambio es con entidades de su mismo grupo financiero","Pueden intercambiarla si celebran convenio e informan a la Comisión antes del intercambio","Pueden intercambiarla mediante escrito con motivo y clase, y respuesta por escrito firmado"],"a":"No contiene esa modalidad: su único intercambio es con entidades de su mismo grupo financiero","x":"Las DCG de Casas de cambio sólo regulan el intercambio con las demás entidades del mismo grupo financiero (51ª-1); no tienen intercambio entre entidades del mismo tipo. Esa modalidad sólo la prevén Bancos (62ª), SOFIPO (64ª) e ITF (arts. 77–78). El distractor del escrito firmado describe a SOFIPO e ITF.","ref":"Casas de cambio 51ª-1; Bancos 62ª; SOFIPO 64ª; ITF arts. 77–78"},{"id":"C074","tema":"2.1.7","tipo":"caso","par":"C073","q":"Una casa de cambio que forma parte de un grupo financiero quiere compartir con el banco del grupo información de las operaciones de sus usuarios, en materia de PLD/FT. ¿Qué exige su DCG?","o":["Celebrar un convenio sobre el tratamiento confidencial y los cargos de los funcionarios autorizados, e informar a la Comisión antes del intercambio","Enviar a la Secretaría, por conducto de la Comisión y de forma previa o simultánea, copia del formato oficial con toda la información intercambiada","Obtener el consentimiento expreso de cada usuario y responder las solicitudes del banco en no más de 30 días naturales","Nada: el intercambio dentro del grupo es libre y sólo requiere que lo pida un funcionario autorizado por escrito"],"a":"Celebrar un convenio sobre el tratamiento confidencial y los cargos de los funcionarios autorizados, e informar a la Comisión antes del intercambio","x":"La 51ª-1 de Casas de cambio permite intercambiar información sobre las operaciones con sus Usuarios con las otras entidades del grupo, siempre que celebren un convenio (confidencialidad y cargos) e informen a la Comisión su suscripción antes del intercambio. La copia del formato a la Secretaría es requisito del intercambio con extranjeras (62ª Ter de Bancos), y el consentimiento del cliente no se exige en el intercambio de grupo.","ref":"Casas de cambio 51ª-1"},{"id":"C075","tema":"2.1.7","tipo":"trampa","q":"Un banco y una casa de bolsa del mismo grupo financiero quieren que la casa de bolsa use el expediente de identificación que ya integró el banco para abrirle un contrato a un cliente del banco. ¿Qué es correcto?","o":["Es el intercambio de grupo de la 62ª Sexies: basta el convenio de confidencialidad y cargos, y el informe previo a la Comisión","Es el intercambio entre entidades del mismo tipo: la casa de bolsa lo pide y el banco responde en 30 días naturales","No es posible: el expediente de identificación sólo puede integrarlo y conservarlo la entidad que abre la relación","Requiere el consentimiento del cliente y un convenio entre las entidades; es una regla de identificación, no de intercambio PLD"],"a":"Requiere el consentimiento del cliente y un convenio entre las entidades; es una regla de identificación, no de intercambio PLD","x":"La 9ª de Bancos (8ª en Casas de bolsa) permite que otra entidad del grupo integre y conserve el expediente si cuenta con el consentimiento del Cliente y las entidades celebran un convenio para intercambiar los datos y documentos de identificación. Es parte de la identificación (2.1.2). La 62ª Sexies es otra cosa: intercambio de información de operaciones para PLD/FT, sin consentimiento del cliente.","ref":"Bancos 9ª; Casas de bolsa 8ª; Bancos 62ª Sexies"},{"id":"C076","tema":"2.1.7","tipo":"caso","q":"Un asesor en inversiones lee que el art. 79 de las DCG de ITF permite a las ITF intercambiar información con asesores en inversiones. ¿Qué prevé sobre el intercambio de información PLD/FT la DCG de Asesores en inversiones?","o":["Lo regula en un capítulo propio, con convenio, aviso previo a la Comisión y respuesta en 30 días naturales","No contiene disposición de intercambio de información PLD/FT; el art. 79 de ITF los nombra como posibles contrapartes","Lo regula sólo con las ITF, por escrito firmado y con respuesta en no más de 30 días naturales","Lo regula sólo con las entidades de su grupo financiero, con convenio de confidencialidad y aviso previo a la Comisión"],"a":"No contiene disposición de intercambio de información PLD/FT; el art. 79 de ITF los nombra como posibles contrapartes","x":"Las DCG de Asesores en inversiones no tienen ninguna regla de intercambio de información PLD/FT; su única mención de intercambio es la de datos de identificación por convenio con la entidad financiera con la que tiene relación (8ª), que es identificación. El art. 79 de ITF habla de asesores «autorizados para ello en las leyes que los regulan»: abre la puerta del lado de la ITF.","ref":"Asesores en inversiones 8ª; ITF art. 79"},{"id":"C077","tema":"2.1.7","tipo":"caso","q":"Una ITF quiere intercambiar información de operaciones de un cliente con un transmisor de dinero, para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé su DCG?","o":["No puede: las ITF sólo intercambian información con otras ITF y con las entidades de su grupo financiero","Sólo puede si el transmisor forma parte de su grupo financiero y ambos informan a la CNBV antes del intercambio","Puede, con transmisores autorizados para ello en sus leyes, con las reglas del intercambio entre ITF salvo que se opongan a las del transmisor","Puede, siempre que el intercambio derive de una operación entre ambos y se envíe a la Secretaría, de forma previa o simultánea, copia del formato"],"a":"Puede, con transmisores autorizados para ello en sus leyes, con las reglas del intercambio entre ITF salvo que se opongan a las del transmisor","x":"El art. 79 de ITF permite intercambiar con otras Entidades Financieras y con centros cambiarios, transmisores de dinero y asesores en inversiones autorizados para ello en sus leyes, ajustándose al Capítulo I (intercambio entre ITF), salvo que se oponga a las disposiciones de la contraparte. Derivar de una operación y enviar copia del formato son condiciones del intercambio con extranjeras (art. 81).","ref":"ITF arts. 79 y 81"},{"id":"C078","tema":"2.1.7","tipo":"caso","q":"Un banco quiere compartir con una entidad financiera extranjera la información de un cliente persona moral de su régimen ilimitado de dólares en efectivo (33ª Bis 1). ¿Qué condición específica exige la 62ª Bis?","o":["Que el intercambio derive de una operación con dólares de los EUA entre el banco y la entidad extranjera","Que la entidad extranjera sea filial del banco o una entidad en la que tenga inversión en su capital social","Que la Secretaría haya determinado previamente a esa entidad extranjera como contraparte autorizada","Que el cliente persona moral otorgue su consentimiento expreso antes de compartir su información"],"a":"Que el intercambio derive de una operación con dólares de los EUA entre el banco y la entidad extranjera","x":"La 62ª Bis permite intercambiar la información de la 33ª Bis 1 con entidades financieras extranjeras con dos condiciones: convenio (confidencialidad y cargos) con aviso previo a la Comisión, y que el intercambio derive de una operación con dólares entre ambas. Filiales e inversiones son de la 62ª Octies; «las que determine la Secretaría» es la regla de ITF (art. 81).","ref":"Bancos 62ª Bis"},{"id":"C079","tema":"2.1.7","tipo":"caso","q":"Un banco quiere compartir el contenido de la Lista de Personas Bloqueadas con otro banco mexicano que no pertenece a su grupo financiero. ¿Qué prevé la 62ª Quinquies?","o":["Puede compartirlo, porque el intercambio entre entidades del mismo tipo comprende la LPB","Puede compartirlo si celebra convenio e informa a la Comisión antes del intercambio","No está previsto: ese banco no es uno de los destinatarios que enumera la disposición","Puede compartirlo por la plataforma tecnológica que opere el Banco de México"],"a":"No está previsto: ese banco no es uno de los destinatarios que enumera la disposición","x":"La 62ª Quinquies enumera cinco destinatarios: oficinas de representación con relación comercial, filiales del exterior, entidades del exterior donde tenga inversión en capital, corresponsales extranjeros y entidades financieras del mismo grupo. Otro banco mexicano ajeno al grupo no está en la lista, y el intercambio general de la 62ª no menciona la LPB.","ref":"Bancos 62ª Quinquies"},{"id":"C080","tema":"2.1.7","tipo":"memoria","q":"Para que un banco proporcione a la plataforma tecnológica de transferencias la información y documentación de un cliente (62ª Quáter), ¿qué debe obtener del cliente?","o":["Una carta firmada en la que libere al banco de responsabilidad por el uso de la información","Su consentimiento, a través de los medios que el banco establezca para esos efectos","Una solicitud por escrito en la que especifique el motivo y la clase de información","Una autorización de la Comisión, tramitada por el banco con el formato oficial"],"a":"Su consentimiento, a través de los medios que el banco establezca para esos efectos","x":"La fr. VIII de la 62ª Quáter exige que el Cliente o Usuario otorgue su consentimiento por los medios que la Entidad establezca, y que conozca la naturaleza y alcance de la información que la plataforma proporcionará. Es el único intercambio del capítulo que pide consentimiento del cliente; el escrito con motivo y clase es la solicitud entre SOFIPO o entre ITF.","ref":"Bancos 62ª Quáter fr. VIII"},{"id":"C081","tema":"2.1.7","tipo":"caso","q":"Un cliente pide por escrito a su banco la información suya que está almacenada en la plataforma tecnológica de transferencias. ¿Qué debe hacer el banco?","o":["Negarse, porque la información de la plataforma sólo puede usarse para los fines de los artículos 52 y 115 Bis","Remitir la solicitud a la Comisión, que es la única autorizada para entregar esa información al cliente","Entregarle sólo los datos estadísticos de número, montos, destinos y procedencias de sus transferencias del periodo","Entregársela, incluida la relación de las demás entidades que la hayan consultado en los periodos de los lineamientos"],"a":"Entregársela, incluida la relación de las demás entidades que la hayan consultado en los periodos de los lineamientos","x":"La fr. VII de la 62ª Quáter obliga a entregar la información almacenada al Cliente o Usuario que la solicite por escrito o por medios electrónicos, incluyendo la relación de las demás Entidades que la hayan consultado. El uso exclusivo para los arts. 52 y 115 Bis (fr. XI) limita a las entidades que consultan, no al titular. Los datos estadísticos son lo que la plataforma entrega a las entidades (fr. VI).","ref":"Bancos 62ª Quáter fr. VII"},{"id":"C082","tema":"2.1.7","tipo":"caso","q":"Un banco recibió de otro banco, por intercambio de la 62ª, antecedentes de un cliente. Ahora un tercer banco le pide esa misma información. ¿Qué prevé la disposición?","o":["Puede compartirla libremente, porque ya forma parte de sus registros y la finalidad es la misma","Sólo puede compartirla si se estableció que la información puede a su vez compartirse con otras Entidades","Puede compartirla si informa a la Comisión antes del intercambio y conserva la documentación soporte respectiva","No puede compartirla en ningún caso: la información recibida sólo puede usarla quien la solicitó"],"a":"Sólo puede compartirla si se estableció que la información puede a su vez compartirse con otras Entidades","x":"La 62ª fr. IV dispone que la información sólo podrá ser utilizada por la Entidad que la solicitó, salvo que se establezca que puede a su vez compartirse con otras Entidades. Por eso el absoluto «en ningún caso» es falso, y tampoco basta informar a la Comisión: el aviso previo es requisito del intercambio en grupo y con extranjeras.","ref":"Bancos 62ª fr. IV"},{"id":"C083","tema":"2.1.7","tipo":"caso","par":"C084","q":"Una ITF detecta un esquema de fraude contra sus propios clientes y quiere intercambiar información con otra ITF para prevenirlo. ¿Qué prevé su DCG sobre la finalidad del intercambio?","o":["Lo permite: además de 139 Quáter y 400 Bis, incluye prevenir delitos en contra de sus Clientes o de la propia ITF","No lo permite: el intercambio se limita a prevenir los delitos de los artículos 139 Quáter y 400 Bis","Lo permite sólo si la otra ITF forma parte de su grupo financiero, con convenio e informe previo a la CNBV","Lo permite sólo con autorización previa de la CNBV, por tratarse de una finalidad distinta de PLD/FT"],"a":"Lo permite: además de 139 Quáter y 400 Bis, incluye prevenir delitos en contra de sus Clientes o de la propia ITF","x":"El art. 77 de ITF amplía la finalidad del intercambio entre ITF: prevenir los supuestos de los arts. 139 Quáter o 400 Bis CPF y la comisión de delitos en contra de sus Clientes o de la propia ITF. SOFIPO, en cambio, lo limita «única y exclusivamente» a 139 Quáter y 400 Bis.","ref":"ITF art. 77; SOFIPO 64ª"},{"id":"C084","tema":"2.1.7","tipo":"caso","par":"C083","q":"Una SOFIPO detecta un esquema de fraude contra sus propios clientes, sin indicios de lavado ni de financiamiento al terrorismo, y quiere intercambiar información con otra SOFIPO para prevenirlo. ¿Qué prevé su DCG?","o":["Lo permite, porque la finalidad incluye los delitos en contra de sus Clientes o de la propia Entidad","Lo permite con escrito firmado por funcionarios autorizados y respuesta en 30 días naturales","No lo prevé: el intercambio se limita única y exclusivamente a prevenir 139 Quáter o 400 Bis","Lo permite si ambas SOFIPO celebran convenio e informan a la Comisión antes del intercambio"],"a":"No lo prevé: el intercambio se limita única y exclusivamente a prevenir 139 Quáter o 400 Bis","x":"La 64ª de SOFIPO limita el intercambio «única y exclusivamente» a fortalecer las medidas para prevenir y detectar los supuestos de los arts. 139 Quáter o 400 Bis CPF. La finalidad ampliada a delitos contra los clientes es propia de ITF (art. 77). El escrito firmado y los 30 días naturales son la forma del intercambio, pero no cambian su finalidad.","ref":"SOFIPO 64ª; ITF art. 77"}],"sitio":{"nombre":"Módulo 2","integrador":"simulacro","integrador_texto":"Simulacro mixto","integrador_href":"m2-simulacro/index.html","etiqueta_n":"H","orden_resultados":"temario","paginas":[{"n":"1","carpeta":"m2-h1-objetivo-kyc","pregunta":"2.1.1–2.1.2 · Objetivo y política de identificación y conocimiento","estado":"integrada"},{"n":"2","carpeta":"m2-h2-reportes-dolares-sistemas","pregunta":"2.1.3–2.1.5 · Reportes, dólares en efectivo y sistemas automatizados","estado":"integrada"},{"n":"3","carpeta":"m2-h3-otras-obligaciones-lpb","pregunta":"2.1.6–2.1.8 · Otras obligaciones, intercambio de información y LPB","estado":"integrada"},{"n":"4","carpeta":"m2-h4-ccc-oficial","pregunta":"2.1.9–2.1.10 · Comité de Comunicación y Control y oficial de cumplimiento","estado":"integrada"},{"n":"5","carpeta":"m2-h5-novedosos-cambios-itf","pregunta":"2.1.11–2.1.14 · Modelos novedosos, centros cambiarios, transmisores e ITF","estado":"integrada"},{"n":"6","carpeta":"m2-h6-sanciones-pr-plazos","pregunta":"2.1.15–2.1.17 · Sanciones, propietario real y plazos","estado":"integrada"},{"n":"7","carpeta":"m2-h7-tipologias","pregunta":"2.1 · Tipologías UIF y de organismos internacionales","estado":"integrada"},{"n":"8","carpeta":"m2-h8-lfpiorpi","pregunta":"2.2.1–2.2.2 · LFPIORPI: actividades vulnerables y uso de efectivo","estado":"integrada"}],"raiz":"../","actual":"m2-h3-otras-obligaciones-lpb"}}
