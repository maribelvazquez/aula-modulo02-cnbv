par":"D001"},{"id":"D003","tema":"2.1.9","tipo":"caso","q":"Una institución de crédito con 18 personas a su servicio no constituye el Comité de Comunicación y Control, como se lo permite su DCG. ¿Quién ejerce las funciones que corresponderían al Comité?","a":"El Oficial de Cumplimiento, salvo asegurar que la clave de acceso se solicite y mantenga a su nombre, que corresponde al director general o equivalente","o":["El consejo de administración, salvo el dictamen de Operaciones Inusuales e Internas Preocupantes, que corresponde al Oficial de Cumplimiento","El director general de la institución, salvo el dictamen de Operaciones Inusuales e Internas Preocupantes, que en todo caso conserva el Oficial de Cumplimiento","El Oficial de Cumplimiento, salvo asegurar que la clave de acceso se solicite y mantenga a su nombre, que corresponde al director general o equivalente","El Oficial de Cumplimiento, todas ellas, sin que la disposición reserve alguna de esas funciones al director general"],"x":"Bancos 44ª, último párrafo: en la Entidad exenta, las funciones del Comité las ejerce el Oficial de Cumplimiento, salvo la fr. XI de la 43ª (clave de la 69ª-1 a nombre del OC o del interino), que corresponde al director general o equivalente.","ref":"Bancos 44ª últ. párr.; 43ª XI","par":"D004"},{"id":"D004","tema":"2.1.9","tipo":"caso","q":"Una institución de tecnología financiera con 18 personas a su servicio no constituye el Comité de Comunicación y Control, como se lo permite su DCG. ¿Quién ejerce las funciones que corresponderían al Comité?","a":"El Oficial de Cumplimiento, todas ellas, sin que la disposición reserve alguna de esas funciones al director general","o":["El director general de la institución, salvo el dictamen de Operaciones Inusuales e Internas Preocupantes, que en todo caso conserva el Oficial de Cumplimiento","El Oficial de Cumplimiento, salvo asegurar que la clave de acceso se solicite y mantenga a su nombre, que corresponde al director general o equivalente","El consejo de administración, salvo el dictamen de Operaciones Inusuales e Internas Preocupantes, que corresponde al Oficial de Cumplimiento","El Oficial de Cumplimiento, todas ellas, sin que la disposición reserve alguna de esas funciones al director general"],"x":"ITF art. 46, último párrafo: con menos de 25 personas «para el cumplimiento de sus fines», las funciones del art. 45 las ejerce el Oficial de Cumplimiento, sin excepción a favor del director general (el art. 45 no contiene la función de la clave).","ref":"ITF art. 46 últ. párr.; art. 45","par":"D003"},{"id":"D005","tema":"2.1.9","tipo":"caso","q":"Una unión de crédito tiene 8 personas a su servicio, 620 socios y activos totales por 70 millones de UDIS. ¿Está obligada a constituir el Comité de Comunicación y Control?","a":"Sí, porque la exención exige reunir a la vez menos de 10 personas, menos de 500 socios y activos totales por menos de 100 millones de UDIS","o":["Sí, porque la exención exige reunir a la vez menos de 10 personas, menos de 500 socios y activos totales por menos de 100 millones de UDIS","No, porque basta con cumplir dos de las tres condiciones de su DCG: menos de 10 personas y activos totales por menos de 100 millones de UDIS","No, porque basta con tener menos de 10 personas a su servicio, directas o indirectas a través de empresas de servicios complementarios","Sí, porque las uniones de crédito no tienen exención alguna y siempre deben constituirlo con al menos tres miembros"],"x":"Uniones 35ª, último párrafo: no están obligadas las Uniones con menos de 10 personas a su servicio, menos de 500 socios y activos totales por menos de 100 millones de UDIS. El texto une las tres condiciones con «y»: son acumulativas. Con 620 socios, la Unión debe constituir el Comité.","ref":"Uniones 35ª últ. párr."},{"id":"D006","tema":"2.1.9","tipo":"cifra","q":"Conforme a la DCG de Bancos, ¿qué umbral de personal libera a una institución de crédito de la obligación de constituir y mantener el Comité?","a":"Menos de 25 personas a su servicio, ya sea que realicen funciones de manera directa o indirecta a través de empresas de servicios complementarios","o":["Menos de 50 personas contratadas directamente por la institución, sin computar al personal que le preste servicios a través de empresas de servicios complementarios","Menos de 25 personas a su servicio, ya sea que realicen funciones de manera directa o indirecta a través de empresas de servicios complementarios","Menos de 25 personas contratadas directamente; el personal de empresas de servicios complementarios no se computa para el umbral","Menos de 10 personas a su servicio, siempre que además tenga menos de 500 Clientes y activos menores a 100 millones de UDIS"],"x":"Bancos 44ª, último párrafo: el umbral es menos de 25 personas a su servicio y se cuentan tanto las que trabajan directamente como las que lo hacen indirectamente a través de empresas de servicios complementarios. La combinación 10 personas · 500 socios · 100 millones de UDIS es la de Uniones.","ref":"Bancos 44ª últ. párr."},{"id":"D007","tema":"2.1.9","tipo":"trampa","q":"¿Qué sujeto NO cuenta con Comité de Comunicación y Control por diseño de su propia DCG, con independencia de su número de personas?","a":"El asesor en inversiones: su DCG prevé un Representante que concentra las funciones de dictamen y cumplimiento","o":["La unión de crédito: su DCG encarga siempre esas funciones al consejo de administración, sin órgano colegiado","El centro cambiario: su DCG sustituye el Comité por un representante designado por el administrador único","El asesor en inversiones: su DCG prevé un Representante que concentra las funciones de dictamen y cumplimiento","La casa de cambio: su DCG encarga el dictamen de operaciones directamente al Oficial de Cumplimiento, sin Comité"],"x":"La DCG de Asesores en inversiones no prevé Comité ni Oficial de Cumplimiento: la persona moral designa un Representante (2ª XXV y 30ª), que dictamina y reporta las operaciones. Uniones, Casas de cambio y Centros cambiarios sí deben tener Comité, salvo su supuesto de exención (Uniones 35ª, Casas de cambio 35a, Centros 31ª).","ref":"Asesores 2ª XXV; 30ª"},{"id":"D008","tema":"2.1.9","tipo":"caso","q":"Una Entidad sujeta a la DCG de fondos de inversión realiza exclusivamente las actividades a que se refieren la fr. V del art. 39 Bis y el último párrafo del art. 40 Bis de la Ley de Fondos de Inversión. ¿Qué estructura interna le exige su DCG?","a":"No le aplican las disposiciones del Comité ni del Oficial de Cumplimiento; su consejo designa un representante que labore en la Entidad","o":["Debe designar un Oficial de Cumplimiento dentro de las tres jerarquías inferiores al director general y queda exenta del Comité aunque tenga más de 25 personas","Su director general asume las funciones del Comité y del Oficial de Cumplimiento, sin necesidad de designación alguna","Debe constituir el Comité con al menos dos miembros de las dos jerarquías inferiores al director general, pero queda relevada de designar Oficial de Cumplimiento","No le aplican las disposiciones del Comité ni del Oficial de Cumplimiento; su consejo designa un representante que labore en la Entidad"],"x":"Fondos 42ª: las Entidades que exclusivamente realicen esas actividades no están obligadas a cumplir la 37ª a 41ª Bis (Comité, integración, sesiones, avisos, Oficial de Cumplimiento e interino) y deben designar, mediante su consejo de administración, un representante que labore en la Entidad, con las funciones de la propia 42ª.","ref":"Fondos 42ª"},{"id":"D009","tema":"2.1.9","tipo":"caso","q":"El consejo de una institución de crédito evalúa incorporar al Comité de Comunicación y Control a un funcionario cuyo cargo está en la tercera jerarquía inmediata inferior a la del director general. Conforme a su DCG, ¿puede participar como miembro?","a":"Sí, porque la DCG admite funcionarios dentro de las tres jerarquías inmediatas inferiores a la del director general","o":["Sí, porque la DCG admite funcionarios dentro de las tres jerarquías inmediatas inferiores a la del director general","No, porque sólo pueden ser miembros los consejeros y el director general, nunca los funcionarios de jerarquías inferiores a la de este","No, porque los funcionarios de jerarquías inferiores sólo pueden participar como suplentes de los consejeros, no como miembros propietarios","No, porque la DCG sólo admite funcionarios dentro de las dos jerarquías inmediatas inferiores a la del director general"],"x":"Bancos 44ª: en el Comité deben participar miembros del consejo, el director general o funcionarios que ocupen cargos dentro de las tres jerarquías inmediatas inferiores a la del director general.","ref":"Bancos 44ª","par":"D010"},{"id":"D010","tema":"2.1.9","tipo":"caso","q":"El consejo de una Entidad sujeta a la DCG de fondos de inversión evalúa incorporar al Comité de Comunicación y Control a un funcionario cuyo cargo está en la tercera jerarquía inmediata inferior a la del director general. Conforme a su DCG, ¿puede participar como miembro?","a":"No, porque la DCG sólo admite funcionarios dentro de las dos jerarquías inmediatas inferiores a la del director general","o":["No, porque los funcionarios de jerarquías inferiores sólo pueden participar como suplentes de los consejeros, no como miembros propietarios","No, porque la DCG sólo admite funcionarios dentro de las dos jerarquías inmediatas inferiores a la del director general","No, porque sólo pueden ser miembros los consejeros y el director general, nunca los funcionarios de jerarquías inferiores a la de este","Sí, porque la DCG admite funcionarios dentro de las tres jerarquías inmediatas inferiores a la del director general"],"x":"Fondos 38ª: a diferencia de Bancos, en el Comité participan miembros del consejo, el director general o funcionarios dentro de las dos jerarquías inmediatas inferiores a la del director general. Un funcionario de la tercera jerarquía no cabe.","ref":"Fondos 38ª","par":"D009"},{"id":"D011","tema":"2.1.9","tipo":"trampa","q":"En el Comité de Comunicación y Control de una institución de crédito, ¿cuál es la posición del auditor interno?","a":"No forma parte del Comité, pero participa en sus sesiones con voz y sin voto","o":["Es miembro con voz y voto, pero sólo en los asuntos relacionados con auditoría","No participa en las sesiones; únicamente recibe copia de las actas firmadas del Comité","No forma parte del Comité, pero participa en sus sesiones con voz y sin voto","Es miembro con voz y voto, aunque no puede ser designado presidente ni secretario"],"x":"Bancos 44ª: «El auditor interno o la persona del área de auditoría que él designe, no formará parte del Comité, sin perjuicio de lo cual deberá participar en las sesiones de dicho Comité con voz, pero sin voto.» Por eso no cuenta para el quórum ni vota.","ref":"Bancos 44ª"},{"id":"D012","tema":"2.1.9","tipo":"caso","q":"Una SOFOM con 40 personas a su servicio no tiene auditor interno. Conforme a su DCG, ¿quién participa en las sesiones de su Comité en lugar del auditor?","a":"El funcionario con labores equivalentes que designe el consejo o administrador único, con voz pero sin voto","o":["El auditor externo independiente, con voz y voto, mientras el consejo de la SOFOM nombra a un auditor interno","El Oficial de Cumplimiento, que en ese supuesto asume también las labores de auditoría interna, con voz y sin voto","El comisario de la sociedad, como miembro propietario del Comité y con voto de calidad en caso de empate","El funcionario con labores equivalentes que designe el consejo o administrador único, con voz pero sin voto"],"x":"SOFOM 36ª: si la Entidad no cuenta con auditor interno, el consejo de administración o administrador único designa al funcionario que desempeñe labores equivalentes, quien participa en las sesiones con voz pero sin voto. El Oficial de Cumplimiento nunca puede tener funciones de auditoría interna (39ª).","ref":"SOFOM 36ª; 39ª"},{"id":"D013","tema":"2.1.9","tipo":"caso","q":"Una institución de tecnología financiera administrada por un consejo de administración integra su Comité de Comunicación y Control. ¿Quiénes deben ser miembros conforme a su DCG?","a":"Al menos un consejero, el director general y funcionarios o empleados de las tres jerarquías inmediatas inferiores al director general","o":["Al menos un consejero, el director general y funcionarios o empleados de las tres jerarquías inmediatas inferiores al director general","El director general o, en su lugar, un consejero, más el auditor interno como miembro propietario con derecho a voto en las sesiones","Sólo funcionarios de las dos jerarquías inmediatas inferiores al director general, sin consejeros en el Comité","Al menos tres consejeros independientes, sin participación del director general ni de los funcionarios de las jerarquías inferiores a este"],"x":"ITF art. 46: si la administración está a cargo de un consejo, deben ser miembros al menos un miembro del consejo, el director general y empleados o funcionarios de las tres jerarquías inmediatas inferiores (con administrador único: el administrador único, el director general y esos funcionarios). La integración es acumulativa, no alternativa como en Bancos. El auditor participa con voz sin voto, sólo si hay área de auditoría interna.","ref":"ITF art. 46"},{"id":"D014","tema":"2.1.9","tipo":"cifra","q":"Un miembro propietario del Comité de una institución de crédito designó a su suplente. ¿En cuántas sesiones puede el suplente representarlo?","a":"Únicamente en dos sesiones no continuas por semestre","o":["Hasta en tres sesiones no continuas por año calendario","Únicamente en dos sesiones no continuas por semestre","Hasta en cuatro sesiones al año, continuas o no continuas","Únicamente en dos sesiones consecutivas por semestre"],"x":"Bancos 44ª: los miembros propietarios deben asistir a las sesiones y pueden designar suplentes, «quienes únicamente podrán representarlos en dos sesiones no continuas por semestre».","ref":"Bancos 44ª"},{"id":"D015","tema":"2.1.9","tipo":"cifra","q":"¿Con qué periodicidad mínima debe sesionar el Comité de Comunicación y Control de una institución de crédito?","a":"Al menos una vez cada mes del año","o":["Al menos una vez cada trimestre del año","Al menos una vez cada semestre, y cuando lo pida el consejo","Al menos una vez cada mes del año","Al menos una vez cada dos meses, y cuando lo pida el OC"],"x":"Bancos 44ª: «Dicho Comité sesionará con una periodicidad de al menos una vez cada mes del año.» La misma periodicidad rige en todos los sujetos que tienen Comité.","ref":"Bancos 44ª"},{"id":"D016","tema":"2.1.9","tipo":"caso","q":"El Comité de una institución de crédito tiene siete miembros. A la sesión asisten tres miembros y el auditor interno. ¿Puede celebrarse válidamente la sesión?","a":"No, porque se requiere la presencia de la mayoría de los miembros del Comité, es decir, al menos cuatro","o":["Sí, porque basta la presencia del presidente y del secretario del Comité o de sus respectivos suplentes","Sí, porque el quórum se calcula sobre los asistentes y basta con que estén presentes tres miembros","Sí, porque con el auditor interno suman cuatro asistentes, que constituyen la mayoría del Comité","No, porque se requiere la presencia de la mayoría de los miembros del Comité, es decir, al menos cuatro"],"x":"Bancos 44ª: para que las sesiones se celebren válidamente se requiere que esté presente la mayoría de los miembros del propio Comité (4 de 7). El auditor interno no es miembro (participa con voz y sin voto), por lo que no cuenta para el quórum.","ref":"Bancos 44ª"},{"id":"D017","tema":"2.1.9","tipo":"caso","q":"El Comité de una institución de crédito tiene nueve miembros y sesiona con seis presentes, incluido su presidente. Al votar el dictamen de una operación, tres votan por reportarla y tres en contra. ¿Cómo se resuelve?","a":"Decide el voto de calidad del presidente, porque se vota por mayoría de los miembros presentes","o":["Decide el voto de calidad del presidente, porque se vota por mayoría de los miembros presentes","Se pospone a la siguiente sesión, porque la decisión requiere la mayoría de la totalidad de los miembros","Decide el Oficial de Cumplimiento, por ser quien envía los reportes a la Secretaría por conducto de la Comisión","Se reporta la operación como inusual, porque ante un empate debe prevalecer el criterio de reportar"],"x":"Bancos 45ª: las decisiones se toman por el voto favorable de la mayoría de los miembros presentes en la sesión; en caso de empate, el presidente tiene voto de calidad.","ref":"Bancos 45ª"},{"id":"D018","tema":"2.1.9","tipo":"cifra","q":"El Comité de una institución de crédito tiene diez miembros y sesiona válidamente con siete presentes. ¿Cuántos votos favorables se necesitan, como mínimo, para aprobar una decisión?","a":"Cuatro, la mayoría de los miembros presentes en la sesión","o":["Cinco, las dos terceras partes de los miembros presentes","Cuatro, la mayoría de los miembros presentes en la sesión","Seis, la mayoría de la totalidad de los miembros del Comité","Siete, porque el dictamen exige unanimidad de los presentes"],"x":"Son dos reglas distintas: el quórum de instalación es la mayoría de los miembros del Comité (Bancos 44ª: 6 de 10, cumplido con 7); la votación es por mayoría de los miembros presentes (45ª: 4 de 7).","ref":"Bancos 44ª; 45ª"},{"id":"D019","tema":"2.1.9","tipo":"caso","q":"Una unión de crédito conserva los documentos en los que constan las justificaciones por las que su Comité determinó reportar o no las operaciones analizadas en cada sesión. ¿Qué plazo de conservación fija la disposición de su DCG que regula las actas del Comité?","a":"Al menos diez años contados a partir de la fecha en que se generen esos documentos","o":["Al menos cinco años contados a partir de la sesión en que se analizaron las operaciones","Mientras subsista la relación con el Cliente y hasta un año después de terminada","Al menos diez años contados a partir de la fecha en que se generen esos documentos","No fija un plazo propio; sólo exige conservarlos debidamente resguardados"],"x":"Uniones 36ª: las Uniones deben conservar debidamente resguardados, durante al menos diez años contados a partir de la fecha en que se generen, los documentos con las justificaciones de reportar o no cada operación analizada. Es la única DCG de este tema que fija el plazo en esa disposición.","ref":"Uniones 36ª","par":"D020"},{"id":"D020","tema":"2.1.9","tipo":"caso","q":"Una institución de crédito conserva los documentos en los que constan las justificaciones por las que su Comité determinó reportar o no las operaciones analizadas en cada sesión. ¿Qué plazo de conservación fija la disposición de su DCG que regula las actas del Comité?","a":"No fija un plazo propio; sólo exige conservarlos debidamente resguardados","o":["Mientras subsista la relación con el Cliente y hasta un año después de terminada","Al menos diez años contados a partir de la fecha en que se generen esos documentos","Al menos cinco años contados a partir de la sesión en que se analizaron las operaciones","No fija un plazo propio; sólo exige conservarlos debidamente resguardados"],"x":"Bancos 45ª: las Entidades deben conservar debidamente resguardados los documentos con las justificaciones por las que se determinó reportar o no cada operación analizada, pero la disposición no fija un plazo propio (a diferencia de Uniones 36ª, que fija al menos diez años).","ref":"Bancos 45ª","par":"D019"},{"id":"D021","tema":"2.1.9","tipo":"memoria","q":"¿Quién debe firmar el acta de cada sesión del Comité de Comunicación y Control de una institución de crédito?","a":"El presidente y el secretario del Comité o, en su caso, sus respectivos suplentes","o":["El presidente y el secretario del Comité o, en su caso, sus respectivos suplentes","El presidente del Comité y el Oficial de Cumplimiento, con el visto bueno del auditor","Todos los miembros presentes en la sesión y el auditor interno, como testigo","El secretario del Comité y el director general, como representante del consejo"],"x":"Bancos 45ª: de cada sesión se levanta un acta con las resoluciones adoptadas, firmada por el presidente y el secretario del Comité o, en su caso, por sus respectivos suplentes. Presidente y secretario se designan de entre los miembros (44ª).","ref":"Bancos 45ª; 44ª"},{"id":"D022","tema":"2.1.9","tipo":"caso","q":"Una SOFOM no cuenta con comité de auditoría y su Oficial de Cumplimiento ya elaboró el Manual de Cumplimiento. Conforme a su DCG, ¿quién aprueba el Manual?","a":"Su propio Comité de Comunicación y Control, o bien, su consejo de administración o su director general","o":["El comisario de la sociedad, previa opinión favorable del Oficial de Cumplimiento y del auditor interno","Su propio Comité de Comunicación y Control, o bien, su consejo de administración o su director general","Únicamente su propio Comité de Comunicación y Control, sin que el consejo de administración ni el director general puedan aprobarlo","La Comisión, a la que la entidad remite el Manual para su aprobación previa a su aplicación interna"],"x":"SOFOM 35ª I: el Comité somete el Manual a la aprobación del comité de auditoría; si la Entidad no tiene comité de auditoría, lo aprueba su propio Comité, o bien su consejo de administración o director general. Es la regla más abierta del tema.","ref":"SOFOM 35ª I","par":"D023"},{"id":"D023","tema":"2.1.9","tipo":"caso","q":"Una casa de cambio no cuenta con comité de auditoría y su Oficial de Cumplimiento ya elaboró el Manual de Cumplimiento. Conforme a su DCG, ¿quién aprueba el Manual?","a":"Su propio Comité de Comunicación y Control","o":["El comisario de la sociedad, previa opinión favorable del Oficial de Cumplimiento y del auditor interno","Su propio Comité de Comunicación y Control, o bien, su consejo de administración o su director general","Su propio Comité de Comunicación y Control","La Comisión, a la que la entidad remite el Manual para su aprobación previa a su aplicación interna"],"x":"Casas de cambio 34a I: sin comité de auditoría, «corresponderá a su propio Comité aprobar» el Manual. La misma solución tienen Fondos (37ª I), SOCAP (47ª I), Centros (30ª I) y Transmisores (32ª I); SOFOM admite además al consejo o al director general.","ref":"Casas de cambio 34a I","par":"D022"},{"id":"D024","tema":"2.1.9","tipo":"trampa","q":"En una institución de crédito, ¿cómo se reparten la elaboración y la aprobación del Manual de Cumplimiento?","a":"El Oficial de Cumplimiento lo elabora y lo somete al Comité, y el Comité lo somete a la aprobación del comité de auditoría","o":["El Comité lo elabora y el Oficial de Cumplimiento lo somete directamente a la aprobación del consejo de administración","El Oficial de Cumplimiento lo elabora y el Comité lo aprueba en definitiva, sin intervención de otro órgano de la institución","El área de auditoría interna lo elabora y el Comité lo aprueba en definitiva, con aviso posterior al comité de auditoría","El Oficial de Cumplimiento lo elabora y lo somete al Comité, y el Comité lo somete a la aprobación del comité de auditoría"],"x":"Bancos 47ª I: el OC elabora y somete a la consideración del Comité el Manual. Bancos 43ª I: el Comité lo somete, con cualquier modificación, a la aprobación del comité de auditoría. En Bancos, el Comité no lo aprueba en definitiva.","ref":"Bancos 43ª I; 47ª I"},{"id":"D025","tema":"2.1.9","tipo":"trampa","q":"El área del Oficial de Cumplimiento de una institución de crédito concluyó la investigación de una alerta. ¿Quién dictamina si la operación se reporta como inusual y quién envía el reporte?","a":"El Comité la dictamina y el Oficial de Cumplimiento envía el reporte a la Secretaría, por conducto de la Comisión","o":["El Comité la dictamina y el Oficial de Cumplimiento envía el reporte a la Secretaría, por conducto de la Comisión","El Oficial de Cumplimiento la dictamina y el Comité envía el reporte a la Secretaría, por conducto de la Comisión","El auditor interno la dictamina y el Oficial de Cumplimiento envía el reporte a la Secretaría, por conducto de la Comisión","El Comité la dictamina y el director general firma y envía el reporte a la Secretaría, por conducto de la Comisión"],"x":"Bancos 43ª VI: el Comité dictamina las operaciones que deban reportarse como Inusuales o Internas Preocupantes. Bancos 47ª V y VI: el OC coordina el seguimiento e investigaciones para que el Comité dictamine, y envía los reportes, informando al Comité en su siguiente sesión.","ref":"Bancos 43ª VI; 47ª V–VI"},{"id":"D026","tema":"2.1.9","tipo":"caso","q":"El Oficial de Cumplimiento de un centro cambiario prepara el informe que presentará al Comité para efectos de la fracción III de la disposición que fija las funciones del Comité. Conforme a esa fracción, ¿de qué debe conocer el Comité?","a":"De la celebración de Operaciones cuyas características pudieran generar un alto Riesgo","o":["De los Usuarios que por sus características se clasifiquen con Grado de Riesgo alto","De la celebración de Operaciones cuyas características pudieran generar un alto Riesgo","De los Clientes que por sus características se clasifiquen con Grado de Riesgo alto","De las Operaciones realizadas con personas incluidas en la Lista de Personas Bloqueadas durante el mes"],"x":"Centros 30ª III: el Comité conoce de la celebración de Operaciones cuyas características pudieran generar un alto Riesgo para el Centro Cambiario y formula recomendaciones. No se refiere a Clientes ni a Usuarios de riesgo alto (lo mismo ocurre en ITF art. 45 IV).","ref":"Centros 30ª III","par":"D027"},{"id":"D027","tema":"2.1.9","tipo":"caso","q":"El Oficial de Cumplimiento de una casa de cambio prepara el informe que presentará al Comité para efectos de la fracción III de la disposición que fija las funciones del Comité. Conforme a esa fracción, ¿de qué debe conocer el Comité?","a":"De los Usuarios que por sus características se clasifiquen con Grado de Riesgo alto","o":["De la celebración de Operaciones cuyas características pudieran generar un alto Riesgo","De las Operaciones realizadas con personas incluidas en la Lista de Personas Bloqueadas durante el mes","De los Usuarios que por sus características se clasifiquen con Grado de Riesgo alto","De los Clientes que por sus características se clasifiquen con Grado de Riesgo alto"],"x":"Casas de cambio 34a III: el Comité conoce de los Usuarios clasificados con Grado de Riesgo alto, conforme a los informes del OC (igual Transmisores, 32ª III). Bancos habla de Clientes (43ª III); Centros e ITF, de Operaciones de alto Riesgo.","ref":"Casas de cambio 34a III","par":"D026"},{"id":"D028","tema":"2.1.9","tipo":"caso","q":"Una institución de crédito prepara su programa anual de capacitación en PLD/FT. ¿Qué papel tienen el Comité y el Oficial de Cumplimiento?","a":"El Oficial de Cumplimiento define sus características, contenido y alcance, y el Comité aprueba los programas","o":["El Oficial de Cumplimiento define y aprueba los programas, y sólo informa al Comité en la siguiente sesión","El Comité define y aprueba los programas, y el área de recursos humanos los somete al comité de auditoría","El Comité define sus características, contenido y alcance, y el Oficial de Cumplimiento aprueba los programas","El Oficial de Cumplimiento define sus características, contenido y alcance, y el Comité aprueba los programas"],"x":"Bancos 47ª VIII: el OC define las características, contenido y alcance de los programas de capacitación (49ª). Bancos 43ª VII: el Comité aprueba los programas de capacitación del personal.","ref":"Bancos 43ª VII; 47ª VIII"},{"id":"D029","tema":"2.1.9","tipo":"caso","q":"El consejo de una institución de crédito designó el 2 de marzo las áreas cuyos titulares integrarán el Comité. ¿En qué plazo debe comunicar la integración inicial a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 15 días hábiles siguientes a la fecha en que el consejo designó las áreas","o":["Dentro de los 15 días hábiles siguientes a la fecha en que el consejo designó las áreas","Dentro de los 15 días naturales siguientes a la primera sesión que celebre el Comité","Dentro de los 10 días hábiles siguientes a la primera sesión que celebre el Comité","Dentro de los 30 días hábiles siguientes a la fecha en que el consejo designó las áreas"],"x":"Bancos 46ª: la integración inicial (nombre y apellidos sin abreviaturas y cargo de titulares y suplentes) se comunica dentro de los 15 días hábiles siguientes a la fecha en que el consejo designó las áreas. La designación, adición o sustitución de integrantes también se informa dentro de 15 días hábiles.","ref":"Bancos 46ª"},{"id":"D030","tema":"2.1.9","tipo":"cifra","q":"Una institución de tecnología financiera reduce su personal a 20 personas para el cumplimiento de sus fines y queda en el supuesto de no estar obligada a mantener el Comité. ¿En qué plazo debe comunicar esa situación a la Secretaría?","a":"Dentro de 60 días hábiles contados a partir de la fecha en que se reduzca el número de personas contratadas","o":["Dentro de 30 días hábiles contados a partir de la fecha en que se reduzca el número de personas contratadas","Dentro de 60 días hábiles contados a partir de la fecha en que se reduzca el número de personas contratadas","Dentro de 60 días naturales contados a partir de la fecha en que se reduzca el número de personas","Dentro de los 15 días hábiles siguientes a la fecha en que el consejo de administración acuerde disolver el Comité"],"x":"ITF art. 48, último párrafo: la ITF en el supuesto del último párrafo del art. 46 comunica esa situación dentro de 60 días hábiles contados desde su autorización o desde que se reduzca el número de personas contratadas. Los avisos de integración y cambios del Comité son de 15 días hábiles, como en Bancos.","ref":"ITF art. 48"},{"id":"D031","tema":"2.1.10","tipo":"memoria","q":"En una institución de crédito que sí tiene Comité, ¿quién designa al Oficial de Cumplimiento y de entre quiénes?","a":"El consejo de administración o directivo, o el Comité, de entre los miembros del Comité","o":["El director general, de entre los funcionarios de las tres jerarquías inferiores a él","La asamblea de accionistas, de entre los consejeros independientes de la institución","El consejo de administración o directivo, o el Comité, de entre los miembros del Comité","El comité de auditoría, de entre los titulares de áreas ajenas a la promoción de productos"],"x":"Bancos 47ª: «El consejo de administración, directivo o el Comité de cada Entidad designará, de entre los miembros de dicho Comité, a un funcionario que se denominará Oficial de Cumplimiento.» Además debe ocupar un cargo dentro de las tres jerarquías inmediatas inferiores a la del director general.","ref":"Bancos 47ª"},{"id":"D032","tema":"2.1.10","tipo":"caso","q":"Una institución de crédito con 20 personas a su servicio no tiene Comité. ¿Quién designa a su Oficial de Cumplimiento y qué requisito debe reunir el designado?","a":"Su consejo de administración o directivo; el designado debe cumplir los requisitos para ser integrante del Comité","o":["Su director general; basta con que el designado sea empleado de la institución y no tenga funciones de auditoría","La Comisión, a propuesta del consejo de administración; el designado debe elegirse de entre funcionarios ya certificados","Su comité de auditoría; el designado debe ser un consejero independiente con experiencia en la materia","Su consejo de administración o directivo; el designado debe cumplir los requisitos para ser integrante del Comité"],"x":"Bancos 47ª, segundo párrafo: si la Entidad no cuenta con Comité por ubicarse en el último párrafo de la 44ª, el OC lo designa su consejo de administración o directivo, y debe cumplir los requisitos para ser integrante del Comité.","ref":"Bancos 47ª; 44ª últ. párr."},{"id":"D033","tema":"2.1.10","tipo":"caso","q":"El consejo de una institución de crédito propone como Oficial de Cumplimiento a su gerente de crédito y captación, área que promueve los productos financieros de la entidad. Respecto del requisito de independencia, ¿es válida la designación?","a":"No, porque el OC debe ser independiente de las unidades encargadas de promover o gestionar los productos o servicios financieros","o":["No, porque el OC debe ser independiente de las unidades encargadas de promover o gestionar los productos o servicios financieros","No, porque el OC sólo puede designarse de entre consejeros que no desempeñen funciones ejecutivas ni comerciales en la entidad de que se trate","Sí, porque su DCG releva del requisito de independencia a la entidad que se ubica en el supuesto de exención del Comité","Sí, siempre que el auditor interno avale por escrito la designación y esta se informe al Comité en su siguiente sesión"],"x":"Bancos 47ª: la designación del OC debe recaer en un funcionario independiente de las unidades encargadas de promover o gestionar los productos o servicios financieros que la Entidad ofrezca a sus Clientes o Usuarios.","ref":"Bancos 47ª","par":"D034"},{"id":"D034","tema":"2.1.10","tipo":"caso","q":"El consejo de una sociedad cooperativa de ahorro y préstamo de nivel de operación I propone como Oficial de Cumplimiento a su gerente de crédito y captación, área que promueve los productos financieros de la entidad. Respecto del requisito de independencia, ¿es válida la designación?","a":"Sí, porque su DCG releva del requisito de independencia a la entidad que se ubica en el supuesto de exención del Comité","o":["No, porque el OC sólo puede designarse de entre consejeros que no desempeñen funciones ejecutivas ni comerciales en la entidad de que se trate","Sí, porque su DCG releva del requisito de independencia a la entidad que se ubica en el supuesto de exención del Comité","Sí, siempre que el auditor interno avale por escrito la designación y esta se informe al Comité en su siguiente sesión","No, porque el OC debe ser independiente de las unidades encargadas de promover o gestionar los productos o servicios financieros"],"x":"SOCAP 51ª: la independencia se exige «salvo que se cumpla con el criterio establecido en el último párrafo de la 48ª», es decir, que la Sociedad tenga nivel de operación I. En ese caso la DCG no la exige; la prohibición de funciones de auditoría interna sí se mantiene.","ref":"SOCAP 51ª; 48ª últ. párr.","par":"D033"},{"id":"D035","tema":"2.1.10","tipo":"caso","q":"Una unión de crédito tiene 8 personas a su servicio y activos totales por 60 millones de UDIS, y cuenta con 300 socios. Designa como Oficial de Cumplimiento a su gerente comercial, que promueve sus productos. ¿Cumple el requisito de independencia?","a":"Sí, porque su DCG no exige la independencia cuando la entidad se ubica en el supuesto de exención del Comité","o":["No, porque en ese supuesto el cargo de OC corresponde necesariamente al director general o a su equivalente en la entidad","Sí, porque el requisito de independencia sólo se exige a las entidades que forman parte de un grupo financiero","Sí, porque su DCG no exige la independencia cuando la entidad se ubica en el supuesto de exención del Comité","No, porque su DCG exige que el OC sea independiente de las unidades que promueven sus productos, aun sin Comité"],"x":"Uniones 38ª: la independencia de las unidades de promoción se exige «salvo que se cumpla con el criterio establecido en el último párrafo de la 35ª» (menos de 10 personas, menos de 500 socios y activos por menos de 100 millones de UDIS, a la vez). Esta Unión reúne las tres condiciones.","ref":"Uniones 38ª; 35ª últ. párr.","par":"D036"},{"id":"D036","tema":"2.1.10","tipo":"caso","q":"Una sociedad financiera popular tiene 8 personas a su servicio y activos totales por 60 millones de UDIS, y cuenta con 300 socios. Designa como Oficial de Cumplimiento a su gerente comercial, que promueve sus productos. ¿Cumple el requisito de independencia?","a":"No, porque su DCG exige que el OC sea independiente de las unidades que promueven sus productos, aun sin Comité","o":["No, porque en ese supuesto el cargo de OC corresponde necesariamente al director general o a su equivalente en la entidad","Sí, porque el requisito de independencia sólo se exige a las entidades que forman parte de un grupo financiero","Sí, porque su DCG no exige la independencia cuando la entidad se ubica en el supuesto de exención del Comité","No, porque su DCG exige que el OC sea independiente de las unidades que promueven sus productos, aun sin Comité"],"x":"SOFIPO 50ª: el OC debe ser independiente de las unidades que promueven o gestionan los productos, sin salvedad. Aunque la SOFIPO esté exenta del Comité por tener menos de 25 personas (47ª), la independencia se mantiene.","ref":"SOFIPO 50ª; 47ª últ. párr.","par":"D035"},{"id":"D037","tema":"2.1.10","tipo":"trampa","q":"Una institución de crédito pretende que su contralor, quien tiene funciones de auditoría interna, sea Oficial de Cumplimiento. ¿Qué afirmación es correcta?","a":"No puede, ni como titular ni como interino: la DCG prohíbe que el cargo recaiga en quien tenga funciones de auditoría interna","o":["No puede, ni como titular ni como interino: la DCG prohíbe que el cargo recaiga en quien tenga funciones de auditoría interna","Puede sólo como interino, hasta por 90 días naturales durante un año calendario, mientras el consejo designa a un nuevo titular","Puede, si el Comité aprueba la designación por mayoría de sus miembros y se informa a la Comisión dentro de 2 días hábiles","Puede, si la institución tiene menos de 25 personas a su servicio y, por tanto, está exenta de constituir y mantener el Comité"],"x":"Bancos 47ª: «En ningún caso, la designación del Oficial de Cumplimiento de una Entidad podrá recaer en persona que tenga funciones de auditoría interna.» Bancos 47ª Bis: el interino tampoco debe tener funciones de auditoría interna.","ref":"Bancos 47ª; 47ª Bis"},{"id":"D038","tema":"2.1.10","tipo":"caso","q":"Una SOFOM administrada por un administrador único sí tiene Comité de Comunicación y Control. ¿Quién puede designar a su Oficial de Cumplimiento?","a":"El administrador único o el Comité, de entre los miembros del Comité","o":["El director general, de entre los funcionarios de las tres jerarquías inferiores a él","El administrador único o el Comité, de entre los miembros del Comité","Sólo la asamblea de accionistas, porque la SOFOM no tiene consejo de administración","El Comité, de entre funcionarios que no sean sus miembros, para preservar su independencia"],"x":"SOFOM 39ª: «El consejo de administración, el administrador único o el Comité de cada Entidad designará, de entre los miembros de dicho Comité», al Oficial de Cumplimiento.","ref":"SOFOM 39ª"},{"id":"D039","tema":"2.1.10","tipo":"caso","q":"Una institución de crédito designa como Oficial de Cumplimiento a un funcionario que no cuenta con la certificación de la Comisión. Conforme a su DCG, ¿qué requisito de certificación aplica al cargo?","a":"Debe contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","o":["Su DCG no prevé un requisito de certificación para el Oficial de Cumplimiento","Debe obtener la certificación dentro de los 90 días naturales siguientes a su designación","Debe contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","Basta con la certificación del auditor externo independiente que evalúa anualmente a la entidad"],"x":"Bancos 47ª (párrafo adicionado DOF 28-ago-2024): el OC debe contar con la certificación vigente del art. 4, fr. X de la LCNBV. El plazo transitorio de 12 meses (Trans. Tercera IV) ya transcurrió, así que el requisito es exigible.","ref":"Bancos 47ª; Trans. Tercera IV (2024)","par":"D040"},{"id":"D040","tema":"2.1.10","tipo":"caso","q":"Una SOFOM designa como Oficial de Cumplimiento a un funcionario que no cuenta con la certificación de la Comisión. Conforme a su DCG, ¿qué requisito de certificación aplica al cargo?","a":"Su DCG no prevé un requisito de certificación para el Oficial de Cumplimiento","o":["Debe contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","Basta con la certificación del auditor externo independiente que evalúa anualmente a la entidad","Debe obtener la certificación dentro de los 90 días naturales siguientes a su designación","Su DCG no prevé un requisito de certificación para el Oficial de Cumplimiento"],"x":"SOFOM 39ª: su DCG no prevé requisito de certificación para el OC. Dentro de las DCG, lo exigen expresamente Bancos (47ª, «vigente») e ITF (art. 50 IV, «haber obtenido»).","ref":"SOFOM 39ª","par":"D039"},{"id":"D041","tema":"2.1.10","tipo":"memoria","q":"¿Cómo formula la DCG de Bancos el requisito de certificación del Oficial de Cumplimiento?","a":"Contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","o":["Contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","Haber obtenido la certificación del art. 4, fr. X de la Ley de la CNBV, conforme al art. 58, párrafo quinto, de la Ley Fintech","Renovar cada año ante la Comisión la certificación, antes de que la entidad presente el aviso de designación","Contar con la acreditación de la Secretaría como experto independiente en prevención de operaciones con recursos de procedencia ilícita"],"x":"Bancos 47ª: «deberá contar con la certificación vigente prevista en el artículo 4, fracción X de la Ley de la Comisión Nacional Bancaria y de Valores» (DOF 28-ago-2024).","ref":"Bancos 47ª","par":"D042"},{"id":"D042","tema":"2.1.10","tipo":"memoria","q":"¿Cómo formula la DCG de las ITF el requisito de certificación del Oficial de Cumplimiento?","a":"Haber obtenido la certificación del art. 4, fr. X de la Ley de la CNBV, conforme al art. 58, párrafo quinto, de la Ley Fintech","o":["Contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","Haber obtenido la certificación del art. 4, fr. X de la Ley de la CNBV, conforme al art. 58, párrafo quinto, de la Ley Fintech","Renovar cada año ante la Comisión la certificación, antes de que la entidad presente el aviso de designación","Contar con la acreditación de la Secretaría como experto independiente en prevención de operaciones con recursos de procedencia ilícita"],"x":"ITF art. 50 IV: requisito de «Haber obtenido la certificación prevista en el artículo 4, fracción X» de la LCNBV, «de conformidad con el artículo 58, párrafo quinto de la Ley». La DCG no dice «vigente» ni fija plazo.","ref":"ITF art. 50 IV","par":"D041"},{"id":"D043","tema":"2.1.10","tipo":"cifra","q":"¿Qué plazo otorgó la reforma a la DCG de Bancos publicada en el DOF el 28 de agosto de 2024 para que el Oficial de Cumplimiento cuente con la certificación vigente?","a":"Doce meses contados a partir de la entrada en vigor de la resolución","o":["Seis meses contados a partir de la designación de cada Oficial de Cumplimiento","Doce meses contados a partir de que la Secretaría publique el formato oficial","Doce meses contados a partir de la entrada en vigor de la resolución","Dieciocho meses contados a partir de la entrada en vigor de la resolución"],"x":"Bancos, Trans. Tercera fr. IV de la resolución DOF 28-ago-2024: doce meses desde su entrada en vigor (al día siguiente de su publicación, Trans. Primera). Los dieciocho meses son para modificar el Manual (fr. I) y actualizar los sistemas automatizados (fr. III).","ref":"Bancos Trans. Tercera IV (2024)"},{"id":"D044","tema":"2.1.10","tipo":"trampa","q":"¿Qué afirmación sobre la certificación del Oficial de Cumplimiento de una casa de bolsa es correcta conforme a su DCG?","a":"Su DCG no prevé un requisito de certificación para el Oficial de Cumplimiento","o":["Debe contar con la certificación vigente, igual que en Bancos, desde la reforma de 2024","Sólo la requiere cuando el OC es común a otras entidades del mismo grupo financiero","Debe haber obtenido la certificación antes de su designación, igual que en las ITF","Su DCG no prevé un requisito de certificación para el Oficial de Cumplimiento"],"x":"Casas de bolsa 48ª: regula designación, jerarquía, independencia, prohibición de auditoría interna y OC común en grupo financiero, pero no prevé certificación. La reforma de 2024 sólo modificó la DCG de Bancos; la exigencia de ITF está en su art. 50 IV.","ref":"Casas de bolsa 48ª"},{"id":"D045","tema":"2.1.10","tipo":"caso","q":"El Oficial de Cumplimiento de una institución de crédito concluyó el diseño de la metodología de evaluación de Riesgos. Conforme a su DCG, ¿qué debe hacer con ella?","a":"Someterla a la aprobación del Comité, junto con los resultados de su implementación","o":["Someterla a la aprobación del Comité, junto con los resultados de su implementación","Presentarla al consejo, que la aprueba sin intervención del Comité de Comunicación y Control","Someterla a la aprobación del comité de auditoría, en los mismos términos que el Manual","Remitirla a la Comisión para su aprobación previa a su implementación en la institución"],"x":"Bancos 47ª I Bis: el OC somete a la aprobación del Comité la metodología de evaluación de Riesgos y los resultados de su implementación. Después, el Comité presenta al consejo los resultados de la implementación (43ª I Bis).","ref":"Bancos 47ª I Bis; 43ª I Bis"},{"id":"D046","tema":"2.1.10","tipo":"caso","q":"El Oficial de Cumplimiento de una institución de crédito envió a la Secretaría, por conducto de la Comisión, un reporte que consideró urgente. ¿Qué debe hacer después respecto del Comité?","a":"Informar de ello al Comité en su siguiente sesión","o":["Pedir a la Comisión que retenga el reporte hasta el dictamen","Informar de ello al Comité en su siguiente sesión","Informar al comité de auditoría dentro de 10 días hábiles","Pedir al Comité que ratifique el dictamen dentro de 24 horas"],"x":"Bancos 47ª VI: el OC envía los reportes de operaciones de la 41ª y los que considere urgentes, «e informar de ello al Comité, en su siguiente sesión».","ref":"Bancos 47ª VI"},{"id":"D047","tema":"2.1.10","tipo":"caso","q":"Antes de que el Comité de una institución de crédito dictamine un lote de operaciones, ¿qué debe verificar el área a cargo del Oficial de Cumplimiento o el personal que este designe?","a":"Que se hayan analizado las alertas correspondientes y documentado las investigaciones respectivas","o":["Que el auditor interno haya validado por escrito cada operación antes de presentarla al Comité","Que cada Cliente involucrado haya sido entrevistado y haya actualizado su expediente de identificación","Que se hayan analizado las alertas correspondientes y documentado las investigaciones respectivas","Que la Comisión haya emitido opinión previa sobre las operaciones que se someterán a dictamen"],"x":"Bancos 47ª V: el OC coordina el seguimiento de operaciones y las investigaciones para que el Comité cuente con los elementos para dictaminarlas; para ello, su área o el personal que designe verifica que se hayan analizado las alertas y documentado las investigaciones.","ref":"Bancos 47ª V"},{"id":"D048","tema":"2.1.10","tipo":"caso","q":"Por conducto de la Comisión llega a una institución de crédito una orden de aseguramiento de cuentas emitida por la autoridad competente en materia de PLD/FT. ¿A quién corresponde recibirla y verificar que la institución dé respuesta?","a":"Al Oficial de Cumplimiento","o":["Al Comité, en su siguiente sesión","Al director jurídico, sin participación del OC","Al auditor interno de la institución","Al Oficial de Cumplimiento"],"x":"Bancos 47ª IX: el OC recibe y verifica que la Entidad dé respuesta a los requerimientos de información y documentación y a las órdenes de aseguramiento o desbloqueo de cuentas que formulen las autoridades por conducto de la Comisión.","ref":"Bancos 47ª IX"},{"id":"D049","tema":"2.1.10","tipo":"caso","q":"Un cajero de una institución de crédito advierte un hecho de su jefe inmediato que podría constituir una Operación Interna Preocupante. ¿Qué área debe recibir directamente su aviso y darle seguimiento?","a":"El área a cargo del Oficial de Cumplimiento","o":["El área a cargo del Oficial de Cumplimiento","El superior jerárquico del jefe, que decide si lo turna","El área de auditoría interna, que lo dictamina de inmediato","El Comité, que lo recibe en sesión extraordinaria"],"x":"Bancos 47ª XI: el OC debe cerciorarse de que el área a su cargo reciba directamente y dé seguimiento a los reportes de empleados y funcionarios sobre hechos y actos susceptibles de ser Operaciones Inusuales o Internas Preocupantes (51ª VIII).","ref":"Bancos 47ª XI"},{"id":"D050","tema":"2.1.10","tipo":"caso","q":"El Oficial de Cumplimiento de una institución de crédito renuncia y deja el puesto. Conforme a su DCG, ¿qué procede respecto del cargo?","a":"Puede nombrarse un OC interino hasta por 90 días naturales durante un año calendario, contados desde que el OC deja el cargo","o":["El director general asume el cargo hasta que el consejo designe a un nuevo OC, sin que la DCG fije un plazo máximo para hacerlo","Puede nombrarse un OC interino hasta por 90 días naturales durante un año calendario, contados desde que el OC deja el cargo","Debe designarse un interino por 30 días hábiles, prorrogables una sola vez con autorización de la Comisión","Debe designarse un nuevo OC al día hábil siguiente; el interinato sólo procede cuando el OC está imposibilitado"],"x":"Bancos 47ª Bis: el Comité, el consejo o el director general podrá nombrar un OC interino hasta por 90 días naturales durante un año calendario, contados desde que el OC deje el cargo, le sea revocado o esté imposibilitado.","ref":"Bancos 47ª Bis","par":"D051"},{"id":"D051","tema":"2.1.10","tipo":"caso","q":"El Oficial de Cumplimiento de una institución de tecnología financiera renuncia y deja el puesto. Conforme a su DCG, ¿qué procede respecto del cargo?","a":"Debe designarse un nuevo OC al día hábil siguiente; el interinato sólo procede cuando el OC está imposibilitado","o":["El director general asume el cargo hasta que el consejo designe a un nuevo OC, sin que la DCG fije un plazo máximo para hacerlo","Puede nombrarse un OC interino hasta por 90 días naturales durante un año calendario, contados desde que el OC deja el cargo","Debe designarse un nuevo OC al día hábil siguiente; el interinato sólo procede cuando el OC está imposibilitado","Debe designarse un interino por 30 días hábiles, prorrogables una sola vez con autorización de la Comisión"],"x":"ITF art. 49: la designación del nuevo OC debe hacerse al día hábil siguiente a que el anterior deje el puesto, le sea revocado o quede imposibilitado; sólo en este último caso cabe el interino del art. 52 (hasta 90 días naturales por año calendario, de forma ininterrumpida o intermitente).","ref":"ITF arts. 49; 52","par":"D050"},{"id":"D052","tema":"2.1.10","tipo":"cifra","q":"¿Hasta por cuánto tiempo puede desempeñarse un Oficial de Cumplimiento interino en una institución de crédito?","a":"Hasta por 90 días naturales durante un año calendario","o":["Hasta por 60 días naturales, prorrogables por igual plazo","Hasta por 90 días hábiles por cada ausencia del titular","Hasta por seis meses contados desde la revocación del titular","Hasta por 90 días naturales durante un año calendario"],"x":"Bancos 47ª Bis: «hasta por noventa días naturales durante un año calendario». El mismo límite rige en todos los sujetos que prevén interino; Asesores en inversiones no lo prevé.","ref":"Bancos 47ª Bis"},{"id":"D053","tema":"2.1.10","tipo":"caso","q":"El Oficial de Cumplimiento de una institución de crédito queda imposibilitado. ¿Quién puede nombrar a un Oficial de Cumplimiento interino?","a":"El Comité, el consejo de administración o directivo, o el director general","o":["El Comité, el consejo de administración o directivo, o el director general","El propio OC imposibilitado, mediante designación por escrito al Comité","Sólo el consejo de administración, con aviso previo a la Comisión","Sólo el Comité, de entre sus miembros, por mayoría de los presentes"],"x":"Bancos 47ª Bis: «El Comité de cada Entidad o bien, su consejo de administración o directivo, según corresponda, o director general, podrá nombrar a un Oficial de Cumplimiento Interino». El interino no debe tener funciones de auditoría interna.","ref":"Bancos 47ª Bis"},{"id":"D054","tema":"2.1.10","tipo":"caso","q":"En marzo y abril, una institución de crédito tuvo un Oficial de Cumplimiento interino durante 50 días naturales. En octubre del mismo año el titular vuelve a quedar imposibilitado. ¿Por cuánto tiempo más puede nombrar un interino en ese año calendario?","a":"Hasta 40 días naturales, porque el límite es de 90 días naturales durante un año calendario","o":["Hasta 40 días naturales, siempre que la Comisión autorice previamente fraccionar el periodo","Hasta 40 días naturales, porque el límite es de 90 días naturales durante un año calendario","Hasta 40 días hábiles, porque el límite es de 90 días hábiles durante un año calendario","Hasta 90 días naturales más, porque el plazo se renueva con cada nueva ausencia del titular"],"x":"Bancos 47ª Bis: el límite es de 90 días naturales durante un año calendario, y las Entidades pueden hacer efectivo el periodo de interinato conforme a sus necesidades (no exige autorización). Ya usó 50, le quedan 40.","ref":"Bancos 47ª Bis"},{"id":"D055","tema":"2.1.10","tipo":"caso","q":"Una institución de crédito designa a un nuevo Oficial de Cumplimiento. ¿En qué plazo debe informar su nombre a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 2 días hábiles siguientes a la designación","o":["Dentro de los 15 días hábiles siguientes a la designación","Al día hábil siguiente a la fecha de la designación","Dentro de los 2 días hábiles siguientes a la designación","Dentro de los 10 días hábiles siguientes a la designación"],"x":"Bancos 48ª I (modificada DOF 28-ago-2024): el nombre completo sin abreviaturas del OC se informa dentro de los 2 días hábiles siguientes a la designación. Sólo Casas de cambio (39a I) comparte ese plazo.","ref":"Bancos 48ª I","par":"D056"},{"id":"D056","tema":"2.1.10","tipo":"caso","q":"Una SOFOM designa a un nuevo Oficial de Cumplimiento. ¿En qué plazo debe informar su nombre a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 10 días hábiles siguientes a la designación","o":["Dentro de los 2 días hábiles siguientes a la designación","Al día hábil siguiente a la fecha de la designación","Dentro de los 15 días hábiles siguientes a la designación","Dentro de los 10 días hábiles siguientes a la designación"],"x":"SOFOM 40ª I: dentro de los 10 días hábiles siguientes a la designación. Es el plazo de la mayoría de los sujetos; Bancos y Casas de cambio tienen 2 días hábiles, y el Representante de Asesores, 15.","ref":"SOFOM 40ª I","par":"D055"},{"id":"D057","tema":"2.1.10","tipo":"caso","q":"Una casa de cambio designa a la persona que ejercerá las funciones de cumplimiento previstas en su DCG (Oficial de Cumplimiento o Representante, según el caso). ¿En qué plazo debe informar su nombre a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 2 días hábiles siguientes a la designación","o":["Dentro de los 2 días hábiles siguientes a la designación","Al día hábil siguiente a la fecha de la designación","Dentro de los 15 días hábiles siguientes a la designación","Dentro de los 10 días hábiles siguientes a la designación"],"x":"Casas de cambio 39a I: el nombre del OC se informa dentro de los 2 días hábiles siguientes a su designación, igual que en Bancos (48ª I).","ref":"Casas de cambio 39a I","par":"D058"},{"id":"D058","tema":"2.1.10","tipo":"caso","q":"Un asesor en inversiones persona moral designa a la persona que ejercerá las funciones de cumplimiento previstas en su DCG (Oficial de Cumplimiento o Representante, según el caso). ¿En qué plazo debe informar su nombre a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 15 días hábiles siguientes a la designación","o":["Al día hábil siguiente a la fecha de la designación","Dentro de los 15 días hábiles siguientes a la designación","Dentro de los 10 días hábiles siguientes a la designación","Dentro de los 2 días hábiles siguientes a la designación"],"x":"Asesores 31ª: el nombre del Representante se informa dentro de los 15 días hábiles siguientes a su nombramiento. Es el plazo más largo del grupo 2 · 10 · 15.","ref":"Asesores 31ª","par":"D057"},{"id":"D059","tema":"2.1.10","tipo":"caso","q":"Una institución de crédito revoca la designación de su Oficial de Cumplimiento por terminación laboral. ¿En qué plazo debe informar la revocación a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 10 días hábiles siguientes a la revocación","o":["Al día hábil siguiente a la fecha de la revocación","Dentro de los 15 días hábiles siguientes a la revocación","Dentro de los 10 días hábiles siguientes a la revocación","Dentro de los 2 días hábiles siguientes a la revocación"],"x":"Bancos 48ª II: la revocación del OC o del interino (por determinación de la Entidad, rechazo, terminación laboral o imposibilidad) se informa dentro de los 10 días hábiles siguientes.","ref":"Bancos 48ª II","par":"D060"},{"id":"D060","tema":"2.1.10","tipo":"caso","q":"Una casa de cambio revoca la designación de su Oficial de Cumplimiento por terminación laboral. ¿En qué plazo debe informar la revocación a la Secretaría, por conducto de la Comisión?","a":"Al día hábil siguiente a la fecha de la revocación","o":["Dentro de los 15 días hábiles siguientes a la revocación","Dentro de los 2 días hábiles siguientes a la revocación","Dentro de los 10 días hábiles siguientes a la revocación","Al día hábil siguiente a la fecha de la revocación"],"x":"Casas de cambio 39a II: la revocación de la designación del OC se informa al día hábil siguiente a la fecha en que ocurra. También la designación del interino (39a III) se informa al día hábil siguiente.","ref":"Casas de cambio 39a II","par":"D059"},{"id":"D061","tema":"2.1.10","tipo":"trampa","q":"¿Qué combinación de plazos para avisar la designación del Oficial de Cumplimiento es correcta?","a":"Bancos y casas de cambio, 2 días hábiles; SOFOM, SOCAP e ITF, 10 días hábiles","o":["Bancos y casas de cambio, 2 días hábiles; SOFOM, SOCAP e ITF, 10 días hábiles","Bancos y SOFOM, 2 días hábiles; casas de cambio y centros cambiarios, 10 días hábiles","Todos los sujetos, 10 días hábiles, salvo el Representante de Asesores, 15 días hábiles","Bancos, 2 días hábiles; casas de cambio, al día hábil siguiente; ITF, 15 días hábiles"],"x":"Bancos 48ª I y Casas de cambio 39a I: 2 días hábiles. SOFOM 40ª I, SOCAP 52ª I e ITF art. 53 I: 10 días hábiles (igual que Casas de bolsa, Fondos, SOFIPO, Uniones, Centros y Transmisores). Representante de Asesores: 15 días hábiles (31ª).","ref":"Bancos 48ª I; Casas de cambio 39a I; SOFOM 40ª I; SOCAP 52ª I; ITF art. 53 I"},{"id":"D062","tema":"2.1.10","tipo":"caso","q":"El mismo día, el consejo de una institución de crédito sustituye a un integrante del Comité y el Comité designa a ese nuevo integrante como Oficial de Cumplimiento. ¿Qué plazos aplican a los avisos?","a":"15 días hábiles para el cambio de integrante del Comité y 2 días hábiles para la designación del Oficial","o":["2 días hábiles para ambos avisos, porque la designación del Oficial absorbe el cambio en el Comité","15 días hábiles para el cambio de integrante del Comité y 2 días hábiles para la designación del Oficial","15 días hábiles para ambos avisos, porque se trata de un solo acto que se informa en el mismo formato oficial","10 días hábiles para el cambio de integrante del Comité y 2 días hábiles para la designación del Oficial"],"x":"Son avisos distintos: Bancos 46ª (designación, adición o sustitución de integrantes del Comité) dentro de 15 días hábiles; Bancos 48ª I (designación del OC) dentro de 2 días hábiles.","ref":"Bancos 46ª; 48ª I"},{"id":"D063","tema":"2.1.10","tipo":"caso","q":"Un asesor en inversiones persona moral debe organizar su estructura de cumplimiento en PLD/FT. Conforme a su DCG, ¿qué debe hacer?","a":"Designar, mediante su consejo, administrador único o socios administradores, un Representante que labore en la sociedad","o":["Constituir un Comité de al menos tres miembros y designar de entre ellos a un Oficial de Cumplimiento certificado","Encargar las funciones a su director general, sin necesidad de designación ni de aviso a la Secretaría","Designar, mediante su consejo, administrador único o socios administradores, un Representante que labore en la sociedad","Solicitar a la Comisión que le asigne un Representante común para los asesores en inversiones registrados ante ella"],"x":"Asesores 30ª: las personas morales designan, mediante su consejo de administración o de gerentes, administrador único, socio o socios administradores, a un Representante que labore en la sociedad (2ª XXV). Su nombramiento se informa en 15 días hábiles (31ª).","ref":"Asesores 30ª; 2ª XXV; 31ª"},{"id":"D064","tema":"2.1.10","tipo":"caso","q":"Un asesor en inversiones persona física trabaja sin empleados. ¿Qué le permite su DCG respecto de las funciones del Representante?","a":"Realizarlas directamente o designar un Representante, que puede ser el mismo que el de otros asesores personas físicas","o":["Debe designar un Representante exclusivo, que no puede ser compartido con otros asesores en inversiones personas físicas","Queda relevado de esas funciones mientras no tenga empleados ni Clientes clasificados de riesgo alto","Debe designar un Oficial de Cumplimiento con certificación vigente, aunque no tenga empleados a su servicio","Realizarlas directamente o designar un Representante, que puede ser el mismo que el de otros asesores personas físicas"],"x":"Asesores 30ª, último párrafo: las personas físicas pueden optar por realizar de manera directa, y en lo conducente, las funciones del Representante, o bien designar un Representante que puede ser el mismo que el de otros Asesores en Inversiones personas físicas.","ref":"Asesores 30ª"},{"id":"D065","tema":"2.1.10","tipo":"caso","q":"Un asesor en inversiones que no se encuentra en el supuesto del tercer párrafo del art. 225 de la LMV guarda con una entidad financiera la relación a que se refiere ese párrafo. ¿Qué le permite su DCG?","a":"Nombrar, en sustitución del Representante, al oficial de cumplimiento de esa entidad financiera","o":["Nombrar, en sustitución del Representante, al oficial de cumplimiento de esa entidad financiera","Designar como Representante al auditor interno de la entidad financiera con la que guarda la relación","Someter sus operaciones al Comité de Comunicación y Control de la entidad financiera relacionada","Omitir al Representante, porque la entidad financiera reporta por su cuenta las operaciones del asesor"],"x":"Asesores 30ª: «El Asesor en Inversiones que no se encuentre en el supuesto a que se refiere el tercer párrafo del artículo 225 de la Ley, podrá nombrar en sustitución del Representante, al oficial de cumplimiento de la entidad financiera con la que tenga una relación en términos del citado párrafo».","ref":"Asesores 30ª"},{"id":"D066","tema":"2.1.10","tipo":"trampa","q":"En un asesor en inversiones persona moral, ¿quién dictamina las Operaciones Inusuales e Internas Preocupantes y quién las reporta?","a":"El Representante las dictamina y, en su caso, las reporta a la Secretaría","o":["El consejo de administración las dictamina y el Representante las reporta","El Representante las dictamina y, en su caso, las reporta a la Secretaría","El socio administrador las dictamina y el oficial de cumplimiento las reporta","El Comité de Comunicación y Control las dictamina y el Representante las reporta"],"x":"Asesores 30ª VIII: el Representante dictamina las operaciones que deban reportarse y, en su caso, las reporta; documenta sus resoluciones y conserva por escrito los razonamientos del dictamen (fr. IX). En Bancos esas tareas se reparten: el Comité dictamina y el OC envía.","ref":"Asesores 30ª VIII–IX"},{"id":"D067","tema":"2.1.10","tipo":"cifra","q":"Una Entidad sujeta a la DCG de fondos de inversión, en el supuesto de la 42ª, designa al representante que sustituye al Comité y al Oficial de Cumplimiento. ¿En qué plazo informa su nombre a la Secretaría?","a":"Dentro de los 10 días hábiles siguientes a la designación","o":["Dentro de los 2 días hábiles siguientes a la designación","Dentro de los 15 días hábiles siguientes a la designación","Dentro de los 10 días hábiles siguientes a la designación","Al día hábil siguiente a la fecha de la designación"],"x":"Fondos 43ª I: el nombre del OC o del representante de la 42ª se informa dentro de los 10 días hábiles siguientes a la designación. Los 15 días hábiles corresponden al Representante de Asesores (31ª).","ref":"Fondos 43ª I; 42ª"},{"id":"D068","tema":"2.1.10","tipo":"caso","q":"Un centro cambiario forma parte de un grupo empresarial controlado por una misma sociedad, junto con un transmisor de dinero y una SOFOM no regulada. ¿Puede designar el mismo Oficial de Cumplimiento que esas entidades?","a":"Sí; el Oficial común realiza las obligaciones de la DCG y debe laborar en alguna de las entidades del grupo","o":["No; el Oficial de un centro cambiario debe ser exclusivo y no puede compartirse con ninguna otra entidad","Sí, aunque no labore en ninguna de las entidades del grupo, si la Comisión autoriza previamente la designación","No; la DCG de Centros cambiarios sólo admite un Oficial común dentro de un grupo financiero conforme a la LRAF","Sí; el Oficial común realiza las obligaciones de la DCG y debe laborar en alguna de las entidades del grupo"],"x":"Centros 34ª: si el Centro Cambiario es parte de un grupo empresarial integrado por centros cambiarios, transmisores de dinero o SOFOM no reguladas, puede designar un mismo OC, que debe laborar en alguna de las entidades. Grupo empresarial: personas morales en las que una misma sociedad mantiene el control.","ref":"Centros 34ª"},{"id":"D069","tema":"2.1.10","tipo":"caso","q":"Una institución de crédito quiere que su Oficial de Cumplimiento sea el mismo que el de otras entidades financieras con las que guarda vínculos de control. ¿Qué prevé su DCG?","a":"Puede ser el mismo si la entidad forma parte de un grupo financiero conforme a la LRAF y cumple los requisitos de su DCG","o":["Puede ser el mismo si la entidad forma parte de un grupo financiero conforme a la LRAF y cumple los requisitos de su DCG","Puede ser el mismo si forma parte de un grupo empresarial, siempre que el Oficial labore en alguna de esas entidades","Su DCG no prevé que el Oficial de Cumplimiento pueda ser común con el de otras entidades","Puede ser el mismo si la Comisión autoriza previamente la designación conjunta para todas las entidades vinculadas por el control"],"x":"Bancos 47ª: el OC de una Entidad que forme parte de un grupo financiero (LRAF) puede ser el mismo que el de las otras entidades del grupo, siempre que la Entidad cumpla con la 47ª. La regla de grupo empresarial es la de Centros cambiarios (34ª).","ref":"Bancos 47ª","par":"D070"},{"id":"D070","tema":"2.1.10","tipo":"caso","q":"Una sociedad cooperativa de ahorro y préstamo quiere que su Oficial de Cumplimiento sea el mismo que el de otras entidades financieras con las que guarda vínculos de control. ¿Qué prevé su DCG?","a":"Su DCG no prevé que el Oficial de Cumplimiento pueda ser común con el de otras entidades","o":["Puede ser el mismo si la entidad forma parte de un grupo financiero conforme a la LRAF y cumple los requisitos de su DCG","Su DCG no prevé que el Oficial de Cumplimiento pueda ser común con el de otras entidades","Puede ser el mismo si la Comisión autoriza previamente la designación conjunta para todas las entidades vinculadas por el control","Puede ser el mismo si forma parte de un grupo empresarial, siempre que el Oficial labore en alguna de esas entidades"],"x":"SOCAP 51ª: no contiene el párrafo de OC común; tampoco lo prevén Uniones (38ª) ni Transmisores (36ª). Bancos admite OC común en grupo financiero (47ª) y Centros, en grupo empresarial (34ª).","ref":"SOCAP 51ª","par":"D069"}],"sitio":{"nombre":"Módulo 2","integrador":"simulacro","integrador_texto":"Simulacro mixto","integrador_href":"m2-simulacro/index.html","etiqueta_n":"H","orden_resultados":"temario","paginas":[{"n":"1","carpeta":"m2-h1-objetivo-kyc","pregunta":"2.1.1–2.1.2 · Objetivo y política de identificación y conocimiento","estado":"integrada"},{"n":"2","carpeta":"m2-h2-reportes-dolares-sistemas","pregunta":"2.1.3–2.1.5 · Reportes, dólares en efectivo y sistemas automatizados","estado":"integrada"},{"n":"3","carpeta":"m2-h3-otras-obligaciones-lpb","pregunta":"2.1.6–2.1.8 · Otras obligaciones, intercambio de información y LPB","estado":"integrada"},{"n":"4","carpeta":"m2-h4-ccc-oficial","pregunta":"2.1.9–2.1.10 · Comité de Comunicación y Control y oficial de cumplimiento","estado":"integrada"},{"n":"5","carpeta":"m2-h5-novedosos-cambios-itf","pregunta":"2.1.11–2.1.14 · Modelos novedosos, centros cambiarios, transmisores e ITF","estado":"integrada"},{"n":"6","carpeta":"m2-h6-sanciones-pr-plazos","pregunta":"2.1.15–2.1.17 · Sanciones, propietario real y plazos","estado":"integrada"},{"n":"7","carpeta":"m2-h7-tipologias","pregunta":"2.1 · Tipologías UIF y de organismos internacionales","estado":"integrada"},{"n":"8","carpeta":"m2-h8-lfpiorpi","pregunta":"2.2.1–2.2.2 · LFPIORPI: actividades vulnerables y uso de efectivo","estado":"integrada"}],"raiz":"../","actual":"m2-h4-ccc-oficial"}}

        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}

}
function closeD(){$("#scrim").hidden=true;$("#drawer").hidden=true;if(lastFocus)lastFocus.focus();}

document.addEventListener("click",e=>{
  const rec=document.body.classList.contains("recite");
  const chip=e.target.closest("[data-item]");
  if(chip){ if(rec&&!chip.classList.contains("shown")){chip.classList.add("shown");return;} openItem(chip.dataset.item); return; }
  const fb=e.target.closest("[data-ficha]");
  if(fb){ const li=fb.parentElement; if(rec&&!li.classList.contains("shown")){li.classList.add("shown");return;} const inc=li.querySelector(".inc"),open=inc.hidden; inc.hidden=!open; fb.setAttribute("aria-expanded",open); return; }
  const pill=e.target.closest("[data-paso]");
  if(pill){ if(rec&&!pill.classList.contains("shown")) pill.classList.add("shown"); const [sid,i]=pill.dataset.paso.split(":"); showPaso(sid,+i); return; }
  const pn=e.target.closest("[data-pnav]");

});

function tbInit(s){

const rnd=n=>Math.floor(Math.random()*n);
const mixA=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function ctNew(id){
  const s=tbSec(id), src=tbSec(s.fuente), g=CT[id], nR=s.filas||4, nC=s.columnas||4;
  const reps=src.reportes.filter(r=>!(s.excluir||[]).includes(r.k));
  const allOn=r=>src.sujetos.every(j=>tbCell(src,r.k,j.k).aplica);
  let R0,C0,M;
  for(let t=0;t<400;t++){
    const cs=mixA(src.sujetos).slice(0,nC), rs=mixA(reps).slice(0,nR);
    if(rs.filter(allOn).length>1) continue;
    if(rs.some(r=>cs.some(j=>tbCell(src,r.k,j.k).seguro===false))) continue;
    const m=rs.map(r=>cs.map(j=>!!tbCell(src,r.k,j.k).aplica));
    const pats=new Set(m.map(x=>x.join()));
    if(pats.size<Math.min(3,nR)) continue;
    if(m.filter(x=>!x.some(Boolean)).length>1) continue;
    R0=rs;C0=cs;M=m;break;
  }
  if(!M){R0=reps.slice(0,nR);C0=src.sujetos.slice(0,nC);M=R0.map(r=>C0.map(j=>!!tbCell(src,r.k,j.k).aplica));}
  Object.assign(g,{src,rows:R0,cols:C0,M,done:false});
  if(g.mode==="llena"){g.mine=M.map(x=>x.map(()=>false)); return ctDrawFill(id);}
  const key=m=>m.map(x=>x.map(Number).join("")).join("|"), seen=new Set([key(M)]), opts=[M];
  let guard=0;
  while(opts.length<4&&guard++<500){
    const d=M.map(x=>x.slice()), k=1+rnd(2);
    for(let q=0;q<k;q++){const r=rnd(nR),c=rnd(nC); d[r][c]=!d[r][c];}
    const kk=key(d); if(!seen.has(kk)){seen.add(kk);opts.push(d);}
  }
  g.opts=mixA(opts.map((m,i)=>({m,ok:i===0})));
  ctDrawPick(id);
}
