<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Herramienta 8 del Módulo 2: las 26 tipologías UIF, GAFI y Egmont, en el orden del temario, con mapa de 4 bloques, trampas y 111 reactivos.">
<title>2.1 · Tipologías UIF y de organismos internacionales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}

{"meta":{"titulo":"2.1 · Tipologías UIF y de organismos internacionales","descripcion":"Herramienta 8 del Módulo 2: las 26 tipologías UIF, GAFI y Egmont, en el orden del temario, con mapa de 4 bloques, trampas y 111 reactivos.","repo":"mapa-m2-s8","clave":"m2s8","ruta":"financiero","modulo":"Módulo 2 · Certificación CNBV PLD/FT","unidad":"fichas","eyebrow":"2.1 · Objetivo de la subárea · Tipologías UIF 2009–2023, Egmont y GAFI","h1_antes":"2.1 · Tipologías","h1_resaltado":"UIF","h1_despues":"y de organismos internacionales","intro":"¿Cómo se ve el lavado? El examen te describe un caso y te pregunta qué tipología es o qué señal aparece. Primero van las tipologías en el orden de la bibliografía del temario; después, las mismas 26 en cuatro bloques (6 · 9 · 5 · 6) para distinguirlas, y GAFI y Egmont. Los bloques son agrupación didáctica de 360Educa, no de la UIF. Orden sugerido: fichas → bloques → trampas → las que se parecen → simulacro de 30.","fuente":"Fuente: tipologías de la UIF 2009, 2016 y 2018 a 2023; Tipologías Egmont 2022 (así en el temario; el documento no trae fecha) y Tipologías GAFI 2022 (así en el temario; el documento es la traducción UIF de oct-2006 del reporte GAFI 2004-2005 sobre seguros y remesas). Bibliografía del temario CNBV PLD/FT, agosto 2026. Los resúmenes no sustituyen los documentos oficiales.","resumen_portada":"Las 26 tipologías UIF (2009–2023) en el orden del temario y en cuatro bloques para distinguirlas, más GAFI y Egmont; 111 reactivos, la mayoría casos."},"trampas":[{"titulo":"Trata de personas (2019) ≠ Trata y lenocinio (2021).","texto":"En la de <b>2019<\/b> las víctimas son mujeres <b>extranjeras<\/b> engañadas con ofertas de modelaje, hay un <b>sitio web<\/b> fachada y se lava con empresas fantasma y criptomonedas. En la de <b>2021<\/b> (trata y lenocinio, con víctimas captadas en el país) otros integrantes de la red, mayormente familiar, <b>mezclan<\/b> el efectivo con <b>negocios legítimos<\/b> y lo transfieren a paraísos fiscales. Las dos compran inmuebles: eso no las distingue."},{"titulo":"PEPs no es Ex servidor público","texto":"UIF 2022 PEPs gira en torno al régimen PEP (durante el año siguiente a aquel en que dejó el cargo; cónyuge, concubina, parentesco hasta 2.º grado), y el texto aclara que la calidad de PEP no implica que la persona sea corrupta. UIF 2020 Ex servidor público se delata por el nivel de vida incongruente con sus declaraciones patrimoniales. Cohecho alto ejecutivo sector energético (quien paga el soborno es una empresa extranjera) y Estafa Maestra (la universidad como intermediaria) son los espejos de la misma rama. <b>Fundamento:<\/b> UIF 2022 PEPs; UIF 2020 Ex servidor público; UIF 2020 Cohecho alto ejecutivo sector energético; UIF 2020 Estafa Maestra Pemex."},{"titulo":"«A.v.» es activos virtuales","texto":"El título del documento es «Uso ilícito de activos virtuales». No significa actividades vulnerables, que se estudian en 2.2.1 (LFPIORPI, art. 17, fr. XVI para activos virtuales). <b>Fundamento:<\/b> UIF 2022 A.v., título."},{"titulo":"León Chino ≠ Fentanilo: las dos son de comercio exterior (2021).","texto":"En <b>León Chino<\/b> se envía al extranjero mucho <b>más<\/b> que el valor de lo importado, fondeado con pitufos. En <b>Fentanilo<\/b> se importa la <b>droga misma<\/b> declarada como otra sustancia, y se importan bienes legales para mezclar las ganancias (la mezcla con fondos lícitos aparece en las dos)."},{"titulo":"Dos universidades, dos papeles.","texto":"En la <b>Estafa Maestra versión Pemex (2020)<\/b> la universidad es contratada para servicios que <b>no puede proveer<\/b> y el dinero público termina en empresas fachada. En la <b>Institución educativa de nivel superior (2019)<\/b> la universidad <b>recibe<\/b> dinero ilícito, lo <b>triangula<\/b> al extranjero y lo regresa, con patronato y máquinas de juego."}],"secciones":[{"tipo":"tarjetas","id":"leer","nav":"Cómo leer un caso","titulo":"Cómo leer una tipología: cuatro preguntas","intro":"Una tipología es un caso real que describe un método para lavar dinero. Antes de responder, identifica estas cuatro piezas. Frase de orden: <b>¿Quién? · ¿Cómo? · ¿Dónde? · ¿De dónde viene?<\/b>","tarjetas":[{"barra":true,"color":"morado","titulo":"¿Quién?","ref":"Los actores","html":"Funcionarios, un líder sindical, un abogado, una familia, jóvenes, adultos mayores como testaferros, una banda extranjera."},{"barra":true,"color":"principal","titulo":"¿Cómo?","ref":"El método","html":"Empresas fachada, sobrefacturación, OSFL, pitufeo, triangulación, mezcla con un negocio real, clonación de tarjetas, apps de préstamo."},{"barra":true,"color":"turquesa","titulo":"¿Dónde?","ref":"El sector o producto","html":"Comercio exterior, inmobiliario, activos virtuales, cajas de seguridad, cajeros, cuentas personales, centros cambiarios."},{"barra":true,"color":"negro","titulo":"¿De dónde viene?","ref":"El delito subyacente","html":"Corrupción, narcotráfico, robo de hidrocarburos, fraude, extorsión, trata de personas."}],"nota":"<b>Truco de examen:<\/b> casi siempre hay dos tipologías parecidas entre las opciones. Busca el rasgo que sólo tiene una (en cada ficha: «Lo que la distingue»)."},{"tipo":"mapa","id":"t2-1-tip","nav":"2.1 Tipologías","titulo":"2.1 · Tipologías UIF y de organismos internacionales","intro":"Las tipologías en el orden de la bibliografía del temario: UIF 2009 → 2016 → 2018–2019 → 2020 → 2021 → 2022 → Egmont → GAFI → UIF 2023. Ritmo 5 · 5 · 3 · 5 · 5 · 2 · 5 · 1. Cada ficha dice a qué bloque didáctico pertenece. Egmont y GAFI se llaman «2022» en el temario: el de Egmont no trae fecha y el de GAFI es la traducción UIF de oct-2006 del reporte GAFI 2004-2005.","centro":{"t":"Bibliografía","s":"20 documentos<br>orden del temario"},"ramas":[{"letra":"1","titulo":"UIF 2009","pregunta":"Compendio de cinco casos","corto":"UIF 2009","ritmo":"casos del compendio","color":"oscuro","estilo":"ficha","items":[{"etiqueta":"1","nombre":"Uso de cajas de seguridad (2009)","verbo":"Guardo","gancho":"¿Qué guarda en la caja?","conteo":"Bloque C","puntos":["<b>C · Personas y productos del banco<\/b> (agrupación didáctica)","<b>El caso:<\/b> Un funcionario público ligado al narcotráfico utiliza una caja de seguridad bancaria para resguardar efectivo ilícito y joyas, evitando dejar rastro en el sistema financiero.","<b>Palabras clave:<\/b> Caja de Seguridad · Resguardo de Efectivo · Funcionario Público","<b>Señales de alerta:<\/b><ul><li>Titular es un servidor público de áreas de seguridad.<\/li><li>Alta frecuencia de acceso a la caja.<\/li><li>Perfil del solicitante no justifica la necesidad del servicio.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El producto es la <b>caja de seguridad<\/b>: alta frecuencia de acceso; titular servidor público de áreas de seguridad."]},{"etiqueta":"2","nombre":"Ruta de dinero (2009)","verbo":"Sincronizo","gancho":"¿Retiran todos a la vez?","conteo":"Bloque C","puntos":["<b>C · Personas y productos del banco<\/b> (agrupación didáctica)","<b>El caso:<\/b> Dólares en efectivo se cambian por pesos en la frontera y se depositan en múltiples cuentas de personas de bajo perfil. Los fondos son retirados de manera simultánea y coordinada.","<b>Palabras clave:<\/b> Cuentas de Terceros · Retiros Simultáneos · Frontera Norte","<b>Señales de alerta:<\/b><ul><li>Depósitos en efectivo en la frontera a cuentas del interior del país.<\/li><li>Actividad del titular no congruente con los montos.<\/li><li>Retiro simultáneo de los recursos sin permanencia.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Depósitos en la <b>frontera<\/b> a cuentas del interior y <b>retiro simultáneo<\/b> sin permanencia."]},{"etiqueta":"3","nombre":"Cuenta personal para actividad empresarial (2009)","verbo":"Camuflo","gancho":"¿Persona física o empresa?","conteo":"Bloque C","puntos":["<b>C · Personas y productos del banco<\/b> (agrupación didáctica)","<b>El caso:<\/b> Una persona física utiliza su cuenta bancaria personal para recibir grandes depósitos de empresas ligadas al narco, haciendo pasar operaciones comerciales como personales.","<b>Palabras clave:<\/b> Cuenta Personal · Actividad Empresarial · Ocultamiento","<b>Señales de alerta:<\/b><ul><li>Cuenta \"personal\" que recibe fondos de empresas.<\/li><li>Montos operados exceden el perfil transaccional.<\/li><li>Múltiples firmantes sin relación aparente con el titular.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Cuenta <b>personal<\/b> que recibe fondos <b>de empresas<\/b>; varios firmantes sin relación con el titular."]},{"etiqueta":"4","nombre":"Uso de identidad (2009)","verbo":"Falsifico","gancho":"¿La empresa existe?","conteo":"Bloque B","puntos":["<b>B · Empresas, OSFL y comercio exterior<\/b> (agrupación didáctica)","<b>El caso:<\/b> Lavadores de dinero extranjeros, con ayuda de cómplices locales, utilizan documentos constitutivos falsos para crear empresas inexistentes y realizar transferencias al extranjero.","<b>Palabras clave:<\/b> Identidad Falsa · Documentos Falsos · Lavadores Extranjeros","<b>Señales de alerta:<\/b><ul><li>Inconsistencias en actas constitutivas (fechas ilógicas).<\/li><li>Visitas domiciliarias constatan la inexistencia física de la empresa.<\/li><li>Múltiples transferencias pequeñas a múltiples beneficiarios en el extranjero.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Documentos <b>falsos<\/b> (fechas ilógicas en actas) y visita domiciliaria que confirma que la empresa <b>no existe<\/b>."]},{"etiqueta":"5","nombre":"Transferencias a beneficiarios comunes (2009)","verbo":"Concentro","gancho":"¿Todos le envían al mismo?","conteo":"Bloque C","puntos":["<b>C · Personas y productos del banco<\/b> (agrupación didáctica)","<b>El caso:<\/b> Múltiples personas de bajo perfil depositan efectivo y ordenan transferencias a un mismo beneficiario en el extranjero, vendedor o intermediario de aeronaves que compran integrantes de organizaciones delictivas.","<b>Palabras clave:<\/b> Beneficiario Común · Compra de Activos · Aeronaves","<b>Señales de alerta:<\/b><ul><li>Actividad del ordenante no tiene relación con el beneficiario.<\/li><li>Múltiples ordenantes enviando fondos a un mismo beneficiario.<\/li><li>Centros cambiarios ordenando transferencias al extranjero.<\/li><\/ul>","<b>Lo que la distingue:<\/b> <b>Muchos<\/b> ordenantes → <b>un<\/b> beneficiario en el extranjero; aeronaves; centros cambiarios que ordenan transferencias."]}]},{"letra":"2","titulo":"UIF 2016","pregunta":"Compendio, tipologías I a V","corto":"UIF 2016","ritmo":"tipologías I a V","color":"negro","estilo":"ficha","items":[{"etiqueta":"I","nombre":"Estructura corporativa simula operaciones (2016)","verbo":"Maquilo","gancho":"¿Lavan para otros?","conteo":"Bloque B","puntos":["<b>B · Empresas, OSFL y comercio exterior<\/b> (agrupación didáctica)","<b>El caso:<\/b> Una organización criminal crea una extensa red de empresas fachada para ofrecer servicios profesionales de lavado de dinero a otros grupos. Utilizan prestanombres y oficinas virtuales.","<b>Palabras clave:<\/b> Lavado como Servicio · Red de Empresas · Oficinas Virtuales","<b>Señales de alerta:<\/b><ul><li>Numerosas transferencias internacionales sin actividad comercial declarada.<\/li><li>Uso de oficinas virtuales o domicilios particulares como sede de múltiples empresas.<\/li><li>Accionistas son empleados jóvenes de bajo perfil.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El <b>lavado como servicio<\/b> para terceros y las <b>oficinas virtuales<\/b> como sede de múltiples empresas."]},{"etiqueta":"II","nombre":"Abuso de sindicatos (2016)","verbo":"Desvío","gancho":"¿A dónde van los fondos del sindicato?","conteo":"Bloque A","puntos":["<b>A · Corrupción y recursos públicos<\/b> (agrupación didáctica)","<b>El caso:<\/b> Fondos de un sindicato laboral son desviados a cuentas de un pequeño grupo para ser usados en la compra de bienes y servicios de lujo para el líder sindical.","<b>Palabras clave:<\/b> Sindicato Laboral · Líder Sindical · Desvío de Fondos · Bienes de Lujo","<b>Señales de alerta:<\/b><ul><li>Sindicato concentra operaciones en pocas cuentas bancarias.<\/li><li>Transferencias para pago de bienes de lujo no acordes al perfil del sindicato.<\/li><li>Poca permanencia de los recursos en las cuentas destino.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Los fondos de un <b>sindicato<\/b> se concentran en <b>pocas cuentas<\/b> y pagan bienes y servicios de lujo del <b>líder sindical<\/b>."]},{"etiqueta":"III","nombre":"Bienes raíces con dinero ilícito (2016)","verbo":"Construyo","gancho":"¿Con qué construye?","conteo":"Bloque B","puntos":["<b>B · Empresas, OSFL y comercio exterior<\/b> (agrupación didáctica)","<b>El caso:<\/b> Una empresa inmobiliaria de reciente creación financia proyectos de gran magnitud sin una fuente lícita de recursos, simulando preventas con liquidaciones de contado.","<b>Palabras clave:<\/b> Sector Inmobiliario · Sin Fondos Lícitos · Preventas Falsas","<b>Señales de alerta:<\/b><ul><li>Empresas de reciente creación operando montos elevados.<\/li><li>Personas jóvenes como representantes legales de múltiples empresas.<\/li><li>Esquemas de preventa con alto porcentaje de operaciones de contado.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Inmobiliaria de reciente creación con <b>preventas<\/b> liquidadas en alto porcentaje <b>de contado<\/b> y sin fuente lícita de recursos."]},{"etiqueta":"IV","nombre":"Compañía con operaciones internacionales utiliza su actividad lícita (2016)","verbo":"Mezclo","gancho":"¿El negocio es real?","conteo":"Bloque B","puntos":["<b>B · Empresas, OSFL y comercio exterior<\/b> (agrupación didáctica)","<b>El caso:<\/b> Una empresa legítima en zona fronteriza y con alto manejo de efectivo, mezcla fondos ilícitos con sus ingresos legales, usando triangulación y dispersando a personas con esquema de \"ruta de dinero\".","<b>Palabras clave:<\/b> Mezcla de Fondos · Negocio Legítimo · Zona Fronteriza","<b>Señales de alerta:<\/b><ul><li>Personas que reciben recursos de otras en Lista de Personas Bloqueadas.<\/li><li>Operaciones entre personas con el mismo domicilio fiscal.<\/li><li>Dispersión de recursos a sujetos jóvenes de estrato social bajo.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Un negocio <b>real<\/b> de zona <b>fronteriza<\/b> con mucho efectivo que mezcla y dispersa a <b>jóvenes de estrato bajo<\/b> con esquema de <b>ruta de dinero<\/b>; contrapartes en la Lista de Personas Bloqueadas (también en Trata y lenocinio) (sin explotación sexual, a diferencia de Trata y lenocinio)."]},{"etiqueta":"V","nombre":"Uso de personas jóvenes para enviar dinero (2016)","verbo":"Recluto","gancho":"¿Cuántos años tiene el titular?","conteo":"Bloque C","puntos":["<b>C · Personas y productos del banco<\/b> (agrupación didáctica)","<b>El caso:<\/b> Nueve sujetos de una ciudad fronteriza, cuatro de ellos menores de 25 años y ninguno inscrito ante el SAT, reciben depósitos en efectivo de origen ilícito (narcotráfico) y los transfieren rápidamente a 17 empresas en el extranjero.","<b>Palabras clave:<\/b> Jóvenes (Mulas) · Sin Registro Fiscal · Narcotráfico","<b>Señales de alerta:<\/b><ul><li>Cuentas de recién apertura con alta operatividad.<\/li><li>La edad de los sujetos no es acorde a los montos manejados.<\/li><li>Sujetos no registran actividad fiscal.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Titulares cuya <b>edad<\/b> no es acorde a los montos (cuatro de nueve, menores de 25), <b>sin actividad fiscal<\/b>, cuentas de recién apertura con alta operatividad."]}]},{"letra":"3","titulo":"UIF 2018 y 2019","pregunta":"Una tipología por documento","corto":"UIF 2018 y 2019","ritmo":"documentos","color":"oscuro","estilo":"ficha","items":[{"etiqueta":"2018","nombre":"Fraudes informáticos","verbo":"Hackeo","gancho":"¿La factura era del proveedor?","conteo":"Bloque D","puntos":["<b>D · Fraude, tecnología y explotación<\/b> (agrupación didáctica)","<b>El caso:<\/b> Delincuentes hackean correos de empresas para enviar facturas falsas a sus clientes, desviando los pagos a cuentas de terceros cuyos beneficiarios finales son, en su mayoría, originarios de un país de riesgo alto.","<b>Palabras clave:<\/b> Hackeo de Correo · Facturas Falsas · Desvío de Pagos","<b>Señales de alerta:<\/b><ul><li>Incongruencia entre el beneficiario indicado y el titular real de la cuenta.<\/li><li>Recursos retirados de manera inmediata.<\/li><li>Cuentas abiertas en sucursales lejanas al domicilio del titular.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El beneficiario de la factura <b>no coincide<\/b> con el titular real de la cuenta; correos <b>hackeados<\/b> del proveedor con datos alterados (dominio, teléfono)."]},{"etiqueta":"2019","nombre":"Institución educativa de nivel superior","verbo":"Triangulo","gancho":"¿Por qué el dinero fue y regresó?","conteo":"Bloque A","puntos":["<b>A · Corrupción y recursos públicos<\/b> (agrupación didáctica)","<b>El caso:<\/b> Una universidad recibe dinero ilícito, lo triangula internacionalmente y lo regresa a México. Utiliza un patronato y gasta fondos públicos en máquinas de juego para lavar dinero.","<b>Palabras clave:<\/b> Universidad · Triangulación Internacional · Patronato · Máquinas de Juego","<b>Señales de alerta:<\/b><ul><li>Transferencias internacionales elevadas sin justificación comercial.<\/li><li>Recursos enviados a diferentes países que luego retornan al país de origen.<\/li><li>Inversión de recursos públicos en máquinas de juego.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Aquí la universidad <b>recibe y triangula<\/b> el dinero (va al extranjero y regresa), con <b>patronato<\/b> y <b>máquinas de juego<\/b>."]},{"etiqueta":"2019","nombre":"Trata de personas","verbo":"Engaño","gancho":"¿A quién engañan y cómo?","conteo":"Bloque D","puntos":["<b>D · Fraude, tecnología y explotación<\/b> (agrupación didáctica)","<b>El caso:<\/b> Red criminal, principalmente familiar, engaña a mujeres extranjeras con falsas ofertas de modelaje para explotación sexual. Usan un sitio web como fachada y lavan el dinero con empresas fantasma y criptomonedas.","<b>Palabras clave:<\/b> Trata Internacional · Explotación Sexual · Sitio Web Fachada · Red Familiar","<b>Señales de alerta:<\/b><ul><li>Personas físicas identificadas en fuentes externas en redes de trata.<\/li><li>Operaciones con montos elevados incongruentes con la actividad declarada.<\/li><li>Compra de inmuebles y vehículos de lujo sin origen de recursos claro.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Víctimas <b>extranjeras<\/b> engañadas con ofertas de <b>modelaje<\/b> y explotadas mediante un <b>sitio web<\/b> fachada; personas identificadas en fuentes externas en redes de trata. (Empresas fantasma y criptomonedas aparecen también en otras.)"]}]},{"letra":"4","titulo":"UIF 2020","pregunta":"Una tipología por documento","corto":"UIF 2020","ritmo":"documentos","color":"negro","estilo":"ficha","items":[{"etiqueta":"2020","nombre":"OSFL con actividades religiosas","verbo":"Lucro","gancho":"¿Una OSFL religiosa que invierte?","conteo":"Bloque B","puntos":["<b>B · Empresas, OSFL y comercio exterior<\/b> (agrupación didáctica)","<b>El caso:<\/b> Cinco OSFL con fines religiosos, dirigidas por la misma persona, se utilizan para actividades lucrativas como inversiones y compra de bienes de lujo, evadiendo impuestos para su líder.","<b>Palabras clave:<\/b> OSFL Religiosa · Actividades Lucrativas · Líder Religioso","<b>Señales de alerta:<\/b><ul><li>OSFL religiosas realizando actos con fines eminentemente lucrativos.<\/li><li>Transferencias a paraísos fiscales.<\/li><li>Compra de bienes de lujo no acordes a su objeto social.<\/li><\/ul>","<b>Lo que la distingue:<\/b> <b>Cinco<\/b> OSFL religiosas con <b>un mismo<\/b> líder, realizando actos con fines eminentemente lucrativos (inversiones, bienes de lujo) para evadir impuestos del líder."]},{"etiqueta":"2020","nombre":"Asociación altruista ¿apoya a migrantes?","verbo":"Reenvío","gancho":"¿Quién es el testaferro?","conteo":"Bloque B","puntos":["<b>B · Empresas, OSFL y comercio exterior<\/b> (agrupación didáctica)","<b>El caso:<\/b> Una OSFL que supuestamente apoya a migrantes se usa como fachada para manejar dinero ilícito, realizando operaciones injustificadas y utilizando a una persona de edad avanzada como testaferro.","<b>Palabras clave:<\/b> OSFL · Ayuda a Migrantes · Testaferro Adulto Mayor","<b>Señales de alerta:<\/b><ul><li>Recepción de transferencias que son reenviadas rápidamente.<\/li><li>Uso de una persona de edad muy avanzada como testaferro.<\/li><li>Retiros frecuentes en efectivo por montos fraccionados.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Testaferro de <b>edad muy avanzada<\/b>; transferencias que se <b>reenvían<\/b> rápido y retiros fraccionados."]},{"etiqueta":"2020","nombre":"Cohecho alto ejecutivo sector energético","verbo":"Soborno","gancho":"¿Quién pagó el soborno?","conteo":"Bloque A","puntos":["<b>A · Corrupción y recursos públicos<\/b> (agrupación didáctica)","<b>El caso:<\/b> Una empresa extranjera soborna a un alto ejecutivo del sector energético para obtener contratos, utilizando software sofisticado, empresas fachada en paraísos fiscales y fideicomisos familiares.","<b>Palabras clave:<\/b> Soborno (Cohecho) · Sector Energético · Empresa Extranjera · Software Sofisticado","<b>Señales de alerta:<\/b><ul><li>Perfil de beneficiarios (estudiante, ama de casa) incongruente con los fondos.<\/li><li>Depósitos por transferencia por encima del umbral y retiros por esos montos en la misma fecha.<\/li><li>Depósitos y retiros en efectivo por encima del umbral de aviso.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Quien paga es una <b>empresa extranjera<\/b>; beneficiarios de perfil incongruente (estudiante, ama de casa) y <b>fideicomisos familiares<\/b>."]},{"etiqueta":"2020","nombre":"Corrupción ex servidor público","verbo":"Enriquezco","gancho":"¿Vive por encima de su sueldo?","conteo":"Bloque A","puntos":["<b>A · Corrupción y recursos públicos<\/b> (agrupación didáctica)","<b>El caso:<\/b> Un ex funcionario público muestra un estilo de vida inconsistente con su salario después de dejar el cargo, utilizando una red de empresas fachada y excontratistas para canalizar fondos a paraísos fiscales.","<b>Palabras clave:<\/b> Ex Funcionario · Nivel de Vida Incongruente · Contratistas · Paraísos Fiscales","<b>Señales de alerta:<\/b><ul><li>Desvío de fondos gubernamentales a paraísos fiscales.<\/li><li>Incongruencia entre declaraciones patrimoniales y gastos.<\/li><li>Pagos a tarjetas de crédito muy superiores a los ingresos declarados.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El <b>nivel de vida<\/b> incongruente con su salario y declaraciones patrimoniales, y los <b>excontratistas<\/b> de la dependencia; pagos a tarjetas muy superiores a sus ingresos."]},{"etiqueta":"2020","nombre":"Estafa Maestra versión Pemex","verbo":"Simulo","gancho":"¿La universidad podía dar el servicio?","conteo":"Bloque A","puntos":["<b>A · Corrupción y recursos públicos<\/b> (agrupación didáctica)","<b>El caso:<\/b> Una red de empresas fachada, creadas por un funcionario de PEMEX, recibe fondos públicos desviados a través de una universidad que es contratada para servicios que no puede proveer.","<b>Palabras clave:<\/b> PEMEX · Universidad Pública · Servicios Simulados · Empresas Fantasma","<b>Señales de alerta:<\/b><ul><li>Contratación de universidades para servicios que no pueden proveer.<\/li><li>Reparto de los recursos a empresas catalogadas por el SAT como fantasma.<\/li><li>Accionistas de empresas son familiares o prestanombres de funcionarios.<\/li><\/ul>","<b>Lo que la distingue:<\/b> La universidad es el <b>conducto<\/b> del desvío: la contratan para servicios que <b>no puede proveer<\/b> y subcontrata a fachadas."]}]},{"letra":"5","titulo":"UIF 2021","pregunta":"Una tipología por documento","corto":"UIF 2021","ritmo":"documentos","color":"oscuro","estilo":"ficha","items":[{"etiqueta":"2021","nombre":"El Licenciado","verbo":"Asesoro","gancho":"¿Quién arma el esquema?","conteo":"Bloque B","puntos":["<b>B · Empresas, OSFL y comercio exterior<\/b> (agrupación didáctica)","<b>El caso:<\/b> Un abogado actúa como operador financiero de un líder de un cártel, articulando un esquema de lavado a través de empresas fachada (exportadoras de vehículos de lujo, seguridad, etc.) y una OSFL.","<b>Palabras clave:<\/b> Abogado Operador Financiero · Cártel de la Droga · Exportación de Vehículos · OSFL","<b>Señales de alerta:<\/b><ul><li>Relación profesional cercana con diversos líderes de cárteles.<\/li><li>Uso de empresas exportadoras de bienes de lujo para lavar dinero.<\/li><li>Empresas fachada con giros diversos y sin relación aparente.<\/li><li>Utilización de una OSFL para canalizar fondos.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Un <b>profesionista<\/b> (abogado) es el operador financiero; exportación de <b>vehículos de lujo<\/b> y una OSFL."]},{"etiqueta":"2021","nombre":"Fentanilo (tráfico y comercio exterior)","verbo":"Disfrazo","gancho":"¿Qué decía el pedimento?","conteo":"Bloque B","puntos":["<b>B · Empresas, OSFL y comercio exterior<\/b> (agrupación didáctica)","<b>El caso:<\/b> Un traficante utiliza empresas fachada para importar ilegalmente fentanilo, declarándolo como otra sustancia. Estas mismas empresas importan bienes legales para mezclar las ganancias de la droga con ingresos lícitos.","<b>Palabras clave:<\/b> Fentanilo · Fraude Aduanero · Comercio Exterior · Mezcla de Fondos","<b>Señales de alerta:<\/b><ul><li>El domicilio de la empresa no cuenta con las características físicas de un centro de trabajo y no fue posible localizar datos de comercio exterior.<\/li><li>Coincidencia de domicilio entre personas y empresas del esquema.<\/li><li>Triangulación de recursos entre empresas con actividades no concordantes.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Se importa la <b>droga misma<\/b> con declaración falsa; los bienes legales sirven para <b>mezclar<\/b> los fondos."]},{"etiqueta":"2021","nombre":"León Chino (comercio exterior)","verbo":"Sobrefacturo","gancho":"¿Cuánto valía lo importado?","conteo":"Bloque B","puntos":["<b>B · Empresas, OSFL y comercio exterior<\/b> (agrupación didáctica)","<b>El caso:<\/b> Tres empresas fachada envían al extranjero montos muy superiores al valor de lo que importan, encubiertos en la simulación de actos de comercio exterior. El esquema se fondea con depósitos masivos en efectivo realizados por \"pitufos\".","<b>Palabras clave:<\/b> Comercio Exterior (TBML) · Sobrefacturación · \"Pitufos\"","<b>Señales de alerta:<\/b><ul><li>Valor de importaciones es significativamente inferior al monto enviado al extranjero.<\/li><li>Uso masivo de depósitos en efectivo (\"pitufeo\").<\/li><li>Empresas que iniciaron operaciones con un capital social mínimo para los grandes volúmenes operados.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El valor importado es <b>mucho menor<\/b> que lo enviado al extranjero y se fondea con <b>pitufeo<\/b>."]},{"etiqueta":"2021","nombre":"Cajeros automáticos (skimming)","verbo":"Clono","gancho":"¿Dónde retiran?","conteo":"Bloque D","puntos":["<b>D · Fraude, tecnología y explotación<\/b> (agrupación didáctica)","<b>El caso:<\/b> Una banda de delincuentes extranjeros instala dispositivos de \"skimming\" en cajeros de zonas turísticas para clonar tarjetas. El dinero se lava a través de inversiones inmobiliarias.","<b>Palabras clave:<\/b> Skimming · Cajeros Automáticos · Zonas Turísticas · Banda Extranjera","<b>Señales de alerta:<\/b><ul><li>Concentración de retiros en cajeros de zonas turísticas.<\/li><li>Compra de bienes de lujo (vehículos, relojes).<\/li><li>Beneficiarios son extranjeros de la misma nacionalidad.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Retiros concentrados en cajeros de <b>zonas turísticas<\/b>; una empresa que <b>renta los cajeros<\/b> con chips o software que copian las tarjetas (los beneficiarios extranjeros de la misma nacionalidad aparecen también en Fraudes informáticos 2018)."]},{"etiqueta":"2021","nombre":"Trata y lenocinio","verbo":"Someto","gancho":"¿Quién mezcla el efectivo?","conteo":"Bloque D","puntos":["<b>D · Fraude, tecnología y explotación<\/b> (agrupación didáctica)","<b>El caso:<\/b> Red familiar somete a mujeres a explotación sexual. Otros miembros de la familia usan negocios legítimos para mezclar el efectivo ilícito con ingresos legales, lavándolo a través de bienes raíces y transferencias a paraísos fiscales.","<b>Palabras clave:<\/b> Lenocinio · Mezcla de Fondos · Red Familiar","<b>Señales de alerta:<\/b><ul><li>Disposición de recursos en efectivo por montos inusuales.<\/li><li>Operaciones entre personas que presentan un mismo domicilio fiscal.<\/li><li>Gastos que sobrepasan el nivel transaccional declarado.<\/li><\/ul>","<b>Lo que la distingue:<\/b> <b>Lenocinio<\/b> por una red mayormente familiar: unos integrantes explotan a las víctimas y <b>otros integrantes<\/b> mezclan el efectivo en sus negocios legítimos (en Compañía con operaciones lícitas no hay explotación sexual; en Trata de personas 2019 las víctimas son extranjeras y hay sitio web)."]}]},{"letra":"6","titulo":"UIF 2022","pregunta":"Una tipología por documento","corto":"UIF 2022","ritmo":"documentos","color":"negro","estilo":"ficha","items":[{"etiqueta":"2022","nombre":"Personas Políticamente Expuestas (PEPs)","verbo":"Emparento","gancho":"¿El ex servidor y su familia?","conteo":"Bloque A","puntos":["<b>A · Corrupción y recursos públicos<\/b> (agrupación didáctica)","<b>El caso:<\/b> Un ex servidor público (PEP) y su red familiar utilizan un conglomerado de empresas fachada para lavar recursos provenientes de actos de corrupción, delincuencia organizada y robo de hidrocarburos.","<b>Palabras clave:<\/b> PEP y Familia · Robo de Hidrocarburos · Empresas Fachada","<b>Señales de alerta:<\/b><ul><li>Múltiples depósitos y retiros en efectivo por montos altos.<\/li><li>Discrepancia entre declaraciones fiscales y montos operados.<\/li><li>Vínculos con empresas fantasma y personas en listas negras del SAT.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El <b>robo de hidrocarburos<\/b> como uno de los orígenes y un <b>ex servidor PEP<\/b> que opera con su red familiar; vínculos con listas negras del SAT."]},{"etiqueta":"2022","nombre":"Uso ilícito de activos virtuales","verbo":"Convierto","gancho":"¿Dónde compró las criptomonedas?","conteo":"Bloque D","puntos":["<b>D · Fraude, tecnología y explotación<\/b> (agrupación didáctica)","<b>El caso:<\/b> Un grupo familiar lava dinero del narcotráfico comprando activos virtuales (criptomonedas) a través de una plataforma no regulada (VASP), para luego transferir los fondos internacionalmente.","<b>Palabras clave:<\/b> Activos Virtuales (Cripto) · VASP no regulado · Operación Familiar","<b>Señales de alerta:<\/b><ul><li>Compra de Activos Virtuales en plataformas no registradas ante el SAT.<\/li><li>Depósitos en efectivo en zonas de riesgo por narcotráfico.<\/li><li>Personas jóvenes operando montos elevados.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Compra de activos virtuales en una plataforma <b>no registrada ante el SAT<\/b> (VASP no regulado) con efectivo del <b>narcotráfico<\/b>."]}]},{"letra":"7","titulo":"Egmont y GAFI","pregunta":"Organismos internacionales","corto":"Egmont y GAFI","ritmo":"grupos por delito o sector","color":"negro","estilo":"ficha","items":[{"etiqueta":"E","nombre":"Egmont · narcotráfico","verbo":"Narco","gancho":"¿El dinero viene de la droga?","conteo":"11 casos","puntos":["<b>Casos:<\/b> E1, E8, E10, E12, E13, E14, E15, E21, E22, E23, E25 (11 casos); E19 con sospecha."]},{"etiqueta":"E","nombre":"Egmont · fraude","verbo":"Defraudo","gancho":"¿Alguien fue engañado?","conteo":"9 casos","puntos":["<b>Casos:<\/b> E2, E3, E5, E6, E7, E9, E11, E17, E20 (9 casos); E17 es de pensiones."]},{"etiqueta":"E","nombre":"Egmont · otros delitos","verbo":"Otros","gancho":"¿Casino, autos robados, contrabando u obra ficticia?","conteo":"4 casos","puntos":["<b>Casos:<\/b> E4 casino, E16 autos robados, E18 contrabando, E24 obra pública ficticia.","Operación hormiga: E13, E22, E23 (estructuración bajo el umbral también en E14 y E15). Empresas pantalla: E1, E8, E17, E18, E19, E20, E24, E25. Abogados y notarios: E1, E3, E7, E10, E21, E25. Casinos: E4, E14. Los indicadores de E4, E17 y E25 están vacíos y los de E20 son pasos de investigación."]},{"etiqueta":"G","nombre":"GAFI · seguros","verbo":"Aseguro","gancho":"¿Se paga una póliza y se cancela con pérdida?","conteo":"12 casos","puntos":["Son 12 casos del sector asegurador. Las señales se resumen en el apartado 1.3.","<b>No exclusivos (1.3.1):<\/b> uso de efectivo en grandes operaciones; apartados postales o domicilios falsos; negocios en jurisdicciones de alto riesgo.","<b>Asegurado (1.3.2):<\/b> pariente o socio de delincuente; comportamiento incongruente; primas altas frente a ingresos; despreocupación por costos de cancelación; interés excesivo en cancelar; cambio de beneficiarios; bienes valiosos incongruentes con el perfil; cobro inmediato.","<b>Primas (1.3.3):<\/b> pago por terceros; múltiples fuentes de pago; pago en exceso seguido de reembolso; usar la aseguradora para mover fondos como cuenta bancaria.","<b>Otros (1.3.4):<\/b> cargos o comisiones inusualmente altos; aseguradoras o reaseguradoras de reciente creación o poco transparentes."]},{"etiqueta":"G","nombre":"GAFI · remesas","verbo":"Remito","gancho":"¿El dinero viaja por un remesador?","conteo":"13 casos","puntos":["Son 13 casos de remesas. El texto no tiene sección de indicadores para remesas."]}]},{"letra":"8","titulo":"UIF 2023","pregunta":"Una tipología","corto":"UIF 2023","ritmo":"documento","color":"oscuro","estilo":"ficha","items":[{"etiqueta":"2023","nombre":"Montadeudas","verbo":"Extorsiono","gancho":"¿Quién presta por app?","conteo":"Bloque D","puntos":["<b>D · Fraude, tecnología y explotación<\/b> (agrupación didáctica)","<b>El caso:<\/b> Aplicaciones móviles fraudulentas ofrecen préstamos rápidos con intereses exorbitantes y extorsionan a las víctimas usando sus contactos y fotos personales para forzar el pago.","<b>Palabras clave:<\/b> Apps de Préstamos · Extorsión · Cobranza Ilegal · Ostentación como Entidad Financiera","<b>Señales de alerta:<\/b><ul><li>Empresas que se ostentan como Entidad Financiera sin autorización.<\/li><li>Rápido movimiento de fondos vía SPEIs a través de FINTECHs.<\/li><li>Uso de amenazas y cobranza extrajudicial ilegal.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Se ostentan como entidad financiera <b>sin autorización<\/b>; cobranza ilegal y SPEI rápidos a través de FINTECH."]}]}]},{"tipo":"mapa","id":"mapa","nav":"4 bloques","titulo":"Las 26 tipologías en cuatro bloques","intro":"Cuatro preguntas, ritmo 6 · 9 · 5 · 6. El número grande de cada ficha es el año del informe de la UIF; el verbo es tu gancho para recitar. La agrupación es didáctica.","centro":{"t":"Tipologías UIF","s":"26 casos<br>2009 a 2023"},"ramas":[{"letra":"A","titulo":"A · Corrupción y recursos públicos","pregunta":"¿Quién abusa del cargo o del dinero público?","ritmo":"¿Quién abusa?","corto":"Corrupción","color":"morado","items":[{"etiqueta":"2022","nombre":"Personas Políticamente Expuestas (PEPs)","sub":"¿El ex servidor y su familia?","verbo":"Emparento","desc":"Un ex servidor público y su red familiar lavan dinero de corrupción, delincuencia organizada y robo de hidrocarburos con un conglomerado de empresas fachada.","orden":1,"panel":"Tipología 2022 · Personas Políticamente Expuestas (PEPs)","puntos":["<b>El caso:<\/b> Un ex servidor público (PEP) y su red familiar utilizan un conglomerado de empresas fachada para lavar recursos provenientes de actos de corrupción, delincuencia organizada y robo de hidrocarburos.","<b>Palabras clave:<\/b> PEP y Familia · Robo de Hidrocarburos · Empresas Fachada","<b>Señales de alerta:<\/b><ul><li>Múltiples depósitos y retiros en efectivo por montos altos.<\/li><li>Discrepancia entre declaraciones fiscales y montos operados.<\/li><li>Vínculos con empresas fantasma y personas en listas negras del SAT.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El <b>robo de hidrocarburos<\/b> como uno de los orígenes y un <b>ex servidor PEP<\/b> que opera con su red familiar; vínculos con listas negras del SAT."],"destacado":false},{"etiqueta":"2020","nombre":"Corrupción ex servidor público","sub":"¿Vive por encima de su sueldo?","verbo":"Enriquezco","desc":"Al dejar el cargo, un ex funcionario vive muy por encima de su salario y mueve fondos a paraísos fiscales con empresas fachada y excontratistas.","orden":2,"panel":"Tipología 2020 · Corrupción ex servidor público","puntos":["<b>El caso:<\/b> Un ex funcionario público muestra un estilo de vida inconsistente con su salario después de dejar el cargo, utilizando una red de empresas fachada y excontratistas para canalizar fondos a paraísos fiscales.","<b>Palabras clave:<\/b> Ex Funcionario · Nivel de Vida Incongruente · Contratistas · Paraísos Fiscales","<b>Señales de alerta:<\/b><ul><li>Desvío de fondos gubernamentales a paraísos fiscales.<\/li><li>Incongruencia entre declaraciones patrimoniales y gastos.<\/li><li>Pagos a tarjetas de crédito muy superiores a los ingresos declarados.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El <b>nivel de vida<\/b> incongruente con su salario y declaraciones patrimoniales, y los <b>excontratistas<\/b> de la dependencia; pagos a tarjetas muy superiores a sus ingresos."],"destacado":false},{"etiqueta":"2020","nombre":"Cohecho alto ejecutivo sector energético","sub":"¿Quién pagó el soborno?","verbo":"Soborno","desc":"Una empresa extranjera soborna a un alto ejecutivo del sector energético para ganar contratos; esconde el pago con fachadas en paraísos fiscales y fideicomisos.","orden":3,"panel":"Tipología 2020 · Cohecho alto ejecutivo sector energético","puntos":["<b>El caso:<\/b> Una empresa extranjera soborna a un alto ejecutivo del sector energético para obtener contratos, utilizando software sofisticado, empresas fachada en paraísos fiscales y fideicomisos familiares.","<b>Palabras clave:<\/b> Soborno (Cohecho) · Sector Energético · Empresa Extranjera · Software Sofisticado","<b>Señales de alerta:<\/b><ul><li>Perfil de beneficiarios (estudiante, ama de casa) incongruente con los fondos.<\/li><li>Depósitos por transferencia por encima del umbral y retiros por esos montos en la misma fecha.<\/li><li>Depósitos y retiros en efectivo por encima del umbral de aviso.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Quien paga es una <b>empresa extranjera<\/b>; beneficiarios de perfil incongruente (estudiante, ama de casa) y <b>fideicomisos familiares<\/b>."],"destacado":false},{"etiqueta":"2020","nombre":"Estafa Maestra versión Pemex","sub":"¿La universidad podía dar el servicio?","verbo":"Simulo","desc":"Un funcionario de PEMEX crea empresas fachada que reciben fondos públicos desviados por una universidad contratada para servicios que no puede prestar.","orden":4,"panel":"Tipología 2020 · Estafa Maestra versión Pemex","puntos":["<b>El caso:<\/b> Una red de empresas fachada, creadas por un funcionario de PEMEX, recibe fondos públicos desviados a través de una universidad que es contratada para servicios que no puede proveer.","<b>Palabras clave:<\/b> PEMEX · Universidad Pública · Servicios Simulados · Empresas Fantasma","<b>Señales de alerta:<\/b><ul><li>Contratación de universidades para servicios que no pueden proveer.<\/li><li>Reparto de los recursos a empresas catalogadas por el SAT como fantasma.<\/li><li>Accionistas de empresas son familiares o prestanombres de funcionarios.<\/li><\/ul>","<b>Lo que la distingue:<\/b> La universidad es el <b>conducto<\/b> del desvío: la contratan para servicios que <b>no puede proveer<\/b> y subcontrata a fachadas."],"destacado":false},{"etiqueta":"2016","nombre":"Abuso de sindicatos","sub":"¿A dónde van los fondos del sindicato?","verbo":"Desvío","desc":"Fondos de un sindicato se desvían a cuentas de un grupo pequeño y pagan bienes y servicios de lujo para el líder sindical.","orden":5,"panel":"Tipología 2016 · Abuso de sindicatos","puntos":["<b>El caso:<\/b> Fondos de un sindicato laboral son desviados a cuentas de un pequeño grupo para ser usados en la compra de bienes y servicios de lujo para el líder sindical.","<b>Palabras clave:<\/b> Sindicato Laboral · Líder Sindical · Desvío de Fondos · Bienes de Lujo","<b>Señales de alerta:<\/b><ul><li>Sindicato concentra operaciones en pocas cuentas bancarias.<\/li><li>Transferencias para pago de bienes de lujo no acordes al perfil del sindicato.<\/li><li>Poca permanencia de los recursos en las cuentas destino.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Los fondos de un <b>sindicato<\/b> se concentran en <b>pocas cuentas<\/b> y pagan bienes y servicios de lujo del <b>líder sindical<\/b>."],"destacado":false},{"etiqueta":"2019","nombre":"Institución educativa de nivel superior","sub":"¿Por qué el dinero fue y regresó?","verbo":"Triangulo","desc":"Una universidad recibe dinero ilícito, lo triangula al extranjero y lo regresa a México; usa un patronato y máquinas de juego.","orden":6,"panel":"Tipología 2019 · Institución educativa de nivel superior","puntos":["<b>El caso:<\/b> Una universidad recibe dinero ilícito, lo triangula internacionalmente y lo regresa a México. Utiliza un patronato y gasta fondos públicos en máquinas de juego para lavar dinero.","<b>Palabras clave:<\/b> Universidad · Triangulación Internacional · Patronato · Máquinas de Juego","<b>Señales de alerta:<\/b><ul><li>Transferencias internacionales elevadas sin justificación comercial.<\/li><li>Recursos enviados a diferentes países que luego retornan al país de origen.<\/li><li>Inversión de recursos públicos en máquinas de juego.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Aquí la universidad <b>recibe y triangula<\/b> el dinero (va al extranjero y regresa), con <b>patronato<\/b> y <b>máquinas de juego<\/b>."],"destacado":false}]},{"letra":"B","titulo":"B · Empresas, OSFL y comercio exterior","pregunta":"¿Detrás de qué figura se esconde el dinero?","ritmo":"¿Detrás de qué?","corto":"Fachadas","color":"principal","items":[{"etiqueta":"2021","nombre":"El Licenciado","sub":"¿Quién arma el esquema?","verbo":"Asesoro","desc":"Un abogado actúa como operador financiero del líder de un cártel y arma el lavado con empresas fachada (exportadoras de autos de lujo, seguridad) y una OSFL.","orden":1,"panel":"Tipología 2021 · El Licenciado","puntos":["<b>El caso:<\/b> Un abogado actúa como operador financiero de un líder de un cártel, articulando un esquema de lavado a través de empresas fachada (exportadoras de vehículos de lujo, seguridad, etc.) y una OSFL.","<b>Palabras clave:<\/b> Abogado Operador Financiero · Cártel de la Droga · Exportación de Vehículos · OSFL","<b>Señales de alerta:<\/b><ul><li>Relación profesional cercana con diversos líderes de cárteles.<\/li><li>Uso de empresas exportadoras de bienes de lujo para lavar dinero.<\/li><li>Empresas fachada con giros diversos y sin relación aparente.<\/li><li>Utilización de una OSFL para canalizar fondos.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Un <b>profesionista<\/b> (abogado) es el operador financiero; exportación de <b>vehículos de lujo<\/b> y una OSFL."],"destacado":false},{"etiqueta":"2021","nombre":"León Chino (comercio exterior)","sub":"¿Cuánto valía lo importado?","verbo":"Sobrefacturo","desc":"Empresas fachada envían al extranjero mucho más que el valor de lo que importan; el esquema se fondea con depósitos de «pitufos».","orden":2,"panel":"Tipología 2021 · León Chino (comercio exterior)","puntos":["<b>El caso:<\/b> Tres empresas fachada envían al extranjero montos muy superiores al valor de lo que importan, encubiertos en la simulación de actos de comercio exterior. El esquema se fondea con depósitos masivos en efectivo realizados por \"pitufos\".","<b>Palabras clave:<\/b> Comercio Exterior (TBML) · Sobrefacturación · \"Pitufos\"","<b>Señales de alerta:<\/b><ul><li>Valor de importaciones es significativamente inferior al monto enviado al extranjero.<\/li><li>Uso masivo de depósitos en efectivo (\"pitufeo\").<\/li><li>Empresas que iniciaron operaciones con un capital social mínimo para los grandes volúmenes operados.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El valor importado es <b>mucho menor<\/b> que lo enviado al extranjero y se fondea con <b>pitufeo<\/b>."],"destacado":false},{"etiqueta":"2021","nombre":"Fentanilo (tráfico y comercio exterior)","sub":"¿Qué decía el pedimento?","verbo":"Disfrazo","desc":"Un traficante importa fentanilo con empresas fachada declarándolo como otra sustancia; las mismas empresas importan bienes legales para mezclar ganancias.","orden":3,"panel":"Tipología 2021 · Fentanilo (tráfico y comercio exterior)","puntos":["<b>El caso:<\/b> Un traficante utiliza empresas fachada para importar ilegalmente fentanilo, declarándolo como otra sustancia. Estas mismas empresas importan bienes legales para mezclar las ganancias de la droga con ingresos lícitos.","<b>Palabras clave:<\/b> Fentanilo · Fraude Aduanero · Comercio Exterior · Mezcla de Fondos","<b>Señales de alerta:<\/b><ul><li>El domicilio de la empresa no cuenta con las características físicas de un centro de trabajo y no fue posible localizar datos de comercio exterior.<\/li><li>Coincidencia de domicilio entre personas y empresas del esquema.<\/li><li>Triangulación de recursos entre empresas con actividades no concordantes.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Se importa la <b>droga misma<\/b> con declaración falsa; los bienes legales sirven para <b>mezclar<\/b> los fondos."],"destacado":false},{"etiqueta":"2016","nombre":"Estructura corporativa simula operaciones","sub":"¿Lavan para otros?","verbo":"Maquilo","desc":"Una organización criminal monta una red de empresas fachada para ofrecer lavado de dinero como servicio a otros grupos, con prestanombres y oficinas virtuales.","orden":4,"panel":"Tipología 2016 · Estructura corporativa simula operaciones","puntos":["<b>El caso:<\/b> Una organización criminal crea una extensa red de empresas fachada para ofrecer servicios profesionales de lavado de dinero a otros grupos. Utilizan prestanombres y oficinas virtuales.","<b>Palabras clave:<\/b> Lavado como Servicio · Red de Empresas · Oficinas Virtuales","<b>Señales de alerta:<\/b><ul><li>Numerosas transferencias internacionales sin actividad comercial declarada.<\/li><li>Uso de oficinas virtuales o domicilios particulares como sede de múltiples empresas.<\/li><li>Accionistas son empleados jóvenes de bajo perfil.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El <b>lavado como servicio<\/b> para terceros y las <b>oficinas virtuales<\/b> como sede de múltiples empresas."],"destacado":false},{"etiqueta":"2020","nombre":"OSFL con actividades religiosas","sub":"¿Una OSFL religiosa que invierte?","verbo":"Lucro","desc":"Cinco OSFL religiosas dirigidas por la misma persona hacen inversiones y compran bienes de lujo, evadiendo impuestos para su líder.","orden":5,"panel":"Tipología 2020 · OSFL con actividades religiosas","puntos":["<b>El caso:<\/b> Cinco OSFL con fines religiosos, dirigidas por la misma persona, se utilizan para actividades lucrativas como inversiones y compra de bienes de lujo, evadiendo impuestos para su líder.","<b>Palabras clave:<\/b> OSFL Religiosa · Actividades Lucrativas · Líder Religioso","<b>Señales de alerta:<\/b><ul><li>OSFL religiosas realizando actos con fines eminentemente lucrativos.<\/li><li>Transferencias a paraísos fiscales.<\/li><li>Compra de bienes de lujo no acordes a su objeto social.<\/li><\/ul>","<b>Lo que la distingue:<\/b> <b>Cinco<\/b> OSFL religiosas con <b>un mismo<\/b> líder, realizando actos con fines eminentemente lucrativos (inversiones, bienes de lujo) para evadir impuestos del líder."],"destacado":false},{"etiqueta":"2020","nombre":"Asociación altruista ¿apoya a migrantes?","sub":"¿Quién es el testaferro?","verbo":"Reenvío","desc":"Una OSFL que dice apoyar a migrantes maneja dinero ilícito: recibe y reenvía rápido, retira efectivo fraccionado y usa a un adulto mayor como testaferro.","orden":6,"panel":"Tipología 2020 · Asociación altruista ¿apoya a migrantes?","puntos":["<b>El caso:<\/b> Una OSFL que supuestamente apoya a migrantes se usa como fachada para manejar dinero ilícito, realizando operaciones injustificadas y utilizando a una persona de edad avanzada como testaferro.","<b>Palabras clave:<\/b> OSFL · Ayuda a Migrantes · Testaferro Adulto Mayor","<b>Señales de alerta:<\/b><ul><li>Recepción de transferencias que son reenviadas rápidamente.<\/li><li>Uso de una persona de edad muy avanzada como testaferro.<\/li><li>Retiros frecuentes en efectivo por montos fraccionados.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Testaferro de <b>edad muy avanzada<\/b>; transferencias que se <b>reenvían<\/b> rápido y retiros fraccionados."],"destacado":false},{"etiqueta":"2016","nombre":"Bienes raíces con dinero ilícito","sub":"¿Con qué construye?","verbo":"Construyo","desc":"Una inmobiliaria de reciente creación financia proyectos enormes sin fuente lícita de recursos y simula preventas liquidadas de contado.","orden":7,"panel":"Tipología 2016 · Bienes raíces con dinero ilícito","puntos":["<b>El caso:<\/b> Una empresa inmobiliaria de reciente creación financia proyectos de gran magnitud sin una fuente lícita de recursos, simulando preventas con liquidaciones de contado.","<b>Palabras clave:<\/b> Sector Inmobiliario · Sin Fondos Lícitos · Preventas Falsas","<b>Señales de alerta:<\/b><ul><li>Empresas de reciente creación operando montos elevados.<\/li><li>Personas jóvenes como representantes legales de múltiples empresas.<\/li><li>Esquemas de preventa con alto porcentaje de operaciones de contado.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Inmobiliaria de reciente creación con <b>preventas<\/b> liquidadas en alto porcentaje <b>de contado<\/b> y sin fuente lícita de recursos."],"destacado":false},{"etiqueta":"2016","nombre":"Compañía con operaciones lícitas","sub":"¿El negocio es real?","verbo":"Mezclo","desc":"Una empresa legítima de zona fronteriza, con mucho efectivo, mezcla fondos ilícitos con sus ingresos y usa triangulación y personas con esquema de «ruta de dinero».","orden":8,"panel":"Tipología 2016 · Compañía con operaciones lícitas","puntos":["<b>El caso:<\/b> Una empresa legítima en zona fronteriza y con alto manejo de efectivo, mezcla fondos ilícitos con sus ingresos legales, usando triangulación y dispersando a personas con esquema de \"ruta de dinero\".","<b>Palabras clave:<\/b> Mezcla de Fondos · Negocio Legítimo · Zona Fronteriza","<b>Señales de alerta:<\/b><ul><li>Personas que reciben recursos de otras en Lista de Personas Bloqueadas.<\/li><li>Operaciones entre personas con el mismo domicilio fiscal.<\/li><li>Dispersión de recursos a sujetos jóvenes de estrato social bajo.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Un negocio <b>real<\/b> de zona <b>fronteriza<\/b> con mucho efectivo que mezcla y dispersa a <b>jóvenes de estrato bajo<\/b> con esquema de <b>ruta de dinero<\/b>; contrapartes en la Lista de Personas Bloqueadas (también en Trata y lenocinio) (sin explotación sexual, a diferencia de Trata y lenocinio)."],"destacado":false},{"etiqueta":"2009","nombre":"Uso de identidad","sub":"¿La empresa existe?","verbo":"Falsifico","desc":"Lavadores extranjeros, con cómplices locales, usan actas constitutivas falsas para crear empresas inexistentes y transferir al extranjero.","orden":9,"panel":"Tipología 2009 · Uso de identidad","puntos":["<b>El caso:<\/b> Lavadores de dinero extranjeros, con ayuda de cómplices locales, utilizan documentos constitutivos falsos para crear empresas inexistentes y realizar transferencias al extranjero.","<b>Palabras clave:<\/b> Identidad Falsa · Documentos Falsos · Lavadores Extranjeros","<b>Señales de alerta:<\/b><ul><li>Inconsistencias en actas constitutivas (fechas ilógicas).<\/li><li>Visitas domiciliarias constatan la inexistencia física de la empresa.<\/li><li>Múltiples transferencias pequeñas a múltiples beneficiarios en el extranjero.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Documentos <b>falsos<\/b> (fechas ilógicas en actas) y visita domiciliaria que confirma que la empresa <b>no existe<\/b>."],"destacado":false}]},{"letra":"C","titulo":"C · Personas y productos del banco","pregunta":"¿Qué persona o producto financiero se presta?","ritmo":"¿Qué se presta?","corto":"Banco","color":"oscuro","items":[{"etiqueta":"2016","nombre":"Uso de personas jóvenes para enviar dinero","sub":"¿Cuántos años tiene el titular?","verbo":"Recluto","desc":"Nueve sujetos sin registro fiscal, cuatro de ellos menores de 25 años, reciben depósitos en efectivo del narcotráfico y los transfieren rápido al extranjero.","orden":1,"panel":"Tipología 2016 · Uso de personas jóvenes para enviar dinero","puntos":["<b>El caso:<\/b> Nueve sujetos de una ciudad fronteriza, cuatro de ellos menores de 25 años y ninguno inscrito ante el SAT, reciben depósitos en efectivo de origen ilícito (narcotráfico) y los transfieren rápidamente a 17 empresas en el extranjero.","<b>Palabras clave:<\/b> Jóvenes (Mulas) · Sin Registro Fiscal · Narcotráfico","<b>Señales de alerta:<\/b><ul><li>Cuentas de recién apertura con alta operatividad.<\/li><li>La edad de los sujetos no es acorde a los montos manejados.<\/li><li>Sujetos no registran actividad fiscal.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Titulares cuya <b>edad<\/b> no es acorde a los montos (cuatro de nueve, menores de 25), <b>sin actividad fiscal<\/b>, cuentas de recién apertura con alta operatividad."],"destacado":false},{"etiqueta":"2009","nombre":"Ruta de dinero","sub":"¿Retiran todos a la vez?","verbo":"Sincronizo","desc":"Dólares en efectivo se cambian a pesos en la frontera, se depositan en muchas cuentas de bajo perfil y se retiran de forma simultánea y coordinada.","orden":2,"panel":"Tipología 2009 · Ruta de dinero","puntos":["<b>El caso:<\/b> Dólares en efectivo se cambian por pesos en la frontera y se depositan en múltiples cuentas de personas de bajo perfil. Los fondos son retirados de manera simultánea y coordinada.","<b>Palabras clave:<\/b> Cuentas de Terceros · Retiros Simultáneos · Frontera Norte","<b>Señales de alerta:<\/b><ul><li>Depósitos en efectivo en la frontera a cuentas del interior del país.<\/li><li>Actividad del titular no congruente con los montos.<\/li><li>Retiro simultáneo de los recursos sin permanencia.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Depósitos en la <b>frontera<\/b> a cuentas del interior y <b>retiro simultáneo<\/b> sin permanencia."],"destacado":false},{"etiqueta":"2009","nombre":"Uso de cajas de seguridad","sub":"¿Qué guarda en la caja?","verbo":"Guardo","desc":"Un funcionario público ligado al narcotráfico guarda efectivo ilícito y joyas en una caja de seguridad bancaria para no dejar rastro.","orden":3,"panel":"Tipología 2009 · Uso de cajas de seguridad","puntos":["<b>El caso:<\/b> Un funcionario público ligado al narcotráfico utiliza una caja de seguridad bancaria para resguardar efectivo ilícito y joyas, evitando dejar rastro en el sistema financiero.","<b>Palabras clave:<\/b> Caja de Seguridad · Resguardo de Efectivo · Funcionario Público","<b>Señales de alerta:<\/b><ul><li>Titular es un servidor público de áreas de seguridad.<\/li><li>Alta frecuencia de acceso a la caja.<\/li><li>Perfil del solicitante no justifica la necesidad del servicio.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El producto es la <b>caja de seguridad<\/b>: alta frecuencia de acceso; titular servidor público de áreas de seguridad."],"destacado":false},{"etiqueta":"2009","nombre":"Cuenta personal para actividad empresarial","sub":"¿Persona física o empresa?","verbo":"Camuflo","desc":"Una persona física recibe en su cuenta personal grandes depósitos de empresas ligadas al narco y los hace pasar como operaciones personales.","orden":4,"panel":"Tipología 2009 · Cuenta personal para actividad empresarial","puntos":["<b>El caso:<\/b> Una persona física utiliza su cuenta bancaria personal para recibir grandes depósitos de empresas ligadas al narco, haciendo pasar operaciones comerciales como personales.","<b>Palabras clave:<\/b> Cuenta Personal · Actividad Empresarial · Ocultamiento","<b>Señales de alerta:<\/b><ul><li>Cuenta \"personal\" que recibe fondos de empresas.<\/li><li>Montos operados exceden el perfil transaccional.<\/li><li>Múltiples firmantes sin relación aparente con el titular.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Cuenta <b>personal<\/b> que recibe fondos <b>de empresas<\/b>; varios firmantes sin relación con el titular."],"destacado":false},{"etiqueta":"2009","nombre":"Transferencias a beneficiarios comunes","sub":"¿Todos le envían al mismo?","verbo":"Concentro","desc":"Muchas personas de bajo perfil depositan efectivo y transfieren a un mismo beneficiario en el extranjero, vendedor o intermediario de aeronaves.","orden":5,"panel":"Tipología 2009 · Transferencias a beneficiarios comunes","puntos":["<b>El caso:<\/b> Múltiples personas de bajo perfil depositan efectivo y ordenan transferencias a un mismo beneficiario en el extranjero, vendedor o intermediario de aeronaves que compran integrantes de organizaciones delictivas.","<b>Palabras clave:<\/b> Beneficiario Común · Compra de Activos · Aeronaves","<b>Señales de alerta:<\/b><ul><li>Actividad del ordenante no tiene relación con el beneficiario.<\/li><li>Múltiples ordenantes enviando fondos a un mismo beneficiario.<\/li><li>Centros cambiarios ordenando transferencias al extranjero.<\/li><\/ul>","<b>Lo que la distingue:<\/b> <b>Muchos<\/b> ordenantes → <b>un<\/b> beneficiario en el extranjero; aeronaves; centros cambiarios que ordenan transferencias."],"destacado":false}]},{"letra":"D","titulo":"D · Fraude, tecnología y explotación","pregunta":"¿Quién es la víctima o qué tecnología se usa?","ritmo":"¿Qué víctima?","corto":"Fraude","color":"negro","items":[{"etiqueta":"2023","nombre":"Montadeudas","sub":"¿Quién presta por app?","verbo":"Extorsiono","desc":"Apps fraudulentas dan préstamos rápidos con intereses exorbitantes y extorsionan a las víctimas con sus contactos y fotos para cobrar.","orden":1,"panel":"Tipología 2023 · Montadeudas","puntos":["<b>El caso:<\/b> Aplicaciones móviles fraudulentas ofrecen préstamos rápidos con intereses exorbitantes y extorsionan a las víctimas usando sus contactos y fotos personales para forzar el pago.","<b>Palabras clave:<\/b> Apps de Préstamos · Extorsión · Cobranza Ilegal · Ostentación como Entidad Financiera","<b>Señales de alerta:<\/b><ul><li>Empresas que se ostentan como Entidad Financiera sin autorización.<\/li><li>Rápido movimiento de fondos vía SPEIs a través de FINTECHs.<\/li><li>Uso de amenazas y cobranza extrajudicial ilegal.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Se ostentan como entidad financiera <b>sin autorización<\/b>; cobranza ilegal y SPEI rápidos a través de FINTECH."],"destacado":false},{"etiqueta":"2022","nombre":"Uso ilícito de activos virtuales","sub":"¿Dónde compró las criptomonedas?","verbo":"Convierto","desc":"Un grupo familiar lava dinero del narcotráfico comprando criptomonedas en una plataforma no regulada y las transfiere al extranjero.","orden":2,"panel":"Tipología 2022 · Uso ilícito de activos virtuales","puntos":["<b>El caso:<\/b> Un grupo familiar lava dinero del narcotráfico comprando activos virtuales (criptomonedas) a través de una plataforma no regulada (VASP), para luego transferir los fondos internacionalmente.","<b>Palabras clave:<\/b> Activos Virtuales (Cripto) · VASP no regulado · Operación Familiar","<b>Señales de alerta:<\/b><ul><li>Compra de Activos Virtuales en plataformas no registradas ante el SAT.<\/li><li>Depósitos en efectivo en zonas de riesgo por narcotráfico.<\/li><li>Personas jóvenes operando montos elevados.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Compra de activos virtuales en una plataforma <b>no registrada ante el SAT<\/b> (VASP no regulado) con efectivo del <b>narcotráfico<\/b>."],"destacado":false},{"etiqueta":"2021","nombre":"Cajeros automáticos (skimming)","sub":"¿Dónde retiran?","verbo":"Clono","desc":"Una banda extranjera instala dispositivos de skimming en cajeros
