iciario que no coincide de Fraudes informáticos (2018).","ref":"Tipología UIF 2022 · Uso ilícito de activos virtuales"},{"id":"H077","tema":"2.1-tip.D","tipo":"trampa","q":"Trata de personas (2019) y Uso ilícito de activos virtuales (2022) mencionan criptomonedas y operación familiar. Si el efectivo proviene del narcotráfico y se convierte en una plataforma no registrada ante el SAT, ¿de cuál tipología se trata?","a":"Uso ilícito de activos virtuales","o":["Trata de personas","Uso de personas jóvenes para enviar dinero","Uso ilícito de activos virtuales","Cajeros automáticos (skimming)"],"x":"Efectivo del narcotráfico convertido en criptomonedas en una plataforma no registrada es Uso ilícito de activos virtuales (UIF 2022). En Trata de personas (2019) las criptomonedas lavan ganancias de la explotación sexual de mujeres extranjeras captadas con un sitio web.","ref":"Tipología UIF 2022 · Uso ilícito de activos virtuales"},{"id":"H078","tema":"2.1-tip.D","tipo":"caso","q":"El área de monitoreo detecta que muchos retiros con tarjetas de distintos clientes se concentran en terminales de retiro de efectivo de un destino turístico. Los fondos terminan en cuentas de extranjeros de la misma nacionalidad, que después compran relojes y vehículos de lujo. ¿Qué tipología describe mejor el caso?","a":"Cajeros automáticos (skimming)","o":["Fraudes informáticos","Cajeros automáticos (skimming)","Uso de identidad","Montadeudas"],"x":"Retiros concentrados en zonas turísticas y beneficiarios extranjeros de la misma nacionalidad son Cajeros automáticos (skimming) (UIF 2021). Uso de identidad (2009) también involucra extranjeros, pero su método son empresas inexistentes con documentos falsos.","ref":"Tipología UIF 2021 · Cajeros automáticos (skimming)"},{"id":"H079","tema":"2.1-tip.D","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Cajeros automáticos (skimming)?","a":"Beneficiarios extranjeros de la misma nacionalidad","o":["Uso de amenazas y de cobranza extrajudicial ilegal","Personas identificadas en fuentes externas en redes de trata","Cuentas abiertas en sucursales lejanas al domicilio del titular","Beneficiarios extranjeros de la misma nacionalidad"],"x":"Que los beneficiarios sean extranjeros de la misma nacionalidad es señal de Cajeros automáticos (skimming) (UIF 2021). Las cuentas en sucursales lejanas son de Fraudes informáticos (2018), las amenazas de Montadeudas (2023) y las redes de trata de Trata de personas (2019).","ref":"Tipología UIF 2021 · Cajeros automáticos (skimming)"},{"id":"H080","tema":"2.1-tip.D","tipo":"caso","q":"Clientes de un banco que vacacionaron en un destino turístico reportan retiros que no reconocen. Se descubre que una banda extranjera instaló en las terminales de retiro dispositivos que copian los datos de las tarjetas, y que el dinero se lava con inversiones inmobiliarias. ¿Qué tipología describe mejor el caso?","a":"Cajeros automáticos (skimming)","o":["Cajeros automáticos (skimming)","Montadeudas","Fraudes informáticos","Bienes raíces con dinero ilícito"],"x":"Clonar tarjetas con dispositivos en terminales de zonas turísticas y lavar con inmuebles es Cajeros automáticos (skimming) (UIF 2021). Bienes raíces con dinero ilícito (2016) también termina en inmuebles, pero se trata de una desarrolladora con preventas de contado, sin clonación de tarjetas.","ref":"Tipología UIF 2021 · Cajeros automáticos (skimming)"},{"id":"H081","tema":"2.1-tip.D","tipo":"caso","q":"Un proveedor habitual aparentemente envía por correo a su cliente una factura con nuevos datos bancarios. El cliente paga, pero la cuenta destino pertenece a un tercero distinto del proveedor, fue abierta en una sucursal lejana al domicilio de su titular y los recursos se retiran de inmediato. ¿Qué tipología describe mejor el caso?","a":"Fraudes informáticos","o":["Fraudes informáticos","Cuenta personal para actividad empresarial","Montadeudas","Cajeros automáticos (skimming)"],"x":"Correos hackeados que envían facturas falsas y desvían pagos a cuentas cuyo titular no coincide con el beneficiario son Fraudes informáticos (UIF 2018). Cajeros automáticos (skimming) (2021) también es fraude tecnológico, pero clona tarjetas en cajeros de zonas turísticas.","ref":"Tipología UIF 2018 · Fraudes informáticos"},{"id":"H082","tema":"2.1-tip.D","tipo":"caso","q":"Una empresa extranjera informa que pagó una factura por servicios a una cuenta en México tras recibir un correo cuyo dominio difería ligeramente del de su proveedor real. La institución que recibió los fondos revisa la cuenta con la tipología Fraudes informáticos (UIF 2018). ¿Qué hallazgo al verificar los datos del pago sería señal de alerta de esa tipología?","a":"Incongruencia entre el beneficiario indicado y el titular real de la cuenta","o":["Concentración de retiros en cajeros ubicados en zonas turísticas del país","Compra de activos virtuales en plataformas no registradas ante el SAT","Incongruencia entre el beneficiario indicado y el titular real de la cuenta","Empresas que se ostentan como entidad financiera sin contar con autorización"],"x":"Que el nombre del beneficiario proporcionado por el defraudador no coincida con el titular real de la cuenta es señal de Fraudes informáticos (UIF 2018), pues las cuentas están a nombre de personas distintas al proveedor real. Ostentarse como entidad financiera sin autorización es de Montadeudas (2023) y, aunque también es una irregularidad, no se relaciona con un pago inducido por un correo falso. Los cajeros turísticos son de Skimming (2021) y las plataformas no registradas de Activos virtuales (2022).","ref":"Tipología UIF 2018 · Fraudes informáticos"},{"id":"H083","tema":"2.1-tip.D","tipo":"cifra","q":"¿Cuál es la única tipología del informe 2018 de la UIF?","a":"Fraudes informáticos","o":["Montadeudas","Cajeros automáticos (skimming)","Uso de identidad","Fraudes informáticos"],"x":"Fraudes informáticos es el único caso del informe UIF 2018. Cajeros automáticos (skimming) es de 2021, Montadeudas de 2023 y Uso de identidad de 2009.","ref":"Tipología UIF 2018 · Fraudes informáticos"},{"id":"H084","tema":"2.1-tip.D","tipo":"caso","q":"Una red integrada en su mayoría por familiares contacta a mujeres sudamericanas con falsas ofertas de trabajo como modelos. Ya en México les quitan sus documentos y las obligan a prostituirse mediante un sitio web de acompañamiento que funciona como fachada; las ganancias se lavan con empresas fantasma y criptomonedas. ¿Qué tipología describe mejor el caso?","a":"Trata de personas","o":["Trata y lenocinio","Uso ilícito de activos virtuales","Trata de personas","Cajeros automáticos (skimming)"],"x":"Víctimas extranjeras engañadas con ofertas de modelaje, un sitio web fachada y lavado con empresas fantasma y criptomonedas son Trata de personas (UIF 2019). En Trata y lenocinio (2021) la red también es mayormente familiar, pero otros integrantes mezclan el efectivo en un giro comercial legítimo.","ref":"Tipología UIF 2019 · Trata de personas"},{"id":"H085","tema":"2.1-tip.D","tipo":"trampa","q":"Trata de personas (2019) frente a Trata y lenocinio (2021): ¿qué rasgo es propio de la tipología de 2019?","a":"Víctimas extranjeras engañadas con ofertas de modelaje y explotadas mediante un sitio web fachada; lavado con empresas fantasma y criptomonedas","o":["Los recursos se transfieren a paraísos fiscales","Disposición de efectivo por montos inusuales y una integrante de la red en la Lista de Personas Bloqueadas","Víctimas extranjeras engañadas con ofertas de modelaje y explotadas mediante un sitio web fachada; lavado con empresas fantasma y criptomonedas","Otros miembros de la familia mezclan el efectivo ilícito con los ingresos de sus negocios legítimos"],"x":"Trata de personas (UIF 2019) se reconoce por las víctimas extranjeras engañadas con ofertas de modelaje, el sitio web fachada y las criptomonedas. La mezcla en un giro comercial, los paraísos fiscales, la disposición inusual de efectivo y la integrante en la Lista de Personas Bloqueadas son de Trata y lenocinio (2021). La compra de inmuebles y los domicilios comunes aparecen en las dos.","ref":"Tipología UIF 2019 · Trata de personas"},{"id":"H086","tema":"2.1-tip.D","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Trata de personas (informe 2019)?","a":"Personas físicas identificadas en fuentes externas en redes de trata","o":["Recepción de recursos de personas incluidas en la Lista de Personas Bloqueadas","Concentración de retiros en cajeros de zonas turísticas del país","Personas físicas identificadas en fuentes externas en redes de trata","Compra de activos virtuales en plataformas no registradas ante el SAT"],"x":"Que fuentes externas identifiquen a las personas en una red internacional de trata es señal de Trata de personas (UIF 2019). Recibir recursos de personas en la Lista de Personas Bloqueadas es señal de Trata y lenocinio (2021), los cajeros turísticos de Cajeros automáticos (2021) y las plataformas no registradas de Activos virtuales (2022).","ref":"Tipología UIF 2019 · Trata de personas"},{"id":"H087","tema":"2.1-tip.D","tipo":"caso","q":"Un cliente compra inmuebles y vehículos de lujo sin un origen claro de recursos, y sus operaciones no corresponden a la actividad que declaró. Fuentes externas lo ubican en una red internacional de trata que trae a mujeres sudamericanas con falsas ofertas de modelaje. ¿Qué tipología describe mejor el caso?","a":"Trata de personas","o":["Uso ilícito de activos virtuales","Trata y lenocinio","Trata de personas","Cajeros automáticos (skimming)"],"x":"La captación de mujeres extranjeras con falsas ofertas de modelaje y la compra de bienes de lujo sin origen claro apuntan a Trata de personas (UIF 2019). Trata y lenocinio (2021) no menciona víctimas extranjeras captadas con ofertas de modelaje; su rasgo es la mezcla en negocios legítimos de la familia.","ref":"Tipología UIF 2019 · Trata de personas"},{"id":"H088","tema":"2.1-tip.D","tipo":"caso","q":"Una red mayormente familiar somete a mujeres a explotación sexual en hoteles de varias entidades. Otros integrantes de la red manejan negocios legítimos donde mezclan el efectivo ilícito con los ingresos; luego compran inmuebles y transfieren recursos a paraísos fiscales. ¿Qué tipología describe mejor el caso?","a":"Trata y lenocinio","o":["Trata y lenocinio","Compañía con operaciones lícitas","Trata de personas","Uso ilícito de activos virtuales"],"x":"Explotación sexual por una red familiar cuyos parientes mezclan el efectivo en negocios legítimos y lavan con bienes raíces y paraísos fiscales es Trata y lenocinio (UIF 2021). Trata de personas (2019) se distingue por víctimas extranjeras, un sitio web de modelaje y criptomonedas.","ref":"Tipología UIF 2021 · Trata y lenocinio"},{"id":"H089","tema":"2.1-tip.D","tipo":"caso","q":"Una institución financiera analiza una red formada en su mayoría por parientes. Uno de sus integrantes entabla relaciones sentimentales con mujeres y niñas, las convence de mudarse a otras entidades del país y ahí las obliga a prostituirse en hoteles; él no tiene cuentas bancarias ni información fiscal. Otros parientes usan un giro comercial para mezclar el efectivo del delito con recursos lícitos, y varios integrantes registran disposición de efectivo por montos inusuales y gastos que sobrepasan su nivel transaccional. ¿Qué tipología describe mejor el caso?","a":"Trata y lenocinio","o":["Trata de personas","Uso ilícito de activos virtuales","Compañía con operaciones lícitas","Trata y lenocinio"],"x":"Una red familiar en la que un integrante seduce a mujeres y niñas, las lleva a otras entidades y las explota sexualmente en hoteles sin tener cuentas a su nombre, mientras otros integrantes mezclan el efectivo en un giro comercial y muestran disposición de efectivo inusual y gastos por encima de su nivel transaccional, es Trata y lenocinio (UIF 2021). Trata de personas (2019) es el distractor más tentador porque también es una red principalmente familiar, pero allí las víctimas son mujeres extranjeras atraídas con ofertas de modelaje y anunciadas en un sitio web fachada, y el dinero se lava con empresas fantasma y criptomonedas. Compañía con operaciones lícitas (2016) también mezcla recursos en un giro lícito, pero no hay explotación sexual: introduce el dinero en la frontera y lo retira mediante ruta de dinero. Uso ilícito de activos virtuales (2022) lava efectivo comprando activos virtuales.","ref":"Tipología UIF 2021 · Trata y lenocinio"},{"id":"H090","tema":"2.1-tip.D","tipo":"trampa","q":"¿Qué pregunta te ayuda a distinguir Trata y lenocinio (2021) de Trata de personas (2019)?","a":"¿Otros miembros de la familia mezclan el efectivo en negocios legítimos?","o":["¿La red criminal que explota a las víctimas está formada principalmente por familiares?","¿Las víctimas son mujeres sometidas a explotación sexual?","¿El dinero termina en la compra de inmuebles de alto valor?","¿Otros miembros de la familia mezclan el efectivo en negocios legítimos?"],"x":"La mezcla del efectivo en negocios legítimos de la familia es el rasgo de Trata y lenocinio (UIF 2021). Red familiar, explotación sexual de mujeres y compra de inmuebles aparecen en las dos tipologías, así que no sirven para distinguirlas.","ref":"Tipología UIF 2021 · Trata y lenocinio"},{"id":"H091","tema":"2.1-tip.D","tipo":"caso","q":"En un caso de explotación sexual a cargo de una red familiar, varios parientes tienen negocios establecidos donde se deposita el efectivo. ¿Qué señal de alerta de esta tipología esperaría encontrar el oficial?","a":"Operaciones entre personas que presentan un mismo domicilio fiscal","o":["Beneficiarios extranjeros de la misma nacionalidad","Operaciones entre personas que presentan un mismo domicilio fiscal","Uso de una persona de edad muy avanzada como testaferro","Compra de activos virtuales en plataformas de intercambio no registradas ante el SAT"],"x":"El caso describe Trata y lenocinio (UIF 2021), cuyas señales incluyen operaciones entre personas con el mismo domicilio fiscal, disposición inusual de efectivo y gastos superiores a lo declarado. Las otras opciones son de Skimming (2021), Activos virtuales (2022) y Asociación altruista (2020).","ref":"Tipología UIF 2021 · Trata y lenocinio"},{"id":"H092","tema":"2.1-tip.int","tipo":"caso","q":"Un cliente paga 1 millón de euros en efectivo por dos pólizas de seguro de vida y las cancela poco después, aceptando perder cerca de 40 % de lo invertido. ¿Qué señal de alerta ilustra el caso?","a":"Cancelación anticipada sin motivo aparente, aceptando el costo económico tras un pago grande en efectivo","o":["Cancelación anticipada sin motivo aparente, aceptando el costo económico tras un pago grande en efectivo","Pago de primas por una tercera persona sin relación clara con el asegurado, como posible figura pantalla en la operación","Cambio reiterado e inexplicable del beneficiario de la póliza contratada","Aseguramiento de bienes valiosos incongruente con el perfil económico del cliente"],"x":"El caso 2 de seguros (cancelación anticipada de pólizas) muestra que no es razonable cancelar sin motivo aparente una póliza asumiendo pérdidas; apunta al indicador de despreocupación por cargos adicionales o costos de cancelación anticipada. El texto, a propósito del caso 5, añade que la vulnerabilidad se relaciona con el periodo mínimo de vigencia (cooling-off period) tras el cual se puede pedir reembolso.","ref":"Tipologías GAFI 2022 (temario), seguros, caso 2 e indicadores 1.3.2"},{"id":"H093","tema":"2.1-tip.int","tipo":"caso","q":"Un agente de seguros recibe de su cliente un cheque de caja por un seguro de vida de 80 mil dólares. El cliente le confesó que el dinero venía del tráfico de drogas y le pagó una comisión generosa; tres meses después, el agente ejecuta la operación a sabiendas. ¿Qué vulnerabilidad del sector asegurador ilustra el caso?","a":"Complicidad de empleados, agentes o intermediarios","o":["Productos financieros sofisticados ofrecidos por aseguradoras","Operaciones internacionales con reaseguro off-shore","Creación de aseguradoras con capital simulado","Complicidad de empleados, agentes o intermediarios"],"x":"El caso 6 de seguros (Canadá) ilustra la complicidad del intermediario: el agente conoce el origen ilícito, recibe comisión generosa y ejecuta la operación. El texto también incluye entre los indicadores los cargos o comisiones inusualmente altos de intermediarios, o que el cliente acepte una comisión mayor a la normal.","ref":"Tipologías GAFI 2022 (temario), seguros, caso 6"},{"id":"H094","tema":"2.1-tip.int","tipo":"caso","q":"Una aseguradora extranjera recibe, por numerosas pólizas de vida que gestiona un agente, una sola transferencia «en bloque» a nombre del agente, procedente de terceros por medio de casas de cambio; después el agente detalla qué monto corresponde a cada póliza. Algunas pólizas se pagan con cheques de terceros y órdenes de pago estructuradas. ¿Qué indicador relacionado con las primas ilustra el caso?","a":"Pago de primas por terceras personas y desde múltiples fuentes","o":["Cambio de beneficiarios, sobre todo si es reiterado o inexplicable","Pago de primas por terceras personas y desde múltiples fuentes","Excesivo interés por conocer las opciones de cancelación o redención anticipada","Aseguramiento de bienes valiosos incongruente con el perfil económico"],"x":"El caso 9 de seguros muestra pagos de terceros, pagos en bloque a nombre del agente, cheques de terceros y órdenes de pago estructuradas, lo que corresponde a los indicadores de primas: pago por terceros (posible figura pantalla) y múltiples fuentes de pago. Los otros tres son indicadores relacionados con el asegurado, no con las primas.","ref":"Tipologías GAFI 2022 (temario), seguros, caso 9 e indicadores 1.3.3"},{"id":"H095","tema":"2.1-tip.int","tipo":"caso","q":"Una agencia de viajes con servicio de envío de dinero al sureste de Asia mezcla transferencias genuinas con dinero ilícito, que a veces recibe fuera del local para evadir la vigilancia. Registra esos depósitos en libros distintos a los de las transferencias legítimas, los deposita en el banco y transfiere por instrucciones de un ordenante en el extranjero. ¿Qué elementos contribuyeron a probar el lavado?","a":"La contabilidad paralela, el volumen de los depósitos y la incapacidad para explicar el origen de los recursos","o":["Operar con una licencia de transmisor que había sido negada meses antes, pese a la advertencia de la autoridad","La contabilidad paralela, el volumen de los depósitos y la incapacidad para explicar el origen de los recursos","Usar mensajeros que viajaban con paquetes vacacionales y cobraban con variaciones de su nombre","Abrir cuentas de tránsito por residentes de una misma región que transferían de inmediato todo a Asia"],"x":"El caso 7 de remesas dice que el volumen de los depósitos, la inhabilidad para explicar el origen de los recursos y la contabilidad paralela contribuyeron a probar el lavado. Los otros elementos pertenecen a otros casos: la licencia negada (caso 8), los mensajeros con paquetes vacacionales (caso 13) y las cuentas de tránsito (caso 9).","ref":"Tipologías GAFI 2022 (temario), remesas, caso 7"},{"id":"H096","tema":"2.1-tip.int","tipo":"caso","q":"Traficantes exportan lingotes declarados fraudulentamente como otros bienes; en el país de destino se importan correctamente declarados, y joyeros en colusión los funden y los convierten en cerrojos, tornillos y herramientas que se exportan de regreso, donde vuelven a ser lingotes. ¿Qué hacía atractivo repetir el ciclo?","a":"La ley del país de origen otorgaba créditos por exportar un producto manufacturado, y reutilizar el mismo oro permitía repetirlos","o":["Cada ciclo permitía cobrar la devolución de impuestos por sobrefacturar exportaciones de bienes de consumo","La ley del país de origen otorgaba créditos por exportar un producto manufacturado, y reutilizar el mismo oro permitía repetirlos","La fundición fraccionaba el valor del oro en montos menores al umbral de reporte de cada banco","El oro funcionaba como garantía de un crédito back-to-back concedido por el banco central del país"],"x":"El caso 11 de remesas explica que las leyes de exportación colombianas daban créditos por exportar un producto manufacturado, que ocultar el oro permitía transferir su valor y que reutilizarlo daba créditos adicionales por la misma mercancía. La sobrefacturación y la devolución de impuestos corresponden al caso 5, y el back-to-back, a un caso de Egmont.","ref":"Tipologías GAFI 2022 (temario), remesas, caso 11"},{"id":"H097","tema":"2.1-tip.int","tipo":"cifra","q":"Según el GAFI, en los casos de lavado recopilados en el sector asegurador (alrededor de 525 millones de dólares), ¿qué proporción involucraba algún tipo de seguro de vida?","a":"65 %","o":["30 %","5 %","65 %","85 %"],"x":"El texto de antecedentes dice que el 65 % de los casos involucraba seguro de vida, el 30 % otras variedades de seguro y el 5 % restante reaseguros. El 85 % no es una cifra de esta distribución. El proyecto evaluó el sector en 58 países y encontró pocos reportes de operaciones inusuales.","ref":"Tipologías GAFI 2022 (temario), seguros, antecedentes"},{"id":"H098","tema":"2.1-tip.int","tipo":"memoria","q":"En los indicadores del sector asegurador, ¿cuál se clasifica como relacionado con las primas?","a":"Pago de primas en exceso seguido de solicitud de reembolso, sobre todo si el excedente se transfiere a otras cuentas, terceros o jurisdicciones","o":["Pago de primas en exceso seguido de solicitud de reembolso, sobre todo si el excedente se transfiere a otras cuentas, terceros o jurisdicciones","Interés excesivo del cliente por conocer las opciones de cancelación o redención anticipada de la póliza, más que por proteger un siniestro","Asegurado que resulta ser pariente o socio de un conocido delincuente, lo que exige reforzar el conocimiento del cliente","Cobro inmediato o inusual de un seguro poco tiempo después de haberlo contratado, con posible siniestro fingido"],"x":"El apartado 1.3.3 (relacionados con las primas) incluye: pago de primas por terceros, múltiples fuentes de pago, pago en exceso seguido de solicitud de reembolso, y usar los servicios de la aseguradora para mover fondos como si fuera una cuenta bancaria. Las otras tres son indicadores relacionados con el asegurado (apartado 1.3.2).","ref":"Tipologías GAFI 2022 (temario), seguros, indicadores 1.3.2 y 1.3.3"},{"id":"H099","tema":"2.1-tip.int","tipo":"caso","q":"Una persona reporta a su aseguradora el robo de joyería valiosa en su casa. Dice que la recibió como parte del pago por la venta de un barco, pero no tiene otros bienes y sus ingresos de los años previos eran mínimos, por lo que no se explica que fuera dueña del barco. ¿Qué mecanismo de lavado ilustra el caso?","a":"Convertir bienes comprados con recursos ilícitos en dinero legítimo al cobrar una póliza constituida sobre esos bienes","o":["Cancelar anticipadamente una póliza de vida pagada en efectivo, aceptando una pérdida para recuperar los fondos como reembolso","Pagar las primas de pólizas de vida con transferencias de cuentas de terceros, después de una compra inicial hecha en efectivo","Obtener un crédito de un banco extranjero y liquidarlo con pólizas de vida que se ceden al banco al vencer","Convertir bienes comprados con recursos ilícitos en dinero legítimo al cobrar una póliza constituida sobre esos bienes"],"x":"Es el caso 3 de seguros: la estructura criminal transforma recursos ilícitos, ya convertidos en bienes, en dinero legítimo mediante el pago de una póliza constituida sobre ellos. La alerta es que la persona no podía justificar ser dueña del barco ni tenía ingresos congruentes con bienes de ese valor. La cancelación anticipada es lo más tentador, pero aquí no se cancela nada ni se pide reembolso de primas: el dinero limpio sale como indemnización por el siniestro. El pago de primas por terceros corresponde al caso 7 y la cesión de pólizas a un banco, al caso 8.","ref":"Tipologías GAFI 2022 (temario), seguros, caso 3"},{"id":"H100","tema":"2.1-tip.int","tipo":"caso","q":"Una tienda familiar que atiende a una comunidad migrante opera también como remesadora: acepta remesas genuinas y, además, depósitos de origen ilícito que anota en otro juego de libros. El banco de la tienda emite reportes de operaciones inusuales, pero el esquema sigue funcionando. Según el texto, ¿qué debió llevar al banco a considerar altamente sospechosas esas operaciones?","a":"Que los envíos de la comunidad fueran demasiado altos en volumen y frecuencia frente a lo esperable en esa población","o":["Que la tienda exhibiera en el mostrador una lista con los nombres de sus agentes pagadores asociados en el extranjero","Que el dinero se entregara al receptor final en el país de destino, ya fuera en efectivo o con un cheque","Que los envíos de la comunidad fueran demasiado altos en volumen y frecuencia frente a lo esperable en esa población","Que el negocio se presentara como una empresa familiar que presta servicios a una comunidad de migrantes"],"x":"En el caso 6 de remesas el banco emitió reportes, pero no advirtió que los envíos de la comunidad local eran demasiado altos. El texto concluye que conocer las características de esa comunidad y el volumen y la frecuencia de sus remesas habría mostrado que las operaciones eran altamente sospechosas. Los otros tres elementos son parte de la fachada legítima del negocio, no la señal de alerta. La contabilidad paralela, que también aparece, está en poder del negocio y no a la vista del banco: lo que éste sí podía hacer era contrastar los envíos con el perfil de la clientela atendida.","ref":"Tipologías GAFI 2022 (temario), remesas, caso 6"},{"id":"H101","tema":"2.1-tip.int","tipo":"caso","q":"Un comerciante que vende tarjetas telefónicas prepagadas, alimentos y boletos de avión ofrece también envíos de dinero a migrantes de un país sudamericano que viven en un país europeo; son su principal ingreso. Los clientes depositan en la cuenta del comerciante en el país europeo y, en el país de origen, familiares suyos entregan moneda local a los beneficiarios. Al principio no se movía dinero entre los dos países. ¿Qué mecanismo permitía esos pagos?","a":"Pagar con fondos que el comerciante tenía en el país de destino, mientras el dinero de los clientes quedaba en su cuenta local","o":["Convertir el efectivo en PIN de tarjetas telefónicas prepagadas y revenderlos en el país de destino para recuperar el dinero en efectivo","Pagar a exportadores que sobrefacturaban sus ventas, de modo que los fondos sirvieran para validar solicitudes de devolución de impuestos","Fundir lingotes de oro y convertirlos en herramientas que se exportaban de regreso para cobrar créditos adicionales por exportación","Pagar con fondos que el comerciante tenía en el país de destino, mientras el dinero de los clientes quedaba en su cuenta local"],"x":"En el caso 3 de remesas el comerciante tenía cuentas y capital en el país de destino y acordó con familiares que entregaran moneda local; los clientes depositaban en su cuenta local, así que al principio no había transferencia real entre países. Al crecer los montos recurrió a mensajeros con paquetes de billetes y a compañías especializadas en transferencias, y pedía fraccionar los envíos por debajo de 3 mil dólares. Los PIN de tarjetas telefónicas (caso 10) tientan porque también mueven valor sin pasar por el sistema financiero del destino, pero ahí el valor viaja como bien de consumo que se revende, no como pago local contra un depósito. La sobrefacturación corresponde al caso 5 y el oro, al caso 11.","ref":"Tipologías GAFI 2022 (temario), remesas, caso 3"},{"id":"H102","tema":"2.1-tip.int","tipo":"caso","q":"Un banco nota que un mismo grupo de personas cambia en varias sucursales más de veinte cheques en menos de dos semanas, todos de una empresa de remesas, por montos parecidos y debajo del umbral de reporte. Llegan juntos pero van a distintas ventanillas y usan el mismo automóvil. ¿Qué técnica describe el caso?","a":"Fraccionamiento de operaciones bajo el umbral de reporte, la llamada operación hormiga","o":["Transferencias back-to-back entre un agente en el extranjero y cuentas de un banco central","Uso de un casino para justificar el origen del efectivo como ganancias de apuestas","Fraccionamiento de operaciones bajo el umbral de reporte, la llamada operación hormiga","Reactivación de una cuenta inactiva con depósitos desde múltiples cuentas del extranjero"],"x":"En Egmont 13, la UIF habla de «una enorme operación hormiga»: múltiples transacciones debajo del límite, de cantidades parecidas, uso múltiple de servicios de envío de dinero y conducta sospechosa en el banco. El grupo fue acusado de tráfico de drogas y lavado. El back-to-back es de Egmont 1; el casino, de Egmont 4; y la cuenta inactiva, de Egmont 10.","ref":"Tipologías Egmont 2022 (temario), caso 13"},{"id":"H103","tema":"2.1-tip.int","tipo":"caso","q":"Un empleado de un casino ofrece a un cliente entregarle un cheque girado de la cuenta del casino por el efectivo que deposite, menos una comisión de 9 %, de modo que pueda explicar el dinero como ganancia de apuestas. ¿Qué mecanismo da apariencia de licitud al dinero?","a":"Un cheque del casino que permite presentar el efectivo como ganancia de juego","o":["Un préstamo a cinco años que se paga por adelantado en efectivo y se revende como bien","Una donación recibida por una empresa subsidiada que se transfiere a una constructora","La venta de un inmueble a un precio muy inferior al de mercado y su inmediata reventa","Un cheque del casino que permite presentar el efectivo como ganancia de juego"],"x":"En Egmont 4, un empleado de casino ofrece lavar dinero a un agente encubierto con un cheque del casino por el mismo monto menos comisión (9 %), de modo que el beneficiario pueda justificarlo como ganancia de apuestas. La UIF tenía reportes previos con grandes depósitos en efectivo seguidos pronto de retiros por transferencia.","ref":"Tipologías Egmont 2022 (temario), caso 4"},{"id":"H104","tema":"2.1-tip.int","tipo":"caso","q":"Una empresa subsidiada por el gobierno recibe una donación y la transfiere a una constructora cuyo presidente también controla otras compañías subcontratadas. El presidente pide al banco cambiar el nombre de dos cuentas de sus compañías por el de las subcontratadas, acreditan 340 mil dólares y luego cancela el cambio; el dinero se retira en efectivo y no hubo obra. ¿Qué indicador destaca?","a":"Cambios rápidos y contradictorios de los nombres o beneficiarios de las cuentas","o":["Reactivación de una cuenta inactiva, con ingresos de varias cuentas personales de otro país","Cambios rápidos y contradictorios de los nombres o beneficiarios de las cuentas","Posición defensiva ante un interrogatorio","Documentos emitidos por una institución financiera desconocida"],"x":"Egmont 24 destaca como indicador los cambios rápidos y contradictorios de nombres o beneficiarios de cuentas: al confundir los nombres, el presidente retiró los 340 mil dólares sin atraer la atención del banco, sin que se hiciera trabajo de construcción. La UIF consideró que la construcción era una operación de lavado.","ref":"Tipologías Egmont 2022 (temario), caso 24"},{"id":"H105","tema":"2.1-tip.int","tipo":"caso","q":"Un cliente compra un auto deportivo de lujo con un préstamo a cinco años y paga el resto en efectivo. La financiera descubre que ha recibido varios préstamos anteriores por la misma cantidad, todos liquidados por adelantado en efectivo; revendía los autos a particulares y a garajes y depositaba los cheques. ¿Qué señal de alerta destaca el caso?","a":"Pago anticipado de préstamos, liquidados en efectivo","o":["Uso del nombre de una compañía similar a otras ya establecidas","Cambios de último minuto en las instrucciones de movimiento de fondos","Pago anticipado de préstamos, liquidados en efectivo","Promesas de ganancias irracionales sobre inversiones"],"x":"El indicador de Egmont 12 es el pago anticipado de préstamos y la actividad inusual del cliente. El efectivo del narcotráfico entraba al sistema bancario como pago del préstamo y los cheques de la reventa lo mostraban como ingreso legítimo; la organización asumía la pérdida como un costo a cambio de fondos limpios.","ref":"Tipologías Egmont 2022 (temario), caso 12"},{"id":"H106","tema":"2.1-tip.int","tipo":"memoria","q":"En el caso de Egmont donde un supuesto fax del abogado indica los datos de la cuenta de clientes para que el banco deposite 1.3 millones de dólares y un funcionario verifica por teléfono, ¿qué indicador destaca el texto?","a":"Alteración de último minuto de las instrucciones del movimiento de fondos","o":["Alteración de último minuto de las instrucciones del movimiento de fondos","Reactivación de una cuenta inactiva con ingresos de varias cuentas personales","Uso del nombre de una compañía similar a otras ya establecidas en el mercado","Cobertura de los medios de comunicación sobre las actividades del tenedor de la cuenta"],"x":"En Egmont 6, el promotor pretendía que un banco offshore depositara 1,315,000 dólares con un fax falso; el fraude fracasó porque un funcionario telefoneó al abogado, que no reconoció el fax. El indicador del texto es la alteración de último minuto de las instrucciones del movimiento de fondos; el caso fue un intento frustrado y el promotor no se benefició económicamente.","ref":"Tipologías Egmont 2022 (temario), caso 6"},{"id":"H107","tema":"2.1-tip.int","tipo":"caso","q":"Una mujer, amenazada junto con su hijo por su pareja, abre varias cuentas en pocas semanas y recibe depósitos de personas que no conoce, entre ellas un individuo de un centro financiero europeo y un abogado del país de origen de la pareja; después es obligada a comprar una casa en un centro turístico. ¿Qué indicadores señala el caso?","a":"Muchas cuentas abiertas en un breve periodo y partes no relacionadas que canalizan fondos a una sola cuenta","o":["Muchas cuentas abiertas en un breve periodo y partes no relacionadas que canalizan fondos a una sola cuenta","Uso de documentos falsos o robados y transferencias internacionales justo debajo del umbral de reporte, estructuradas por varios viajeros","Pago anticipado de préstamos y transferencia de bienes a precios inferiores a los de mercado","Cambios rápidos y contradictorios de nombres de cuentas y retiros en efectivo hacia un tercero"],"x":"Egmont 21 señala actividad atípica de la cuenta, muchas cuentas abiertas en un breve periodo y partes no relacionadas que canalizan fondos a una sola cuenta. La UIF relacionó al sujeto, que usaba alias, con una red de contrabando de resina de cannabis; la mujer no fue acusada por la coerción violenta que sufrió.","ref":"Tipologías Egmont 2022 (temario), caso 21"},{"id":"H108","tema":"2.1-tip.int","tipo":"trampa","q":"Un representante de una compañía de gran prestigio deposita dos cheques por montos muy altos y ordena transferir el dinero a cuentas en varios países. El banco no indaga el origen de los fondos por la reputación de la empresa y, tras transferir una parte, descubre que los cheques eran falsificados. ¿Qué enseña el caso sobre la reputación del cliente?","a":"No exime de verificar el origen de los fondos cuando hay transferencias atípicas hacia jurisdicciones extranjeras","o":["Que un cheque de monto alto sólo amerita análisis si se cobra en efectivo en ventanilla y no cuando se deposita en una cuenta","Que con un cliente de larga trayectoria basta confirmar la identidad de su representante, sin cuestionar el origen de los fondos","No exime de verificar el origen de los fondos cuando hay transferencias atípicas hacia jurisdicciones extranjeras","Que la falsificación de cheques es un fraude y no lavado, por lo que los bancos receptores no debían suspender ni informar sus operaciones"],"x":"El banco no investigó porque confió en el prestigio de la empresa; sólo después de transferir una parte se supo que los cheques eran falsificados. Las alertas eran la transferencia atípica hacia el extranjero y las transacciones de gran escala, no la reputación, y confiar en ella es la trampa. Además, los bancos que recibieron el dinero en otro país pospusieron 24 horas las órdenes de sus clientes e informaron a su UIF, que congeló los fondos y presentó cargos por sospecha de lavado: un fraude de origen también termina en reporte por lavado.","ref":"Tipologías Egmont 2022 (temario), caso 2"},{"id":"H109","tema":"2.1-tip.int","tipo":"caso","q":"Una compañía publica anuncios que ofrecen inversiones «garantizadas», libres de impuestos, con rendimiento anual de 13.5 % y la posibilidad de más, respaldadas por títulos sobre diamantes sin cortar. Su director mueve los fondos entre varios bancos y retira efectivo, hasta que la prensa publica críticas. ¿Qué indicador ilustran los anuncios con los que capta inversionistas?","a":"Promesas de ganancias irracionales sobre inversiones","o":["Uso de documentos de identificación falsos o robados para abrir las cuentas del negocio","Pago anticipado de préstamos liquidados en efectivo, con actividad inusual del cliente","Uso múltiple de servicios de envío de dinero por parte de un mismo grupo de personas","Promesas de ganancias irracionales sobre inversiones"],"x":"Egmont 11 lista como indicadores las transacciones a gran escala, las promesas de ganancias irracionales sobre inversiones y la cobertura de los medios sobre las actividades de los tenedores de cuentas. Los anuncios ilustran el segundo: un rendimiento «garantizado» y libre de impuestos que no era real, pues los diamantes valían cerca de 2,300 dólares y no los 12,800 prometidos. Las críticas de la prensa son otro indicador distinto: hablan de la cobertura sobre el cuentahabiente, no de la oferta. Los otros tres pertenecen a otros casos.","ref":"Tipologías Egmont 2022 (temario), caso 11"},{"id":"H110","tema":"2.1-tip.int","tipo":"caso","q":"Varias personas de un país de Europa oriental abren cuentas en bancos de Europa occidental, a su nombre o de sus empresas, y hacen circular por ellas grandes sumas entre distintos países. La UIF sospecha que los titulares son testaferros de otros. ¿Qué indicadores destacan en el caso?","a":"Falta de razón comercial subyacente y movimientos múltiples y repetitivos de fondos entre cuentas","o":["Falta de razón comercial subyacente y movimientos múltiples y repetitivos de fondos entre cuentas","Alteración de último minuto de las instrucciones de movimiento de fondos y documentos que el supuesto emisor no reconoce","Promesas de ganancias irracionales sobre inversiones y cobertura de los medios sobre el cuentahabiente","Cambios rápidos y contradictorios de los nombres de las cuentas y uso de documentos de identificación falsos"],"x":"Egmont 16 señala la falta de razón comercial subyacente y los movimientos múltiples y repetitivos de fondos entre cuentas: las cuentas servían para circular sumas sin justificación económica, lo que llevó a la UIF a sospechar de testaferros; la policía descubrió además una red de tráfico de automóviles robados. La alteración de último minuto es del caso 6, las promesas de ganancias y la prensa son del caso 11, los cambios de nombres de cuentas son del caso 24 y los documentos falsos, del caso 15.","ref":"Tipologías Egmont 2022 (temario), caso 16"},{"id":"H111","tema":"2.1-tip.int","tipo":"caso","q":"Los clientes de un traficante de heroína le pagan con transferencias a cuentas de su esposa, su hermana y conocidos, en dos monedas y por montos justo debajo del umbral de reporte. Él retira todo en efectivo o lo dispersa de inmediato; dice ser mecánico y su esposa, ama de casa. Los bancos reportan a la UIF. ¿Qué indicador de la tipología respalda mejor el reporte?","a":"Riqueza irreal comparada con el perfil del cliente","o":["Posición defensiva ante un interrogatorio del personal del banco","Riqueza irreal comparada con el perfil del cliente","Alteración de último minuto de las instrucciones de movimiento de fondos","Uso del nombre de una compañía similar a otras ya establecidas en el mercado"],"x":"Egmont 22 lista como indicadores la transferencia atípica de o hacia una jurisdicción extranjera, el cambio sin explicación del comportamiento de la cuenta y la riqueza irreal frente al perfil del cliente. Los bancos reportaron porque las sumas eran extraordinariamente altas para quienes decían ser mecánico, ama de casa, chofer u oficinista. Los otros tres indicadores pertenecen a otros casos: la posición defensiva es del caso 13, la alteración de último minuto del caso 6 y el nombre de compañía similar, del caso 19.","ref":"Tipologías Egmont 2022 (temario), caso 22"}],"sitio":{"nombre":"Módulo 2","integrador":"simulacro","integrador_texto":"Simulacro mixto","integrador_href":"m2-simulacro/index.html","etiqueta_n":"H","orden_resultados":"temario","paginas":[{"n":"1","carpeta":"m2-h1-objetivo-kyc","pregunta":"2.1.1–2.1.2 · Objetivo y política de identificación y conocimiento","estado":"integrada"},{"n":"2","carpeta":"m2-h2-reportes-dolares-sistemas","pregunta":"2.1.3–2.1.5 · Reportes, dólares en efectivo y sistemas automatizados","estado":"integrada"},{"n":"3","carpeta":"m2-h3-otras-obligaciones-lpb","pregunta":"2.1.6–2.1.8 · Otras obligaciones, intercambio de información y LPB","estado":"integrada"},{"n":"4","carpeta":"m2-h4-ccc-oficial","pregunta":"2.1.9–2.1.10 · Comité de Comunicación y Control y oficial de cumplimiento","estado":"integrada"},{"n":"5","carpeta":"m2-h5-novedosos-cambios-itf","pregunta":"2.1.11–2.1.14 · Modelos novedosos, centros cambiarios, transmisores e ITF","estado":"integrada"},{"n":"6","carpeta":"m2-h6-sanciones-pr-plazos","pregunta":"2.1.15–2.1.17 · Sanciones, propietario real y plazos","estado":"integrada"},{"n":"7","carpeta":"m2-h7-tipologias","pregunta":"2.1 · Tipologías UIF y de organismos internacionales","estado":"integrada"},{"n":"8","carpeta":"m2-h8-lfpiorpi","pregunta":"2.2.1–2.2.2 · LFPIORPI: actividades vulnerables y uso de efectivo","estado":"integrada"}],"raiz":"../","actual":"m2-h7-tipologias"}}

// «Por qué no las otras»: q.d = {texto de opción incorrecta: razón}; opts = opciones en el orden en que se muestran
const tuHTML=(q,txt)=>(txt&&txt!==q.a&&q.d&&q.d[txt])?`<div class="tu"><b>Por qué tu respuesta está mal</b>${esc(q.d[txt])}</div>`:"";
const distHTML=(q,opts)=>{ if(!q.d) return ""; const it=opts.map((o,k)=>q.d[o]?`<li><b>${"ABCD"[k]}</b> ${esc(q.d[o])}</li>`:"").join(""); return it?`<div class="dist"><div class="lbl">Por qué no las otras</div><ul>${it}</ul></div>`:""; };
const RUTA = D.meta.ruta||"financiero";
const ACENTOS = {financiero:["morado","turquesa"], av:["turquesa","coral"], transversal:["morado","coral"], gratuito:["morado","turquesa"]}[RUTA]||["morado","turquesa"];
const COLORES = ["c-principal","c-"+ACENTOS[0],"c-"+ACENTOS[1],"c-negro"];

document.documentElement.setAttribute("data-ruta", RUTA);

R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="frac"><button aria-expanded="false" data-ficha="${id}"><span class="rom">${esc(it.etiqueta)}</span><span><span class="nm">${esc(it.nombre)}</span><span class="hookt">${esc([it.verbo,it.gancho].filter(Boolean).join(" · "))}</span></span><span class="cnt">${esc(it.conteo||"")}</span></button><ul class="inc" hidden>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul></li>`}).join("")}</ul>`;
    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}

    <div class="stepnav"><button class="btn ghost" data-pnav="${sid}:${i-1}">← Anterior</button><button class="btn" data-pnav="${sid}:${i+1}">Siguiente paso →</button></div></div>`;

document.addEventListener("click",e=>{
  const rec=document.body.classList.contains("recite");
  const chip=e.target.closest("[data-item]");
  if(chip){ if(rec&&!chip.classList.contains("shown")){chip.classList.add("shown");return;} openItem(chip.dataset.item); return; }
  const fb=e.target.closest("[data-ficha]");
  if(fb){ const li=fb.parentElement; if(rec&&!li.classList.contains("shown")){li.classList.add("shown");return;} const inc=li.querySelector(".inc"),open=inc.hidden; inc.hidden=!open; fb.setAttribute("aria-expanded",open); return; }
  const pill=e.target.closest("[data-paso]");
  if(pill){ if(rec&&!pill.classList.contains("shown")) pill.classList.add("shown"); const [sid,i]=pill.dataset.paso.split(":"); showPaso(sid,+i); return; }
  const pn=e.target.closest("[data-pnav]");
  if(pn){ const [sid,i]=pn.dataset.pnav.split(":"); showPaso(sid,+i); }
});


/* ---------- tablero y cuatro tablas ---------- */
const TB={}, CT={};
const tbSec=id=>D.secciones.find(x=>x.id===id);
const tbCell=(s,r,j)=>(s._ix||(s._ix=Object.fromEntries(s.celdas.map(c=>[c.rep+"|"+c.suj,c]))))[r+"|"+j]||{rep:r,suj:j,aplica:false,seguro:false};
const uniq=a=>[...new Set(a.filter(Boolean))];
function tbInit(s){
  const st=TB[s.id]={suj:new Set(),grp:new Set(),frec:"",monto:"",plazo:"",vista:"tabla"};
  const on=s.celdas.filter(c=>c.aplica);
  const sel=(k,lab,vals)=>!vals.length?"":`<div class="row"><span class="lbl">${lab}</span><select data-tbs="${s.id}:${k}"><option value="">Todos</option>${vals.map(v=>`<option>${esc(v)}</option>`).join("")}</select></div>`;
  $("#tbf-"+s.id).innerHTML=
    `<div class="row"><span class="lbl">Sujeto</span>${s.sujetos.map((j,i)=>`<button class="fchip sw ${colorDe(j.color,i)}" data-tbf="${s.id}:suj:${j.k}" aria-pressed="false" title="${esc(j.t)}"><i></i>${esc(j.corto||j.k)}</button>`).join("")}</div>`+
    `<div class="row"><span class="lbl">Tipo</span>${s.grupos.map((g,i)=>`<button class="fchip sw ${colorDe(g.color,i)}" data-tbf="${s.id}:grp:${g.k}" aria-pressed="false"><i></i>${esc(g.t)}</button>`).join("")}</div>`+
    `<div class="row" style="gap:14px">${sel("frec","Frecuencia",uniq(on.map(c=>c.frec_tag)))}${sel("monto","Monto",uniq(on.map(c=>c.monto_tag)))}${sel("plazo","Plazo",uniq(on.map(c=>c.plazo_tag)))}</div>`;
  tbDraw(s.id);
}
function tbMatch(st,c){return (!st.frec||c.frec_tag===st.frec)&&(!st.monto||c.monto_tag===st.monto)&&(!st.plazo||c.plazo_tag===st.plazo);}
function tbDraw(id){
  const s=tbSec(id), st=TB[id], val=st.frec||st.monto||st.plazo;
  const cols=s.sujetos.map((j,i)=>({...j,ci:i})).filter(j=>!st.suj.size||st.suj.has(j.k));
  let hits=0, shown=0;
  if(st.vista==="tabla"){
    let body="";
    s.grupos.forEach((g,gi)=>{
      if(st.grp.size&&!st.grp.has(g.k)) return;
      const rows=s.reportes.filter(r=>r.g===g.k).map(r=>{
        const cells=cols.map(j=>{const c=tbCell(s,r.k,j.k), m=c.aplica&&val&&tbMatch(st,c); if(m)hits++; return {c,j,m};});
        if(val&&!cells.some(x=>x.m)) return "";
        shown++;

const rnd=n=>Math.floor(Math.random()*n);
const mixA=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function ctNew(id){
  const s=tbSec(id), src=tbSec(s.fuente), g=CT[id], nR=s.filas||4, nC=s.columnas||4;
  const reps=src.reportes.filter(r=>!(s.excluir||[]).includes(r.k));
  const allOn=r=>src.sujetos.every(j=>tbCell(src,r.k,j.k).aplica);
  let R0,C0,M;
  for(let t=0;t<400;t++){
    const cs=mixA(src.sujetos).slice(0,nC), rs=mixA(reps).slice(0,nR);
    if(rs.filter(allOn).length>1) continue;
    if(rs.some(r=>cs.some(j=>tbCell(src,r.k,j.k).seguro===false))) continue;
    const m=rs.map(r=>cs.map(j=>!!tbCell(src,r.k,j.k).aplica));
    const pats=new Set(m.map(x=>x.join()));
    if(pats.size<Math.min(3,nR)) continue;
    if(m.filter(x=>!x.some(Boolean)).length>1) continue;
    R0=rs;C0=cs;M=m;break;
  }
  if(!M){R0=reps.slice(0,nR);C0=src.sujetos.slice(0,nC);M=R0.map(r=>C0.map(j=>!!tbCell(src,r.k,j.k).aplica));}
  Object.assign(g,{src,rows:R0,cols:C0,M,done:false});
  if(g.mode==="llena"){g.mine=M.map(x=>x.map(()=>false)); return ctDrawFill(id);}
  const key=m=>m.map(x=>x.map(Number).join("")).join("|"), seen=new Set([key(M)]), opts=[M];
  let guard=0;
  while(opts.length<4&&guard++<500){
    const d=M.map(x=>x.slice()), k=1+rnd(2);
    for(let q=0;q<k;q++){const r=rnd(nR),c=rnd(nC); d[r][c]=!d[r][c];}
    const kk=key(d); if(!seen.has(kk)){seen.add(kk);opts.push(d);}
  }
  g.opts=mixA(opts.map((m,i)=>({m,ok:i===0})));
  ctDrawPick(id);
}

    box.innerHTML=`<div class="qbar"><span>${lab} · pregunta ${i+1} de ${seq.length}</span><span>Aciertos: ${good}</span></div><div class="qprog"><i style="width:${i/seq.length*100}%"></i></div>
    <div class="qtag"><span>${esc(TM[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}${q.extra?"<span>Extra</span>":""}</div><div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt${q.shown?(k===ok?" right":(k===q.pick?" wrong":"")):""}" data-rpk="${k}"${q.shown?" disabled":""}><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="fb">${q.shown?`${q.pick==null?`<span class="ok">Respuesta ${"ABCD"[ok]}</span>`:(q.pick===ok?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>')}${q.pick!=null?tuHTML(q,q.opts[q.pick]):""} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}${q.clave?`<div class="rp-clave"><div class="lbl">Para no confundirte</div>${q.clave}</div>`:""}`:""}</div>
    <div class="qactions"><button class="btn ghost" data-rpnav="-1"${i===0?" disabled":""}>← Anterior</button>${q.shown?"":`<button class="btn" data-rpshow>Revelar respuesta</button>`}<button class="btn ghost" data-rpnav="1">${i+1===seq.length?"Ver resultado →":"Siguiente →"}</button><button class="btn ghost" data-rpfs>${fsTxt()}</button></div>`;
  }
  function fin(){
    const resp=seq.filter(x=>x.pick!=null), good=resp.filter(x=>x.opts[x.pick]===x.a).length, miss=seq.filter(x=>x.pick!=null&&x.opts[x.pick]!==x.a), c=s.cierre;
    box.innerHTML=`<div class="qbar"><span>${s.pool?`Tanda de ${seq.length} · resultado`:"Cierre"}</span><span>${resp.length?`${good}/${resp.length}`:""}</span></div><div class="qprog"><i style="width:100%"></i></div>
    ${resp.length?`<div class="score"><span class="big">${Math.round(good/resp.length*100)}%</span><span>${good} de ${resp.length} contestadas correctamente.</span></div>`:""}
    ${miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${miss.length})</summary><ul>${miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.opts[m.pick])}</s>${m.d&&m.d[m.opts[m.pick]]?` — ${esc(m.d[m.opts[m.pick]])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
    ${c?`<div class="qtext" style="margin-top:18px">${esc(c.titulo)}</div><ol class="rp-fin">${(c.pasos||[]).map(p=>`<li>${p}</li>`).join("")}</ol>${c.nota?`<div class="rp-clave">${c.nota}</div>`:""}`:""}
    <div class="qactions"><button class="btn ghost" data-rpnav="-1">← Anterior</button>${s.pool?`<button class="btn" data-rpn="${meta.n}">Otra tanda de ${meta.n}</button>`:""}${sim?`<a class="btn ghost" href="#${sim.id}">${esc(sim.nav||"Practicar")}</a>`:""}<button class="btn ghost" data-rpfs>${fsTxt()}</button></div>
    ${s.pool?`<p class="siminfo">${sinSalir()}</p>`:""}`;
    const inf=$("#rpinfo-"+s.id); if(inf) inf.textContent=`${POOL.length} preguntas en el banco de repaso · ${sinSalir()}`;
  }
  function reveal(){ if(!seq.length||i>=seq.length||seq[i].shown) return; seq[i].shown=true; draw(); }
  const go=n=>{ if(!seq.length) return; i=Math.max(0,Math.min(n,seq.length)); draw(); };
  function fs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else if(box.requestFullscreen) box.requestFullscreen(); }catch(e){} }
  document.addEventListener("fullscreenchange",()=>{const f=box.querySelector("[data-rpfs]");if(f)f.textContent=fsTxt();});
  const onClick=e=>{
    const n=e.target.closest("[data-rpn]"); if(n){start(+n.dataset.rpn);return;}
    const b=e.target.closest("[data-rpb]"); if(b){if(!seq.length||s.pool)start(0);go(seq.findIndex(q=>q.bi===+b.dataset.rpb));return;}
    const o=e.target.closest("[data-rpk]"); if(o&&seq[i]&&!seq[i].shown){seq[i].pick=+o.dataset.rpk;reveal();return;}
    if(e.target.closest("[data-rpshow]")){reveal();return;}
    const nv=e.target.closest("[data-rpnav]"); if(nv){go(i+(+nv.dataset.rpnav));return;}
    if(e.target.closest("[data-rpfs]")) fs();
  };
  idx.addEventListener("click",onClick); box.addEventListener("click",onClick);
  document.addEventListener("keydown",e=>{
    if(!seq.length||e.target.closest("input,textarea")||!$("#drawer").hidden) return;
    const r=box.getBoundingClientRect(); if(document.fullscreenElement!==box&&(r.bottom<0||r.top>innerHeight)) return;
    if(e.key==="ArrowRight"){go(i+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(i-1);e.preventDefault();}
    else if(e.key.toLowerCase()==="r"){reveal();e.preventDefault();}
    else if(e.key.toLowerCase()==="f"){fs();e.preventDefault();}
  });
  if(!s.pool) start(0);
});

/* ---------- simulador ---------- */
if(!D.secciones.some(s=>s.tipo==="simulador")) return;
const BANK=D.banco||[], TEMAS=D.temas||{};
const MODOS=[{k:"all",l:"Todo mezclado",f:()=>true}].concat((D.modos||[]).map(m=>({k:m.k,l:m.l,f:x=>(m.tema?x.tema===m.tema:true)&&(m.tipos?m.tipos.includes(x.tipo):true)})));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY=D.meta.clave||"mapa", SEEN="seen-"+KEY, SIM="sim-"+KEY;
let seen=new Set(store.get(SEEN,[])), MODE="all", ST=null;
const poolFor=k=>BANK.filter(MODOS.find(m=>m.k===k).f);
const simInfo=()=>`${BANK.length-store.get(SIM,[]).length} de ${BANK.length} sin salir en simulacro`;
const bankInfo=()=>`${BANK.length} reactivos verificados contra el texto oficial · ${simInfo()}`;
function startRound(){const pool=poolFor(MODE);const fresh=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));start(fresh.concat(old).slice(0,10),{kind:"ronda",label:MODOS.find(m=>m.k===MODE).l});}
const SIMSEC=D.secciones.find(s=>s.tipo==="simulador")||{};
function cuotas(n,pesos){ // reparto por resto mayor; sólo temas con reactivos
  const ks=Object.keys(pesos).filter(k=>pesos[k]>0&&BANK.some(x=>x.tema===k)), tot=ks.reduce((a,k)=>a+pesos[k],0);
  if(!ks.length) return null;
  const raw=ks.map(k=>({k,v:n*pesos[k]/tot})), out={}; let asig=0;
  raw.forEach(r=>{out[r.k]=Math.floor(r.v);asig+=out[r.k];});
  raw.sort((a,b)=>(b.v%1)-(a.v%1)).slice(0,n-asig).forEach(r=>out[r.k]++);
  return out;
}
function startSim(n){
  if(SIMSEC.proporcion){
    const q=cuotas(n,SIMSEC.proporcion);
    if(q){
      let used=new Set(store.get(SIM,[])), pick=[], cycled=false;
      Object.entries(q).forEach(([k,c])=>{
        const delTema=BANK.filter(x=>x.tema===k); let rest=shuffle(delTema.filter(x=>!used.has(x.id)));
        if(rest.length<c){cycled=true;delTema.forEach(x=>used.delete(x.id));rest=rest.concat(shuffle(delTema.filter(x=>!rest.includes(x))));}
        rest=rest.slice(0,c); rest.forEach(x=>used.add(x.id)); pick=pick.concat(rest);
      });
      store.set(SIM,[...used]); return start(shuffle(pick),{kind:"simulacro",label:`Simulacro de ${pick.length}`,n,cycled});
    }
  }
  let used=new Set(store.get(SIM,[])), rest=BANK.filter(x=>!used.has(x.id)), cycled=false;
  if(rest.length<n){cycled=true;const take=shuffle(rest);used=new Set();const more=shuffle(BANK.filter(x=>!take.includes(x))).slice(0,n-take.length);rest=take.concat(more);more.forEach(x=>used.add(x.id));}
  else{rest=shuffle(rest).slice(0,n);rest.forEach(x=>used.add(x.id));}
  store.set(SIM,[...used]); start(shuffle(rest),{kind:"simulacro",label:`Simulacro de ${n}`,n,cycled});
}
function start(list,meta){ST={list:list.map(q=>({...q,opts:shuffle(q.o)})),i:0,ok:0,miss:[],byTema:{},meta};document.querySelectorAll(".qmode,.qsim").forEach(b=>b.setAttribute("aria-pressed","false"));render();}
function render(){
  const box=$("#quiz"),n=ST.list.length; if(ST.i>=n) return renderEnd();
  const q=ST.list[ST.i];
  box.innerHTML=`<div class="qbar"><span>${esc(ST.meta.label)} · reactivo ${ST.i+1} de ${n}</span><span>Aciertos: ${ST.ok}</span></div><div class="qprog"><i style="width:${ST.i/n*100}%"></i></div>
  <div class="qtag"><span>${esc(TEMAS[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}</div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>
  <div class="qactions"><button class="btn" id="qNext" hidden>${ST.i+1===n?"Ver resultado":"Siguiente"}</button><button class="btn ghost" id="qQuit">Terminar aquí</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  $("#qNext").addEventListener("click",()=>{ST.i++;render();});
  $("#qQuit").addEventListener("click",()=>{ST.list=ST.list.slice(0,ST.i);renderEnd();});
}
function answer(k){
  const q=ST.list[ST.i]; if(q.done) return; q.done=true; const good=q.opts[k]===q.a;
  const t=ST.byTema[q.tema]||(ST.byTema[q.tema]={ok:0,n:0}); t.n++; if(good){ST.ok++;t.ok++;} else {q.mine=q.opts[k];ST.miss.push(q);}
  seen.add(q.id); store.set(SEEN,[...seen]);
  $("#quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.a)b.classList.add("right");else if(+b.dataset.k===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`${good?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>'}${good?"":tuHTML(q,q.opts[k])} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}`;
  const nb=$("#qNext"); nb.hidden=false; nb.focus();
}
function renderEnd(){
  const box=$("#quiz"),n=ST.list.length,pct=n?Math.round(ST.ok/n*100):0;
  const msg=pct>=90?"Listos para el examen.":pct>=75?"Muy bien: repasen los temas con menos aciertos.":pct>=60?"Van bien, pero hay que repasar.":"Toca volver al mapa y repasar antes del siguiente intento.";
  const ordT=(SIMSEC.orden_resultados||(D.sitio&&D.sitio.orden_resultados))==="temario",TK=Object.keys(TEMAS),ix=k=>{const i=TK.indexOf(k);return i<0?1e9:i};
  const rows=Object.entries(ST.byTema).sort(ordT?(a,b)=>ix(a[0])-ix(b[0]):(a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>`<div class="trow2"><span>${esc(TEMAS[k]||k)}</span><span class="tb"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></span><span class="tv">${v.ok}/${v.n}</span></div>`).join("");
  box.innerHTML=`<div class="printhead"><b>${esc(D.meta.titulo)}</b> · 360Educa · ${esc(ST.meta.label)} · ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div><div class="qbar"><span>${esc(ST.meta.label)} · resultado</span><span>${ST.ok}/${n}</span></div><div class="qprog"><i style="width:100%"></i></div>
  <div class="score"><span class="big">${pct}%</span><span>${ST.ok} de ${n} correctas. ${msg}</span></div>
  ${rows?`<div class="lbl" style="margin-top:14px">Aciertos por tema (${ordT?"en el orden del temario":"de menor a mayor"})</div><div class="trows">${rows}</div>`:""}
  ${ST.miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${ST.miss.length})</summary><ul>${ST.miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.mine||"")}</s>${m.d&&m.d[m.mine]?` — ${esc(m.d[m.mine])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
  <div class="qactions"><button class="btn" id="qAgain">${ST.meta.kind==="simulacro"?"Otro simulacro igual":"Otra ronda"}</button><button class="btn ghost" id="qPrint">Imprimir o guardar en PDF</button><a class="btn ghost" href="#${mapa0?mapa0.id:"top"}">Repasar el mapa</a></div>
  ${ST.meta.kind==="simulacro"?`<p class="siminfo">${simInfo()}${ST.meta.cycled?" · Se completó el banco y empezó una vuelta nueva.":""}</p>`:""}`;
  $("#qAgain").addEventListener("click",()=>ST.meta.kind==="simulacro"?startSim(ST.meta.n):startRound());
  $("#qPrint").addEventListener("click",()=>{const d=box.querySelector("details.miss");if(d)d.open=true;window.print();});
  $("#bankinfo").textContent=bankInfo();
}
document.addEventListener("keydown",e=>{
  if(!ST||e.target.closest("input,textarea")) return;
  const r=$("#quiz").getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
  const k="abcd1234".indexOf(e.key.toLowerCase()); if(k>=0&&ST.i<ST.list.length&&!ST.list[ST.i].done){answer(k%4);e.preventDefault();}
});
$("#modes").innerHTML=MODOS.map(m=>`<button class="qmode" data-m="${m.k}" aria-pressed="false">${esc(m.l)} <small>${poolFor(m.k).length}</small></button>`).join("");
document.querySelectorAll(".qmode").forEach(b=>b.addEventListener("click",()=>{MODE=b.dataset.m;startRound();b.setAttribute("aria-pressed","true");}));
document.querySelectorAll(".qsim").forEach(b=>b.addEventListener("click",()=>{startSim(+b.dataset.n);b.setAttribute("aria-pressed","true");}));
$("#simReset").addEventListener("click",()=>{store.set(SIM,[]);store.set(SEEN,[]);seen=new Set();$("#bankinfo").textContent=bankInfo();});
$("#bankinfo").textContent=bankInfo();
startRound(); document.querySelector('.qmode[data-m="all"]').setAttribute("aria-pressed","true");
})();
</script>
</body>
</html>
