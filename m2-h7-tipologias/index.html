de zonas turísticas, clona tarjetas y lava el dinero en inmuebles.","orden":3,"panel":"Tipología 2021 · Cajeros automáticos (skimming)","puntos":["<b>El caso:<\/b> Una banda de delincuentes extranjeros instala dispositivos de \"skimming\" en cajeros de zonas turísticas para clonar tarjetas. El dinero se lava a través de inversiones inmobiliarias.","<b>Palabras clave:<\/b> Skimming · Cajeros Automáticos · Zonas Turísticas · Banda Extranjera","<b>Señales de alerta:<\/b><ul><li>Concentración de retiros en cajeros de zonas turísticas.<\/li><li>Compra de bienes de lujo (vehículos, relojes).<\/li><li>Beneficiarios son extranjeros de la misma nacionalidad.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Retiros concentrados en cajeros de <b>zonas turísticas<\/b>; una empresa que <b>renta los cajeros<\/b> con chips o software que copian las tarjetas (los beneficiarios extranjeros de la misma nacionalidad aparecen también en Fraudes informáticos 2018)."],"destacado":false},{"etiqueta":"2018","nombre":"Fraudes informáticos","sub":"¿La factura era del proveedor?","verbo":"Hackeo","desc":"Delincuentes hackean correos de empresas, envían facturas falsas a sus clientes y desvían los pagos a cuentas fraudulentas.","orden":4,"panel":"Tipología 2018 · Fraudes informáticos","puntos":["<b>El caso:<\/b> Delincuentes hackean correos de empresas para enviar facturas falsas a sus clientes, desviando los pagos a cuentas fraudulentas, a menudo de extranjeros en países de riesgo.","<b>Palabras clave:<\/b> Hackeo de Correo · Facturas Falsas · Desvío de Pagos","<b>Señales de alerta:<\/b><ul><li>Incongruencia entre el beneficiario indicado y el titular real de la cuenta.<\/li><li>Recursos retirados de manera inmediata.<\/li><li>Cuentas abiertas en sucursales lejanas al domicilio del titular.<\/li><\/ul>","<b>Lo que la distingue:<\/b> El beneficiario de la factura <b>no coincide<\/b> con el titular real de la cuenta; correos <b>hackeados<\/b> del proveedor con datos alterados (dominio, teléfono)."],"destacado":false},{"etiqueta":"2019","nombre":"Trata de personas","sub":"¿A quién engañan y cómo?","verbo":"Engaño","desc":"Una red, principalmente familiar, engaña a mujeres extranjeras con falsas ofertas de modelaje para explotarlas; lava con empresas fantasma y criptomonedas.","orden":5,"panel":"Tipología 2019 · Trata de personas","puntos":["<b>El caso:<\/b> Red criminal, principalmente familiar, engaña a mujeres extranjeras con falsas ofertas de modelaje para explotación sexual. Usan un sitio web como fachada y lavan el dinero con empresas fantasma y criptomonedas.","<b>Palabras clave:<\/b> Trata Internacional · Explotación Sexual · Sitio Web Fachada · Red Familiar","<b>Señales de alerta:<\/b><ul><li>Personas físicas identificadas en fuentes externas en redes de trata.<\/li><li>Operaciones con montos elevados incongruentes con la actividad declarada.<\/li><li>Compra de inmuebles y vehículos de lujo sin origen de recursos claro.<\/li><\/ul>","<b>Lo que la distingue:<\/b> Víctimas <b>extranjeras<\/b> engañadas con ofertas de <b>modelaje<\/b> y explotadas mediante un <b>sitio web<\/b> fachada; personas identificadas en fuentes externas en redes de trata. (Empresas fantasma y criptomonedas aparecen también en otras.)"],"destacado":false},{"etiqueta":"2021","nombre":"Trata y lenocinio","sub":"¿Quién mezcla el efectivo?","verbo":"Someto","desc":"Una red familiar explota sexualmente a mujeres; otros familiares mezclan el efectivo con negocios legítimos y lo lavan en inmuebles y paraísos fiscales.","orden":6,"panel":"Tipología 2021 · Trata y lenocinio","puntos":["<b>El caso:<\/b> Red familiar somete a mujeres a explotación sexual. Otros miembros de la familia usan negocios legítimos para mezclar el efectivo ilícito con ingresos legales, lavándolo a través de bienes raíces y transferencias a paraísos fiscales.","<b>Palabras clave:<\/b> Lenocinio · Mezcla de Fondos · Red Familiar","<b>Señales de alerta:<\/b><ul><li>Disposición de recursos en efectivo por montos inusuales.<\/li><li>Operaciones entre personas que presentan un mismo domicilio fiscal.<\/li><li>Gastos que sobrepasan el nivel transaccional declarado.<\/li><\/ul>","<b>Lo que la distingue:<\/b> <b>Lenocinio<\/b> por una red mayormente familiar: unos integrantes explotan a las víctimas y <b>otros integrantes<\/b> mezclan el efectivo en sus negocios legítimos (en Compañía con operaciones lícitas no hay explotación sexual; en Trata de personas 2019 las víctimas son extranjeras y hay sitio web)."],"destacado":false}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por tipología"}},{"tipo":"tarjetas","id":"parecidas","nav":"Las que se parecen","titulo":"Tres OSFL, tres historias","intro":"Tres tipologías usan una organización sin fines de lucro. Lo que cambia es quién la controla y para qué.","tarjetas":[{"encabezado":true,"color":"morado","titulo":"OSFL con actividades religiosas","subtitulo":"2020","filas":[{"k":"Quién","v":"<b>Cinco<\/b> OSFL religiosas dirigidas por la <b>misma persona<\/b>."},{"k":"Para qué","v":"Inversiones y bienes de lujo; evadir impuestos del líder."},{"k":"Señal","v":"Actos con fines eminentemente lucrativos; transferencias a paraísos fiscales."}]},{"encabezado":true,"color":"principal","titulo":"Asociación altruista ¿apoya a migrantes?","subtitulo":"2020","filas":[{"k":"Quién","v":"Una OSFL de supuesta ayuda a migrantes, con un <b>adulto mayor<\/b> como testaferro."},{"k":"Para qué","v":"Manejar dinero ilícito con operaciones injustificadas."},{"k":"Señal","v":"Transferencias que se <b>reenvían<\/b> rápido; retiros en efectivo fraccionados."}]},{"encabezado":true,"color":"turquesa","titulo":"El Licenciado","subtitulo":"2021","filas":[{"k":"Quién","v":"Un <b>abogado<\/b>, operador financiero del líder de un cártel."},{"k":"Para qué","v":"La OSFL es una pieza más, junto con empresas fachada (exportadoras de vehículos de lujo, seguridad)."},{"k":"Señal","v":"Relación profesional cercana con líderes de cárteles; empresas con los mismos apoderados o accionistas."}]}],"nota":"<b>Pregunta-gancho:<\/b> ¿cinco OSFL religiosas con un líder? Religiosa. ¿Un adulto mayor como testaferro? Altruista. ¿Un abogado del cártel? El Licenciado."},{"tipo":"tarjetas","id":"internacional","nav":"GAFI y Egmont","titulo":"Tipologías internacionales: GAFI y Egmont","intro":"Tipologías Egmont 2022 y Tipologías GAFI 2022, así nombradas en el temario. Son compilaciones de la UIF: el documento de Egmont no trae fecha y el de GAFI es la traducción UIF de oct-2006 del reporte GAFI 2004-2005 sobre seguros y remesas.","tarjetas":[{"barra":true,"color":"negro","titulo":"GAFI · Casos de seguros","ref":"Tipologías GAFI 2022 (temario), casos de seguros 1 a 12","html":"Son 12 casos del sector asegurador. Las señales se resumen en el apartado 1.3."},{"barra":true,"color":"coral","titulo":"GAFI · Casos de remesas","ref":"Tipologías GAFI 2022 (temario), casos de remesas 1 a 13","html":"Son 13 casos de remesas. El texto no tiene sección de indicadores para remesas."},{"encabezado":true,"color":"oscuro","titulo":"Indicadores GAFI de seguros","subtitulo":"Apartado 1.3 (1.3.1 a 1.3.4)","filas":[{"k":"No exclusivos (1.3.1)","v":"uso de efectivo en grandes operaciones; apartados postales o domicilios falsos; negocios en jurisdicciones de alto riesgo."},{"k":"Asegurado (1.3.2)","v":"pariente o socio de delincuente; comportamiento incongruente; primas altas frente a ingresos; despreocupación por costos de cancelación; interés excesivo en cancelar; cambio de beneficiarios; bienes valiosos incongruentes con el perfil; cobro inmediato."},{"k":"Primas (1.3.3)","v":"pago por terceros; múltiples fuentes de pago; pago en exceso seguido de reembolso; usar la aseguradora para mover fondos como cuenta bancaria."},{"k":"Otros (1.3.4)","v":"cargos o comisiones inusualmente altos; aseguradoras o reaseguradoras de reciente creación o poco transparentes."}]},{"encabezado":true,"color":"oscuro","titulo":"Egmont por delito","subtitulo":"25 casos (E1 a E25)","filas":[{"k":"Narcotráfico","v":"E1, E8, E10, E12, E13, E14, E15, E21, E22, E23, E25 (11 casos); E19 con sospecha."},{"k":"Fraude","v":"E2, E3, E5, E6, E7, E9, E11, E17, E20 (9 casos); E17 es de pensiones."},{"k":"Otros","v":"E4 casino, E16 autos robados, E18 contrabando, E24 obra pública ficticia."}]},{"barra":true,"color":"oscuro","titulo":"¿Con qué UIF se conecta?","ref":"Tipologías Egmont 2022 (temario)","html":"Operación hormiga: E13, E22, E23 (estructuración bajo el umbral también en E14 y E15). Empresas pantalla: E1, E8, E17, E18, E19, E20, E24, E25. Abogados y notarios: E1, E3, E7, E10, E21, E25. Casinos: E4, E14. Los indicadores de E4, E17 y E25 están vacíos y los de E20 son pasos de investigación."}]},{"tipo":"simulador","id":"examen","nav":"Practicar ▸"}],"temas":{"2.1-tip.A":"2.1 Tipologías · A · Corrupción y recursos públicos","2.1-tip.B":"2.1 Tipologías · B · Empresas, OSFL y comercio exterior","2.1-tip.C":"2.1 Tipologías · C · Personas y productos del banco","2.1-tip.D":"2.1 Tipologías · D · Fraude, tecnología y explotación","2.1-tip.int":"2.1 Tipologías · E · Egmont y GAFI"},"modos":[{"k":"A","l":"A · Corrupción","tema":"2.1-tip.A"},{"k":"B","l":"B · Fachadas","tema":"2.1-tip.B"},{"k":"C","l":"C · Banco","tema":"2.1-tip.C"},{"k":"D","l":"D · Fraude","tema":"2.1-tip.D"},{"k":"E","l":"E · Egmont y GAFI","tema":"2.1-tip.int"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Años y trampas","tipos":["cifra","trampa"]}],"banco":[{"id":"H001","tema":"2.1-tip.A","tipo":"caso","q":"Un ex servidor público estatal, señalado por corrupción y por vínculos con un cártel, tiene relación corporativa con once sociedades con esquema de empresas fantasma; varias comparten un domicilio con características de casa habitación y declaran actividades incompatibles entre sí. Su esposa y su padre le ayudan a mover los recursos, y parte del dinero llega a través de una inmobiliaria cuyo accionista está vinculado con gasolineras y probablemente con el robo de combustible. ¿Qué tipología describe mejor el caso?","a":"Personas Políticamente Expuestas (PEPs)","o":["Personas Políticamente Expuestas (PEPs)","Corrupción ex servidor público","Cohecho alto ejecutivo sector energético","Estafa Maestra versión Pemex"],"x":"El ex servidor apoyado por su esposa y su padre, las once empresas fantasma y el vínculo con el robo de combustible apuntan a Personas Políticamente Expuestas (UIF 2022), donde el robo de hidrocarburos figura entre los delitos determinantes. Corrupción ex servidor público (2020) también tiene familiares accionistas de empresas fachada, pero su sello es el nivel de vida incongruente con su salario y la relación con excontratistas de la dependencia; no menciona hidrocarburos.","ref":"Tipología UIF 2022 · Personas Políticamente Expuestas (PEPs)"},{"id":"H002","tema":"2.1-tip.A","tipo":"memoria","q":"¿Qué combinación de rasgos distingue a la tipología Personas Políticamente Expuestas (PEPs)?","a":"La red familiar del ex servidor y el robo de hidrocarburos como uno de los orígenes de los recursos","o":["El soborno de una empresa extranjera, oculto con fideicomisos familiares","La contratación de una universidad para servicios que no puede proveer y que después subcontrata fachadas","El enriquecimiento posterior al cargo, canalizado a paraísos fiscales con apoyo de excontratistas del gobierno","La red familiar del ex servidor y el robo de hidrocarburos como uno de los orígenes de los recursos"],"x":"En la tipología de PEPs (UIF 2022) un ex servidor y su red familiar usan un conglomerado de empresas fachada para lavar recursos de corrupción, delincuencia organizada y robo de hidrocarburos. Las demás opciones describen Corrupción ex servidor público, Cohecho y Estafa Maestra (2020).","ref":"Tipología UIF 2022 · Personas Políticamente Expuestas (PEPs)"},{"id":"H003","tema":"2.1-tip.A","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Personas Políticamente Expuestas (PEPs)?","a":"Vínculos con empresas fantasma y personas en listas negras del SAT","o":["Vínculos con empresas fantasma y personas en listas negras del SAT","Perfil de beneficiarios, como estudiante o ama de casa, incongruente con los fondos","Sindicato que concentra sus operaciones en una o pocas cuentas bancarias","Contratación de universidades para servicios que no pueden proveer"],"x":"Los vínculos con empresas fantasma y con personas señaladas por el SAT en su lista negra son señal de la tipología de PEPs (UIF 2022). El perfil de estudiante o ama de casa es de Cohecho (2020), la contratación de universidades de la Estafa Maestra (2020) y la concentración en pocas cuentas de Abuso de sindicatos (2016).","ref":"Tipología UIF 2022 · Personas Políticamente Expuestas (PEPs)"},{"id":"H004","tema":"2.1-tip.A","tipo":"caso","q":"Un ex funcionario opera, junto con sus familiares, varias sociedades que resultan ser fachada. Hace múltiples depósitos y retiros en efectivo por montos altos, y lo que opera no coincide con sus declaraciones fiscales. La autoridad lo relaciona con corrupción, delincuencia organizada y robo de hidrocarburos. ¿Qué tipología describe mejor el caso?","a":"Personas Políticamente Expuestas (PEPs)","o":["Personas Políticamente Expuestas (PEPs)","Abuso de sindicatos","Cohecho alto ejecutivo sector energético","Corrupción ex servidor público"],"x":"El robo de hidrocarburos, junto con corrupción y delincuencia organizada, apunta a PEPs (UIF 2022). Corrupción ex servidor público (2020) también tiene un ex funcionario con familiares accionistas de empresas fachada y sobornos de la delincuencia organizada, pero no menciona hidrocarburos; su sello es el nivel de vida incongruente con su salario y la relación con excontratistas de la dependencia.","ref":"Tipología UIF 2022 · Personas Políticamente Expuestas (PEPs)"},{"id":"H005","tema":"2.1-tip.A","tipo":"caso","q":"Tras dejar un cargo de alta responsabilidad, un cliente se muda a una zona de lujo en el extranjero. De 2013 a 2018 declara ingresos por cerca de un millón de pesos, pero paga a sus tarjetas de crédito más de ocho millones. Vive en inmuebles de dos personas que fueron contratistas de la dependencia en la que trabajaba, y empresas ligadas a él envían recursos a paraísos fiscales. ¿Qué tipología describe mejor el caso?","a":"Corrupción ex servidor público","o":["Personas Políticamente Expuestas (PEPs)","Corrupción ex servidor público","Cohecho alto ejecutivo sector energético","Estafa Maestra versión Pemex"],"x":"Nivel de vida incongruente con su salario, pagos a tarjetas muy superiores a lo declarado y la relación con excontratistas son el sello de Corrupción ex servidor público (UIF 2020). PEPs (2022) también tiene a un ex servidor con familiares y empresas fantasma, pero la distingue el robo de hidrocarburos entre los delitos determinantes.","ref":"Tipología UIF 2020 · Corrupción ex servidor público"},{"id":"H006","tema":"2.1-tip.A","tipo":"caso","q":"Una institución financiera revisa a un ex funcionario de alto rango que, al dejar el cargo, se mudó al extranjero a una zona residencial exclusiva. Sus declaraciones fiscales de seis años suman alrededor de un millón de pesos, pero en ese lapso pagó a tarjetas de crédito más de ocho millones. Varias sociedades ligadas a él, en las que figuran excontratistas de su antigua dependencia, ingresan fondos al sistema financiero y los dispersan hacia paraísos fiscales. ¿Qué tipología describe mejor el caso?","a":"Corrupción ex servidor público","o":["Corrupción ex servidor público","Cohecho alto ejecutivo sector energético","El Licenciado","Estafa Maestra versión Pemex"],"x":"El nivel de vida incongruente con el salario tras dejar el cargo (se muda a barrios de lujo en el extranjero), los pagos a tarjetas por unos 8.2 millones frente a ingresos declarados de alrededor de un millón entre 2013 y 2018, y las empresas fachada con excontratistas de su dependencia que dispersan fondos a paraísos fiscales son Corrupción ex servidor público (UIF 2020). Cohecho alto ejecutivo sector energético (2020) es el distractor más tentador porque también usa paraísos fiscales, pero allí una empresa extranjera paga sobornos para obtener contratos, y el caso no plantea ese pago. En El Licenciado (2021) un abogado lava con empresas fachada el dinero del líder de un cártel; no hay un ex funcionario que gaste más de lo que declara. Estafa Maestra versión Pemex (2020) desvía recursos de una dependencia mediante entes educativos, que el caso no menciona.","ref":"Tipología UIF 2020 · Corrupción ex servidor público"},{"id":"H007","tema":"2.1-tip.A","tipo":"cifra","q":"¿En qué año publicó la UIF la tipología Corrupción ex servidor público?","a":"2020","o":["2020","2022","2016","2021"],"x":"Corrupción ex servidor público es del informe UIF 2020, junto con Cohecho, Estafa Maestra y las dos OSFL. No la confundas con PEPs, que es de 2022.","ref":"Tipología UIF 2020 · Corrupción ex servidor público"},{"id":"H008","tema":"2.1-tip.A","tipo":"trampa","q":"Tanto PEPs como Corrupción ex servidor público involucran a un ex servidor público. ¿Qué rasgo apunta a Corrupción ex servidor público en lugar de a PEPs?","a":"Nivel de vida incongruente con su salario, relación con excontratistas de la dependencia y fondos enviados a paraísos fiscales","o":["Vínculos con empresas fantasma y con personas que aparecen en las listas negras del SAT","Recursos ligados, entre otros delitos determinantes, al robo de hidrocarburos","Empresas especializadas con un mismo domicilio de casa habitación que declaran perforación de pozos y manejo de sustancias peligrosas","Nivel de vida incongruente con su salario, relación con excontratistas de la dependencia y fondos enviados a paraísos fiscales"],"x":"Corrupción ex servidor público (UIF 2020) se reconoce por el nivel de vida incongruente con su salario y sus declaraciones patrimoniales, los excontratistas y los paraísos fiscales. El robo de hidrocarburos, las empresas especializadas con domicilio común y los vínculos con la lista negra del SAT son de PEPs (2022). Ojo: las dos tienen familiares en las empresas, así que la familia no las distingue.","ref":"Tipología UIF 2020 · Corrupción ex servidor público"},{"id":"H009","tema":"2.1-tip.A","tipo":"caso","q":"Una compañía de otro país quiere ganar contratos de una empresa del ramo de la energía y hace pagos a uno de sus directivos de primer nivel. Los recursos terminan en fideicomisos a nombre de familiares y en cuentas de una estudiante y de un ama de casa cuyo perfil no corresponde a los fondos. ¿Qué tipología describe mejor el caso?","a":"Cohecho alto ejecutivo sector energético","o":["Estafa Maestra versión Pemex","Cohecho alto ejecutivo sector energético","Personas Políticamente Expuestas (PEPs)","Corrupción ex servidor público"],"x":"Quien paga es una empresa extranjera para obtener contratos, y los beneficiarios tienen perfil incongruente (estudiante, ama de casa) con fideicomisos familiares: es Cohecho alto ejecutivo sector energético (UIF 2020). En PEPs (2022) también hay familia, pero no hay un soborno de una empresa extranjera.","ref":"Tipología UIF 2020 · Cohecho alto ejecutivo sector energético"},{"id":"H010","tema":"2.1-tip.A","tipo":"caso","q":"Un directivo de primer nivel de una empresa productiva de energía asigna contratos a una compañía extranjera. Para ocultar los pagos que recibe a cambio se usan programas informáticos sofisticados, empresas fachada en paraísos fiscales y fideicomisos familiares. ¿Qué tipología describe mejor el caso?","a":"Cohecho alto ejecutivo sector energético","o":["Estafa Maestra versión Pemex","Cohecho alto ejecutivo sector energético","Personas Políticamente Expuestas (PEPs)","Corrupción ex servidor público"],"x":"Empresa extranjera que paga para obtener contratos, software sofisticado y fideicomisos familiares son rasgos de Cohecho alto ejecutivo sector energético (UIF 2020). Corrupción ex servidor público también usa paraísos fiscales, pero allí no hay un pagador extranjero sino enriquecimiento posterior al cargo.","ref":"Tipología UIF 2020 · Cohecho alto ejecutivo sector energético"},{"id":"H011","tema":"2.1-tip.A","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Cohecho alto ejecutivo sector energético?","a":"Perfil personal de las presuntas beneficiarias: una estudiante, una consultora y un ama de casa","o":["Perfil personal de las presuntas beneficiarias: una estudiante, una consultora y un ama de casa","Sindicato que concentra sus operaciones en una o pocas cuentas bancarias","Pagos a tarjetas de crédito muy superiores a los ingresos declarados","Vínculos con personas señaladas por el SAT en su lista negra"],"x":"El perfil de las beneficiarias (estudiante, consultora, ama de casa) es la señal 3 de Cohecho alto ejecutivo sector energético (UIF 2020). La concentración en pocas cuentas es de Abuso de sindicatos (2016), la lista negra del SAT de PEPs (2022) y los pagos a tarjetas de Corrupción ex servidor público (2020).","ref":"Tipología UIF 2020 · Cohecho alto ejecutivo sector energético"},{"id":"H012","tema":"2.1-tip.A","tipo":"caso","q":"Funcionarios de la petrolera del Estado contratan a una universidad para asistencia técnica que la institución no tiene capacidad de prestar. La universidad, cobrando una comisión, reparte los recursos entre siete empresas que no hacen el trabajo; varias están catalogadas por el SAT como fantasma y en ellas figuran como accionistas un servidor público de la petrolera y sus familiares. ¿Qué tipología describe mejor el caso?","a":"Estafa Maestra versión Pemex","o":["Institución educativa de nivel superior","Estafa Maestra versión Pemex","Cohecho alto ejecutivo sector energético","Personas Políticamente Expuestas (PEPs)"],"x":"La universidad funciona como conducto: la contratan para servicios que no puede proveer y subcontrata a empresas fachada creadas por un funcionario; es la Estafa Maestra versión Pemex (UIF 2020). En Institución educativa de nivel superior (2019) la universidad recibe el dinero ilícito y lo triangula al extranjero.","ref":"Tipología UIF 2020 · Estafa Maestra versión Pemex"},{"id":"H013","tema":"2.1-tip.A","tipo":"trampa","q":"Dos tipologías tienen una universidad en el centro. ¿Qué rasgo corresponde a la Estafa Maestra versión Pemex?","a":"La contratan para servicios que no puede proveer y el dinero público termina en empresas fachada","o":["Envía transferencias internacionales elevadas sin justificación comercial","Recibe dinero ilícito, lo envía a cuentas en varios países del extranjero y después lo regresa a México","La contratan para servicios que no puede proveer y el dinero público termina en empresas fachada","Utiliza un patronato y gasta fondos públicos en máquinas de juego para lavar el dinero"],"x":"En la Estafa Maestra versión Pemex (UIF 2020) la universidad es el conducto del desvío hacia empresas fachada. Triangular al extranjero, el patronato y las máquinas de juego son rasgos de Institución educativa de nivel superior (2019).","ref":"Tipología UIF 2020 · Estafa Maestra versión Pemex"},{"id":"H014","tema":"2.1-tip.A","tipo":"caso","q":"Un oficial revisa a una universidad pública que recibe contratos de una empresa petrolera del Estado y los subcontrata casi de inmediato a otras sociedades. ¿Qué señal adicional correspondería a la tipología que describe este esquema?","a":"Accionistas de las subcontratadas que son familiares o prestanombres de funcionarios","o":["Recursos enviados a diferentes países del extranjero que luego retornan al país de origen","Inversión de recursos públicos de la universidad en la compra de máquinas de juego","Accionistas de las subcontratadas que son familiares o prestanombres de funcionarios","Pagos a tarjetas de crédito muy superiores a los ingresos declarados por el cliente"],"x":"Universidad contratada que subcontrata de inmediato es la Estafa Maestra versión Pemex (UIF 2020), cuya señal es que los accionistas de las empresas sean familiares o prestanombres de funcionarios. Máquinas de juego y recursos que salen y regresan son de Institución educativa (2019).","ref":"Tipología UIF 2020 · Estafa Maestra versión Pemex"},{"id":"H015","tema":"2.1-tip.A","tipo":"cifra","q":"¿Cuál de estas tipologías publicó la UIF en su informe 2020?","a":"Estafa Maestra versión Pemex","o":["Abuso de sindicatos","Institución educativa de nivel superior","Estafa Maestra versión Pemex","Personas Políticamente Expuestas (PEPs)"],"x":"La Estafa Maestra versión Pemex es del informe UIF 2020. Institución educativa de nivel superior es de 2019, PEPs de 2022 y Abuso de sindicatos de 2016.","ref":"Tipología UIF 2020 · Estafa Maestra versión Pemex"},{"id":"H016","tema":"2.1-tip.A","tipo":"caso","q":"Una organización que agrupa a los trabajadores de una empresa concentra casi todas sus operaciones en unas pocas cuentas. Desde ahí se transfieren recursos para pagar bienes y servicios de lujo para su dirigente, y el dinero casi no permanece en las cuentas destino. ¿Qué tipología describe mejor el caso?","a":"Abuso de sindicatos","o":["Abuso de sindicatos","Asociación altruista ¿apoya a migrantes?","OSFL con actividades religiosas","Corrupción ex servidor público"],"x":"Una organización de trabajadores cuyos fondos se desvían a pocas cuentas para lujos de su líder es Abuso de sindicatos (UIF 2016). OSFL con actividades religiosas (2020) también tiene un líder y bienes de lujo, pero se trata de cinco OSFL religiosas con actividades lucrativas.","ref":"Tipología UIF 2016 · Abuso de sindicatos"},{"id":"H017","tema":"2.1-tip.A","tipo":"caso","q":"Una institución financiera monitorea a un sindicato de trabajadores que tiene registradas numerosas cuentas bancarias a su nombre. Su analista compara el comportamiento de esas cuentas con la tipología Abuso de sindicatos (UIF 2016). ¿Qué hallazgo sobre el uso de las cuentas sería señal de alerta de esa tipología?","a":"Operaciones concentradas en una o pocas de sus cuentas bancarias","o":["Recepción de recursos fraccionados desde múltiples zonas geográficas","Domicilio declarado a la institución que resulta ser una oficina virtual","Operaciones concentradas en una o pocas de sus cuentas bancarias","Ingresos por preventa de inmuebles liquidada de contado"],"x":"Que un sindicato con múltiples cuentas concentre sus operaciones en una o pocas de ellas es señal de Abuso de sindicatos (UIF 2016); en el caso, dos cuentas concentraban el mayor porcentaje de las operaciones reportadas. Las demás también son señales de UIF 2016, pero de otras tipologías: los recursos fraccionados desde múltiples zonas geográficas son de Uso de personas jóvenes, el domicilio en una oficina virtual es de Estructura corporativa simula operaciones y la preventa de inmuebles de contado es de Desarrollo de bienes raíces.","ref":"Tipología UIF 2016 · Abuso de sindicatos"},{"id":"H018","tema":"2.1-tip.A","tipo":"cifra","q":"¿Cuál de estas tipologías del bloque de corrupción publicó la UIF en su informe 2016?","a":"Abuso de sindicatos","o":["Abuso de sindicatos","Institución educativa de nivel superior","Personas Políticamente Expuestas (PEPs)","Corrupción ex servidor público"],"x":"Abuso de sindicatos es del informe UIF 2016, la única del bloque de corrupción de ese año. Corrupción ex servidor público es de 2020, Institución educativa de 2019 y PEPs de 2022.","ref":"Tipología UIF 2016 · Abuso de sindicatos"},{"id":"H019","tema":"2.1-tip.A","tipo":"caso","q":"Una universidad recibe recursos de origen ilícito, los envía a cuentas en varios países y después regresan a México. Además, utiliza un patronato y gasta fondos públicos en máquinas de juego. ¿Qué tipología describe mejor el caso?","a":"Institución educativa de nivel superior","o":["OSFL con actividades religiosas","Estafa Maestra versión Pemex","Cohecho alto ejecutivo sector energético","Institución educativa de nivel superior"],"x":"La universidad que recibe, triangula y regresa el dinero, con patronato y máquinas de juego, es Institución educativa de nivel superior (UIF 2019). En la Estafa Maestra versión Pemex (2020) la universidad sólo es el conducto: la contratan para servicios que no puede proveer.","ref":"Tipología UIF 2019 · Institución educativa de nivel superior"},{"id":"H020","tema":"2.1-tip.A","tipo":"caso","q":"El oficial de cumplimiento observa que una universidad que opera con un patronato envía transferencias internacionales elevadas sin justificación comercial; los recursos pasan por varios países y vuelven a México. ¿Qué tipología describe mejor el caso?","a":"Institución educativa de nivel superior","o":["Estafa Maestra versión Pemex","Compañía con operaciones lícitas","Cohecho alto ejecutivo sector energético","Institución educativa de nivel superior"],"x":"Recursos que van al extranjero y regresan, con un patronato universitario de por medio, describen Institución educativa de nivel superior (UIF 2019). Compañía con operaciones lícitas también triangula, pero es un negocio real en zona fronteriza que mezcla fondos.","ref":"Tipología UIF 2019 · Institución educativa de nivel superior"},{"id":"H021","tema":"2.1-tip.A","tipo":"cifra","q":"¿Cuál de estas tipologías es del informe 2019 de la UIF?","a":"Institución educativa de nivel superior","o":["Cohecho alto ejecutivo sector energético","Estafa Maestra versión Pemex","Institución educativa de nivel superior","Personas Políticamente Expuestas (PEPs)"],"x":"Institución educativa de nivel superior es de 2019 (el otro caso de ese año es Trata de personas). Cohecho y la Estafa Maestra son de 2020, y PEPs de 2022.","ref":"Tipología UIF 2019 · Institución educativa de nivel superior"},{"id":"H022","tema":"2.1-tip.B","tipo":"caso","q":"Un abogado maneja las finanzas del líder de un cártel. Con prestanombres constituye once empresas exportadoras que compran vehículos de lujo y los exportan a un país asiático; además, lava recursos con otras empresas de giros diversos, como seguridad y limpieza o construcción, y con una sociedad civil, y dispersa los recursos vía SPEI entre las empresas del grupo. ¿Qué tipología describe mejor el caso?","a":"El Licenciado","o":["Estructura corporativa simula operaciones","Fentanilo (tráfico y comercio exterior)","El Licenciado","Asociación altruista ¿apoya a migrantes?"],"x":"Un profesionista como operador financiero de un cártel, exportación de vehículos de lujo y una OSFL como pieza del esquema son El Licenciado (UIF 2021). En Estructura corporativa simula operaciones (2016) la red de fachadas ofrece lavado como servicio a otros grupos, con oficinas virtuales.","ref":"Tipología UIF 2021 · El Licenciado"},{"id":"H023","tema":"2.1-tip.B","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología El Licenciado?","a":"Relación profesional cercana con diversos líderes de cárteles","o":["Relación profesional cercana con diversos líderes de cárteles","Empresas que se ostentan como entidad financiera sin autorización","Uso de una persona de edad muy avanzada como testaferro de la organización","Uso de oficinas virtuales o domicilios particulares como sede de varias empresas"],"x":"La relación profesional cercana con líderes de cárteles es señal de El Licenciado (UIF 2021), donde un abogado es el operador financiero del líder. Las oficinas virtuales son de Estructura corporativa (2016), el testaferro de edad avanzada de Asociación altruista (2020) y la ostentación como entidad financiera de Montadeudas (2023).","ref":"Tipología UIF 2021 · El Licenciado"},{"id":"H024","tema":"2.1-tip.B","tipo":"trampa","q":"Tres tipologías usan una OSFL. ¿En cuál la OSFL es sólo una pieza más, junto con empresas fachada, dentro de un esquema armado por un profesionista para el líder de un cártel?","a":"El Licenciado","o":["Estructura corporativa simula operaciones","Asociación altruista ¿apoya a migrantes?","El Licenciado","OSFL con actividades religiosas"],"x":"En El Licenciado (UIF 2021) la OSFL acompaña a empresas fachada como exportadoras de vehículos de lujo y de seguridad. En OSFL con actividades religiosas (2020) son cinco OSFL de un mismo líder, y en Asociación altruista (2020) la clave es el adulto mayor testaferro.","ref":"Tipología UIF 2021 · El Licenciado"},{"id":"H025","tema":"2.1-tip.B","tipo":"cifra","q":"¿En qué año publicó la UIF la tipología El Licenciado?","a":"2021","o":["2016","2022","2021","2020"],"x":"El Licenciado es del informe UIF 2021, el mismo año que León Chino, Fentanilo, Cajeros automáticos (skimming) y Trata y lenocinio.","ref":"Tipología UIF 2021 · El Licenciado"},{"id":"H026","tema":"2.1-tip.B","tipo":"caso","q":"Tres importadoras constituidas el mismo día con capital social mínimo reciben depósitos en efectivo en muchas localidades y envían al extranjero, sobre todo a una misma empresa del país de origen de las mercancías, montos muy superiores al valor de lo que importan. Un grupo de personas físicas repite el mismo patrón con depósitos en efectivo fraccionados. ¿Qué tipología describe mejor el caso?","a":"León Chino (comercio exterior)","o":["Estructura corporativa simula operaciones","Fentanilo (tráfico y comercio exterior)","Uso de identidad","León Chino (comercio exterior)"],"x":"Importaciones de valor muy inferior a lo enviado al extranjero, fondeadas con depósitos en efectivo de «pitufos», son León Chino (UIF 2021). En Fentanilo (2021) también hay importaciones, pero lo que se introduce es la droga misma, declarada como cloruro de calcio.","ref":"Tipología UIF 2021 · León Chino (comercio exterior)"},{"id":"H027","tema":"2.1-tip.B","tipo":"caso","q":"Una empresa importadora recibe depósitos en efectivo fraccionados de muchas personas y envía grandes pagos a proveedores en el extranjero. Si el esquema es el de León Chino, ¿qué señal de alerta esperaría confirmar el oficial?","a":"Que el valor de las importaciones sea muy inferior al monto enviado al extranjero","o":["Que la mercancía importada sea en realidad una droga declarada como otra sustancia","Que la empresa preste servicios de lavado a otros grupos desde oficinas virtuales","Que el valor de las importaciones sea muy inferior al monto enviado al extranjero","Que el acta constitutiva de la empresa tenga fechas ilógicas o inconsistentes"],"x":"La señal clave de León Chino (UIF 2021) es que lo importado vale mucho menos que lo enviado al extranjero. La droga declarada como otra sustancia es Fentanilo (2021), las oficinas virtuales son de Estructura corporativa (2016) y las actas con fechas ilógicas de Uso de identidad (2009).","ref":"Tipología UIF 2021 · León Chino (comercio exterior)"},{"id":"H028","tema":"2.1-tip.B","tipo":"trampa","q":"León Chino y Fentanilo son tipologías de comercio exterior publicadas en 2021. ¿Qué rasgo es exclusivo de León Chino?","a":"Importaciones de valor muy inferior a lo enviado al extranjero, fondeadas con depósitos de pitufos","o":["Una empresa del grupo coordina el envío de 16 toneladas de precursores a una empresa agroindustrial","Importaciones de valor muy inferior a lo enviado al extranjero, fondeadas con depósitos de pitufos","La droga misma se importa con una declaración falsa en la aduana que la hace pasar por otra sustancia","La hija menor de edad del traficante tiene relación corporativa con una de las empresas"],"x":"León Chino (2021) envía al extranjero mucho más de lo que vale lo importado y se fondea con efectivo de pitufos. La droga declarada como otra sustancia, el envío de 16 toneladas de precursores y la hija menor con relación corporativa son de Fentanilo (2021). Ojo: el domicilio común y la mezcla con fondos lícitos aparecen en las dos.","ref":"Tipología UIF 2021 · León Chino (comercio exterior)"},{"id":"H029","tema":"2.1-tip.B","tipo":"caso","q":"Una institución financiera detecta que tres empresas importadoras reciben depósitos en efectivo y que un grupo de personas fracciona depósitos en efectivo en distintas cuentas (pitufeo) para concentrar los recursos. Casi todo se envía a una empresa en el extranjero, mientras que el valor comercial de las importaciones definitivas registradas por esas empresas es significativamente inferior a lo enviado. ¿Qué tipología describe mejor el caso?","a":"León Chino (comercio exterior)","o":["León Chino (comercio exterior)","Compañía con operaciones lícitas","Fentanilo (tráfico y comercio exterior)","Ruta de dinero"],"x":"El pitufeo con efectivo, el envío de recursos a una empresa extranjera y un valor importado muy inferior a lo enviado, que simula actos de comercio exterior, son León Chino (UIF 2021). Fentanilo (2021) también involucra comercio exterior, pero allí el comercio mezcla recursos lícitos e ilícitos y el traficante introduce la droga declarándola como otra sustancia; el caso no plantea mercancía ilícita. Ruta de dinero (2009) usa depósitos en efectivo, pero sin comercio exterior: los recursos depositados en la frontera se retiran de forma simultánea en el interior.","ref":"Tipología UIF 2021 · León Chino (comercio exterior)"},{"id":"H030","tema":"2.1-tip.B","tipo":"caso","q":"Una comercializadora declara en el manifiesto un cargamento como cloruro de calcio, pero las muestras de laboratorio dan positivo a fentanilo. Las mismas empresas importan camisas, plásticos y parquímetros para mezclar recursos lícitos e ilícitos, y comparten domicilio y teléfono con el traficante y su esposa. ¿Qué tipología describe mejor el caso?","a":"Fentanilo (tráfico y comercio exterior)","o":["Fentanilo (tráfico y comercio exterior)","Estructura corporativa simula operaciones","Compañía con operaciones lícitas","León Chino (comercio exterior)"],"x":"Introducir la droga misma con declaración falsa y usar importaciones legales para mezclar fondos es Fentanilo (UIF 2021). León Chino (2021) también es comercio exterior y también tiene domicilios comunes, pero su clave es que el valor importado es muy inferior a lo enviado al extranjero.","ref":"Tipología UIF 2021 · Fentanilo (tráfico y comercio exterior)"},{"id":"H031","tema":"2.1-tip.B","tipo":"caso","q":"Una autoridad aduanera revisa un cargamento declarado en el manifiesto como un compuesto químico industrial y el laboratorio detecta que contiene una droga sintética. El importador y su esposa figuran como socios de varias empresas que importan prendas, plásticos y parquímetros, y la institución financiera observa que esas importaciones legales sirven para mezclar recursos lícitos con las ganancias del tráfico. ¿Qué tipología describe mejor el caso?","a":"Fentanilo (tráfico y comercio exterior)","o":["Estructura corporativa simula operaciones","León Chino (comercio exterior)","Compañía con operaciones lícitas","Fentanilo (tráfico y comercio exterior)"],"x":"Introducir la droga declarándola como otra sustancia y usar empresas fachada que importan bienes legales para mezclar y lavar las ganancias es Fentanilo (UIF 2021). León Chino (2021) es el distractor más tentador porque también simula comercio exterior, pero su clave es que el valor importado es muy inferior a lo enviado al extranjero y no hay mercancía ilícita. Estructura corporativa (2016) y Compañía con operaciones lícitas no incluyen un cargamento de droga en aduanas.","ref":"Tipología UIF 2021 · Fentanilo (tráfico y comercio exterior)"},{"id":"H032","tema":"2.1-tip.B","tipo":"trampa","q":"¿Qué rasgo distingue a Fentanilo de León Chino?","a":"Se importa la droga misma declarada como otra sustancia, y bienes legales sirven para mezclar","o":["Se importa la droga misma declarada como otra sustancia, y bienes legales sirven para mezclar","El esquema se fondea con depósitos masivos en efectivo realizados por numerosos pitufos","El valor de lo importado es muy inferior al monto enviado al país de origen de las mercancías","Empresas constituidas el mismo día con capital mínimo mueven grandes volúmenes de recursos al exterior"],"x":"En Fentanilo (UIF 2021) el comercio exterior transporta la propia droga y los bienes legales sirven para mezclar ganancias. Importaciones de valor muy inferior a lo enviado, pitufos y empresas constituidas el mismo día con capital mínimo son rasgos de León Chino (2021).","ref":"Tipología UIF 2021 · Fentanilo (tráfico y comercio exterior)"},{"id":"H033","tema":"2.1-tip.B","tipo":"caso","q":"Un grupo delictivo registra una extensa red de empresas que usan como sede la misma oficina virtual o domicilios particulares. Sus accionistas son empleados jóvenes de bajo perfil y el grupo ofrece a otras organizaciones criminales el servicio de lavar su dinero. ¿Qué tipología describe mejor el caso?","a":"Estructura corporativa simula operaciones","o":["Estructura corporativa simula operaciones","Uso de personas jóvenes para enviar dinero","Bienes raíces con dinero ilícito","El Licenciado"],"x":"Ofrecer lavado como servicio a terceros, con oficinas virtuales y accionistas jóvenes de bajo perfil, es Estructura corporativa simula operaciones (UIF 2016). En El Licenciado (2021) el esquema se arma para el líder de un cártel específico, con exportadoras de vehículos de lujo y una OSFL.","ref":"Tipología UIF 2016 · Estructura corporativa simula operaciones"},{"id":"H034","tema":"2.1-tip.B","tipo":"trampa","q":"Compañía con operaciones lícitas y Estructura corporativa simula operaciones son de 2016. ¿Qué rasgo apunta a Estructura corporativa?","a":"Empresas fachada creadas para ofrecer lavado de dinero como servicio a otros grupos","o":["Empresas fachada creadas para ofrecer lavado de dinero como servicio a otros grupos","Operación en zona fronteriza con triangulación y dispersión a personas con esquema de ruta de dinero","Un negocio real con alto manejo de efectivo que mezcla fondos ilícitos con sus ventas","Contrapartes que aparecen en la Lista de Personas Bloqueadas de la autoridad"],"x":"Estructura corporativa simula operaciones (UIF 2016) son fachadas que maquilan lavado para otros. En Compañía con operaciones lícitas (2016) el negocio sí es real y mezcla fondos en zona fronteriza, con contrapartes en la Lista de Personas Bloqueadas.","ref":"Tipología UIF 2016 · Estructura corporativa simula operaciones"},{"id":"H035","tema":"2.1-tip.B","tipo":"caso","q":"Una institución financiera identifica a una organización que, mediante agentes independientes, ofrece servicios de lavado de dinero a otras organizaciones delictivas. Para ello dispone de decenas de empresas fachada con giros comerciales diversos, cuyos accionistas son prestanombres de bajo perfil, y varias comparten domicilios que resultan ser oficinas virtuales o casas habitación. ¿Qué tipología describe mejor el caso?","a":"Estructura corporativa simula operaciones","o":["Compañía con operaciones lícitas","Uso de personas jóvenes para enviar dinero","Estructura corporativa simula operaciones","El Licenciado"],"x":"El lavado ofrecido como servicio a otros grupos, con decenas de empresas fachada, prestanombres y oficinas virtuales, es Estructura corporativa simula operaciones (UIF 2016). El Licenciado (2021) es el distractor más tentador por el uso de empresas y un operador financiero, pero allí un abogado arma el esquema para el líder de un cártel y no hay una organización que venda el servicio a terceros. Uso de personas jóvenes (2016) se centra en el envío de dinero por jóvenes cuya edad no corresponde a los montos, y Compañía con operaciones lícitas en recursos de personas bloqueadas.","ref":"Tipología UIF 2016 · Estructura corporativa simula operaciones"},{"id":"H036","tema":"2.1-tip.B","tipo":"caso","q":"Cinco asociaciones con fines de culto, todas dirigidas por la misma persona, hacen inversiones, compran bienes de lujo y transfieren recursos a paraísos fiscales, con lo que su dirigente evade impuestos. ¿Qué tipología describe mejor el caso?","a":"OSFL con actividades religiosas","o":["Abuso de sindicatos","El Licenciado","Asociación altruista ¿apoya a migrantes?","OSFL con actividades religiosas"],"x":"Cinco OSFL religiosas con un mismo líder y actividades lucrativas son OSFL con actividades religiosas (UIF 2020). Abuso de sindicatos (2016) también desvía fondos a lujos de un líder, pero la organización es de trabajadores, no de culto.","ref":"Tipología UIF 2020 · OSFL con actividades religiosas"},{"id":"H037","tema":"2.1-tip.B","tipo":"caso","q":"Al revisar a cinco organizaciones de culto dirigidas por la misma persona, el oficial busca señales de alerta de la tipología que les corresponde. ¿Cuál de estas es una de ellas?","a":"Transferencias a paraísos fiscales","o":["Uso de una persona de edad muy avanzada como testaferro","Transferencias a paraísos fiscales","Retiros frecuentes en efectivo por montos fraccionados","Abogados o contadores participando activamente en el esquema"],"x":"En OSFL con actividades religiosas (UIF 2020) las señales son actos con fines lucrativos, transferencias a paraísos fiscales y bienes de lujo ajenos al objeto social. El testaferro de edad avanzada y los retiros fraccionados son de Asociación altruista (2020), y los profesionistas de El Licenciado (2021).","ref":"Tipología UIF 2020 · OSFL con actividades religiosas"},{"id":"H038","tema":"2.1-tip.B","tipo":"cifra","q":"¿Cuál de estas tipologías es del informe 2020 de la UIF?","a":"OSFL con actividades religiosas","o":["Uso de identidad","Bienes raíces con dinero ilícito","OSFL con actividades religiosas","El Licenciado"],"x":"OSFL con actividades religiosas es de 2020, igual que Asociación altruista. El Licenciado, la tercera tipología con OSFL, es de 2021; Bienes raíces es de 2016 y Uso de identidad de 2009.","ref":"Tipología UIF 2020 · OSFL con actividades religiosas"},{"id":"H039","tema":"2.1-tip.B","tipo":"caso","q":"Una organización civil que dice ayudar a migrantes recibe transferencias que reenvía casi de inmediato y paga 173 cheques liquidados en efectivo por montos fraccionados. Uno de sus cheques, por $505 mil, va a un hombre de 92 años que, además, opera millones en efectivo en su propia cuenta. ¿Qué tipología describe mejor el caso?","a":"Asociación altruista ¿apoya a migrantes?","o":["Asociación altruista ¿apoya a migrantes?","Cuenta personal para actividad empresarial","El Licenciado","OSFL con actividades religiosas"],"x":"La supuesta ayuda a migrantes, el adulto mayor usado como testaferro para operar efectivo y el reenvío rápido son Asociación altruista ¿apoya a migrantes? (UIF 2020). En OSFL con actividades religiosas (2020) hay cinco OSFL de un mismo líder dedicadas a actividades lucrativas.","ref":"Tipología UIF 2020 · Asociación altruista ¿apoya a migrantes?"},{"id":"H040","tema":"2.1-tip.B","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología «Asociación altruista ¿apoya a migrantes?»?","a":"Uso de una persona de edad muy avanzada como testaferro","o":["Uso de una persona de edad muy avanzada como testaferro","Compra de bienes de lujo no acordes al objeto social de la organización","Abogados o contadores activos en el esquema","Transferencias a paraísos fiscales de una OSFL controlada por su líder"],"x":"El testaferro de edad muy avanzada es la señal distintiva de Asociación altruista (UIF 2020). Paraísos fiscales y bienes de lujo son de OSFL con actividades religiosas (2020), y los profesionistas activos son de El Licenciado (2021).","ref":"Tipología UIF 2020 · Asociación altruista ¿apoya a migrantes?"},{"id":"H041","tema":"2.1-tip.B","tipo":"trampa","q":"Pregunta-gancho de las tres OSFL: ¿cinco OSFL religiosas con un líder, un adulto mayor como testaferro o un abogado del cártel? Si la OSFL usa a un adulto mayor como testaferro para operar efectivo, ¿de qué tipología se trata?","a":"Asociación altruista ¿apoya a migrantes?","o":["Estructura corporativa simula operaciones","Asociación altruista ¿apoya a migrantes?","OSFL con actividades religiosas","El Licenciado"],"x":"El adulto mayor como testaferro es el rasgo de Asociación altruista ¿apoya a migrantes? (UIF 2020). Cinco OSFL religiosas con un líder es OSFL con actividades religiosas (2020) y el abogado del cártel es El Licenciado (2021).","ref":"Tipología UIF 2020 · Asociación altruista ¿apoya a migrantes?"},{"id":"H042","tema":"2.1-tip.B","tipo":"caso","q":"Una desarrolladora constituida hace poco arranca proyectos de gran magnitud sin una fuente lícita de financiamiento identificable. Reporta preventas que en un alto porcentaje se liquidan de contado, y sus representantes legales son personas jóvenes que representan a varias empresas. ¿Qué tipología describe mejor el caso?","a":"Bienes raíces con dinero ilícito","o":["Compañía con operaciones lícitas","Trata y lenocinio","Bienes raíces con dinero ilícito","Estructura corporativa simula operaciones"],"x":"Preventas con alto porcentaje de operaciones de contado en una empresa de reciente creación son Bienes raíces con dinero ilícito (UIF 2016). En Estructura corporativa (2016) también hay jóvenes de bajo perfil, pero como accionistas de fachadas que lavan para otros grupos.","ref":"Tipología UIF 2016 · Bienes raíces con dinero ilícito"},{"id":"H043","tema":"2.1-tip.B","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Bienes raíces con dinero ilícito?","a":"Esquemas de preventa con alto porcentaje de operaciones de contado","o":["Recepción de transferencias que son reenviadas rápidamente a terceros","Visitas domiciliarias que constatan la inexistencia física de la empresa","Esquemas de preventa con alto porcentaje de operaciones de contado","Uso de oficinas virtuales como sede de múltiples empresas del grupo"],"x":"Las preventas liquidadas en gran parte de contado son la señal de Bienes raíces con dinero ilícito (UIF 2016). Las oficinas virtuales son de Estructura corporativa (2016), la empresa inexistente de Uso de identidad (2009) y el reenvío rápido de Asociación altruista (2020).","ref":"Tipología UIF 2016 · Bienes raíces con dinero ilícito"},{"id":"H044","tema":"2.1-tip.B","tipo":"cifra","q":"¿Cuál de estas tipologías es del informe 2016 de la UIF?","a":"Bienes raíces con dinero ilícito","o":["León Chino (comercio exterior)","Asociación altruista ¿apoya a migrantes?","Bienes raíces con dinero ilícito","Uso de identidad"],"x":"Bienes raíces con dinero ilícito es de 2016. León Chino es de 2021, Asociación altruista de 2020 y Uso de identidad de 2009.","ref":"Tipología UIF 2016 · Bienes raíces con dinero ilícito"},{"id":"H045","tema":"2.1-tip.B","tipo":"caso","q":"Un negocio que sí opera, en una ciudad fronteriza y con mucho manejo de efectivo, mezcla recursos ilícitos con sus ingresos y triangula fondos con empresas de domicilio común. Los recursos llegan a personas sin relación aparente, ya reportadas por operaciones de «ruta de dinero», y se dispersan a jóvenes de estrato social bajo que los retiran de forma simultánea. ¿Qué tipología describe mejor el caso?","a":"Compañía con operaciones lícitas","o":["Trata y lenocinio","Compañía con operaciones lícitas","Ruta de dinero","Estructura corporativa simula operaciones"],"x":"Un negocio real en zona fronteriza que mezcla fondos y los dispersa a jóvenes de estrato bajo con esquema de ruta de dinero es Compañía con operaciones lícitas (UIF 2016). Trata y lenocinio (2021) también mezcla efectivo en un giro comercial y entra por zonas fronterizas, pero su origen es la explotación sexual. Ruta de dinero (2009) no tiene un negocio real: son depósitos en la frontera a cuentas del interior que se retiran al mismo tiempo.","ref":"Tipología UIF 2016 · Compañía con operaciones lícitas"},{"id":"H046","tema":"2.1-tip.B","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Compañía con operaciones lícitas?","a":"Personas que reciben recursos de otras que están en la Lista de Personas Bloqueadas","o":["Uso de oficinas virtuales o domicilios particulares como sede de varias empresas del grupo","Concentración de retiros en cajeros automáticos de zonas turísticas","Visitas domiciliarias que constatan la inexistencia física de la empresa que se está revisando","Personas que reciben recursos de otras que están en la Lista de Personas Bloqueadas"],"x":"Recibir recursos de personas en la Lista de Personas Bloqueadas es señal de Compañía con operaciones lícitas (UIF 2016); también aparece en Trata y lenocinio (2021). Las oficinas virtuales son de Estructura corporativa (2016), la empresa inexistente de Uso de identidad (2009) y los cajeros de zonas turísticas de Cajeros automáticos (2021).","ref":"Tipología UIF 2016 · Compañía con operaciones lícitas"},{"id":"H047","tema":"2.1-tip.B","tipo":"trampa","q":"Frente a Uso de identidad, Estructura corporativa simula operaciones y León Chino, ¿qué rasgo apunta a Compañía con operaciones lícitas?","a":"Un negocio real en zona fronteriza, con alto manejo de efectivo, que mezcla fondos ilícitos con sus ingresos legales","o":["Las empresas no existen físicamente y se crearon con documentos constitutivos falsos","Las empresas son fachada y ofrecen servicios de lavado a otros grupos criminales","Las empresas envían al extranjero mucho más que el valor de lo que importan","Un negocio real en zona fronteriza, con alto manejo de efectivo, que mezcla fondos ilícitos con sus ingresos legales"],"x":"En Compañía con operaciones lícitas (UIF 2016) la empresa es real, está en zona fronteriza y mezcla fondos con sus ingresos. Empresas inexistentes con documentos falsos son Uso de identidad (2009), lavado como servicio es Estructura corporativa (2016) y enviar mucho más que lo importado es León Chino (2021). Ojo: mezclar en negocios legítimos también aparece en Trata y lenocinio (2021), donde el origen es la explotación sexual.","ref":"Tipología UIF 2016 · Compañía con operaciones lícitas"},{"id":"H048","tema":"2.1-tip.B","tipo":"caso","q":"Una distribuidora con operación comercial real en una ciudad fronteriza maneja mucho efectivo. El monitoreo detecta que recibe recursos de personas incluidas en la Lista de Personas Bloqueadas y que dispersa fondos, a través de una persona física, a jóvenes de estrato social bajo ya reportados por operaciones de «ruta de dinero», que los retiran de forma simultánea. ¿Qué tipología describe mejor el caso?","a":"Compañía con operaciones lícitas","o":["Fentanilo (tráfico y comercio exterior)","Compañía con operaciones lícitas","Trata y lenocinio","Estructura corporativa simula operaciones"],"x":"Negocio real en frontera, contrapartes en la Lista de Personas Bloqueadas y dispersión a jóvenes de estrato bajo con esquema de ruta de dinero son Compañía con operaciones lícitas (UIF 2016). Trata y lenocinio (2021) comparte la Lista de Personas Bloqueadas, el mismo domicilio fiscal y la mezcla en un giro comercial, pero su origen es la explotación sexual y no trae el esquema de ruta de dinero.","ref":"Tipología UIF 2016 · Compañía con operaciones lícitas"},{"id":"H049","tema":"2.1-tip.B","tipo":"caso","q":"Al revisar el expediente de una empresa que ordena muchas transferencias pequeñas a distintos beneficiarios fuera del país, el oficial nota que el acta constitutiva tiene fechas ilógicas. En la visita al domicilio se confirma que la empresa no existe físicamente. ¿Qué tipología describe mejor el caso?","a":"Uso de identidad","o":["Uso de identidad","Estructura corporativa simula operaciones","Transferencias a beneficiarios comunes","Cuenta personal para actividad empresarial"],"x":"Documentos falsos, empresa inexistente y muchas transferencias pequeñas a muchos beneficiarios en el extranjero son Uso de identidad (UIF 2009). Transferencias a beneficiarios comunes (2009) es el patrón inverso: muchos ordenantes envían a un mismo beneficiario.","ref":"Tipología UIF 2009 · Uso de identidad"},{"id":"H050","tema":"2.1-tip.B","tipo":"caso","q":"Lavadores de dinero extranjeros reclutan a mexicanos con relaciones en el sector financiero, que acuden a las instituciones con documentos de sociedades cuyas actas resultan falsas; la visita domiciliaria confirma que las empresas no existen y desde ellas se ordenan transferencias al extranjero. ¿Qué tipología describe mejor el caso?","a":"Uso de identidad","o":["Uso de identidad","Cajeros automáticos (skimming)","Estructura corporativa simula operaciones","Transferencias a beneficiarios comunes"],"x":"Lavadores extranjeros que, con cómplices locales, crean empresas inexistentes con documentos falsos describen Uso de identidad (UIF 2009). En Cajeros automáticos (skimming) (2021) también hay una banda extranjera, pero su método es clonar tarjetas en zonas turísticas.","ref":"Tipología UIF 2009 · Uso de identidad"},{"id":"H051","tema":"2.1-tip.B","tipo":"cifra","q":"¿En qué año publicó la UIF la tipología Uso de identidad?","a":"2009","o":["2021","2018","2009","2016"],"x":"Uso de identidad es del informe UIF 2009, junto con Ruta de dinero, Cajas de seguridad, Cuenta personal y Beneficiarios comunes.","ref":"Tipología UIF 2009 · Uso de identidad"},{"id":"H052","tema":"2.1-tip.C","tipo":"caso","q":"Una sucursal en una ciudad fronteriza detecta varias cuentas de reciente apertura cuyos titulares, algunos menores de 25 años, no están inscritos ante el SAT. Las cuentas reciben depósitos en efectivo fraccionados y, casi de inmediato, se envían transferencias a empresas en el extranjero. ¿Qué tipología describe mejor el caso?","a":"Uso de personas jóvenes para enviar dinero","o":["Ruta de dinero","Transferencias a beneficiarios comunes","Cuenta personal para actividad empresarial","Uso de personas jóvenes para enviar dinero"],"x":"Menores de 25 años sin actividad fiscal, cuentas de recién apertura con alta operatividad y envío rápido al extranjero son Uso de personas jóvenes para enviar dinero (UIF 2016). En Ruta de dinero (2009) los titulares son de bajo perfil y retiran los fondos al mismo tiempo, no los transfieren al extranjero.","ref":"Tipología UIF 2016 · Uso de personas jóvenes para enviar dinero"},{"id":"H053","tema":"2.1-tip.C","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Uso de personas jóvenes para enviar dinero?","a":"La edad de los sujetos no es acorde a los montos manejados","o":["Múltiples firmantes sin relación aparente con el titular","Múltiples ordenantes enviando fondos a un mismo beneficiario","La edad de los sujetos no es acorde a los montos manejados","Retiro simultáneo de los recursos sin permanencia en la cuenta"],"x":"Que la edad no corresponda a los montos es señal de Uso de personas jóvenes (UIF 2016). El retiro simultáneo es de Ruta de dinero, los múltiples ordenantes de Beneficiarios comunes y los múltiples firmantes de Cuenta personal (todas de 2009).","ref":"Tipología UIF 2016 · Uso de personas jóvenes para enviar dinero"},{"id":"H054","tema":"2.1-tip.C","tipo":"trampa","q":"Varias tipologías mencionan personas jóvenes. ¿Qué combinación es propia de Uso de personas jóvenes para enviar dinero?","a":"Menores de 25 años sin actividad fiscal, en cuentas de recién apertura con alta operatividad","o":["Jóvenes como representantes legales de varias empresas que venden en preventa de contado","Menores de 25 años sin actividad fiscal, en cuentas de recién apertura con alta operatividad","Empleados jóvenes de bajo perfil como accionistas de empresas con sede en oficina virtual","Personas jóvenes que operan montos elevados y compran criptomonedas en plataforma no registrada"],"x":"Sólo en Uso de personas jóvenes (UIF 2016) los jóvenes son el producto: menores de 25, sin actividad fiscal y con cuentas nuevas muy operadas. Los jóvenes representantes son de Bienes raíces (2016), los accionistas jóvenes de Estructura corporativa (2016) y los jóvenes con cripto de Activos virtuales (2022).","ref":"Tipología UIF 2016 · Uso de personas jóvenes para enviar dinero"},{"id":"H055","tema":"2.1-tip.C","tipo":"caso","q":"Un cliente menor de 25 años abrió su cuenta recientemente, no está inscrito ante el SAT y ya recibe depósitos en efectivo fraccionados desde distintas zonas del país, que después se relacionan con el narcotráfico. Poco después de cada depósito transfiere los recursos a empresas en el extranjero sin relación con su actividad. ¿Qué tipología describe mejor el caso?","a":"Uso de personas jóvenes para enviar dinero","o":["Uso ilícito de activos virtuales","Cuenta personal para actividad empresarial","Ruta de dinero","Uso de personas jóvenes para enviar dinero"],"x":"Un joven sin registro fiscal, con cuenta de recién apertura que recibe efectivo ilícito y lo transfiere rápido al extranjero, encaja en Uso de personas jóvenes para enviar dinero (UIF 2016). En Cuenta personal para actividad empresarial (2009) la cuenta recibe fondos de empresas, no depósitos en efectivo para reenviar.","ref":"Tipología UIF 2016 · Uso de personas jóvenes para enviar dinero"},{"id":"H056","tema":"2.1-tip.C","tipo":"caso","q":"En una ciudad de la frontera norte, una persona cambia dólares en efectivo por pesos y los deposita en cuentas de varias personas de bajo perfil que viven en el interior del país. Poco después, todos los titulares retiran los fondos de manera simultánea y coordinada. ¿Qué tipología describe mejor el caso?","a":"Ruta de dinero","o":["Compañía con operaciones lícitas","Uso de personas jóvenes para enviar dinero","Transferencias a beneficiarios comunes","Ruta de dinero"],"x":"Dólares cambiados en la frontera, depósitos en muchas cuentas de bajo perfil del interior y retiro simultáneo son Ruta de dinero (UIF 2009). Compañía con operaciones lícitas (2016) también ocurre en zona fronteriza, pero es un negocio real que mezcla fondos.","ref":"Tipología UIF 2009 · Ruta de dinero"},{"id":"H057","tema":"2.1-tip.C","tipo":"caso","q":"Varias cuentas de personas con ingresos bajos, en ciudades del centro del país, reciben depósitos en efectivo hechos en sucursales de la frontera. Los recursos no permanecen: los titulares los retiran casi al mismo tiempo en distintas sucursales. ¿Qué tipología describe mejor el caso?","a":"Ruta de dinero","o":["Asociación altruista ¿apoya a migrantes?","Ruta de dinero","Uso de personas jóvenes para enviar dinero","Cuenta personal para actividad empresarial"],"x":"Depósitos en la frontera a cuentas del interior y retiro simultáneo sin permanencia son el rasgo de Ruta de dinero (UIF 2009). Asociación altruista (2020) también reenvía rápido, pero se trata de una OSFL con un testaferro de edad avanzada.","ref":"Tipología UIF 2009 · Ruta de dinero"},{"id":"H058","tema":"2.1-tip.C","tipo":"trampa","q":"Ruta de dinero y Transferencias a beneficiarios comunes son de 2009. ¿Qué rasgo es propio de Ruta de dinero?","a":"Depósitos en la frontera a cuentas del interior y retiro simultáneo sin permanencia","o":["Consolidación de fondos para comprar activos de alto valor, como aeronaves","Centros cambiarios que ordenan transferencias al extranjero por cuenta de terceros","Muchos ordenantes que envían fondos a un mismo beneficiario ubicado en el extranjero","Depósitos en la frontera a cuentas del interior y retiro simultáneo sin permanencia"],"x":"Ruta de dinero (UIF 2009) se reconoce por el retiro simultáneo y coordinado de lo depositado en la frontera. Muchos ordenantes a un beneficiario, los centros cambiarios y las aeronaves son de Transferencias a beneficiarios comunes (2009).","ref":"Tipología UIF 2009 · Ruta de dinero"},{"id":"H059","tema":"2.1-tip.C","tipo":"cifra","q":"¿Cuál de estas tipologías es del informe 2009 de la UIF?","a":"Ruta de dinero","o":["Ruta de dinero","Cajeros automáticos (skimming)","Uso de personas jóvenes para enviar dinero","Fraudes informáticos"],"x":"Ruta de dinero es de 2009. Uso de personas jóvenes es de 2016, Fraudes informáticos de 2018 y Cajeros automáticos (skimming) de 2021.","ref":"Tipología UIF 2009 · Ruta de dinero"},{"id":"H060","tema":"2.1-tip.C","tipo":"caso","q":"Un funcionario público ligado al narcotráfico contrata en su banco un producto para resguardar objetos físicos, aunque su perfil no justifica ese servicio. Acude con mucha frecuencia y se sospecha que guarda efectivo y joyas para no dejar rastro en el sistema financiero. ¿Qué tipología describe mejor el caso?","a":"Uso de cajas de seguridad","o":["Corrupción ex servidor público","Uso de cajas de seguridad","Cuenta personal para actividad empresarial","Uso de personas jóvenes para enviar dinero"],"x":"Resguardar efectivo y joyas fuera del sistema, con accesos frecuentes y un perfil que no justifica el servicio, es Uso de cajas de seguridad (UIF 2009). Corrupción ex servidor público (2020) también involucra a un funcionario, pero lava con empresas fachada, excontratistas y paraísos fiscales.","ref":"Tipología UIF 2009 · Uso de cajas de seguridad"},{"id":"H061","tema":"2.1-tip.C","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Uso de cajas de seguridad?","a":"Titular que es servidor público de áreas de seguridad","o":["Titular que es servidor público de áreas de seguridad","Cuenta «personal» que recibe fondos de empresas","Depósitos en efectivo en la frontera a cuentas del interior del país","Incongruencia entre declaraciones patrimoniales y gastos"],"x":"Que el titular sea un servidor público de áreas de seguridad es señal de Uso de cajas de seguridad (UIF 2009), junto con la alta frecuencia de acceso y un perfil que no justifica el servicio. La cuenta personal que recibe fondos de empresas es de Cuenta personal para actividad empresarial (2009), los depósitos en la frontera de Ruta de dinero (2009) y la incongruencia patrimonial de Corrupción ex servidor público (2020).","ref":"Tipología UIF 2009 · Uso de cajas de seguridad"},{"id":"H062","tema":"2.1-tip.C","tipo":"cifra","q":"¿En qué año publicó la UIF la tipología Uso de cajas de seguridad?","a":"2009","o":["2022","2016","2018","2009"],"x":"Uso de cajas de seguridad es del informe UIF 2009, el año con más tipologías del bloque de productos bancarios.","ref":"Tipología UIF 2009 · Uso de cajas de seguridad"},{"id":"H063","tema":"2.1-tip.C","tipo":"caso","q":"Una persona física que contrató su cuenta para uso personal recibe depósitos frecuentes y de alto monto de varias sociedades mercantiles. Su producto de depósito tiene varios firmantes sin relación aparente con ella y los montos superan por mucho su perfil transaccional. ¿Qué tipología describe mejor el caso?","a":"Cuenta personal para actividad empresarial","o":["Transferencias a beneficiarios comunes","Cuenta personal para actividad empresarial","Uso de personas jóvenes para enviar dinero","Estructura corporativa simula operaciones"],"x":"Una cuenta de persona física que recibe fondos de sociedades, con firmantes sin relación con la titular, es Cuenta personal para actividad empresarial (UIF 2009). En Uso de personas jóvenes (2016) el titular es menor de 25 y recibe efectivo para enviarlo al extranjero.","ref":"Tipología UIF 2009 · Cuenta personal para actividad empresarial"},{"id":"H064","tema":"2.1-tip.C","tipo":"caso","q":"Una institución financiera abrió la cuenta de una persona física que declaró destinarla a gastos personales. Al revisar el contrato y los registros de la cuenta, su analista la contrasta con la tipología Cuenta personal para actividad empresarial (UIF 2009). ¿Qué hallazgo sería señal de alerta de esa tipología?","a":"Recursos que provienen de empresas en una cuenta contratada para uso personal","o":["Depósitos en efectivo en la frontera a cuentas del interior del país","Recursos que provienen de empresas en una cuenta contratada para uso personal","Alta frecuencia de acceso a la caja de seguridad del cliente","Centros cambiarios ordenando transferencias al extranjero"],"x":"Que en una cuenta contratada para uso personal entren recursos de empresas, cuyo origen puede ser una actividad empresarial, es el primer indicador de Cuenta personal para actividad empresarial (UIF 2009). El otro indicador es que los recursos rebasen el perfil transaccional declarado al abrir la cuenta. En el caso, además, había varios firmantes que aparecían como beneficiarios y se presentaban como «amigos». La alta frecuencia de acceso a una caja de seguridad es indicador de Cajas de seguridad, los depósitos en la frontera a cuentas del interior son de Ruta de dinero y los centros cambiarios que ordenan transferencias al extranjero son de Beneficiarios comunes (todas de 2009).","ref":"Tipología UIF 2009 · Cuenta personal para actividad empresarial"},{"id":"H065","tema":"2.1-tip.C","tipo":"caso","q":"Una empleada contrata una cuenta para uso personal; en ella aparecen varios firmantes que dicen ser sus amigos y que no tienen relación aparente con ella. La cuenta recibe recursos de varias sociedades que pertenecen a una red de lavado al servicio de narcotraficantes, en realidad operaciones comerciales que se hacen pasar por movimientos de una persona física. ¿Qué tipología describe mejor el caso?","a":"Cuenta personal para actividad empresarial","o":["Uso de identidad","Cuenta personal para actividad empresarial","Uso de personas jóvenes para enviar dinero","Uso de cajas de seguridad"],"x":"Hacer pasar operaciones comerciales ligadas al narco como movimientos de una persona física es Cuenta personal para actividad empresarial (UIF 2009). Uso de identidad (2009) también oculta al verdadero operador, pero con empresas inexistentes creadas con documentos falsos.","ref":"Tipología UIF 2009 · Cuenta personal para actividad empresarial"},{"id":"H066","tema":"2.1-tip.C","tipo":"trampa","q":"¿Cuál es la diferencia clave entre Cuenta personal para actividad empresarial y Uso de personas jóvenes para enviar dinero?","a":"En la primera, la cuenta de una persona física recibe fondos de empresas; en la segunda, jóvenes sin actividad fiscal reciben efectivo y lo envían al extranjero","o":["En la primera, la cuenta de una persona física recibe fondos de empresas; en la segunda, jóvenes sin actividad fiscal reciben efectivo y lo envían al extranjero","En la primera, la empresa titular no existe físicamente y sus actas tienen fechas ilógicas; en la segunda, los jóvenes son accionistas de empresas fachada con oficinas virtuales","En la primera, los titulares retiran todo al mismo tiempo en varias sucursales; en la segunda, muchos ordenantes jóvenes envían fondos a un mismo beneficiario","En la primera, el titular resguarda efectivo y joyas fuera del sistema financiero; en la segunda, jóvenes representan a varias empresas que venden en preventa"],"x":"Cuenta personal (UIF 2009) camufla actividad de empresas en la cuenta de una persona física; Uso de personas jóvenes (2016) recluta menores de 25 sin actividad fiscal para mover efectivo al extranjero. Los distractores mezclan rasgos de Ruta de dinero, Beneficiarios comunes, Uso de identidad, Cajas de seguridad y Bienes raíces.","ref":"Tipología UIF 2009 · Cuenta personal para actividad empresarial"},{"id":"H067","tema":"2.1-tip.C","tipo":"caso","q":"Varias personas de bajo perfil, sin relación con el destinatario, depositan dólares en efectivo y piden, en distintas instituciones y casas de cambio, transferencias al extranjero. Todas van al mismo beneficiario: el vendedor de aeronaves que adquieren integrantes de organizaciones delictivas. ¿Qué tipología describe mejor el caso?","a":"Transferencias a beneficiarios comunes","o":["Uso de identidad","Transferencias a beneficiarios comunes","Uso de personas jóvenes para enviar dinero","Ruta de dinero"],"x":"Muchos ordenantes sin relación con un mismo beneficiario en el extranjero (el vendedor o un broker de las aeronaves) es Transferencias a beneficiarios comunes (UIF 2009). Uso de identidad (2009) es al revés: una empresa inexistente envía transferencias pequeñas a muchos beneficiarios.","ref":"Tipología UIF 2009 · Transferencias a beneficiarios comunes"},{"id":"H068","tema":"2.1-tip.C","tipo":"caso","q":"Una institución financiera revisa transferencias al extranjero para pagar la compra de aeronaves, contratadas en distintas instituciones y liquidadas con depósitos en efectivo. Su analista las contrasta con la tipología Transferencias a beneficiarios comunes (UIF 2009). ¿Qué hallazgo sobre estas transferencias sería señal de alerta de esa tipología?","a":"Múltiples ordenantes enviando fondos a un mismo beneficiario","o":["Sujetos que no registran actividad fiscal pese a su alta operatividad","Múltiples ordenantes enviando fondos a un mismo beneficiario","Retiro simultáneo de los recursos sin permanencia en las cuentas","Múltiples transferencias pequeñas a múltiples beneficiarios en el extranjero"],"x":"Que varios ordenantes, cuya actividad no tiene relación con el beneficiario, envíen fondos a un mismo beneficiario (beneficiarios comunes con otros clientes con la misma operativa) es señal de Transferencias a beneficiarios comunes (UIF 2009). Las múltiples transferencias pequeñas a muchos beneficiarios en el extranjero parecen defendibles porque también son envíos al exterior, pero son de Uso de identidad (2009) y describen dispersión, no convergencia en un solo destinatario. El retiro simultáneo es de Ruta de dinero (2009) y la falta de actividad fiscal, de Uso de personas jóvenes (2016).","ref":"Tipología UIF 2009 · Transferencias a beneficiarios comunes"},{"id":"H069","tema":"2.1-tip.C","tipo":"trampa","q":"Uso de identidad y Transferencias a beneficiarios comunes (ambas de 2009) implican envíos al extranjero. ¿Qué patrón corresponde a Transferencias a beneficiarios comunes?","a":"Muchos ordenantes → un solo beneficiario, para consolidar fondos y comprar activos de alto valor","o":["Una empresa inexistente → muchos beneficiarios en el extranjero, con transferencias pequeñas y frecuentes","Jóvenes sin actividad fiscal → envíos rápidos al extranjero del efectivo que reciben en cuentas nuevas","Muchos ordenantes → un solo beneficiario, para consolidar fondos y comprar activos de alto valor","Depósitos en muchas cuentas de bajo perfil → retiro simultáneo y coordinado de los recursos"],"x":"Transferencias a beneficiarios comunes (UIF 2009) concentra: muchos envían a uno, que compra activos como aeronaves. Uso de identidad (2009) dispersa desde una empresa inexistente; los otros patrones son Ruta de dinero (2009) y Uso de personas jóvenes (2016).","ref":"Tipología UIF 2009 · Transferencias a beneficiarios comunes"},{"id":"H070","tema":"2.1-tip.C","tipo":"caso","q":"Personas de bajo perfil y sin relación entre sí acuden a distintas sucursales a depositar efectivo y ordenar envíos al extranjero. Al revisar los datos, el oficial ve que todas tienen el mismo destinatario, un intermediario que tramita la compra de aeronaves. ¿Qué tipología describe mejor el caso?","a":"Transferencias a beneficiarios comunes","o":["Cuenta personal para actividad empresarial","Asociación altruista ¿apoya a migrantes?","Ruta de dinero","Transferencias a beneficiarios comunes"],"x":"La convergencia de muchos ordenantes en un solo beneficiario en el extranjero es Transferencias a beneficiarios comunes (UIF 2009). En Ruta de dinero (2009) también hay cuentas de bajo perfil, pero los fondos se retiran en efectivo de forma simultánea, no se envían a un beneficiario.","ref":"Tipología UIF 2009 · Transferencias a beneficiarios comunes"},{"id":"H071","tema":"2.1-tip.D","tipo":"caso","q":"Varios usuarios denuncian una aplicación móvil que les dio préstamos rápidos con intereses exorbitantes. Al retrasarse, reciben amenazas y la app escribe a sus contactos y difunde sus fotos personales para presionarlos. La empresa se presenta como entidad financiera sin tener autorización. ¿Qué tipología describe mejor el caso?","a":"Montadeudas","o":["Fraudes informáticos","Uso ilícito de activos virtuales","Cajeros automáticos (skimming)","Montadeudas"],"x":"Apps de préstamo con intereses exorbitantes, extorsión con contactos y fotos, y una empresa que se ostenta como entidad financiera sin autorización son Montadeudas (UIF 2023). Fraudes informáticos (2018) también usa tecnología, pero desvía pagos con correos hackeados y facturas falsas.","ref":"Tipología UIF 2023 · Montadeudas"},{"id":"H072","tema":"2.1-tip.D","tipo":"caso","q":"Una institución financiera analiza a varias empresas de reciente constitución que otorgan préstamos y cobran intereses mediante cuentas abiertas en distintas instituciones. Su analista compara el comportamiento de esas cuentas con la tipología Montadeudas (UIF 2023). ¿Qué hallazgo sobre el flujo de fondos sería señal de alerta de esa tipología?","a":"Rápido movimiento de fondos vía SPEI a través de FINTECH","o":["Compra de activos virtuales en plataformas no registradas ante el SAT","Incongruencia entre el beneficiario indicado y el titular real de la cuenta","Concentración de retiros en cajeros de zonas turísticas","Rápido movimiento de fondos vía SPEI a través de FINTECH"],"x":"El rápido movimiento de fondos vía SPEI desde los bancos hacia una FINTECH, que dispersa los préstamos y capta los intereses, es señal de Montadeudas (UIF 2023); en la tipología se alcanzaron 600 millones de pesos en un mes. Los cajeros de zonas turísticas son de Skimming (2021), el beneficiario que no coincide con el titular de Fraudes informáticos (2018) y las plataformas no registradas de Activos virtuales (2022); ninguno describe el flujo de un préstamo digital, aunque el beneficiario incongruente podría parecer tentador por tratarse de transferencias.","ref":"Tipología UIF 2023 · Montadeudas"},{"id":"H073","tema":"2.1-tip.D","tipo":"cifra","q":"De las 26 tipologías del temario, ¿cuál es la única del informe 2023 de la UIF?","a":"Montadeudas","o":["Trata y lenocinio","Montadeudas","Uso ilícito de activos virtuales","Personas Políticamente Expuestas (PEPs)"],"x":"Montadeudas es la única tipología del informe 2023. Uso ilícito de activos virtuales y PEPs son de 2022, y Trata y lenocinio es de 2021.","ref":"Tipología UIF 2023 · Montadeudas"},{"id":"H074","tema":"2.1-tip.D","tipo":"caso","q":"Una empresa cliente de una FINTECH recibe muchos pagos pequeños de personas físicas y los mueve de inmediato vía SPEI. En redes sociales se anuncia como otorgante de créditos, aunque no tiene autorización, y hay quejas por cobranza con amenazas. ¿Qué tipología describe mejor el caso?","a":"Montadeudas","o":["Cuenta personal para actividad empresarial","Montadeudas","Fraudes informáticos","Uso ilícito de activos virtuales"],"x":"Ostentarse como entidad financiera sin autorización, cobranza ilegal con amenazas y SPEI rápidos a través de FINTECH son Montadeudas (UIF 2023). En Fraudes informáticos (2018) el dinero también sale rápido, pero proviene de pagos desviados con facturas falsas.","ref":"Tipología UIF 2023 · Montadeudas"},{"id":"H075","tema":"2.1-tip.D","tipo":"caso","q":"Integrantes de una misma familia reciben depósitos en efectivo en sucursales de zonas de riesgo por narcotráfico, triangulan los recursos entre sí y los usan para comprar criptomonedas en una plataforma que no está registrada ante el SAT; también envían y reciben transferencias desde y hacia el extranjero. Varios de ellos son jóvenes que operan montos elevados. ¿Qué tipología describe mejor el caso?","a":"Uso ilícito de activos virtuales","o":["Trata y lenocinio","Uso ilícito de activos virtuales","Trata de personas","Montadeudas"],"x":"Efectivo del narco convertido en criptomonedas en una plataforma no registrada, por un grupo familiar, es Uso ilícito de activos virtuales (UIF 2022). Trata de personas (2019) también usa criptomonedas y red familiar, pero su origen es la explotación sexual de mujeres extranjeras.","ref":"Tipología UIF 2022 · Uso ilícito de activos virtuales"},{"id":"H076","tema":"2.1-tip.D","tipo":"caso","q":"Un banco detecta que integrantes de una familia hacen depósitos en efectivo y, acto seguido, transfieren los fondos a una plataforma de criptomonedas para comprar activos virtuales. ¿Qué hallazgo adicional confirmaría una señal de alerta de la tipología que corresponde?","a":"Que la plataforma de activos virtuales no esté registrada ante el SAT","o":["Que el beneficiario de la factura no coincida con el titular","Que la plataforma de activos virtuales no esté registrada ante el SAT","Que las víctimas denuncien amenazas de cobranza ilegal","Que los retiros se concentren en cajeros de zonas turísticas"],"x":"En Uso ilícito de activos virtuales (UIF 2022) la señal clave es comprar en plataformas no registradas ante el SAT. La cobranza ilegal es de Montadeudas (2023), los cajeros turísticos de Skimming (2021) y el benef
