<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Módulo 2 · Área 2: reportes, restricciones de dólares en efectivo y sistemas automatizados en las 12 DCG (Bancos como eje), con simulador de reactivos.">
<title>2.1.3 Reportes · 2.1.4 Restricciones de dólares en efectivo · 2.1.5 Sistemas automatizados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}

os<\/b> días hábiles de enero, abril, julio y octubre: sólo <b>SOFOM<\/b> (28ª), <b>Centros cambiarios<\/b> (22ª) y <b>Transmisores<\/b> (23ª). Sus DCG se emiten, en todo o en parte, con fundamento en el <b>art. 95 Bis LGOAAC<\/b> (Centros 1ª; Transmisores 1ª; SOFOM 1ª, para las no reguladas). Todos los demás que presentan Relevantes, en los diez <b>primeros<\/b> (Asesores no presenta este reporte). Dos trampas: las DCG de SOFOM aplican igual a las <b>reguladas<\/b> (art. 87-D), así que una SOFOM regulada también va al último; y las <b>Casas de cambio<\/b> (DCG del art. 95) van al primero, como Bancos. No es «regulada o no regulada»: es qué DCG le aplica. El informe cuantitativo anual (últimos diez días hábiles de <b>abril<\/b>; sólo Bancos, Asesores, Uniones, Centros y Transmisores) es otra regla."},{"titulo":"Los dólares no siguen a las familias; los montos sí son iguales.","texto":"Sólo <b>cuatro<\/b> DCG tienen capítulo de restricción a dólares en efectivo: <b>Bancos, Casas de bolsa, SOCAP y Casas de cambio<\/b> (uno por familia, ninguno en Fintech). Los cuatro usan las <b>mismas cifras<\/b>: 4,000 USD al mes (PF con expediente completo), 14,000 USD al mes (PM en zonas), 300 USD diarios y 1,500 USD al mes (Usuarios PF). SOFOM, Asesores, Fondos, SOFIPO, Uniones, Centros cambiarios, Transmisores e ITF no tienen ese capítulo. Las cifras en dólares que <b>sí<\/b> cambian por sujeto están en reportes: relevantes 7,500 USD en general vs. 5,000 USD en Centros cambiarios, Transmisores e ITF. Capítulos de restricción: Bancos 33ª Bis–Quáter; CB 32ª–33ª; SOCAP 35ª–36ª; CC 24ª Bis–Ter."},{"titulo":"Los 30 días adicionales para dictaminar son sólo de Bancos.","texto":"Para dictaminar una Operación Inusual todos tienen <b>60 días naturales<\/b>; sólo Bancos puede sumar <b>30 días naturales adicionales<\/b>, y sólo si su Manual de Cumplimiento fija los criterios (Bancos 37ª, segundo párrafo). Después del dictamen, el reporte va en <b>3 días hábiles<\/b>: naturales para dictaminar, hábiles para enviar. Y ojo con el arranque: la inusual cuenta desde la <b>alerta<\/b>; la interna preocupante, desde la <b>detección<\/b> (Bancos 37ª y 42ª)."},{"titulo":"Reporte de 24 horas: se reporta la acepte o no.","texto":"Con sospecha fundada al pretenderse una operación, el reporte de inusual se presenta <b>la acepte o no<\/b>; lo que cambia es cómo lo dice cada DCG. <b>Bancos (41ª):<\/b> «podrá» no realizar la operación y reporta dentro de las 24 horas desde que conoce la información, con leyenda <b>«Reporte de 24 horas LD»<\/b> o <b>«… FT»<\/b>; si la acepta, también la reporta. <b>Las otras diez DCG<\/b> (p. ej., SOFOM 33ª): las 24 horas y la leyenda única <b>«Reporte de 24 horas»<\/b> se ligan expresamente a que la Entidad <b>decida aceptar<\/b>; si no la realiza, reporta la inusual «en los términos» de la disposición. <b>ITF (art. 73):<\/b> cuenta las 24 horas desde que conoce por la alerta o el informe de un empleado, en tres supuestos (pretende o intenta, acepta, LPB). No la confundas con los <b>otros dos reportes de 24 horas<\/b>: el de la LPB, que suspende de inmediato y lleva la leyenda «Lista de Personas Bloqueadas» (Bancos 72ª), y el de operaciones previas a la notificación de la LPB o intentos de listados (41ª, 2º párrafo)."}],"secciones":[{"tipo":"mapa","id":"mapa","nav":"Mapa 2.1.3–2.1.5","titulo":"Los tres temas en 20 subtemas","intro":"Tres ramas, una por tema del temario y en su orden, con ritmo <b>10 · 7 · 3 = 20<\/b>. Dentro de cada rama los subtemas siguen el orden de las DCG de Bancos (el eje). Toca un subtema para ver su contenido y su disposición en Bancos.","centro":{"t":"2.1.3 · 2.1.4 · 2.1.5","s":"20 subtemas<br>10 · 7 · 3"},"ramas":[{"letra":"2.1.3","titulo":"Reportes","pregunta":"¿Qué reporto, desde cuánto y cuándo?","ritmo":"¿Qué reporto?","corto":"2.1.3","color":"principal","items":[{"etiqueta":"11/12","nombre":"Operaciones Relevantes","verbo":"Cuento","desc":"Efectivo desde 7,500 USD (Centros, Transmisores e ITF: desde 5,000). Trimestral: diez primeros días hábiles; SOFOM, Centros y Transmisores, diez últimos.","panel":"2.1.3 Reportes · Operaciones Relevantes","puntos":["<b>Quién lo presenta:<\/b> Relevantes: <b>todos menos Asesores<\/b>.","<b>Definición (Bancos 2ª XXX):<\/b> billetes y monedas metálicas de curso legal, de México o de cualquier país, cheques de viajero y monedas acuñadas en platino, oro y plata, por monto <b>igual o superior<\/b> al equivalente en moneda nacional a <b>7,500 USD<\/b>.","<b>No es igual en todos:<\/b> Centros cambiarios (2ª XX), Transmisores (2ª XXVII) e ITF: desde <b>5,000 USD<\/b>; Asesores no reporta relevantes.","<b>Plazo (34ª):<\/b> trimestral, dentro de los <b>diez primeros días hábiles<\/b> de enero, abril, julio y octubre, por lo de los tres meses anteriores. <b>Ojo:<\/b> SOFOM, Centros cambiarios y Transmisores, en los <b>diez últimos<\/b>.","Si no hubo operaciones: reporte <b>en ceros<\/b> (sólo identificación, tipo y periodo).","Desde 2024, la Secretaría y la Comisión pueden fijar <b>plazos distintos<\/b> a las Entidades con mayor volumen que lo soliciten (34ª, 3er párrafo)."],"ir":"#t2-1-3","destacado":true},{"etiqueta":"12/12","nombre":"Operaciones Inusuales","verbo":"Dictamino","desc":"Lo que no cuadra con el perfil del cliente: el Comité tiene 60 días naturales desde la alerta para dictaminar y, ya dictaminada, hay 3 días hábiles para reportar.","panel":"2.1.3 Reportes · Operaciones Inusuales","puntos":["<b>Quién lo presenta:<\/b> Inusuales: <b>los 12<\/b>.","<b>Dictamen (37ª):<\/b> el Comité, en un periodo que <b>no excederá de 60 días naturales<\/b> contados a partir de que se genere la <b>alerta<\/b> (sistema, modelo, proceso o empleado, lo que ocurra primero).","<b>+30 días naturales<\/b> adicionales, sólo si el Manual de Cumplimiento fija los criterios para aplicarlos (37ª, 2º párrafo). <b>Sólo Bancos.<\/b>","<b>Envío:<\/b> dentro de los <b>3 días hábiles<\/b> siguientes a aquel en que concluya la sesión del Comité que la dictamine.","Operaciones relacionadas entre sí: <b>un solo reporte<\/b> (37ª, último párrafo).","<b>38ª:<\/b> circunstancias para determinar inusuales, «entre otras»; la fr. IV es el fraccionamiento: operaciones individuales ≥ 500 USD que en un mes calendario sumen ≥ 7,500 USD.","Si una relevante o una operación con AV además es inusual, se presentan <b>reportes separados<\/b> (39ª)."],"ir":"#t2-1-3","destacado":false},{"etiqueta":"12/12","nombre":"Reporte de 24 horas","verbo":"Alerto","desc":"En Bancos, con sospecha fundada puede no realizar la operación y reporta en 24 horas desde que conoce la información, con leyenda LD o FT; si la acepta, también.","panel":"2.1.3 Reportes · Reporte de 24 horas","puntos":["<b>Quién lo presenta:<\/b> 24 horas: <b>los 12<\/b>.","Con sospechas fundadas o indicios de que los recursos provienen de ilícitos o se destinan a FT (arts. 139 Quáter y 400 Bis CPF), la Entidad <b>podrá<\/b> no llevar a cabo la operación.","Reporte de OI <b>dentro de las 24 horas contadas a partir de que conozca la información<\/b>, con leyenda «Reporte de 24 horas LD» o «Reporte de 24 horas FT». Si decide aceptar la operación, también la reporta.","Mismo plazo: operaciones celebradas antes de que se notificara la <b>LPB<\/b>, intentos de personas listadas o de terceros a su favor (41ª, 2º párrafo). La LPB se estudia en 2.1.8.","El personal avisa de inmediato al <b>Oficial de Cumplimiento<\/b>, que envía el reporte."],"ir":"#t2-1-3","destacado":false},{"etiqueta":"12/12","nombre":"Operaciones Internas Preocupantes","verbo":"Vigilo","desc":"Conductas de directivos, funcionarios, empleados o apoderados de la propia Entidad: 60 días naturales desde la detección para dictaminar y 3 días hábiles para reportar.","panel":"2.1.3 Reportes · Operaciones Internas Preocupantes","puntos":["<b>Quién lo presenta:<\/b> Internas preocupantes: <b>los 12<\/b>.","Dictamen del Comité en <b>no más de 60 días naturales<\/b> contados a partir de que la Entidad <b>detecte<\/b> la operación (sistema, modelo, proceso o cualquier empleado, lo que ocurra primero).","Envío: <b>3 días hábiles<\/b> siguientes a que concluya la sesión del Comité que la dictamine.","Cuatro circunstancias, entre otras: nivel de vida notoriamente superior; intervención reiterada sin causa en operaciones reportadas como inusuales; sospecha de 139 Quáter o 400 Bis; falta de correspondencia entre funciones y actividades.","Inusual cuenta desde la <b>alerta<\/b>; interna preocupante, desde la <b>detección<\/b>."],"ir":"#t2-1-3","destacado":false},{"etiqueta":"7/12 · 1/12","nombre":"Operaciones en efectivo con dólares","verbo":"Reporto","desc":"Trimestral, por operación: en Bancos, Clientes desde 500 USD y Usuarios más de 250; en Centros, compras de más de 1,000 USD. No lo tienen SOFOM, Asesores, Fondos ni Transmisores.","panel":"2.1.3 Reportes · Operaciones en efectivo con dólares","puntos":["<b>Quién lo presenta:<\/b> USD en efectivo: <b>Bancos, C. bolsa, SOCAP, SOFIPO, Uniones, C. cambio, Centros<\/b> · Efectivo en moneda extranjera: <b>ITF<\/b>.","Por cada operación de compra, recepción de depósitos, pago de créditos o servicios, transferencias o situación de fondos en efectivo con USD.","<b>Clientes:<\/b> igual o superior a <b>500 USD<\/b>. <b>Usuarios:<\/b> superior a <b>250 USD<\/b>.","Trimestral: <b>diez primeros días hábiles<\/b> de enero, abril, julio y octubre; reporte en ceros si no hubo.","Operación ≥ <b>7,500 USD<\/b> reportada aquí: no se presenta además el de relevantes (34ª Bis, último párrafo)."],"ir":"#t2-1-3","destacado":false},{"etiqueta":"7/12 · 1/12","nombre":"Transferencias internacionales de fondos","verbo":"Transfiero","desc":"Cada transferencia internacional enviada o recibida desde 1,000 USD se reporta mes a mes, dentro de los 15 días hábiles siguientes al último día hábil del mes anterior.","panel":"2.1.3 Reportes · Transferencias internacionales de fondos","puntos":["<b>Quién lo presenta:<\/b> Transferencias internacionales: <b>Bancos, C. bolsa, SOCAP, SOFIPO, C. cambio, Transm., ITF<\/b> · Transmisión de dinero (IFPE): <b>ITF<\/b>.","Reporte <b>mensual<\/b>, a más tardar dentro de los <b>15 días hábiles<\/b> siguientes al último día hábil del mes inmediato anterior.","Por cada transferencia internacional, enviada o recibida, igual o superior a <b>1,000 USD<\/b> o su equivalente.","Desde 2024 señala los <b>países o jurisdicciones<\/b> involucrados (35ª, 2º párrafo).","Remesas pagadas como pagador directo ≥ 1,000 USD: datos del Destinatario (36ª)."],"ir":"#t2-1-3","destacado":false},{"etiqueta":"1/12 · 2/12","nombre":"Cheques de caja y activos virtuales","verbo":"Expido","desc":"Dos reportes trimestrales de Bancos: cheques de caja desde 10,000 USD (sólo Bancos) y, si Banxico lo autoriza, activos virtuales (ITF también, en UDIS).","panel":"2.1.3 Reportes · Cheques de caja y activos virtuales","puntos":["<b>Quién lo presenta:<\/b> Cheques de caja: <b>Bancos<\/b> · Activos virtuales: <b>Bancos, ITF<\/b>.","<b>Cheques de caja (34ª Ter):<\/b> cada expedición o pago ≥ equivalente a <b>10,000 USD<\/b>; trimestral, primeros diez días hábiles; esas operaciones no van en 34ª ni 34ª Bis.","<b>Activos virtuales (34ª Quáter):<\/b> sólo si <b>Banco de México<\/b> autoriza; toda <b>compra<\/b> sin importar el monto y cada <b>venta<\/b> con recepción de moneda nacional ≥ <b>2,250 USD<\/b>.","ITF también reporta AV (art. 74), con umbral en <b>UDIS<\/b>; no tiene cheques de caja."],"ir":"#t2-1-3","destacado":false},{"etiqueta":"12/12","nombre":"Reporte por suspensión de la identificación","verbo":"Suspendo","desc":"Si continuar con la identificación alertaría al cliente o hay sospecha, la Entidad puede suspenderla y presenta un reporte de inusual de 24 horas, que puede hacerse a mano.","panel":"2.1.3 Reportes · Reporte por suspensión de la identificación","puntos":["<b>Quién lo presenta:<\/b> Suspensión de identificación: <b>los 12<\/b>.","Puede <b>suspender<\/b> el proceso de identificación ante sospecha (139 Quáter / 400 Bis), riesgo de alertar al cliente o los Riesgos de su Manual.","Genera un reporte de <b>OI de 24 horas<\/b>, contadas desde que conozca la información.","Excepción del sistema: este reporte <b>puede elaborarse de forma manual<\/b> (51ª fr. II, 2º párrafo).","Lo tienen las 12 DCG con la misma regla, salvo ITF (art. 28): puede no continuar la identificación y remite al reporte de inusual, sin decir 24 horas."],"ir":"#t2-1-3","destacado":false},{"etiqueta":"5/12","nombre":"Informe cuantitativo y otros informes","verbo":"Informo","desc":"Cada año, en los últimos diez días hábiles de abril, datos cuantitativos de operaciones, canales, clientes y zonas a la Comisión, desde la fecha que ésta fije.","panel":"2.1.3 Reportes · Informe cuantitativo y otros informes","puntos":["<b>Quién lo presenta:<\/b> Informe cuantitativo: <b>Bancos, Asesores, Uniones, Centros, Transm.<\/b>.","<b>Quién más informa:<\/b> personas que ejercen el control: <b>SOFOM, SOCAP, SOFIPO, C. cambio, Centros, Transm.<\/b> · transmisión de más del 2 % de acciones: <b>SOFOM, C. cambio, Centros, Transm.<\/b> · montos totales de divisas: <b>Centros<\/b> · Agentes Relacionados: <b>Transm.<\/b>","<b>60ª Bis (2024):<\/b> a la <b>Comisión<\/b> (no a la Secretaría), en los <b>últimos diez días hábiles de abril<\/b>, información de enero a diciembre del año anterior.","Entra en vigor en la fecha que señale la resolución que emita la Comisión (transitoria Cuarta, 2024).","También lo prevén Asesores, Uniones, Centros cambiarios y Transmisores (reformas 2023).","<b>33ª Bis 2:<\/b> lista mensual de PM con régimen ilimitado de USD, en los diez primeros días hábiles de cada mes. Sólo Bancos."],"ir":"#t2-1-3","destacado":false},{"etiqueta":"34ª–42ª","nombre":"Medio, formato y destinatario","verbo":"Envío","desc":"Los reportes van a la Secretaría por conducto de la Comisión, por medios electrónicos y en formato oficial; el informe cuantitativo va directo a la Comisión.","panel":"2.1.3 Reportes · Medio, formato y destinatario","puntos":["Reportes de operaciones: a la <b>Secretaría (SHCP), por conducto de la Comisión (CNBV)<\/b>.","Medios electrónicos y formato oficial que expida la Secretaría.","El informe cuantitativo (60ª Bis) va <b>a la Comisión<\/b>.","SOFOM: relevantes «por conducto del Supervisor», que se entiende hecho a la Comisión (transitoria Segunda, reforma 2011)."],"ir":"#t2-1-3","destacado":false}]},{"letra":"2.1.4","titulo":"Restricciones de dólares en efectivo","pregunta":"¿Cuántos dólares en efectivo recibo?","ritmo":"¿Cuánto recibo?","corto":"2.1.4","color":"oscuro","items":[{"etiqueta":"4/12","nombre":"¿Quién restringe?","verbo":"Restrinjo","desc":"Sólo cuatro DCG limitan la recepción de dólares en efectivo: Bancos, Casas de bolsa, SOCAP y Casas de cambio. Una por familia, ninguna en Fintech, y con las mismas cifras.","panel":"2.1.4 Dólares en efectivo · ¿Quién restringe?","puntos":["<b>Quién:<\/b> Bancos, C. bolsa, SOCAP, C. cambio.","Con capítulo de restricción: <b>Bancos<\/b> (Cap. III Bis, 33ª Bis a Quáter), <b>Casas de bolsa<\/b> (32ª–33ª), <b>SOCAP<\/b> (35ª–36ª, sólo compra) y <b>Casas de cambio<\/b> (24ª Bis–Ter).","Sin restricción: SOFOM, Asesores, Fondos, SOFIPO, Uniones, Centros cambiarios, Transmisores e ITF.","SOFIPO, Uniones, Centros cambiarios e ITF <b>reportan<\/b> efectivo en moneda extranjera, pero <b>no tienen límite<\/b> de recepción."],"ir":"#t2-1-4","destacado":true},{"etiqueta":"3/12 + CC","nombre":"Clientes personas físicas","verbo":"Limito","desc":"Un cliente persona física con expediente completo puede entregar hasta 4,000 USD en efectivo acumulados en el mes; sin expediente completo aplican los límites de Usuarios.","panel":"2.1.4 Dólares en efectivo · Clientes personas físicas","puntos":["<b>Quién:<\/b> Clientes en Bancos, C. bolsa y SOCAP; en C. cambio, el <b>Usuario<\/b> PF de la 24ª Ter.","Abstenerse de recibir <b>más de 4,000 USD<\/b> acumulados por Cliente en un <b>mes calendario<\/b>. Operaciones: Bancos, compra, depósitos, pago de créditos o servicios y transferencias; C. bolsa, intermediación bursátil, compra, pago de servicios y transferencias; SOCAP, sólo compra.","Sólo con expediente completo (4ª); si no, se aplican los límites de Usuarios (Bancos 33ª Ter; CB 33ª; SOCAP 36ª). En C. cambio, con los requisitos de la 4ª fr. III.","Sólo Bancos (2024): puede comprar USD a titulares de cuentas 14ª Bis 3 con expediente completo y verificación de la 7ª fr. I, abonando en la cuenta con sus límites."],"ir":"#t2-1-4","destacado":false},{"etiqueta":"4/12","nombre":"Clientes personas morales y fideicomisos","verbo":"Exceptúo","desc":"A personas morales y fideicomisos se les prohíbe, salvo cuatro casos: zonas (hasta 14,000 USD al mes), diplomáticos y gobierno, entidades financieras y fideicomisos públicos.","panel":"2.1.4 Dólares en efectivo · Clientes personas morales y fideicomisos","puntos":["<b>Quién:<\/b> Clientes PM en Bancos, C. bolsa y SOCAP (compra); Usuarios PM en C. cambio (24ª Ter).","<b>I. Zonas:<\/b> alto flujo de extranjeros, franja de <b>20 km<\/b> de la frontera norte, <b>Baja California y Baja California Sur<\/b>; <b>sólo Bancos<\/b> agrega municipios con <b>remesas per cápita elevadas<\/b>. Hasta <b>14,000 USD<\/b> al mes, sólo en sucursales de esas zonas.","<b>II.<\/b> Representaciones diplomáticas y consulares, organismos internacionales, instancias de bienes asegurados, decomisados o abandonados; recaudadores de contribuciones al comercio exterior, <b>sólo Bancos y C. cambio<\/b>.","<b>III.<\/b> Entidades por cuenta propia, lista propia de cada uno: Bancos (otras Entidades, CB, CC); CB (otras CB, IC, CC); SOCAP (otras SOCAP, IC, CC); CC (IC, CB, otras CC).","<b>IV.<\/b> Fideicomisos públicos. En C. cambio, II a IV por cualquier monto.","La lista de municipios la da a conocer la Secretaría."],"ir":"#t2-1-4","destacado":false},{"etiqueta":"4/12","nombre":"Usuarios personas físicas","verbo":"Acoto","desc":"Usuario persona física: máximo 300 USD diarios y 1,500 al mes. El extranjero no tiene tope diario; quien paga comercio exterior, ninguno (sólo Bancos y C. cambio).","panel":"2.1.4 Dólares en efectivo · Usuarios personas físicas","puntos":["<b>Quién:<\/b> Bancos, C. bolsa, SOCAP (sólo compra) y C. cambio.","Abstenerse de recibir <b>más de 300 USD diarios<\/b> por Usuario.","<b>Extranjeros:<\/b> exceptuados del límite <b>diario<\/b> (copia de pasaporte —Bancos, CB y CC: o tarjeta pasaporte— y documento del INM, si lo tiene).","En todo caso, no más de <b>1,500 USD acumulados en el mes calendario<\/b>.","<b>Sólo Bancos y C. cambio:<\/b> ningún límite aplica a quien paga <b>contribuciones al comercio exterior<\/b> por importación de mercancías (no equipaje ni franquicia)."],"ir":"#t2-1-4","destacado":false},{"etiqueta":"4/12","nombre":"Usuarios personas morales y fideicomisos","verbo":"Prohíbo","desc":"En Bancos, a un usuario persona moral o a nombre de un fideicomiso no se le recibe un solo dólar en efectivo: la prohibición es total, sin monto permitido.","panel":"2.1.4 Dólares en efectivo · Usuarios personas morales y fideicomisos","puntos":["<b>Quién:<\/b> Bancos, C. bolsa, SOCAP, C. cambio.","Abstenerse de recibir USD en efectivo de <b>Usuarios personas morales<\/b> o a nombre de <b>Fideicomisos<\/b>.","Igual en Casas de bolsa; en SOCAP, sólo respecto de operaciones de compra. Casas de cambio: prohibido <b>salvo<\/b> los supuestos de su 24ª Ter."],"ir":"#t2-1-4","destacado":false},{"etiqueta":"1/12","nombre":"Régimen ilimitado y comisionistas","verbo":"Amplío","desc":"Dos regímenes que sólo existen en Bancos: personas morales sin límite si cumplen seis medidas, y compra de dólares a través de comisionistas con topes propios.","panel":"2.1.4 Dólares en efectivo · Régimen ilimitado y comisionistas","puntos":["<b>Quién:<\/b> Bancos.","<b>Ilimitado (33ª Bis 1):<\/b> PM constituida hace al menos <b>3 años<\/b>; justificación; estados financieros de los <b>2 últimos ejercicios<\/b>; <b>2 últimas declaraciones<\/b> anuales; datos de los socios PF; valoración documentada conservada <b>al menos 10 años<\/b>. Actualizar cada <b>12 meses<\/b>. Emisoras listadas: sin fr. III a V.","<b>Comisionistas (33ª Quáter):<\/b> I) sólo PF, <b>hasta 250 USD por operación<\/b>; II) tiendas libres de impuestos en puertos: extranjeros 1,500 USD al mes; mexicanos 300 diarios y 1,500 al mes; III) hoteles, sólo huéspedes, con los mismos topes.","Los límites de comisionistas no se acumulan con 33ª Bis y Ter; sólo en las zonas de la 33ª Bis I, salvo la fr. II."],"ir":"#t2-1-4","destacado":false},{"etiqueta":"4/12","nombre":"Documentación al recibir USD","verbo":"Documento","desc":"Al recibir dólares de un usuario persona física, con independencia del monto, se recaban sus datos y copia de su identificación: nacional o extranjero cambia el documento.","panel":"2.1.4 Dólares en efectivo · Documentación al recibir USD","puntos":["<b>Quién:<\/b> Bancos, C. bolsa, SOCAP y C. cambio.","Con independencia del monto: los datos de identificación del Usuario (Bancos 17ª fr. I / 51ª; CB 15ª fr. I / 52ª; SOCAP 18ª fr. I / 55ª; CC 4ª fr. I inc. A / 42ª).","<b>Nacionales:<\/b> copia de pasaporte, credencial para votar o matrícula consular.","<b>Extranjeros:<\/b> copia de pasaporte (Bancos, CB y CC: o tarjeta pasaporte) y documento del INM, cuando lo tenga."],"ir":"#t2-1-4","destacado":false}]},{"letra":"2.1.5","titulo":"Sistemas automatizados","pregunta":"¿Qué hace mi sistema?","ritmo":"¿Con qué?","corto":"2.1.5","color":"negro","items":[{"etiqueta":"51ª","nombre":"Funciones mínimas del sistema","verbo":"Automatizo","desc":"Como parte de su infraestructura tecnológica, el sistema conserva expedientes, genera y transmite reportes, monitorea, alerta y guarda históricos, entre otras funciones.","panel":"2.1.5 Sistemas automatizados · Funciones mínimas del sistema","puntos":["«Entre otras»: I expediente · II generar y transmitir reportes (el de la 10ª Ter puede ser manual) · III clasificar y monitorear lo transaccional · IV operaciones de una misma cuenta o cliente · V alertas de la 25ª Quáter · V Bis análisis de OI y OIP.","VI base consolidada · VII históricos de OI y OIP · VIII canal interno seguro · IX integridad, disponibilidad, auditabilidad y confidencialidad · IX Bis información para la metodología EBR.","X alertas de <b>LPB, PEP<\/b> y países de la 38ª X · XI verificación de datos no presenciales.","<b>XII trazabilidad y origen de AV<\/b> (ITF pide además el destino) · <b>XIII modelo de riesgo con históricos de al menos 10 años<\/b> (2024): sólo Bancos."],"ir":"#t2-1-5","destacado":true},{"etiqueta":"51ª, último párrafo","nombre":"Evaluación de efectividad","verbo":"Evalúo","desc":"Desde 2024, Bancos evalúa al menos cada dos años, con independencia del área que lo desarrolló, si alertas, parámetros y filtros funcionan; el Comité conoce el resultado.","panel":"2.1.5 Sistemas automatizados · Evaluación de efectividad","puntos":["Al menos <b>cada dos años<\/b>.","De manera <b>independiente<\/b> al área que desarrolló el sistema.","Alcance: sistema de alertas, parámetros y criterios de monitoreo transaccional y filtrado de listas.","El <b>Comité<\/b> conoce el resultado. Ninguna otra DCG lo prevé."],"ir":"#t2-1-5","destacado":false},{"etiqueta":"Transitorios","nombre":"Plazo de adecuación","verbo":"Adecúo","desc":"Cada reforma da un plazo para ajustar los sistemas: 18 meses en las reformas de 2019 a 2024; ITF, 180 días naturales desde su autorización (Octava transitoria).","panel":"2.1.5 Sistemas automatizados · Plazo de adecuación","puntos":["Bancos: <b>18 meses<\/b> (transitoria Tercera fr. III, DOF 28-ago-2024).","SOFOM, Casas de bolsa, Fondos, SOCAP y SOFIPO (2021), Asesores, Uniones y Transmisores (2023), Centros cambiarios (2019): <b>18 meses<\/b>.","ITF: <b>180 días naturales<\/b> desde que obtengan la autorización de la CNBV, para las personas de la Octava transitoria de la LRITF (transitorio Segundo fr. I).","Casas de cambio: su md no trae los transitorios de 2019; sin reactivo."],"ir":"#t2-1-5","destacado":false}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por subtema","html":"<b>2.1.3:<\/b> Cuento, Dictamino, Alerto, Vigilo, Reporto, Transfiero, Expido, Suspendo, Informo y Envío · <b>2.1.4:<\/b> Restrinjo, Limito, Exceptúo, Acoto, Prohíbo, Amplío y Documento · <b>2.1.5:<\/b> Automatizo, Evalúo y Adecúo."}},{"tipo":"reglaexc","id":"t2-1-3","nav":"2.1.3 Reportes","titulo":"2.1.3 · Reportes: la regla y quién se sale","intro":"Cada tarjeta es un reporte. En cada renglón, una variable: la <b>regla general<\/b> y, a la derecha, <b>quién se sale<\/b> y con qué valor. «Regla general» es lo que comparte la mayoría de los sujetos que lo presentan; cuando no hay mayoría, se toma la de Bancos y se dice. Con <b>Modo recitar<\/b> se tapan regla y excepciones: dilas en voz alta y toca el renglón para comprobar. Abajo está la tabla resumen.","sujetos":[{"k":"BAN","t":"Bancos","corto":"Bancos","color":"principal"},{"k":"SOFOM","t":"SOFOM","corto":"SOFOM","color":"principal"},{"k":"CB","t":"Casas de bolsa","corto":"C. bolsa","color":"morado"},{"k":"ASE","t":"Asesores en inversiones","corto":"Asesores","color":"morado"},{"k":"FON","t":"Fondos de inversión","corto":"Fondos","color":"morado"},{"k":"SOCAP","t":"SOCAP","corto":"SOCAP","color":"turquesa"},{"k":"SOFIPO","t":"SOFIPO","corto":"SOFIPO","color":"turquesa"},{"k":"UC","t":"Uniones de crédito","corto":"Uniones","color":"turquesa"},{"k":"CC","t":"Casas de cambio","corto":"C. cambio","color":"coral"},{"k":"CCA","t":"Centros cambiarios","corto":"Centros","color":"coral"},{"k":"TD","t":"Transmisores de dinero","corto":"Transm.","color":"coral"},{"k":"ITF","t":"ITF","corto":"ITF","color":"amarillo"}],"grupos":[{"k":"im","t":"Instrumento monetario","pregunta":"¿Con qué dinero se operó?","color":"principal"},{"k":"ss","t":"Situaciones sospechosas","pregunta":"¿Qué conducta encendió la alerta?","color":"oscuro"},{"k":"ce","t":"Canal de envío","pregunta":"¿Por dónde se fue el dinero?","color":"negro"},{"k":"oo","t":"Otras obligacion
