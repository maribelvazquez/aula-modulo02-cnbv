peración Relevante: en Bancos basta un monto igual o superior al equivalente a 5,000 USD","No es Operación Relevante: el umbral en Bancos es igual o superior al equivalente a 7,500 USD","Es Operación Relevante: toda operación en efectivo superior a 1,000 USD se reporta trimestralmente","No es Operación Relevante: los billetes de moneda nacional quedan fuera de la definición de Bancos"],"x":"En Bancos, la Operación Relevante es la que se realiza con billetes y monedas de curso legal (de México o de cualquier país), cheques de viajero o monedas acuñadas en metales, por un monto igual o superior al equivalente a 7,500 USD; 6,000 USD queda debajo. El distractor de 5,000 USD es el umbral de Centros cambiarios, Transmisores e ITF, no el de Bancos. Y los pesos sí entran: la definición incluye la moneda de curso legal en México.","ref":"Bancos 2ª fr. XXX y 34ª","par":"B002"},{"id":"B002","tema":"2.1.3","tipo":"caso","q":"Un transmisor de dinero recibe de un usuario billetes de pesos mexicanos por el equivalente a 6,000 USD para un envío. ¿Cómo debe tratarlo para efectos del reporte de Operaciones Relevantes?","a":"Es Operación Relevante: en Transmisores el umbral es igual o superior al equivalente a 5,000 USD","o":["Es Operación Relevante: en Transmisores el umbral es igual o superior al equivalente a 5,000 USD","No es Operación Relevante: el umbral es el mismo que en Bancos, igual o superior a 7,500 USD","No es Operación Relevante: los transmisores de dinero no tienen obligación de reportar relevantes","Es Operación Relevante sólo si el envío se paga en el extranjero en dólares de los EUA"],"x":"Transmisores define la Operación Relevante desde el equivalente a 5,000 USD (no 7,500 como Bancos), por lo que 6,000 USD sí se reporta, en los diez últimos días hábiles de enero, abril, julio y octubre. El error tentador es aplicar la cifra del eje: igual que Bancos, salvo Centros cambiarios, Transmisores e ITF, que usan 5,000 USD. La moneda del pago en destino no cambia la definición.","ref":"Transmisores de dinero 2ª fr. XXVII y 23ª","par":"B001"},{"id":"B003","tema":"2.1.3","tipo":"caso","q":"Una SOCAP recibe de un socio cheques de viajero por el equivalente a 8,000 USD. ¿Cómo debe tratarla para efectos del reporte de Operaciones Relevantes?","a":"No es Operación Relevante: en SOCAP la definición sólo comprende billetes y monedas metálicas","o":["Es Operación Relevante: los cheques de viajero cuentan igual que en Bancos desde 7,500 USD","Es Operación Relevante: en SOCAP el umbral es igual o superior al equivalente a 5,000 USD","No es Operación Relevante: en SOCAP la definición sólo comprende billetes y monedas metálicas","No es Operación Relevante: las SOCAP no reportan relevantes, sólo inusuales, internas preocupantes y de 24 horas"],"x":"La definición de Operación Relevante de SOCAP abarca únicamente billetes y monedas metálicas de curso legal, por un monto igual o superior a 7,500 USD; no menciona cheques de viajero ni monedas acuñadas en platino, oro y plata. Por eso el distractor más tentador, «igual que Bancos», falla: igual que Bancos, salvo SOCAP, SOFIPO e ITF, que sólo cuentan billetes y monedas.","ref":"SOCAP 2ª fr. XXIX y 37ª","par":"B004"},{"id":"B004","tema":"2.1.3","tipo":"caso","q":"Una casa de bolsa recibe de un cliente cheques de viajero por el equivalente a 8,000 USD. ¿Cómo debe tratarla para efectos del reporte de Operaciones Relevantes?","a":"Es Operación Relevante: su definición incluye cheques de viajero desde el equivalente a 7,500 USD","o":["No es Operación Relevante: en Casas de bolsa la definición sólo comprende billetes y monedas","No es Operación Relevante: las Casas de bolsa sólo reportan las operaciones en efectivo con dólares de los EUA","Es Operación Relevante: su definición incluye cheques de viajero desde el equivalente a 7,500 USD","Es Operación Relevante sólo si el cliente es persona moral y la operación es de intermediación"],"x":"Casas de bolsa sigue a Bancos: la Operación Relevante incluye billetes y monedas, cheques de viajero y monedas acuñadas en platino, oro y plata, desde el equivalente a 7,500 USD. La exclusión de los cheques de viajero es propia de SOCAP, SOFIPO e ITF, no de Casas de bolsa. El tipo de cliente no cambia la definición.","ref":"Casas de bolsa 2ª fr. XXIX y 34ª","par":"B003"},{"id":"B005","tema":"2.1.3","tipo":"caso","q":"Un banco debe reportar las Operaciones Relevantes realizadas entre julio y septiembre. ¿En qué plazo las remite?","a":"Dentro de los diez primeros días hábiles de octubre","o":["Dentro de los diez últimos días hábiles de octubre","Dentro de los diez primeros días hábiles de octubre","Dentro de los quince días hábiles siguientes al cierre de septiembre","Dentro de los diez primeros días naturales de octubre"],"x":"En Bancos el reporte es trimestral, dentro de los diez primeros días hábiles de enero, abril, julio y octubre, por las operaciones de los tres meses anteriores. Los «diez últimos» días hábiles son de SOFOM, Centros cambiarios y Transmisores; los quince días hábiles son del reporte mensual de transferencias internacionales.","ref":"Bancos 34ª, primer párrafo","par":"B006"},{"id":"B006","tema":"2.1.3","tipo":"caso","q":"Una SOFOM debe reportar las Operaciones Relevantes realizadas entre julio y septiembre. ¿En qué plazo las remite?","a":"Dentro de los diez últimos días hábiles de octubre","o":["Dentro de los diez primeros días hábiles de octubre","Dentro de los diez últimos días hábiles de octubre","Dentro de los quince días hábiles siguientes al cierre de septiembre","Dentro de los diez últimos días naturales de octubre"],"x":"La SOFOM reporta relevantes en los diez últimos días hábiles de enero, abril, julio y octubre, a diferencia de Bancos, que usa los diez primeros. Es la trampa de «primeros vs. últimos»: igual que Bancos, salvo SOFOM, Centros cambiarios y Transmisores. Su 28ª dice «por conducto del Supervisor», referencia que se entiende hecha a la Comisión.","ref":"SOFOM 28ª, primer párrafo","par":"B005"},{"id":"B007","tema":"2.1.3","tipo":"trampa","q":"Un compañero afirma que una casa de cambio y un centro cambiario reportan las Operaciones Relevantes igual porque ambos operan divisas. ¿Qué es lo correcto?","a":"Casas de cambio: desde 7,500 USD, diez primeros días hábiles; Centros cambiarios: desde 5,000 USD, diez últimos días hábiles","o":["Casas de cambio: desde 7,500 USD, diez primeros días hábiles; Centros cambiarios: desde 5,000 USD, diez últimos días hábiles","Ambos: desde 5,000 USD y dentro de los diez últimos días hábiles de enero, abril, julio y octubre","Ambos: desde 7,500 USD y dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Casas de cambio: desde 5,000 USD, diez últimos días hábiles; Centros cambiarios: desde 7,500 USD, diez primeros días hábiles"],"x":"Las diferencias no siguen a la familia «cambios y envíos»: Casas de cambio reporta como Bancos (7,500 USD, diez primeros días hábiles), mientras que Centros cambiarios usa 5,000 USD y los diez últimos días hábiles. El distractor invertido es el más peligroso: memoriza «Centros = 5,000 y últimos».","ref":"Casas de cambio 25ª; Centros cambiarios 2ª fr. XX y 22ª"},{"id":"B008","tema":"2.1.3","tipo":"trampa","q":"¿Cuál de estos sujetos obligados NO tiene en sus Disposiciones el reporte de Operaciones Relevantes?","a":"Asesores en inversiones","o":["Asesores en inversiones","Fondos de inversión","Uniones de crédito","Sociedades financieras de objeto múltiple"],"x":"Las DCG de Asesores en inversiones no definen ni reportan Operaciones Relevantes. Fondos y Uniones sí las reportan (con umbral de 7,500 USD y sólo de sus Clientes), y SOFOM también, aunque en los diez últimos días hábiles. La trampa es creer que «todos reportan relevantes».","ref":"Asesores en inversiones (sin disposición); Fondos 30ª; Uniones 26ª; SOFOM 28ª"},{"id":"B009","tema":"2.1.3","tipo":"caso","q":"El sistema de un banco generó una alerta el 2 de mayo; el analista la escaló al Comité el 20 de mayo. ¿Desde cuándo corre el plazo del Comité para dictaminar si es inusual?","a":"Desde el 2 de mayo, fecha en que se generó la alerta: hasta 60 días naturales","o":["Desde el 20 de mayo, fecha en que se escaló al Comité: hasta 60 días naturales","Desde el 2 de mayo, fecha en que se generó la alerta: hasta 60 días hábiles","Desde la sesión en que el Comité conozca el caso: hasta 30 días naturales","Desde el 2 de mayo, fecha en que se generó la alerta: hasta 60 días naturales"],"x":"La 37ª da al Comité un periodo que no excederá de 60 días naturales contados a partir de que se genere la alerta por sistema, modelo, proceso o empleado, lo que ocurra primero. El escalamiento interno no reinicia el plazo, y los días son naturales: lo hábil es el envío posterior (3 días hábiles tras la sesión).","ref":"Bancos 37ª, primer párrafo","par":"B013"},{"id":"B010","tema":"2.1.3","tipo":"caso","q":"El Manual de Cumplimiento de un banco fija expresamente los criterios para ampliar el plazo de dictamen. Ante un caso complejo, ¿de cuánto tiempo puede disponer el Comité para dictaminar la operación como inusual?","a":"Hasta 60 días naturales desde la alerta, más 30 días naturales adicionales","o":["Hasta 60 días naturales desde la alerta, sin posibilidad de ampliación alguna","Hasta 60 días hábiles desde la alerta, más 30 días hábiles adicionales","Hasta 60 días naturales desde la alerta, más 30 días naturales adicionales","Hasta 60 días naturales desde la alerta, más 60 días naturales adicionales"],"x":"La 37ª, segundo párrafo, concede 30 días naturales adicionales a los 60, siempre que el Manual de Cumplimiento establezca expresamente los criterios para aplicarlos. Es una facultad exclusiva de Bancos; ninguna otra DCG la prevé. Los días son naturales, no hábiles.","ref":"Bancos 37ª, segundo párrafo","par":"B011"},{"id":"B011","tema":"2.1.3","tipo":"trampa","q":"El Manual de Cumplimiento de una SOFIPO fija criterios para ampliar el plazo de dictamen de casos complejos. ¿De cuánto tiempo dispone su Comité para dictaminar una operación como inusual?","a":"Hasta 60 días naturales desde la alerta, sin los 30 días adicionales que prevé Bancos","o":["Hasta 60 días naturales desde la alerta, más 30 días naturales si su Manual lo prevé","Hasta 90 días naturales desde la alerta, porque su Manual ya fija los criterios de ampliación","Hasta 60 días hábiles desde la alerta, más 30 días hábiles si su Manual lo prevé","Hasta 60 días naturales desde la alerta, sin los 30 días adicionales que prevé Bancos"],"x":"Los 30 días naturales adicionales sólo existen en Bancos (37ª, segundo párrafo); la SOFIPO tiene 60 días naturales y su Manual no puede crear una ampliación que su DCG no prevé. La trampa es suponer que «todos tienen 30 días adicionales».","ref":"SOFIPO 40ª; Bancos 37ª, segundo párrafo","par":"B010"},{"id":"B012","tema":"2.1.3","tipo":"trampa","q":"El Comité de un banco concluye el martes la sesión en la que dictamina una Operación Inusual. ¿Cuál es el plazo para enviar el reporte?","a":"Dentro de los tres días hábiles siguientes a aquel en que concluyó la sesión del Comité","o":["Dentro de los tres días hábiles siguientes a aquel en que concluyó la sesión del Comité","Dentro de los tres días naturales siguientes a aquel en que concluyó la sesión del Comité","Dentro de las 24 horas siguientes a que concluyó la sesión del Comité que la dictaminó","Dentro de los tres días hábiles siguientes a la fecha en que se generó la alerta respectiva"],"x":"La 37ª: el reporte se remite dentro de los tres días hábiles siguientes a aquel en que concluya la sesión del Comité que la dictamine. Regla de cómputo: naturales para dictaminar (60), hábiles para enviar (3). Las 24 horas corresponden a otro supuesto (sospecha al pretenderse una operación, 41ª).","ref":"Bancos 37ª, primer párrafo"},{"id":"B013","tema":"2.1.3","tipo":"memoria","q":"En las Disposiciones de ITF, ¿a partir de cuándo se cuentan los 60 días naturales para dictaminar una Operación Inusual?","a":"A partir de que la ITF detecte la operación por su sistema, modelo, proceso o empleado","o":["A partir de que se genere la alerta por su sistema, modelo, proceso o empleado, igual que Bancos","A partir de que la ITF detecte la operación por su sistema, modelo, proceso o empleado","A partir de la fecha en que el Cliente celebró la operación que se considera inusual","A partir de que concluya la sesión del Comité en la que se presenta el caso por primera vez"],"x":"El art. 69 de ITF cuenta los 60 días naturales «a partir de que dicha ITF detecte esa Operación». Bancos, en cambio, los cuenta desde que se genere la alerta (37ª). Es la diferencia que más se confunde con la interna preocupante, que en Bancos también corre desde la detección.","ref":"ITF art. 69, primer párrafo","par":"B009"},{"id":"B014","tema":"2.1.3","tipo":"caso","q":"Un asesor en inversiones persona moral detecta una Operación Inusual. ¿Quién la dictamina y cuándo debe enviarse el reporte?","a":"El Representante; el reporte va dentro de los tres días hábiles siguientes a que la dictamine","o":["El Comité de Comunicación y Control; el reporte va dentro de los tres días hábiles tras su sesión","El Representante; el reporte va dentro de las 24 horas siguientes a que la dictamine","El Representante; el reporte va dentro de los tres días hábiles siguientes a que la dictamine","El consejo de administración; el reporte va dentro de los tres días hábiles tras su sesión"],"x":"En Asesores en inversiones el dictamen corresponde a su Representante (no a un Comité), con 60 días naturales desde la alerta, y el reporte se envía dentro de los tres días hábiles siguientes a aquel en que el Representante la dictamine. El distractor del Comité describe a Bancos.","ref":"Asesores en inversiones 20ª","par":"B012"},{"id":"B015","tema":"2.1.3","tipo":"memoria","q":"Un banco detecta una serie de operaciones de un mismo cliente que guardan relación entre sí como Operaciones Inusuales. ¿Cómo debe reportarlas?","a":"Describiendo lo relativo a todas ellas en un solo reporte","o":["Describiendo lo relativo a todas ellas en un solo reporte","Con un reporte por cada operación, dentro de los tres días hábiles","Con un reporte por cada operación y uno adicional que las agrupe","Con un solo reporte, sólo si todas ocurrieron en el mismo mes calendario"],"x":"La 37ª, último párrafo: si la Entidad detecta operaciones del mismo Cliente o Usuario relacionadas entre sí, relacionadas con otras inusuales o que las complementen, describe todas en un solo reporte. El texto no condiciona a que ocurran en el mismo mes; el mes calendario es el del criterio de fraccionamiento.","ref":"Bancos 37ª, último párrafo"},{"id":"B016","tema":"2.1.3","tipo":"caso","q":"En un mes calendario, un usuario realiza en un banco 12 operaciones con moneda extranjera de 650 USD cada una (7,800 USD en total) y su estructuración sugiere que busca fraccionar. ¿Cómo encuadra?","a":"Actualiza el criterio de fraccionamiento: individuales iguales o superiores a 500 USD que suman al menos 7,500 USD","o":["No actualiza el criterio: cada operación individual debe ser igual o superior a 1,000 USD","No actualiza el criterio: la suma mensual debe ser igual o superior a 10,000 USD","Actualiza el criterio de fraccionamiento sólo si el usuario es cliente con perfil transaccional","Actualiza el criterio de fraccionamiento: individuales iguales o superiores a 500 USD que suman al menos 7,500 USD"],"x":"La 38ª fr. IV de Bancos considera operaciones fraccionadas iguales o superiores a 500 USD cada una que en un mismo mes calendario sumen al menos 7,500 USD; para Usuarios, cuando de su estructuración se infiera la intención de fraccionar. El mínimo individual de 1,000 USD corresponde a Casas de cambio, Centros cambiarios y Transmisores.","ref":"Bancos 38ª fr. IV","par":"B017"},{"id":"B017","tema":"2.1.3","tipo":"caso","q":"En un mes calendario, un usuario realiza en un centro cambiario 12 operaciones de 650 USD cada una (7,800 USD en total) y su estructuración sugiere que busca fraccionar. ¿Cómo encuadra en el criterio de fraccionamiento?","a":"No lo actualiza: cada operación individual debe ser igual o superior a 1,000 USD","o":["Lo actualiza: individuales iguales o superiores a 500 USD que suman al menos 7,500 USD","Lo actualiza: basta con que la suma mensual alcance al menos 5,000 USD","No lo actualiza: cada operación individual debe ser igual o superior a 1,000 USD","No lo actualiza: la suma mensual debe alcanzar al menos 10,000 USD en el mes"],"x":"En Centros cambiarios la fr. IV exige operaciones individuales iguales o superiores a 1,000 USD que en un mes sumen al menos 5,000 USD; con 650 USD cada una no se cumple el mínimo individual, aunque la suma rebase 5,000. El distractor de «basta la suma» confunde con ITF, que no fija mínimo individual pero exige 5,500 USD (art. 70 fr. IV); en Centros la suma sola no basta.","ref":"Centros cambiarios 25ª fr. IV","par":"B016"},{"id":"B018","tema":"2.1.3","tipo":"caso","q":"En un mes calendario, un usuario realiza en una casa de cambio 8 operaciones de 1,000 USD cada una (8,000 USD en total) y su estructuración sugiere que busca fraccionar. ¿Cómo encuadra en el criterio de fraccionamiento?","a":"Lo actualiza: individuales iguales o superiores a 1,000 USD que suman al menos 7,500 USD","o":["No lo actualiza: cada operación individual debe ser superior a 1,000 USD, no igual","No lo actualiza: en Casas de cambio la suma mensual debe alcanzar al menos 10,000 USD en el mes calendario","Lo actualiza: individuales iguales o superiores a 1,000 USD que suman al menos 7,500 USD","Lo actualiza sólo si la casa de cambio también las reportó como Operaciones Relevantes"],"x":"Casas de cambio usa operaciones individuales iguales o superiores a 1,000 USD que en un mismo mes sumen al menos 7,500 USD. Ojo con la combinación: Centros y Transmisores usan 1,000 / 5,000; Casas de cambio, 1,000 / 7,500; Bancos, 500 / 7,500. «Iguales o superen» incluye exactamente 1,000 USD.","ref":"Casas de cambio 29a fr. IV","par":"B017"},{"id":"B019","tema":"2.1.3","tipo":"cifra","q":"En las Disposiciones de ITF, ¿qué parámetro fija el criterio de operaciones fraccionadas para determinar inusuales?","a":"Operaciones en una misma cuenta o contrato que en un mes sumen al menos 5,500 USD","o":["Operaciones en una misma cuenta o contrato que en un mes sumen al menos 5,500 USD","Operaciones individuales de al menos 500 USD que en un mes sumen al menos 7,500 USD","Operaciones individuales de al menos 1,000 USD que en un mes sumen al menos 5,000 USD","Operaciones individuales de al menos 1,000 USD que en un mes sumen al menos 7,500 USD"],"x":"El art. 70 fr. IV de ITF toma las operaciones de una misma cuenta o contrato en un mes calendario que sumen al menos 5,500 USD, sin mínimo por operación individual. Las otras tres combinaciones son de Bancos (500/7,500), Centros y Transmisores (1,000/5,000) y Casas de cambio (1,000/7,500).","ref":"ITF art. 70 fr. IV"},{"id":"B020","tema":"2.1.3","tipo":"memoria","q":"Si un banco considera que una Operación Relevante es además una Operación Inusual, ¿qué dispone la 39ª?","a":"Debe formular, por separado, un reporte por cada uno de esos tipos de operación","o":["Basta el reporte de Operación Inusual, que sustituye al de Operaciones Relevantes","Basta el reporte de Operaciones Relevantes, anotando la alerta en el campo de descripción","Debe formular, por separado, un reporte por cada uno de esos tipos de operación","Debe presentar un solo reporte de Operación Inusual con la leyenda de Operación Relevante"],"x":"La 39ª ordena reportes separados cuando una Operación Relevante o una Operación con Activos Virtuales es considerada además inusual: un reporte por cada tipo. No hay sustitución entre ellos; la exclusión entre reportes existe en otros casos (34ª Bis respecto de relevantes, 34ª Ter respecto de 34ª y 34ª Bis), no aquí.","ref":"Bancos 39ª"},{"id":"B021","tema":"2.1.3","tipo":"caso","q":"Al pretenderse una operación, un banco tiene indicios concretos de que los recursos provienen de actividades ilícitas, pero decide aceptarla. ¿Qué debe hacer?","a":"Reportarla como inusual dentro de las 24 horas siguientes a que conoció la información, con leyenda LD o FT","o":["Reportarla como inusual sólo si no la realiza; al aceptarla, basta seguirla en el monitoreo ordinario","Reportarla como inusual dentro de las 24 horas siguientes a que conoció la información, con leyenda LD o FT","Reportarla como inusual dentro de los tres días hábiles siguientes a la sesión del Comité que la dictamine","Reportarla como inusual dentro de las 24 horas siguientes a que se celebró la operación, sin leyenda especial"],"x":"La 41ª permite al banco no llevar a cabo la operación («podrá»), y en ese caso reporta dentro de las 24 horas contadas desde que conozca la información, con la leyenda «Reporte de 24 horas LD» o «Reporte de 24 horas FT»; si decide aceptarla, también debe remitir el reporte. El plazo corre desde que conoce la información, no desde la operación ni desde un dictamen del Comité.","ref":"Bancos 41ª, primer párrafo"},{"id":"B022","tema":"2.1.3","tipo":"trampa","q":"Una SOCAP decide aceptar una operación pese a tener indicios fundados de que los recursos podrían destinarse a financiar el terrorismo. ¿Qué leyenda inserta en la descripción del reporte?","a":"«Reporte de 24 horas»","o":["«Reporte de 24 horas FT»","«Reporte de 24 horas LD»","«Reporte de 24 horas»","«Lista de Personas Bloqueadas»"],"x":"Las leyendas diferenciadas LD y FT sólo las prevé Bancos (41ª); la SOCAP, como las otras diez DCG, usa la leyenda única «Reporte de 24 horas». La leyenda «Lista de Personas Bloqueadas» pertenece al reporte del capítulo de la LPB, que es otro supuesto. El plazo sí es el mismo: 24 horas desde que conoce la información.","ref":"SOCAP 45ª; Bancos 41ª","par":"B021"},{"id":"B023","tema":"2.1.3","tipo":"caso","q":"Al recibir la notificación de la Lista de Personas Bloqueadas, un banco advierte que semanas antes celebró una operación con una persona que aparece en ella. ¿Cómo debe reportarla?","a":"Como Operación Inusual, dentro del plazo de 24 horas que prevé la 41ª","o":["Como Operación Inusual, dentro de los 60 días naturales para dictaminar más 3 hábiles","Como Operación Interna Preocupante, dentro de los tres días hábiles tras la sesión","En el siguiente reporte trimestral, junto con las Operaciones Relevantes del periodo","Como Operación Inusual, dentro del plazo de 24 horas que prevé la 41ª"],"x":"La 41ª, segundo párrafo, obliga a reportar como Operación Inusual, dentro del plazo de 24 horas, las operaciones celebradas antes de que se notificara la LPB, así como los intentos de personas listadas o de terceros a su favor. No sigue el cauce ordinario de dictamen (60 días naturales y 3 hábiles).","ref":"Bancos 41ª, segundo párrafo","par":"B024"},{"id":"B024","tema":"2.1.3","tipo":"trampa","q":"Un asesor en inversiones advierte que celebró una operación con una persona antes de que se le notificara su inclusión en la Lista de Personas Bloqueadas. ¿Qué prevé al respecto la disposición de reporte de 24 horas de sus DCG?","a":"NO contiene ese supuesto: su 23ª carece del párrafo de la Lista de Personas Bloqueadas","o":["Lo reporta como inusual en 24 horas, igual que Bancos conforme a su 41ª, segundo párrafo","Lo reporta como interna preocupante, dentro de los tres días hábiles tras la sesión del Comité","Lo reporta como inusual en 24 horas con la leyenda «Reporte de 24 horas LD» que fija su 23ª","NO contiene ese supuesto: su 23ª carece del párrafo de la Lista de Personas Bloqueadas"],"x":"La 23ª de Asesores en inversiones regula el reporte de 24 horas sin el párrafo de la LPB que sí tienen Bancos (41ª) y las demás DCG; de hecho, sus Disposiciones no mencionan la LPB. Además, su leyenda es la única «Reporte de 24 horas»: LD/FT sólo es de Bancos.","ref":"Asesores en inversiones 23ª","par":"B023"},{"id":"B025","tema":"2.1.3","tipo":"trampa","q":"Un banco detecta, por el aviso de un empleado, que un funcionario mantiene un nivel de vida notoriamente superior al de sus ingresos. ¿A partir de cuándo cuentan los 60 días naturales para dictaminar la Operación Interna Preocupante?","a":"A partir de que el banco detecte la operación por su sistema, modelo, proceso o empleado","o":["A partir de que se genere una alerta en el sistema automatizado de monitoreo transaccional del banco","A partir de que el banco detecte la operación por su sistema, modelo, proceso o empleado","A partir de que el Oficial de Cumplimiento presente el caso en la sesión del Comité","A partir de que concluya la sesión del Comité que haya conocido el aviso del empleado"],"x":"La 42ª cuenta el plazo de la interna preocupante desde que la Entidad detecte la operación (sistema, modelo, proceso o cualquier empleado, lo que ocurra primero). La trampa es copiar la regla de la inusual, que corre desde la alerta (37ª). Después del dictamen, el reporte va en tres días hábiles tras la sesión.","ref":"Bancos 42ª, primer párrafo"},{"id":"B026","tema":"2.1.3","tipo":"caso","q":"En una SOFOM se detecta que un accionista que no es directivo ni empleado mantiene un nivel de vida notoriamente superior a los ingresos que percibe de ella. ¿Qué prevé su DCG?","a":"La fr. I de su criterio de internas preocupantes alcanza también a accionistas, socios y quienes ejerzan el Control","o":["La fr. I de su criterio de internas preocupantes alcanza también a accionistas, socios y quienes ejerzan el Control","La fr. I sólo alcanza a directivos, funcionarios, empleados y apoderados, igual que la 42ª de Bancos","Sólo puede analizarse como Operación Inusual de un Cliente, porque el accionista no es personal","Debe reportarse en 24 horas como Operación Inusual con leyenda «Reporte de 24 horas»"],"x":"La 34ª fr. I de SOFOM menciona a «algún accionista, socio, directivo, funcionario, empleado, apoderado o aquellos que ejerzan el Control». Bancos (42ª fr. I) sólo menciona directivos, funcionarios, empleados y apoderados. Igual que Bancos, salvo SOFOM, Centros cambiarios y Transmisores, que amplían la fr. I.","ref":"SOFOM 34ª fr. I"},{"id":"B027","tema":"2.1.3","tipo":"caso","q":"Un usuario persona física vende a un banco 800 USD en efectivo en una sola operación. ¿Cómo encuadra en el reporte de operaciones en efectivo con dólares?","a":"Se reporta: para Usuarios el umbral es un monto superior a 250 USD","o":["No se reporta: para Usuarios el umbral es un monto superior a 1,000 USD","Se reporta: para Usuarios el umbral es un monto superior a 250 USD","No se reporta: el umbral para cualquier persona es igual o superior a 500 USD por operación","Se reporta sólo si en el mes el usuario acumula operaciones iguales o superiores a 7,500 USD"],"x":"La 34ª Bis de Bancos ordena un reporte por cada operación en efectivo con USD: Clientes, igual o superior a 500 USD; Usuarios, superior a 250 USD. Con 800 USD el usuario rebasa el umbral. Los «más de 1,000 USD» son de Centros cambiarios, que sólo reportan compras.","ref":"Bancos 34ª Bis fr. II","par":"B028"},{"id":"B028","tema":"2.1.3","tipo":"caso","q":"Un usuario persona física vende a un centro cambiario 800 USD en efectivo en una sola operación. ¿Cómo encuadra en el reporte de operaciones en efectivo con dólares?","a":"No se reporta: el centro cambiario reporta compras en efectivo superiores a 1,000 USD","o":["No se reporta: el centro cambiario reporta compras en efectivo superiores a 1,000 USD","Se reporta: para Usuarios el umbral es un monto superior a 250 USD, igual que Bancos","Se reporta: el umbral para cualquier usuario es igual o superior a 500 USD por operación","No se reporta: los centros cambiarios no tienen reporte de operaciones en efectivo con dólares"],"x":"La 23ª de Centros cambiarios exige un reporte por cada operación de compra en efectivo superior a 1,000 USD, en los diez últimos días hábiles de enero, abril, julio y octubre; 800 USD queda debajo. El distractor «igual que Bancos» falla: el 250/500 es de Bancos y otros sujetos, no de Centros.","ref":"Centros cambiarios 23ª","par":"B027"},{"id":"B029","tema":"2.1.3","tipo":"caso","q":"Un cliente persona física paga a un banco una cuota de su crédito con 600 USD en efectivo. ¿Cómo encuadra en el reporte de operaciones en efectivo con dólares?","a":"Se reporta: comprende el pago de créditos y para Clientes el umbral es igual o superior a 500 USD","o":["No se reporta: el reporte sólo comprende operaciones de compra de dólares en efectivo","Se reporta: comprende el pago de créditos y para Clientes el umbral es igual o superior a 500 USD","No se reporta: para Clientes el umbral es un monto superior a 1,000 USD por operación","Se reporta sólo si el Comité del banco, además, la dictamina como Operación Inusual en la sesión respectiva"],"x":"La 34ª Bis de Bancos abarca compra, recepción de depósitos, recepción del pago de créditos o servicios y transferencias o situación de fondos en efectivo con USD; para Clientes, desde 500 USD. El distractor «sólo compra» describe a SOCAP, Uniones y Centros cambiarios, no a Bancos.","ref":"Bancos 34ª Bis fr. I","par":"B030"},{"id":"B030","tema":"2.1.3","tipo":"caso","q":"Un cliente paga a una unión de crédito una cuota de su crédito con 600 USD en efectivo. ¿Cómo encuadra en el reporte de operaciones en efectivo con dólares?","a":"No entra: el reporte de Uniones sólo comprende operaciones de compra de dólares en efectivo","o":["No entra: el reporte de Uniones sólo comprende operaciones de compra de dólares en efectivo","Se reporta: comprende el pago de créditos y el umbral es igual o superior a 500 USD","Se reporta: comprende el pago de créditos y, para cualquier cliente, el umbral es un monto superior a 250 USD","No entra: las uniones de crédito no tienen reporte de operaciones en efectivo con dólares"],"x":"La 27ª de Uniones de crédito ordena el reporte por cada operación de compra en efectivo con USD igual o superior a 500 USD, sin distinguir Usuarios; el pago de un crédito no es compra. Bancos, en cambio, sí incluye el pago de créditos (34ª Bis). Uniones sí tiene reporte de USD, lo que descarta el último distractor.","ref":"Uniones de crédito 27ª","par":"B029"},{"id":"B031","tema":"2.1.3","tipo":"trampa","q":"¿Qué grupo de sujetos obligados NO tiene en sus DCG el reporte de operaciones en efectivo con dólares de los EUA (o con moneda extranjera)?","a":"SOFOM, Asesores en inversiones, Fondos de inversión y Transmisores de dinero","o":["SOFOM, Asesores en inversiones, Fondos de inversión y Transmisores de dinero","SOFIPO, Uniones de crédito, Centros cambiarios y Transmisores de dinero","SOFOM, Casas de bolsa, Fondos de inversión e Instituciones de tecnología financiera","Asesores en inversiones, Fondos de inversión, SOCAP y Centros cambiarios"],"x":"No prevén ese reporte SOFOM, Asesores, Fondos y Transmisores. SOFIPO (37ª), Uniones (27ª, sólo compra), Centros cambiarios (23ª, compras > 1,000 USD), Casas de bolsa (35ª), SOCAP (38ª, sólo compra) e ITF (art. 67, cualquier moneda extranjera) sí lo tienen. Reportar no es lo mismo que restringir.","ref":"Bancos 34ª Bis; SOFIPO 37ª; Uniones 27ª; Centros cambiarios 23ª; ITF art. 67"},{"id":"B032","tema":"2.1.3","tipo":"caso","q":"Una ITF recibe de un cliente euros en efectivo por el equivalente a 600 USD. ¿Cómo encuadra en sus reportes?","a":"Se reporta: el art. 67 comprende el efectivo en cualquier moneda extranjera desde el equivalente a 500 USD","o":["No se reporta: el reporte de efectivo de ITF sólo comprende dólares de los EUA, igual que Bancos","Se reporta: el art. 67 comprende el efectivo en cualquier moneda extranjera desde el equivalente a 500 USD","Se reporta como Operación Relevante, porque toda moneda extranjera en efectivo es relevante","No se reporta: el art. 67 sólo aplica a operaciones en efectivo superiores a 1,000 USD"],"x":"El art. 67 de ITF ordena un reporte por cada operación con sus Clientes, o entre ellos, en efectivo en moneda extranjera, igual o superior a 500 USD o su equivalente. Bancos (34ª Bis) sólo se refiere a dólares de los EUA. No es relevante: en ITF la relevante empieza en 5,000 USD.","ref":"ITF art. 67"},{"id":"B033","tema":"2.1.3","tipo":"caso","q":"El 20 de marzo, un cliente de un banco envía al extranjero una transferencia por exactamente 1,000 USD. ¿Cómo y cuándo se reporta?","a":"En el reporte mensual, dentro de los 15 días hábiles siguientes al último día hábil de marzo","o":["En el reporte mensual, dentro de los 15 días hábiles siguientes al último día hábil de marzo","En el reporte trimestral, dentro de los diez primeros días hábiles de abril, junto con relevantes","No se reporta: el umbral es un monto superior a 1,000 USD, no igual a esa cantidad","En el reporte mensual, dentro de los 15 días naturales siguientes al último día de marzo"],"x":"La 35ª ordena reportar mensualmente cada transferencia internacional enviada o recibida igual o superior a 1,000 USD, a más tardar dentro de los 15 días hábiles siguientes al último día hábil del mes inmediato anterior. «Igual o superior» incluye exactamente 1,000 USD, y los días son hábiles.","ref":"Bancos 35ª, primer párrafo","par":"B034"},{"id":"B034","tema":"2.1.3","tipo":"caso","q":"Un cliente de una unión de crédito recibe del extranjero una transferencia por 5,000 USD. ¿Qué prevén sus DCG sobre el reporte de transferencias internacionales?","a":"Sus DCG no prevén reporte de transferencias internacionales de fondos","o":["La reporta en el informe mensual, dentro de los 15 días hábiles siguientes al mes","Sus DCG no prevén reporte de transferencias internacionales de fondos","La reporta en el informe trimestral, dentro de los diez primeros días hábiles","La reporta como relevante, por rebasar el equivalente a 1,000 USD en el mes"],"x":"Las DCG de Uniones de crédito no contienen el reporte de transferencias internacionales (tampoco SOFOM, Asesores, Fondos ni Centros cambiarios). En Bancos sería mensual, desde 1,000 USD. Que no exista ese reporte no impide analizarla como posible inusual.","ref":"Uniones de crédito (sin disposición); Bancos 35ª","par":"B033"},{"id":"B035","tema":"2.1.3","tipo":"memoria","q":"La reforma de 2024 añadió a la 35ª de Bancos que el reporte de transferencias internacionales señale los países o jurisdicciones involucrados. ¿Qué otras DCG del temario contienen ese mismo párrafo?","a":"Ninguna: en el temario sólo lo prevé Bancos, por su reforma del 28 de agosto de 2024","o":["Las de Casas de bolsa, SOCAP y SOFIPO, por sus reformas publicadas en 2021","Ninguna: en el temario sólo lo prevé Bancos, por su reforma del 28 de agosto de 2024","Las de Transmisores de dinero y Centros cambiarios, por sus reformas publicadas en el DOF en 2023","Las de ITF, cuyo art. 68 ya lo preveía desde su emisión en septiembre de 2018"],"x":"El párrafo de países o jurisdicciones (incluidos los de la 38ª fr. X) se adicionó a la 35ª de Bancos en el DOF del 28-ago-2024. Casas de bolsa, SOCAP, SOFIPO, Casas de cambio, Transmisores e ITF tienen el reporte de transferencias, pero sin ese párrafo; Centros cambiarios ni siquiera tiene el reporte.","ref":"Bancos 35ª, segundo párrafo"},{"id":"B036","tema":"2.1.3","tipo":"trampa","q":"¿Qué sujeto obligado tiene reporte trimestral de operaciones con cheques de caja?","a":"Sólo Bancos, por cada expedición o pago igual o superior al equivalente a 10,000 USD","o":["Bancos y SOFIPO, por cada expedición o pago igual o superior al equivalente a 7,500 USD","Bancos, Casas de bolsa y SOCAP, por cada expedición o pago superior a 10,000 USD","Todos los que reportan relevantes, por cada cheque igual o superior a 10,000 USD","Sólo Bancos, por cada expedición o pago igual o superior al equivalente a 10,000 USD"],"x":"El reporte de cheques de caja (34ª Ter) sólo existe en Bancos: cada expedición o pago igual o superior al equivalente a 10,000 USD, en los diez primeros días hábiles de enero, abril, julio y octubre; esas operaciones ya no van en la 34ª ni en la 34ª Bis. SOFIPO sólo menciona los cheques de caja en su criterio de fraccionamiento, no como reporte.","ref":"Bancos 34ª Ter"},{"id":"B037","tema":"2.1.3","tipo":"caso","q":"Banco de México autorizó a un banco operar con activos virtuales. En el trimestre celebró con clientes una compra de activos virtuales por el equivalente a 100 USD y una venta por la que recibió moneda nacional equivalente a 2,000 USD. ¿Qué reporta?","a":"La compra de 100 USD, y no la venta, que queda por debajo de 2,250 USD","o":["La venta de 2,000 USD, y no la compra, que queda por debajo de 2,250 USD","La compra de 100 USD, y no la venta, que queda por debajo de 2,250 USD","Ambas operaciones, porque toda operación con activos virtuales se reporta","Ninguna, porque las dos quedan por debajo del umbral de 7,500 UDIS"],"x":"La 34ª Quáter, aplicable sólo si Banxico autoriza las operaciones con AV, exige un reporte por cada compra de AV sin importar el monto, y por cada venta con recepción de moneda nacional igual o superior al equivalente a 2,250 USD. Las 7,500 UDIS son el umbral de ITF (art. 74), no de Bancos.","ref":"Bancos 34ª Quáter"},{"id":"B038","tema":"2.1.3","tipo":"memoria","q":"¿A quién y cuándo remite un banco el informe de información cuantitativa sobre sus operaciones, canales, tipo de clientes, productos y zonas geográficas que prevé la 60ª Bis?","a":"A la Comisión, dentro de los últimos diez días hábiles de abril de cada año","o":["A la Comisión, dentro de los últimos diez días hábiles de abril de cada año","A la Secretaría por conducto de la Comisión, en los diez primeros días hábiles de abril","A la Unidad de Inteligencia Financiera, dentro de los últimos diez días hábiles de enero","A la Secretaría por conducto de la Comisión, en los últimos diez días hábiles de abril"],"x":"La 60ª Bis (2024) dirige el informe a la Comisión, no a la Secretaría, en los últimos diez días hábiles de abril, con información de enero a diciembre del año anterior; la transitoria Cuarta lo hace exigible desde la fecha que fije la Comisión. Los reportes de operaciones, en cambio, van a la Secretaría por conducto de la Comisión.","ref":"Bancos 60ª Bis; transitoria Cuarta (DOF 28-ago-2024)"},{"id":"B039","tema":"2.1.4","tipo":"trampa","q":"¿Qué sujetos obligados tienen en sus DCG un capítulo de restricción a la recepción de dólares de los EUA en efectivo?","a":"Bancos, Casas de bolsa, SOCAP y Casas de cambio","o":["Bancos, SOFOM, SOFIPO y Uniones de crédito","Bancos, Casas de bolsa, SOCAP y Casas de cambio","Casas de cambio, Centros cambiarios y Transmisores de dinero","Bancos, Casas de bolsa, SOFIPO, Centros cambiarios e ITF"],"x":"Sólo cuatro DCG restringen: Bancos (33ª Bis a Quáter), Casas de bolsa (32ª–33ª), SOCAP (35ª–36ª) y Casas de cambio (24ª Bis–Ter), uno por familia y ninguno en Fintech. La trampa es pensar por familias: SOFOM, SOFIPO, Uniones, Centros y Transmisores no tienen ese capítulo, aunque algunos reporten dólares.","ref":"Bancos 33ª Bis–33ª Quáter; Casas de bolsa 32ª–33ª; SOCAP 35ª–36ª; Casas de cambio 24ª Bis–24ª Ter"},{"id":"B040","tema":"2.1.4","tipo":"caso","q":"Un cliente persona física con expediente completo ha entregado a su banco 3,500 USD en efectivo en el mes calendario y pretende depositar otros 600 USD en efectivo. ¿Qué puede recibir el banco?","a":"Sólo 500 USD más: el acumulado mensual por Cliente no puede ser mayor a 4,000 USD","o":["Los 600 USD: el límite mensual por Cliente persona física es de 14,000 USD","Nada más: el límite de 300 USD diarios ya se rebasó con las operaciones previas","Los 600 USD, porque los depósitos en cuenta propia no cuentan para el límite mensual","Sólo 500 USD más: el acumulado mensual por Cliente no puede ser mayor a 4,000 USD"],"x":"La 33ª Bis prohíbe recibir de Clientes personas físicas más de 4,000 USD en efectivo acumulados en un mes calendario, sumando compra, depósitos, pago de créditos o servicios y transferencias o situación de fondos. Los 14,000 USD son de personas morales en zonas, y los 300 USD diarios son de Usuarios.","ref":"Bancos 33ª Bis, primer párrafo","par":"B041"},{"id":"B041","tema":"2.1.4","tipo":"caso","q":"Un cliente persona física de una SOFIPO ha entregado 3,500 USD en efectivo en el mes y pretende depositar otros 600 USD en efectivo. ¿Qué prevén las DCG de SOFIPO?","a":"No fijan límite de recepción; la operación de 600 USD sí va en su reporte de dólares","o":["Sólo puede recibir 500 USD más, porque aplica el límite mensual de 4,000 USD","No fijan límite de recepción; la operación de 600 USD sí va en su reporte de dólares","No puede recibir nada más: el límite de las SOFIPO es de 1,500 USD al mes","No fijan límite ni reporte de dólares; sólo se analiza si encuadra como Operación Inusual"],"x":"Las DCG de SOFIPO no tienen capítulo de restricción: el límite de 4,000 USD es de Bancos, Casas de bolsa, SOCAP y Casas de cambio. Lo que sí tiene SOFIPO es el reporte de operaciones en efectivo con USD (37ª), con umbral para Clientes igual o superior a 500 USD. Que la SOCAP restrinja no significa que la SOFIPO lo haga.","ref":"SOFIPO 37ª","par":"B040"},{"id":"B042","tema":"2.1.4","tipo":"caso","q":"Un cliente persona física de un banco no tiene integrado su expediente con la totalidad de los datos y documentos de la 4ª y quiere entregar dólares en efectivo. ¿Qué límites aplica el banco?","a":"Los de Usuarios de la 33ª Ter: 300 USD diarios y 1,500 USD acumulados en el mes","o":["Los de Clientes de la 33ª Bis: hasta 4,000 USD acumulados en el mes calendario","Ninguno: sin expediente completo el banco no puede recibirle dólares en efectivo","Los de personas morales en zonas: hasta 14,000 USD acumulados en el mes","Los de Usuarios de la 33ª Ter: 300 USD diarios y 1,500 USD acumulados en el mes"],"x":"La 33ª Bis permite recibir dólares de Clientes con los límites de esa disposición sólo si su expediente cuenta con la totalidad de los datos y documentos de la 4ª; en caso contrario, el banco debe apegarse a lo que para Usuarios dispone la 33ª Ter (300 diarios y 1,500 al mes). No es una prohibición total.","ref":"Bancos 33ª Bis, penúltimo párrafo; 33ª Ter"},{"id":"B043","tema":"2.1.4","tipo":"caso","q":"La representación consular de un gobierno extranjero, cliente de un banco, quiere entregar dólares en efectivo. ¿Qué prevé la 33ª Bis?","a":"Puede recibirlos: los clientes con carácter de representación diplomática o consular son excepción a la prohibición","o":["No puede recibirlos: a toda persona moral o fideicomiso cliente se le prohíbe entregar dólares en efectivo","Puede recibirlos hasta 14,000 USD al mes, sólo en sucursales ubicadas en las zonas que publica la Secretaría","Puede recibirlos hasta 4,000 USD al mes, siempre que su expediente esté completo conforme a la 4ª","Puede recibirlos: los clientes con carácter de representación diplomática o consular son excepción a la prohibición"],"x":"La 33ª Bis prohíbe recibir dólares en efectivo de Clientes personas morales o fideicomisos, salvo cuatro casos; la fr. II exceptúa a representaciones diplomáticas y consulares, organismos internacionales, instancias de bienes asegurados o decomisados y recaudadores de contribuciones al comercio exterior. El tope de 14,000 USD y las zonas son de la fr. I, no de la II.","ref":"Bancos 33ª Bis, segundo párrafo, fr. II"},{"id":"B044","tema":"2.1.4","tipo":"memoria","q":"¿Qué operaciones abarca la restricción a la recepción de dólares en efectivo de las SOCAP?","a":"Sólo las operaciones de compra de dólares en efectivo","o":["Compra, depósitos, pago de créditos o servicios y transferencias","Sólo los depósitos y el pago de créditos de sus socios","Sólo las operaciones de compra de dólares en efectivo","Compra y pago de servicios, pero no las transferencias"],"x":"Las SOCAP usan las mismas cifras que Bancos (4,000 / 14,000 / 300 / 1,500 USD), pero sus 35ª y 36ª se refieren sólo a operaciones de compra. Bancos, en cambio, incluye compra, depósitos, pago de créditos o servicios y transferencias o situación de fondos.","ref":"SOCAP 35ª y 36ª"},{"id":"B045","tema":"2.1.4","tipo":"caso","q":"Una persona moral, cliente de un banco, tiene su establecimiento en un municipio que la Secretaría incluyó por sus montos de remesas per cápita elevados. ¿Puede el banco recibirle dólares en efectivo?","a":"Sí, hasta 14,000 USD acumulados en el mes, sólo en sucursales ubicadas en esa zona","o":["Sí, hasta 14,000 USD acumulados en el mes, sólo en sucursales ubicadas en esa zona","No: el criterio de remesas no forma parte de las zonas de excepción de la 33ª Bis de Bancos","Sí, hasta 4,000 USD acumulados en el mes, en cualquier sucursal del país","Sí, sin límite, porque la zona de remesas equivale al régimen de la 33ª Bis 1"],"x":"La 33ª Bis fr. I de Bancos incluye como zonas los municipios de alto flujo de extranjeros, la franja de 20 km de la frontera norte, Baja California y Baja California Sur, y los de remesas per cápita elevadas: hasta 14,000 USD al mes por Cliente y sólo en sucursales de esas zonas. El régimen sin límite es otro (33ª Bis 1).","ref":"Bancos 33ª Bis, segundo párrafo, fr. I","par":"B046"},{"id":"B046","tema":"2.1.4","tipo":"caso","q":"Una persona moral, cliente de una SOCAP, tiene su establecimiento en un municipio con montos de remesas per cápita elevados (no fronterizo ni turístico). ¿Puede la SOCAP comprarle dólares en efectivo?","a":"No: las zonas de excepción de la SOCAP no incluyen el criterio de remesas","o":["Sí, hasta 14,000 USD al mes, sólo en sucursales ubicadas en esa zona","No: las zonas de excepción de la SOCAP no incluyen el criterio de remesas","Sí, hasta 4,000 USD al mes, siempre que su expediente esté completo","Sí, sin límite, porque la SOCAP sólo restringe las operaciones de compra de Usuarios"],"x":"La 35ª fr. I de SOCAP limita las zonas a municipios de alto flujo de extranjeros, la franja de 20 km de la frontera norte y Baja California y Baja California Sur; no incluye las remesas, que sí están en Bancos. Igual pasa en Casas de bolsa y Casas de cambio. Fuera de las excepciones, a la persona moral se le prohíbe.","ref":"SOCAP 35ª, segundo párrafo, fr. I","par":"B045"},{"id":"B047","tema":"2.1.4","tipo":"caso","q":"Un usuario persona física de nacionalidad mexicana quiere entregar a un banco 900 USD en efectivo en un solo día para comprar pesos. ¿Qué puede recibir el banco?","a":"Hasta 300 USD ese día: es el límite diario por Usuario persona física","o":["Hasta 300 USD ese día: es el límite diario por Usuario persona física","Los 900 USD: el límite por Usuario es de 1,500 USD acumulados al mes","Hasta 250 USD ese día: es el límite por operación de los Usuarios","Los 900 USD, siempre que recabe copia de su credencial para votar o pasaporte"],"x":"La 33ª Ter prohíbe recibir de Usuarios personas físicas más de 300 USD diarios y, en todo caso, más de 1,500 USD acumulados en el mes. Para un mexicano operan ambos topes. Los 250 USD son el umbral del reporte de Usuarios (34ª Bis) o el tope por operación de comisionistas, no un límite de recepción del banco.","ref":"Bancos 33ª Ter, primer y tercer párrafos","par":"B058"},{"id":"B048","tema":"2.1.4","tipo":"caso","q":"Un turista extranjero, usuario de un banco, quiere vender 900 USD en efectivo en un solo día. ¿Qué prevé la 33ª Ter?","a":"Está exceptuado del límite diario, sin rebasar 1,500 USD al mes; el banco recaba copia de su pasaporte o tarjeta pasaporte","o":["Está exceptuado del límite diario, sin rebasar 1,500 USD al mes; el banco recaba copia de su pasaporte o tarjeta pasaporte","Aplica el límite de 300 USD diarios, igual que a los usuarios de nacionalidad mexicana, y 1,500 USD al mes","Está exceptuado de todo límite, diario y mensual, siempre que acredite su legal estancia con el documento del INM","Aplica el límite de 4,000 USD al mes de los Clientes, siempre que el banco integre su expediente completo"],"x":"La 33ª Ter exceptúa del límite diario a los Usuarios personas físicas extranjeros, recabando copia del pasaporte o tarjeta pasaporte y, cuando lo tenga, del documento del INM; pero «en todo caso» se mantiene el tope de 1,500 USD acumulados al mes. Sólo quien paga contribuciones al comercio exterior queda fuera de ambos límites.","ref":"Bancos 33ª Ter, segundo y tercer párrafos"},{"id":"B049","tema":"2.1.4","tipo":"caso","q":"Un usuario persona física de un banco necesita entregar 3,000 USD en efectivo para pagar contribuciones al comercio exterior por la importación de mercancías (no equipaje ni franquicia). ¿Qué prevé la 33ª Ter?","a":"No le aplican los límites diario ni mensual de Usuarios personas físicas","o":["Aplican los límites de 300 USD diarios y 1,500 USD acumulados en el mes","Sólo se exceptúa del límite diario; se mantiene el de 1,500 USD al mes","No le aplican los límites diario ni mensual de Usuarios personas físicas","Puede recibirlos hasta 4,000 USD al mes, igual que a Clientes con expediente"],"x":"La 33ª Ter, cuarto párrafo, dispone que los límites de Usuarios personas físicas no son aplicables, sean mexicanos o extranjeros, cuando realicen operaciones cambiarias para pagar contribuciones al comercio exterior causadas por la importación de mercancías distintas al equipaje o a una franquicia. La excepción sólo del límite diario es la de extranjeros.","ref":"Bancos 33ª Ter, cuarto párrafo","par":"B050"},{"id":"B050","tema":"2.1.4","tipo":"caso","q":"Un usuario persona física de una casa de bolsa necesita entregar 3,000 USD en efectivo para pagar contribuciones al comercio exterior por la importación de mercancías. ¿Qué prevén sus DCG?","a":"Aplican los límites de 300 USD diarios y 1,500 USD al mes: no tienen la excepción de comercio exterior","o":["Aplican los límites de 300 USD diarios y 1,500 USD al mes: no tienen la excepción de comercio exterior","No aplican los límites diario ni mensual, igual que en Bancos por la excepción de comercio exterior","Sólo se exceptúa del límite diario; se mantiene el de 1,500 USD al mes, como a los extranjeros","No fijan límites: las Casas de bolsa no tienen capítulo de restricción de dólares en efectivo"],"x":"La 33ª de Casas de bolsa replica los límites de Usuarios (300 diarios, 1,500 al mes) y la excepción de extranjeros, pero no contiene la excepción por pago de contribuciones al comercio exterior que sí tienen Bancos y Casas de cambio. SOCAP tampoco la tiene.","ref":"Casas de bolsa 33ª","par":"B049"},{"id":"B051","tema":"2.1.4","tipo":"caso","q":"Una persona moral que no es cliente de un banco (usuario) acude a una sucursal ubicada en la franja de 20 km de la frontera norte a vender dólares en efectivo. ¿Qué prevé la 33ª Ter?","a":"El banco debe abstenerse de recibirle dólares en efectivo, cualquiera que sea el monto","o":["Puede recibirle hasta 14,000 USD al mes, por estar la sucursal en zona de excepción","Puede recibirle hasta 300 USD diarios y 1,500 USD al mes, igual que a personas físicas","Puede recibirle cualquier monto, si recaba los datos de su representante y su RFC","El banco debe abstenerse de recibirle dólares en efectivo, cualquiera que sea el monto"],"x":"La 33ª Ter, último párrafo, ordena a los Bancos abstenerse de recibir dólares en efectivo de Usuarios personas morales o a nombre de fideicomisos. La excepción de zonas (14,000 USD) es para Clientes personas morales (33ª Bis fr. I), no para Usuarios.","ref":"Bancos 33ª Ter, último párrafo","par":"B052"},{"id":"B052","tema":"2.1.4","tipo":"caso","q":"Una persona moral, usuaria de una casa de cambio, con establecimiento en la franja de 20 km de la frontera norte, cumple la totalidad de los requisitos de la fr. III de la 4ª y quiere vender dólares en efectivo en una sucursal de esa zona. ¿Qué prevén sus DCG?","a":"Puede recibirle hasta 14,000 USD acumulados en el mes calendario","o":["Debe abstenerse de recibirle dólares en efectivo, como Bancos con Usuarios","Puede recibirle hasta 4,000 USD acumulados en el mes calendario","Puede recibirle cualquier monto, por ubicarse en una zona fronteriza","Puede recibirle hasta 14,000 USD acumulados en el mes calendario"],"x":"Las Casas de cambio no operan con «Clientes»: su régimen se construye sobre Usuarios. La 24ª Bis prohíbe recibir de Usuarios personas morales, salvo que se ubiquen en la 24ª Ter, cuya fr. II a) permite hasta 14,000 USD al mes en zonas. «Cualquier monto» es para diplomáticos, gobierno, recaudadores, entidades financieras por cuenta propia y fideicomisos públicos.","ref":"Casas de cambio 24ª Bis, último párrafo; 24ª Ter fr. II a)","par":"B051"},{"id":"B053","tema":"2.1.4","tipo":"cifra","q":"En una casa de cambio, ¿hasta qué monto puede recibir dólares en efectivo de un usuario persona física que cumple la totalidad de los requisitos de la fr. III de la 4ª?","a":"Hasta 4,000 USD acumulados en el mes calendario","o":["Hasta 1,500 USD acumulados en el mes calendario","Hasta 14,000 USD acumulados en el mes calendario","Hasta 4,000 USD acumulados en el mes calendario","Hasta 7,500 USD acumulados en el mes calendario"],"x":"La 24ª Ter fr. I de Casas de cambio permite, al Usuario persona física con expediente completo, hasta 4,000 USD al mes: la misma cifra que Bancos fija para Clientes (33ª Bis). Sin ese expediente aplican los 300 diarios y 1,500 mensuales de la 24ª Bis; los 14,000 son de personas morales en zonas.","ref":"Casas de cambio 24ª Ter fr. I"},{"id":"B054","tema":"2.1.4","tipo":"cifra","q":"Para que un banco reciba ilimitadamente dólares en efectivo de un cliente persona moral (33ª Bis 1), ¿qué combinación de requisitos aplica?","a":"Constituida con al menos 3 años; estados financieros de 2 ejercicios; 2 últimas declaraciones; valoración conservada al menos 10 años","o":["Constituida con al menos 2 años; estados financieros de 3 ejercicios; 2 últimas declaraciones; valoración conservada al menos 5 años","Constituida con al menos 3 años; estados financieros de 3 ejercicios; 3 últimas declaraciones; valoración conservada al menos 10 años","Constituida con al menos 5 años; estados financieros de 2 ejercicios; 2 últimas declaraciones; valoración conservada al menos 5 años","Constituida con al menos 3 años; estados financieros de 2 ejercicios; 2 últimas declaraciones; valoración conservada al menos 10 años"],"x":"La 33ª Bis 1 exige: constitución con al menos tres años de anterioridad; justificación; estados financieros de los últimos dos ejercicios; las dos últimas declaraciones anuales; información de socios personas físicas, y una valoración documentada que se conserva al menos diez años. La documentación se actualiza cada 12 meses, y a las emisoras listadas no se les piden las fr. III a V. Sólo existe en Bancos.","ref":"Bancos 33ª Bis 1"},{"id":"B055","tema":"2.1.4","tipo":"memoria","q":"¿Qué obliga a un banco la 33ª Bis 2 respecto de los clientes personas morales del régimen ilimitado de dólares en efectivo?","a":"Remitir la lista actualizada de esos clientes a la Secretaría, por conducto de la Comisión, en los diez primeros días hábiles de cada mes","o":["Remitir la lista actualizada de esos clientes a la Comisión, en los diez primeros días hábiles de enero, abril, julio y octubre","Conservar la lista en sus sistemas y entregarla a la Secretaría sólo cuando ésta lo requiera mediante oficio","Remitir la lista actualizada de esos clientes a la Secretaría, por conducto de la Comisión, en los diez primeros días hábiles de cada mes","Remitir la lista a la Secretaría, por conducto de la Comisión, en los últimos diez días hábiles de abril de cada año"],"x":"La 33ª Bis 2 ordena enviar mensualmente, a más tardar dentro de los diez primeros días hábiles de cada mes calendario, la lista actualizada de Clientes personas morales del régimen de la 33ª Bis 1, con denominación, RFC, firma electrónica y nombre de quien obliga a la sociedad. Abril es el mes del informe cuantitativo (60ª Bis), que va a la Comisión.","ref":"Bancos 33ª Bis 2"},{"id":"B056","tema":"2.1.4","tipo":"caso","q":"Un comisionista de un banco (fr. I de la 33ª Quáter) compra dólares en efectivo a personas físicas para el pago de sus productos. Un cliente le ofrece 300 USD en una sola operación. ¿Qué prevé la disposición?","a":"No puede aceptarlos: el comisionista no puede rebasar 250 USD por operación","o":["Puede aceptarlos: el tope del comisionista es de 300 USD diarios por persona","No puede aceptarlos: el comisionista no puede rebasar 250 USD por operación","Puede aceptarlos: el tope del comisionista es de 1,500 USD acumulados al mes","Puede aceptarlos si el cliente es extranjero y muestra su pasaporte o tarjeta"],"x":"La 33ª Quáter fr. I fija para los comisionistas que compran dólares exclusivamente a personas físicas un máximo de 250 USD por operación. Los topes de 300 diarios y 1,500 al mes corresponden a las tiendas libres de impuestos en puertos (fr. II) y a los hoteles con sus huéspedes (fr. III). Estos límites no se acumulan con los de la 33ª Bis y Ter.","ref":"Bancos 33ª Quáter fr. I"},{"id":"B057","tema":"2.1.4","tipo":"caso","q":"Un usuario persona física de nacionalidad mexicana vende a un banco 50 USD en efectivo. ¿Qué documentación debe recabar el banco?","a":"Los datos de la 17ª fr. I y copia de su pasaporte, credencial para votar o matrícula consular","o":["Ninguna: la documentación sólo se exige en operaciones superiores a 250 USD con Usuarios","Sólo los datos de la 17ª fr. I; la copia de identificación se exige desde los 300 USD diarios","Copia de su pasaporte y del documento expedido por el INM que acredite su legal estancia","Los datos de la 17ª fr. I y copia de su pasaporte, credencial para votar o matrícula consular"],"x":"La 33ª Ter obliga a recabar y conservar, en los sistemas de la 51ª, los datos de la 17ª fr. I y, para nacionales, copia del pasaporte, credencial para votar o certificado de matrícula consular, con independencia del monto recibido. El documento del INM se pide a extranjeros; los 250 USD son el umbral del reporte de Usuarios, no de la documentación.","ref":"Bancos 33ª Ter, quinto y sexto párrafos"},{"id":"B058","tema":"2.1.4","tipo":"caso","q":"Un usuario persona física de nacionalidad mexicana vende a un centro cambiario 900 USD en efectivo en un solo día. ¿Qué prevén las DCG de Centros cambiarios?","a":"No limitan la recepción, y por ser de 900 USD la compra tampoco entra al reporte de compras superiores a 1,000 USD","o":["Debe recibirle como máximo 300 USD ese día, porque aplica el límite diario de Usuarios personas físicas","Puede recibirle los 900 USD, pero debe reportarlos por rebasar 250 USD, igual que hacen los Bancos","No limitan la recepción, y por ser de 900 USD la compra tampoco entra al reporte de compras superiores a 1,000 USD","No limitan la recepción, pero debe reportarla como Operación Relevante por rebasar 500 USD en el día"],"x":"Centros cambiarios no tiene capítulo de restricción de dólares en efectivo: el límite de 300 USD diarios es de Bancos, Casas de bolsa, SOCAP y Casas de cambio. Su 23ª sólo obliga a reportar compras en efectivo superiores a 1,000 USD, y su relevante empieza en 5,000 USD. Reportar y restringir son obligaciones distintas.","ref":"Centros cambiarios 23ª; Bancos 33ª Ter","par":"B047"},{"id":"B059","tema":"2.1.5","tipo":"memoria","q":"¿Qué función asigna a los sistemas automatizados de un banco la fracción X de la 51ª?","a":"Ejecutar alertas sobre operaciones con personas de la Lista de Personas Bloqueadas, Personas Políticamente Expuestas y países de la 38ª fr. X","o":["Generar y transmitir de forma segura a la Secretaría, por conducto de la Comisión, los reportes previstos en las Disposiciones","Permitir conocer la trazabilidad y el origen de los activos virtuales con los que el banco realice operaciones","Ejecutar alertas sobre operaciones con personas de la Lista de Personas Bloqueadas, Personas Políticamente Expuestas y países de la 38ª fr. X","Facilitar la verificación de los datos y documentos proporcionados de forma no presencial por el Cliente"],"x":"La 51ª fr. X ordena ejecutar un sistema de alertas respecto de operaciones que se pretendan llevar a cabo con personas en la LPB o con PEP, y las que involucren países o jurisdicciones de la 38ª fr. X a) y b). Generar y transmitir reportes es la fr. II; la trazabilidad de AV, la fr. XII; la verificación no presencial, la fr. XI.","ref":"Bancos 51ª fr. X"},{"id":"B060","tema":"2.1.5","tipo":"caso","q":"Un banco suspende la identificación de un posible cliente porque continuar podría alertarlo de la sospecha. Su sistema automatizado no permite generar ese reporte. ¿Qué prevén las Disposiciones?","a":"Puede elaborarlo de forma manual y lo remite dentro de las 24 horas siguientes a que conoció la información","o":["Debe esperar a que el sistema lo genere, porque todos los reportes se transmiten por el sistema de la 51ª","Puede elaborarlo de forma manual y lo remite dentro de los tres días hábiles siguientes a la sesión del Comité","Debe reanudar la identificación y reportar la operación como relevante en el siguiente reporte trimestral","Puede elaborarlo de forma manual y lo remite dentro de las 24 horas siguientes a que conoció la información"],"x":"La 10ª Ter permite suspender la identificación y obliga a generar el reporte de Operación Inusual de 24 horas, que «podrá elaborarse de manera manual», remitido dentro de las 24 horas desde que conozca la información. La 51ª fr. II, segundo párrafo, lo recoge como la excepción a la generación automatizada de reportes.","ref":"Bancos 10ª Ter; 51ª fr. II, segundo párrafo"},{"id":"B061","tema":"2.1.5","tipo":"memoria","q":"La fracción XIII de la 51ª, adicionada en 2024, exige que el sistema de un banco ejecute el modelo de evaluación de riesgos. ¿Qué historial debe conservar?","a":"Registros históricos, por un periodo no menor a diez años, de las modificaciones en el Grado de Riesgo y en el perfil transaccional del Cliente","o":["Registros históricos, por un periodo no menor a cinco años, de las alertas generadas y de los dictámenes del Comité sobre el Cliente","Registros históricos, por un periodo no menor a diez años, de las modificaciones en el Grado de Riesgo y en el perfil transaccional del Cliente","Registros históricos, por un periodo no menor a diez años, de las Operaciones Relevantes y de las operaciones en efectivo con dólares","Registros históricos, durante la vigencia de la relación comercial, del Grado de Riesgo inicial asignado al Cliente al abrir su cuenta"],"x":"La 51ª fr. XIII ordena ejecutar el modelo de la 25ª Bis, 25ª Ter y Anexo 3 para clasificar a los Clientes por Grado de Riesgo, conservando por un periodo no menor a diez años los históricos de las modificaciones en el Grado de Riesgo y en el perfil transaccional durante la relación comercial. Sólo la tiene Bancos.","ref":"Bancos 51ª fr. XIII"},{"id":"B062","tema":"2.1.5","tipo":"memoria","q":"¿Qué exige la fracción XII de la 51ª de Bancos al sistema automatizado respecto de los activos virtuales?","a":"Permitir conocer la trazabilidad y el origen de los activos virtuales con los que opere","o":["Permitir conocer la trazabilidad, el origen y el destino de los activos virtuales operados","Generar alertas por toda compra de activos virtuales superior a 2,250 USD equivalentes","Permitir conocer la trazabilidad y el origen de los activos virtuales con los que opere","Conservar por diez años los registros de toda venta de activos virtuales con sus clientes"],"x":"La 51ª fr. XII de Bancos pide permitir conocer la trazabilidad y el origen de los AV con los que operen y que, en su caso, determine Banco de México. «Origen y destino» es la redacción de ITF (art. 56 fr. IV), que también exige históricos para reconstruir operaciones.","ref":"Bancos 51ª fr. XII","par":"B063"},{"id":"B063","tema":"2.1.5","tipo":"memoria","q":"¿Qué exige el art. 56 de las Disposiciones de ITF a su sistema automatizado respecto de los activos virtuales?","a":"Permitir conocer la trazabilidad y el origen y destino de los activos virtuales con los que operen","o":["Permitir conocer sólo el origen de los activos virtuales, sin exigir su trazabilidad ni su destino","Generar alertas por cada venta de activos virtuales igual o superior al equivalente a 7,500 UDIS","Permitir conocer la trazabilidad y el origen y destino de los activos virtuales con los que operen","Ejecutar el modelo de riesgo con históricos de al menos diez años de cada operación con activos virtuales"],"x":"El art. 56 fr. IV de ITF habla de trazabilidad y «origen y destino» de los AV; su fr. IX pide históricos que permitan la reconstrucción de operaciones ilícitas. Bancos (51ª fr. XII) se queda en trazabilidad y origen. ITF no tiene el modelo de riesgo con históricos de diez años, que es la fr. XIII de Bancos.","ref":"ITF art. 56 fr. IV","par":"B062"},{"id":"B064","tema":"2.1.5","tipo":"caso","q":"El área de tecnología de un banco desarrolló su sistema de alertas y de filtrado de listas. ¿Qué prevé la 51ª sobre la evaluación de su efectividad?","a":"Evaluarla al menos cada dos años, de manera independiente al área que lo desarrolló; el Comité conoce el resultado","o":["Evaluarla al menos cada año, por la misma área que lo desarrolló; el consejo de administración conoce el resultado","Evaluarla al menos cada dos años, por la misma área que lo desarrolló; el Oficial de Cumplimiento aprueba el resultado","Evaluarla cada tres años, por un auditor externo independiente; la Comisión conoce el resultado de la evaluación","Evaluarla al menos cada dos años, de manera independiente al área que lo desarrolló; el Comité conoce el resultado"],"x":"El último párrafo de la 51ª (2024) obliga a evaluar al menos cada dos años, de manera independiente al área que los desarrolló, la efectividad del sistema de alertas, parámetros y criterios de monitoreo transaccional y filtrado de listas, en los términos de su Manual; el Comité debe conocer el resultado. El texto exige independencia respecto del área, no un auditor externo.","ref":"Bancos 51ª, último párrafo","par":"B065"},{"id":"B065","tema":"2.1.5","tipo":"caso","q":"El área de tecnología de una SOFOM desarrolló su sistema de alertas y de filtrado de listas. ¿Qué prevén sus DCG sobre la evaluación periódica de su efectividad?","a":"No prevén esa evaluación periódica; es una obligación que sólo tiene Bancos desde 2024","o":["Evaluarla al menos cada dos años, de manera independiente, como dispone la 51ª de Bancos","No prevén esa evaluación periódica; es una obligación que sólo tiene Bancos desde 2024","Evaluarla al menos cada año, por un tercero independiente, con resultado para el Comité","Evaluarla cada dos años sólo si su Manual de Cumplimiento así lo establece expresamente"],"x":"La evaluación al menos cada dos años, independiente y con resultado para el Comité, se adicionó a la 51ª de Bancos en el DOF del 28-ago-2024; ninguna de las otras once DCG del temario la prevé. La SOFOM tiene el núcleo de funciones (43ª), sin las fr. XII y XIII ni esta evaluación.","ref":"SOFOM 43ª; Bancos 51ª, último párrafo","par":"B064"},{"id":"B066","tema":"2.1.5","tipo":"caso","q":"Un asesor en inversiones revisa si su sistema automatizado debe incluir las funciones que la 51ª asigna a los Bancos. ¿Qué es correcto según su 27ª?","a":"Su lista no incluye generar y transmitir reportes ni alertas de la Lista de Personas Bloqueadas","o":["Su lista no incluye generar y transmitir reportes ni alertas de la Lista de Personas Bloqueadas","Su lista es idéntica a la de Bancos, incluidas la trazabilidad de AV y el modelo de riesgo","Su lista incluye generar y transmitir reportes, pero no alertas de Personas Políticamente Expuestas","No tiene obligación de contar con sistemas automatizados, por no reportar Operaciones Relevantes"],"x":"La 27ª de Asesores en inversiones tiene una lista reducida: expediente, alertas, análisis de inusuales e internas, base consolidada, históricos, información para la metodología, alertas de países y PEP y verificación remota. No incluye generar y transmitir reportes, canal interno, seguridad de la información ni alerta de la LPB. Sí debe tener sistemas.","ref":"Asesores en inversiones 27ª"},{"id":"B067","tema":"2.1.5","tipo":"caso","q":"Un centro cambiario configura la fracción XI de su sistema automatizado. ¿Qué debe facilitar esa fracción?","a":"La verificación de los datos y documentos del Usuario que haya cotejado contra los originales","o":["La verificación de los datos y documentos que el Cliente proporcione de forma no presencial","La validación remota de la autenticidad de los documentos que el Usuario envíe por medios electrónicos","La trazabilidad del origen de los recursos en efectivo que reciba de sus Usuarios en la ventanilla","La verificación de los datos y documentos del Usuario que haya cotejado contra los originales"],"x":"La 38ª fr. XI de Centros cambiarios pide facilitar la verificación de los datos y documentos proporcionados por el Usuario que el Centro haya cotejado contra los documentos originales. Bancos (51ª fr. XI) e ITF (art. 56 fr. II) se enfocan en lo proporcionado de forma no presencial o remota.","ref":"Centros cambiarios 38ª fr. XI","par":"B068"},{"id":"B068","tema":"2.1.5","tipo":"caso","q":"Un banco configura la fracción XI de la 51ª en su sistema automatizado. ¿Qué debe facilitar esa fracción?","a":"La verificación de los datos y documentos proporcionados de forma no presencial por el Cliente","o":["La verificación de los datos y documentos del Usuario que haya cotejado contra los originales","La consulta de los datos del expediente de identificación de cada Cliente en todas sus sucursales","La agrupación en una base consolidada de las diferentes cuentas y contratos de un mismo Cliente","La verificación de los datos y documentos proporcionados de forma no presencial por el Cliente"],"x":"La 51ª fr. XI de Bancos (modificada en 2024) pide facilitar la verificación de datos y documentos proporcionados de forma no presencial por el Cliente. El cotejo contra originales es la fr. XI de Centros cambiarios; la consulta del expediente es la fr. I y la base consolidada, la fr. VI.","ref":"Bancos 51ª fr. XI","par":"B067"},{"id":"B069","tema":"2.1.5","tipo":"cifra","q":"¿Qué plazo dio la reforma a Bancos publicada en el DOF del 28 de agosto de 2024 para actualizar los sistemas automatizados de la 51ª?","a":"18 meses contados a partir de la entrada en vigor de la Resolución","o":["12 meses contados a partir de la entrada en vigor de la Resolución","180 días naturales contados a partir de la publicación en el DOF","18 meses contados a partir de la entrada en vigor de la Resolución","24 meses contados a partir de la publicación en el DOF de la reforma"],"x":"La transitoria Tercera fr. III de la reforma de 2024 da 18 meses desde la entrada en vigor para actualizar los sistemas de la 51ª. Los 12 meses son para la metodología (fr. II) y la certificación del Oficial (fr. IV); los 180 días naturales son el plazo de ITF.","ref":"Bancos, transitoria Tercera fr. III (DOF 28-ago-2024)","par":"B070"},{"id":"B070","tema":"2.1.5","tipo":"caso","q":"Una persona de las previstas en la Octava Disposición Transitoria de la LRITF obtiene su autorización como ITF. Conforme al transitorio de sus Disposiciones, ¿en qué plazo debe actualizar sus sistemas automatizados del art. 56?","a":"180 días naturales a partir de que obtenga la autorización","o":["180 días naturales a partir de que obtenga la autorización","18 meses a partir de la entrada en vigor de las Disposiciones","360 días naturales a partir de que obtenga la autorización","180 días hábiles a partir de la publicación en el DOF"],"x":"El transitorio Segundo fr. I de ITF da 180 días naturales, contados a partir de que obtengan la autorización de la CNBV, para implementar la metodología y actualizar los sistemas del art. 56. Los 360 días naturales son para regularizar expedientes (fr. II); los 18 meses son la regla de las reformas de las demás DCG.","ref":"ITF, transitorio Segundo fr. I (DOF 10-sep-2018)","par":"B069"},{"id":"B071","tema":"2.1.3","tipo":"trampa","q":"Una SOFOM regulada (vinculada a un banco) presenta su reporte de Operaciones Relevantes del trimestre julio–septiembre. ¿En qué plazo debe remitirlo?","a":"Dentro de los diez últimos días hábiles de octubre, porque sus DCG aplican igual a SOFOM reguladas y no reguladas","o":["Dentro de los diez últimos días hábiles de octubre, porque sus DCG aplican igual a SOFOM reguladas y no reguladas","Dentro de los diez primeros días hábiles de octubre, porque como entidad regulada sigue la regla de las DCG de Bancos","Dentro de los diez primeros días hábiles de octubre, porque el plazo de los diez últimos es sólo para las no reguladas","Dentro de los quince días hábiles siguientes al cierre de septiembre, como el reporte mensual de transferencias"],"x":"Las DCG de SOFOM se aplican a las reguladas (art. 87-D LGOAAC) y a las no reguladas (art. 95 Bis) «salvo que se señale lo contrario» (1ª), y su 28ª fija los diez últimos días hábiles de enero, abril, julio y octubre sin distinguir. El distractor tentador es pensar que «regulada» lleva a la regla de Bancos: lo que manda es la DCG que le aplica.","ref":"SOFOM 1ª, segundo párrafo; 28ª","par":"B006"},{"id":"B072","tema":"2.1.3","tipo":"memoria","q":"SOFOM, Centros cambiarios y Transmisores de dinero presentan sus Operaciones Relevantes en los diez últimos días hábiles del mes de reporte. ¿Qué tienen en común sus DCG?","a":"Se emiten con fundamento, en todo o en parte, en el art. 95 Bis de la LGOAAC","o":["Se emiten con fundamento, en todo o en parte, en el art. 95 Bis de la LGOAAC","Se emiten con fundamento en el art. 95 de la LGOAAC, igual que las de casas de cambio","Su última reforma compilada en el temario es de enero de 2023 en los tres casos","Se emiten con fundamento en el art. 115 de la LIC, sin intervención de la LGOAAC"],"x":"Centros cambiarios y Transmisores tienen DCG del art. 95 Bis LGOAAC, y las de SOFOM se aplican por el 95 Bis a las no reguladas (y por el 87-D a las reguladas). Las Casas de cambio, en cambio, tienen DCG del art. 95 y presentan en los diez primeros días, como Bancos. El gancho: «los del 95 Bis van al último». Las fechas de reforma no coinciden: SOFOM es de 2021, Transmisores de marzo de 2023 y sólo Centros de enero de 2023.","ref":"SOFOM 1ª; Centros cambiarios 1ª; Transmisores 1ª; Casas de cambio 1a"}],"sitio":{"nombre":"Módulo 2","integrador":"simulacro","integrador_texto":"Simulacro mixto","integrador_href":"m2-simulacro/index.html","etiqueta_n":"H","orden_resultados":"temario","paginas":[{"n":"1","carpeta":"m2-h1-objetivo-kyc","pregunta":"2.1.1–2.1.2 · Objetivo y política de identificación y conocimiento","estado":"integrada"},{"n":"2","carpeta":"m2-h2-reportes-dolares-sistemas","pregunta":"2.1.3–2.1.5 · Reportes, dólares en efectivo y sistemas automatizados","estado":"integrada"},{"n":"3","carpeta":"m2-h3-otras-obligaciones-lpb","pregunta":"2.1.6–2.1.8 · Otras obligaciones, intercambio de información y LPB","estado":"integrada"},{"n":"4","carpeta":"m2-h4-ccc-oficial","pregunta":"2.1.9–2.1.10 · Comité de Comunicación y Control y oficial de cumplimiento","estado":"integrada"},{"n":"5","carpeta":"m2-h5-novedosos-cambios-itf","pregunta":"2.1.11–2.1.14 · Modelos novedosos, centros cambiarios, transmisores e ITF","estado":"integrada"},{"n":"6","carpeta":"m2-h6-sanciones-pr-plazos","pregunta":"2.1.15–2.1.17 · Sanciones, propietario real y plazos","estado":"integrada"},{"n":"7","carpeta":"m2-h7-tipologias","pregunta":"2.1 · Tipologías UIF y de organismos internacionales","estado":"integrada"},{"n":"8","carpeta":"m2-h8-lfpiorpi","pregunta":"2.2.1–2.2.2 · LFPIORPI: actividades vulnerables y uso de efectivo","estado":"integrada"}],"raiz":"../","actual":"m2-h2-reportes-dolares-sistemas"}}
