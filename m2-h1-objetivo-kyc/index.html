<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Módulo 2 · Herramienta H1: para qué existen las 12 DCG y cómo cada sujeto obligado identifica y conoce a su cliente o usuario, con simulador de reactivos.">
<title>2.1.1 Objetivo · 2.1.2 Política de identificación y conocimiento del cliente o usuario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}

y Uniones de crédito (2ª III), y la ITF (art. 2 IV; Usuario sólo en la transmisión de dinero de las IFPE, art. 100). <b>Sólo Usuario<\/b>: Casas de cambio (2ª XXXIV), Centros cambiarios (2ª XXVI) y Transmisores (2ª XXXIX: remitente y beneficiario). Cliente <b>y<\/b> Usuario: Bancos, SOFOM, Casas de bolsa, SOCAP y SOFIPO."},{"titulo":"«Todas tienen cuentas por niveles, como Bancos».","texto":"Falso. Niveles de cuenta sólo en <b>Bancos<\/b> (14ª Bis: niveles 1 a 3 de 750 · 3,000 · 10,000 UDIS de abonos al mes, y la cuenta remota de 30,000 UDIS de la fr. IV, que la norma no llama «nivel 4») y en la <b>ITF<\/b> (niveles 1 y 2, art. 12). Los demás simplifican de otra forma: SOFOM y Uniones por <b>crédito<\/b>; Casas de bolsa, Fondos y Asesores por contratos <b>inferiores a 3,000 UDIS al mes<\/b>; SOCAP y SOFIPO, una cuenta a la vista de <b>3,000 UDIS<\/b>; Casas de cambio, operaciones por medios electrónicos <b>inferiores a 2,000 UDIS al mes<\/b> (9a); Centros cambiarios y Transmisores, sólo el Anexo 1."},{"titulo":"Persona física extranjera: ¿qué quitamos?","texto":"En los <b>datos<\/b>, sólo la <b>entidad federativa de nacimiento<\/b> (Bancos 4ª fr. III a) i); en Asesores, ni eso). CURP, RFC o NIF y FEA siguen pidiéndose «cuando disponga». En los <b>documentos<\/b> cambian: <b>pasaporte<\/b> y documento del INM (o tarjeta de la SRE) en lugar de la identificación, y comprobante del domicilio <b>en su lugar de residencia<\/b>; la lista ya no trae constancias ni poder (fr. III a) ii)."},{"titulo":"Persona moral extranjera: la estructura y el propietario real NO se quitan.","texto":"Sale de la lista de datos el nombre de los administradores (salvo en la ITF) y el documento de existencia va <b>legalizado o apostillado<\/b>, pero se recaba la información del <b>inciso c) de la fr. II<\/b>: estructura accionaria, estructura corporativa si el riesgo no es bajo y propietarios reales (Bancos 4ª fr. III b) ii.1)."},{"titulo":"Terceros: no todos son «igual que un Cliente».","texto":"Igual que al Cliente: <b>cotitulares<\/b>, <b>terceros autorizados<\/b> y, sólo en SOFOM y Uniones, <b>coacreditados y obligados solidarios<\/b> (4ª VII). <b>Proveedores de recursos<\/b>: sólo datos (4ª V). <b>Beneficiarios<\/b>: datos mínimos y documentos hasta que ejercen sus derechos (4ª VIII). <b>Deudores de cobro<\/b>: sólo SOFOM, sólo datos (nombre y RFC siempre; lo demás, si la entidad cuenta con ello). <b>Propietario real<\/b>: datos y documentos de PF, con domicilio de localización y sin comprobante si el Cliente es de riesgo bajo (4ª VI); en la ITF, sólo datos."},{"titulo":"Aquí sólo se ubica; se estudia en su tema.","texto":"<b>Propietario real<\/b> (porcentajes, cascada, Lineamientos que orientan): 2.1.16 (H6). <b>Lista de Personas Bloqueadas<\/b>: no está en la política de identificación de ninguna DCG; capítulo propio, 2.1.8 (H3). <b>Centros cambiarios<\/b> no identifica a distancia: 2.1.12 (H5). <b>Conservación<\/b> (10 años; Asesores 5): 2.1.6 (H3)."}],"secciones":[{"tipo":"mapa","id":"mapa","nav":"Mapa 3 · 8 · 6 · 6","titulo":"Los dos temas en 23 elementos, en orden","intro":"Ritmo <b>3 · 8 · 6 · 6 = 23<\/b>. Primero el <b>2.1.1<\/b>. Luego el <b>2.1.2<\/b> con la estructura de la clase de Maribel: <b>01 Identificación<\/b>, ocho preguntas que hay que hacerse antes de armar un expediente (entidad · relación · persona · nacionalidad · terceros · forma · riesgo · operación); <b>02 Mecanismos, 03 Reglas y 04 Situaciones de riesgo<\/b>; y la <b>política de conocimiento<\/b>. Toca un elemento para ver a Bancos y las diferencias por sujeto.","centro":{"t":"2.1.1 · 2.1.2","s":"12 DCG<br>3 · 8 · 6 · 6"},"ramas":[{"letra":"1","titulo":"2.1.1 Objetivo","pregunta":"¿Para qué, a quién y con quién?","ritmo":"¿Para qué?","corto":"2.1.1","color":"oscuro","items":[{"etiqueta":"1ª","nombre":"Objeto de las DCG","sub":"2.1.1 · 1ª de cada DCG","verbo":"Prevengo","desc":"Fijan las medidas mínimas para prevenir y detectar operaciones ligadas a FT (139 Quáter) y ORPI (400 Bis), y cómo reportarlas a la SHCP por conducto de la CNBV.","orden":1,"panel":"2.1.1 · 1ª de cada DCG","puntos":["<b>Bancos (1ª):<\/b> dos objetos: medidas y procedimientos mínimos para prevenir y detectar actos u operaciones vinculados con los arts. 139 Quáter y 400 Bis del CPF, y términos para reportar a la SHCP, por conducto de la CNBV, operaciones de clientes, usuarios, consejeros, directivos, funcionarios, empleados y apoderados. Fundamento: art. 115 LIC.","Cada DCG cambia su <b>fundamento<\/b>: Casas de bolsa 212 LMV · Asesores 226 Bis LMV · Fondos 91 LFI · SOCAP 71 y 72 LRASCAP · SOFIPO 124 LACP · Uniones 129 LUC · Casas de cambio 95 LGOAAC · Centros cambiarios y Transmisores 95 Bis LGOAAC · ITF 58 LRITF.","<b>SOFOM<\/b>: fundamento múltiple: reguladas por el 87-D LGOAAC (remite a 115 LIC, 71-72 LRASCAP, 124 LACP o 129 LUC) y no reguladas por el 95 Bis LGOAAC. Si transmite dinero, cumple además las DCG de transmisores.","<b>ITF<\/b> (art. 1): su objeto incluye presentar el <b>Manual de Cumplimiento<\/b> a la CNBV.","<b>Fondos<\/b>: excluye ciertos capítulos para las actividades de los arts. 39 Bis fr. V y 40 Bis LFI."],"ir":"#t2-1-1","destacado":false},{"etiqueta":"2ª","nombre":"Sujeto obligado","sub":"2.1.1 · 2ª de cada DCG","verbo":"Delimito","desc":"Cada DCG dice a quién obliga. Ojo con las que abarcan a más de un tipo: SOFOM reguladas y no reguladas; SOFIPO con SOFINCO; SOCAP sólo niveles I a IV.","orden":2,"panel":"2.1.1 · 2ª de cada DCG","puntos":["<b>Bancos (2ª XI):<\/b> «Entidades» = instituciones de crédito. La 2ª XXXVI excluye expresamente a los centros cambiarios del 95 Bis LGOAAC de los «Sujetos Obligados».","<b>SOFOM (2ª IX):<\/b> reguladas <b>y<\/b> no reguladas.","<b>SOCAP (2ª XXXV):<\/b> con niveles de operación <b>I a IV<\/b>.","<b>SOFIPO (2ª XI):<\/b> SOFIPO, <b>SOFINCO<\/b> niveles I a IV y Organismos de Integración Financiera Rural.","<b>Centros cambiarios (2ª II):<\/b> sociedades anónimas que realizan habitual y profesionalmente las actividades del 81-A LGOAAC.","<b>ITF (art. 2):<\/b> IFC e IFPE; su «Cliente» incluye a quien opera con Sociedades Autorizadas (modelos novedosos)."],"ir":"#t2-1-1","destacado":false},{"etiqueta":"2ª","nombre":"Cliente vs. Usuario","sub":"2.1.1 · Definiciones de la 2ª","verbo":"Distingo","desc":"Cliente = relación al amparo de un contrato; Usuario = opera sin relación comercial permanente. No todas las DCG tienen las dos figuras.","orden":3,"panel":"2.1.1 · Definiciones de la 2ª","puntos":["<b>Bancos:<\/b> Cliente (2ª IV) es cuentahabiente o usa servicios al amparo de un contrato; Usuario (2ª XXXVIII) opera sin relación comercial permanente.","<b>Cliente y Usuario:<\/b> Bancos, SOFOM, Casas de bolsa, SOCAP y SOFIPO.","<b>Sólo Cliente:<\/b> Asesores, Fondos, Uniones e ITF.","<b>Sólo Usuario:<\/b> Casas de cambio, Centros cambiarios y Transmisores (remitente y beneficiario).","SOFOM: Cliente = acreditado <b>o<\/b> quien opera al amparo de un contrato. SOCAP: Cliente = socios y terceros. SOCAP y SOFIPO: el Usuario no tiene relación «patrimonial, ni comercial permanente»."],"ir":"#t2-1-1","destacado":false}]},{"letra":"2","titulo":"2.1.2 · 01 Identificación","pregunta":"8 preguntas antes de armar un expediente","ritmo":"¿Quién es?","corto":"Identifico","color":"principal","items":[{"etiqueta":"1","nombre":"¿Qué entidad soy?","sub":"Política y Manual · 3ª, 22ª, 64ª","verbo":"Me ubico","desc":"Cada DCG pide cosas distintas. La política de identificación y la de conocimiento viven en el Manual de Cumplimiento, que se remite a la CNBV.","orden":4,"panel":"Política y Manual · 3ª, 22ª, 64ª","puntos":["<b>Bancos:<\/b> política de identificación (3ª) y de conocimiento (22ª) en el Manual; modificaciones a la CNBV en <b>20 días hábiles<\/b> desde que las aprueba el comité de auditoría (64ª).","Asesores: corre desde que <b>el Representante<\/b> las elabora (30ª fr. II). SOCAP y SOFIPO también las envían a su Comité de Supervisión (Auxiliar) (67ª).","Sin comité de auditoría aprueba el propio Comité en SOFOM (también consejo o director general), Fondos, SOCAP, Casas de cambio, Centros cambiarios y Transmisores; SOFIPO, «o su equivalente»; Uniones, «comité de auditoría o Comité» (53ª).","ITF: contenido mínimo de 6 fracciones (art. 10)."],"ir":"#t2-1-2","destacado":true},{"etiqueta":"2","nombre":"¿Cliente o Usuario?","sub":"2ª de cada DCG","verbo":"Contrato","desc":"Con contrato es Cliente; sin relación permanente, Usuario. Del Usuario se piden datos por escalones de monto; del Cliente, expediente completo.","orden":5,"panel":"2ª de cada DCG","puntos":["Sólo Cliente: Asesores, Fondos, Uniones e ITF. Sólo Usuario: Casas de cambio, Centros cambiarios y Transmisores.","Usuario en efectivo (Bancos 17ª): datos desde <b>500 USD<\/b>; copia de identificación de 3,000 a menos de 5,000; expediente desde <b>5,000<\/b>. Casas de cambio y Centros arrancan en <b>1,000<\/b>.","Ver la tabla «Usuarios y operaciones»."],"ir":"#t2-1-2-operaciones","destacado":false},{"etiqueta":"3","nombre":"¿Física, moral o fideicomiso?","sub":"4ª fr. I, II y IX","verbo":"Identifico","desc":"Cada tipo de persona tiene su lista de datos y documentos. Gancho de datos: desde que naciste · a qué te dedicas · dónde vives · cómo te localizo · sólo ITF.","orden":6,"panel":"4ª fr. I, II y IX","puntos":["PF (4ª I): 12 datos y 5 documentos; comprobante de domicilio de máximo 3 meses.","PM (4ª II): estructura accionaria <b>siempre<\/b>; corporativa si el riesgo no es bajo; declaración sobre propietarios reales.","Fideicomiso (4ª IX): Cliente en Bancos, SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO y Uniones; la ITF no lo regula.","Ver los tableros de persona física y de persona moral y fideicomiso."],"ir":"#t2-1-2-pf","destacado":true},{"etiqueta":"4","nombre":"¿Mexicano o extranjero?","sub":"4ª fr. III a) y b)","verbo":"Quito","desc":"Del extranjero no residente se quita sólo la entidad de nacimiento; cambian la identificación (pasaporte) y el domicilio (el de su residencia).","orden":7,"panel":"4ª fr. III a) y b)","puntos":["PF extranjera: datos iguales salvo la entidad federativa de nacimiento (Asesores ni eso).","Documentos: pasaporte y documento del INM o tarjeta SRE; domicilio en su lugar de residencia; declaración.","PM extranjera: documento legalizado o apostillado; <b>estructura y propietario real se mantienen<\/b>."],"ir":"#t2-1-2-pf","destacado":false},{"etiqueta":"5","nombre":"¿Hay terceros?","sub":"4ª fr. V a VIII","verbo":"Amplío","desc":"No sólo se identifica al cliente: cotitulares, terceros autorizados, beneficiarios, proveedores de recursos, propietario real; cada uno con distinta profundidad.","orden":8,"panel":"4ª fr. V a VIII","puntos":["Igual que a un Cliente: cotitulares y terceros autorizados; coacreditados y obligados solidarios sólo en SOFOM y Uniones.","Sólo datos: proveedores de recursos; deudores de cobro (sólo SOFOM).","Beneficiarios: datos mínimos; documentos cuando ejercen derechos."],"ir":"#t2-1-2-terceros","destacado":false},{"etiqueta":"6","nombre":"¿Presencial o remota?","sub":"4ª Ter · 7ª · Anexo 2","verbo":"Geolocalizo","desc":"A distancia se abre con geolocalización, identificación digital y los topes de cada Anexo 2. Centros cambiarios no lo prevé.","orden":9,"panel":"4ª Ter · 7ª · Anexo 2","puntos":["Bancos 4ª Ter: geolocalización (salvo Anexo 1 de riesgo bajo) y, desde 2024, comprobante de domicilio digital.","Topes del Anexo 2: 30 · 60 · 100 mil UDIS según sujeto y producto; Transmisores 5,000 / 7,000 USD; Casas de cambio hasta 5,000 USD con aprobación de la CNBV."],"ir":"#t2-1-2-niveles","destacado":false},{"etiqueta":"7","nombre":"¿Riesgo normal o bajo?","sub":"4ª IV · 14ª y equivalentes · Anexo 1","verbo":"Simplifico","desc":"Con riesgo bajo se piden menos datos: Anexo 1, productos que fija la entidad, niveles de cuenta, crédito pequeño o contratos chicos, según el sujeto.","orden":10,"panel":"4ª IV · 14ª y equivalentes · Anexo 1","puntos":["Anexo 1 sólo con riesgo bajo; Bancos 2024 agregó la fr. IV Bis para gobierno con riesgo distinto a bajo.","Niveles: Bancos 750 · 3,000 · 10,000 · fr. IV 30,000 UDIS; ITF 750 · 3,000 · 1,700 en transferencias internacionales.","Casas de cambio 9a: medios electrónicos inferiores a 2,000 UDIS al mes."],"ir":"#t2-1-2-niveles","destacado":false},{"etiqueta":"8","nombre":"¿Qué operación?","sub":"16ª · 17ª · 14ª Bis-1","verbo":"Escalono","desc":"Efectivo, cheques, transferencias, bolsa y activos virtuales tienen reglas propias: datos «pegados» sin importar el monto y escalones por monto.","orden":11,"panel":"16ª · 17ª · 14ª Bis-1","puntos":["Transferencias: datos del ordenante sin importar el monto; escalones de Usuarios 1,000 / 3,000 / 5,000 USD (Transmisores desde 500).","Cheques de caja con Usuarios ≥ 10,000 USD: expediente (sólo Bancos).","Bolsas de valores: sólo Casas de bolsa. Activos virtuales: Bancos (si Banxico autoriza) e ITF."],"ir":"#t2-1-2-operaciones","destacado":false}]},{"letra":"3","titulo":"2.1.2 · 02 Mecanismos · 03 Reglas · 04 Riesgo","pregunta":"¿Cómo vigilo y cómo guardo?","ritmo":"¿Cómo vigilo?","corto":"Vigilo","color":"negro","items":[{"etiqueta":"18ª","nombre":"Seguimiento y agrupación","sub":"Bancos 18ª y equivalentes","verbo":"Agrupo","desc":"Se siguen y agrupan por mes las operaciones en moneda extranjera desde 500 USD y en efectivo nacional por encima de 300 mil (PF) o 500 mil pesos (PM).","orden":12,"panel":"Bancos 18ª y equivalentes","puntos":["Bancos: moneda extranjera en efectivo o cheques de viajero <b>≥ 500 USD<\/b>; efectivo MN <b>> 300,000<\/b> PF y <b>> 500,000<\/b> PM o fideicomiso; mes calendario.","Casas de cambio y Centros cambiarios: desde <b>1,000 USD<\/b>; Centros, sin umbral en pesos.","Asesores no lo prevé; la ITF agrupa todo, sin importar el monto (art. 43)."],"ir":"#t2-1-2-mecanismos","destacado":false},{"etiqueta":"18ª","nombre":"Escalamiento de aprobación","sub":"Bancos 18ª, penúltimo párrafo","verbo":"Escalo","desc":"Recibir mucho efectivo en sucursal exige aprobación interna de un nivel superior: más de 7,500 USD o 300 mil pesos (PF); más de 50 mil USD o 500 mil pesos (PM).","orden":13,"panel":"Bancos 18ª, penúltimo párrafo","puntos":["Excepciones: Centros cambiarios 5,000 / 8,000 USD; Transmisores 10,000 USD para PF.","Fondos no fija montos; Asesores e ITF no lo prevén."],"ir":"#t2-1-2-mecanismos","destacado":false},{"etiqueta":"20ª","nombre":"Seguimiento más estricto","sub":"Bancos 20ª · ITF art. 43","verbo":"Vigilo","desc":"Quien acumula en un mes 1 millón de pesos o 100 mil dólares en efectivo recibe un registro y seguimiento más estricto. La ITF usa UDIS.","orden":14,"panel":"Bancos 20ª · ITF art. 43","puntos":["Bancos: ≥ 1,000,000 MN o ≥ 100,000 USD en un mes calendario.","Fondos sólo en pesos; Centros sólo en dólares.","ITF: IFC 12,500 UDIS; IFPE 7,500 UDIS."],"ir":"#t2-1-2-mecanismos","destacado":false},{"etiqueta":"4ª · 59ª","nombre":"Reglas de expedientes","sub":"Bancos 4ª, 8ª, 9ª y 59ª","verbo":"Conservo","desc":"Un expediente por cliente para todos sus contratos, que puede guardarse por partes con un sistema; en grupo financiero puede integrarlo otra entidad. Se conserva 10 años.","orden":15,"panel":"Bancos 4ª, 8ª, 9ª y 59ª","puntos":["Expediente compartido en grupo: Bancos 9ª y equivalentes; no lo prevén SOCAP, Uniones, Centros ni Transmisores.","Conservación: 10 años (Bancos 59ª); <b>Asesores, 5<\/b> (37ª): se estudia en 2.1.6 (H3)."],"ir":"#t2-1-2-reglas","destacado":false},{"etiqueta":"15ª Bis · 21ª","nombre":"Verificación y actualización","sub":"Bancos 15ª Bis y 21ª","verbo":"Actualizo","desc":"Se verifican datos y documentos y se actualizan expedientes: los de riesgo alto, al menos una vez al año; la ITF, todos cada año.","orden":16,"panel":"Bancos 15ª Bis y 21ª","puntos":["Bancos: verificación posterior con riesgo bajo, sin operar antes (15ª Bis). PM de riesgo bajo: puede no actualizarse (21ª).","Transmisores no difiere la verificación; Centros no tiene disposición de verificación equivalente.","Visita domiciliaria a riesgo alto: en los supuestos que fije el Manual."],"ir":"#t2-1-2-reglas","destacado":false},{"etiqueta":"10ª–10ª Ter","nombre":"Situaciones de riesgo","sub":"Bancos 10ª, 10ª Bis y 10ª Ter","verbo":"Suspendo","desc":"Prohibidas las cuentas anónimas; ante sospecha no se aplican medidas simplificadas y se puede suspender la identificación con reporte de 24 horas.","orden":17,"panel":"Bancos 10ª, 10ª Bis y 10ª Ter","puntos":["Suspensión «podrá»: posible FT u ORPI, riesgo de alertar al cliente o riesgos del Manual; ROI de 24 horas.","ITF (art. 28): sólo si continuar alertaría al cliente; el plazo de 24 horas puede venir del art. 73 fr. I."],"ir":"#t2-1-2-reglas","destacado":false}]},{"letra":"4","titulo":"2.1.2 · Conocimiento","pregunta":"¿Lo conozco? · Bancos Cap. III (22ª–32ª)","ritmo":"¿Lo conozco?","corto":"Conozco","color":"oscuro","items":[{"etiqueta":"22ª–25ª Quáter","nombre":"Perfil transaccional","sub":"Bancos 22ª a 24ª y 25ª Quáter","verbo":"Perfilo","desc":"Qué se espera que haga el cliente: monto, número, tipo y frecuencia, origen y destino. Perfil inicial con 6 meses; se evalúa al menos cada 6 meses.","orden":18,"panel":"Bancos 22ª a 24ª y 25ª Quáter","puntos":["<b>Bancos:<\/b> perfil (24ª); perfil inicial con los primeros 6 meses; evaluación <b>al menos cada 6 meses<\/b> (25ª Quáter).","SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones: <b>dos evaluaciones por año calendario<\/b>.","<b>Asesores:<\/b> <b>una<\/b> por año calendario.","<b>ITF:<\/b> = Bancos (al menos cada 6 meses)."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"25ª · 25ª Bis","nombre":"Grado de riesgo del cliente","sub":"Bancos 25ª, 25ª Bis y 28ª","verbo":"Califico","desc":"Cada cliente recibe un grado de riesgo que decide cuánto se le pide y vigila. Bancos usa un modelo aprobado por su comité de riesgos; los demás, mínimos de 2 o 3 grados.","orden":19,"panel":"Bancos 25ª, 25ª Bis y 28ª","puntos":["<b>Bancos:<\/b> modelo de evaluación de riesgos coherente con la metodología del Cap. II Bis y diseñado conforme al Anexo 3, <b>aprobado por el comité de riesgos<\/b>; evaluación al menos cada 6 meses (25ª Bis); clasificar al inicio (28ª).","SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones y Cambios y envíos: mínimo <b>2 grados para PF<\/b> (alto y bajo) y <b>3 para PM y fideicomisos<\/b>.","<b>ITF<\/b> (arts. 29-30): mínimo <b>3 grados para todos<\/b>, cada 6 meses."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"2ª XXXI · 26ª","nombre":"Personas políticamente expuestas","sub":"Bancos 2ª XXXI y 26ª","verbo":"Señalo","desc":"Quien tiene o tuvo una función pública destacada y sus allegados. La PEP nacional lo sigue siendo un año después de dejar el cargo; si es de alto riesgo, la aprueba un directivo.","orden":20,"panel":"Bancos 2ª XXXI y 26ª","puntos":["<b>Bancos:<\/b> se asimilan cónyuge, concubina o concubinario, parientes hasta el <b>2º grado<\/b> y PM con vínculo patrimonial; PEP nacional, <b>1 año<\/b> después del cargo (2ª XXXI).","PEP de alto riesgo: aprobación de un directivo para iniciar o continuar (26ª).","Igual que Bancos, salvo la <b>ITF<\/b> (art. 39): aprobación de directivo para <b>cualquier PEP<\/b>.","Igual que Bancos, salvo <b>Transmisores<\/b>: también aprueba «una persona con nivel de alta responsabilidad»."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"27ª · 28ª","nombre":"Alto riesgo y aprobación","sub":"Bancos 27ª y 28ª","verbo":"Apruebo","desc":"Abrir a un cliente de alto riesgo exige la aprobación previa de un directivo. Bancos fija tres de alto riesgo mínimo; casi todas las demás, sólo las PEP extranjeras.","orden":21,"panel":"Bancos 27ª y 28ª","puntos":["<b>Bancos<\/b> (28ª), alto riesgo como mínimo: <b>no residentes de banca privada, PEP extranjeras y PM que operan efectivo en USD<\/b>.","SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones, Casas de cambio, Centros cambiarios y Transmisores: <b>sólo PEP extranjeras<\/b>.","<b>ITF<\/b> (art. 33): no residentes del art. 70 fr. X y PEP extranjeras.","Cambios y envíos: la aprobación es antes de la <b>Operación<\/b>."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"29ª · 30ª","nombre":"Corresponsalía","sub":"Bancos 29ª y 30ª","verbo":"Filtro","desc":"Relaciones con instituciones del extranjero: aprobación a nivel directivo y debida diligencia; prohibido operar con bancos sin presencia física.","orden":22,"panel":"Bancos 29ª y 30ª","puntos":["<b>Bancos:<\/b> aprobación a nivel directivo (29ª); diligencia reforzada con jurisdicciones de riesgo y prohibición de bancos <i>shell<\/i> (30ª).","La tienen: Bancos, Casas de bolsa, Fondos, SOCAP y SOFIPO (estas dos, contrapartes «relacionadas con su objeto»).","<b>No la prevén:<\/b> SOFOM, Asesores, Uniones, Casas de cambio, Centros cambiarios, Transmisores e ITF."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"31ª · 32ª","nombre":"Propietario real (ubicación)","sub":"Bancos 2ª XXXII, 31ª y 32ª","verbo":"Destapo","desc":"Quién está detrás del cliente. Aquí sólo dónde lo definen y aplican las DCG; el 25 %, la cascada y los Lineamientos se estudian en 2.1.16.","orden":23,"panel":"Bancos 2ª XXXII, 31ª y 32ª","puntos":["<b>Bancos:<\/b> definición en la 2ª XXXII (incluye Control, 25 % o más, 2ª VII); se aplica en la 4ª, 10ª, 31ª y 32ª.","Todas las DCG lo definen en su 2ª o art. 2 y lo aplican en el expediente.","Las DCG <b>obligan<\/b>; los Lineamientos de 2019 <b>orientan<\/b>.","Desarrollo completo: <b>2.1.16 Propietario real (H6)<\/b>."],"ir":"#t2-1-2-terceros","destacado":false}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por elemento","html":"<b>Prevengo<\/b>, <b>Delimito<\/b> y <b>Distingo<\/b> · <b>Me ubico<\/b>, <b>Contrato<\/b>, <b>Identifico<\/b>, <b>Quito<\/b>, <b>Amplío<\/b>, <b>Geolocalizo<\/b>, <b>Simplifico<\/b> y <b>Escalono<\/b> · <b>Agrupo<\/b>, <b>Escalo<\/b>, <b>Vigilo<\/b>, <b>Conservo<\/b>, <b>Actualizo<\/b> y <b>Suspendo<\/b> · <b>Perfilo<\/b>, <b>Califico<\/b>, <b>Señalo<\/b>, <b>Apruebo<\/b>, <b>Filtro<\/b> y <b>Destapo<\/b>."}},{"tipo":"tarjetas","id":"t2-1-1","nav":"2.1.1 Objetivo","titulo":"2.1.1 · Objetivo","intro":"Tres preguntas: <b>¿para qué?<\/b> (1ª), <b>¿a quién obliga?<\/b> (2ª) y <b>¿con quién opera?<\/b> (Cliente o Usuario, 2ª). Bancos primero; después, sujeto por sujeto, en el orden de las familias. Las familias son una <b>agrupación didáctica<\/b> de 360Educa: orientan, pero las diferencias se aprenden sujeto por sujeto.","tarjetas":[{"barra":true,"color":"principal","titulo":"Bancos · el eje","ref":"1ª · art. 115 LIC","ancho":true,"html":"Dos objetos: (i) <b>medidas y procedimientos mínimos<\/b> para prevenir y detectar actos u operaciones que puedan favorecer los delitos de los arts. <b>139 Quáter<\/b> (financiamiento al terrorismo) y <b>400 Bis<\/b> (operaciones con recursos de procedencia ilícita) del Código Penal Federal; (ii) los términos para <b>reportar a la SHCP, por conducto de la CNBV<\/b>, actos y operaciones de clientes y usuarios, y de consejeros, directivos, funcionarios, empleados y apoderados."},{"encabezado":true,"color":"principal","titulo":"Crédito","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"Bancos","v":"Art. 115 LIC · «Entidades» = instituciones de crédito (2ª XI)"},{"k":"SOFOM","v":"Igual que Bancos, salvo: fundamento múltiple: <b>reguladas<\/b> por el 87-D LGOAAC (remite a 115 LIC, 71-72 LRASCAP, 124 LACP o 129 LUC) y <b>no reguladas<\/b> por el 95 Bis LGOAAC; obliga a ambas (2ª IX). Si transmite dinero, cumple también las DCG de transmisores"}]},{"encabezado":true,"color":"morado","titulo":"Bursátil","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"Casas de bolsa","v":"Art. 212 LMV"},{"k":"Asesores","v":"Art. 226 Bis LMV · personas del art. 225 LMV (2ª II)"},{"k":"Fondos","v":"Art. 91 LFI · excluye ciertos capítulos para las actividades de los arts. 39 Bis fr. V y 40 Bis LFI (1ª)"}]},{"encabezado":true,"color":"turquesa","titulo":"Ahorro popular","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"SOCAP","v":"Arts. 71 y 72 LRASCAP · sólo niveles de operación <b>I a IV<\/b> (2ª XXXV)"},{"k":"SOFIPO","v":"Art. 124 LACP · incluye <b>SOFINCO<\/b> niveles I a IV y Organismos de Integración Financiera Rural (2ª XI)"},{"k":"Uniones","v":"Art. 129 LUC"}]},{"encabezado":true,"color":"coral","titulo":"Cambios y envíos","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"Casas de cambio","v":"Art. 95 LGOAAC"},{"k":"Centros cambiarios","v":"Art. 95 Bis LGOAAC · sociedades anónimas del 81-A LGOAAC (2ª II)"},{"k":"Transmisores","v":"Art. 95 Bis LGOAAC"}]},{"encabezado":true,"color":"amarillo","titulo":"Fintech","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"ITF","v":"Art. 58 LRITF · IFC e IFPE (art. 2). Su objeto incluye presentar el <b>Manual de Cumplimiento<\/b> a la CNBV (art. 1)"}]},{"encabezado":true,"color":"principal","titulo":"Cliente y Usuario","subtitulo":"Las dos figuras","filas":[{"k":"Bancos","v":"Cliente: cuentahabiente o usa servicios al amparo de un contrato (2ª IV). Usuario: sin relación comercial permanente (2ª XXXVIII)"},{"k":"SOFOM","v":"Cliente: acreditado <b>o<\/b> quien opera al amparo de un contrato. Usuario: sin crédito, arrendamiento financiero ni factoraje"},{"k":"Casas de bolsa","v":"= Bancos: Usuario es quien no celebró contrato"},{"k":"SOCAP · SOFIPO","v":"SOCAP: Cliente = socios y terceros. En ambas, el Usuario no tiene relación «patrimonial, ni comercial permanente»"}]},{"encabezado":true,"color":"oscuro","titulo":"Sólo Cliente","subtitulo":"No existe el Usuario","filas":[{"k":"Asesores","v":"Opera al amparo de un contrato (2ª III)"},{"k":"Fondos","v":"Quien realice Operaciones (2ª III)"},{"k":"Uniones","v":"Socios o terceros (2ª III)"},{"k":"ITF","v":"PF o PM, <b>sin fideicomiso<\/b> (art. 2 IV). «Usuario» sólo en la transmisión de dinero de las IFPE (art. 100)"}]},{"encabezado":true,"color":"negro","titulo":"Sólo Usuario","subtitulo":"No existe el Cliente","filas":[{"k":"Casas de cambio","v":"2ª XXXIV; excluye a las entidades financieras que le proveen"},{"k":"Centros cambiarios","v":"2ª XXVI; misma exclusión"},{"k":"Transmisores","v":"2ª XXXIX: Usuario <b>Remitente<\/b> y Usuario <b>Beneficiario<\/b>"}]}],"nota":"Agrupación útil que <b>sí<\/b> es legal: el <b>95 Bis LGOAAC<\/b> junta a centros cambiarios, transmisores y SOFOM no reguladas. Las familias de color no salen de la ley."},{"tipo":"tarjetas","id":"t2-1-2","nav":"2.1.2 Política","titulo":"2.1.2 · Política de identificación y conocimiento del cliente o usuario","intro":"Son <b>dos políticas<\/b> y el nombre del tema las trae: <b>identificación<\/b> (¿quién es?, Bancos Cap. II, 3ª–21ª) y <b>conocimiento<\/b> (¿qué hace y cuánto riesgo implica?, Cap. III, 22ª–32ª). La identificación se arma en cuatro bloques: <b>01 Identificación<\/b> (las 8 preguntas de abajo), <b>02 Mecanismos<\/b>, <b>03 Reglas de expedientes<\/b> y <b>04 Situaciones de riesgo<\/b>.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"01 · Las 8 preguntas antes de armar un expediente","subtitulo":"Estructura de la clase de Maribel · cada respuesta cambia lo que se pide","ancho":true,"filas":[{"k":"1 · Entidad","v":"¿Qué sujeto soy? Cada una de las 12 DCG pide cosas distintas. → <b>tableros<\/b> de esta sección"},{"k":"2 · Relación","v":"¿Cliente (con contrato) o Usuario (sin relación permanente)? → 2.1.1 y <b>Usuarios y operaciones<\/b>"},{"k":"3 · Persona","v":"¿Física, moral o fideicomiso? → <b>Persona física<\/b> · <b>Persona moral y fideicomiso<\/b>"},{"k":"4 · Nacionalidad","v":"¿Mexicana o residente, o extranjera? → «¿qué quitamos?» en los dos tableros"},{"k":"5 · Terceros","v":"Cotitulares, terceros autorizados, coacreditados, beneficiarios, proveedores de recursos, propietario real → <b>Terceros<\/b>"},{"k":"6 · Forma","v":"¿Presencial o remota? → <b>Niveles y no presencial<\/b>"},{"k":"7 · Riesgo","v":"¿Normal o simplificada (bajo riesgo, Anexo 1, niveles)? → <b>Niveles y no presencial<\/b> · tablero de operaciones"},{"k":"8 · Operación","v":"¿Efectivo, transferencia, bolsa de valores o activos virtuales? → <b>Usuarios y operaciones<\/b>"}]},{"barra":true,"color":"negro","titulo":"Reforma posterior al temario (DOF 10-jul-2026)","ref":"Bancos 4ª, 4ª Bis, 4ª Ter, 7ª, 14ª Bis","ancho":true,"html":"Después del temario, Bancos agregó el <b>nivel de cuenta 2 Bis<\/b> (hasta 15,000 UDIS de abonos al mes, máximo 3,000 UDIS en efectivo, sólo PF mexicanas residentes), la <b>CURP biométrica<\/b>, ajustes a la lista de identificaciones válidas y la <b>verificación de documentos en contratación remota<\/b> (7ª). Ojo: la matrícula consular y la identificación electrónica <b>ya<\/b> eran válidas en la versión del 28-ago-2024. <b>El examen usa la versión del 28-ago-2024<\/b>: esta nota es para que no te sorprenda en la práctica; ningún reactivo depende de ella."},{"barra":true,"color":"principal","titulo":"Bancos · política y Manual","ref":"3ª, 22ª, 64ª","ancho":true,"html":"Política de <b>identificación<\/b> (3ª: incluye verificar y actualizar datos, y lineamientos para Usuarios de la 17ª a la 20ª) y de <b>conocimiento<\/b> (22ª), ambas en el Manual. El Manual se <b>remite a la CNBV<\/b>; sus modificaciones, con un ejemplar completo, <b>dentro de 20 días hábiles<\/b> desde que las aprueba el <b>comité de auditoría<\/b>, al que se las somete el Comité de Comunicación y Control (64ª y 43ª fr. I)."},{"encabezado":true,"color":"principal","titulo":"Crédito","subtitulo":"Política y Manual · igual que Bancos, salvo…","filas":[{"k":"SOFOM","v":"= Bancos en el plazo; sin comité de auditoría aprueba su Comité, su consejo o su director general (35ª fr. I)"}]},{"encabezado":true,"color":"morado","titulo":"Bursátil","subtitulo":"Política y Manual · igual que Bancos, salvo…","filas":[{"k":"Casas de bolsa","v":"= Bancos (3ª, 20ª, 63ª)"},{"k":"Asesores","v":"Los 20 días hábiles corren desde que <b>el Representante elabora<\/b> las modificaciones (30ª fr. II); no hay com -2-mecanismos","filas":4,"columnas":4},{"tipo":"tarjetas","id":"t2-1-2-reglas","titulo":"2.1.2 · 03 Reglas de expedientes · 04 Situaciones de riesgo","intro":"Qué se hace con los expedientes una vez armados y qué pasa si algo huele mal al iniciar la relación.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"03 · Manejo de expedientes","subtitulo":"Bancos 4ª, 8ª, 9ª, 15ª Bis, 21ª y 59ª","filas":[{"k":"Uno por cliente","v":"Un expediente sirve para todas las cuentas o contratos del mismo Cliente (4ª; en Cambios y envíos, para todas las Operaciones del Usuario)"},{"k":"Por partes","v":"Datos y documentos pueden guardarse por separado si un sistema automatizado los conjunta (4ª; las 11 DCG, no la ITF)"},{"k":"En grupo financiero","v":"Otra entidad del grupo puede integrarlo con consentimiento del Cliente y convenio (Bancos 9ª). No lo prevén SOCAP, Uniones, Centros ni Transmisores; Asesores, con la entidad financiera relacionada (8ª); ITF art. 20"},{"k":"Qué incluye","v":"Datos, documentos, entrevista o mecanismo, visita y cuestionario de alto riesgo (Bancos 8ª)"},{"k":"Conservación","v":"Vigencia y 10 años desde que termina la relación; Usuarios, 10 años desde la operación (Bancos 59ª, Cap. XII). <b>Asesores, 5 años<\/b> (37ª). ITF lo dice en su capítulo de identificación (art. 25). → 2.1.6 (H3)"}]},{"encabezado":true,"color":"oscuro","titulo":"03 · Verificar y actualizar","subtitulo":"Bancos 15ª Bis y 21ª","filas":[{"k":"Verificar","v":"Datos y documentos; con riesgo bajo puede ser después de abrir, sin operar antes (15ª Bis). <b>Transmisores<\/b>: no se difiere (8ª Bis). <b>Centros cambiarios<\/b>: sin disposición equivalente"},{"k":"PM","v":"Expediente completo y actualizado con independencia del riesgo; con <b>riesgo bajo<\/b> se puede optar por no actualizar (21ª)"},{"k":"Riesgo alto","v":"Verificar al menos <b>una vez al año<\/b> (21ª). <b>ITF: todos los clientes<\/b>, una vez al año (art. 24)"},{"k":"Cambios o dudas","v":"Reclasificar a un grado superior y actualizar (21ª)"},{"k":"A distancia y visita","v":"Se <b>puede<\/b> actualizar sin presencia, cualquiera que haya sido la apertura (SOCAP y Centros cambiarios no lo prevén). Visita domiciliaria a riesgo alto en los <b>supuestos que fije el Manual<\/b>. Transmisores: expediente no presencial sin operar más de 180 días naturales, confirmar antes de volver a operar (12ª)"}]},{"encabezado":true,"color":"negro","titulo":"04 · Situaciones de riesgo","subtitulo":"Bancos 10ª, 10ª Bis y 10ª Ter","filas":[{"k":"Prohibido","v":"Cuentas o contratos anónimos, con nombres ficticios o sin poder identificar al Cliente o al Propietario Real (10ª). SOCAP y SOFIPO: tampoco aportaciones anónimas"},{"k":"Sin simplificar","v":"No se aplican medidas simplificadas ante <b>sospecha fundada o indicios<\/b> de 139 Quáter o 400 Bis (10ª Bis). ITF: basta «sospecha» (art. 27)"},{"k":"Suspender","v":"La entidad <b>podrá<\/b> suspender la identificación: (I) posible FT u ORPI; (II) continuar alertaría al cliente; (III) riesgos del Manual. Si suspende, <b>ROI de 24 horas<\/b> desde que conoce la información (10ª Ter)"},{"k":"ITF","v":"Art. 28: sólo el supuesto de alertar al cliente; el art. 28 no fija plazo y el de 24 horas puede venir del art. 73 fr. I"}]}]},{"tipo":"tarjetas","id":"t2-1-2-conocer","nav":"Conocimiento","titulo":"2.1.2 · Política de conocimiento: perfil, grado de riesgo, PEP, alto riesgo y corresponsalía","intro":"La segunda política del tema (Bancos Cap. III, 22ª–32ª): qué hace el cliente, cuánto riesgo implica, quién es de <b>alto riesgo<\/b> desde el inicio y quién lo aprueba.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Bancos · el eje","subtitulo":"22ª–25ª Quáter · 25ª Bis · 26ª–28ª","filas":[{"k":"Perfil","v":"Inicial con <b>6 meses<\/b>; evaluar <b>al menos cada 6 meses<\/b> (25ª Quáter)"},{"k":"Grado de riesgo","v":"Modelo coherente con la metodología del Cap. II Bis y diseñado conforme al Anexo 3, aprobado por el <b>comité de riesgos<\/b>; cada 6 meses (25ª Bis)"},{"k":"Alto riesgo mínimo","v":"No residentes de <b>banca privada<\/b>, <b>PEP extranjeras<\/b> y <b>PM con efectivo en USD<\/b> (28ª); los abre un <b>directivo<\/b> por escrito (27ª)"},{"k":"PEP","v":"Allegados hasta el <b>2º grado<\/b>; nacional, <b>1 año<\/b> después del cargo (2ª XXXI); PEP de alto riesgo: aprobación de directivo (26ª)"}]},{"encabezado":true,"color":"principal","titulo":"Crédito","subtitulo":"Conocimiento · igual que Bancos, salvo…","filas":[{"k":"SOFOM","v":"Sin Anexo 3 ni comité de riesgos: mínimo <b>2 grados PF / 3 PM y fideicomisos<\/b>; <b>dos evaluaciones por año calendario<\/b>. Alto riesgo mínimo: <b>sólo PEP extranjeras<\/b>"}]},{"encabezado":true,"color":"morado","titulo":"Bursátil","subtitulo":"Conocimiento · igual que Bancos, salvo…","filas":[{"k":"Casas de bolsa","v":"2 / 3 grados; dos evaluaciones por año. Sólo PEP extranjeras"},{"k":"Asesores","v":"2 / 3 grados; <b>una<\/b> evaluación por año. Sólo PEP extranjeras"},{"k":"Fondos","v":"2 / 3 grados; dos evaluaciones por año. Sólo PEP extranjeras"}]},{"encabezado":true,"color":"turquesa","titulo":"Ahorro popular","subtitulo":"Conocimiento · igual que Bancos, salvo…","filas":[{"k":"SOCAP","v":"2 / 3 grados; dos por año. Sólo PEP extranjeras"},{"k":"SOFIPO","v":"2 / 3 grados; dos por año. Sólo PEP extranjeras"},{"k":"Uniones","v":"2 / 3 grados; dos por año. Sólo PEP extranjeras"}]},{"encabezado":true,"color":"coral","titulo":"Cambios y envíos","subtitulo":"Conocimiento · igual que Bancos, salvo…","filas":[{"k":"Casas de cambio","v":"2 / 3 grados para Usuarios; su DCG no fija periodicidad de reevaluación. Sólo PEP extranjeras; aprobación antes de la <b>Operación<\/b>"},{"k":"Centros cambiarios","v":"Igual que Casas de cambio"},{"k":"Transmisores","v":"Igual que Casas de cambio. La PEP de alto riesgo también la aprueba «una persona con nivel de alta responsabilidad»"}]},{"encabezado":true,"color":"amarillo","titulo":"Fintech","subtitulo":"Conocimiento · igual que Bancos, salvo…","filas":[{"k":"ITF","v":"Mínimo <b>3 grados para todos<\/b>, cada 6 meses (arts. 29-30). Alto riesgo mínimo: no residentes del art. 70 fr. X y PEP extranjeras (art. 33). Aprobación de directivo para <b>cualquier PEP<\/b> (art. 39)"}]},{"barra":true,"color":"oscuro","titulo":"Corresponsalía: quién sí y quién no","ref":"Bancos 29ª y 30ª","ancho":true,"html":"<b>La tienen:<\/b> Bancos, Casas de bolsa, Fondos, SOCAP y SOFIPO (estas dos, sólo contrapartes «relacionadas con su objeto»). Bancos: aprobación a nivel directivo y diligencia reforzada con jurisdicciones de riesgo; las cinco prohíben la corresponsalía con intermediarios <b>sin presencia física<\/b>. <b>No la prevén:<\/b> SOFOM, Asesores, Uniones, Casas de cambio, Centros cambiarios, Transmisores e ITF."}],"nota":"Ritmo de reevaluación: <b>cada 6 meses<\/b> Bancos e ITF · <b>dos al año<\/b> SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones · <b>una al año<\/b> Asesores · Cambios y envíos, sin periodicidad en su DCG."},{"tipo":"tarjetas","id":"t2-1-2-figuras","titulo":"2.1.2 · Figuras propias y propietario real","intro":"Lo que cada sujeto identifica además del cliente ordinario. El propietario real sólo se ubica: su desarrollo está en <b>2.1.16 (H6)<\/b>.","tarjetas":[{"encabezado":true,"color":"oscuro","titulo":"Bancos · figuras propias","subtitulo":"5ª, 6ª, 9ª, 13ª, 14ª Quáter, 19ª","filas":[{"k":"5ª","v":"Contrato marco con medios de pago a terceros"},{"k":"6ª","v":"Cuenta Concentradora"},{"k":"9ª","v":"Expediente compartido en grupo financiero"},{"k":"13ª","v":"Cuentas de nómina (el expediente puede integrarlo el patrón)"},{"k":"14ª Quáter","v":"Cuentas para liquidar TPV, sin RFC"},{"k":"19ª","v":"Tarjetas prepagadas"}]},{"encabezado":true,"color":"principal","titulo":"Crédito","subtitulo":"Figuras propias · igual que Bancos, salvo…","filas":[{"k":"SOFOM","v":"Su 5ª trata <b>tarjetas de crédito<\/b> a terceros; coacreditados y obligados solidarios; prepagadas en moneda extranjera (15ª)"}]},{"encabezado":true,"color":"morado","titulo":"Bursátil","subtitulo":"Figuras propias · igual que Bancos, salvo…","filas":[{"k":"Casas de bolsa","v":"Concentradora, grupo financiero, medios de pago. Usuarios con efectivo ≥ 500 USD (15ª)"},{"k":"Asesores","v":"El Asesor que <b>no<\/b> está en el supuesto del 3er párrafo del art. 225 LMV puede dejar que la entidad financiera con que se relaciona integre y conserve el expediente (8ª)"},{"k":"Fondos","v":"Concentradora (excluida para los arts. 39 Bis y 40 Bis LFI)"}]},{"encabezado":true,"color":"turquesa","titulo":"Ahorro popular","subtitulo":"Figuras propias · igual que Bancos, salvo…","filas":[{"k":"SOCAP","v":"Aportaciones al capital social; cuentas de trabajadores de dependencias (12ª); <b>tarjetas recargables<\/b> (20ª); Usuarios en compraventa de divisas ≥ 500 USD (18ª)"},{"k":"SOFIPO","v":"Igual que SOCAP (aportaciones, tarjetas recargables; Usuarios ≥ 500 USD, 19ª)"},{"k":"Uniones","v":"Concentradora; coacreditados y obligados solidarios"}]},{"encabezado":true,"color":"coral","titulo":"Cambios y envíos","subtitulo":"Figuras propias · igual que Bancos, salvo…","filas":[{"k":"Casas de cambio","v":"Medios de pago de terceros (12ª); si distribuye acciones de fondos, se sujeta a las DCG de Fondos"},{"k":"Centros cambiarios","v":"Sin figuras propias en su capítulo de identificación"},{"k":"Transmisores","v":"<b>Agente Relacionado<\/b> (persona física), <b>Persona Jurídica Coadyuvante<\/b> (PM o PFAE) y <b>Tercero<\/b>; el transmisor responde por ellos (50ª)"}]},{"encabezado":true,"color":"amarillo","titulo":"Fintech","subtitulo":"Figuras propias · igual que Bancos, salvo…","filas":[{"k":"ITF","v":"<b>IFC vs. IFPE<\/b>: seguimiento más estricto en IFC desde <b>12,500 UDIS al mes<\/b> en efectivo o activos virtuales y en IFPE desde <b>7,500 UDIS<\/b> (art. 43); datos por operación con activos virtuales (art. 21); IFPE que transmite dinero, con Usuario (Título XV)"}]},{"barra":true,"color":"negro","titulo":"Propietario real · sólo dónde está","ref":"Bancos 2ª XXXII; 4ª; 10ª; 31ª; 32ª","ancho":true,"html":"Todas las DCG lo <b>definen<\/b> en su 2ª (ITF, art. 2) y lo <b>aplican<\/b> en el expediente, en la prohibición de cuentas anónimas y en «actúa por cuenta de otro». En Bancos incluye a quien ejerce el Control (25 % o más, 2ª VII). <b>Las DCG obligan; los Lineamientos de 2019 orientan.<\/b> Porcentajes, cascada al administrador y las tres vías de los Lineamientos: <b>2.1.16 Propietario real (H6)<\/b>."}]},{"tipo":"cifras","id":"cifras","nav":"Cifras","titulo":"2.1.1–2.1.2 · Cifras que preguntan","intro":"Cada número con su unidad y su disposición. Primero Bancos; entre paréntesis, quién más.","cifras":[["20","días hábiles","Para remitir a la CNBV las modificaciones al Manual, desde su aprobación (Asesores: desde que las elabora el Representante)","Bancos 64ª"],["3","meses","Antigüedad máxima del comprobante de domicilio de la persona física","Bancos 4ª fr. I b) iii"],["750","UDIS/mes","Nivel 1 de cuenta (saldo máximo 1,000 UDIS en Bancos); también ITF","Bancos 14ª Bis · ITF art. 12"],["30,000","UDIS/mes","Cuenta remota de PM o PFAE de la 14ª Bis fr. IV de Bancos; también es el tope del mecanismo del art. 4 del Anexo 2 en varias DCG (p. ej., Casas de bolsa, Fondos, Asesores, SOCAP, SOFIPO, Uniones; en SOFOM, sobre la línea de crédito)","Bancos 14ª Bis fr. IV"],["2,000","UDIS/mes","Casas de cambio: operaciones por medios electrónicos inferiores a este nivel, con datos mínimos","Casas de cambio 9a"],["1,700","UDIS/mes","ITF: transferencias internacionales con régimen simplificado","ITF art. 12"],["500","USD","Usuario en efectivo: desde aquí se recaban datos (Bancos); agrupación de moneda extranjera; Transmisores: primer escalón","Bancos 17ª y 18ª"],["1,000","USD","Primer escalón de Casas de cambio y Centros cambiarios; transferencias de Usuarios en Bancos","Casas de cambio 4a · Bancos 16ª"],["5,000","USD","Desde aquí, expediente completo del Usuario (y del fideicomiso Usuario)","Bancos 17ª"],["10,000","USD","Cheques de caja con Usuarios: expediente (sólo Bancos)","Bancos 17ª fr. II"],["300,000","pesos","Efectivo MN de PF: superior a esta cifra, agrupación y escalamiento (PM y fideicomiso: 500,000)","Bancos 18ª"],["7,500","USD","Escalamiento de aprobación para PF que entregan moneda extranjera en sucursal (PM: 50,000)","Bancos 18ª"],["1 millón","pesos/mes","Seguimiento más estricto (o 100,000 USD); ITF: 12,500 UDIS IFC y 7,500 IFPE","Bancos 20ª · ITF art. 43"],["24","horas","ROI al suspender el proceso de identificación","Bancos 10ª Ter"],["6","meses","Perfil y grado de riesgo iniciales; reevaluación al menos cada 6 meses (Bancos e ITF)","Bancos 25ª Bis y 25ª Quáter"],["1","año","Verificar expedientes de riesgo alto (ITF: todos); la PEP nacional lo sigue siendo tras dejar el cargo","Bancos 21ª y 2ª XXXI"]]},{"tipo":"simulador","id":"examen","nav":"Practicar ▸"}],"temas":{"2.1.1":"2.1.1 Objetivo","2.1.2":"2.1.2 Política de identificación y conocimiento"},"modos":[{"k":"t211","l":"2.1.1 Objetivo","tema":"2.1.1"},{"k":"t212","l":"2.1.2 Identificación y conocimiento","tema":"2.1.2"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Cifras y trampas","tipos":["cifra","trampa"]}],"banco":[{"id":"A001","tema":"2.1.1","tipo":"memoria","q":"Según la 1ª de las DCG de Bancos, ¿a quién y por qué conducto presentan las instituciones de crédito sus reportes de operaciones?","a":"A la SHCP, por conducto de la CNBV","o":["A la SHCP, por conducto de la CNBV","A la CNBV, por conducto de la SHCP y de su Unidad de Inteligencia Financiera","Directamente a la Unidad de Inteligencia Financiera, sin intermediario","Al Banco de México, por conducto de la CNBV y de su área de supervisión"],"x":"La 1ª fija dos objetos; el segundo son los términos para presentar a la Secretaría de Hacienda y Crédito Público, por conducto de la Comisión Nacional Bancaria y de Valores, los reportes de operaciones de clientes y usuarios (y de consejeros, directivos, funcionarios, empleados y apoderados). El distractor más tentador invierte los papeles: la CNBV es el conducto, no la destinataria.","ref":"DCG Bancos 1ª"},{"id":"A002","tema":"2.1.1","tipo":"caso","q":"Una persona tiene celebrado con una SOFOM un contrato de arrendamiento financiero. Para las DCG de SOFOM, ¿qué es esa persona?","a":"Cliente, porque utiliza los servicios de la SOFOM al amparo de un contrato","o":["Usuario, porque no es acreditada de la SOFOM ni tiene una cuenta abierta con ella","Usuario, porque la SOFOM no capta recursos y no hay cuenta","Cliente, porque utiliza los servicios de la SOFOM al amparo de un contrato","Cliente sólo si además tiene un crédito vigente con la SOFOM"],"x":"En la SOFOM, Cliente es quien es acreditado o quien utiliza, al amparo de un contrato, sus servicios (2ª III a y b). El Usuario es quien no contrató crédito, arrendamiento financiero ni factoraje financiero (2ª XXXVI). El distractor tentador supone que sólo el acreditado es Cliente; el inciso b) amplía la figura a quien opera al amparo de un contrato.","ref":"DCG SOFOM 2ª III y XXXVI"},{"id":"A003","tema":"2.1.1","tipo":"memoria","q":"¿Qué DCG tienen como fundamento el art. 212 de la Ley del Mercado de Valores?","a":"Las de Casas de bolsa","o":["Las de Casas de bolsa","Las de Asesores en inversiones","Las de Fondos de inversión","Las de Uniones de crédito"],"x":"La 1ª de Casas de bolsa remite al art. 212 de la LMV. El distractor tentador es Asesores en inversiones, que también es bursátil pero se funda en otro artículo de la misma ley (226 Bis LMV); Fondos se funda en el art. 91 de la LFI y Uniones en el art. 129 de la LUC.","ref":"DCG Casas de bolsa 1ª; DCG Asesores 1ª"},{"id":"A004","tema":"2.1.1","tipo":"caso","q":"Una SOFOM no regulada pregunta qué artículo da fundamento a las DCG que debe cumplir. ¿Cuál es?","a":"El art. 95 Bis de la LGOAAC","o":["El art. 87-D de la LGOAAC, que remite al art. 115 de la LIC","El art. 115 de la LIC, igual que a las instituciones de crédito","El art. 95 de la LGOAAC, igual que a las casas de cambio","El art. 95 Bis de la LGOAAC"],"x":"La 1ª de SOFOM tiene fundamento doble: para las reguladas, el 115 LIC (y 71-72 LRASCAP, 124 LACP y 129 LUC) por remisión del art. 87-D LGOAAC; para las no reguladas, el art. 95 Bis LGOAAC. El distractor tentador (87-D) es el fundamento de la SOFOM regulada. A Bancos lo funda el 115 LIC y a las casas de cambio el 95 LGOAAC.","ref":"DCG SOFOM 1ª"},{"id":"A005","tema":"2.1.1","tipo":"caso","q":"Una SOFOM regulada, además de otorgar crédito, empieza a transmitir dinero (art. 81-A Bis LGOAAC). Respecto de esas transmisiones, ¿qué DCG debe cumplir?","a":"Las DCG de transmisores de dinero, en lo conducente","o":["Las DCG de transmisores de dinero, en lo conducente","Sólo las DCG de SOFOM, porque su objeto ya cubre todos sus productos","Las DCG de Bancos, por la remisión del art. 87-D al art. 115 de la LIC","Las DCG de centros cambiarios, por tratarse de un servicio del art. 95 Bis"],"x":"La 1ª de SOFOM dispone que las SOFOM que realicen las actividades del art. 81-A Bis LGOAAC cumplirán, en lo conducente, las DCG del art. 95 Bis aplicables a los transmisores de dinero, únicamente cuando lleven a cabo esas transmisiones. El distractor tentador («sólo las de SOFOM») ignora esa remisión expresa.","ref":"DCG SOFOM 1ª"},{"id":"A006","tema":"2.1.1","tipo":"memoria","q":"¿Qué DCG incluyen entre sus objetos (primera disposición o art. 1) prever la forma y términos en que se presenta a la CNBV el Manual de Cumplimiento?","a":"Las de las ITF","o":["Las de las ITF","Las de Bancos","Las de Casas de bolsa","Las de Transmisores de dinero"],"x":"El art. 1 de las DCG de ITF tiene cinco fracciones; la II es prever la forma y los términos para presentar a la CNBV el Manual de Cumplimiento. Bancos también remite su Manual a la CNBV, pero lo regula en la 64ª, no en su objeto (1ª), que sólo tiene las medidas mínimas y los reportes.","ref":"DCG ITF art. 1 fr. II; DCG Bancos 1ª y 64ª"},{"id":"A007","tema":"2.1.1","tipo":"memoria","q":"¿Qué DCG liberan, para las actividades de los arts. 39 Bis fr. V y 40 Bis de su ley, de ciertos capítulos y de las obligaciones de Cuentas Concentradoras?","a":"Las de Fondos de inversión","o":["Las de Casas de bolsa","Las de Fondos de inversión","Las de Asesores en inversiones","Las de SOFIPO"],"x":"La 1ª de Fondos de inversión (fundamento: art. 91 LFI) dispone que, respecto de las actividades del art. 39 Bis fr. V y del último párrafo del art. 40 Bis de la LFI, no se cumplen los Caps. IV y XIII, ciertas fracciones de la 46ª, el segundo párrafo de la 20ª ni las obligaciones de Cuentas Concentradoras. Casas de bolsa y Asesores son bursátiles, pero sus DCG no tienen esa salvedad.","ref":"DCG Fondos 1ª"},{"id":"A008","tema":"2.1.1","tipo":"caso","q":"En la misma plaza operan una casa de cambio y un centro cambiario. ¿Qué artículo de la LGOAAC fundamenta las DCG de cada uno?","a":"Casa de cambio, art. 95; centro cambiario, art. 95 Bis","o":["Casa de cambio, art. 95; centro cambiario, art. 95 Bis","Ambos, art. 95 Bis, por realizar compraventa de divisas","Casa de cambio, art. 95 Bis; centro cambiario, art. 95","Ambos, art. 95, por ser actividades auxiliares del crédito"],"x":"La 1ª de Casas de cambio remite al art. 95 LGOAAC; la de Centros cambiarios, al art. 95 Bis (que también funda las de transmisores y SOFOM no reguladas). El distractor tentador agrupa a ambos en el 95 Bis porque los dos cambian divisas, pero la casa de cambio es entidad autorizada con artículo propio.","ref":"DCG Casas de cambio 1ª; DCG Centros cambiarios 1ª"},{"id":"A009","tema":"2.1.1","tipo":"memoria","q":"La 2ª fr. XXXVI de las DCG de Bancos define a los «Sujetos Obligados» de otras leyes. ¿A quién exceptúa expresamente?","a":"A los centros cambiarios","o":["A los centros cambiarios","A los transmisores de dinero","A las SOFOM no reguladas","A los asesores en inversiones"],"x":"La fr. XXXVI enumera a los sujetos de diversas leyes (124 LACP, 71-72 LRASCAP, 91 LFI, 212 y 226 Bis LMV, 129 LUC, 95 y 95 Bis LGOAAC, 58 LRITF, entre otros) «exceptuando a los centros cambiarios». Transmisores y SOFOM no reguladas también caen en el 95 Bis, pero no se excluyen.","ref":"DCG Bancos 2ª XXXVI"},{"id":"A010","tema":"2.1.1","tipo":"memoria","q":"¿En qué DCG el sujeto obligado incluye a las sociedades financieras comunitarias de niveles I a IV y a los Organismos de Integración Financiera Rural?","a":"En las de SOFIPO","o":["En las de SOFIPO","En las de SOCAP","En las de Uniones de crédito","En las de SOFOM"],"x":"La 2ª fr. XI de SOFIPO define «Entidades» como las sociedades financieras populares, las sociedades financieras comunitarias con niveles de operación I a IV y los Organismos de Integración Financiera Rural. El distractor tentador es SOCAP, también de ahorro popular, pero su sujeto obligado son sólo las cooperativas de ahorro y préstamo de niveles I a IV.","ref":"DCG SOFIPO 2ª XI"},{"id":"A011","tema":"2.1.1","tipo":"memoria","q":"Según su 2ª, ¿a qué sociedades cooperativas de ahorro y préstamo obligan las DCG de SOCAP?","a":"A las que tienen niveles de operación I a IV","o":["A todas, sin importar su nivel de operación","Sólo a las de niveles III y IV, que captan más recursos","A las que tienen niveles de operación I a IV","Sólo a las que además están afiliadas al Fondo de Protección"],"x":"La 2ª fr. XXXV define «Sociedades» como las SOCAP con niveles de operación del I al IV. No es «todas»: la definición acota por nivel. Ojo con no confundirla con SOFIPO, cuyo sujeto obligado agrega a SOFINCO y Organismos de Integración Financiera Rural.","ref":"DCG SOCAP 2ª XXXV"},{"id":"A012","tema":"2.1.1","tipo":"caso","q":"Una persona sin cuenta en un banco acude a una sucursal a cambiar dólares en efectivo; la operación inicia y concluye en ese acto. Para las DCG de Bancos, ¿qué es?","a":"Usuario, porque no es cuentahabiente y el acto es de ejecución instantánea","o":["Cliente, porque realiza una Operación con la institución de crédito","Cliente ocasional, figura intermedia que prevén las DCG de Bancos","Usuario, porque no es cuentahabiente y el acto es de ejecución instantánea","Usuario sólo si la operación es menor a 500 USD; si la iguala o la supera, Cliente"],"x":"La 2ª XXXVIII define al Usuario como quien opera sin relación comercial permanente, y aclara que no la hay cuando no es cuentahabiente y el acto es de ejecución instantánea. El monto no convierte al Usuario en Cliente: sólo cambia lo que se recaba de él (17ª). Las DCG no prevén un «cliente ocasional».","ref":"DCG Bancos 2ª IV y XXXVIII; 17ª"},{"id":"A013","tema":"2.1.1","tipo":"trampa","q":"¿Cuál de estas DCG NO define la figura de Usuario?","a":"La de Uniones de crédito","o":["La de Casas de bolsa","La de Sociedades financieras populares","La de SOFOM","La de Uniones de crédito"],"x":"Trampa: «el Usuario existe en todas las DCG». Falso. Sólo tienen Cliente: Asesores, Fondos y Uniones (2ª III; en Uniones, socios o terceros); la ITF también define sólo Cliente en su art. 2 fr. IV y el Usuario le aparece únicamente en la transmisión de dinero de las IFPE (art. 100). Sólo tienen Usuario: Casas de cambio, Centros cambiarios y Transmisores. Casas de bolsa, SOFIPO y SOFOM tienen ambas figuras, como Bancos.","ref":"DCG Uniones 2ª fr. III; DCG Casas de bolsa 2ª fr. XXXVII; DCG SOFIPO 2ª fr. XXXIX; DCG SOFOM 2ª fr. XXXVI; DCG ITF arts. 2 fr. IV y 100"},{"id":"A014","tema":"2.1.1","tipo":"caso","q":"La misma persona, sin cuenta ni contrato, hace una operación aislada en un banco y otra en un fondo de inversión. ¿Cómo la califica cada DCG?","a":"En el banco, Usuario; en el fondo, Cliente, porque su DCG no tiene Usuario","o":["En ambos, Usuario, porque no hay relación comercial permanente","En el banco, Cliente; en el fondo, Usuario, porque no celebró contrato con él","En ambos, Cliente, porque las dos DCG definen así a quien opera","En el banco, Usuario; en el fondo, Cliente, porque su DCG no tiene Usuario"],"x":"Bancos distingue Cliente (cuentahabiente o con contrato) y Usuario (sin relación comercial permanente). Las DCG de Fondos sólo definen Cliente: «cualquier persona física, moral o Fideicomiso que realice Operaciones con las Entidades» (2ª III). El distractor tentador aplica a Fondos la lógica de Bancos.","ref":"DCG Bancos 2ª IV y XXXVIII; DCG Fondos 2ª III"},{"id":"A015","tema":"2.1.1","tipo":"memoria","q":"¿En qué DCG el Usuario se presenta en dos modalidades, Usuario Remitente y Usuario Beneficiario?","a":"En las de Transmisores de dinero","o":["En las de Casas de cambio","En las de Transmisores de dinero","En las de Centros cambiarios","En las de Sociedades financieras populares"],"x":"La 2ª fr. XXXIX de Transmisores define al Usuario en dos supuestos: el Remitente (quien contrata el envío) y el Beneficiario (quien recibe los recursos). Casas de cambio y Centros cambiarios también tienen sólo Usuario, pero sin esas modalidades.","ref":"DCG Transmisores 2ª XXXIX"},{"id":"A016","tema":"2.1.1","tipo":"caso","q":"Una ITF realiza operaciones a través de un fideicomiso para recibir recursos de sus clientes. Según sus DCG, ¿cómo se tratan esas operaciones?","a":"Se les aplica lo relativo a las Cuentas Concentradoras","o":["El fideicomiso se identifica como Cliente, igual que en las DCG de Bancos","Se les aplica lo relativo a las Cuentas Concentradoras","El fideicomiso es Usuario, porque no tiene relación comercial permanente","Quedan fuera de las DCG, porque la ITF sólo identifica a personas físicas"],"x":"El art. 2 fr. IV define al Cliente de la ITF sólo como persona física o moral (sin Fideicomiso, a diferencia de Bancos), y la fr. VII dispone que a las operaciones que las ITF realicen a través de fideicomisos les es aplicable lo relativo a las Cuentas Concentradoras. No quedan fuera de las DCG ni se convierten en Usuario.","ref":"DCG ITF art. 2 fr. IV y VII"},{"id":"A017","tema":"2.1.2","tipo":"cifra","q":"Una institución de crédito modifica su Manual de Cumplimiento. ¿En qué plazo debe remitir a la CNBV las modificaciones con un ejemplar completo?","a":"Dentro de los 20 días hábiles siguientes a que las apruebe su comité de auditoría","o":["Dentro de los 20 días naturales siguientes a que las apruebe su consejo","Dentro de los 30 días hábiles siguientes a que las apruebe el Comité de Comunicación y Control","Dentro de los 10 días hábiles siguientes a que las elabore el Oficial de Cumplimiento","Dentro de los 20 días hábiles siguientes a que las apruebe su comité de auditoría"],"x":"La 64ª fija 20 días hábiles contados desde que el comité de auditoría aprueba las modificaciones; el Comité de Comunicación y Control sólo se las somete (43ª fr. I). El distractor tentador cambia hábiles por naturales: el plazo es en días hábiles.","ref":"DCG Bancos 64ª; 43ª fr. I"},{"id":"A018","tema":"2.1.2","tipo":"caso","q":"Un asesor en inversiones modifica su Manual de Cumplimiento. ¿Desde cuándo corren los 20 días hábiles para remitir las modificaciones a la CNBV?","a":"Desde que su Representante elabora las modificaciones","o":["Desde que su comité de auditoría aprueba las modificaciones","Desde que su consejo de administración las aprueba, previa opinión del Comité","Desde que la CNBV le requiere el ejemplar completo del Manual","Desde que su Representante elabora las modificaciones"],"x":"Igual que Bancos en el plazo (20 días hábiles), salvo el punto de partida: en Asesores corre desde que el Representante elabora las modificaciones (30ª fr. II), porque no tienen comité de auditoría ni Comité de Comunicación y Control. El distractor tentador traslada la regla de Bancos.","ref":"DCG Asesores 38ª; 30ª fr. II"},{"id":"A019","tema":"2.1.2","tipo":"caso","q":"Una SOCAP aprueba modificaciones a su Manual de Cumplimiento. Además de remitirlas a la CNBV, ¿a quién debe enviarlas según su DCG?","a":"Al Comité de Supervisión Auxiliar","o":["Al Comité de Supervisión de su Federación","A la CONDUSEF, por ser sociedad de ahorro popular","A la Unidad de Inteligencia Financiera de la SHCP","Al Comité de Supervisión Auxiliar"],"x":"La 67ª de SOCAP, último párrafo, ordena enviar el Manual y sus modificaciones también al Comité de Supervisión Auxiliar (órgano del Fondo de Protección). El distractor tentador es el «Comité de Supervisión», que corresponde a la SOFIPO (su 67ª). Fuera de ese envío adicional, el plazo es igual que en Bancos; la aprobación también, salvo que sin comité de auditoría aprueba su propio Comité (47ª fr. I).","ref":"DCG SOCAP 67ª; DCG SOFIPO 67ª"},{"id":"A020","tema":"2.1.2","tipo":"memoria","q":"En una ITF, ¿quién aprueba las modificaciones al Manual de Cumplimiento, desde cuya aprobación corren los 20 días hábiles para remitirlas a la CNBV?","a":"Su comisario, comité de auditoría o Comité, en su caso","o":["Sólo su comité de auditoría, como en Bancos","Su Oficial de Cumplimiento, con el visto bueno del consejo","Su comisario, comité de auditoría o Comité, en su caso","Su comité de riesgos, a propuesta del Comité de Comunicación y Control"],"x":"El art. 83 de las DCG de ITF admite tres órganos: comisario, comité de auditoría o Comité (de Comunicación y Control), según corresponda. El distractor tentador reduce la regla a la de Bancos (sólo comité de auditoría). El comité de riesgos aprueba en Bancos el modelo de riesgo de clientes, no el Manual.","ref":"DCG ITF art. 83"},{"id":"A021","tema":"2.1.2","tipo":"cifra","q":"En el expediente presencial de una persona física en un banco, ¿qué antigüedad máxima puede tener el comprobante de domicilio?","a":"No mayor a 3 meses a su fecha de emisión","o":["No mayor a 3 meses a su fecha de emisión","No mayor a 6 meses a su fecha de emisión","No mayor a 1 año a su fecha de emisión","No mayor a 2 meses a su fecha de emisión"],"x":"La 4ª fr. I exige copia del comprobante de domicilio con antigüedad no mayor a tres meses a su fecha de emisión. El distractor tentador de 6 meses confunde esta cifra con la del perfil y el grado de riesgo iniciales.","ref":"DCG Bancos 4ª fr. I"},{"id":"A022","tema":"2.1.2","
