<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Módulo 2 · Herramienta H1: para qué existen las 12 DCG y cómo cada sujeto obligado identifica y conoce a su cliente o usuario, con simulador de reactivos.">
<title>2.1.1 Objetivo · 2.1.2 Política de identificación y conocimiento del cliente o usuario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}

.siminfo{font-size:13px;color:var(--muted);margin:12px 0 0}

.para{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--accion);border-radius:12px;padding:12px 16px;margin:-4px 0 18px;font-size:17px;font-weight:600;max-width:1040px}.para b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accion);margin-bottom:2px}
.tu{margin:10px 0;background:var(--surface);border:2px solid var(--negro);border-left:8px solid var(--coral);border-radius:10px;padding:10px 14px;font-size:16px}.tu b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.dist{margin-top:12px;font-weight:500;font-size:15px}.dist ul{margin:4px 0 0;padding-left:0;list-style:none}.dist li{margin:5px 0;padding-left:26px;text-indent:-26px}.dist li b{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;text-indent:0;margin-right:6px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-display);font-size:12px;background:var(--surface)}
.rp-fallas{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

.rp-box{scroll-margin-top:90px}

.rp-box .opt{font-size:17px}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(27,27,30,.45);z-index:50}

.dhead{padding:20px 22px 18px;background:var(--c);color:var(--ci);display:flex;justify-content:space-between;gap:12px;align-items:center}

.dbody{padding:16px 22px 30px;overflow:auto}
.dbody ul{padding-left:18px;margin:0}
.dbody li{margin:8px 0}
.dbody .hook{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 12px}

footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:4px solid var(--membrete);padding-top:14px}

 8 · 6"},"ramas":[{"letra":"1","titulo":"2.1.1 Objetivo","pregunta":"¿Para qué, a quién y con quién?","ritmo":"¿Para qué?","corto":"2.1.1","color":"oscuro","items":[{"etiqueta":"1ª","nombre":"Objeto de las DCG","sub":"2.1.1 · 1ª de cada DCG","verbo":"Prevengo","desc":"Fijan las medidas mínimas para prevenir y detectar operaciones ligadas a FT (139 Quáter) y ORPI (400 Bis), y cómo reportarlas a la SHCP por conducto de la CNBV.","orden":1,"panel":"2.1.1 · 1ª de cada DCG","puntos":["<b>Bancos (1ª):<\/b> dos objetos: medidas y procedimientos mínimos para prevenir y detectar actos u operaciones vinculados con los arts. 139 Quáter y 400 Bis del CPF, y términos para reportar a la SHCP, por conducto de la CNBV, operaciones de clientes, usuarios, consejeros, directivos, funcionarios, empleados y apoderados. Fundamento: art. 115 LIC.","Cada DCG cambia su <b>fundamento<\/b>: Casas de bolsa 212 LMV · Asesores 226 Bis LMV · Fondos 91 LFI · SOCAP 71 y 72 LRASCAP · SOFIPO 124 LACP · Uniones 129 LUC · Casas de cambio 95 LGOAAC · Centros cambiarios y Transmisores 95 Bis LGOAAC · ITF 58 LRITF.","<b>SOFOM<\/b>: fundamento múltiple: reguladas por el 87-D LGOAAC (remite a 115 LIC, 71-72 LRASCAP, 124 LACP o 129 LUC) y no reguladas por el 95 Bis LGOAAC. Si transmite dinero, cumple además las DCG de transmisores.","<b>ITF<\/b> (art. 1): su objeto incluye presentar el <b>Manual de Cumplimiento<\/b> a la CNBV.","<b>Fondos<\/b>: excluye ciertos capítulos para las actividades de los arts. 39 Bis fr. V y 40 Bis LFI."],"ir":"#t2-1-1","destacado":false},{"etiqueta":"2ª","nombre":"Sujeto obligado","sub":"2.1.1 · 2ª de cada DCG","verbo":"Delimito","desc":"Cada DCG dice a quién obliga. Ojo con las que abarcan a más de un tipo: SOFOM reguladas y no reguladas; SOFIPO con SOFINCO; SOCAP sólo niveles I a IV.","orden":2,"panel":"2.1.1 · 2ª de cada DCG","puntos":["<b>Bancos (2ª XI):<\/b> «Entidades» = instituciones de crédito. La 2ª XXXVI excluye expresamente a los centros cambiarios del 95 Bis LGOAAC de los «Sujetos Obligados».","<b>SOFOM (2ª IX):<\/b> reguladas <b>y<\/b> no reguladas.","<b>SOCAP (2ª XXXV):<\/b> con niveles de operación <b>I a IV<\/b>.","<b>SOFIPO (2ª XI):<\/b> SOFIPO, <b>SOFINCO<\/b> niveles I a IV y Organismos de Integración Financiera Rural.","<b>Centros cambiarios (2ª II):<\/b> sociedades anónimas que realizan habitual y profesionalmente las actividades del 81-A LGOAAC.","<b>ITF (art. 2):<\/b> IFC e IFPE; su «Cliente» incluye a quien opera con Sociedades Autorizadas (modelos novedosos)."],"ir":"#t2-1-1","destacado":false},{"etiqueta":"2ª","nombre":"Cliente vs. Usuario","sub":"2.1.1 · Definiciones de la 2ª","verbo":"Distingo","desc":"Cliente = relación al amparo de un contrato; Usuario = opera sin relación comercial permanente. No todas las DCG tienen las dos figuras.","orden":3,"panel":"2.1.1 · Definiciones de la 2ª","puntos":["<b>Bancos:<\/b> Cliente (2ª IV) es cuentahabiente o usa servicios al amparo de un contrato; Usuario (2ª XXXVIII) opera sin relación comercial permanente.","<b>Cliente y Usuario:<\/b> Bancos, SOFOM, Casas de bolsa, SOCAP y SOFIPO.","<b>Sólo Cliente:<\/b> Asesores, Fondos, Uniones e ITF.","<b>Sólo Usuario:<\/b> Casas de cambio, Centros cambiarios y Transmisores (remitente y beneficiario).","SOFOM: Cliente = acreditado <b>o<\/b> quien opera al amparo de un contrato. SOCAP: Cliente = socios y terceros. SOCAP y SOFIPO: el Usuario no tiene relación «patrimonial, ni comercial permanente»."],"ir":"#t2-1-1","destacado":false}]},{"letra":"2","titulo":"2.1.2 · Identificación","pregunta":"¿Quién es? · Bancos Cap. II (3ª–21ª)","ritmo":"¿Quién es?","corto":"Identifico","color":"principal","items":[{"etiqueta":"3ª · 64ª","nombre":"Política y Manual","sub":"Bancos Cap. II y Cap. XIII","verbo":"Escribo","desc":"La política de identificación va dentro del Manual de Cumplimiento, que se remite a la CNBV; sus cambios, dentro de 20 días hábiles desde que los aprueba el comité de auditoría.","orden":4,"panel":"Bancos Cap. II y Cap. XIII","puntos":["<b>Bancos:<\/b> política de identificación (3ª) y de conocimiento (22ª) dentro del Manual; Manual a la CNBV; modificaciones en <b>20 días hábiles<\/b> desde su aprobación por el comité de auditoría (64ª).","Igual que Bancos, salvo <b>Asesores<\/b>: los 20 días hábiles corren desde que <b>el Representante<\/b> las elabora (30ª fr. II).","Igual que Bancos, salvo <b>SOCAP<\/b> y <b>SOFIPO<\/b>: también se envían al Comité de Supervisión Auxiliar (SOCAP) o al Comité de Supervisión (SOFIPO) (67ª).","Sin comité de auditoría aprueba el propio Comité en SOFOM (también consejo o director general), Fondos, SOCAP, Casas de cambio, Centros cambiarios y Transmisores; SOFIPO: «o su equivalente»; Uniones: «comité de auditoría o Comité» (53ª). Bancos y Casas de bolsa: comité de auditoría a secas.","<b>ITF<\/b> (art. 10): contenido mínimo de 6 fracciones; aprueba «comisario, comité de auditoría o Comité» (art. 83)."],"ir":"#t2-1-2","destacado":true},{"etiqueta":"4ª I y III","nombre":"Expediente de persona física","sub":"Bancos 4ª fr. I y III; 7ª","verbo":"Identifico","desc":"Datos y copias de la persona física, mexicana o extranjera, integrados antes de abrir la cuenta, con entrevista presencial. En Cambios y envíos el expediente depende del monto.","orden":5,"panel":"Bancos 4ª fr. I y III; 7ª","puntos":["<b>Bancos:<\/b> expediente previo a la apertura (4ª); comprobante de domicilio no mayor a 3 meses; entrevista presencial previa (7ª).","<b>Casas de cambio<\/b> y <b>Centros cambiarios<\/b> (4ª): escalones de <b>1,000 / 3,000 / 5,000 USD<\/b>: datos / copia de identificación / expediente (la recepción de dólares en efectivo en Casas de cambio va por su Cap. III Bis: 2.1.4, H2).","<b>Transmisores<\/b> (4ª): datos de la transferencia <b>con independencia del monto<\/b> (remitente; beneficiario en envíos en moneda extranjera o internacionales y al pagar); escalones de <b>500 / 3,000 / 5,000 USD<\/b>.","<b>ITF<\/b> (art. 11): expediente digital con geolocalización y Firma Autógrafa Digitalizada; entrevista sólo con efectivo, activos virtuales o transferencias internacionales.","<b>SOCAP<\/b> y <b>SOFIPO<\/b>: también antes de recibir aportaciones al capital social."],"ir":"#t2-1-2","destacado":false},{"etiqueta":"4ª II, IV, IX","nombre":"PM, fideicomisos y gobierno","sub":"Bancos 4ª fr. II, III b), IV, IV Bis y IX","verbo":"Acredito","desc":"Personas morales, fideicomisos y dependencias públicas: testimonio, estructura accionaria y propietario real; medidas simplificadas para el Anexo 1 si su riesgo es bajo.","orden":6,"panel":"Bancos 4ª fr. II, III b), IV, IV Bis y IX","puntos":["<b>Bancos:<\/b> PM (II); PM extranjera (III b); entidades del <b>Anexo 1<\/b> con riesgo bajo (IV); fideicomisos (IX).","<b>Sólo Bancos<\/b> tiene la <b>fr. IV Bis<\/b> (DOF 28-ago-2024): dependencias y entidades públicas con riesgo <b>distinto a bajo<\/b>.","<b>ITF<\/b>: sin fracción de fideicomiso como Cliente.","SOFOM y Uniones: fr. VII de coacreditados y obligados solidarios.","Casas de cambio y Centros cambiarios: Anexo 1 en la 4ª fr. III inciso D; Transmisores, en la fr. IV inciso D."],"ir":"#t2-1-2","destacado":false},{"etiqueta":"4ª Ter · 7ª","nombre":"Identificación no presencial","sub":"Bancos 4ª Ter y 7ª","verbo":"Geolocalizo","desc":"Abrir a distancia: con geolocalización, identificación en versión digital y los mecanismos que fije la CNBV. Cada DCG pone su propio tope en su Anexo 2.","orden":7,"panel":"Bancos 4ª Ter y 7ª","puntos":["<b>Bancos<\/b> (4ª Ter): PF o PM mexicanas, por Dispositivos, conforme a las DCG que emita la CNBV; sin geolocalización no se abre, salvo entidades del Anexo 1 de riesgo bajo.","Anexo 2: SOFOM y Uniones, crédito de <b>30,000 / 60,000 UDIS<\/b>; Casas de bolsa, Fondos y Asesores, <b>30,000 UDIS al mes<\/b>; SOCAP y SOFIPO, depósitos 30,000 / 60,000 y crédito 60,000 / 100,000 UDIS; Transmisores, <b>5,000 / 7,000 USD al mes<\/b>; Casas de cambio, PF hasta <b>5,000 USD<\/b> con aprobación previa de la CNBV.","<b>Centros cambiarios: no lo prevé.<\/b> ITF: es remota por naturaleza, sin Anexo 2."],"ir":"#t2-1-2-niveles","destacado":false},{"etiqueta":"10ª · 10ª Ter","nombre":"Anónimas prohibidas y suspensión","sub":"Bancos 10ª y 10ª Ter","verbo":"Suspendo","desc":"Prohibidas las cuentas anónimas. Si identificar alertaría al cliente o hay posible FT u ORPI, la entidad puede suspender y manda un reporte de operación inusual de 24 horas.","orden":8,"panel":"Bancos 10ª y 10ª Ter","puntos":["<b>Bancos:<\/b> prohibidas cuentas anónimas o con nombres ficticios (10ª). Puede suspender la identificación en tres supuestos y genera un <b>ROI de 24 horas<\/b> (10ª Ter).","= Bancos en las otras 10 DCG con otra numeración; SOCAP y SOFIPO incluyen las aportaciones al capital social.","Igual que Bancos, salvo la <b>ITF<\/b> (art. 28): sólo el supuesto de «alertar al cliente»; el art. 28 no fija plazo (el de 24 horas puede venir del art. 73 fr. I).","La consecuencia de la Lista de Personas Bloqueadas no está aquí: va en <b>2.1.8 (H3)<\/b>."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"14ª–14ª Quáter","nombre":"Simplificado y niveles de cuenta","sub":"Bancos 14ª a 14ª Quáter; Anexo 1","verbo":"Simplifico","desc":"Menos datos para cuentas pequeñas: Bancos tiene tres niveles y una cuenta remota de 30,000 UDIS; la ITF dos niveles; los demás simplifican por crédito, por contrato chico o por una cuenta de 3,000 UDIS.","orden":9,"panel":"Bancos 14ª a 14ª Quáter; Anexo 1","puntos":["<b>Bancos 14ª Bis:<\/b> nivel 1, 750 UDIS de abonos al mes y saldo máximo de 1,000 · nivel 2, 3,000 (+6,000 de programas gubernamentales) · nivel 3, 10,000 · fr. IV (cuenta remota de PM o PFAE), 30,000 UDIS al mes.","<b>ITF<\/b> (art. 12): nivel 1 de 750 UDIS · nivel 2 de 3,000 · transferencias internacionales 1,700 UDIS al mes.","SOFOM y Uniones: crédito ≤ 3,000 / &lt; 10,000 UDIS (Uniones ≤ 10,000). Casas de bolsa, Fondos y Asesores: &lt; 3,000 UDIS al mes (Asesores, sólo PF). SOCAP y SOFIPO: cuenta a la vista de 3,000 UDIS + 6,000 de programas gubernamentales.","Ante sospecha no se aplican medidas simplificadas (Bancos 10ª Bis)."],"ir":"#t2-1-2-niveles","destacado":true},{"etiqueta":"5ª–19ª","nombre":"Usuarios y figuras propias","sub":"Bancos 5ª, 6ª, 13ª, 16ª a 19ª","verbo":"Escalono","desc":"Quien no es cliente se identifica por escalones de monto en dólares; cada DCG suma figuras propias: concentradoras, nómina, prepagadas, agentes relacionados.","orden":10,"panel":"Bancos 5ª, 6ª, 13ª, 16ª a 19ª","puntos":["<b>Bancos, Usuarios<\/b> (17ª): efectivo ≥ 500 USD datos; 3,000 a &lt; 5,000 USD copia de identificación; ≥ 5,000 USD expediente; cheques de caja ≥ 10,000 USD expediente.","<b>Bancos, transferencias de Usuarios<\/b> (16ª II): 1,000 / 3,000 / 5,000 USD.","Bancos: concentradora (6ª), nómina (13ª), tarjetas prepagadas (19ª).","<b>Transmisores:<\/b> Agente Relacionado (PF), Persona Jurídica Coadyuvante (PM o PFAE) y Tercero.","<b>SOCAP<\/b> y <b>SOFIPO:<\/b> tarjetas recargables. <b>ITF:<\/b> IFC vs. IFPE."],"ir":"#t2-1-2-figuras","destacado":false},{"etiqueta":"15ª Bis · 21ª","nombre":"Verificación y actualización","sub":"Bancos 15ª Bis y 21ª","verbo":"Actualizo","desc":"Verificar los datos y documentos y mantener los expedientes al día: los de riesgo alto, al menos una vez al año. La ITF revisa todos cada año.","orden":11,"panel":"Bancos 15ª Bis y 21ª","puntos":["<b>Bancos:<\/b> verificación (15ª Bis), que con riesgo bajo puede ser posterior a la apertura sin que el cliente opere antes; expedientes de riesgo alto verificados al menos <b>una vez al año<\/b> (21ª).","Igual que Bancos, salvo <b>Transmisores<\/b> (8ª Bis): la verificación no se difiere; el Usuario no opera hasta concluirla.","Igual que Bancos, salvo <b>Centros cambiarios<\/b>: su DCG no tiene disposición de verificación equivalente; sólo actualización (11ª).","Igual que Bancos, salvo la <b>ITF<\/b> (art. 24): <b>todos<\/b> los expedientes, al menos una vez al año, cualquiera que sea el riesgo."],"ir":"#t2-1-2-conocer","destacado":false}]},{"letra":"3","titulo":"2.1.2 · Conocimiento","pregunta":"¿Lo conozco? · Bancos Cap. III (22ª–32ª)","ritmo":"¿Lo conozco?","corto":"Conozco","color":"negro","items":[{"etiqueta":"22ª–25ª Quáter","nombre":"Perfil transaccional","sub":"Bancos 22ª a 24ª y 25ª Quáter","verbo":"Perfilo","desc":"Qué se espera que haga el cliente: monto, número, tipo y frecuencia, origen y destino. Perfil inicial con 6 meses; se evalúa al menos cada 6 meses.","orden":12,"panel":"Bancos 22ª a 24ª y 25ª Quáter","puntos":["<b>Bancos:<\/b> perfil (24ª); perfil inicial con los primeros 6 meses; evaluación <b>al menos cada 6 meses<\/b> (25ª Quáter).","SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones: <b>dos evaluaciones por año calendario<\/b>.","<b>Asesores:<\/b> <b>una<\/b> por año calendario.","<b>ITF:<\/b> = Bancos (al menos cada 6 meses)."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"25ª · 25ª Bis","nombre":"Grado de riesgo del cliente","sub":"Bancos 25ª, 25ª Bis y 28ª","verbo":"Califico","desc":"Cada cliente recibe un grado de riesgo que decide cuánto se le pide y vigila. Bancos usa un modelo aprobado por su comité de riesgos; los demás, mínimos de 2 o 3 grados.","orden":13,"panel":"Bancos 25ª, 25ª Bis y 28ª","puntos":["<b>Bancos:<\/b> modelo de evaluación de riesgos coherente con la metodología del Cap. II Bis y diseñado conforme al Anexo 3, <b>aprobado por el comité de riesgos<\/b>; evaluación al menos cada 6 meses (25ª Bis); clasificar al inicio (28ª).","SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones y Cambios y envíos: mínimo <b>2 grados para PF<\/b> (alto y bajo) y <b>3 para PM y fideicomisos<\/b>.","<b>ITF<\/b> (arts. 29-30): mínimo <b>3 grados para todos<\/b>, cada 6 meses."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"2ª XXXI · 26ª","nombre":"Personas políticamente expuestas","sub":"Bancos 2ª XXXI y 26ª","verbo":"Señalo","desc":"Quien tiene o tuvo una función pública destacada y sus allegados. La PEP nacional lo sigue siendo un año después de dejar el cargo; si es de alto riesgo, la aprueba un directivo.","orden":14,"panel":"Bancos 2ª XXXI y 26ª","puntos":["<b>Bancos:<\/b> se asimilan cónyuge, concubina o concubinario, parientes hasta el <b>2º grado<\/b> y PM con vínculo patrimonial; PEP nacional, <b>1 año<\/b> después del cargo (2ª XXXI).","PEP de alto riesgo: aprobación de un directivo para iniciar o continuar (26ª).","Igual que Bancos, salvo la <b>ITF<\/b> (art. 39): aprobación de directivo para <b>cualquier PEP<\/b>.","Igual que Bancos, salvo <b>Transmisores<\/b>: también aprueba «una persona con nivel de alta responsabilidad»."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"27ª · 28ª","nombre":"Alto riesgo y aprobación","sub":"Bancos 27ª y 28ª","verbo":"Apruebo","desc":"Abrir a un cliente de alto riesgo exige la aprobación previa de un directivo. Bancos fija tres de alto riesgo mínimo; casi todas las demás, sólo las PEP extranjeras.","orden":15,"panel":"Bancos 27ª y 28ª","puntos":["<b>Bancos<\/b> (28ª), alto riesgo como mínimo: <b>no residentes de banca privada, PEP extranjeras y PM que operan efectivo en USD<\/b>.","SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones, Casas de cambio, Centros cambiarios y Transmisores: <b>sólo PEP extranjeras<\/b>.","<b>ITF<\/b> (art. 33): no residentes del art. 70 fr. X y PEP extranjeras.","Cambios y envíos: la aprobación es antes de la <b>Operación<\/b>."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"29ª · 30ª","nombre":"Corresponsalía","sub":"Bancos 29ª y 30ª","verbo":"Filtro","desc":"Relaciones con instituciones del extranjero: aprobación a nivel directivo y debida diligencia; prohibido operar con bancos sin presencia física.","orden":16,"panel":"Bancos 29ª y 30ª","puntos":["<b>Bancos:<\/b> aprobación a nivel directivo (29ª); diligencia reforzada con jurisdicciones de riesgo y prohibición de bancos <i>shell<\/i> (30ª).","La tienen: Bancos, Casas de bolsa, Fondos, SOCAP y SOFIPO (estas dos, contrapartes «relacionadas con su objeto»).","<b>No la prevén:<\/b> SOFOM, Asesores, Uniones, Casas de cambio, Centros cambiarios, Transmisores e ITF."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"31ª · 32ª","nombre":"Propietario real (ubicación)","sub":"Bancos 2ª XXXII, 31ª y 32ª","verbo":"Destapo","desc":"Quién está detrás del cliente. Aquí sólo dónde lo definen y aplican las DCG; el 25 %, la cascada y los Lineamientos se estudian en 2.1.16.","orden":17,"panel":"Bancos 2ª XXXII, 31ª y 32ª","puntos":["<b>Bancos:<\/b> definición en la 2ª XXXII (incluye Control, 25 % o más, 2ª VII); se aplica en la 4ª, 10ª, 31ª y 32ª.","Todas las DCG lo definen en su 2ª o art. 2 y lo aplican en el expediente.","Las DCG <b>obligan<\/b>; los Lineamientos de 2019 <b>orientan<\/b>.","Desarrollo completo: <b>2.1.16 Propietario real (H6)<\/b>."],"ir":"#t2-1-2-figuras","destacado":false}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por elemento","html":"<b>Prevengo<\/b>, <b>Delimito<\/b> y <b>Distingo<\/b> · <b>Escribo<\/b>, <b>Identifico<\/b>, <b>Acredito<\/b>, <b>Geolocalizo<\/b>, <b>Suspendo<\/b>, <b>Simplifico<\/b>, <b>Escalono<\/b> y <b>Actualizo<\/b> · <b>Perfilo<\/b>, <b>Califico<\/b>, <b>Señalo<\/b>, <b>Apruebo<\/b>, <b>Filtro<\/b> y <b>Destapo<\/b>."}},{"tipo":"tarjetas","id":"t2-1-1","nav":"2.1.1 Objetivo","titulo":"2.1.1 · Objetivo","intro":"Tres preguntas: <b>¿para qué?<\/b> (1ª), <b>¿a quién obliga?<\/b> (2ª) y <b>¿con quién opera?<\/b> (Cliente o Usuario, 2ª). Bancos primero; después, sujeto por sujeto, en el orden de las familias. Las familias son una <b>agrupación didáctica<\/b> de 360Educa: orientan, pero las diferencias se aprenden sujeto por sujeto.","tarjetas":[{"barra":true,"color":"principal","titulo":"Bancos · el eje","ref":"1ª · art. 115 LIC","ancho":true,"html":"Dos objetos: (i) <b>medidas y procedimientos mínimos<\/b> para prevenir y detectar actos u operaciones que puedan favorecer los delitos de los arts. <b>139 Quáter<\/b> (financiamiento al terrorismo) y <b>400 Bis<\/b> (operaciones con recursos de procedencia ilícita) del Código Penal Federal; (ii) los términos para <b>reportar a la SHCP, por conducto de la CNBV<\/b>, actos y operaciones de clientes y usuarios, y de consejeros, directivos, funcionarios, empleados y apoderados."},{"encabezado":true,"color":"principal","titulo":"Crédito","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"Bancos","v":"Art. 115 LIC · «Entidades» = instituciones de crédito (2ª XI)"},{"k":"SOFOM","v":"Igual que Bancos, salvo: fundamento múltiple: <b>reguladas<\/b> por el 87-D LGOAAC (remite a 115 LIC, 71-72 LRASCAP, 124 LACP o 129 LUC) y <b>no reguladas<\/b> por el 95 Bis LGOAAC; obliga a ambas (2ª IX). Si transmite dinero, cumple también las DCG de transmisores"}]},{"encabezado":true,"color":"morado","titulo":"Bursátil","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"Casas de bolsa","v":"Art. 212 LMV"},{"k":"Asesores","v":"Art. 226 Bis LMV · personas del art. 225 LMV (2ª II)"},{"k":"Fondos","v":"Art. 91 LFI · excluye ciertos capítulos para las actividades de los arts. 39 Bis fr. V y 40 Bis LFI (1ª)"}]},{"encabezado":true,"color":"turquesa","titulo":"Ahorro popular","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"SOCAP","v":"Arts. 71 y 72 LRASCAP · sólo niveles de operación <b>I a IV<\/b> (2ª XXXV)"},{"k":"SOFIPO","v":"Art. 124 LACP · incluye <b>SOFINCO<\/b> niveles I a IV y Organismos de Integración Financiera Rural (2ª XI)"},{"k":"Uniones","v":"Art. 129 LUC"}]},{"encabezado":true,"color":"coral","titulo":"Cambios y envíos","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"Casas de cambio","v":"Art. 95 LGOAAC"},{"k":"Centros cambiarios","v":"Art. 95 Bis LGOAAC · sociedades anónimas del 81-A LGOAAC (2ª II)"},{"k":"Transmisores","v":"Art. 95 Bis LGOAAC"}]},{"encabezado":true,"color":"amarillo","titulo":"Fintech","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"ITF","v":"Art. 58 LRITF · IFC e IFPE (art. 2). Su objeto incluye presentar el <b>Manual de Cumplimiento<\/b> a la CNBV (art. 1)"}]},{"encabezado":true,"color":"principal","titulo":"Cliente y Usuario","subtitulo":"Las dos figuras","filas":[{"k":"Bancos","v":"Cliente: cuentahabiente o usa servicios al amparo de un contrato (2ª IV). Usuario: sin relación comercial permanente (2ª XXXVIII)"},{"k":"SOFOM","v":"Cliente: acreditado <b>o<\/b> quien opera al amparo de un contrato. Usuario: sin crédito, arrendamiento financiero ni factoraje"},{"k":"Casas de bolsa","v":"= Bancos: Usuario es quien no celebró contrato"},{"k":"SOCAP · SOFIPO","v":"SOCAP: Cliente = socios y terceros. En ambas, el Usuario no tiene relación «patrimonial, ni comercial permanente»"}]},{"encabezado":true,"color":"oscuro","titulo":"Sólo Cliente","subtitulo":"No existe el Usuario","filas":[{"k":"Asesores","v":"Opera al amparo de un contrato (2ª III)"},{"k":"Fondos","v":"Quien realice Operaciones (2ª III)"},{"k":"Uniones","v":"Socios o terceros (2ª III)"},{"k":"ITF","v":"PF o PM, <b>sin fideicomiso<\/b> (art. 2 IV). «Usuario» sólo en la transmisión de dinero de las IFPE (art. 100)"}]},{"encabezado":true,"color":"negro","titulo":"Sólo Usuario","subtitulo":"No existe el Cliente","filas":[{"k":"Casas de cambio","v":"2ª XXXIV; excluye a las entidades financieras que le proveen"},{"k":"Centros cambiarios","v":"2ª XXVI; misma exclusión"},{"k":"Transmisores","v":"2ª XXXIX: Usuario <b>Remitente<\/b> y Usuario <b>Beneficiario<\/b>"}]}],"nota":"Agrupación útil que <b>sí<\/b> es legal: el <b>95 Bis LGOAAC<\/b> junta a centros cambiarios, transmisores y SOFOM no reguladas. Las familias de color no salen de la ley."},{"tipo":"tarjetas","id":"t2-1-2","nav":"2.1.2 Política","titulo":"2.1.2 · Política de identificación y conocimiento del cliente o usuario","intro":"Son <b>dos políticas<\/b> y el nombre del tema las trae: <b>identificación<\/b> (¿quién es?, Bancos Cap. II, 3ª–21ª) y <b>conocimiento<\/b> (¿qué hace y cuánto riesgo implica?, Cap. III, 22ª–32ª). Ambas viven en el <b>Manual de Cumplimiento<\/b>. Aquí: la política y el Manual, y los expedientes. Siguen, en este mismo tema, niveles y no presencial, conocer y calificar, y figuras propias.","tarjetas":[{"barra":true,"color":"negro","titulo":"Reforma posterior al temario (DOF 10-jul-2026)","ref":"Bancos 4ª, 4ª Bis, 4ª Ter, 7ª, 14ª Bis","ancho":true,"html":"Después del temario, Bancos agregó el <b>nivel de cuenta 2 Bis<\/b> (hasta 15,000 UDIS de abonos al mes, máximo 3,000 UDIS en efectivo, sólo PF mexicanas residentes), la <b>CURP biométrica<\/b>, ajustes a la lista de identificaciones válidas y la <b>verificación de documentos en contratación remota<\/b> (7ª). Ojo: la matrícula consular y la identificación electrónica <b>ya<\/b> eran válidas en la versión del 28-ago-2024. <b>El examen usa la versión del 28-ago-2024<\/b>: esta nota es para que no te sorprenda en la práctica; ningún reactivo depende de ella."},{"barra":true,"color":"principal","titulo":"Bancos · política y Manual","ref":"3ª, 22ª, 64ª","ancho":true,"html":"Política de <b>identificación<\/b> (3ª: incluye verificar y actualizar datos, y lineamientos para Usuarios de la 17ª a la 20ª) y de <b>conocimiento<\/b> (22ª), ambas en el Manual. El Manual se <b>remite a la CNBV<\/b>; sus modificaciones, con un ejemplar completo, <b>dentro de 20 días hábiles<\/b> desde que las aprueba el <b>comité de auditoría<\/b>, al que se las somete el Comité de Comunicación y Control (64ª y 43ª fr. I)."},{"encabezado":true,"color":"principal","titulo":"Crédito","subtitulo":"Política y Manual · igual que Bancos, salvo…","filas":[{"k":"SOFOM","v":"= Bancos en el plazo; sin comité de auditoría aprueba su Comité, su consejo o su director general (35ª fr. I)"}]},{"encabezado":true,"color":"morado","titulo":"Bursátil","subtitulo":"Política y Manual · igual que Bancos, salvo…","filas":[{"k":"Casas de bolsa","v":"= Bancos (3ª, 20ª, 63ª)"},{"k":"Asesores","v":"Los 20 días hábiles corren desde que <b>el Representante elabora<\/b> rcero y poderes. Extranjero no residente (III a): pasaporte y documento migratorio. PM (II): testimonio, estructura accionaria y propietario real. Anexo 1 con riesgo bajo: simplificado (IV). <b>Sólo Bancos tiene la fr. IV Bis<\/b>: dependencias y entidades públicas con riesgo <b>distinto a bajo<\/b>. Fideicomisos (IX). <b>Entrevista presencial<\/b> previa (7ª)."},{"encabezado":true,"color":"principal","titulo":"Crédito","subtitulo":"Expediente · igual que Bancos, salvo…","filas":[{"k":"SOFOM","v":"Previo a <b>celebrar<\/b> el contrato; fr. VII de coacreditados y obligados solidarios; sin IV Bis"}]},{"encabezado":true,"color":"morado","titulo":"Bursátil","subtitulo":"Expediente · igual que Bancos, salvo…","filas":[{"k":"Casas de bolsa","v":"= Bancos; entrevista en la 6ª; fideicomisos en la fr. X"},{"k":"Asesores","v":"= Bancos en estructura; sin Usuarios ni IV Bis"},{"k":"Fondos","v":"= Bancos en estructura; sin Usuarios ni IV Bis"}]},{"encabezado":true,"color":"turquesa","titulo":"Ahorro popular","subtitulo":"Expediente · igual que Bancos, salvo…","filas":[{"k":"SOCAP","v":"También antes de recibir <b>aportaciones al capital social<\/b>; fideicomisos Usuarios en la 5ª"},{"k":"SOFIPO","v":"Igual que SOCAP (aportaciones al capital social; 5ª)"},{"k":"Uniones","v":"Fr. VII de coacreditados y obligados solidarios; sin IV Bis"}]},{"encabezado":true,"color":"coral","titulo":"Cambios y envíos","subtitulo":"Expediente · igual que Bancos, salvo…","filas":[{"k":"Casas de cambio","v":"Por monto, en efectivo en moneda extranjera o cheques de viajero: <b>1,000 a &lt; 3,000 USD<\/b> datos · <b>3,000 a &lt; 5,000<\/b> + copia de identificación · <b>≥ 5,000<\/b> expediente completo. Sin entrevista. <b>Salvo<\/b> cuando recibe dólares en efectivo: rige su Cap. III Bis (datos y copia de identificación con independencia del monto, 24ª Bis)"},{"k":"Centros cambiarios","v":"Los mismos escalones de 1,000 / 3,000 USD, para cualquier operación individual"},{"k":"Transmisores","v":"Datos de la transferencia <b>con independencia del monto<\/b> (remitente; beneficiario en envíos en moneda extranjera o internacionales y al pagar); <b>500 a &lt; 3,000 USD<\/b> datos · <b>3,000 a &lt; 5,000<\/b> copia de identificación · <b>≥ 5,000<\/b> expediente"}]},{"encabezado":true,"color":"amarillo","titulo":"Fintech","subtitulo":"Expediente · igual que Bancos, salvo…","filas":[{"k":"ITF","v":"Art. 11: expediente <b>digital<\/b> al celebrar el contrato, con <b>geolocalización<\/b>, Firma Autógrafa Digitalizada, CURP y CLABE. Entrevista sólo con efectivo, activos virtuales o transferencias internacionales. <b>Sin fracción de fideicomiso<\/b> como Cliente"}]}],"nota":"Lo que dice «en su caso», «podrá» o «deberá» se respeta tal cual. Si una celda dice «= Bancos», es igual en sustancia; la numeración puede cambiar."},{"tipo":"tarjetas","id":"t2-1-2-niveles","nav":"Niveles","titulo":"2.1.2 · Régimen simplificado, niveles de cuenta e identificación no presencial","intro":"Dos preguntas que el examen cruza por sujeto: <b>¿con cuántos datos basta en una cuenta o contrato pequeño?<\/b> y <b>¿hasta cuánto se puede abrir a distancia?<\/b> Bancos primero. Las UDIS son de abonos <b>al mes<\/b> salvo que se diga otra cosa.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Bancos · niveles 1 a 3 y fr. IV","subtitulo":"14ª Bis · cuentas de depósito a la vista en MN","filas":[{"k":"Nivel 1 · PF","v":"Abonos hasta <b>750 UDIS<\/b> al mes · saldo máximo <b>1,000 UDIS<\/b> · nombre y fecha de nacimiento"},{"k":"Nivel 2 · PF","v":"Hasta <b>3,000 UDIS<\/b> al mes (+ <b>6,000<\/b> de programas gubernamentales) · nombre, fecha y domicilio"},{"k":"Nivel 3 · PF o PM","v":"Hasta <b>10,000 UDIS<\/b> al mes · datos de la 4ª + identificación"},{"k":"Fr. IV (sin nombre de nivel)","v":"Hasta <b>30,000 UDIS<\/b> al mes · contratación remota · PM o PFAE mexicanas residentes"},{"k":"Reglas","v":"UDI del último día del mes anterior. Más de una cuenta o rebasar el nivel: entrevista o mecanis
