ito","Cliente ocasional, figura intermedia que prevén las DCG de Bancos","Usuario, porque no es cuentahabiente y el acto es de ejecución instantánea","Usuario sólo si la operación es menor a 500 USD; si la iguala o la supera, Cliente"],"x":"La 2ª XXXVIII define al Usuario como quien opera sin relación comercial permanente, y aclara que no la hay cuando no es cuentahabiente y el acto es de ejecución instantánea. El monto no convierte al Usuario en Cliente: sólo cambia lo que se recaba de él (17ª). Las DCG no prevén un «cliente ocasional».","ref":"DCG Bancos 2ª IV y XXXVIII; 17ª"},{"id":"A013","tema":"2.1.1","tipo":"trampa","q":"¿Cuál de estas DCG NO define la figura de Usuario?","a":"La de Uniones de crédito","o":["La de Casas de bolsa","La de Sociedades financieras populares","La de SOFOM","La de Uniones de crédito"],"x":"Trampa: «el Usuario existe en todas las DCG». Falso. Sólo tienen Cliente: Asesores, Fondos y Uniones (2ª III; en Uniones, socios o terceros); la ITF también define sólo Cliente en su art. 2 fr. IV y el Usuario le aparece únicamente en la transmisión de dinero de las IFPE (art. 100). Sólo tienen Usuario: Casas de cambio, Centros cambiarios y Transmisores. Casas de bolsa, SOFIPO y SOFOM tienen ambas figuras, como Bancos.","ref":"DCG Uniones 2ª fr. III; DCG Casas de bolsa 2ª fr. XXXVII; DCG SOFIPO 2ª fr. XXXIX; DCG SOFOM 2ª fr. XXXVI; DCG ITF arts. 2 fr. IV y 100"},{"id":"A014","tema":"2.1.1","tipo":"caso","q":"La misma persona, sin cuenta ni contrato, hace una operación aislada en un banco y otra en un fondo de inversión. ¿Cómo la califica cada DCG?","a":"En el banco, Usuario; en el fondo, Cliente, porque su DCG no tiene Usuario","o":["En ambos, Usuario, porque no hay relación comercial permanente","En el banco, Cliente; en el fondo, Usuario, porque no celebró contrato con él","En ambos, Cliente, porque las dos DCG definen así a quien opera","En el banco, Usuario; en el fondo, Cliente, porque su DCG no tiene Usuario"],"x":"Bancos distingue Cliente (cuentahabiente o con contrato) y Usuario (sin relación comercial permanente). Las DCG de Fondos sólo definen Cliente: «cualquier persona física, moral o Fideicomiso que realice Operaciones con las Entidades» (2ª III). El distractor tentador aplica a Fondos la lógica de Bancos.","ref":"DCG Bancos 2ª IV y XXXVIII; DCG Fondos 2ª III"},{"id":"A015","tema":"2.1.1","tipo":"memoria","q":"¿En qué DCG el Usuario se presenta en dos modalidades, Usuario Remitente y Usuario Beneficiario?","a":"En las de Transmisores de dinero","o":["En las de Casas de cambio","En las de Transmisores de dinero","En las de Centros cambiarios","En las de Sociedades financieras populares"],"x":"La 2ª fr. XXXIX de Transmisores define al Usuario en dos supuestos: el Remitente (quien contrata el envío) y el Beneficiario (quien recibe los recursos). Casas de cambio y Centros cambiarios también tienen sólo Usuario, pero sin esas modalidades.","ref":"DCG Transmisores 2ª XXXIX"},{"id":"A016","tema":"2.1.1","tipo":"caso","q":"Una ITF realiza operaciones a través de un fideicomiso para recibir recursos de sus clientes. Según sus DCG, ¿cómo se tratan esas operaciones?","a":"Se les aplica lo relativo a las Cuentas Concentradoras","o":["El fideicomiso se identifica como Cliente, igual que en las DCG de Bancos","Se les aplica lo relativo a las Cuentas Concentradoras","El fideicomiso es Usuario, porque no tiene relación comercial permanente","Quedan fuera de las DCG, porque la ITF sólo identifica a personas físicas"],"x":"El art. 2 fr. IV define al Cliente de la ITF sólo como persona física o moral (sin Fideicomiso, a diferencia de Bancos), y la fr. VII dispone que a las operaciones que las ITF realicen a través de fideicomisos les es aplicable lo relativo a las Cuentas Concentradoras. No quedan fuera de las DCG ni se convierten en Usuario.","ref":"DCG ITF art. 2 fr. IV y VII"},{"id":"A017","tema":"2.1.2","tipo":"cifra","q":"Una institución de crédito modifica su Manual de Cumplimiento. ¿En qué plazo debe remitir a la CNBV las modificaciones con un ejemplar completo?","a":"Dentro de los 20 días hábiles siguientes a que las apruebe su comité de auditoría","o":["Dentro de los 20 días naturales siguientes a que las apruebe su consejo","Dentro de los 30 días hábiles siguientes a que las apruebe el Comité de Comunicación y Control","Dentro de los 10 días hábiles siguientes a que las elabore el Oficial de Cumplimiento","Dentro de los 20 días hábiles siguientes a que las apruebe su comité de auditoría"],"x":"La 64ª fija 20 días hábiles contados desde que el comité de auditoría aprueba las modificaciones; el Comité de Comunicación y Control sólo se las somete (43ª fr. I). El distractor tentador cambia hábiles por naturales: el plazo es en días hábiles.","ref":"DCG Bancos 64ª; 43ª fr. I"},{"id":"A018","tema":"2.1.2","tipo":"caso","q":"Un asesor en inversiones modifica su Manual de Cumplimiento. ¿Desde cuándo corren los 20 días hábiles para remitir las modificaciones a la CNBV?","a":"Desde que su Representante elabora las modificaciones","o":["Desde que su comité de auditoría aprueba las modificaciones","Desde que su consejo de administración las aprueba, previa opinión del Comité","Desde que la CNBV le requiere el ejemplar completo del Manual","Desde que su Representante elabora las modificaciones"],"x":"Igual que Bancos en el plazo (20 días hábiles), salvo el punto de partida: en Asesores corre desde que el Representante elabora las modificaciones (30ª fr. II), porque no tienen comité de auditoría ni Comité de Comunicación y Control. El distractor tentador traslada la regla de Bancos.","ref":"DCG Asesores 38ª; 30ª fr. II"},{"id":"A019","tema":"2.1.2","tipo":"caso","q":"Una SOCAP aprueba modificaciones a su Manual de Cumplimiento. Además de remitirlas a la CNBV, ¿a quién debe enviarlas según su DCG?","a":"Al Comité de Supervisión Auxiliar","o":["Al Comité de Supervisión de su Federación","A la CONDUSEF, por ser sociedad de ahorro popular","A la Unidad de Inteligencia Financiera de la SHCP","Al Comité de Supervisión Auxiliar"],"x":"La 67ª de SOCAP, último párrafo, ordena enviar el Manual y sus modificaciones también al Comité de Supervisión Auxiliar (órgano del Fondo de Protección). El distractor tentador es el «Comité de Supervisión», que corresponde a la SOFIPO (su 67ª). Fuera de ese envío adicional, el plazo es igual que en Bancos; la aprobación también, salvo que sin comité de auditoría aprueba su propio Comité (47ª fr. I).","ref":"DCG SOCAP 67ª; DCG SOFIPO 67ª"},{"id":"A020","tema":"2.1.2","tipo":"memoria","q":"En una ITF, ¿quién aprueba las modificaciones al Manual de Cumplimiento, desde cuya aprobación corren los 20 días hábiles para remitirlas a la CNBV?","a":"Su comisario, comité de auditoría o Comité, en su caso","o":["Sólo su comité de auditoría, como en Bancos","Su Oficial de Cumplimiento, con el visto bueno del consejo","Su comisario, comité de auditoría o Comité, en su caso","Su comité de riesgos, a propuesta del Comité de Comunicación y Control"],"x":"El art. 83 de las DCG de ITF admite tres órganos: comisario, comité de auditoría o Comité (de Comunicación y Control), según corresponda. El distractor tentador reduce la regla a la de Bancos (sólo comité de auditoría). El comité de riesgos aprueba en Bancos el modelo de riesgo de clientes, no el Manual.","ref":"DCG ITF art. 83"},{"id":"A021","tema":"2.1.2","tipo":"cifra","q":"En el expediente presencial de una persona física en un banco, ¿qué antigüedad máxima puede tener el comprobante de domicilio?","a":"No mayor a 3 meses a su fecha de emisión","o":["No mayor a 3 meses a su fecha de emisión","No mayor a 6 meses a su fecha de emisión","No mayor a 1 año a su fecha de emisión","No mayor a 2 meses a su fecha de emisión"],"x":"La 4ª fr. I exige copia del comprobante de domicilio con antigüedad no mayor a tres meses a su fecha de emisión. El distractor tentador de 6 meses confunde esta cifra con la del perfil y el grado de riesgo iniciales.","ref":"DCG Bancos 4ª fr. I"},{"id":"A022","tema":"2.1.2","tipo":"caso","q":"Un Usuario compra 800 USD en efectivo en la ventanilla de un banco y paga con pesos. Según la 17ª, ¿qué debe hacer el banco?","a":"Recabar y conservar en sus sistemas los datos de identificación del Usuario","o":["Integrar el expediente completo de la 4ª antes de realizar la compra de divisas","Recabar sus datos y, además, copia de su identificación oficial","Recabar y conservar en sus sistemas los datos de identificación del Usuario","Nada todavía: la obligación de recabar datos empieza en 1,000 USD"],"x":"La 17ª fr. I obliga a recabar datos del Usuario en operaciones individuales en efectivo iguales o superiores a 500 USD; la copia de la identificación se exige de 3,000 a menos de 5,000 USD, y el expediente de la 4ª desde 5,000 USD. El umbral de 1,000 USD es el de las casas de cambio y el de transferencias de Usuarios en Bancos (16ª II), no el del efectivo.","ref":"DCG Bancos 17ª fr. I"},{"id":"A023","tema":"2.1.2","tipo":"cifra","q":"Un Usuario quiere comprar en una casa de cambio dólares en efectivo por 800 USD, pagando en pesos. Según los escalones de la 4a de su DCG, ¿desde qué monto debe recabarse su información?","a":"Desde 1,000 USD por operación individual","o":["Desde 1,000 USD por operación individual","Desde 500 USD por operación individual","Desde 3,000 USD por operación individual","Desde 5,000 USD por operación individual"],"x":"Igual que Bancos en la lógica de escalones, salvo los montos: en Casas de cambio el primer escalón es de 1,000 a menos de 3,000 USD (sólo datos), luego 3,000 a menos de 5,000 (más copia de la identificación) y desde 5,000 el expediente. El distractor tentador, 500 USD, es el umbral de efectivo de Bancos y el de Transmisores. Ojo: si el Usuario VENDE dólares en efectivo (la casa de cambio los recibe), no aplican los escalones: la 4a remite únicamente al Cap. III Bis, que exige datos y copia de identificación con independencia del monto (24ª Bis).","ref":"DCG Casas de cambio 4a fr. I a III y último párr.; 24ª Bis; DCG Bancos 17ª"},{"id":"A024","tema":"2.1.2","tipo":"caso","q":"Un Usuario envía desde México a Estados Unidos el equivalente a 800 USD mediante un transmisor de dinero. ¿Qué debe recabar el transmisor?","a":"Datos de la transferencia y del remitente sin importar el monto, los del beneficiario por ser envío internacional, y los datos del escalón de 500 USD","o":["Ninguno, porque la operación de 800 USD es inferior al primer escalón de 1,000 USD que fija su DCG","Datos de la transferencia y del remitente sin importar el monto, los del beneficiario por ser envío internacional, y los datos del escalón de 500 USD","Datos y copia de la identificación oficial del remitente, sin recabar ningún dato del beneficiario del envío","El expediente completo del remitente antes de operar, con su comprobante de domicilio y la entrevista presencial"],"x":"Igual que Bancos, salvo Transmisores: su 4ª fr. I, inciso A, exige con independencia del monto los datos de la transferencia y del Usuario Remitente; los del Usuario Beneficiario se agregan en transferencias nacionales en moneda extranjera o internacionales (como este envío a Estados Unidos) y, cuando el transmisor paga como receptor, en el inciso B. La fr. II agrega datos de 500 a menos de 3,000 USD; la copia de la identificación es de 3,000 a menos de 5,000 (fr. III) y el expediente desde 5,000 (fr. IV). El escalón de 1,000 USD es el de casas de cambio y centros cambiarios. Ojo: en un envío nacional en pesos, la fr. I no pide los datos del beneficiario.","ref":"DCG Transmisores 4ª fr. I (incisos A y B) y fr. II"},{"id":"A025","tema":"2.1.2","tipo":"caso","q":"Una persona quiere hacerse socia de una SOCAP y entregar en ventanilla su aportación al capital social. ¿Cuándo debe integrarse su expediente?","a":"Previamente a recibir la aportación al capital social","o":["Después de recibir la aportación, al abrir su primera cuenta de ahorro","Sólo si la aportación supera el equivalente a 3,000 UDIS","Cuando la asamblea la admita formalmente como socia, al cierre del ejercicio","Previamente a recibir la aportación al capital social"],"x":"Igual que Bancos (expediente previo), salvo que en la SOCAP el expediente también es previo a recibir aportaciones al capital social, además de abrir cuentas o celebrar contratos (4ª). No hay umbral en UDIS para esta obligación.","ref":"DCG SOCAP 4ª"},{"id":"A026","tema":"2.1.2","tipo":"caso","q":"Una IFPE abre de forma remota una cuenta a una persona física que sólo hará pagos nacionales con fondos de pago electrónico, sin efectivo, activos virtuales ni envíos al extranjero. ¿Debe entrevistarla?","a":"No; su DCG exige entrevista sólo con efectivo, activos virtuales o transferencias internacionales","o":["Sí, siempre y de forma presencial, previo a la relación, como lo exige la 7ª de las DCG de Bancos","No; su DCG exige entrevista sólo con efectivo, activos virtuales o transferencias internacionales","Sí, aunque puede hacerla vía remota con cuestionarios automatizados","Sólo si sus operaciones superan el equivalente a 3,000 UDIS al mes"],"x":"Igual que Bancos, salvo la ITF: el art. 11 exige la entrevista sólo en cuentas o contratos que amparen operaciones en efectivo, con activos virtuales o transferencias internacionales, y en ese caso puede ser remota. El distractor tentador (remota con cuestionarios) describe cómo se hace la entrevista cuando sí procede, no este caso.","ref":"DCG ITF art. 11"},{"id":"A027","tema":"2.1.2","tipo":"memoria","q":"¿Qué regula la fracción IV Bis de la 4ª de las DCG de Bancos?","a":"El expediente de dependencias y entidades públicas del Anexo 1 con grado de riesgo distinto al bajo","o":["El expediente simplificado de las sociedades y entidades del Anexo 1 con riesgo bajo","El expediente de los fideicomisos que actúan como Usuarios de la institución de crédito","El expediente de dependencias y entidades públicas del Anexo 1 con grado de riesgo distinto al bajo","El expediente de personas morales extranjeras con documentos legalizados o apostillados"],"x":"La IV Bis (adicionada en la reforma de 28-ago-2024) regula a dependencias y entidades públicas y demás personas morales de derecho público del Anexo 1 clasificadas con riesgo distinto al bajo. La fr. IV es la que prevé el régimen simplificado del Anexo 1 con riesgo bajo; los fideicomisos Usuarios están en la 4ª Bis. Sólo Bancos tiene la IV Bis.","ref":"DCG Bancos 4ª fr. IV y IV Bis"},{"id":"A028","tema":"2.1.2","tipo":"trampa","q":"¿Cuál de estos sujetos NO tiene en su DCG una fracción para integrar el expediente de un Fideicomiso como Cliente?","a":"La ITF","o":["Bancos","Casas de bolsa","SOFOM","La ITF"],"x":"Trampa: suponer que todas identifican fideicomisos como Clientes. Las DCG de ITF definen al Cliente sólo como persona física o moral; su art. 11 no tiene fracción de Fideicomisos (sólo menciona al fideicomiso cuando es el Propietario Real) y las operaciones a través de fideicomisos se tratan como Cuenta Concentradora. Bancos (4ª IX), Casas de bolsa (4ª X) y SOFOM (4ª IX) sí la tienen.","ref":"DCG ITF arts. 2 fr. IV y VII, y 11; DCG Bancos 4ª IX"},{"id":"A029","tema":"2.1.2","tipo":"memoria","q":"Según la 4ª Ter de las DCG de Bancos, ¿a quién puede abrirse una cuenta no presencial por Dispositivos y qué dato debe obtenerse como regla general?","a":"A personas físicas o morales de nacionalidad mexicana; la Geolocalización del Dispositivo","o":["A personas físicas mexicanas o extranjeras residentes; una videollamada grabada","A personas físicas o morales de nacionalidad mexicana; la Geolocalización del Dispositivo","Sólo a personas físicas mexicanas; la e.firma como único requisito de consentimiento","A personas físicas o morales mexicanas y extranjeras; la CURP validada en línea ante el RENAPO"],"x":"La 4ª Ter permite la apertura no presencial por Dispositivos a Clientes personas físicas o morales, ambas de nacionalidad mexicana, conforme a las disposiciones que emita la CNBV, y exige obtener la Geolocalización del Dispositivo, además del consentimiento (que podrá darse con Firma Electrónica o Firma Electrónica Avanzada) y demás datos. No incluye extranjeros. Salvo las entidades del Anexo 1 con riesgo bajo, sin Geolocalización no se abre.","ref":"DCG Bancos 4ª Ter"},{"id":"A030","tema":"2.1.2","tipo":"caso","q":"Una SOFOM no regulada quiere otorgar en forma no presencial un crédito sin garantía inmobiliaria de 50,000 UDIS a una persona física mexicana. ¿Qué mecanismo de su Anexo 2 le corresponde?","a":"El del art. 5, cuyo tope es de 60,000 UDIS","o":["El del art. 4, cuyo tope es de 60,000 UDIS","El del art. 4, cuyo tope es de 100,000 UDIS","Ninguno: su Anexo 2 sólo cubre depósitos de hasta 30,000 UDIS al mes","El del art. 5, cuyo tope es de 60,000 UDIS"],"x":"En el Anexo 2 de SOFOM (art. 2), para créditos sin garantía inmobiliaria, el mecanismo del art. 4 llega a 30,000 UDIS y el del art. 5 a 60,000 UDIS. Con 50,000 UDIS se rebasa el art. 4, así que corresponde el art. 5. El distractor tentador atribuye al art. 4 el tope de 60,000, que es el de la SOCAP en crédito.","ref":"DCG SOFOM 4ª Ter; Anexo 2 art. 2"},{"id":"A031","tema":"2.1.2","tipo":"caso","q":"Una SOCAP quiere otorgar en forma no presencial un crédito al consumo de 50,000 UDIS a una persona física mexicana. ¿Hasta dónde le alcanza el mecanismo del art. 4 de su Anexo 2?","a":"Le alcanza: en crédito, el art. 4 llega a 60,000 UDIS","o":["No le alcanza: el art. 4 sólo llega a 30,000 UDIS en cualquier producto","Le alcanza: en crédito, el art. 4 llega a 60,000 UDIS","No le alcanza: la SOCAP sólo identifica a distancia aportaciones y depósitos","Le alcanza: en crédito, el art. 4 llega a 100,000 UDIS"],"x":"Igual que SOFOM en estructura, salvo los montos: en SOCAP el art. 4 cubre aportaciones y depósitos de hasta 30,000 UDIS al mes y créditos de hasta 60,000 UDIS; el art. 5, hasta 60,000 y 100,000 UDIS. El distractor tentador (30,000 para todo) es el tope del art. 4 en depósitos; 100,000 es el del art. 5 en crédito.","ref":"DCG SOCAP 4ª Bis; Anexo 2 art. 2"},{"id":"A032","tema":"2.1.2","tipo":"cifra","q":"Un transmisor de dinero opera en forma no presencial con una persona moral mexicana usando el mecanismo del art. 5 de su Anexo 2. ¿Cuál es el tope?","a":"7,000 USD en el transcurso de un mes calendario","o":["5,000 USD en el transcurso de un mes calendario","7,000 USD en el transcurso de un mes calendario","5,000 USD por operación, sólo con personas físicas","30,000 UDIS en el transcurso de un mes calendario"],"x":"El Anexo 2 de Transmisores fija para PF, PFAE y PM mexicanas 5,000 USD al mes con el mecanismo del art. 4 y 7,000 USD al mes con el del art. 5. El distractor tentador, 5,000 USD, es el del art. 4; los 30,000 UDIS al mes son el tope del art. 4 en Casas de bolsa, Fondos y Asesores.","ref":"DCG Transmisores 4ª Bis; Anexo 2 art. 2"},{"id":"A033","tema":"2.1.2","tipo":"caso","q":"Una casa de cambio quiere celebrar operaciones no presenciales por Dispositivos con una persona moral mexicana. ¿Lo prevé su DCG?","a":"No: su 4a Bis sólo contempla Usuarios personas físicas, mexicanas o extranjeras","o":["Sí, en operaciones de hasta 5,000 USD, siempre que obtenga la aprobación previa de la CNBV","Sí, hasta 7,000 USD al mes, igual que los transmisores de dinero","No: su 4a Bis sólo contempla Usuarios personas físicas, mexicanas o extranjeras","Sí, con el mecanismo del art. 4 de su Anexo 2, hasta 30,000 UDIS al mes"],"x":"La 4a Bis de Casas de cambio regula operaciones no presenciales sólo con Usuarios personas físicas (mexicanas o extranjeras), y su Anexo 2, art. 1, habla de PF mexicanas en operaciones de hasta 5,000 USD con aprobación previa de la CNBV. El distractor tentador toma ese tope y lo aplica a una persona moral; Transmisores sí admite PM.","ref":"DCG Casas de cambio 4a Bis; Anexo 2 art. 1"},{"id":"A034","tema":"2.1.2","tipo":"trampa","q":"¿Cuál de estos sujetos NO prevé en su DCG la identificación o contratación no presencial?","a":"Los centros cambiarios","o":["Las casas de cambio","Los transmisores de dinero","Los centros cambiarios","Las uniones de crédito"],"x":"Trampa: «Cambios y envíos se identifican a distancia igual». Las DCG de Centros cambiarios no tienen 4ª Bis ni 4ª Ter ni Anexo 2 de identificación no presencial, ni hablan de Dispositivos o Geolocalización. Casas de cambio (4a Bis, sólo PF), Transmisores (4ª Bis) y Uniones (4ª Bis, optativa) sí la prevén.","ref":"DCG Centros cambiarios (sin 4ª Bis/Ter ni Anexo 2); DCG Casas de cambio 4a Bis; DCG Transmisores 4ª Bis; DCG Uniones 4ª Bis"},{"id":"A035","tema":"2.1.2","tipo":"caso","q":"Durante la identificación, un banco estima razonablemente que continuar alertaría al posible cliente de que sospecha de sus recursos. ¿Qué prevé la 10ª Ter?","a":"Podrá suspender el proceso y deberá remitir un reporte de Operación Inusual de 24 horas, que puede elaborarse manualmente","o":["Podrá suspender el proceso y deberá remitir un reporte de Operación Inusual de 24 horas, que puede elaborarse manualmente","Deberá concluir la identificación y reportar la operación en el reporte de Operaciones Inusuales ordinario","Podrá suspender el proceso y deberá avisar a la CNBV dentro de los 10 días hábiles siguientes, con su expediente","Deberá suspender el proceso y ya no reportar nada, porque no llegó a celebrarse ninguna Operación con él"],"x":"La 10ª Ter permite (es «podrá») suspender ante (I) posible relación con 139 Quáter o 400 Bis, (II) riesgo de alertar al cliente o (III) riesgos según el Manual; si suspende, debe generar el ROI de 24 horas, que puede hacerse manual, y remitirlo dentro de 24 horas desde que conoce la información. No suspender ni reportar no es opción.","ref":"DCG Bancos 10ª Ter"},{"id":"A036","tema":"2.1.2","tipo":"caso","q":"Una ITF estima razonablemente que, si continúa la identificación, alertaría al cliente de su sospecha. ¿Qué prevé su DCG?","a":"Podrá no continuar y remitirá el reporte de Operación Inusual correspondiente; ese artículo no fija 24 horas","o":["Podrá suspender, como Bancos, también ante riesgos de su Manual, con reporte de 24 horas","Podrá no continuar y remitirá el reporte de Operación Inusual correspondiente; ese artículo no fija 24 horas","Deberá concluir la identificación y someter al cliente a un monitoreo reforzado","Podrá no continuar sin reportar, porque no llegó a celebrarse ninguna Operación"],"x":"Igual que Bancos, salvo la ITF: su art. 28 sólo prevé «no continuar» cuando continuar alertaría al cliente (no las fr. I y III de la 10ª Ter de Bancos) y ordena remitir «el Reporte de Operación Inusual correspondiente» sin fijar en ese artículo el plazo de 24 horas. El plazo de 24 horas puede venir del art. 73 fr. I (Cliente que pretende o intenta una Operación sospechosa).","ref":"DCG ITF art. 28; DCG Bancos 10ª Ter"},{"id":"A037","tema":"2.1.2","tipo":"caso","q":"Una SOCAP recibe una aportación al capital social de una persona a la que no ha podido identificar. ¿Qué dispone su 9ª?","a":"Le prohíbe recibir aportaciones al capital social en las que no se pueda identificar al Cliente","o":["Puede recibirla si la aportación es menor al equivalente a 3,000 UDIS","Le prohíbe recibir aportaciones al capital social en las que no se pueda identificar al Cliente","La 9ª sólo prohíbe cuentas y contratos anónimos; las aportaciones se rigen por sus estatutos","Puede recibirla, siempre que la reporte después como Operación Inusual de 24 horas"],"x":"Igual que Bancos (10ª), salvo que la 9ª de SOCAP extiende la prohibición a recibir aportaciones al capital social anónimas, con nombres ficticios o sin poder identificar al Cliente o al Propietario Real. No hay excepción por monto.","ref":"DCG SOCAP 9ª; DCG Bancos 10ª"},{"id":"A038","tema":"2.1.2","tipo":"cifra","q":"En las DCG de Bancos, ¿qué límites tiene una cuenta nivel 1 de persona física?","a":"Abonos de hasta 750 UDIS al mes y saldo máximo de 1,000 UDIS","o":["Abonos de hasta 1,000 UDIS al mes y saldo máximo de 750 UDIS","Abonos de hasta 750 UDIS al mes y saldo máximo de 1,000 UDIS","Abonos de hasta 3,000 UDIS al mes, sin saldo máximo","Abonos de hasta 750 UDIS al mes y saldo máximo de 3,000 UDIS"],"x":"La 14ª Bis fr. I limita el nivel 1 a abonos equivalentes a 750 UDIS por cliente en un mes calendario y a un saldo máximo de 1,000 UDIS; basta nombre y fecha de nacimiento. El distractor tentador invierte las cifras. 3,000 UDIS al mes es el nivel 2.","ref":"DCG Bancos 14ª Bis fr. I"},{"id":"A039","tema":"2.1.2","tipo":"cifra","q":"Una persona física con cuenta nivel 2 en un banco recibe fondos de un programa gubernamental de apoyo. ¿Cuánto puede recibir por ese concepto?","a":"Hasta 6,000 UDIS al mes, adicionales a los 3,000 UDIS del nivel","o":["Hasta 3,000 UDIS al mes, dentro del mismo límite del nivel","Hasta 6,000 UDIS al mes, adicionales a los 3,000 UDIS del nivel","Hasta 6,000 UDIS al mes, dentro del mismo límite del nivel","Sin límite, porque los fondos de programas gubernamentales están exentos"],"x":"La 14ª Bis fr. II permite recibir fondos de programas gubernamentales hasta 6,000 UDIS por cliente en un mes calendario, adicionales al nivel transaccional máximo de 3,000 UDIS. La palabra clave es «adicional»: no se descuentan del límite del nivel.","ref":"DCG Bancos 14ª Bis fr. II"},{"id":"A040","tema":"2.1.2","tipo":"caso","q":"Una persona moral mexicana residente quiere abrir de forma remota en un banco una cuenta con abonos de 25,000 UDIS al mes. ¿Qué régimen simplificado de la 14ª Bis le corresponde?","a":"El de la fr. IV: abonos de hasta 30,000 UDIS al mes, para PM o PFAE mexicanas residentes contratadas en forma remota","o":["El nivel 3 (fr. III), porque admite personas físicas y morales sin tope mensual de abonos","Ninguno: las personas morales sólo pueden abrir cuentas con el expediente completo","El de la fr. IV: abonos de hasta 30,000 UDIS al mes, para PM o PFAE mexicanas residentes contratadas en forma remota","El nivel 2 (fr. II), que admite personas morales con 6,000 UDIS adicionales al mes"],"x":"La 14ª Bis fr. IV (la norma no la llama «nivel 4») prevé cuentas de hasta 30,000 UDIS al mes contratadas en forma remota por PM o PFAE de nacionalidad mexicana con residencia en territorio nacional. El nivel 3 (PF o PM) llega sólo a 10,000 UDIS al mes, y el nivel 2 es sólo para personas físicas.","ref":"DCG Bancos 14ª Bis fr. II, III y IV"},{"id":"A041","tema":"2.1.2","tipo":"caso","q":"Un cliente con cuenta nivel 2 en un banco abre en la misma institución otra cuenta nivel 1. ¿Qué exige la 14ª Bis?","a":"Entrevista presencial o los mecanismos tecnológicos de la CNBV, y expediente completo","o":["Nada adicional, porque cada cuenta respeta por separado su propio límite","Cancelar la cuenta nivel 1 y conservar únicamente la de nivel más alto","Reclasificarlo como cliente de riesgo alto y avisar de inmediato al Oficial de Cumplimiento","Entrevista presencial o los mecanismos tecnológicos de la CNBV, y expediente completo"],"x":"La 14ª Bis dispone que, si un mismo Cliente tiene más de una cuenta en la misma entidad (con independencia del nivel) o rebasa el monto máximo, debe hacerse la entrevista presencial de la 7ª o aplicarse los mecanismos tecnológicos de la CNBV e integrarse el expediente completo de la 4ª o 4ª Ter. No obliga a cancelar ni a reclasificar por ese solo hecho.","ref":"DCG Bancos 14ª Bis"},{"id":"A042","tema":"2.1.2","tipo":"trampa","q":"Se suele afirmar que «todas las DCG tienen cuentas por niveles, como Bancos». ¿Qué DCG, además de la de Bancos, clasifica cuentas o contratos por niveles?","a":"La de ITF, con niveles 1 y 2","o":["La de ITF, con niveles 1 y 2","La de SOFIPO, con los mismos niveles de cuenta que Bancos","La de Casas de bolsa, con niveles 1 y 2","La de SOFOM, con niveles 1 a 3 de crédito"],"x":"Trampa: «todas tienen cuentas por niveles» es falso. Sólo Bancos clasifica por niveles (1 a 3, más la cuenta remota de 30,000 UDIS de la fr. IV, 14ª Bis) y la ITF niveles 1 y 2 (art. 12). Los demás simplifican de otra forma: SOFOM y Uniones por crédito; Casas de bolsa, Fondos y Asesores con contratos inferiores a 3,000 UDIS al mes; SOCAP y SOFIPO con una cuenta a la vista de 3,000 UDIS; Casas de cambio, con operaciones por medios electrónicos inferiores a 2,000 UDIS al mes (9a). El distractor de SOFIPO es tentador porque su cuenta de 3,000 UDIS equivale al nivel 2, pero no reproduce los niveles de Bancos.","ref":"DCG Bancos 14ª Bis; DCG ITF art. 12; DCG SOFIPO 15ª; DCG Casas de cambio 9a"},{"id":"A043","tema":"2.1.2","tipo":"caso","q":"Una persona moral pide un crédito con línea de exactamente 10,000 UDIS. ¿Procede el expediente simplificado de bajo riesgo en una SOFOM y en una unión de crédito?","a":"En la unión de crédito sí (inferior o igual a 10,000 UDIS); en la SOFOM no (exige inferior a 10,000)","o":["En la SOFOM sí (inferior o igual a 10,000 UDIS); en la unión de crédito no (exige inferior a 10,000)","En ambas sí, porque las dos admiten crédito simplificado a personas morales hasta 10,000 UDIS","En la unión de crédito sí (inferior o igual a 10,000 UDIS); en la SOFOM no (exige inferior a 10,000)","En ninguna, porque el crédito simplificado de las dos sólo es para personas físicas"],"x":"SOFOM 13ª fr. II: PF o PM con línea «inferior» a 10,000 UDIS. Uniones 11ª fr. II: «inferior o igual» a 10,000 UDIS. Con exactamente 10,000 UDIS, sólo procede en la unión. Distingue «menor a» de «hasta». Ambas admiten PM en esa fracción; la de ≤ 3,000 UDIS es sólo para PF.","ref":"DCG SOFOM 13ª fr. II; DCG Uniones 11ª fr. II"},{"id":"A044","tema":"2.1.2","tipo":"caso","q":"Una persona moral pacta con un asesor en inversiones un contrato con operaciones de 2,000 UDIS al mes. ¿Puede el asesor integrar el expediente simplificado de su 8ª Ter?","a":"No: la 8ª Ter sólo aplica a Clientes personas físicas","o":["No: la 8ª Ter sólo aplica a Clientes personas físicas","Sí, porque el contrato es inferior a 3,000 UDIS al mes por cliente y asesor","Sí, con denominación, fecha de constitución y domicilio, como lo prevé su 8ª Ter","No, porque el límite de los contratos simplificados del asesor es de 750 UDIS al mes"],"x":"Igual que Casas de bolsa y Fondos (contratos inferiores a 3,000 UDIS al mes), salvo Asesores: su 8ª Ter sólo comprende a Clientes personas físicas. El distractor tentador aplica el monto y olvida el tipo de persona. 750 UDIS es el nivel 1 de Bancos e ITF.","ref":"DCG Asesores 8ª Ter; DCG Casas de bolsa 12ª"},{"id":"A045","tema":"2.1.2","tipo":"caso","q":"Una persona física quiere abrir en una SOCAP, sin acudir a sucursal, la cuenta a la vista simplificada de hasta 3,000 UDIS de abonos al mes (14ª). ¿Qué prevé su DCG?","a":"Puede recabar sus datos de forma remota, en sustitución de la entrevista, validándolos con el Registro Nacional de Población (7ª, cuarto párrafo)","o":["No puede: su DCG no prevé ninguna forma remota para esa cuenta y la persona debe acudir a sucursal","Puede, pero sólo si la cuenta recibe exclusivamente fondos de programas gubernamentales de apoyo","Puede recabar sus datos de forma remota, en sustitución de la entrevista, validándolos con el Registro Nacional de Población (7ª, cuarto párrafo)","Puede, siempre que los abonos de la cuenta no rebasen 750 UDIS en el transcurso de un mes calendario"],"x":"La 14ª de SOCAP describe la cuenta «abierta de forma presencial», pero su segundo párrafo y la 7ª, cuarto párrafo, permiten la captura remota de datos validada con el RENAPO, en sustitución de la entrevista. La SOFIPO (15ª) lo dice desde el primer párrafo: «presencial o en términos de la 7ª, cuarto párrafo». El tope de 750 UDIS es el nivel 1 de Bancos, no la cuenta de SOCAP.","ref":"DCG SOCAP 7ª, 4º párr., y 14ª; DCG SOFIPO 15ª"},{"id":"A046","tema":"2.1.2","tipo":"caso","q":"Un banco abre cuentas de nómina, a petición de una empresa cliente, a nombre de sus trabajadores. ¿Quién puede integrar y conservar el expediente de cada trabajador?","a":"La empresa cliente, si lo conviene con el banco y se lo entrega cuando la CNBV lo requiera","o":["Sólo el banco, sin excepción, porque la obligación de identificar es indelegable","El IMSS, como fuente oficial de los datos laborales de cada trabajador","La empresa cliente, si lo conviene con el banco y se lo entrega cuando la CNBV lo requiera","Cada trabajador, mediante una declaración firmada que el banco conserva"],"x":"La 13ª permite que el expediente de los trabajadores lo integre y conserve el Cliente solicitante (el patrón) en lugar del banco, siempre que se convenga contractualmente que lo mantendrá a disposición y lo proporcionará para presentarlo a la CNBV cuando esta lo requiera.","ref":"DCG Bancos 13ª"},{"id":"A047","tema":"2.1.2","tipo":"cifra","q":"A petición de la SHCP o de la CNBV, ¿en qué plazo debe un banco informar el destino o uso de las tarjetas prepagadas bancarias de la 19ª?","a":"En un plazo que no exceda de dos meses desde la petición","o":["Dentro de las 24 horas siguientes a la petición","Dentro de los 10 días hábiles siguientes a que reciba la petición","Dentro de los 20 días hábiles siguientes a la petición","En un plazo que no exceda de dos meses desde la petición"],"x":"La 19ª obliga a proporcionar, en un plazo que no exceda de dos meses, la información del destino o uso del medio de pago, incluidas las localidades donde se usó. Las 24 horas son del ROI urgente, y los 20 días hábiles, del envío de modificaciones al Manual.","ref":"DCG Bancos 19ª"},{"id":"A048","tema":"2.1.2","tipo":"trampa","q":"Un transmisor de dinero quiere contratar como Agente Relacionado a una sociedad anónima para pagar remesas. ¿Es posible con esa figura?","a":"No: el Agente Relacionado es persona física; una persona moral sería Persona Jurídica Coadyuvante","o":["No: el Agente Relacionado es persona física; una persona moral sería Persona Jurídica Coadyuvante","Sí: el Agente Relacionado puede ser persona física o moral, si celebra contrato","Sí, siempre que la sociedad anónima esté registrada ante la CNBV como transmisor","No: una persona moral sólo puede participar como Tercero de un Agente Relacionado"],"x":"Trampa: «el agente relacionado puede ser persona moral». En las DCG de Transmisores, el Agente Relacionado es la persona física (2ª I); la persona moral o PFAE es la Persona Jurídica Coadyuvante (2ª XXVIII); el Tercero (2ª XXXV) contrata con un agente o coadyuvante, y puede ser PF o PM.","ref":"DCG Transmisores 2ª I, XXVIII y XXXV"},{"id":"A049","tema":"2.1.2","tipo":"cifra","q":"En una IFPE, un cliente realiza en un mes operaciones en efectivo y en fondos de pago electrónico por 8,000 UDIS. ¿Le aplica el seguimiento más estricto del art. 43?","a":"Sí: en las IFPE el umbral es de 7,500 UDIS al mes","o":["No: el umbral es de 12,500 UDIS al mes para toda ITF","Sí: en las IFPE el umbral es de 7,500 UDIS al mes","No: el seguimiento estricto sólo aplica a operaciones con activos virtuales","Sí, pero sólo si además hay transferencias internacionales en el mes"],"x":"El art. 43 exige mecanismos más estrictos en las IFPE desde 7,500 UDIS al mes (efectivo, fondos de pago electrónico o activos virtuales) y en las IFC desde 12,500 UDIS al mes (efectivo o activos virtuales). El distractor tentador toma el umbral de las IFC.","ref":"DCG ITF art. 43"},{"id":"A050","tema":"2.1.2","tipo":"caso","q":"Una SOFOM conviene con una empresa cliente que esta recabe los datos de los tarjetahabientes. ¿Qué tarjetas a terceros regula la 5ª de las DCG de SOFOM?","a":"Tarjetas de crédito emitidas a personas distintas del titular del contrato","o":["Tarjetas de débito y otros medios de pago, igual que en la 5ª de las DCG de Bancos","Tarjetas prepagadas en moneda nacional para personas extranjeras","Tarjetas recargables emitidas por la propia SOFOM o por otras sociedades","Tarjetas de crédito emitidas a personas distintas del titular del contrato"],"x":"Igual que Bancos en la mecánica (contrato marco en el que el cliente recaba los datos de los tarjetahabientes), salvo el producto: la 5ª de SOFOM trata tarjetas de crédito, mientras que la de Bancos habla de medios de pago, incluidas tarjetas de débito. Las tarjetas recargables son figura de SOCAP y SOFIPO.","ref":"DCG SOFOM 5ª; DCG Bancos 5ª"},{"id":"A051","tema":"2.1.2","tipo":"caso","q":"Un banco clasifica como de riesgo bajo a una persona física que abre una cuenta. ¿Puede verificar sus datos y documentos después de la apertura?","a":"Sí, pero debe informarle que no podrá operar hasta que concluya la verificación","o":["No, la verificación siempre debe concluir antes de abrir la cuenta","Sí, y mientras tanto el cliente puede operar hasta el límite de una cuenta nivel 1","Sí, dentro de los seis meses siguientes, sin restricción para operar","Sí, pero debe informarle que no podrá operar hasta que concluya la verificación"],"x":"La 15ª Bis permite que, en clientes de riesgo bajo, la verificación se haga con posterioridad a la apertura, pero el banco debe informar que no podrán realizarse Operaciones hasta que concluya. La verificación puede ser presencial o no presencial y hacerla un tercero, sin que el banco quede eximido.","ref":"DCG Bancos 15ª Bis"},{"id":"A052","tema":"2.1.2","tipo":"trampa","q":"¿En cuál de estas DCG NO se prevé que la verificación de datos y documentos de un cliente o usuario de riesgo bajo se haga con posterioridad?","a":"En la de Transmisores de dinero","o":["En la de Transmisores de dinero","En la de Bancos","En la de Sociedades financieras de objeto múltiple","En la de Casas de cambio"],"x":"Trampa: suponer que todos pueden diferir la verificación por riesgo bajo. La 8ª Bis de Transmisores no tiene el párrafo de verificación «con posterioridad»: ordena verificar e informar al Usuario que no podrá operar hasta que concluya. Bancos (15ª Bis), SOFOM (13ª Ter) y Casas de cambio (9a Bis) sí lo permiten para riesgo bajo.","ref":"DCG Transmisores 8ª Bis; DCG Bancos 15ª Bis; DCG SOFOM 13ª Ter; DCG Casas de cambio 9a Bis"},{"id":"A053","tema":"2.1.2","tipo":"caso","q":"Un banco tiene un cliente persona moral de riesgo bajo y otro cliente de riesgo alto. ¿Qué exige la 21ª respecto de sus expedientes?","a":"PM: completo, pudiendo optar por no actualizarlo; riesgo alto: verificar al menos una vez al año","o":["Ambos: actualizar los datos y documentos al menos una vez al año","PM de riesgo bajo: actualizar cada año; riesgo alto: cada seis meses","Ninguno: la actualización sólo procede cuando el cliente la solicita","PM: completo, pudiendo optar por no actualizarlo; riesgo alto: verificar al menos una vez al año"],"x":"La 21ª: los expedientes de PM deben estar completos y actualizados con independencia del riesgo, pero si la PM es de riesgo bajo la entidad puede optar por no actualizarlos; los de riesgo alto se verifican cuando menos una vez al año. El distractor tentador («ambos, anual») es la regla de la ITF, no la de Bancos.","ref":"DCG Bancos 21ª"},{"id":"A054","tema":"2.1.2","tipo":"caso","q":"Una ITF tiene un cliente de riesgo bajo cuyo expediente lleva dos años sin revisarse. ¿Qué exige su DCG?","a":"Revisarlo y, en su caso, actualizarlo por lo menos una vez al año, cualquiera que sea el riesgo","o":["Revisarlo y, en su caso, actualizarlo por lo menos una vez al año, cualquiera que sea el riesgo","Nada: la revisión anual sólo es obligatoria para los clientes de riesgo alto","Revisarlo cada seis meses, al reevaluar el grado de riesgo del cliente","Nada: puede optar por no actualizar a los clientes de riesgo bajo"],"x":"Igual que Bancos, salvo la ITF: su art. 24 obliga a revisar y, en su caso, actualizar los expedientes de todos sus Clientes por lo menos una vez al año, con independencia de su Grado de Riesgo. En Bancos la verificación anual es sólo para riesgo alto, y la opción de no actualizar es para PM de riesgo bajo (21ª).","ref":"DCG ITF art. 24; DCG Bancos 21ª"},{"id":"A055","tema":"2.1.2","tipo":"memoria","q":"Para el perfil transaccional de un cliente que opera en forma no presencial, ¿qué elemento adicional debe tomar en cuenta un banco según la 24ª?","a":"La Geolocalización del Dispositivo desde el que se realiza la operación","o":["La dirección IP y el historial de navegación del cliente en la banca digital","El riesgo del país de nacimiento del cliente según las listas del GAFI","La Geolocalización del Dispositivo desde el que se realiza la operación","La calificación crediticia del cliente en las sociedades de información"],"x":"La 24ª basa el perfil en monto, número, tipo, naturaleza y frecuencia de las operaciones, origen y destino de los recursos y el conocimiento del ejecutivo; si la operación es no presencial, añade la Geolocalización del Dispositivo, que puede amparar las operaciones de la sesión activa.","ref":"DCG Bancos 24ª"},{"id":"A056","tema":"2.1.2","tipo":"cifra","q":"¿Con qué periodicidad mínima debe un banco evaluar el perfil transaccional de sus clientes?","a":"Al menos cada seis meses","o":["Al menos cada tres meses","Al menos una vez al año","Sólo cuando el sistema de alertas detecte una desviación","Al menos cada seis meses"],"x":"La 25ª Quáter: perfil transaccional inicial con la información de al menos los seis primeros meses, y evaluación del perfil al menos cada seis meses. El distractor tentador (una vez al año) es el ritmo de Asesores en inversiones.","ref":"DCG Bancos 25ª Quáter"},{"id":"A057","tema":"2.1.2","tipo":"caso","q":"Un asesor en inversiones y una casa de bolsa revisan el perfil transaccional y el grado de riesgo de sus clientes. ¿Cuántas evaluaciones mínimas por año calendario exige cada DCG?","a":"Asesor, una; casa de bolsa, dos","o":["Ambos, dos por año calendario","Asesor, una; casa de bolsa, dos","Asesor, dos; casa de bolsa, una","Ambos, una por año calendario"],"x":"Casas de bolsa (como SOFOM, Fondos, SOCAP, SOFIPO y Uniones) exige al menos dos evaluaciones por año calendario; Asesores, al menos una. En ambos casos, sobre clientes con contrato de al menos seis meses de antigüedad. Bancos e ITF, en cambio, evalúan al menos cada seis meses.","ref":"DCG Asesores 13ª; DCG Casas de bolsa 23ª"},{"id":"A058","tema":"2.1.2","tipo":"memoria","q":"En Bancos, ¿quién aprueba el modelo de evaluación de riesgos con el que se determina el grado de riesgo de los clientes?","a":"El comité de riesgos, a propuesta del Comité de Comunicación y Control, e informa al consejo","o":["El comité de auditoría, a propuesta del Oficial de Cumplimiento, e informa al consejo","El Comité de Comunicación y Control, que después lo informa al comité de riesgos para su registro","El comité de riesgos, a propuesta del Comité de Comunicación y Control, e informa al consejo","El consejo de administración, previa opinión favorable de la CNBV sobre el modelo"],"x":"La 25ª Bis exige un modelo coherente con la metodología del Cap. II Bis, aprobado por el comité de riesgos con base en la propuesta del Comité, el cual lo informa al consejo de administración o directivo. El comité de auditoría aprueba las modificaciones al Manual, no el modelo de riesgo de clientes.","ref":"DCG Bancos 25ª Bis"},{"id":"A059","tema":"2.1.2","tipo":"caso","q":"Una SOFOM y una ITF diseñan la clasificación de sus clientes personas físicas. ¿Cuántos grados de riesgo deben establecer como mínimo?","a":"SOFOM, dos (alto y bajo); ITF, tres (bajo, medio y alto)","o":["Ambas, tres (bajo, medio y alto), porque es el mínimo común de las DCG","SOFOM, dos (alto y bajo); ITF, tres (bajo, medio y alto)","SOFOM, tres; ITF, dos (alto y bajo)","Ambas, dos (alto y bajo)"],"x":"SOFOM (como Casas de bolsa, Fondos, SOCAP, SOFIPO, Uniones y Asesores): mínimo dos grados para PF y tres para PM y fideicomisos. ITF (art. 29): al menos tres grados (bajo, medio y alto) para todos sus clientes. Bancos deja que su modelo fije tantos grados intermedios como necesite.","ref":"DCG SOFOM 21ª; DCG ITF art. 29"},{"id":"A060","tema":"2.1.2","tipo":"memoria","q":"Según la 28ª de las DCG de Bancos, ¿cuándo y con qué herramienta deben clasificarse los clientes por grado de riesgo?","a":"Al inicio de la relación comercial, con los sistemas automatizados de la 51ª","o":["Al inicio de la relación comercial, con los sistemas automatizados de la 51ª","Al cumplirse seis meses de relación, con el modelo aprobado por el consejo de administración","Al primer reporte de Operación Relevante, con el sistema de alertas","Al cierre de cada ejercicio, con una revisión manual del ejecutivo"],"x":"La 28ª ordena clasificar a los Clientes en función de su grado de riesgo, utilizando los sistemas automatizados de la 51ª, y al inicio de la relación comercial. La información de los seis primeros meses sirve para fijar el grado inicial (25ª Bis), pero la clasificación empieza desde el inicio.","ref":"DCG Bancos 28ª; 25ª Bis"},{"id":"A061","tema":"2.1.2","tipo":"cifra","q":"En las DCG de Bancos, ¿hasta qué grado de parentesco se asimilan los parientes a la PEP, y por cuánto tiempo sigue considerándose PEP nacional a quien deja el cargo?","a":"Hasta el segundo grado; durante el año siguiente","o":["Hasta el cuarto grado; durante los dos años siguientes","Hasta el segundo grado; durante los tres años siguientes","Hasta el segundo grado; durante el año siguiente","Hasta el tercer grado; durante el año siguiente"],"x":"La 2ª XXXI asimila a la PEP al cónyuge, concubina o concubinario, a los parientes por consanguinidad o afinidad hasta el segundo grado y a las PM con las que tenga vínculos patrimoniales; la PEP nacional sigue siéndolo durante el año siguiente a aquel en que dejó el encargo.","ref":"DCG Bancos 2ª XXXI"},{"id":"A062","tema":"2.1.2","tipo":"caso","q":"Una ITF detecta que un cliente es PEP nacional, clasificado de riesgo medio. ¿Necesita la aprobación de un directivo para operar con él?","a":"Sí: su DCG exige aprobación para operar con cualquier PEP, no sólo con la de riesgo alto","o":["No: sólo la PEP que además es de riesgo alto requiere esa aprobación, igual que en Bancos","No: sólo las PEP extranjeras requieren aprobación de un directivo","Sí, pero la otorga el Oficial de Cumplimiento y no un directivo","Sí: su DCG exige aprobación para operar con cualquier PEP, no sólo con la de riesgo alto"],"x":"Igual que Bancos, salvo la ITF: su art. 39 exige aprobación por escrito, digital o electrónica de un directivo con facultades para operar con el Cliente de riesgo alto «o bien» PEP. En Bancos (26ª) la aprobación se pide cuando la PEP además es de riesgo alto.","ref":"DCG ITF art. 39; DCG Bancos 26ª"},{"id":"A063","tema":"2.1.2","tipo":"caso","q":"Un banco tiene como cliente a un alto funcionario federal en funciones (PEP nacional), clasificado de riesgo bajo. ¿Qué exige la 28ª respecto de él?","a":"Mecanismos para valorar si su comportamiento transaccional corresponde a sus funciones, nivel y responsabilidad","o":["Clasificarlo como de riesgo alto desde el inicio, igual que a las PEP extranjeras","Mecanismos para valorar si su comportamiento transaccional corresponde a sus funciones, nivel y responsabilidad","Aprobación de un directivo para continuar la relación, aunque su riesgo sea bajo","Documentación completa de su cónyuge y dependientes económicos, en todo caso"],"x":"La 28ª: las PEP extranjeras son de riesgo alto como mínimo; para las PEP nacionales, la entidad desarrolla mecanismos para establecer el riesgo de sus operaciones y determinar si su comportamiento corresponde razonablemente con sus funciones, nivel y responsabilidad. La aprobación de directivo (26ª) aplica a la PEP de riesgo alto.","ref":"DCG Bancos 28ª; 26ª"},{"id":"A064","tema":"2.1.2","tipo":"caso","q":"Un transmisor de dinero detecta que un Usuario es PEP y además de riesgo alto. ¿Quién puede aprobar la operación?","a":"Un directivo o su equivalente, o una persona con nivel de alta responsabilidad, con facultades para aprobarla","o":["Sólo un directivo o su equivalente con facultades específicas, como en Bancos","El Oficial de Cumplimiento, sin necesidad de intervención de un directivo","Un directivo o su equivalente, o una persona con nivel de alta responsabilidad, con facultades para aprobarla","El Comité de Comunicación y Control, en sesión extraordinaria convocada al efecto"],"x":"Igual que Bancos, salvo Transmisores: su 17ª permite que la aprobación la otorgue un directivo, su equivalente «o una persona con nivel de alta responsabilidad» con facultades específicas. Bancos (26ª) sólo menciona al directivo o su equivalente.","ref":"DCG Transmisores 17ª; DCG Bancos 26ª"},{"id":"A065","tema":"2.1.2","tipo":"caso","q":"¿Cuál de estos clientes debe un banco considerar, como mínimo, de grado de riesgo alto según la 28ª?","a":"Una persona moral que realiza operaciones en efectivo con dólares conforme a la 33ª Bis 1","o":["Una persona moral que realiza operaciones en efectivo con dólares conforme a la 33ª Bis 1","Una PEP nacional en funciones, por el solo hecho de serlo","Una persona física residente en el país con una cuenta nivel 3 abierta en una sucursal","Una sociedad del Anexo 1 clasificada con grado de riesgo bajo"],"x":"La 28ª considera de riesgo alto, al menos, a los clientes no residentes asignados a banca privada o sector similar, a las PEP extranjeras y a las PM que realicen operaciones en efectivo con dólares de los EUA en términos de la 33ª Bis 1. La PEP nacional no es de riesgo alto por sí misma: se valora si su operación corresponde a su cargo.","ref":"DCG Bancos 28ª"},{"id":"A066","tema":"2.1.2","tipo":"trampa","q":"Una casa de bolsa recibe a un cliente no residente asignado a su segmento de banca privada. ¿Qué clientes considera su DCG, como mínimo, de riesgo alto?","a":"Sólo las PEP extranjeras","o":["Los no residentes de banca privada y las PEP extranjeras","Sólo las PEP extranjeras","Las PEP extranjeras y las PM que operan efectivo en dólares","Las PEP nacionales y las extranjeras, sin distinción"],"x":"Trampa: copiar la lista de Bancos. La 26ª de Casas de bolsa (como SOFOM, Asesores, Fondos, SOCAP, SOFIPO, Uniones y Cambios y envíos) sólo nombra como riesgo alto mínimo a las PEP extranjeras. Los no residentes de banca privada y las PM con efectivo en dólares son de la 28ª de Bancos. Nada impide que la casa de bolsa lo califique alto por su propio modelo.","ref":"DCG Casas de bolsa 26ª; DCG Bancos 28ª"},{"id":"A067","tema":"2.1.2","tipo":"caso","q":"Una casa de cambio va a operar con un Usuario que, por sus características, podría ser de riesgo alto. ¿Cuándo debe otorgarse la aprobación del directivo?","a":"Previamente a la celebración de la Operación con ese Usuario","o":["Previamente a la apertura de su cuenta, como en las DCG de Bancos","Dentro de las 24 horas siguientes a la celebración de la Operación","Previamente a la celebración de la Operación con ese Usuario","Al cierre del mes, junto con el reporte de Operaciones Relevantes"],"x":"Igual que Bancos (aprobación por escrito, digital o electrónica de un directivo), salvo el momento: la 20a de Casas de cambio la exige previamente a la celebración de Operaciones, porque sólo hay Usuarios y no cuentas. En Bancos (27ª) es previa a la apertura de la cuenta o celebración del contrato.","ref":"DCG Casas de cambio 20a; DCG Bancos 27ª"},{"id":"A068","tema":"2.1.2","tipo":"caso","q":"Un banco mexicano evalúa prestar corresponsalía a una institución extranjera que no tiene presencia física en ninguna jurisdicción. ¿Qué disponen sus DCG?","a":"Debe abstenerse: la corresponsalía con instituciones sin presencia física está prohibida","o":["Puede hacerlo con aprobación a nivel directivo y certificación de un auditor independiente","Puede hacerlo si aplica medidas de debida diligencia reforzada, por ser de riesgo","Debe abstenerse: la corresponsalía con instituciones sin presencia física está prohibida","Puede hacerlo si la contraparte le entrega su programa de prevención de PLD/FT"],"x":"La 30ª ordena abstenerse de corresponsalía con entidades financieras extranjeras o intermediarios sin presencia física en jurisdicción alguna. La aprobación directiva y la certificación (29ª) y la diligencia reforzada con jurisdicciones de riesgo (30ª) aplican a contrapartes permitidas, no a las que no tienen presencia física.","ref":"DCG Bancos 29ª y 30ª"},{"id":"A069","tema":"2.1.2","tipo":"trampa","q":"¿Cuál de estos sujetos NO prevé en su DCG disposiciones de corresponsalía?","a":"Las uniones de crédito","o":["Las casas de bolsa","Los fondos de inversión","Las SOFIPO","Las uniones de crédito"],"x":"Trampa: «la corresponsalía es de todos». Sólo la prevén Bancos, Casas de bolsa, Fondos, SOCAP y SOFIPO (estas dos, con contrapartes «relacionadas con su objeto»). No la prevén SOFOM, Asesores, Uniones, Casas de cambio, Centros cambiarios, Transmisores ni ITF.","ref":"DCG Bancos 29ª; DCG SOFIPO 31ª; DCG Uniones (sin disposición)"},{"id":"A070","tema":"2.1.2","tipo":"memoria","q":"En las DCG de Bancos, ¿dónde se define al Propietario Real?","a":"En la 2ª fr. XXXII, y se aplica, entre otras, en la 4ª, la 10ª y la 31ª","o":["En los Lineamientos de 2019 de la SHCP, a los que remite la 2ª para su definición","En la 2ª fr. XXXII, y se aplica, entre otras, en la 4ª, la 10ª y la 31ª","En la 4ª fr. II, como dato del expediente de las personas morales","En el Anexo 1, junto con las sociedades y entidades de riesgo bajo"],"x":"Las DCG lo definen en la 2ª fr. XXXII (persona física que obtiene los beneficios y es el verdadero dueño de los recursos) y lo aplican en el expediente (4ª), en la prohibición de cuentas anónimas (10ª) y cuando el cliente actúa por cuenta de otro (31ª). Las DCG obligan; los Lineamientos de 2019 orientan y no son la fuente de la definición.","ref":"DCG Bancos 2ª XXXII; 4ª; 10ª; 31ª"},{"id":"A071","tema":"2.1.2","tipo":"caso","q":"Un ciudadano estadounidense, sin condición de residente temporal ni permanente, abre una cuenta en un banco y celebra un contrato con un asesor en inversiones. Respecto de los datos de la 4ª fr. I a), ¿qué deja de asentarse en cada expediente?","a":"En el banco, sólo la entidad federativa de nacimiento; en el asesor, nada: remite a los mismos datos sin excepción","o":["En los dos, la entidad federativa de nacimiento, porque ambas DCG copian la misma excepción en su fr. III a) i","En los dos, la CURP, el RFC y la FEA, porque son claves que sólo se asignan a personas de nacionalidad mexicana","En el banco, sólo la entidad federativa de nacimiento; en el asesor, nada: remite a los mismos datos sin excepción","En el banco, la CURP y la FEA; en el asesor, sólo la entidad federativa de nacimiento del cliente extranjero no residente"],"x":"Bancos 4ª fr. III a) i remite a los «mismos datos» de la fr. I a), «con excepción del dato de la entidad federativa de nacimiento»; no quita nada más: CURP, RFC o NIF y FEA se siguen pidiendo «cuando disponga». Asesores repite la remisión a los «mismos datos», pero sin esa excepción. El distractor más tentador es la frase de la clase «quitamos CURP, RFC y FEA»: sólo la ITF deja fuera la CURP del no residente (art. 11 fr. III).","ref":"DCG Bancos 4ª fr. III, inciso a), numeral i; DCG Asesores 4ª fr. III, inciso a), numeral i"},{"id":"A072","tema":"2.1.2","tipo":"caso","q":"Una persona física se identifica con su licencia de conducir, que trae el mismo domicilio que manifiesta. Abre una cuenta en un banco y, otro día, compra en una casa de cambio euros en efectivo por el equivalente a 6,000 USD. ¿Dónde debe recabarse copia del comprobante de domicilio?","a":"Sólo en el banco: ahí únicamente la INE o la matrícula consular sustituyen al comprobante","o":["Sólo en el banco: ahí únicamente la INE o la matrícula consular sustituyen al comprobante","Sólo en la casa de cambio, porque el expediente del Usuario de 5,000 USD o más siempre lleva comprobante","En los dos, porque ambas DCG exigen el comprobante aunque el domicilio coincida con el de la identificación","Ni en el banco ni en la casa de cambio, porque en los dos basta que coincida con cualquier identificación"],"x":"Bancos 4ª fr. I b) iii pide siempre el comprobante (antigüedad máxima de 3 meses), salvo que el domicilio del contrato coincida con el de la credencial para votar o, desde el 28-ago-2024, con el del certificado de matrícula consular, si se identificó con alguno de ellos; la licencia no lo sustituye. En Casas de cambio (4a fr. III, inciso A, b) iii) el comprobante sólo se pide cuando el domicilio manifestado no coincida con el de la identificación o ésta no lo contenga; Transmisores tiene la misma regla. El distractor tentador («en los dos») le aplica a la casa de cambio la regla de Bancos.","ref":"DCG Bancos 4ª fr. I, inciso b), numeral iii; DCG Casas de cambio 4a fr. III, inciso A, subinciso b), numeral iii; DCG Transmisores 4ª fr. IV, inciso A, subinciso b), numeral iii"},{"id":"A073","tema":"2.1.2","tipo":"caso","q":"Una sociedad anónima recién constituida aún no tramita su Firma Electrónica Avanzada. Solicita un crédito a una SOFOM y abre un contrato con una casa de bolsa. ¿Cómo piden esas DCG el número de serie de la FEA en el expediente de la persona moral?","a":"SOFOM, «cuando cuenten con ella»; casa de bolsa, sin esa condición","o":["Las dos sin condición, porque la FEA es obligatoria para toda persona moral mexicana inscrita en el RFC","SOFOM, «cuando cuenten con ella»; casa de bolsa, sin esa condición","Las dos «cuando cuenten con ella», con la misma condición con que se pide a la persona física","Casa de bolsa, «cuando cuenten con ella»; SOFOM, sin condición, por tratarse de un acreditado"],"x":"En la persona moral, la FEA va sin condición en Bancos (4ª II a) v) y en casi todas las DCG, incluida la de Casas de bolsa. Sólo SOFOM y Asesores en inversiones dicen «cuando cuenten con ella». No hay que confundirla con la persona física: ahí las 11 DCG clásicas la piden «cuando cuente con ella» y la ITF no la pide. El distractor tentador invierte a los sujetos.","ref":"DCG SOFOM 4ª fr. II, inciso a), numeral v; DCG Casas de bolsa 4ª fr. II, inciso a), numeral v; DCG Asesores 4ª fr. II, inciso a), numeral v; DCG Bancos 4ª fr. II, inciso a), numeral v"},{"id":"A074","tema":"2.1.2","tipo":"caso","q":"Una ITF clasifica con grado de riesgo medio a una persona moral mexicana que abre una cuenta. ¿Qué información de su estructura debe recabar?","a":"La estructura accionaria y, por ser riesgo distinto al bajo, la corporativa interna","o":["Sólo la estructura accionaria: la ITF no pide la estructura corporativa interna a sus clientes personas morales","Sólo la declaración firmada sobre propietarios reales; la estructura no forma parte de su expediente digital","La corporativa interna sólo si la clasifica de riesgo alto; con riesgo medio basta la estructura accionaria","La estructura accionaria y, por ser riesgo distinto al bajo, la corporativa interna"],"x":"ITF art. 11 fr. II b) v.1: conocer la estructura accionaria y, cuando el Cliente tenga un grado de riesgo distinto al bajo, recabar la estructura corporativa interna (nombre y cargo del director general, la jerarquía inmediata inferior y el consejo de administración o administrador único). Es la misma regla de Bancos 4ª II c) ii. La clase dice «N/A para ITF»: es incorrecto. El distractor tentador exige riesgo alto, pero la norma dice «distinto al bajo», que incluye el medio.","ref":"DCG ITF art. 11, fr. II, inciso b), numeral v.1; DCG Bancos 4ª fr. II, inciso c), numeral ii"},{"id":"A075","tema":"2.1.2","tipo":"caso","q":"Un banco abre una cuenta a una sociedad constituida en España, sin oficinas en México. ¿Qué prevé la 4ª fr. III b) sobre su estructura accionaria, su estructura corporativa y sus propietarios reales?","a":"Se recaban como en la PM mexicana: la fr. III b) ii.1 remite al inciso c) de la fr. II","o":["No se recaban: a la PM extranjera sólo se le piden existencia, NIF, domicilio, poderes e identificación","Sólo la estructura accionaria; los propietarios reales se omiten porque residen fuera del territorio nacional","Se recaban como en la PM mexicana: la fr. III b) ii.1 remite al inciso c) de la fr. II","Sólo cuando el documento de existencia no venga legalizado ni apostillado por la autoridad de su país"],"x":"Bancos 4ª fr. III b) ii.1: además del documento de existencia (legalizado o apostillado) y del documento del NIF, la entidad debe «obtener la información y recabar los datos a que se refiere el inciso c) de la fracción II»: estructura accionaria, estructura corporativa si el riesgo no es bajo y propietarios reales. De la PM extranjera sólo sale de la lista de datos el nombre de los administradores (salvo en la ITF, art. 11 IV a) ix). El distractor tentador es la frase de la clase «quitamos estructura y propietarios reales».","ref":"DCG Bancos 4ª fr. III, inciso b), numerales i y ii.1; 4ª fr. II, inciso c)"},{"id":"A076","tema":"2.1.2","tipo":"trampa","q":"Una persona física mexicana abre una cuenta en una ITF. ¿Cuál de estos requisitos NO le pide la ITF en el art. 11?","a":"Comprobante de domicilio","o":["Firma Autógrafa Digitalizada","Comprobante de domicilio","Geolocalización del dispositivo móvil","Clave de elector, en su caso"],"x":"Trampa: suponer que la ITF pide lo mismo que Bancos más sus extras. A la persona física el art. 11 fr. I sólo le pide el dato del domicilio (inciso b) y la versión digital del documento de identificación (inciso j); no se localiza comprobante de domicilio, constancias de CURP, RFC o FEA ni documentos del apoderado. En cambio, sólo la ITF pide la Firma Autógrafa Digitalizada (inciso e), la clave de elector «en su caso» (inciso a) vii), la cuenta y CLABE «en su caso» (inciso h) y la geolocalización del dispositivo (2º párrafo). Ojo: a la persona moral sí le pide comprobante de domicilio (fr. II b) iii).","ref":"DCG ITF art. 11, 2º párrafo; fr. I, incisos a) a j); fr. II, inciso b), numeral iii"},{"id":"A077","tema":"2.1.2","tipo":"caso","q":"La misma persona física mexicana abre una cuenta en un banco y otra en una ITF. ¿Qué claves de identificación pide cada DCG en la lista de datos?","a":"Banco: CURP, RFC, NIF y FEA, cuando disponga de ellos; ITF: sólo la CURP","o":["Las dos: CURP, RFC y FEA cuando disponga, porque la ITF reproduce la lista de la 4ª de Bancos","Banco: sólo la CURP y el RFC; ITF: CURP, RFC y el número de serie de la FEA en todo caso","Banco: la FEA en todo caso; ITF: la CURP y el RFC, ambos «cuando disponga de ellos»","Banco: CURP, RFC, NIF y FEA, cuando disponga de ellos; ITF: sólo la CURP"],"x":"Bancos 4ª fr. I a) xi pide CURP, RFC con homoclave, NIF o equivalente y el país que los asignó, «cuando disponga de ellos», y el numeral xii el número de serie de la FEA, «cuando cuente con ella». La ITF (art. 11 fr. I d) pide sólo la CURP, sin condición, y no lista RFC ni FEA. El distractor tentador supone que la ITF copia a Bancos; el gancho es «FEA, excepto ITF».","ref":"DCG Bancos 4ª fr. I, inciso a), numerales xi y xii; DCG ITF art. 11, fr. I, inciso d)"},{"id":"A078","tema":"2.1.2","tipo":"caso","q":"Una persona moral mexicana que también tiene un número de identificación fiscal asignado en otro país abre una cuenta en un banco y se hace socia de una unión de crédito. ¿En cuál se pide copia del documento en que consta ese NIF?","a":"Sólo en el banco; Uniones pide la CIF y la constancia de FEA, sin el documento del NIF","o":["Sólo en el banco; Uniones pide la CIF y la constancia de FEA, sin el documento del NIF","Sólo en la unión de crédito, porque a sus socios se les exige acreditar cada una de sus claves fiscales","En los dos, porque ambas DCG piden la CIF, el documento del NIF y la constancia de la FEA","Ni en uno ni en otro: el documento del NIF sólo se pide a la persona moral de nacionalidad extranjera"],"x":"Bancos 4ª fr. II b) ii: CIF y, «en su caso», el documento en que conste el NIF, más la constancia de la FEA. Uniones 4ª fr. II b) ii: «Cédula de Identificación Fiscal… y constancia de la Firma Electrónica Avanzada», sin el documento del NIF (aunque el NIF sí aparece como dato). Lo mismo en la persona física: Uniones pide «constancia de la CURP… y/o Cédula de Identificación Fiscal», sin documento del NIF. El distractor tentador («en los dos») traslada la regla de Bancos.","ref":"DCG Bancos 4ª fr. II, inciso b), numeral ii; DCG Uniones 4ª fr. II, inciso b), numeral ii; fr. I, inciso b), numeral ii"},{"id":"A079","tema":"2.1.2","tipo":"memoria","q":"¿Qué DCG exigen expresamente, a los coacreditados y obligados solidarios, los mismos requisitos de identificación que a los Clientes?","a":"Sólo las de SOFOM y Uniones de crédito","o":["Las de Bancos, SOFOM y Uniones de crédito","Las de Bancos y Casas de bolsa, en su 4ª fr. VII","Sólo las de SOFOM y Uniones de crédito","Las de SOFOM, SOFIPO y SOCAP, por otorgar crédito"],"x":"SOFOM 4ª fr. VII y Uniones 4ª fr. VII extienden los mismos requisitos del Cliente a coacreditados, obligados solidarios y terceros autorizados. Bancos 4ª fr. VII sólo nombra a cotitulares y terceros autorizados, igual que Casas de bolsa, Asesores, Fondos, SOCAP y SOFIPO. El distractor tentador incluye a Bancos por ser el eje; su 4ª no menciona coacreditados ni obligados solidarios.","ref":"DCG SOFOM 4ª fr. VII; DCG Uniones 4ª fr. VII; DCG Bancos 4ª fr. VII"},{"id":"A080","tema":"2.1.2","tipo":"caso","q":"En la cuenta ordinaria de una persona física en un banco (no concentradora, de nómina, de programas de gobierno ni de la 14ª Bis), un tercero que no es titular aporta los recursos. ¿Qué recaba el banco de ese Proveedor de Recursos?","a":"Sólo sus datos de identificación, sin copia de documentos","o":["Los mismos datos y documentos que al titular, como si fuera cotitular de la cuenta","Sólo sus datos de identificación, sin copia de documentos","Copia de su identificación y comprobante de domicilio, sin asentar otros datos","Sus datos ahora y sus documentos cuando acuda a ejercer derechos, como a un beneficiario"],"x":"Bancos 4ª fr. V: del Proveedor de Recursos se recaban sólo datos (persona física: nombre, fecha de nacimiento, nacionalidad, domicilio, claves fiscales y FEA cuando cuente con ellos, y ocupación; persona moral: denominación, nacionalidad, RFC o NIF, FEA y domicilio); no se piden documentos. Ni siquiera eso se recaba en cuentas concentradoras, de nómina o proveedores, programas de gobierno y cuentas de la 14ª Bis, 14ª Bis 2 y 14ª Bis 3. El distractor tentador lo trata como cotitular: «igual que a un Cliente» sólo aplica a cotitulares y terceros autorizados (4ª fr. VII).","ref":"DCG Bancos 4ª fr. V y fr. VII"},{"id":"A081","tema":"2.1.2","tipo":"caso","q":"Un cliente de un banco designa a su hija como beneficiaria de su cuenta de inversión. ¿Qué recaba el banco de ella y cuándo?","a":"Al designarla, nombre, fecha de nacimiento y domicilio si difiere; documentos, al ejercer sus derechos","o":["Desde la designación, los mismos datos y documentos que al titular, porque se le asimila a un cotitular","Sólo su nombre completo; nunca se le piden documentos, porque el beneficiario no llega a ser Cliente del banco","Nada al designarla; cuando acuda a cobrar, sólo copia de su identificación y de su comprobante de domicilio","Al designarla, nombre, fecha de nacimiento y domicilio si difiere; documentos, al ejercer sus derechos"],"x":"Bancos 4ª fr. VIII: de los Beneficiarios se recaban «cuando menos» nombre, domicilio cuando sea diferente al del titular y fecha de nacimiento; la 11ª ordena pedirles los mismos documentos que a un Cliente «al momento en que… se presenten a ejercer sus derechos». En las cuentas de la 14ª Bis esos datos pueden recabarse después de la apertura. El distractor tentador lo asimila al cotitular, que sí lleva desde el inicio los requisitos del titular (4ª fr. VII).","ref":"DCG Bancos 4ª fr. VIII; 11ª; 4ª fr. VII"},{"id":"A082","tema":"2.1.2","tipo":"caso","q":"Una casa de bolsa celebra un contrato con un fideicomiso cuya fiduciaria es un banco. ¿Cómo puede cubrir la copia del contrato del fideicomiso y la identificación de su propietario real?","a":"Con una constancia firmada por el delegado fiduciario y el Oficial de Cumplimiento de la fiduciaria","o":["Con una constancia firmada por el delegado fiduciario y el Oficial de Cumplimiento de la fiduciaria","Con una declaración del fideicomitente que señale quiénes son los propietarios reales del fideicomiso","Con una copia del contrato certificada por el comité técnico, sin recabar datos de los fideicomisarios","No puede sustituirlos: debe recabar siempre el contrato y un expediente completo de cada fideicomisario"],"x":"Casas de bolsa 4ª fr. X, último párrafo (igual que Bancos 4ª fr. IX): la entidad que no actúe como fiduciaria puede cumplir la obligación de recabar el contrato (inciso b) i) y la del propietario real (en Casas de bolsa, 4ª fr. VII) mediante una constancia firmada por el delegado fiduciario y el Oficial de Cumplimiento de la fiduciaria, con los datos del inciso a) y la obligación de tenerlos a disposición de la SHCP y de la CNBV. La declaración del fideicomitente no está prevista para esto. Ojo: la ITF no regula al fideicomiso como Cliente.","ref":"DCG Casas de bolsa 4ª fr. X, último párrafo, y fr. VII; DCG Bancos 4ª fr. IX, último párrafo"},{"id":"A083","tema":"2.1.2","tipo":"caso","q":"Un Usuario cambia a pesos, en efectivo, euros por el equivalente a 700 USD, una vez en la ventanilla de un banco y otra en una casa de cambio. ¿Entra cada operación al mecanismo de seguimiento y agrupación?","a":"En el banco sí (umbral de 500 USD); en la casa de cambio no (umbral de 1,000 USD)","o":["En el banco sí (umbral de 500 USD); en la casa de cambio no (umbral de 1,000 USD)","En los dos sí, porque las DCG fijan un umbral común de 500 USD para la moneda extranjera","En los dos no, porque ambas DCG fijan el umbral de la moneda extranjera en 1,000 USD","En la casa de cambio sí (umbral de 500 USD); en el banco no (umbral de 1,000 USD)"],"x":"Bancos 18ª: seguimiento y agrupación, en periodos de un mes calendario, de las operaciones en moneda extranjera en efectivo o cheques de viajero «iguales o superiores» a 500 USD. Casas de cambio (11a) y Centros cambiarios (9ª) suben ese umbral a 1,000 USD. Ojo: si fueran dólares en efectivo, la casa de cambio agrupa las operaciones de su 24ª Bis y 24ª Ter a cualquier monto; por eso el caso usa euros. El distractor tentador invierte los umbrales.","ref":"DCG Bancos 18ª, 1er párrafo; DCG Casas de cambio 11a, 1er y 3er párrafos; DCG Centros cambiarios 9ª, 1er párrafo"},{"id":"A084","tema":"2.1.2","tipo":"caso","q":"El mismo día, una persona física y una persona moral depositan cada una 400,000 pesos en efectivo en un banco. ¿Qué operación entra al mecanismo de seguimiento de la 18ª?","a":"Sólo la de la persona física: su umbral es superior a 300,000 pesos; el de la moral, superior a 500,000","o":["Las dos, porque el umbral en moneda nacional es superior a 300,000 pesos para cualquier tipo de persona","Sólo la de la persona moral: su umbral es superior a 300,000 pesos; el de la física, superior a 500,000","Sólo la de la persona física: su umbral es superior a 300,000 pesos; el de la moral, superior a 500,000","Ni una ni otra: en pesos sólo se da seguimiento a lo que acumule un millón de pesos o más en el mes"],"x":"Bancos 18ª, 2º párrafo: operaciones en efectivo en pesos «superiores a» 300,000 pesos de personas físicas, o «superiores a» 500,000 pesos de personas morales o fideicomisos. Lo replican SOFOM, Casas de bolsa, Fondos, SOFIPO, Uniones, Casas de cambio y Transmisores; SOCAP pone a la persona física con actividad empresarial con las morales, y Centros cambiarios no fija umbral en pesos. El millón de pesos al mes es el seguimiento más estricto (20ª), que se suma al de la 18ª.","ref":"DCG Bancos 18ª, 2º párrafo; 20ª"},{"id":"A085","tema":"2.1.2","tipo":"caso","q":"Una persona física entrega en efectivo euros por el equivalente a 9,000 USD: para un depósito en la sucursal de un banco, para cambiarlos en un centro cambiario y para un envío en un transmisor de dinero. ¿Dónde se activa el escalamiento de aprobación interna?","a":"En el banco y en el centro cambiario; en el transmisor no, porque su umbral es superior a 10,000 USD","o":["Sólo en el centro cambiario, porque el banco y el transmisor fijan para la persona física 10,000 USD","En el banco y en el centro cambiario; en el transmisor no, porque su umbral es superior a 10,000 USD","En los tres, porque las tres DCG fijan para la persona física un umbral superior a 7,500 USD","Sólo en el transmisor; el banco y el centro cambiario lo reservan a montos superiores a 50,000 USD"],"x":"Escalamiento de aprobación interna para personas físicas: Bancos 18ª, moneda extranjera en efectivo recibida en sucursales «superior al equivalente a» 7,500 USD (o más de 300,000 pesos); Centros cambiarios 9ª, «superiores a» 5,000 USD (8,000 USD para personas morales o fideicomisos, sin umbral en pesos); Transmisores 9ª, «superiores a» 10,000 USD (o 300,000 pesos). Con 9,000 USD se rebasan 7,500 y 5,000, no 10,000. Los 50,000 USD son el umbral de las personas morales y fideicomisos en Bancos.","ref":"DCG Bancos 18ª, penúltimo párrafo; DCG Centros cambiarios 9ª, 5º párrafo; DCG Transmisores 9ª"},{"id":"A086","tema":"2.1.2","tipo":"memoria","q":"En el seguimiento y agrupación más estrictos (montos acumulados en un mes calendario), ¿qué DCG fija umbral sólo en moneda nacional y cuál sólo en dólares?","a":"Sólo en pesos, Fondos de inversión; sólo en dólares, Centros cambiarios","o":["Sólo en pesos, Fondos de inversión; sólo en dólares, Centros cambiarios","Sólo en pesos, Centros cambiarios; sólo en dólares, Fondos de inversión","Sólo en pesos, Uniones de crédito; sólo en dólares, Casas de cambio","Sólo en pesos, SOFOM; sólo en dólares, Transmisores de dinero y Centros cambiarios"],"x":"La regla general (Bancos 20ª y equivalentes) tiene dos umbrales «igual o superior»: 1,000,000 de pesos en efectivo o el equivalente a 100,000 USD en efectivo, acumulados en el mes. Fondos de inversión (16ª) sólo fija el de 1,000,000 de pesos; Centros cambiarios (10ª), sólo el de 100,000 USD. SOCAP mide los 100,000 USD sobre la compraventa de divisas, y la ITF usa UDIS (12,500 en IFC; 7,500 en IFPE). El distractor tentador invierte a Fondos y Centros.","ref":"DCG Bancos 20ª; DCG Fondos 16ª; DCG Centros cambiarios 10ª"},{"id":"A087","tema":"2.1.2","tipo":"caso","q":"Un Usuario sin cuenta adquiere en un banco un cheque de caja por exactamente 10,000 USD. ¿Qué debe recabar el banco?","a":"Los datos y documentos de la 4ª, como si fuera Cliente","o":["Sólo sus datos, porque la obligación aplica a cheques de caja superiores a 10,000 USD","Sus datos y copia de su identificación, como en el efectivo de 3,000 a menos de 5,000 USD","Sus datos a partir de 500 USD; los cheques de caja no tienen un umbral propio en la 17ª","Los datos y documentos de la 4ª, como si fuera Cliente"],"x":"Bancos 17ª fr. II: en Operaciones de cheques de caja con Usuarios por monto «igual o superior» a 10,000 USD se recaban los datos y documentos de la 4ª fr. I, II, III, IV, VI o IX, según corresponda. Con exactamente 10,000 USD aplica. Es una regla sólo de Bancos: las otras 11 DCG no regulan cheques de caja con Usuarios. El distractor tentador es el de la clase («superiores a»).","ref":"DCG Bancos 17ª fr. II"},{"id":"A088","tema":"2.1.2","tipo":"trampa","q":"¿Cuál de estos sujetos NO prevé en su DCG que otra entidad de su grupo financiero integre y conserve el expediente de identificación?","a":"Las SOCAP","o":["Las SOFIPO","Las casas de cambio","Las SOCAP","Las casas de bolsa"],"x":"Trampa: «el expediente compartido en grupo financiero es de todos». Lo prevén Bancos (9ª), SOFOM (9ª), Casas de bolsa (8ª), Fondos (8ª), SOFIPO (9ª), Casas de cambio (7a, respecto de Usuarios) y la ITF (art. 20); Asesores, con la entidad financiera relacionada (8ª). No lo prevén SOCAP, Uniones, Centros cambiarios ni Transmisores. En Bancos exige consentimiento del Cliente y un convenio entre las entidades del grupo.","ref":"DCG Bancos 9ª; DCG SOFIPO 9ª; DCG Casas de cambio 7a; DCG Casas de bolsa 8ª; DCG SOCAP (sin disposición equivalente)"},{"id":"A089","tema":"2.1.2","tipo":"caso","q":"Un banco clasifica como de grado de riesgo alto a una persona moral. ¿Qué prevé la 21ª sobre la visita a su domicilio?","a":"Que su Manual defina en qué supuestos se visita, con constancia en el expediente","o":["Que se visite siempre, antes de abrir la cuenta y después una vez al año sin excepción","Que su Manual defina en qué supuestos se visita, con constancia en el expediente","Que sólo se visite si la persona moral es extranjera o si su propietario real es una PEP","Que no aplica a Bancos: la visita domiciliaria sólo la prevé la DCG de ITF para sus clientes"],"x":"Bancos 21ª: el Manual debe incluir «los supuestos en que deba realizarse una visita al domicilio» de los Clientes de riesgo alto y, cuando se hace, se deja constancia de sus resultados en el expediente. No es una visita obligatoria en todos los casos (la clase la presenta como regla absoluta). Lo que sí es anual es verificar que el expediente de riesgo alto esté completo y actualizado. La ITF no prevé visita domiciliaria.","ref":"DCG Bancos 21ª"},{"id":"A090","tema":"2.1.2","tipo":"caso","q":"Un banco abrió en sucursal la cuenta de un cliente y ahora debe actualizar su expediente; el cliente vive en otra ciudad. ¿Puede actualizarlo sin que acuda?","a":"Sí: puede actualizarlo de forma no presencial, sin importar cómo se abrió la cuenta","o":["No: la actualización debe hacerse por la misma vía presencial con la que se abrió la cuenta","Sólo si el cliente es de riesgo bajo y su cuenta es de nivel 1 o 2 de la 14ª Bis","Sólo con autorización previa de la CNBV para cada actualización que se haga a distancia","Sí: puede actualizarlo de forma no presencial, sin importar cómo se abrió la cuenta"],"x":"Bancos 21ª: las Entidades «podrán dar cumplimiento a la obligación de actualizar… de forma no presencial, con independencia de la forma de apertura de la cuenta», recabando los datos y documentos aplicables según el tipo de Cliente y verificándolos. Es una facultad («podrán»), no una obligación. La clase lo invierte («la actualización aplica aunque sea remota la identificación»). En la 22ª de SOCAP no se localizó ese párrafo.","ref":"DCG Bancos 21ª, 3er párrafo; DCG SOCAP 22ª"},{"id":"A091","tema":"2.1.2","tipo":"caso","q":"Un transmisor de dinero integró de forma no presencial (4ª Bis y Anexo 2) el expediente de un Usuario de riesgo bajo, que lleva 200 días naturales sin operar y vuelve a enviar dinero. ¿Qué prevé su 12ª?","a":"Confirmar que el expediente esté debidamente integrado y, en su caso, actualizarlo antes de operar","o":["Confirmar que el expediente esté debidamente integrado y, en su caso, actualizarlo antes de operar","Nada adicional: esa confirmación sólo se exige a los Usuarios clasificados como de riesgo alto","Integrar un expediente nuevo en forma presencial, porque el anterior perdió vigencia a los 180 días","Presentar un reporte de Operación Inusual por la reactivación de un Usuario que había dejado de operar"],"x":"Transmisores 12ª: si el expediente se integró conforme a la 4ª Bis y el Anexo 2 y el Usuario no ha operado en un periodo mayor a 180 días naturales, «con independencia de su Grado de Riesgo», el transmisor debe confirmar que el expediente esté debidamente integrado y, en su caso, actualizarlo cuando el Usuario pretenda volver a operar. Es una regla propia de Transmisores; la misma 12ª le permite actualizar de forma no presencial. El distractor tentador limita la regla al riesgo alto.","ref":"DCG Transmisores 12ª"},{"id":"A092","tema":"2.1.2","tipo":"caso","q":"Una casa de cambio ofrece por medios electrónicos un servicio distinto de las operaciones cambiarias y de las transferencias, limitado a abonos inferiores a 2,000 UDIS por Usuario al mes. Si se respetan esos límites, ¿de qué queda liberada respecto de esas operaciones?","a":"Del seguimiento y de los reportes de Operaciones Relevantes e Inusuales","o":["Sólo de integrar el expediente previo; el seguimiento y los reportes se mantienen igual que siempre","De verificar los datos del Usuario y de clasificarlo conforme a su grado de riesgo","Del seguimiento y de los reportes de Operaciones Relevantes e Inusuales","De recabar la fecha de nacimiento y el domicilio; basta con
