<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Módulo 2 · Herramienta H1: para qué existen las 12 DCG y cómo cada sujeto obligado identifica y conoce a su cliente o usuario, con simulador de reactivos.">
<title>2.1.1 Objetivo · 2.1.2 Política de identificación y conocimiento del cliente o usuario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{display:inline-block;font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}

y Uniones de crédito (2ª III), y la ITF (art. 2 IV; Usuario sólo en la transmisión de dinero de las IFPE, art. 100). <b>Sólo Usuario<\/b>: Casas de cambio (2ª XXXIV), Centros cambiarios (2ª XXVI) y Transmisores (2ª XXXIX: remitente y beneficiario). Cliente <b>y<\/b> Usuario: Bancos, SOFOM, Casas de bolsa, SOCAP y SOFIPO."},{"titulo":"«Todas tienen cuentas por niveles, como Bancos».","texto":"Falso. Niveles de cuenta sólo en <b>Bancos<\/b> (14ª Bis: niveles 1 a 3 de 750 · 3,000 · 10,000 UDIS de abonos al mes, y la cuenta remota de 30,000 UDIS de la fr. IV, que la norma no llama «nivel 4») y en la <b>ITF<\/b> (niveles 1 y 2, art. 12). Los demás simplifican de otra forma: SOFOM y Uniones por <b>crédito<\/b>; Casas de bolsa, Fondos y Asesores por contratos <b>inferiores a 3,000 UDIS al mes<\/b>; SOCAP y SOFIPO, una cuenta a la vista de <b>3,000 UDIS<\/b>; Casas de cambio, operaciones por medios electrónicos <b>inferiores a 2,000 UDIS al mes<\/b> (9a); Centros cambiarios y Transmisores, sólo el Anexo 1."},{"titulo":"Persona física extranjera: ¿qué quitamos?","texto":"En los <b>datos<\/b>, sólo la <b>entidad federativa de nacimiento<\/b> (Bancos 4ª fr. III a) i); en Asesores, ni eso). CURP, RFC o NIF y FEA siguen pidiéndose «cuando disponga». En los <b>documentos<\/b> cambian: <b>pasaporte<\/b> y documento del INM (o tarjeta de la SRE) en lugar de la identificación, y comprobante del domicilio <b>en su lugar de residencia<\/b>; la lista ya no trae constancias ni poder (fr. III a) ii)."},{"titulo":"Persona moral extranjera: la estructura y el propietario real NO se quitan.","texto":"Sale de la lista de datos el nombre de los administradores (salvo en la ITF) y el documento de existencia va <b>legalizado o apostillado<\/b>, pero se recaba la información del <b>inciso c) de la fr. II<\/b>: estructura accionaria, estructura corporativa si el riesgo no es bajo y propietarios reales (Bancos 4ª fr. III b) ii.1)."},{"titulo":"Terceros: no todos son «igual que un Cliente».","texto":"Igual que al Cliente: <b>cotitulares<\/b>, <b>terceros autorizados<\/b> y, sólo en SOFOM y Uniones, <b>coacreditados y obligados solidarios<\/b> (4ª VII). <b>Proveedores de recursos<\/b>: sólo datos (4ª V). <b>Beneficiarios<\/b>: datos mínimos y documentos hasta que ejercen sus derechos (4ª VIII). <b>Deudores de cobro<\/b>: sólo SOFOM, sólo datos (nombre y RFC siempre; lo demás, si la entidad cuenta con ello). <b>Propietario real<\/b>: datos y documentos de PF, con domicilio de localización y sin comprobante si el Cliente es de riesgo bajo (4ª VI); en la ITF, sólo datos."},{"titulo":"Aquí sólo se ubica; se estudia en su tema.","texto":"<b>Propietario real<\/b> (porcentajes, cascada, Lineamientos que orientan): 2.1.16 (H6). <b>Lista de Personas Bloqueadas<\/b>: no está en la política de identificación de ninguna DCG; capítulo propio, 2.1.8 (H3). <b>Centros cambiarios<\/b> no identifica a distancia: 2.1.12 (H5). <b>Conservación<\/b> (10 años; Asesores 5): 2.1.6 (H3)."}],"secciones":[{"tipo":"mapa","id":"mapa","nav":"Mapa 3 · 8 · 6 · 6","titulo":"Los dos temas en 23 elementos, en orden","intro":"Ritmo <b>3 · 8 · 6 · 6 = 23<\/b>. Primero el <b>2.1.1<\/b>. Luego el <b>2.1.2<\/b> con la estructura de la clase de Maribel: <b>01 Identificación<\/b>, ocho preguntas que hay que hacerse antes de armar un expediente (entidad · relación · persona · nacionalidad · terceros · forma · riesgo · operación); <b>02 Mecanismos, 03 Reglas y 04 Situaciones de riesgo<\/b>; y la <b>política de conocimiento<\/b>. Toca un elemento para ver a Bancos y las diferencias por sujeto.","centro":{"t":"2.1.1 · 2.1.2","s":"12 DCG<br>3 · 8 · 6 · 6"},"ramas":[{"letra":"1","titulo":"2.1.1 Objetivo","pregunta":"¿Para qué, a quién y con quién?","ritmo":"¿Para qué?","corto":"2.1.1","color":"oscuro","items":[{"etiqueta":"1ª","nombre":"Objeto de las DCG","sub":"2.1.1 · 1ª de cada DCG","verbo":"Prevengo","desc":"Fijan las medidas mínimas para prevenir y detectar operaciones ligadas a FT (139 Quáter) y ORPI (400 Bis), y cómo reportarlas a la SHCP por conducto de la CNBV.","orden":1,"panel":"2.1.1 · 1ª de cada DCG","puntos":["<b>Bancos (1ª):<\/b> dos objetos: medidas y procedimientos mínimos para prevenir y detectar actos u operaciones vinculados con los arts. 139 Quáter y 400 Bis del CPF, y términos para reportar a la SHCP, por conducto de la CNBV, operaciones de clientes, usuarios, consejeros, directivos, funcionarios, empleados y apoderados. Fundamento: art. 115 LIC.","Cada DCG cambia su <b>fundamento<\/b>: Casas de bolsa 212 LMV · Asesores 226 Bis LMV · Fondos 91 LFI · SOCAP 71 y 72 LRASCAP · SOFIPO 124 LACP · Uniones 129 LUC · Casas de cambio 95 LGOAAC · Centros cambiarios y Transmisores 95 Bis LGOAAC · ITF 58 LRITF.","<b>SOFOM<\/b>: fundamento múltiple: reguladas por el 87-D LGOAAC (remite a 115 LIC, 71-72 LRASCAP, 124 LACP o 129 LUC) y no reguladas por el 95 Bis LGOAAC. Si transmite dinero, cumple además las DCG de transmisores.","<b>ITF<\/b> (art. 1): su objeto incluye presentar el <b>Manual de Cumplimiento<\/b> a la CNBV.","<b>Fondos<\/b>: excluye ciertos capítulos para las actividades de los arts. 39 Bis fr. V y 40 Bis LFI."],"ir":"#t2-1-1","destacado":false},{"etiqueta":"2ª","nombre":"Sujeto obligado","sub":"2.1.1 · 2ª de cada DCG","verbo":"Delimito","desc":"Cada DCG dice a quién obliga. Ojo con las que abarcan a más de un tipo: SOFOM reguladas y no reguladas; SOFIPO con SOFINCO; SOCAP sólo niveles I a IV.","orden":2,"panel":"2.1.1 · 2ª de cada DCG","puntos":["<b>Bancos (2ª XI):<\/b> «Entidades» = instituciones de crédito. La 2ª XXXVI excluye expresamente a los centros cambiarios del 95 Bis LGOAAC de los «Sujetos Obligados».","<b>SOFOM (2ª IX):<\/b> reguladas <b>y<\/b> no reguladas.","<b>SOCAP (2ª XXXV):<\/b> con niveles de operación <b>I a IV<\/b>.","<b>SOFIPO (2ª XI):<\/b> SOFIPO, <b>SOFINCO<\/b> niveles I a IV y Organismos de Integración Financiera Rural.","<b>Centros cambiarios (2ª II):<\/b> sociedades anónimas que realizan habitual y profesionalmente las actividades del 81-A LGOAAC.","<b>ITF (art. 2):<\/b> IFC e IFPE; su «Cliente» incluye a quien opera con Sociedades Autorizadas (modelos novedosos)."],"ir":"#t2-1-1","destacado":false},{"etiqueta":"2ª","nombre":"Cliente vs. Usuario","sub":"2.1.1 · Definiciones de la 2ª","verbo":"Distingo","desc":"Cliente = relación al amparo de un contrato; Usuario = opera sin relación comercial permanente. No todas las DCG tienen las dos figuras.","orden":3,"panel":"2.1.1 · Definiciones de la 2ª","puntos":["<b>Bancos:<\/b> Cliente (2ª IV) es cuentahabiente o usa servicios al amparo de un contrato; Usuario (2ª XXXVIII) opera sin relación comercial permanente.","<b>Cliente y Usuario:<\/b> Bancos, SOFOM, Casas de bolsa, SOCAP y SOFIPO.","<b>Sólo Cliente:<\/b> Asesores, Fondos, Uniones e ITF.","<b>Sólo Usuario:<\/b> Casas de cambio, Centros cambiarios y Transmisores (remitente y beneficiario).","SOFOM: Cliente = acreditado <b>o<\/b> quien opera al amparo de un contrato. SOCAP: Cliente = socios y terceros. SOCAP y SOFIPO: el Usuario no tiene relación «patrimonial, ni comercial permanente»."],"ir":"#t2-1-1","destacado":false}]},{"letra":"2","titulo":"2.1.2 · 01 Identificación","pregunta":"8 preguntas antes de armar un expediente","ritmo":"¿Quién es?","corto":"Identifico","color":"principal","items":[{"etiqueta":"1","nombre":"¿Qué entidad soy?","sub":"Política y Manual · 3ª, 22ª, 64ª","verbo":"Me ubico","desc":"Cada DCG pide cosas distintas. La política de identificación y la de conocimiento viven en el Manual de Cumplimiento, que se remite a la CNBV.","orden":4,"panel":"Política y Manual · 3ª, 22ª, 64ª","puntos":["<b>Bancos:<\/b> política de identificación (3ª) y de conocimiento (22ª) en el Manual; modificaciones a la CNBV en <b>20 días hábiles<\/b> desde que las aprueba el comité de auditoría (64ª).","Asesores: corre desde que <b>el Representante<\/b> las elabora (30ª fr. II). SOCAP y SOFIPO también las envían a su Comité de Supervisión (Auxiliar) (67ª).","Sin comité de auditoría aprueba el propio Comité en SOFOM (también consejo o director general), Fondos, SOCAP, Casas de cambio, Centros cambiarios y Transmisores; SOFIPO, «o su equivalente»; Uniones, «comité de auditoría o Comité» (53ª).","ITF: contenido mínimo de 6 fracciones (art. 10)."],"ir":"#t2-1-2","destacado":true},{"etiqueta":"2","nombre":"¿Cliente o Usuario?","sub":"2ª de cada DCG","verbo":"Contrato","desc":"Con contrato es Cliente; sin relación permanente, Usuario. Del Usuario se piden datos por escalones de monto; del Cliente, expediente completo.","orden":5,"panel":"2ª de cada DCG","puntos":["Sólo Cliente: Asesores, Fondos, Uniones e ITF. Sólo Usuario: Casas de cambio, Centros cambiarios y Transmisores.","Usuario en efectivo (Bancos 17ª): datos desde <b>500 USD<\/b>; copia de identificación de 3,000 a menos de 5,000; expediente desde <b>5,000<\/b>. Casas de cambio y Centros arrancan en <b>1,000<\/b>.","Ver la tabla «Usuarios y operaciones»."],"ir":"#t2-1-2-operaciones","destacado":false},{"etiqueta":"3","nombre":"¿Física, moral o fideicomiso?","sub":"4ª fr. I, II y IX","verbo":"Identifico","desc":"Cada tipo de persona tiene su lista de datos y documentos. Gancho de datos: desde que naciste · a qué te dedicas · dónde vives · cómo te localizo · sólo ITF.","orden":6,"panel":"4ª fr. I, II y IX","puntos":["PF (4ª I): 12 datos y 5 documentos; comprobante de domicilio de máximo 3 meses.","PM (4ª II): estructura accionaria <b>siempre<\/b>; corporativa si el riesgo no es bajo; declaración sobre propietarios reales.","Fideicomiso (4ª IX): Cliente en Bancos, SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO y Uniones; la ITF no lo regula.","Ver los tableros de persona física y de persona moral y fideicomiso."],"ir":"#t2-1-2-pf","destacado":true},{"etiqueta":"4","nombre":"¿Mexicano o extranjero?","sub":"4ª fr. III a) y b)","verbo":"Quito","desc":"Del extranjero no residente se quita sólo la entidad de nacimiento; cambian la identificación (pasaporte) y el domicilio (el de su residencia).","orden":7,"panel":"4ª fr. III a) y b)","puntos":["PF extranjera: datos iguales salvo la entidad federativa de nacimiento (Asesores ni eso).","Documentos: pasaporte y documento del INM o tarjeta SRE; domicilio en su lugar de residencia; declaración.","PM extranjera: documento legalizado o apostillado; <b>estructura y propietario real se mantienen<\/b>."],"ir":"#t2-1-2-pf-ext","destacado":false},{"etiqueta":"5","nombre":"¿Hay terceros?","sub":"4ª fr. V a VIII","verbo":"Amplío","desc":"No sólo se identifica al cliente: cotitulares, terceros autorizados, beneficiarios, proveedores de recursos, propietario real; cada uno con distinta profundidad.","orden":8,"panel":"4ª fr. V a VIII","puntos":["Igual que a un Cliente: cotitulares y terceros autorizados; coacreditados y obligados solidarios sólo en SOFOM y Uniones.","Sólo datos: proveedores de recursos; deudores de cobro (sólo SOFOM).","Beneficiarios: datos mínimos; documentos cuando ejercen derechos."],"ir":"#t2-1-2-terceros","destacado":false},{"etiqueta":"6","nombre":"¿Presencial o remota?","sub":"4ª Ter · 7ª · Anexo 2","verbo":"Geolocalizo","desc":"A distancia se abre con geolocalización, identificación digital y los topes de cada Anexo 2. Centros cambiarios no lo prevé.","orden":9,"panel":"4ª Ter · 7ª · Anexo 2","puntos":["Bancos 4ª Ter: geolocalización (salvo Anexo 1 de riesgo bajo) y, desde 2024, comprobante de domicilio digital (las otras DCG con no presencial ya lo pedían, salvo Casas de cambio y, para PF, la ITF).","Topes del Anexo 2: 30 · 60 · 100 mil UDIS según sujeto y producto; Transmisores 5,000 / 7,000 USD al mes; Casas de cambio hasta 5,000 USD por operación.","Centros cambiarios no lo prevé. Ver la tabla «No presencial»."],"ir":"#t2-1-2-nopresencial","destacado":false},{"etiqueta":"7","nombre":"¿Riesgo normal o bajo?","sub":"4ª IV · 14ª y equivalentes · Anexo 1","verbo":"Simplifico","desc":"Con riesgo bajo se piden menos datos: Anexo 1, productos que fija la entidad, niveles de cuenta, crédito pequeño o contratos chicos, según el sujeto.","orden":10,"panel":"4ª IV · 14ª y equivalentes · Anexo 1","puntos":["Anexo 1 sólo con riesgo bajo; Bancos 2024 agregó la fr. IV Bis para gobierno con riesgo distinto a bajo.","Niveles: Bancos 750 · 3,000 · 10,000 · fr. IV 30,000 UDIS; ITF 750 · 3,000 · 1,700 en transferencias internacionales.","Casas de cambio 9a: medios electrónicos inferiores a 2,000 UDIS al mes."],"ir":"#t2-1-2-simplificada","destacado":false},{"etiqueta":"8","nombre":"¿Qué operación?","sub":"16ª · 17ª · 14ª Bis-1","verbo":"Escalono","desc":"Efectivo, cheques, transferencias, bolsa y activos virtuales tienen reglas propias: datos «pegados» sin importar el monto y escalones por monto.","orden":11,"panel":"16ª · 17ª · 14ª Bis-1","puntos":["Transferencias: datos del ordenante sin importar el monto; escalones de Usuarios 1,000 / 3,000 / 5,000 USD (Transmisores desde 500).","Cheques de caja con Usuarios ≥ 10,000 USD: expediente (sólo Bancos).","Bolsas de valores: sólo Casas de bolsa. Activos virtuales: Bancos (si Banxico autoriza) e ITF."],"ir":"#t2-1-2-operaciones","destacado":false}]},{"letra":"3","titulo":"2.1.2 · 02 Mecanismos · 03 Reglas · 04 Riesgo","pregunta":"¿Cómo vigilo y cómo guardo?","ritmo":"¿Cómo vigilo?","corto":"Vigilo","color":"negro","items":[{"etiqueta":"18ª","nombre":"Seguimiento y agrupación","sub":"Bancos 18ª y equivalentes","verbo":"Agrupo","desc":"Se siguen y agrupan por mes las operaciones en moneda extranjera desde 500 USD y en efectivo nacional por encima de 300 mil (PF) o 500 mil pesos (PM).","orden":12,"panel":"Bancos 18ª y equivalentes","puntos":["Bancos: moneda extranjera en efectivo o cheques de viajero <b>≥ 500 USD<\/b>; efectivo MN <b>> 300,000<\/b> PF y <b>> 500,000<\/b> PM o fideicomiso; mes calendario.","Casas de cambio y Centros cambiarios: desde <b>1,000 USD<\/b>; Centros, sin umbral en pesos.","Asesores no lo prevé; la ITF agrupa todo, sin importar el monto (art. 43)."],"ir":"#t2-1-2-mecanismos","destacado":false},{"etiqueta":"18ª","nombre":"Escalamiento de aprobación","sub":"Bancos 18ª, penúltimo párrafo","verbo":"Escalo","desc":"Recibir mucho efectivo en sucursal exige aprobación interna de un nivel superior: más de 7,500 USD o 300 mil pesos (PF); más de 50 mil USD o 500 mil pesos (PM).","orden":13,"panel":"Bancos 18ª, penúltimo párrafo","puntos":["Excepciones: Centros cambiarios 5,000 / 8,000 USD; Transmisores 10,000 USD para PF.","Fondos no fija montos; Asesores e ITF no lo prevén."],"ir":"#t2-1-2-mecanismos","destacado":false},{"etiqueta":"20ª","nombre":"Seguimiento más estricto","sub":"Bancos 20ª · ITF art. 43","verbo":"Vigilo","desc":"Quien acumula en un mes 1 millón de pesos o 100 mil dólares en efectivo recibe un registro y seguimiento más estricto. La ITF usa UDIS.","orden":14,"panel":"Bancos 20ª · ITF art. 43","puntos":["Bancos: ≥ 1,000,000 MN o ≥ 100,000 USD en un mes calendario.","Fondos sólo en pesos; Centros sólo en dólares.","ITF: IFC 12,500 UDIS; IFPE 7,500 UDIS."],"ir":"#t2-1-2-mecanismos","destacado":false},{"etiqueta":"4ª · 59ª","nombre":"Reglas de expedientes","sub":"Bancos 4ª, 8ª, 9ª y 59ª","verbo":"Conservo","desc":"Un expediente por cliente para todos sus contratos, que puede guardarse por partes con un sistema; en grupo financiero puede integrarlo otra entidad. Se conserva 10 años.","orden":15,"panel":"Bancos 4ª, 8ª, 9ª y 59ª","puntos":["Expediente compartido en grupo: Bancos 9ª y equivalentes; no lo prevén SOCAP, Uniones, Centros ni Transmisores.","Conservación: 10 años (Bancos 59ª); <b>Asesores, 5<\/b> (37ª): se estudia en 2.1.6 (H3)."],"ir":"#t2-1-2-reglas","destacado":false},{"etiqueta":"15ª Bis · 21ª","nombre":"Verificación y actualización","sub":"Bancos 15ª Bis y 21ª","verbo":"Actualizo","desc":"Se verifican datos y documentos y se actualizan expedientes: los de riesgo alto, al menos una vez al año; la ITF, todos cada año.","orden":16,"panel":"Bancos 15ª Bis y 21ª","puntos":["Bancos: verificación posterior con riesgo bajo, sin operar antes (15ª Bis). PM de riesgo bajo: puede no actualizarse (21ª).","Transmisores no difiere la verificación; Centros no tiene disposición de verificación equivalente.","Visita domiciliaria a riesgo alto: en los supuestos que fije el Manual."],"ir":"#t2-1-2-reglas","destacado":false},{"etiqueta":"10ª–10ª Ter","nombre":"Situaciones de riesgo","sub":"Bancos 10ª, 10ª Bis y 10ª Ter","verbo":"Suspendo","desc":"Prohibidas las cuentas anónimas; ante sospecha no se aplican medidas simplificadas y se puede suspender la identificación con reporte de 24 horas.","orden":17,"panel":"Bancos 10ª, 10ª Bis y 10ª Ter","puntos":["Suspensión «podrá»: posible FT u ORPI, riesgo de alertar al cliente o riesgos del Manual; ROI de 24 horas.","ITF (art. 28): sólo si continuar alertaría al cliente; el plazo de 24 horas puede venir del art. 73 fr. I."],"ir":"#t2-1-2-reglas","destacado":false}]},{"letra":"4","titulo":"2.1.2 · Conocimiento","pregunta":"¿Lo conozco? · Bancos Cap. III (22ª–32ª)","ritmo":"¿Lo conozco?","corto":"Conozco","color":"oscuro","items":[{"etiqueta":"22ª–25ª Quáter","nombre":"Perfil transaccional","sub":"Bancos 22ª a 24ª y 25ª Quáter","verbo":"Perfilo","desc":"Qué se espera que haga el cliente: monto, número, tipo y frecuencia, origen y destino. Perfil inicial con 6 meses; se evalúa al menos cada 6 meses.","orden":18,"panel":"Bancos 22ª a 24ª y 25ª Quáter","puntos":["<b>Bancos:<\/b> perfil (24ª); perfil inicial con los primeros 6 meses; evaluación <b>al menos cada 6 meses<\/b> (25ª Quáter).","SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones: <b>dos evaluaciones por año calendario<\/b>.","<b>Asesores:<\/b> <b>una<\/b> por año calendario.","<b>ITF:<\/b> = Bancos (al menos cada 6 meses)."],"ir":"#t2-1-2-factores-perfil","destacado":false},{"etiqueta":"25ª · 25ª Bis","nombre":"Grado de riesgo del cliente","sub":"Bancos 25ª, 25ª Bis y 28ª","verbo":"Califico","desc":"Cada cliente recibe un grado de riesgo que decide cuánto se le pide y vigila. Bancos usa un modelo aprobado por su comité de riesgos; los demás, mínimos de 2 o 3 grados.","orden":19,"panel":"Bancos 25ª, 25ª Bis y 28ª","puntos":["<b>Bancos:<\/b> modelo de evaluación de riesgos coherente con la metodología del Cap. II Bis y diseñado conforme al Anexo 3, <b>aprobado por el comité de riesgos<\/b>; evaluación al menos cada 6 meses (25ª Bis); clasificar al inicio (28ª).","SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones y Cambios y envíos: mínimo <b>2 grados para PF<\/b> (alto y bajo) y <b>3 para PM y fideicomisos<\/b>.","<b>ITF<\/b> (arts. 29-30): mínimo <b>3 grados para todos<\/b>, cada 6 meses."],"ir":"#t2-1-2-factores","destacado":false},{"etiqueta":"2ª XXXI · 26ª","nombre":"Personas políticamente expuestas","sub":"Bancos 2ª XXXI y 26ª","verbo":"Señalo","desc":"Quien tiene o tuvo una función pública destacada y sus allegados. La PEP nacional lo sigue siendo un año después de dejar el cargo; si es de alto riesgo, la aprueba un directivo.","orden":20,"panel":"Bancos 2ª XXXI y 26ª","puntos":["<b>Bancos:<\/b> se asimilan cónyuge, concubina o concubinario, parientes hasta el <b>2º grado<\/b> y PM con vínculo patrimonial; PEP nacional, <b>1 año<\/b> después del cargo (2ª XXXI).","PEP de alto riesgo: aprobación de un directivo para iniciar o continuar (26ª).","Igual que Bancos, salvo la <b>ITF<\/b> (art. 39): aprobación de directivo para <b>cualquier PEP<\/b>.","Igual que Bancos, salvo <b>Transmisores<\/b>: también aprueba «una persona con nivel de alta responsabilidad»."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"27ª · 28ª","nombre":"Alto riesgo y aprobación","sub":"Bancos 27ª y 28ª","verbo":"Apruebo","desc":"Abrir a un cliente de alto riesgo exige la aprobación previa de un directivo. Bancos fija tres de alto riesgo mínimo; casi todas las demás, sólo las PEP extranjeras.","orden":21,"panel":"Bancos 27ª y 28ª","puntos":["<b>Bancos<\/b> (28ª), alto riesgo como mínimo: <b>no residentes de banca privada, PEP extranjeras y PM que operan efectivo en USD<\/b>.","SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones, Casas de cambio, Centros cambiarios y Transmisores: <b>sólo PEP extranjeras<\/b>.","<b>ITF<\/b> (art. 33): no residentes del art. 70 fr. X y PEP extranjeras.","Cambios y envíos: la aprobación es antes de la <b>Operación<\/b>."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"29ª · 30ª","nombre":"Corresponsalía","sub":"Bancos 29ª y 30ª","verbo":"Filtro","desc":"Relaciones con instituciones del extranjero: aprobación a nivel directivo y debida diligencia; prohibido operar con bancos sin presencia física.","orden":22,"panel":"Bancos 29ª y 30ª","puntos":["<b>Bancos:<\/b> aprobación a nivel directivo (29ª); diligencia reforzada con jurisdicciones de riesgo y prohibición de bancos <i>shell<\/i> (30ª).","La tienen: Bancos, Casas de bolsa, Fondos, SOCAP y SOFIPO (estas dos, contrapartes «relacionadas con su objeto»).","<b>No la prevén:<\/b> SOFOM, Asesores, Uniones, Casas de cambio, Centros cambiarios, Transmisores e ITF."],"ir":"#t2-1-2-conocer","destacado":false},{"etiqueta":"31ª · 32ª","nombre":"Propietario real (ubicación)","sub":"Bancos 2ª XXXII, 31ª y 32ª","verbo":"Destapo","desc":"Quién está detrás del cliente. Aquí sólo dónde lo definen y aplican las DCG; el 25 %, la cascada y los Lineamientos se estudian en 2.1.16.","orden":23,"panel":"Bancos 2ª XXXII, 31ª y 32ª","puntos":["<b>Bancos:<\/b> definición en la 2ª XXXII (incluye Control, 25 % o más, 2ª VII); se aplica en la 4ª, 10ª, 31ª y 32ª.","Todas las DCG lo definen en su 2ª o art. 2 y lo aplican en el expediente.","Las DCG <b>obligan<\/b>; los Lineamientos de 2019 <b>orientan<\/b>.","Desarrollo completo: <b>2.1.16 Propietario real (H6)<\/b>."],"ir":"#t2-1-2-figuras-pr","destacado":false}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por elemento","html":"<b>Prevengo<\/b>, <b>Delimito<\/b> y <b>Distingo<\/b> · <b>Me ubico<\/b>, <b>Contrato<\/b>, <b>Identifico<\/b>, <b>Quito<\/b>, <b>Amplío<\/b>, <b>Geolocalizo<\/b>, <b>Simplifico<\/b> y <b>Escalono<\/b> · <b>Agrupo<\/b>, <b>Escalo<\/b>, <b>Vigilo<\/b>, <b>Conservo<\/b>, <b>Actualizo<\/b> y <b>Suspendo<\/b> · <b>Perfilo<\/b>, <b>Califico<\/b>, <b>Señalo<\/b>, <b>Apruebo<\/b>, <b>Filtro<\/b> y <b>Destapo<\/b>."}},{"tipo":"tarjetas","id":"t2-1-1","nav":"2.1.1 Objetivo","titulo":"2.1.1 · Objetivo","intro":"Tres preguntas: <b>¿para qué?<\/b> (1ª), <b>¿a quién obliga?<\/b> (2ª) y <b>¿con quién opera?<\/b> (Cliente o Usuario, 2ª). Bancos primero; después, sujeto por sujeto, en el orden de las familias. Las familias son una <b>agrupación didáctica<\/b> de 360Educa: orientan, pero las diferencias se aprenden sujeto por sujeto.","tarjetas":[{"barra":true,"color":"principal","titulo":"Bancos · el eje","ref":"1ª · art. 115 LIC","ancho":true,"html":"Dos objetos: (i) <b>medidas y procedimientos mínimos<\/b> para prevenir y detectar actos u operaciones que puedan favorecer los delitos de los arts. <b>139 Quáter<\/b> (financiamiento al terrorismo) y <b>400 Bis<\/b> (operaciones con recursos de procedencia ilícita) del Código Penal Federal; (ii) los términos para <b>reportar a la SHCP, por conducto de la CNBV<\/b>, actos y operaciones de clientes y usuarios, y de consejeros, directivos, funcionarios, empleados y apoderados."},{"encabezado":true,"color":"principal","titulo":"Crédito","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"Bancos","v":"Art. 115 LIC · «Entidades» = instituciones de crédito (2ª XI)"},{"k":"SOFOM","v":"Igual que Bancos, salvo: fundamento múltiple: <b>reguladas<\/b> por el 87-D LGOAAC (remite a 115 LIC, 71-72 LRASCAP, 124 LACP o 129 LUC) y <b>no reguladas<\/b> por el 95 Bis LGOAAC; obliga a ambas (2ª IX). Si transmite dinero, cumple también las DCG de transmisores"}]},{"encabezado":true,"color":"morado","titulo":"Bursátil","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"Casas de bolsa","v":"Art. 212 LMV"},{"k":"Asesores","v":"Art. 226 Bis LMV · personas del art. 225 LMV (2ª II)"},{"k":"Fondos","v":"Art. 91 LFI · excluye ciertos capítulos para las actividades de los arts. 39 Bis fr. V y 40 Bis LFI (1ª)"}]},{"encabezado":true,"color":"turquesa","titulo":"Ahorro popular","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"SOCAP","v":"Arts. 71 y 72 LRASCAP · sólo niveles de operación <b>I a IV<\/b> (2ª XXXV)"},{"k":"SOFIPO","v":"Art. 124 LACP · incluye <b>SOFINCO<\/b> niveles I a IV y Organismos de Integración Financiera Rural (2ª XI)"},{"k":"Uniones","v":"Art. 129 LUC"}]},{"encabezado":true,"color":"coral","titulo":"Cambios y envíos","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"Casas de cambio","v":"Art. 95 LGOAAC"},{"k":"Centros cambiarios","v":"Art. 95 Bis LGOAAC · sociedades anónimas del 81-A LGOAAC (2ª II)"},{"k":"Transmisores","v":"Art. 95 Bis LGOAAC"}]},{"encabezado":true,"color":"amarillo","titulo":"Fintech","subtitulo":"Fundamento y sujeto obligado (1ª y 2ª)","filas":[{"k":"ITF","v":"Art. 58 LRITF · IFC e IFPE (art. 2). Su objeto incluye presentar el <b>Manual de Cumplimiento<\/b> a la CNBV (art. 1)"}]},{"encabezado":true,"color":"principal","titulo":"Cliente y Usuario","subtitulo":"Las dos figuras","filas":[{"k":"Bancos","v":"Cliente: cuentahabiente o usa servicios al amparo de un contrato (2ª IV). Usuario: sin relación comercial permanente (2ª XXXVIII)"},{"k":"SOFOM","v":"Cliente: acreditado <b>o<\/b> quien opera al amparo de un contrato. Usuario: sin crédito, arrendamiento financiero ni factoraje"},{"k":"Casas de bolsa","v":"= Bancos: Usuario es quien no celebró contrato"},{"k":"SOCAP · SOFIPO","v":"SOCAP: Cliente = socios y terceros. En ambas, el Usuario no tiene relación «patrimonial, ni comercial permanente»"}]},{"encabezado":true,"color":"oscuro","titulo":"Sólo Cliente","subtitulo":"No existe el Usuario","filas":[{"k":"Asesores","v":"Opera al amparo de un contrato (2ª III)"},{"k":"Fondos","v":"Quien realice Operaciones (2ª III)"},{"k":"Uniones","v":"Socios o terceros (2ª III)"},{"k":"ITF","v":"PF o PM, <b>sin fideicomiso<\/b> (art. 2 IV). «Usuario» sólo en la transmisión de dinero de las IFPE (art. 100)"}]},{"encabezado":true,"color":"negro","titulo":"Sólo Usuario","subtitulo":"No existe el Cliente","filas":[{"k":"Casas de cambio","v":"2ª XXXIV; excluye a las entidades financieras que le proveen"},{"k":"Centros cambiarios","v":"2ª XXVI; misma exclusión"},{"k":"Transmisores","v":"2ª XXXIX: Usuario <b>Remitente<\/b> y Usuario <b>Beneficiario<\/b>"}]}],"nota":"Agrupación útil que <b>sí<\/b> es legal: el <b>95 Bis LGOAAC<\/b> junta a centros cambiarios, transmisores y SOFOM no reguladas. Las familias de color no salen de la ley."},{"tipo":"tarjetas","id":"t2-1-2","nav":"2.1.2 Política","titulo":"2.1.2 · Política de identificación y conocimiento del cliente o usuario","intro":"Son <b>dos políticas<\/b> y el nombre del tema las trae: <b>identificación<\/b> (¿quién es?, Bancos Cap. II, 3ª–21ª) y <b>conocimiento<\/b> (¿qué hace y cuánto riesgo implica?, Cap. III, 22ª–32ª). La identificación se arma en cuatro bloques: <b>01 Identificación<\/b> (las 8 preguntas de abajo), <b>02 Mecanismos<\/b>, <b>03 Reglas de expedientes<\/b> y <b>04 Situaciones de riesgo<\/b>.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"01 · Las 8 preguntas antes de armar un expediente","subtitulo":"Estructura de la clase de Maribel · cada respuesta cambia lo que se pide","ancho":true,"filas":[{"k":"1 · Entidad","v":"¿Qué sujeto soy? Cada una de las 12 DCG pide cosas distintas. → cada <b>tabla<\/b> de esta sección separa a los sujetos"},{"k":"2 · Relación","v":"¿Cliente (con contrato) o Usuario (sin relación permanente)? → 2.1.1 y <b>Por operación<\/b> (Usuarios y operaciones)"},{"k":"3 · Persona","v":"¿Física, moral o fideicomiso? → <b>Persona física<\/b> (incluye datos, documentos y extranjero) · <b>Persona moral y fideicomiso<\/b>"},{"k":"4 · Nacionalidad","v":"¿Mexicana o residente, o extranjera? → «¿qué quitamos?» en <b>Persona física<\/b> (extranjero) y en <b>Persona moral y fideicomiso<\/b> (extranjera)"},{"k":"5 · Terceros","v":"Cotitulares, terceros autorizados, coacreditados, beneficiarios, proveedores de recursos, propietario real → <b>Terceros<\/b>"},{"k":"6 · Forma","v":"¿Presencial o remota? → <b>No presencial<\/b>"},{"k":"7 · Riesgo","v":"¿Normal o simplificada (bajo riesgo, Anexo 1, niveles)? → <b>Simplificada<\/b>"},{"k":"8 · Operación","v":"¿Efectivo, transferencia, bolsa de valores o activos virtuales? → <b>Por operación<\/b> (Usuarios y operaciones)"}]},{"barra":true,"color":"negro","titulo":"Reforma posterior al temario (DOF 10-jul-2026)","ref":"Bancos 4ª, 4ª Bis, 4ª Ter, 7ª, 14ª Bis","ancho":true,"html":"Después del temario, Bancos agregó el <b>nivel de cuenta 2 Bis<\/b> (hasta 15,000 UDIS de abonos al mes, máximo 3,000 UDIS en efectivo, sólo PF mexicanas residentes), la <b>CURP biométrica<\/b>, ajustes a la lista de identificaciones válidas y la <b>verificación de documentos en contratación remota<\/b> (7ª). Ojo: la matrícula consular y la identificación electrónica <b>ya<\/b> eran válidas en la versión del 28-ago-2024. <b>El examen usa la versión del 28-ago-2024<\/b>: esta nota es para que no te sorprenda en la práctica; ningún reactivo depende de ella."}]},{"tipo":"tablamin","id":"t2-1-2-manual","titulo":"2.1.2 · Política y Manual: quién aprueba y desde cuándo corre el plazo","intro":"Todas tienen las dos políticas en su Manual y remiten sus cambios a la CNBV; lo que cambia es de quién es la política, quién aprueba el Manual y desde cuándo corren los 20 días hábiles. «—» = su DCG no lo prevé. Toca una casilla para ver el detalle y la disposición.","igual":["Dos políticas: identificación y conocimiento, ambas en el Manual","Los cambios al Manual se remiten a la CNBV con un ejemplar completo","Plazo para remitirlos: 20 días hábiles"],"columnas":[{"k":"BAN","t":"Bancos","sujetos":["BAN"],"color":"principal"},{"k":"ASE","t":"Asesores en inversiones","sujetos":["ASE"],"color":"morado","trampa_mover":{"ASE":"Asesores: los 20 días hábiles corren desde que el Repre  modificaciones las <b>elabora el Representante<\/b> y de ahí corre el plazo (30ª fr. II).","SS":"SOCAP: comité de auditoría; si no lo tiene, su propio Comité (47ª fr. I). SOFIPO: «comité de auditoría <b>o su equivalente<\/b>» (46ª fr. I).","CE":"Casas de cambio: «comité de auditoría o Comité» (53a) y, si no hay comité de auditoría, su propio Comité (34a fr. I). Centros cambiarios y Transmisores: comité de auditoría o, si no lo hay, su propio Comité (30ª y 32ª fr. I).","resto":"Casas de bolsa: = Bancos, comité de auditoría. SOFOM: si no tiene comité de auditoría, su Comité, su <b>consejo<\/b> o su <b>director general<\/b> (35ª fr. I). Fondos: comité de auditoría o, si no lo hay, su propio Comité (37ª fr. I). Uniones: «comité de auditoría o Comité» (53ª; su 34ª fr. I sólo menciona el comité de auditoría). ITF: «comisario, comité de auditoría o Comité, en su caso» (art. 83)."},"ref":{"BAN":"64ª · 43ª fr. I","ASE":"30ª fr. II · 38ª","SS":"SOCAP 47ª fr. I · SOFIPO 46ª fr. I","CE":"CC 34a, 53a · CCA 30ª · TD 32ª","resto":"SOFOM 35ª · CB 63ª · FON 37ª · UC 53ª · ITF art. 83"},"seguro":true},{"k":"plazo","t":"Los 20 días hábiles corren desde que…","celdas":{"BAN":"Se aprueban los cambios","ASE":"El Representante los elabora","SS":"Se aprueban los cambios","CE":"Se aprueban los cambios","resto":"Se aprueban los cambios"},"det":{"ASE":"Es el único que no cuenta desde una aprobación: «dentro de los veinte días hábiles siguientes a la fecha en que su Representante las elabore» (38ª, en los términos de la 30ª fr. II)."},"ref":{"BAN":"64ª","ASE":"38ª","SS":"67ª","CE":"CC 53a · CCA 51ª · TD 54ª","resto":"SOFOM 54ª · CB 63ª · FON 57ª · UC 53ª · ITF art. 83"},"trampa":"Asesores: los 20 días hábiles corren desde que el Representante elabora los cambios, no desde una aprobación","seguro":true},{"k":"envio","t":"Además de la CNBV, se envía a…","celdas":{"BAN":"—","ASE":"—","SS":"Su Comité de Supervisión (Auxiliar)","CE":"—","resto":"—"},"det":{"SS":"El documento y sus modificaciones t , sin abreviaturas. Redacción del 28-ago-2024; las otras 11 DCG conservan «apellido paterno, apellido materno».","resto":"Apellido paterno, apellido materno y nombre(s), sin abreviaturas. SOFOM y Asesores agregan «en su caso» para el materno."},"ref":{"BAN":"4ª I a) i","ITF":"Art. 11 I a) i","resto":"4ª I a) i · CC y Centros 4ª III A a) i · TD 4ª IV A a) i"}},{"k":"entidad","t":"Entidad federativa de nacimiento","celdas":{"BAN":"Cuando corresponda","ITF":"Siempre","resto":"Cuando corresponda"},"det":{"ITF":"Entidad federativa de nacimiento, sin la condición «cuando corresponda»."},"ref":{"BAN":"4ª I a) iv","ITF":"Art. 11 I a) iv","resto":"4ª I a) iv · CC y Centros 4ª III A a) iv · TD 4ª IV A a) iv"}},{"k":"claves","t":"CURP, RFC con homoclave y NIF","celdas":{"BAN":"Los tres, cuando disponga","ITF":"Sólo CURP, sin condición","resto":"Los tres, cuando disponga"},"det":{"BAN":"CURP, RFC con homoclave, NIF o equivalente y país que los asignó, «cuando disponga de ellos».","ITF":"Sólo la CURP, sin condición. No pide RFC, NIF ni país que los asignó.","resto":"Mismo contenido que Bancos. Uniones, Casas de cambio, Centros y Transmisores lo redactan «CURP y la clave del RFC…»."},"ref":{"BAN":"4ª I a) xi","ITF":"Art. 11 I d)","resto":"4ª I a) xi · CC y Centros 4ª III A a) xi · TD 4ª IV A a) xi"}},{"k":"fea","t":"Número de serie de la FEA","celdas":{"BAN":"Cuando cuente con ella","ITF":"No la pide","resto":"Cuando cuente con ella"},"det":{"ITF":"No está en la lista de datos de la persona física."},"ref":{"BAN":"4ª I a) xii","ITF":"Art. 11 I","resto":"4ª I a) xii · CC y Centros 4ª III A a) xii · TD 4ª IV A a) xii"}},{"k":"correo","t":"Correo electrónico","celdas":{"BAN":"En su caso","ITF":"Obligatorio","resto":"En su caso"},"det":{"ITF":"Dirección de correo electrónico, sin «en su caso»."},"ref":{"BAN":"4ª I a) x","ITF":"Art. 11 I g)","resto":"4ª I a) x · CC y Centros 4ª III A a) x · TD 4ª IV A a) x"}},{"k":"elector","t":"Clave de elector","celdas":{"BAN":"—","ITF":"En su caso","resto":"— (CC: sólo en lo no presencial)"},"det":{"BAN":"No está en los datos del expediente (4ª). En la contratación no presencial (4ª Ter I a)) está derogada.","ITF":"Clave de elector, «en su caso» (sólo persona física mexicana o residente).","resto":"No está en los datos del expediente (4ª). Casas de cambio sólo la pide en la contratación no presencial: «Clave de elector, en su caso» (4ª Bis a))."},"ref":{"BAN":"4ª","ITF":"Art. 11 I a) vii","resto":"4ª · CC 4ª Bis a)"}},{"k":"fadclabe","t":"Firma autógrafa digitalizada · cuenta y CLABE","celdas":{"BAN":"—","ITF":"Firma sí · CLABE en su caso","resto":"—"},"det":{"BAN":"Su DCG no prevé la firma autógrafa digitalizada. La cuenta y CLABE no está en los datos del expediente (4ª); en la contratación no presencial (4ª Ter I d)) está derogada.","ITF":"Firma Autógrafa Digitalizada (art. 11 I e)); ninguna otra DCG la pide. Número de cuenta y CLABE (depósito, conversión a FPE o financiamiento colectivo), a nombre del Cliente, «en su caso» (art. 11 I h)).","resto":"Su DCG no prevé la firma autógrafa digitalizada. La cuenta y CLABE no está en los datos del expediente (4ª): sólo aparece en la contratación no presencial (4ª Ter / 4ª Bis). Centros cambiarios no regulan la contratación no presencial."},"ref":{"BAN":"4ª","ITF":"Art. 11 I e) y h)","resto":"4ª"}},{"k":"geo","t":"Geolocalización del dispositivo","celdas":{"BAN":"Sólo en lo no presencial","ITF":"En todo expediente","resto":"Sólo no presencial · Centros: no"},"det":{"BAN":"Sólo en la contratación no presencial, no en el expediente presencial.","ITF":"Para integrar el expediente, geolocalización del dispositivo móvil desde el que abre la cuenta o celebra el contrato («en su caso»). En las demás DCG sólo se pide en la contratación no presencial.","resto":"Sólo en la contratación no presencial, no en el expediente presencial. Centros cambiarios no la prevén: no regulan la contratación no presencial."},"ref":{"BAN":"4ª Ter","ITF":"Art. 11, 2º párr.","resto":"4ª Ter / 4ª eedor 9 · deudor 1","DOC":"11 (no la ITF)"},"det":{"IGU":"Cliente titular: las 12 DCG. Cotitular: Bancos, Casas de bolsa, Asesores, Fondos, SOCAP y SOFIPO. Coacreditado u obligado solidario: sólo SOFOM y Uniones.","LOC":"Tercero autorizado: Bancos, SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones e ITF (art. 11 VIII). Propietario real: las 12 (en la ITF, sólo datos: art. 11 VI).","BEN":"Bancos, SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO, Uniones e ITF; no Asesores ni Cambios y envíos.","DAT":"Proveedor de recursos: Bancos, SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones e ITF. Deudor de derechos de cobro: sólo SOFOM.","DOC":"Las 11 DCG; la ITF no lo regula."},"ref":{"IGU":"Bancos 4ª I y VII · SOFOM y Uniones 4ª VII","LOC":"Bancos 4ª VII y VI","BEN":"Bancos 4ª VIII y 11ª","DAT":"Bancos 4ª V · SOFOM 4ª VII, 2º párr.","DOC":"Bancos 4ª I b) v"}}],"relaciona":[{"a":"Sólo SOFOM","b":"Deudor de derechos de cobro"},{"a":"Sólo SOFOM y Uniones","b":"Coacreditado u obligado solidario"},{"a":"Las 11 DCG, no la ITF","b":"Apoderado de una persona física"},{"a":"6 DCG","b":"Cotitular"},{"a":"8 DCG","b":"Beneficiario"}],"relaciona_pregunta":"Une cada figura con las DCG que la regulan.","columna_pregunta":"¿En qué columna va cada tercero?","elegir":"¿Cuál tabla dice bien qué se le pide a cada tercero?","trampas":["Terceros: no todos son «igual que un Cliente»."],"nota":"<b>Excepciones (apréndelas después de la tabla):<\/b> al proveedor de recursos no se le piden datos en cuenta concentradora, nómina, pagos a proveedores, programas de gobierno ni cuentas de nivel (Bancos 4ª V); del propietario real de sociedades que cotizan en bolsa y sus subsidiarias de más del 50 % no se recaban datos (4ª VI); en cuentas de nivel, los datos del beneficiario pueden recabarse después de abrir (4ª VIII). En la ITF, del propietario real sólo se piden datos. Al apoderado se le piden carta poder o copia certificada del poder, identificación y comprobante de domicilio (4ª I b) v)."},{"tipo":"tablamin","id":"t2-1-2-simplificada","nav":"Simplificada","titulo":"2.1.2 · Régimen simplificado: cuentas por niveles y sus topes","intro":"Sólo Bancos e ITF tienen niveles de cuenta; SOCAP y SOFIPO tienen una cuenta de 3,000 UDIS que no se llama «nivel». Arriba va lo que es igual para todas; la tabla sólo trae lo que cambia. Cifras en UDIS. Toca una casilla para ver el detalle y la disposición. «—» = su DCG no lo prevé.","igual":["Anexo 1: datos reducidos sólo si su Grado de Riesgo es bajo","Sospecha fundada (arts. 139 Quáter o 400 Bis CPF): nada simplificado","En cuentas y contratos, las UDIS son abonos al mes","En crédito, las UDIS se miden sobre la línea o el monto otorgado"],"columnas":[{"k":"BAN","t":"Bancos","sujetos":["BAN"],"color":"principal"},{"k":"ITF","t":"ITF","sujetos":["ITF"],"color":"morado"},{"k":"SS","t":"Ahorro popular","sujetos":["SOCAP","SOFIPO"],"color":"turquesa","pista":"Una sola cuenta a la vista de 3,000 UDIS y productos de bajo riesgo"},{"k":"resto","t":"Las demás","sujetos":["SOFOM","CB","ASE","FON","UC","CC","CCA","TD"],"color":"oscuro"}],"renglones":[{"k":"productos","t":"Productos de bajo riesgo","celdas":{"BAN":"Sí · monto máximo en el Manual","ITF":"—","SS":"Sí · monto máximo en el Manual","resto":"—"},"det":{"BAN":"Productos que la entidad considera de bajo riesgo, distintos a cuentas de depósito y créditos: sólo datos de la 4ª (I, II o III) más los de la identificación, que se presenta antes de abrir. El monto máximo lo fija el Manual. Si se rebasa: entrevista o mecanismo y expediente completo.","ITF":"Su DCG no lo prevé.","SS":"Productos que la entidad considera de bajo riesgo: sólo datos de la 4ª y 4ª Bis (I, II o III) más los de la identificación, que se presenta antes de abrir. El monto máximo lo fija el Manual. Son distintos a la cuenta a la vista de 3,000 UDIS (SOCAP 14ª, SOFIPO 15ª).","resto":"Su DCG no lo prevé."},"ref":{"BAN":"14ª","SS":"SOCAP 13ª · SOFIPO 14ª"},"seguro":true},{"k":"n1","t":"Nivel 1 (PF)","celdas":{"BAN":"750 al mes · saldo máximo 1,000","ITF":"750 al mes · saldo máximo 1,000","SS":"—","resto":"—"},"det":{"BAN":"Cuenta de depósito a la vista en MN. PF: abonos de 750 UDIS al mes y saldo máximo de 1,000 UDIS. Basta nombre y fecha de nacimiento (remota: además género y entidad federativa de nacimiento).","ITF":"PF: operación de 750 UDIS al mes; nombre, fecha de nacimiento, género, entidad federativa, ocupación (profesión, actividad o giro) y correo. Saldo máximo de 1,000 UDIS.","SS":"No tiene nivel 1: su única cuenta simplificada es la de 3,000 UDIS (SOCAP 14ª, SOFIPO 15ª).","resto":"Su DCG no tiene niveles de cuenta."},"ref":{"BAN":"14ª Bis I","ITF":"art. 12 I"},"seguro":true,"trampa":"Niveles de cuenta: sólo Bancos (750 · 3,000 · 10,000 · 30,000) e ITF (750 · 3,000 · 1,700)"},{"k":"n2","t":"Nivel 2 (PF)","celdas":{"BAN":"3,000 al mes","ITF":"3,000 al mes","SS":"Sin «nivel»: cuenta de 3,000 al mes","resto":"—"},"det":{"BAN":"PF: abonos de 3,000 UDIS al mes; nombre, fecha de nacimiento y domicilio (de la identificación, la constancia temporal de CURP o el documento del INM). Remota: además género y entidad de nacimiento. Se abre presencial o remota (7ª: captura con RENAPO y validación del celular). También son nivel 2 la 14ª Bis 2 (personas del art. 59 LIC) y la 14ª Bis 3 (mexicanos residentes en el extranjero, 3,000 UDIS «por cuenta»).","ITF":"PF: operación de 3,000 UDIS al mes; los datos del nivel 1 más el domicilio y la versión digital del documento de identificación.","SS":"No usan la palabra «nivel»: su cuenta a la vista de 3,000 UDIS equivale en monto. PF: abonos de 3,000 UDIS al mes; nombre, fecha de nacimiento y domicilio. SOFIPO: se abre presencial «o en términos de la 7ª, cuarto párrafo» (captura remota con RENAPO). SOCAP: la 14ª dice «abiertas de forma presencial», pero su 2º párrafo y la 7ª, 4º párr., permiten la captura remota con RENAPO y validación del celular (pendiente: confirmar en el texto publicado en el DOF).","resto":"Su DCG no tiene niveles de cuenta."},"ref":{"BAN":"14ª Bis II; 7ª","ITF":"art. 12 II","SS":"SOCAP 14ª; 7ª, 4º párr. · SOFIPO 15ª"},"seguro":{"SS":false}},{"k":"n3","t":"Nivel 3 (PF o PM)","celdas":{"BAN":"10,000 al mes","ITF":"No tiene nivel 3","SS":"—","resto":"—"},"det":{"BAN":"PF o PM: abonos de 10,000 UDIS al mes; datos de la 4ª (I, II o III) más los de la identificación, presentada antes de abrir. Remota (mexicanos residentes): 4ª y 4ª Ter, versión digital de la identificación; PF, manifestación de cuenta propia; PM, un solo representante que se declare Propietario Real.","ITF":"El art. 12 sólo trae niveles 1 y 2 y transferencias internacionales.","SS":"Su DCG no tiene niveles de cuenta.","resto":"Su DCG no tiene niveles de cuenta."},"ref":{"BAN":"14ª Bis III","ITF":"art. 12"},"seguro":true,"trampa":"Niveles de cuenta: sólo Bancos (750 · 3,000 · 10,000 · 30,000) e ITF (750 · 3,000 · 1,700)"},{"k":"friv","t":"Fr. IV: remota, PM o PFAE","celdas":{"BAN":"30,000 al mes (no es «nivel 4»)","ITF":"—","SS":"—","resto":"—"},"det":{"BAN":"PM o PF con actividad empresarial, mexicanas residentes, contratación remota: abonos de 30,000 UDIS al mes; datos de la 4ª I y II, versión digital de la identificación y del comprobante de domicilio, manifestación de cuenta propia o un solo representante Propietario Real, y evidencia de la inscripción registral de la PM. Adicionada DOF 28-ago-2024. La norma la llama «fracción IV», no «nivel 4».","ITF":"Su DCG no lo prevé.","SS":"Su DCG no lo prevé.","resto":"Su DCG no lo prevé."},"ref":{"BAN":"14ª Bis IV"},"seguro":true},{"k":"itf","t":"Transferencias internacionales (PF o PM)","celdas":{"BAN":"—","ITF":"Hasta 1,700 al mes (no 1,750)","SS":"—","resto":"—"},"det":{"ITF":"Transferencias internacionales de PF o PM de hasta 1,700 UDIS al mes («un mil setecientas»): datos del nivel 1, domicilio y versión digital del documento.","BAN":"No tiene este supuesto.","SS":"No tiene este supuesto.","resto":"No tiene este supuesto."},"ref":{"ITF":"art. 12, pár áter<\/b> libera del RFC las cuentas para liquidar operaciones de TPV. Tener <b>más de una cuenta<\/b> o rebasar el límite obliga a entrevista o mecanismo y expediente completo (salvo cuentas de nómina, 13ª). Si la contratación es <b>remota<\/b>, a nombre, fecha y domicilio se suman <b>género y entidad federativa de nacimiento<\/b> (Bancos, SOFOM, Casas de bolsa, Fondos, Asesores, SOCAP y SOFIPO). La UDI es la del <b>último día del mes anterior<\/b>; no se computan intereses ni bonificaciones. Bancos se cita en su versión del 28-ago-2024."},{"tipo":"tablamin","id":"t2-1-2-simplificada-credito","titulo":"2.1.2 · Régimen simplificado: crédito, contratos y montos propios","intro":"El crédito simplificado es de 3,000 y 10,000 UDIS; los contratos bursátiles, inferiores a 3,000, y Casas de cambio tiene su propio 2,000. Fíjate en «inferior» contra «inferior o igual»: el detalle de cada casilla trae la palabra exacta. «—» = su DCG no lo prevé.","igual":["En crédito, las UDIS se miden sobre la línea o el monto otorgado","Sospecha fundada: ningún crédito ni contrato simplificado"],"columnas":[{"k":"BAN","t":"Bancos","sujetos":["BAN"],"color":"principal"},{"k":"SU","t":"Crédito","sujetos":["SOFOM","UC"],"color":"morado","pista":"Crédito simplificado de 3,000 y de 10,000 UDIS"},{"k":"SS","t":"Ahorro popular","sujetos":["SOCAP","SOFIPO"],"color":"turquesa","pista":"Llevan al crédito el límite de su cuenta"},{"k":"BUR","t":"Bursátiles","sujetos":["CB","FON","ASE"],"color":"amarillo","pista":"Contratos con operaciones inferiores a 3,000 UDIS al mes"},{"k":"resto","t":"Las demás","sujetos":["CC","CCA","TD","ITF"],"color":"oscuro"}],"renglones":[{"k":"cr3","t":"Crédito PF: hasta 3,000 UDIS","celdas":{"BAN":"Niveles 1 y 2 (750 o 3,000), sólo PF","SU":"≤ 3,000 «inferior o igual» · PF","SS":"Límite de su cuenta (3,000)","BUR":"—","resto":"—"},"det":{"BAN":"Los límites de los niveles 1 y 2 (750 y 3,000 UDIS) pueden aplicarse a créditos y microcréditos, sobre la línea o monto otorgado, s e», sin «al mes». SOFOM: su DCG no lo prevé.","SS":"Hasta 6,000 UDIS al mes adicionales en la cuenta de 3,000 UDIS, si provienen de programas gubernamentales.","BUR":"Su DCG no lo prevé.","resto":"Su DCG no lo prevé."},"ref":{"BAN":"14ª Bis II, 3er párr.","SU":"Uniones 11ª I, 3er párr.","SS":"SOCAP 14ª · SOFIPO 15ª, 3er párr."},"seguro":true},{"k":"contr","t":"Contratos inferiores a 3,000 UDIS al mes","celdas":{"BAN":"Vía 14ª Ter: niveles 1 y 2","SU":"—","SS":"—","BUR":"< 3,000 al mes · Asesores sólo PF","resto":"—"},"det":{"BAN":"No tiene un régimen propio de contratos «inferiores a 3,000», pero la 14ª Ter permite aplicar los límites de los niveles 1 y 2 (750 y 3,000 UDIS al mes) a cuentas de administración de valores e inversiones. Pendiente: confirmar en el texto publicado en el DOF.","BUR":"Contratos con operaciones «inferiores a tres mil» UDIS al mes: nombre, fecha de nacimiento y domicilio. Remoto: además género y entidad de nacimiento. Nivel transaccional = suma de lo abonado. Por Cliente y por Casa de Bolsa, por Entidad (Fondos) o por Asesor. Asesores es el único que lo limita a Clientes PF. Casas de bolsa: si se rebasa, entrevista o Anexo 2 y expediente completo.","SU":"Su DCG no lo prevé.","SS":"Su DCG no lo prevé.","resto":"Su DCG no lo prevé."},"ref":{"BAN":"14ª Ter","BUR":"C. bolsa 12ª · Fondos 12ª · Asesores 8ª Ter"},"seguro":{"BAN":false},"trampa":"Contratos bursátiles: «inferiores» a 3,000 UDIS al mes; Asesores, sólo PF"},{"k":"cc9","t":"Medios electrónicos inferiores a 2,000 UDIS","celdas":{"BAN":"—","SU":"—","SS":"—","BUR":"—","resto":"Sólo Casas de cambio: < 2,000 al mes"},"det":{"resto":"Casas de cambio: operaciones por medios electrónicos distintas a las cambiarias y de transferencia, «inferiores» a 2,000 UDIS al mes por Usuario: nombre, fecha de nacimiento y domicilio. Respetando el límite, no hay seguimiento ni reportes de Relevantes o Inusuales: es la única exención de seguimiento y reportes en las 12 DCG. Si se rebasa: expediente completo (4 atos."},"ref":{"BAN":"27ª","ITF":"Art. 39","CE":"CC 20a · CCA 17ª · TD 18ª","resto":"SOFOM 23ª · CB 25ª · ASE 15ª · FON 23ª · SOCAP 28ª · SOFIPO 29ª · UC 21ª"},"seguro":true},{"k":"corr","t":"Corresponsalía con el extranjero","celdas":{"BAN":"Sí · diligencia reforzada (30ª)","ITF":"—","CE":"—","resto":"Sólo CB, FON, SOCAP y SOFIPO"},"det":{"BAN":"Aprobación a nivel directivo (29ª) y diligencia reforzada con entidades de las jurisdicciones de riesgo (30ª). Prohibida con intermediarios <b>sin presencia física<\/b>.","ITF":"Su DCG no la prevé.","CE":"Su DCG no la prevé.","resto":"La tienen Casas de bolsa, Fondos, SOCAP y SOFIPO (estas dos, sólo contrapartes «relacionadas con su objeto»); también aprueban a nivel directivo y prohíben la corresponsalía con intermediarios sin presencia física. SOFOM, Asesores y Uniones no la prevén. Con corresponsales de países o territorios de riesgo no dicen «diligencia reforzada» (eso es sólo Bancos, 30ª): «aplican estrictamente su política de conocimiento del Cliente» (CB 28ª, FON 26ª, SOCAP 31ª, SOFIPO 32ª)."},"ref":{"BAN":"29ª–30ª","resto":"CB 27ª–28ª · FON 25ª–26ª · SOCAP 30ª–31ª · SOFIPO 31ª–32ª"},"seguro":true}],"trampas":["Sólo Bancos agrega banca privada y PM con dólares; la ITF agrega no residentes del art. 70 fr. X"],"relaciona":[{"a":"ITF","b":"Aprobación de directivo para cualquier PEP"},{"a":"Transmisores","b":"«Persona con nivel de alta responsabilidad»"},{"a":"Bancos","b":"PM con efectivo en dólares: riesgo alto mínimo"},{"a":"SOCAP y SOFIPO","b":"Corresponsalía sólo con contrapartes de su objeto"},{"a":"Cambios y envíos","b":"Aprobación antes de la Operación con el Usuario"},{"a":"Asesores en inversiones","b":"PEP de riesgo alto: directivo a 3 niveles del director general"}],"elegir":"¿Cuál tabla dice bien quién es de alto riesgo y quién aprueba?","nota":"El perfil transaccional, el modelo de riesgo, el número de grados y el ritmo de reevaluación están en las tablas de <b>Factores<\/b>, justo abajo."},{"tipo":"tablamin","id":"t2-1-2-factores","nav":"Factores","titulo":"2.1.2 · Factores de riesgo del cliente: ¿con qué método califica cada uno?","intro":"Tres bloques: <b>Bancos<\/b>, la <b>ITF<\/b> y <b>Las demás<\/b> (las otras 10 DCG). Bancos se cita del <b>Anexo 3<\/b> porque su 25ª Bis lo obliga a un modelo de riesgos que cumpla ese Anexo de sus propias DCG y que aprueba el comité de riesgos: ahí están sus factores (6 inherentes y 8 transaccionales), no en una lista del Manual. La ITF también usa dos dimensiones (art. 31), pero su lista es ilustrativa; Las demás fijan en su Manual una lista mínima de 7 elementos (6 en Casas de cambio y Centros cambiarios). «—» = su DCG no lo prevé. Toca una casilla para ver el detalle.","igual":["Todas clasifican a sus clientes por Grado de Riesgo","Todas: método coherente con su metodología de evaluación de riesgos"],"columnas":[{"k":"BAN","t":"Bancos (Anexo 3)","sujetos":["BAN"],"color":"principal"},{"k":"ITF","t":"ITF (art. 31)","sujetos":["ITF"],"color":"amarillo"},{"k":"resto","t":"Las demás","sujetos":["SOFOM","CB","ASE","FON","SOCAP","SOFIPO","UC","CC","CCA","TD"],"color":"oscuro"}],"renglones":[{"k":"modelo","t":"¿Modelo de evaluación de riesgos?","celdas":{"BAN":"Sí, conforme al Anexo 3","ITF":"Sí, en su Manual; sin Anexo 3","resto":"No: criterios en su Manual"},"det":{"BAN":"Modelo de evaluación de Riesgos para identificar, medir y clasificar a los Clientes. Su diseño, metodología, uso y validación cumplen el Anexo 3; lo aprueba el comité de riesgos a propuesta del Comité de Comunicación y Control y se informa al consejo. A requerimiento, se entrega a la Secretaría y a la CNBV un documento que acredite que cumple el Anexo 3.","ITF":"Sí tiene modelo de evaluación de Riesgos, pero establecido en su Manual de Cumplimiento; no remite a ningún Anexo 3 ni pide aprobación de un comité de riesgos.","resto":"No piden modelo: la entidad establece en su Manual de Cumplimiento los criterios para el Grado de Riesgo. Su DCG no tiene Anexo 3. Uniones lo fija «en los documentos señalados en el párrafo anterior»."},"trampa":"«Modelo» no es exclusivo de Bancos: la ITF también tiene; lo exclusivo es el Anexo 3 y el comité de riesgos","ref":{"BAN":"25ª Bis, 1er y 2º párr.","ITF":"art. 29, 1er párr.","resto":"SOFOM 21ª, último párr. · C. bolsa 23ª, último párr. · Asesores 13ª, último párr. · Fondos 21ª, último párr. · SOCAP 26ª, último párr. · SOFIPO 27ª, último párr. · Uniones 19ª, último párr. · C. cambio 18a, último párr. · Centros 15ª, último párr. · Transmisores 16ª, último párr."},"seguro":true},{"k":"comite","t":"¿Lo aprueba el comité de riesgos?","celdas":{"BAN":"Sí; se informa al consejo","ITF":"—","resto":"—"},"det":{"BAN":"Lo aprueba el comité de riesgos a propuesta del Comité de Comunicación y Control y se informa al consejo.","ITF":"No pide aprobación de un comité de riesgos.","resto":"Su DCG no pide aprobación del comité de riesgos para el grado."},"ref":{"BAN":"25ª Bis, 1er y 2º párr.","ITF":"art. 29, 1er párr.","resto":"SOFOM 21ª, último párr. · C. bolsa 23ª, último párr. · Asesores 13ª, último párr. · Fondos 21ª, último párr. · SOCAP 26ª, último párr. · SOFIPO 27ª, último párr. · Uniones 19ª, último párr. · C. cambio 18a, último párr. · Centros 15ª, último párr. · Transmisores 16ª, último párr."},"seguro":true},{"k":"dim","t":"Dos dimensiones: inherentes y transaccionales","celdas":{"BAN":"Sí: 6 inherentes, 8 transaccionales","ITF":"Sí, con lista ilustrativa","resto":"No: usan su lista del Manual"},"det":{"BAN":"La 25ª Bis obliga a un modelo que cumpla el Anexo 3. El Anexo 3 pide considerar al Cliente «al menos» en dos dimensiones: a) características inherentes (6) y b) características transaccionales (8, más una que la entidad puede agregar: el intercambio de información del Cap. XIII).","ITF":"Para asignar el Grado de Riesgo, el modelo del art. 29 incluye «al menos» factores de dos tipos: I. características inherentes a la persona y II. características transaccionales. Lo obligatorio son las dos dimensiones; lo que va dentro es ilustrativo («pudiendo incluir… entre otros»).","resto":"Su DCG no habla de características inherentes ni transaccionales: usa la lista de aspectos del Manual."},"trampa":"Sólo Bancos e ITF hablan de factores inherentes y transaccionales; las demás usan la lista del Manual","ref":{"BAN":"25ª Bis 1er párr. y Anexo 3, I, i","ITF":"art. 31, fr. I y II","resto":"SOFOM 21ª, último párr. · C. bolsa 23ª, último párr. · Asesores 13ª, último párr. · Fondos 21ª, último párr. · SOCAP 26ª, último párr. · SOFIPO 27ª, último párr. · Uniones 19ª, último párr. · C. cambio 18a, último párr. · Centros 15ª, último párr. · Transmisores 16ª, último párr."},"seguro":true},{"k":"lista","t":"Lista mínima en el Manual («entre otros aspectos»)","celdas":{"BAN":"No tiene esa lista","ITF":"No: usa sus dos dimensiones","resto":"Sí: 7 elementos (CC y CCA: 6)"},"det":{"BAN":"No tiene la lista «antecedentes, profesión… demás circunstancias»: el grado sale del modelo de la 25ª Bis y del Anexo 3.","ITF":"No usa lista de aspectos del Manual: el modelo (que va en el Manual) debe contener factores inherentes y transaccionales.","resto":"Para determinar el Grado de Riesgo y si el cliente es PEP, fijan en su Manual criterios que tomen en cuenta, «entre otros aspectos»: antecedentes; profesión, actividad o giro; origen y destino de los recursos; lugar de residencia; geolocalización; la metodología del Capítulo II Bis, y las demás circunstancias que determine la entidad. Casas de cambio y Centros cambiarios no listan la geolocalización (6 elementos)."},"trampa":"Bancos no tiene la lista «antecedentes… demás circunstancias»: sus factores están en el Anexo 3","ref":{"BAN":"25ª y 25ª Bis","ITF":"arts. 29 y 31","resto":"SOFOM 21ª, último párr. · C. bolsa 23ª, último párr. · Asesores 13ª, último párr. · Fondos 21ª, último párr. · SOCAP 26ª, último párr. · SOFIPO 27ª, último párr. · Uniones 19ª, último párr. · C. cambio 18a, último párr. · Centros 15ª, último párr. · Transmisores 1 ef":{"BAN":"9ª · 13ª","TD":"50ª fr. III","ITF":"Arts. 18 y 20","SS":"SOCAP 12ª · SOFIPO 9ª, 13ª","resto":"SOFOM 9ª · CB 8ª · FON 8ª · CC 7a · ASE 8ª"},"seguro":true},{"k":"tarj","t":"Tarjetas o medios de pago prepagados","celdas":{"BAN":"Prepagadas en ME (19ª)","TD":"Prepagadas en ME (10ª)","ITF":"—","SS":"Recargables y tarjetas en divisas","resto":"SOFOM ME (15ª) · CB, FON, CC: medios"},"det":{"BAN":"Tarjetas prepagadas bancarias en moneda extranjera, o en moneda nacional para personas físicas extranjeras (19ª).","TD":"Tarjetas prepagadas bancarias en moneda extranjera (10ª).","ITF":"Su DCG no lo prevé.","SS":"Tarjetas recargables propias o de otras Sociedades/Entidades, y tarjetas bancarias en divisas: SOCAP 20ª, SOFIPO 21ª.","resto":"SOFOM: tarjetas prepagadas bancarias en moneda extranjera (15ª). Casas de bolsa (17ª), Fondos (15ª) y Casas de cambio (12a): medios de pago con abonos anticipados emitidos por entidades financieras; seguimiento a compras y recargas arriba del límite de Banxico para prepagadas al portador. Asesores, Uniones y Centros cambiarios: su DCG no lo prevé."},"ref":{"BAN":"19ª","TD":"10ª","SS":"SOCAP 20ª · SOFIPO 21ª","resto":"SOFOM 15ª · CB 17ª · FON 15ª · CC 12a"},"seguro":true},{"k":"propias","t":"Otras figuras propias","celdas":{"BAN":"Contrato marco · nómina · TPV sin RFC","TD":"Agentes, Coadyuvantes y Terceros (50ª)","ITF":"IFC vs. IFPE · activos virtuales","SS":"Aportaciones · divisas ≥ 500 USD","resto":"Coacreditados (SOFOM, UC) · CB ≥500 USD"},"det":{"BAN":"Contrato marco con medios de pago a terceros (5ª); cuentas de nómina (13ª); cuentas para liquidar TPV, sin RFC (14ª Quáter).","TD":"<b>Agente Relacionado<\/b> (persona física), <b>Persona Jurídica Coadyuvante<\/b> (PM o PFAE) y <b>Tercero<\/b>; el transmisor responde por ellos (50ª).","ITF":"<b>IFC vs. IFPE<\/b>: seguimiento más estricto en IFC desde <b>12,500 UDIS al mes<\/b> en efectivo o activos virtuales y en IFPE desde <b>7,500 UDIS<\/b> (art. 43); datos por operación con activos virtuales (art. 21); IFPE que transmite dinero, con Usuario (Título XV).","SS":"SOCAP: aportaciones al capital social; cuentas de trabajadores de dependencias (12ª); Usuarios en compraventa de divisas en efectivo ≥ 500 USD (18ª). SOFIPO: aportaciones; trabajadores de dependencias (13ª); Usuarios con Operación en efectivo ≥ 500 USD (19ª).","resto":"SOFOM: su 5ª trata <b>tarjetas de crédito<\/b> a terceros; coacreditados y obligados solidarios. Uniones: coacreditados y obligados solidarios. Casas de bolsa: medios de pago; Usuarios con efectivo ≥ 500 USD (15ª). Casas de cambio: medios de pago de terceros (12ª); si distribuye acciones de fondos, se sujeta a las DCG de Fondos. Asesores: ver el renglón anterior. Fondos: Concentradora (excluida para los arts. 39 Bis y 40 Bis LFI), grupo financiero (8ª) y medios de pago prepagados (15ª). Centros cambiarios: sin figuras propias en su capítulo de identificación."},"ref":{"BAN":"5ª, 13ª, 14ª Quáter","TD":"50ª","ITF":"Arts. 21 y 43 · Título XV","SS":"SOCAP 4ª, 12ª, 18ª · SOFIPO 4ª, 13ª, 19ª","resto":"SOFOM 5ª · CB 15ª · CC 12a · FON 8ª, 15ª"},"seguro":true}],"relaciona":[{"a":"Transmisores","b":"Agente Relacionado y Persona Jurídica Coadyuvante"},{"a":"ITF","b":"IFC desde 12,500 UDIS · IFPE desde 7,500"},{"a":"Bancos","b":"Cuentas para liquidar TPV, sin RFC"},{"a":"Asesores en inversiones","b":"La entidad financiera relacionada integra el expediente"},{"a":"Centros cambiarios","b":"Concentradora derogada y sin figuras propias"}],"elegir":"¿Cuál tabla dice bien qué figuras propias tiene cada sujeto?","nota":"Comisionistas: en Bancos, Fondos, SOCAP y SOFIPO el expediente también puede integrarlo y conservarlo el comisionista que abre la cuenta (su 4ª); en la ITF, el tercero que contrata (art. 18)."},{"tipo":"tarjetas","id":"t2-1-2-figuras-pr","titulo":"2.1.2 · Propietario real: sólo dónde está","intro":"Su desarrollo está en <b>2.1.16 (H6)<\/b>; aquí sólo se ubica.","tarjetas":[{"barra":true,"color":"negro","titulo":"Propieta
