R.simulador = s=>head({titulo:s.titulo||"Modo examen",para:s.para,intro:s.intro||"Opción múltiple con 4 opciones. Practica por tema en rondas de 10, o haz un simulacro de 30 o 50 que no repite reactivos hasta agotar el banco. Contesta con clic o con las teclas A, B, C, D."})+
  `<div class="simbar">${(s.tamanos||[30,50]).map(n=>`<button class="qsim" data-n="${+n}" aria-pressed="false">Simulacro de ${+n}</button>`).join("")}<span class="bankinfo" id="bankinfo"></span><button class="linkbtn" id="simReset">Reiniciar mi avance</button></div>
   <div class="lbl" style="margin-bottom:6px">O practica por tema (rondas de 10)</div><div class="modes" id="modes" role="group" aria-label="Tipo de práctica"></div><div class="quiz" id="quiz" aria-live="polite"></div>`;

  `<div class="lbl" style="margin:22px 0 8px">${s.pool?"Elige cuántas preguntas":"Bloques"}</div><div class="modes" id="rpi-${s.id}" role="group" aria-label="Repaso"></div><div class="quiz rp-box" id="rp-${s.id}" aria-live="polite"></div>`;
/* ---------- tablero: matriz reporte × sujeto con filtros (tipo "tablero") ---------- */
R.tablero = s=>head(s)+`<div class="tbf" id="tbf-${s.id}"></div><div class="tbtabs" role="group" aria-label="Vista">${s.fichas===false?"":`<button class="fchip" data-tbv="${s.id}:tabla" aria-pressed="true">Tabla</button><button class="fchip" data-tbv="${s.id}:fichas" aria-pressed="false">${esc(s.fichas||"Fichas (base de reportes)")}</button>`}<button class="linkbtn" data-tbclr="${s.id}">Quitar filtros</button></div><div id="tbo-${s.id}"></div><div class="tbcount" id="tbn-${s.id}"></div>${s.nota?`<p class="note">${s.nota}</p>`:""}`;

$("#secciones").innerHTML = D.secciones.map((s,i)=>`<section class="block${s.tipo==="simulador"?" sim":""}" id="${s.id}">${R[s.tipo](s,i)}</section>`).join("");

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}
document.fonts && document.fonts.ready.then(redraw); redraw();

  $("#stepd-"+sid).innerHTML=`<div class="big">${i+1}</div><div><div class="lbl">Paso ${i+1} de ${n}</div><h3>${esc(p.nombre)}</h3>${p.ref?`<span class="art">${esc(p.ref)}</span>`:""}${p.gancho?`<div class="hook">${esc(p.gancho)}</div>`:""}<ul>${(p.puntos||[]).map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="stepnav"><button class="btn ghost" data-pnav="${sid}:${i-1}">← Anterior</button><button class="btn" data-pnav="${sid}:${i+1}">Siguiente paso →</button></div></div>`;
}

recite.addEventListener("click",()=>{const on=document.body.classList.toggle("recite");recite.setAttribute("aria-pressed",on);recite.textContent=on?"Mostrar nombres":"Modo recitar";document.querySelectorAll(".shown").forEach(e=>e.classList.remove("shown"));});

const TB={}, CT={};
const tbSec=id=>D.secciones.find(x=>x.id===id);
const tbCell=(s,r,j)=>(s._ix||(s._ix=Object.fromEntries(s.celdas.map(c=>[c.rep+"|"+c.suj,c]))))[r+"|"+j]||{rep:r,suj:j,aplica:false,seguro:false};
const uniq=a=>[...new Set(a.filter(Boolean))];
function tbInit(s){
  const st=TB[s.id]={suj:new Set(),grp:new Set(),frec:"",monto:"",plazo:"",vista:"tabla"};
  const on=s.celdas.filter(c=>c.aplica);
  const sel=(k,lab,vals)=>!vals.length?"":`<div class="row"><span class="lbl">${lab}</span><select data-tbs="${s.id}:${k}"><option value="">Todos</option>${vals.map(v=>`<option>${esc(v)}</option>`).join("")}</select></div>`;

    `<div class="row"><span class="lbl">Tipo</span>${s.grupos.map((g,i)=>`<button class="fchip sw ${colorDe(g.color,i)}" data-tbf="${s.id}:grp:${g.k}" aria-pressed="false"><i></i>${esc(g.t)}</button>`).join("")}</div>`+
    `<div class="row" style="gap:14px">${sel("frec","Frecuencia",uniq(on.map(c=>c.frec_tag)))}${sel("monto","Monto",uniq(on.map(c=>c.monto_tag)))}${sel("plazo","Plazo",uniq(on.map(c=>c.plazo_tag)))}</div>`;

function tbMatch(st,c){return (!st.frec||c.frec_tag===st.frec)&&(!st.monto||c.monto_tag===st.monto)&&(!st.plazo||c.plazo_tag===st.plazo);}
function tbDraw(id){
  const s=tbSec(id), st=TB[id], val=st.frec||st.monto||st.plazo;
  const cols=s.sujetos.map((j,i)=>({...j,ci:i})).filter(j=>!st.suj.size||st.suj.has(j.k));
  let hits=0, shown=0;
  if(st.vista==="tabla"){
    let body="";
    s.grupos.forEach((g,gi)=>{
      if(st.grp.size&&!st.grp.has(g.k)) return;
      const rows=s.reportes.filter(r=>r.g===g.k).map(r=>{
        const cells=cols.map(j=>{const c=tbCell(s,r.k,j.k), m=c.aplica&&val&&tbMatch(st,c); if(m)hits++; return {c,j,m};});
        if(val&&!cells.some(x=>x.m)) return "";
        shown++;
        return `<tr><th class="rp" scope="row">${esc(r.t)}${r.regla?`<span class="rg">${esc(r.regla)}</span>`:""}</th>${cells.map(({c,j,m})=>`<td class="${val?(m?"hit":"dim"):""}"><button class="tbc ${c.aplica?"si":"no"}${c.aplica&&c.marca?" tx":""}${c.seguro===false?" dud":""}" data-tbc="${id}|${r.k}|${j.k}" aria-label="${esc(r.t)} · ${esc(j.t)}: ${c.aplica?(c.marca?esc(c.marca):"sí"):"no"}"><span class="mk">${c.aplica&&c.marca?`<span class="mt">${esc(c.marca)}</span>`:""}</span></button></td>`).join("")}</tr>`;
      }).join("");
      if(rows) body+=`<tr class="grp ${colorDe(g.color,gi)}"><th colspan="${cols.length+1}">${esc(g.t)}${g.pregunta?`<span>${esc(g.pregunta)}</span>`:""}</th></tr>`+rows;
    });
    $("#tbo-"+id).innerHTML=`<div class="tbwrap"><table class="tbm"><thead><tr><th class="rp" scope="col">${esc(s.col_titulo||"Reporte")}</th>${cols.map(j=>`<th class="sj ${colorDe(j.color,j.ci)}" scope="col" title="${esc(j.t)}">${esc(j.corto||j.k)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
    $("#tbn-"+id).textContent=val?`${hits} casillas cumplen el filtro en ${shown} reportes.`:`✓ = su DCG lo prevé · punto = no lo prevé · ? = texto dudoso. Toca una casilla para ver monto, plazo y disposición.`;
  } else {
    const list=[];
    s.reportes.forEach(r=>{ if(st.grp.size&&!st.grp.has(r.g)) return; cols.forEach(j=>{const c=tbCell(s,r.k,j.k); if(c.aplica&&tbMatch(st,c)) list.push({r,j,c});}); });
    $("#tbo-"+id).innerHTML=`<div class="tbfichas">${list.map(({r,j,c})=>`<div class="tbficha ${colorDe(j.color,j.ci)}"><h4>${esc(r.t)}</h4><div class="who">${esc(j.t)} · ${esc(c.ref||"")}</div><dl>${c.que?`<dt>Qué</dt><dd>${esc(c.que)}</dd>`:""}${c.desde?`<dt>Desde</dt><dd>${esc(c.desde)}</dd>`:""}${c.cuando?`<dt>Cuándo</dt><dd>${esc(c.cuando)}</dd>`:""}${c.frec?`<dt>Frecuencia</dt><dd>${esc(c.frec)}</dd>`:""}${c.a_quien?`<dt>A quién</dt><dd>${esc(c.a_quien)}</dd>`:""}</dl>${c.nota?`<div class="nt">${esc(c.nota)}</div>`:""}</div>`).join("")}</div>`;
    $("#tbn-"+id).textContent=`${list.length} fichas.`;
  }
}
function tbOpen(id,rk,jk){
  const s=tbSec(id), r=s.reportes.find(x=>x.k===rk), j=s.sujetos.find(x=>x.k===jk), c=tbCell(s,rk,jk), gi=s.grupos.findIndex(g=>g.k===r.g);

const rnd=n=>Math.floor(Math.random()*n);
const mixA=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function ctNew(id){
  const s=tbSec(id), src=tbSec(s.fuente), g=CT[id], nR=s.filas||4, nC=s.columnas||4;
  const reps=src.reportes.filter(r=>!(s.excluir||[]).includes(r.k));
  const allOn=r=>src.sujetos.every(j=>tbCell(src,r.k,j.k).aplica);
  let R0,C0,M;
  for(let t=0;t<400;t++){
    const cs=mixA(src.sujetos).slice(0,nC), rs=mixA(reps).slice(0,nR);
    if(rs.filter(allOn).length>1) continue;
    if(rs.some(r=>cs.some(j=>tbCell(src,r.k,j.k).seguro===false))) continue;
    const m=rs.map(r=>cs.map(j=>!!tbCell(src,r.k,j.k).aplica));
    const pats=new Set(m.map(x=>x.join()));
    if(pats.size<Math.min(3,nR)) continue;
    if(m.filter(x=>!x.some(Boolean)).length>1) continue;
    R0=rs;C0=cs;M=m;break;
  }
  if(!M){R0=reps.slice(0,nR);C0=src.sujetos.slice(0,nC);M=R0.map(r=>C0.map(j=>!!tbCell(src,r.k,j.k).aplica));}
  Object.assign(g,{src,rows:R0,cols:C0,M,done:false});
  if(g.mode==="llena"){g.mine=M.map(x=>x.map(()=>false)); return ctDrawFill(id);}
  const key=m=>m.map(x=>x.map(Number).join("")).join("|"), seen=new Set([key(M)]), opts=[M];
  let guard=0;
  while(opts.length<4&&guard++<500){
    const d=M.map(x=>x.slice()), k=1+rnd(2);
    for(let q=0;q<k;q++){const r=rnd(nR),c=rnd(nC); d[r][c]=!d[r][c];}
    const kk=key(d); if(!seen.has(kk)){seen.add(kk);opts.push(d);}
  }
  g.opts=mixA(opts.map((m,i)=>({m,ok:i===0})));
  ctDrawPick(id);
}
const ctHead=g=>`<tr><th></th>${g.cols.map(j=>`<th title="${esc(j.t)}">${esc(j.corto||j.k)}</th>`).join("")}</tr>`;
function ctDrawPick(id){
  const g=CT[id];
  $("#ct-"+id).innerHTML=`<div class="ctq">¿Cuál tabla dice correctamente qué reporte presenta cada sujeto?</div><div class="ctgrid">${g.opts.map((o,i)=>`<button class="cttab" data-ctp="${id}:${i}"><div class="tl">Tabla ${"ABCD"[i]}</div><table>${ctHead(g)}${g.rows.map((r,ri)=>`<tr><th class="r">${esc(r.corto||r.t)}</th>${g.cols.map((j,ci)=>`<td class="${o.m[ri][ci]?"on":""}" data-rc="${ri}:${ci}">${o.m[ri][ci]?"✓":""}</td>`).join("")}</tr>`).join("")}</table></button>`).join("")}</div><div id="ctfb-${id}"></div>`;
  ctScore(id);
}
function ctWhy(g,ri,ci){const r=g.rows[ri], j=g.cols[ci], c=tbCell(g.src,r.k,j.k); return `<li><b>${esc(j.t)} · ${esc(r.t)}:</b> ${c.aplica?`<b>sí</b>${c.desde&&c.desde!=="sin monto"?` — ${esc(c.desde)}`:""}${c.cuando?`; ${esc(c.cuando)}`:""}`:"<b>no</b> — su DCG no lo prevé"}${c.ref?` <span class="art">${esc(c.ref)}</span>`:""}</li>`;}
function ctPick(id,i){
  const g=CT[id]; if(g.done) return; g.done=true; const o=g.opts[i]; g.n=(g.n||0)+1; if(o.ok) g.ok=(g.ok||0)+1;
  const tabs=document.querySelectorAll(`#ct-${id} .cttab`);
  g.opts.forEach((x,k)=>{const t=tabs[k]; t.disabled=true; if(x.ok) t.classList.add("ok"); if(k===i) t.classList.add("mine");
    t.querySelectorAll("td[data-rc]").forEach(td=>{const [r,c]=td.dataset.rc.split(":").map(Number); if(x.m[r][c]!==g.M[r][c]) td.classList.add("bad");});});
  const diff=[]; g.M.forEach((row,r)=>row.forEach((v,c)=>{ if(g.opts.some(x=>x.m[r][c]!==v)) diff.push([r,c]); }));
  const mineDiff=diff.filter(([r,c])=>o.m[r][c]!==g.M[r][c]);
  $("#ctfb-"+id).innerHTML=`<div class="ctfb fb">${o.ok?'<span class="ok">Correcto</span>':`<span class="no">Incorrecto</span> La correcta es la <b>tabla ${"ABCD"[g.opts.findIndex(x=>x.ok)]}</b>.`}<div class="lbl" style="margin-top:10px">${o.ok?"Las casillas que cambiaban en las otras":"Lo que fallaba en tu tabla"}</div><ul>${(o.ok?diff:mineDiff).map(([r,c])=>ctWhy(g,r,c)).join("")}</ul><div class="qactions"><button class="btn" data-ctnew="${id}">Otra</button></div></div>`;
  ctScore(id);
}
function ctDrawFill(id){
  const g=CT[id];
  $("#ct-"+id).innerHTML=`<div class="ctq">Marca qué reporte presenta cada sujeto y califica.</div><div class="cttab ctfill" style="cursor:default;max-width:640px"><table>${ctHead(g)}${g.rows.map((r,ri)=>`<tr><th class="r">${esc(r.corto||r.t)}</th>${g.cols.map((j,ci)=>`<td><button data-ctt="${id}:${ri}:${ci}" aria-label="${esc(r.t)} · ${esc(j.t)}"></button></td>`).join("")}</tr>`).join("")}</table></div><div class="qactions" style="margin-top:12px"><button class="btn" data-ctchk="${id}">Calificar</button><button class="btn ghost" data-ctnew="${id}">Otra tabla</button></div><div id="ctfb-${id}"></div>`;
  ctScore(id);

function ctCheck(id){
  const g=CT[id]; if(g.done) return; g.done=true; const bad=[];
  document.querySelectorAll(`#ct-${id} [data-ctt]`).forEach(b=>{const [,r,c]=b.dataset.ctt.split(":").map(Number), td=b.parentElement, ok=g.mine[r][c]===g.M[r][c]; td.classList.add(ok?"right":"wrong"); if(!ok){bad.push([r,c]); b.textContent=g.M[r][c]?"✓":"·";}});
  g.n=(g.n||0)+1; if(!bad.length) g.ok=(g.ok||0)+1;
  $("#ctfb-"+id).innerHTML=`<div class="ctfb fb">${bad.length?`<span class="no">${bad.length} casilla${bad.length>1?"s":""} mal</span><ul>${bad.map(([r,c])=>ctWhy(g,r,c)).join("")}</ul>`:'<span class="ok">Todo correcto</span>'}<div class="qactions"><button class="btn" data-ctnew="${id}">Otra</button></div></div>`;
  ctScore(id);
}
function ctScore(id){const g=CT[id]; $("#cts-"+id).textContent=g.n?`Aciertos: ${g.ok||0} de ${g.n}`:"";}

const RX={};
function rxInit(s){
  RX[s.id]={grp:new Set(),var:"",exc:false};

    `<div class="row" style="gap:14px"><div class="row"><span class="lbl">Variable</span><select data-rxs="${s.id}"><option value="">Todas</option>${vars.map(v=>`<option>${esc(v)}</option>`).join("")}</select></div><button class="fchip" data-rxe="${s.id}" aria-pressed="false">Sólo donde hay excepciones</button></div>`;
  rxDraw(s.id);
}
function rxDraw(id){
  const s=tbSec(id), st=RX[id], SJ=Object.fromEntries(s.sujetos.map((j,i)=>[j.k,{...j,ci:i}]));
  const pill=k=>{const j=SJ[k]; return j?`<span class="sjp ${colorDe(j.color,j.ci)}" title="${esc(j.t)}"><i></i>${esc(j.corto||j.k)}</span>`:esc(k);};
  const pills=a=>a.map(pill).join("");
  let n=0;
  const html=s.fichas.map((f,fi)=>{
    if(st.grp.size&&!st.grp.has(f.g)) return "";
    const vs=f.vars.filter(v=>(!st.var||v.v===st.var)&&(!st.exc||v.exc.length));
    if(!vs.length) return "";
    n++;
    const gi=s.grupos?s.grupos.findIndex(g=>g.k===f.g):0, col=s.grupos&&gi>=0?colorDe(s.grupos[gi].color,gi):"";
    const all=s.sujetos.map(j=>j.k), no=all.filter(k=>!f.quien.includes(k));
    const quien=f.quien.length===all.length?`<span class="lb">Lo tienen:</span> los 12`:
      f.quien.length>=9?`<span class="lb">Lo tienen ${f.quien.length} de 12 · todos menos</span>${pills(no)}`:`<span class="lb">Lo tienen (${f.quien.length}/12):</span>${pills(f.quien)}${f.no_txt?` <span class="lb" style="margin-left:6px">· ${esc(f.no_txt)}</span>`:(no.length?` <span class="lb" style="margin-left:6px">· No:</span>${pills(no)}`:"")}`;
    const rows=vs.map((v,vi)=>`<div class="rr" data-rxr="${id}|${fi}|${vi}"><div class="vv">${esc(v.v)}</div><div class="ra">${esc(v.regla)}</div><div class="ee${v.exc.length?"":" none"}">${v.exc.length?v.exc.map(e=>`<div class="rxx"><span class="ex"><span class="pre">${esc(e.pre||"excepto")}</span> ${esc(e.val)}</span>${pills(e.suj)}</div>`).join(""):"Sin excepciones"}</div></div>`).join("");
    return `<article class="rx ${col}"><h4>${esc(f.t)}</h4><div class="rxq">${quien}</div>${f.gancho?`<p class="rxg">${esc(f.gancho)}</p>`:""}<div class="rxt"><div class="hd">Variable</div><div class="hd">Regla general</div><div class="hd">Excepciones (quién se sale)</div>${rows}</div>${f.ojo&&f.ojo.length&&!st.var&&!st.exc?`<ul class="rxo">${f.ojo.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`:""}</article>`;
  }).join("");
  $("#rxo-"+id).innerHTML=html||`<p class="note">Nada coincide con el filtro.</p>`;
}

  if(r&&document.body.classList.contains("recite")) r.classList.toggle("shown");
});

/* ---------- repaso (tandas al azar o secuencia fija) ---------- */
// Con "pool": tandas al azar de 10/20/30 (configurable en "tandas") que no repiten hasta agotar el banco de repaso;
// las opciones se barajan. Con "bloques": secuencia fija, opciones sin barajar (para un guion con letras).
// Clic en una opción = respuesta del alumno; «Revelar respuesta» = la instructora muestra la correcta sin marcar a nadie.
D.secciones.filter(s=>s.tipo==="repaso").forEach(s=>{
  const BK={}; (D.banco||[]).forEach(q=>BK[q.id]=q);
  const TM=D.temas||{}, sim=D.secciones.find(x=>x.tipo==="simulador"), CL=s.claves||{};
  const box=$("#rp-"+s.id), idx=$("#rpi-"+s.id);
  const mix=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const KEY="rp-"+(D.meta.clave||"mapa")+"-"+s.id;
  const POOL=(s.pool||[]).filter(id=>BK[id]);
  let seq=[], i=0, meta=null;
  function fixedSeq(){ const out=[]; (s.bloques||[]).forEach((b,bi)=>b.items.forEach(it=>{if(BK[it.id]) out.push({...BK[it.id],opts:BK[it.id].o.slice(),clave:it.clave||CL[it.id]||"",extra:!!it.extra,bi,bt:b.titulo});})); return out; }
  function tanda(n){
    let used=new Set(st.get(KEY,[])), rest=POOL.filter(id=>!used.has(id)), pick;
    if(rest.length<n){ pick=mix(rest); used=new Set(); const more=mix(POOL.filter(id=>!pick.includes(id))).slice(0,n-pick.length); pick=pick.concat(more); more.forEach(id=>used.add(id)); }
    else { pick=mix(rest).slice(0,n); pick.forEach(id=>used.add(id)); }
    st.set(KEY,[...used]);
    return mix(pick).map(id=>({...BK[id],opts:mix(BK[id].o),clave:CL[id]||""}));
  }
  const sinSalir=()=>`${POOL.length-new Set(st.get(KEY,[])).size} de ${POOL.length} sin salir`;
  function start(n){ seq=n?tanda(n):fixedSeq(); meta={n}; seq.forEach(q=>{q.pick=null;q.shown=false;}); i=0; draw(); box.scrollIntoView({block:"start"}); }
  const fsTxt=()=>document.fullscreenElement?"Salir de pantalla completa":"Pantalla completa";
  if(s.pool){
    idx.innerHTML=(s.tandas||[10,20,30]).map(n=>`<button class="rpb" data-rpn="${n}" aria-pressed="false">${n} preguntas</button>`).join("")+`<span class="bankinfo" id="rpinfo-${s.id}" style="align-self:center">${POOL.length} preguntas en el banco de repaso · ${sinSalir()}</span>`;
    box.innerHTML=`<div class="qtext">Elige una tanda de ${(s.tandas||[10,20,30]).join(", ").replace(/, (\d+)$/," o $1")} preguntas.</div><p style="margin:10px 0 0">Salen al azar y no se repiten hasta agotar las ${POOL.length}; las opciones cambian de orden cada vez.</p>`;
  } else {
    idx.innerHTML=(s.bloques||[]).map((b,bi)=>`<button class="rpb" data-rpb="${bi}" aria-pressed="false">${bi+1} · ${esc(b.titulo)} <small>${b.items.length}</small></button>`).join("");
  }
  function draw(){
    idx.querySelectorAll("[data-rpn]").forEach(b=>b.setAttribute("aria-pressed",String(meta&&+b.dataset.rpn===meta.n)));
    if(!s.pool) idx.querySelectorAll("[data-rpb]").forEach(b=>b.setAttribute("aria-pressed",String(i<seq.length&&+b.dataset.rpb===seq[i].bi)));
    if(i>=seq.length) return fin();
    const q=seq[i], ok=q.opts.indexOf(q.a), lab=s.pool?`Tanda de ${seq.length}`:`Bloque ${q.bi+1} · ${esc(q.bt)}`;
    const good=seq.filter(x=>x.pick!=null&&x.opts[x.pick]===x.a).length;
    box.innerHTML=`<div class="qbar"><span>${lab} · pregunta ${i+1} de ${seq.length}</span><span>Aciertos: ${good}</span></div><div class="qprog"><i style="width:${i/seq.length*100}%"></i></div>
    <div class="qtag"><span>${esc(TM[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}${q.extra?"<span>Extra</span>":""}</div><div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt${q.shown?(k===ok?" right":(k===q.pick?" wrong":"")):""}" data-rpk="${k}"${q.shown?" disabled":""}><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="fb">${q.shown?`${q.pick==null?`<span class="ok">Respuesta ${"ABCD"[ok]}</span>`:(q.pick===ok?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>')}${q.pick!=null?tuHTML(q,q.opts[q.pick]):""} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}${q.clave?`<div class="rp-clave"><div class="lbl">Para no confundirte</div>${q.clave}</div>`:""}`:""}</div>
    <div class="qactions"><button class="btn ghost" data-rpnav="-1"${i===0?" disabled":""}>← Anterior</button>${q.shown?"":`<button class="btn" data-rpshow>Revelar respuesta</button>`}<button class="btn ghost" data-rpnav="1">${i+1===seq.length?"Ver resultado →":"Siguiente →"}</button><button class="btn ghost" data-rpfs>${fsTxt()}</button></div>`;
  }
  function fin(){
    const resp=seq.filter(x=>x.pick!=null), good=resp.filter(x=>x.opts[x.pick]===x.a).length, miss=seq.filter(x=>x.pick!=null&&x.opts[x.pick]!==x.a), c=s.cierre;
    box.innerHTML=`<div class="qbar"><span>${s.pool?`Tanda de ${seq.length} · resultado`:"Cierre"}</span><span>${resp.length?`${good}/${resp.length}`:""}</span></div><div class="qprog"><i style="width:100%"></i></div>
    ${resp.length?`<div class="score"><span class="big">${Math.round(good/resp.length*100)}%</span><span>${good} de ${resp.length} contestadas correctamente.</span></div>`:""}
    ${miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${miss.length})</summary><ul>${miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.opts[m.pick])}</s>${m.d&&m.d[m.opts[m.pick]]?` — ${esc(m.d[m.opts[m.pick]])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
    ${c?`<div class="qtext" style="margin-top:18px">${esc(c.titulo)}</div><ol class="rp-fin">${(c.pasos||[]).map(p=>`<li>${p}</li>`).join("")}</ol>${c.nota?`<div class="rp-clave">${c.nota}</div>`:""}`:""}
    <div class="qactions"><button class="btn ghost" data-rpnav="-1">← Anterior</button>${s.pool?`<button class="btn" data-rpn="${meta.n}">Otra tanda de ${meta.n}</button>`:""}${sim?`<a class="btn ghost" href="#${sim.id}">${esc(sim.nav||"Practicar")}</a>`:""}<button class="btn ghost" data-rpfs>${fsTxt()}</button></div>
    ${s.pool?`<p class="siminfo">${sinSalir()}</p>`:""}`;
    const inf=$("#rpinfo-"+s.id); if(inf) inf.textContent=`${POOL.length} preguntas en el banco de repaso · ${sinSalir()}`;
  }
  function reveal(){ if(!seq.length||i>=seq.length||seq[i].shown) return; seq[i].shown=true; draw(); }
  const go=n=>{ if(!seq.length) return; i=Math.max(0,Math.min(n,seq.length)); draw(); };
  function fs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else if(box.requestFullscreen) box.requestFullscreen(); }catch(e){} }
  document.addEventListener("fullscreenchange",()=>{const f=box.querySelector("[data-rpfs]");if(f)f.textContent=fsTxt();});
  const onClick=e=>{
    const n=e.target.closest("[data-rpn]"); if(n){start(+n.dataset.rpn);return;}
    const b=e.target.closest("[data-rpb]"); if(b){if(!seq.length||s.pool)start(0);go(seq.findIndex(q=>q.bi===+b.dataset.rpb));return;}
    const o=e.target.closest("[data-rpk]"); if(o&&seq[i]&&!seq[i].shown){seq[i].pick=+o.dataset.rpk;reveal();return;}
    if(e.target.closest("[data-rpshow]")){reveal();return;}
    const nv=e.target.closest("[data-rpnav]"); if(nv){go(i+(+nv.dataset.rpnav));return;}
    if(e.target.closest("[data-rpfs]")) fs();
  };
  idx.addEventListener("click",onClick); box.addEventListener("click",onClick);
  document.addEventListener("keydown",e=>{
    if(!seq.length||e.target.closest("input,textarea")||!$("#drawer").hidden) return;
    const r=box.getBoundingClientRect(); if(document.fullscreenElement!==box&&(r.bottom<0||r.top>innerHeight)) return;
    if(e.key==="ArrowRight"){go(i+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(i-1);e.preventDefault();}
    else if(e.key.toLowerCase()==="r"){reveal();e.preventDefault();}
    else if(e.key.toLowerCase()==="f"){fs();e.preventDefault();}
  });
  if(!s.pool) start(0);
});

/* ---------- simulador ---------- */
if(!D.secciones.some(s=>s.tipo==="simulador")) return;
const BANK=D.banco||[], TEMAS=D.temas||{};
const MODOS=[{k:"all",l:"Todo mezclado",f:()=>true}].concat((D.modos||[]).map(m=>({k:m.k,l:m.l,f:x=>(m.tema?x.tema===m.tema:true)&&(m.tipos?m.tipos.includes(x.tipo):true)})));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY=D.meta.clave||"mapa", SEEN="seen-"+KEY, SIM="sim-"+KEY;
let seen=new Set(store.get(SEEN,[])), MODE="all", ST=null;
const poolFor=k=>BANK.filter(MODOS.find(m=>m.k===k).f);
const simInfo=()=>`${BANK.length-store.get(SIM,[]).length} de ${BANK.length} sin salir en simulacro`;
const bankInfo=()=>`${BANK.length} reactivos verificados contra el texto oficial · ${simInfo()}`;
function startRound(){const pool=poolFor(MODE);const fresh=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));start(fresh.concat(old).slice(0,10),{kind:"ronda",label:MODOS.find(m=>m.k===MODE).l});}
const SIMSEC=D.secciones.find(s=>s.tipo==="simulador")||{};
function cuotas(n,pesos){ // reparto por resto mayor; sólo temas con reactivos
  const ks=Object.keys(pesos).filter(k=>pesos[k]>0&&BANK.some(x=>x.tema===k)), tot=ks.reduce((a,k)=>a+pesos[k],0);
  if(!ks.length) return null;
  const raw=ks.map(k=>({k,v:n*pesos[k]/tot})), out={}; let asig=0;
  raw.forEach(r=>{out[r.k]=Math.floor(r.v);asig+=out[r.k];});
  raw.sort((a,b)=>(b.v%1)-(a.v%1)).slice(0,n-asig).forEach(r=>out[r.k]++);
  return out;
}
function startSim(n){
  if(SIMSEC.proporcion){
    const q=cuotas(n,SIMSEC.proporcion);
    if(q){
      let used=new Set(store.get(SIM,[])), pick=[], cycled=false;
      Object.entries(q).forEach(([k,c])=>{
        const delTema=BANK.filter(x=>x.tema===k); let rest=shuffle(delTema.filter(x=>!used.has(x.id)));
        if(rest.length<c){cycled=true;delTema.forEach(x=>used.delete(x.id));rest=rest.concat(shuffle(delTema.filter(x=>!rest.includes(x))));}
        rest=rest.slice(0,c); rest.forEach(x=>used.add(x.id)); pick=pick.concat(rest);
      });
      store.set(SIM,[...used]); return start(shuffle(pick),{kind:"simulacro",label:`Simulacro de ${pick.length}`,n,cycled});
    }
  }
  let used=new Set(store.get(SIM,[])), rest=BANK.filter(x=>!used.has(x.id)), cycled=false;
  if(rest.length<n){cycled=true;const take=shuffle(rest);used=new Set();const more=shuffle(BANK.filter(x=>!take.includes(x))).slice(0,n-take.length);rest=take.concat(more);more.forEach(x=>used.add(x.id));}
  else{rest=shuffle(rest).slice(0,n);rest.forEach(x=>used.add(x.id));}
  store.set(SIM,[...used]); start(shuffle(rest),{kind:"simulacro",label:`Simulacro de ${n}`,n,cycled});
}
function start(list,meta){ST={list:list.map(q=>({...q,opts:shuffle(q.o)})),i:0,ok:0,miss:[],byTema:{},meta};document.querySelectorAll(".qmode,.qsim").forEach(b=>b.setAttribute("aria-pressed","false"));render();}
function render(){
  const box=$("#quiz"),n=ST.list.length; if(ST.i>=n) return renderEnd();
  const q=ST.list[ST.i];
  box.innerHTML=`<div class="qbar"><span>${esc(ST.meta.label)} · reactivo ${ST.i+1} de ${n}</span><span>Aciertos: ${ST.ok}</span></div><div class="qprog"><i style="width:${ST.i/n*100}%"></i></div>
  <div class="qtag"><span>${esc(TEMAS[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}</div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>
  <div class="qactions"><button class="btn" id="qNext" hidden>${ST.i+1===n?"Ver resultado":"Siguiente"}</button><button class="btn ghost" id="qQuit">Terminar aquí</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  $("#qNext").addEventListener("click",()=>{ST.i++;render();});
  $("#qQuit").addEventListener("click",()=>{ST.list=ST.list.slice(0,ST.i);renderEnd();});
}
function answer(k){
  const q=ST.list[ST.i]; if(q.done) return; q.done=true; const good=q.opts[k]===q.a;
  const t=ST.byTema[q.tema]||(ST.byTema[q.tema]={ok:0,n:0}); t.n++; if(good){ST.ok++;t.ok++;} else {q.mine=q.opts[k];ST.miss.push(q);}
  seen.add(q.id); store.set(SEEN,[...seen]);
  $("#quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.a)b.classList.add("right");else if(+b.dataset.k===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`${good?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>'}${good?"":tuHTML(q,q.opts[k])} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}`;
  const nb=$("#qNext"); nb.hidden=false; nb.focus();
}
function renderEnd(){
  const box=$("#quiz"),n=ST.list.length,pct=n?Math.round(ST.ok/n*100):0;
  const msg=pct>=90?"Listos para el examen.":pct>=75?"Muy bien: repasen los temas con menos aciertos.":pct>=60?"Van bien, pero hay que repasar.":"Toca volver al mapa y repasar antes del siguiente intento.";
  const ordT=(SIMSEC.orden_resultados||(D.sitio&&D.sitio.orden_resultados))==="temario",TK=Object.keys(TEMAS),ix=k=>{const i=TK.indexOf(k);return i<0?1e9:i};
  const rows=Object.entries(ST.byTema).sort(ordT?(a,b)=>ix(a[0])-ix(b[0]):(a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>`<div class="trow2"><span>${esc(TEMAS[k]||k)}</span><span class="tb"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></span><span class="tv">${v.ok}/${v.n}</span></div>`).join("");
  box.innerHTML=`<div class="printhead"><b>${esc(D.meta.titulo)}</b> · 360Educa · ${esc(ST.meta.label)} · ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div><div class="qbar"><span>${esc(ST.meta.label)} · resultado</span><span>${ST.ok}/${n}</span></div><div class="qprog"><i style="width:100%"></i></div>
  <div class="score"><span class="big">${pct}%</span><span>${ST.ok} de ${n} correctas. ${msg}</span></div>
  ${rows?`<div class="lbl" style="margin-top:14px">Aciertos por tema (${ordT?"en el orden del temario":"de menor a mayor"})</div><div class="trows">${rows}</div>`:""}
  ${ST.miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${ST.miss.length})</summary><ul>${ST.miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.mine||"")}</s>${m.d&&m.d[m.mine]?` — ${esc(m.d[m.mine])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
  <div class="qactions"><button class="btn" id="qAgain">${ST.meta.kind==="simulacro"?"Otro simulacro igual":"Otra ronda"}</button><button class="btn ghost" id="qPrint">Imprimir o guardar en PDF</button><a class="btn ghost" href="#${mapa0?mapa0.id:"top"}">Repasar el mapa</a></div>
  ${ST.meta.kind==="simulacro"?`<p class="siminfo">${simInfo()}${ST.meta.cycled?" · Se completó el banco y empezó una vuelta nueva.":""}</p>`:""}`;
  $("#qAgain").addEventListener("click",()=>ST.meta.kind==="simulacro"?startSim(ST.meta.n):startRound());
  $("#qPrint").addEventListener("click",()=>{const d=box.querySelector("details.miss");if(d)d.open=true;window.print();});
  $("#bankinfo").textContent=bankInfo();
}
document.addEventListener("keydown",e=>{
  if(!ST||e.target.closest("input,textarea")) return;
  const r=$("#quiz").getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
  const k="abcd1234".indexOf(e.key.toLowerCase()); if(k>=0&&ST.i<ST.list.length&&!ST.list[ST.i].done){answer(k%4);e.preventDefault();}
});
$("#modes").innerHTML=MODOS.map(m=>`<button class="qmode" data-m="${m.k}" aria-pressed="false">${esc(m.l)} <small>${poolFor(m.k).length}</small></button>`).join("");
document.querySelectorAll(".qmode").forEach(b=>b.addEventListener("click",()=>{MODE=b.dataset.m;startRound();b.setAttribute("aria-pressed","true");}));
document.querySelectorAll(".qsim").forEach(b=>b.addEventListener("click",()=>{startSim(+b.dataset.n);b.setAttribute("aria-pressed","true");}));
$("#simReset").addEventListener("click",()=>{store.set(SIM,[]);store.set(SEEN,[]);seen=new Set();$("#bankinfo").textContent=bankInfo();});
$("#bankinfo").textContent=bankInfo();
startRound(); document.querySelector('.qmode[data-m="all"]').setAttribute("aria-pressed","true");
})();
</script>
</body>
