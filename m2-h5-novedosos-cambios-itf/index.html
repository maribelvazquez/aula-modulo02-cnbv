<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Módulo 2 · Área 2: obligaciones de los modelos novedosos, centros cambiarios, transmisores de dinero e ITF (LRITF, LGOAAC y sus DCG, con Bancos como eje), con simulador de reactivos.">
<title>2.1.11 Modelos novedosos · 2.1.12 Centros cambiarios · 2.1.13 Transmisores de dinero · 2.1.14 Instituciones de tecnología financiera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{display:inline-block;font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}

tulo IV). Hay dos: la de una <b>sociedad que no es entidad financiera<\/b> (art. 80, hasta 2 años, prórroga hasta 1) y la de una <b>entidad ya regulada, incluida una ITF<\/b> (art. 86, hasta 1 año, prorrogable una sola vez por otro). En las DCG, ITF (Anexo 1, n.º 1) y sociedad autorizada para MN (n.º 28) son renglones distintos."},{"titulo":"Centro cambiario ≠ casa de cambio chica; agente relacionado ≠ persona moral.","texto":"La casa de cambio tiene su PLD en el <b>art. 95<\/b> LGOAAC; el centro cambiario y el transmisor, en el <b>95 Bis<\/b>, junto con la SOFOM no regulada, con <b>registro ante la CNBV<\/b>. El centro cambiario es <b>sólo S.A.<\/b>, opera hasta <b>10,000 USD por cliente en un mismo día<\/b> y <b>no transfiere fondos<\/b> (81-A). El transmisor puede ser <b>S.A. o S. de R.L.<\/b> y no puede hacer operaciones de centro cambiario (81-A Bis). Su <b>agente relacionado es persona física<\/b>. Si quien colabora es una persona moral, es una <b>Persona Jurídica Coadyuvante<\/b>, figura de la DCG."},{"titulo":"A distancia y por niveles: no todos.","texto":"<b>Centros cambiarios no identifican a distancia<\/b>: su DCG no trae 4ª Bis ni 4ª Ter, Anexo 2, Dispositivo ni Geolocalización. Los <b>Transmisores sí<\/b> (4ª Bis y Anexo 2: hasta 5,000 o 7,000 USD al mes). <b>Cuentas por niveles<\/b>: sólo Bancos (niveles 1 a 3 y la fr. IV de la 14ª Bis, que no lleva nombre de nivel) e <b>ITF (niveles 1 y 2, art. 12)<\/b>. El «nivel 4» no existe en el texto."}],"secciones":[{"tipo":"tarjetas","id":"familias","nav":"Las 5 familias","titulo":"Dónde queda cada sujeto: las 5 familias","intro":"Referencia para todo el módulo. <i>Agrupación didáctica de 360Educa: orienta y da color; no explica las diferencias, que se aprenden sujeto por sujeto.<\/i> Los cuatro temas de esta herramienta caen en dos familias, pero el modelo novedoso las cruza todas.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Crédito","subtitulo":"Bancos (eje) · SOFOM","filas":[{"k":"Ojo","v":"La SOFOM no regulada comparte el <b>95 Bis<\/b> con centros y transmisores. Toda SOFOM que transmita dinero cumple además la DCG de transmisores (1ª de su DCG)"}]},{"encabezado":true,"color":"morado","titulo":"Bursátil","subtitulo":"Casas de bolsa · Asesores · Fondos","filas":[{"k":"En H5","v":"Sólo su disposición de modelos novedosos (= Bancos)"}]},{"encabezado":true,"color":"turquesa","titulo":"Ahorro popular","subtitulo":"SOCAP · SOFIPO · Uniones","filas":[{"k":"En H5","v":"Sólo su disposición de modelos novedosos (= Bancos)"}]},{"encabezado":true,"color":"coral","titulo":"Cambios y envíos","subtitulo":"Casas de cambio · Centros cambiarios · Transmisores","filas":[{"k":"Ojo","v":"Casas de cambio: art. <b>95<\/b>. Centros y Transmisores: art. <b>95 Bis<\/b> y registro ante la CNBV"}]},{"encabezado":true,"color":"amarillo","titulo":"Fintech","subtitulo":"ITF (IFC e IFPE)","filas":[{"k":"Ojo","v":"Su DCG (art. 58 LRITF) también rige a la <b>sociedad autorizada para operar con modelos novedosos<\/b> (art. 85 LRITF)"}]}],"nota":"Las familias no son categorías de la norma. Las agrupaciones legales que sí explican mucho en este bloque son dos: <b>95 Bis LGOAAC<\/b> (SOFOM no reguladas, centros cambiarios y transmisores) y <b>Título IV LRITF<\/b> (autorizaciones temporales)."},{"tipo":"mapa","id":"mapa","nav":"Mapa 2.1.11–2.1.14","titulo":"Cuatro temas: 4 · 4 · 6 · 4","intro":"Cuatro ramas, una por tema del temario y en su orden, con ritmo <b>4 · 4 · 6 · 4 = 18 subtemas<\/b>: transmisores lleva seis porque es el sujeto con más figuras propias. En cada rama, lo mismo: <b>qué es según su ley<\/b> y <b>qué le exige su DCG<\/b>. Toca un subtema para ver su contenido y su fundamento.","centro":{"t":"2.1.11 · 2.1.12 · 2.1.13 · 2.1.14","s":"18 subtemas<br>4 · 4 · 6 · 4"},"ramas":[{"letra":"2.1.11","titulo":"Modelos novedosos","pregunta":"¿Qué es y qué le exigen?","ritmo":"¿Qué es?","corto":"2.1.11","color":"principal","items":[{"etiqueta":"LRITF art. 4 XVI–XVII","nombre":"Qué es un modelo novedoso","sub":"Definición de ley","verbo":"Defino","desc":"Servicio financiero con herramientas tecnológicas en modalidades distintas a las del mercado al otorgarse la autorización temporal. No es lo mismo que una ITF.","panel":"2.1.11 · Qué es un modelo novedoso","puntos":["Usa herramientas o medios tecnológicos con <b>modalidades distintas a las existentes en el mercado<\/b> al momento de la autorización temporal (art. 4 fr. XVII LRITF).","La misma definición se repite en la 2ª de las demás DCG (Bancos 2ª XXV).","ITF son <b>sólo<\/b> IFC e IFPE (art. 4 fr. XVI). El modelo novedoso se regula aparte, en el Título IV (autorizaciones temporales)."],"ir":"#t2-1-11","destacado":true},{"etiqueta":"LRITF arts. 80 y 86","nombre":"Dos autorizaciones temporales","sub":"Título IV, Caps. I y II","verbo":"Distingo","desc":"La sociedad no supervisada obtiene hasta 2 años (art. 80); la entidad ya regulada, ITF incluida, hasta 1 año prorrogable una sola vez (art. 86).","panel":"2.1.11 · Dos autorizaciones temporales","puntos":["<b>Art. 80:<\/b> personas morales mercantiles mexicanas <b>distintas<\/b> a ITF, entidades financieras y supervisados; plazo <b>no mayor a 2 años<\/b>; prórroga discrecional <b>hasta 1 año<\/b> si tramita la autorización definitiva.","<b>Art. 86:<\/b> entidades financieras, ITF y demás supervisadas, para operaciones de su objeto que requieren excepciones a disposiciones generales; <b>no mayor a 1 año, prorrogable por única vez por otro año<\/b>.","La otorgan las Autoridades Financieras según su competencia, de manera discrecional; si es una Comisión Supervisora, previo acuerdo de su <b>Junta de Gobierno<\/b>.","Reporte final a más tardar <b>30 días<\/b> después de terminar la vigencia (art. 89; días naturales por el art. 9)."],"ir":"#t2-1-11","destacado":false},{"etiqueta":"Bancos 69ª-2","nombre":"La obligación PLD en las DCG","sub":"Cap. XIV Bis","verbo":"Evalúo antes","desc":"Quien pide autorización para operar un modelo novedoso evalúa el riesgo antes del lanzamiento y entrega el resultado con su solicitud.","panel":"2.1.11 · La obligación PLD en las DCG","puntos":["I identificar y evaluar el riesgo <b>antes del lanzamiento<\/b>, conforme a la metodología del Cap. II Bis.","II presentar el resultado a la Comisión <b>junto con la solicitud<\/b>.","III ajustarse a las DCG en los términos y <b>excepciones<\/b> que señale la autorización, previa opinión de la Secretaría.","La misma disposición está en 11 DCG. SOFOM: la autorización la da «<b>la autoridad competente<\/b>». ITF: ver el subtema siguiente."],"ir":"#t2-1-11","destacado":false},{"etiqueta":"LRITF 85 · DCG ITF 104–106","nombre":"La sociedad autorizada en la DCG de ITF","sub":"Título Décimo Sexto","verbo":"Remito","desc":"A la sociedad autorizada del art. 80 se le aplica el régimen PLD de las ITF (art. 58) por el art. 85; por eso su DCG es la de ITF, aunque no sea ITF.","panel":"2.1.11 · La sociedad autorizada en la DCG de ITF","puntos":["Art. 85 LRITF: a la sociedad autorizada se le aplican, entre otros, el <b>art. 58<\/b> (PLD) y el 48 párr. 3 (conservación).","DCG ITF arts. 104–106: rigen a la <b>Sociedad Autorizada<\/b>, no a la ITF que opera un modelo novedoso.","Si su actividad está sujeta a un régimen PLD, debe <b>al menos<\/b> evaluar el riesgo antes del lanzamiento y presentar el resultado a la <b>Comisión Supervisora competente<\/b> con la solicitud (art. 105).","Como Cliente de otra entidad, la sociedad autorizada está en el <b>Anexo 1<\/b> (régimen simplificado) de las 12 DCG."],"ir":"#t2-1-11","destacado":false}]},{"letra":"2.1.12","titulo":"Centros cambiarios","pregunta":"¿Quién cambia billetes sin ser casa de cambio?","ritmo":"¿Quién cambia?","corto":"2.1.12","color":"oscuro","items":[{"etiqueta":"LGOAAC 81-A","nombre":"Qué es un centro cambiario","sub":"Actividad y límite","verbo":"Cambio","desc":"Sociedad anónima registrada ante la CNBV que compra y vende divisas en efectivo y cheques de viajero, hasta 10,000 USD por cliente al día y sin transferir fondos.","panel":"2.1.12 · Qué es un centro cambiario","puntos":["<b>Exclusivamente sociedades anónimas<\/b> registradas como centro cambiario ante la CNBV.","Compra y venta de billetes y piezas acuñadas, cheques de viajero y piezas metálicas; <b>compra<\/b> de documentos a la vista que sólo vende a bancos y casas de cambio (fr. I–IV).","Límite: hasta el equivalente a <b>10,000 USD por cliente en un mismo día<\/b>.","Contravalor <b>en el mismo acto<\/b>; nunca por transferencia ni abono a cuenta."],"ir":"#t2-1-12","destacado":true},{"etiqueta":"LGOAAC 95 Bis","nombre":"Su régimen PLD","sub":"Igual para SOFOM ENR y transmisores","verbo":"Cumplo","desc":"El 95 Bis obliga a prevenir y detectar, reportar a la SHCP por conducto de la CNBV y registrar cada operación; la CNBV supervisa.","panel":"2.1.12 · Su régimen PLD","puntos":["DCG de la <b>SHCP, previa opinión de la CNBV<\/b>, para SOFOM no reguladas, centros cambiarios y transmisores.","Fr. I medidas para prevenir y detectar · fr. II reportar a la SHCP por conducto de la CNBV · fr. III <b>registrar en su contabilidad<\/b> cada operación.","La <b>CNBV<\/b> supervisa e inspecciona el cumplimiento.","La CNBV puede ordenar a bancos, casas de bolsa y casas de cambio <b>suspender o cancelar<\/b> contratos con centros y transmisores."],"ir":"#t2-1-12","destacado":false},{"etiqueta":"DCG Centros 4ª; 9ª–10ª","nombre":"Identificar y vigilar","sub":"Escalones en USD","verbo":"Escalono","desc":"Expediente escalonado por monto (1,000 · 3,000 · 5,000 USD), sin identificación a distancia, con seguimiento y escalamiento interno propios.","panel":"2.1.12 · Identificar y vigilar","puntos":["Identificación por operación: <b>1,000 a menos de 3,000 USD<\/b> datos; <b>3,000 a menos de 5,000<\/b> más copia de la identificación; desde 5,000, expediente (4ª; este escalón, sin reactivo hasta cotejar el PDF).","<b>No prevé identificación no presencial<\/b>: sin 4ª Bis ni 4ª Ter, sin Anexo 2.","Agrupa por mes calendario las operaciones en efectivo o cheques de viajero desde <b>1,000 USD<\/b> (9ª); seguimiento más estricto desde <b>100,000 USD al mes<\/b> (10ª).","Escalamiento interno: PF <b>más de 5,000 USD<\/b>; PM o fideicomiso <b>más de 8,000 USD<\/b> (9ª)."],"ir":"#t2-1-12","destacado":false},{"etiqueta":"DCG Centros 22ª–23ª; 34ª; 56ª Bis","nombre":"Reportes y estructura","sub":"Igual que Bancos, salvo…","verbo":"Me aparto","desc":"Relevantes desde 5,000 USD en los últimos diez días hábiles; reporte de compra de dólares; OC común en grupo empresarial y clave a 20 días hábiles del registro.","panel":"2.1.12 · Reportes y estructura","puntos":["Relevantes: <b>5,000 USD<\/b> (no 7,500), en los <b>últimos<\/b> diez días hábiles de enero, abril, julio y octubre (2ª XX; 22ª).","Reporte de <b>compra<\/b> en efectivo de más de <b>1,000 USD<\/b> (23ª).","<b>Sin<\/b> restricción de USD, sin intercambio de información, sin reporte de transferencias internacionales.","OC común en <b>grupo empresarial<\/b> con centros, transmisores o SOFOM no reguladas (34ª); clave del sistema <b>dentro de 20 días hábiles<\/b> tras su registro (56ª Bis)."],"ir":"#t2-1-12","destacado":false}]},{"letra":"2.1.13","titulo":"Transmisores de dinero","pregunta":"¿Quién envía, quién paga y quién responde?","ritmo":"¿Quién envía?","corto":"2.1.13","color":"negro","items":[{"etiqueta":"LGOAAC 81-A Bis","nombre":"Qué es un transmisor","sub":"Siete párrafos de la ley","verbo":"Envío","desc":"S.A. o S. de R.L. con registro vigente ante la CNBV que recibe recursos en México para transferirlos al extranjero, a otro lugar del país o entregarlos ahí mismo.","panel":"2.1.13 · Qué es un transmisor","puntos":["«Exclusivamente» <b>S.A. o S. de R.L.<\/b> que, de manera habitual y por contraprestación, recibe recursos en territorio nacional «con el único objeto» de transferirlos al extranjero o a otro lugar del país, o de entregarlos en una sola exhibición (párr. 1).","Sólo con <b>registro vigente ante la CNBV<\/b>; son «transmisión de fondos» (párr. 2).","Ni el agente relacionado ni sus terceros pueden operar <b>sin la intervención<\/b> del transmisor (párr. 3).","El transmisor <b>responde<\/b> del 95 Bis por lo que pase por sus agentes y terceros (párr. 4).","Para emitir fondos de pago electrónico debe ser <b>IFPE<\/b> (párr. 5); <b>nunca<\/b> puede hacer operaciones de centro cambiario (último párr.)."],"ir":"#t2-1-13","destacado":true},{"etiqueta":"DCG TD 2ª I, XXVIII, XXXV; 49ª–50ª Bis","nombre":"Agentes, coadyuvantes y terceros","sub":"Quién le ayuda y qué le exige","verbo":"Respondo","desc":"Agente relacionado es persona física; coadyuvante, PM o PFAE; tercero, quien contratan ellos. El transmisor los revisa, firma con ellos un contrato mínimo y los avisa.","panel":"2.1.13 · Agentes, coadyuvantes y terceros","puntos":["<b>Agente Relacionado<\/b> = persona física (2ª I); <b>Persona Jurídica Coadyuvante<\/b> = PM o PFAE (2ª XXVIII); <b>Tercero<\/b> = quien contrata el agente, el coadyuvante o el otro TD o entidad financiera con contrato con el transmisor (2ª XXXV).","49ª: cerciorarse de que cumplan identificación, conocimiento y seguimiento, y revisar la <b>honorabilidad<\/b> de su personal antes de contratar y periódicamente, con enfoque de riesgo.","50ª III: contrato con 12 obligaciones (a–l): establecimiento físico, exhibir el registro, integrar expedientes, entregar información en <b>10 días naturales<\/b>, capacitación anual, visitas de la CNBV…","50ª Bis: <b>aviso a la Comisión<\/b> con todos ellos; mientras la CNBV no emita sus disposiciones, en los <b>primeros 15 días hábiles del año<\/b> (Transitoria Quinta 2019)."],"ir":"#t2-1-13-agentes","destacado":true},{"etiqueta":"DCG TD 4ª I–IV","nombre":"Identificación por escalones","sub":"Cualquier monto · 500 · 3,000 · 5,000","verbo":"Identifico","desc":"Datos de la transferencia sin importar el monto; desde 500 USD, datos del Usuario; desde 3,000, copia de la identificación; desde 5,000, expediente completo antes de operar.","panel":"2.1.13 · Identificación por escalones","puntos":["Fr. I, <b>con independencia del monto<\/b>: datos del remitente y número de referencia de la transferencia (y, al pagar, nombre del ordenante y del beneficiario).","Fr. II: operaciones individuales de <b>500 a menos de 3,000 USD<\/b>: datos del Usuario, sin copias.","Fr. III: de <b>3,000 a menos de 5,000 USD<\/b>: además, copia de la identificación oficial.","Fr. IV: <b>5,000 USD o más<\/b>: expediente completo, «previamente» a la operación.","El expediente sirve para operaciones posteriores si hay un mecanismo para verificar que es el mismo Usuario."],"ir":"#t2-1-13-id","destacado":false},{"etiqueta":"DCG TD 4ª I A y B","nombre":"Lo que viaja con la transferencia","sub":"Envío y pago","verbo":"Acompaño","desc":"Al enviar recaba los datos del remitente y, si es internacional o en moneda extranjera, los manda con la transferencia; al pagar, recaba los del ordenante que vengan en ella.","panel":"2.1.13 · Lo que viaja con la transferencia","puntos":["<b>Envía<\/b> (inciso A): nombre y domicilio del remitente, número de referencia de la transferencia y cuenta o referencia de origen.","Si es nacional en moneda extranjera o internacional: <b>acompañar<\/b> nombre, domicilio y referencia; recabar del beneficiario lo que dé el remitente.","<b>Paga<\/b> (inciso B): nombre del ordenante «incluido en la transferencia» y nombre del beneficiario, de su identificación.","Si llega <b>sin la información<\/b>: criterios de riesgo en el Manual para «ejecutar, rechazar o suspender»; es circunstancia de inusualidad (27ª XI).","Cargar los datos en sus sistemas <b>a más tardar en 2 días hábiles<\/b>."],"ir":"#t2-1-13-transf","destacado":false},{"etiqueta":"DCG TD 4ª Bis; Anexo 2","nombre":"Identificación a distancia","sub":"Sólo mexicanos","verbo":"Valido","desc":"Con dispositivo y geolocalización, sólo para PF, PFAE y PM mexicanas; dos mecanismos del Anexo 2 con topes de 5,000 y 7,000 USD al mes.","panel":"2.1.13 · Identificación a distancia","puntos":["4ª Bis: PF, PFAE o PM, «todos de nacionalidad mexicana»; sin <b>Geolocalización<\/b> no se opera.","Identificaciones válidas: credencial del INE, pasaporte o matrícula consular.","Anexo 2: grabación con prueba de vida (art. 4) hasta <b>5,000 USD al mes<\/b>; verificación biométrica con el INE, la SRE u otra autoridad mexicana (art. 5) hasta <b>7,000 USD al mes<\/b>.","Con el art. 5 y tope de 5,000 USD no necesita autorización: basta <b>aviso previo<\/b> a la CNBV (art. 7 I)."],"ir":"#t2-1-13-dist","destacado":false},{"etiqueta":"DCG TD 9ª–11ª; 23ª–25ª; 27ª","nombre":"Vigilar y reportar","sub":"Igual que Bancos, salvo…","verbo":"Reporto","desc":"Agrupa efectivo desde 500 USD, escala aprobaciones arriba de 10,000 o 50,000 USD, reporta relevantes desde 5,000 USD y cada transferencia internacional de 1,000 o más.","panel":"2.1.13 · Vigilar y reportar","puntos":["9ª: seguimiento de efectivo en moneda extranjera <b>desde 500 USD<\/b> y en pesos de más de 300,000 (PF) o 500,000 (PM), agrupado por mes calendario.","11ª: seguimiento más estricto desde <b>1 millón de pesos o 100,000 USD o más<\/b> en efectivo, acumulados en un mes calendario.","Relevantes desde <b>5,000 USD<\/b>, en los <b>diez últimos<\/b> días hábiles de enero, abril, julio y octubre (23ª).","Transferencias internacionales de <b>1,000 USD o más<\/b>, mensual, 15 días hábiles (24ª); en remesas, con datos del beneficiario (25ª).","Fraccionamiento: operaciones con moneda extranjera, cheques de viajero o monedas acuñadas de 1,000 USD o más que en un mes sumen al menos <b>5,000 USD<\/b> (27ª IV)."],"ir":"#t2-1-13-vigila","destacado":false}]},{"letra":"2.1.14","titulo":"Instituciones de tecnología financiera","pregunta":"¿Quién es ITF y qué la hace distinta?","ritmo":"¿Quién es ITF?","corto":"2.1.14","color":"amarillo","items":[{"etiqueta":"LRITF arts. 4 XVI; 11; 35","nombre":"Qué es una ITF","sub":"IFC e IFPE","verbo":"Autorizo","desc":"Sólo dos: financiamiento colectivo (IFC) y fondos de pago electrónico (IFPE). Las autoriza la CNBV, previo acuerdo del Comité Interinstitucional.","panel":"2.1.14 · Qué es una ITF","puntos":["ITF = <b>IFC e IFPE<\/b> (art. 4 fr. XVI).","Autorización de la <b>CNBV, previo acuerdo del Comité Interinstitucional<\/b> (art. 11).","Comité de <b>6 miembros<\/b>: 2 SHCP, 2 Banxico y 2 CNBV; lo preside la CNBV (art. 35).","IFPE: entre sus actividades adicionales, el servicio de <b>transmisión de dinero<\/b> del 81-A Bis LGOAAC (art. 25 fr. II)."],"ir":"#t2-1-14","destacado":true},{"etiqueta":"LRITF art. 58","nombre":"La base PLD: el art. 58","sub":"De donde salen sus DCG","verbo":"Fundamento","desc":"Las DCG de las ITF las emite la SHCP, previa opinión de la CNBV; reportan también operaciones entre sus Clientes, y su OC y su auditor deben estar certificados.","panel":"2.1.14 · La base PLD: el art. 58","puntos":["DCG de la <b>SHCP, previa opinión de la CNBV<\/b>.","Reportes de operaciones con Clientes <b>«y las Operaciones entre estos»<\/b>.","Lineamientos mínimos, entre ellos <b>CCC y OC<\/b> y revisión anual por auditoría interna o <b>tercero independiente<\/b>; conservación de al menos 10 años.","El <b>OC<\/b> y el <b>auditor o tercero independiente<\/b> deben obtener la certificación del art. 4 fr. X LCNBV (párr. 5)."],"ir":"#t2-1-14","destacado":false},{"etiqueta":"DCG ITF arts. 2; 12; 43; 99–103","nombre":"IFC frente a IFPE","sub":"Artículos, no disposiciones","verbo":"Separo","desc":"Su DCG va por artículos (1 a 106): sólo Clientes, expediente digital, niveles 1 y 2, y vigilancia más estricta desde 12,500 UDIS en IFC y 7,500 en IFPE.","panel":"2.1.14 · IFC frente a IFPE","puntos":["Sólo <b>Clientes<\/b> (art. 2 IV); «Usuario» aparece sólo en la transmisión de dinero de las IFPE (Título Décimo Quinto).","Cuentas por niveles: <b>nivel 1 y nivel 2<\/b>, más transferencias internacionales (art. 12).","Seguimiento más estricto: <b>IFC ≥ 12,500 UDIS al mes<\/b>; <b>IFPE ≥ 7,500 UDIS al mes<\/b> (art. 43).","IFPE que transmite dinero: escalones de <b>1,000 · 3,000 · 5,000 USD<\/b> (art. 101)."],"ir":"#t2-1-14","destacado":false},{"etiqueta":"DCG ITF arts. 21; 56; 66–74","nombre":"Activos virtuales y reportes","sub":"Igual que Bancos, salvo…","verbo":"Rastreo","desc":"Relevantes desde 5,000 USD; efectivo en cualquier moneda extranjera; inusuales desde la detección; activos virtuales con umbral en UDIS y trazabilidad.","panel":"2.1.14 · Activos virtuales y reportes","puntos":["Relevantes desde <b>5,000 USD<\/b>, sólo billetes y monedas, en los <b>primeros<\/b> diez días hábiles, como Bancos (art. 2 XXIV; 66).","Efectivo en <b>cualquier moneda extranjera<\/b> desde 500 USD (art. 67).","Inusuales: 60 días naturales <b>desde que detecte<\/b> la operación (art. 69).","Activos virtuales: reporte con umbral en <b>UDIS<\/b> (art. 74); datos por operación (art. 21); trazabilidad de origen y destino en el sistema (art. 56)."],"ir":"#t2-1-14","destacado":false}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por subtema","html":"<b>2.1.11<\/b> · Defino, Distingo, Evalúo antes, Remito · <b>2.1.12<\/b> · Cambio, Cumplo, Escalono, Me aparto · <b>2.1.13<\/b> · Envío, Respondo, Identifico, Acompaño, Valido, Reporto · <b>2.1.14<\/b> · Autorizo, Fundamento, Separo, Rastreo."}},{"tipo":"tarjetas","id":"t2-1-11","nav":"2.1.11 Modelos novedosos","titulo":"2.1.11 · Obligaciones de los modelos novedosos","intro":"Primero los conceptos, con su texto; luego dos tablas: las dos autorizaciones temporales de la LRITF y lo que dice cada DCG.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Qué es un modelo novedoso","subtitulo":"LRITF art. 4 fr. XVI y XVII","filas":[{"k":"Definición (fr. XVII)","v":"El que, para prestar servicios financieros, utilice herramientas o medios tecnológicos <b>con modalidades distintas a las existentes en el mercado al momento en que se otorgue la autorización temporal<\/b>. La misma definición está en la 2ª de las demás DCG (Bancos 2ª XXV)."},{"k":"ITF (fr. XVI)","v":"Son <b>sólo<\/b> las instituciones de financiamiento colectivo (IFC) y las de fondos de pago electrónico (IFPE), con autorización definitiva de la CNBV. El modelo novedoso se regula aparte, en el Título IV (autorizaciones temporales)."}]},{"encabezado":true,"color":"negro","titulo":"La obligación PLD en las DCG","subtitulo":"Bancos 69ª-2 (Cap. XIV Bis) · el eje","filas":[{"k":"Quién","v":"La Entidad que pretenda obtener <b>autorización de la Comisión<\/b> para realizar mediante un modelo novedoso alguna Operación"},{"k":"I","v":"Identificar y evaluar el riesgo <b>antes del lanzamiento<\/b>, conforme a la metodología del Cap. II Bis"},{"k":"II","v":"Presentar el resultado a la Comisión <b>junto con la solicitud<\/b>"},{"k":"III","v":"Ajustarse a las DCG en los casos, formas, términos, plazos, condiciones y <b>excepciones<\/b> que señale la autorización, la Comisión <b>previa opinión de la Secretaría<\/b>"}]}],"nota":"<b>Sin reactivo, a decisión de Maribel:<\/b> las DCG dicen que la autorización la da «la Comisión»; el art. 86 LRITF dice que, si la actividad está regulada por disposiciones de la SHCP o de Banxico, la otorgan esas autoridades. Se enseña lo que dicen las DCG."},{"tipo":"tablamin","id":"t2-1-11-temporal","titulo":"Las dos autorizaciones temporales de la LRITF","intro":"¿Quién la pide, por cuánto tiempo y qué régimen PLD le toca? Toca una casilla para ver el texto.","columnas":[{"k":"a80","t":"Art. 80 · Sociedad autorizada","color":"principal"},{"k":"a86","t":"Art. 86 · Entidad ya regulada","color":"oscuro"}],"renglones":[{"k":"quien","t":"¿Quién la pide?","celdas":{"a80":"Sociedad no supervisada","a86":"Entidad financiera, ITF o supervisada"},"seguro":true,"det":{"a80":"Personas morales constituidas conforme a la legislación mercantil mexicana, distintas a las ITF, a las Entidades Financieras y a otros sujetos supervisados por una Comisión Supervisora o Banxico (art. 80, 1er párr.).","a86":"Entidades Financieras, ITF o demás personas supervisadas, para operaci MN; <b>nunca transferencia<\/b>"},{"k":"PLD","v":"<b>95 Bis<\/b>: DCG de la SHCP previa opinión de la CNBV; supervisa la <b>CNBV<\/b>"},{"k":"Registro","v":"Dictamen técnico previo y renovación cada 3 años <i>(arts. 81-B y 86 Bis, fuera de la acotación del temario: sólo se mencionan)<\/i>"}]}],"nota":"<b>Con aviso, sin reactivo:<\/b> el escalón «desde 5,000 USD = expediente completo» de la 4ª fr. III depende de un pasaje dañado del texto de estudio."},{"tipo":"tablamin","id":"t2-1-12-regimen","titulo":"¿De qué artículo sale cada DCG y con quién opera?","intro":"Centros y transmisores comparten el 95 Bis; la casa de cambio va por el 95.","columnas":[{"k":"BAN","t":"Bancos","sujetos":["BAN"],"color":"principal"},{"k":"CC","t":"Casas de cambio","sujetos":["CC"],"color":"coral"},{"k":"bis","t":"95 Bis","sujetos":["CCA","TD"],"color":"oscuro"},{"k":"ITF","t":"ITF","sujetos":["ITF"],"color":"amarillo"},{"k":"resto","t":"Las demás","sujetos":["SOFOM","CB","ASE","FON","SOCAP","SOFIPO","UC"],"color":"morado"}],"renglones":[{"k":"base","t":"Fundamento","celdas":{"BAN":"Art. 115 LIC","CC":"Art. 95 LGOAAC","bis":"Art. 95 Bis LGOAAC","ITF":"Art. 58 LRITF","resto":"Su ley (SOFOM E.N.R.: 95 Bis)"},"seguro":true,"det":{"bis":"El 95 Bis es común a SOFOM no reguladas, centros cambiarios y transmisores: DCG de la SHCP, previa opinión de la CNBV; supervisa la CNBV.","resto":"SOFOM: 115 LIC, 71-72 LRASCAP, 124 LACP y 129 LUC por el 87-D (reguladas) y 95 Bis (no reguladas). Casas de bolsa 212 LMV · Asesores 226 Bis LMV · Fondos 91 LFI · SOCAP 71-72 LRASCAP · SOFIPO 124 LACP · Uniones 129 LUC."},"ref":{"BAN":"1ª","CC":"1a","bis":"Centros 1ª · TD 1ª","ITF":"título y art. 1","resto":"1ª de cada DCG"}},{"k":"contra","t":"Con quién opera","celdas":{"BAN":"Clientes y Usuarios","CC":"Sólo Usuarios","bis":"Sólo Usuarios","ITF":"Sólo Clientes","resto":"Varía por sujeto"},"seguro":true,"det":{"resto":"SOFOM y Casas de bolsa: Clientes y Usuarios. Asesores, Fondos y Uniones: sólo Clientes. SOCAP y SOFIPO: Clientes y Usuarios.","ITF":"«Usuario» sólo en la transmisión de dinero de las IFPE (Título Décimo Quinto)."},"ref":{"BAN":"2ª IV y XXXVIII","resto":"matriz v3, 2.1.1.3"}}],"igual":["Casas de cambio, centros, transmisores e ITF: DCG de la SHCP, previa opinión de la CNBV"],"relaciona":[{"a":"Art. 115 LIC","b":"Bancos"},{"a":"Art. 95 LGOAAC","b":"Casas de cambio"},{"a":"Art. 95 Bis LGOAAC","b":"Centros y transmisores"},{"a":"Art. 58 LRITF","b":"ITF"}],"trampas":["Centro cambiario ≠ casa de cambio chica: 95 Bis y registro ante la CNBV frente al art. 95"]},{"tipo":"tarjetas","id":"t2-1-13","nav":"2.1.13 Transmisores","titulo":"2.1.13 · Transmisores de dinero: quién es quién","intro":"El transmisor es el sujeto con más personajes del módulo. Primero la ley (81-A Bis); luego, todos los que intervienen en un envío según su DCG. <b>Gancho:<\/b> el transmisor <b>envía, paga y responde<\/b> por quien le ayuda.","tarjetas":[{"encabezado":true,"color":"negro","titulo":"Lo que dice la ley","subtitulo":"LGOAAC 81-A Bis, párrafo por párrafo","filas":[{"k":"1 · Quién","v":"«Exclusivamente» <b>S.A. o S. de R.L.<\/b> que, habitualmente y por contraprestación, recibe recursos en México «con el único objeto» de transferirlos al extranjero, a otro lugar del país o entregarlos en una sola exhibición; también dependencias y entidades de la APF"},{"k":"2 · Registro","v":"«únicamente» con <b>registro vigente ante la CNBV<\/b>; sus operaciones son «transmisión de fondos»"},{"k":"3 · Agente","v":"Agente relacionado = <b>persona física<\/b>; ni él ni sus terceros operan «sin la intervención» del transmisor"},{"k":"4 · Responde","v":"El transmisor es <b>responsable<\/b> del 95 Bis por las operaciones de sus agentes y de los terceros que contrate"},{"k":"5 · IFPE","v":"Para emitir fondos de pago electrónico debe constituirse como <b>IFPE<\/b>"},{"k":"6 · No aplica","v":"A las entidades financieras que por sus leyes puedan hacer esas operaciones"},{"k":"7 · Prohibido","v":"«En ningún caso» puede hacer operaciones de <b>centro cambiario<\/b> (81-A)"}]},{"encabezado":true,"color":"coral","titulo":"Los que mandan o reciben","subtitulo":"DCG 2ª III, XXXI, XXXVIII y XXXIX","filas":[{"k":"Usuario Remitente","v":"Contrata <b>en territorio nacional<\/b> al transmisor para que entregue recursos a quien designe"},{"k":"Usuario Beneficiario","v":"Recibe <b>en territorio nacional<\/b> los recursos que le manda un remitente de aquí o del extranjero"},{"k":"Remitente en el Extranjero","v":"Contrata en el extranjero a un Transmisor de Dinero Extranjero o a un transmisor para que paguen en México"},{"k":"Beneficiario en el Extranjero","v":"Recibe en el extranjero lo que manda un Usuario Remitente"},{"k":"Transmisor de Dinero Extranjero","v":"Está fuera del país y tiene contrato con uno o varios transmisores para pagar o recibir envíos"},{"k":"Ojo","v":"Su DCG sólo tiene <b>Usuarios<\/b>, no Clientes; también es Usuario quien compra los productos del transmisor"}]},{"encabezado":true,"color":"principal","titulo":"Los que le ayudan","subtitulo":"DCG 2ª I, XXVIII y XXXV","filas":[{"k":"Agente Relacionado","v":"<b>Persona física<\/b> que, por contrato, recibe del transmisor recursos para entregarlos al beneficiario o le entrega lo que recibe del remitente (la ley sólo menciona la entrega al beneficiario)"},{"k":"Persona Jurídica Coadyuvante","v":"<b>Persona moral o PF con actividad empresarial<\/b> que pacta lo mismo; figura creada por la DCG en 2019"},{"k":"No son coadyuvantes","v":"Otros transmisores ni las entidades financieras que pueden hacer esas operaciones y tienen contrato con un transmisor"},{"k":"Tercero","v":"PF o PM contratada por un agente o coadyuvante, o por otro transmisor o entidad financiera con contrato con el transmisor"},{"k":"Vías de entrega","v":"Directo, o a través de agente, coadyuvante, entidad financiera u otro transmisor (2ª XXXVII)"}]}],"nota":"<b>Con aviso, sin reactivo:<\/b> el art. 81-B (fuera de la acotación del temario) habla de «sociedades anónimas» y el 81-A Bis admite también la S. de R.L.; se enseña el 81-A Bis y la 2ª XXXVII de la DCG. La 50ª II menciona a los agentes como si tuvieran «sus» propias DCG; parece errata, no se pregunta."},{"tipo":"tablamin","id":"t2-1-13-figuras","titulo":"Agente, coadyuvante u otro transmisor: qué cambia","intro":"Los tres hacen llegar o reciben recursos por cuenta del transmisor; cambian quién puede ser y qué le exige el contrato.","columnas":[{"k":"ar","t":"Agente Relacionado","color":"principal"},{"k":"pjc","t":"Persona Jurídica Coadyuvante","color":"coral"},{"k":"otro","t":"Otro TD o entidad financiera","color":"oscuro"}],"renglones":[{"k":"quien","t":"¿Quién puede ser?","celdas":{"ar":"Sólo persona física","pjc":"PM o PF con actividad empresarial","otro":"Transmisor o entidad financiera"},"seguro":true,"det":{"ar":"2ª I; la ley (81-A Bis, 3er párr.) también dice persona física.","pjc":"2ª XXVIII. No son coadyuvantes los transmisores ni las entidades financieras que pueden hacer esas operaciones.","otro":"Con relación contractual con el transmisor (2ª XXXVII, 2º párr.)."},"ref":{"ar":"2ª I","pjc":"2ª XXVIII","otro":"2ª XXXVII"}},{"k":"ley","t":"¿Lo nombra la ley?","celdas":{"ar":"Sí: 81-A Bis","pjc":"No: figura de la DCG","otro":"Sólo para excluir a las EF (6º párr.)"},"seguro":true,"det":{"pjc":"La DCG la creó en 2019 (considerando, Recomendación 17 del GAFI).","otro":"81-A Bis, 6º párr.: no aplica a entidades financieras que por sus leyes puedan hacer esas operaciones."},"ref":{"ar":"LGOAAC 81-A Bis, 3er párr.","pjc":"DCG TD 2ª XXVIII","otro":"LGOAAC 81-A Bis, 6º párr."}},{"k":"contrato","t":"Contrato mínimo","celdas":{"ar":"50ª III, incisos a) a l)","pjc":"50ª III, incisos a) a l)","otro":"50ª III Bis, incisos a) a d)"},"seguro":true,"ref":{"ar":"50ª III","pjc":"50ª III","otro":"50ª III Bis"}},{"k":"local","t":"Establecimiento y registro a la vista","celdas":{"ar":"Sí","pjc":"Sí","otro":"No se le exige"},"seguro":true,"det":{"ar":"50ª III b) a d): estab  · firmo con ellos · los aviso<\/b> (49ª · 50ª I–II · 50ª III · 50ª Bis). <i>Orden didáctico de 360Educa, no de la norma.<\/i>","tarjetas":[{"encabezado":true,"color":"principal","titulo":"1 · Los reviso","subtitulo":"49ª","filas":[{"k":"Qué","v":"Medidas para «cerciorarse» de que agentes y coadyuvantes cumplan identificación, conocimiento y seguimiento"},{"k":"Honorabilidad","v":"De sus directivos, funcionarios, empleados, apoderados y factores: no sentenciados por delitos patrimoniales ni inhabilitados"},{"k":"Cuándo","v":"<b>Antes<\/b> de iniciar la relación y <b>periódicamente<\/b>, con un esquema basado en riesgos"}]},{"encabezado":true,"color":"oscuro","titulo":"2 · Respondo por ellos","subtitulo":"50ª I–II; 81-A Bis párr. 4","filas":[{"k":"Responsable","v":"El transmisor, por lo que pase por agentes, coadyuvantes, otros transmisores y entidades financieras <b>y por los Terceros<\/b> que estos contraten"},{"k":"Vía otro TD o entidad financiera","v":"En expedientes, seguimiento y reportes de inusuales, sólo debe <b>capturar y conservar<\/b> los datos de remitentes y beneficiarios, y dar seguimiento y reportar las inusuales que los otros <b>no puedan detectar<\/b> (50ª II); lo demás sigue a su cargo"},{"k":"Medio de pago","v":"El Manual dice por qué medio les hace llegar los recursos y cuál usan ellos con sus Terceros (50ª IV)"}]},{"barra":true,"color":"coral","titulo":"3 · Firmo con ellos: el contrato con agente o coadyuvante","ref":"50ª III, incisos a) a l)","lista":["a) cumplir la 50ª (salvo el caso de la fr. II) · b) <b>establecimiento físico<\/b> para operar","c) exhibir ahí copia del <b>registro<\/b> del transmisor · d) fecha y número de registro en su <b>publicidad<\/b>","e) dar su RFC con homoclave · f) <b>integrar el expediente<\/b> de los Usuarios con las políticas del transmisor","g) entregar registros, datos, documentos y posibles reportes en <b>10 días naturales<\/b> desde la operación (lo de 24 horas, a tiempo para que el transmisor cumpla); el expediente <b>puede conservarlo<\/b> el agente o coadyuvante, siempre a disposición","h) <b>programa anual de capacitación<\/b> · i) constancias y examen · j) constancia de que su personal tiene conocimientos de PLD/FT antes o al ingresar","k) si contratan a un Tercero, contrato con estos mismos requisitos · l) permitir <b>visitas de la CNBV<\/b>","Incumplir es <b>causal de rescisión<\/b>, además de las sanciones"]},{"encabezado":true,"color":"negro","titulo":"4 · Los aviso","subtitulo":"50ª Bis; Transitoria Quinta 2019","filas":[{"k":"Qué","v":"Aviso a la <b>Comisión<\/b> con la información de agentes, coadyuvantes, otros transmisores y entidades financieras con contrato, y de los Terceros con que operen"},{"k":"Cuándo","v":"En los plazos que fije la CNBV; mientras tanto, <b>dentro de los primeros 15 días hábiles del año<\/b>"},{"k":"Ojo","v":"No hay un reporte de agentes ante la UIF: el aviso va a la CNBV"}]},{"encabezado":true,"color":"coral","titulo":"Dónde más aparecen","subtitulo":"En el resto de la DCG","filas":[{"k":"Comprobante de domicilio","v":"Si el agente o coadyuvante entrega <b>5,000 USD o más<\/b>, se comprueba el domicilio con documento (cuando no coincide con el de la identificación) (4ª IV A b) iii)"},{"k":"Registros","v":"La sucursal del agente o coadyuvante va en el registro de seguimiento estricto (11ª III) y de prepago (10ª)"},{"k":"Supervisión","v":"La CNBV vigila a transmisores, agentes, coadyuvantes y entidades con contrato (56ª)"}]}],"nota":"Contraste con Bancos: el banco opera con <b>comisionistas<\/b> (63ª); la DCG de transmisores no tiene comisionistas. Lo que más se parece es la responsabilidad: en los dos casos la entidad responde como si operara directamente."},{"tipo":"escala","id":"t2-1-13-id","titulo":"2.1.13 · Identificación por escalones (4ª)","etiqueta":"DCG de Transmisores, 4ª fracciones I a IV","subtitulo":"Cada escalón suma al anterior; II y III son por operación individual","niveles":[{"t":"Cualquier monto · fr. I","d":"Datos USD","Escalamiento interno en centros cambiarios: PF más de 5,000; PM o fideicomiso más de 8,000","Centros 9ª"],["10,000 · 50,000","USD","Escalamiento interno en transmisores: PF más de 10,000; PM o fideicomiso más de 50,000","TD 9ª"],["10","días nat.","Plazo máximo para que el agente o coadyuvante entregue al transmisor los registros y datos de cada operación","TD 50ª III g)"],["5,000 · 7,000","USD al mes","Topes de la identificación a distancia del transmisor: grabación con prueba de vida · biometría con autoridad","TD Anexo 2 art. 2"],["20","días háb.","Para solicitar la clave del sistema tras su registro (centros y transmisores); Bancos e ITF deben tenerla al iniciar operaciones","Centros 56ª Bis; TD 59ª-1; Bancos 69ª-1; ITF art. 98"],["12,500 · 7,500","UDIS al mes","Seguimiento más estricto: IFC en efectivo o activos virtuales · IFPE","DCG ITF art. 43"],["6","miembros","Comité Interinstitucional: 2 SHCP, 2 Banxico y 2 CNBV","LRITF art. 35"]]},{"tipo":"simulador","id":"examen","nav":"Practicar ▸"}],"temas":{"2.1.11":"2.1.11 Obligaciones de los modelos novedosos","2.1.12":"2.1.12 Centros cambiarios","2.1.13":"2.1.13 Transmisores de dinero","2.1.14":"2.1.14 Instituciones de tecnología financiera"},"modos":[{"k":"mn","l":"2.1.11 Modelos novedosos","tema":"2.1.11"},{"k":"cc","l":"2.1.12 Centros cambiarios","tema":"2.1.12"},{"k":"td","l":"2.1.13 Transmisores","tema":"2.1.13"},{"k":"itf","l":"2.1.14 ITF","tema":"2.1.14"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Cifras y trampas","tipos":["cifra","trampa"]}],"banco":[{"id":"E001","tema":"2.1.11","tipo":"caso","q":"Una sociedad mercantil que no es entidad financiera ni está supervisada obtiene autorización temporal para ofrecer, mediante un modelo novedoso, un servicio que requiere autorización conforme a una ley financiera. ¿Qué vigencia puede tener esa autorización según la LRITF?","a":"No mayor a dos años; la autoridad puede prorrogarla hasta un año más si tramita la autorización definitiva","o":["No mayor a dos años; la autoridad puede prorrogarla hasta un año más si tramita la autorización definitiva","No mayor a dos años, prorrogable por única vez por otros dos años si el modelo sigue siendo novedoso en el mercado","No mayor a un año, prorrogable por única vez por otro año más","No mayor a tres años, sin prórroga; al vencer debe obtener la autorización definitiva o iniciar su procedimiento de salida"],"x":"El art. 80 LRITF regula la autorización temporal de personas morales distintas a las ITF, Entidades Financieras y supervisados: duración acorde a los servicios y no mayor a dos años; si la sociedad realiza las acciones para obtener la autorización, registro o concesión definitivos, la autoridad, a su discreción, puede prorrogarla hasta por un año más. El año «prorrogable por única vez» es el régimen del art. 86, propio de entidades ya reguladas.","ref":"LRITF art. 80, párrs. 2 y 5","par":"E002"},{"id":"E002","tema":"2.1.11","tipo":"caso","q":"Una SOFIPO ya supervisada obtiene autorización temporal para realizar, mediante un modelo novedoso, operaciones de su objeto social que requieren excepciones a las disposiciones generales aplicables. ¿Qué vigencia puede tener esa autorización según la LRITF?","a":"No mayor a un año, prorrogable por única vez por otro año más","o":["No mayor a tres años, sin prórroga; al vencer debe obtener la autorización definitiva o iniciar su procedimiento de salida","No mayor a dos años, prorrogable por única vez por otros dos años si el modelo sigue siendo novedoso en el mercado","No mayor a un año, prorrogable por única vez por otro año más","No mayor a dos años; la autoridad puede prorrogarla hasta un año más si tramita la autorización definitiva"],"x":"El art. 86 LRITF (Modelos Novedosos en Entidades Reguladas) dispone que las autorizaciones temporales a Entidades Financieras, ITF y demás supervisados no pueden tener vigencia mayor a un año, prorrogable por única vez por otro año. Los dos años con prórroga de hasta uno más son de la sociedad no supervisada del art. 80, cuya prórroga depende de que tramite la autorización definitiva.","ref":"LRITF art. 86, último párrafo","par":"E001"},{"id":"E003","tema":"2.1.11","tipo":"caso","q":"Una sociedad no supervisada prepara su solicitud de autorización temporal para operar un modelo novedoso conforme al art. 80 LRITF. ¿Quién debe aprobar la presentación de esa solicitud?","a":"El órgano de administración de la sociedad que pretende ser autorizada","o":["La Junta de Gobierno de la Comisión Supervisora, antes de que la sociedad la presente","El órgano de administración de la sociedad que pretende ser autorizada","El Comité Interinstitucional, integrado por representantes de la SHCP, el Banco de México y la CNBV","La asamblea general extraordinaria de accionistas, con el acta protocolizada ante fedatario público"],"x":"El art. 83, penúltimo párrafo, LRITF exige que la presentación de la solicitud la apruebe el órgano de administración de la sociedad. La Junta de Gobierno interviene del lado de la autoridad, al otorgar la autorización (art. 80, párr. 3); el Comité Interinstitucional acuerda las autorizaciones de ITF (arts. 11 y 35).","ref":"LRITF art. 83, penúltimo párrafo; art. 80, párr. 3"},{"id":"E004","tema":"2.1.11","tipo":"caso","q":"Una casa de bolsa quiere solicitar autorización temporal para operar con un modelo novedoso conforme al Capítulo II del Título IV de la LRITF (art. 86). ¿Quién debe aprobar la presentación de la solicitud?","a":"Su consejo de administración","o":["Su consejo de administración","Su Comité de Comunicación y Control, por tratarse de un producto nuevo con riesgo de PLD/FT","La Junta de Gobierno de la CNBV, a propuesta del Oficial de Cumplimiento de la entidad","Su director general, con informe posterior al consejo de administración en la siguiente sesión"],"x":"El art. 87, último párrafo, LRITF exige que la presentación de la solicitud la apruebe el consejo de administración de la Entidad Financiera o persona sujeta a supervisión. El Comité de Comunicación y Control no aprueba solicitudes de autorización; la Junta de Gobierno de la Comisión Supervisora actúa al otorgarla (art. 86, párr. 2).","ref":"LRITF art. 87, último párrafo; art. 86, párr. 2"},{"id":"E005","tema":"2.1.11","tipo":"caso","q":"Un banco quiere realizar una de sus Operaciones mediante un modelo novedoso. Según el texto de la disposición de modelos novedosos de su DCG, ¿cómo designa a quien otorga la autorización y a quién se presenta el resultado de la evaluación de riesgos?","a":"Dice que la otorga «la Comisión»; el resultado se presenta a la Comisión junto con la solicitud","o":["Dice que la otorga «el Comité Interinstitucional»; el resultado se entrega a la Comisión una vez lanzado el producto","Dice que la otorga «la autoridad competente»; el resultado se presenta a la Comisión junto con la solicitud","Dice que la otorga «la Secretaría»; el resultado se presenta a la UIF dentro de los 30 días siguientes al lanzamiento","Dice que la otorga «la Comisión»; el resultado se presenta a la Comisión junto con la solicitud"],"x":"La 69ª-2 de Bancos se dirige a la Entidad que pretenda obtener autorización de la Comisión: (I) evalúa el riesgo antes del lanzamiento conforme al Capítulo II Bis, (II) presenta el resultado a la Comisión junto con su solicitud y (III) se ajusta a las excepciones que fije la autorización, previa opinión de la Secretaría. La misma disposición se repite en las demás DCG; la de SOFOM es la que habla de «la autoridad competente».","ref":"Bancos 69ª-2","par":"E006"},{"id":"E006","tema":"2.1.11","tipo":"caso","q":"Una SOFOM quiere realizar una de sus Operaciones mediante un modelo novedoso. Según el texto de la disposición de modelos novedosos de su DCG, ¿cómo designa a quien otorga la autorización y a quién se presenta el resultado de la evaluación de riesgos?","a":"Dice que la otorga «la autoridad competente»; el resultado se presenta a la Comisión junto con la solicitud","o":["Dice que la otorga «la autoridad competente»; el resultado se presenta a la Comisión junto con la solicitud","Dice que la otorga «el Comité Interinstitucional»; el resultado se entrega a la Comisión una vez lanzado el producto","Dice que la otorga «la Secretaría»; el resultado se presenta a la UIF dentro de los 30 días siguientes al lanzamiento","Dice que la otorga «la Comisión»; el resultado se presenta a la Comisión junto con la solicitud"],"x":"La 60ª-1 de SOFOM es igual que Bancos, salvo que la autorización, y las excepciones, las da «la autoridad competente», no «la Comisión»; el resultado de la evaluación previa al lanzamiento sí se presenta a la Comisión con la solicitud. El distractor tentador copia la redacción de Bancos (69ª-2). Es una diferencia de redacción: quién otorga en sustancia (art. 86, párr. 2, LRITF) es punto de criterio reservado, sin reactivo.","ref":"SOFOM 60ª-1; Bancos 69ª-2","par":"E005"},{"id":"E007","tema":"2.1.11","tipo":"caso","q":"Un banco obtuvo autorización para realizar una Operación mediante un modelo novedoso. Según su DCG, ¿conforme a qué excepciones debe ajustarse a las Disposiciones de PLD/FT?","a":"Las que señale la Comisión en la autorización, previa opinión de la Secretaría","o":["Las que acuerde el Comité Interinstitucional para todo el sector, previa opinión de la Comisión y de la UIF","Las que señale la Comisión en la autorización, previa opinión de la Secretaría","Las que publique la Secretaría en disposiciones de carácter general, previa opinión del Banco de México y de la CNBV","Las que señale la Comisión Supervisora o el Banco de México en la autorización, previa opinión de la Secretaría"],"x":"La fr. III de la 69ª-2 de Bancos obliga a ajustarse a las Disposiciones conforme a los casos, términos, plazos, condiciones y excepciones que en la autorización señale la Comisión, previa opinión de la Secretaría. La mención del Banco de México sólo aparece en la DCG de ITF para la Sociedad Autorizada (art. 106).","ref":"Bancos 69ª-2 fr. III; DCG ITF art. 106","par":"E008"},{"id":"E008","tema":"2.1.11","tipo":"caso","q":"Una Sociedad Autorizada para operar con modelos novedosos (art. 80 LRITF), cuya actividad está sujeta a un régimen de PLD/FT, obtuvo su autorización temporal. Según la DCG de ITF, ¿conforme a qué excepciones debe ajustarse a esas Disposiciones?","a":"Las que señale la Comisión Supervisora o el Banco de México en la autorización, previa opinión de la Secretaría","o":["Las que señale la Comisión Supervisora o el Banco de México en la autorización, previa opinión de la Secretaría","Las que acuerde el Comité Interinstitucional para todo el sector, previa opinión de la Comisión y de la UIF","Las que publique la Secretaría en disposiciones de carácter general, previa opinión del Banco de México y de la CNBV","Las que señale la Comisión en la autorización, previa opinión de la Secretaría"],"x":"El art. 106 de la DCG de ITF ordena a las Sociedades Autorizadas ajustarse a las Disposiciones conforme a las excepciones que en la autorización señale la Comisión Supervisora o el Banco de México, previa opinión de la Secretaría, y precisa que «ITF» se entiende como «Sociedad Autorizada». Antes, el art. 105 les exige evaluar el riesgo y presentar el resultado a la Comisión Supervisora competente. Las demás DCG dicen «la Comisión» (SOFOM, «la autoridad competente»).","ref":"DCG ITF arts. 105–106; art. 2 fr. XXIX","par":"E007"},{"id":"E009","tema":"2.1.11","tipo":"trampa","q":"Sobre la relación entre modelos novedosos e ITF, señala la afirmación que NO es correcta.","a":"La sociedad que obtiene la autorización temporal del art. 80 LRITF tiene el carácter de ITF mientras dure esa autorización","o":["La sociedad que obtiene la autorización temporal del art. 80 LRITF tiene el carácter de ITF mientras dure esa autorización","Una ITF ya autorizada puede obtener una autorización temporal para operar un modelo novedoso conforme al art. 86 LRITF, como entidad regulada","Las ITF son únicamente las instituciones de financiamiento colectivo y las instituciones de fondos de pago electrónico","La autorización temporal del art. 80 LRITF es para personas morales distintas a las ITF y a las Entidades Financieras"],"x":"Modelo novedoso ≠ ITF. El art. 4 fr. XVI define ITF sólo como IFC e IFPE, con autorización definitiva de la CNBV previo acuerdo del Comité Interinstitucional (art. 11); el art. 80 dirige la autorización temporal a sociedades distintas a las ITF. Una ITF sí puede operar un modelo novedoso, pero por el art. 86, como entidad regulada. Por eso en el Anexo 1 de las DCG las ITF y las sociedades autorizadas son renglones distintos.","ref":"LRITF arts. 4 fr. XVI, 11, 80 y 86"},{"id":"E010","tema":"2.1.11","tipo":"memoria","q":"Según el art. 4 fr. XVII de la LRITF, ¿qué caracteriza a un modelo novedoso?","a":"Usa herramientas o medios tecnológicos con modalidades distintas a las existentes en el mercado al otorgarse la autorización temporal","o":["Usa herramientas o medios tecnológicos con modalidades distintas a las existentes en el mercado al otorgarse la autorización temporal","Presta servicios financieros por medios electrónicos a un número de Clientes que no excede el máximo que fije la CNBV en la autorización temporal","Opera exclusivamente con activos virtuales determinados por el Banco de México y sin sucursales físicas para atender al público","Usa herramientas tecnológicas que no existían en el mercado al momento en que se constituyó la sociedad que lo opera"],"x":"La fr. XVII define el modelo novedoso por sus modalidades tecnológicas distintas a las existentes en el mercado «al momento en que se otorgue la autorización temporal»; la misma definición se copia en la 2ª de las DCG (Centros 2ª XV; Transmisores 2ª XXII). El distractor tentador cambia el momento de referencia a la constitución de la sociedad. Probarse con un número limitado de Clientes es un criterio de evaluación del art. 82, no la definición.","ref":"LRITF art. 4 fr. XVII; art. 82 fr. V"},{"id":"E011","tema":"2.1.11","tipo":"cifra","q":"Una sociedad autorizada para operar con un modelo novedoso llegó al término de la vigencia de su autorización temporal. ¿En qué plazo debe entregar a la autoridad el reporte final?","a":"A más tardar treinta días naturales posteriores al término de la vigencia","o":["A más tardar treinta días hábiles posteriores al término de la vigencia","A más tardar sesenta días naturales contados desde la última operación que haya realizado","A más tardar treinta días naturales posteriores al término de la vigencia","Dentro de los quince días hábiles siguientes a que la autoridad financiera se lo requiera"],"x":"El art. 89 LRITF obliga a entregar un reporte final, con las cifras totales de operaciones, Clientes y situaciones de riesgo, a más tardar treinta días posteriores al término de la vigencia; por el art. 9, los días de la LRITF son naturales salvo que se diga hábiles. Además del final, durante la vigencia se entregan reportes en la periodicidad que fije la autoridad.","ref":"LRITF arts. 89 y 9"},{"id":"E012","tema":"2.1.11","tipo":"caso","q":"La CNBV analiza otorgar la autorización temporal del art. 80 LRITF a una sociedad que propone un modelo novedoso. ¿Qué requiere la ley para que la CNBV la otorgue?","a":"El previo acuerdo de su Junta de Gobierno","o":["El previo acuerdo del Comité Interinstitucional","La aprobación de la Secretaría, previa opinión de la CONDUSEF","El previo acuerdo de su Junta de Gobierno","La opinión favorable del Banco de México y de la UIF"],"x":"El art. 80, párrafo tercero, LRITF dispone que, tratándose de Comisiones Supervisoras, se requiere previo acuerdo de la Junta de Gobierno respectiva; el art. 86 repite la regla para entidades reguladas. El acuerdo del Comité Interinstitucional corresponde a la autorización de una ITF (arts. 11 y 35).","ref":"LRITF arts. 80, párr. 3; 86, párr. 2"},{"id":"E013","tema":"2.1.11","tipo":"caso","q":"Una sociedad con autorización temporal del art. 80 LRITF, que no es ITF, pregunta qué régimen de PLD/FT le aplica por ley. ¿Qué responde la LRITF?","a":"El del art. 58 LRITF, por remisión del art. 85; su DCG es la de ITF, que le dedica los arts. 104 a 106","o":["Ninguno durante la vigencia de la autorización temporal, porque las excepciones de la autorización la liberan de ese régimen","El del art. 115 de la LIC y la DCG de Bancos, porque la LRITF remite a esa ley en lo no previsto por ella","El del art. 95 Bis de la LGOAAC y la DCG que corresponda a su actividad, por no ser una entidad financiera","El del art. 58 LRITF, por remisión del art. 85; su DCG es la de ITF, que le dedica los arts. 104 a 106"],"x":"El art. 85 LRITF declara aplicables a las sociedades autorizadas, entre otros, el art. 48, tercer párrafo, y el art. 58 (PLD de las ITF). Por eso la DCG del art. 58 trae un título para la «Sociedad Autorizada» (arts. 104–106), aunque no sea ITF; el art. 106 le hace aplicable el resto de la DCG en lo que señale su autorización, leyendo «ITF» como «Sociedad Autorizada». La autorización puede fijar excepciones, pero no suprime el régimen.","ref":"LRITF art. 85; DCG ITF arts. 104–106"},{"id":"E014","tema":"2.1.11","tipo":"caso","q":"Un centro cambiario pretende obtener autorización de la Comisión para realizar una de sus Operaciones mediante un modelo novedoso. ¿Qué le exige su DCG?","a":"Evaluar el riesgo antes del lanzamiento conforme al Capítulo II Bis y presentar el resultado a la Comisión con su solicitud","o":["Evaluar el riesgo dentro de los doce meses siguientes al lanzamiento y conservar el resultado a disposición de la Comisión y de la Secretaría","Nada en particular, porque su DCG no contiene una disposición sobre modelos novedosos ni remite a la LRITF","Avisar a la Secretaría veinte días hábiles antes del lanzamiento, con la opinión de su Oficial de Cumplimiento","Evaluar el riesgo antes del lanzamiento conforme al Capítulo II Bis y presentar el resultado a la Comisión con su solicitud"],"x":"Igual que Bancos: la 56ª Ter de Centros cambiarios reproduce la 69ª-2 (evaluar el riesgo antes del lanzamiento conforme al Capítulo II Bis, presentar el resultado a la Comisión junto con la solicitud y ajustarse a las excepciones que fije la Comisión, previa opinión de la Secretaría). Transmisores la tiene en la 59-2ª.","ref":"Centros cambiarios 56ª Ter; Bancos 69ª-2"},{"id":"E015","tema":"2.1.11","tipo":"caso","q":"La autorización temporal de una sociedad del art. 80 LRITF está por vencer y la sociedad no realizó acciones para obtener la autorización, registro o concesión definitivos. ¿Qué debe hacer?","a":"Llevar a cabo el procedimiento de salida que incluyó en su solicitud","o":["Seguir operando con los Clientes ya contratados hasta que la autoridad resuelva revocar la autorización","Llevar a cabo el procedimiento de salida que incluyó en su solicitud","Solicitar su autorización como ITF, que la CNBV otorga sin acuerdo del Comité Interinstitucional","Pedir la prórroga de hasta un año, que procede aunque no haya tramitado la autorización definitiva"],"x":"El art. 80 obliga a la sociedad a realizar, durante la vigencia, las acciones para obtener la autorización, registro o concesión definitivos; si no las realiza, debe llevar a cabo el procedimiento de salida previsto en la fr. X del art. 83. La prórroga de hasta un año sólo procede si está realizando esas acciones.","ref":"LRITF arts. 80, párr. 5; 83 fr. X"},{"id":"E016","tema":"2.1.11","tipo":"memoria","q":"En el Anexo 1 (régimen simplificado) de la DCG de Transmisores de dinero, ¿cómo aparecen las ITF y las sociedades autorizadas para operar con modelos novedosos?","a":"En renglones distintos: las ITF en el numeral 1 y las sociedades autorizadas en el numeral 28","o":["En un mismo renglón, porque las sociedades autorizadas para operar modelos novedosos son una clase de ITF","En renglones distintos: las ITF en el numeral 1 y las sociedades autorizadas en el numeral 28","Sólo aparecen las sociedades autorizadas; a las ITF se les integra siempre el expediente completo","Sólo aparecen las ITF; las sociedades autorizadas no gozan del régimen simplificado de identificación"],"x":"El Anexo 1 lista a quienes aplica el régimen simplificado: el numeral 1 es «Instituciones de Tecnología Financiera» y el 28, «Sociedades autorizadas para operar con Modelos Novedosos conforme al Título IV» de la LRITF. Que sean renglones distintos confirma que una cosa no es la otra; la numeración es la misma en las demás DCG.","ref":"Transmisores de dinero, Anexo 1, numerales 1 y 28"},{"id":"E017","tema":"2.1.12","tipo":"caso","q":"Un usuario pide a un centro cambiario venderle en efectivo el equivalente a 12,000 USD en una sola visita. ¿Qué establece la LGOAAC?","a":"Sólo puede venderle hasta el equivalente a 10,000 USD, que es el límite por cliente en un mismo día","o":["Puede venderle el total si integra el expediente completo y recaba copia de su identificación oficial","Puede venderle el total si lo divide en dos operaciones de 6,000 USD cada una durante ese mismo día","Puede venderle hasta 10,000 USD por operación y repetir otra operación ese día sin más restricción","Sólo puede venderle hasta el equivalente a 10,000 USD, que es el límite por cliente en un mismo día"],"x":"Cada fracción del art. 81-A fija un tope no superior al equivalente a diez mil dólares por cada cliente en un mismo día; dividir la operación no cambia el tope diario. El expediente define qué datos se recaban, no amplía el límite legal.","ref":"LGOAAC art. 81-A, fr. I–IV"},{"id":"E018","tema":"2.1.12","tipo":"caso","q":"Un usuario vende dólares en efectivo a un centro cambiario y pide que el contravalor en pesos se le abone por transferencia a su cuenta bancaria. ¿Qué establece la LGOAAC?","a":"No es posible: el contravalor se entrega en el mismo acto, en efectivo, cheques de viajero o cheques en moneda nacional","o":["Es posible con aviso previo a la Comisión, siempre que se use un sistema de pagos autorizado por el Banco de México","Es posible si la operación no rebasa el equivalente a 1,000 USD y se registra en la contabilidad del centro","Es posible si la cuenta está a nombre del propio usuario y el centro conserva el comprobante de la transferencia en su expediente","No es posible: el contravalor se entrega en el mismo acto, en efectivo, cheques de viajero o cheques en moneda nacional"],"x":"El art. 81-A exige entregar el contravalor en el mismo acto y liquidar sólo con efectivo, cheques de viajero o cheques en moneda nacional, sin comprender en ningún caso la transferencia o transmisión de fondos, ni por sistemas de pagos ni por abonos a cuentas. Tampoco puede liquidar por anticipado operaciones de días subsecuentes.","ref":"LGOAAC art. 81-A, párrs. 2 y 3"},{"id":"E019","tema":"2.1.12","tipo":"caso","q":"Un centro cambiario pregunta qué debe comunicar cada trimestre a la Secretaría, por conducto de la Comisión, sobre las divisas que maneja. ¿Qué dispone su DCG?","a":"Los montos totales de divisas recibidas y entregadas en el trimestre anterior y las instituciones con las que operó el saldo neto","o":["Un reporte por cada transferencia internacional de fondos igual o superior a 1,000 USD, enviada o recibida por sus usuarios","La relación de los usuarios cuyas operaciones del mes sumaron el equivalente a 10,000 USD o más, con su sucursal","Sólo el saldo de divisas en caja al último día hábil del trimestre, sin identificar a las instituciones financieras con que operó","Los montos totales de divisas recibidas y entregadas en el trimestre anterior y las instituciones con las que operó el saldo neto"],"x":"La 49ª de Centros cambiarios ordena comunicar, en los periodos de la 22ª, los montos totales de divisas recibidas y entregadas en el trimestre inmediato anterior, e indicar las instituciones financieras, de México o del exterior, con las que operó el saldo neto en efectivo. Los centros no reportan transferencias internacionales: el 81-A les prohíbe transferir fondos.","ref":"Centros cambiarios 49ª; 22ª"},{"id":"E0
