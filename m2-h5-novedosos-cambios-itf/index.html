20","tema":"2.1.12","tipo":"memoria","q":"Según la LGOAAC (art. 81-A), ¿qué forma societaria debe tener una sociedad para operar como centro cambiario?","a":"Exclusivamente sociedad anónima","o":["Sociedad anónima o sociedad de responsabilidad limitada","Sociedad anónima o sociedad civil, con autorización de la Secretaría","Exclusivamente sociedad anónima","Cualquier sociedad mercantil, incluida la sociedad cooperativa de ahorro"],"x":"El art. 81-A reserva las operaciones de centro cambiario exclusivamente a sociedades anónimas organizadas conforme a la LGSM y registradas ante la CNBV; la 2ª fr. II de su DCG repite «sociedades anónimas». La S. de R.L. sólo se admite para el transmisor de dinero (81-A Bis). El centro no necesita autorización de la Secretaría, sino registro ante la CNBV.","ref":"LGOAAC art. 81-A; Centros cambiarios 2ª II","par":"E035"},{"id":"E021","tema":"2.1.12","tipo":"trampa","q":"Sobre centros cambiarios y casas de cambio, señala la afirmación que NO es correcta.","a":"El centro cambiario es una casa de cambio de menor tamaño, por eso su régimen PLD está en el art. 95","o":["El centro cambiario es una casa de cambio de menor tamaño, por eso su régimen PLD está en el art. 95","Lo que dispone el art. 81-A de la LGOAAC sobre centros cambiarios no resulta aplicable a las casas de cambio","El régimen PLD del centro cambiario está en el art. 95 Bis, junto con el de transmisores y SOFOM no reguladas","El centro cambiario necesita estar registrado como tal ante la CNBV para realizar en forma habitual sus operaciones"],"x":"Centro cambiario ≠ casa de cambio chica. Las casas de cambio tienen su régimen PLD en el art. 95 LGOAAC; los centros cambiarios, junto con transmisores y SOFOM no reguladas, en el 95 Bis. El propio art. 81-A excluye de su aplicación a las casas de cambio, y el centro opera con registro ante la CNBV.","ref":"LGOAAC arts. 81-A, 95 y 95 Bis"},{"id":"E022","tema":"2.1.12","tipo":"caso","q":"La CNBV presume que un centro cambiario está violando el art. 95 Bis y sus DCG. Además de supervisar e inspeccionar, ¿qué puede ordenar según la LGOAAC?","a":"Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él","o":["Que sus usuarios suspendan toda operación con el centro, mediante un aviso publicado en su página de internet","Que la Secretaría lo incluya en la Lista de Personas Bloqueadas mientras se aclara la presunción","Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él","Que el Banco de México inmovilice de inmediato las cuentas del centro mientras concluye la inspección"],"x":"El 95 Bis faculta a la CNBV a supervisar, vigilar e inspeccionar y, cuando presuma violaciones, a ordenar a las instituciones de crédito, casas de bolsa y casas de cambio con las que operen centros cambiarios y transmisores que suspendan o cancelen los contratos y se abstengan de nuevas operaciones. La Lista de Personas Bloqueadas tiene supuestos de inclusión propios.","ref":"LGOAAC art. 95 Bis, antepenúltimo y penúltimo párrafos"},{"id":"E023","tema":"2.1.12","tipo":"memoria","q":"Además de prevenir, detectar y reportar, ¿qué obligación impone la fracción III del art. 95 Bis LGOAAC a centros cambiarios, transmisores y SOFOM no reguladas?","a":"Registrar en su contabilidad cada operación o acto con sus clientes o usuarios y con instituciones financieras","o":["Registrar en su contabilidad cada operación o acto con sus clientes o usuarios y con instituciones financieras","Renovar ante la Secretaría, cada tres años, su manual de cumplimiento y el registro de su oficial de cumplimiento","Contar con un auditor externo certificado por la CNBV que dictamine cada año sus estados financieros","Conservar por al menos cinco años la información y documentación de identificación de sus clientes y usuarios"],"x":"El 95 Bis tiene tres fracciones: I medidas para prevenir y detectar; II reportes a la SHCP por conducto de la CNBV; III registrar en su contabilidad cada operación o acto con clientes o usuarios y con instituciones financieras. Las DCG las emite la SHCP, previa opinión de la CNBV, y la información de identificación se conserva al menos diez años, no cinco.","ref":"LGOAAC art. 95 Bis, fr. III y párrafo de conservación"},{"id":"E024","tema":"2.1.12","tipo":"caso","q":"Un centro cambiario revisa su manual y duda si debe distinguir entre Clientes y Usuarios, como lo hace la DCG de Bancos. ¿Qué dispone su DCG?","a":"Sólo regula Usuarios; sus Operaciones son las del art. 81-A de la LGOAAC","o":["Sólo regula Clientes, porque toda operación de cambio exige expediente completo","Sólo regula Usuarios; sus Operaciones son las del art. 81-A de la LGOAAC","Regula Clientes y Usuarios con las mismas definiciones que la DCG de Bancos","Regula como Clientes a quienes operan más de 10,000 USD en un mismo día"],"x":"La 2ª de Centros cambiarios define al Usuario (fr. XXVI) como quien realiza cualquier tipo de Operación con el centro, y a las Operaciones (fr. XVII) como las del art. 81-A; no define Cliente. El último distractor, además, supone algo que la ley prohíbe: operar más de 10,000 USD por cliente al día.","ref":"Centros cambiarios 2ª XVII y XXVI"},{"id":"E025","tema":"2.1.12","tipo":"caso","q":"Un usuario persona física vende a un centro cambiario billetes por el equivalente a 4,000 USD en una operación. ¿Qué debe recabar y conservar el centro?","a":"Los datos de identificación del primer escalón y, además, copia de la identificación oficial de quien interviene","o":["Los datos del primer escalón y una entrevista personal documentada por el Oficial de Cumplimiento","Sólo los datos de identificación del primer escalón, porque la operación no llega al equivalente a 5,000 USD","Nada, porque las obligaciones de identificación del centro empiezan en operaciones de 5,000 USD o más","Los datos de identificación del primer escalón y, además, copia de la identificación oficial de quien interviene"],"x":"La 4ª de Centros cambiarios escalona por operación individual: desde 1,000 y menos de 3,000 USD recaba los datos de la fr. I; desde 3,000 y menos de 5,000 USD, además, copia de la identificación oficial de las personas físicas que intervengan (fr. II). A 4,000 USD aplica la fr. II.","ref":"Centros cambiarios 4ª fr. I y II"},{"id":"E026","tema":"2.1.12","tipo":"cifra","q":"¿Desde qué monto de una operación individual debe un centro cambiario recabar y conservar datos de identificación del usuario?","a":"Desde el equivalente a 1,000 USD","o":["Desde el equivalente a 250 USD","Desde el equivalente a 1,000 USD","Desde el equivalente a 3,000 USD por operación individual","Desde el equivalente a 500 USD"],"x":"La 4ª fr. I de Centros cambiarios fija el primer escalón en operaciones iguales o superiores a mil dólares e inferiores a tres mil. Los 500 USD son el primer escalón de los transmisores de dinero (4ª fr. II de su DCG), que además recaban datos de remitente y beneficiario sin importar el monto; los 3,000 USD son el escalón de la copia de la identificación.","ref":"Centros cambiarios 4ª fr. I; Transmisores 4ª fr. II"},{"id":"E027","tema":"2.1.12","tipo":"caso","q":"Un centro cambiario quiere identificar a sus usuarios mexicanos de forma no presencial, mediante una aplicación, para operaciones de bajo monto. ¿Qué prevé su DCG?","a":"No prevé la identificación no presencial: no tiene 4ª Bis ni Anexo 2","o":["La permite sin límite de monto, siempre que recabe la Geolocalización del Dispositivo del usuario","La permite hasta 1,000 USD por operación, con autorización previa de la Secretaría y aviso a la Comisión","No prevé la identificación no presencial: no tiene 4ª Bis ni Anexo 2","La permite conforme a la 4ª Bis y al Anexo 2, hasta 5,000 o 7,000 USD al mes según el mecanismo"],"x":"La DCG de Centros cambiarios no trae disposición de identificación no presencial: no define Dispositivo ni Geolocalización y no tiene Anexo 2; además, el centro entrega el contravalor en el mismo acto (81-A). Los Transmisores sí la prevén (4ª Bis y Anexo 2).","ref":"Centros cambiarios 2ª y 4ª (sin 4ª Bis ni Anexo 2); Transmisores 4ª Bis; Anexo 2 art. 2","par":"E042"},{"id":"E028","tema":"2.1.12","tipo":"caso","q":"Un usuario persona física quiere realizar con un centro cambiario, en efectivo y en moneda extranjera, una operación individual equivalente a 7,000 USD. ¿Debe activarse el mecanismo de escalamiento de aprobación interna?","a":"Sí: el escalamiento aplica a personas físicas por montos superiores a 5,000 USD","o":["No: el escalamiento de personas físicas aplica por más de 10,000 USD o 300,000 pesos","No: el escalamiento sólo aplica a usuarios personas morales y fideicomisos, no a personas físicas","Sí: el escalamiento aplica a toda operación en efectivo de 1,000 USD o más, sin distinguir tipo de usuario","Sí: el escalamiento aplica a personas físicas por montos superiores a 5,000 USD"],"x":"La 9ª de Centros cambiarios exige escalamiento para operaciones en efectivo con cualquier moneda extranjera de personas físicas por más de 5,000 USD y de personas morales o fideicomisos por más de 8,000 USD. Los 1,000 USD son el umbral de seguimiento y agrupación de la misma 9ª, no del escalamiento.","ref":"Centros cambiarios 9ª","par":"E044"},{"id":"E029","tema":"2.1.12","tipo":"cifra","q":"¿A partir de qué monto acumulado en un mes calendario, en efectivo en moneda extranjera, debe un centro cambiario aplicar mecanismos de seguimiento y agrupación más estrictos a un usuario?","a":"Igual o superior al equivalente a 100,000 USD","o":["Igual o superior al equivalente a 7,500 USD","Igual o superior al equivalente a 100,000 USD","Igual o superior al equivalente a 10,000 USD","Igual o superior al equivalente a 50,000 USD acumulados en el mes"],"x":"La 10ª de Centros cambiarios exige seguimiento más estricto, con un registro de datos, fecha, monto y sucursal de cada operación, para usuarios que en un mes calendario operen en efectivo en moneda extranjera por un acumulado igual o superior a cien mil dólares. Los 10,000 USD son el límite diario por cliente del 81-A.","ref":"Centros cambiarios 10ª"},{"id":"E030","tema":"2.1.12","tipo":"caso","q":"Un centro cambiario prepara el reporte de Operaciones Relevantes. ¿Desde qué monto es relevante una operación con billetes y en qué plazo se reporta?","a":"Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre","o":["Desde 7,500 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre de cada año","Desde 7,500 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 5,000 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre"],"x":"Igual que Bancos, salvo umbral y plazo: la 2ª XX de Centros cambiarios fija la Operación Relevante en 5,000 USD (no 7,500) y la 22ª manda reportar dentro de los últimos diez días hábiles de enero, abril, julio y octubre, por las operaciones de los tres meses anteriores. Bancos reporta desde 7,500 USD en los diez primeros días hábiles.","ref":"Centros cambiarios 2ª XX; 22ª","par":"E031"},{"id":"E031","tema":"2.1.12","tipo":"caso","q":"Un banco prepara el reporte de Operaciones Relevantes. ¿Desde qué monto es relevante una operación con billetes y en qué plazo se reporta?","a":"Desde 7,500 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","o":["Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre","Desde 7,500 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 7,500 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre de cada año","Desde 5,000 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre"],"x":"Bancos es el eje: Operación Relevante desde el equivalente a 7,500 USD (2ª XXX) y reporte trimestral dentro de los diez primeros días hábiles de enero, abril, julio y octubre (34ª). Centros cambiarios y Transmisores bajan el umbral a 5,000 USD y reportan en los últimos diez días hábiles.","ref":"Bancos 2ª XXX; 34ª","par":"E030"},{"id":"E032","tema":"2.1.12","tipo":"caso","q":"Un centro cambiario compra en efectivo a un usuario el equivalente a 6,000 USD. ¿En qué reporte trimestral debe informar esa operación?","a":"En el de compra en efectivo de la 23ª; por ser de 5,000 USD o más, no la incluye en el de relevantes","o":["En ninguno, salvo que el Comité de Comunicación y Control la dictamine como Operación Inusual","En el de compra en efectivo de la 23ª; por ser de 5,000 USD o más, no la incluye en el de relevantes","Sólo en el de Operaciones Relevantes, porque el de compra en efectivo abarca operaciones de hasta 5,000 USD","En ambos: en el de compra en efectivo de la 23ª y en el de Operaciones Relevantes de la 22ª"],"x":"La 23ª obliga a reportar cada compra en efectivo por más de 1,000 USD en los diez últimos días hábiles de enero, abril, julio y octubre, y aclara que, si es igual o superior a 5,000 USD, el centro no está obligado a presentarla en el reporte de relevantes de la 22ª.","ref":"Centros cambiarios 23ª; 22ª"},{"id":"E033","tema":"2.1.12","tipo":"caso","q":"Un mismo grupo empresarial controla dos centros cambiarios y un transmisor de dinero. ¿Puede un centro cambiario del grupo designar como Oficial de Cumplimiento a la misma persona que las otras sociedades?","a":"Sí: su DCG lo admite en un grupo empresarial de centros, transmisores o SOFOM no reguladas, si labora en alguna","o":["No: su DCG no prevé designar a un mismo Oficial de Cumplimiento para varias sociedades del grupo","Sí, pero sólo con autorización previa de la Comisión, que la otorga caso por caso a cada sociedad del grupo","Sí: su DCG lo admite en un grupo empresarial de centros, transmisores o SOFOM no reguladas, si labora en alguna","Sí, pero sólo si el grupo es un grupo financiero que incluya a una institución de crédito o a una casa de cambio"],"x":"La 34ª de Centros cambiarios permite designar un mismo Oficial de Cumplimiento cuando el centro forma parte de un grupo empresarial (una misma sociedad controla a las personas morales) integrado por centros cambiarios, transmisores de dinero o SOFOM no reguladas; esa persona debe laborar en alguna de las entidades. No exige autorización previa ni grupo financiero.","ref":"Centros cambiarios 34ª","par":"E045"},{"id":"E034","tema":"2.1.12","tipo":"caso","q":"Un centro cambiario prepara la información sobre la persona o grupo de personas que ejercen el control en él. ¿Qué plazo prevé su DCG para remitirla a la Secretaría, por conducto de la Comisión?","a":"20 días hábiles desde que la Comisión otorgue el registro, o 10 días hábiles desde el aviso de los accionistas","o":["Sólo 10 días hábiles desde que accionistas, socios o dueños lo comuniquen a la administración","3 días hábiles desde que se inscriba el cambio en el registro del art. 128 de la LGSM","20 días hábiles desde que la Comisión otorgue el registro, o 10 días hábiles desde el aviso de los accionistas","15 días hábiles desde que la Comisión otorgue el registro, o 5 días hábiles desde el aviso de los accionistas"],"x":"La 50ª de Centros cambiarios fija dos momentos: dentro de los veinte días hábiles siguientes a que la Comisión otorgue el registro del 81-B, o dentro de los diez días hábiles siguientes a que los accionistas comuniquen la situación a la administración. Los tres días hábiles son para informar transmisiones de acciones por más del 2 % del capital pagado.","ref":"Centros cambiarios 50ª","par":"E050"},{"id":"E035","tema":"2.1.13","tipo":"memoria","q":"Según la LGOAAC (art. 81-A Bis), ¿qué forma societaria debe tener una sociedad para operar como transmisor de dinero?","a":"Sociedad anónima o sociedad de responsabilidad limitada","o":["Sociedad anónima o sociedad de responsabilidad limitada","Exclusivamente sociedad anónima","Sociedad anónima o sociedad civil, con autorización de la Secretaría","Cualquier sociedad mercantil, incluida la sociedad cooperativa de ahorro"],"x":"El 81-A Bis entiende por transmisor exclusivamente a la sociedad anónima y a la sociedad de responsabilidad limitada organizadas conforme a la LGSM, con registro vigente ante la CNBV; la 2ª fr. XXXVII de su DCG repite ambas formas. El centro cambiario, en cambio, sólo puede ser sociedad anónima (81-A). También pueden actuar como transmisores las dependencias y entidades de la APF facultadas.","ref":"LGOAAC art. 81-A Bis, párrs. 1 y 2; Transmisores 2ª XXXVII","par":"E020"},{"id":"E036","tema":"2.1.13","tipo":"caso","q":"Una tienda de conveniencia constituida como persona moral quiere pagar remesas a los beneficiarios por cuenta de un transmisor de dinero. ¿Con qué figura puede vincularse con el transmisor?","a":"Como Persona Jurídica Coadyuvante, porque el Agente Relacionado sólo puede ser persona física","o":["Como Tercero contratado directamente por el transmisor, sin contrato que le imponga obligaciones PLD","Como Persona Jurídica Coadyuvante, porque el Agente Relacionado sólo puede ser persona física","Como Transmisor de Dinero Extranjero, por recibir recursos que envían remitentes desde el exterior","Como Agente Relacionado, figura que la LGOAAC prevé tanto para personas físicas como para morales"],"x":"Agente relacionado ≠ persona moral. El 81-A Bis y la 2ª fr. I de la DCG definen al Agente Relacionado como persona física. La Persona Jurídica Coadyuvante (2ª XXVIII) es la persona moral o PFAE que, por contrato con el transmisor, entrega o recibe recursos de los Usuarios; es figura de la DCG. El Tercero se vincula con el agente o el coadyuvante, no directamente con el transmisor.","ref":"LGOAAC art. 81-A Bis, párr. 3; Transmisores 2ª I, XXVIII y XXXV"},{"id":"E037","tema":"2.1.13","tipo":"caso","q":"Un agente relacionado de un transmisor de dinero omitió recabar los datos de un Usuario Remitente. ¿Quién responde del cumplimiento del art. 95 Bis por esa operación?","a":"El transmisor, que responde por las operaciones de sus agentes relacionados y de los terceros que contrate","o":["El agente relacionado y la CNBV, en forma solidaria, por ser ésta la autoridad que otorgó el registro","El transmisor, que responde por las operaciones de sus agentes relacionados y de los terceros que contrate","La Unidad de Inteligencia Financiera, por no haber detectado la omisión en los reportes del transmisor","Sólo el agente relacionado, porque la operación se celebró en su establecimiento y con su personal"],"x":"El 81-A Bis hace responsable al transmisor del cumplimiento del 95 Bis y de sus DCG respecto de las operaciones celebradas a través de agentes relacionados y de los terceros que contrate; la 50ª fr. I de la DCG lo extiende a Personas Jurídicas Coadyuvantes, otros transmisores y entidades financieras. Además, el agente no puede operar sin la intervención del transmisor.","ref":"LGOAAC art. 81-A Bis, párrs. 3 y 4; Transmisores 50ª fr. I"},{"id":"E038","tema":"2.1.13","tipo":"trampa","q":"¿Cuál de las siguientes operaciones NO puede realizar un transmisor de dinero según el art. 81-A Bis de la LGOAAC?","a":"Comprar y vender billetes extranjeros, hasta 10,000 USD por cliente al día, como un centro cambiario","o":["Recibir recursos para entregarlos al beneficiario, en una sola exhibición, en el mismo lugar en que los recibió","Comprar y vender billetes extranjeros, hasta 10,000 USD por cliente al día, como un centro cambiario","Recibir recursos en sus oficinas o por medios electrónicos para transferirlos a otro lugar del territorio nacional","Recibir en territorio nacional recursos en moneda extranjera para transferirlos al extranjero según instrucciones del remisor"],"x":"El último párrafo del 81-A Bis prohíbe al transmisor realizar las operaciones del art. 81-A (centro cambiario). Las otras tres son su actividad: recibir recursos en territorio nacional, en oficinas o por cualquier vía, con el único objeto de transferirlos al extranjero, a otro lugar del país o entregarlos en una sola exhibición donde se recibieron.","ref":"LGOAAC art. 81-A Bis, primer y último párrafos"},{"id":"E039","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero quiere emitir fondos de pago electrónico para que sus usuarios guarden saldo en una aplicación. ¿Qué exige la LGOAAC?","a":"Constituirse como institución de fondos de pago electrónico conforme a la LRITF","o":["Dar aviso a la Comisión con la información de sus agentes relacionados y coadyuvantes","Constituirse como institución de fondos de pago electrónico conforme a la LRITF","Registrarse además como centro cambiario ante la CNBV y operar con sociedad anónima","Obtener del Banco de México la autorización para operar con activos virtuales"],"x":"El 81-A Bis, quinto párrafo, dispone que si el transmisor pretende emitir fondos de pago electrónico o instrumentos que los almacenen, debe constituirse como IFPE en términos de la LRITF. A la inversa, la IFPE sí puede prestar el servicio de transmisión del 81-A Bis (art. 25 fr. II LRITF).","ref":"LGOAAC art. 81-A Bis, párr. 5; LRITF art. 25 fr. II"},{"id":"E040","tema":"2.1.13","tipo":"caso","q":"Un Usuario Remitente envía al extranjero, por medio de un transmisor de dinero, el equivalente a 200 USD. ¿Qué debe recabar y conservar el transmisor?","a":"Los datos que exige la fracción I de la 4ª, que se recaban con independencia del monto","o":["Sólo el número de referencia de la transferencia, sin datos del remitente ni del beneficiario","El expediente completo del remitente, porque toda transferencia internacional lo exige","Los datos que exige la fracción I de la 4ª, que se recaban con independencia del monto","Nada, porque las obligaciones de identificación del transmisor empiezan en 500 USD"],"x":"La 4ª fr. I de Transmisores obliga, con independencia del monto, a recabar y conservar datos del Usuario Remitente (nombre, domicilio, número de referencia y cuenta o referencia de origen) y, en transferencias internacionales, información del beneficiario. Los 500 USD son el inicio del siguiente escalón (fr. II), no de toda obligación.","ref":"Transmisores 4ª fr. I, inciso A"},{"id":"E041","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero recibe de un Usuario Remitente el equivalente a 800 USD para enviarlo. Además de los datos que se recaban con independencia del monto, ¿qué debe recabar?","a":"Los datos de identificación del escalón que va de 500 a menos de 3,000 USD","o":["Copia de la identificación oficial de quien interviene, porque ese escalón inicia en 500 USD","Ninguno adicional, porque el siguiente escalón de identificación inicia en 1,000 USD","El expediente completo del remitente, porque toda transmisión al extranjero lo exige sin importar el monto","Los datos de identificación del escalón que va de 500 a menos de 3,000 USD"],"x":"La 4ª fr. II de Transmisores fija un escalón desde 500 y menos de 3,000 USD con datos de identificación adicionales a los de la fr. I; la copia de la identificación corresponde al escalón de 3,000 a menos de 5,000 (fr. III) y el expediente, desde 5,000 (fr. IV). La IFPE que transmite dinero empieza ese escalón en 1,000 USD (DCG ITF art. 101).","ref":"Transmisores 4ª fr. I–IV; DCG ITF art. 101","par":"E064"},{"id":"E042","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero quiere identificar a sus usuarios mexicanos de forma no presencial, mediante una aplicación, para operaciones de bajo monto. ¿Qué prevé su DCG?","a":"La permite conforme a la 4ª Bis y al Anexo 2, hasta 5,000 o 7,000 USD al mes según el mecanismo","o":["La permite conforme a la 4ª Bis y al Anexo 2, hasta 5,000 o 7,000 USD al mes según el mecanismo","No prevé la identificación no presencial: no tiene 4ª Bis ni Anexo 2","La permite hasta 1,000 USD por operación, con autorización previa de la Secretaría y aviso a la Comisión","La permite sin límite de monto, siempre que recabe la Geolocalización del Dispositivo del usuario"],"x":"La 4ª Bis permite operar por Dispositivos de forma no presencial con personas físicas, PFAE y personas morales mexicanas, recabando previamente el expediente conforme al Anexo 2 y la Geolocalización. El art. 2 del Anexo 2 limita esas operaciones a 5,000 o 7,000 USD en un mes calendario, según el Mecanismo Tecnológico de Identificación. Centros cambiarios no tiene esta figura.","ref":"Transmisores 4ª Bis; Anexo 2, art. 2","par":"E027"},{"id":"E043","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero clasificó a un posible usuario como de riesgo bajo y quiere permitirle operar mientras termina de verificar sus datos y documentos. ¿Qué dispone su DCG?","a":"No puede: debe informarle que no podrá operar hasta que concluya la verificación","o":["Puede, siempre que las operaciones no rebasen el equivalente a 500 USD en el mes calendario","Puede, si la verificación la realiza un tercero contratado y el expediente queda bajo su resguardo","No puede: debe informarle que no podrá operar hasta que concluya la verificación","Puede, porque la verificación de usuarios de riesgo bajo puede concluir después de la primera operación"],"x":"La 8ª Bis de Transmisores obliga a verificar los datos y documentos y a informar a los Usuarios que no podrán realizar Operaciones hasta que concluya la verificación; no trae el supuesto de verificación posterior para riesgo bajo que tienen otras DCG. Un tercero puede verificar, pero eso no exime al transmisor ni le permite operar antes.","ref":"Transmisores 8ª Bis"},{"id":"E044","tema":"2.1.13","tipo":"caso","q":"Un usuario persona física quiere realizar con un transmisor de dinero, en efectivo y en moneda extranjera, una operación individual equivalente a 7,000 USD. ¿Debe activarse el mecanismo de escalamiento de aprobación interna?","a":"No: el escalamiento de personas físicas aplica por más de 10,000 USD o 300,000 pesos","o":["No: el escalamiento de personas físicas aplica por más de 10,000 USD o 300,000 pesos","Sí: el escalamiento aplica a personas físicas por montos superiores a 5,000 USD","No: el escalamiento sólo aplica a usuarios personas morales y fideicomisos, no a personas físicas","Sí: el escalamiento aplica a toda operación en efectivo de 1,000 USD o más, sin distinguir tipo de usuario"],"x":"La 9ª de Transmisores fija el escalamiento para personas físicas por más de 10,000 USD (o más de 300,000 pesos en moneda nacional) y para personas morales o fideicomisos por más de 50,000 USD (o 500,000 pesos). Los 5,000 USD son el umbral de Centros cambiarios para personas físicas.","ref":"Transmisores 9ª; Centros cambiarios 9ª","par":"E028"},{"id":"E045","tema":"2.1.13","tipo":"caso","q":"Un mismo grupo empresarial controla dos transmisores de dinero y un centro cambiario. ¿Qué prevé la DCG de Transmisores sobre designar como Oficial de Cumplimiento del transmisor a la misma persona que en las otras sociedades?","a":"No contiene una regla que permita designar un mismo Oficial de Cumplimiento para varias sociedades del grupo","o":["No contiene una regla que permita designar un mismo Oficial de Cumplimiento para varias sociedades del grupo","Lo admite en un grupo empresarial de centros, transmisores o SOFOM no reguladas, si labora en alguna","Lo admite sólo con autorización previa de la Comisión, que la otorga caso por caso a cada sociedad del grupo","Lo admite sólo si el grupo es un grupo financiero que incluya a una institución de crédito o a una casa de cambio"],"x":"La DCG de Transmisores no contiene la regla de Oficial de Cumplimiento común: su 36ª pide designar a un funcionario del propio transmisor, dentro de las tres jerarquías inmediatas inferiores a su director general, sin prever el supuesto de grupo. La 34ª de Centros cambiarios sí lo admite en un grupo empresarial que incluya transmisores, pero esa regla sólo rige al centro.","ref":"Transmisores 36ª (sin regla de OC común); Centros cambiarios 34ª","par":"E033"},{"id":"E046","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero prepara el reporte de Operaciones Relevantes. ¿Desde qué monto es relevante una operación con billetes y en qué plazo se reporta?","a":"Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre","o":["Desde 7,500 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 7,500 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre de cada año","Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre","Desde 5,000 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre"],"x":"La 2ª XXVII de Transmisores define la Operación Relevante desde 5,000 USD y la 23ª manda reportar dentro de los diez últimos días hábiles de enero, abril, julio y octubre. Igual que Centros cambiarios; las ITF usan el mismo umbral, pero reportan en los diez primeros días hábiles, como Bancos.","ref":"Transmisores 2ª XXVII; 23ª","par":"E065"},{"id":"E047","tema":"2.1.13","tipo":"cifra","q":"Un transmisor de dinero envió al extranjero, por instrucciones de un usuario, el equivalente a 1,200 USD. ¿Qué reporte corresponde y en qué plazo?","a":"El de transferencias internacionales: mensual, dentro de los 15 días hábiles siguientes al último día hábil del mes anterior","o":["El de Operaciones Relevantes, trimestral, dentro de los diez últimos días hábiles de enero, abril, julio y octubre","El de transferencias internacionales, por cada operación, dentro de las 24 horas siguientes a que se ordena","Ninguno: los transmisores de dinero no tienen un reporte de transferencias internacionales de fondos","El de transferencias internacionales: mensual, dentro de los 15 días hábiles siguientes al último día hábil del mes anterior"],"x":"La 24ª de Transmisores, igual que Bancos, exige un reporte mensual, a más tardar dentro de los quince días hábiles siguientes al último día hábil del mes anterior, por cada transferencia internacional igual o superior a 1,000 USD; la 25ª añade datos del beneficiario en remesas. Son los centros cambiarios los que no tienen este reporte.","ref":"Transmisores 24ª–25ª"},{"id":"E048","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero recibe de un usuario, en efectivo, el equivalente a 800 USD en euros. Según su DCG, ¿qué reporte de operaciones en efectivo con moneda extranjera corresponde?","a":"Ninguno: su DCG no prevé un reporte de operaciones en efectivo con moneda extranjera","o":["Ninguno: su DCG no prevé un reporte de operaciones en efectivo con moneda extranjera","Uno por cada operación en efectivo en cualquier moneda extranjera desde 500 USD, en los diez primeros días hábiles","Uno por cada operación en efectivo en dólares desde 7,500 USD, en los diez primeros días hábiles del trimestre siguiente","Uno por cada compra en efectivo de más de 1,000 USD, en los diez últimos días hábiles del trimestre"],"x":"La DCG de Transmisores no tiene capítulo de reporte de operaciones en efectivo con moneda extranjera (sí reporta relevantes y transferencias internacionales; los 500 USD de su 9ª son umbral de seguimiento, no de reporte). La ITF sí lo tiene para cualquier moneda extranjera desde 500 USD (art. 67), y el centro cambiario reporta las compras en efectivo de más de 1,000 USD (23ª).","ref":"Transmisores Caps. IV–V (sin ese reporte); 9ª; DCG ITF art. 67; Centros cambiarios 23ª","par":"E066"},{"id":"E049","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero necesita la clave para acceder al sistema electrónico de la Comisión por el que enviará sus reportes. ¿Qué plazo fija su DCG?","a":"Solicitarla dentro de los 20 días hábiles posteriores a su registro","o":["Solicitarla dentro de los 20 días hábiles posteriores a su registro","Solicitarla dentro de los 15 días hábiles siguientes a que presente su primer reporte trimestral","Solicitarla y contar con ella al momento de iniciar operaciones","Solicitarla dentro de los 10 días hábiles siguientes a que designe a su Oficial de Cumplimiento"],"x":"La 59ª-1 de Transmisores obliga a solicitar la clave dentro de los veinte días hábiles posteriores a su registro y a mantenerla a nombre del Oficial de Cumplimiento o del interino. Igual en Centros cambiarios (56ª Bis); las ITF, como Bancos, deben contar con ella al iniciar operaciones (art. 98).","ref":"Transmisores 59ª-1; DCG ITF art. 98","par":"E070"},{"id":"E050","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero prepara la información sobre la persona o grupo de personas que ejercen el control en él. ¿Qué plazo prevé su DCG para remitirla a la Secretaría, por conducto de la Comisión?","a":"Sólo 10 días hábiles desde que accionistas, socios o dueños lo comuniquen a la administración","o":["20 días hábiles desde que la Comisión otorgue el registro, o 10 días hábiles desde el aviso de los accionistas","15 días hábiles desde que la Comisión otorgue el registro, o 5 días hábiles desde el aviso de los accionistas","3 días hábiles desde que se inscriba el cambio en el registro del art. 128 de la LGSM","Sólo 10 días hábiles desde que accionistas, socios o dueños lo comuniquen a la administración"],"x":"La 53ª de Transmisores sólo fija diez días hábiles desde que accionistas, socios o dueños comuniquen la situación a la administración; no trae el supuesto de veinte días tras el registro que sí tiene Centros cambiarios (50ª). Los tres días hábiles son para informar transmisiones de acciones o partes sociales por más del 2 % del capital pagado.","ref":"Transmisores 53ª; Centros cambiarios 50ª","par":"E034"},{"id":"E051","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero va a contratar nuevos agentes relacionados. ¿Cuándo debe aplicar los procedimientos para asegurar la honorabilidad de los directivos y empleados de esos agentes?","a":"Antes de iniciar la relación contractual y de manera periódica mientras esté vigente, con un esquema basado en riesgos","o":["Sólo cuando la Comisión lo requiera con motivo de una visita de inspección al establecimiento del agente relacionado","Una vez al año, al presentar a la Comisión el aviso con la información de sus agentes y coadyuvantes","Sólo al iniciar la relación contractual, porque después la responsabilidad pasa al agente relacionado","Antes de iniciar la relación contractual y de manera periódica mientras esté vigente, con un esquema basado en riesgos"],"x":"La 49ª de Transmisores obliga a cerciorarse de que agentes relacionados y coadyuvantes cumplan identificación, conocimiento y seguimiento, y a asegurar la honorabilidad de su personal antes de iniciar la relación y periódicamente mientras esté vigente, con un esquema basado en riesgos. El aviso a la Comisión es otra obligación (50ª Bis), en los plazos que la propia Comisión establezca.","ref":"Transmisores 49ª; 50ª Bis"},{"id":"E052","tema":"2.1.13","tipo":"caso","q":"Un agente relacionado pregunta en qué plazo debe entregar al transmisor de dinero los registros de las operaciones que celebra y quién puede conservar los expedientes de los usuarios. ¿Qué dispone la DCG?","a":"En no más de diez días naturales desde la operación; el agente puede conservar el expediente, a disposición del transmisor y la Comisión","o":["En no más de diez días naturales desde la operación; el agente puede conservar el expediente, a disposición del transmisor y la Comisión","En no más de veinte días hábiles desde el cierre del mes; el expediente lo conserva el Oficial de Cumplimiento","Al cierre de cada trimestre; el expediente lo conserva el Tercero que haya entregado los recursos al beneficiario","En no más de diez días hábiles desde la operación; el expediente debe conservarlo siempre el transmisor, aunque el agente lo haya integrado"],"x":"La 50ª fr. III inciso g) de Transmisores obliga a pactar que agentes y coadyuvantes entreguen registros, datos y documentos dentro de un plazo que no exceda de diez días naturales desde la operación (salvo las de la 30ª, que van en el plazo que permita cumplirla), y permite que el expediente lo conserven ellos, siempre a disposición del transmisor y de la Comisión.","ref":"Transmisores 50ª fr. III, inciso g)"},{"id":"E053","tema":"2.1.14","tipo":"memoria","q":"Según el art. 4 fr. XVI de la LRITF, ¿qué instituciones son ITF?","a":"Las instituciones de financiamiento colectivo y las de fondos de pago electrónico","o":["Las de financiamiento colectivo, las de fondos de pago electrónico y las que operan con activos virtuales","Las de financiamiento colectivo, las de fondos de pago electrónico y las sociedades autorizadas para modelos novedosos","Las de fondos de pago electrónico y los transmisores de dinero con registro vigente ante la CNBV","Las instituciones de financiamiento colectivo y las de fondos de pago electrónico"],"x":"La fr. XVI define a las ITF como las IFC y las IFPE, nada más. La sociedad autorizada para operar con modelos novedosos tiene autorización temporal (Título IV) y no es ITF; operar con activos virtuales es una actividad que una ITF puede realizar con autorización del Banco de México, no un tipo de ITF.","ref":"LRITF art. 4 fr. XVI; arts. 30 y 80"},{"id":"E054","tema":"2.1.14","tipo":"caso","q":"Un grupo de inversionistas quiere constituir una institución de financiamiento colectivo. ¿Quién otorga la autorización y qué forma societaria exige la LRITF?","a":"La CNBV, previo acuerdo del Comité Interinstitucional; debe ser sociedad anónima","o":["La CNBV, previo acuerdo del Comité Interinstitucional; debe ser sociedad anónima","El Banco de México, previa opinión de la CNBV; puede ser cualquier sociedad mercantil","La Secretaría, previa opinión del Banco de México; puede ser S.A. o S. de R.L.","La CNBV, previo acuerdo de su Junta de Gobierno; debe ser sociedad anónima"],"x":"El art. 11 LRITF exige autorización de la CNBV previo acuerdo del Comité Interinstitucional, y el art. 36, que los interesados sean sociedades anónimas. El acuerdo de la Junta de Gobierno es el requisito de las autorizaciones temporales de modelos novedosos (arts. 80 y 86), no de la autorización de una ITF.","ref":"LRITF arts. 11, 35 y 36"},{"id":"E055","tema":"2.1.14","tipo":"cifra","q":"¿Cómo se integra el Comité Interinstitucional que acuerda las autorizaciones de ITF?","a":"Seis miembros: dos de la Secretaría, dos del Banco de México y dos de la CNBV; lo preside la CNBV","o":["Cinco miembros: dos de la CNBV, uno de la Secretaría, uno del Banco de México y uno de la CONDUSEF","Seis miembros: dos de la Secretaría, dos del Banco de México y dos de la CNBV; lo preside la Secretaría","Seis miembros: dos de la Secretaría, dos del Banco de México y dos de la CNBV; lo preside la CNBV","Nueve miembros: tres de la Secretaría, tres del Banco de México y tres de la CNBV; lo preside el Banco de México"],"x":"El art. 35 LRITF integra el Comité con seis miembros propietarios (dos de la Secretaría, dos del Banco de México y dos de la CNBV), cada uno con suplente; lo preside uno de los representantes de la CNBV y, en su ausencia, el otro. El secretario también se designa entre servidores públicos de la CNBV.","ref":"LRITF art. 35, párrs. 2 y 3"},{"id":"E056","tema":"2.1.14","tipo":"caso","q":"El Comité Interinstitucional sesiona para resolver la autorización de una institución de fondos de pago electrónico. ¿Qué votación exige la LRITF para otorgarla?","a":"El voto favorable de al menos un representante de cada autoridad representada en el Comité","o":["La unanimidad de los seis miembros propietarios, sin que puedan votar los suplentes","Las dos terceras partes de los miembros, con la presencia de todos los propietarios","La mayoría simple de los miembros presentes, con voto de calidad del presidente en caso de empate","El voto favorable de al menos un representante de cada autoridad representada en el Comité"],"x":"El art. 35 LRITF fija como regla general la mayoría simple de los presentes con voto de calidad del presidente, pero para otorgar autorizaciones de ITF exige el voto favorable de al menos un representante de cada autoridad representada. El quórum es de al menos tres miembros, con todas las autoridades representadas.","ref":"LRITF art. 35, párr. 4"},{"id":"E057","tema":"2.1.14","tipo":"caso","q":"Una institución de fondos de pago electrónico quiere ofrecer el servicio de transmisión de dinero del art. 81-A Bis de la LGOAAC. ¿Qué prevén la LRITF y su DCG?","a":"Puede prestarlo como actividad del art. 25 fr. II LRITF, sujeta al Título Décimo Quinto de su DCG","o":["No puede: la transmisión de dinero está reservada a S.A. y S. de R.L. con registro de transmisor","Puede prestarlo como actividad del art. 25 fr. II LRITF, sujeta al Título Décimo Quinto de su DCG","Debe registrarse además como transmisor de dinero ante la CNBV y cumplir también la DCG de Transmisores","Sólo puede prestarlo con una autorización temporal para modelo novedoso conforme al art. 86 LRITF"],"x":"El art. 25 fr. II LRITF permite a las IFPE prestar el servicio de transmisión de dinero del 81-A Bis, y el art. 99 de su DCG la sujeta al Título Décimo Quinto (arts. 99–103), con excepciones a otros artículos. No necesita registro como transmisor ni autorización temporal, y puede prestarlo a través de comisionistas.","ref":"LRITF art. 25 fr. II; DCG ITF art. 99"},{"id":"E058","tema":"2.1.14","tipo":"memoria","q":"Según el art. 58 fr. II, inciso a), de la LRITF, ¿sobre qué actos y operaciones deben presentar reportes las ITF?","a":"Los que realicen con sus Clientes y las Operaciones entre estos, según corresponda","o":["Sólo los que realicen con sus Clientes personas morales y con fideicomisos","Sólo los que realicen con sus Clientes en efectivo, en moneda nacional o extranjera","Los que realicen con sus Clientes y las Operaciones entre estos, según corresponda","Sólo los que superen el equivalente a 7,500 UDIS al mes por Cliente"],"x":"El art. 58 fr. II a) incluye los actos, Operaciones y servicios con sus Clientes «y las Operaciones entre estos», porque en las ITF los Clientes operan entre sí a través de la plataforma. Las DCG las emite la Secretaría, previa opinión de la CNBV, y el inciso b) cubre lo que hagan consejeros, directivos, empleados y apoderados.","ref":"LRITF art. 58, fr. II"},{"id":"E059","tema":"2.1.14","tipo":"caso","q":"Una ITF designó a su Oficial de Cumplimiento y contrató a un tercero independiente para la revisión anual de efectividad. Según la LRITF, ¿quiénes deben obtener la certificación del art. 4 fr. X de la Ley de la CNBV?","a":"Ambos: el Oficial de Cumplimiento y el auditor o tercero independiente responsable de la revisión","o":["Ninguno de los dos: la certificación de la CNBV sólo se exige al personal de las instituciones de crédito","Ambos: el Oficial de Cumplimiento y el auditor o tercero independiente responsable de la revisión","Sólo el Oficial de Cumplimiento, porque el tercero independiente es ajeno a la estructura de la ITF","Sólo el tercero independiente, porque el Oficial de Cumplimiento ya fue aprobado por el Comité"],"x":"El art. 58, quinto párrafo, LRITF exige que tanto el Oficial de Cumplimiento (fr. VI del tercer párrafo) como el auditor o tercero independiente responsable de la revisión anual (fr. VII) obtengan la certificación del art. 4 fr. X de la LCNBV. El mismo artículo fija la conservación de la información en al menos diez años.","ref":"LRITF art. 58, párrs. 3 a 5"},{"id":"E060","tema":"2.1.14","tipo":"caso","q":"Una ITF quiere operar con un activo virtual que el público usa como medio de pago. ¿Qué exige la LRITF?","a":"Que sea de los activos virtuales que determine el Banco de México y contar con su autorización previa","o":["Que sea de los activos virtuales que determine el Banco de México y contar con su autorización previa","Que el activo esté denominado en divisas y que la Secretaría autorice previamente su uso por la ITF","Ninguna autorización particular, si el activo virtual ya es de uso común entre el público","Que el activo esté inscrito en un registro de la CNBV y dar aviso a la UIF antes de empezar a operarlo"],"x":"El art. 30 LRITF permite a las ITF operar sólo con los activos virtuales que determine el Banco de México mediante disposiciones generales y exige su autorización previa. No son activos virtuales la moneda de curso legal, las divisas ni lo denominado en ellas.","ref":"LRITF art. 30"},{"id":"E061","tema":"2.1.14","tipo":"caso","q":"Una institución de financiamiento colectivo diseña su monitoreo. ¿Desde qué monto mensual de las operaciones de sus Clientes que señala el art. 43 de su DCG debe aplicar mecanismos de seguimiento más estrictos?","a":"Igual o superior al equivalente a 12,500 UDIS en un mes calendario","o":["Igual o superior al equivalente a 7,500 UDIS en un mes calendario","Igual o superior al equivalente a 7,500 USD en un mes calendario","Igual o superior al equivalente a 12,500 UDIS en un mes calendario","Igual o superior al equivalente a 100,000 USD acumulados en un mes calendario"],"x":"El art. 43 de la DCG de ITF manda dar seguimiento y agrupar las Operaciones con independencia del monto, y endurecerlo en la IFC cuando sus Clientes operen en un mes, en efectivo (moneda nacional o extranjera) o en activos virtuales, por 12,500 UDIS o más. La IFPE baja el umbral a 7,500 UDIS. Las ITF miden en UDIS; los 100,000 USD son de Centros cambiarios.","ref":"DCG ITF art. 43 fr. I","par":"E062"},{"id":"E062","tema":"2.1.14","tipo":"caso","q":"Una institución de fondos de pago electrónico diseña su monitoreo. ¿Desde qué monto mensual de las operaciones de sus Clientes que señala el art. 43 de su DCG debe aplicar mecanismos de seguimiento más estrictos?","a":"Igual o superior al equivalente a 7,500 UDIS en un mes calendario","o":["Igual o superior al equivalente a 100,000 USD acumulados en un mes calendario","Igual o superior al equivalente a 7,500 USD en un mes calendario","Igual o superior al equivalente a 12,500 UDIS en un mes calendario","Igual o superior al equivalente a 7,500 UDIS en un mes calendario"],"x":"El art. 43 fr. II de la DCG de ITF endurece el seguimiento de la IFPE cuando sus Clientes operen en un mes, en efectivo, en fondos de pago electrónico (moneda nacional o extranjera) o en activos virtuales, por 7,500 UDIS o más. Para la IFC el umbral es 12,500 UDIS. El distractor de 7,500 USD cambia la unidad: la DCG de ITF mide en UDIS.","ref":"DCG ITF art. 43 fr. II","par":"E061"},{"id":"E063","tema":"2.1.14","tipo":"cifra","q":"Una IFPE ofrece a personas físicas una cuenta nivel 2 con régimen de identificación simplificado. ¿A cuánto se limita la operación mensual de esa cuenta?","a":"Al equivalente a 3,000 UDIS en el transcurso de un mes calendario","o":["Al equivalente a 750 UDIS en el transcurso de un mes calendario","Al equivalente a 3,000 UDIS en el transcurso de un mes calendario","Al equivalente a 7,500 UDIS en el transcurso de un mes calendario, igual que el umbral de su art. 43","Al equivalente a 1,700 UDIS en el transcurso de un mes calendario"],"x":"El art. 12 fr. II de la DCG de ITF limita el nivel 2 a 3,000 UDIS al mes y pide, además de los datos del nivel 1, el domicilio y la versión digital del documento de identificación. Los 750 UDIS son el límite mensual del nivel 1 y los 1,700 UDIS, el de las cuentas para transferencias internacionales de riesgo bajo. Si se rebasan, se integra el expediente del art. 11.","ref":"DCG ITF art. 12"},{"id":"E064","tema":"2.1.14","tipo":"caso","q":"Una IFPE recibe de un Usuario Remitente el equivalente a 800 USD para transmitirlo en términos del art. 81-A Bis de la LGOAAC. Además de los datos que se recaban con independencia del monto, ¿qué debe recabar?","a":"Ninguno adicional, porque el siguiente escalón de identificación inicia en 1,000 USD","o":["El expediente completo del remitente, porque toda transmisión al extranjero lo exige sin importar el monto","Los datos de identificación del escalón que va de 500 a menos de 3,000 USD","Ninguno adicional, porque el siguiente escalón de identificación inicia en 1,000 USD","Copia de la identificación oficial de quien interviene, porque ese escalón inicia en 500 USD"],"x":"El art. 101 de la DCG de ITF escalona la identificación del servicio de transmisión: fr. I datos con independencia del monto; fr. II de 1,000 a menos de 3,000 USD; fr. III de 3,000 a menos de 5,000; fr. IV desde 5,000. A diferencia del transmisor de dinero (escalón desde 500 USD), a 800 USD la IFPE sólo recaba los datos de la fr. I.","ref":"DCG ITF art. 101; Transmisores 4ª fr. II","par":"E041"},{"id":"E065","tema":"2.1.14","tipo":"caso","q":"Una ITF prepara el reporte de Operaciones Relevantes. ¿Desde qué monto es relevante una operación con billetes y en qué plazo se reporta?","a":"Desde 5,000 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","o":["Desde 5,000 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 7,500 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre de cada año","Desde 7,500 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre"],"x":"La DCG de ITF define la Operación Relevante desde 5,000 USD, sólo con billetes y monedas metálicas (art. 2 XXIV), y el art. 66 manda reportar dentro de los diez primeros días hábiles de enero, abril, julio y octubre, como Bancos. Transmisores y Centros usan el mismo umbral, pero reportan en los diez últimos días hábiles.","ref":"DCG ITF art. 2 fr. XXIV; art. 66","par":"E046"},{"id":"E066","tema":"2.1.14","tipo":"caso","q":"Una ITF recibe de un Cliente, en efectivo, el equivalente a 800 USD en euros. Según su DCG, ¿qué reporte de operaciones en efectivo con moneda extranjera corresponde?","a":"Uno por cada operación en efectivo en cualquier moneda extranjera desde 500 USD, en los diez primeros días hábiles","o":["Uno por cada operación en efectivo en dólares desde 7,500 USD, en los diez primeros días hábiles del trimestre siguiente","Uno por cada operación en efectivo en cualquier moneda extranjera desde 500 USD, en los diez primeros días hábiles","Uno por cada compra en efectivo de más de 1,000 USD, en los diez últimos días hábiles del trimestre","Ninguno: su DCG no prevé un reporte de operaciones en efectivo con moneda extranjera"],"x":"El art. 67 de la DCG de ITF exige reportar cada Operación con Clientes, o entre ellos, en efectivo en moneda extranjera por 500 USD o más o su equivalente en la moneda en que se realice, dentro de los diez primeros días hábiles de enero, abril, julio y octubre. No se limita a dólares, a diferencia del reporte de USD de Bancos; los transmisores no tienen este reporte.","ref":"DCG ITF art. 67","par":"E048"},{"id":"E067","tema":"2.1.14","tipo":"caso","q":"El sistema de una ITF detectó el 3 de marzo una operación que podría ser inusual. ¿Desde cuándo y por cuánto tiempo corre el plazo del Comité para dictaminarla?","a":"Hasta 60 días naturales contados desde que la ITF detecta la operación","o":["Hasta 60 días hábiles contados desde que el Oficial de Cumplimiento la presenta al Comité","Hasta 60 días naturales contados desde la siguiente sesión ordinaria del Comité","Hasta 60 días naturales contados desde que la ITF detecta la operación","Hasta 30 días naturales contados desde que la ITF detecta la operación"],"x":"El art. 69 de la DCG de ITF da al Comité un periodo que no excede de sesenta días naturales contados a partir de que la ITF detecte la operación por su sistema, modelo, proceso o empleado, lo que ocurra primero; el reporte se envía dentro de los tres días hábiles siguientes a la sesión que la dictamine. Centros y Transmisores cuentan desde que se genera la alerta.","ref":"DCG ITF art. 69; Centros cambiarios 24ª; Transmisores 26ª"},{"id":"E068","tema":"2.1.14","tipo":"caso","q":"Un Cliente de una ITF vende activos virtuales y recibe a cambio pesos por el equivalente a 8,000 UDIS. ¿Qué reporte corresponde según la DCG de ITF?","a":"Un reporte de esa operación con activos virtuales, en los diez primeros días hábiles de enero, abril, julio y octubre","o":["Un reporte de Operación Relevante, porque toda venta de activos virtuales se equipara a efectivo","Un reporte de esa operación con activos virtuales, dentro de las 24 horas siguientes a su liquidación, como Operación Inusual","Un reporte de esa operación con activos virtuales, en los diez primeros días hábiles de enero, abril, julio y octubre","Ninguno: el umbral del reporte de activos virtuales de las ITF está en 7,500 USD, no en UDIS"],"x":"El art. 74 de la DCG de ITF exige un reporte trimestral, dentro de los diez primeros días hábiles de enero, abril, julio y octubre, cuando el Cliente vende activos virtuales y recibe moneda de curso legal por un monto igual o superior a 7,500 UDIS. El umbral está en UDIS, no en USD como en Bancos.","ref":"DCG ITF art. 74"},{"id":"E069","tema":"2.1.14","tipo":"caso","q":"Una ITF cuenta con 18 personas para el cumplimiento de sus fines. ¿Qué dispone su DCG sobre el Comité de Comunicación y Control?","a":"No está obligada a constituirlo; sus funciones las ejerce el OC y la ITF lo comunica en 60 días hábiles","o":["Debe constituirlo, pero el Oficial de Cumplimiento puede asumir por sí solo la función de dictaminar las Operaciones Inusuales","No está obligada a constituirlo; sus funciones las ejerce el director general, sin aviso alguno","Debe constituirlo con al menos tres miembros, aunque puede sesionar una vez por trimestre","No está obligada a constituirlo; sus funciones las ejerce el OC y la ITF lo comunica en 60 días hábiles"],"x":"El art. 46 exime de constituir el Comité a las ITF con menos de veinticinco personas; las funciones del art. 45 las ejerce el Oficial de Cumplimiento. El art. 48 obliga a comunicar esa situación a la Secretaría dentro de sesenta días hábiles desde la autorización o desde que se reduce el personal.","ref":"DCG ITF arts. 46, último párrafo, y 48, último párrafo"},{"id":"E070","tema":"2.1.14","tipo":"caso","q":"Una ITF necesita la clave para acceder al sistema electrónico de la CNBV por el que enviará sus reportes. ¿Qué plazo fija su DCG?","a":"Solicitarla y contar con ella al momento de iniciar operaciones","o":["Solicitarla dentro de los 20 días hábiles posteriores a su registro","Solicitarla y contar con ella al momento de iniciar operaciones","Solicitarla dentro de los 10 días hábiles siguientes a que designe a su Oficial de Cumplimiento","Solicitarla dentro de los 15 días hábiles siguientes a que presente su primer reporte trimestral"],"x":"El art. 98 de la DCG de ITF ordena solicitar la clave a la CNBV y contar con ella al momento de iniciar operaciones, como Bancos (69ª-1). Los veinte días hábiles posteriores al registro son la regla de Transmisores (59ª-1) y Centros cambiarios (56ª Bis).","ref":"DCG ITF art. 98; Transmisores 59ª-1","par":"E049"},{"id":"E071","tema":"2.1.13","tipo":"caso","q":"Un agente relacionado de un transmisor de dinero firma un contrato con una papelería, persona moral, para que ésta entregue a los beneficiarios los recursos que el agente le pase. ¿Qué figura es la papelería según la DCG?","a":"Tercero, por su relación contractual con el agente relacionado","o":["Persona Jurídica Coadyuvante, por ser persona moral que entrega recursos a los beneficiarios","Tercero, por su relación contractual con el agente relacionado","Agente Relacionado del transmisor, por entregar directamente recursos al Usuario Beneficiario","Entidad financiera con contrato con el transmisor, por recibir recursos para entregarlos"],"x":"La 2ª fr. XXXV define al Tercero como la persona física o moral que, por contrato con un Agente Relacionado o una Persona Jurídica Coadyuvante (o con otro transmisor o entidad financiera que tenga contrato con el transmisor), recibe de ellos recursos para entregarlos al beneficiario. Lo tentador es «coadyuvante», pero la Persona Jurídica Coadyuvante pacta directamente con el transmisor (2ª XXVIII). El agente debe firmar con el Tercero un contrato con los mismos requisitos de la 50ª fr. III (inciso k) y el transmisor responde también por los Terceros (50ª fr. I).","ref":"Transmisores 2ª fr. XXVIII y XXXV; 50ª fr. I y fr. III inciso k)"},{"id":"E072","tema":"2.1.13","tipo":"trampa","q":"Un transmisor de dinero evalúa con quiénes firmar contrato para pagar remesas. ¿Cuál de los siguientes NO puede ser Persona Jurídica Coadyuvante?","a":"Otro transmisor de dinero con registro vigente que pagaría los envíos por contrato","o":["Otro transmisor de dinero con registro vigente que pagaría los envíos por contrato","Una sociedad anónima con una cadena de farmacias que pagaría remesas por contrato","Una persona física con actividad empresarial, dueña de una tienda de abarrotes","Una S. de R.L. que vende teléfonos y recibiría por contrato los envíos de remitentes"],"x":"La 2ª fr. XXVIII excluye expresamente de la figura a los transmisores de dinero y a las entidades financieras que, conforme a sus leyes, hacen las operaciones del 81-A Bis y operan por contrato con un transmisor; con ellos la relación se rige por la 50ª fr. II y III Bis. Las otras tres sí encajan: persona moral o persona física con actividad empresarial (secciones I y II, Cap. II, Tít. IV LISR) que pacta recibir o entregar recursos por contrato con el transmisor. Lo tentador es la PFAE: sí puede ser coadyuvante.","ref":"Transmisores 2ª fr. XXVIII; 50ª fr. II y III Bis"},{"id":"E073","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero revisa la honorabilidad de los directivos, empleados, apoderados y factores de una Persona Jurídica Coadyuvante que va a contratar. ¿Qué aspecto menciona la DCG como parte de esa honorabilidad?","a":"Que no hayan sido sentenciados por delitos patrimoniales ni inhabilitados","o":["Que acrediten experiencia previa de al menos dos años en entidades financieras supervisadas","Que no tengan adeudos vencidos registrados en una sociedad de información crediticia","Que hayan aprobado un examen de conocimientos en PLD/FT aplicado por la Comisión","Que no hayan sido sentenciados por delitos patrimoniales ni inhabilitados"],"x":"La 49ª obliga a adoptar procedimientos para asegurar la honorabilidad del personal de agentes y coadyuvantes y menciona, entre otros aspectos, no haber sido sentenciados por delitos patrimoniales ni inhabilitados para ejercer el comercio o desempeñar un empleo, cargo o comisión en el servicio público o en el sistema financiero. El examen de conocimientos existe, pero es una obligación contractual del propio agente o coadyuvante con su personal (50ª fr. III inciso i), no un requisito de honorabilidad ni lo aplica la Comisión. Experiencia e historial crediticio no aparecen.","ref":"Transmisores 49ª, segundo párrafo; 50ª fr. III inciso i)"},{"id":"E074","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero redacta el contrato con un nuevo agente relacionado que atenderá al público en su local. ¿Qué obligaciones debe pactarle, entre otras?","a":"Operar en establecimiento físico, exhibir ahí copia del registro del transmisor y poner su fecha y número en la publicidad","o":["Designar un Oficial de Cumplimiento propio y comunicar su nombramiento a la Comisión en diez días hábiles","Operar en establecimiento físico, exhibir ahí copia del registro del transmisor y poner su fecha y número en la publicidad","Presentar directamente a la Unidad de Inteligencia Financiera los reportes de las operaciones relevantes que celebre","Obtener ante la Comisión su propio registro como transmisor de dinero antes de iniciar operaciones con el público"],"x":"La 50ª fr. III incisos b), c) y d) obliga a pactar con agentes y coadyuvantes que cuenten con establecimientos físicos, exhiban en ellos copia del registro del transmisor e incluyan en su publicidad la fecha y el número de ese registro. El agente no necesita registro propio: exhibe el del transmisor. Tampoco designa Oficial de Cumplimiento ni reporta a la UIF: entrega al transmisor registros y posibles reportes (inciso g). El contrato debe decir que incumplir es causal de rescisión.","ref":"Transmisores 50ª fr. III incisos b), c), d) y g), y último párrafo; LGOAAC art. 86"},{"id":"E075","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero paga remesas a través de una persona moral con la que firmó contrato como Persona Jurídica Coadyuvante. Respecto de los expedientes de los Usuarios que cobran ahí, ¿qué le corresponde al transmisor?","a":"Pactar en el contrato que el intermediario integre el expediente conforme a las políticas del transmisor","o":["Sólo capturar y conservar datos de remitentes y beneficiarios y vigilar lo que el otro no pueda detectar","Integrar él mismo cada expediente, porque esa obligación no puede pactarse con ningún tipo de intermediario","Nada: la responsabilidad por esas operaciones pasa por completo al intermediario que paga a los Usuarios","Pactar en el contrato que el intermediario integre el expediente conforme a las políticas del transmisor"],"x":"Con agentes y coadyuvantes, la 50ª fr. III inciso f) obliga a pactar que integren el expediente de identificación de los Usuarios y cumplan las políticas de identificación y conocimiento del transmisor; el expediente puede quedarse con ellos, siempre a disposición del transmisor y de la Comisión (inciso g, segundo párrafo). El régimen reducido de «sólo capturar y conservar» es de la 50ª fr. II, para cuando se opera a través de otro transmisor o entidad financiera regulados en PLD/FT: es el distractor más tentador. La responsabilidad nunca se traslada: el transmisor responde (50ª fr. I).","ref":"Transmisores 50ª fr. I, fr. III incisos f) y g)","par":"E076"},{"id":"E076","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero paga remesas a través de otro transmisor de dinero, regulado y supervisado en PLD/FT, con el que firmó contrato. Respecto de los expedientes de los Usuarios que cobran ahí, ¿qué le corresponde al transmisor?","a":"Sólo capturar y conservar datos de remitentes y beneficiarios y vigilar lo que el otro no pueda detectar","o":["Sólo capturar y conservar datos de remitentes y beneficiarios y vigilar lo que el otro no pueda detectar","Pactar en el contrato que el intermediario integre el expediente conforme a las políticas del transmisor","Integrar él mismo cada expediente, porque esa obligación no puede pactarse con ningún tipo de intermediario","Nada: la responsabilidad por esas operaciones pasa por completo al intermediario que paga a los Usuarios"],"x":"Cuando opera a través de otro transmisor o de una entidad financiera regulados en PLD/FT, la 50ª fr. II dice que, en expedientes, seguimiento y reportes de inusuales, el transmisor «únicamente» debe capturar y conservar en sus sistemas los datos de remitentes y beneficiarios (inciso a) y dar seguimiento, agrupar y, en su caso, reportar las inusuales que el otro esté imposibilitado a detectar (inciso b). Lo tentador es pactar que el otro integre el expediente con las políticas del transmisor: eso es lo del contrato con agentes y coadyuvantes (fr. III f); al otro transmisor se le pide su RFC y la información en diez días naturales (fr. III Bis). Sigue siendo responsable (fr. I).","ref":"Transmisores 50ª fr. I, II y III Bis","par":"E075"},{"id":"E077","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero opera con 40 agentes relacionados y 3 Personas Jurídicas Coadyuvantes, que a su vez trabajan con Terceros. Mientras la Comisión no emita las disposiciones del art. 57 de la Ley, ¿qué aviso debe presentar y cuándo?","a":"Aviso a la Comisión con agentes, coadyuvantes y sus Terceros, en los primeros 15 días hábiles del año","o":["Aviso a la UIF con la lista de agentes y coadyuvantes, dentro de los primeros 15 días hábiles del año","Aviso a la Comisión con agentes, coadyuvantes y sus Terceros, en los primeros 15 días hábiles del año","Aviso a la Comisión sólo de agentes y coadyuvantes, sin Terceros, dentro de 10 días hábiles de cada contrato","Aviso a la UIF con agentes, coadyuvantes y Terceros, dentro de los 15 días hábiles siguientes a cada mes"],"x":"La 50ª Bis obliga a remitir a la Comisión (CNBV) un aviso con la información de agentes, coadyuvantes, otros transmisores y entidades financieras con contrato, y de los Terceros con que operen. La Transitoria Quinta de 2019 dice que se sigue presentando dentro de los primeros quince días hábiles del año, con el formato de 2015, hasta que la Comisión emita las disposiciones del art. 57. Lo tentador es la UIF: no hay un reporte de agentes ante ella. Los 15 días hábiles tras el mes son del reporte de transferencias internacionales (24ª).","ref":"Transmisores 50ª Bis; Transitoria Quinta (DOF 20-mar-2019)"},{"id":"E078","tema":"2.1.13","tipo":"caso","q":"Un Usuario Remitente persona física envía con un transmisor de dinero, en una sola operación, el equivalente a 2,500 USD. Además de los datos de la transferencia, ¿qué debe recabar el transmisor?","a":"Datos como nombre, nacionalidad, fecha y país de nacimiento, domicilio y número de identificación, sin copias","o":["Los datos de identificación del Usuario y, además, copia de la identificación oficial de las personas físicas que intervengan","El expediente completo, integrado antes de operar, con comprobante de domicilio si no coincide con la identificación","Datos como nombre, nacionalidad, fecha y país de nacimiento, domicilio y número de identificación, sin copias","Ninguno adicional: el siguiente escalón de identificación del transmisor inicia en 5,000 USD por operación"],"x":"La 4ª fr. II aplica a Operaciones individuales «igual o superior» a 500 e «inferior a» 3,000 USD: datos de identificación de la persona física (nombre, país de nacimiento, nacionalidad, fecha de nacimiento, domicilio desglosado y número de identificación oficial), recabados al momento y conservados en sus sistemas, sin copias. La copia de la identificación es del escalón de 3,000 a menos de 5,000 (fr. III) y el expediente completo, desde 5,000 (fr. IV). El tipo de cambio es el FIX del día hábil bancario anterior.","ref":"Transmisores 4ª fr. II, III y IV","par":"E079"},{"id":"E079","tema":"2.1.13","tipo":"caso","q":"Un Usuario Remitente persona física envía con un transmisor de dinero, en una sola operación, el equivalente a 4,000 USD. Además de los datos de la transferencia, ¿qué debe recabar el transmisor?","a":"Los datos de identificación del Usuario y, además, copia de la identificación oficial de las personas físicas que intervengan","o":["Datos como nombre, nacionalidad, fecha y país de nacimiento, domicilio y número de identificación, sin copias","El expediente completo, integrado antes de operar, con comprobante de domicilio si no coincide con la identificación","Ninguno adicional: el siguiente escalón de identificación del transmisor inicia en 5,000 USD por operación","Los datos de identificación del Usuario y, además, copia de la identificación oficial de las personas físicas que intervengan"],"x":"La 4ª fr. III aplica a Operaciones individuales «igual o superior» a 3,000 e «inferior a» 5,000 USD: además de los datos de las fr. I y II, copia de la identificación oficial de las personas físicas que intervengan. El expediente completo, previo a la operación, es desde 5,000 USD (fr. IV); por eso el distractor más tentador es el del expediente. Sólo los datos sin copias corresponden al escalón de 500 a menos de 3,000 (fr. II).","ref":"Transmisores 4ª fr. II, III y IV","par":"E078"},{"id":"E080","tema":"2.1.13","tipo":"caso","q":"Una persona moral envía con un transmisor de dinero, en una sola operación, el equivalente a 1,800 USD; acude su representante. Además de los datos de la transferencia, ¿qué debe recabar el transmisor?","a":"Denominación, RFC, FEA si la tiene, domicilio, nacionalidad y datos del representante","o":["Copia del acta constitutiva, de la cédula de identificación fiscal y de los poderes del representante","Denominación, RFC, FEA si la tiene, domicilio, nacionalidad y datos del representante","Estructura accionaria y declaración del representante sobre quiénes son los propietarios reales","Sólo denominación y RFC; el representante se identifica hasta que la operación llega a 5,000 USD"],"x":"En el escalón de 500 a menos de 3,000 USD, la 4ª fr. II inciso B pide de la persona moral: denominación, RFC con homoclave (y número de identificación fiscal extranjero, en su caso), número de serie de FEA cuando cuente con ella, domicilio, nacionalidad y los datos de la persona que acuda en su representación, en los términos del inciso A. Son datos, sin copias. Acta, cédula fiscal, poderes, estructura accionaria y propietarios reales son del expediente completo de 5,000 USD o más (fr. IV inciso B).","ref":"Transmisores 4ª fr. II inciso B; fr. IV inciso B"},{"id":"E081","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero paga a un Usuario Beneficiario el equivalente a 6,000 USD y le entrega los recursos en su domicilio. El domicilio declarado no coincide con el de su identificación. Según la regla de la 4ª para esa forma de entrega, ¿qué se considera comprobante de domicilio?","a":"El documento en que conste la recepción de los recursos en el domicilio del beneficiario","o":["Copia de un comprobante documental de domicilio, conforme a la regla general del numeral iii","La comprobación que prevean las DCG de la entidad financiera pagadora, que conservará el comprobante","Ninguno: en el pago de remesas la DCG no exige comprobar el domicilio del Usuario Beneficiario","El documento en que conste la recepción de los recursos en el domicilio del beneficiario"],"x":"La 4ª fr. IV inciso A, subinciso b), numeral iii exige comprobante sólo si el domicilio declarado no coincide con el de la identificación o ésta no lo trae, y da reglas propias del transmisor: si los recursos se entregan en el domicilio del beneficiario, se considera comprobante el documento en que conste la recepción en ese domicilio. El comprobante documental general (recibos de no más de tres meses, contrato de arrendamiento, etc.) es la regla para entregas por agente o coadyuvante desde 5,000 USD; con entidad financiera, rigen las DCG de ésta.","ref":"Transmisores 4ª fr. IV inciso A, subinciso b), numeral iii","par":"E082"},{"id":"E082","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero paga a un Usuario Beneficiario el equivalente a 6,000 USD en el local de uno de sus agentes relacionados. El domicilio declarado no coincide con el de su identificación. Según la regla de la 4ª para esa forma de entrega, ¿cómo se comprueba el domicilio?","a":"Copia de un comprobante documental de domicilio, conforme a la regla general del numeral iii","o":["El documento en que conste la recepción de los recursos en el domicilio del beneficiario","La comprobación que prevean las DCG de la entidad financiera pagadora, que conservará el comprobante","Copia de un comprobante documental de domicilio, conforme a la regla general del numeral iii","Ninguno: en el pago de remesas la DCG no exige comprobar el domicilio del Usuario Beneficiario"],"x":"La 4ª fr. IV inciso A, subinciso b), numeral iii dice que en entregas a través de agentes relacionados o coadyuvantes por montos iguales o superiores al equivalente a 5,000 USD, la comprobación se hace en los términos del primer párrafo del numeral: copia de un documento que acredite el domicilio (recibos de servicios o estados de cuenta de no más de tres meses, contrato de arrendamiento vigente, inscripción en el RFC, etc.). La constancia de recepción es para entregas en el domicilio del beneficiario, y remitir a las DCG de la otra entidad, para entregas por entidad financiera con contrato.","ref":"Transmisores 4ª fr. IV inciso A, subinciso b), numeral iii","par":"E081"},{"id":"E083","tema":"2.1.13","tipo":"caso","q":"Un centro cambiario contrata a un transmisor de dinero para enviar al extranjero el equivalente a 8,000 USD. Además del expediente de persona moral, ¿qué debe hacer el transmisor por tratarse de un centro cambiario?","a":"Asentar los datos de su registro ante la Comisión y obtener su constancia de registro","o":["Asentar los datos de su registro ante la Comisión y obtener su constancia de registro","Aplicarle el régimen simplificado del Anexo 1, siempre que lo clasifique con Grado de Riesgo bajo","Recabar la autorización de la Secretaría para operar divisas, en lugar de su acta constitutiva","Ninguna medida adicional: al ser sujeto obligado, basta su declaración de que cumple sus propias DCG"],"x":"La 4ª fr. IV inciso B ordena asentar en el expediente del Usuario que sea centro cambiario, otro transmisor o SOFOM los datos del registro otorgado por la Comisión o la CONDUSEF, tomados de sus registros públicos; la 22ª añade identificar número, monto y frecuencia de sus operaciones y obtener su constancia de registro (arts. 81-B u 87-B). El distractor más tentador es el Anexo 1: centros cambiarios y transmisores no están en esa lista (sí las casas de cambio y las SOFOM), así que no tienen régimen simplificado.","ref":"Transmisores 4ª fr. IV incisos B y D; 22ª; Anexo 1"},{"id":"E084","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero envía al extranjero, a solicitud de un Usuario Remitente que paga en efectivo, el equivalente a 400 USD. ¿Qué información debe acompañar a la transferencia?","a":"El nombre y el domicilio del remitente, y el número de referencia de la transferencia","o":["Sólo el número de referencia; nombre y domicilio se quedan en los registros del transmisor","Nombre, CURP y fecha de nacimiento del remitente, junto con copia de su identificación oficial","Ninguna, porque el envío es menor al umbral de 1,000 USD del reporte de transferencias internacionales","El nombre y el domicilio del remitente, y el número de referencia de la transferencia"],"x":"Para transferencias internacionales o nacionales en moneda extranjera, la 4ª fr. I inciso A, segundo párrafo, obliga a acompañar a la transferencia la información de los numerales i, ii y iii: nombre sin abreviaturas, domicilio y número de referencia; la cuenta del remitente viaja sólo si se usó para procesarla (aquí pagó en efectivo). Rige con independencia del monto. Los 1,000 USD son del reporte mensual (24ª), no de la información que acompaña al envío; la copia de identificación es del escalón de 3,000 USD.","ref":"Transmisores 4ª fr. I inciso A, primer y segundo párrafos; 24ª"},{"id":"E085","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero paga en su ventanilla a un Usuario Beneficiario persona física una transferencia nacional en pesos equivalente a 300 USD. ¿Qué datos debe recabar y conservar?","a":"El nombre del ordenante incluido en la transferencia y el del beneficiario, tomado de su identificación","o":["Ninguno, porque la operación es menor a 500 USD, donde empieza la identificación del transmisor","El nombre del ordenante incluido en la transferencia y el del beneficiario, tomado de su identificación","Nombre, domicilio y ocupación del beneficiario, y copia de su identificación oficial vigente","Nombre y domicilio del ordenante, que debe confirmar directamente con el transmisor que le envió los recursos"],"x":"Cuando el transmisor funge como receptor, la 4ª fr. I inciso B pide, con independencia del monto, el nombre completo de quien ordena «que vaya incluido en la transferencia» y el del Usuario Beneficiario, obtenido, cuando sea el caso, de su identificación oficial al momento de la operación. Lo tentador es pensar que bajo 500 USD no se recaba nada: esos 500 son el inicio del escalón de la fr. II. Cuenta o referencia rastreable del ordenante y «tantos datos como» se transmitan sólo se suman en transferencias internacionales o nacionales en moneda extranjera.","ref":"Transmisores 4ª fr. I inciso B, primer y segundo párrafos"},{"id":"E086","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero recibe del extranjero una transferencia para pagar en México que llega sin el nombre del ordenante. ¿Qué prevé su DCG?","a":"Aplicar los criterios de riesgo de su Manual para ejecutarla, rechazarla o suspenderla","o":["Rechazarla siempre y devolver de inmediato los recursos al transmisor extranjero que la envió","Pagarla sin más, porque completar esa información corresponde sólo a la entidad que la envía","Aplicar los criterios de riesgo de su Manual para ejecutarla, rechazarla o suspenderla","Suspenderla y presentar, en todos los casos, el reporte de Operación Inusual de 24 horas"],"x":"La 4ª fr. I inciso B, último párrafo, exige políticas en el Manual para identificar, al recibirlas o después, las transferencias sin la información de los numerales i (nombre del ordenante; cuenta o referencia rastreable), y criterios basados en riesgos para decidir si es procedente ejecutarlas, rechazarlas o suspenderlas, con las acciones de seguimiento. Además, la 27ª fr. XI la cuenta como circunstancia de inusualidad. No hay regla de rechazo automático ni de reporte de 24 horas en todos los casos: éste procede ante sospecha fundada (4ª fr. I; 30ª).","ref":"Transmisores 4ª fr. I inciso B, último párrafo; 27ª fr. XI"},{"id":"E087","tema":"2.1.13","tipo":"cifra","q":"Un transmisor de dinero pagó hoy una transferencia a uno de sus Usuarios. ¿En qué plazo debe cargar en sus sistemas los datos de esa transferencia e incorporarlos a su sistema de alertas?","a":"A más tardar dentro de los dos días hábiles siguientes a la operación","o":["A más tardar dentro de los dos días hábiles siguientes a la operación","A más tardar dentro de los dos días naturales siguientes a la operación","Dentro de un plazo que no exceda de diez días naturales desde la operación","Dentro de los quince días hábiles siguientes al último día hábil del mes"],"x":"La 4ª fr. I obliga a los transmisores ordenantes o receptores a cargar en los sistemas de la 40ª, a más tardar dentro de los dos días hábiles siguientes a la operación, la información de sus propios Usuarios sobre cada transferencia, e incorporarla al sistema de alertas de la 16ª. Son días hábiles, no naturales. Los diez días naturales son el plazo máximo que tienen agentes, coadyuvantes y otros transmisores para entregar información al transmisor (50ª fr. III g y III Bis c); los quince días hábiles son del reporte de transferencias internacionales (24ª).","ref":"Transmisores 4ª fr. I; 50ª fr. III inciso g); 24ª"},{"id":"E088","tema":"2.1.13","tipo":"caso","q":"Un transmisor de dinero paga en México a una persona física una remesa internacional equivalente a 1,500 USD. En el reporte de transferencias internacionales, ¿qué datos del Usuario Beneficiario debe especificar?","a":"Nombre completo, fecha de nacimiento y, si le es aplicable, CURP o RFC","o":["Nombre completo, domicilio y ocupación, sin ningún dato fiscal ni de población","Nombre completo, fecha de nacimiento y, si le es aplicable, CURP o RFC","Sólo su nombre completo, porque los demás datos los aporta el Usuario Remitente","Nombre, país de nacimiento y copia de su identificación oficial vigente"],"x":"La 25ª, para transferencias internacionales de remesas iguales o superiores a 1,000 USD, pide especificar en el reporte de la 24ª, si el beneficiario es persona física: nombre y apellidos sin abreviaturas, fecha de nacimiento y, si le es aplicable conforme a la 4ª o 4ª Bis, CURP y/o RFC, número de identificación fiscal y país, o FEA; además, lo que pida el formato. Si es persona moral: denominación, giro y RFC. Los reportes no llevan copias de documentos.","ref":"Transmisores 24ª; 25ª fr. I"},{"id":"E089","tema":"2.1.13","tipo":"caso","q":"Un usuario persona física de nacionalidad mexicana quiere enviar dinero desde la aplicación de un transmisor de dinero que identifica a distancia, pero su dispositivo no entrega la ubicación por GPS ni permite obtenerla por su dirección IP. ¿Puede operar de forma no presencial?","a":"No: sin Geolocalización no debe celebrarse la operación no presencial","o":["Sí, siempre que el monto no exceda de 5,000 USD en el mes calendario","Sí, si el usuario acepta esa circunstancia en los Términos y Condiciones","Sí, y la Geolocalización se recaba en su siguiente operación a distancia","No: sin
