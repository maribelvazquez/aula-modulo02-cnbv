<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aula del Repaso · Módulo 2</title>
<meta name="description" content="Portal de estudio del Área 2 del temario CNBV PLD/FT, agosto 2026: una herramienta por grupo de temas, el simulacro mixto y la biblioteca de fuentes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* PLANTILLA · Portal del Aula 360Educa (molde del Aula del Módulo 1, oct-2026). Motor fijo: el contenido vive en <script id="aula">.
   Layout: banda carbón de marca arriba, columna única sobre crema; entradas numeradas por subárea; biblioteca de fuentes en renglones; pie carbón.
   360Educa no tiene tema oscuro: la página se queda en crema en cualquier tema del visor. */
:root{
  --crema:#faf5ec; --blanco:#ffffff; --negro:#1b1b1e; --carbon:#393e41;
  --gris:#747975; --rule:#dfdede; --verde:#64c27b; --verde-claro:#87d895;
  --tinte:rgba(100,194,123,.14); --apagado:#efeae0;
  --display:Montserrat, Arial, sans-serif; --sans:Inter, Arial, sans-serif;
  --r-sm:6px; --r-md:12px; --r-lg:20px; --pill:999px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--crema);color:var(--negro);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0}
a{color:var(--negro)}
a:focus-visible{outline:3px solid var(--carbon);outline-offset:3px;border-radius:var(--r-md)}
.wrap{max-width:860px;margin:0 auto;padding-inline:20px}

/* Encabezado */
.top{background:var(--carbon);color:var(--blanco);padding-block:28px 40px}
.marcas{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.marcas span+span::before{content:"·";margin-right:14px;color:var(--verde-claro)}
.eyebrow{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:40px 0 10px;color:#d9dbdc}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,52px);line-height:1.08;margin:0;text-wrap:balance}
h1 em{font-style:normal;display:inline-block;background:var(--verde);color:var(--negro);padding:0 .22em;border-radius:var(--r-sm)}
.lede{max-width:60ch;margin:16px 0 0;color:#eceeef;font-size:17px}
.acceso{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:6px 14px;border:1px solid rgba(255,255,255,.35);border-radius:var(--pill);font-size:13px;color:#eceeef}
.acceso svg{flex:none}
.membrete{height:6px;background:var(--verde-claro)}

/* Secciones */
main{padding-block:48px 64px;display:grid;gap:64px}
.sec-head{display:grid;gap:6px;margin-bottom:24px}
h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.2;margin:0;text-wrap:balance}
.sec-head p{margin:0;max-width:62ch;color:var(--carbon)}

.grupo{display:grid;gap:12px}
.grupo+.grupo{margin-top:32px}
.grupo h3{display:flex;align-items:baseline;gap:10px;margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--carbon)}
.grupo h3 b{font-weight:800;background:var(--verde);color:var(--negro);padding:2px 9px;border-radius:var(--pill);letter-spacing:.04em;flex:none}

/* Entradas */
.entrada{display:grid;grid-template-columns:112px 1fr;background:var(--blanco);border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden;text-decoration:none;color:var(--negro);transition:border-color .15s, transform .15s}
a.entrada:hover{border-color:var(--carbon);transform:translateY(-1px)}
.num{background:var(--verde);display:flex;align-items:flex-start;justify-content:center;padding:20px 8px;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-align:center}
.num.largo{font-size:19px}
.cuerpo{padding:18px 20px;display:grid;gap:4px;min-width:0}
.cuerpo h4{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.25;margin:0;text-wrap:balance}
.fuente{font-size:13px;color:var(--carbon);font-weight:500}
.que{font-size:15px;margin:2px 0 0}
.abrir{margin-top:8px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-underline-offset:3px}
.entrada.pronto{background:transparent;border-style:dashed}
.entrada.pronto .num{background:var(--apagado);color:var(--carbon)}
.chip{justify-self:start;margin-top:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:var(--pill);border:1px solid var(--carbon);color:var(--carbon)}

/* Biblioteca */
.guia{background:var(--blanco);border:1px solid var(--rule);border-radius:var(--r-md);padding:18px 20px;display:grid;gap:10px;font-size:15px}
.guia p{margin:0}
.leyenda{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;color:var(--carbon)}
.leyenda span{display:inline-flex;gap:8px;align-items:center}
.lista{margin-top:20px;border-top:1px solid var(--rule)}
.doc{display:grid;grid-template-columns:96px 1fr;gap:16px;padding-block:18px;border-bottom:1px solid var(--rule)}
.tag{justify-self:start;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.04em;padding:5px 10px;border-radius:var(--r-sm);background:var(--verde);color:var(--negro);white-space:nowrap}
.tag.guia-tag{background:var(--blanco);border:1.5px solid var(--carbon)}
.doc-body{min-width:0;display:grid;gap:4px}
.doc-body h4{margin:0;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--carbon);font-variant-numeric:tabular-nums}
.nonorma{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px;border:1px solid var(--carbon);border-radius:var(--pill);padding:1px 8px}
.doc-body p{margin:0;font-size:15px}
.doc-body .ext{font-size:14px;font-weight:600;text-underline-offset:3px;justify-self:start;margin-top:2px}
.pend{font-size:13px;color:var(--carbon);font-style:italic}

/* Pie */
footer{background:var(--carbon);color:#eceeef;padding-block:32px;font-size:13px}
footer .wrap{display:grid;gap:10px}
.firma{font-family:var(--display);font-weight:800;font-size:18px;color:var(--blanco);letter-spacing:.02em}
.firma small{font-family:var(--sans);font-weight:500;font-size:13px;color:#d9dbdc;letter-spacing:0;margin-left:6px}
footer p{margin:0;max-width:70ch}

@media (max-width:560px){
  .entrada{grid-template-columns:1fr}
  .num{justify-content:flex-start;padding:14px 20px 12px;font-size:24px}
  .num.largo{font-size:19px}
  .doc{grid-template-columns:1fr;gap:10px}
  .grupo h3{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="marcas" aria-label="Marcas" id="marcas"></div>

  </div>
</header>
<div class="membrete" aria-hidden="true"></div>

<main class="wrap">
  <section aria-labelledby="t-temas">
    <div class="sec-head">
      <h2 id="t-temas"></h2>
      <p id="temas-intro"></p>
    </div>
    <div id="entradas"></div>
  </section>

  <section aria-labelledby="t-bib" id="bib">
    <div class="sec-head">
      <h2 id="t-bib">Biblioteca</h2>
    </div>
    <div class="guia" id="guia"></div>
    <div class="lista" id="biblioteca"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="firma" id="firma"></div>
    <p id="pie"></p>
  </div>
</footer>

CG, sujeto por sujeto, con Bancos de eje (43ª a 46ª)","q":"Quién integra el Comité, cuándo sesiona y qué dictamina; qué sujetos pueden no tenerlo y quién ejerce entonces sus funciones.","href":"m2-h4-ccc-oficial/index.html#t2-1-9"},{"n":"2.1.10","t":"Oficial de cumplimiento","f":"H4 · Las 12 DCG, sujeto por sujeto, con Bancos de eje (47ª y 48ª)","q":"Cómo se designa, certifica y avisa al Oficial de Cumplimiento, y qué sujetos no lo tienen o usan otra figura.","href":"m2-h4-ccc-oficial/index.html#t2-1-10"},{"n":"2.1.11","t":"Obligaciones de los modelos novedosos","f":"H5 · LRITF arts. 80 y 86, y las DCG","q":"Qué es un modelo novedoso y por qué no es una ITF: su autorización temporal y la obligación PLD que le aplica.","href":"m2-h5-novedosos-cambios-itf/index.html#t2-1-11"},{"n":"2.1.12","t":"Centros cambiarios","f":"H5 · LGOAAC arts. 81-A y 95 Bis · DCG de centros cambiarios","q":"Por qué un centro cambiario no es una casa de cambio chica, y en qué se aparta su DCG de la de Bancos.","href":"m2-h5-novedosos-cambios-itf/index.html#t2-1-12"},{"n":"2.1.13","t":"Transmisores de dinero","f":"H5 · LGOAAC art. 81-A Bis · DCG de transmisores de dinero","q":"Quién ayuda al transmisor (agente relacionado y persona jurídica coadyuvante) y en qué se aparta su DCG de la de Bancos.","href":"m2-h5-novedosos-cambios-itf/index.html#t2-1-13"},{"n":"2.1.14","t":"Instituciones de tecnología financiera","f":"H5 · LRITF art. 58 · DCG de las ITF","q":"IFC e IFPE, sólo Clientes y por artículos: en qué se aparta la DCG de las ITF de la de Bancos.","href":"m2-h5-novedosos-cambios-itf/index.html#t2-1-14"},{"n":"2.1.15","t":"Sanciones","f":"H6 · LIC, LGOAAC y LRITF","q":"Qué ley sanciona a cada sujeto, con cuánto y con qué reducciones; las sanciones financieras no son las de la LFPIORPI.","href":"m2-h6-sanciones-pr-plazos/index.html#t2-1-15"},{"n":"2.1.16","t":"Propietario real","f":"H6 · Las 12 DCG y los Lineamientos de propietario real","q":"Quién es el propietario real: las DCG obligan y lo <script>
(function(){
const A = JSON.parse(document.getElementById("aula").textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const flecha = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

$("marcas").innerHTML = (A.marcas||["GMC360","360EDUCA"]).map(m=>`<span>${esc(m)}</span>`).join("");
$("eyebrow").textContent = A.eyebrow||"";
$("h1").innerHTML = `${esc(A.h1_antes||"")} <em>${esc(A.h1_resaltado||"")}</em>`;
$("lede").textContent = A.lede||"";
if(A.acceso) $("acceso").querySelector("span").textContent = A.acceso; else $("acceso").hidden = true;
$("t-temas").textContent = A.temas_titulo||"";
$("temas-intro").textContent = A.temas_intro||"";

const entrada = (x, boton) => {
  const url = x.href||"";
  const dentro = `<div class="num${String(x.n).length>6?" largo":""}">${esc(x.n)}</div>
    <div class="cuerpo">
      <h4>${esc(x.t)}</h4>
      ${x.f?`<span class="fuente">${esc(x.f)}</span>`:""}
      ${x.q?`<p class="que">${esc(x.q)}</p>`:""}
      ${url ? `<span class="abrir">${esc(boton)} ${flecha}</span>` : `<span class="chip">${esc(x.pronto||"Próximamente")}</span>`}
    </div>`;
  return url
    ? `<a class="entrada" href="${esc(url)}">${dentro}</a>`
    : `<div class="entrada pronto" aria-disabled="true">${dentro}</div>`;
};

$("entradas").innerHTML = (A.grupos||[]).map(g => `
  <div class="grupo">
    <h3><b>${esc(g.clave)}</b>${esc(g.nombre)}</h3>
    ${g.temas.map(x => entrada(x, A.boton_herramienta||"Abrir herramienta")).join("")}
  </div>`).join("") + (A.cierre ? `
  <div class="grupo">
    <h3><b>${esc(A.cierre.clave)}</b>${esc(A.cierre.nombre)}</h3>
    ${entrada(A.cierre.entrada, A.boton_simulacro||"Hacer el simulacro")}
  </div>` : "");

const B = A.biblioteca;
if(!B){ $("bib").hidden = true; }
else {
  $("t-bib").textContent = B.titulo||"Biblioteca";
  $("guia").innerHTML = (B.guia||[]).map(p=>`<p>${esc(p)}</p>`).join("") +
    `<div class="leyenda"><span><b class="tag">ABC</b> ${esc(B.leyenda_norma||"Norma: obliga")}</span><span><b class="tag guia-tag">ABC</b> ${esc(B.leyenda_guia||"Guía, estándar o diagnóstico: orienta, no obliga")}</span></div>`;
  $("biblioteca").innerHTML = (B.fuentes||[]).map(d => `<div class="doc">
      <b class="tag${d.norma ? "" : " guia-tag"}">${esc(d.e)}</b>
      <div class="doc-body">
        <h4>${esc(d.nombre)}</h4>
        <div class="meta"><span>${esc(d.fecha)}</span>${d.norma ? "" : '<span class="nonorma">No es norma</span>'}</div>
        <p>${esc(d.uso)}</p>
        ${d.url ? `<a class="ext" href="${esc(d.url)}" target="_blank" rel="noopener">Texto oficial ↗</a>` : `<span class="pend">${esc(B.sin_liga||"Liga oficial por confirmar")}</span>`}
      </div>
    </div>`).join("");
}
const P = A.pie||{};
$("firma").innerHTML = `${esc(P.firma||"360EDUCA")}<small>${esc(P.small||"by GMC360")}</small>`;
$("pie").textContent = P.texto||"";
})();
</script>
