Recepción de recursos destinados a un Desarrollo Inmobiliario","Intermediación en la transmisión de la propiedad de inmuebles","Fe pública en la transmisión de derechos reales sobre inmuebles","Constitución de derechos personales de uso o goce de inmuebles"],"x":"La fr. XV es la constitución de derechos personales de uso o goce de bienes inmuebles (en la práctica, el arrendamiento). La intermediación inmobiliaria es la fr. V, el Desarrollo Inmobiliario la V Bis y la fe pública la XII.","ref":"Art. 17, fr. XV"},{"id":"G014","tema":"2.2.1","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. V Bis del art. 17, adicionada en 2025?","a":"Recepción de recursos para un Desarrollo Inmobiliario destinado a venta o renta","o":["Construcción o desarrollo habitual de bienes inmuebles con operaciones de compra o venta","Constitución de derechos personales de uso o goce de bienes inmuebles","Realización de avalúos sobre inmuebles por parte de corredores públicos","Recepción de recursos para un Desarrollo Inmobiliario destinado a venta o renta"],"x":"La fr. V Bis (DOF 16-jul-2025) es la recepción de recursos que se destinen a un Desarrollo Inmobiliario cuya finalidad sea su venta o renta. La construcción o desarrollo con compraventa ya estaba en la fr. V; ambas avisan desde 8 025 veces el valor diario de la UMA.","ref":"Art. 17, fr. V Bis"},{"id":"G015","tema":"2.2.1","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. XVI del art. 17?","a":"Intercambio de activos virtuales por sujetos distintos de las Entidades Financieras","o":["Emisión de tarjetas prepagadas y monederos por sujetos distintos de las Entidades Financieras","Intercambio de activos virtuales por sujetos distintos de las Entidades Financieras","Emisión de cheques de viajero por sujetos distintos de las Entidades Financieras","Traslado o custodia de dinero o valores, salvo cuando interviene el Banco de México"],"x":"La fr. XVI es el ofrecimiento habitual y profesional de intercambio de activos virtuales por sujetos distintos de las Entidades Financieras. Tarjetas y monederos son la fr. II; cheques de viajero, la III; traslado de valores, la X.","ref":"Art. 17, fr. XVI"},{"id":"G016","tema":"2.2.1","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. IV del art. 17?","a":"Ofrecimiento de mutuos, garantías, préstamos o créditos por no financieros","o":["Emisión de tarjetas de servicios o de crédito por sujetos no financieros","Ofrecimiento de mutuos, garantías, préstamos o créditos por no financieros","Manejo de cuentas bancarias, de ahorro o de valores de clientes por profesionistas independientes","Otorgamiento ante notario de mutuos con acreedor no financiero"],"x":"La fr. IV es el ofrecimiento habitual o profesional de mutuo, garantía, préstamos o créditos, con o sin garantía, por sujetos distintos de las Entidades Financieras. El mutuo ante notario es la fr. XII, apartado A, inciso e), que es otra actividad: la fe pública.","ref":"Art. 17, fr. IV"},{"id":"G017","tema":"2.2.1","tipo":"caso","q":"Una agencia vende yates y lanchas nuevas de forma habitual. ¿En qué fracción del art. 17 encuadra su actividad?","a":"Fr. VIII","o":["Fr. VIII","Fr. VI","Fr. IX","Fr. XIV"],"x":"La fr. VIII cubre la comercialización o distribución habitual o profesional de vehículos nuevos o usados, aéreos, marítimos o terrestres. La XIV es comercio exterior (despacho aduanal) y la IX, blindaje.","ref":"Art. 17, fr. VIII"},{"id":"G018","tema":"2.2.1","tipo":"caso","q":"Una casa de subastas remata pinturas y esculturas de manera habitual. ¿En qué fracción del art. 17 encuadra?","a":"Fr. VII","o":["Fr. XI","Fr. XIV","Fr. VII","Fr. VI"],"x":"La fr. VII es la subasta o comercialización habitual o profesional de obras de arte. La VI es para metales, piedras preciosas, joyas y relojes; la XIV, inciso e), trata obras de arte sólo en despacho aduanal.","ref":"Art. 17, fr. VII"},{"id":"G019","tema":"2.2.1","tipo":"caso","q":"Una empresa privada transporta en camiones blindados el efectivo de comercios y lo resguarda en su bóveda. ¿En qué fracción del art. 17 encuadra?","a":"Fr. X","o":["Fr. XI","Fr. IX","Fr. IV","Fr. X"],"x":"La fr. X es la prestación habitual o profesional de servicios de traslado o custodia de dinero o valores (salvo cuando intervienen el Banco de México o las instituciones para el depósito de valores). Que use camiones blindados no la vuelve fr. IX, que es prestar el servicio de blindaje.","ref":"Art. 17, fr. X"},{"id":"G020","tema":"2.2.1","tipo":"caso","q":"Un contador independiente, sin relación laboral con su cliente, maneja en nombre de éste sus cuentas bancarias y de valores. ¿En qué fracción del art. 17 encuadra?","a":"Fr. XI","o":["Fr. IV","Fr. XI","Fr. X","Fr. XII"],"x":"La fr. XI, inciso c), cubre al profesionista independiente que, en nombre y representación del cliente, maneja cuentas bancarias, de ahorro o de valores. La XII es fe pública (notarios, corredores, servidores con fe pública y facilitadores).","ref":"Art. 17, fr. XI, inciso c)"},{"id":"G021","tema":"2.2.1","tipo":"caso","q":"Un centro de apuestas con permiso de la Secretaría de Gobernación vende fichas y paga premios a sus jugadores. ¿En qué fracción del art. 17 encuadra?","a":"Fr. I","o":["Fr. II","Fr. I","Fr. XIII","Fr. XVI"],"x":"La fr. I cubre los juegos con apuesta, concursos o sorteos de organismos descentralizados o con permiso de Gobernación: venta de boletos o fichas y pago de premios. La II es de tarjetas y monederos; la XVI, de activos virtuales.","ref":"Art. 17, fr. I"},{"id":"G022","tema":"2.2.1","tipo":"caso","q":"Una empresa que no es Entidad Financiera emite y comercializa monederos electrónicos recargables. ¿En qué fracción del art. 17 encuadra?","a":"Fr. II","o":["Fr. III","Fr. II","Fr. XVI","Fr. IV"],"x":"La fr. II, inciso c), cubre los instrumentos de almacenamiento de valor monetario emitidos o comercializados por sujetos distintos de las Entidades Financieras. Los activos virtuales (fr. XVI) son otra figura: la ley excluye de ellos la moneda de curso legal.","ref":"Art. 17, fr. II, inciso c)"},{"id":"G023","tema":"2.2.1","tipo":"caso","q":"Una persona facilitadora privada, en términos de la Ley General de Mecanismos Alternativos de Solución de Controversias, formaliza un convenio de transmisión de un inmueble. ¿En qué parte del art. 17 encuadra?","a":"Fr. XII, apartado D","o":["Fr. XI","Fr. XII, apartado A","Fr. XII, apartado D","Fr. XII, apartado C"],"x":"El apartado D de la fr. XII (nuevo 2025) incorpora a las personas facilitadoras públicas y privadas, con las operaciones previstas en el apartado A. El apartado A es el de los notarios; el C, el de los servidores públicos con fe pública.","ref":"Art. 17, fr. XII, apartado D"},{"id":"G024","tema":"2.2.1","tipo":"caso","q":"Una joyería vende a un cliente un reloj por 1 000 veces el valor diario de la UMA, pagado por transferencia. ¿Qué obligación nace?","a":"Identificar al cliente, sin presentar Aviso","o":["Ninguna, porque no alcanza el umbral de identificación","Presentar Aviso a la SHCP, sin necesidad de identificar","Identificar al cliente, sin presentar Aviso","Identificar al cliente y presentar Aviso a la SHCP"],"x":"En la fr. VI se identifica desde 805 y se avisa desde 1 605 veces el valor diario de la UMA; 1 000 está en medio. Identificar no es avisar: aquí sólo nace la identificación.","ref":"Art. 17, fr. VI"},{"id":"G025","tema":"2.2.1","tipo":"caso","q":"Una agencia vende una camioneta en 7 000 veces el valor diario de la UMA, pagada por transferencia. ¿Qué obligación nace?","a":"Identificar al cliente y presentar Aviso a la SHCP","o":["Identificar al cliente y presentar Aviso a la SHCP","Sólo identificar al cliente, porque no llega a 8 025 veces","Sólo presentar Aviso, porque supera 3 210 veces la UMA","Ninguna, porque el pago no se hizo en efectivo"],"x":"En la fr. VIII se identifica desde 3 210 y se avisa desde 6 420 veces el valor diario de la UMA; 7 000 supera ambos. El 8 025 es el umbral de inmuebles, no de vehículos, y la forma de pago no elimina las obligaciones del art. 17.","ref":"Art. 17, fr. VIII"},{"id":"G026","tema":"2.2.1","tipo":"trampa","q":"Un arrendador celebra un contrato de un solo mes con renta de exactamente 1 605 veces el valor diario de la UMA. ¿Qué obligación nace por la fr. XV del art. 17?","a":"Ninguna, porque no es superior a 1 605 veces la UMA","o":["Presentar Aviso, porque toda renta de inmuebles se avisa","Identificar al arrendatario, porque iguala el umbral","Ninguna, porque no es superior a 1 605 veces la UMA","Identificar al arrendatario y presentar Aviso a la SHCP"],"x":"La fr. XV fija la identificación para un valor mensual «superior a» 1 605 veces el valor diario de la UMA: igualarlo no basta. El Aviso, en cambio, es «igual o superior» a 3 210. Al ser un solo mes, tampoco opera la acumulación de seis meses del penúltimo párrafo del art. 17.","ref":"Art. 17, fr. XV"},{"id":"G027","tema":"2.2.1","tipo":"caso","q":"Un arrendador pacta una renta mensual de 3 210 veces el valor diario de la UMA. ¿Qué obligación nace por la fr. XV del art. 17?","a":"Identificar al arrendatario y presentar Aviso a la SHCP","o":["Identificar al arrendatario y presentar Aviso a la SHCP","Sólo identificar, porque el Aviso exige superar 3 210 veces","Sólo presentar Aviso, sin obligación de identificar","Ninguna, porque el arrendamiento no es actividad vulnerable"],"x":"En la fr. XV el Aviso procede cuando el monto mensual es «igual o superior» a 3 210 veces el valor diario de la UMA, y 3 210 también supera el umbral de identificación (superior a 1 605). Sólo la identificación usa «superior a».","ref":"Art. 17, fr. XV"},{"id":"G028","tema":"2.2.1","tipo":"caso","q":"Una asociación civil sin fines de lucro recibe un donativo de 2 000 veces el valor diario de la UMA. ¿Qué obligación nace?","a":"Identificar al donante, sin presentar Aviso","o":["Presentar Aviso a la SHCP, sin necesidad de identificar","Identificar al donante, sin presentar Aviso","Identificar al donante y presentar Aviso a la SHCP","Ninguna, porque los donativos no generan obligaciones"],"x":"En la fr. XIII se identifica desde 1 605 y se avisa desde 3 210 veces el valor diario de la UMA. Con 2 000 nace la identificación, pero todavía no el Aviso.","ref":"Art. 17, fr. XIII"},{"id":"G029","tema":"2.2.1","tipo":"caso","q":"Un casino con permiso de la Secretaría de Gobernación paga a un jugador un premio de 500 veces el valor diario de la UMA. ¿Qué obligación nace?","a":"Identificar al jugador, sin presentar Aviso","o":["Identificar al jugador y presentar Aviso a la SHCP","Presentar Aviso, porque supera 325 veces el valor de la UMA","Ninguna, porque los premios no son operaciones de la fr. I","Identificar al jugador, sin presentar Aviso"],"x":"La fr. I incluye la entrega o pago de premios; se identifica desde 325 y se avisa desde 645 veces el valor diario de la UMA. 500 sólo activa la identificación; 325 no es umbral de Aviso.","ref":"Art. 17, fr. I"},{"id":"G030","tema":"2.2.1","tipo":"trampa","q":"Ante notario se escritura la compraventa de una casa: precio pactado 7 500, valor catastral 6 000 y valor comercial 8 100 veces el valor diario de la UMA. ¿Es objeto de Aviso?","a":"Sí, porque el valor comercial, el más alto, iguala o supera 8 000 veces","o":["Sí, porque el valor comercial, el más alto, iguala o supera 8 000 veces","Sólo si el precio pactado se paga en efectivo, por el límite del art. 32, fr. I","No, porque el precio pactado no alcanza 8 000 veces el valor de la UMA","No, porque ante notario el Aviso de inmuebles exige 8 025 veces la UMA"],"x":"En la fr. XII, apartado A, inciso a), se toma el más alto entre precio pactado, valor catastral, valor comercial o monto garantizado, y el Aviso procede desde 8 000 veces el valor diario de la UMA. El 8 025 es para la fr. V, V Bis, avalúos de corredor y efectivo en inmuebles.","ref":"Art. 17, fr. XII, apartado A, inciso a)"},{"id":"G031","tema":"2.2.1","tipo":"caso","q":"Ante notario se constituye un fideicomiso de garantía por 4 500 veces el valor diario de la UMA, que no garantiza un crédito de una institución del sistema financiero ni de un organismo público de vivienda. ¿Es objeto de Aviso?","a":"Sí, porque el monto iguala o supera 4 000 veces el valor de la UMA","o":["No, porque los fideicomisos ante notario avisan desde 8 000 veces","Sí, porque los fideicomisos ante notario siempre son objeto de Aviso sin umbral","Sí, porque el monto iguala o supera 4 000 veces el valor de la UMA","No, porque los fideicomisos de garantía nunca son objeto de Aviso"],"x":"La fr. XII, apartado A, inciso d), fija el Aviso de fideicomisos traslativos de dominio o de garantía desde 4 000 veces el valor diario de la UMA; sólo excluye los que garantizan créditos del sistema financiero u organismos públicos de vivienda. No es «siempre aviso» como los incisos b), c) y e).","ref":"Art. 17, fr. XII, apartado A, inciso d)"},{"id":"G032","tema":"2.2.1","tipo":"trampa","q":"Una desarrolladora que construye y vende departamentos de forma habitual (fr. V) vende uno en 8 010 veces el valor diario de la UMA. ¿Es objeto de Aviso?","a":"No, porque en la fr. V el Aviso procede desde 8 025 veces la UMA","o":["No, porque en la fr. V el Aviso procede desde 8 025 veces la UMA","No, porque las desarrolladoras sólo avisan si reciben preventas","Sí, porque toda venta de inmuebles es objeto de Aviso sin umbral","Sí, porque las operaciones con inmuebles avisan desde 8 000 veces"],"x":"La fr. V fija el Aviso en 8 025 veces el valor diario de la UMA. El 8 000 es el umbral del notario (fr. XII, apartado A, inciso a)), no el de quien construye o intermedia.","ref":"Art. 17, fr. V"},{"id":"G033","tema":"2.2.1","tipo":"caso","q":"Un notario otorga un poder irrevocable para actos de dominio sobre bienes con valor de 300 veces el valor diario de la UMA. ¿Es objeto de Aviso?","a":"Sí, porque los poderes irrevocables siempre son objeto de Aviso","o":["No, porque el valor no alcanza 8 000 veces el valor de la UMA","Sólo si el poder se otorga para actos de dominio sobre inmuebles","Sí, porque los poderes irrevocables siempre son objeto de Aviso","No, porque los poderes no implican transmisión de propiedad"],"x":"La fr. XII, apartado A, inciso b), dice que el otorgamiento de poderes irrevocables para actos de administración o dominio «siempre» será objeto de Aviso: no hay umbral. Lo mismo ocurre con los incisos c) (personas morales) y e) (mutuo con acreedor no financiero).","ref":"Art. 17, fr. XII, apartado A, inciso b)"},{"id":"G034","tema":"2.2.1","tipo":"caso","q":"Una agencia aduanal promueve, por cuenta ajena, el despacho de un vehículo terrestre usado con valor de 400 veces el valor diario de la UMA. ¿Es objeto de Aviso?","a":"Sí, porque los vehículos en comercio exterior se avisan en todos los casos","o":["Sí, porque los vehículos en comercio exterior se avisan en todos los casos","No, porque el umbral de vehículos en la fr. VIII es de 3 210 veces","Sólo si el vehículo es nuevo y se importa en forma definitiva","No, porque el valor del vehículo no alcanza 6 420 veces el valor diario de la UMA"],"x":"La fr. XIV, inciso a), incluye los vehículos terrestres, aéreos y marítimos, nuevos y usados, «cualquiera que sea el valor de los bienes», y esas actividades son objeto de Aviso en todos los casos. Los umbrales de la fr. VIII son para quien comercializa vehículos, no para el despacho aduanal.","ref":"Art. 17, fr. XIV, inciso a)"},{"id":"G035","tema":"2.2.1","tipo":"trampa","q":"En cuatro meses, un cliente compra en una joyería tres piezas de 600 veces el valor diario de la UMA cada una (1 800 en total). ¿Qué prevé la ley?","a":"La suma podrá considerarse operación sujeta a la obligación de Aviso","o":["La suma será considerada en todo caso operación sujeta a Aviso","La suma podrá considerarse operación sujeta a la obligación de Aviso","No hay obligación, porque cada operación es inferior al umbral","Debe presentarse Aviso dentro de las 24 horas por posible fraccionamiento de operaciones"],"x":"El penúltimo párrafo del art. 17 dice que, si la suma en seis meses supera el umbral de Aviso (aquí 1 605 veces el valor diario de la UMA), «podrá ser considerada» sujeta a Aviso. Es facultativo («podrá»), no automático («será»).","ref":"Art. 17, penúltimo párrafo"},{"id":"G036","tema":"2.2.1","tipo":"caso","q":"Una plataforma de intercambio de activos virtuales (no Entidad Financiera) realiza para un cliente una operación de 150 veces el valor diario de la UMA y le cobra una comisión de 5 veces el valor diario de la UMA. ¿Es objeto de Aviso?","a":"Sí, porque la comisión cobrada iguala o supera 4 veces la UMA","o":["Sí, porque toda operación con activos virtuales es objeto de Aviso","Sí, porque la comisión cobrada iguala o supera 4 veces la UMA","No, porque en activos virtuales sólo cuenta el monto operado","No, porque la operación no alcanza 210 veces el valor de la UMA"],"x":"La fr. XVI tiene dos supuestos de Aviso: a) operación del cliente igual o superior a 210 veces el valor diario de la UMA, o b) contraprestación igual o superior a 4 veces el valor diario de la UMA. Basta el inciso b): la comisión de 5 lo cumple aunque la operación no llegue a 210.","ref":"Art. 17, fr. XVI, inciso b)"},{"id":"G037","tema":"2.2.1","tipo":"caso","q":"Una agencia de autos vende una camioneta a una sociedad anónima. Respecto del Beneficiario Controlador, ¿qué debe hacer la agencia?","a":"Recabar documentos con reconocimiento oficial que identifiquen a su Beneficiario Controlador","o":["Recabar documentos con reconocimiento oficial que identifiquen a su Beneficiario Controlador","Identificar únicamente al representante legal que firma la operación por la sociedad","Consultar a la Secretaría de Economía antes de recabar cualquier dato de la sociedad","Recabar sólo la declaración del representante de la sociedad sobre si conoce a un Beneficiario Controlador"],"x":"El art. 18, fr. III, primer párrafo: si el cliente es persona moral, fideicomiso u otra figura jurídica, se recaban documentos o medios de identificación con reconocimiento oficial que permitan identificar a su Beneficiario Controlador. La sola declaración es la regla para personas físicas.","ref":"Art. 18, fr. III, primer párrafo"},{"id":"G038","tema":"2.2.1","tipo":"caso","q":"Una persona física compra un reloj en una joyería por un monto que obliga a identificarla. Respecto del Beneficiario Controlador, ¿qué debe recabar la joyería?","a":"Su declaración de si conoce o no a un Beneficiario Controlador y, en su caso, la documentación","o":["Una constancia de la SHCP que acredite que no actúa por cuenta de un tercero","Nada, porque el Beneficiario Controlador sólo se identifica en personas morales","Su declaración de si conoce o no a un Beneficiario Controlador y, en su caso, la documentación","Documentos oficiales que identifiquen a su Beneficiario Controlador en todos los casos, sin excepción"],"x":"El art. 18, fr. III, segundo párrafo (nuevo 2025): si el cliente es persona física, se recaba su declaración sobre si tiene o no conocimiento de la existencia de un Beneficiario Controlador y, en su caso, la documentación para identificarlo. No se exige documentarlo siempre, pero tampoco se omite.","ref":"Art. 18, fr. III, segundo párrafo"},{"id":"G039","tema":"2.2.1","tipo":"caso","q":"Un cliente quiere pagar un departamento con recursos cuyo origen no explica; ante las preguntas, retira la oferta y la operación no se celebra. Con base en esa sospecha, ¿qué debe hacer la inmobiliaria?","a":"Presentar Aviso dentro de las 24 horas siguientes, aunque no se celebró la operación","o":["Presentar Aviso a más tardar el día 17 del mes siguiente a aquel en que surgió la sospecha","Presentar Aviso dentro de las 24 horas siguientes, aunque no se celebró la operación","Nada, porque sólo se avisan las operaciones efectivamente celebradas con el cliente","Presentar denuncia ante la Fiscalía dentro de las 72 horas, en lugar de presentar Aviso"],"x":"El art. 18, fr. VI, segundo párrafo (nuevo 2025): ante sospecha o información basada en hechos o indicios, el Aviso se presenta dentro de las 24 horas siguientes, «incluso si el acto u operación no se celebró». El día 17 es el plazo ordinario del art. 23, no el de sospecha.","ref":"Art. 18, fr. VI, segundo párrafo"},{"id":"G040","tema":"2.2.1","tipo":"memoria","q":"La reforma de 2025 agregó al art. 18 las fr. VII a XI (evaluación de riesgos, manual, capacitación, monitoreo y auditoría). ¿Cuándo entran en vigor esas obligaciones?","a":"En los plazos que establezcan las reglas de carácter general","o":["A los nueve meses siguientes a la publicación del Decreto","Al día siguiente de la publicación del Decreto en el DOF","A los sesenta días de la entrada en vigor del Reglamento","En los plazos que establezcan las reglas de carácter general"],"x":"El tercero transitorio del Decreto de 16-jul-2025 dice que las fr. VII a XI del art. 18 entrarán en vigor en los plazos que establezcan las reglas de carácter general. El Decreto en general sí entró en vigor al día siguiente, «salvo las excepciones» de sus transitorios, y ésta es una.","ref":"Tercero transitorio, DOF 16-07-2025"},{"id":"G041","tema":"2.2.1","tipo":"caso","q":"Un cliente de una agencia de vehículos se niega a entregar su identificación oficial para una operación sujeta a identificación. ¿Qué debe hacer quien realiza la actividad vulnerable?","a":"Abstenerse de realizar la operación, sin responsabilidad alguna","o":["Realizar la operación, anotando la negativa en el expediente","Suspender la operación hasta que la SHCP autorice continuarla","Abstenerse de realizar la operación, sin responsabilidad alguna","Realizar la operación y presentar Aviso de inmediato a la SHCP"],"x":"El art. 21, segundo párrafo: quienes realicen AV deberán abstenerse, sin responsabilidad alguna, de llevar a cabo el acto u operación cuando el cliente se niegue a proporcionar la información o documentación. No se requiere autorización de la SHCP para abstenerse.","ref":"Art. 21, segundo párrafo"},{"id":"G042","tema":"2.2.1","tipo":"caso","q":"Un joyero que opera como persona física realiza una actividad vulnerable y no está afiliado a ninguna Entidad Colegiada. ¿Quién debe cumplir sus obligaciones conforme a la ley?","a":"Él mismo, de manera personal y directa","o":["Su contador externo, como responsable solidario ante la SHCP","Una Representante Encargada del Cumplimiento que debe designar","Él mismo, de manera personal y directa","La Entidad Colegiada de su gremio, a la que debe afiliarse"],"x":"El art. 20, último párrafo: las personas físicas que realicen AV cumplen personal y directamente, salvo el supuesto de la Sección Cuarta (Avisos por conducto de Entidades Colegiadas). La obligación de designar Representante Encargada es para personas morales y quienes actúan mediante fideicomisos u otras figuras.","ref":"Art. 20, último párrafo"},{"id":"G043","tema":"2.2.1","tipo":"caso","q":"Una sociedad que comercializa obras de arte aún no tiene aceptada la designación de su Representante Encargada del Cumplimiento. Mientras tanto, ¿a quién corresponde cumplir las obligaciones de la ley?","a":"A los integrantes del órgano de administración o al administrador único","o":["A nadie, porque la sociedad queda exenta hasta que se acepte la designación","Al accionista mayoritario, por ser su Beneficiario Controlador","Al director de finanzas o, en su defecto, al contador de la sociedad","A los integrantes del órgano de administración o al administrador único"],"x":"El art. 20, segundo párrafo: en tanto no haya Representante Encargada o la designación no sea aceptada, el cumplimiento corresponde a los integrantes del órgano de administración o a quien funja como administrador único. No hay periodo de exención.","ref":"Art. 20, segundo párrafo"},{"id":"G044","tema":"2.2.1","tipo":"cifra","q":"Una agencia vende un vehículo el 5 de marzo y la operación es objeto de Aviso. ¿A más tardar cuándo debe presentarlo?","a":"El 17 de abril","o":["El 17 de marzo","El 17 de abril","El 5 de abril","El 30 de abril"],"x":"El art. 23 fija como plazo el día 17 del mes inmediato siguiente a aquel en que se realizó la operación: marzo → 17 de abril. No se cuentan 30 días desde la operación.","ref":"Art. 23, primer párrafo"},{"id":"G045","tema":"2.2.1","tipo":"cifra","q":"¿Durante cuánto tiempo, como mínimo, debe conservar quien realiza una actividad vulnerable la información y documentación que soporta la actividad?","a":"Al menos 10 años desde la fecha en que se realizó la actividad","o":["Al menos 10 años desde la fecha en que se realizó la actividad","Al menos 10 años desde la fecha en que se presentó el Aviso","Al menos 5 años desde que terminó la relación con el cliente","Al menos 5 años desde la fecha en que se realizó la actividad"],"x":"El art. 18, fr. IV, segundo párrafo: por al menos diez años contados a partir de la fecha de realización de la Actividad Vulnerable. Los 5 años son el alcance de las visitas de verificación (art. 36), no el plazo de conservación.","ref":"Art. 18, fr. IV, segundo párrafo"},{"id":"G046","tema":"2.2.1","tipo":"caso","q":"Por una falla en los sistemas informáticos de una Entidad Colegiada, los Avisos de varios de sus integrantes se presentan fuera de plazo. ¿Quién responde por ese incumplimiento?","a":"La Entidad Colegiada, porque la causa le es imputable","o":["La Entidad Colegiada, porque la causa le es imputable","Cada integrante, porque la obligación de avisar es suya","La Representante Encargada del Cumplimiento de cada integrante","La Entidad Colegiada y los integrantes, de forma solidaria"],"x":"El art. 30: los incumplimientos de los integrantes por causas imputables a la Entidad Colegiada son responsabilidad de ésta; sólo si la causa es imputable al integrante, la Entidad no responde. La ley no establece responsabilidad solidaria.","ref":"Art. 30"},{"id":"G047","tema":"2.2.1","tipo":"cifra","q":"Una Entidad Colegiada decide dejar de actuar como intermediaria entre sus integrantes y la Secretaría. ¿Con qué anticipación debe informarlo?","a":"Con cuando menos 30 días de anticipación","o":["Con cuando menos 60 días de anticipación","Con cuando menos 15 días de anticipación","Con cuando menos 90 días de anticipación","Con cuando menos 30 días de anticipación"],"x":"El art. 31 obliga a informar a los integrantes y a la Secretaría con cuando menos treinta días de anticipación la intención de extinción, disolución o liquidación, o de dejar de actuar como intermediario. Después, sus integrantes cumplen en forma individual y directa.","ref":"Art. 31, primer párrafo"},{"id":"G048","tema":"2.2.1","tipo":"caso","q":"Un despacho de servicios profesionales firmó con su cliente una cláusula de confidencialidad absoluta y argumenta que presentar Avisos violaría su secreto profesional. ¿Qué establece la ley?","a":"Presentar Avisos no transgrede ningún secreto ni puede impedirse por cláusula de confidencialidad","o":["El secreto profesional exime de presentar Avisos, salvo requerimiento expreso de la Unidad","La cláusula de confidencialidad prevalece si se firmó antes de que naciera la obligación de presentar el Aviso","Presentar Avisos sólo es válido si el cliente autoriza por escrito levantar la confidencialidad","Presentar Avisos no transgrede ningún secreto ni puede impedirse por cláusula de confidencialidad"],"x":"El art. 22: presentar Avisos e información no implica transgresión a obligaciones de confidencialidad o secreto legal, profesional, fiscal, bancario, fiduciario u otro, ni puede ser objeto de cláusula de confidencialidad. No se necesita autorización del cliente.","ref":"Art. 22"},{"id":"G049","tema":"2.2.1","tipo":"caso","q":"Una galería atiende a un coleccionista con quien tiene una relación formal y habitual. ¿En qué supuesto la ley le exige solicitar al cliente información sobre su actividad u ocupación?","a":"Cuando se establezca una Relación de negocios con el cliente","o":["Sólo cuando la operación con el cliente sea objeto de Aviso","Cuando se establezca una Relación de negocios con el cliente","En toda operación que alcance el umbral de identificación","Sólo cuando el cliente sea Persona Políticamente Expuesta"],"x":"El art. 18, fr. II: «para los casos en que se establezca una Relación de negocios» se solicita la actividad u ocupación, basándose, entre otros, en los avisos al RFC. La Relación de negocios es formal y habitual y excluye lo ocasional (art. 3, fr. XII).","ref":"Art. 18, fr. II"},{"id":"G050","tema":"2.2.1","tipo":"memoria","q":"Cuando se transmiten acciones o partes sociales de una sociedad mercantil, ¿qué aviso debe presentar la propia sociedad conforme al Capítulo IV Bis?","a":"Aviso de la inscripción en su libro de registro, en el sistema de la Secretaría de Economía","o":["Aviso de la inscripción en su libro de registro, en el sistema de la Secretaría de Economía","Aviso a la SHCP por el portal de Actividades Vulnerables, a más tardar el día 17 siguiente","Aviso a la SHCP dentro de las 24 horas siguientes, por tratarse de un cambio de control","Aviso ante el notario que formalizó la transmisión, quien lo remite a la Unidad de la Fiscalía"],"x":"El art. 33 Bis, segundo párrafo: la sociedad presenta aviso respecto de la inscripción en el libro de registro en el sistema electrónico que determine y opere la Secretaría de Economía. No es un Aviso de AV ante la SHCP.","ref":"Art. 33 Bis, segundo párrafo"},{"id":"G051","tema":"2.2.1","tipo":"caso","q":"La evaluación de riesgos de una agencia de vehículos la ubica en riesgo alto. ¿Quién debe revisar y dictaminar en el año calendario la efectividad de su cumplimiento?","a":"Una persona auditora externa independiente","o":["La propia SHCP, mediante una visita de verificación anual","Su Representante Encargada del Cumplimiento, con informe anual","Su área de auditoría interna o un auditor externo, a su elección","Una persona auditora externa independiente"],"x":"El art. 18, fr. XI: con riesgo bajo o medio puede revisar el área de auditoría interna o un auditor externo independiente; con riesgo alto, sólo un auditor externo independiente. La opción «a su elección» es la regla del riesgo bajo o medio.","ref":"Art. 18, fr. XI"},{"id":"G052","tema":"2.2.1","tipo":"caso","q":"Una arrendadora celebra un contrato con un cliente que es persona moral mexicana de derecho público. ¿Cómo debe identificarlo?","a":"Aplicándole un régimen simplificado de identificación, conforme a las reglas","o":["Aplicándole un régimen simplificado de identificación, conforme a las reglas","No debe identificarlo, porque las autoridades están exentas","Con el mismo régimen que a cualquier otra persona moral cliente","Identificando sólo a su Beneficiario Controlador ante la SHCP"],"x":"El art. 19, último párrafo (nuevo 2025): a los clientes personas morales mexicanas de derecho público se les deberá aplicar un régimen simplificado de identificación conforme a las reglas de carácter general. Simplificado no es exento.","ref":"Art. 19, último párrafo"},{"id":"G053","tema":"2.2.2","tipo":"caso","q":"Una persona quiere pagar en efectivo una casa con valor de 9 000 veces el valor diario de la UMA al día del pago. ¿Qué dispone la ley?","a":"Está prohibido, porque iguala o supera 8 025 veces la UMA","o":["Está prohibido sólo si el pago se hace en divisas extranjeras","Está prohibido, porque iguala o supera 8 025 veces la UMA","Está permitido si el efectivo se deposita en una institución de crédito","Está permitido, pero el notario debe presentar Aviso a la SHCP"],"x":"El art. 32, fr. I, prohíbe pagar en efectivo la constitución o transmisión de derechos reales sobre inmuebles desde 8 025 veces el valor diario de la UMA, al día del pago, aun por conducto de una Entidad Financiera, en moneda nacional o divisas.","ref":"Art. 32, fr. I"},{"id":"G054","tema":"2.2.2","tipo":"trampa","q":"Una persona quiere pagar en efectivo, en moneda nacional, una casa con valor de 8 000 veces el valor diario de la UMA al día del pago. ¿Lo prohíbe el art. 32?","a":"No, porque la prohibición para inmuebles inicia en 8 025 veces la UMA","o":["Sí, porque la prohibición para inmuebles inicia en 8 000 veces el valor diario de la UMA","Sí, porque la prohibición inicia en 3 210 veces la UMA para todo bien","No, porque la prohibición para inmuebles inicia en 8 025 veces la UMA","No, siempre que el efectivo se deposite por conducto de un banco"],"x":"El art. 32, fr. I, prohíbe el efectivo en inmuebles desde 8 025 veces el valor diario de la UMA. El 8 000 es el umbral de Aviso del notario, no el de efectivo; el 3 210 aplica a los demás bienes de las fr. II a VII. Pasar el efectivo por un banco no cambia nada: la prohibición rige aun por conducto de una Entidad Financiera.","ref":"Art. 32, fr. I"},{"id":"G055","tema":"2.2.2","tipo":"caso","q":"Para pagar un automóvil de 4 000 veces el valor diario de la UMA, el comprador deposita billetes en ventanilla bancaria a la cuenta de la agencia. ¿Qué dispone la ley?","a":"Está prohibido, aunque el efectivo pase por una Entidad Financiera","o":["Está prohibido sólo si el comprador no es cliente del banco receptor","Está prohibido, aunque el efectivo pase por una Entidad Financiera","Está permitido, porque el pago quedó registrado en el sistema financiero","Está permitido, porque el límite de efectivo en vehículos es de 6 420 veces"],"x":"El art. 32, primer párrafo y fr. II, prohíbe liquidar en efectivo vehículos desde 3 210 veces el valor diario de la UMA, «aun cuando la liquidación o el pago se realice en efectivo por conducto de una Entidad Financiera». El 6 420 es umbral de Aviso de la fr. VIII del art. 17, no límite de efectivo.","ref":"Art. 32, primer párrafo y fr. II"},{"id":"G056","tema":"2.2.2","tipo":"caso","q":"Un cliente ofrece pagar un reloj de 3 300 veces el valor diario de la UMA con monedas de oro. ¿Qué dispone la ley?","a":"Está prohibido, porque los Metales Preciosos están sujetos a la prohibición","o":["Está permitido, porque el límite para relojes es de 8 025 veces la UMA","Está permitido, porque la prohibición sólo alcanza monedas y billetes","Está prohibido sólo si las monedas de oro son de origen extranjero","Está prohibido, porque los Metales Preciosos están sujetos a la prohibición"],"x":"El art. 32 prohíbe pagar o aceptar el pago con monedas y billetes, en moneda nacional o divisas, «y Metales Preciosos»; la fr. III fija para relojes, joyería y piedras preciosas el límite de 3 210 veces el valor diario de la UMA. El oro es Metal Precioso (art. 3, fr. IX).","ref":"Art. 32, primer párrafo y fr. III"},{"id":"G057","tema":"2.2.2","tipo":"caso","q":"Un comprador intenta consignar en efectivo, ante la negativa del vendedor a recibirlo, el pago de un inmueble de 9 000 veces el valor diario de la UMA al día de la consignación. ¿Aplica la prohibición del art. 32?","a":"Sí, la consignación de pago está prohibida con el umbral de su fracción","o":["Sí, la consignación de pago está prohibida con el umbral de su fracción","No, porque el art. 32 sólo regula el pago directo entre las partes","No, porque la consignación de pago es un acto judicial y no una compraventa","Sí, pero sólo cuando la consignación se realiza en divisas extranjeras"],"x":"La fr. VIII del art. 32 (nueva 2025) incluye la consignación de pago relacionada con las operaciones de las fr. I a VII, conforme al umbral de cada fracción al día de la consignación. Para inmuebles, 8 025; aquí 9 000 lo supera.","ref":"Art. 32, fr. VIII"},{"id":"G058","tema":"2.2.2","tipo":"caso","q":"Un socio vende sus acciones de una sociedad anónima por 3 500 veces el valor diario de la UMA y el comprador quiere pagar con billetes. ¿Qué dispone la ley?","a":"Está prohibido, porque iguala o supera 3 210 veces la UMA","o":["Está permitido si el notario identifica la forma de pago","Está prohibido sólo si la operación supera 8 025 veces la UMA","Está prohibido, porque iguala o supera 3 210 veces la UMA","Está permitido, porque las acciones no son bienes del art. 32"],"x":"El art. 32, fr. VI, prohíbe el efectivo en la transmisión de dominio o constitución de derechos sobre títulos representativos de partes sociales o acciones desde 3 210 veces el valor diario de la UMA. El 8 025 es sólo para inmuebles.","ref":"Art. 32, fr. VI"},{"id":"G059","tema":"2.2.1","tipo":"cifra","q":"¿Qué multa corresponde a quien omite presentar los Avisos del art. 17?","a":"De 10 000 a 65 000 veces la UMA, o del 10 % al 100 % del valor del acto, la mayor","o":["De 2 000 a 10 000 veces la UMA, o del 10 % al 100 % del valor del acto, la menor","Del 10 % al 100 % del valor del acto, sin un mínimo expresado en veces la UMA","De 10 000 a 65 000 veces la UMA, o del 10 % al 100 % del valor del acto, la mayor","De 200 a 2 000 veces la UMA, por tratarse de un incumplimiento formal de Avisos"],"x":"El art. 54, fr. III, sanciona la omisión de Avisos (53 VI) y la participación en operaciones prohibidas en efectivo (53 VII) con 10 000 a 65 000 veces el valor diario de la UMA o del 10 al 100 % del valor del acto cuando sea cuantificable, «la que resulte mayor». El rango de 200 a 2 000 es para las fr. I a IV del art. 53.","ref":"Art. 54, fr. III"},{"id":"G060","tema":"2.2.1","tipo":"caso","q":"Una agencia de autos presenta un Aviso 20 días después de la fecha en que debió presentarlo. ¿Cómo se sanciona?","a":"Como Aviso extemporáneo, con multa de 200 a 2 000 veces la UMA","o":["Como omisión de Aviso, con multa de 10 000 a 65 000 veces la UMA","Como Aviso sin requisitos, con multa de 2 000 a 10 000 veces la UMA","No se sanciona, porque se presentó dentro de un plazo de gracia de 30 días","Como Aviso extemporáneo, con multa de 200 a 2 000 veces la UMA"],"x":"El art. 53, fr. III, sanciona presentar Avisos fuera de tiempo cuando se presentan a más tardar dentro de los 30 días siguientes a la fecha debida; esa conducta se multa con 200 a 2 000 veces el valor diario de la UMA (art. 54, fr. I). Un retraso de 20 días es extemporáneo, no omisión, y sí se multa: no hay «plazo de gracia».","ref":"Art. 53, fr. III, y art. 54, fr. I"},{"id":"G061","tema":"2.2.1","tipo":"caso","q":"Una inmobiliaria presenta un Aviso 45 días después de la fecha en que debió presentarlo. ¿Qué consecuencia prevé la ley?","a":"Se aplica la sanción prevista para el caso de omisión del Aviso","o":["Se tiene por no presentado, sin multa si se presenta otro corregido","Se sanciona con la revocación inmediata de su registro en el padrón","Se sanciona como Aviso extemporáneo, porque finalmente se presentó","Se aplica la sanción prevista para el caso de omisión del Aviso"],"x":"El art. 53, fr. III: si la extemporaneidad excede los 30 días siguientes a la fecha en que debió presentarse, se aplica la sanción prevista para el caso de omisión. Presentarlo tarde no lo mantiene como extemporáneo después de ese plazo.","ref":"Art. 53, fr. III, segundo párrafo"},{"id":"G062","tema":"2.2.1","tipo":"caso","q":"Una institución de crédito incumple sus obligaciones de reporte del art. 15. ¿Quién la sanciona?","a":"El órgano desconcentrado de la SHCP facultado para supervisarla","o":["La SHCP directamente, con las multas del art. 54 de la LFPIORPI","La Unidad de la Fiscalía, al tratarse de una Entidad Financiera","El órgano desconcentrado de la SHCP facultado para supervisarla","El Tribunal Federal de Justicia Administrativa, a petición de la SHCP"],"x":"El art. 52, segundo párrafo, exceptúa de la regla general a las Entidades Financieras: sus violaciones al art. 15 las sanciona el órgano desconcentrado facultado para supervisarlas (para un banco, la CNBV). La SHCP sanciona con el art. 54 a quienes realizan las AV del art. 17.","ref":"Art. 52, segundo párrafo"},{"id":"G063","tema":"2.2.1","tipo":"caso","q":"Una casa de bolsa incumple las medidas de identificación de clientes del art. 15. ¿Conforme a qué procedimiento y con qué sanciones se le castiga?","a":"Con el procedimiento y las sanciones de la ley especial que la regula","o":["Con el procedimiento y los tres rangos de multa del art. 54 de la LFPIORPI","Con el procedimiento y las sanciones de la ley especial que la regula","Con el procedimiento de su ley especial, pero con las multas del art. 54","Con el procedimiento de la LFPIORPI, pero con las multas de su ley especial"],"x":"El art. 52, segundo párrafo: la imposición se hará conforme al procedimiento de las leyes especiales de cada Entidad Financiera, «con las sanciones expresamente indicadas en dichas Leyes». Ni el procedimiento ni las multas salen del art. 54.","ref":"Art. 52, segundo párrafo"},{"id":"G064","tema":"2.2.1","tipo":"caso","q":"Una agencia aduanal ya obtuvo una vez que la SHCP se abstuviera de sancionarla. Ahora regulariza otra falta de manera espontánea, antes de la verificación, y la reconoce expresamente dentro del plazo inicial del procedimiento. ¿Qué prevé la ley?","a":"La SHCP reducirá hasta en un 50 % el monto de las multas","o":["La SHCP reducirá hasta en un 50 % el monto de las multas","La SHCP volverá a abstenerse de sancionar, sin límite de veces","La SHCP impondrá la multa máxima por tratarse de reincidencia","La SHCP reducirá la multa en un 25 % fijo por la regularización"],"x":"El art. 55 da la abstención total por única ocasión; si el beneficio ya se ejerció, el segundo párrafo (nuevo 2025) prevé una reducción de hasta el 50 % de las multas, con regularización espontánea previa y reconocimiento expreso de la falta.","ref":"Art. 55, segundo párrafo"},{"id":"G065","tema":"2.2.1","tipo":"memoria","q":"¿Qué medida permite a la SHCP el art. 54 Bis, adicionado en 2025?","a":"Determinar que se suspendan temporalmente operaciones con ciertos clientes","o":["Revocar de inmediato el registro en el padrón sin procedimiento alguno","Determinar que se suspendan temporalmente operaciones con ciertos clientes","Congelar las cuentas bancarias de los clientes de alto riesgo sin orden judicial","Clausurar de forma definitiva el establecimiento de quien realiza la AV"],"x":"El art. 54 Bis permite a la SHCP determinar, conforme a los mecanismos de las reglas de carácter general, que quienes realizan AV suspendan de manera temporal actos u operaciones con determinadas personas Clientes o Usuarias, en tanto se subsane o resuelva el procedimiento.","ref":"Art. 54 Bis"},{"id":"G066","tema":"2.2.1","tipo":"caso","q":"Un cliente entrega a una inmobiliaria un comprobante de domicilio falso, sabiendo que se incorporará al Aviso. ¿Qué pena de prisión prevé la LFPIORPI?","a":"De 2 a 8 años de prisión","o":["De 2 a 8 años de prisión","De 5 a 15 años de prisión","De 4 a 10 años de prisión","De 1 a 5 años de prisión"],"x":"El art. 62, fr. I, sanciona con prisión de dos a ocho años y 500 a 2 000 días multa a quien proporcione información falsa a quienes deban dar Avisos. Los 4 a 10 años del art. 63 son para el uso indebido por servidores públicos o la revelación de un Aviso.","ref":"Art. 62, fr. I"},{"id":"G067","tema":"2.2.1","tipo":"caso","q":"Sin autorización, una empleada de una joyería le revela a un cliente que la joyería presentó un Aviso sobre él. ¿Qué pena de prisión prevé la LFPIORPI?","a":"De 4 a 10 años de prisión","o":["De 4 a 10 años de prisión","De 1 a 5 años de prisión","De 6 a 12 años de prisión","De 2 a 8 años de prisión"],"x":"El art. 63, fr. II, sanciona con cuatro a diez años a quien, sin autorización, revele o divulgue información que vincule a una persona con un Aviso, «independientemente de que el Aviso exista o no». Los 2 a 8 años son del art. 62 (información falsa, alterada o ilegible).","ref":"Art. 63, fr. II"},{"id":"G068","tema":"2.2.1","tipo":"caso","q":"Hasta hace un año, una persona fue servidora pública encargada de investigar delitos. Hoy, como particular, proporciona información falsa para incorporarla a un Aviso. ¿Qué efecto tiene su antecedente?","a":"Las penas del art. 62 se duplican","o":["Las penas del art. 62 aumentan en una mitad","Sólo se le aplica la inhabilitación, sin prisión","No tiene efecto, porque ya no es servidora pública","Las penas del art. 62 se duplican"],"x":"El art. 64 duplica las penas de los arts. 62 y 63, fr. II, si quien comete el ilícito es o fue, dentro de los dos años anteriores, servidor público encargado de prevenir, detectar, investigar o juzgar delitos. Además, se aplica inhabilitación por un tiempo igual al de la prisión.","ref":"Art. 64, primer párrafo"},{"id":"G069","tema":"2.2.2","tipo":"caso","q":"Un taller contrata el blindaje de una camioneta por 3 400 veces el valor diario de la UMA al día del pago, y el cliente quiere liquidarlo con billetes en moneda nacional. ¿Qué dispone la ley?","a":"Está prohibido, porque el blindaje de vehículos tiene límite de 3 210 veces el valor diario de la UMA","o":["Está permitido, porque el límite de efectivo para servicios de blindaje es de 8 025 veces el valor diario de la UMA","Está permitido, porque el art. 32 sólo prohíbe el efectivo en la compraventa del vehículo, no en servicios sobre él","Está prohibido, porque el blindaje de vehículos tiene límite de 3 210 veces el valor diario de la UMA","Está prohibido sólo si el cliente liquida en divisas, porque el pago en moneda nacional no está restringido"],"x":"El art. 32, fr. V, prohíbe pagar en efectivo la prestación de servicios de blindaje de vehículos o inmuebles por un valor igual o superior a 3 210 veces el valor diario de la UMA, y la prohibición abarca moneda nacional y divisas. El 8 025 es el umbral de la fr. I (derechos reales sobre inmuebles), no el del blindaje.","ref":"Art. 32, fr. V"},{"id":"G070","tema":"2.2.2","tipo":"caso","q":"Una persona arrienda un local comercial con renta de 4 000 veces el valor diario de la UMA mensuales y quiere pagar cada mensualidad con billetes. ¿Qué dispone la ley?","a":"Está prohibido, porque el uso o goce tiene límite de 3 210 veces el valor diario de la UMA mensuales","o":["Está prohibido, porque el uso o goce tiene límite de 3 210 veces el valor diario de la UMA mensuales","Está permitido, porque, al tratarse de un inmueble, el límite de efectivo es de 8 025 veces el valor diario de la UMA","Está permitido, porque el art. 32 sólo alcanza la constitución o transmisión de derechos reales sobre inmuebles","Está prohibido sólo si la suma de las rentas del año iguala o supera 8 025 veces el valor diario de la UMA"],"x":"El art. 32, fr. VII, prohíbe el efectivo en la constitución de derechos personales de uso o goce de los bienes de las fr. I, II y V por un valor igual o superior a 3 210 veces el valor diario de la UMA mensuales. Aunque el bien sea inmueble, el 8 025 de la fr. I rige para derechos reales, no para el arrendamiento.","ref":"Art. 32, fr. VII"},{"id":"G071","tema":"2.2.2","tipo":"trampa","q":"¿Qué prevé el último párrafo del art. 32 de la LFPIORPI respecto de los bienes fungibles?","a":"Que la SHCP podrá determinar, mediante reglas de carácter general, los casos en que la prohibición también les aplique, según su grado de riesgo","o":["Que la SHCP debe extender la prohibición a todos los bienes fungibles, sin distinguir el grado de riesgo que representen","Que la SHCP podrá determinar, mediante reglas de carácter general, los casos en que la prohibición también les aplique, según su grado de riesgo","Que la prohibición ya les aplica por ley, desde un valor igual o superior a 3 210 veces el valor diario de la UMA, sin necesidad de reglas","Que la SHCP podrá eximirlos de la prohibición, mediante oficio individual, cuando el pago se realice por conducto del sistema financiero de forma documentada"],"x":"El último párrafo del art. 32 dice que la Secretaría, mediante reglas de carácter general, «podrá» determinar los casos y condiciones en que la prohibición también aplique a bienes fungibles, de acuerdo con su grado de riesgo. Es una facultad, no una obligación ni una prohibición ya vigente por ley.","ref":"Art. 32, último párrafo"},{"id":"G072","tema":"2.2.2","tipo":"caso","q":"Un notario formaliza la compraventa de un inmueble de 9 500 veces el valor diario de la UMA. Respecto del pago, ¿qué le exige el art. 33?","a":"Identificar en el instrumento la forma en que se pagan las obligaciones que derivan del acto","o":["Asentar la declaración bajo protesta de decir verdad de las partes, que basta en cualquier compraventa","Identificar la forma de pago sólo cuando alguna de las partes declare haber pagado una parte en efectivo","Limitarse a presentar el Aviso de la operación ante la SHCP, sin revisar la forma en que se pagó","Identificar en el instrumento la forma en que se pagan las obligaciones que derivan del acto"],"x":"El art. 33, primer párrafo, obliga a las personas depositarias de Fe Pública a identificar la forma de pago cuando la operación tenga un valor igual o superior a 8 025 veces el valor diario de la UMA, sin condicionarlo a que alguien declare efectivo. La declaración bajo protesta sólo basta por debajo de ese valor y con pago previo a la firma (segundo párrafo).","ref":"Art. 33, primer párrafo"},{"id":"G073","tema":"2.2.2","tipo":"caso","q":"Ante notario se formaliza la compraventa de un inmueble de 5 000 veces el valor diario de la UMA, que el comprador pagó en parte antes de la firma. ¿Qué dispone el art. 33 sobre la acreditación de ese pago?","a":"Basta la declaración que bajo protesta de decir verdad hagan las personas Clientes o Usuarias","o":["El notario debe identificar la forma de pago, como en toda compraventa de inmuebles ante fedatario","Basta la declaración que bajo protesta de decir verdad hagan las personas Clientes o Usuarias","El instrumento no puede firmarse, porque el pago debe hacerse en el acto y ante el notario","Debe anexarse el comprobante bancario de cada pago, o el notario debe negarse a formalizar el acto"],"x":"El art. 33, segundo párrafo: si el valor es inferior a 8 025 veces el valor diario de la UMA y el acto fue total o parcialmente pagado antes de la firma, basta la declaración bajo protesta de decir verdad de las personas Clientes o Usuarias. La identificación de la forma de pago por el fedatario se exige desde 8 025 (primer párrafo).","ref":"Art. 33, segundo párrafo"},{"id":"G074","tema":"2.2.2","tipo":"caso","q":"Una joyería vende un collar de 3 500 veces el valor diario de la UMA, pagado por transferencia, sin intervención de fedatario público. Conforme al art. 33, ¿cómo debe formalizarse la operación?","a":"Con factura u otro documento que especifique la forma de pago y anexe el comprobante","o":["Con la declaración bajo protesta de decir verdad del comprador sobre el origen de los recursos","Ante fedatario público, que identifique la forma de pago y la haga constar en un instrumento","Con factura u otro documento que especifique la forma de pago y anexe el comprobante","Con el Aviso a la SHCP, que sustituye la factura cuando el pago se hace por transferencia"],"x":"El art. 33, tercer párrafo: los demás actos de las fr. II a VII del art. 32 se formalizan con certificados, facturas, garantías u otro documento, previa identificación de quienes los realizan y, en su caso, del Beneficiario Controlador, y en ellos se especifica la forma de pago y se anexa el comprobante. La declaración bajo protesta es la vía del segundo párrafo, para actos ante fedatario con pago previo.","ref":"Art. 33, tercer párrafo"},{"id":"G075","tema":"2.2.2","tipo":"caso","q":"Un comerciante de vehículos acepta billetes como pago de un camión de 5 000 veces el valor diario de la UMA. ¿Con qué multa puede sancionarlo la SHCP?","a":"De 10 000 a 65 000 veces el valor diario de la UMA, o del 10 al 100 % del valor del acto, la que resulte mayor","o":["De 10 000 a 65 000 veces el valor diario de la UMA, o del 10 al 100 % del valor del acto, la que resulte mayor","De 2 000 a 10 000 veces el valor diario de la UMA, por incumplir las disposiciones sobre uso de efectivo del Capítulo IV","De 200 a 2 000 veces el valor diario de la UMA, por tratarse de un incumplimiento en la forma de liquidar la operación","De 10 000 a 65 000 veces el valor diario de la UMA, o del 10 al 100 % del valor del acto, la que resulte menor de ambas"],"x":"Participar en un acto prohibido por el art. 32 es la conducta del art. 53, fr. VII, que el art. 54, fr. III, sanciona con 10 000 a 65 000 veces el valor diario de la UMA o del 10 al 100 % del valor del acto cuando sea cuantificable en dinero, la que resulte mayor. El rango de 2 000 a 10 000 (art. 54, fr. II) corresponde al incumplimiento del art. 33 (art. 53, fr. V), no a la operación prohibida.","ref":"Art. 53, fr. VII, y art. 54, fr. III"}],"sitio":{"nombre":"Módulo 2","integrador":"simulacro","integrador_texto":"Simulacro mixto","integrador_href":"m2-simulacro/index.html","etiqueta_n":"H","orden_resultados":"temario","paginas":[{"n":"1","carpeta":"m2-h1-objetivo-kyc","pregunta":"2.1.1–2.1.2 · Objetivo y política de identificación y conocimiento","estado":"integrada"},{"n":"2","carpeta":"m2-h2-reportes-dolares-sistemas","pregunta":"2.1.3–2.1.5 · Reportes, dólares en efectivo y sistemas automatizados","estado":"integrada"},{"n":"3","carpeta":"m2-h3-otras-obligaciones-lpb","pregunta":"2.1.6–2.1.8 · Otras obligaciones, intercambio de información y LPB","estado":"integrada"},{"n":"4","carpeta":"m2-h4-ccc-oficial","pregunta":"2.1.9–2.1.10 · Comité de Comunicación y Control y oficial de cumplimiento","estado":"integrada"},{"n":"5","carpeta":"m2-h5-novedosos-cambios-itf","pregunta":"2.1.11–2.1.14 · Modelos novedosos, centros cambiarios, transmisores e ITF","estado":"integrada"},{"n":"6","carpeta":"m2-h6-sanciones-pr-plazos","pregunta":"2.1.15–2.1.17 · Sanciones, propietario real y plazos","estado":"integrada"},{"n":"7","carpeta":"m2-h7-tipologias","pregunta":"2.1 · Tipologías UIF y de organismos internacionales","estado":"integrada"},{"n":"8","carpeta":"m2-h8-lfpiorpi","pregunta":"2.2.1–2.2.2 · LFPIORPI: actividades vulnerables y uso de efectivo","estado":"integrada"}],"raiz":"../","actual":"m2-h8-lfpiorpi"}}

    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="frac"><button aria-expanded="false" data-ficha="${id}"><span class="rom">${esc(it.etiqueta)}</span><span><span class="nm">${esc(it.nombre)}</span><span class="hookt">${esc([it.verbo,it.gancho].filter(Boolean).join(" · "))}</span></span><span class="cnt">${esc(it.conteo||"")}</span></button><ul class="inc" hidden>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul></li>`}).join("")}</ul>`;
    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};

  const body = c.filas? c.filas.map(f=>`<div class="frow"><span class="k">${esc(f.k)}</span>${f.v}</div>`).join("")

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}

/* ---------- tablero y cuatro tablas ---------- */
const TB={}, CT={};
const tbSec=id=>D.secciones.find(x=>x.id===id);
const tbCell=(s,r,j)=>(s._ix||(s._ix=Object.fromEntries(s.celdas.map(c=>[c.rep+"|"+c.suj,c]))))[r+"|"+j]||{rep:r,suj:j,aplica:false,seguro:false};
const uniq=a=>[...new Set(a.filter(Boolean))];
function tbInit(s){
  const st=TB[s.id]={suj:new Set(),grp:new Set(),frec:"",monto:"",plazo:"",vista:"tabla"};
  const on=s.celdas.filter(c=>c.aplica);
  const sel=(k,lab,vals)=>!vals.length?"":`<div class="row"><span class="lbl">${lab}</span><select data-tbs="${s.id}:${k}"><option value="">Todos</option>${vals.map(v=>`<option>${esc(v)}</option>`).join("")}</select></div>`;
  $("#tbf-"+s.id).innerHTML=
    `<div class="row"><span class="lbl">Sujeto</span>${s.sujetos.map((j,i)=>`<button class="fchip sw ${colorDe(j.color,i)}" data-tbf="${s.id}:suj:${j.k}" aria-pressed="false" title="${esc(j.t)}"><i></i>${esc(j.corto||j.k)}</button>`).join("")}</div>`+
    `<div class="row"><span class="lbl">Tipo</span>${s.grupos.map((g,i)=>`<button class="fchip sw ${colorDe(g.color,i)}" data-tbf="${s.id}:grp:${g.k}" aria-pressed="false"><i></i>${esc(g.t)}</button>`).join("")}</div>`+
    `<div class="row" style="gap:14px">${sel("frec","Frecuencia",uniq(on.map(c=>c.frec_tag)))}${sel("monto","Monto",uniq(on.map(c=>c.monto_tag)))}${sel("plazo","Plazo",uniq(on.map(c=>c.plazo_tag)))}</div>`;
  tbDraw(s.id);
}
function tbMatch(st,c){return (!st.frec||c.frec_tag===st.frec)&&(!st.monto||c.monto_tag===st.monto)&&(!st.plazo||c.plazo_tag===st.plazo);}
function tbDraw(id){
  const s=tbSec(id), st=TB[id], val=st.frec||st.monto||st.plazo;
  const cols=s.sujetos.map((j,i)=>({...j,ci:i})).filter(j=>!st.suj.size||st.suj.has(j.k));
  let hits=0, shown=0;
  if(st.vista==="tabla"){
    let body="";
    s.grupos.forEach((g,gi)=>{
      if(st.grp.size&&!st.grp.has(g.k)) return;
      const rows=s.reportes.filter(r=>r.g===g.k).map(r=>{
        const cells=cols.map(j=>{const c=tbCell(s,r.k,j.k), m=c.aplica&&val&&tbMatch(st,c); if(m)hits++; return {c,j,m};});
        if(val&&!cells.some(x=>x.m)) return "";

        return `<tr><th class="rp" scope="row">${esc(r.t)}${r.regla?`<span class="rg">${esc(r.regla)}</span>`:""}</th>${cells.map(({c,j,m})=>`<td class="${val?(m?"hit":"dim"):""}"><button class="tbc ${c.aplica?"si":"no"}${c.aplica&&c.marca?" tx":""}${c.seguro===false?" dud":""}" data-tbc="${id}|${r.k}|${j.k}" aria-label="${esc(r.t)} · ${esc(j.t)}: ${c.aplica?(c.marca?esc(c.marca):"sí"):"no"}"><span class="mk">${c.aplica&&c.marca?`<span class="mt">${esc(c.marca)}</span>`:""}</span></button></td>`).join("")}</tr>`;
      }).join("");
      if(rows) body+=`<tr class="grp ${colorDe(g.color,gi)}"><th colspan="${cols.length+1}">${esc(g.t)}${g.pregunta?`<span>${esc(g.pregunta)}</span>`:""}</th></tr>`+rows;
    });
    $("#tbo-"+id).innerHTML=`<div class="tbwrap"><table class="tbm"><thead><tr><th class="rp" scope="col">${esc(s.col_titulo||"Reporte")}</th>${cols.map(j=>`<th class="sj ${colorDe(j.color,j.ci)}" scope="col" title="${esc(j.t)}">${esc(j.corto||j.k)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
    $("#tbn-"+id).textContent=val?`${hits} casillas cumplen el filtro en ${shown} ${s.renglones||"reportes"}.`:`✓ = su DCG lo prevé · punto = no lo prevé · ? = pendiente de confirmar en el DOF. Toca una casilla para ver monto, plazo y disposición.`;
  } else {
    const list=[];
    s.reportes.forEach(r=>{ if(st.grp.size&&!st.grp.has(r.g)) return; cols.forEach(j=>{const c=tbCell(s,r.k,j.k); if(c.aplica&&tbMatch(st,c)) list.push({r,j,c});}); });

const rnd=n=>Math.floor(Math.random()*n);
const mixA=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function ctNew(id){
  const s=tbSec(id), src=tbSec(s.fuente), g=CT[id], nR=s.filas||4, nC=s.columnas||4;
  const reps=src.reportes.filter(r=>!(s.excluir||[]).includes(r.k));
  const allOn=r=>src.sujetos.every(j=>tbCell(src,r.k,j.k).aplica);
  let R0,C0,M;
  for(let t=0;t<400;t++){
    const cs=mixA(src.sujetos).slice(0,nC), rs=mixA(reps).slice(0,nR);
    if(rs.filter(allOn).length>1) continue;
    if(rs.some(r=>cs.some(j=>tbCell(src,r.k,j.k).seguro===false))) continue;
    const m=rs.map(r=>cs.map(j=>!!tbCell(src,r.k,j.k).aplica));
    const pats=new Set(m.map(x=>x.join()));
    if(pats.size<Math.min(3,nR)) continue;
    if(m.filter(x=>!x.some(Boolean)).length>1) continue;
    R0=rs;C0=cs;M=m;break;
  }
  if(!M){R0=reps.slice(0,nR);C0=src.sujetos.slice(0,nC);M=R0.map(r=>C0.map(j=>!!tbCell(src,r.k,j.k).aplica));}
  Object.assign(g,{src,rows:R0,cols:C0,M,done:false});
  if(g.mode==="llena"){g.mine=M.map(x=>x.map(()=>false)); return ctDrawFill(id);}
  const key=m=>m.map(x=>x.map(Number).join("")).join("|"), seen=new Set([key(M)]), opts=[M];
  let guard=0;
  while(opts.length<4&&guard++<500){
    const d=M.map(x=>x.slice()), k=1+rnd(2);
    for(let q=0;q<k;q++){const r=rnd(nR),c=rnd(nC); d[r][c]=!d[r][c];}
    const kk=key(d); if(!seen.has(kk)){seen.add(kk);opts.push(d);}
  }

  ctDrawPick(id);
}

/* ---------- repaso (tandas al azar o secuencia fija) ---------- */
// Con "pool": tandas al azar de 10/20/30 (configurable en "tandas") que no repiten hasta agotar el banco de repaso;
// las opciones se barajan. Con "bloques": secuencia fija, opciones sin barajar (para un guion con letras).
// Clic en una opción = respuesta del alumno; «Revelar respuesta» = la instructora muestra la correcta sin marcar a nadie.
D.secciones.filter(s=>s.tipo==="repaso").forEach(s=>{
  const BK={}; (D.banco||[]).forEach(q=>BK[q.id]=q);
  const TM=D.temas||{}, sim=D.secciones.find(x=>x.tipo==="simulador"), CL=s.claves||{};
  const box=$("#rp-"+s.id), idx=$("#rpi-"+s.id);
  const mix=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const KEY="rp-"+(D.meta.clave||"mapa")+"-"+s.id;
  const POOL=(s.pool||[]).filter(id=>BK[id]);
  let seq=[], i=0, meta=null;
  function fixedSeq(){ const out=[]; (s.bloques||[]).forEach((b,bi)=>b.items.forEach(it=>{if(BK[it.id]) out.push({...BK[it.id],opts:BK[it.id].o.slice(),clave:it.clave||CL[it.id]||"",extra:!!it.extra,bi,bt:b.titulo});})); return out; }
  function tanda(n){
    let used=new Set(st.get(KEY,[])), rest=POOL.filter(id=>!used.has(id)), pick;
    if(rest.length<n){ pick=mix(rest); used=new Set(); const more=mix(POOL.filter(id=>!pick.includes(id))).slice(0,n-pick.length); pick=pick.concat(more); more.forEach(id=>used.add(id)); }
    else { pick=mix(rest).slice(0,n); pick.forEach(id=>used.add(id)); }
    st.set(KEY,[...used]);
    return mix(pick).map(id=>({...BK[id],opts:mix(BK[id].o),clave:CL[id]||""}));
  }
  const sinSalir=()=>`${POOL.length-new Set(st.get(KEY,[])).size} de ${POOL.length} sin salir`;
  function start(n){ seq=n?tanda(n):fixedSeq(); meta={n}; seq.forEach(q=>{q.pick=null;q.shown=false;}); i=0; draw(); box.scrollIntoView({block:"start"}); }
  const fsTxt=()=>document.fullscreenElement?"Salir de pantalla completa":"Pantalla completa";
  if(s.pool){
    idx.innerHTML=(s.tandas||[10,20,30]).map(n=>`<button class="rpb" data-rpn="${n}" aria-pressed="false">${n} preguntas</button>`).join("")+`<span class="bankinfo" id="rpinfo-${s.id}" style="align-self:center">${POOL.length} preguntas en el banco de repaso · ${sinSalir()}</span>`;
    box.innerHTML=`<div class="qtext">Elige una tanda de ${(s.tandas||[10,20,30]).join(", ").replace(/, (\d+)$/," o $1")} preguntas.</div><p style="margin:10px 0 0">Salen al azar y no se repiten hasta agotar las ${POOL.length}; las opciones cambian de orden cada vez.</p>`;
  } else {
    idx.innerHTML=(s.bloques||[]).map((b,bi)=>`<button class="rpb" data-rpb="${bi}" aria-pressed="false">${bi+1} · ${esc(b.titulo)} <small>${b.items.length}</small></button>`).join("");
  }
  function draw(){
    idx.querySelectorAll("[data-rpn]").forEach(b=>b.setAttribute("aria-pressed",String(meta&&+b.dataset.rpn===meta.n)));
    if(!s.pool) idx.querySelectorAll("[data-rpb]").forEach(b=>b.setAttribute("aria-pressed",String(i<seq.length&&+b.dataset.rpb===seq[i].bi)));
    if(i>=seq.length) return fin();
    const q=seq[i], ok=q.opts.indexOf(q.a), lab=s.pool?`Tanda de ${seq.length}`:`Bloque ${q.bi+1} · ${esc(q.bt)}`;
    const good=seq.filter(x=>x.pick!=null&&x.opts[x.pick]===x.a).length;
    box.innerHTML=`<div class="qbar"><span>${lab} · pregunta ${i+1} de ${seq.length}</span><span>Aciertos: ${good}</span></div><div class="qprog"><i style="width:${i/seq.length*100}%"></i></div>
    <div class="qtag"><span>${esc(TM[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}${q.extra?"<span>Extra</span>":""}</div><div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt${q.shown?(k===ok?" right":(k===q.pick?" wrong":"")):""}" data-rpk="${k}"${q.shown?" disabled":""}><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="fb">${q.shown?`${q.pick==null?`<span class="ok">Respuesta ${"ABCD"[ok]}</span>`:(q.pick===ok?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>')}${q.pick!=null?tuHTML(q,q.opts[q.pick]):""} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}${q.clave?`<div class="rp-clave"><div class="lbl">Para no confundirte</div>${q.clave}</div>`:""}`:""}</div>
    <div class="qactions"><button class="btn ghost" data-rpnav="-1"${i===0?" disabled":""}>← Anterior</button>${q.shown?"":`<button class="btn" data-rpshow>Revelar respuesta</button>`}<button class="btn ghost" data-rpnav="1">${i+1===seq.length?"Ver resultado →":"Siguiente →"}</button><button class="btn ghost" data-rpfs>${fsTxt()}</button></div>`;
  }
  function fin(){
    const resp=seq.filter(x=>x.pick!=null), good=resp.filter(x=>x.opts[x.pick]===x.a).length, miss=seq.filter(x=>x.pick!=null&&x.opts[x.pick]!==x.a), c=s.cierre;
    box.innerHTML=`<div class="qbar"><span>${s.pool?`Tanda de ${seq.length} · resultado`:"Cierre"}</span><span>${resp.length?`${good}/${resp.length}`:""}</span></div><div class="qprog"><i style="width:100%"></i></div>
    ${resp.length?`<div class="score"><span class="big">${Math.round(good/resp.length*100)}%</span><span>${good} de ${resp.length} contestadas correctamente.</span></div>`:""}
    ${miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${miss.length})</summary><ul>${miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.opts[m.pick])}</s>${m.d&&m.d[m.opts[m.pick]]?` — ${esc(m.d[m.opts[m.pick]])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
    ${c?`<div class="qtext" style="margin-top:18px">${esc(c.titulo)}</div><ol class="rp-fin">${(c.pasos||[]).map(p=>`<li>${p}</li>`).join("")}</ol>${c.nota?`<div class="rp-clave">${c.nota}</div>`:""}`:""}
    <div class="qactions"><button class="btn ghost" data-rpnav="-1">← Anterior</button>${s.pool?`<button class="btn" data-rpn="${meta.n}">Otra tanda de ${meta.n}</button>`:""}${sim?`<a class="btn ghost" href="#${sim.id}">${esc(sim.nav||"Practicar")}</a>`:""}<button class="btn ghost" data-rpfs>${fsTxt()}</button></div>

  function reveal(){ if(!seq.length||i>=seq.length||seq[i].shown) return; seq[i].shown=true; draw(); }

  function fs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else if(box.requestFullscreen) box.requestFullscreen(); }catch(e){} }
  document.addEventListener("fullscreenchange",()=>{const f=box.querySelector("[data-rpfs]");if(f)f.textContent=fsTxt();});
  const onClick=e=>{
    const n=e.target.closest("[data-rpn]"); if(n){start(+n.dataset.rpn);return;}
    const b=e.target.closest("[data-rpb]"); if(b){if(!seq.length||s.pool)start(0);go(seq.findIndex(q=>q.bi===+b.dataset.rpb));return;}
    const o=e.target.closest("[data-rpk]"); if(o&&seq[i]&&!seq[i].shown){seq[i].pick=+o.dataset.rpk;reveal();return;}
    if(e.target.closest("[data-rpshow]")){reveal();return;}
    const nv=e.target.closest("[data-rpnav]"); if(nv){go(i+(+nv.dataset.rpnav));return;}
    if(e.target.closest("[data-rpfs]")) fs();

  idx.addEventListener("click",onClick); box.addEventListener("click",onClick);
  document.addEventListener("keydown",e=>{
    if(!seq.length||e.target.closest("input,textarea")||!$("#drawer").hidden) return;
    const r=box.getBoundingClientRect(); if(document.fullscreenElement!==box&&(r.bottom<0||r.top>innerHeight)) return;

  if(!s.pool) start(0);

/* ---------- simulador ---------- */
if(!D.secciones.some(s=>s.tipo==="simulador")) return;
const BANK=D.banco||[], TEMAS=D.temas||{};
const MODOS=[{k:"all",l:"Todo mezclado",f:()=>true}].concat((D.modos||[]).map(m=>({k:m.k,l:m.l,f:x=>(m.tema?x.tema===m.tema:true)&&(m.tipos?m.tipos.includes(x.tipo):true)})));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY=D.meta.clave||"mapa", SEEN="seen-"+KEY, SIM="sim-"+KEY;
let seen=new Set(store.get(SEEN,[])), MODE="all", ST=null;
const poolFor=k=>BANK.filter(MODOS.find(m=>m.k===k).f);
const simInfo=()=>`${BANK.length-store.get(SIM,[]).length} de ${BANK.length} sin salir en simulacro`;
const bankInfo=()=>`${BANK.length} reactivos verificados contra el texto oficial · ${simInfo()}`;
function startRound(){const pool=poolFor(MODE);const fresh=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));start(fresh.concat(old).slice(0,10),{kind:"ronda",label:MODOS.find(m=>m.k===MODE).l});}
const SIMSEC=D.secciones.find(s=>s.tipo==="simulador")||{};
function cuotas(n,pesos){ // reparto por resto mayor; sólo temas con reactivos
  const ks=Object.keys(pesos).filter(k=>pesos[k]>0&&BANK.some(x=>x.tema===k)), tot=ks.reduce((a,k)=>a+pesos[k],0);
  if(!ks.length) return null;
  const raw=ks.map(k=>({k,v:n*pesos[k]/tot})), out={}; let asig=0;
  raw.forEach(r=>{out[r.k]=Math.floor(r.v);asig+=out[r.k];});
  raw.sort((a,b)=>(b.v%1)-(a.v%1)).slice(0,n-asig).forEach(r=>out[r.k]++);
  return out;
}
function startSim(n){
  if(SIMSEC.proporcion){
    const q=cuotas(n,SIMSEC.proporcion);
    if(q){
      let used=new Set(store.get(SIM,[])), pick=[], cycled=false;
      Object.entries(q).forEach(([k,c])=>{
        const delTema=BANK.filter(x=>x.tema===k); let rest=shuffle(delTema.filter(x=>!used.has(x.id)));
        if(rest.length<c){cycled=true;delTema.forEach(x=>used.delete(x.id));rest=rest.concat(shuffle(delTema.filter(x=>!rest.includes(x))));}
        rest=rest.slice(0,c); rest.forEach(x=>used.add(x.id)); pick=pick.concat(rest);
      });
      store.set(SIM,[...used]); return start(shuffle(pick),{kind:"simulacro",label:`Simulacro de ${pick.length}`,n,cycled});
    }
  }
  let used=new Set(store.get(SIM,[])), rest=BANK.filter(x=>!used.has(x.id)), cycled=false;
  if(rest.length<n){cycled=true;const take=shuffle(rest);used=new Set();const more=shuffle(BANK.filter(x=>!take.includes(x))).slice(0,n-take.length);rest=take.concat(more);more.forEach(x=>used.add(x.id));}
  else{rest=shuffle(rest).slice(0,n);rest.forEach(x=>used.add(x.id));}
  store.set(SIM,[...used]); start(shuffle(rest),{kind:"simulacro",label:`Simulacro de ${n}`,n,cycled});
}
function start(list,meta){ST={list:list.map(q=>({...q,opts:shuffle(q.o)})),i:0,ok:0,miss:[],byTema:{},meta};document.querySelectorAll(".qmode,.qsim").forEach(b=>b.setAttribute("aria-pressed","false"));render();}
function render(){
  const box=$("#quiz"),n=ST.list.length; if(ST.i>=n) return renderEnd();
  const q=ST.list[ST.i];
  box.innerHTML=`<div class="qbar"><span>${esc(ST.meta.label)} · reactivo ${ST.i+1} de ${n}</span><span>Aciertos: ${ST.ok}</span></div><div class="qprog"><i style="width:${ST.i/n*100}%"></i></div>
  <div class="qtag"><span>${esc(TEMAS[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}</div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>
  <div class="qactions"><button class="btn" id="qNext" hidden>${ST.i+1===n?"Ver resultado":"Siguiente"}</button><button class="btn ghost" id="qQuit">Terminar aquí</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  $("#qNext").addEventListener("click",()=>{ST.i++;render();});
  $("#qQuit").addEventListener("click",()=>{ST.list=ST.list.slice(0,ST.i);renderEnd();});
}
function answer(k){
  const q=ST.list[ST.i]; if(q.done) return; q.done=true; const good=q.opts[k]===q.a;
  const t=ST.byTema[q.tema]||(ST.byTema[q.tema]={ok:0,n:0}); t.n++; if(good){ST.ok++;t.ok++;} else {q.mine=q.opts[k];ST.miss.push(q);}
  seen.add(q.id); store.set(SEEN,[...seen]);
  $("#quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.a)b.classList.add("right");else if(+b.dataset.k===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`${good?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>'}${good?"":tuHTML(q,q.opts[k])} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}`;
  const nb=$("#qNext"); nb.hidden=false; nb.focus();
}
function renderEnd(){
  const box=$("#quiz"),n=ST.list.length,pct=n?Math.round(ST.ok/n*100):0;
  const msg=pct>=90?"Listos para el examen.":pct>=75?"Muy bien: repasen los temas con menos aciertos.":pct>=60?"Van bien, pero hay que repasar.":"Toca volver al mapa y repasar antes del siguiente intento.";
  const ordT=(SIMSEC.orden_resultados||(D.sitio&&D.sitio.orden_resultados))==="temario",TK=Object.keys(TEMAS),ix=k=>{const i=TK.indexOf(k);return i<0?1e9:i};
  const rows=Object.entries(ST.byTema).sort(ordT?(a,b)=>ix(a[0])-ix(b[0]):(a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>`<div class="trow2"><span>${esc(TEMAS[k]||k)}</span><span class="tb"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></span><span class="tv">${v.ok}/${v.n}</span></div>`).join("");
  box.innerHTML=`<div class="printhead"><b>${esc(D.meta.titulo)}</b> · 360Educa · ${esc(ST.meta.label)} · ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div><div class="qbar"><span>${esc(ST.meta.label)} · resultado</span><span>${ST.ok}/${n}</span></div><div class="qprog"><i style="width:100%"></i></div>
  <div class="score"><span class="big">${pct}%</span><span>${ST.ok} de ${n} correctas. ${msg}</span></div>
  ${rows?`<div class="lbl" style="margin-top:14px">Aciertos por tema (${ordT?"en el orden del temario":"de menor a mayor"})</div><div class="trows">${rows}</div>`:""}
  ${ST.miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${ST.miss.length})</summary><ul>${ST.miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.mine||"")}</s>${m.d&&m.d[m.mine]?` — ${esc(m.d[m.mine])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
  <div class="qactions"><button class="btn" id="qAgain">${ST.meta.kind==="simulacro"?"Otro simulacro igual":"Otra ronda"}</button><button class="btn ghost" id="qPrint">Imprimir o guardar en PDF</button><a class="btn ghost" href="#${mapa0?mapa0.id:"top"}">Repasar el mapa</a></div>
  ${ST.meta.kind==="simulacro"?`<p class="siminfo">${simInfo()}${ST.meta.cycled?" · Se completó el banco y empezó una vuelta nueva.":""}</p>`:""}`;
  $("#qAgain").addEventListener("click",()=>ST.meta.kind==="simulacro"?startSim(ST.meta.n):startRound());
  $("#qPrint").addEventListener("click",()=>{const d=box.querySelector("details.miss");if(d)d.open=true;window.print();});
  $("#bankinfo").textContent=bankInfo();
}
document.addEventListener("keydown",e=>{
  if(!ST||e.target.closest("input,textarea")) return;
  const r=$("#quiz").getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
  const k="abcd1234".indexOf(e.key.toLowerCase()); if(k>=0&&ST.i<ST.list.length&&!ST.list[ST.i].done){answer(k%4);e.preventDefault();}
});
$("#modes").innerHTML=MODOS.map(m=>`<button class="qmode" data-m="${m.k}" aria-pressed="false">${esc(m.l)} <small>${poolFor(m.k).length}</small></button>`).join("");
document.querySelectorAll(".qmode").forEach(b=>b.addEventListener("click",()=>{MODE=b.dataset.m;startRound();b.setAttribute("aria-pressed","true");}));
document.querySelectorAll(".qsim").forEach(b=>b.addEventListener("click",()=>{startSim(+b.dataset.n);b.setAttribute("aria-pressed","true");}));
$("#simReset").addEventListener("click",()=>{store.set(SIM,[]);store.set(SEEN,[]);seen=new Set();$("#bankinfo").textContent=bankInfo();});
$("#bankinfo").textContent=bankInfo();
startRound(); document.querySelector('.qmode[data-m="all"]').setAttribute("aria-pressed","true");
})();
</script>
</body>
</html>
