<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Módulo 2 · 2.2 LFPIORPI: 2.2.1 Actividades vulnerables y 2.2.2 Uso de efectivo (reforma DOF 16-jul-2025), con simulador de reactivos.">
<title>2.2 LFPIORPI · 2.2.1 Actividades vulnerables · 2.2.2 Uso de efectivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}

{"meta":{"titulo":"2.2 LFPIORPI · 2.2.1 Actividades vulnerables · 2.2.2 Uso de efectivo","descripcion":"Módulo 2 · 2.2 LFPIORPI: 2.2.1 Actividades vulnerables y 2.2.2 Uso de efectivo (reforma DOF 16-jul-2025), con simulador de reactivos.","repo":"mapa-m2-s7","clave":"m2s7","ruta":"financiero","modulo":"Módulo 2 · Certificación CNBV PLD/FT","unidad":"piezas","eyebrow":"2.2 LFPIORPI · 2.2.1 Actividades vulnerables · 2.2.2 Uso de efectivo · DOF 17-oct-2012 · reformas 2018, 2021 y 16-jul-2025","h1_antes":"2.2","h1_resaltado":"LFPIORPI","h1_despues":"· actividades vulnerables y uso de efectivo","intro":"Cierre del Módulo 2. Después de los 17 temas del 2.1 (leyes y DCG del sistema financiero, en ritmo 2 · 3 · 3 · 2 · 4 · 3) y de las tipologías, el 2.2 pregunta <b>¿y fuera del sistema financiero?<\/b>: dos temas en una sola ley, <b>2.2.1 Actividades vulnerables<\/b> y <b>2.2.2 Uso de efectivo<\/b>. Lo que más confunde son las diferencias entre actividades: cuál identifica, cuál avisa, con qué umbral y cuál avisa siempre. Orden sugerido: mapa de la ley → 2.2.1 → 2.2.2 → sanciones → Modo recitar → trampas → cifras → simulacro de 30.","resumen_portada":"Quién está obligado fuera del sistema financiero: las 17 actividades vulnerables con sus umbrales de identificación y Aviso, y lo que no se puede pagar en efectivo.","fuente":"Fuente: Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita, DOF 17 de octubre de 2012, con reformas DOF 9 de marzo de 2018, 20 de mayo de 2021 y 16 de julio de 2025 (compilado de la UIF que liga el temario). Umbrales en veces el valor diario de la UMA."},"trampas":[{"titulo":"Identificar no es avisar.","texto":"Ocho de las 17 actividades del art. 17 (I, II, VI, VII, VIII, IX, XIII y XV) traen <b>dos umbrales<\/b>: uno a partir del cual se identifica al cliente y otro a partir del cual se presenta Aviso (más alto, salvo en tarjetas prepagadas y monederos, donde ambos son 645); las demás sólo fijan el de Aviso, avisan siempre o no tienen umbral. Por debajo de los umbrales no hay obligación, pero si en <b>6 meses<\/b> la suma supera el umbral de Aviso, la operación <b>podrá<\/b> considerarse sujeta a Aviso (art. 17, penúltimo párrafo)."},{"titulo":"Notario 8 000 ≠ 8 025.","texto":"Inmuebles ante notario: Aviso desde <b>8 000<\/b> UMA tomando el valor más alto entre precio, catastral, comercial o monto garantizado (art. 17 XII A a). Inmuebles en la fr. V y V Bis, avalúos de corredor (XII B a), efectivo en inmuebles (art. 32 I) y forma de pago ante fedatario (art. 33): <b>8 025<\/b>. Y fideicomisos ante notario: <b>4 000<\/b> (XII A d)."},{"titulo":"Lo nuevo de 2025.","texto":"La reforma del 16-jul-2025 agregó, entre otras: la AV de <b>desarrollo inmobiliario<\/b> (17 V Bis) y de facilitadores de mecanismos alternativos (17 XII D); el <b>Aviso de 24 horas<\/b> por sospecha, aunque la operación no se celebre (18 VI); el programa de cumplimiento de las fr. VII a XI del art. 18 (riesgo, manual, capacitación, monitoreo, auditoría), que entra en vigor en los plazos que fijen las reglas (3.º transitorio); la fr. VIII del art. 32 (consignación de pago) y la suspensión temporal de operaciones (54 Bis). Las etiquetas «Nuevo 2025» de la página salen de las notas «adicionado DOF 16-07-2025» del propio texto."}],"secciones":[{"tipo":"mapa","id":"mapa","nav":"La ley en 12 piezas","titulo":"Orientación: la ley en 4 preguntas y 12 piezas","intro":"Antes de los dos temas, la ley completa en el orden de sus capítulos, en ritmo <b>2 · 4 · 2 · 4 = 12<\/b>. Cada rama responde una pregunta. 2.2.1 vive en la rama 2 y 2.2.2 en la primera pieza de la rama 3 (arts. 32–33); el Beneficiario Controlador del Capítulo IV Bis se estudia con 2.2.1. Toca una pieza para ver lo que contiene.","centro":{"t":"LFPIORPI","s":"12 piezas<br>arts. 1–65"},"ramas":[{"letra":"1","titulo":"¿Para qué y quién manda?","pregunta":"Objeto, definiciones y autoridades","ritmo":"¿Para qué?","corto":"Rama 1","color":"oscuro","items":[{"etiqueta":"Arts. 1–4","nombre":"Disposiciones preliminares","sub":"Capítulo I","verbo":"Defino","desc":"Para qué existe la ley (proteger el sistema financiero y la economía) y qué significa cada término: AV, Aviso, Beneficiario Controlador, PEP, UMA.","orden":1,"panel":"Capítulo I","puntos":["<b>Objeto (art. 2):<\/b> proteger el sistema financiero y la economía nacional con medidas para prevenir y detectar operaciones con recursos de procedencia ilícita, mediante coordinación interinstitucional.","<b>Actividades Vulnerables (art. 3 I):<\/b> las de las Entidades Financieras (art. 14) y las del art. 17.","<b>Beneficiario Controlador (art. 3 III):<\/b> quien obtiene en última instancia el beneficio o ejerce el control efectivo; control incluye voto de <b>más del 25 %<\/b> del capital. Es equiparable a beneficiario final y propietario real <b>· Nuevo 2025<\/b> (sólo la equiparación; la definición fue reformada).","Definiciones nuevas 2025: Cliente o Usuaria (III Bis), Desarrollo Inmobiliario (IV Bis), PEP (IX Bis), Representante Encargada de Cumplimiento (XII Bis), Riesgo (XII Ter) y UMA (XIII Bis). <b>· Nuevo 2025<\/b>","<b>Metales Preciosos:<\/b> oro, plata y platino (IX). <b>Piedras Preciosas:<\/b> aguamarinas, diamantes, esmeraldas, rubíes, topacios, turquesas y zafiros (X).","<b>Relación de negocios (XII):<\/b> formal y habitual; excluye lo ocasional y la fe pública del art. 17 XII.","Supletorias (art. 4): Código de Comercio, Código Civil Federal, LGTOC (nueva 2025), LFPA, Ley General de Transparencia y LFPDPPP."],"destacado":false},{"etiqueta":"Arts. 5–12","nombre":"De las autoridades","sub":"Capítulo II","verbo":"Vigilo","desc":"La SHCP aplica e interpreta la ley y recibe los Avisos; la Unidad de la Fiscalía analiza e investiga. Todas coordinan y protegen la identidad de quien avisa.","orden":2,"panel":"Capítulo II","puntos":["<b>SHCP (art. 5):<\/b> aplica e interpreta en lo administrativo la ley, su Reglamento y sus reglas.","<b>Facultades de la SHCP (art. 6):<\/b> recibir Avisos; padrón de quienes realizan AV (I Bis, nuevo); requerir información; coordinarse; denunciar; requerir comparecencia; resolver recursos de revisión; emitir reglas; medidas para países de mayor riesgo (IX, nuevo); enlace internacional (XI, nuevo).","<b>Unidad de la Fiscalía (arts. 7–8):<\/b> órgano especializado en análisis financiero y contable; su titular es agente del MP de la Federación. Requiere información a la SHCP; a las Entidades Financieras siempre <b>a través de la SHCP<\/b> (art. 8 X).","Requisitos del personal de la Unidad y de quien en la SHCP accede a la base de Avisos (arts. 9–10).","Programas de capacitación de SHCP, Fiscalía, SSPC y Guardia Nacional (art. 11).","<b>Obligaciones de las autoridades (art. 12):<\/b> coordinarse, no proporcionar información a quien no esté facultado, proteger la identidad de quien da Avisos y procurar equilibrio regulatorio."],"destacado":false}]},{"letra":"2","titulo":"¿Quién está obligado y qué hace?","pregunta":"Entidades financieras y actividades vulnerables","ritmo":"¿Quién y qué?","corto":"Rama 2","color":"principal","items":[{"etiqueta":"Arts. 13–16","nombre":"De las Entidades Financieras","sub":"Capítulo III · Sección Primera","verbo":"Remito","desc":"Bancos, casas de bolsa, SOFOM y demás: también hacen AV; se rigen por esta ley y por sus leyes especiales (con sus DCG), y las supervisan la CNBV, la CNSF o la CONSAR.","orden":3,"panel":"Capítulo III · Sección Primera","puntos":["Se rigen por esta ley y por las leyes que especialmente las regulan (art. 13); sus actos y operaciones son AV (art. 14).","<b>Art. 15 · 4 obligaciones:<\/b> medidas para prevenir y detectar e identificar clientes (I); reportes a la SHCP (II); entregar información (III); conservar al menos <b>10 años<\/b> (IV).","Supervisión: <b>CNBV, CNSF o CONSAR<\/b>, según corresponda (art. 16).","Lo de las Entidades Financieras se estudia en H1 a H6 (2.1.1 a 2.1.17); aquí sólo su lugar en la ley."],"destacado":false},{"etiqueta":"Arts. 17–22 Bis","nombre":"De las Actividades Vulnerables","sub":"Capítulo III · Sección Segunda","verbo":"Identifico","desc":"El corazón del examen: las 17 actividades del art. 17 con sus umbrales, las 12 obligaciones del art. 18, el Representante Encargado y la supervisión de la SHCP.","orden":4,"panel":"Capítulo III · Sección Segunda","puntos":["<b>Art. 17:<\/b> 16 fracciones más la V Bis = 17 actividades, cada una con su umbral de identificación y de Aviso (ver fichas).","También realizan AV quienes actúan por fideicomiso u otra figura jurídica. <b>· Nuevo 2025<\/b>","<b>Art. 18:<\/b> 12 obligaciones (I a XI, con IV Bis): identificar, actividad u ocupación, Beneficiario Controlador, conservar, padrón, visitas, Avisos, riesgo, manual, capacitación, monitoreo y auditoría.","<b>Art. 19:<\/b> medidas simplificadas según el riesgo; personas morales mexicanas de derecho público con régimen simplificado (nuevo 2025).","<b>Art. 20:<\/b> las personas morales y quienes actúen por fideicomiso u otra figura jurídica designan una Representante Encargada del Cumplimiento; las personas físicas cumplen personal y directamente, salvo que avisen por Entidad Colegiada (Sección Cuarta).","<b>Art. 21:<\/b> si el cliente no da la información, quien realiza la AV se abstiene, sin responsabilidad.","<b>Art. 22:<\/b> dar Avisos no viola secreto alguno. <b>Art. 22 Bis:<\/b> la SHCP supervisa las AV, salvo las de la Sección Primera. <b>· Nuevo 2025<\/b>"],"destacado":true,"ir":"#t2-2-1"},{"etiqueta":"Arts. 23–25","nombre":"Plazos y formas de los Avisos","sub":"Capítulo III · Sección Tercera","verbo":"Aviso","desc":"Cuándo y cómo se avisa: a más tardar el día 17 del mes siguiente, por medios electrónicos y en el formato oficial, con datos del cliente y, en su caso, del Beneficiario Controlador.","orden":5,"panel":"Capítulo III · Sección Tercera","puntos":["Avisos a más tardar el <b>día 17 del mes inmediato siguiente<\/b> a la operación (art. 23); la SHCP puede exceptuar plazos por acuerdo en el DOF.","Medios electrónicos y formatos oficiales publicados en el DOF (art. 24).","Contenido (art. 24): datos de quien realiza la AV; del cliente y, en su caso, del Beneficiario Controlador, con su actividad u ocupación; descripción de la AV.","Notarios: «podrán cumplir» los Avisos de inmuebles (17 XII A a) «únicamente cuando» se presenten por los medios que establezcan las disposiciones fiscales federales y contengan la información del art. 24.","La SHCP puede requerir soporte por escrito o en visita (art. 25)."],"destacado":false},{"etiqueta":"Arts. 26–31","nombre":"Avisos por conducto de Entidades Colegiadas","sub":"Capítulo III · Sección Cuarta","verbo":"Delego","desc":"Quien realiza una AV puede presentar sus Avisos a través de una entidad colegiada de su gremio, que debe cumplir 9 requisitos y responde por lo que le sea imputable.","orden":6,"panel":"Capítulo III · Sección Cuarta","puntos":["Es opcional: «podrán» presentarlos por conducto de una Entidad Colegiada (art. 26).","<b>9 requisitos (art. 27):<\/b> integrada por quienes hacen tareas similares; padrón actualizado; objeto de presentar Avisos; representante designado con poder general para actos de administración y capacitación anual; confidencialidad; custodia; mandato expreso; sistemas; convenio vigente con la SHCP.","Puede establecer un órgano concentrador previo convenio (art. 27).","Responde por incumplimientos que le sean imputables; no por los del integrante (art. 30).","Avisa con al menos <b>30 días<\/b> de anticipación su extinción o que dejará de actuar (art. 31)."],"destacado":false}]},{"letra":"3","titulo":"¿Qué no puedo pagar en efectivo y a quién transparento?","pregunta":"Efectivo y Beneficiario Controlador","ritmo":"¿Qué no?","corto":"Rama 3","color":"negro","items":[{"etiqueta":"Arts. 32–33","nombre":"Del uso de efectivo y metales","sub":"Capítulo IV","verbo":"Prohíbo","desc":"Prohíbe pagar o aceptar en efectivo, divisas o metales preciosos ciertos actos desde un umbral (igual o superior): 8 025 UMA en derechos reales sobre inmuebles y 3 210 en los demás supuestos.","orden":7,"panel":"Capítulo IV","puntos":["Prohibido liquidar o pagar, y aceptar, con monedas y billetes en moneda nacional o divisas y Metales Preciosos, <b>aun por conducto de una Entidad Financiera<\/b> (art. 32).","Inmuebles: ≥ <b>8 025<\/b> UMA (I). Vehículos, joyas y arte, boletos y premios, blindaje, acciones y partes sociales, y uso o goce mensual: ≥ <b>3 210<\/b> UMA (II a VII).","Consignación de pago de esas operaciones, con los mismos umbrales (VIII). <b>· Nuevo 2025<\/b>","La SHCP podrá extender la prohibición a bienes fungibles por reglas (art. 32, último párrafo). <b>· Nuevo 2025<\/b>","<b>Art. 33:<\/b> los fedatarios identifican la forma de pago cuando la operación es ≥ 8 025 UMA; si es menor y se pagó antes de la firma, basta la declaración bajo protesta."],"destacado":false,"ir":"#t2-2-2"},{"etiqueta":"Arts. 33 Bis–33 Quáter","nombre":"Del Beneficiario Controlador","sub":"Capítulo IV Bis","verbo":"Registro","desc":"Capítulo nuevo de 2025: las sociedades mercantiles identifican a su Beneficiario Controlador, conservan el soporte y lo registran en el sistema de la Secretaría de Economía.","orden":8,"panel":"Capítulo IV Bis","puntos":["Atender los requerimientos de autoridad para determinar a su Beneficiario Controlador y conservar el soporte (33 Bis).","Aviso de la inscripción de transmisiones de acciones o partes sociales en el sistema que opera la Secretaría de Economía (33 Bis).","Registrar en ese sistema la información de su Beneficiario Controlador (33 Ter).","La SHCP promoverá con los estados que sociedades y asociaciones civiles identifiquen a su Beneficiario Controlador (33 Quáter).","Para este capítulo, Beneficiario Controlador es quien controla la persona moral aunque no sea cliente de una AV (art. 3 III). <b>· Nuevo 2025<\/b>","Propietario real en las DCG y en los Lineamientos 2019: H6 (2.1.16)."],"destacado":false}]},{"letra":"4","titulo":"¿Quién revisa y qué pasa si no cumplo?","pregunta":"Verificación, reserva, sanciones y delitos","ritmo":"¿Y si no?","corto":"Rama 4","color":"morado","items":[{"etiqueta":"Arts. 34–37","nombre":"De las visitas de verificación","sub":"Capítulo V","verbo":"Verifico","desc":"La SHCP comprueba de oficio y en cualquier tiempo, con visitas o requerimientos, y sólo puede revisar operaciones de los últimos cinco años.","orden":9,"panel":"Capítulo V","puntos":["De oficio y en cualquier tiempo, por visitas o requerimientos, a quienes hacen AV, Entidades Colegiadas u órgano concentrador (art. 34).","Se entrega sólo lo directamente relacionado con las AV (art. 34).","Supletoria: Ley Federal de Procedimiento Administrativo (art. 35).","Alcance: operaciones de los <b>5 años<\/b> anteriores al inicio de la visita (art. 36).","Puede pedir el auxilio de la fuerza pública (art. 37)."],"destacado":false},{"etiqueta":"Arts. 38–51 Ter","nombre":"De la reserva y manejo de información","sub":"Capítulo VI","verbo":"Resguardo","desc":"La información de los Avisos es confidencial y sólo sirve para prevenir e investigar; la SHCP denuncia, comparte con autoridades y lleva la lista de cargos de PEP.","orden":10,"panel":"Capítulo VI","puntos":["Confidencial y reservada: soporte de Avisos, identidad de quien los presenta y del Representante Encargado (art. 38).","Uso exclusivo para prevención, identificación, investigación y sanción (art. 39).","La SHCP denuncia ante la Fiscalía; la Unidad le informa <b>semestralmente<\/b> el estado de las denuncias (art. 40).","Los Avisos <b>no tienen por sí mismos valor probatorio pleno<\/b> (art. 42).","Comparecencias del oficial o Representante Encargado: pueden desahogarlas representantes legales o apoderados (41 Bis). <b>· Nuevo 2025<\/b>","Sistemas de pagos y emisores de tarjetas entregan información requerida en <b>30 días<\/b> (art. 51).","Información de dependencias, INE, STPS y empresas públicas (51 Bis); lista nominativa de cargos de PEP a cargo de la SHCP (51 Ter). <b>· Nuevo 2025<\/b>"],"destacado":false},{"etiqueta":"Arts. 52–61","nombre":"De las sanciones administrativas","sub":"Capítulo VII","verbo":"Multo","desc":"La SHCP multa a quien hace AV en tres escalones (200, 2 000 y 10 000 UMA como piso); las Entidades Financieras se sancionan por su órgano supervisor y sus leyes.","orden":11,"panel":"Capítulo VII","puntos":["La SHCP sanciona; las Entidades Financieras, por sus órganos desconcentrados y sus leyes (art. 52).","7 conductas (art. 53) y 3 escalones de multa (art. 54).","Suspensión temporal de operaciones con ciertos clientes (54 Bis). <b>· Nuevo 2025<\/b>","Abstención por única ocasión si se regulariza espontáneamente; después, reducción de hasta 50 % (art. 55).","Revocación y cancelación: AV de fr. I, IX y X (art. 56), corredores (57), notarios y corredores por notorias deficiencias (58) y aduanales (59).","Reincidencia: misma infracción dentro de <b>2 años<\/b> desde que quedó firme la resolución (art. 60). Impugnación: revisión o TFJA (art. 61)."],"destacado":false,"ir":"#sanciones"},{"etiqueta":"Arts. 62–65","nombre":"De los delitos","sub":"Capítulo VIII","verbo":"Castigo","desc":"Cárcel para quien falsea o altera la información de los Avisos (2 a 8 años) y para quien revela o usa indebidamente esa información (4 a 10 años).","orden":12,"panel":"Capítulo VIII","puntos":["<b>Art. 62 · 2 a 8 años<\/b> y 500 a 2 000 días multa: información falsa, alterada o ilegible (III, nueva 2025); admite comisión culposa.","<b>Art. 63 · 4 a 10 años<\/b> y 500 a 2 000 días multa: servidor público que usa indebidamente la información (I); quien revela un Aviso o requerimiento, exista o no (II).","Las penas del art. 62 y del <b>63 fr. II<\/b> se <b>duplican<\/b> si quien comete el delito es o fue en los 2 años previos servidor público encargado de prevenir, detectar, investigar o juzgar delitos; a todos los del 62 y 63, además, inhabilitación por el mismo tiempo que la prisión (art. 64).","Denuncia previa de la SHCP para empleados de instituciones financieras; en la 63 II, denuncia o querella (art. 65)."],"destacado":false,"ir":"#sanciones"}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por pieza","html":"<b>Defino<\/b> y <b>Vigilo<\/b> · <b>Remito<\/b>, <b>Identifico<\/b>, <b>Aviso<\/b> y <b>Delego<\/b> · <b>Prohíbo<\/b> y <b>Registro<\/b> · <b>Verifico<\/b>, <b>Resguardo<\/b>, <b>Multo<\/b> y <b>Castigo<\/b>."}},{"tipo":"mapa","id":"t2-2-1","nav":"2.2.1 Actividades vulnerables","titulo":"2.2.1 Actividades vulnerables · las 17 del art. 17","intro":"16 fracciones más la V Bis, <b>en el orden de la ley<\/b>, en cuatro tramos de ritmo <b>6 · 4 · 3 · 4 = 17<\/b>. A la derecha de cada una, sus umbrales en veces el valor diario de la UMA: <b>Id.<\/b> = identificar · <b>Av.<\/b> = Aviso. Toca una fracción para ver sus incisos. Después vienen la agrupación por tipo (ayuda), los umbrales, las 12 obligaciones del art. 18, los Avisos y el Beneficiario Controlador.","centro":{"t":"Art. 17","s":"17 actividades<br>6 · 4 · 3 · 4"},"ramas":[{"letra":"1","titulo":"Fracciones I a V Bis","pregunta":"Juegos, tarjetas, cheques, préstamos e inmuebles","corto":"Fr. I a V Bis","color":"principal","estilo":"ficha","items":[{"etiqueta":"I","nombre":"Juegos con apuesta, concursos y sorteos","gancho":"¿Apuestas?","conteo":"Id. 325 · Av. 645","puntos":["Venta de boletos o fichas, pago de premios y cualquier operación financiera, individual o en serie de transacciones vinculadas en apariencia.","Sólo los de organismos descentralizados o con permiso de Gobernación (Ley Federal de Juegos y Sorteos).","Identificación ≥ <b>325<\/b> UMA; Aviso ≥ <b>645<\/b> UMA."]},{"etiqueta":"II","nombre":"Tarjetas y monederos (no financieros)","gancho":"¿Plástico?","conteo":"3 incisos","puntos":["Emisión o comercialización habitual o profesional, distinta de la de Entidades Financieras.","a) Tarjetas de servicios o de crédito: gasto mensual acumulado ≥ <b>805<\/b> (Id.) y ≥ <b>1 285<\/b> (Av.).","b) Tarjetas prepagadas: identificación ≥ <b>645<\/b> por operación (comercialización o abono); Aviso ≥ <b>645<\/b> cuando se comercialicen o se abonen recursos.","c) Instrumentos de almacenamiento de valor monetario: identificación ≥ <b>645<\/b> por operación (emisión, comercialización o abono); Aviso ≥ <b>645<\/b> cuando se comercialicen o se abonen recursos."]},{"etiqueta":"III","nombre":"Cheques de viajero (no financieros)","gancho":"¿Cheque para viajar?","conteo":"Av. 645","puntos":["Emisión y comercialización habitual o profesional, distinta de la de Entidades Financieras.","La ley no fija umbral propio de identificación; Aviso ≥ <b>645<\/b> UMA."]},{"etiqueta":"IV","nombre":"Mutuos, garantías, préstamos y créditos (no financieros)","gancho":"¿Presto?","conteo":"Av. 1 605","puntos":["Ofrecimiento habitual o profesional, con o sin garantía, por sujetos distintos de las Entidades Financieras.","La ley no fija umbral propio de identificación; Aviso ≥ <b>1 605<\/b> UMA."]},{"etiqueta":"V","nombre":"Construcción, desarrollo e intermediación inmobiliaria","gancho":"¿Vendo una casa?","conteo":"Av. 8 025","puntos":["Construcción o desarrollo de inmuebles e intermediación en la transmisión o constitución de derechos, con compra o venta de los propios bienes, de forma habitual o profesional.","La ley no fija umbral propio de identificación; Aviso ≥ <b>8 025<\/b> UMA."]},{"etiqueta":"V Bis","nombre":"Recursos para un desarrollo inmobiliario","gancho":"¿Recibo dinero para construir?","conteo":"Av. 8 025","puntos":["Recepción de recursos destinados a un Desarrollo Inmobiliario (proyecto de construcción o fraccionamiento) cuya finalidad sea su venta o renta. <b>· Nuevo 2025<\/b>","Aviso ≥ <b>8 025<\/b> UMA."]}]},{"letra":"2","titulo":"Fracciones VI a IX","pregunta":"Joyas, arte, vehículos y blindaje","corto":"Fr. VI a IX","color":"oscuro","estilo":"ficha","items":[{"etiqueta":"VI","nombre":"Metales, piedras preciosas, joyas y relojes","gancho":"¿Brilla?","conteo":"Id. 805 · Av. 1 605","puntos":["Comercialización o intermediación habitual o profesional de compra o venta.","Excepto cuando intervenga el Banco de México.","Identificación ≥ <b>805<\/b>; Aviso ≥ <b>1 605<\/b> UMA."]},{"etiqueta":"VII","nombre":"Obras de arte","gancho":"¿Es arte?","conteo":"Id. 2 410 · Av. 4 815","puntos":["Subasta o comercialización habitual o profesional de compra o venta.","Identificación ≥ <b>2 410<\/b>; Aviso ≥ <b>4 815<\/b> UMA."]},{"etiqueta":"VIII","nombre":"Vehículos aéreos, marítimos y terrestres","gancho":"¿Tiene motor?","conteo":"Id. 3 210 · Av. 6 420","puntos":["Comercialización o distribución habitual o profesional, nuevos o usados.","Identificación ≥ <b>3 210<\/b>; Aviso ≥ <b>6 420<\/b> UMA."]},{"etiqueta":"IX","nombre":"Blindaje","gancho":"¿Lo blindo?","conteo":"Id. 2 410 · Av. 4 815","puntos":["Servicios habituales o profesionales de blindaje de vehículos terrestres, nuevos o usados, y de inmuebles.","Identificación ≥ <b>2 410<\/b>; Aviso ≥ <b>4 815<\/b> UMA (los mismos que el arte)."]}]},{"letra":"3","titulo":"Fracciones X a XII","pregunta":"Traslado de valores, profesionales y fe pública","corto":"Fr. X a XII","color":"negro","estilo":"ficha","items":[{"etiqueta":"X","nombre":"Traslado o custodia de dinero o valores","gancho":"¿Dinero en camión?","conteo":"Av. 3 210 o siempre","puntos":["Prestación habitual o profesional; excepto cuando intervengan el Banco de México y las instituciones para el depósito de valores.","Aviso: a) ≥ <b>3 210<\/b> UMA; b) <b>en todos los casos<\/b> si no se puede determinar el monto trasladado o custodiado. <b>· Nuevo 2025<\/b>"]},{"etiqueta":"XI","nombre":"Servicios profesionales independientes","gancho":"¿Actúo en nombre del cliente?","conteo":"Sin umbral","puntos":["Sin relación laboral con el cliente, cuando se prepara para él o se realiza en su nombre: a) compraventa de inmuebles o cesión de derechos; b) administración de recursos, valores u otros activos; c) manejo de cuentas bancarias, de ahorro o de valores; d) organización de aportaciones de capital para sociedades mercantiles; e) constitución, escisión, fusión, operación y administración de personas morales o vehículos corporativos, incluido el fideicomiso, y compra o venta de entidades mercantiles.","Aviso: cuando, en nombre y representación del cliente, realiza una operación financiera relacionada con esos incisos; con respeto al secreto profesional y garantía de defensa."]},{"etiqueta":"XII","nombre":"Fe pública","gancho":"¿Lo formalizo?","conteo":"A · B · C · D","puntos":["<b>A. Notarios:<\/b> a) inmuebles, Aviso ≥ <b>8 000<\/b> (el valor más alto entre precio, catastral, comercial o monto garantizado), salvo garantías a favor del sistema financiero u organismos públicos de vivienda; b) poderes irrevocables: <b>siempre<\/b>; c) constitución de personas morales, cambios de capital, fusión, escisión y compraventa de acciones: <b>siempre<\/b>; d) fideicomisos traslativos o de garantía: ≥ <b>4 000<\/b>, salvo los de garantía de crédito del sistema financiero u organismos de vivienda; e) mutuo o crédito con acreedor fuera del sistema financiero: <b>siempre<\/b>.","<b>B. Corredores:<\/b> a) avalúos ≥ <b>8 025<\/b>; b) personas morales mercantiles; c) fideicomisos en que puedan actuar, salvo garantía de crédito del sistema financiero; d) mutuo o crédito mercantil con acreedor fuera del sistema financiero. Avisan en términos de esos incisos.","<b>C. Servidores públicos con fe pública<\/b> (art. 3 VII). El texto no enumera actos (ver «Ojo con el texto»).","<b>D. Facilitadores<\/b> públicos y privados de mecanismos alternativos de solución de controversias: las mismas operaciones del apartado A. <b>· Nuevo 2025<\/b>"]}]},{"letra":"4","titulo":"Fracciones XIII a XVI","pregunta":"Donativos, aduana, arrendamiento y activos virtuales","corto":"Fr. XIII a XVI","color":"morado","estilo":"ficha","items":[{"etiqueta":"XIII","nombre":"Donativos a asociaciones sin fines de lucro","gancho":"¿Me donan?","conteo":"Id. 1 605 · Av. 3 210","puntos":["Recepción de donativos por asociaciones y sociedades sin fines de lucro.","Identificación ≥ <b>1 605<\/b>; Aviso ≥ <b>3 210<\/b> UMA."]},{"etiqueta":"XIV","nombre":"Comercio exterior (agentes y agencias aduanales)","gancho":"¿Cruza la aduana?","conteo":"Siempre aviso","puntos":["Agente o apoderado aduanal o agencia aduanal, y despacho que promuevan personas sin agente, de: a) vehículos; b) máquinas de juegos de apuesta; c) equipos y materiales para tarjetas de pago; f) materiales de resistencia balística: <b>cualquiera que sea el valor<\/b>.","d) Joyas, relojes, piedras y metales preciosos con valor individual ≥ <b>485<\/b> UMA; e) obras de arte con valor individual ≥ <b>4 815<\/b> UMA.","Son objeto de Aviso <b>en todos los casos<\/b> señalados."]},{"etiqueta":"XV","nombre":"Arrendamiento de inmuebles","gancho":"¿Rento?","conteo":"Id. >1 605 · Av. 3 210","puntos":["Constitución de derechos personales de uso o goce de inmuebles, con valor mensual.","Identificación: valor mensual <b>superior a<\/b> 1 605 UMA; Aviso: monto mensual <b>igual o superior a<\/b> 3 210 UMA."]},{"etiqueta":"XVI","nombre":"Activos virtuales","gancho":"¿Cripto?","conteo":"Av. 210 · comisión 4","puntos":["Ofrecimiento habitual <b>y<\/b> profesional de intercambio de activos virtuales por sujetos distintos de las Entidades Financieras, en plataformas que administren u operen; incluye custodiar, almacenar o transferir y operaciones con mexicanos desde otra jurisdicción.","Aviso: a) operación de cada cliente ≥ <b>210<\/b> UMA; b) contraprestación por el servicio ≥ <b>4<\/b> UMA. <b>· Nuevo 2025<\/b>","Deben obtener, mantener y poner a disposición de las autoridades la información del originante, del receptor y, en su caso, del Beneficiario Controlador. <b>· Nuevo 2025<\/b>","No es activo virtual la moneda de curso legal ni las divisas.","<b>Ojo en H7 (tipologías):<\/b> en las tipologías de la UIF, «A.v.» significa <b>activos virtuales<\/b>, no actividades vulnerables."]}]}],"frase":{"titulo":"Para recitar en voz alta: una pregunta por fracción","html":"<b>I<\/b> ¿apuestas? · <b>II<\/b> ¿plástico? · <b>III<\/b> ¿cheque para viajar? · <b>IV<\/b> ¿presto? · <b>V<\/b> ¿vendo una casa? · <b>V Bis<\/b> ¿recibo dinero para construir? · <b>VI<\/b> ¿brilla? · <b>VII<\/b> ¿es arte? · <b>VIII<\/b> ¿tiene motor? · <b>IX<\/b> ¿lo blindo? · <b>X<\/b> ¿dinero en camión? · <b>XI<\/b> ¿actúo en nombre del cliente? · <b>XII<\/b> ¿lo formalizo? · <b>XIII<\/b> ¿me donan? · <b>XIV<\/b> ¿cruza la aduana? · <b>XV<\/b> ¿rento? · <b>XVI<\/b> ¿cripto?"}},{"tipo":"tarjetas","id":"grupos","nav":"Por tipo","titulo":"2.2.1 · Ayuda para distinguirlas: las mismas 17 por tipo","intro":"Agrupación didáctica de 360Educa, no de la ley: sirve para no confundir actividades parecidas. El orden que se pregunta es el de las fracciones, arriba.","tarjetas":[{"barra":true,"color":"oscuro","titulo":"6 · 4 · 3 · 4 por lo que hace la actividad","ancho":true,"lista":["<b>¿Mueve dinero o un medio de pago?<\/b> (6) · I juegos · II tarjetas y monederos · III cheques de viajero · IV préstamos · X traslado o custodia · XVI activos virtuales","<b>¿Vende un bien de lujo o lo protege?<\/b> (4) · VI metales, piedras, joyas y relojes · VII arte · VIII vehículos · IX blindaje","<b>¿Toca un inmueble?<\/b> (3) · V construcción e intermediación · V Bis recursos para desarrollo inmobiliario · XV arrendamiento","<b>¿Presta un servicio, da forma legal o recibe donativos?<\/b> (4) · XI servicios profesionales · XII fe pública · XIII donativos · XIV comercio exterior"]}],"nota":"Coincide el ritmo 6 · 4 · 3 · 4 con el de los tramos por fracción, pero los grupos no son los mismos: no los mezcles al recitar."},{"tipo":"tarjetas","id":"umbrales","nav":"Umbrales","titulo":"2.2.1 · Identificar ≠ avisar: la tabla del 1 605","intro":"Un gancho exacto: muchos umbrales de Aviso son <b>1 605 × n<\/b> UMA. Aprende la tabla y luego las excepciones.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"La tabla del 1 605","subtitulo":"Umbrales de Aviso (art. 17) y límites de efectivo (art. 32)","filas":[{"k":"× 1 = 1 605","v":"Préstamos (IV) · joyas, metales y relojes (VI)"},{"k":"× 2 = 3 210","v":"Traslado de valores (X a) · donativos (XIII) · arrendamiento mensual (XV) · <b>límite de efectivo<\/b> salvo derechos reales sobre inmuebles (art. 32 II a VII; en VII, mensual)"},{"k":"× 3 = 4 815","v":"Arte (VII) · blindaje (IX) · y, como límite de la actividad, arte en aduana por valor individual (XIV e)"},{"k":"× 4 = 6 420","v":"Vehículos (VIII)"},{"k":"× 5 = 8 025","v":"Inmuebles (V) · desarrollo inmobiliario (V Bis) · <b>límite de efectivo en inmuebles<\/b> (32 I) · forma de pago ante fedatario (33) · y, como límite de la actividad, avalúos de corredor (XII B a)"}]},{"encabezado":true,"color":"oscuro","titulo":"Identificar ≈ la mitad","subtitulo":"Orientación, no regla","filas":[{"k":"Juegos (I)","v":"Id. 325 · Av. 645"},{"k":"Joyas (VI)","v":"Id. 805 · Av. 1 605"},{"k":"Arte y blindaje (VII, IX)","v":"Id. 2 410 · Av. 4 815"},{"k":"Vehículos (VIII)","v":"Id. 3 210 · Av. 6 420"},{"k":"Donativos (XIII)","v":"Id. 1 605 · Av. 3 210"},{"k":"Arrendamiento (XV)","v":"Id. <b>superior a<\/b> 1 605 · Av. <b>igual o superior a<\/b> 3 210"},{"k":"Excepciones","v":"Tarjetas de crédito (II a): <b>805 → 1 285<\/b> · prepagadas y monederos (II b, c): <b>645 = 645<\/b>"}]},{"encabezado":true,"color":"negro","titulo":"Siempre aviso o sin umbral","subtitulo":"Lo que no tiene número","filas":[{"k":"Siempre","v":"Notario: poderes irrevocables (XII A b), personas morales (XII A c) y mutuo con acreedor no financiero (XII A e) · comercio exterior (XIV; en joyas y arte, desde su valor individual de 485 y 4 815) · traslado sin monto determinable (X b)"},{"k":"Sin umbral","v":"Servicios profesionales (XI): avisa cuando hace una operación financiera en nombre del cliente"},{"k":"Sólo umbral de Aviso","v":"La ley no fija umbral propio de identificación en III, IV, V, V Bis, X y XVI. En XII y XIV fija umbrales sólo en algunos incisos: en XII, de Aviso (A a 8 000, A d 4 000) o de la actividad (B a 8 025); en XIV, de la actividad (d 485, e 4 815), con Aviso en todos los casos"},{"k":"Fuera del 1 605","v":"Aviso de notario en inmuebles <b>8 000<\/b> · notario en fideicomisos <b>4 000<\/b> · cripto <b>210<\/b> y comisión <b>4<\/b> · en aduana, joyas desde <b>485<\/b> de valor individual (delimita la actividad)"}]}],"nota":"Por debajo de los umbrales no hay obligación; pero si la suma en <b>6 meses<\/b> supera el umbral de Aviso, <b>podrá<\/b> considerarse sujeta a Aviso (art. 17, penúltimo párrafo). La SHCP podrá exceptuar del Aviso lo hecho por conducto del sistema financiero (art. 17, último párrafo)."},{"tipo":"mapa","id":"obligaciones","nav":"Art. 18","titulo":"2.2.1 · Las 12 obligaciones del art. 18","intro":"Fracciones I a XI, con la IV Bis. Hilo para recordarlas: primero <b>la vida del cliente<\/b> (identifico, pregunto, busco, guardo), luego <b>el trámite<\/b> (me registro, abro la puerta, aviso) y al final <b>la casa por dentro<\/b>, todo nuevo de 2025 (mido, escribo, capacito, monitoreo, me audito). Las fr. VII a XI entran en vigor en los plazos que fijen las reglas (3.º transitorio 2025).","centro":{"t":"Art. 18","s":"12 obligaciones<br>4 · 3 · 5"},"ramas":[{"letra":"1","titulo":"La vida del cliente","pregunta":"¿A quién atiendo?","corto":"Cliente","color":"principal","estilo":"ficha","items":[{"etiqueta":"I","nombre":"Identificar y conocer al cliente","gancho":"¿Quién es?","conteo":"Identifico","puntos":["Identificar y conocer de manera directa a las personas Clientes o Usuarias y verificar su identidad con documentos o medios con reconocimiento oficial; recabar copia, conforme a las reglas."]},{"etiqueta":"II","nombre":"Actividad u ocupación","gancho":"¿A qué se dedica?","conteo":"Pregunto","puntos":["Sólo cuando hay <b>Relación de negocios<\/b>: pedir su actividad u ocupación, basándose, entre otros, en sus avisos ante el RFC."]},{"etiqueta":"III","nombre":"Beneficiario Controlador","gancho":"¿Quién está detrás?","conteo":"Busco","puntos":["Persona moral, fideicomiso u otra figura: recabar documentos que identifiquen a su Beneficiario Controlador.","Persona física: recabar su declaración de si conoce o no la existencia de un Beneficiario Controlador y, en su caso, la documentación. <b>· Nuevo 2025<\/b>"]},{"etiqueta":"IV","nombre":"Conservar","gancho":"¿Dónde lo guardo?","conteo":"Guardo","puntos":["Custodiar y evitar la destrucción de la información, incluidos registros que permitan reconstruir operaciones, correspondencia comercial y análisis previos.","Física o electrónica, en el domicilio registrado ante la SHCP (excepto la fr. XIV del art. 17), al menos <b>10 años<\/b> desde la AV; el plazo se interrumpe si hay recurso o juicio."]}]},{"letra":"2","titulo":"El trámite","pregunta":"¿Qué presento?","corto":"Trámite","color":"oscuro","estilo":"ficha","items":[{"etiqueta":"IV Bis","nombre":"Alta en el padrón","gancho":"¿Estoy registrado?","conteo":"Me registro","puntos":["Alta, registro, modificación o baja del Padrón de personas que realizan AV, por el portal de internet. <b>· Nuevo 2025<\/b>"]},{"etiqueta":"V","nombre":"Visitas de verificación","gancho":"¿Dejo entrar?","conteo":"Abro la puerta","puntos":["Brindar las facilidades para las visitas de verificación."]},{"etiqueta":"VI","nombre":"Avisos e Informes","gancho":"¿Lo reporté?","conteo":"Aviso","puntos":["Presentar Avisos e Informes conforme a la ley y las reglas (día 17 del mes siguiente, art. 23).","Por <b>sospecha<\/b> o hechos o indicios: Aviso dentro de las <b>24 horas<\/b> siguientes, <b>incluso si la operación no se celebró<\/b>. <b>· Nuevo 2025<\/b>"]}]},{"letra":"3","titulo":"La casa por dentro","pregunta":"¿Cómo me organizo?","corto":"Casa","color":"negro","estilo":"ficha","items":[{"etiqueta":"VII","nombre":"Evaluación basada en riesgos","gancho":"¿Qué tan riesgoso soy?","conteo":"Mido","puntos":["Identificar, analizar, entender y mitigar sus Riesgos y los de sus clientes. <b>· Nuevo 2025<\/b>"]},{"etiqueta":"VIII","nombre":"Manual de Políticas Internas","gancho":"¿Dónde está escrito?","conteo":"Escribo","puntos":["Criterios, medidas y procedimientos, incluidos los de PEP.","En grupo empresarial: políticas para sucursales y filiales de propiedad mayoritaria, incluidas las extranjeras. <b>· Nuevo 2025<\/b>"]},{"etiqueta":"IX","nombre":"Selección y capacitación anual","gancho":"¿Mi gente sabe?","conteo":"Capacito","puntos":["Selección de personal y capacitación <b>anual<\/b> para órgano de administración, directivos, Representantes Encargados y empleados con trato directo con clientes. <b>· Nuevo 2025<\/b>","El periodo anual es el año calendario; el primero, del 1-ene al 31-dic del año siguiente a la publicación (2.º transitorio 2025)."]},{"etiqueta":"X","nombre":"Monitoreo automatizado","gancho":"¿Qué se sale del perfil?","conteo":"Monitoreo","puntos":["Mecanismos automatizados de monitoreo permanente: operaciones fuera del perfil transaccional y las que deban acumularse; seguimiento intensificado a PEP y clientes de alto riesgo. <b>· Nuevo 2025<\/b>"]},{"etiqueta":"XI","nombre":"Revisión anual de efectividad","gancho":"¿Quién me revisa?","conteo":"Me audito","puntos":["Riesgo <b>bajo o medio<\/b>: auditoría interna o auditor externo independiente. Riesgo <b>alto<\/b>: auditor externo independiente. <b>· Nuevo 2025<\/b>","Evalúa y dictamina en un año calendario la efectividad del cumplimiento."]}]}],"frase":{"titulo":"Las 12 en cadena","html":"Identifico · Pregunto · Busco · Guardo · Me registro · Abro la puerta · Aviso · Mido · Escribo · Capacito · Monitoreo · Me audito."}},{"tipo":"tarjetas","id":"avisos","nav":"Avisos y BC","titulo":"2.2.1 · Avisos, Representante y Beneficiario Controlador","intro":"Cómo y cuándo se avisa, quién responde por la persona moral y a quién hay que transparentar.","tarjetas":[{"barra":true,"color":"principal","titulo":"Plazos y formas de los Avisos","ref":"Arts. 23 a 25","lista":["Avisos a más tardar el <b>día 17 del mes inmediato siguiente<\/b> a la operación (art. 23); la SHCP puede exceptuar plazos por acuerdo en el DOF.","Medios electrónicos y formatos oficiales publicados en el DOF (art. 24).","Contenido (art. 24): datos de quien realiza la AV; del cliente y, en su caso, del Beneficiario Controlador, con su actividad u ocupación; descripción de la AV.","Notarios: «podrán cumplir» los Avisos de inmuebles (17 XII A a) «únicamente cuando» se presenten por los medios que establezcan las disposiciones fiscales federales y contengan la información del art. 24.","La SHCP puede requerir soporte por escrito o en visita (art. 25)."]},{"barra":true,"color":"oscuro","titulo":"Representante Encargada y abstención","ref":"Arts. 20 y 21","lista":["<b>Art. 20:<\/b> las personas morales y quienes actúen por fideicomiso u otra figura jurídica designan una Representante Encargada del Cumplimiento; las personas físicas cumplen personal y directamente, salvo que avisen por Entidad Colegiada (Sección Cuarta).","<b>Art. 21:<\/b> si el cliente no da la información, quien realiza la AV se abstiene, sin responsabilidad."]},{"barra":true,"color":"negro","titulo":"Avisos por conducto de Entidades Colegiadas","ref":"Arts. 26 a 31","lista":["Es opcional: «podrán» presentarlos por conducto de una Entidad Colegiada (art. 26).","<b>9 requisitos (art. 27):<\/b> integrada por quienes hacen tareas similares; padrón actualizado; objeto de presentar Avisos; representante designado con poder general para actos de administración y capacitación anual; confidencialidad; custodia; mandato expreso; sistemas; convenio vigente con la SHCP.","Puede establecer un órgano concentrador previo convenio (art. 27).","Responde por incumplimientos que le sean imputables; no por los del integrante (art. 30).","Avisa con al menos <b>30 días<\/b> de anticipación su extinción o que dejará de actuar (art. 31)."]},{"barra":true,"color":"principal","titulo":"Beneficiario Controlador del cliente","ref":"Arts. 3 III y 18 III","lista":["<b>Beneficiario Controlador (art. 3 III):<\/b> quien obtiene en última instancia el beneficio o ejerce el control efectivo; control incluye voto de <b>más del 25 %<\/b> del capital. Es equiparable a beneficiario final y propietario real <b>· Nuevo 2025<\/b> (sólo la equiparación; la definición fue reformada).","<b>Quien realiza la AV, respecto de su cliente (art. 18 III):<\/b>","Persona moral, fideicomiso u otra figura: recabar documentos que identifiquen a su Beneficiario Controlador.","Persona física: recabar su declaración de si conoce o no la existencia de un Beneficiario Controlador y, en su caso, la documentación. <b>· Nuevo 2025<\/b>"]},{"barra":true,"color":"oscuro","titulo":"Beneficiario Controlador de la propia sociedad","ref":"Capítulo IV Bis · arts. 33 Bis a 33 Quáter","lista":["<b>Toda sociedad mercantil, respecto de sí misma<\/b> (no sólo quien realiza AV):","Atender los requerimientos de autoridad para determinar a su Beneficiario Controlador y conservar el soporte (33 Bis).","Aviso de la inscripción de transmisiones de acciones o partes sociales en el sistema que opera la Secretaría de Economía (33 Bis).","Registrar en ese sistema la información de su Beneficiario Controlador (33 Ter).","La SHCP promoverá con los estados que sociedades y asociaciones civiles identifiquen a su Beneficiario Controlador (33 Quáter).","Para el Capítulo IV Bis, Beneficiario Controlador es quien controla la persona moral aunque no sea cliente de una AV (art. 3 III). <b>· Nuevo 2025<\/b>"]}]},{"tipo":"tarjetas","id":"t2-2-2","nav":"2.2.2 Uso de efectivo","titulo":"2.2.2 Uso de efectivo: 8 025 para derechos reales sobre inmuebles, 3 210 para los demás (mensual en uso o goce; en la consignación, el de su fracción)","intro":"Art. 32: prohibido pagar o aceptar el pago con monedas y billetes, en moneda nacional o divisas, y con Metales Preciosos, <b>aun por conducto de una Entidad Financiera<\/b>, cuando el valor sea igual o superior al umbral, al día del pago o del cumplimiento.","tarjetas":[{"barra":true,"color":"principal","titulo":"≥ 8 025 UMA","ref":"Art. 32, fr. I","html":"Constitución o transmisión de derechos reales sobre <b>inmuebles<\/b>."},{"barra":true,"color":"oscuro","titulo":"≥ 3 210 UMA","ref":"Art. 32, fr. II a VI","lista":["II · Vehículos aéreos, marítimos o terrestres, nuevos o usados","III · Relojes, joyería, metales y piedras preciosas (por pieza o por lote) y obras de arte","IV · Boletos de juegos, concursos o sorteos, y premios","V · Blindaje de vehículos o inmuebles","VI · Acciones y partes sociales"]},{"barra":true,"color":"negro","titulo":"≥ 3 210 UMA mensuales","ref":"Art. 32, fr. VII","html":"Derechos personales de uso o goce de los bienes de las fr. I, II y V: inmuebles y vehículos (incluidos los blindados)."},{"barra":true,"color":"morado","titulo":"Consignación de pago · nueva 2025","ref":"Art. 32, fr. VIII","html":"La consignación de pago de cualquiera de esas operaciones, con el umbral de su fracción al día de la consignación. La SHCP podrá extender la prohibición a bienes fungibles por reglas."},{"barra":true,"color":"principal","titulo":"Fedatarios","ref":"Art. 33","html":"En operaciones ≥ <b>8 025<\/b> UMA identifican la forma de pago. Si es menor y se pagó antes de la firma, basta la declaración bajo protesta. Las demás (fr. II a VII) se formalizan con factura o documento que diga la forma de pago, previa identificación y, en su caso, del Beneficiario Controlador."}],"nota":"Participar en una operación prohibida por el art. 32 (art. 53 VII) se multa en el escalón más alto: 10 000 a 65 000 UMA o 10 % a 100 % del valor del acto, la mayor (art. 54 III)."},{"tipo":"tarjetas","id":"sanciones","nav":"Sanciones","titulo":"LFPIORPI · ¿Y si no cumplo? Multas, revocación y delitos","intro":"Tres escalones de multa en el art. 54 para las 7 conductas del art. 53. Las multas son créditos fiscales (art. 52).","tarjetas":[{"encabezado":true,"color":"principal","titulo":"200 a 2 000 UMA","subtitulo":"Art. 54 I","filas":[{"k":"Art. 53 I","v":"No atender requerimientos"},{"k":"Art. 53 II","v":"Incumplir obligaciones del art. 18"},{"k":"Art. 53 III","v":"Aviso extemporáneo, a más tardar 30 días tarde"},{"k":"Art. 53 IV","v":"Avisos sin los requisitos del art. 24"}]},{"encabezado":true,"color":"oscuro","titulo":"2 000 a 10 000 UMA","subtitulo":"Art. 54 II","filas":[{"k":"Art. 53 V","v":"Incumplir los arts. 33, 33 Bis y 33 Ter (forma de pago ante fedatario y Beneficiario Controlador de sociedades)"}]},{"encabezado":true,"color":"negro","titulo":"10 000 a 65 000 UMA o 10 %–100 %","subtitulo":"Art. 54 III · la que resulte mayor","filas":[{"k":"Art. 53 VI","v":"Omitir Avisos"},{"k":"Art. 53 VII","v":"Participar en operaciones prohibidas en efectivo (art. 32)"}]},{"barra":true,"color":"morado","titulo":"Alivios y medidas","ref":"Arts. 54 Bis, 55 y 60","lista":["Suspensión temporal de operaciones con ciertos clientes (54 Bis, nuevo 2025)","Por única ocasión, la SHCP se abstiene de sancionar si se regulariza espontáneamente antes de la verificación y reconoce la falta (55)","Ya usado ese beneficio: reducción de hasta 50 % (55, nuevo 2025)","Para imponer: reincidencia (misma infracción en 2 años desde que quedó firme), cuantía e intención (60)"]},{"barra":true,"color":"principal","titulo":"Revocación y cancelación","ref":"Arts. 56 a 59","lista":["Permisos de AV de fr. I (juegos), IX (blindaje) y X (traslado): reincidencia en 53 I–IV o cualquier 53 VI–VII (56)","Corredor: reincidencia en 53 I–IV; la Secretaría de Economía cancela en 10 días hábiles (57)","Notario o corredor: «notorias deficiencias» = reincidencia en 53 I–V o cualquier violación a 53 VI–VII; sanciona la autoridad que supervisa la fe pública (58)","Agentes y agencias aduanales, y quienes despachan sin agente: reincidencia en 53 I–IV o cualquier violación a 53 VI–VII (59)"]},{"barra":true,"color":"oscuro","titulo":"Delitos","ref":"Arts. 62 a 65","lista":["Art. 62 · 2 a 8 años: información falsa, alterada o ilegible para los Avisos; admite culpa (no se sanciona el error de tipo vencible corregido espontáneamente antes de que la autoridad conozca del delito)","Art. 63 · 4 a 10 años: uso indebido por servidor público, o revelar un Aviso o requerimiento, exista o no","Ambos: 500 a 2 000 días multa. Las penas del 62 y del 63 fr. II se duplican si es o fue en los 2 años previos servidor público encargado de prevenir, detectar, investigar o juzgar; inhabilitación para todos (64)","Denuncia previa de la SHCP para personal de instituciones financieras (65)"]},{"barra":true,"color":"negro","titulo":"Sanciones LFPIORPI ≠ sanciones financieras","ref":"Art. 52, segundo párrafo","html":"Las violaciones de las Entidades Financieras al art. 15 las sanciona su órgano supervisor (CNBV, CNSF o CONSAR) con el procedimiento y las sanciones de <b>sus propias leyes<\/b>, no con el art. 54. Las sanciones de LIC, LGOAAC y LRITF se estudian en H6 (2.1.15)."}]},{"tipo":"tarjetas","id":"ojo","nav":"Ojo con el texto","titulo":"Ojo con el texto: cinco rarezas de la ley","intro":"Están en el texto que liga el temario (cotejado contra el PDF; no son errores de conversión). Conócelas para no dudar en el examen.","tarjetas":[{"barra":true,"color":"oscuro","titulo":"Art. 53 III remite al 54 II","ref":"Arts. 53 III y 54","html":"El 53 III dice que si el Aviso llega <b>más de 30 días<\/b> tarde se aplica «la sanción prevista para el caso de omisión en el artículo 54, <b>fracción II<\/b>». Pero la omisión (53 VI) se multa en el <b>54 III<\/b>; el 54 II es para el 53 V. Lo seguro: hasta 30 días tarde = extemporáneo (200–2 000 UMA); más de 30 = se trata como omisión."},{"barra":true,"color":"negro","titulo":"Dos nombres para la Unidad","ref":"Arts. 3 XIV y 7","html":"El 3 XIV (2025) la define como «Unidad Especializada en Investigación de Delitos Fiscales y Financieros»; el art. 7 (2021) dice que la Fiscalía contará con una «Unidad Especializada en Análisis Financiero». En ambos casos es la Unidad de la Fiscalía."},{"barra":true,"color":"oscuro","titulo":"XII C no enumera actos","ref":"Art. 17 XII C","html":"El apartado C (servidores públicos con fe pública) sólo los menciona, sin decir qué actos son AV. El D (facilitadores) sí remite a las operaciones del apartado A."},{"barra":true,"color":"negro","titulo":"¿Qué exceptúa la fr. XIV?","ref":"Art. 18 IV","html":"La conservación es «en el domicilio registrado ante la Secretaría para este efecto, <b>excepto para la fracción XIV del artículo 17<\/b>, por al menos un plazo de diez años». El texto no deja claro si la excepción es sólo del domicilio o de toda la regla."},{"barra":true,"color":"principal","titulo":"«Y» en vez de «o» en cripto","ref":"Art. 17 XVI","html":"Casi todas las fracciones dicen «habitual <b>o<\/b> profesional»; la XVI dice «habitual <b>y<\/b> profesional»."}]},{"tipo":"cifras","id":"cifras","nav":"Plazos","titulo":"Plazos y cifras que preguntan","intro":"Cada número con su artículo.","cifras":[["17","del mes","Día límite para presentar Avisos: el 17 del mes inmediato siguiente","Art. 23"],["24","horas","Aviso por sospecha, aunque la operación no se celebre (nuevo 2025)","Art. 18, fr. VI"],["10","años","Conservación de información de quienes realizan AV (también las EF)","Arts. 18 IV y 15 IV"],["6","meses","Acumulación de operaciones menores que superan el umbral de Aviso","Art. 17, penúltimo párrafo"],["5","años","Alcance hacia atrás de las visitas de verificación","Art. 36"],["30","días","Aviso tardío que aún es extemporáneo (después, omisión)","Art. 53, fr. III"],["30","días","Anticipación con que la Entidad Colegiada avisa que se extingue o deja de actuar","Art. 31"],["30","días","Para que sistemas de pago y emisores de tarjetas entreguen lo requerido","Art. 51"],["2","años","Ventana de reincidencia desde que quedó firme la resolución","Art. 60, fr. I"],["25","%","Voto de más del 25 % del capital = control (Beneficiario Controlador)","Art. 3, fr. III, b) ii)"],["10","días háb.","Para que la Secretaría de Economía cancele la habilitación del corredor","Art. 57"],["12","meses","Para que la SHCP modifique las reglas tras la reforma 2025","2.º transitorio, DOF 16-jul-2025"]]},{"tipo":"simulador","id":"examen","nav":"Practicar ▸"}],"temas":{"2.2.1":"2.2.1 Actividades vulnerables","2.2.2":"2.2.2 Uso de efectivo"},"modos":[{"k":"t221","l":"2.2.1 Actividades vulnerables","tema":"2.2.1"},{"k":"t222","l":"2.2.2 Uso de efectivo","tema":"2.2.2"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Cifras y trampas","tipos":["cifra","trampa"]}],"banco":[{"id":"G001","tema":"2.2.1","tipo":"memoria","q":"Según el art. 2 de la LFPIORPI, ¿qué protege la ley como objeto?","a":"El sistema financiero y la economía nacional","o":["La recaudación fiscal y el padrón de contribuyentes","El secreto bancario y la confidencialidad de los clientes","La libre competencia y el comercio exterior del país","El sistema financiero y la economía nacional"],"x":"El art. 2 dice que el objeto es proteger el sistema financiero y la economía nacional, con medidas para prevenir y detectar operaciones con recursos de procedencia ilícita mediante coordinación interinstitucional. Lo fiscal o el secreto bancario no son el objeto de la ley.","ref":"Art. 2"},{"id":"G002","tema":"2.2.1","tipo":"caso","q":"Una agencia de autos discute con su asesor cómo debe interpretarse, en el ámbito administrativo, una obligación de la LFPIORPI. ¿Qué autoridad es la competente para aplicar e interpretar la ley en ese ámbito?","a":"La Secretaría de Hacienda y Crédito Público","o":["La Unidad especializada de la Fiscalía General de la República","El Servicio de Administración Tributaria, por ser materia fiscal","La Secretaría de Hacienda y Crédito Público","La Comisión Nacional Bancaria y de Valores, como supervisor"],"x":"El art. 5 hace a la Secretaría (SHCP) la autoridad competente para aplicar e interpretar en lo administrativo la ley, su Reglamento y sus reglas. La Unidad de la Fiscalía analiza e investiga; no interpreta la ley en sede administrativa.","ref":"Art. 5"},{"id":"G003","tema":"2.2.1","tipo":"caso","q":"Una institución de seguros incumple sus medidas para identificar clientes conforme al art. 15. ¿Qué autoridad supervisa, verifica y vigila ese cumplimiento?","a":"La Comisión Nacional de Seguros y Fianzas","o":["La SHCP directamente, como en las demás actividades vulnerables","La Unidad de la Fiscalía, por tratarse de una Entidad Financiera","La Comisión Nacional de Seguros y Fianzas","La Comisión Nacional Bancaria y de Valores, para todo el sector"],"x":"El art. 16 asigna la supervisión de las Entidades Financieras, según corresponda, a la CNBV, la CNSF o la CONSAR; a una aseguradora le corresponde la CNSF. La SHCP supervisa directamente sólo a quienes realizan las AV fuera de la Sección Primera (art. 22 Bis).","ref":"Art. 16, primer párrafo"},{"id":"G004","tema":"2.2.1","tipo":"cifra","q":"Para efectos del Beneficiario Controlador, en el supuesto de control por derechos de voto, ¿a partir de qué porcentaje del capital social se entiende que una persona o grupo de personas controla a una persona moral?","a":"Más del 25 % del capital social","o":["Más del 25 % del capital social","Más del 50 % del capital social","El 25 % o más del capital social","Más del 10 % del capital social"],"x":"El art. 3, fr. III, inciso b), numeral ii), habla de ejercer el voto respecto de «más del veinticinco por ciento» del capital social. Cuidado: exactamente el 25 % no basta por este supuesto; la ley dice «más de».","ref":"Art. 3, fr. III, inciso b), numeral ii)"},{"id":"G005","tema":"2.2.1","tipo":"caso","q":"Dentro de una carpeta de investigación formalmente iniciada, la Unidad de la Fiscalía necesita información de una institución de crédito. ¿Cómo debe formular el requerimiento?","a":"A través de la Secretaría de Hacienda y Crédito Público","o":["A través de la Secretaría de Hacienda y Crédito Público","Por conducto del juez de control que conozca de la investigación","Directamente a la institución de crédito, por escrito","Por conducto del Banco de México, como administrador de pagos"],"x":"El art. 8, fr. X, permite a la Unidad requerir informes en el marco de una investigación formal, pero «en el caso de las Entidades Financieras» los requerimientos se harán a través de la Secretaría. No va directo al banco ni por conducto de un juez.","ref":"Art. 8, fr. X"},{"id":"G006","tema":"2.2.1","tipo":"caso","q":"La SHCP inicia una visita de verificación a una joyería. ¿Qué operaciones puede abarcar la verificación?","a":"Las realizadas en los 5 años inmediatos anteriores al inicio de la visita","o":["Las realizadas en los 5 años anteriores a la notificación de la orden","Todas las realizadas desde el alta de la joyería en el padrón","Las realizadas en los 10 años inmediatos anteriores al inicio de la visita","Las realizadas en los 5 años inmediatos anteriores al inicio de la visita"],"x":"El art. 36 limita las verificaciones a los actos u operaciones realizados dentro de los cinco años inmediatos anteriores a la fecha de inicio de la visita. Los 10 años son el plazo de conservación del art. 18 IV, no el alcance de la visita.","ref":"Art. 36"},{"id":"G007","tema":"2.2.1","tipo":"caso","q":"En una investigación, el Ministerio Público de la Federación pretende sostener su caso únicamente con los Avisos que presentó una agencia de vehículos. ¿Qué establece la ley?","a":"Los Avisos no tienen por sí mismos valor probatorio pleno; se requieren pruebas del acto","o":["Los Avisos hacen prueba plena una vez que los ratifica la Representante Encargada","Los Avisos hacen prueba plena si se presentaron en tiempo y con los requisitos del art. 24","Los Avisos sólo pueden usarse como prueba si un juez autoriza previamente su consulta","Los Avisos no tienen por sí mismos valor probatorio pleno; se requieren pruebas del acto"],"x":"El art. 42 dice que los Avisos en ningún caso tendrán, por sí mismos, valor probatorio pleno, y que el MP no podrá sostener su investigación exclusivamente en ellos: debe sustentarse en pruebas que acrediten el acto u operación. Presentarlos en tiempo y forma no cambia su valor probatorio.","ref":"Art. 42"},{"id":"G008","tema":"2.2.1","tipo":"memoria","q":"¿Cómo considera la ley la identidad de quienes presentan Avisos y de las Representantes Encargadas del Cumplimiento designadas conforme al art. 20?","a":"Confidencial y reservada, en términos de la Ley General de Transparencia","o":["Pública, una vez que concluye la visita de verificación de la SHCP","Confidencial y reservada, en términos de la Ley General de Transparencia","Reservada sólo mientras duran la investigación y el proceso penal federal","Confidencial, salvo que la solicite cualquier autoridad fiscal local"],"x":"El art. 38 considera confidencial y reservada, en términos de la Ley General de Transparencia, la información soporte de los Avisos y la identidad de quien los presenta, de la Representante Encargada del Cumplimiento y del representante de la Entidad Colegiada. No hay apertura al concluir la visita.","ref":"Art. 38"},{"id":"G009","tema":"2.2.1","tipo":"caso","q":"Un juez cita a la Representante Encargada del Cumplimiento de una inmobiliaria para una diligencia relacionada con sus funciones. Para proteger su identidad, ¿qué prevé la LFPIORPI?","a":"Que la diligencia podrá desahogarla la representante legal o apoderada de la inmobiliaria","o":["Que la diligencia deberá desahogarse por escrito, sin intervención de la inmobiliaria ni de terceros","Que la Representante queda exenta de comparecer ante cualquier autoridad judicial","Que la diligencia podrá desahogarla la representante legal o apoderada de la inmobiliaria","Que la diligencia sólo procede si la SHCP la autoriza previamente"],"x":"El art. 41 Bis (nuevo 2025) permite que esas diligencias sean desahogadas por las personas representantes legales o apoderadas de quien realiza la AV. No es una exención: la diligencia se desahoga, sólo que por otra persona.","ref":"Art. 41 Bis"},{"id":"G010","tema":"2.2.1","tipo":"memoria","q":"Conforme a las definiciones de la ley, ¿qué metales son «Metales Preciosos»?","a":"Oro, plata y platino","o":["Oro y plata únicamente","Oro, plata y paladio","Oro, plata y platino","Oro, platino y rodio"],"x":"El art. 3, fr. IX, define Metales Preciosos como el oro, la plata y el platino; el paladio y el rodio no están en la lista. Las Piedras Preciosas son otra definición (fr. X).","ref":"Art. 3, fr. IX"},{"id":"G011","tema":"2.2.1","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. IX del art. 17?","a":"Blindaje de vehículos terrestres y de bienes inmuebles","o":["Subasta o comercialización habitual de obras de arte","Blindaje de vehículos terrestres y de bienes inmuebles","Comercialización de vehículos aéreos, marítimos o terrestres","Traslado o custodia de dinero o valores de terceros"],"x":"La fr. IX es la prestación habitual o profesional de servicios de blindaje de vehículos terrestres, nuevos o usados, y de bienes inmuebles. El traslado o custodia de valores es la fr. X y la venta de vehículos, la VIII.","ref":"Art. 17, fr. IX"},{"id":"G012","tema":"2.2.1","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. XIII del art. 17?","a":"Recepción de donativos por asociaciones y sociedades sin fines de lucro","o":["Servicios de comercio exterior como agente o agencia aduanal","Constitución de derechos personales de uso o goce de inmuebles","Ofrecimiento habitual de préstamos o créditos por sujetos distintos de las Entidades Financieras","Recepción de donativos por asociaciones y sociedades sin fines de lucro"],"x":"La fr. XIII es la recepción de donativos por parte de Asociaciones y Sociedades sin fines de lucro. El comercio exterior es la XIV y el arrendamiento de inmuebles, la XV.","ref":"Art. 17, fr. XIII"},{"id":"G013","tema":"2.2.1","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. XV del art. 17?","a":"Constitución de derechos personales de uso o goce de inmuebles","o":["
