e","En el voto que confiere Control sobre las decisiones del capital social de la sociedad"],"x":"«Más del 25 %» sólo aparece en L3 I, en el párrafo del capital fraccionado en partes menores al 25 %. Las DCG (2ª VII y 4ª II c) y L3 I a) dicen «25 % o más»; el voto que da Control es «más del 50 %».","ref":"Lineamientos PR 2019, L3, fr. I; DCG Bancos 2ª fr. VII"},{"id":"F030","tema":"2.1.16","tipo":"caso","q":"Una persona física tiene exactamente el 25 % del capital social de una sociedad cliente de un banco y no ocupa ningún cargo. Conforme a las DCG, ¿ejerce el Control?","a":"Sí: la DCG considera Control adquirir el 25 % o más del capital","o":["No: para ejercer el Control se requiere más del 25 % del capital","No: para ejercer el Control se requiere votar más del 50 % del capital","Sí: la DCG considera Control adquirir el 25 % o más del capital","Sólo si además ocupa un cargo de alto mando en la sociedad cliente"],"x":"La 2ª VII de Bancos considera que ejerce Control la persona física que adquiera el 25 % o más del capital; el 25 % exacto queda dentro. «Más del 25 %» es la regla de suma de fracciones de los Lineamientos, no la de las DCG.","ref":"DCG Bancos 2ª fr. VII"},{"id":"F031","tema":"2.1.16","tipo":"caso","q":"Tres hermanos tienen, cada uno, el 10 % del capital de una sociedad cliente. Si la entidad sigue los Lineamientos 2019, ¿qué podrá hacer?","a":"Identificar a cada titular y si existe relación jurídica entre ellos para ver si en conjunto tienen más del 25 %","o":["Descartarlos, porque ninguno alcanza por sí solo el 25 % o más del capital social","Identificar a cada titular y si existe relación jurídica entre ellos para ver si en conjunto tienen más del 25 %","Considerarlos propietarios reales sólo si los tres son personas políticamente expuestas","Tomar de inmediato al administrador como PR, sin analizar a los hermanos ni sus vínculos"],"x":"L3 I: si el capital está fraccionado en partes menores al 25 %, la entidad «podrá» identificar a cada titular y ver si en su conjunto tienen más del 25 %. Descartarlos por no llegar cada uno al 25 % ignora esa regla.","ref":"Lineamientos PR 2019, L3, fr. I"},{"id":"F032","tema":"2.1.16","tipo":"caso","q":"Una persona sin acciones ni cargo en la sociedad cliente decide de hecho sus asuntos por su vínculo familiar con el director general. ¿En qué vía de los Lineamientos 2019 encaja?","a":"Control por otro medio (L3 fr. III)","o":["Control por propiedad (L3 fr. I)","Control por cargo (L3 fr. II)","Medidas razonables (L4 fr. III)","Control por otro medio (L3 fr. III)"],"x":"L3 III cubre el Control sin propiedad visible: participación en las finanzas, relación personal o vínculo familiar con los altos mandos. La vía del cargo (L3 II) exige un cargo de alto mando, que esta persona no tiene.","ref":"Lineamientos PR 2019, L3, fr. III"},{"id":"F033","tema":"2.1.16","tipo":"trampa","q":"Pese a que los Lineamientos 2019 son orientadores, la vía del cargo usa una expresión imperativa. ¿Cuál?","a":"La persona «deberá» contar con un cargo de alto mando","o":["La persona «deberá» tener además el 25 % o más del capital","La persona «podrá» tener cualquier cargo, aun sin ser directivo","La persona «deberá» contar con un cargo de alto mando","La persona «deberá» estar inscrita en el Registro Público de Comercio"],"x":"L3 II b) (control sobre asuntos diarios mediante un cargo directivo) dice que, bajo ese supuesto, la persona «deberá contar con un cargo de alto mando». Es el matiz de la trampa «DCG obligan, Lineamientos orientan».","ref":"Lineamientos PR 2019, L3, fr. II, inciso b)"},{"id":"F034","tema":"2.1.16","tipo":"caso","q":"Una entidad duda de la veracidad del cuestionario de PR que entregó su cliente persona moral. ¿Cuál de estas es una medida razonable prevista en los Lineamientos 2019?","a":"Pedir la certificación de la integración del capital con los asientos del libro de accionistas","o":["Pedir la certificación de la integración del capital con los asientos del libro de accionistas","Pedir a la UIF una constancia oficial que confirme quién es el propietario real del cliente","Solicitar a la CNBV un dictamen previo sobre la estructura accionaria del cliente persona moral","Exigir al cliente que sustituya a su administrador por una persona física antes de operar"],"x":"L4 III c) prevé la certificación de la integración del capital junto con los asientos del libro de registro de accionistas; también actas de asamblea, informe de poderes y consulta al RPC, RNV y RNIE. Ninguna medida consiste en pedir constancias a la UIF o a la CNBV.","ref":"Lineamientos PR 2019, L4, fr. III, inciso c)"},{"id":"F035","tema":"2.1.16","tipo":"caso","q":"Un banco abre una cuenta a un cliente clasificado de riesgo bajo que actúa en beneficio de un propietario real. Conforme a la 4ª VI, ¿qué recaba del PR?","a":"Los mismos datos que de un cliente, sin pedir su comprobante de domicilio","o":["Sólo el nombre completo del PR, sin documentos que acrediten su identidad","Nada: con un cliente de riesgo bajo no se identifica al propietario real","Los mismos datos y documentos, con comprobante de domicilio y pasaporte","Los mismos datos que de un cliente, sin pedir su comprobante de domicilio"],"x":"La 4ª VI pide del PR los mismos datos y documentos de la 4ª I o III; cuando el cliente es de riesgo bajo, no se recaba el comprobante de domicilio del PR. La dispensa es de un documento, no de la identificación del PR.","ref":"DCG Bancos 4ª fr. VI"},{"id":"F036","tema":"2.1.16","tipo":"caso","q":"Una ITF atiende a un Cliente de riesgo bajo que actúa en beneficio de un propietario real. ¿Qué prevé el art. 11 VI de sus DCG respecto de los documentos del PR?","a":"Recaba los datos de identificación de las fr. I o III: no prevé la dispensa por riesgo bajo","o":["Omite el comprobante de domicilio del PR, exactamente igual que los Bancos","Recaba los datos de identificación de las fr. I o III: no prevé la dispensa por riesgo bajo","Omite toda la documentación del PR y sólo pide una declaración del Cliente","Sólo identifica al PR en operaciones de 5,000 USD o más, como las casas de cambio"],"x":"El art. 11 VI de ITF pide del PR los datos de identificación de las fracciones I o III y no trae la regla de Bancos (4ª VI) que exime del comprobante de domicilio cuando el cliente es de riesgo bajo. El umbral de 5,000 USD es de casas de cambio, centros y transmisores, no de ITF.","ref":"DCG ITF art. 11, fr. VI","par":"F035"},{"id":"F037","tema":"2.1.16","tipo":"caso","q":"Un banco detecta que el propietario real de uno de sus clientes es una persona políticamente expuesta. ¿Qué prevé la 4ª VI de sus DCG?","a":"Que al Cliente se le apliquen las reglas 26ª y 28ª","o":["Que se rechace siempre la apertura o se cancele el contrato","Que al Cliente se le apliquen las reglas 26ª y 28ª","Que se envíe un reporte de 24 horas a la SHCP por ese solo hecho","Que el PR quede exento de identificarse por ser servidor público"],"x":"Si el PR es PEP, la 4ª VI remite a las reglas 26ª y 28ª, que se aplican al Cliente. No hay prohibición automática de operar ni un reporte por el solo hecho de ser PEP.","ref":"DCG Bancos 4ª fr. VI"},{"id":"F038","tema":"2.1.16","tipo":"caso","q":"En una casa de bolsa, el propietario real de un cliente de riesgo alto es una persona políticamente expuesta. ¿Qué exige su DCG para iniciar o continuar la relación comercial?","a":"La aprobación del directivo con facultades específicas que prevé la 24ª","o":["Un reporte de operación inusual dentro de 24 horas","La autorización previa de la CNBV para operar con él","La firma de una constancia del delegado fiduciario de la entidad","La aprobación del directivo con facultades específicas que prevé la 24ª"],"x":"La 4ª VII de casas de bolsa remite expresamente a la aprobación de la 24ª. En Bancos el efecto es el mismo por remisión: la 4ª VI manda aplicar al Cliente la 26ª y la 28ª, y la 26ª pide la aprobación de un directivo para PEP de riesgo alto. No se prevé autorización de la CNBV ni un reporte de 24 horas.","ref":"DCG casas de bolsa 4ª fr. VII y 24ª; DCG Bancos 4ª fr. VI y 26ª","par":"F037"},{"id":"F039","tema":"2.1.16","tipo":"caso","q":"Un banco abre una cuenta a una subsidiaria en la que una emisora que cotiza en bolsa tiene participación mayoritaria. Conforme a la 4ª VI, ¿qué ocurre con la identificación del PR?","a":"Aplica la excepción de la 4ª VI para cotizadas y sus subsidiarias con participación mayoritaria","o":["Aplica la excepción de la 4ª VI para cotizadas y sus subsidiarias con participación mayoritaria","Debe recabar los datos de cada accionista de la emisora que tenga el 25 % o más del capital","Debe aplicar la cascada y recabar los datos del administrador de la emisora controladora","Debe pedir la declaración del representante legal y una certificación de la Bolsa de Valores"],"x":"La 4ª VI exceptúa a las personas morales que cotizan en bolsa y a sus subsidiarias con participación mayoritaria. Por eso no se recorre ni el 25 % ni la cascada al administrador.","ref":"DCG Bancos 4ª fr. VI"},{"id":"F040","tema":"2.1.16","tipo":"trampa","q":"Un padre, que no es titular, deposita cada mes recursos en la cuenta de su hija adulta, quien los usa y dispone de ellos en su propio beneficio; el padre no obtiene beneficio alguno. ¿Qué figura es el padre?","a":"Proveedor de Recursos","o":["Propietario real","Beneficiario","Proveedor de Recursos","Cotitular de la cuenta"],"x":"Proveedor de Recursos es quien, sin ser titular, aporta recursos de manera regular sin obtener los beneficios (2ª XXXIII). El propietario real es quien obtiene los beneficios y es el verdadero dueño (2ª XXXII); el Beneficiario es el designado para el caso de fallecimiento (2ª III).","ref":"DCG Bancos 2ª fr. III, XXXII y XXXIII"},{"id":"F041","tema":"2.1.16","tipo":"memoria","q":"Además del verdadero dueño de los recursos y de quien ejerce el Control, ¿a quién comprende la definición de propietario real de la 2ª XXXII de Bancos?","a":"A quien pueda instruir, para su beneficio, actos mediante fideicomisos, mandatos o comisiones","o":["A la persona que aporta los recursos a la cuenta sin obtener los beneficios de ella","A la persona designada por el titular para recibir los recursos en caso de fallecimiento","A todo apoderado que firme el contrato en nombre del Cliente, aunque no se beneficie","A quien pueda instruir, para su beneficio, actos mediante fideicomisos, mandatos o comisiones"],"x":"La 2ª XXXII comprende también a quien pueda instruir o determinar, para su propio beneficio económico, actos realizados a través de fideicomisos, mandatos o comisiones. Quien aporta sin beneficiarse es Proveedor de Recursos; el designado por fallecimiento, Beneficiario.","ref":"DCG Bancos 2ª fr. XXXII"},{"id":"F042","tema":"2.1.16","tipo":"memoria","q":"En las DCG de Bancos, los datos del propietario real están en la 4ª fracción VI. ¿En qué fracción están en las DCG de casas de bolsa?","a":"4ª, fracción VII","o":["4ª, fracción VI","4ª, fracción VII","4ª, fracción III, inciso E","Art. 11, fracción VI"],"x":"Casas de bolsa tienen el PR en la 4ª VII; el contenido es igual al de Bancos, cambia la fracción. La 4ª VI es la de Bancos, SOFOM, asesores, fondos, SOCAP, SOFIPO y uniones; el art. 11 VI, la de ITF.","ref":"DCG casas de bolsa 4ª fr. VII"},{"id":"F043","tema":"2.1.16","tipo":"memoria","q":"En las DCG de Bancos, los datos del propietario real están en la 4ª fracción VI. ¿Dónde están en las DCG de casas de cambio?","a":"4ª, fracción III, inciso E","o":["4ª, fracción VII","4ª, fracción VI","4ª, fracción III, inciso E","Art. 11, fracción VI"],"x":"Casas de cambio y centros cambiarios tienen el PR en la 4ª III inciso E, referido a Usuarios y operaciones de 5,000 USD o más. La 4ª VII es la de casas de bolsa.","ref":"DCG casas de cambio 4ª fr. III, inciso E","par":"F042"},{"id":"F044","tema":"2.1.16","tipo":"cifra","q":"¿A partir de qué monto las DCG de casas de cambio y de centros cambiarios exigen integrar el expediente del Usuario con los datos del propietario real (4ª III inciso E)?","a":"5,000 USD o más","o":["5,000 USD o más","1,000 USD o más","7,500 USD o más","10,000 USD o más"],"x":"Su fracción de PR (4ª III inciso E) aplica a operaciones de 5,000 USD o más; igual en transmisores. 7,500 USD es el umbral de relevantes de Bancos, no el del PR. En casas de cambio, la fr. III se refiere a operaciones en efectivo o con cheques de viajero.","ref":"DCG casas de cambio y centros cambiarios 4ª fr. III, inciso E"},{"id":"F045","tema":"2.1.16","tipo":"caso","q":"Un banco recibe la declaración escrita del representante legal sobre quiénes son los PR de una sociedad cliente, pero hay indicios de que es falsa. ¿Qué dice la 4ª II c)?","a":"Que «deberán» tomar medidas razonables para identificar al PR","o":["Que «deberán» tomar medidas razonables para identificar al PR","Que «podrán» aceptar la declaración sin hacer nada más","Que «deberán» llevar a cabo «acciones», como en las ITF","Que deben cerrar la cuenta y avisar de inmediato a la UIF"],"x":"Ante indicios de falsedad, la 4ª II c) de Bancos dice que las Entidades «deberán tomar medidas razonables». La palabra «acciones» es la que usa la DCG de ITF para el mismo supuesto.","ref":"DCG Bancos 4ª fr. II, inciso c)"},{"id":"F046","tema":"2.1.16","tipo":"caso","q":"Una ITF tiene dudas sobre la declaración de quiénes son los PR de su Cliente persona moral. Frente a la redacción de Bancos, ¿qué término usa su DCG?","a":"Habla de llevar a cabo «acciones», no de «medidas razonables»","o":["Habla de «medidas razonables», exactamente igual que la de Bancos","Remite a los Lineamientos 2019 como única forma de verificar","Habla de llevar a cabo «acciones», no de «medidas razonables»","Ordena aplicar la cascada sin verificar la declaración recibida"],"x":"En ITF, ante dudas, la DCG habla de «acciones»; en Bancos, de «medidas razonables». Es una diferencia de redacción de la cascada del art. 11 II b), que además no menciona los derechos de voto.","ref":"DCG ITF art. 11, fr. II, inciso b)","par":"F045"},{"id":"F047","tema":"2.1.16","tipo":"caso","q":"Un banco que no actúa como fiduciario opera con un fideicomiso. ¿Qué documento le permite la 4ª IX usar para cumplir con el contrato del fideicomiso y con los datos del PR?","a":"Una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria","o":["Una certificación del capital del fideicomiso, firmada por el secretario de su comité técnico","Una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria","Una declaración del fideicomitente, ratificada ante la CNBV, sobre quiénes son los fideicomisarios","Un dictamen del auditor externo del fideicomiso sobre la identidad de sus propietarios reales"],"x":"La 4ª IX de Bancos permite («podrán») a la entidad que no es fiduciaria cumplir mediante una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria. Es una opción, no una exigencia; la DCG de ITF no la prevé.","ref":"DCG Bancos 4ª fr. IX"},{"id":"F048","tema":"2.1.16","tipo":"caso","q":"En una ITF, el propietario real de un Cliente es un fideicomiso. ¿Qué prevé el art. 11 VI de sus DCG?","a":"Identificar a los fideicomitentes o fideicomisarios; no prevé la opción de la constancia del delegado fiduciario","o":["Cumplir mediante la constancia del delegado fiduciario y del oficial de cumplimiento, como permite Bancos","Aplicar el numeral sobre fideicomisos de los Lineamientos 2019 como único criterio de identificación","Considerar al delegado fiduciario como propietario real y recabar sólo sus datos de identificación","Identificar a los fideicomitentes o fideicomisarios; no prevé la opción de la constancia del delegado fiduciario"],"x":"En ITF, si el PR es un fideicomiso, se identifica a fideicomitentes o fideicomisarios; su DCG no prevé la opción de cumplir con la constancia del delegado fiduciario que la 4ª IX da a Bancos. Los Lineamientos 2019 no tienen numeral sobre fideicomisos.","ref":"DCG ITF art. 11, fr. VI","par":"F047"},{"id":"F049","tema":"2.1.16","tipo":"caso","q":"Una SOFOM, una casa de cambio, un centro cambiario y un transmisor reciben transferencias ordenadas por otros sujetos obligados. ¿En cuál presume su DCG, como la de Bancos, que el ordenante actúa por cuenta de sus clientes?","a":"En la casa de cambio","o":["En la SOFOM","En el centro cambiario","En la casa de cambio","En el transmisor de dinero"],"x":"La presunción de Bancos (31ª) la repiten casas de cambio, SOCAP, SOFIPO y, respecto de «entidades financieras», casas de bolsa. SOFOM, centros cambiarios y transmisores no la prevén: la presunción no sigue familias.","ref":"DCG Bancos 31ª; DCG casas de cambio 22ª"},{"id":"F050","tema":"2.1.16","tipo":"caso","q":"Un banco atiende a una asociación civil clasificada de riesgo alto. ¿Qué procedimiento sobre su propietario real debe prever el Manual conforme a la 32ª II?","a":"Identificar a quien ejerza el Control, independientemente del porcentaje","o":["Identificar a quien ejerza el Control, independientemente del porcentaje","Identificar sólo a los asociados con el 25 % o más de las aportaciones","Identificar sólo a quien vote más del 50 % en la asamblea de asociados","Tomar como PR al presidente del consejo directivo, sin más análisis"],"x":"Para sociedades o asociaciones civiles de riesgo alto, la 32ª II pide identificar a quien tenga el Control «independientemente del porcentaje»: aquí no opera el umbral del 25 %.","ref":"DCG Bancos 32ª, fr. II"},{"id":"F051","tema":"2.1.17","tipo":"caso","q":"Un banco y una SOFOM deben enviar su reporte trimestral de operaciones relevantes. ¿En qué difieren sus plazos?","a":"Banco: primeros 10 días hábiles; SOFOM: últimos 10 días hábiles","o":["Banco: últimos 10 días hábiles; SOFOM: primeros 10 días hábiles","Ambos: primeros 10 días hábiles del mes siguiente al trimestre","Banco: primeros 10 días hábiles; SOFOM: 15 días hábiles del mes","Banco: primeros 10 días hábiles; SOFOM: últimos 10 días hábiles"],"x":"Bancos reporta relevantes en los primeros 10 días hábiles (34ª); SOFOM, centros cambiarios y transmisores, en los últimos 10. Los 15 días hábiles son del reporte mensual de transferencias internacionales.","ref":"DCG Bancos 34ª; DCG SOFOM 28ª"},{"id":"F052","tema":"2.1.17","tipo":"caso","q":"¿Cuál de estos sujetos reporta operaciones relevantes en los primeros 10 días hábiles, igual que Bancos?","a":"La casa de cambio","o":["El centro cambiario","La casa de cambio","El transmisor de dinero","La SOFOM"],"x":"Dentro de cambios y envíos, la casa de cambio sigue a Bancos (primeros 10 días hábiles); centros cambiarios y transmisores, igual que la SOFOM, reportan en los últimos 10.","ref":"DCG Bancos 34ª; DCG casas de cambio, centros cambiarios y transmisores (reportes de relevantes)","par":"F051"},{"id":"F053","tema":"2.1.17","tipo":"caso","q":"Una casa de bolsa quiere que su Manual le permita ampliar 30 días el plazo para dictaminar una operación inusual, como lo hace un banco. ¿Puede?","a":"No: la ampliación de 30 días sólo la prevé la DCG de Bancos","o":["Sí: todas las DCG permiten sumar 30 días si el Manual lo prevé","No: la ampliación de 30 días sólo la prevé la DCG de Bancos","Sí, pero sólo con autorización previa de la CNBV para cada caso","No: en casas de bolsa el plazo es de 30 días naturales, sin ampliar"],"x":"El dictamen de OI es de hasta 60 días naturales desde la alerta en todas las DCG; sólo Bancos puede sumar 30 días si su Manual lo prevé. Casas de bolsa tienen 60 días, sin los +30.","ref":"DCG Bancos 37ª; DCG casas de bolsa (plazo de dictamen de OI)"},{"id":"F054","tema":"2.1.17","tipo":"caso","q":"Un banco y una ITF tienen cada uno 60 días naturales para dictaminar una operación inusual. ¿Desde cuándo corre el plazo en cada uno?","a":"Banco: desde que se genera la alerta; ITF: desde que detecta la operación","o":["Ambos: desde que concluye la sesión del Comité que conoce el caso","Banco: desde que detecta la operación; ITF: desde que se genera la alerta","Ambos: desde el último día hábil del mes en que se celebró la operación","Banco: desde que se genera la alerta; ITF: desde que detecta la operación"],"x":"En Bancos (37ª) los 60 días naturales corren desde la alerta; en ITF, desde que detecta la operación. La sesión del Comité es el punto de partida de los 3 días hábiles para reportar, no del dictamen.","ref":"DCG Bancos 37ª; DCG ITF (dictamen de OI)"},{"id":"F055","tema":"2.1.17","tipo":"caso","q":"Un banco y una SOFOM designan a su nuevo oficial de cumplimiento el mismo día. ¿Qué plazo tiene cada uno para comunicar la designación?","a":"Banco: 2 días hábiles; SOFOM: 10 días hábiles","o":["Banco: 2 días hábiles; SOFOM: 10 días hábiles","Banco: 10 días hábiles; SOFOM: 2 días hábiles","Ambos: 15 días hábiles, igual que los avisos del Comité","Banco: 2 días hábiles; SOFOM: el día hábil siguiente"],"x":"Bancos tiene 2 días hábiles para la designación del OC (48ª); casi todos los demás, 10. Los 15 días hábiles son de los avisos de integración y cambios del Comité.","ref":"DCG Bancos 48ª; DCG SOFOM (designación del OC)"},{"id":"F056","tema":"2.1.17","tipo":"caso","q":"Una casa de cambio revoca el nombramiento de su oficial de cumplimiento. Frente a los 10 días hábiles de Bancos, ¿qué plazo tiene para comunicarlo?","a":"El día hábil siguiente","o":["2 días hábiles","10 días hábiles","El día hábil siguiente","15 días hábiles"],"x":"Casas de cambio coinciden con Bancos en la designación (2 días hábiles), pero la revocación y el interino se comunican al día hábil siguiente. Bancos tiene 10 días hábiles para ambos.","ref":"DCG Bancos 48ª; DCG casas de cambio (oficial de cumplimiento)"},{"id":"F057","tema":"2.1.17","tipo":"caso","q":"Un asesor en inversiones y un banco deben conservar la documentación de sus clientes. ¿Cómo difieren los plazos mínimos de conservación?","a":"Asesor: 5 años; banco: 10 años","o":["Asesor: 10 años; banco: 5 años","Ambos: 10 años desde la operación","Asesor: 5 años; banco: 20 años","Asesor: 5 años; banco: 10 años"],"x":"La regla general es conservar al menos 10 años (Bancos 59ª); asesores en inversiones son la excepción con 5 años. Los 5 años también son la conservación de la metodología, lo que facilita la confusión.","ref":"DCG Bancos 59ª; DCG asesores en inversiones (conservación)"},{"id":"F058","tema":"2.1.17","tipo":"caso","q":"Bancos evalúa el grado de riesgo de sus clientes al menos cada 6 meses. ¿Cuál de estos sujetos tiene fijada en su DCG una evaluación al año?","a":"El asesor en inversiones","o":["La casa de cambio","El asesor en inversiones","La SOFOM","La ITF"],"x":"Asesores: al menos una evaluación por año calendario del perfil transaccional y del grado de riesgo (13ª). SOFOM, casas de bolsa, fondos, SOCAP, SOFIPO y uniones: dos por año calendario. ITF: cada 6 meses (art. 30), como Bancos (Anexo 3). Casas de cambio, centros y transmisores: sin periodicidad.","ref":"DCG Bancos 25ª Bis y Anexo 3; DCG asesores en inversiones 13ª"},{"id":"F059","tema":"2.1.17","tipo":"cifra","q":"Bancos no prevé un informe de quiénes ejercen el Control. ¿Qué plazo tiene un centro cambiario para presentarlo tras obtener su registro?","a":"20 días hábiles","o":["10 días hábiles","15 días hábiles","20 días hábiles","60 días naturales"],"x":"Los centros cambiarios tienen 20 días hábiles desde el registro (o 10 desde el cambio); SOFOM, SOCAP, SOFIPO, casas de cambio y transmisores, 10 días hábiles. Bancos no lo prevé.","ref":"DCG centros cambiarios 50ª"},{"id":"F060","tema":"2.1.17","tipo":"cifra","q":"Para adecuarse a la reforma de sus DCG publicada el 28-ago-2024, ¿qué plazos tuvieron los Bancos para el Manual y para la metodología?","a":"Manual 18 meses; metodología 12 meses","o":["Manual 18 meses; metodología 12 meses","Manual 4 meses; metodología 9 meses","Manual 12 meses; metodología 18 meses","Manual 9 meses; metodología 18 meses"],"x":"La transitoria Tercera de Bancos dio 18 meses para el Manual, 12 para la metodología, 18 para los sistemas y 12 para la certificación del OC. Los 4 y 9 meses son de las reformas de 2021 y 2023 de los demás.","ref":"DCG Bancos, transitoria Tercera, fr. I y II (DOF 28-ago-2024)"},{"id":"F061","tema":"2.1.17","tipo":"caso","q":"Una SOFOM debe adecuarse a la reforma de sus DCG publicada el 09-sep-2021. ¿Qué plazos tuvo para el Manual y la metodología?","a":"Manual 4 meses; metodología 9 meses","o":["Manual 4 meses; metodología 9 meses","Manual 18 meses; metodología 12 meses","Manual 12 meses; metodología 18 meses","Manual 9 meses; metodología 4 meses"],"x":"Las reformas de 2021 y 2023 (SOFOM, casas de bolsa, fondos, SOCAP, SOFIPO, asesores, uniones y transmisores) dieron 4 · 9 · 18 meses para Manual, metodología y sistemas. Los 18 y 12 meses son de Bancos 2024.","ref":"DCG SOFOM, transitoria Cuarta, fr. I y II (DOF 09-sep-2021)","par":"F060"},{"id":"F062","tema":"2.1.17","tipo":"trampa","q":"En los transitorios de su última reforma, ¿qué sujeto recibió un plazo de 12 meses para la certificación de su oficial de cumplimiento?","a":"Los Bancos","o":["Las casas de bolsa","Las SOFOM","Los Bancos","Los transmisores"],"x":"Sólo la reforma de Bancos (DOF 28-ago-2024, transitoria Tercera, fr. IV) dio 12 meses para la certificación del OC. Las reformas de 2021 y 2023 de los demás no traen ese plazo.","ref":"DCG Bancos, transitoria Tercera, fr. IV (DOF 28-ago-2024)"},{"id":"F063","tema":"2.1.17","tipo":"caso","q":"Un centro cambiario debe adecuarse a la reforma de sus DCG del 19-ene-2023. ¿Para qué obligación fija su transitoria un plazo en meses, y de cuánto?","a":"Para modificar el Manual de Cumplimiento: 4 meses","o":["Para Manual, metodología y sistemas: 4, 9 y 18 meses","Para modificar el Manual de Cumplimiento: 4 meses","Para Manual y metodología: 18 y 12 meses","Para los sistemas automatizados: 18 meses"],"x":"La transitoria Tercera de la reforma 2023 de centros cambiarios da 4 meses para modificar el Manual y presentarlo a la Comisión; la Cuarta deja la información de la 48ª Bis para la fecha que fije la CNBV. El esquema 4 · 9 · 18 es de las reformas de 2021 y 2023 de los demás sujetos.","ref":"DCG centros cambiarios, transitorias Tercera y Cuarta (DOF 19-ene-2023)"},{"id":"F064","tema":"2.1.17","tipo":"caso","q":"Una persona de las previstas en la Octava Disposición Transitoria de la LRITF obtiene su autorización como ITF. Conforme al transitorio Segundo de sus DCG (DOF 10-sep-2018), ¿qué plazo tiene para su metodología y sistemas, y desde cuándo corre?","a":"180 días naturales desde que obtiene la autorización","o":["180 días hábiles desde la publicación de las DCG en el DOF","360 días naturales desde la publicación de las DCG en el DOF","18 meses desde que obtiene la autorización, igual que Bancos","180 días naturales desde que obtiene la autorización"],"x":"Aplica a las personas de la Octava transitoria de la LRITF (las que ya realizaban la actividad): el transitorio Segundo de las DCG de ITF les da 180 días naturales para metodología y sistemas y 360 para regularizar expedientes, contados desde que obtienen la autorización, no desde la publicación.","ref":"DCG ITF, transitorio Segundo, fr. I y II (DOF 10-sep-2018)"},{"id":"F065","tema":"2.1.17","tipo":"trampa","q":"En las reformas de 2021, ¿qué sujetos recibieron un plazo de 6 meses para la geolocalización por dirección IP?","a":"Casas de bolsa y fondos de inversión","o":["Todos los sujetos reformados en 2021","Bancos y SOFOM","Casas de bolsa y fondos de inversión","SOCAP y SOFIPO"],"x":"Sólo las DCG de casas de bolsa y de fondos de inversión (transitoria Quinta, fr. IV) dieron 6 meses para la geolocalización por IP. Las demás reformas de 2021 no traen ese plazo.","ref":"DCG casas de bolsa y fondos de inversión, transitoria Quinta, fr. IV (DOF 09-sep-2021)"},{"id":"F066","tema":"2.1.17","tipo":"caso","q":"Un banco y una SOFIPO aprueban cambios a su Manual el mismo día. ¿Qué plazo tiene cada uno para enviarlos a la CNBV?","a":"Ambos: 20 días hábiles desde la aprobación","o":["Ambos: 20 días hábiles desde la aprobación","Banco: 20 días hábiles; SOFIPO: 10 días hábiles","Banco: 15 días hábiles; SOFIPO: 20 días hábiles","Ambos: 60 días naturales desde la aprobación"],"x":"El envío de cambios al Manual es de 20 días hábiles en las 12 DCG; en 11 corre desde la aprobación (cambia quién aprueba) y en asesores, desde que el Representante las elabora. Los 60 días naturales son del informe de auditoría.","ref":"DCG Bancos 64ª; DCG SOFIPO (cambios al Manual)"}],"sitio":{"nombre":"Módulo 2","integrador":"simulacro","integrador_texto":"Simulacro mixto","integrador_href":"m2-simulacro/index.html","etiqueta_n":"H","orden_resultados":"temario","paginas":[{"n":"1","carpeta":"m2-h1-objetivo-kyc","pregunta":"2.1.1–2.1.2 · Objetivo y política de identificación y conocimiento","estado":"integrada"},{"n":"2","carpeta":"m2-h2-reportes-dolares-sistemas","pregunta":"2.1.3–2.1.5 · Reportes, dólares en efectivo y sistemas automatizados","estado":"integrada"},{"n":"3","carpeta":"m2-h3-otras-obligaciones-lpb","pregunta":"2.1.6–2.1.8 · Otras obligaciones, intercambio de información y LPB","estado":"integrada"},{"n":"4","carpeta":"m2-h4-ccc-oficial","pregunta":"2.1.9–2.1.10 · Comité de Comunicación y Control y oficial de cumplimiento","estado":"integrada"},{"n":"5","carpeta":"m2-h5-novedosos-cambios-itf","pregunta":"2.1.11–2.1.14 · Modelos novedosos, centros cambiarios, transmisores e ITF","estado":"integrada"},{"n":"6","carpeta":"m2-h6-sanciones-pr-plazos","pregunta":"2.1.15–2.1.17 · Sanciones, propietario real y plazos","estado":"integrada"},{"n":"7","carpeta":"m2-h7-tipologias","pregunta":"2.1 · Tipologías UIF y de organismos internacionales","estado":"integrada"},{"n":"8","carpeta":"m2-h8-lfpiorpi","pregunta":"2.2.1–2.2.2 · LFPIORPI: actividades vulnerables y uso de efectivo","estado":"integrada"}],"raiz":"../","actual":"m2-h6-sanciones-pr-plazos"}}

<script>
(function(){
const D = JSON.parse(document.getElementById("datos").textContent);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// «Por qué no las otras»: q.d = {texto de opción incorrecta: razón}; opts = opciones en el orden en que se muestran
const tuHTML=(q,txt)=>(txt&&txt!==q.a&&q.d&&q.d[txt])?`<div class="tu"><b>Por qué tu respuesta está mal</b>${esc(q.d[txt])}</div>`:"";
const distHTML=(q,opts)=>{ if(!q.d) return ""; const it=opts.map((o,k)=>q.d[o]?`<li><b>${"ABCD"[k]}</b> ${esc(q.d[o])}</li>`:"").join(""); return it?`<div class="dist"><div class="lbl">Por qué no las otras</div><ul>${it}</ul></div>`:""; };
const RUTA = D.meta.ruta||"financiero";
const ACENTOS = {financiero:["morado","turquesa"], av:["turquesa","coral"], transversal:["morado","coral"], gratuito:["morado","turquesa"]}[RUTA]||["morado","turquesa"];
const COLORES = ["c-principal","c-"+ACENTOS[0],"c-"+ACENTOS[1],"c-negro"];
const colorDe = (v,i)=>v?("c-"+v):COLORES[i%4];
document.documentElement.setAttribute("data-ruta", RUTA);
const RUTAS = {financiero:"Ruta Sector financiero", av:"Ruta Actividades vulnerables", transversal:"Transversales", gratuito:"Gratuitos"};

/* ---------- encabezado, portada, trampas, pie ---------- */
$("#brand").innerHTML = `<b>360EDUCA</b><span>${esc(D.meta.modulo||"")}</span><span class="ruta">${esc(RUTAS[D.meta.ruta||"financiero"])}</span>`;
$("#nav").innerHTML = D.secciones.filter(s=>s.nav).map(s=>`<a href="#${s.id}"${s.tipo==="simulador"?' class="cta"':""}>${esc(s.nav)}</a>`).join("");
/* ---------- modo sitio: franja de páginas (opcional) ---------- */
if(D.sitio && Array.isArray(D.sitio.paginas)){
  const S=D.sitio, raiz=S.raiz||"", act=S.actual||"";
  const ETQ={preparacion:"En preparación", proximamente:"Próximamente"};
  const actual=S.paginas.find(p=>p.carpeta===act);
  $("#sitebar").innerHTML = `<a class="sb-mod" href="${esc(raiz)}index.html"${act?"":' aria-current="page"'}>${esc(S.nombre||"Portada")}</a><span class="sb-sep"></span>`+
    S.paginas.map(p=>{
      const tip=`${S.etiqueta_n!=null?S.etiqueta_n:"Sesión "}${p.n} · ${p.pregunta||""}`;
      if(p.estado && p.estado!=="integrada") return `<span class="sb-p off" title="${esc(tip)} · ${esc(ETQ[p.estado]||p.estado)}" aria-disabled="true">${esc(p.n)}</span>`;
      return `<a class="sb-p" href="${esc(raiz+p.carpeta)}/index.html" title="${esc(tip)}"${p.carpeta===act?' aria-current="page"':""}>${esc(p.n)}</a>`;
    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+
    (actual?`<span class="sb-ses">${esc(S.etiqueta_n!=null?S.etiqueta_n:"Sesión ")}${esc(actual.n)} · ${esc(actual.pregunta||"")}</span>`:"");
  $("#sitebar").hidden=false;
}
const mapa0 = D.secciones.find(s=>s.tipo==="mapa");
let rhythm = "";
if(Array.isArray(D.meta.ritmo)){ // ritmo puesto a mano: [{n, lb, q, color}]
  const R0=D.meta.ritmo;
  rhythm = `<div><div class="rhythm${R0.length>4?" many":""}">${R0.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${esc(r.n)}</span><span class="lb">${esc(r.lb||"")}</span><span class="q">${esc(r.q||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${D.meta.ritmo_cap?esc(D.meta.ritmo_cap):`${R0.map(r=>r.n).join(" · ")} = ${R0.reduce((a,r)=>a+(+r.n||0),0)} ${esc(D.meta.unidad||"")}`}</div></div>`;
} else if(mapa0 && D.meta.ritmo!==false){
  const counts = mapa0.ramas.map(r=>r.items.length);
  rhythm = `<div><div class="rhythm${mapa0.ramas.length>4?" many":""}">${mapa0.ramas.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${r.items.length}</span><span class="lb">${esc(r.corto||r.letra)}</span><span class="q">${esc(r.ritmo||r.pregunta||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${counts.join(" · ")} = ${counts.reduce((a,b)=>a+b,0)} ${esc(D.meta.unidad||"")}</div></div>`;
}
$("#hero").innerHTML = `<div><div class="lbl">${esc(D.meta.eyebrow||"")}</div>
  <h1>${esc(D.meta.h1_antes||"")} <mark>${esc(D.meta.h1_resaltado||"")}</mark> ${esc(D.meta.h1_despues||"")}</h1>
  <p>${D.meta.intro||""}</p></div>${rhythm}`;
$("#traps").innerHTML = (D.trampas||[]).map((t,i)=>`<div class="trapc"><span class="tag">Trampa ${D.trampas.length>1?i+1:"de examen"}</span><p><b>${esc(t.titulo)}</b> ${t.texto}</p></div>`).join("");
if(!(D.trampas||[]).length) $("#traps").hidden=true;
$("#pie").innerHTML = `<b>GMC360 · 360Educa</b> — ${D.meta.fuente||""} Material didáctico; los textos están resumidos, consulta la publicación oficial para la redacción íntegra.`;

/* ---------- secciones ---------- */
const head = s=>!s.titulo?"":`<div class="sec-head"><h2>${esc(s.titulo)}</h2>${s.intro?`<p>${s.intro}</p>`:""}</div>${s.para?`<div class="para"><b>Para qué sirve</b>${s.para}</div>`:""}`;
const chant = f=>f?`<div class="chant"><div class="lbl">${esc(f.titulo||"Para recitar en voz alta")}</div><p>${f.html}</p></div>`:"";
const R = {};
let ITEMS = {}; // id -> {item, rama, color}
R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="frac"><button aria-expanded="false" data-ficha="${id}"><span class="rom">${esc(it.etiqueta)}</span><span><span class="nm">${esc(it.nombre)}</span><span class="hookt">${esc([it.verbo,it.gancho].filter(Boolean).join(" · "))}</span></span><span class="cnt">${esc(it.conteo||"")}</span></button><ul class="inc" hidden>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul></li>`}).join("")}</ul>`;
    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};
R.tarjetas = s=>head(s)+`<div class="cards">${s.tarjetas.map((c,i)=>{
  const col = colorDe(c.color,i);
  const top = c.encabezado?`<div class="chead"><div class="t">${esc(c.titulo)}</div>${c.subtitulo?`<div class="a">${esc(c.subtitulo)}</div>`:""}</div>`:(c.barra?`<div class="bar"></div>`:"");
  const body = c.filas? c.filas.map(f=>`<div class="frow"><span class="k">${esc(f.k)}</span>${f.v}</div>`).join("")
    : `<div class="cbody">${c.etiqueta?`<div class="lbl">${esc(c.etiqueta)}</div>`:""}${c.encabezado?"":`<h3>${esc(c.titulo)}</h3>`}${c.ref?`<span class="art">${esc(c.ref)}</span>`:""}${c.html?`<p>${c.html}</p>`:""}${c.lista?`<ul>${c.lista.map(l=>`<li>${l}</li>`).join("")}</ul>`:""}</div>`;
  return `<div class="card ${col}${c.ancho?" wide":""}">${top}${body}</div>`;}).join("")}</div>${s.nota?`<div class="note">${s.nota}</div>`:""}`;
R.escala = s=>{const cols=["var(--principal-linea)","#80bcb5","#a663cc","#ff8361","var(--oscuro)"];
  return head(s)+`<div class="card"><div class="cbody">${s.etiqueta?`<div class="lbl">${esc(s.etiqueta)}</div>`:""}${s.subtitulo?`<h3>${esc(s.subtitulo)}</h3>`:""}<div class="scale">${s.niveles.map((l,i)=>`<div class="lvl" style="--lc:${cols[i%5]}"><div class="n">${i+1}</div><div class="t">${esc(l.t)}</div><div class="d">${esc(l.d||"")}</div>${l.req?`<div class="req">${esc(l.req)}</div>`:""}</div>`).join("")}</div>${s.memo?`<p class="memo">${s.memo}</p>`:""}</div></div>`;};
R.pasos = s=>head(s)+`<ol class="track" style="--n:${s.pasos.length}" role="tablist" data-pasos="${s.id}">${s.pasos.map((p,i)=>`<li><button class="pill" role="tab" aria-selected="${i===0}" data-paso="${s.id}:${i}"><span class="circ">${i+1}</span><span class="nm">${esc(p.nombre)}</span></button></li>`).join("")}</ol><div class="stepd" id="stepd-${s.id}" role="tabpanel" aria-live="polite"></div>`+chant(s.frase);
R.flujo = s=>head(s)+`<div class="lanes">${s.carriles.map((c,i)=>`<div class="lane"><div class="lhead ${colorDe(c.color,i)}"><span class="t">${esc(c.titulo)}</span>${c.sub?`<span class="s">${esc(c.sub)}</span>`:""}</div><div class="flow">${c.nodos.map(n=>`<div class="node"><h4>${esc(n.titulo)}</h4>${n.ref?`<span class="art">${esc(n.ref)}</span>`:""}${n.texto?`<p>${n.texto}</p>`:""}${n.plazo?`<span class="plazo">${esc(n.plazo)}</span>`:""}${n.nota?`<p>${n.nota}</p>`:""}</div>`).join('<div class="arrow" aria-hidden="true">→</div>')}</div></div>`).join("")}</div>`;
R.cifras = s=>head(s)+`<div class="nums">${s.cifras.map(c=>`<div class="numt"><div class="v">${esc(c[0])}<small>${esc(c[1])}</small></div><div class="d">${esc(c[2])}</div><div class="r">${esc(c[3])}</div></div>`).join("")}</div>`;
R.simulador = s=>head({titulo:s.titulo||"Modo examen",para:s.para,intro:s.intro||"Opción múltiple con 4 opciones. Practica por tema en rondas de 10, o haz un simulacro de 30 o 50 que no repite reactivos hasta agotar el banco. Contesta con clic o con las teclas A, B, C, D."})+
  `<div class="simbar">${(s.tamanos||[30,50]).map(n=>`<button class="qsim" data-n="${+n}" aria-pressed="false">Simulacro de ${+n}</button>`).join("")}<span class="bankinfo" id="bankinfo"></span><button class="linkbtn" id="simReset">Reiniciar mi avance</button></div>
   <div class="lbl" style="margin-bottom:6px">O practica por tema (rondas de 10)</div><div class="modes" id="modes" role="group" aria-label="Tipo de práctica"></div><div class="quiz" id="quiz" aria-live="polite"></div>`;
R.repaso = s=>head({titulo:s.titulo||"Repaso",para:s.para,intro:s.intro||"Tandas al azar de un banco de repaso. Lee la pregunta y las cuatro opciones, decide tu respuesta y luego revélala."})+
  (s.fallas&&s.fallas.length?`${s.fallas_titulo?`<div class="lbl" style="margin:0 0 8px">${esc(s.fallas_titulo)}</div>`:""}<div class="cards rp-fallas">${s.fallas.map((f,i)=>`<div class="card ${colorDe(f.color,i)}"><div class="bar"></div><div class="cbody"><h3>${esc(f.titulo)}</h3><p>${f.texto}</p></div></div>`).join("")}</div>`:"")+
  `<div class="lbl" style="margin:22px 0 8px">${s.pool?"Elige cuántas preguntas":"Bloques"}</div><div class="modes" id="rpi-${s.id}" role="group" aria-label="Repaso"></div><div class="quiz rp-box" id="rp-${s.id}" aria-live="polite"></div>`;
$("#secciones").innerHTML = D.secciones.map((s,i)=>`<section class="block${s.tipo==="simulador"?" sim":""}" id="${s.id}">${R[s.tipo](s,i)}</section>`).join("");

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}
document.fonts && document.fonts.ready.then(redraw); redraw();

/* ---------- pasos ---------- */
const PASOS={};
function showPaso(sid,i){
  const s=D.secciones.find(x=>x.id===sid), n=s.pasos.length; i=(i+n)%n; PASOS[sid]=i; const p=s.pasos[i];
  document.querySelectorAll(`[data-paso^="${sid}:"]`).forEach(b=>b.setAttribute("aria-selected",b.dataset.paso===`${sid}:${i}`));
  $("#stepd-"+sid).innerHTML=`<div class="big">${i+1}</div><div><div class="lbl">Paso ${i+1} de ${n}</div><h3>${esc(p.nombre)}</h3>${p.ref?`<span class="art">${esc(p.ref)}</span>`:""}${p.gancho?`<div class="hook">${esc(p.gancho)}</div>`:""}<ul>${(p.puntos||[]).map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="stepnav"><button class="btn ghost" data-pnav="${sid}:${i-1}">← Anterior</button><button class="btn" data-pnav="${sid}:${i+1}">Siguiente paso →</button></div></div>`;
}
D.secciones.filter(s=>s.tipo==="pasos").forEach(s=>showPaso(s.id,0));

/* ---------- recitar, panel y clics ---------- */
const recite=$("#recite");
recite.addEventListener("click",()=>{const on=document.body.classList.toggle("recite");recite.setAttribute("aria-pressed",on);recite.textContent=on?"Mostrar nombres":"Modo recitar";document.querySelectorAll(".shown").forEach(e=>e.classList.remove("shown"));});
let lastFocus=null;
function openItem(id){
  const {it,r,col}=ITEMS[id], h=$("#dHead");
  h.className="dhead "+col;
  $("#dTitle").textContent=it.panel||it.etiqueta;
  $("#dBody").innerHTML=`<div class="lbl">${esc(r.titulo)} · ${esc(it.etiqueta)}</div><div class="hook">${esc(it.nombre)}${it.verbo?` — «${esc(it.verbo)}»`:""}</div>${it.desc?`<p style="margin:0 0 12px">${esc(it.desc)}</p>`:""}<ul>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul>${it.ir?`<a class="btn" href="${esc(it.ir)}" id="dGo" style="margin-top:16px">${esc(it.ir_texto||"Ver el detalle")}</a>`:""}`;
  lastFocus=document.activeElement; $("#scrim").hidden=false; $("#drawer").hidden=false; $("#dClose").focus();
  const go=$("#dGo"); if(go) go.addEventListener("click",closeD);
}
function closeD(){$("#scrim").hidden=true;$("#drawer").hidden=true;if(lastFocus)lastFocus.focus();}
$("#dClose").addEventListener("click",closeD); $("#scrim").addEventListener("click",closeD);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#drawer").hidden)closeD();});
document.addEventListener("click",e=>{
  const rec=document.body.classList.contains("recite");
  const chip=e.target.closest("[data-item]");
  if(chip){ if(rec&&!chip.classList.contains("shown")){chip.classList.add("shown");return;} openItem(chip.dataset.item); return; }
  const fb=e.target.closest("[data-ficha]");
  if(fb){ const li=fb.parentElement; if(rec&&!li.classList.contains("shown")){li.classList.add("shown");return;} const inc=li.querySelector(".inc"),open=inc.hidden; inc.hidden=!open; fb.setAttribute("aria-expanded",open); return; }
  const pill=e.target.closest("[data-paso]");
  if(pill){ if(rec&&!pill.classList.contains("shown")) pill.classList.add("shown"); const [sid,i]=pill.dataset.paso.split(":"); showPaso(sid,+i); return; }
  const pn=e.target.closest("[data-pnav]");
  if(pn){ const [sid,i]=pn.dataset.pnav.split(":"); showPaso(sid,+i); }
});

/* ---------- repaso (tandas al azar o secuencia fija) ---------- */
// Con "pool": tandas al azar de 10/20/30 (configurable en "tandas") que no repiten hasta agotar el banco de repaso;
// las opciones se barajan. Con "bloques": secuencia fija, opciones sin barajar (para un guion con letras).
// Clic en una opción = respuesta del alumno; «Revelar respuesta» = la instructora muestra la correcta sin marcar a nadie.
D.secciones.filter(s=>s.tipo==="repaso").forEach(s=>{
  const BK={}; (D.banco||[]).forEach(q=>BK[q.id]=q);
  const TM=D.temas||{}, sim=D.secciones.find(x=>x.tipo==="simulador"), CL=s.claves||{};
  const box=$("#rp-"+s.id), idx=$("#rpi-"+s.id);
  const mix=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const KEY="rp-"+(D.meta.clave||"mapa")+"-"+s.id;
  const POOL=(s.pool||[]).filter(id=>BK[id]);
  let seq=[], i=0, meta=null;
  function fixedSeq(){ const out=[]; (s.bloques||[]).forEach((b,bi)=>b.items.forEach(it=>{if(BK[it.id]) out.push({...BK[it.id],opts:BK[it.id].o.slice(),clave:it.clave||CL[it.id]||"",extra:!!it.extra,bi,bt:b.titulo});})); return out; }
  function tanda(n){
    let used=new Set(st.get(KEY,[])), rest=POOL.filter(id=>!used.has(id)), pick;
    if(rest.length<n){ pick=mix(rest); used=new Set(); const more=mix(POOL.filter(id=>!pick.includes(id))).slice(0,n-pick.length); pick=pick.concat(more); more.forEach(id=>used.add(id)); }
    else { pick=mix(rest).slice(0,n); pick.forEach(id=>used.add(id)); }
    st.set(KEY,[...used]);
    return mix(pick).map(id=>({...BK[id],opts:mix(BK[id].o),clave:CL[id]||""}));
  }
  const sinSalir=()=>`${POOL.length-new Set(st.get(KEY,[])).size} de ${POOL.length} sin salir`;
  function start(n){ seq=n?tanda(n):fixedSeq(); meta={n}; seq.forEach(q=>{q.pick=null;q.shown=false;}); i=0; draw(); box.scrollIntoView({block:"start"}); }
  const fsTxt=()=>document.fullscreenElement?"Salir de pantalla completa":"Pantalla completa";
  if(s.pool){
    idx.innerHTML=(s.tandas||[10,20,30]).map(n=>`<button class="rpb" data-rpn="${n}" aria-pressed="false">${n} preguntas</button>`).join("")+`<span class="bankinfo" id="rpinfo-${s.id}" style="align-self:center">${POOL.length} preguntas en el banco de repaso · ${sinSalir()}</span>`;
    box.innerHTML=`<div class="qtext">Elige una tanda de ${(s.tandas||[10,20,30]).join(", ").replace(/, (\d+)$/," o $1")} preguntas.</div><p style="margin:10px 0 0">Salen al azar y no se repiten hasta agotar las ${POOL.length}; las opciones cambian de orden cada vez.</p>`;
  } else {
    idx.innerHTML=(s.bloques||[]).map((b,bi)=>`<button class="rpb" data-rpb="${bi}" aria-pressed="false">${bi+1} · ${esc(b.titulo)} <small>${b.items.length}</small></button>`).join("");
  }
  function draw(){
    idx.querySelectorAll("[data-rpn]").forEach(b=>b.setAttribute("aria-pressed",String(meta&&+b.dataset.rpn===meta.n)));
    if(!s.pool) idx.querySelectorAll("[data-rpb]").forEach(b=>b.setAttribute("aria-pressed",String(i<seq.length&&+b.dataset.rpb===seq[i].bi)));
    if(i>=seq.length) return fin();
    const q=seq[i], ok=q.opts.indexOf(q.a), lab=s.pool?`Tanda de ${seq.length}`:`Bloque ${q.bi+1} · ${esc(q.bt)}`;
    const good=seq.filter(x=>x.pick!=null&&x.opts[x.pick]===x.a).length;
    box.innerHTML=`<div class="qbar"><span>${lab} · pregunta ${i+1} de ${seq.length}</span><span>Aciertos: ${good}</span></div><div class="qprog"><i style="width:${i/seq.length*100}%"></i></div>
    <div class="qtag"><span>${esc(TM[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}${q.extra?"<span>Extra</span>":""}</div><div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt${q.shown?(k===ok?" right":(k===q.pick?" wrong":"")):""}" data-rpk="${k}"${q.shown?" disabled":""}><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="fb">${q.shown?`${q.pick==null?`<span class="ok">Respuesta ${"ABCD"[ok]}</span>`:(q.pick===ok?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>')}${q.pick!=null?tuHTML(q,q.opts[q.pick]):""} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}${q.clave?`<div class="rp-clave"><div class="lbl">Para no confundirte</div>${q.clave}</div>`:""}`:""}</div>
    <div class="qactions"><button class="btn ghost" data-rpnav="-1"${i===0?" disabled":""}>← Anterior</button>${q.shown?"":`<button class="btn" data-rpshow>Revelar respuesta</button>`}<button class="btn ghost" data-rpnav="1">${i+1===seq.length?"Ver resultado →":"Siguiente →"}</button><button class="btn ghost" data-rpfs>${fsTxt()}</button></div>`;
  }
  function fin(){
    const resp=seq.filter(x=>x.pick!=null), good=resp.filter(x=>x.opts[x.pick]===x.a).length, miss=seq.filter(x=>x.pick!=null&&x.opts[x.pick]!==x.a), c=s.cierre;
    box.innerHTML=`<div class="qbar"><span>${s.pool?`Tanda de ${seq.length} · resultado`:"Cierre"}</span><span>${resp.length?`${good}/${resp.length}`:""}</span></div><div class="qprog"><i style="width:100%"></i></div>
    ${resp.length?`<div class="score"><span class="big">${Math.round(good/resp.length*100)}%</span><span>${good} de ${resp.length} contestadas correctamente.</span></div>`:""}
    ${miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${miss.length})</summary><ul>${miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.opts[m.pick])}</s>${m.d&&m.d[m.opts[m.pick]]?` — ${esc(m.d[m.opts[m.pick]])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
    ${c?`<div class="qtext" style="margin-top:18px">${esc(c.titulo)}</div><ol class="rp-fin">${(c.pasos||[]).map(p=>`<li>${p}</li>`).join("")}</ol>${c.nota?`<div class="rp-clave">${c.nota}</div>`:""}`:""}
    <div class="qactions"><button class="btn ghost" data-rpnav="-1">← Anterior</button>${s.pool?`<button class="btn" data-rpn="${meta.n}">Otra tanda de ${meta.n}</button>`:""}${sim?`<a class="btn ghost" href="#${sim.id}">${esc(sim.nav||"Practicar")}</a>`:""}<button class="btn ghost" data-rpfs>${fsTxt()}</button></div>
    ${s.pool?`<p class="siminfo">${sinSalir()}</p>`:""}`;
    const inf=$("#rpinfo-"+s.id); if(inf) inf.textContent=`${POOL.length} preguntas en el banco de repaso · ${sinSalir()}`;
  }
  function reveal(){ if(!seq.length||i>=seq.length||seq[i].shown) return; seq[i].shown=true; draw(); }
  const go=n=>{ if(!seq.length) return; i=Math.max(0,Math.min(n,seq.length)); draw(); };
  function fs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else if(box.requestFullscreen) box.requestFullscreen(); }catch(e){} }
  document.addEventListener("fullscreenchange",()=>{const f=box.querySelector("[data-rpfs]");if(f)f.textContent=fsTxt();});
  const onClick=e=>{
    const n=e.target.closest("[data-rpn]"); if(n){start(+n.dataset.rpn);return;}
    const b=e.target.closest("[data-rpb]"); if(b){if(!seq.length||s.pool)start(0);go(seq.findIndex(q=>q.bi===+b.dataset.rpb));return;}
    const o=e.target.closest("[data-rpk]"); if(o&&seq[i]&&!seq[i].shown){seq[i].pick=+o.dataset.rpk;reveal();return;}
    if(e.target.closest("[data-rpshow]")){reveal();return;}
    const nv=e.target.closest("[data-rpnav]"); if(nv){go(i+(+nv.dataset.rpnav));return;}
    if(e.target.closest("[data-rpfs]")) fs();
  };
  idx.addEventListener("click",onClick); box.addEventListener("click",onClick);
  document.addEventListener("keydown",e=>{
    if(!seq.length||e.target.closest("input,textarea")||!$("#drawer").hidden) return;
    const r=box.getBoundingClientRect(); if(document.fullscreenElement!==box&&(r.bottom<0||r.top>innerHeight)) return;
    if(e.key==="ArrowRight"){go(i+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(i-1);e.preventDefault();}
    else if(e.key.toLowerCase()==="r"){reveal();e.preventDefault();}
    else if(e.key.toLowerCase()==="f"){fs();e.preventDefault();}
  });
  if(!s.pool) start(0);
});

/* ---------- simulador ---------- */
if(!D.secciones.some(s=>s.tipo==="simulador")) return;
const BANK=D.banco||[], TEMAS=D.temas||{};
const MODOS=[{k:"all",l:"Todo mezclado",f:()=>true}].concat((D.modos||[]).map(m=>({k:m.k,l:m.l,f:x=>(m.tema?x.tema===m.tema:true)&&(m.tipos?m.tipos.includes(x.tipo):true)})));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY=D.meta.clave||"mapa", SEEN="seen-"+KEY, SIM="sim-"+KEY;
let seen=new Set(store.get(SEEN,[])), MODE="all", ST=null;
const poolFor=k=>BANK.filter(MODOS.find(m=>m.k===k).f);
const simInfo=()=>`${BANK.length-store.get(SIM,[]).length} de ${BANK.length} sin salir en simulacro`;
const bankInfo=()=>`${BANK.length} reactivos verificados contra el texto oficial · ${simInfo()}`;
function startRound(){const pool=poolFor(MODE);const fresh=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));start(fresh.concat(old).slice(0,10),{kind:"ronda",label:MODOS.find(m=>m.k===MODE).l});}
const SIMSEC=D.secciones.find(s=>s.tipo==="simulador")||{};
function cuotas(n,pesos){ // reparto por resto mayor; sólo temas con reactivos
  const ks=Object.keys(pesos).filter(k=>pesos[k]>0&&BANK.some(x=>x.tema===k)), tot=ks.reduce((a,k)=>a+pesos[k],0);
  if(!ks.length) return null;
  const raw=ks.map(k=>({k,v:n*pesos[k]/tot})), out={}; let asig=0;
  raw.forEach(r=>{out[r.k]=Math.floor(r.v);asig+=out[r.k];});
  raw.sort((a,b)=>(b.v%1)-(a.v%1)).slice(0,n-asig).forEach(r=>out[r.k]++);
  return out;
}
function startSim(n){
  if(SIMSEC.proporcion){
    const q=cuotas(n,SIMSEC.proporcion);
    if(q){
      let used=new Set(store.get(SIM,[])), pick=[], cycled=false;
      Object.entries(q).forEach(([k,c])=>{
        const delTema=BANK.filter(x=>x.tema===k); let rest=shuffle(delTema.filter(x=>!used.has(x.id)));
        if(rest.length<c){cycled=true;delTema.forEach(x=>used.delete(x.id));rest=rest.concat(shuffle(delTema.filter(x=>!rest.includes(x))));}
        rest=rest.slice(0,c); rest.forEach(x=>used.add(x.id)); pick=pick.concat(rest);
      });
      store.set(SIM,[...used]); return start(shuffle(pick),{kind:"simulacro",label:`Simulacro de ${pick.length}`,n,cycled});
    }
  }
  let used=new Set(store.get(SIM,[])), rest=BANK.filter(x=>!used.has(x.id)), cycled=false;
  if(rest.length<n){cycled=true;const take=shuffle(rest);used=new Set();const more=shuffle(BANK.filter(x=>!take.includes(x))).slice(0,n-take.length);rest=take.concat(more);more.forEach(x=>used.add(x.id));}
  else{rest=shuffle(rest).slice(0,n);rest.forEach(x=>used.add(x.id));}
  store.set(SIM,[...used]); start(shuffle(rest),{kind:"simulacro",label:`Simulacro de ${n}`,n,cycled});
}
function start(list,meta){ST={list:list.map(q=>({...q,opts:shuffle(q.o)})),i:0,ok:0,miss:[],byTema:{},meta};document.querySelectorAll(".qmode,.qsim").forEach(b=>b.setAttribute("aria-pressed","false"));render();}
function render(){
  const box=$("#quiz"),n=ST.list.length; if(ST.i>=n) return renderEnd();
  const q=ST.list[ST.i];
  box.innerHTML=`<div class="qbar"><span>${esc(ST.meta.label)} · reactivo ${ST.i+1} de ${n}</span><span>Aciertos: ${ST.ok}</span></div><div class="qprog"><i style="width:${ST.i/n*100}%"></i></div>
  <div class="qtag"><span>${esc(TEMAS[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}</div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>
  <div class="qactions"><button class="btn" id="qNext" hidden>${ST.i+1===n?"Ver resultado":"Siguiente"}</button><button class="btn ghost" id="qQuit">Terminar aquí</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  $("#qNext").addEventListener("click",()=>{ST.i++;render();});
  $("#qQuit").addEventListener("click",()=>{ST.list=ST.list.slice(0,ST.i);renderEnd();});
}
function answer(k){
  const q=ST.list[ST.i]; if(q.done) return; q.done=true; const good=q.opts[k]===q.a;
  const t=ST.byTema[q.tema]||(ST.byTema[q.tema]={ok:0,n:0}); t.n++; if(good){ST.ok++;t.ok++;} else {q.mine=q.opts[k];ST.miss.push(q);}
  seen.add(q.id); store.set(SEEN,[...seen]);
  $("#quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.a)b.classList.add("right");else if(+b.dataset.k===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`${good?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>'}${good?"":tuHTML(q,q.opts[k])} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}`;
  const nb=$("#qNext"); nb.hidden=false; nb.focus();
}
function renderEnd(){
  const box=$("#quiz"),n=ST.list.length,pct=n?Math.round(ST.ok/n*100):0;
  const msg=pct>=90?"Listos para el examen.":pct>=75?"Muy bien: repasen los temas con menos aciertos.":pct>=60?"Van bien, pero hay que repasar.":"Toca volver al mapa y repasar antes del siguiente intento.";
  const ordT=(SIMSEC.orden_resultados||(D.sitio&&D.sitio.orden_resultados))==="temario",TK=Object.keys(TEMAS),ix=k=>{const i=TK.indexOf(k);return i<0?1e9:i};
  const rows=Object.entries(ST.byTema).sort(ordT?(a,b)=>ix(a[0])-ix(b[0]):(a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>`<div class="trow2"><span>${esc(TEMAS[k]||k)}</span><span class="tb"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></span><span class="tv">${v.ok}/${v.n}</span></div>`).join("");
  box.innerHTML=`<div class="printhead"><b>${esc(D.meta.titulo)}</b> · 360Educa · ${esc(ST.meta.label)} · ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div><div class="qbar"><span>${esc(ST.meta.label)} · resultado</span><span>${ST.ok}/${n}</span></div><div class="qprog"><i style="width:100%"></i></div>
  <div class="score"><span class="big">${pct}%</span><span>${ST.ok} de ${n} correctas. ${msg}</span></div>
  ${rows?`<div class="lbl" style="margin-top:14px">Aciertos por tema (${ordT?"en el orden del temario":"de menor a mayor"})</div><div class="trows">${rows}</div>`:""}
  ${ST.miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${ST.miss.length})</summary><ul>${ST.miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.mine||"")}</s>${m.d&&m.d[m.mine]?` — ${esc(m.d[m.mine])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
  <div class="qactions"><button class="btn" id="qAgain">${ST.meta.kind==="simulacro"?"Otro simulacro igual":"Otra ronda"}</button><button class="btn ghost" id="qPrint">Imprimir o guardar en PDF</button><a class="btn ghost" href="#${mapa0?mapa0.id:"top"}">Repasar el mapa</a></div>
  ${ST.meta.kind==="simulacro"?`<p class="siminfo">${simInfo()}${ST.meta.cycled?" · Se completó el banco y empezó una vuelta nueva.":""}</p>`:""}`;
  $("#qAgain").addEventListener("click",()=>ST.meta.kind==="simulacro"?startSim(ST.meta.n):startRound());
  $("#qPrint").addEventListener("click",()=>{const d=box.querySelector("details.miss");if(d)d.open=true;window.print();});
  $("#bankinfo").textContent=bankInfo();
}
document.addEventListener("keydown",e=>{
  if(!ST||e.target.closest("input,textarea")) return;
  const r=$("#quiz").getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
  const k="abcd1234".indexOf(e.key.toLowerCase()); if(k>=0&&ST.i<ST.list.length&&!ST.list[ST.i].done){answer(k%4);e.preventDefault();}
});
$("#modes").innerHTML=MODOS.map(m=>`<button class="qmode" data-m="${m.k}" aria-pressed="false">${esc(m.l)} <small>${poolFor(m.k).length}</small></button>`).join("");
document.querySelectorAll(".qmode").forEach(b=>b.addEventListener("click",()=>{MODE=b.dataset.m;startRound();b.setAttribute("aria-pressed","true");}));
document.querySelectorAll(".qsim").forEach(b=>b.addEventListener("click",()=>{startSim(+b.dataset.n);b.setAttribute("aria-pressed","true");}));
$("#simReset").addEventListener("click",()=>{store.set(SIM,[]);store.set(SEEN,[]);seen=new Set();$("#bankinfo").textContent=bankInfo();});
$("#bankinfo").textContent=bankInfo();
startRound(); document.querySelector('.qmode[data-m="all"]').setAttribute("aria-pressed","true");
})();
</script>
</body>
