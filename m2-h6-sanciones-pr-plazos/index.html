<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Módulo 2 · Área 2: sanciones por incumplir las DCG de PLD/FT, propietario real en las 12 DCG y los Lineamientos 2019, y plazos de cumplimiento regulatorio, con simulador de reactivos.">
<title>2.1.15 Sanciones · 2.1.16 Propietario real · 2.1.17 Plazos de cumplimiento regulatorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}

{"meta":{"titulo":"2.1.15 Sanciones · 2.1.16 Propietario real · 2.1.17 Plazos de cumplimiento regulatorio","descripcion":"Módulo 2 · Área 2: sanciones por incumplir las DCG de PLD/FT, propietario real en las 12 DCG y los Lineamientos 2019, y plazos de cumplimiento regulatorio, con simulador de reactivos.","repo":"mapa-m2-s6","clave":"m2s6","ruta":"financiero","modulo":"Módulo 2 · Certificación CNBV PLD/FT","unidad":"subtemas","eyebrow":"Temario CNBV agosto 2026 · 2.1.15 · 2.1.16 · 2.1.17 · LIC, LGOAAC y LRITF (ref. 14-nov-2025) · 12 DCG · Lineamientos PR 2019","h1_antes":"2.1.15 Sanciones ·","h1_resaltado":"2.1.16 Propietario real","h1_despues":"· 2.1.17 Plazos de cumplimiento regulatorio","intro":"<b>¿Qué me cuesta, quién está detrás y cuándo vence?<\/b> Tres temas del 2.1, en el orden del temario. Bancos es el eje y cada diferencia se aprende <b>sujeto por sujeto<\/b> como «igual que Bancos, salvo…». El corazón es <b>propietario real<\/b>: tiene bibliografía propia (Lineamientos 2019) y la trampa más preguntada, «las DCG obligan, los Lineamientos orientan». Orden sugerido: mapa → Modo recitar → trampas → cifras → simulacro de 30.","resumen_portada":"Qué ley sanciona a cada sujeto y con cuánto; quién es el propietario real, el 25 % y la cascada al administrador; y la línea de tiempo de los plazos de reporte, avisos y adecuación.","fuente":"Fuente: Ley de Instituciones de Crédito, Ley General de Organizaciones y Actividades Auxiliares del Crédito (arts. 81-A, 81-A Bis, 87-D, 95 y 95 Bis) y Ley para Regular las Instituciones de Tecnología Financiera, con última reforma DOF 14-nov-2025; las 12 DCG de PLD/FT de la bibliografía del temario CNBV (agosto 2026), Bancos compiladas al 28-ago-2024; Lineamientos para la identificación del Propietario Real (SHCP-UBVA, 2019). Las sanciones de casas de bolsa, asesores, fondos, SOCAP, SOFIPO y uniones están en leyes que no forman parte de la bibliografía: se mencionan sin reactivos."},"trampas":[{"titulo":"Propietario real: las DCG obligan, los Lineamientos orientan.","texto":"La <b>obligación<\/b> (definición, 25 %, datos de la 4ª, cascada al administrador) está en cada <b>DCG<\/b>: Bancos 2ª VII y XXXII, 4ª II c) y 4ª VI. Los <b>Lineamientos 2019<\/b> son criterios «enunciativos mas no limitativos» que las Entidades «<b>podrán<\/b>» considerar, y adoptarlos en el Manual <b>no basta por sí solo<\/b> para cumplir (L1). La <b>cascada<\/b> (si nadie llega al 25 %, el administrador) es de las DCG; los Lineamientos dan <b>tres vías<\/b> (propiedad · cargo · otro medio) que pueden ordenarse en <b>lista de prelación<\/b> o aplicarse indistintamente. Y el umbral: «<b>25 % o más<\/b>» en las DCG y en L3 I a); «<b>más del 25 %<\/b>» sólo al sumar fracciones menores al 25 % (L3 I). Ojo con el matiz: L3 II b) sí dice que la persona «<b>deberá<\/b> contar con un cargo de alto mando»."},{"titulo":"Ni todas las multas PLD están en UMA, ni son las de la LFPIORPI.","texto":"La <b>LIC<\/b> (Bancos) y la <b>LGOAAC<\/b> (casas de cambio, SOFOM no reguladas, centros y transmisores) multan en <b>días de salario mínimo general vigente en el Distrito Federal<\/b> (LIC 109 Bis 1; LGOAAC, capítulo de los arts. 95 y 95 Bis); sólo la <b>LRITF<\/b> multa en <b>UMA<\/b> (art. 105). Lo común a las tres: <b>10 % a 100 %<\/b> del monto por operar con alguien de la LPB o por la OI no reportada. Las bandas fijas cambian: Bancos <b>30,000–100,000 / 5,000–50,000<\/b>; LGOAAC 95 y 95 Bis <b>10,000–100,000 / 2,000–30,000<\/b>; ITF una sola banda residual de <b>10 a 100,000 UMA<\/b>. La LFPIORPI (2.2) es otra ley, con otras bandas en UMA."},{"titulo":"Bancos 2024 no dio «4 · 9 · 18 meses» como los demás.","texto":"La reforma de Bancos (DOF 28-ago-2024) dio <b>18 · 12 · 18 · 12 meses<\/b>: Manual · metodología · sistemas · <b>certificación del OC<\/b> (transitoria Tercera). Las reformas de 2021 y 2023 de SOFOM, casas de bolsa, asesores, fondos, SOCAP, SOFIPO, uniones y transmisores dieron <b>4 · 9 · 18 meses<\/b>. Centros cambiarios 2023 sólo fijó plazo en meses para el Manual (<b>4 meses<\/b>). ITF (sólo las personas de la Octava transitoria de la LRITF): <b>180 y 360 días naturales desde que obtienen la autorización<\/b>, no desde la publicación. Los cómputos cambian: hábiles o naturales, desde la alerta o desde la detección."}],"secciones":[{"tipo":"mapa","id":"mapa","nav":"Mapa 2.1.15–2.1.17","titulo":"Los tres temas en 20 subtemas","intro":"Tres ramas, una por tema del temario y en su orden, con ritmo <b>6 · 7 · 7 = 20<\/b>. Las preguntas que las amarran: <b>¿Qué me cuesta?<\/b> · <b>¿Quién está detrás?<\/b> · <b>¿Cuándo vence?<\/b> Toca un subtema para ver su contenido y su fundamento.","centro":{"t":"2.1.15 · 2.1.16 · 2.1.17","s":"20 subtemas<br>6 · 7 · 7"},"ramas":[{"letra":"2.1.15","titulo":"Sanciones","pregunta":"¿Qué me cuesta?","ritmo":"¿Qué cuesta?","corto":"2.1.15","color":"oscuro","items":[{"etiqueta":"DCG 66ª; LIC 115","nombre":"Qué ley sanciona a cada sujeto","sub":"Cada sujeto, su ley","verbo":"Remito","desc":"La CNBV sanciona «en los términos de la Ley» de cada sujeto: LIC para Bancos, LGOAAC 95 y 95 Bis para cambios y envíos y SOFOM no reguladas, LRITF 105 para ITF.","panel":"2.1.15 · Qué ley sanciona a cada sujeto","puntos":["Bancos: la 66ª remite a «la Ley» (2ª XX: LIC). La multa está en el <b>art. 115 LIC<\/b>; la impone la CNBV con el procedimiento de los arts. 107 Bis y 109 Bis 5.","<b>LGOAAC 95<\/b>: organizaciones auxiliares del crédito y <b>casas de cambio<\/b>. <b>LGOAAC 95 Bis<\/b>: SOFOM no reguladas, <b>centros cambiarios<\/b> y <b>transmisores<\/b>.","<b>LRITF 105<\/b>: ITF y sociedades con modelos novedosos.","Casas de bolsa y asesores (LMV), fondos (LFI), SOCAP (LRASCAP), SOFIPO (LACP) y uniones (LUC): su ley <b>no está en la bibliografía<\/b>; se mencionan, sin reactivos.","Las 12 DCG: la información <b>incompleta, ilegible, con errores<\/b> o en medio no conforme se tiene por incumplimiento (Bancos 67ª)."],"ir":"#t2-1-15","destacado":false},{"etiqueta":"LIC 115","nombre":"Multas por conducta","sub":"Porcentaje y días de salario","verbo":"Multo","desc":"LPB y OI no reportada: 10 % a 100 % del monto en las tres leyes. Lo demás, en días de salario (LIC, LGOAAC) o en UMA (LRITF), con bandas distintas por ley.","panel":"2.1.15 · Multas por conducta","puntos":["Operar con alguien que se informó que está en la <b>LPB<\/b>: <b>10 % a 100 %<\/b> del monto del acto, operación o servicio.","<b>OI no reportada<\/b> (o la serie relacionada del mismo cliente): <b>10 % a 100 %<\/b> de su monto.","Bancos: relevantes, internas preocupantes, transferencias internacionales y efectivo en moneda extranjera no reportados, e incisos a, b, c y e del «quinto párrafo»: <b>30,000 a 100,000 días de salario<\/b>.","Bancos, demás incumplimientos: <b>5,000 a 50,000 días de salario<\/b>.","LGOAAC 95 y 95 Bis: <b>10,000 a 100,000<\/b> y <b>2,000 a 30,000<\/b> días de salario; el 95 Bis añade el inciso <b>f<\/b>. LRITF 105: <b>10 a 100,000 UMA<\/b>, una sola banda."],"ir":"#t2-1-15","destacado":true},{"etiqueta":"LIC 107 Bis; LRITF 98","nombre":"Procedimiento","sub":"10 · 60 · 5 · 180","verbo":"Escucho","desc":"Audiencia de 10 días hábiles ampliable una vez; hasta 60 días hábiles de pruebas, 5 de alegatos y no más de 180 para emitir y notificar la resolución.","panel":"2.1.15 · Procedimiento","puntos":["Audiencia: <b>10 días hábiles<\/b>, ampliable <b>por una sola ocasión<\/b> hasta por el mismo lapso (LIC 107 Bis I; LRITF 98 I).","Pruebas hasta <b>60<\/b>, alegatos <b>5<\/b> y resolución en no más de <b>180<\/b> días hábiles.","Impone la <b>Junta de Gobierno<\/b> de la CNBV, que puede delegar por naturaleza de la infracción o monto (LIC 109 Bis 3).","La LGOAAC lo regula en su art. 88 Bis (fuera de la acotación del temario: se menciona)."],"ir":"#t2-1-15","destacado":false},{"etiqueta":"LIC 107 Bis III–IV; 109 Bis 4 y 6","nombre":"Agravantes, atenuantes y reincidencia","sub":"Doble · resarcir · amonestar","verbo":"Gradúo","desc":"Reincide quien comete la misma infracción dentro de 2 años desde que quedó firme la resolución, y la multa puede llegar al doble; resarcir el daño atenúa.","panel":"2.1.15 · Agravantes, atenuantes y reincidencia","puntos":["Reincidencia: misma infracción <b>dentro de los 2 años<\/b> siguientes a que <b>quedó firme<\/b> la resolución → <b>hasta el doble<\/b> (LIC 107 Bis III b; LRITF 98 III b).","Atenuantes: <b>resarcir el daño<\/b> y aportar información que coadyuve (LIC 109 Bis 6; LRITF 99).","Puede <b>amonestar además<\/b> de multar, <b>o sólo amonestar<\/b> (LIC 109 Bis 4; LRITF 107).","En conductas graves, la LRITF permite considerar además <b>el plazo que dure el incumplimiento<\/b> y los riesgos de las operaciones (98 IV f–g).","Graves PLD en la LIC (108): no presentar el documento de políticas KYC y <b>operaciones no reportadas<\/b>, entre otras."],"ir":"#t2-1-15","destacado":false},{"etiqueta":"LIC 109 Bis 1 y 8; LRITF 97, 106, 108","nombre":"Pago, caducidad y publicación","sub":"15 días · 20 % · 5 años","verbo":"Publico","desc":"Pago en 15 días hábiles, con 20 % de reducción si se cumple la condición de cada ley; la facultad de sancionar caduca en 5 años y la sanción se publica en el portal de la CNBV.","panel":"2.1.15 · Pago, caducidad y publicación","puntos":["Pago dentro de <b>15 días hábiles<\/b> desde la notificación.","Reducción del <b>20 %<\/b>: en la LIC, si <b>no se interpuso medio de defensa<\/b>; en la LRITF, si se <b>manifiesta por escrito la conformidad<\/b>.","Caducidad: <b>5 años<\/b> desde el día hábil siguiente a la conducta (LIC 109 Bis 1; LRITF 106).","Publicación en el <b>portal de Internet<\/b>; no se considera reservada ni confidencial (LIC 109 Bis 8; LRITF 108).","Unidad de la LIC: salario mínimo general diario vigente en el Distrito Federal <b>el día de la conducta<\/b>."],"ir":"#t2-1-15","destacado":false},{"etiqueta":"LGOAAC 81-D, 95 Bis; LRITF 62, 69","nombre":"Cancelación, revocación y remoción","sub":"Más allá de la multa","verbo":"Cancelo","desc":"Centros y transmisores pueden perder el registro por reincidir o incumplir gravemente el 95 Bis; la ITF puede perder la autorización y sus directivos ser removidos.","panel":"2.1.15 · Cancelación, revocación y remoción","puntos":["95 Bis: la CNBV puede ordenar a bancos, casas de bolsa y casas de cambio que <b>suspendan o cancelen los contratos<\/b> con centros cambiarios y transmisores cuando <b>presuma<\/b> que violan el artículo.","81-D (apoyo, fuera de la acotación): cancelación del registro por reincidencia, incumplimiento grave del 95 Bis u <b>omitir un año calendario<\/b> la información; el centro cambiario cancelado entra en <b>disolución y liquidación<\/b>.","LRITF 69: la CNBV, con aprobación del Comité Interinstitucional, puede <b>revocar<\/b> la autorización por reincidencia o conducta grave.","LRITF 62: <b>remoción o inhabilitación<\/b> de consejeros, administradores o director general <b>de 3 meses a 5 años<\/b>.","Bancos: en la LIC no se localizó una causal de revocación específica por PLD (pendiente)."],"ir":"#t2-1-15","destacado":false}]},{"letra":"2.1.16","titulo":"Propietario real","pregunta":"¿Quién está detrás?","ritmo":"¿Quién?","corto":"2.1.16","color":"principal","items":[{"etiqueta":"2ª XXXII","nombre":"Definición","sub":"El verdadero dueño","verbo":"Defino","desc":"Persona física que obtiene los beneficios de una cuenta, contrato u operación y es, en última instancia, el verdadero dueño de los recursos; también quien ejerce el Control.","panel":"2.1.16 · Definición","puntos":["Persona física que, por medio de otra o de cualquier acto o mecanismo, obtiene los beneficios de una <b>cuenta, contrato u Operación<\/b>.","Es el verdadero dueño: tiene derechos de <b>uso, disfrute, aprovechamiento, dispersión o disposición<\/b>.","Comprende a quien ejerce el <b>Control<\/b> de una persona moral y a quien instruye, para su beneficio, actos por <b>fideicomisos, mandatos o comisiones<\/b>.","<b>≠ Beneficiario<\/b> (designado para caso de fallecimiento, 2ª III) <b>≠ Proveedor de Recursos<\/b> (sin ser titular, aporta de manera regular sin obtener los beneficios, 2ª XXXIII).","Igual en las 12 DCG; cambia el objeto: casas de cambio, centros y transmisores hablan sólo de «una Operación»."],"ir":"#t2-1-16","destacado":false},{"etiqueta":"2ª VII","nombre":"Control y el 25 %","sub":"Impone · Nombra · Vota · Dirige","verbo":"Mido","desc":"Control es imponer decisiones, nombrar a la mayoría del consejo, votar más del 50 % o dirigir; además lo ejerce quien adquiere el 25 % o más del capital.","panel":"2.1.16 · Control y el 25 %","puntos":["(i) <b>Imponer<\/b> decisiones en la asamblea · (ii) <b>nombrar<\/b> o destituir a la mayoría de los consejeros · (iii) <b>votar<\/b> más del 50 % del capital · (iv) <b>dirigir<\/b> la administración, estrategia o políticas.","Además: la persona física que, directa o indirectamente, adquiera el <b>25 % o más<\/b> de la composición accionaria o del capital social.","El 25 % es igual en las 12 DCG.","ITF (art. 2 VI): sólo agrega el 25 % «adicional a lo establecido en la Ley»; las cuatro capacidades están en la LRITF."],"ir":"#t2-1-16","destacado":true},{"etiqueta":"4ª II c)","nombre":"Cascada al administrador","sub":"Si nadie llega al 25 %","verbo":"Desciendo","desc":"Si ninguna persona física tiene el 25 % o más ni controla por otros medios, se considera que ejerce el Control el administrador; si éste es persona moral, la persona física que nombró.","panel":"2.1.16 · Cascada al administrador","puntos":["Identificar a los PR de las personas morales que ejerzan el Control (4ª II c).","Si nadie tiene <b>igual o superior al 25 %<\/b> del capital o de los derechos de voto ni ejerce el Control por otros medios → el <b>administrador o administradores<\/b>.","Si el administrador es <b>persona moral o fideicomiso<\/b> → la persona física nombrada como administrador por ella.","<b>Declaración por escrito<\/b> del representante legal sobre quiénes son los PR; con indicios de falsedad, «<b>deberán<\/b> tomar medidas razonables».","La cascada está en las <b>DCG<\/b>, no en los Lineamientos."],"ir":"#t2-1-16","destacado":true},{"etiqueta":"4ª VI","nombre":"Datos y documentos del PR","sub":"Mismo expediente que un cliente","verbo":"Integro","desc":"Del PR se recaban los mismos datos y documentos que de un cliente persona física; con cliente de riesgo bajo no se pide su comprobante de domicilio; si es PEP, aplican la 26ª y 28ª.","panel":"2.1.16 · Datos y documentos del PR","puntos":["Mismos datos y documentos de la 4ª fr. I o III; para el domicilio basta el lugar donde pueda localizarse.","Cliente de <b>riesgo bajo<\/b>: no se recaba el <b>comprobante de domicilio<\/b> del PR.","Si el PR es <b>PEP<\/b>, al Cliente se le aplican la 26ª y la 28ª.","Exentas: personas morales que <b>cotizan en bolsa<\/b> y sus subsidiarias con participación mayoritaria al 50 %.","La fracción cambia por sujeto: casas de bolsa <b>4ª VII<\/b>; casas de cambio y centros <b>4ª III inciso E<\/b>; transmisores <b>4ª IV inciso E<\/b>; ITF <b>art. 11 VI<\/b>."],"ir":"#t2-1-16","destacado":false},{"etiqueta":"4ª I b) iv; 31ª–32ª","nombre":"Por cuenta de otro y fideicomisos","sub":"Rastrear al dueño","verbo":"Rastreo","desc":"Si el cliente declara o hay indicios de que actúa por cuenta de otro, se identifica al PR; en sociedades y asociaciones civiles de riesgo alto, sin importar el porcentaje.","panel":"2.1.16 · Por cuenta de otro y fideicomisos","puntos":["Declaración del cliente de que actúa por cuenta propia o de un tercero; si es de tercero, se aplica la fr. VI (4ª I b) iv).","Indicios de que actúa por cuenta de otro → pedir información para identificar al PR (31ª).","Bancos <b>presume<\/b> que los Sujetos Obligados que ordenan transferencias actúan por cuenta de sus clientes, salvo prueba en contrario.","Sociedades o asociaciones civiles de <b>riesgo alto<\/b>: quien tenga el Control «<b>independientemente del porcentaje<\/b>» (32ª II).","Fideicomisos con entidad no fiduciaria: <b>puede<\/b> cumplir con una constancia firmada por el delegado fiduciario y el OC de la fiduciaria (4ª IX); ITF no prevé esa opción."],"ir":"#t2-1-16","destacado":false},{"etiqueta":"Lineamientos 2019","nombre":"Lineamientos de la SHCP","sub":"Posee · Dirige · Disfruta","verbo":"Me oriento","desc":"Criterios que las Entidades podrán considerar: tres vías para identificar al PR (propiedad, cargo, otro medio) y medidas razonables para obtener y verificar la información.","panel":"2.1.16 · Lineamientos de la SHCP","puntos":["Los emite la SHCP (UBVA) con base en el último párrafo de la fracción de PR de cada DCG; las Entidades «<b>podrán<\/b>» considerarlos (L1).","L3 I <b>Posee<\/b>: propiedad de valores (25 % o más; fracciones menores que juntas suman más del 25 %).","L3 II <b>Dirige<\/b>: cargo de alto mando (decisiones estratégicas o asuntos diarios).","L3 III <b>Disfruta<\/b>: control sin propiedad visible (finanzas, vínculo familiar o personal, algún derecho de propiedad).","L4 III: cuestionarios, actas de asamblea, certificación del capital con el libro de accionistas, informe de poderes, RPC, RNV, RNIE y fuentes independientes."],"ir":"#t2-1-16","destacado":true},{"etiqueta":"Transitorios","nombre":"Beneficiario final","sub":"«Podrán equiparar»","verbo":"Equiparo","desc":"Un transitorio permite equiparar al propietario real las referencias a «beneficiario final» de otros ordenamientos y bases de datos de las autoridades. Es facultad, no obligación.","panel":"2.1.16 · Beneficiario final","puntos":["Bancos: transitoria <b>Quinta<\/b> (DOF 28-ago-2024): las Entidades «<b>podrán<\/b> equiparar».","Lo traen nueve DCG más, con número distinto (SOFOM Sexta; SOCAP y centros Quinta; las demás Séptima).","<b>ITF no lo prevé<\/b>; en casas de cambio no aparece en el texto de estudio (pendiente de cotejar)."],"ir":"#t2-1-16","destacado":false}]},{"letra":"2.1.17","titulo":"Plazos de cumplimiento regulatorio","pregunta":"¿Cuándo vence?","ritmo":"¿Cuándo?","corto":"2.1.17","color":"negro","items":[{"etiqueta":"34ª–35ª","nombre":"Reportes periódicos","sub":"Trimestral y mensual","verbo":"Reporto","desc":"Relevantes, dólares en efectivo y cheques de caja: trimestral, en los primeros 10 días hábiles; transferencias internacionales: mensual, en 15 días hábiles.","panel":"2.1.17 · Reportes periódicos","puntos":["Relevantes: trimestral, <b>primeros 10 días hábiles<\/b> de enero, abril, julio y octubre (34ª).","SOFOM, centros cambiarios y transmisores: <b>últimos 10<\/b> días hábiles.","Transferencias internacionales: mensual, <b>15 días hábiles<\/b> desde el último día hábil del mes (35ª).","Detalle en 2.1.3 (H2)."],"ir":"#t2-1-17","destacado":false},{"etiqueta":"37ª; 42ª","nombre":"Inusuales e internas preocupantes","sub":"60 + 3","verbo":"Dictamino","desc":"OI: dictamen en no más de 60 días naturales desde la alerta y reporte en 3 días hábiles desde la sesión del Comité; sólo Bancos puede sumar 30 días.","panel":"2.1.17 · Inusuales e internas preocupantes","puntos":["Dictamen: <b>≤ 60 días naturales<\/b> desde que se genera la alerta (37ª).","Sólo Bancos: <b>+30 días<\/b> si el Manual lo prevé.","Reporte: <b>3 días hábiles<\/b> desde que concluye la sesión del Comité.","ITF cuenta los 60 días <b>desde que detecta<\/b>. Asesores: los 60 días corren desde la alerta, pero los 3 días hábiles corren desde que su Representante la dictamina (no tienen Comité).","Detalle en 2.1.3 (H2)."],"ir":"#t2-1-17","destacado":true},{"etiqueta":"41ª; 72ª","nombre":"Los de 24 horas","sub":"Tres que no son iguales","verbo":"Alerto","desc":"Tres reportes en 24 horas: el de la 41ª (se reporta la acepte o no), el de operaciones previas a la LPB y el de un cliente que ya está en la LPB.","panel":"2.1.17 · Los de 24 horas","puntos":["41ª 1er párr.: sospecha al pretenderse una operación; <b>se reporta la acepte o no<\/b> (2.1.3).","41ª 2º párr.: operaciones anteriores a la notificación de la LPB, intentos o terceros.","72ª: el cliente ya está en la LPB → suspender y OI en 24 h (2.1.8).","Detalle en H2 y H3."],"ir":"#t2-1-17","destacado":false},{"etiqueta":"46ª; 48ª","nombre":"Comité y oficial de cumplimiento","sub":"15 · 2 · 10 · 10","verbo":"Designo","desc":"Integración y cambios del Comité en 15 días hábiles; designación del OC en 2 días hábiles en Bancos y casas de cambio, 10 en casi todos los demás.","panel":"2.1.17 · Comité y oficial de cumplimiento","puntos":["Comité: <b>15 días hábiles<\/b> (46ª).","OC en Bancos: designación <b>2<\/b>, revocación <b>10<\/b>, interino <b>10<\/b> días hábiles (48ª).","Casi todos los demás: <b>10 / 10 / 10<\/b>; casas de cambio: 2 y el día hábil siguiente; asesores (Representante): 15.","Detalle en 2.1.9–2.1.10 (H4)."],"ir":"#t2-1-17","destacado":false},{"etiqueta":"64ª; 21ª-4; 25ª Bis","nombre":"Manual, metodología y riesgo del cliente","sub":"20 días · 12 meses · 6 meses","verbo":"Actualizo","desc":"Cambios al Manual en 20 días hábiles desde su aprobación; metodología revisada en 12 meses; grado de riesgo del cliente evaluado al menos cada 6 meses en Bancos.","panel":"2.1.17 · Manual, metodología y riesgo del cliente","puntos":["Manual: <b>20 días hábiles<\/b> desde la aprobación (asesores: desde que el Representante las elabora).","Metodología: datos de ≥ 12 meses, revisión a más tardar en <b>12 meses<\/b>, conservación <b>5 años<\/b>.","Grado de riesgo y perfil: Bancos e ITF <b>cada 6 meses<\/b>; asesores <b>1 por año<\/b>; casas de cambio, centros y transmisores <b>sin periodicidad<\/b>.","Expedientes de riesgo alto: al menos <b>una vez al año<\/b>."],"ir":"#t2-1-17","destacado":false},{"etiqueta":"59ª; 60ª; 49ª","nombre":"Conservación, auditoría y capacitación","sub":"10 años · 60 días · 1 al año","verbo":"Guardo","desc":"Conservar 10 años (asesores 5); informe de auditoría en 60 días naturales tras el cierre; capacitación al menos una vez al año.","panel":"2.1.17 · Conservación, auditoría y capacitación","puntos":["Conservación: <b>10 años<\/b> (asesores: <b>5<\/b>) (59ª).","Informe de auditoría: <b>60 días naturales<\/b> desde el cierre; asesores no tienen auditoría anual (60ª).","Capacitación: <b>al menos una vez al año<\/b> (49ª).","Detalle en 2.1.6 (H3)."],"ir":"#t2-1-17","destacado":false},{"etiqueta":"Transitorios","nombre":"Plazos de adecuación","sub":"18·12·18·12 vs. 4·9·18","verbo":"Me adecuo","desc":"Bancos 2024: 18, 12, 18 y 12 meses para Manual, metodología, sistemas y certificación del OC. Las reformas de 2021 y 2023: 4, 9 y 18 meses. ITF (Octava transitoria de la LRITF): desde la autorización.","panel":"2.1.17 · Plazos de adecuación","puntos":["Bancos (DOF 28-ago-2024), Tercera: Manual <b>18<\/b> · metodología <b>12<\/b> · sistemas <b>18<\/b> · certificación del OC <b>12<\/b> meses.","SOFOM, casas de bolsa, fondos, SOCAP y SOFIPO (2021) y asesores, uniones y transmisores (2023): <b>4 · 9 · 18 meses<\/b>.","Centros cambiarios (DOF 19-ene-2023): plazo en meses sólo para el Manual, <b>4 meses<\/b>; la 48ª Bis, cuando lo fije la CNBV.","ITF (DOF 10-sep-2018), sólo personas de la Octava transitoria de la LRITF: <b>180 días naturales<\/b> metodología y sistemas, <b>360<\/b> para regularizar expedientes, desde la autorización.","Sólo casas de bolsa y fondos: <b>6 meses<\/b> para la geolocalización por IP (2021)."],"ir":"#t2-1-17","destacado":false}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por subtema","html":"<b>2.1.15 ¿Qué me cuesta?<\/b> Remito, Multo, Escucho, Gradúo, Publico, Cancelo · <b>2.1.16 ¿Quién está detrás?<\/b> Defino, Mido, Desciendo, Integro, Rastreo, Me oriento, Equiparo · <b>2.1.17 ¿Cuándo vence?<\/b> Reporto, Dictamino, Alerto, Designo, Actualizo, Guardo, Me adecuo."}},{"tipo":"tarjetas","id":"t2-1-15","nav":"2.1.15 Sanciones","titulo":"2.1.15 · Sanciones","intro":"Primero la pregunta «¿qué ley?», luego «¿cuánto?». Las dos multas en porcentaje son <b>iguales en las tres leyes<\/b> de la bibliografía; lo que cambia son las bandas fijas y su unidad.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Bancos · LIC 115","subtitulo":"Eje · días de salario mínimo general vigente en el D.F.","filas":[{"k":"LPB","v":"<b>10 % a 100 %<\/b> del monto del acto, operación o servicio con alguien que se informó que está en la lista"},{"k":"OI no reportada","v":"<b>10 % a 100 %<\/b> de su monto o de la serie relacionada del mismo cliente"},{"k":"Reportes no enviados","v":"Relevantes, internas preocupantes, transferencias internacionales, efectivo en moneda extranjera e incisos a, b, c y e: <b>30,000 a 100,000<\/b> días de salario"},{"k":"Lo demás","v":"<b>5,000 a 50,000<\/b> días de salario"},{"k":"Quién y cómo","v":"CNBV · arts. 107 Bis y 109 Bis 5"}]},{"encabezado":true,"color":"coral","titulo":"LGOAAC 95 y 95 Bis","subtitulo":"Casas de cambio (95) · SOFOM no reguladas, centros y transmisores (95 Bis)","filas":[{"k":"LPB y OI","v":"<b>10 % a 100 %<\/b>, igual que la LIC"},{"k":"Reportes no enviados","v":"<b>10,000 a 100,000<\/b> días de salario · 95: incisos a, b, c y e · 95 Bis: añade el <b>f<\/b>"},{"k":"Lo demás","v":"<b>2,000 a 30,000<\/b> días de salario"},{"k":"A quién","v":"La entidad, sus consejeros, administradores, directivos, empleados y apoderados y quien haya intervenido; el 95 Bis menciona también a los <b>factores<\/b>"},{"k":"Sólo 95 Bis","v":"La CNBV puede ordenar a bancos, casas de bolsa y casas de cambio que <b>suspendan o cancelen contratos<\/b> con centros y transmisores"}]},{"encabezado":true,"color":"amarillo","titulo":"ITF · LRITF 105","subtitulo":"Única ley en UMA","filas":[{"k":"LPB y OI","v":"<b>10 % a 100 %<\/b>"},{"k":"Lo demás","v":"Una sola banda: <b>10 a 100,000 UMA<\/b> («diez a cien mil veces»)"},{"k":"Graves","v":"No presentar el documento del art. 58 I, no reportar, no tener sistemas, Comité u OC, operar con alguien de la LPB"},{"k":"Además","v":"Revocación (art. 69) y remoción o inhabilitación de 3 meses a 5 años (art. 62)"}]},{"encabezado":true,"color":"negro","titulo":"Procedimiento común","subtitulo":"LIC 107 Bis y 109 Bis · LRITF 97–108","filas":[{"k":"Audiencia","v":"<b>10 días hábiles<\/b>, ampliable una sola vez"},{"k":"Pruebas · alegatos · resolución","v":"<b>60 · 5 · 180<\/b> días hábiles"},{"k":"Reincidencia","v":"Misma infracción en <b>2 años<\/b> desde que quedó firme → hasta el <b>doble<\/b>"},{"k":"Pago","v":"<b>15 días hábiles<\/b>; <b>20 %<\/b> menos (LIC: sin medio de defensa · LRITF: conformidad por escrito)"},{"k":"Caducidad · publicación","v":"<b>5 años<\/b> · portal de Internet, no reservada"}]},{"encabezado":true,"color":"morado","titulo":"Fuera de la bibliografía","subtitulo":"Se mencionan, sin reactivos","filas":[{"k":"Casas de bolsa y asesores","v":"LMV"},{"k":"Fondos","v":"Ley de Fondos de Inversión"},{"k":"SOCAP · SOFIPO · uniones","v":"LRASCAP · LACP · LUC"},{"k":"SOFOM regulada","v":"El 87-D LGOAAC remite la PLD a la ley de la entidad con la que tiene vínculo patrimonial; sus multas no están en los artículos acotados"}]}],"nota":"Cita literal de la LIC 115: los incisos a, b, c y e son del «quinto párrafo» (así lo dice la ley). La conversión de días de salario a UMA no está en las fuentes cargadas: no se pregunta. Los arts. 88 Bis, 89, 94 y 81-D LGOAAC están fuera de la acotación del temario."},{"tipo":"tarjetas","id":"t2-1-16","nav":"2.1.16 Propietario real","titulo":"2.1.16 · Propietario real","intro":"La obligación vive en las <b>DCG<\/b>; los <b>Lineamientos 2019<\/b> orientan. Aprende las tres vías de los Lineamientos con <b>Posee · Dirige · Disfruta<\/b>, y la cascada de las DCG con «si nadie llega al 25 %, el administrador».","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Lo que obliga: las DCG","subtitulo":"Bancos 2ª VII y XXXII · 4ª II c) · 4ª VI","filas":[{"k":"Quién es","v":"Persona física que es el <b>verdadero dueño<\/b> o ejerce el <b>Control<\/b>"},{"k":"Umbral","v":"<b>25 % o más<\/b> del capital (Control); cascada si nadie tiene <b>igual o superior al 25 %<\/b>"},{"k":"Cascada","v":"Nadie llega → el <b>administrador<\/b>; administrador PM o fideicomiso → la persona física que nombró"},{"k":"Prueba","v":"<b>Declaración escrita<\/b> del representante legal; indicios → «deberán» tomar medidas razonables"},{"k":"Expediente","v":"Mismos datos que un cliente; riesgo bajo sin comprobante de domicilio; PEP → 26ª y 28ª; cotizadas exentas"}]},{"encabezado":true,"color":"oscuro","titulo":"Lo que orienta: los Lineamientos","subtitulo":"SHCP-UBVA · 2019 · «podrán considerar»","filas":[{"k":"L1","v":"Enunciativos mas no limitativos; adoptarlos <b>no basta por sí solo<\/b> para cumplir"},{"k":"L3 I · Posee","v":"25 % o más; fracciones menores que juntas suman <b>más del 25 %<\/b>; muchos accionistas → quien tenga el Control"},{"k":"L3 II · Dirige","v":"Cargo: decisiones estratégicas o asuntos diarios; en este último, L3 II b) «deberá contar con un cargo de alto mando»"},{"k":"L3 III · Disfruta","v":"Control sin propiedad visible: finanzas, vínculo familiar o personal con los altos mandos, algún derecho de propiedad"},{"k":"Orden","v":"<b>Lista de prelación<\/b> o de manera indistinta"},{"k":"L4 III","v":"Cuestionarios · actas de asamblea · certificación del capital y libro de accionistas · informe de poderes · RPC, RNV, RNIE · valoración"}]},{"encabezado":true,"color":"negro","titulo":"Tres figuras que no son la misma","subtitulo":"Bancos 2ª III, XXXII y XXXIII","filas":[{"k":"Propietario real","v":"Obtiene los beneficios y es el verdadero dueño"},{"k":"Proveedor de Recursos","v":"Sin ser titular, aporta recursos <b>de manera regular<\/b> sin obtener los beneficios"},{"k":"Beneficiario","v":"Designado por el titular para el caso de su <b>fallecimiento<\/b>"}]},{"encabezado":true,"color":"principal","titulo":"Dónde está el PR en cada DCG","subtitulo":"Mismo contenido, otra fracción","filas":[{"k":"4ª VI","v":"Bancos, SOFOM, asesores, fondos, SOCAP, SOFIPO, uniones"},{"k":"4ª VII","v":"<b>Casas de bolsa<\/b>"},{"k":"4ª III inciso E","v":"<b>Casas de cambio y centros cambiarios<\/b> (sólo operaciones de 5,000 USD o más)"},{"k":"4ª IV inciso E","v":"<b>Transmisores<\/b> (5,000 USD o más; los Lineamientos lo citan como fr. III)"},{"k":"Art. 11 VI","v":"<b>ITF<\/b>"}]}],"nota":"Los Lineamientos no tienen numeral sobre fideicomisos: el fideicomiso está en la definición de las DCG y en su regla de fideicomisos. El texto de los Lineamientos no trae fecha de expedición; el archivo oficial es de marzo de 2019."},{"tipo":"tarjetas","id":"t2-1-16-sujetos","nav":"2.1.16 por sujeto","titulo":"2.1.16 · Igual que Bancos, salvo…","intro":"Definición y 25 % son iguales en los 12. Las diferencias están en dónde vive la regla, a partir de cuánto se aplica y en algunos procedimientos.","tarjetas":[{"barra":true,"color":"principal","titulo":"SOFOM","ref":"Crédito · 2ª VI y XXIX; 4ª VI; 25ª–26ª","lista":["Sin la <b>presunción<\/b> de que quien ordena transferencias actúa por cuenta de sus clientes","Beneficiario final: transitoria <b>Sexta<\/b>"]},{"barra":true,"color":"morado","titulo":"Casas de bolsa","ref":"Bursátil · 4ª VII; 29ª–30ª","lista":["El PR está en la <b>4ª VII<\/b>, no en la VI","Al abrir la cuenta <b>o durante la relación<\/b>","PR PEP de cliente de riesgo alto: remite <b>expresamente<\/b> a la aprobación del directivo (24ª); Bancos llega a lo mismo por la 26ª","Presunción respecto de «entidades financieras» que ordenan transferencias"]},{"barra":true,"color":"morado","titulo":"Asesores en inversiones","ref":"Bursátil · 4ª VI; 17ª–18ª","lista":["Sin presunción en transferencias"]},{"barra":true,"color":"morado","titulo":"Fondos de inversión","ref":"Bursátil · 4ª VI; 27ª–28ª","lista":["Como casas de bolsa: apertura o durante la relación; remite expresamente a la aprobación del PR PEP (22ª)","Sin presunción","La 28ª II omite «independientemente del porcentaje»"]},{"barra":true,"color":"turquesa","titulo":"SOCAP y SOFIPO","ref":"Ahorro popular · 4ª VI","lista":["Con presunción, como Bancos","La regla de riesgo alto omite «independientemente del porcentaje» (SOCAP 33ª II; SOFIPO 34ª II)"]},{"barra":true,"color":"turquesa","titulo":"Uniones de crédito","ref":"Ahorro popular · 4ª VI; 23ª–24ª","lista":["Sin presunción","Persona física «nombrada por el administrador» (también centros e ITF)"]},{"barra":true,"color":"coral","titulo":"Casas de cambio y centros cambiarios","ref":"Cambios y envíos · 4ª III E","lista":["Sólo en operaciones de <b>5,000 USD o más<\/b>; hablan de «Usuario»","Presunción: casas de cambio sí; centros no"]},{"barra":true,"color":"coral","titulo":"Transmisores de dinero","ref":"Cambios y envíos · 4ª IV E","lista":["Sólo en operaciones de <b>5,000 USD o más<\/b>","Sin presunción","Domicilio particular o, si no hay, donde pueda localizarse"]},{"barra":true,"color":"amarillo","titulo":"ITF","ref":"Fintech · arts. 2 VI y XXVI; 11 VI","lista":["Control: sólo el 25 %, «adicional a lo establecido en la Ley»","Cascada «25 % o más», sin derechos de voto; ante dudas, «acciones», no «medidas razonables»","Sin la dispensa de riesgo bajo","PR fideicomiso: identificar a fideicomitentes o fideicomisarios; sin la opción de la constancia del delegado fiduciario","Sin transitorio de beneficiario final"]}],"nota":"Pendientes sin reactivo: la fracción del PR en transmisores (4ª IV E en el texto de estudio frente a «fr. III inciso E» en los Lineamientos) y el transitorio de beneficiario final en casas de cambio, por cotejar contra el DOF."},{"tipo":"tarjetas","id":"t2-1-17","nav":"2.1.17 Plazos","titulo":"2.1.17 · Plazos de cumplimiento regulatorio","intro":"Línea de tiempo resumen: cada plazo con su unidad, desde cuándo corre y la herramienta donde se estudia a fondo. Aquí se practica <b>comparar entre sujetos<\/b>.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Reportar","subtitulo":"Bancos 34ª–37ª, 41ª–42ª · H2","filas":[{"k":"Relevantes","v":"Trimestral · <b>primeros 10 días hábiles<\/b> (SOFOM, centros y transmisores: <b>últimos 10<\/b>)"},{"k":"Transferencias internacionales","v":"Mensual · <b>15 días hábiles<\/b>"},{"k":"OI","v":"Dictamen ≤ <b>60 días naturales<\/b> desde la alerta (+30 sólo Bancos) · reporte en <b>3 días hábiles<\/b> desde la sesión"},{"k":"OIP","v":"≤ 60 días naturales desde que detecta + 3 días hábiles"},{"k":"24 horas","v":"41ª (la acepte o no) · 41ª 2º párr. · 72ª LPB"}]},{"encabezado":true,"color":"oscuro","titulo":"Avisar y designar","subtitulo":"Bancos 46ª, 48ª, 64ª · H3 y H4","filas":[{"k":"Comité","v":"<b>15 días hábiles<\/b>"},{"k":"OC","v":"Bancos <b>2<\/b> · casi todos <b>10<\/b> días hábiles"},{"k":"Manual","v":"<b>20 días hábiles<\/b> desde la aprobación (asesores: desde que el Representante las elabora)"},{"k":"Quién ejerce el Control","v":"<b>10 días hábiles<\/b> en SOFOM, SOCAP, SOFIPO, casas de cambio y transmisores; centros cambiarios: 20 tras el registro o 10 tras el cambio; Bancos no lo prevé"}]},{"encabezado":true,"color":"negro","titulo":"Revisar y conservar","subtitulo":"Bancos 21ª-4, 25ª Bis, 49ª, 59ª, 60ª · H1 y H3","filas":[{"k":"Riesgo del cliente","v":"Bancos e ITF cada <b>6 meses<\/b> · SOFOM, CB, FON, SOCAP, SOFIPO, UC <b>2 por año<\/b> · asesores <b>1 por año<\/b> · CC, centros y TD sin periodicidad"},{"k":"Metodología","v":"Revisión en <b>12 meses<\/b> · conservar <b>5 años<\/b>"},{"k":"Auditoría","v":"Informe en <b>60 días naturales<\/b> tras el cierre"},{"k":"Conservación","v":"<b>10 años<\/b> (asesores <b>5<\/b>)"}]},{"encabezado":true,"color":"coral","titulo":"Adecuarse a la última reforma","subtitulo":"Transitorios de cada DCG","filas":[{"k":"Bancos 2024","v":"Manual <b>18<\/b> · metodología <b>12<\/b> · sistemas <b>18<\/b> · certificación del OC <b>12<\/b> meses"},{"k":"2021 y 2023","v":"<b>4 · 9 · 18 meses<\/b> (SOFOM, CB, FON, SOCAP, SOFIPO, asesores, uniones, transmisores)"},{"k":"Centros 2023","v":"Plazo en meses sólo para el Manual: <b>4 meses<\/b> (48ª Bis, cuando lo fije la CNBV)"},{"k":"ITF 2018","v":"Sólo personas de la Octava transitoria de la LRITF: <b>180<\/b> y <b>360 días naturales<\/b> desde la autorización"},{"k":"Exclusivos","v":"Geolocalización por IP en <b>6 meses<\/b>: sólo casas de bolsa y fondos · SOCAP 2021: sin los 12 meses del Anexo 2"}]}],"nota":"Casas de cambio: su texto de estudio no trae los transitorios de 2019, por lo que sus plazos de adecuación no se preguntan. La fecha de publicación de la reforma 2021 de SOFIPO no consta en el texto."},{"tipo":"cifras","id":"cifras","nav":"Cifras","titulo":"Cifras y plazos que preguntan","intro":"Cada número con su unidad y su fundamento.","cifras":[["10–100","%","Del monto, por operar con alguien de la LPB o por la OI no reportada (las tres leyes)","LIC 115; LGOAAC 95 y 95 Bis; LRITF 105"],["30,000–100,000","días de salario","Bancos: relevantes, OIP, transferencias y efectivo en moneda extranjera no reportados","LIC 115"],["5,000–50,000","días de salario","Bancos: demás incumplimientos","LIC 115"],["10,000–100,000","días de salario","LGOAAC: reportes no enviados (95 y 95 Bis)","LGOAAC 95 y 95 Bis"],["10–100,000","UMA","ITF: cualquier otro incumplimiento, una sola banda","LRITF 105"],["2","años","Reincidencia desde que quedó firme la resolución; multa hasta el doble","LIC 107 Bis III b"],["5","años","Caducidad de la facultad de sancionar","LIC 109 Bis 1; LRITF 106"],["20","%","Reducción si se paga en 15 días hábiles (LIC: sin medio de defensa)","LIC 109 Bis 1; LRITF 97"],["25","% o más","Control por participación en el capital","Bancos 2ª VII"],["50","%","Más del 50 % del voto (Control) · subsidiarias de cotizadas exentas","Bancos 2ª VII; 4ª VI"],["5,000","USD","Desde ahí piden PR casas de cambio, centros y transmisores","CC y centros 4ª III E; TD 4ª IV E"],["18 · 12 · 18 · 12","meses","Adecuación de Bancos 2024: Manual, metodología, sistemas, certificación del OC","Bancos, transitoria Tercera (DOF 28-ago-2024)"]]},{"tipo":"simulador","id":"examen","nav":"Practicar ▸"}],"temas":{"2.1.15":"2.1.15 Sanciones","2.1.16":"2.1.16 Propietario real","2.1.17":"2.1.17 Plazos de cumplimiento regulatorio"},"modos":[{"k":"s","l":"2.1.15 Sanciones","tema":"2.1.15"},{"k":"p","l":"2.1.16 Propietario real","tema":"2.1.16"},{"k":"z","l":"2.1.17 Plazos","tema":"2.1.17"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Cifras y trampas","tipos":["cifra","trampa"]}],"banco":[{"id":"F001","tema":"2.1.15","tipo":"caso","q":"La CNBV detecta que un banco celebró una operación con un cliente que, según se le había informado, ya estaba en la Lista de Personas Bloqueadas. ¿Qué multa prevé la LIC?","a":"Del 10 % al 100 % del monto del acto, operación o servicio realizado","o":["De 30,000 a 100,000 días de salario, por ser conducta de la banda alta","De 5,000 a 50,000 días de salario, por tratarse de un incumplimiento genérico","Del 10 % al 100 % del monto del acto, operación o servicio realizado","De 10 a 100,000 veces el valor diario de la UMA, en una sola banda"],"x":"Operar con alguien que se informó que está en la LPB se multa en porcentaje del monto: 10 % a 100 %. La banda de 30,000 a 100,000 días de salario es para reportes no enviados e incisos a, b, c y e; las UMA son de la LRITF, no de la LIC.","ref":"LIC art. 115 (párrafo de sanciones)"},{"id":"F002","tema":"2.1.15","tipo":"caso","q":"La CNBV detecta que una ITF celebró una operación con un Cliente que, según se le había informado, ya estaba en la Lista de Personas Bloqueadas. ¿Qué multa prevé la LRITF?","a":"Del 10 % al 100 % del monto del acto, operación o servicio realizado","o":["Del 10 % al 100 % del monto del acto, operación o servicio realizado","De 10 a 100,000 veces el valor diario de la UMA, como cualquier otro incumplimiento","De 30,000 a 100,000 días de salario, igual que la banda alta de la LIC","De 10,000 a 100,000 días de salario, igual que la banda alta de la LGOAAC"],"x":"La LRITF conserva la multa en porcentaje para la LPB: 10 % a 100 % del monto, igual que la LIC y la LGOAAC. La banda de 10 a 100,000 UMA es la residual («cualquier otro incumplimiento»), no la de la LPB.","ref":"LRITF art. 105","par":"F001"},{"id":"F003","tema":"2.1.15","tipo":"caso","q":"Un banco no presentó a la CNBV los reportes de operaciones relevantes de un trimestre. ¿Qué rango de multa prevé la LIC para esta conducta?","a":"De 30,000 a 100,000 días de salario","o":["De 10,000 a 100,000 días de salario","De 5,000 a 50,000 días de salario","Del 10 % al 100 % del monto no reportado","De 30,000 a 100,000 días de salario"],"x":"Los relevantes no reportados están en la banda alta de la LIC: 30,000 a 100,000 días de salario. 10,000 a 100,000 es la banda alta de la LGOAAC (casas de cambio y 95 Bis); el 10 %–100 % es sólo para LPB y OI no reportada.","ref":"LIC art. 115 (párrafo de sanciones)"},{"id":"F004","tema":"2.1.15","tipo":"caso","q":"Una casa de cambio no presentó a la CNBV los reportes de operaciones relevantes de un trimestre. ¿Qué rango de multa prevé su ley?","a":"De 10,000 a 100,000 días de salario","o":["De 30,000 a 100,000 días de salario","De 10,000 a 100,000 días de salario","De 2,000 a 30,000 días de salario","De 10 a 100,000 veces el valor de la UMA"],"x":"La casa de cambio se sanciona por el art. 95 LGOAAC: relevantes no reportados, 10,000 a 100,000 días de salario. La banda de 30,000 a 100,000 es la de Bancos (LIC 115); 2,000 a 30,000 es la de los demás casos de la LGOAAC.","ref":"LGOAAC art. 95","par":"F003"},{"id":"F005","tema":"2.1.15","tipo":"caso","q":"Una ITF no presentó a la CNBV los reportes de operaciones relevantes de un trimestre. ¿Qué rango de multa prevé la LRITF para esta conducta?","a":"De 10 a 100,000 veces el valor de la UMA","o":["De 30,000 a 100,000 veces el valor de la UMA","De 10 a 100,000 veces el valor de la UMA","De 10,000 a 100,000 días de salario mínimo","De 5,000 a 50,000 días de salario mínimo"],"x":"La LRITF no tiene banda propia para relevantes: cae en «cualquier otro incumplimiento», una sola banda de diez a cien mil veces el valor de la UMA. Las bandas en días de salario son de la LIC y la LGOAAC.","ref":"LRITF art. 105","par":"F003"},{"id":"F006","tema":"2.1.15","tipo":"cifra","q":"En la LIC, fuera de la LPB, la OI no reportada y las conductas de la banda alta, ¿qué rango aplica a los demás incumplimientos de las disposiciones de PLD/FT?","a":"De 5,000 a 50,000 días de salario","o":["De 2,000 a 30,000 días de salario","De 30,000 a 100,000 días de salario","De 10 a 100,000 veces el valor de la UMA","De 5,000 a 50,000 días de salario"],"x":"La banda residual de la LIC es de 5,000 a 50,000 días de salario. La de 2,000 a 30,000 es la residual de la LGOAAC 95 y 95 Bis, y la de UMA es la de la LRITF.","ref":"LIC art. 115 (párrafo de sanciones)"},{"id":"F007","tema":"2.1.15","tipo":"cifra","q":"En los arts. 95 y 95 Bis de la LGOAAC, ¿qué rango aplica a los demás incumplimientos, distintos de la LPB, la OI no reportada y la banda alta?","a":"De 2,000 a 30,000 días de salario","o":["De 2,000 a 30,000 días de salario","De 5,000 a 50,000 días de salario","De 10,000 a 100,000 días de salario","De 10 a 100,000 veces el valor de la UMA"],"x":"En la LGOAAC la banda residual es de 2,000 a 30,000 días de salario, igual en el 95 y el 95 Bis. La de 5,000 a 50,000 es la residual de la LIC (Bancos).","ref":"LGOAAC arts. 95 y 95 Bis","par":"F006"},{"id":"F008","tema":"2.1.15","tipo":"trampa","q":"Las multas fijas que el art. 115 de la LIC prevé para Bancos por incumplir sus DCG de PLD/FT, ¿en qué unidad están expresadas?","a":"En días de salario mínimo general vigente en el Distrito Federal","o":["En veces el valor diario de la Unidad de Medida y Actualización","En porcentaje del capital neto de la institución de crédito sancionada","En días de salario mínimo general vigente en el Distrito Federal","En pesos fijos que la CNBV actualiza cada año con el índice inflacionario"],"x":"La LIC multa en días de salario mínimo general diario vigente en el Distrito Federal el día de la conducta (109 Bis 1). La trampa es suponer que todas las multas PLD están en UMA: sólo la LRITF usa UMA.","ref":"LIC arts. 115 y 109 Bis 1"},{"id":"F009","tema":"2.1.15","tipo":"trampa","q":"De las tres leyes de la bibliografía que sancionan el incumplimiento de las DCG de PLD/FT, ¿cuál expresa sus multas fijas en UMA?","a":"La Ley para Regular las Instituciones de Tecnología Financiera","o":["La Ley de Instituciones de Crédito, desde su reforma de 2025","La Ley General de Organizaciones y Actividades Auxiliares del Crédito","La LIC y la LGOAAC, pero sólo en la banda de los demás incumplimientos","La Ley para Regular las Instituciones de Tecnología Financiera"],"x":"Sólo la LRITF (art. 105) habla de «veces el valor de la UMA». La LIC y la LGOAAC siguen en días de salario mínimo en todas sus bandas.","ref":"LRITF art. 105; LIC art. 109 Bis 1; LGOAAC art. 95"},{"id":"F010","tema":"2.1.15","tipo":"memoria","q":"¿Qué artículo establece las multas por incumplir las DCG de PLD/FT aplicables a las casas de cambio?","a":"El art. 95 de la LGOAAC","o":["El art. 95 Bis de la LGOAAC","El art. 95 de la LGOAAC","El art. 115 de la LIC","El art. 105 de la LRITF"],"x":"El art. 95 LGOAAC alcanza a las organizaciones auxiliares del crédito y a las casas de cambio. El 95 Bis es para SOFOM no reguladas, centros cambiarios y transmisores; la LIC 115, para Bancos.","ref":"LGOAAC art. 95"},{"id":"F011","tema":"2.1.15","tipo":"caso","q":"Un centro cambiario incumple sus DCG de PLD/FT. ¿Qué artículo prevé su multa?","a":"El art. 95 Bis de la LGOAAC","o":["El art. 95 de la LGOAAC","El art. 115 de la LIC","El art. 95 Bis de la LGOAAC","El art. 105 de la LRITF"],"x":"Centros cambiarios, transmisores y SOFOM no reguladas se sancionan por el art. 95 Bis LGOAAC. El art. 95 es el de las casas de cambio: mismo bloque de cambios y envíos, distinto artículo.","ref":"LGOAAC art. 95 Bis","par":"F010"},{"id":"F012","tema":"2.1.15","tipo":"caso","q":"Una casa de bolsa incumple sus DCG de PLD/FT. Con la bibliografía del temario, ¿qué puede afirmarse sobre la ley que la sanciona?","a":"Sus DCG remiten a su propia ley (LMV), que no forma parte de la bibliografía","o":["Sus DCG remiten a su propia ley (LMV), que no forma parte de la bibliografía","La sanciona el art. 115 de la LIC, con las mismas bandas que a Bancos","La sanciona el art. 95 Bis de la LGOAAC, igual que a los centros cambiarios","La sanciona el art. 105 de la LRITF, por ser una entidad del sector bursátil"],"x":"Las DCG de casas de bolsa remiten a «la Ley», que es la LMV; esa ley no está en la bibliografía, así que el examen sólo exige saber que la sanción está ahí. La LIC 115 es exclusiva de Bancos.","ref":"DCG casas de bolsa 2ª fr. XIX y 65ª–66ª"},{"id":"F013","tema":"2.1.15","tipo":"trampa","q":"La banda alta del art. 95 Bis de la LGOAAC incluye un inciso que la del art. 95 no menciona. ¿Cuál es?","a":"El inciso f","o":["El inciso f","El inciso d","El inciso e","El inciso b"],"x":"El 95 remite a los incisos a, b, c y e del sexto párrafo; el 95 Bis, a los incisos a, b, c, e y f del tercer párrafo. El inciso e está en ambos, por eso no es la diferencia.","ref":"LGOAAC arts. 95 y 95 Bis"},{"id":"F014","tema":"2.1.15","tipo":"memoria","q":"En la banda de 30,000 a 100,000 días de salario, el art. 115 de la LIC incluye el incumplimiento de ciertos incisos. ¿Cómo los cita la ley?","a":"Incisos a, b, c y e del quinto párrafo","o":["Incisos a, b, c y e del sexto párrafo","Incisos a, b, c, e y f del tercer párrafo","Incisos a, b, c y e del quinto párrafo","Incisos a, b, c y d del quinto párrafo"],"x":"La LIC 115 dice literalmente «incisos a., b., c. y e. del quinto párrafo» (conocimiento del cliente, documentación de apertura, resguardo de la información y sistemas automatizados). «Sexto párrafo» es la cita del art. 95 LGOAAC y «tercer párrafo» con el f, la del 95 Bis.","ref":"LIC art. 115 (párrafo de sanciones)"},{"id":"F015","tema":"2.1.15","tipo":"caso","q":"La CNBV emplaza a un banco a un procedimiento de sanción por incumplir sus DCG de PLD/FT. ¿Qué plazo tiene el banco para manifestar lo que a su derecho convenga?","a":"10 días hábiles, ampliables una sola vez por el mismo lapso a petición de parte","o":["15 días hábiles, ampliables por una sola vez hasta por 5 días hábiles adicionales","10 días hábiles, ampliables una sola vez por el mismo lapso a petición de parte","10 días naturales, ampliables cuantas veces lo autorice la Junta de Gobierno","5 días hábiles, sin ampliación posible aunque la entidad lo solicite por escrito"],"x":"La audiencia es de 10 días hábiles, ampliable por una sola ocasión hasta por el mismo lapso, a petición de parte. Los 15 días hábiles son del pago de la multa; los 5, de alegatos.","ref":"LIC art. 107 Bis, fr. I"},{"id":"F016","tema":"2.1.15","tipo":"cifra","q":"En el procedimiento de sanción de la LIC, ¿cuál es el plazo máximo para emitir y notificar la resolución?","a":"180 días hábiles","o":["60 días hábiles","90 días naturales","5 días hábiles","180 días hábiles"],"x":"La resolución se emite en no más de 180 días hábiles. Los 60 días hábiles son el máximo para desahogar pruebas y los 5 días hábiles, para alegatos. La LRITF (art. 98) repite 60 · 5 · 180.","ref":"LIC art. 107 Bis"},{"id":"F017","tema":"2.1.15","tipo":"caso","q":"Un banco comete la misma infracción de PLD/FT 18 meses después de que quedó firme la resolución que lo sancionó por ella. ¿Cómo lo trata la LIC?","a":"Hay reincidencia, y la multa puede llegar hasta el doble de la que corresponda","o":["No hay reincidencia, porque ésta sólo se configura dentro del año siguiente a la notificación","Hay reincidencia, y la multa se triplica sin sujetarse al máximo de la banda que corresponda","Hay reincidencia, y la multa puede llegar hasta el doble de la que corresponda","No hay reincidencia, porque el plazo de 2 años se cuenta desde la fecha de la primera conducta"],"x":"Reincide quien comete la misma infracción dentro de los 2 años siguientes a que quedó firme la resolución; 18 meses está dentro. La consecuencia es una multa de hasta el doble, no el triple. El plazo corre desde que la resolución quedó firme, no desde la conducta.","ref":"LIC art. 107 Bis, fr. III, inciso b)"},{"id":"F018","tema":"2.1.15","tipo":"caso","q":"Una ITF reincide en una infracción de PLD/FT dentro de los 2 años siguientes a que quedó firme la resolución previa. Además de la multa, ¿qué medida prevé la LRITF?","a":"Que la CNBV pueda revocar su autorización, con aprobación del Comité Interinstitucional","o":["Que la CNBV pueda revocar su autorización, con aprobación del Comité Interinstitucional","La cancelación de su registro por la CONDUSEF y su disolución y liquidación forzosa","La revocación de su autorización por la SHCP, sin intervención de la CNBV ni del Comité","La suspensión de su autorización por la UIF hasta que regularice todos sus reportes"],"x":"La LRITF 69 faculta («podrá») a la CNBV, después de escuchar a la ITF y con aprobación del Comité Interinstitucional, a revocar la autorización; la fr. VII exige que se reincida pese a las observaciones y acciones correctivas, y la VIII cubre las conductas graves. La disolución y liquidación es consecuencia de la cancelación de un centro cambiario (LGOAAC), no de una ITF.","ref":"LRITF art. 69, fr. VII; art. 98, fr. III, inciso b)","par":"F017"},{"id":"F019","tema":"2.1.15","tipo":"caso","q":"Un banco paga su multa de PLD/FT dentro de los 15 días hábiles siguientes a la notificación y no interpone medio de defensa. ¿Qué beneficio le da la LIC?","a":"Una reducción del 20 % del monto de la multa","o":["Una reducción de la tercera parte del monto de la multa","Una reducción del 50 % si además resarce el daño causado","La conversión de la multa en una amonestación pública","Una reducción del 20 % del monto de la multa"],"x":"La LIC prevé la reducción del 20 % si se paga en 15 días hábiles y no se interpuso medio de defensa. Resarcir el daño es atenuante, pero no da un 50 %. En la LRITF el requisito cambia: manifestar por escrito la conformidad.","ref":"LIC art. 109 Bis 1"},{"id":"F020","tema":"2.1.15","tipo":"caso","q":"Una ITF quiere obtener la reducción de su multa de PLD/FT pagándola dentro de los 15 días hábiles. Además del pago oportuno, ¿qué le exige la LRITF?","a":"Manifestar por escrito su conformidad con la resolución","o":["No haber interpuesto ningún medio de defensa en su contra","Manifestar por escrito su conformidad con la resolución","Haber resarcido el daño y aportado información a la CNBV","Obtener la aprobación previa del Comité Interinstitucional"],"x":"La LRITF condiciona la reducción del 20 % a que se manifieste por escrito la conformidad. «No interponer medio de defensa» es el requisito de la LIC (Bancos): mismo beneficio, otra condición.","ref":"LRITF art. 97","par":"F019"},{"id":"F021","tema":"2.1.15","tipo":"cifra","q":"¿En cuánto tiempo caduca la facultad de la CNBV para imponer sanciones conforme a la LIC y desde cuándo se cuenta?","a":"5 años, desde el día hábil siguiente a aquél en que se realizó la conducta","o":["2 años, desde el día hábil siguiente a aquél en que quedó firme la resolución","5 años, desde el día hábil siguiente a aquél en que se realizó la conducta","5 años, desde que la CNBV notifica el inicio del procedimiento de sanción","10 años, igual que el plazo de conservación de los expedientes del Cliente"],"x":"La caducidad es de 5 años desde el día hábil siguiente a la conducta (igual en la LRITF, art. 106). Los 2 años desde que quedó firme la resolución son los de la reincidencia; los 10 años, los de conservación.","ref":"LIC art. 109 Bis 1; LRITF art. 106"},{"id":"F022","tema":"2.1.15","tipo":"caso","q":"La CNBV presume que un transmisor de dinero está violando el art. 95 Bis de la LGOAAC. ¿Qué puede ordenar, además de la multa?","a":"Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él","o":["Que la UIF lo incluya en la Lista de Personas Bloqueadas mientras dure el procedimiento de sanción","Que el Banco de México congele sus cuentas hasta que la resolución de la CNBV quede firme","Que la CONDUSEF revoque su autorización y la publique en su portal como información reservada","Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él"],"x":"El 95 Bis faculta a la CNBV para ordenar a instituciones de crédito, casas de bolsa y casas de cambio que suspendan o cancelen contratos con centros cambiarios y transmisores, y se abstengan de nuevas operaciones, cuando presuma que violan el artículo.","ref":"LGOAAC art. 95 Bis"},{"id":"F023","tema":"2.1.16","tipo":"trampa","q":"Una entidad incorporó íntegros a su Manual los Lineamientos 2019 de propietario real. ¿Qué efecto tiene eso sobre sus obligaciones de PR?","a":"Por sí solo no acredita el cumplimiento: la obligación está en las DCG","o":["Por sí solo no acredita el cumplimiento: la obligación está en las DCG","Acredita por sí solo el cumplimiento, porque los Lineamientos sustituyen a las DCG","Acredita el cumplimiento sólo si además los registra ante la UIF en 90 días naturales","Lo vuelve optativo, porque las DCG sólo obligan a quien no adopte los Lineamientos"],"x":"L1: los Lineamientos son criterios enunciativos mas no limitativos que las Entidades «podrán» considerar, y adoptarlos total o parcialmente no significa por sí solo cumplir. La obligación (definición, 25 %, cascada, datos) vive en cada DCG.","ref":"Lineamientos PR 2019, L1; DCG Bancos 4ª fr. VI, último párrafo"},{"id":"F024","tema":"2.1.16","tipo":"memoria","q":"Para Bancos, ¿dónde está la obligación de identificar al propietario real, con su definición y el umbral del 25 %?","a":"En las DCG de Bancos: 2ª fr. VII y XXXII y 4ª fr. II inciso c) y fr. VI","o":["En los Lineamientos 2019 de la SHCP, que son la fuente del umbral del 25 %","En el art. 115 de la LIC, que define al propietario real y fija el umbral","En las DCG de Bancos: 2ª fr. VII y XXXII y 4ª fr. II inciso c) y fr. VI","En el Manual de cada banco, que fija libremente el umbral de participación"],"x":"Definición (2ª XXXII), Control con el 25 % o más (2ª VII), cascada (4ª II c) y datos (4ª VI) están en las DCG. El fallo típico es atribuir el 25 % a los Lineamientos, que sólo orientan.","ref":"DCG Bancos 2ª fr. VII y XXXII; 4ª fr. II inciso c) y fr. VI"},{"id":"F025","tema":"2.1.16","tipo":"memoria","q":"¿Quién emite los Lineamientos para la identificación del propietario real que las Entidades podrán considerar?","a":"La SHCP, por conducto de la Unidad de Banca, Valores y Ahorro","o":["La CNBV, por acuerdo de su Junta de Gobierno y como parte de las DCG","El Banco de México, por conducto de su Dirección de Sistemas de Pagos","La CONDUSEF, como parte de sus disposiciones de transparencia","La SHCP, por conducto de la Unidad de Banca, Valores y Ahorro"],"x":"La 4ª VI de las DCG dice que «la Secretaría» emitirá los lineamientos; los de 2019 los expidió la SHCP por la UBVA. No forman parte de las DCG que emite la CNBV.","ref":"DCG Bancos 4ª fr. VI, último párrafo; Lineamientos PR 2019"},{"id":"F026","tema":"2.1.16","tipo":"caso","q":"Un banco abre una cuenta a una sociedad anónima en la que ninguna persona física tiene el 25 % o más del capital ni de los derechos de voto, y nadie ejerce el Control por otros medios. ¿A quién considera propietario real?","a":"Al administrador o administradores de la sociedad","o":["Al accionista con la mayor participación, aunque no llegue al 25 %","Al administrador o administradores de la sociedad","Al representante legal que firma la declaración sobre los propietarios reales","A nadie: la cuenta se abre sin propietario real por no haber Control"],"x":"La cascada de la 4ª II c): si nadie tiene igual o superior al 25 % ni ejerce el Control por otros medios, se considera que lo ejerce el administrador o administradores. El representante legal firma la declaración, pero no se vuelve PR por ello.","ref":"DCG Bancos 4ª fr. II, inciso c)"},{"id":"F027","tema":"2.1.16","tipo":"caso","q":"En la misma situación de cascada, el administrador de la sociedad cliente de un banco es otra persona moral. ¿A quién se identifica como propietario real?","a":"A la persona física que esa persona moral nombró como administrador","o":["Al accionista mayoritario de la persona moral que funge como administradora","Al representante legal de la sociedad que abre la cuenta en el banco","A la persona física que esa persona moral nombró como administrador","A la persona moral administradora, con los datos de una persona moral"],"x":"Si el administrador es persona moral o fideicomiso, la 4ª II c) lleva a la persona física nombrada como administrador por ella. El PR siempre es persona física, por eso no puede quedarse en la persona moral administradora.","ref":"DCG Bancos 4ª fr. II, inciso c)"},{"id":"F028","tema":"2.1.16","tipo":"trampa","q":"Un analista afirma que los Lineamientos 2019 imponen una cascada obligatoria que termina en el administrador. ¿Qué establecen en realidad?","a":"Tres vías (propiedad, cargo, otro medio) en lista de prelación o indistintas","o":["Tres vías (propiedad, cargo, otro medio) en lista de prelación o indistintas","La misma cascada de las DCG, que los Lineamientos hacen obligatoria","Tres vías que siempre se aplican en este orden: cargo, propiedad, otro medio","Una sola vía, la del cargo de alto mando, que sustituye a la cascada"],"x":"La cascada al administrador es de las DCG (4ª II c). Los Lineamientos (L3) dan tres vías que «podrán» considerarse y cuyo último párrafo permite fijarlas en lista de prelación o aplicarlas de manera indistinta.","ref":"Lineamientos PR 2019, L3, fr. I a III y último párrafo"},{"id":"F029","tema":"2.1.16","tipo":"trampa","q":"En los Lineamientos 2019, ¿en qué supuesto se usa la expresión «más del 25 %» en lugar de «25 % o más»?","a":"Al sumar titulares con menos del 25 % para ver si, en conjunto, superan ese umbral","o":["Al sumar titulares con menos del 25 % para ver si, en conjunto, superan ese umbral","En la definición de Control por participación en el capital de las DCG de cada sujeto","En la cascada que lleva al administrador cuando nadie tiene participación suficient
