nformación reservada","Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él"],"x":"El 95 Bis faculta a la CNBV para ordenar a instituciones de crédito, casas de bolsa y casas de cambio que suspendan o cancelen contratos con centros cambiarios y transmisores, y se abstengan de nuevas operaciones, cuando presuma que violan el artículo.","ref":"LGOAAC art. 95 Bis"},{"id":"F023","tema":"2.1.16","tipo":"trampa","q":"Una entidad incorporó íntegros a su Manual los Lineamientos 2019 de propietario real. ¿Qué efecto tiene eso sobre sus obligaciones de PR?","a":"Por sí solo no acredita el cumplimiento: la obligación está en las DCG","o":["Por sí solo no acredita el cumplimiento: la obligación está en las DCG","Acredita por sí solo el cumplimiento, porque los Lineamientos sustituyen a las DCG","Acredita el cumplimiento sólo si además los registra ante la UIF en 90 días naturales","Lo vuelve optativo, porque las DCG sólo obligan a quien no adopte los Lineamientos"],"x":"L1: los Lineamientos son criterios enunciativos mas no limitativos que las Entidades «podrán» considerar, y adoptarlos total o parcialmente no significa por sí solo cumplir. La obligación (definición, 25 %, cascada, datos) vive en cada DCG.","ref":"Lineamientos PR 2019, L1; DCG Bancos 4ª fr. VI, último párrafo"},{"id":"F024","tema":"2.1.16","tipo":"memoria","q":"Para Bancos, ¿dónde está la obligación de identificar al propietario real, con su definición y el umbral del 25 %?","a":"En las DCG de Bancos: 2ª fr. VII y XXXII y 4ª fr. II inciso c) y fr. VI","o":["En los Lineamientos 2019 de la SHCP, que son la fuente del umbral del 25 %","En el art. 115 de la LIC, que define al propietario real y fija el umbral","En las DCG de Bancos: 2ª fr. VII y XXXII y 4ª fr. II inciso c) y fr. VI","En el Manual de cada banco, que fija libremente el umbral de participación"],"x":"Definición (2ª XXXII), Control con el 25 % o más (2ª VII), cascada (4ª II c) y datos (4ª VI) están en las DCG. El fallo típico es atribuir el 25 % a los Lineamientos, que sólo orientan.","ref":"DCG Bancos 2ª fr. VII y XXXII; 4ª fr. II inciso c) y fr. VI"},{"id":"F025","tema":"2.1.16","tipo":"memoria","q":"¿Quién emite los Lineamientos para la identificación del propietario real que las Entidades podrán considerar?","a":"La SHCP, por conducto de la Unidad de Banca, Valores y Ahorro","o":["La CNBV, por acuerdo de su Junta de Gobierno y como parte de las DCG","El Banco de México, por conducto de su Dirección de Sistemas de Pagos","La CONDUSEF, como parte de sus disposiciones de transparencia","La SHCP, por conducto de la Unidad de Banca, Valores y Ahorro"],"x":"La 4ª VI de las DCG dice que «la Secretaría» emitirá los lineamientos; los de 2019 los expidió la SHCP por la UBVA. No forman parte de las DCG que emite la CNBV.","ref":"DCG Bancos 4ª fr. VI, último párrafo; Lineamientos PR 2019"},{"id":"F026","tema":"2.1.16","tipo":"caso","q":"Un banco abre una cuenta a una sociedad anónima en la que ninguna persona física tiene el 25 % o más del capital ni de los derechos de voto, y nadie ejerce el Control por otros medios. ¿A quién considera propietario real?","a":"Al administrador o administradores de la sociedad","o":["Al accionista con la mayor participación, aunque no llegue al 25 %","Al administrador o administradores de la sociedad","Al representante legal que firma la declaración sobre los propietarios reales","A nadie: la cuenta se abre sin propietario real por no haber Control"],"x":"La cascada de la 4ª II c): si nadie tiene igual o superior al 25 % ni ejerce el Control por otros medios, se considera que lo ejerce el administrador o administradores. El representante legal firma la declaración, pero no se vuelve PR por ello.","ref":"DCG Bancos 4ª fr. II, inciso c)"},{"id":"F027","tema":"2.1.16","tipo":"caso","q":"En la misma situación de cascada, el administrador de la sociedad cliente de un banco es otra persona moral. ¿A quién se identifica como propietario real?","a":"A la persona física que esa persona moral nombró como administrador","o":["Al accionista mayoritario de la persona moral que funge como administradora","Al representante legal de la sociedad que abre la cuenta en el banco","A la persona física que esa persona moral nombró como administrador","A la persona moral administradora, con los datos de una persona moral"],"x":"Si el administrador es persona moral o fideicomiso, la 4ª II c) lleva a la persona física nombrada como administrador por ella. El PR siempre es persona física, por eso no puede quedarse en la persona moral administradora.","ref":"DCG Bancos 4ª fr. II, inciso c)"},{"id":"F028","tema":"2.1.16","tipo":"trampa","q":"Un analista afirma que los Lineamientos 2019 imponen una cascada obligatoria que termina en el administrador. ¿Qué establecen en realidad?","a":"Tres vías (propiedad, cargo, otro medio) en lista de prelación o indistintas","o":["Tres vías (propiedad, cargo, otro medio) en lista de prelación o indistintas","La misma cascada de las DCG, que los Lineamientos hacen obligatoria","Tres vías que siempre se aplican en este orden: cargo, propiedad, otro medio","Una sola vía, la del cargo de alto mando, que sustituye a la cascada"],"x":"La cascada al administrador es de las DCG (4ª II c). Los Lineamientos (L3) dan tres vías que «podrán» considerarse y cuyo último párrafo permite fijarlas en lista de prelación o aplicarlas de manera indistinta.","ref":"Lineamientos PR 2019, L3, fr. I a III y último párrafo"},{"id":"F029","tema":"2.1.16","tipo":"trampa","q":"En los Lineamientos 2019, ¿en qué supuesto se usa la expresión «más del 25 %» en lugar de «25 % o más»?","a":"Al sumar titulares con menos del 25 % para ver si, en conjunto, superan ese umbral","o":["Al sumar titulares con menos del 25 % para ver si, en conjunto, superan ese umbral","En la definición de Control por participación en el capital de las DCG de cada sujeto","En la cascada que lleva al administrador cuando nadie tiene participación suficiente","En el voto que confiere Control sobre las decisiones del capital social de la sociedad"],"x":"«Más del 25 %» sólo aparece en L3 I, en el párrafo del capital fraccionado en partes menores al 25 %. Las DCG (2ª VII y 4ª II c) y L3 I a) dicen «25 % o más»; el voto que da Control es «más del 50 %».","ref":"Lineamientos PR 2019, L3, fr. I; DCG Bancos 2ª fr. VII"},{"id":"F030","tema":"2.1.16","tipo":"caso","q":"Una persona física tiene exactamente el 25 % del capital social de una sociedad cliente de un banco y no ocupa ningún cargo. Conforme a las DCG, ¿ejerce el Control?","a":"Sí: la DCG considera Control adquirir el 25 % o más del capital","o":["No: para ejercer el Control se requiere más del 25 % del capital","No: para ejercer el Control se requiere votar más del 50 % del capital","Sí: la DCG considera Control adquirir el 25 % o más del capital","Sólo si además ocupa un cargo de alto mando en la sociedad cliente"],"x":"La 2ª VII de Bancos considera que ejerce Control la persona física que adquiera el 25 % o más del capital; el 25 % exacto queda dentro. «Más del 25 %» es la regla de suma de fracciones de los Lineamientos, no la de las DCG.","ref":"DCG Bancos 2ª fr. VII"},{"id":"F031","tema":"2.1.16","tipo":"caso","q":"Tres hermanos tienen, cada uno, el 10 % del capital de una sociedad cliente. Si la entidad sigue los Lineamientos 2019, ¿qué podrá hacer?","a":"Identificar a cada titular y si existe relación jurídica entre ellos para ver si en conjunto tienen más del 25 %","o":["Descartarlos, porque ninguno alcanza por sí solo el 25 % o más del capital social","Identificar a cada titular y si existe relación jurídica entre ellos para ver si en conjunto tienen más del 25 %","Considerarlos propietarios reales sólo si los tres son personas políticamente expuestas","Tomar de inmediato al administrador como PR, sin analizar a los hermanos ni sus vínculos"],"x":"L3 I: si el capital está fraccionado en partes menores al 25 %, la entidad «podrá» identificar a cada titular y ver si en su conjunto tienen más del 25 %. Descartarlos por no llegar cada uno al 25 % ignora esa regla.","ref":"Lineamientos PR 2019, L3, fr. I"},{"id":"F032","tema":"2.1.16","tipo":"caso","q":"Una persona sin acciones ni cargo en la sociedad cliente decide de hecho sus asuntos por su vínculo familiar con el director general. ¿En qué vía de los Lineamientos 2019 encaja?","a":"Control por otro medio (L3 fr. III)","o":["Control por propiedad (L3 fr. I)","Control por cargo (L3 fr. II)","Medidas razonables (L4 fr. III)","Control por otro medio (L3 fr. III)"],"x":"L3 III cubre el Control sin propiedad visible: participación en las finanzas, relación personal o vínculo familiar con los altos mandos. La vía del cargo (L3 II) exige un cargo de alto mando, que esta persona no tiene.","ref":"Lineamientos PR 2019, L3, fr. III"},{"id":"F033","tema":"2.1.16","tipo":"trampa","q":"Pese a que los Lineamientos 2019 son orientadores, la vía del cargo usa una expresión imperativa. ¿Cuál?","a":"La persona «deberá» contar con un cargo de alto mando","o":["La persona «deberá» tener además el 25 % o más del capital","La persona «podrá» tener cualquier cargo, aun sin ser directivo","La persona «deberá» contar con un cargo de alto mando","La persona «deberá» estar inscrita en el Registro Público de Comercio"],"x":"L3 II b) (control sobre asuntos diarios mediante un cargo directivo) dice que, bajo ese supuesto, la persona «deberá contar con un cargo de alto mando». Es el matiz de la trampa «DCG obligan, Lineamientos orientan».","ref":"Lineamientos PR 2019, L3, fr. II, inciso b)"},{"id":"F034","tema":"2.1.16","tipo":"caso","q":"Una entidad duda de la veracidad del cuestionario de PR que entregó su cliente persona moral. ¿Cuál de estas es una medida razonable prevista en los Lineamientos 2019?","a":"Pedir la certificación de la integración del capital con los asientos del libro de accionistas","o":["Pedir la certificación de la integración del capital con los asientos del libro de accionistas","Pedir a la UIF una constancia oficial que confirme quién es el propietario real del cliente","Solicitar a la CNBV un dictamen previo sobre la estructura accionaria del cliente persona moral","Exigir al cliente que sustituya a su administrador por una persona física antes de operar"],"x":"L4 III c) prevé la certificación de la integración del capital junto con los asientos del libro de registro de accionistas; también actas de asamblea, informe de poderes y consulta al RPC, RNV y RNIE. Ninguna medida consiste en pedir constancias a la UIF o a la CNBV.","ref":"Lineamientos PR 2019, L4, fr. III, inciso c)"},{"id":"F035","tema":"2.1.16","tipo":"caso","q":"Un banco abre una cuenta a un cliente clasificado de riesgo bajo que actúa en beneficio de un propietario real. Conforme a la 4ª VI, ¿qué recaba del PR?","a":"Los mismos datos que de un cliente, sin pedir su comprobante de domicilio","o":["Sólo el nombre completo del PR, sin documentos que acrediten su identidad","Nada: con un cliente de riesgo bajo no se identifica al propietario real","Los mismos datos y documentos, con comprobante de domicilio y pasaporte","Los mismos datos que de un cliente, sin pedir su comprobante de domicilio"],"x":"La 4ª VI pide del PR los mismos datos y documentos de la 4ª I o III; cuando el cliente es de riesgo bajo, no se recaba el comprobante de domicilio del PR. La dispensa es de un documento, no de la identificación del PR.","ref":"DCG Bancos 4ª fr. VI"},{"id":"F036","tema":"2.1.16","tipo":"caso","q":"Una ITF atiende a un Cliente de riesgo bajo que actúa en beneficio de un propietario real. ¿Qué prevé el art. 11 VI de sus DCG respecto de los documentos del PR?","a":"Recaba los datos de identificación de las fr. I o III: no prevé la dispensa por riesgo bajo","o":["Omite el comprobante de domicilio del PR, exactamente igual que los Bancos","Recaba los datos de identificación de las fr. I o III: no prevé la dispensa por riesgo bajo","Omite toda la documentación del PR y sólo pide una declaración del Cliente","Sólo identifica al PR en operaciones de 5,000 USD o más, como las casas de cambio"],"x":"El art. 11 VI de ITF pide del PR los datos de identificación de las fracciones I o III y no trae la regla de Bancos (4ª VI) que exime del comprobante de domicilio cuando el cliente es de riesgo bajo. El umbral de 5,000 USD es de casas de cambio, centros y transmisores, no de ITF.","ref":"DCG ITF art. 11, fr. VI","par":"F035"},{"id":"F037","tema":"2.1.16","tipo":"caso","q":"Un banco detecta que el propietario real de uno de sus clientes es una persona políticamente expuesta. ¿Qué prevé la 4ª VI de sus DCG?","a":"Que al Cliente se le apliquen las reglas 26ª y 28ª","o":["Que se rechace siempre la apertura o se cancele el contrato","Que al Cliente se le apliquen las reglas 26ª y 28ª","Que se envíe un reporte de 24 horas a la SHCP por ese solo hecho","Que el PR quede exento de identificarse por ser servidor público"],"x":"Si el PR es PEP, la 4ª VI remite a las reglas 26ª y 28ª, que se aplican al Cliente. No hay prohibición automática de operar ni un reporte por el solo hecho de ser PEP.","ref":"DCG Bancos 4ª fr. VI"},{"id":"F038","tema":"2.1.16","tipo":"caso","q":"En una casa de bolsa, el propietario real de un cliente de riesgo alto es una persona políticamente expuesta. ¿Qué exige su DCG para iniciar o continuar la relación comercial?","a":"La aprobación del directivo con facultades específicas que prevé la 24ª","o":["Un reporte de operación inusual dentro de 24 horas","La autorización previa de la CNBV para operar con él","La firma de una constancia del delegado fiduciario de la entidad","La aprobación del directivo con facultades específicas que prevé la 24ª"],"x":"La 4ª VII de casas de bolsa remite expresamente a la aprobación de la 24ª. En Bancos el efecto es el mismo por remisión: la 4ª VI manda aplicar al Cliente la 26ª y la 28ª, y la 26ª pide la aprobación de un directivo para PEP de riesgo alto. No se prevé autorización de la CNBV ni un reporte de 24 horas.","ref":"DCG casas de bolsa 4ª fr. VII y 24ª; DCG Bancos 4ª fr. VI y 26ª","par":"F037"},{"id":"F039","tema":"2.1.16","tipo":"caso","q":"Un banco abre una cuenta a una subsidiaria en la que una emisora que cotiza en bolsa tiene participación mayoritaria. Conforme a la 4ª VI, ¿qué ocurre con la identificación del PR?","a":"Aplica la excepción de la 4ª VI para cotizadas y sus subsidiarias con participación mayoritaria","o":["Aplica la excepción de la 4ª VI para cotizadas y sus subsidiarias con participación mayoritaria","Debe recabar los datos de cada accionista de la emisora que tenga el 25 % o más del capital","Debe aplicar la cascada y recabar los datos del administrador de la emisora controladora","Debe pedir la declaración del representante legal y una certificación de la Bolsa de Valores"],"x":"La 4ª VI exceptúa a las personas morales que cotizan en bolsa y a sus subsidiarias con participación mayoritaria. Por eso no se recorre ni el 25 % ni la cascada al administrador.","ref":"DCG Bancos 4ª fr. VI"},{"id":"F040","tema":"2.1.16","tipo":"trampa","q":"Un padre, que no es titular, deposita cada mes recursos en la cuenta de su hija adulta, quien los usa y dispone de ellos en su propio beneficio; el padre no obtiene beneficio alguno. ¿Qué figura es el padre?","a":"Proveedor de Recursos","o":["Propietario real","Beneficiario","Proveedor de Recursos","Cotitular de la cuenta"],"x":"Proveedor de Recursos es quien, sin ser titular, aporta recursos de manera regular sin obtener los beneficios (2ª XXXIII). El propietario real es quien obtiene los beneficios y es el verdadero dueño (2ª XXXII); el Beneficiario es el designado para el caso de fallecimiento (2ª III).","ref":"DCG Bancos 2ª fr. III, XXXII y XXXIII"},{"id":"F041","tema":"2.1.16","tipo":"memoria","q":"Además del verdadero dueño de los recursos y de quien ejerce el Control, ¿a quién comprende la definición de propietario real de la 2ª XXXII de Bancos?","a":"A quien pueda instruir, para su beneficio, actos mediante fideicomisos, mandatos o comisiones","o":["A la persona que aporta los recursos a la cuenta sin obtener los beneficios de ella","A la persona designada por el titular para recibir los recursos en caso de fallecimiento","A todo apoderado que firme el contrato en nombre del Cliente, aunque no se beneficie","A quien pueda instruir, para su beneficio, actos mediante fideicomisos, mandatos o comisiones"],"x":"La 2ª XXXII comprende también a quien pueda instruir o determinar, para su propio beneficio económico, actos realizados a través de fideicomisos, mandatos o comisiones. Quien aporta sin beneficiarse es Proveedor de Recursos; el designado por fallecimiento, Beneficiario.","ref":"DCG Bancos 2ª fr. XXXII"},{"id":"F042","tema":"2.1.16","tipo":"memoria","q":"En las DCG de Bancos, los datos del propietario real están en la 4ª fracción VI. ¿En qué fracción están en las DCG de casas de bolsa?","a":"4ª, fracción VII","o":["4ª, fracción VI","4ª, fracción VII","4ª, fracción III, inciso E","Art. 11, fracción VI"],"x":"Casas de bolsa tienen el PR en la 4ª VII; el contenido es igual al de Bancos, cambia la fracción. La 4ª VI es la de Bancos, SOFOM, asesores, fondos, SOCAP, SOFIPO y uniones; el art. 11 VI, la de ITF.","ref":"DCG casas de bolsa 4ª fr. VII"},{"id":"F043","tema":"2.1.16","tipo":"memoria","q":"En las DCG de Bancos, los datos del propietario real están en la 4ª fracción VI. ¿Dónde están en las DCG de casas de cambio?","a":"4ª, fracción III, inciso E","o":["4ª, fracción VII","4ª, fracción VI","4ª, fracción III, inciso E","Art. 11, fracción VI"],"x":"Casas de cambio y centros cambiarios tienen el PR en la 4ª III inciso E, referido a Usuarios y operaciones de 5,000 USD o más. La 4ª VII es la de casas de bolsa.","ref":"DCG casas de cambio 4ª fr. III, inciso E","par":"F042"},{"id":"F044","tema":"2.1.16","tipo":"cifra","q":"¿A partir de qué monto las DCG de casas de cambio y de centros cambiarios exigen integrar el expediente del Usuario con los datos del propietario real (4ª III inciso E)?","a":"5,000 USD o más","o":["5,000 USD o más","1,000 USD o más","7,500 USD o más","10,000 USD o más"],"x":"Su fracción de PR (4ª III inciso E) aplica a operaciones de 5,000 USD o más; igual en transmisores. 7,500 USD es el umbral de relevantes de Bancos, no el del PR. En casas de cambio, la fr. III se refiere a operaciones en efectivo o con cheques de viajero.","ref":"DCG casas de cambio y centros cambiarios 4ª fr. III, inciso E"},{"id":"F045","tema":"2.1.16","tipo":"caso","q":"Un banco recibe la declaración escrita del representante legal sobre quiénes son los PR de una sociedad cliente, pero hay indicios de que es falsa. ¿Qué dice la 4ª II c)?","a":"Que «deberán» tomar medidas razonables para identificar al PR","o":["Que «deberán» tomar medidas razonables para identificar al PR","Que «podrán» aceptar la declaración sin hacer nada más","Que «deberán» llevar a cabo «acciones», como en las ITF","Que deben cerrar la cuenta y avisar de inmediato a la UIF"],"x":"Ante indicios de falsedad, la 4ª II c) de Bancos dice que las Entidades «deberán tomar medidas razonables». La palabra «acciones» es la que usa la DCG de ITF para el mismo supuesto.","ref":"DCG Bancos 4ª fr. II, inciso c)"},{"id":"F046","tema":"2.1.16","tipo":"caso","q":"Una ITF tiene dudas sobre la declaración de quiénes son los PR de su Cliente persona moral. Frente a la redacción de Bancos, ¿qué término usa su DCG?","a":"Habla de llevar a cabo «acciones», no de «medidas razonables»","o":["Habla de «medidas razonables», exactamente igual que la de Bancos","Remite a los Lineamientos 2019 como única forma de verificar","Habla de llevar a cabo «acciones», no de «medidas razonables»","Ordena aplicar la cascada sin verificar la declaración recibida"],"x":"En ITF, ante dudas, la DCG habla de «acciones»; en Bancos, de «medidas razonables». Es una diferencia de redacción de la cascada del art. 11 II b), que además no menciona los derechos de voto.","ref":"DCG ITF art. 11, fr. II, inciso b)","par":"F045"},{"id":"F047","tema":"2.1.16","tipo":"caso","q":"Un banco que no actúa como fiduciario opera con un fideicomiso. ¿Qué documento le permite la 4ª IX usar para cumplir con el contrato del fideicomiso y con los datos del PR?","a":"Una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria","o":["Una certificación del capital del fideicomiso, firmada por el secretario de su comité técnico","Una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria","Una declaración del fideicomitente, ratificada ante la CNBV, sobre quiénes son los fideicomisarios","Un dictamen del auditor externo del fideicomiso sobre la identidad de sus propietarios reales"],"x":"La 4ª IX de Bancos permite («podrán») a la entidad que no es fiduciaria cumplir mediante una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria. Es una opción, no una exigencia; la DCG de ITF no la prevé.","ref":"DCG Bancos 4ª fr. IX"},{"id":"F048","tema":"2.1.16","tipo":"caso","q":"En una ITF, el propietario real de un Cliente es un fideicomiso. ¿Qué prevé el art. 11 VI de sus DCG?","a":"Identificar a los fideicomitentes o fideicomisarios; no prevé la opción de la constancia del delegado fiduciario","o":["Cumplir mediante la constancia del delegado fiduciario y del oficial de cumplimiento, como permite Bancos","Aplicar el numeral sobre fideicomisos de los Lineamientos 2019 como único criterio de identificación","Considerar al delegado fiduciario como propietario real y recabar sólo sus datos de identificación","Identificar a los fideicomitentes o fideicomisarios; no prevé la opción de la constancia del delegado fiduciario"],"x":"En ITF, si el PR es un fideicomiso, se identifica a fideicomitentes o fideicomisarios; su DCG no prevé la opción de cumplir con la constancia del delegado fiduciario que la 4ª IX da a Bancos. Los Lineamientos 2019 no tienen numeral sobre fideicomisos.","ref":"DCG ITF art. 11, fr. VI","par":"F047"},{"id":"F049","tema":"2.1.16","tipo":"caso","q":"Una SOFOM, una casa de cambio, un centro cambiario y un transmisor reciben transferencias ordenadas por otros sujetos obligados. ¿En cuál presume su DCG, como la de Bancos, que el ordenante actúa por cuenta de sus clientes?","a":"En la casa de cambio","o":["En la SOFOM","En el centro cambiario","En la casa de cambio","En el transmisor de dinero"],"x":"La presunción de Bancos (31ª) la repiten casas de cambio, SOCAP, SOFIPO y, respecto de «entidades financieras», casas de bolsa. SOFOM, centros cambiarios y transmisores no la prevén: la presunción no sigue familias.","ref":"DCG Bancos 31ª; DCG casas de cambio 22ª"},{"id":"F050","tema":"2.1.16","tipo":"caso","q":"Un banco atiende a una asociación civil clasificada de riesgo alto. ¿Qué procedimiento sobre su propietario real debe prever el Manual conforme a la 32ª II?","a":"Identificar a quien ejerza el Control, independientemente del porcentaje","o":["Identificar a quien ejerza el Control, independientemente del porcentaje","Identificar sólo a los asociados con el 25 % o más de las aportaciones","Identificar sólo a quien vote más del 50 % en la asamblea de asociados","Tomar como PR al presidente del consejo directivo, sin más análisis"],"x":"Para sociedades o asociaciones civiles de riesgo alto, la 32ª II pide identificar a quien tenga el Control «independientemente del porcentaje»: aquí no opera el umbral del 25 %.","ref":"DCG Bancos 32ª, fr. II"},{"id":"F101","tema":"2.1.17","tipo":"caso","q":"Una casa de cambio y un centro cambiario designan a su nuevo oficial de cumplimiento el mismo día. ¿Qué plazo tiene cada uno para avisarlo a la Secretaría, por conducto de la CNBV?","a":"Casa de cambio: 2 días hábiles; centro cambiario: 10 días hábiles","o":["Ambos: 2 días hábiles desde la designación, igual que Bancos","Casa de cambio: 10 días hábiles; centro cambiario: 2 días hábiles","Casa de cambio: 2 días hábiles; centro cambiario: 10 días hábiles","Casa de cambio: día hábil siguiente; centro cambiario: 10 días hábiles"],"x":"Sólo Bancos (reforma 2024) y Casas de cambio avisan la designación del OC en 2 días hábiles; Centros cambiarios, como SOFOM, Transmisores, ITF y los demás, en 10. La trampa es suponer que el centro cambiario sigue a la casa de cambio. El «día hábil siguiente» de la casa de cambio es para la revocación y el interino, no para la designación.","ref":"DCG Casas de cambio 39ª fr. I; DCG Centros cambiarios 35ª fr. I; DCG Bancos 48ª fr. I"},{"id":"F102","tema":"2.1.17","tipo":"memoria","q":"Bancos no prevé informar quién ejerce el Control de la Entidad. ¿Cuál de estos sujetos tiene 20 días hábiles desde que la CNBV le otorga el registro para presentar ese informe inicial?","a":"El centro cambiario","o":["El centro cambiario","La SOCAP","La SOFOM","La casa de cambio"],"x":"Centros cambiarios tiene 20 días hábiles desde el registro para el informe inicial y 10 días hábiles para los cambios. SOFOM, SOCAP, SOFIPO, Casas de cambio y Transmisores fijan 10 días hábiles desde que los accionistas o socios comunican el Control. El distractor más tentador es la casa de cambio, por ser del mismo giro cambiario: fija 10 días hábiles, no 20.","ref":"DCG Centros cambiarios 50ª 1er párr.; DCG Casas de cambio 52ª 1er párr."},{"id":"F103","tema":"2.1.17","tipo":"caso","q":"El lunes una casa de cambio revoca el nombramiento de su oficial de cumplimiento. ¿Cuándo vence su plazo para avisar la revocación?","a":"Al día hábil siguiente a la revocación","o":["Dentro de los 2 días hábiles, igual que la designación","Dentro de los 10 días hábiles, igual que Bancos","Dentro de los 15 días hábiles, como los cambios al Comité","Al día hábil siguiente a la revocación"],"x":"La casa de cambio es la única que avisa la revocación (y la designación del interino) al día hábil siguiente; Bancos y los demás sujetos con OC tienen 10 días hábiles. Los 2 días hábiles son de la designación, no de la revocación.","ref":"DCG Casas de cambio 39ª fr. II; DCG Bancos 48ª fr. II"},{"id":"F104","tema":"2.1.17","tipo":"caso","q":"El lunes un transmisor de dinero revoca el nombramiento de su oficial de cumplimiento. ¿Qué plazo tiene para avisar la revocación?","a":"10 días hábiles desde que ocurrió la revocación","o":["El día hábil siguiente, igual que la casa de cambio","10 días hábiles desde que ocurrió la revocación","2 días hábiles desde que ocurrió la revocación","15 días hábiles desde que el consejo apruebe la revocación"],"x":"Transmisores sigue a Bancos: 10 días hábiles desde que ocurrió la revocación. El día hábil siguiente es exclusivo de Casas de cambio; los 2 días hábiles son de la designación en Bancos y Casas de cambio, y no en Transmisores (10).","ref":"DCG Transmisores 37ª fr. II; DCG Bancos 48ª fr. II","par":"F103"},{"id":"F105","tema":"2.1.17","tipo":"caso","q":"Una ITF autorizada con 18 personas a su servicio no constituye Comité de Comunicación y Control. ¿Qué plazo tiene para comunicar esa situación?","a":"60 días hábiles desde su autorización","o":["15 días hábiles, igual que un banco con menos de 25 personas","60 días hábiles desde su autorización","60 días naturales desde que inicie operaciones","10 días hábiles desde que designe al oficial de cumplimiento"],"x":"ITF usa el mismo criterio de menos de 25 personas que Bancos, pero comunica en 60 días hábiles, contados desde la autorización o desde que se reduzca el número de personas. Bancos y la mayoría lo comunican en los mismos 15 días hábiles del aviso del Comité. Ojo: son hábiles, no naturales.","ref":"DCG ITF art. 48 últ. párr.; DCG Bancos 44ª últ. párr. y 46ª"},{"id":"F106","tema":"2.1.17","tipo":"caso","q":"Una unión de crédito tiene 20 personas a su servicio, 400 socios y activos por 80 millones de UDIS. ¿Puede dejar de constituir el Comité?","a":"No: para no tenerlo necesita, además, menos de 10 personas","o":["Sí: basta tener menos de 25 personas, como en Bancos","Sí: basta con que sus activos sean menores a 100 millones de UDIS","Sí, si lo comunica dentro de 60 días hábiles, como una ITF","No: para no tenerlo necesita, además, menos de 10 personas"],"x":"Uniones exige tres topes a la vez: menos de 10 personas, menos de 500 socios y activos menores a 100 millones de UDIS. Aquí cumple socios y activos, pero no el de personas. El criterio de menos de 25 personas es el de Bancos y la mayoría; los 60 días hábiles son de ITF.","ref":"DCG Uniones de crédito 35ª últ. párr.; DCG Bancos 44ª últ. párr."},{"id":"F107","tema":"2.1.17","tipo":"caso","q":"Una SOCAP con nivel de operación I y 40 personas a su servicio decide no constituir el Comité. ¿Qué rige su caso?","a":"Por su nivel I puede no tenerlo y lo comunica en 15 días hábiles","o":["Por su nivel I puede no tenerlo y lo comunica en 15 días hábiles","Debe tenerlo, porque rebasa el tope de 25 personas de Bancos","Puede no tenerlo, pero lo comunica en 60 días hábiles, como ITF","Debe tenerlo, porque rebasa el tope de 10 personas de las Uniones"],"x":"En SOCAP el criterio no es el número de personas sino el nivel de operación: las de nivel I no constituyen Comité y lo comunican en 15 días hábiles. El tope de 25 personas es de Bancos y la mayoría; el de 10 personas (con socios y activos) es de Uniones; los 60 días hábiles, de ITF.","ref":"DCG SOCAP 48ª últ. párr. y 50ª; DCG Uniones de crédito 35ª últ. párr.","par":"F106"},{"id":"F108","tema":"2.1.17","tipo":"caso","q":"Un asesor en inversiones nombra a la persona que cumplirá las funciones de su régimen PLD/FT. ¿Qué plazo tiene para informar el nombramiento?","a":"15 días hábiles: es su Representante, no un OC","o":["2 días hábiles, como el OC de Bancos","10 días hábiles, como el OC de los demás sujetos","15 días hábiles: es su Representante, no un OC","No informa nada: su DCG no prevé avisos de nombramiento"],"x":"Asesores no tiene OC ni Comité: su figura es el Representante, cuyo nombramiento informa dentro de los 15 días hábiles siguientes. Los 2 y 10 días hábiles son del OC de Bancos y de los demás. Bancos no prevé la figura de Representante.","ref":"DCG Asesores en inversiones 31ª"},{"id":"F109","tema":"2.1.17","tipo":"caso","q":"Un transmisor de dinero inscribe en el registro del art. 128 de la LGSM la transmisión del 3 % de su capital pagado. ¿Qué plazo tiene para informarlo?","a":"3 días hábiles desde que la inscribe en el registro","o":["10 días hábiles desde que la inscribe en el registro","3 días hábiles desde que se firma la compraventa","No informa: su DCG, como la de Bancos, no lo prevé","3 días hábiles desde que la inscribe en el registro"],"x":"Transmisores (como SOFOM y Centros cambiarios) informa la transmisión de más del 2 % en 3 días hábiles, contados desde la inscripción en el registro del art. 128 LGSM, no desde la operación. Los 10 días hábiles son de Casas de cambio. Bancos no lo prevé.","ref":"DCG Transmisores 53ª 3er párr."},{"id":"F110","tema":"2.1.17","tipo":"caso","q":"Una casa de cambio inscribe en el registro del art. 128 de la LGSM la transmisión del 3 % de su capital pagado. ¿Qué plazo tiene para informarlo?","a":"10 días hábiles desde que la inscribe en el registro","o":["3 días hábiles desde que la inscribe en el registro","10 días hábiles desde que la inscribe en el registro","El día hábil siguiente a que la inscribe en el registro","No informa: su DCG, como la de Bancos, no lo prevé"],"x":"Casas de cambio tiene 10 días hábiles desde la inscripción; Centros cambiarios, Transmisores y SOFOM, 3. El día hábil siguiente de la casa de cambio es para la revocación del OC y el interino. Bancos no prevé este informe.","ref":"DCG Casas de cambio 52ª 3er párr.; DCG Centros cambiarios 50ª 3er párr.","par":"F109"},{"id":"F111","tema":"2.1.17","tipo":"caso","q":"Un transmisor de dinero recibe de un Usuario 6,000 dólares en billetes para un envío. Para efectos de Operaciones Relevantes, ¿qué aplica?","a":"Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre","o":["No es Relevante: el umbral es de 7,500 dólares, igual que en Bancos","Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre","Es Relevante y va dentro de los 15 días hábiles siguientes al cierre del mes"],"x":"Transmisores usa umbral de 5,000 USD y reporta en los 10 ÚLTIMOS días hábiles de enero, abril, julio y octubre (igual que SOFOM y Centros cambiarios). Bancos: 7,500 USD y 10 primeros días hábiles. Los 15 días hábiles mensuales son de transferencias internacionales.","ref":"DCG Transmisores 2ª fr. XXVII y 23ª; DCG Bancos 34ª"},{"id":"F112","tema":"2.1.17","tipo":"caso","q":"Una SOFOM recibe de un Cliente 6,000 dólares en billetes para pagar un crédito. Para efectos de Operaciones Relevantes, ¿qué aplica?","a":"No es Relevante: la SOFOM usa el umbral de 7,500 dólares","o":["No es Relevante: la SOFOM usa el umbral de 7,500 dólares","Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre","Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","Va en el reporte trimestral de efectivo en dólares, no en el de Relevantes"],"x":"La SOFOM comparte con Transmisores el calendario de los 10 últimos días hábiles, pero no su umbral: usa 7,500 USD, como Bancos. Con 6,000 USD no hay Relevante. Tampoco tiene reporte de efectivo en dólares (sus montos en USD sólo sirven para registro y alertas).","ref":"DCG SOFOM 2ª fr. XXVII y 28ª","par":"F111"},{"id":"F113","tema":"2.1.17","tipo":"caso","q":"Una ITF recibe de un Cliente 6,000 dólares en billetes. Para efectos de Operaciones Relevantes, ¿qué aplica?","a":"Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","o":["No es Relevante: el umbral es de 7,500 dólares, igual que en Bancos","Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre, como Transmisores","Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","Sólo cuenta si se trata de cheques de viajero o monedas de oro, plata o platino"],"x":"ITF usa el umbral de 5,000 USD, como Transmisores, pero sólo en billetes y monedas metálicas, y reporta en los 10 PRIMEROS días hábiles, como Bancos. Combina el umbral de los transmisores con el calendario de Bancos.","ref":"DCG ITF art. 2 fr. XXIV y art. 66; DCG Transmisores 23ª","par":"F111"},{"id":"F114","tema":"2.1.17","tipo":"caso","q":"Un socio de una SOCAP deposita cheques de viajero por 8,000 dólares. ¿Encuadra en la definición de Operación Relevante de su DCG?","a":"No: su definición sólo abarca billetes y monedas metálicas","o":["No: su definición sólo abarca billetes y monedas metálicas","Sí: rebasa el umbral de 7,500 dólares, igual que en Bancos y Casas de bolsa","Sí: en la SOCAP el umbral es de 5,000 dólares","No: en la SOCAP el umbral es de 10,000 dólares"],"x":"SOCAP (y SOFIPO) conservan los 7,500 USD de Bancos, pero su definición sólo incluye billetes y monedas metálicas de curso legal: no cheques de viajero ni monedas de platino, oro o plata. Los 5,000 USD son de Centros, Transmisores e ITF; los 10,000 USD, del reporte de cheques de caja de Bancos.","ref":"DCG SOCAP 2ª fr. XXIX; DCG Bancos 2ª fr. XXX"},{"id":"F115","tema":"2.1.17","tipo":"memoria","q":"¿Cuál de estos sujetos reporta efectivo en dólares sólo por compras a sus Clientes de 500 dólares o más, sin umbral para Usuarios?","a":"La unión de crédito","o":["La SOFIPO","La casa de bolsa","La SOCAP","La unión de crédito"],"x":"Uniones reporta sólo operaciones de compra en efectivo con USD de Clientes desde 500 USD, sin umbral de Usuarios. SOFIPO, SOCAP y Casas de bolsa usan los dos umbrales de Bancos (Clientes ≥ 500 USD; Usuarios > 250 USD); SOCAP, como Uniones, sólo reporta compras, y Casas de bolsa no incluye depósitos.","ref":"DCG Uniones de crédito 27ª; DCG SOCAP 38ª; DCG Bancos 34ª Bis"},{"id":"F116","tema":"2.1.17","tipo":"caso","q":"Un centro cambiario compra a un Usuario 1,200 dólares en efectivo. ¿Qué reporte genera y cuándo lo envía?","a":"Reporte de compras; 10 últimos días hábiles de enero, abril, julio y octubre","o":["No genera reporte: sólo reporta desde 5,000 dólares, como en Relevantes","Reporte de compras; 10 últimos días hábiles de enero, abril, julio y octubre","Reporte de compras; 10 primeros días hábiles de enero, abril, julio y octubre","Reporte mensual, dentro de los 15 días hábiles siguientes al cierre del mes"],"x":"Centros cambiarios reporta cada compra en efectivo de más de 1,000 USD, sin tope superior, en los 10 ÚLTIMOS días hábiles de enero, abril, julio y octubre por el trimestre anterior. Los 5,000 USD son su umbral de Relevantes; los 10 primeros días hábiles son el calendario de Bancos.","ref":"DCG Centros cambiarios 23ª"},{"id":"F117","tema":"2.1.17","tipo":"trampa","q":"Un centro cambiario compra a un Usuario 6,000 dólares en efectivo. Por esa operación, ¿de qué reporte queda liberado?","a":"Del reporte de Operaciones Relevantes de la 22ª","o":["Del reporte de compras de más de 1,000 dólares de la 23ª","Del reporte de Operaciones Relevantes de la 22ª","Del reporte de montos totales de divisas de la 49ª","Del informe cuantitativo anual de la 48ª Bis"],"x":"La compra en efectivo de 5,000 USD o más SÍ se reporta por la 23ª y, por ella, el centro NO presenta el reporte de Relevantes de la 22ª. Es el mismo mecanismo de Bancos (34ª Bis), pero allá opera desde 7,500 USD. El error común es creer que la operación grande «se va» a Relevantes.","ref":"DCG Centros cambiarios 23ª últ. párr.; DCG Bancos 34ª Bis últ. párr."},{"id":"F118","tema":"2.1.17","tipo":"caso","q":"Una SOFIPO y una unión de crédito envían cada una al extranjero una transferencia de 2,000 dólares. ¿Qué deben reportar?","a":"SOFIPO: reporte mensual en 15 días hábiles; la Unión no tiene ese reporte","o":["Ambas: reporte mensual dentro de los 15 días hábiles siguientes al último día hábil del mes","Ambas: reporte trimestral en los 10 primeros días hábiles del trimestre","SOFIPO: reporte trimestral en 10 días hábiles; la Unión, mensual en 15","SOFIPO: reporte mensual en 15 días hábiles; la Unión no tiene ese reporte"],"x":"SOFIPO, como Bancos, reporta transferencias internacionales desde 1,000 USD, mensualmente, dentro de los 15 días hábiles siguientes al último día hábil del mes anterior. La DCG de Uniones no prevé este reporte (tampoco SOFOM, Asesores, Fondos ni Centros cambiarios). La trampa es suponer que la Unión sigue a SOCAP y SOFIPO.","ref":"DCG SOFIPO 38ª; DCG Bancos 35ª y 36ª"},{"id":"F119","tema":"2.1.17","tipo":"cifra","q":"Bancos reporta ventas de activos virtuales desde 2,250 dólares. ¿Desde qué monto reporta las ventas una ITF?","a":"7,500 UDIS","o":["7,500 UDIS","2,250 dólares","7,500 dólares","5,000 dólares"],"x":"Sólo Bancos e ITF tienen este reporte trimestral (10 primeros días hábiles). Bancos: compras sin monto mínimo y ventas desde 2,250 USD; ITF: ventas desde 7,500 UDIS. Los 7,500 y 5,000 dólares son umbrales de Relevantes, no de activos virtuales.","ref":"DCG ITF art. 74; DCG Bancos 34ª Quáter"},{"id":"F120","tema":"2.1.17","tipo":"memoria","q":"¿Cuál de estos sujetos presenta, igual que Bancos, el informe cuantitativo anual en los 10 últimos días hábiles de abril?","a":"El transmisor de dinero","o":["La SOFOM","La casa de bolsa","El transmisor de dinero","La casa de cambio"],"x":"El informe cuantitativo anual lo prevén Bancos, Asesores, Uniones, Centros cambiarios y Transmisores, en los 10 últimos días hábiles de abril. SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO, Casas de cambio e ITF no lo prevén. No confundir «últimos» de abril con los «últimos» trimestrales de Relevantes.","ref":"DCG Transmisores 52ª Bis; DCG Bancos 60ª Bis"},{"id":"F121","tema":"2.1.17","tipo":"caso","q":"Ante sospecha fundada sobre una operación que se pretende realizar, ¿a qué decisión liga expresamente cada DCG el plazo de 24 horas: la de Bancos y la de la SOFOM?","a":"Banco: a no realizar la operación; SOFOM: a aceptarla","o":["Banco: a aceptarla; SOFOM: a no realizar la operación","Ambos: a aceptarla, y si no la realizan no reportan","Banco: a no realizar la operación; SOFOM: a aceptarla","Ninguno: las 24 horas corren desde la sesión del Comité"],"x":"Bancos 41ª: «podrá no llevar a cabo» la operación y, en tal caso, reporta dentro de las 24 horas con leyenda LD o FT. SOFOM 33ª: «en el evento en que decida aceptar» la operación, reporta dentro de las 24 horas con la leyenda «Reporte de 24 horas». En ambos, el otro supuesto se reporta «en los términos» de la propia disposición: se reporta la acepte o no. La lógica está invertida.","ref":"DCG Bancos 41ª; DCG SOFOM 33ª"},{"id":"F122","tema":"2.1.17","tipo":"cifra","q":"Bancos y SOFOM regulan el reporte de 24 horas por sospecha fundada. ¿Qué leyenda inserta cada uno en la columna de descripción?","a":"Banco: «Reporte de 24 horas LD» o «FT»; SOFOM: «Reporte de 24 horas»","o":["Ambos: «Reporte de 24 horas LD» o «FT», según el delito","Banco: «Reporte de 24 horas LD» o «FT»; SOFOM: «Reporte de 24 horas»","Banco: «Reporte de 24 horas»; SOFOM: «Reporte de 24 horas LD» o «FT»","Ambos: «Lista de Personas Bloqueadas», por ser de 24 horas"],"x":"La leyenda diferenciada LD/FT es exclusiva de Bancos (41ª); la SOFOM y las otras nueve DCG con este régimen usan la leyenda única «Reporte de 24 horas» (33ª). «Lista de Personas Bloqueadas» es la leyenda del reporte por la LPB, no la de sospecha fundada.","ref":"DCG Bancos 41ª; DCG SOFOM 33ª","par":"F121"},{"id":"F123","tema":"2.1.17","tipo":"caso","q":"Una ITF detecta que un Cliente pretende realizar una operación con recursos de posible origen ilícito. ¿Desde cuándo corren sus 24 horas para reportar?","a":"Desde que la conoce por la alerta o por el informe de un empleado","o":["Desde que decide aceptar la operación, sin importar cuándo la conoció","Desde que concluye la sesión del Comité que la dictamina","Desde que la conoce por la alerta o por el informe de un empleado","Desde que decide no realizarla, como un banco"],"x":"La ITF reporta en no más de 24 horas desde que conoce la operación por la alerta o el informe de un empleado, en tres supuestos: el Cliente pretende o intenta la operación, la ITF la acepta, o hay relación con la Lista de Personas Bloqueadas. No condiciona las 24 horas a aceptar (SOFOM) ni a no realizar (Bancos). La sesión del Comité es el arranque de los 3 días hábiles del reporte ordinario.","ref":"DCG ITF art. 73; DCG SOFOM 33ª"},{"id":"F124","tema":"2.1.17","tipo":"caso","q":"Un banco y una ITF tienen cada uno 60 días naturales para dictaminar una Operación Inusual. ¿Desde cuándo corre el plazo en cada uno?","a":"Banco: desde que se genera la alerta; ITF: desde que detecta la Operación","o":["Banco: desde que se genera la alerta; ITF: desde que detecta la Operación","Ambos: desde que concluye la sesión del Comité que conoce el caso","Banco: desde que detecta la Operación; ITF: desde que se genera la alerta","Ambos: desde el último día hábil del mes en que se celebró la Operación"],"x":"En Bancos y en otras diez DCG los 60 días naturales corren desde que se genera la alerta (sistema, modelo, proceso o empleado, lo que ocurra primero); ITF los cuenta desde que detecta la Operación. La sesión del Comité es el punto de partida de los 3 días hábiles para reportar, no del dictamen.","ref":"DCG Bancos 37ª 1er párr.; DCG ITF art. 69"},{"id":"F125","tema":"2.1.17","tipo":"trampa","q":"El Manual de una casa de bolsa trae criterios para sumar 30 días naturales al dictamen de una Operación Inusual, como lo hace un banco. ¿Puede aplicarlos?","a":"No: la ampliación de 30 días sólo la prevé la DCG de Bancos","o":["Sí: todas las DCG la permiten si el Manual fija los criterios","Sí, pero sólo con autorización previa de la CNBV en cada caso","No: la ampliación de 30 días sólo la prevé la DCG de Bancos","Sí, aunque sólo para una Operación Interna Preocupante"],"x":"La ampliación de 30 días naturales existe sólo en Bancos, condicionada a que su Manual establezca los criterios conforme a las guías de la Secretaría, y no aplica a la Operación Interna Preocupante. La casa de bolsa tiene los 60 días naturales desde la alerta, sin ampliación.","ref":"DCG Bancos 37ª 2º párr.; DCG Casas de bolsa 38ª"},{"id":"F126","tema":"2.1.17","tipo":"caso","q":"Un asesor en inversiones dictamina una Operación Inusual. ¿Desde cuándo corren sus 3 días hábiles para enviar el reporte?","a":"Desde que su Representante la dictamina","o":["Desde que su Representante la dictamina","Desde que concluye la sesión del Comité que la dictamina","Desde que se generó la alerta en su sistema","Desde que el oficial de cumplimiento firma el dictamen"],"x":"Asesores no tiene Comité ni OC: dictamina el Representante (dentro de los mismos 60 días naturales desde la alerta) y los 3 días hábiles corren desde su dictamen. En Bancos y los demás corren desde que concluye la sesión del Comité. La alerta es el arranque del plazo para dictaminar, no para reportar.","ref":"DCG Asesores en inversiones 20ª; DCG Bancos 37ª"},{"id":"F127","tema":"2.1.17","tipo":"trampa","q":"¿Cuál de estos sujetos NO regula en su DCG el reporte de 24 horas cuando una persona con la que opera aparece en la Lista de Personas Bloqueadas?","a":"El asesor en inversiones","o":["El transmisor de dinero","La ITF","El centro cambiario","El asesor en inversiones"],"x":"Bancos y otras diez DCG ordenan suspender de inmediato y reportar en 24 horas con la leyenda «Lista de Personas Bloqueadas». La DCG de Asesores no regula la Lista. Transmisores, Centros cambiarios e ITF sí la regulan (Transmisores y Centros, para Usuarios; ITF, Fondos y Uniones, sólo para Clientes).","ref":"DCG Bancos 72ª fr. I-II; DCG Transmisores 62ª fr. II; DCG ITF art. 62 fr. II"},{"id":"F128","tema":"2.1.17","tipo":"memoria","q":"Bancos reevalúa el grado de riesgo de sus Clientes al menos cada 6 meses. ¿Cuál de estos sujetos fija en su DCG una sola evaluación por año calendario?","a":"El asesor en inversiones","o":["La casa de cambio","El asesor en inversiones","La SOFOM","La ITF"],"x":"Asesores: al menos una evaluación por año calendario. SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones: dos por año calendario. ITF: cada 6 meses, como Bancos. Casas de cambio, Centros cambiarios y Transmisores no fijan periodicidad.","ref":"DCG Asesores en inversiones 13ª; DCG Bancos 25ª Bis"},{"id":"F129","tema":"2.1.17","tipo":"caso","q":"Una SOFOM quiere copiar en su Manual la periodicidad de Bancos para reevaluar el riesgo de sus Clientes. ¿Qué dice su DCG?","a":"Al menos dos evaluaciones por año calendario","o":["Al menos una evaluación cada 6 meses, igual que Bancos","Al menos dos evaluaciones por año calendario","Al menos una evaluación por año calendario","No fija periodicidad: seguimiento continuo por alertas"],"x":"La SOFOM (como Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones) hace al menos dos evaluaciones por año calendario, sobre Clientes con contrato de al menos 6 meses. «Cada 6 meses» es la redacción de Bancos e ITF; el examen puede preguntar la redacción. Una por año es de Asesores.","ref":"DCG SOFOM 21ª; DCG Bancos 25ª Bis"},{"id":"F130","tema":"2.1.17","tipo":"caso","q":"Un centro cambiario quiere copiar en su Manual la periodicidad de Bancos para reevaluar el riesgo de sus Usuarios. ¿Qué dice su DCG?","a":"No fija periodicidad: seguimiento continuo por alertas","o":["Al menos una evaluación cada 6 meses, igual que Bancos","Al menos dos evaluaciones por año calendario, como la SOFOM","Al menos una evaluación por año calendario","No fija periodicidad: seguimiento continuo por alertas"],"x":"Centros cambiarios, Casas de cambio y Transmisores no fijan periodicidad: dan seguimiento continuo por alertas y reclasificación. Bancos e ITF: cada 6 meses; SOFOM y otros cinco: dos por año calendario; Asesores: una.","ref":"DCG Centros cambiarios 15ª; DCG Bancos 25ª Bis","par":"F129"},{"id":"F131","tema":"2.1.17","tipo":"caso","q":"Una ITF tiene Clientes de riesgo bajo, medio y alto. ¿Qué expedientes debe verificar al menos una vez al año?","a":"Los de todos sus Clientes, sin importar el grado de riesgo","o":["Los de todos sus Clientes, sin importar el grado de riesgo","Sólo los de Clientes de riesgo alto, igual que Bancos","Los de riesgo alto y medio; los de bajo, cada dos años","Sólo los de Clientes sin operar por más de 180 días naturales"],"x":"ITF verifica por lo menos una vez al año los expedientes de todos sus Clientes. Bancos y la mayoría lo hacen anualmente para los de Grado de Riesgo alto. Los 180 días naturales sin operar son una regla adicional de Transmisores para Usuarios no presenciales.","ref":"DCG ITF art. 24; DCG Bancos 21ª"},{"id":"F132","tema":"2.1.17","tipo":"caso","q":"Un Usuario identificado no presencialmente por un transmisor de dinero no ha operado en 200 días y vuelve a pretender un envío. Además de la revisión anual de riesgo alto, ¿qué exige su DCG?","a":"Confirmar que su expediente esté integrado, por pasar de 180 días naturales","o":["Nada adicional: aplica sólo la revisión anual de riesgo alto","Confirmar que su expediente esté integrado, por pasar de 180 días hábiles","Confirmar que su expediente esté integrado, por pasar de 180 días naturales","Darlo de baja y abrirle un expediente nuevo, por pasar de 90 días naturales sin operar"],"x":"Transmisores, además de la revisión anual de riesgo alto que comparte con Bancos, exige confirmar el expediente de Usuarios identificados no presencialmente que pasaron más de 180 días naturales sin operar, con independencia de su grado de riesgo, cuando pretendan volver a operar. Son naturales, no hábiles. Los 90 días naturales son del interinato del OC.","ref":"DCG Transmisores 12ª; DCG Bancos 21ª","par":"F131"},{"id":"F133","tema":"2.1.17","tipo":"caso","q":"Un asesor en inversiones y una casa de bolsa ejecutan una operación el mismo día. ¿Cuánto tiempo mínimo debe conservar cada uno su registro?","a":"Asesor: 5 años; casa de bolsa: 10 años","o":["Ambos: 10 años desde la ejecución","Asesor: 10 años; casa de bolsa: 5 años","Ambos: 5 años, como la metodología de riesgos","Asesor: 5 años; casa de bolsa: 10 años"],"x":"La regla general es no menos de 10 años desde la ejecución de la Operación (Bancos, Casas de bolsa y todos los demás); Asesores es la excepción con 5. Los 5 años también son la conservación de la metodología y del informe de auditoría, lo que alimenta la confusión.","ref":"DCG Asesores en inversiones 37ª; DCG Casas de bolsa 60ª"},{"id":"F134","tema":"2.1.17","tipo":"caso","q":"Un asesor en inversiones modifica su Manual. ¿Desde cuándo corren sus 20 días hábiles para enviarlo a la CNBV?","a":"Desde que su Representante elabora las modificaciones","o":["Desde que su comité de auditoría aprueba las modificaciones","Desde que su Representante elabora las modificaciones","Desde que su Comité de Comunicación y Control las aprueba","Desde que el comisario, el comité de auditoría o el Comité las aprueban"],"x":"El plazo es de 20 días hábiles en todos; lo que cambia es el arranque. Asesores no tiene comité que apruebe: corre desde que el Representante elabora los cambios. Bancos cuenta desde la aprobación del comité de auditoría; la fórmula de tres aprobadores es de ITF.","ref":"DCG Asesores en inversiones 38ª; DCG Bancos 64ª 5º párr."},{"id":"F135","tema":"2.1.17","tipo":"caso","q":"Un banco y una SOFOM suspenden a un Cliente que aparece en la Lista de Personas Bloqueadas. ¿Qué dicen sus DCG sobre el aviso al Cliente?","a":"Ambos avisan de inmediato; sólo el banco fija 10 días hábiles para acudir","o":["Ambos avisan de inmediato y fijan 10 días hábiles para acudir ante la autoridad","Banco: aviso inmediato; SOFOM: aviso dentro de 10 días hábiles","Ambos avisan de inmediato; sólo el banco fija 10 días hábiles para acudir","Ambos avisan dentro de las 24 horas siguientes a la suspensión"],"x":"Bancos avisa de inmediato, con fundamentos y causas, y la persona puede acudir a la autoridad dentro de 10 días hábiles desde que recibe el escrito. La SOFOM (como Casas de cambio, Centros cambiarios y Transmisores) avisa de inmediato, pero el texto del aviso no fija los 10 días hábiles. Las 24 horas son del reporte a la autoridad, no del aviso al Cliente.","ref":"DCG Bancos 72ª últ. párr.; DCG SOFOM 63ª últ. párr."},{"id":"F136","tema":"2.1.17","tipo":"caso","q":"Un transmisor de dinero suspende a un Usuario que aparece en la Lista y se lo avisa por escrito. ¿Desde cuándo cuentan los 10 días hábiles para que el Usuario se defienda ante la UIF?","a":"Desde que el Usuario conoce la suspensión","o":["Desde que el Usuario conoce la suspensión","Desde que el Usuario recibe el escrito de aviso","Desde que la UIF emite su resolución","Desde que el transmisor envía el reporte de 24 horas"],"x":"En Transmisores el aviso inmediato no fija días; los 10 días hábiles son los de la audiencia (63ª fr. I), contados desde que el interesado conoce la suspensión, ampliables una vez. «Desde que recibe el escrito» es la redacción del aviso de Bancos (72ª), que no está en la DCG de Transmisores.","ref":"DCG Transmisores 62ª últ. párr. y 63ª fr. I; DCG Bancos 72ª últ. párr."},{"id":"F137","tema":"2.1.17","tipo":"caso","q":"En una SOCAP y en una SOFIPO, la UIF resuelve sobre la permanencia de un socio en la Lista. ¿Qué plazos fija cada DCG para resolver y notificar?","a":"Ambas: resolver en 10 días hábiles; sólo SOFIPO fija 15 para notificar","o":["Ambas: resolver en 10 días hábiles y notificar en 15 días hábiles","Ambas: resolver en 10 días hábiles; sólo SOCAP fija 15 para notificar","Ambas: resolver en 10 días hábiles; sólo SOFIPO fija 15 para notificar","SOCAP: resolver en 15 días hábiles; SOFIPO: resolver en 10 días hábiles"],"x":"Las dos fijan 10 días hábiles para resolver desde que se presenta el interesado. Sólo SOFIPO agrega, como Bancos, la notificación por oficio dentro de 15 días hábiles desde la emisión. La trampa es suponer que SOCAP y SOFIPO, por ser sector de ahorro y crédito popular, son idénticas.","ref":"DCG SOFIPO 76ª fr. II; DCG SOCAP 76ª fr. II; DCG Bancos 73ª fr. II"},{"id":"F138","tema":"2.1.17","tipo":"caso","q":"En una casa de cambio y en un centro cambiario, la UIF resuelve sobre la permanencia de un Usuario en la Lista. ¿Cuál de las dos DCG fija 15 días hábiles para notificar la resolución?","a":"Sólo la del centro cambiario","o":["Sólo la del centro cambiario","Sólo la de la casa de cambio","Las dos, igual que Bancos","Las dos, pero en días naturales"],"x":"Fijan 15 días hábiles para notificar sólo Bancos, Fondos, SOFIPO, Centros cambiarios e ITF. Casas de cambio, como SOFOM, Casas de bolsa, SOCAP, Uniones y Transmisores, fija 10 días hábiles para resolver pero no plazo para notificar.","ref":"DCG Centros cambiarios 60ª fr. II; DCG Casas de cambio 62ª fr. II","par":"F137"},{"id":"F139","tema":"2.1.17","tipo":"caso","q":"Un banco (reforma DOF 28-ago-2024) y una SOFOM (reforma DOF 9-sep-2021) deben adecuar su Manual. ¿Qué plazo les dio su transitorio, desde la entrada en vigor?","a":"Banco: 18 meses; SOFOM: 4 meses","o":["Banco: 4 meses; SOFOM: 18 meses","Ambos: 18 meses desde la entrada en vigor","Banco: 12 meses; SOFOM: 9 meses","Banco: 18 meses; SOFOM: 4 meses"],"x":"La reforma 2024 dio a Bancos 18 meses para el Manual (12 para metodología, 18 para sistemas). Las reformas 2021 y 2023 de SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones, Centros cambiarios y Transmisores dieron 4 meses. Los 12 y 9 meses son de la metodología.","ref":"DCG Bancos 3ª trans. fr. I (2024); DCG SOFOM 4ª trans. fr. I (2021)"},{"id":"F140","tema":"2.1.17","tipo":"caso","q":"Un transmisor de dinero debe ajustar su metodología de riesgos a la reforma de sus DCG (DOF 5-abr-2023). ¿Qué plazo le dio el transitorio?","a":"9 meses desde la entrada en vigor","o":["12 meses desde la entrada en vigor, igual que Bancos","9 meses desde la entrada en vigor","4 meses desde la entrada en vigor","18 meses desde la entrada en vigor"],"x":"Las reformas 2021 y 2023 siguen el ritmo 4 · 9 · 18 meses (Manual, metodología, sistemas). Transmisores tuvo 9 meses para la metodología desde el 6-abr-2023. Bancos (2024) tuvo 12. Los 4 meses son del Manual y los 18, de los sistemas.","ref":"DCG Transmisores 4ª trans. fr. II (2023); DCG Bancos 3ª trans. (2024)"},{"id":"F141","tema":"2.1.17","tipo":"trampa","q":"Un centro cambiario estudia los transitorios de su reforma (DOF 19-ene-2023). ¿Para qué obligación fijan un plazo en meses?","a":"Sólo para modificar el Manual: 4 meses","o":["Para Manual, metodología y sistemas: 4, 9 y 18 meses","Sólo para modificar el Manual: 4 meses","Para Manual y metodología: 18 y 12 meses, como Bancos","Sólo para los sistemas automatizados: 18 meses"],"x":"La reforma 2023 de Centros cambiarios sólo da 4 meses para modificar el Manual y deja el informe cuantitativo para la fecha que fije la CNBV; no trae plazo para metodología ni sistemas. El esquema 4 · 9 · 18 es de los demás sujetos reformados en 2021 y 2023; 18 y 12, de Bancos 2024.","ref":"DCG Centros cambiarios 3ª y 4ª trans. (2023)"},{"id":"F142","tema":"2.1.17","tipo":"caso","q":"Al comparar el transitorio de Bancos (2024) con el de una unión de crédito (2023), ¿en qué plazo coinciden?","a":"Sistemas automatizados: 18 meses en ambos","o":["Manual de Cumplimiento: 18 meses en ambos","Metodología de riesgos: 12 meses en ambos","Certificación del oficial de cumplimiento: 12 meses","Sistemas automatizados: 18 meses en ambos"],"x":"Los 18 meses para sistemas automatizados coinciden en Bancos y en Uniones (y en SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO y Transmisores), cada uno contado desde la entrada en vigor de su propia reforma. El Manual (18 contra 4) y la metodología (12 contra 9) difieren; la certificación del OC sólo la trae Bancos.","ref":"DCG Bancos 3ª trans. (2024); DCG Uniones de crédito 4ª trans. fr. I-III (2023)"},{"id":"F143","tema":"2.1.17","tipo":"memoria","q":"¿Cuál de estos sujetos recibió en su reforma de 2021 un plazo de 6 meses para registrar la geolocalización por dirección IP?","a":"La casa d "4","carpeta":"m2-h4-ccc-oficial","pregunta":"2.1.9–2.1.10 · Comité de Comunicación y Control y oficial de cumplimiento","estado":"integrada"},{"n":"5","carpeta":"m2-h5-novedosos-cambios-itf","pregunta":"2.1.11–2.1.14 · Modelos novedosos, centros cambiarios, transmisores e ITF","estado":"integrada"},{"n":"6","carpeta":"m2-h6-sanciones-pr-plazos","pregunta":"2.1.15–2.1.17 · Sanciones, propietario real y plazos","estado":"integrada"},{"n":"7","carpeta":"m2-h7-tipologias","pregunta":"2.1 · Tipologías UIF y de organismos internacionales","estado":"integrada"},{"n":"8","carpeta":"m2-h8-lfpiorpi","pregunta":"2.2.1–2.2.2 · LFPIORPI: actividades vulnerables y uso de efectivo","estado":"integrada"}],"raiz":"../","actual":"m2-h6-sanciones-pr-plazos"}}

<script>
(function(){
const D = JSON.parse(document.getElementById("datos").textContent);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// «Por qué no las otras»: q.d = {texto de opción incorrecta: razón}; opts = opciones en el orden en que se muestran
const tuHTML=(q,txt)=>(txt&&txt!==q.a&&q.d&&q.d[txt])?`<div class="tu"><b>Por qué tu respuesta está mal</b>${esc(q.d[txt])}</div>`:"";
const distHTML=(q,opts)=>{ if(!q.d) return ""; const it=opts.map((o,k)=>q.d[o]?`<li><b>${"ABCD"[k]}</b> ${esc(q.d[o])}</li>`:"").join(""); return it?`<div class="dist"><div class="lbl">Por qué no las otras</div><ul>${it}</ul></div>`:""; };
const RUTA = D.meta.ruta||"financiero";
const ACENTOS = {financiero:["morado","turquesa"], av:["turquesa","coral"], transversal:["morado","coral"], gratuito:["morado","turquesa"]}[RUTA]||["morado","turquesa"];
const COLORES = ["c-principal","c-"+ACENTOS[0],"c-"+ACENTOS[1],"c-negro"];
const colorDe = (v,i)=>v?("c-"+v):COLORES[i%4];
document.documentElement.setAttribute("data-ruta", RUTA);
const RUTAS = {financiero:"Ruta Sector financiero", av:"Ruta Actividades vulnerables", transversal:"Transversales", gratuito:"Gratuitos"};

/* ---------- encabezado, portada, trampas, pie ---------- */
$("#brand").innerHTML = `<b>360EDUCA</b><span>${esc(D.meta.modulo||"")}</span><span class="ruta">${esc(RUTAS[D.meta.ruta||"financiero"])}</span>`;
$("#nav").innerHTML = D.secciones.filter(s=>s.nav).map(s=>`<a href="#${s.id}"${s.tipo==="simulador"?' class="cta"':""}>${esc(s.nav)}</a>`).join("");
/* ---------- modo sitio: franja de páginas (opcional) ---------- */
if(D.sitio && Array.isArray(D.sitio.paginas)){
  const S=D.sitio, raiz=S.raiz||"", act=S.actual||"";
  const ETQ={preparacion:"En preparación", proximamente:"Próximamente"};
  const actual=S.paginas.find(p=>p.carpeta===act);
  $("#sitebar").innerHTML = `<a class="sb-mod" href="${esc(raiz)}index.html"${act?"":' aria-current="page"'}>${esc(S.nombre||"Portada")}</a><span class="sb-sep"></span>`+
    S.paginas.map(p=>{
      const tip=p.tip||`${S.etiqueta_n!=null?S.etiqueta_n:"Sesión "}${p.n} · ${p.pregunta||""}`;
      if(p.estado && p.estado!=="integrada") return `<span class="sb-p off" title="${esc(tip)} · ${esc(ETQ[p.estado]||p.estado)}" aria-disabled="true">${esc(p.n)}</span>`;
      return `<a class="sb-p" href="${esc(raiz+p.carpeta)}/index.html" title="${esc(tip)}"${p.carpeta===act?' aria-current="page"':""}>${esc(p.n)}</a>`;
    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+
    (actual?`<span class="sb-ses">${actual.tip?esc(actual.tip):esc(S.etiqueta_n!=null?S.etiqueta_n:"Sesión ")+esc(actual.n)+" · "+esc(actual.pregunta||"")}</span>`:"");
  $("#sitebar").hidden=false;
}
const mapa0 = D.secciones.find(s=>s.tipo==="mapa");
let rhythm = "";
if(Array.isArray(D.meta.ritmo)){ // ritmo puesto a mano: [{n, lb, q, color}]
  const R0=D.meta.ritmo;
  rhythm = `<div><div class="rhythm${R0.length>4?" many":""}">${R0.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${esc(r.n)}</span><span class="lb">${esc(r.lb||"")}</span><span class="q">${esc(r.q||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${D.meta.ritmo_cap?esc(D.meta.ritmo_cap):`${R0.map(r=>r.n).join(" · ")} = ${R0.reduce((a,r)=>a+(+r.n||0),0)} ${esc(D.meta.unidad||"")}`}</div></div>`;
} else if(mapa0 && D.meta.ritmo!==false){
  const counts = mapa0.ramas.map(r=>r.items.length);
  rhythm = `<div><div class="rhythm${mapa0.ramas.length>4?" many":""}">${mapa0.ramas.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${r.items.length}</span><span class="lb">${esc(r.corto||r.letra)}</span><span class="q">${esc(r.ritmo||r.pregunta||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${counts.join(" · ")} = ${counts.reduce((a,b)=>a+b,0)} ${esc(D.meta.unidad||"")}</div></div>`;
}
$("#hero").innerHTML = `<div><div class="lbl">${esc(D.meta.eyebrow||"")}</div>
  <h1>${esc(D.meta.h1_antes||"")} <mark>${esc(D.meta.h1_resaltado||"")}</mark> ${esc(D.meta.h1_despues||"")}</h1>
  <p>${D.meta.intro||""}</p></div>${rhythm}`;
$("#traps").innerHTML = (D.trampas||[]).map((t,i)=>`<div class="trapc"><span class="tag">Trampa ${D.trampas.length>1?i+1:"de examen"}</span><p><b>${esc(t.titulo)}</b> ${t.texto}</p></div>`).join("");
if(!(D.trampas||[]).length) $("#traps").hidden=true;
$("#pie").innerHTML = `<b>GMC360 · 360Educa</b> — ${D.meta.fuente||""} Material didáctico; los textos están resumidos, consulta la publicación oficial para la redacción íntegra.`;

/* ---------- secciones ---------- */
const head = s=>!s.titulo?"":`<div class="sec-head"><h2>${esc(s.titulo)}</h2>${s.intro?`<p>${s.intro}</p>`:""}</div>${s.para?`<div class="para"><b>Para qué sirve</b>${s.para}</div>`:""}`;
const chant = f=>f?`<div class="chant"><div class="lbl">${esc(f.titulo||"Para recitar en voz alta")}</div><p>${f.html}</p></div>`:"";
const R = {};
let ITEMS = {}; // id -> {item, rama, color}
R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="frac"><button aria-expanded="false" data-ficha="${id}"><span class="rom">${esc(it.etiqueta)}</span><span><span class="nm">${esc(it.nombre)}</span><span class="hookt">${esc([it.verbo,it.gancho].filter(Boolean).join(" · "))}</span></span><span class="cnt">${esc(it.conteo||"")}</span></button><ul class="inc" hidden>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul></li>`}).join("")}</ul>`;
    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};
R.tarjetas = s=>head(s)+`<div class="cards">${s.tarjetas.map((c,i)=>{
  const col = colorDe(c.color,i);
  const top = c.encabezado?`<div class="chead"><div class="t">${esc(c.titulo)}</div>${c.subtitulo?`<div class="a">${esc(c.subtitulo)}</div>`:""}</div>`:(c.barra?`<div class="bar"></div>`:"");
  const body = c.filas? c.filas.map(f=>`<div class="frow"><span class="k">${esc(f.k)}</span>${f.v}</div>`).join("")
    : `<div class="cbody">${c.etiqueta?`<div class="lbl">${esc(c.etiqueta)}</div>`:""}${c.encabezado?"":`<h3>${esc(c.titulo)}</h3>`}${c.ref?`<span class="art">${esc(c.ref)}</span>`:""}${c.html?`<p>${c.html}</p>`:""}${c.lista?`<ul>${c.lista.map(l=>`<li>${l}</li>`).join("")}</ul>`:""}</div>`;
  return `<div class="card ${col}${c.ancho?" wide":""}">${top}${body}</div>`;}).join("")}</div>${s.nota?`<div class="note">${s.nota}</div>`:""}`;
R.escala = s=>{const cols=["var(--principal-linea)","#80bcb5","#a663cc","#ff8361","var(--oscuro)"];
  return head(s)+`<div class="card"><div class="cbody">${s.etiqueta?`<div class="lbl">${esc(s.etiqueta)}</div>`:""}${s.subtitulo?`<h3>${esc(s.subtitulo)}</h3>`:""}<div class="scale">${s.niveles.map((l,i)=>`<div class="lvl" style="--lc:${cols[i%5]}"><div class="n">${i+1}</div><div class="t">${esc(l.t)}</div><div class="d">${esc(l.d||"")}</div>${l.req?`<div class="req">${esc(l.req)}</div>`:""}</div>`).join("")}</div>${s.memo?`<p class="memo">${s.memo}</p>`:""}</div></div>`;};
R.pasos = s=>head(s)+`<ol class="track" style="--n:${s.pasos.length}" role="tablist" data-pasos="${s.id}">${s.pasos.map((p,i)=>`<li><button class="pill" role="tab" aria-selected="${i===0}" data-paso="${s.id}:${i}"><span class="circ">${i+1}</span><span class="nm">${esc(p.nombre)}</span></button></li>`).join("")}</ol><div class="stepd" id="stepd-${s.id}" role="tabpanel" aria-live="polite"></div>`+chant(s.frase);
R.flujo = s=>head(s)+`<div class="lanes">${s.carriles.map((c,i)=>`<div class="lane"><div class="lhead ${colorDe(c.color,i)}"><span class="t">${esc(c.titulo)}</span>${c.sub?`<span class="s">${esc(c.sub)}</span>`:""}</div><div class="flow">${c.nodos.map(n=>`<div class="node"><h4>${esc(n.titulo)}</h4>${n.ref?`<span class="art">${esc(n.ref)}</span>`:""}${n.texto?`<p>${n.texto}</p>`:""}${n.plazo?`<span class="plazo">${esc(n.plazo)}</span>`:""}${n.nota?`<p>${n.nota}</p>`:""}</div>`).join('<div class="arrow" aria-hidden="true">→</div>')}</div></div>`).join("")}</div>`;
R.cifras = s=>head(s)+`<div class="nums">${s.cifras.map(c=>`<div class="numt"><div class="v">${esc(c[0])}<small>${esc(c[1])}</small></div><div class="d">${esc(c[2])}</div><div class="r">${esc(c[3])}</div></div>`).join("")}</div>`;
R.simulador = s=>head({titulo:s.titulo||"Modo examen",para:s.para,intro:s.intro||"Opción múltiple con 4 opciones. Practica por tema en rondas de 10, o haz un simulacro de 30 o 50 que no repite reactivos hasta agotar el banco. Contesta con clic o con las teclas A, B, C, D."})+
  `<div class="simbar">${(s.tamanos||[30,50]).map(n=>`<button class="qsim" data-n="${+n}" aria-pressed="false">Simulacro de ${+n}</button>`).join("")}<span class="bankinfo" id="bankinfo"></span><button class="linkbtn" id="simReset">Reiniciar mi avance</button></div>
   <div class="lbl" style="margin-bottom:6px">O practica por tema (rondas de 10)</div><div class="modes" id="modes" role="group" aria-label="Tipo de práctica"></div><div class="quiz" id="quiz" aria-live="polite"></div>`;
R.repaso = s=>head({titulo:s.titulo||"Repaso",para:s.para,intro:s.intro||"Tandas al azar de un banco de repaso. Lee la pregunta y las cuatro opciones, decide tu respuesta y luego revélala."})+
  (s.fallas&&s.fallas.length?`${s.fallas_titulo?`<div class="lbl" style="margin:0 0 8px">${esc(s.fallas_titulo)}</div>`:""}<div class="cards rp-fallas">${s.fallas.map((f,i)=>`<div class="card ${colorDe(f.color,i)}"><div class="bar"></div><div class="cbody"><h3>${esc(f.titulo)}</h3><p>${f.texto}</p></div></div>`).join("")}</div>`:"")+
  `<div class="lbl" style="margin:22px 0 8px">${s.pool?"Elige cuántas preguntas":"Bloques"}</div><div class="modes" id="rpi-${s.id}" role="group" aria-label="Repaso"></div><div class="quiz rp-box" id="rp-${s.id}" aria-live="polite"></div>`;
/* ---------- tablero: matriz reporte × sujeto con filtros (tipo "tablero") ---------- */
R.tablero = s=>head(s)+`<div class="tbf" id="tbf-${s.id}"></div><div class="tbtabs" role="group" aria-label="Vista">${s.fichas===false?"":`<button class="fchip" data-tbv="${s.id}:tabla" aria-pressed="true">Tabla</button><button class="fchip" data-tbv="${s.id}:fichas" aria-pressed="false">${esc(s.fichas||"Fichas (base de reportes)")}</button>`}<button class="linkbtn" data-tbclr="${s.id}">Quitar filtros</button></div><div id="tbo-${s.id}"></div><div class="tbcount" id="tbn-${s.id}"></div>${s.nota?`<p class="note">${s.nota}</p>`:""}`;
/* ---------- cuatro tablas: práctica tipo examen (tipo "cuatrotablas") ---------- */

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}
document.fonts && document.fonts.ready.then(redraw); redraw();
