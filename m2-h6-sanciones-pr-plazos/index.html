r. VI y 26ª","par":"F037"},{"id":"F039","tema":"2.1.16","tipo":"caso","q":"Un banco abre una cuenta a una subsidiaria en la que una emisora que cotiza en bolsa tiene participación mayoritaria. Conforme a la 4ª VI, ¿qué ocurre con la identificación del PR?","a":"Aplica la excepción de la 4ª VI para cotizadas y sus subsidiarias con participación mayoritaria","o":["Aplica la excepción de la 4ª VI para cotizadas y sus subsidiarias con participación mayoritaria","Debe recabar los datos de cada accionista de la emisora que tenga el 25 % o más del capital","Debe aplicar la cascada y recabar los datos del administrador de la emisora controladora","Debe pedir la declaración del representante legal y una certificación de la Bolsa de Valores"],"x":"La 4ª VI exceptúa a las personas morales que cotizan en bolsa y a sus subsidiarias con participación mayoritaria. Por eso no se recorre ni el 25 % ni la cascada al administrador.","ref":"DCG Bancos 4ª fr. VI"},{"id":"F040","tema":"2.1.16","tipo":"trampa","q":"Un padre, que no es titular, deposita cada mes recursos en la cuenta de su hija adulta, quien los usa y dispone de ellos en su propio beneficio; el padre no obtiene beneficio alguno. ¿Qué figura es el padre?","a":"Proveedor de Recursos","o":["Propietario real","Beneficiario","Proveedor de Recursos","Cotitular de la cuenta"],"x":"Proveedor de Recursos es quien, sin ser titular, aporta recursos de manera regular sin obtener los beneficios (2ª XXXIII). El propietario real es quien obtiene los beneficios y es el verdadero dueño (2ª XXXII); el Beneficiario es el designado para el caso de fallecimiento (2ª III).","ref":"DCG Bancos 2ª fr. III, XXXII y XXXIII"},{"id":"F041","tema":"2.1.16","tipo":"memoria","q":"Además del verdadero dueño de los recursos y de quien ejerce el Control, ¿a quién comprende la definición de propietario real de la 2ª XXXII de Bancos?","a":"A quien pueda instruir, para su beneficio, actos mediante fideicomisos, mandatos o comisiones","o":["A la persona que aporta los recursos a la cuenta sin obtener los beneficios de ella","A la persona designada por el titular para recibir los recursos en caso de fallecimiento","A todo apoderado que firme el contrato en nombre del Cliente, aunque no se beneficie","A quien pueda instruir, para su beneficio, actos mediante fideicomisos, mandatos o comisiones"],"x":"La 2ª XXXII comprende también a quien pueda instruir o determinar, para su propio beneficio económico, actos realizados a través de fideicomisos, mandatos o comisiones. Quien aporta sin beneficiarse es Proveedor de Recursos; el designado por fallecimiento, Beneficiario.","ref":"DCG Bancos 2ª fr. XXXII"},{"id":"F042","tema":"2.1.16","tipo":"memoria","q":"En las DCG de Bancos, los datos del propietario real están en la 4ª fracción VI. ¿En qué fracción están en las DCG de casas de bolsa?","a":"4ª, fracción VII","o":["4ª, fracción VI","4ª, fracción VII","4ª, fracción III, inciso E","Art. 11, fracción VI"],"x":"Casas de bolsa tienen el PR en la 4ª VII; el contenido es igual al de Bancos, cambia la fracción. La 4ª VI es la de Bancos, SOFOM, asesores, fondos, SOCAP, SOFIPO y uniones; el art. 11 VI, la de ITF.","ref":"DCG casas de bolsa 4ª fr. VII"},{"id":"F043","tema":"2.1.16","tipo":"memoria","q":"En las DCG de Bancos, los datos del propietario real están en la 4ª fracción VI. ¿Dónde están en las DCG de casas de cambio?","a":"4ª, fracción III, inciso E","o":["4ª, fracción VII","4ª, fracción VI","4ª, fracción III, inciso E","Art. 11, fracción VI"],"x":"Casas de cambio y centros cambiarios tienen el PR en la 4ª III inciso E, referido a Usuarios y operaciones de 5,000 USD o más. La 4ª VII es la de casas de bolsa.","ref":"DCG casas de cambio 4ª fr. III, inciso E","par":"F042"},{"id":"F044","tema":"2.1.16","tipo":"cifra","q":"¿A partir de qué monto las DCG de casas de cambio y de centros cambiarios exigen integrar el expediente del Usuario con los datos del propietario real (4ª III inciso E)?","a":"5,000 USD o más","o":["5,000 USD o más","1,000 USD o más","7,500 USD o más","10,000 USD o más"],"x":"Su fracción de PR (4ª III inciso E) aplica a operaciones de 5,000 USD o más; igual en transmisores. 7,500 USD es el umbral de relevantes de Bancos, no el del PR. En casas de cambio, la fr. III se refiere a operaciones en efectivo o con cheques de viajero.","ref":"DCG casas de cambio y centros cambiarios 4ª fr. III, inciso E"},{"id":"F045","tema":"2.1.16","tipo":"caso","q":"Un banco recibe la declaración escrita del representante legal sobre quiénes son los PR de una sociedad cliente, pero hay indicios de que es falsa. ¿Qué dice la 4ª II c)?","a":"Que «deberán» tomar medidas razonables para identificar al PR","o":["Que «deberán» tomar medidas razonables para identificar al PR","Que «podrán» aceptar la declaración sin hacer nada más","Que «deberán» llevar a cabo «acciones», como en las ITF","Que deben cerrar la cuenta y avisar de inmediato a la UIF"],"x":"Ante indicios de falsedad, la 4ª II c) de Bancos dice que las Entidades «deberán tomar medidas razonables». La palabra «acciones» es la que usa la DCG de ITF para el mismo supuesto.","ref":"DCG Bancos 4ª fr. II, inciso c)"},{"id":"F046","tema":"2.1.16","tipo":"caso","q":"Una ITF tiene dudas sobre la declaración de quiénes son los PR de su Cliente persona moral. Frente a la redacción de Bancos, ¿qué término usa su DCG?","a":"Habla de llevar a cabo «acciones», no de «medidas razonables»","o":["Habla de «medidas razonables», exactamente igual que la de Bancos","Remite a los Lineamientos 2019 como única forma de verificar","Habla de llevar a cabo «acciones», no de «medidas razonables»","Ordena aplicar la cascada sin verificar la declaración recibida"],"x":"En ITF, ante dudas, la DCG habla de «acciones»; en Bancos, de «medidas razonables». Es una diferencia de redacción de la cascada del art. 11 II b), que además no menciona los derechos de voto.","ref":"DCG ITF art. 11, fr. II, inciso b)","par":"F045"},{"id":"F047","tema":"2.1.16","tipo":"caso","q":"Un banco que no actúa como fiduciario opera con un fideicomiso. ¿Qué documento le permite la 4ª IX usar para cumplir con el contrato del fideicomiso y con los datos del PR?","a":"Una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria","o":["Una certificación del capital del fideicomiso, firmada por el secretario de su comité técnico","Una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria","Una declaración del fideicomitente, ratificada ante la CNBV, sobre quiénes son los fideicomisarios","Un dictamen del auditor externo del fideicomiso sobre la identidad de sus propietarios reales"],"x":"La 4ª IX de Bancos permite («podrán») a la entidad que no es fiduciaria cumplir mediante una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria. Es una opción, no una exigencia; la DCG de ITF no la prevé.","ref":"DCG Bancos 4ª fr. IX"},{"id":"F048","tema":"2.1.16","tipo":"caso","q":"En una ITF, el propietario real de un Cliente es un fideicomiso. ¿Qué prevé el art. 11 VI de sus DCG?","a":"Identificar a los fideicomitentes o fideicomisarios; no prevé la opción de la constancia del delegado fiduciario","o":["Cumplir mediante la constancia del delegado fiduciario y del oficial de cumplimiento, como permite Bancos","Aplicar el numeral sobre fideicomisos de los Lineamientos 2019 como único criterio de identificación","Considerar al delegado fiduciario como propietario real y recabar sólo sus datos de identificación","Identificar a los fideicomitentes o fideicomisarios; no prevé la opción de la constancia del delegado fiduciario"],"x":"En ITF, si el PR es un fideicomiso, se identifica a fideicomitentes o fideicomisarios; su DCG no prevé la opción de cumplir con la constancia del delegado fiduciario que la 4ª IX da a Bancos. Los Lineamientos 2019 no tienen numeral sobre fideicomisos.","ref":"DCG ITF art. 11, fr. VI","par":"F047"},{"id":"F049","tema":"2.1.16","tipo":"caso","q":"Una SOFOM, una casa de cambio, un centro cambiario y un transmisor reciben transferencias ordenadas por otros sujetos obligados. ¿En cuál presume su DCG, como la de Bancos, que el ordenante actúa por cuenta de sus clientes?","a":"En la casa de cambio","o":["En la SOFOM","En el centro cambiario","En la casa de cambio","En el transmisor de dinero"],"x":"La presunción de Bancos (31ª) la repiten casas de cambio, SOCAP, SOFIPO y, respecto de «entidades financieras», casas de bolsa. SOFOM, centros cambiarios y transmisores no la prevén: la presunción no sigue familias.","ref":"DCG Bancos 31ª; DCG casas de cambio 22ª"},{"id":"F050","tema":"2.1.16","tipo":"caso","q":"Un banco atiende a una asociación civil clasificada de riesgo alto. ¿Qué procedimiento sobre su propietario real debe prever el Manual conforme a la 32ª II?","a":"Identificar a quien ejerza el Control, independientemente del porcentaje","o":["Identificar a quien ejerza el Control, independientemente del porcentaje","Identificar sólo a los asociados con el 25 % o más de las aportaciones","Identificar sólo a quien vote más del 50 % en la asamblea de asociados","Tomar como PR al presidente del consejo directivo, sin más análisis"],"x":"Para sociedades o asociaciones civiles de riesgo alto, la 32ª II pide identificar a quien tenga el Control «independientemente del porcentaje»: aquí no opera el umbral del 25 %.","ref":"DCG Bancos 32ª, fr. II"},{"id":"F101","tema":"2.1.17","tipo":"caso","q":"Una casa de cambio y un centro cambiario designan a su nuevo oficial de cumplimiento el mismo día. ¿Qué plazo tiene cada uno para avisarlo a la Secretaría, por conducto de la CNBV?","a":"Casa de cambio: 2 días hábiles; centro cambiario: 10 días hábiles","o":["Ambos: 2 días hábiles desde la designación, igual que Bancos","Casa de cambio: 10 días hábiles; centro cambiario: 2 días hábiles","Casa de cambio: 2 días hábiles; centro cambiario: 10 días hábiles","Casa de cambio: día hábil siguiente; centro cambiario: 10 días hábiles"],"x":"Sólo Bancos (reforma 2024) y Casas de cambio avisan la designación del OC en 2 días hábiles; Centros cambiarios, como SOFOM, Transmisores, ITF y los demás, en 10. La trampa es suponer que el centro cambiario sigue a la casa de cambio. El «día hábil siguiente» de la casa de cambio es para la revocación y el interino, no para la designación.","ref":"DCG Casas de cambio 39ª fr. I; DCG Centros cambiarios 35ª fr. I; DCG Bancos 48ª fr. I"},{"id":"F102","tema":"2.1.17","tipo":"memoria","q":"Bancos no prevé informar quién ejerce el Control de la Entidad. ¿Cuál de estos sujetos tiene 20 días hábiles desde que la CNBV le otorga el registro para presentar ese informe inicial?","a":"El centro cambiario","o":["El centro cambiario","La SOCAP","La SOFOM","La casa de cambio"],"x":"Centros cambiarios tiene 20 días hábiles desde el registro para el informe inicial y 10 días hábiles para los cambios. SOFOM, SOCAP, SOFIPO, Casas de cambio y Transmisores fijan 10 días hábiles desde que los accionistas o socios comunican el Control. El distractor más tentador es la casa de cambio, por ser del mismo giro cambiario: fija 10 días hábiles, no 20.","ref":"DCG Centros cambiarios 50ª 1er párr.; DCG Casas de cambio 52ª 1er párr."},{"id":"F103","tema":"2.1.17","tipo":"caso","q":"El lunes una casa de cambio revoca el nombramiento de su oficial de cumplimiento. ¿Cuándo vence su plazo para avisar la revocación?","a":"Al día hábil siguiente a la revocación","o":["Dentro de los 2 días hábiles, igual que la designación","Dentro de los 10 días hábiles, igual que Bancos","Dentro de los 15 días hábiles, como los cambios al Comité","Al día hábil siguiente a la revocación"],"x":"La casa de cambio es la única que avisa la revocación (y la designación del interino) al día hábil siguiente; Bancos y los demás sujetos con OC tienen 10 días hábiles. Los 2 días hábiles son de la designación, no de la revocación.","ref":"DCG Casas de cambio 39ª fr. II; DCG Bancos 48ª fr. II"},{"id":"F104","tema":"2.1.17","tipo":"caso","q":"El lunes un transmisor de dinero revoca el nombramiento de su oficial de cumplimiento. ¿Qué plazo tiene para avisar la revocación?","a":"10 días hábiles desde que ocurrió la revocación","o":["El día hábil siguiente, igual que la casa de cambio","10 días hábiles desde que ocurrió la revocación","2 días hábiles desde que ocurrió la revocación","15 días hábiles desde que el consejo apruebe la revocación"],"x":"Transmisores sigue a Bancos: 10 días hábiles desde que ocurrió la revocación. El día hábil siguiente es exclusivo de Casas de cambio; los 2 días hábiles son de la designación en Bancos y Casas de cambio, y no en Transmisores (10).","ref":"DCG Transmisores 37ª fr. II; DCG Bancos 48ª fr. II","par":"F103"},{"id":"F105","tema":"2.1.17","tipo":"caso","q":"Una ITF autorizada con 18 personas a su servicio no constituye Comité de Comunicación y Control. ¿Qué plazo tiene para comunicar esa situación?","a":"60 días hábiles desde su autorización","o":["15 días hábiles, igual que un banco con menos de 25 personas","60 días hábiles desde su autorización","60 días naturales desde que inicie operaciones","10 días hábiles desde que designe al oficial de cumplimiento"],"x":"ITF usa el mismo criterio de menos de 25 personas que Bancos, pero comunica en 60 días hábiles, contados desde la autorización o desde que se reduzca el número de personas. Bancos y la mayoría lo comunican en los mismos 15 días hábiles del aviso del Comité. Ojo: son hábiles, no naturales.","ref":"DCG ITF art. 48 últ. párr.; DCG Bancos 44ª últ. párr. y 46ª"},{"id":"F106","tema":"2.1.17","tipo":"caso","q":"Una unión de crédito tiene 20 personas a su servicio, 400 socios y activos por 80 millones de UDIS. ¿Puede dejar de constituir el Comité?","a":"No: para no tenerlo necesita, además, menos de 10 personas","o":["Sí: basta tener menos de 25 personas, como en Bancos","Sí: basta con que sus activos sean menores a 100 millones de UDIS","Sí, si lo comunica dentro de 60 días hábiles, como una ITF","No: para no tenerlo necesita, además, menos de 10 personas"],"x":"Uniones exige tres topes a la vez: menos de 10 personas, menos de 500 socios y activos menores a 100 millones de UDIS. Aquí cumple socios y activos, pero no el de personas. El criterio de menos de 25 personas es el de Bancos y la mayoría; los 60 días hábiles son de ITF.","ref":"DCG Uniones de crédito 35ª últ. párr.; DCG Bancos 44ª últ. párr."},{"id":"F107","tema":"2.1.17","tipo":"caso","q":"Una SOCAP con nivel de operación I y 40 personas a su servicio decide no constituir el Comité. ¿Qué rige su caso?","a":"Por su nivel I puede no tenerlo y lo comunica en 15 días hábiles","o":["Por su nivel I puede no tenerlo y lo comunica en 15 días hábiles","Debe tenerlo, porque rebasa el tope de 25 personas de Bancos","Puede no tenerlo, pero lo comunica en 60 días hábiles, como ITF","Debe tenerlo, porque rebasa el tope de 10 personas de las Uniones"],"x":"En SOCAP el criterio no es el número de personas sino el nivel de operación: las de nivel I no constituyen Comité y lo comunican en 15 días hábiles. El tope de 25 personas es de Bancos y la mayoría; el de 10 personas (con socios y activos) es de Uniones; los 60 días hábiles, de ITF.","ref":"DCG SOCAP 48ª últ. párr. y 50ª; DCG Uniones de crédito 35ª últ. párr.","par":"F106"},{"id":"F108","tema":"2.1.17","tipo":"caso","q":"Un asesor en inversiones nombra a la persona que cumplirá las funciones de su régimen PLD/FT. ¿Qué plazo tiene para informar el nombramiento?","a":"15 días hábiles: es su Representante, no un OC","o":["2 días hábiles, como el OC de Bancos","10 días hábiles, como el OC de los demás sujetos","15 días hábiles: es su Representante, no un OC","No informa nada: su DCG no prevé avisos de nombramiento"],"x":"Asesores no tiene OC ni Comité: su figura es el Representante, cuyo nombramiento informa dentro de los 15 días hábiles siguientes. Los 2 y 10 días hábiles son del OC de Bancos y de los demás. Bancos no prevé la figura de Representante.","ref":"DCG Asesores en inversiones 31ª"},{"id":"F109","tema":"2.1.17","tipo":"caso","q":"Un transmisor de dinero inscribe en el registro del art. 128 de la LGSM la transmisión del 3 % de su capital pagado. ¿Qué plazo tiene para informarlo?","a":"3 días hábiles desde que la inscribe en el registro","o":["10 días hábiles desde que la inscribe en el registro","3 días hábiles desde que se firma la compraventa","No informa: su DCG, como la de Bancos, no lo prevé","3 días hábiles desde que la inscribe en el registro"],"x":"Transmisores (como SOFOM y Centros cambiarios) informa la transmisión de más del 2 % en 3 días hábiles, contados desde la inscripción en el registro del art. 128 LGSM, no desde la operación. Los 10 días hábiles son de Casas de cambio. Bancos no lo prevé.","ref":"DCG Transmisores 53ª 3er párr."},{"id":"F110","tema":"2.1.17","tipo":"caso","q":"Una casa de cambio inscribe en el registro del art. 128 de la LGSM la transmisión del 3 % de su capital pagado. ¿Qué plazo tiene para informarlo?","a":"10 días hábiles desde que la inscribe en el registro","o":["3 días hábiles desde que la inscribe en el registro","10 días hábiles desde que la inscribe en el registro","El día hábil siguiente a que la inscribe en el registro","No informa: su DCG, como la de Bancos, no lo prevé"],"x":"Casas de cambio tiene 10 días hábiles desde la inscripción; Centros cambiarios, Transmisores y SOFOM, 3. El día hábil siguiente de la casa de cambio es para la revocación del OC y el interino. Bancos no prevé este informe.","ref":"DCG Casas de cambio 52ª 3er párr.; DCG Centros cambiarios 50ª 3er párr.","par":"F109"},{"id":"F111","tema":"2.1.17","tipo":"caso","q":"Un transmisor de dinero recibe de un Usuario 6,000 dólares en billetes para un envío. Para efectos de Operaciones Relevantes, ¿qué aplica?","a":"Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre","o":["No es Relevante: el umbral es de 7,500 dólares, igual que en Bancos","Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre","Es Relevante y va dentro de los 15 días hábiles siguientes al cierre del mes"],"x":"Transmisores usa umbral de 5,000 USD y reporta en los 10 ÚLTIMOS días hábiles de enero, abril, julio y octubre (igual que SOFOM y Centros cambiarios). Bancos: 7,500 USD y 10 primeros días hábiles. Los 15 días hábiles mensuales son de transferencias internacionales.","ref":"DCG Transmisores 2ª fr. XXVII y 23ª; DCG Bancos 34ª"},{"id":"F112","tema":"2.1.17","tipo":"caso","q":"Una SOFOM recibe de un Cliente 6,000 dólares en billetes para pagar un crédito. Para efectos de Operaciones Relevantes, ¿qué aplica?","a":"No es Relevante: la SOFOM usa el umbral de 7,500 dólares","o":["No es Relevante: la SOFOM usa el umbral de 7,500 dólares","Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre","Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","Va en el reporte trimestral de efectivo en dólares, no en el de Relevantes"],"x":"La SOFOM comparte con Transmisores el calendario de los 10 últimos días hábiles, pero no su umbral: usa 7,500 USD, como Bancos. Con 6,000 USD no hay Relevante. Tampoco tiene reporte de efectivo en dólares (sus montos en USD sólo sirven para registro y alertas).","ref":"DCG SOFOM 2ª fr. XXVII y 28ª","par":"F111"},{"id":"F113","tema":"2.1.17","tipo":"caso","q":"Una ITF recibe de un Cliente 6,000 dólares en billetes. Para efectos de Operaciones Relevantes, ¿qué aplica?","a":"Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","o":["No es Relevante: el umbral es de 7,500 dólares, igual que en Bancos","Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre, como Transmisores","Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","Sólo cuenta si se trata de cheques de viajero o monedas de oro, plata o platino"],"x":"ITF usa el umbral de 5,000 USD, como Transmisores, pero sólo en billetes y monedas metálicas, y reporta en los 10 PRIMEROS días hábiles, como Bancos. Combina el umbral de los transmisores con el calendario de Bancos.","ref":"DCG ITF art. 2 fr. XXIV y art. 66; DCG Transmisores 23ª","par":"F111"},{"id":"F114","tema":"2.1.17","tipo":"caso","q":"Un socio de una SOCAP deposita cheques de viajero por 8,000 dólares. ¿Encuadra en la definición de Operación Relevante de su DCG?","a":"No: su definición sólo abarca billetes y monedas metálicas","o":["No: su definición sólo abarca billetes y monedas metálicas","Sí: rebasa el umbral de 7,500 dólares, igual que en Bancos y Casas de bolsa","Sí: en la SOCAP el umbral es de 5,000 dólares","No: en la SOCAP el umbral es de 10,000 dólares"],"x":"SOCAP (y SOFIPO) conservan los 7,500 USD de Bancos, pero su definición sólo incluye billetes y monedas metálicas de curso legal: no cheques de viajero ni monedas de platino, oro o plata. Los 5,000 USD son de Centros, Transmisores e ITF; los 10,000 USD, del reporte de cheques de caja de Bancos.","ref":"DCG SOCAP 2ª fr. XXIX; DCG Bancos 2ª fr. XXX"},{"id":"F115","tema":"2.1.17","tipo":"memoria","q":"¿Cuál de estos sujetos reporta efectivo en dólares sólo por compras a sus Clientes de 500 dólares o más, sin umbral para Usuarios?","a":"La unión de crédito","o":["La SOFIPO","La casa de bolsa","La SOCAP","La unión de crédito"],"x":"Uniones reporta sólo operaciones de compra en efectivo con USD de Clientes desde 500 USD, sin umbral de Usuarios. SOFIPO, SOCAP y Casas de bolsa usan los dos umbrales de Bancos (Clientes ≥ 500 USD; Usuarios > 250 USD); SOCAP, como Uniones, sólo reporta compras, y Casas de bolsa no incluye depósitos.","ref":"DCG Uniones de crédito 27ª; DCG SOCAP 38ª; DCG Bancos 34ª Bis"},{"id":"F116","tema":"2.1.17","tipo":"caso","q":"Un centro cambiario compra a un Usuario 1,200 dólares en efectivo. ¿Qué reporte genera y cuándo lo envía?","a":"Reporte de compras; 10 últimos días hábiles de enero, abril, julio y octubre","o":["No genera reporte: sólo reporta desde 5,000 dólares, como en Relevantes","Reporte de compras; 10 últimos días hábiles de enero, abril, julio y octubre","Reporte de compras; 10 primeros días hábiles de enero, abril, julio y octubre","Reporte mensual, dentro de los 15 días hábiles siguientes al cierre del mes"],"x":"Centros cambiarios reporta cada compra en efectivo de más de 1,000 USD, sin tope superior, en los 10 ÚLTIMOS días hábiles de enero, abril, julio y octubre por el trimestre anterior. Los 5,000 USD son su umbral de Relevantes; los 10 primeros días hábiles son el calendario de Bancos.","ref":"DCG Centros cambiarios 23ª"},{"id":"F117","tema":"2.1.17","tipo":"trampa","q":"Un centro cambiario compra a un Usuario 6,000 dólares en efectivo. Por esa operación, ¿de qué reporte queda liberado?","a":"Del reporte de Operaciones Relevantes de la 22ª","o":["Del reporte de compras de más de 1,000 dólares de la 23ª","Del reporte de Operaciones Relevantes de la 22ª","Del reporte de montos totales de divisas de la 49ª","Del informe cuantitativo anual de la 48ª Bis"],"x":"La compra en efectivo de 5,000 USD o más SÍ se reporta por la 23ª y, por ella, el centro NO presenta el reporte de Relevantes de la 22ª. Es el mismo mecanismo de Bancos (34ª Bis), pero allá opera desde 7,500 USD. El error común es creer que la operación grande «se va» a Relevantes.","ref":"DCG Centros cambiarios 23ª últ. párr.; DCG Bancos 34ª Bis últ. párr."},{"id":"F118","tema":"2.1.17","tipo":"caso","q":"Una SOFIPO y una unión de crédito envían cada una al extranjero una transferencia de 2,000 dólares. ¿Qué deben reportar?","a":"SOFIPO: reporte mensual en 15 días hábiles; la Unión no tiene ese reporte","o":["Ambas: reporte mensual dentro de los 15 días hábiles siguientes al último día hábil del mes","Ambas: reporte trimestral en los 10 primeros días hábiles del trimestre","SOFIPO: reporte trimestral en 10 días hábiles; la Unión, mensual en 15","SOFIPO: reporte mensual en 15 días hábiles; la Unión no tiene ese reporte"],"x":"SOFIPO, como Bancos, reporta transferencias internacionales desde 1,000 USD, mensualmente, dentro de los 15 días hábiles siguientes al último día hábil del mes anterior. La DCG de Uniones no prevé este reporte (tampoco SOFOM, Asesores, Fondos ni Centros cambiarios). La trampa es suponer que la Unión sigue a SOCAP y SOFIPO.","ref":"DCG SOFIPO 38ª; DCG Bancos 35ª y 36ª"},{"id":"F119","tema":"2.1.17","tipo":"cifra","q":"Bancos reporta ventas de activos virtuales desde 2,250 dólares. ¿Desde qué monto reporta las ventas una ITF?","a":"7,500 UDIS","o":["7,500 UDIS","2,250 dólares","7,500 dólares","5,000 dólares"],"x":"Sólo Bancos e ITF tienen este reporte trimestral (10 primeros días hábiles). Bancos: compras sin monto mínimo y ventas desde 2,250 USD; ITF: ventas desde 7,500 UDIS. Los 7,500 y 5,000 dólares son umbrales de Relevantes, no de activos virtuales.","ref":"DCG ITF art. 74; DCG Bancos 34ª Quáter"},{"id":"F120","tema":"2.1.17","tipo":"memoria","q":"¿Cuál de estos sujetos presenta, igual que Bancos, el informe cuantitativo anual en los 10 últimos días hábiles de abril?","a":"El transmisor de dinero","o":["La SOFOM","La casa de bolsa","El transmisor de dinero","La casa de cambio"],"x":"El informe cuantitativo anual lo prevén Bancos, Asesores, Uniones, Centros cambiarios y Transmisores, en los 10 últimos días hábiles de abril. SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO, Casas de cambio e ITF no lo prevén. No confundir «últimos» de abril con los «últimos» trimestrales de Relevantes.","ref":"DCG Transmisores 52ª Bis; DCG Bancos 60ª Bis"},{"id":"F121","tema":"2.1.17","tipo":"caso","q":"Ante sospecha fundada sobre una operación que se pretende realizar, ¿a qué decisión liga expresamente cada DCG el plazo de 24 horas: la de Bancos y la de la SOFOM?","a":"Banco: a no realizar la operación; SOFOM: a aceptarla","o":["Banco: a aceptarla; SOFOM: a no realizar la operación","Ambos: a aceptarla, y si no la realizan no reportan","Banco: a no realizar la operación; SOFOM: a aceptarla","Ninguno: las 24 horas corren desde la sesión del Comité"],"x":"Bancos 41ª: «podrá no llevar a cabo» la operación y, en tal caso, reporta dentro de las 24 horas con leyenda LD o FT. SOFOM 33ª: «en el evento en que decida aceptar» la operación, reporta dentro de las 24 horas con la leyenda «Reporte de 24 horas». En ambos, el otro supuesto se reporta «en los términos» de la propia disposición: se reporta la acepte o no. La lógica está invertida.","ref":"DCG Bancos 41ª; DCG SOFOM 33ª"},{"id":"F122","tema":"2.1.17","tipo":"cifra","q":"Bancos y SOFOM regulan el reporte de 24 horas por sospecha fundada. ¿Qué leyenda inserta cada uno en la columna de descripción?","a":"Banco: «Reporte de 24 horas LD» o «FT»; SOFOM: «Reporte de 24 horas»","o":["Ambos: «Reporte de 24 horas LD» o «FT», según el delito","Banco: «Reporte de 24 horas LD» o «FT»; SOFOM: «Reporte de 24 horas»","Banco: «Reporte de 24 horas»; SOFOM: «Reporte de 24 horas LD» o «FT»","Ambos: «Lista de Personas Bloqueadas», por ser de 24 horas"],"x":"La leyenda diferenciada LD/FT es exclusiva de Bancos (41ª); la SOFOM y las otras nueve DCG con este régimen usan la leyenda única «Reporte de 24 horas» (33ª). «Lista de Personas Bloqueadas» es la leyenda del reporte por la LPB, no la de sospecha fundada.","ref":"DCG Bancos 41ª; DCG SOFOM 33ª","par":"F121"},{"id":"F123","tema":"2.1.17","tipo":"caso","q":"Una ITF detecta que un Cliente pretende realizar una operación con recursos de posible origen ilícito. ¿Desde cuándo corren sus 24 horas para reportar?","a":"Desde que la conoce por la alerta o por el informe de un empleado","o":["Desde que decide aceptar la operación, sin importar cuándo la conoció","Desde que concluye la sesión del Comité que la dictamina","Desde que la conoce por la alerta o por el informe de un empleado","Desde que decide no realizarla, como un banco"],"x":"La ITF reporta en no más de 24 horas desde que conoce la operación por la alerta o el informe de un empleado, en tres supuestos: el Cliente pretende o intenta la operación, la ITF la acepta, o hay relación con la Lista de Personas Bloqueadas. No condiciona las 24 horas a aceptar (SOFOM) ni a no realizar (Bancos). La sesión del Comité es el arranque de los 3 días hábiles del reporte ordinario.","ref":"DCG ITF art. 73; DCG SOFOM 33ª"},{"id":"F124","tema":"2.1.17","tipo":"caso","q":"Un banco y una ITF tienen cada uno 60 días naturales para dictaminar una Operación Inusual. ¿Desde cuándo corre el plazo en cada uno?","a":"Banco: desde que se genera la alerta; ITF: desde que detecta la Operación","o":["Banco: desde que se genera la alerta; ITF: desde que detecta la Operación","Ambos: desde que concluye la sesión del Comité que conoce el caso","Banco: desde que detecta la Operación; ITF: desde que se genera la alerta","Ambos: desde el último día hábil del mes en que se celebró la Operación"],"x":"En Bancos y en otras diez DCG los 60 días naturales corren desde que se genera la alerta (sistema, modelo, proceso o empleado, lo que ocurra primero); ITF los cuenta desde que detecta la Operación. La sesión del Comité es el punto de partida de los 3 días hábiles para reportar, no del dictamen.","ref":"DCG Bancos 37ª 1er párr.; DCG ITF art. 69"},{"id":"F125","tema":"2.1.17","tipo":"trampa","q":"El Manual de una casa de bolsa trae criterios para sumar 30 días naturales al dictamen de una Operación Inusual, como lo hace un banco. ¿Puede aplicarlos?","a":"No: la ampliación de 30 días sólo la prevé la DCG de Bancos","o":["Sí: todas las DCG la permiten si el Manual fija los criterios","Sí, pero sólo con autorización previa de la CNBV en cada caso","No: la ampliación de 30 días sólo la prevé la DCG de Bancos","Sí, aunque sólo para una Operación Interna Preocupante"],"x":"La ampliación de 30 días naturales existe sólo en Bancos, condicionada a que su Manual establezca los criterios conforme a las guías de la Secretaría, y no aplica a la Operación Interna Preocupante. La casa de bolsa tiene los 60 días naturales desde la alerta, sin ampliación.","ref":"DCG Bancos 37ª 2º párr.; DCG Casas de bolsa 38ª"},{"id":"F126","tema":"2.1.17","tipo":"caso","q":"Un asesor en inversiones dictamina una Operación Inusual. ¿Desde cuándo corren sus 3 días hábiles para enviar el reporte?","a":"Desde que su Representante la dictamina","o":["Desde que su Representante la dictamina","Desde que concluye la sesión del Comité que la dictamina","Desde que se generó la alerta en su sistema","Desde que el oficial de cumplimiento firma el dictamen"],"x":"Asesores no tiene Comité ni OC: dictamina el Representante (dentro de los mismos 60 días naturales desde la alerta) y los 3 días hábiles corren desde su dictamen. En Bancos y los demás corren desde que concluye la sesión del Comité. La alerta es el arranque del plazo para dictaminar, no para reportar.","ref":"DCG Asesores en inversiones 20ª; DCG Bancos 37ª"},{"id":"F127","tema":"2.1.17","tipo":"trampa","q":"¿Cuál de estos sujetos NO regula en su DCG el reporte de 24 horas cuando una persona con la que opera aparece en la Lista de Personas Bloqueadas?","a":"El asesor en inversiones","o":["El transmisor de dinero","La ITF","El centro cambiario","El asesor en inversiones"],"x":"Bancos y otras diez DCG ordenan suspender de inmediato y reportar en 24 horas con la leyenda «Lista de Personas Bloqueadas». La DCG de Asesores no regula la Lista. Transmisores, Centros cambiarios e ITF sí la regulan (Transmisores y Centros, para Usuarios; ITF, Fondos y Uniones, sólo para Clientes).","ref":"DCG Bancos 72ª fr. I-II; DCG Transmisores 62ª fr. II; DCG ITF art. 62 fr. II"},{"id":"F128","tema":"2.1.17","tipo":"memoria","q":"Bancos reevalúa el grado de riesgo de sus Clientes al menos cada 6 meses. ¿Cuál de estos sujetos fija en su DCG una sola evaluación por año calendario?","a":"El asesor en inversiones","o":["La casa de cambio","El asesor en inversiones","La SOFOM","La ITF"],"x":"Asesores: al menos una evaluación por año calendario. SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones: dos por año calendario. ITF: cada 6 meses, como Bancos. Casas de cambio, Centros cambiarios y Transmisores no fijan periodicidad.","ref":"DCG Asesores en inversiones 13ª; DCG Bancos 25ª Bis"},{"id":"F129","tema":"2.1.17","tipo":"caso","q":"Una SOFOM quiere copiar en su Manual la periodicidad de Bancos para reevaluar el riesgo de sus Clientes. ¿Qué dice su DCG?","a":"Al menos dos evaluaciones por año calendario","o":["Al menos una evaluación cada 6 meses, igual que Bancos","Al menos dos evaluaciones por año calendario","Al menos una evaluación por año calendario","No fija periodicidad: seguimiento continuo por alertas"],"x":"La SOFOM (como Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones) hace al menos dos evaluaciones por año calendario, sobre Clientes con contrato de al menos 6 meses. «Cada 6 meses» es la redacción de Bancos e ITF; el examen puede preguntar la redacción. Una por año es de Asesores.","ref":"DCG SOFOM 21ª; DCG Bancos 25ª Bis"},{"id":"F130","tema":"2.1.17","tipo":"caso","q":"Un centro cambiario quiere copiar en su Manual la periodicidad de Bancos para reevaluar el riesgo de sus Usuarios. ¿Qué dice su DCG?","a":"No fija periodicidad: seguimiento continuo por alertas","o":["Al menos una evaluación cada 6 meses, igual que Bancos","Al menos dos evaluaciones por año calendario, como la SOFOM","Al menos una evaluación por año calendario","No fija periodicidad: seguimiento continuo por alertas"],"x":"Centros cambiarios, Casas de cambio y Transmisores no fijan periodicidad: dan seguimiento continuo por alertas y reclasificación. Bancos e ITF: cada 6 meses; SOFOM y otros cinco: dos por año calendario; Asesores: una.","ref":"DCG Centros cambiarios 15ª; DCG Bancos 25ª Bis","par":"F129"},{"id":"F131","tema":"2.1.17","tipo":"caso","q":"Una ITF tiene Clientes de riesgo bajo, medio y alto. ¿Qué expedientes debe verificar al menos una vez al año?","a":"Los de todos sus Clientes, sin importar el grado de riesgo","o":["Los de todos sus Clientes, sin importar el grado de riesgo","Sólo los de Clientes de riesgo alto, igual que Bancos","Los de riesgo alto y medio; los de bajo, cada dos años","Sólo los de Clientes sin operar por más de 180 días naturales"],"x":"ITF verifica por lo menos una vez al año los expedientes de todos sus Clientes. Bancos y la mayoría lo hacen anualmente para los de Grado de Riesgo alto. Los 180 días naturales sin operar son una regla adicional de Transmisores para Usuarios no presenciales.","ref":"DCG ITF art. 24; DCG Bancos 21ª"},{"id":"F132","tema":"2.1.17","tipo":"caso","q":"Un Usuario identificado no presencialmente por un transmisor de dinero no ha operado en 200 días y vuelve a pretender un envío. Además de la revisión anual de riesgo alto, ¿qué exige su DCG?","a":"Confirmar que su expediente esté integrado, por pasar de 180 días naturales","o":["Nada adicional: aplica sólo la revisión anual de riesgo alto","Confirmar que su expediente esté integrado, por pasar de 180 días hábiles","Confirmar que su expediente esté integrado, por pasar de 180 días naturales","Darlo de baja y abrirle un expediente nuevo, por pasar de 90 días naturales sin operar"],"x":"Transmisores, además de la revisión anual de riesgo alto que comparte con Bancos, exige confirmar el expediente de Usuarios identificados no presencialmente que pasaron más de 180 días naturales sin operar, con independencia de su grado de riesgo, cuando pretendan volver a operar. Son naturales, no hábiles. Los 90 días naturales son del interinato del OC.","ref":"DCG Transmisores 12ª; DCG Bancos 21ª","par":"F131"},{"id":"F133","tema":"2.1.17","tipo":"caso","q":"Un asesor en inversiones y una casa de bolsa ejecutan una operación el mismo día. ¿Cuánto tiempo mínimo debe conservar cada uno su registro?","a":"Asesor: 5 años; casa de bolsa: 10 años","o":["Ambos: 10 años desde la ejecución","Asesor: 10 años; casa de bolsa: 5 años","Ambos: 5 años, como la metodología de riesgos","Asesor: 5 años; casa de bolsa: 10 años"],"x":"La regla general es no menos de 10 años desde la ejecución de la Operación (Bancos, Casas de bolsa y todos los demás); Asesores es la excepción con 5. Los 5 años también son la conservación de la metodología y del informe de auditoría, lo que alimenta la confusión.","ref":"DCG Asesores en inversiones 37ª; DCG Casas de bolsa 60ª"},{"id":"F134","tema":"2.1.17","tipo":"caso","q":"Un asesor en inversiones modifica su Manual. ¿Desde cuándo corren sus 20 días hábiles para enviarlo a la CNBV?","a":"Desde que su Representante elabora las modificaciones","o":["Desde que su comité de auditoría aprueba las modificaciones","Desde que su Representante elabora las modificaciones","Desde que su Comité de Comunicación y Control las aprueba","Desde que el comisario, el comité de auditoría o el Comité las aprueban"],"x":"El plazo es de 20 días hábiles en todos; lo que cambia es el arranque. Asesores no tiene comité que apruebe: corre desde que el Representante elabora los cambios. Bancos cuenta desde la aprobación del comité de auditoría; la fórmula de tres aprobadores es de ITF.","ref":"DCG Asesores en inversiones 38ª; DCG Bancos 64ª 5º párr."},{"id":"F135","tema":"2.1.17","tipo":"caso","q":"Un banco y una SOFOM suspenden a un Cliente que aparece en la Lista de Personas Bloqueadas. ¿Qué dicen sus DCG sobre el aviso al Cliente?","a":"Ambos avisan de inmediato; sólo el banco fija 10 días hábiles para acudir","o":["Ambos avisan de inmediato y fijan 10 días hábiles para acudir ante la autoridad","Banco: aviso inmediato; SOFOM: aviso dentro de 10 días hábiles","Ambos avisan de inmediato; sólo el banco fija 10 días hábiles para acudir","Ambos avisan dentro de las 24 horas siguientes a la suspensión"],"x":"Bancos avisa de inmediato, con fundamentos y causas, y la persona puede acudir a la autoridad dentro de 10 días hábiles desde que recibe el escrito. La SOFOM (como Casas de cambio, Centros cambiarios y Transmisores) avisa de inmediato, pero el texto del aviso no fija los 10 días hábiles. Las 24 horas son del reporte a la autoridad, no del aviso al Cliente.","ref":"DCG Bancos 72ª últ. párr.; DCG SOFOM 63ª últ. párr."},{"id":"F136","tema":"2.1.17","tipo":"caso","q":"Un transmisor de dinero suspende a un Usuario que aparece en la Lista y se lo avisa por escrito. ¿Desde cuándo cuentan los 10 días hábiles para que el Usuario se defienda ante la UIF?","a":"Desde que el Usuario conoce la suspensión","o":["Desde que el Usuario conoce la suspensión","Desde que el Usuario recibe el escrito de aviso","Desde que la UIF emite su resolución","Desde que el transmisor envía el reporte de 24 horas"],"x":"En Transmisores el aviso inmediato no fija días; los 10 días hábiles son los de la audiencia (63ª fr. I), contados desde que el interesado conoce la suspensión, ampliables una vez. «Desde que recibe el escrito» es la redacción del aviso de Bancos (72ª), que no está en la DCG de Transmisores.","ref":"DCG Transmisores 62ª últ. párr. y 63ª fr. I; DCG Bancos 72ª últ. párr."},{"id":"F137","tema":"2.1.17","tipo":"caso","q":"En una SOCAP y en una SOFIPO, la UIF resuelve sobre la permanencia de un socio en la Lista. ¿Qué plazos fija cada DCG para resolver y notificar?","a":"Ambas: resolver en 10 días hábiles; sólo SOFIPO fija 15 para notificar","o":["Ambas: resolver en 10 días hábiles y notificar en 15 días hábiles","Ambas: resolver en 10 días hábiles; sólo SOCAP fija 15 para notificar","Ambas: resolver en 10 días hábiles; sólo SOFIPO fija 15 para notificar","SOCAP: resolver en 15 días hábiles; SOFIPO: resolver en 10 días hábiles"],"x":"Las dos fijan 10 días hábiles para resolver desde que se presenta el interesado. Sólo SOFIPO agrega, como Bancos, la notificación por oficio dentro de 15 días hábiles desde la emisión. La trampa es suponer que SOCAP y SOFIPO, por ser sector de ahorro y crédito popular, son idénticas.","ref":"DCG SOFIPO 76ª fr. II; DCG SOCAP 76ª fr. II; DCG Bancos 73ª fr. II"},{"id":"F138","tema":"2.1.17","tipo":"caso","q":"En una casa de cambio y en un centro cambiario, la UIF resuelve sobre la permanencia de un Usuario en la Lista. ¿Cuál de las dos DCG fija 15 días hábiles para notificar la resolución?","a":"Sólo la del centro cambiario","o":["Sólo la del centro cambiario","Sólo la de la casa de cambio","Las dos, igual que Bancos","Las dos, pero en días naturales"],"x":"Fijan 15 días hábiles para notificar sólo Bancos, Fondos, SOFIPO, Centros cambiarios e ITF. Casas de cambio, como SOFOM, Casas de bolsa, SOCAP, Uniones y Transmisores, fija 10 días hábiles para resolver pero no plazo para notificar.","ref":"DCG Centros cambiarios 60ª fr. II; DCG Casas de cambio 62ª fr. II","par":"F137"},{"id":"F139","tema":"2.1.17","tipo":"caso","q":"Un banco (reforma DOF 28-ago-2024) y una SOFOM (reforma DOF 9-sep-2021) deben adecuar su Manual. ¿Qué plazo les dio su transitorio, desde la entrada en vigor?","a":"Banco: 18 meses; SOFOM: 4 meses","o":["Banco: 4 meses; SOFOM: 18 meses","Ambos: 18 meses desde la entrada en vigor","Banco: 12 meses; SOFOM: 9 meses","Banco: 18 meses; SOFOM: 4 meses"],"x":"La reforma 2024 dio a Bancos 18 meses para el Manual (12 para metodología, 18 para sistemas). Las reformas 2021 y 2023 de SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones, Centros cambiarios y Transmisores dieron 4 meses. Los 12 y 9 meses son de la metodología.","ref":"DCG Bancos 3ª trans. fr. I (2024); DCG SOFOM 4ª trans. fr. I (2021)"},{"id":"F140","tema":"2.1.17","tipo":"caso","q":"Un transmisor de dinero debe ajustar su metodología de riesgos a la reforma de sus DCG (DOF 5-abr-2023). ¿Qué plazo le dio el transitorio?","a":"9 meses desde la entrada en vigor","o":["12 meses desde la entrada en vigor, igual que Bancos","9 meses desde la entrada en vigor","4 meses desde la entrada en vigor","18 meses desde la entrada en vigor"],"x":"Las reformas 2021 y 2023 siguen el ritmo 4 · 9 · 18 meses (Manual, metodología, sistemas). Transmisores tuvo 9 meses para la metodología desde el 6-abr-2023. Bancos (2024) tuvo 12. Los 4 meses son del Manual y los 18, de los sistemas.","ref":"DCG Transmisores 4ª trans. fr. II (2023); DCG Bancos 3ª trans. (2024)"},{"id":"F141","tema":"2.1.17","tipo":"trampa","q":"Un centro cambiario estudia los transitorios de su reforma (DOF 19-ene-2023). ¿Para qué obligación fijan un plazo en meses?","a":"Sólo para modificar el Manual: 4 meses","o":["Para Manual, metodología y sistemas: 4, 9 y 18 meses","Sólo para modificar el Manual: 4 meses","Para Manual y metodología: 18 y 12 meses, como Bancos","Sólo para los sistemas automatizados: 18 meses"],"x":"La reforma 2023 de Centros cambiarios sólo da 4 meses para modificar el Manual y deja el informe cuantitativo para la fecha que fije la CNBV; no trae plazo para metodología ni sistemas. El esquema 4 · 9 · 18 es de los demás sujetos reformados en 2021 y 2023; 18 y 12, de Bancos 2024.","ref":"DCG Centros cambiarios 3ª y 4ª trans. (2023)"},{"id":"F142","tema":"2.1.17","tipo":"caso","q":"Al comparar el transitorio de Bancos (2024) con el de una unión de crédito (2023), ¿en qué plazo coinciden?","a":"Sistemas automatizados: 18 meses en ambos","o":["Manual de Cumplimiento: 18 meses en ambos","Metodología de riesgos: 12 meses en ambos","Certificación del oficial de cumplimiento: 12 meses","Sistemas automatizados: 18 meses en ambos"],"x":"Los 18 meses para sistemas automatizados coinciden en Bancos y en Uniones (y en SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO y Transmisores), cada uno contado desde la entrada en vigor de su propia reforma. El Manual (18 contra 4) y la metodología (12 contra 9) difieren; la certificación del OC sólo la trae Bancos.","ref":"DCG Bancos 3ª trans. (2024); DCG Uniones de crédito 4ª trans. fr. I-III (2023)"},{"id":"F143","tema":"2.1.17","tipo":"memoria","q":"¿Cuál de estos sujetos recibió en su reforma de 2021 un plazo de 6 meses para registrar la geolocalización por dirección IP?","a":"La casa de bolsa","o":["La casa de bolsa","La SOFOM","La SOCAP","La SOFIPO"],"x":"Sólo Casas de bolsa y Fondos (5ª trans. fr. IV, 2021) dieron 6 meses para registrar coordenadas por dirección IP. SOFOM y SOFIPO recibieron 12 meses para la nueva solicitud del Anexo 2; SOCAP no trae ninguno de esos plazos. La certificación del OC (12 meses) es sólo de Bancos 2024.","ref":"DCG Casas de bolsa 5ª trans. fr. IV (2021)"},{"id":"F144","tema":"2.1.17","tipo":"caso","q":"Una persona de las previstas en la Octava Disposición Transitoria de la LRITF obtiene su autorización como ITF. Conforme al Segundo transitorio de sus DCG, ¿qué plazo tiene para su metodología y sistemas?","a":"180 días naturales desde que obtiene la autorización","o":["180 días hábiles desde la publicación de las DCG en el DOF","360 días naturales desde la publicación de las DCG en el DOF","180 días naturales desde que obtiene la autorización","18 meses desde que obtiene la autorización, igual que Bancos"],"x":"El Segundo transitorio (DOF 10-sep-2018) aplica sólo a las personas de la Octava transitoria de la LRITF: 180 días naturales para metodología y sistemas y 360 para regularizar los expedientes de Clientes existentes, contados desde que obtienen la autorización, no desde la publicación. Los 18 meses son de Bancos 2024.","ref":"DCG ITF 2º trans. fr. I y II (DOF 10-sep-2018)"}],"sitio":{"nombre":"Módulo 2","integrador":"simulacro","integrador_texto":"Simulacro mixto","integrador_href":"m2-simulacro/index.html","etiqueta_n":"H","orden_resultados":"temario","paginas":[{"n":"1","carpeta":"m2-h1-objetivo-kyc","pregunta":"2.1.1–2.1.2 · Objetivo y política de identificación y conocimiento","estado":"integrada"},{"n":"2","carpeta":"m2-h2-reportes-dolares-sistemas","pregunta":"2.1.3–2.1.5 · Reportes, dólares en efectivo y sistemas automatizados","estado":"integrada"},{"n":"3","carpeta":"m2-h3-otras-obligaciones-lpb","pregunta":"2.1.6–2.1.8 · Otras obligaciones, intercambio de información y LPB","estado":"integrada"},{"n":"4","carpeta":"m2-h4-ccc-oficial","pregunta":"2.1.9–2.1.10 · Comité de <script>
(function(){
const D = JSON.parse(document.getElementById("datos").textContent);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// «Por qué no las otras»: q.d = {texto de opción incorrecta: razón}; opts = opciones en el orden en que se muestran
const tuHTML=(q,txt)=>(txt&&txt!==q.a&&q.d&&q.d[txt])?`<div class="tu"><b>Por qué tu respuesta está mal</b>${esc(q.d[txt])}</div>`:"";
const distHTML=(q,opts)=>{ if(!q.d) return ""; const it=opts.map((o,k)=>q.d[o]?`<li><b>${"ABCD"[k]}</b> ${esc(q.d[o])}</li>`:"").join(""); return it?`<div class="dist"><div class="lbl">Por qué no las otras</div><ul>${it}</ul></div>`:""; };
const RUTA = D.meta.ruta||"financiero";
const ACENTOS = {financiero:["morado","turquesa"], av:["turquesa","coral"], transversal:["morado","coral"], gratuito:["morado","turquesa"]}[RUTA]||["morado","turquesa"];
const COLORES = ["c-principal","c-"+ACENTOS[0],"c-"+ACENTOS[1],"c-negro"];
const colorDe = (v,i)=>v?("c-"+v):COLORES[i%4];
document.documentElement.setAttribute("data-ruta", RUTA);
const RUTAS = {financiero:"Ruta Sector financiero", av:"Ruta Actividades vulnerables", transversal:"Transversales", gratuito:"Gratuitos"};

/* ---------- encabezado, portada, trampas, pie ---------- */
$("#brand").innerHTML = `<b>360EDUCA</b><span>${esc(D.meta.modulo||"")}</span><span class="ruta">${esc(RUTAS[D.meta.ruta||"financiero"])}</span>`;
$("#nav").innerHTML = D.secciones.filter(s=>s.nav).map(s=>`<a href="#${s.id}"${s.tipo==="simulador"?' class="cta"':""}>${esc(s.nav)}</a>`).join("");
/* ---------- modo sitio: franja de páginas (opcional) ---------- */
if(D.sitio && Array.isArray(D.sitio.paginas)){
  const S=D.sitio, raiz=S.raiz||"", act=S.actual||"";
  const ETQ={preparacion:"En preparación", proximamente:"Próximamente"};
  const actual=S.paginas.find(p=>p.carpeta===act);
  $("#sitebar").innerHTML = `<a class="sb-mod" href="${esc(raiz)}index.html"${act?"":' aria-current="page"'}>${esc(S.nombre||"Portada")}</a><span class="sb-sep"></span>`+
    S.paginas.map(p=>{
      const tip=p.tip||`${S.etiqueta_n!=null?S.etiqueta_n:"Sesión "}${p.n} · ${p.pregunta||""}`;
      if(p.estado && p.estado!=="integrada") return `<span class="sb-p off" title="${esc(tip)} · ${esc(ETQ[p.estado]||p.estado)}" aria-disabled="true">${esc(p.n)}</span>`;
      return `<a class="sb-p" href="${esc(raiz+p.carpeta)}/index.html" title="${esc(tip)}"${p.carpeta===act?' aria-current="page"':""}>${esc(p.n)}</a>`;
    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+
    (actual?`<span class="sb-ses">${actual.tip?esc(actual.tip):esc(S.etiqueta_n!=null?S.etiqueta_n:"Sesión ")+esc(actual.n)+" · "+esc(actual.pregunta||"")}</span>`:"");
  $("#sitebar").hidden=false;
}
const mapa0 = D.secciones.find(s=>s.tipo==="mapa");
let rhythm = "";
if(Array.isArray(D.meta.ritmo)){ // ritmo puesto a mano: [{n, lb, q, color}]
  const R0=D.meta.ritmo;
  rhythm = `<div><div class="rhythm${R0.length>4?" many":""}">${R0.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${esc(r.n)}</span><span class="lb">${esc(r.lb||"")}</span><span class="q">${esc(r.q||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${D.meta.ritmo_cap?esc(D.meta.ritmo_cap):`${R0.map(r=>r.n).join(" · ")} = ${R0.reduce((a,r)=>a+(+r.n||0),0)} ${esc(D.meta.unidad||"")}`}</div></div>`;
} else if(mapa0 && D.meta.ritmo!==false){
  const counts = mapa0.ramas.map(r=>r.items.length);
  rhythm = `<div><div class="rhythm${mapa0.ramas.length>4?" many":""}">${mapa0.ramas.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${r.items.length}</span><span class="lb">${esc(r.corto||r.letra)}</span><span class="q">${esc(r.ritmo||r.pregunta||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${counts.join(" · ")} = ${counts.reduce((a,b)=>a+b,0)} ${esc(D.meta.unidad||"")}</div></div>`;
}
$("#hero").innerHTML = `<div><div class="lbl">${esc(D.meta.eyebrow||"")}</div>
  <h1>${esc(D.meta.h1_antes||"")} <mark>${esc(D.meta.h1_resaltado||"")}</mark> ${esc(D.meta.h1_despues||"")}</h1>
  <p>${D.meta.intro||""}</p></div>${rhythm}`;
$("#traps").innerHTML = (D.trampas||[]).map((t,i)=>`<div class="trapc"><span class="tag">Trampa ${D.trampas.length>1?i+1:"de examen"}</span><p><b>${esc(t.titulo)}</b> ${t.texto}</p></div>`).join("");
if(!(D.trampas||[]).length) $("#traps").hidden=true;
$("#pie").innerHTML = `<b>GMC360 · 360Educa</b> — ${D.meta.fuente||""} Material didáctico; los textos están resumidos, consulta la publicación oficial para la redacción íntegra.`;

/* ---------- secciones ---------- */
const head = s=>!s.titulo?"":`<div class="sec-head"><h2>${esc(s.titulo)}</h2>${s.intro?`<p>${s.intro}</p>`:""}</div>${s.para?`<div class="para"><b>Para qué sirve</b>${s.para}</div>`:""}`;
const chant = f=>f?`<div class="chant"><div class="lbl">${esc(f.titulo||"Para recitar en voz alta")}</div><p>${f.html}</p></div>`:"";
const R = {};
let ITEMS = {}; // id -> {item, rama, color}
R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="frac"><button aria-expanded="false" data-ficha="${id}"><span class="rom">${esc(it.etiqueta)}</span><span><span class="nm">${esc(it.nombre)}</span><span class="hookt">${esc([it.verbo,it.gancho].filter(Boolean).join(" · "))}</span></span><span class="cnt">${esc(it.conteo||"")}</span></button><ul class="inc" hidden>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul></li>`}).join("")}</ul>`;
    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};
R.tarjetas = s=>head(s)+`<div class="cards">${s.tarjetas.map((c,i)=>{
  const col = colorDe(c.color,i);
  const top = c.encabezado?`<div class="chead"><div class="t">${esc(c.titulo)}</div>${c.subtitulo?`<div class="a">${esc(c.subtitulo)}</div>`:""}</div>`:(c.barra?`<div class="bar"></div>`:"");
  const body = c.filas? c.filas.map(f=>`<div class="frow"><span class="k">${esc(f.k)}</span>${f.v}</div>`).join("")
    : `<div class="cbody">${c.etiqueta?`<div class="lbl">${esc(c.etiqueta)}</div>`:""}${c.encabezado?"":`<h3>${esc(c.titulo)}</h3>`}${c.ref?`<span class="art">${esc(c.ref)}</span>`:""}${c.html?`<p>${c.html}</p>`:""}${c.lista?`<ul>${c.lista.map(l=>`<li>${l}</li>`).join("")}</ul>`:""}</div>`;
  return `<div class="card ${col}${c.ancho?" wide":""}">${top}${body}</div>`;}).join("")}</div>${s.nota?`<div class="note">${s.nota}</div>`:""}`;
R.escala = s=>{const cols=["var(--principal-linea)","#80bcb5","#a663cc","#ff8361","var(--oscuro)"];
  return head(s)+`<div class="card"><div class="cbody">${s.etiqueta?`<div class="lbl">${esc(s.etiqueta)}</div>`:""}${s.subtitulo?`<h3>${esc(s.subtitulo)}</h3>`:""}<div class="scale">${s.niveles.map((l,i)=>`<div class="lvl" style="--lc:${cols[i%5]}"><div class="n">${i+1}</div><div class="t">${esc(l.t)}</div><div class="d">${esc(l.d||"")}</div>${l.req?`<div class="req">${esc(l.req)}</div>`:""}</div>`).join("")}</div>${s.memo?`<p class="memo">${s.memo}</p>`:""}</div></div>`;};
R.pasos = s=>head(s)+`<ol class="track" style="--n:${s.pasos.length}" role="tablist" data-pasos="${s.id}">${s.pasos.map((p,i)=>`<li><button class="pill" role="tab" aria-selected="${i===0}" data-paso="${s.id}:${i}"><span class="circ">${i+1}</span><span class="nm">${esc(p.nombre)}</span></button></li>`).join("")}</ol><div class="stepd" id="stepd-${s.id}" role="tabpanel" aria-live="polite"></div>`+chant(s.frase);
R.flujo = s=>head(s)+`<div class="lanes">${s.carriles.map((c,i)=>`<div class="lane"><div class="lhead ${colorDe(c.color,i)}"><span class="t">${esc(c.titulo)}</span>${c.sub?`<span class="s">${esc(c.sub)}</span>`:""}</div><div class="flow">${c.nodos.map(n=>`<div class="node"><h4>${esc(n.titulo)}</h4>${n.ref?`<span class="art">${esc(n.ref)}</span>`:""}${n.texto?`<p>${n.texto}</p>`:""}${n.plazo?`<span class="plazo">${esc(n.plazo)}</span>`:""}${n.nota?`<p>${n.nota}</p>`:""}</div>`).join('<div class="arrow" aria-hidden="true">→</div>')}</div></div>`).join("")}</div>`;
R.cifras = s=>head(s)+`<div class="nums">${s.cifras.map(c=>`<div class="numt"><div class="v">${esc(c[0])}<small>${esc(c[1])}</small></div><div class="d">${esc(c[2])}</div><div class="r">${esc(c[3])}</div></div>`).join("")}</div>`;
R.simulador = s=>head({titulo:s.titulo||"Modo examen",para:s.para,intro:s.intro||"Opción múltiple con 4 opciones. Practica por tema en rondas de 10, o haz un simulacro de 30 o 50 que no repite reactivos hasta agotar el banco. Contesta con clic o con las teclas A, B, C, D."})+
  `<div class="simbar">${(s.tamanos||[30,50]).map(n=>`<button class="qsim" data-n="${+n}" aria-pressed="false">Simulacro de ${+n}</button>`).join("")}<span class="bankinfo" id="bankinfo"></span><button class="linkbtn" id="simReset">Reiniciar mi avance</button></div>

function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}

    const all=s.sujetos.map(j=>j.k), no=all.filter(k=>!f.quien.includes(k));
    const quien=f.quien.length===all.length?`<span class="lb">Lo tienen:</span> los 12`:
      f.quien.length>=9?`<span class="lb">Lo tienen ${f.quien.length} de 12 · todos menos</span>${pills(no)}`:`<span class="lb">Lo tienen (${f.quien.length}/12):</span>${pills(f.quien)}${f.no_txt?` <span class="lb" style="margin-left:6px">· ${esc(f.no_txt)}</span>`:(no.length?` <span class="lb" style="margin-left:6px">· No:</span>${pills(no)}`:"")}`;
    const rows=vs.map((v,vi)=>`<div class="rr" data-rxr="${id}|${fi}|${vi}"><div class="vv">${esc(v.v)}</div><div class="ra">${esc(v.regla)}</div><div class="ee${v.exc.length?"":" none"}">${v.exc.length?v.exc.map(e=>`<div class="rxx"><span class="ex"><span class="pre">${esc(e.pre||"excepto")}</span> ${esc(e.val)}</span>${pills(e.suj)}</div>`).join(""):"Sin excepciones"}</div></div>`).join("");
    return `<article class="rx ${col}"><h4>${esc(f.t)}</h4><div class="rxq">${quien}</div>${f.gancho?`<p class="rxg">${esc(f.gancho)}</p>`:""}<div class="rxt"><div class="hd">Variable</div><div class="hd">Regla general</div><div class="hd">Excepciones (quién se sale)</div>${rows}</div>${f.ojo&&f.ojo.length&&!st.var&&!st.exc?`<ul class="rxo">${f.ojo.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`:""}</article>`;
  }).join("");
  $("#rxo-"+id).innerHTML=html||`<p class="note">Nada coincide con el filtro.</p>`;
}
D.secciones.filter(s=>s.tipo==="reglaexc").forEach(rxInit);
document.addEventListener("change",e=>{const t=e.target.closest("[data-rxs]"); if(!t) return; RX[t.dataset.rxs].var=t.value; rxDraw(t.dataset.rxs);});
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-rxf]");
  if(f){const [id,g]=f.dataset.rxf.split(":"), set=RX[id].grp; set.has(g)?set.delete(g):set.add(g); f.setAttribute("aria-pressed",set.has(g)); rxDraw(id); return;}
  const x=e.target.closest("[data-rxe]");
  if(x){const id=x.dataset.rxe; RX[id].exc=!RX[id].exc; x.setAttribute("aria-pressed",RX[id].exc); rxDraw(id); return;}
  const r=e.target.closest("[data-rxr]");
  if(r&&document.body.classList.contains("recite")) r.classList.toggle("shown");

/* ---------- repaso (tandas al azar o secuencia fija) ---------- */
// Con "pool": tandas al azar de 10/20/30 (configurable en "tandas") que no repiten hasta agotar el banco de repaso;
// las opciones se barajan. Con "bloques": secuencia fija, opciones sin barajar (para un guion con letras).
// Clic en una opción = respuesta del alumno; «Revelar respuesta» = la instructora muestra la correcta sin marcar a nadie.
D.secciones.filter(s=>s.tipo==="repaso").forEach(s=>{
  const BK={}; (D.banco||[]).forEach(q=>BK[q.id]=q);
  const TM=D.temas||{}, sim=D.secciones.find(x=>x.tipo==="simulador"), CL=s.claves||{};
  const box=$("#rp-"+s.id), idx=$("#rpi-"+s.id);
  const mix=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const KEY="rp-"+(D.meta.clave||"mapa")+"-"+s.id;
  const POOL=(s.pool||[]).filter(id=>BK[id]);
  let seq=[], i=0, meta=null;
  function fixedSeq(){ const out=[]; (s.bloques||[]).forEach((b,bi)=>b.items.forEach(it=>{if(BK[it.id]) out.push({...BK[it.id],opts:BK[it.id].o.slice(),clave:it.clave||CL[it.id]||"",extra:!!it.extra,bi,bt:b.titulo});})); return out; }
  function tanda(n){
    let used=new Set(st.get(KEY,[])), rest=POOL.filter(id=>!used.has(id)), pick;
    if(rest.length<n){ pick=mix(rest); used=new Set(); const more=mix(POOL.filter(id=>!pick.includes(id))).slice(0,n-pick.length); pick=pick.concat(more); more.forEach(id=>used.add(id)); }
    else { pick=mix(rest).slice(0,n); pick.forEach(id=>used.add(id)); }
    st.set(KEY,[...used]);
    return mix(pick).map(id=>({...BK[id],opts:mix(BK[id].o),clave:CL[id]||""}));
  }
  const sinSalir=()=>`${POOL.length-new Set(st.get(KEY,[])).size} de ${POOL.length} sin salir`;
  function start(n){ seq=n?tanda(n):fixedSeq(); meta={n}; seq.forEach(q=>{q.pick=null;q.shown=false;}); i=0; draw(); box.scrollIntoView({block:"start"}); }
  const fsTxt=()=>document.fullscreenElement?"Salir de pantalla completa":"Pantalla completa";
  if(s.pool){
    idx.innerHTML=(s.tandas||[10,20,30]).map(n=>`<button class="rpb" data-rpn="${n}" aria-pressed="false">${n} preguntas</button>`).join("")+`<span class="bankinfo" id="rpinfo-${s.id}" style="align-self:center">${POOL.length} preguntas en el banco de repaso · ${sinSalir()}</span>`;
    box.innerHTML=`<div class="qtext">Elige una tanda de ${(s.tandas||[10,20,30]).join(", ").replace(/, (\d+)$/," o $1")} preguntas.</div><p style="margin:10px 0 0">Salen al azar y no se repiten hasta agotar las ${POOL.length}; las opciones cambian de orden cada vez.</p>`;
  } else {
    idx.innerHTML=(s.bloques||[]).map((b,bi)=>`<button class="rpb" data-rpb="${bi}" aria-pressed="false">${bi+1} · ${esc(b.titulo)} <small>${b.items.length}</small></button>`).join("");
  }
  function draw(){
    idx.querySelectorAll("[data-rpn]").forEach(b=>b.setAttribute("aria-pressed",String(meta&&+b.dataset.rpn===meta.n)));
    if(!s.pool) idx.querySelectorAll("[data-rpb]").forEach(b=>b.setAttribute("aria-pressed",String(i<seq.length&&+b.dataset.rpb===seq[i].bi)));
    if(i>=seq.length) return fin();
    const q=seq[i], ok=q.opts.indexOf(q.a), lab=s.pool?`Tanda de ${seq.length}`:`Bloque ${q.bi+1} · ${esc(q.bt)}`;
    const good=seq.filter(x=>x.pick!=null&&x.opts[x.pick]===x.a).length;
    box.innerHTML=`<div class="qbar"><span>${lab} · pregunta ${i+1} de ${seq.length}</span><span>Aciertos: ${good}</span></div><div class="qprog"><i style="width:${i/seq.length*100}%"></i></div>
    <div class="qtag"><span>${esc(TM[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}${q.extra?"<span>Extra</span>":""}</div><div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt${q.shown?(k===ok?" right":(k===q.pick?" wrong":"")):""}" data-rpk="${k}"${q.shown?" disabled":""}><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="fb">${q.shown?`${q.pick==null?`<span class="ok">Respuesta ${"ABCD"[ok]}</span>`:(q.pick===ok?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>')}${q.pick!=null?tuHTML(q,q.opts[q.pick]):""} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}${q.clave?`<div class="rp-clave"><div class="lbl">Para no confundirte</div>${q.clave}</div>`:""}`:""}</div>
    <div class="qactions"><button class="btn ghost" data-rpnav="-1"${i===0?" disabled":""}>← Anterior</button>${q.shown?"":`<button class="btn" data-rpshow>Revelar respuesta</button>`}<button class="btn ghost" data-rpnav="1">${i+1===seq.length?"Ver resultado →":"Siguiente →"}</button><button class="btn ghost" data-rpfs>${fsTxt()}</button></div>`;
  }
  function fin(){
    const resp=seq.filter(x=>x.pick!=null), good=resp.filter(x=>x.opts[x.pick]===x.a).length, miss=seq.filter(x=>x.pick!=null&&x.opts[x.pick]!==x.a), c=s.cierre;
    box.innerHTML=`<div class="qbar"><span>${s.pool?`Tanda de ${seq.length} · resultado`:"Cierre"}</span><span>${resp.length?`${good}/${resp.length}`:""}</span></div><div class="qprog"><i style="width:100%"></i></div>
    ${resp.length?`<div class="score"><span class="big">${Math.round(good/resp.length*100)}%</span><span>${good} de ${resp.length} contestadas correctamente.</span></div>`:""}
    ${miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${miss.length})</summary><ul>${miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.opts[m.pick])}</s>${m.d&&m.d[m.opts[m.pick]]?` — ${esc(m.d[m.opts[m.pick]])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
    ${c?`<div class="qtext" style="margin-top:18px">${esc(c.titulo)}</div><ol class="rp-fin">${(c.pasos||[]).map(p=>`<li>${p}</li>`).join("")}</ol>${c.nota?`<div class="rp-clave">${c.nota}</div>`:""}`:""}
    <div class="qactions"><button class="btn ghost" data-rpnav="-1">← Anterior</button>${s.pool?`<button class="btn" data-rpn="${meta.n}">Otra tanda de ${meta.n}</button>`:""}${sim?`<a class="btn ghost" href="#${sim.id}">${esc(sim.nav||"Practicar")}</a>`:""}<button class="btn ghost" data-rpfs>${fsTxt()}</button></div>
    ${s.pool?`<p class="siminfo">${sinSalir()}</p>`:""}`;
    const inf=$("#rpinfo-"+s.id); if(inf) inf.textContent=`${POOL.length} preguntas en el banco de repaso · ${sinSalir()}`;
  }
  function reveal(){ if(!seq.length||i>=seq.length||seq[i].shown) return; seq[i].shown=true; draw(); }
  const go=n=>{ if(!seq.length) return; i=Math.max(0,Math.min(n,seq.length)); draw(); };
  function fs(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else if(box.requestFullscreen) box.requestFullscreen(); }catch(e){} }
  document.addEventListener("fullscreenchange",()=>{const f=box.querySelector("[data-rpfs]");if(f)f.textContent=fsTxt();});
  const onClick=e=>{
    const n=e.target.closest("[data-rpn]"); if(n){start(+n.dataset.rpn);return;}
    const b=e.target.closest("[data-rpb]"); if(b){if(!seq.length||s.pool)start(0);go(seq.findIndex(q=>q.bi===+b.dataset.rpb));return;}
    const o=e.target.closest("[data-rpk]"); if(o&&seq[i]&&!seq[i].shown){seq[i].pick=+o.dataset.rpk;reveal();return;}
    if(e.target.closest("[data-rpshow]")){reveal();return;}
    const nv=e.target.closest("[data-rpnav]"); if(nv){go(i+(+nv.dataset.rpnav));return;}
    if(e.target.closest("[data-rpfs]")) fs();
  };
  idx.addEventListener("click",onClick); box.addEventListener("click",onClick);
  document.addEventListener("keydown",e=>{
    if(!seq.length||e.target.closest("input,textarea")||!$("#drawer").hidden) return;
    const r=box.getBoundingClientRect(); if(document.fullscreenElement!==box&&(r.bottom<0||r.top>innerHeight)) return;
    if(e.key==="ArrowRight"){go(i+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(i-1);e.preventDefault();}
    else if(e.key.toLowerCase()==="r"){reveal();e.preventDefault();}
    else if(e.key.toLowerCase()==="f"){fs();e.preventDefault();}
  });
  if(!s.pool) start(0);
});

/* ---------- simulador ---------- */
if(!D.secciones.some(s=>s.tipo==="simulador")) return;
const BANK=D.banco||[], TEMAS=D.temas||{};
const MODOS=[{k:"all",l:"Todo mezclado",f:()=>true}].concat((D.modos||[]).map(m=>({k:m.k,l:m.l,f:x=>(m.tema?x.tema===m.tema:true)&&(m.tipos?m.tipos.includes(x.tipo):true)})));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY=D.meta.clave||"mapa", SEEN="seen-"+KEY, SIM="sim-"+KEY;
let seen=new Set(store.get(SEEN,[])), MODE="all", ST=null;
const poolFor=k=>BANK.filter(MODOS.find(m=>m.k===k).f);
const simInfo=()=>`${BANK.length-store.get(SIM,[]).length} de ${BANK.length} sin salir en simulacro`;
const bankInfo=()=>`${BANK.length} reactivos verificados contra el texto oficial · ${simInfo()}`;
function startRound(){const pool=poolFor(MODE);const fresh=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));start(fresh.concat(old).slice(0,10),{kind:"ronda",label:MODOS.find(m=>m.k===MODE).l});}
const SIMSEC=D.secciones.find(s=>s.tipo==="simulador")||{};
function cuotas(n,pesos){ // reparto por resto mayor; sólo temas con reactivos
  const ks=Object.keys(pesos).filter(k=>pesos[k]>0&&BANK.some(x=>x.tema===k)), tot=ks.reduce((a,k)=>a+pesos[k],0);
  if(!ks.length) return null;
  const raw=ks.map(k=>({k,v:n*pesos[k]/tot})), out={}; let asig=0;
  raw.forEach(r=>{out[r.k]=Math.floor(r.v);asig+=out[r.k];});
  raw.sort((a,b)=>(b.v%1)-(a.v%1)).slice(0,n-asig).forEach(r=>out[r.k]++);
  return out;
}
function startSim(n){
  if(SIMSEC.proporcion){
    const q=cuotas(n,SIMSEC.proporcion);
    if(q){
      let used=new Set(store.get(SIM,[])), pick=[], cycled=false;
      Object.entries(q).forEach(([k,c])=>{
        const delTema=BANK.filter(x=>x.tema===k); let rest=shuffle(delTema.filter(x=>!used.has(x.id)));
        if(rest.length<c){cycled=true;delTema.forEach(x=>used.delete(x.id));rest=rest.concat(shuffle(delTema.filter(x=>!rest.includes(x))));}
        rest=rest.slice(0,c); rest.forEach(x=>used.add(x.id)); pick=pick.concat(rest);
      });
      store.set(SIM,[...used]); return start(shuffle(pick),{kind:"simulacro",label:`Simulacro de ${pick.length}`,n,cycled});
    }
  }
  let used=new Set(store.get(SIM,[])), rest=BANK.filter(x=>!used.has(x.id)), cycled=false;
  if(rest.length<n){cycled=true;const take=shuffle(rest);used=new Set();const more=shuffle(BANK.filter(x=>!take.includes(x))).slice(0,n-take.length);rest=take.concat(more);more.forEach(x=>used.add(x.id));}
  else{rest=shuffle(rest).slice(0,n);rest.forEach(x=>used.add(x.id));}
  store.set(SIM,[...used]); start(shuffle(rest),{kind:"simulacro",label:`Simulacro de ${n}`,n,cycled});
}
function start(list,meta){ST={list:list.map(q=>({...q,opts:shuffle(q.o)})),i:0,ok:0,miss:[],byTema:{},meta};document.querySelectorAll(".qmode,.qsim").forEach(b=>b.setAttribute("aria-pressed","false"));render();}
function render(){
  const box=$("#quiz"),n=ST.list.length; if(ST.i>=n) return renderEnd();
  const q=ST.list[ST.i];
  box.innerHTML=`<div class="qbar"><span>${esc(ST.meta.label)} · reactivo ${ST.i+1} de ${n}</span><span>Aciertos: ${ST.ok}</span></div><div class="qprog"><i style="width:${ST.i/n*100}%"></i></div>
  <div class="qtag"><span>${esc(TEMAS[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}</div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>
  <div class="qactions"><button class="btn" id="qNext" hidden>${ST.i+1===n?"Ver resultado":"Siguiente"}</button><button class="btn ghost" id="qQuit">Terminar aquí</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  $("#qNext").addEventListener("click",()=>{ST.i++;render();});
  $("#qQuit").addEventListener("click",()=>{ST.list=ST.list.slice(0,ST.i);renderEnd();});
}
function answer(k){
  const q=ST.list[ST.i]; if(q.done) return; q.done=true; const good=q.opts[k]===q.a;
  const t=ST.byTema[q.tema]||(ST.byTema[q.tema]={ok:0,n:0}); t.n++; if(good){ST.ok++;t.ok++;} else {q.mine=q.opts[k];ST.miss.push(q);}
  seen.add(q.id); store.set(SEEN,[...seen]);
  $("#quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.a)b.classList.add("right");else if(+b.dataset.k===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`${good?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>'}${good?"":tuHTML(q,q.opts[k])} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>${distHTML(q,q.opts)}`;
  const nb=$("#qNext"); nb.hidden=false; nb.focus();
}
function renderEnd(){
  const box=$("#quiz"),n=ST.list.length,pct=n?Math.round(ST.ok/n*100):0;
  const msg=pct>=90?"Listos para el examen.":pct>=75?"Muy bien: repasen los temas con menos aciertos.":pct>=60?"Van bien, pero hay que repasar.":"Toca volver al mapa y repasar antes del siguiente intento.";
  const ordT=(SIMSEC.orden_resultados||(D.sitio&&D.sitio.orden_resultados))==="temario",TK=Object.keys(TEMAS),ix=k=>{const i=TK.indexOf(k);return i<0?1e9:i};
  const rows=Object.entries(ST.byTema).sort(ordT?(a,b)=>ix(a[0])-ix(b[0]):(a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>`<div class="trow2"><span>${esc(TEMAS[k]||k)}</span><span class="tb"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></span><span class="tv">${v.ok}/${v.n}</span></div>`).join("");
  box.innerHTML=`<div class="printhead"><b>${esc(D.meta.titulo)}</b> · 360Educa · ${esc(ST.meta.label)} · ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div><div class="qbar"><span>${esc(ST.meta.label)} · resultado</span><span>${ST.ok}/${n}</span></div><div class="qprog"><i style="width:100%"></i></div>
  <div class="score"><span class="big">${pct}%</span><span>${ST.ok} de ${n} correctas. ${msg}</span></div>
  ${rows?`<div class="lbl" style="margin-top:14px">Aciertos por tema (${ordT?"en el orden del temario":"de menor a mayor"})</div><div class="trows">${rows}</div>`:""}
  ${ST.miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${ST.miss.length})</summary><ul>${ST.miss.map(m=>`<li>${esc(m.q)}<br>Elegiste: <s>${esc(m.mine||"")}</s>${m.d&&m.d[m.mine]?` — ${esc(m.d[m.mine])}`:""}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
  <div class="qactions"><button class="btn" id="qAgain">${ST.meta.kind==="simulacro"?"Otro simulacro igual":"Otra ronda"}</button><button class="btn ghost" id="qPrint">Imprimir o guardar en PDF</button><a class="btn ghost" href="#${mapa0?mapa0.id:"top"}">Repasar el mapa</a></div>
  ${ST.meta.kind==="simulacro"?`<p class="siminfo">${simInfo()}${ST.meta.cycled?" · Se completó el banco y empezó una vuelta nueva.":""}</p>`:""}`;
  $("#qAgain").addEventListener("click",()=>ST.meta.kind==="simulacro"?startSim(ST.meta.n):startRound());
  $("#qPrint").addEventListener("click",()=>{const d=box.querySelector("details.miss");if(d)d.open=true;window.print();});
  $("#bankinfo").textContent=bankInfo();
}
document.addEventListener("keydown",e=>{
  if(!ST||e.target.closest("input,textarea")) return;
  const r=$("#quiz").getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
  const k="abcd1234".indexOf(e.key.toLowerCase()); if(k>=0&&ST.i<ST.list.length&&!ST.list[ST.i].done){answer(k%4);e.preventDefault();}
});
$("#modes").innerHTML=MODOS.map(m=>`<button class="qmode" data-m="${m.k}" aria-pressed="false">${esc(m.l)} <small>${poolFor(m.k).length}</small></button>`).join("");
document.querySelectorAll(".qmode").forEach(b=>b.addEventListener("click",()=>{MODE=b.dataset.m;startRound();b.setAttribute("aria-pressed","true");}));
document.querySelectorAll(".qsim").forEach(b=>b.addEventListener("click",()=>{startSim(+b.dataset.n);b.setAttribute("aria-pressed","true");}));
$("#simReset").addEventListener("click",()=>{store.set(SIM,[]);store.set(SEEN,[]);seen=new Set();$("#bankinfo").textContent=bankInfo();});
$("#bankinfo").textContent=bankInfo();
startRound(); document.querySelector('.qmode[data-m="all"]').setAttribute("aria-pressed","true");
})();
</script>
