<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Módulo 2 · Área 2: sanciones por incumplir las DCG de PLD/FT, propietario real en las 12 DCG y los Lineamientos 2019, y plazos de cumplimiento regulatorio, con simulador de reactivos.">
<title>2.1.15 Sanciones · 2.1.16 Propietario real · 2.1.17 Plazos de cumplimiento regulatorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{display:inline-block;font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}

{"meta":{"titulo":"2.1.15 Sanciones · 2.1.16 Propietario real · 2.1.17 Plazos de cumplimiento regulatorio","descripcion":"Módulo 2 · Área 2: sanciones por incumplir las DCG de PLD/FT, propietario real en las 12 DCG y los Lineamientos 2019, y plazos de cumplimiento regulatorio, con simulador de reactivos.","repo":"mapa-m2-s6","clave":"m2s6","ruta":"financiero","modulo":"Módulo 2 · Certificación CNBV PLD/FT","unidad":"subtemas","eyebrow":"Temario CNBV agosto 2026 · 2.1.15 · 2.1.16 · 2.1.17 · LIC, LGOAAC y LRITF (ref. 14-nov-2025) · 12 DCG · Lineamientos PR 2019","h1_antes":"2.1.15 Sanciones ·","h1_resaltado":"2.1.16 Propietario real","h1_despues":"· 2.1.17 Plazos de cumplimiento regulatorio","intro":"<b>¿Qué me cuesta, quién está detrás y cuándo vence?<\/b> Tres temas del 2.1, en el orden del temario. Bancos es el eje y cada diferencia se aprende <b>sujeto por sujeto<\/b> como «igual que Bancos, salvo…». El corazón es <b>propietario real<\/b>: tiene bibliografía propia (Lineamientos 2019) y la trampa más preguntada, «las DCG obligan, los Lineamientos orientan». Orden sugerido: mapa → Modo recitar → trampas → cifras → simulacro de 30.","resumen_portada":"Qué ley sanciona a cada sujeto y con cuánto; quién es el propietario real, el 25 % y la cascada al administrador; y los plazos de las 12 DCG comparados sujeto por sujeto, con su Explorador.","fuente":"Fuente: Ley de Instituciones de Crédito, Ley General de Organizaciones y Actividades Auxiliares del Crédito (arts. 81-A, 81-A Bis, 87-D, 95 y 95 Bis) y Ley para Regular las Instituciones de Tecnología Financiera, con última reforma DOF 14-nov-2025; las 12 DCG de PLD/FT de la bibliografía del temario CNBV (agosto 2026), Bancos compiladas al 28-ago-2024; Lineamientos para la identificación del Propietario Real (SHCP-UBVA, 2019). Las sanciones de casas de bolsa, asesores, fondos, SOCAP, SOFIPO y uniones están en leyes que no forman parte de la bibliografía: se mencionan sin reactivos."},"trampas":[{"titulo":"Propietario real: las DCG obligan, los Lineamientos orientan.","texto":"La <b>obligación<\/b> (definición, 25 %, datos de la 4ª, cascada al administrador) está en cada <b>DCG<\/b>: Bancos 2ª VII y XXXII, 4ª II c) y 4ª VI. Los <b>Lineamientos 2019<\/b> son criterios «enunciativos mas no limitativos» que las Entidades «<b>podrán<\/b>» considerar, y adoptarlos en el Manual <b>no basta por sí solo<\/b> para cumplir (L1). La <b>cascada<\/b> (si nadie llega al 25 %, el administrador) es de las DCG; los Lineamientos dan <b>tres vías<\/b> (propiedad · cargo · otro medio) que pueden ordenarse en <b>lista de prelación<\/b> o aplicarse indistintamente. Y el umbral: «<b>25 % o más<\/b>» en las DCG y en L3 I a); «<b>más del 25 %<\/b>» sólo al sumar fracciones menores al 25 % (L3 I). Ojo con el matiz: L3 II b) sí dice que la persona «<b>deberá<\/b> contar con un cargo de alto mando»."},{"titulo":"Ni todas las multas PLD están en UMA, ni son las de la LFPIORPI.","texto":"La <b>LIC<\/b> (Bancos) y la <b>LGOAAC<\/b> (casas de cambio, SOFOM no reguladas, centros y transmisores) multan en <b>días de salario mínimo general vigente en el Distrito Federal<\/b> (LIC 109 Bis 1; LGOAAC, capítulo de los arts. 95 y 95 Bis); sólo la <b>LRITF<\/b> multa en <b>UMA<\/b> (art. 105). Lo común a las tres: <b>10 % a 100 %<\/b> del monto por operar con alguien de la LPB o por la OI no reportada. Las bandas fijas cambian: Bancos <b>30,000–100,000 / 5,000–50,000<\/b>; LGOAAC 95 y 95 Bis <b>10,000–100,000 / 2,000–30,000<\/b>; ITF una sola banda residual de <b>10 a 100,000 UMA<\/b>. La LFPIORPI (2.2) es otra ley, con otras bandas en UMA."},{"titulo":"Bancos 2024 no dio «4 · 9 · 18 meses» como los demás.","texto":"La reforma de Bancos (DOF 28-ago-2024) dio <b>18 · 12 · 18 · 12 meses<\/b>: Manual · metodología · sistemas · <b>certificación del OC<\/b> (transitoria Tercera). Las reformas de 2021 y 2023 de SOFOM, casas de bolsa, asesores, fondos, SOCAP, SOFIPO, uniones y transmisores dieron <b>4 · 9 · 18 meses<\/b>. Centros cambiarios 2023 sólo fijó plazo en meses para el Manual (<b>4 meses<\/b>). ITF (sólo las personas de la Octava transitoria de la LRITF): <b>180 y 360 días naturales desde que obtienen la autorización<\/b>, no desde la publicación. Los cómputos cambian: hábiles o naturales, desde la alerta o desde la detección."}],"secciones":[{"tipo":"mapa","id":"mapa","nav":"Mapa 2.1.15–2.1.17","titulo":"Los tres temas en 20 subtemas","intro":"Tres ramas, una por tema del temario y en su orden, con ritmo <b>6 · 7 · 7 = 20<\/b>. Las preguntas que las amarran: <b>¿Qué me cuesta?<\/b> · <b>¿Quién está detrás?<\/b> · <b>¿Cuándo vence?<\/b> Toca un subtema para ver su contenido y su fundamento.","centro":{"t":"2.1.15 · 2.1.16 · 2.1.17","s":"20 subtemas<br>6 · 7 · 7"},"ramas":[{"letra":"2.1.15","titulo":"Sanciones","pregunta":"¿Qué me cuesta?","ritmo":"¿Qué cuesta?","corto":"2.1.15","color":"oscuro","items":[{"etiqueta":"DCG 66ª; LIC 115","nombre":"Qué ley sanciona a cada sujeto","sub":"Cada sujeto, su ley","verbo":"Remito","desc":"La CNBV sanciona «en los términos de la Ley» de cada sujeto: LIC para Bancos, LGOAAC 95 y 95 Bis para cambios y envíos y SOFOM no reguladas, LRITF 105 para ITF.","panel":"2.1.15 · Qué ley sanciona a cada sujeto","puntos":["Bancos: la 66ª remite a «la Ley» (2ª XX: LIC). La multa está en el <b>art. 115 LIC<\/b>; la impone la CNBV con el procedimiento de los arts. 107 Bis y 109 Bis 5.","<b>LGOAAC 95<\/b>: organizaciones auxiliares del crédito y <b>casas de cambio<\/b>. <b>LGOAAC 95 Bis<\/b>: SOFOM no reguladas, <b>centros cambiarios<\/b> y <b>transmisores<\/b>.","<b>LRITF 105<\/b>: ITF y sociedades con modelos novedosos.","Casas de bolsa y asesores (LMV), fondos (LFI), SOCAP (LRASCAP), SOFIPO (LACP) y uniones (LUC): su ley <b>no está en la bibliografía<\/b>; se mencionan, sin reactivos.","Las 12 DCG: la información <b>incompleta, ilegible, con errores<\/b> o en medio no conforme se tiene por incumplimiento (Bancos 67ª)."],"ir":"#t2-1-15","destacado":false},{"etiqueta":"LIC 115","nombre":"Multas por conducta","sub":"Porcentaje y días de salario","verbo":"Multo","desc":"LPB y OI no reportada: 10 % a 100 % del monto en las tres leyes. Lo demás, en días de salario (LIC, LGOAAC) o en UMA (LRITF), con bandas distintas por ley.","panel":"2.1.15 · Multas por conducta","puntos":["Operar con alguien que se informó que está en la <b>LPB<\/b>: <b>10 % a 100 %<\/b> del monto del acto, operación o servicio.","<b>OI no reportada<\/b> (o la serie relacionada del mismo cliente): <b>10 % a 100 %<\/b> de su monto.","Bancos: relevantes, internas preocupantes, transferencias internacionales y efectivo en moneda extranjera no reportados, e incisos a, b, c y e del «quinto párrafo»: <b>30,000 a 100,000 días de salario<\/b>.","Bancos, demás incumplimientos: <b>5,000 a 50,000 días de salario<\/b>.","LGOAAC 95 y 95 Bis: <b>10,000 a 100,000<\/b> y <b>2,000 a 30,000<\/b> días de salario; el 95 Bis añade el inciso <b>f<\/b>. LRITF 105: <b>10 a 100,000 UMA<\/b>, una sola banda."],"ir":"#t2-1-15","destacado":true},{"etiqueta":"LIC 107 Bis; LRITF 98","nombre":"Procedimiento","sub":"10 · 60 · 5 · 180","verbo":"Escucho","desc":"Audiencia de 10 días hábiles ampliable una vez; hasta 60 días hábiles de pruebas, 5 de alegatos y no más de 180 para emitir y notificar la resolución.","panel":"2.1.15 · Procedimiento","puntos":["Audiencia: <b>10 días hábiles<\/b>, ampliable <b>por una sola ocasión<\/b> hasta por el mismo lapso (LIC 107 Bis I; LRITF 98 I).","Pruebas hasta <b>60<\/b>, alegatos <b>5<\/b> y resolución en no más de <b>180<\/b> días hábiles.","Impone la <b>Junta de Gobierno<\/b> de la CNBV, que puede delegar por naturaleza de la infracción o monto (LIC 109 Bis 3).","La LGOAAC lo regula en su art. 88 Bis (fuera de la acotación del temario: se menciona)."],"ir":"#t2-1-15","destacado":false},{"etiqueta":"LIC 107 Bis III–IV; 109 Bis 4 y 6","nombre":"Agravantes, atenuantes y reincidencia","sub":"Doble · resarcir · amonestar","verbo":"Gradúo","desc":"Reincide quien comete la misma infracción dentro de 2 años desde que quedó firme la resolución, y la multa puede llegar al doble; resarcir el daño atenúa.","panel":"2.1.15 · Agravantes, atenuantes y reincidencia","puntos":["Reincidencia: misma infracción <b>dentro de los 2 años<\/b> siguientes a que <b>quedó firme<\/b> la resolución → <b>hasta el doble<\/b> (LIC 107 Bis III b; LRITF 98 III b).","Atenuantes: <b>resarcir el daño<\/b> y aportar información que coadyuve (LIC 109 Bis 6; LRITF 99).","Puede <b>amonestar además<\/b> de multar, <b>o sólo amonestar<\/b> (LIC 109 Bis 4; LRITF 107).","En conductas graves, la LRITF permite considerar además <b>el plazo que dure el incumplimiento<\/b> y los riesgos de las operaciones (98 IV f–g).","Graves PLD en la LIC (108): no presentar el documento de políticas KYC y <b>operaciones no reportadas<\/b>, entre otras."],"ir":"#t2-1-15","destacado":false},{"etiqueta":"LIC 109 Bis 1 y 8; LRITF 97, 106, 108","nombre":"Pago, caducidad y publicación","sub":"15 días · 20 % · 5 años","verbo":"Publico","desc":"Pago en 15 días hábiles, con 20 % de reducción si se cumple la condición de cada ley; la facultad de sancionar caduca en 5 años y la sanción se publica en el portal de la CNBV.","panel":"2.1.15 · Pago, caducidad y publicación","puntos":["Pago dentro de <b>15 días hábiles<\/b> desde la notificación.","Reducción del <b>20 %<\/b>: en la LIC, si <b>no se interpuso medio de defensa<\/b>; en la LRITF, si se <b>manifiesta por escrito la conformidad<\/b>.","Caducidad: <b>5 años<\/b> desde el día hábil siguiente a la conducta (LIC 109 Bis 1; LRITF 106).","Publicación en el <b>portal de Internet<\/b>; no se considera reservada ni confidencial (LIC 109 Bis 8; LRITF 108).","Unidad de la LIC: salario mínimo general diario vigente en el Distrito Federal <b>el día de la conducta<\/b>."],"ir":"#t2-1-15","destacado":false},{"etiqueta":"LGOAAC 81-D, 95 Bis; LRITF 62, 69","nombre":"Cancelación, revocación y remoción","sub":"Más allá de la multa","verbo":"Cancelo","desc":"Centros y transmisores pueden perder el registro por reincidir o incumplir gravemente el 95 Bis; la ITF puede perder la autorización y sus directivos ser removidos.","panel":"2.1.15 · Cancelación, revocación y remoción","puntos":["95 Bis: la CNBV puede ordenar a bancos, casas de bolsa y casas de cambio que <b>suspendan o cancelen los contratos<\/b> con centros cambiarios y transmisores cuando <b>presuma<\/b> que violan el artículo.","81-D (apoyo, fuera de la acotación): cancelación del registro por reincidencia, incumplimiento grave del 95 Bis u <b>omitir un año calendario<\/b> la información; el centro cambiario cancelado entra en <b>disolución y liquidación<\/b>.","LRITF 69: la CNBV, con aprobación del Comité Interinstitucional, puede <b>revocar<\/b> la autorización por reincidencia o conducta grave.","LRITF 62: <b>remoción o inhabilitación<\/b> de consejeros, administradores o director general <b>de 3 meses a 5 años<\/b>.","Bancos: en la LIC no se localizó una causal de revocación específica por PLD (pendiente)."],"ir":"#t2-1-15","destacado":false}]},{"letra":"2.1.16","titulo":"Propietario real","pregunta":"¿Quién está detrás?","ritmo":"¿Quién?","corto":"2.1.16","color":"principal","items":[{"etiqueta":"2ª XXXII","nombre":"Definición","sub":"El verdadero dueño","verbo":"Defino","desc":"Persona física que obtiene los beneficios de una cuenta, contrato u operación y es, en última instancia, el verdadero dueño de los recursos; también quien ejerce el Control.","panel":"2.1.16 · Definición","puntos":["Persona física que, por medio de otra o de cualquier acto o mecanismo, obtiene los beneficios de una <b>cuenta, contrato u Operación<\/b>.","Es el verdadero dueño: tiene derechos de <b>uso, disfrute, aprovechamiento, dispersión o disposición<\/b>.","Comprende a quien ejerce el <b>Control<\/b> de una persona moral y a quien instruye, para su beneficio, actos por <b>fideicomisos, mandatos o comisiones<\/b>.","<b>≠ Beneficiario<\/b> (designado para caso de fallecimiento, 2ª III) <b>≠ Proveedor de Recursos<\/b> (sin ser titular, aporta de manera regular sin obtener los beneficios, 2ª XXXIII).","Igual en las 12 DCG; cambia el objeto: casas de cambio, centros y transmisores hablan sólo de «una Operación»."],"ir":"#t2-1-16","destacado":false},{"etiqueta":"2ª VII","nombre":"Control y el 25 %","sub":"Impone · Nombra · Vota · Dirige","verbo":"Mido","desc":"Control es imponer decisiones, nombrar a la mayoría del consejo, votar más del 50 % o dirigir; además lo ejerce quien adquiere el 25 % o más del capital.","panel":"2.1.16 · Control y el 25 %","puntos":["(i) <b>Imponer<\/b> decisiones en la asamblea · (ii) <b>nombrar<\/b> o destituir a la mayoría de los consejeros · (iii) <b>votar<\/b> más del 50 % del capital · (iv) <b>dirigir<\/b> la administración, estrategia o políticas.","Además: la persona física que, directa o indirectamente, adquiera el <b>25 % o más<\/b> de la composición accionaria o del capital social.","El 25 % es igual en las 12 DCG.","ITF (art. 2 VI): sólo agrega el 25 % «adicional a lo establecido en la Ley»; las cuatro capacidades están en la LRITF."],"ir":"#t2-1-16","destacado":true},{"etiqueta":"4ª II c)","nombre":"Cascada al administrador","sub":"Si nadie llega al 25 %","verbo":"Desciendo","desc":"Si ninguna persona física tiene el 25 % o más ni controla por otros medios, se considera que ejerce el Control el administrador; si éste es persona moral, la persona física que nombró.","panel":"2.1.16 · Cascada al administrador","puntos":["Identificar a los PR de las personas morales que ejerzan el Control (4ª II c).","Si nadie tiene <b>igual o superior al 25 %<\/b> del capital o de los derechos de voto ni ejerce el Control por otros medios → el <b>administrador o administradores<\/b>.","Si el administrador es <b>persona moral o fideicomiso<\/b> → la persona física nombrada como administrador por ella.","<b>Declaración por escrito<\/b> del representante legal sobre quiénes son los PR; con indicios de falsedad, «<b>deberán<\/b> tomar medidas razonables».","La cascada está en las <b>DCG<\/b>, no en los Lineamientos."],"ir":"#t2-1-16","destacado":true},{"etiqueta":"4ª VI","nombre":"Datos y documentos del PR","sub":"Mismo expediente que un cliente","verbo":"Integro","desc":"Del PR se recaban los mismos datos y documentos que de un cliente persona física; con cliente de riesgo bajo no se pide su comprobante de domicilio; si es PEP, aplican la 26ª y 28ª.","panel":"2.1.16 · Datos y documentos del PR","puntos":["Mismos datos y documentos de la 4ª fr. I o III; para el domicilio basta el lugar donde pueda localizarse.","Cliente de <b>riesgo bajo<\/b>: no se recaba el <b>comprobante de domicilio<\/b> del PR.","Si el PR es <b>PEP<\/b>, al Cliente se le aplican la 26ª y la 28ª.","Exentas: personas morales que <b>cotizan en bolsa<\/b> y sus subsidiarias con participación mayoritaria al 50 %.","La fracción cambia por sujeto: casas de bolsa <b>4ª VII<\/b>; casas de cambio y centros <b>4ª III inciso E<\/b>; transmisores <b>4ª IV inciso E<\/b>; ITF <b>art. 11 VI<\/b>."],"ir":"#t2-1-16","destacado":false},{"etiqueta":"4ª I b) iv; 31ª–32ª","nombre":"Por cuenta de otro y fideicomisos","sub":"Rastrear al dueño","verbo":"Rastreo","desc":"Si el cliente declara o hay indicios de que actúa por cuenta de otro, se identifica al PR; en sociedades y asociaciones civiles de riesgo alto, sin importar el porcentaje.","panel":"2.1.16 · Por cuenta de otro y fideicomisos","puntos":["Declaración del cliente de que actúa por cuenta propia o de un tercero; si es de tercero, se aplica la fr. VI (4ª I b) iv).","Indicios de que actúa por cuenta de otro → pedir información para identificar al PR (31ª).","Bancos <b>presume<\/b> que los Sujetos Obligados que ordenan transferencias actúan por cuenta de sus clientes, salvo prueba en contrario.","Sociedades o asociaciones civiles de <b>riesgo alto<\/b>: quien tenga el Control «<b>independientemente del porcentaje<\/b>» (32ª II).","Fideicomisos con entidad no fiduciaria: <b>puede<\/b> cumplir con una constancia firmada por el delegado fiduciario y el OC de la fiduciaria (4ª IX); ITF no prevé esa opción."],"ir":"#t2-1-16","destacado":false},{"etiqueta":"Lineamientos 2019","nombre":"Lineamientos de la SHCP","sub":"Posee · Dirige · Disfruta","verbo":"Me oriento","desc":"Criterios que las Entidades podrán considerar: tres vías para identificar al PR (propiedad, cargo, otro medio) y medidas razonables para obtener y verificar la información.","panel":"2.1.16 · Lineamientos de la SHCP","puntos":["Los emite la SHCP (UBVA) con base en el último párrafo de la fracción de PR de cada DCG; las Entidades «<b>podrán<\/b>» considerarlos (L1).","L3 I <b>Posee<\/b>: propiedad de valores (25 % o más; fracciones menores que juntas suman más del 25 %).","L3 II <b>Dirige<\/b>: cargo de alto mando (decisiones estratégicas o asuntos diarios).","L3 III <b>Disfruta<\/b>: control sin propiedad visible (finanzas, vínculo familiar o personal, algún derecho de propiedad).","L4 III: cuestionarios, actas de asamblea, certificación del capital con el libro de accionistas, informe de poderes, RPC, RNV, RNIE y fuentes independientes."],"ir":"#t2-1-16","destacado":true},{"etiqueta":"Transitorios","nombre":"Beneficiario final","sub":"«Podrán equiparar»","verbo":"Equiparo","desc":"Un transitorio permite equiparar al propietario real las referencias a «beneficiario final» de otros ordenamientos y bases de datos de las autoridades. Es facultad, no obligación.","panel":"2.1.16 · Beneficiario final","puntos":["Bancos: transitoria <b>Quinta<\/b> (DOF 28-ago-2024): las Entidades «<b>podrán<\/b> equiparar».","Lo traen nueve DCG más, con número distinto (SOFOM Sexta; SOCAP y centros Quinta; las demás Séptima).","<b>ITF no lo prevé<\/b>; en casas de cambio no aparece en el texto de estudio (pendiente de cotejar)."],"ir":"#t2-1-16","destacado":false}]},{"letra":"2.1.17","titulo":"Plazos de cumplimiento regulatorio","pregunta":"¿Cuándo vence?","ritmo":"¿Cuándo?","corto":"2.1.17","col ","UC","CCA","TD"],"color":"oscuro"}],"renglones":[{"k":"lpb_aviso","t":"Aviso a la persona suspendida","celdas":{"BAN":"Inmediato · 10 d.h. para acudir","CC":"Inmediato, sin los 10 d.h.","ASE":"Sin LPB","ITF":"Inmediato · 10 d.h. para acudir","demas":"10 d.h. · SOFOM, CCA, TD sin ellos"},"det":{"BAN":"Aviso inmediato por escrito o medios digitales con fundamentos y causas; la persona puede acudir a la autoridad dentro de los 10 días hábiles siguientes a la recepción del escrito.","CC":"Aviso inmediato sólo por escrito; no fija plazo en días (los 10 d.h. son los de la audiencia).","ASE":"Su DCG no lo prevé.","ITF":"Mismo aviso y plazo; sólo Clientes.","demas":"Igual que Bancos, salvo lo que se indica. Igual que Bancos en Casas de bolsa, Fondos, SOCAP, SOFIPO, Uniones e ITF; en SOFOM, Casas de cambio, Centros cambiarios y Transmisores el aviso es inmediato pero no fija los 10 d.h.; Asesores no regula la Lista. — Detalle: SOFOM: Inmediato (sin 10 d.h.) (63ª últ. párr.); Casas de bolsa: Inmediato · 10 d.h. (71ª); Fondos: Inmediato · 10 d.h. (65ª); SOCAP: Inmediato · 10 d.h. (75ª); SOFIPO: Inmediato · 10 d.h. (75ª); Uniones: Inmediato · 10 d.h. (61ª); Centros cambiarios: Inmediato (sin 10 d.h.) (59ª); Transmisores: Inmediato (sin 10 d.h.) (62ª)."},"ref":{"BAN":"DCG Bancos 72ª últ. párr.","CC":"DCG Casas de cambio 61ª","ASE":"","ITF":"DCG ITF art. 62","demas":"DCG de cada sujeto (ver detalle)"},"seguro":true},{"k":"lpb_notif","t":"Notificación de la resolución","celdas":{"BAN":"15 d.h.","CC":"—","ASE":"Sin LPB","ITF":"15 d.h.","demas":"15 d.h. FON, SOFIPO, CCA · resto —"},"det":{"BAN":"Notificación por oficio dentro de los 15 días hábiles siguientes al de la emisión de la resolución.","CC":"Su texto fija 10 d.h. para resolver, pero no fija plazo para notificar.","ASE":"Su DCG no lo prevé.","ITF":"Mismo plazo desde la emisión; puede notificarse al correo que designe la persona.","demas":"Igual que Bancos, salvo lo que se indica. Igual que Bancos en Fondos, SOFIPO, Centros 3 (27ª).","ITF":"Transitorio Segundo, fr. I: sólo las personas de la Octava transitoria de la LRITF, 180 días naturales desde la autorización.","demas":"Igual que Bancos, salvo lo que se indica. Igual que Bancos (18 meses desde la entrada en vigor de su reforma) en SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones y Transmisores; la reforma 2023 de Centros cambiarios no lo prevé; Casas de cambio e ITF, por cotejar. — Detalle: SOFOM: 18 meses (4ª trans. fr. III 2021); Casas de bolsa: 18 meses (5ª trans. fr. III 2021); Fondos: 18 meses (5ª trans. fr. III 2021); SOCAP: 18 meses (3ª trans. fr. III 2021); SOFIPO: 18 meses (5ª trans. fr. III 2021); Uniones: 18 meses (4ª trans. fr. III 2023); Centros cambiarios: no lo prevé (3ª trans. 2023); Transmisores: 18 meses (4ª trans. fr. III 2023)."},"ref":{"BAN":"DCG Bancos 3ª trans. 2024","CC":"","ASE":"DCG Asesores 4ª trans. fr. III 2023","ITF":"DCG ITF, transitorio Segundo (DOF 10-sep-2018)","demas":"DCG de cada sujeto (ver detalle)"},"seguro":{"CC":false}},{"k":"tr_otros","t":"Otros plazos transitorios","celdas":{"BAN":"Certificación del OC: 12 meses","CC":"Por cotejar","ASE":"Anexo 2: 12 meses","ITF":"Expedientes: 360 d.n.","demas":"Anexo 2: 12 m · CB y FON: IP 6 m"},"det":{"BAN":"12 meses desde la entrada en vigor para que el OC cuente con la certificación de la 47ª.","CC":"El md consigna una reforma DOF 21-mar-2019 pero no trae sus transitorios; los últimos presentes son de 2017. Por cotejar contra el DOF.","ASE":"12 meses para la nueva solicitud de autorización del Anexo 2; sin plazo de geolocalización en esta reforma.","ITF":"Transitorio Segundo, fr. II: 360 días naturales desde la autorización para regularizar los expedientes (personas de la Octava transitoria de la LRITF).","demas":"Igual que Bancos, salvo lo que se indica. Distinto en todos: sólo Bancos exige certificar al OC (12 meses); SOFOM, Asesores, SOFIPO, Uniones y Transmisores dan 12 meses para la nueva solicitud del Anexo 2; Casas de bolsa y Fondos, además, 6 meses para geolocalizar por IP; SOCAP y Centros cambiarios no traen otros plazos; Casas de cambio e ITF, por cotejar. — Detalle: SOFOM: Anexo 2: 12 meses (3ª trans. 2021); Casas de bolsa: IP 6 m · Anexo 2 12 m (5ª fr. IV y 3ª trans. 2021); Fondos: IP 6 m · Anexo 2 12 m (5ª fr. IV y 3ª trans. 2021); SOCAP: no lo prevé; SOFIPO: Anexo 2: 12 meses (3ª trans. 2021); Uniones: Anexo 2: 12 meses (3ª trans. 2023); Centros cambiarios: no lo prevé; Transmisores: Anexo 2: 12 meses (3ª trans. 2023)."},"ref":{"BAN":"DCG Bancos 3ª trans. 2024","CC":"","ASE":"DCG Asesores 3ª trans. 2023","ITF":"DCG ITF, transitorio Segundo (DOF 10-sep-2018)","demas":"DCG de cada sujeto (ver detalle)"},"seguro":{"CC":false}}],"comparativo":true,"relaciona":[{"a":"18 · 12 · 18 · 12 meses","b":"Bancos 2024"},{"a":"4 · 9 · 18 meses","b":"Reformas 2021 y 2023"},{"a":"180 d.n. desde la autorización","b":"ITF (Octava transitoria LRITF)"},{"a":"6 meses","b":"Geolocalización por IP · CB y Fondos"}]},{"tipo":"tarjetas","id":"t2-1-17-ganchos","nav":"2.1.17 Ganchos","titulo":"2.1.17 · Ganchos y trampas de plazos","intro":"Ritmos para retener los números y las confusiones que más preguntan.","tarjetas":[{"encabezado":true,"color":"principal","titulo":"Ritmos","subtitulo":"Dilos en voz alta","filas":[{"k":"2 · 10 · 10","v":"OC designado en 2 d.h. (sólo Bancos y Casas de cambio; el resto 10); revocación e interino en 10 d.h., salvo Casas de cambio: día hábil siguiente."},{"k":"15 · 20 · 20","v":"Comité en 15 d.h.; Manual en 20 d.h. tras su aprobación; imposibilidad en el extranjero en 20 d.h."},{"k":"60 · 3 · 24","v":"60 d.n. para dictaminar, 3 d.h. para reportar, 24 h ante sospecha fundada sobre una operación que se pretende realizar o si la persona aparece en la LPB. El «+30» es sólo de Bancos."},{"k":"7,500 / 5,000 · 1,000","v":"Relevantes desde 7,500 USD (5,000 en Centros, Transmisores e ITF); transferencias desde 1,000 USD, mensuales, en 15 d.h."},{"k":"Primeros, salvo S-C-T","v":"los trimestrales van en los 10 primeros d.h.; SOFOM, Centros y Transmisores, en los 10 últimos."},{"k":"10 · 10 · 10 · 15","v":"LPB: 10 d.h. para acudir, 10 de audiencia (+10 una vez), 10 para resolver y 15 para notificar (sólo Bancos, Fondos, SOFIPO, Centros e ITF)."},{"k":"12 · 12 · 5 — 10","v":"metodología con 12 meses de datos, revisión en 12 y 5 años de archivo (también 5 el informe de auditoría); la documentación de las Operaciones, 10 años (Asesores, 5)."},{"k":"4 · 9 · 18","v":"y Bancos «18 · 12 · 18»: meses de las reformas 2021-2023 para Manual, metodología y sistemas, contra la de Bancos 2024."}]},{"encabezado":true,"color":"negro","titulo":"Trampas","subtitulo":"Con fundamento","filas":[{"k":"El OC se avisa en 2 días sólo en dos sujetos","v":"Bancos (reforma 2024) y Casas de cambio avisan la designación del OC en 2 días hábiles; SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO, Uniones, Centros cambiarios, Transmisores e ITF, en 10. No supongas que Centros cambiarios sigue a Casas de cambio. <i>(Bancos 48ª fr. I; Casas de cambio 39ª fr. I; Centros 35ª fr. I)<\/i>"},{"k":"Casas de cambio: revocación e interino al día hábil siguiente","v":"Donde todos dan 10 días hábiles para avisar la revocación del OC y la designación del interino, Casas de cambio da sólo el día hábil siguiente. <i>(Casas de cambio 39ª fr. II y III)<\/i>"},{"k":"«Primeros» contra «últimos» 10 días hábiles","v":"Relevantes se reporta en los 10 PRIMEROS días hábiles de enero, abril, julio y octubre, salvo SOFOM, Centros cambiarios y Transmisores, que usan los 10 ÚLTIMOS. Centros también manda en los últimos su reporte de compras en USD y el de montos de divisas. El informe cuantitativo anual va en los últimos 10 d.h. de abril. <i>(SOFOM 28ª; Centros 22ª, 23ª, 49ª; Transmisores 23ª)<\/i>"},{"k":"Relevantes: 7,500 no es universal","v":"Centros cambiarios, Transmisores e ITF usan 5,000 USD. SOCAP y SOFIPO conservan 7,500 USD pero sólo con billetes y monedas (sin cheques de viajero ni metales); ITF, igual, sólo billetes y monedas. <i>(Centros 2ª fr. XX; Transmisores 2ª fr. XXVII; ITF art. 2 fr. XXIV; SOCAP 2ª fr. XXIX; SOFIPO 2ª fr. XXXI)<\/i>"},{"k":"El efectivo en USD de monto alto releva a Relevantes, no al revés","v":"La operación en efectivo con USD de 7,500 USD o más sí se reporta en el reporte de dólares y, por ella, NO se presenta el de Relevantes. En Centros cambiarios la regla opera desde 5,000 USD con su reporte de compras de más de 1,000 USD. <i>(Bancos 34ª Bis últ. párr.; Casas de bolsa 35ª; Casas de cambio 25ª Bis; Centros 23ª últ. párr.)<\/i>"},{"k":"Los 30 días extra son sólo de Bancos y sólo para la Inusual","v":"La ampliación de 30 días naturales al dictamen de Operación Inusual existe sólo en Bancos, condicionada a criterios en su Manual; no aplica a la Operación Interna Preocupante ni a ningún otro sujeto. <i>(Bancos 37ª 2º párr.; 42ª)<\/i>"},{"k":"¿Desde la alerta o desde la detección?","v":"Los 60 días naturales para dictaminar la Inusual corren desde que se genera la alerta, salvo en ITF, que los cuenta desde que detecta la Operación. En la OIP todos cuentan desde la detección. <i>(Bancos 37ª; ITF art. 69; OIP: Bancos 42ª)<\/i>"},{"k":"LPB: 10 y 15 días que no todos traen","v":"SOFOM, Casas de cambio, Centros cambiarios y Transmisores avisan de inmediato pero no fijan los 10 d.h. para acudir. Los 15 d.h. para notificar la resolución sólo los fijan Bancos, Fondos, SOFIPO, Centros cambiarios e ITF; SOCAP no, aunque SOFIPO sí. <i>(SOFOM 63ª; Casas de cambio 61ª-62ª; Bancos 72ª-73ª; SOFIPO y SOCAP 76ª)<\/i>"},{"k":"«Cada 6 meses» no es lo mismo que «2 por año calendario»","v":"Bancos e ITF reevalúan el riesgo al menos cada 6 meses; SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones hacen al menos dos evaluaciones por año calendario; Asesores, una; Casas de cambio, Centros cambiarios y Transmisores no fijan periodicidad. <i>(Bancos 25ª Bis; ITF art. 30; SOFOM 21ª; Asesores 13ª)<\/i>"},{"k":"Asesores: el sujeto que rompe el patrón","v":"No tiene OC ni Comité (Representante, aviso en 15 d.h.), conserva 5 años y no 10, no reporta Relevantes, no tiene informe de auditoría ni regula la LPB, y el reporte de Inusual corre desde el dictamen del Representante. <i>(Asesores 20ª, 30ª, 31ª, 37ª)<\/i>"}]}],"comparativo":true},{"tipo":"cifras","id":"cifras","nav":"Cifras","titulo":"Cifras y plazos que preguntan","intro":"Cada número con su unidad y su fundamento.","cifras":[["10–100","%","Del monto, por operar con alguien de la LPB o por la OI no reportada (las tres leyes)","LIC 115; LGOAAC 95 y 95 Bis; LRITF 105"],["30,000–100,000","días de salario","Bancos: relevantes, OIP, transferencias y efectivo en moneda extranjera no reportados","LIC 115"],["5,000–50,000","días de salario","Bancos: demás incumplimientos","LIC 115"],["10,000–100,000","días de salario","LGOAAC: reportes no enviados (95 y 95 Bis)","LGOAAC 95 y 95 Bis"],["10–100,000","UMA","ITF: cualquier otro incumplimiento, una sola banda","LRITF 105"],["2","años","Reincidencia desde que quedó firme la resolución; multa hasta el doble","LIC 107 Bis III b"],["5","años","Caducidad de la facultad de sancionar","LIC 109 Bis 1; LRITF 106"],["20","%","Reducción si se paga en 15 días hábiles (LIC: sin medio de defensa)","LIC 109 Bis 1; LRITF 97"],["25","% o más","Control por participación en el capital","Bancos 2ª VII"],["50","%","Más del 50 % del voto (Control) · subsidiarias de cotizadas exentas","Bancos 2ª VII; 4ª VI"],["5,000","USD","Desde ahí piden PR casas de cambio, centros y transmisores","CC y centros 4ª III E; TD 4ª IV E"],["18 · 12 · 18 · 12","meses","Adecuación de Bancos 2024: Manual, metodología, sistemas, certificación del OC","Bancos, transitoria Tercera (DOF 28-ago-2024)"]]},{"tipo":"simulador","id":"examen","nav":"Practicar ▸"}],"temas":{"2.1.15":"2.1.15 Sanciones","2.1.16":"2.1.16 Propietario real","2.1.17":"2.1.17 Plazos de cumplimiento regulatorio"},"modos":[{"k":"s","l":"2.1.15 Sanciones","tema":"2.1.15"},{"k":"p","l":"2.1.16 Propietario real","tema":"2.1.16"},{"k":"z","l":"2.1.17 Plazos","tema":"2.1.17"},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"tr","l":"Cifras y trampas","tipos":["cifra","trampa"]}],"banco":[{"id":"F001","tema":"2.1.15","tipo":"caso","q":"La CNBV detecta que un banco celebró una operación con un cliente que, según se le había informado, ya estaba en la Lista de Personas Bloqueadas. ¿Qué multa prevé la LIC?","a":"Del 10 % al 100 % del monto del acto, operación o servicio realizado","o":["De 30,000 a 100,000 días de salario, por ser conducta de la banda alta","De 5,000 a 50,000 días de salario, por tratarse de un incumplimiento genérico","Del 10 % al 100 % del monto del acto, operación o servicio realizado","De 10 a 100,000 veces el valor diario de la UMA, en una sola banda"],"x":"Operar con alguien que se informó que está en la LPB se multa en porcentaje del monto: 10 % a 100 %. La banda de 30,000 a 100,000 días de salario es para reportes no enviados e incisos a, b, c y e; las UMA son de la LRITF, no de la LIC.","ref":"LIC art. 115 (párrafo de sanciones)"},{"id":"F002","tema":"2.1.15","tipo":"caso","q":"La CNBV detecta que una ITF celebró una operación con un Cliente que, según se le había informado, ya estaba en la Lista de Personas Bloqueadas. ¿Qué multa prevé la LRITF?","a":"Del 10 % al 100 % del monto del acto, operación o servicio realizado","o":["Del 10 % al 100 % del monto del acto, operación o servicio realizado","De 10 a 100,000 veces el valor diario de la UMA, como cualquier otro incumplimiento","De 30,000 a 100,000 días de salario, igual que la banda alta de la LIC","De 10,000 a 100,000 días de salario, igual que la banda alta de la LGOAAC"],"x":"La LRITF conserva la multa en porcentaje para la LPB: 10 % a 100 % del monto, igual que la LIC y la LGOAAC. La banda de 10 a 100,000 UMA es la residual («cualquier otro incumplimiento»), no la de la LPB.","ref":"LRITF art. 105","par":"F001"},{"id":"F003","tema":"2.1.15","tipo":"caso","q":"Un banco no presentó a la CNBV los reportes de operaciones relevantes de un trimestre. ¿Qué rango de multa prevé la LIC para esta conducta?","a":"De 30,000 a 100,000 días de salario","o":["De 10,000 a 100,000 días de salario","De 5,000 a 50,000 días de salario","Del 10 % al 100 % del monto no reportado","De 30,000 a 100,000 días de salario"],"x":"Los relevantes no reportados están en la banda alta de la LIC: 30,000 a 100,000 días de salario. 10,000 a 100,000 es la banda alta de la LGOAAC (casas de cambio y 95 Bis); el 10 %–100 % es sólo para LPB y OI no reportada.","ref":"LIC art. 115 (párrafo de sanciones)"},{"id":"F004","tema":"2.1.15","tipo":"caso","q":"Una casa de cambio no presentó a la CNBV los reportes de operaciones relevantes de un trimestre. ¿Qué rango de multa prevé su ley?","a":"De 10,000 a 100,000 días de salario","o":["De 30,000 a 100,000 días de salario","De 10,000 a 100,000 días de salario","De 2,000 a 30,000 días de salario","De 10 a 100,000 veces el valor de la UMA"],"x":"La casa de cambio se sanciona por el art. 95 LGOAAC: relevantes no reportados, 10,000 a 100,000 días de salario. La banda de 30,000 a 100,000 es la de Bancos (LIC 115); 2,000 a 30,000 es la de los demás casos de la LGOAAC.","ref":"LGOAAC art. 95","par":"F003"},{"id":"F005","tema":"2.1.15","tipo":"caso","q":"Una ITF no presentó a la CNBV los reportes de operaciones relevantes de un trimestre. ¿Qué rango de multa prevé la LRITF para esta conducta?","a":"De 10 a 100,000 veces el valor de la UMA","o":["De 30,000 a 100,000 veces el valor de la UMA","De 10 a 100,000 veces el valor de la UMA","De 10,000 a 100,000 días de salario mínimo","De 5,000 a 50,000 días de salario mínimo"],"x":"La LRITF no tiene banda propia para relevantes: cae en «cualquier otro incumplimiento», una sola banda de diez a cien mil veces el valor de la UMA. Las bandas en días de salario son de la LIC y la LGOAAC.","ref":"LRITF art. 105","par":"F003"},{"id":"F006","tema":"2.1.15","tipo":"cifra","q":"En la LIC, fuera de la LPB, la OI no reportada y las conductas de la banda alta, ¿qué rango aplica a los demás incumplimientos de las disposiciones de PLD/FT?","a":"De 5,000 a 50,000 días de salario","o":["De 2,000 a 30,000 días de salario","De 30,000 a 100,000 días de salario","De 10 a 100,000 veces el valor de la UMA","De 5,000 a 50,000 días de salario"],"x":"La banda residual de la LIC es de 5,000 a 50,000 días de salario. La de 2,000 a 30,000 es la residual de la LGOAAC 95 y 95 Bis, y la de UMA es la de la LRITF.","ref":"LIC art. 115 (párrafo de sanciones)"},{"id":"F007","tema":"2.1.15","tipo":"cifra","q":"En los arts. 95 y 95 Bis de la LGOAAC, ¿qué rango aplica a los demás incumplimientos, distintos de la LPB, la OI no reportada y la banda alta?","a":"De 2,000 a 30,000 días de salario","o":["De 2,000 a 30,000 días de salario","De 5,000 a 50,000 días de salario","De 10,000 a 100,000 días de salario","De 10 a 100,000 veces el valor de la UMA"],"x":"En la LGOAAC la banda residual es de 2,000 a 30,000 días de salario, igual en el 95 y el 95 Bis. La de 5,000 a 50,000 es la residual de la LIC (Bancos).","ref":"LGOAAC arts. 95 y 95 Bis","par":"F006"},{"id":"F008","tema":"2.1.15","tipo":"trampa","q":"Las multas fijas que el art. 115 de la LIC prevé para Bancos por incumplir sus DCG de PLD/FT, ¿en qué unidad están expresadas?","a":"En días de salario mínimo general vigente en el Distrito Federal","o":["En veces el valor diario de la Unidad de Medida y Actualización","En porcentaje del capital neto de la institución de crédito sancionada","En días de salario mínimo general vigente en el Distrito Federal","En pesos fijos que la CNBV actualiza cada año con el índice inflacionario"],"x":"La LIC multa en días de salario mínimo general diario vigente en el Distrito Federal el día de la conducta (109 Bis 1). La trampa es suponer que todas las multas PLD están en UMA: sólo la LRITF usa UMA.","ref":"LIC arts. 115 y 109 Bis 1"},{"id":"F009","tema":"2.1.15","tipo":"trampa","q":"De las tres leyes de la bibliografía que sancionan el incumplimiento de las DCG de PLD/FT, ¿cuál expresa sus multas fijas en UMA?","a":"La Ley para Regular las Instituciones de Tecnología Financiera","o":["La Ley de Instituciones de Crédito, desde su reforma de 2025","La Ley General de Organizaciones y Actividades Auxiliares del Crédito","La LIC y la LGOAAC, pero sólo en la banda de los demás incumplimientos","La Ley para Regular las Instituciones de Tecnología Financiera"],"x":"Sólo la LRITF (art. 105) habla de «veces el valor de la UMA». La LIC y la LGOAAC siguen en días de salario mínimo en todas sus bandas.","ref":"LRITF art. 105; LIC art. 109 Bis 1; LGOAAC art. 95"},{"id":"F010","tema":"2.1.15","tipo":"memoria","q":"¿Qué artículo establece las multas por incumplir las DCG de PLD/FT aplicables a las casas de cambio?","a":"El art. 95 de la LGOAAC","o":["El art. 95 Bis de la LGOAAC","El art. 95 de la LGOAAC","El art. 115 de la LIC","El art. 105 de la LRITF"],"x":"El art. 95 LGOAAC alcanza a las organizaciones auxiliares del crédito y a las casas de cambio. El 95 Bis es para SOFOM no reguladas, centros cambiarios y transmisores; la LIC 115, para Bancos.","ref":"LGOAAC art. 95"},{"id":"F011","tema":"2.1.15","tipo":"caso","q":"Un centro cambiario incumple sus DCG de PLD/FT. ¿Qué artículo prevé su multa?","a":"El art. 95 Bis de la LGOAAC","o":["El art. 95 de la LGOAAC","El art. 115 de la LIC","El art. 95 Bis de la LGOAAC","El art. 105 de la LRITF"],"x":"Centros cambiarios, transmisores y SOFOM no reguladas se sancionan por el art. 95 Bis LGOAAC. El art. 95 es el de las casas de cambio: mismo bloque de cambios y envíos, distinto artículo.","ref":"LGOAAC art. 95 Bis","par":"F010"},{"id":"F012","tema":"2.1.15","tipo":"caso","q":"Una casa de bolsa incumple sus DCG de PLD/FT. Con la bibliografía del temario, ¿qué puede afirmarse sobre la ley que la sanciona?","a":"Sus DCG remiten a su propia ley (LMV), que no forma parte de la bibliografía","o":["Sus DCG remiten a su propia ley (LMV), que no forma parte de la bibliografía","La sanciona el art. 115 de la LIC, con las mismas bandas que a Bancos","La sanciona el art. 95 Bis de la LGOAAC, igual que a los centros cambiarios","La sanciona el art. 105 de la LRITF, por ser una entidad del sector bursátil"],"x":"Las DCG de casas de bolsa remiten a «la Ley», que es la LMV; esa ley no está en la bibliografía, así que el examen sólo exige saber que la sanción está ahí. La LIC 115 es exclusiva de Bancos.","ref":"DCG casas de bolsa 2ª fr. XIX y 65ª–66ª"},{"id":"F013","tema":"2.1.15","tipo":"trampa","q":"La banda alta del art. 95 Bis de la LGOAAC incluye un inciso que la del art. 95 no menciona. ¿Cuál es?","a":"El inciso f","o":["El inciso f","El inciso d","El inciso e","El inciso b"],"x":"El 95 remite a los incisos a, b, c y e del sexto párrafo; el 95 Bis, a los incisos a, b, c, e y f del tercer párrafo. El inciso e está en ambos, por eso no es la diferencia.","ref":"LGOAAC arts. 95 y 95 Bis"},{"id":"F014","tema":"2.1.15","tipo":"memoria","q":"En la banda de 30,000 a 100,000 días de salario, el art. 115 de la LIC incluye el incumplimiento de ciertos incisos. ¿Cómo los cita la ley?","a":"Incisos a, b, c y e del quinto párrafo","o":["Incisos a, b, c y e del sexto párrafo","Incisos a, b, c, e y f del tercer párrafo","Incisos a, b, c y e del quinto párrafo","Incisos a, b, c y d del quinto párrafo"],"x":"La LIC 115 dice literalmente «incisos a., b., c. y e. del quinto párrafo» (conocimiento del cliente, documentación de apertura, resguardo de la información y sistemas automatizados). «Sexto párrafo» es la cita del art. 95 LGOAAC y «tercer párrafo» con el f, la del 95 Bis.","ref":"LIC art. 115 (párrafo de sanciones)"},{"id":"F015","tema":"2.1.15","tipo":"caso","q":"La CNBV emplaza a un banco a un procedimiento de sanción por incumplir sus DCG de PLD/FT. ¿Qué plazo tiene el banco para manifestar lo que a su derecho convenga?","a":"10 días hábiles, ampliables una sola vez por el mismo lapso a petición de parte","o":["15 días hábiles, ampliables por una sola vez hasta por 5 días hábiles adicionales","10 días hábiles, ampliables una sola vez por el mismo lapso a petición de parte","10 días naturales, ampliables cuantas veces lo autorice la Junta de Gobierno","5 días hábiles, sin ampliación posible aunque la entidad lo solicite por escrito"],"x":"La audiencia es de 10 días hábiles, ampliable por una sola ocasión hasta por el mismo lapso, a petición de parte. Los 15 días hábiles son del pago de la multa; los 5, de alegatos.","ref":"LIC art. 107 Bis, fr. I"},{"id":"F016","tema":"2.1.15","tipo":"cifra","q":"En el procedimiento de sanción de la LIC, ¿cuál es el plazo máximo para emitir y notificar la resolución?","a":"180 días hábiles","o":["60 días hábiles","90 días naturales","5 días hábiles","180 días hábiles"],"x":"La resolución se emite en no más de 180 días hábiles. Los 60 días hábiles son el máximo para desahogar pruebas y los 5 días hábiles, para alegatos. La LRITF (art. 98) repite 60 · 5 · 180.","ref":"LIC art. 107 Bis"},{"id":"F017","tema":"2.1.15","tipo":"caso","q":"Un banco comete la misma infracción de PLD/FT 18 meses después de que quedó firme la resolución que lo sancionó por ella. ¿Cómo lo trata la LIC?","a":"Hay reincidencia, y la multa puede llegar hasta el doble de la que corresponda","o":["No hay reincidencia, porque ésta sólo se configura dentro del año siguiente a la notificación","Hay reincidencia, y la multa se triplica sin sujetarse al máximo de la banda que corresponda","Hay reincidencia, y la multa puede llegar hasta el doble de la que corresponda","No hay reincidencia, porque el plazo de 2 años se cuenta desde la fecha de la primera conducta"],"x":"Reincide quien comete la misma infracción dentro de los 2 años siguientes a que quedó firme la resolución; 18 meses está dentro. La consecuencia es una multa de hasta el doble, no el triple. El plazo corre desde que la resolución quedó firme, no desde la conducta.","ref":"LIC art. 107 Bis, fr. III, inciso b)"},{"id":"F018","tema":"2.1.15","tipo":"caso","q":"Una ITF reincide en una infracción de PLD/FT dentro de los 2 años siguientes a que quedó firme la resolución previa. Además de la multa, ¿qué medida prevé la LRITF?","a":"Que la CNBV pueda revocar su autorización, con aprobación del Comité Interinstitucional","o":["Que la CNBV pueda revocar su autorización, con aprobación del Comité Interinstitucional","La cancelación de su registro por la CONDUSEF y su disolución y liquidación forzosa","La revocación de su autorización por la SHCP, sin intervención de la CNBV ni del Comité","La suspensión de su autorización por la UIF hasta que regularice todos sus reportes"],"x":"La LRITF 69 faculta («podrá») a la CNBV, después de escuchar a la ITF y con aprobación del Comité Interinstitucional, a revocar la autorización; la fr. VII exige que se reincida pese a las observaciones y acciones correctivas, y la VIII cubre las conductas graves. La disolución y liquidación es consecuencia de la cancelación de un centro cambiario (LGOAAC), no de una ITF.","ref":"LRITF art. 69, fr. VII; art. 98, fr. III, inciso b)","par":"F017"},{"id":"F019","tema":"2.1.15","tipo":"caso","q":"Un banco paga su multa de PLD/FT dentro de los 15 días hábiles siguientes a la notificación y no interpone medio de defensa. ¿Qué beneficio le da la LIC?","a":"Una reducción del 20 % del monto de la multa","o":["Una reducción de la tercera parte del monto de la multa","Una reducción del 50 % si además resarce el daño causado","La conversión de la multa en una amonestación pública","Una reducción del 20 % del monto de la multa"],"x":"La LIC prevé la reducción del 20 % si se paga en 15 días hábiles y no se interpuso medio de defensa. Resarcir el daño es atenuante, pero no da un 50 %. En la LRITF el requisito cambia: manifestar por escrito la conformidad.","ref":"LIC art. 109 Bis 1"},{"id":"F020","tema":"2.1.15","tipo":"caso","q":"Una ITF quiere obtener la reducción de su multa de PLD/FT pagándola dentro de los 15 días hábiles. Además del pago oportuno, ¿qué le exige la LRITF?","a":"Manifestar por escrito su conformidad con la resolución","o":["No haber interpuesto ningún medio de defensa en su contra","Manifestar por escrito su conformidad con la resolución","Haber resarcido el daño y aportado información a la CNBV","Obtener la aprobación previa del Comité Interinstitucional"],"x":"La LRITF condiciona la reducción del 20 % a que se manifieste por escrito la conformidad. «No interponer medio de defensa» es el requisito de la LIC (Bancos): mismo beneficio, otra condición.","ref":"LRITF art. 97","par":"F019"},{"id":"F021","tema":"2.1.15","tipo":"cifra","q":"¿En cuánto tiempo caduca la facultad de la CNBV para imponer sanciones conforme a la LIC y desde cuándo se cuenta?","a":"5 años, desde el día hábil siguiente a aquél en que se realizó la conducta","o":["2 años, desde el día hábil siguiente a aquél en que quedó firme la resolución","5 años, desde el día hábil siguiente a aquél en que se realizó la conducta","5 años, desde que la CNBV notifica el inicio del procedimiento de sanción","10 años, igual que el plazo de conservación de los expedientes del Cliente"],"x":"La caducidad es de 5 años desde el día hábil siguiente a la conducta (igual en la LRITF, art. 106). Los 2 años desde que quedó firme la resolución son los de la reincidencia; los 10 años, los de conservación.","ref":"LIC art. 109 Bis 1; LRITF art. 106"},{"id":"F022","tema":"2.1.15","tipo":"caso","q":"La CNBV presume que un transmisor de dinero está violando el art. 95 Bis de la LGOAAC. ¿Qué puede ordenar, además de la multa?","a":"Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él","o":["Que la UIF lo incluya en la Lista de Personas Bloqueadas mientras dure el procedimiento de sanción","Que el Banco de México congele sus cuentas hasta que la resolución de la CNBV quede firme","Que la CONDUSEF revoque su autorización y la publique en su portal como información reservada","Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él"],"x":"El 95 Bis faculta a la CNBV para ordenar a instituciones de crédito, casas de bolsa y casas de cambio que suspendan o cancelen contratos con centros cambiarios y transmisores, y se abstengan de nuevas operaciones, cuando presuma que violan el artículo.","ref":"LGOAAC art. 95 Bis"},{"id":"F023","tema":"2.1.16","tipo":"trampa","q":"Una entidad incorporó íntegros a su Manual los Lineamientos 2019 de propietario real. ¿Qué efecto tiene eso sobre sus obligaciones de PR?","a":"Por sí solo no acredita el cumplimiento: la obligación está en las DCG","o":["Por sí solo no acredita el cumplimiento: la obligación está en las DCG","Acredita por sí solo el cumplimiento, porque los Lineamientos sustituyen a las DCG","Acredita el cumplimiento sólo si además los registra ante la UIF en 90 días naturales","Lo vuelve optativo, porque las DCG sólo obligan a quien no adopte los Lineamientos"],"x":"L1: los Lineamientos son criterios enunciativos mas no limitativos que las Entidades «podrán» considerar, y adoptarlos total o parcialmente no significa por sí solo cumplir. La obligación (definición, 25 %, cascada, datos) vive en cada DCG.","ref":"Lineamientos PR 2019, L1; DCG Bancos 4ª fr. VI, último párrafo"},{"id":"F024","tema":"2.1.16","tipo":"memoria","q":"Para Bancos, ¿dónde está la obligación de identificar al propietario real, con su definición y el umbral del 25 %?","a":"En las DCG de Bancos: 2ª fr. VII y XXXII y 4ª fr. II inciso c) y fr. VI","o":["En los Lineamientos 2019 de la SHCP, que son la fuente del umbral del 25 %","En el art. 115 de la LIC, que define al propietario real y fija el umbral","En las DCG de Bancos: 2ª fr. VII y XXXII y 4ª fr. II inciso c) y fr. VI","En el Manual de cada banco, que fija libremente el umbral de participación"],"x":"Definición (2ª XXXII), Control con el 25 % o más (2ª VII), cascada (4ª II c) y datos (4ª VI) están en las DCG. El fallo típico es atribuir el 25 % a los Lineamientos, que sólo orientan.","ref":"DCG Bancos 2ª fr. VII y XXXII; 4ª fr. II inciso c) y fr. VI"},{"id":"F025","tema":"2.1.16","tipo":"memoria","q":"¿Quién emite los Lineamientos para la identificación del propietario real que las Entidades podrán considerar?","a":"La SHCP, por conducto de la Unidad de Banca, Valores y Ahorro","o":["La CNBV, por acuerdo de su Junta de Gobierno y como parte de las DCG","El Banco de México, por conducto de su Dirección de Sistemas de Pagos","La CONDUSEF, como parte de sus disposiciones de transparencia","La SHCP, por conducto de la Unidad de Banca, Valores y Ahorro"],"x":"La 4ª VI de las DCG dice que «la Secretaría» emitirá los lineamientos; los de 2019 los expidió la SHCP por la UBVA. No forman parte de las DCG que emite la CNBV.","ref":"DCG Bancos 4ª fr. VI, último párrafo; Lineamientos PR 2019"},{"id":"F026","tema":"2.1.16","tipo":"caso","q":"Un banco abre una cuenta a una sociedad anónima en la que ninguna persona física tiene el 25 % o más del capital ni de los derechos de voto, y nadie ejerce el Control por otros medios. ¿A quién considera propietario real?","a":"Al administrador o administradores de la sociedad","o":["Al accionista con la mayor participación, aunque no llegue al 25 %","Al administrador o administradores de la sociedad","Al representante legal que firma la declaración sobre los propietarios reales","A nadie: la cuenta se abre sin propietario real por no haber Control"],"x":"La cascada de la 4ª II c): si nadie tiene igual o superior al 25 % ni ejerce el Control por otros medios, se considera que lo ejerce el administrador o administradores. El representante legal firma la declaración, pero no se vuelve PR por ello.","ref":"DCG Bancos 4ª fr. II, inciso c)"},{"id":"F027","tema":"2.1.16","tipo":"caso","q":"En la misma situación de cascada, el administrador de la sociedad cliente de un banco es otra persona moral. ¿A quién se identifica como propietario real?","a":"A la persona física que esa persona moral nombró como administrador","o":["Al accionista mayoritario de la persona moral que funge como administradora","Al representante legal de la sociedad que abre la cuenta en el banco","A la persona física que esa persona moral nombró como administrador","A la persona moral administradora, con los datos de una persona moral"],"x":"Si el administrador es persona moral o fideicomiso, la 4ª II c) lleva a la persona física nombrada como administrador por ella. El PR siempre es persona física, por eso no puede quedarse en la persona moral administradora.","ref":"DCG Bancos 4ª fr. II, inciso c)"},{"id":"F028","tema":"2.1.16","tipo":"trampa","q":"Un analista afirma que los Lineamientos 2019 imponen una cascada obligatoria que termina en el administrador. ¿Qué establecen en realidad?","a":"Tres vías (propiedad, cargo, otro medio) en lista de prelación o indistintas","o":["Tres vías (propiedad, cargo, otro medio) en lista de prelación o indistintas","La misma cascada de las DCG, que los Lineamientos hacen obligatoria","Tres vías que siempre se aplican en este orden: cargo, propiedad, otro medio","Una sola vía, la del cargo de alto mando, que sustituye a la cascada"],"x":"La cascada al administrador es de las DCG (4ª II c). Los Lineamientos (L3) dan tres vías que «podrán» considerarse y cuyo último párrafo permite fijarlas en lista de prelación o aplicarlas de manera indistinta.","ref":"Lineamientos PR 2019, L3, fr. I a III y último párrafo"},{"id":"F029","tema":"2.1.16","tipo":"trampa","q":"En los Lineamientos 2019, ¿en qué supuesto se usa la expresión «más del 25 %» en lugar de «25 % o más»?","a":"Al sumar titulares con menos del 25 % para ver si, en conjunto, superan ese umbral","o":["Al sumar titulares con menos del 25 % para ver si, en conjunto, superan ese umbral","En la definición de Control por participación en el capital de las DCG de cada sujeto","En la cascada que lleva al administrador cuando nadie tiene participación suficiente","En el voto que confiere Control sobre las decisiones del capital social de la sociedad"],"x":"«Más del 25 %» sólo aparece en L3 I, en el párrafo del capital fraccionado en partes menores al 25 %. Las DCG (2ª VII y 4ª II c) y L3 I a) dicen «25 % o más»; el voto que da Control es «más del 50 %».","ref":"Lineamientos PR 2019, L3, fr. I; DCG Bancos 2ª fr. VII"},{"id":"F030","tema":"2.1.16","tipo":"caso","q":"Una persona física tiene exactamente el 25 % del capital social de una sociedad cliente de un banco y no ocupa ningún cargo. Conforme a las DCG, ¿ejerce el Control?","a":"Sí: la DCG considera Control adquirir el 25 % o más del capital","o":["No: para ejercer el Control se requiere más del 25 % del capital","No: para ejercer el Control se requiere votar más del 50 % del capital","Sí: la DCG considera Control adquirir el 25 % o más del capital","Sólo si además ocupa un cargo de alto mando en la sociedad cliente"],"x":"La 2ª VII de Bancos considera que ejerce Control la persona física que adquiera el 25 % o más del capital; el 25 % exacto queda dentro. «Más del 25 %» es la regla de suma de fracciones de los Lineamientos, no la de las DCG.","ref":"DCG Bancos 2ª fr. VII"},{"id":"F031","tema":"2.1.16","tipo":"caso","q":"Tres hermanos tienen, cada uno, el 10 % del capital de una sociedad cliente. Si la entidad sigue los Lineamientos 2019, ¿qué podrá hacer?","a":"Identificar a cada titular y si existe relación jurídica entre ellos para ver si en conjunto tienen más del 25 %","o":["Descartarlos, porque ninguno alcanza por sí solo el 25 % o más del capital social","Identificar a cada titular y si existe relación jurídica entre ellos para ver si en conjunto tienen más del 25 %","Considerarlos propietarios reales sólo si los tres son personas políticamente expuestas","Tomar de inmediato al administrador como PR, sin analizar a los hermanos ni sus vínculos"],"x":"L3 I: si el capital está fraccionado en partes menores al 25 %, la entidad «podrá» identificar a cada titular y ver si en su conjunto tienen más del 25 %. Descartarlos por no llegar cada uno al 25 % ignora esa regla.","ref":"Lineamientos PR 2019, L3, fr. I"},{"id":"F032","tema":"2.1.16","tipo":"caso","q":"Una persona sin acciones ni cargo en la sociedad cliente decide de hecho sus asuntos por su vínculo familiar con el director general. ¿En qué vía de los Lineamientos 2019 encaja?","a":"Control por otro medio (L3 fr. III)","o":["Control por propiedad (L3 fr. I)","Control por cargo (L3 fr. II)","Medidas razonables (L4 fr. III)","Control por otro medio (L3 fr. III)"],"x":"L3 III cubre el Control sin propiedad visible: participación en las finanzas, relación personal o vínculo familiar con los altos mandos. La vía del cargo (L3 II) exige un cargo de alto mando, que esta persona no tiene.","ref":"Lineamientos PR 2019, L3, fr. III"},{"id":"F033","tema":"2.1.16","tipo":"trampa","q":"Pese a que los Lineamientos 2019 son orientadores, la vía del cargo usa una expresión imperativa. ¿Cuál?","a":"La persona «deberá» contar con un cargo de alto mando","o":["La persona «deberá» tener además el 25 % o más del capital","La persona «podrá» tener cualquier cargo, aun sin ser directivo","La persona «deberá» contar con un cargo de alto mando","La persona «deberá» estar inscrita en el Registro Público de Comercio"],"x":"L3 II b) (control sobre asuntos diarios mediante un cargo directivo) dice que, bajo ese supuesto, la persona «deberá contar con un cargo de alto mando». Es el matiz de la trampa «DCG obligan, Lineamientos orientan».","ref":"Lineamientos PR 2019, L3, fr. II, inciso b)"},{"id":"F034","tema":"2.1.16","tipo":"caso","q":"Una entidad duda de la veracidad del cuestionario de PR que entregó su cliente persona moral. ¿Cuál de estas es una medida razonable prevista en los Lineamientos 2019?","a":"Pedir la certificación de la integración del capital con los asientos del libro de accionistas","o":["Pedir la certificación de la integración del capital con los asientos del libro de accionistas","Pedir a la UIF una constancia oficial que confirme quién es el propietario real del cliente","Solicitar a la CNBV un dictamen previo sobre la estructura accionaria del cliente persona moral","Exigir al cliente que sustituya a su administrador por una persona física antes de operar"],"x":"L4 III c) prevé la certificación de la integración del capital junto con los asientos del libro de registro de accionistas; también actas de asamblea, informe de poderes y consulta al RPC, RNV y RNIE. Ninguna medida consiste en pedir constancias a la UIF o a la CNBV.","ref":"Lineamientos PR 2019, L4, fr. III, inciso c)"},{"id":"F035","tema":"2.1.16","tipo":"caso","q":"Un banco abre una cuenta a un cliente clasificado de riesgo bajo que actúa en beneficio de un propietario real. Conforme a la 4ª VI, ¿qué recaba del PR?","a":"Los mismos datos que de un cliente, sin pedir su comprobante de domicilio","o":["Sólo el nombre completo del PR, sin documentos que acrediten su identidad","Nada: con un cliente de riesgo bajo no se identifica al propietario real","Los mismos datos y documentos, con comprobante de domicilio y pasaporte","Los mismos datos que de un cliente, sin pedir su comprobante de domicilio"],"x":"La 4ª VI pide del PR los mismos datos y documentos de la 4ª I o III; cuando el cliente es de riesgo bajo, no se recaba el comprobante de domicilio del PR. La dispensa es de un documento, no de la identificación del PR.","ref":"DCG Bancos 4ª fr. VI"},{"id":"F036","tema":"2.1.16","tipo":"caso","q":"Una ITF atiende a un Cliente de riesgo bajo que actúa en beneficio de un propietario real. ¿Qué prevé el art. 11 VI de sus DCG respecto de los documentos del PR?","a":"Recaba los datos de identificación de las fr. I o III: no prevé la dispensa por riesgo bajo","o":["Omite el comprobante de domicilio del PR, exactamente igual que los Bancos","Recaba los datos de identificación de las fr. I o III: no prevé la dispensa por riesgo bajo","Omite toda la documentación del PR y sólo pide una declaración del Cliente","Sólo identifica al PR en operaciones de 5,000 USD o más, como las casas de cambio"],"x":"El art. 11 VI de ITF pide del PR los datos de identificación de las fracciones I o III y no trae la regla de Bancos (4ª VI) que exime del comprobante de domicilio cuando el cliente es de riesgo bajo. El umbral de 5,000 USD es de casas de cambio, centros y transmisores, no de ITF.","ref":"DCG ITF art. 11, fr. VI","par":"F035"},{"id":"F037","tema":"2.1.16","tipo":"caso","q":"Un banco detecta que el propietario real de uno de sus clientes es una persona políticamente expuesta. ¿Qué prevé la 4ª VI de sus DCG?","a":"Que al Cliente se le apliquen las reglas 26ª y 28ª","o":["Que se rechace siempre la apertura o se cancele el contrato","Que al Cliente se le apliquen las reglas 26ª y 28ª","Que se envíe un reporte de 24 horas a la SHCP por ese solo hecho","Que el PR quede exento de identificarse por ser servidor público"],"x":"Si el PR es PEP, la 4ª VI remite a las reglas 26ª y 28ª, que se aplican al Cliente. No hay prohibición automática de operar ni un reporte por el solo hecho de ser PEP.","ref":"DCG Bancos 4ª fr. VI"},{"id":"F038","tema":"2.1.16","tipo":"caso","q":"En una casa de bolsa, el propietario real de un cliente de riesgo alto es una persona políticamente expuesta. ¿Qué exige su DCG para iniciar o continuar la relación comercial?","a":"La aprobación del directivo con facultades específicas que prevé la 24ª","o":["Un reporte de operación inusual dentro de 24 horas","La autorización previa de la CNBV para operar con él","La firma de una constancia del delegado fiduciario de la entidad","La aprobación del directivo con facultades específicas que prevé la 24ª"],"x":"La 4ª VII de casas de bolsa remite expresamente a la aprobación de la 24ª. En Bancos el efecto es el mismo por remisión: la 4ª VI manda aplicar al Cliente la 26ª y la 28ª, y la 26ª pide la aprobación de un directivo para PEP de riesgo alto. No se prevé autorización de la CNBV ni un reporte de 24 horas.","ref":"DCG casas de bolsa 4ª fr. VII y 24ª; DCG Bancos 4ª f
