 la Secretaría autorice previamente su uso por la ITF","Ninguna autorización particular, si el activo virtual ya es de uso común entre el público","Que el activo esté inscrito en un registro de la CNBV y dar aviso a la UIF antes de empezar a operarlo"],"x":"El art. 30 LRITF permite a las ITF operar sólo con los activos virtuales que determine el Banco de México mediante disposiciones generales y exige su autorización previa. No son activos virtuales la moneda de curso legal, las divisas ni lo denominado en ellas.","ref":"LRITF art. 30 · H5"},{"id":"E061","tema":"h5","tipo":"caso","q":"Una institución de financiamiento colectivo diseña su monitoreo. ¿Desde qué monto mensual de las operaciones de sus Clientes que señala el art. 43 de su DCG debe aplicar mecanismos de seguimiento más estrictos?","a":"Igual o superior al equivalente a 12,500 UDIS en un mes calendario","o":["Igual o superior al equivalente a 7,500 UDIS en un mes calendario","Igual o superior al equivalente a 7,500 USD en un mes calendario","Igual o superior al equivalente a 12,500 UDIS en un mes calendario","Igual o superior al equivalente a 100,000 USD acumulados en un mes calendario"],"x":"El art. 43 de la DCG de ITF manda dar seguimiento y agrupar las Operaciones con independencia del monto, y endurecerlo en la IFC cuando sus Clientes operen en un mes, en efectivo (moneda nacional o extranjera) o en activos virtuales, por 12,500 UDIS o más. La IFPE baja el umbral a 7,500 UDIS. Las ITF miden en UDIS; los 100,000 USD son de Centros cambiarios.","ref":"DCG ITF art. 43 fr. I · H5","par":"E062"},{"id":"E062","tema":"h5","tipo":"caso","q":"Una institución de fondos de pago electrónico diseña su monitoreo. ¿Desde qué monto mensual de las operaciones de sus Clientes que señala el art. 43 de su DCG debe aplicar mecanismos de seguimiento más estrictos?","a":"Igual o superior al equivalente a 7,500 UDIS en un mes calendario","o":["Igual o superior al equivalente a 100,000 USD acumulados en un mes calendario","Igual o superior al equivalente a 7,500 USD en un mes calendario","Igual o superior al equivalente a 12,500 UDIS en un mes calendario","Igual o superior al equivalente a 7,500 UDIS en un mes calendario"],"x":"El art. 43 fr. II de la DCG de ITF endurece el seguimiento de la IFPE cuando sus Clientes operen en un mes, en efectivo, en fondos de pago electrónico (moneda nacional o extranjera) o en activos virtuales, por 7,500 UDIS o más. Para la IFC el umbral es 12,500 UDIS. El distractor de 7,500 USD cambia la unidad: la DCG de ITF mide en UDIS.","ref":"DCG ITF art. 43 fr. II · H5","par":"E061"},{"id":"E063","tema":"h5","tipo":"cifra","q":"Una IFPE ofrece a personas físicas una cuenta nivel 2 con régimen de identificación simplificado. ¿A cuánto se limita la operación mensual de esa cuenta?","a":"Al equivalente a 3,000 UDIS en el transcurso de un mes calendario","o":["Al equivalente a 750 UDIS en el transcurso de un mes calendario","Al equivalente a 3,000 UDIS en el transcurso de un mes calendario","Al equivalente a 7,500 UDIS en el transcurso de un mes calendario, igual que el umbral de su art. 43","Al equivalente a 1,700 UDIS en el transcurso de un mes calendario"],"x":"El art. 12 fr. II de la DCG de ITF limita el nivel 2 a 3,000 UDIS al mes y pide, además de los datos del nivel 1, el domicilio y la versión digital del documento de identificación. Los 750 UDIS son el límite mensual del nivel 1 y los 1,700 UDIS, el de las cuentas para transferencias internacionales de riesgo bajo. Si se rebasan, se integra el expediente del art. 11.","ref":"DCG ITF art. 12 · H5"},{"id":"E064","tema":"h5","tipo":"caso","q":"Una IFPE recibe de un Usuario Remitente el equivalente a 800 USD para transmitirlo en términos del art. 81-A Bis de la LGOAAC. Además de los datos que se recaban con independencia del monto, ¿qué debe recabar?","a":"Ninguno adicional, porque el siguiente escalón de identificación inicia en 1,000 USD","o":["El expediente completo del remitente, porque toda transmisión al extranjero lo exige sin importar el monto","Los datos de identificación del escalón que va de 500 a menos de 3,000 USD","Ninguno adicional, porque el siguiente escalón de identificación inicia en 1,000 USD","Copia de la identificación oficial de quien interviene, porque ese escalón inicia en 500 USD"],"x":"El art. 101 de la DCG de ITF escalona la identificación del servicio de transmisión: fr. I datos con independencia del monto; fr. II de 1,000 a menos de 3,000 USD; fr. III de 3,000 a menos de 5,000; fr. IV desde 5,000. A diferencia del transmisor de dinero (escalón desde 500 USD), a 800 USD la IFPE sólo recaba los datos de la fr. I.","ref":"DCG ITF art. 101; Transmisores 4ª fr. II · H5","par":"E041"},{"id":"E065","tema":"h5","tipo":"caso","q":"Una ITF prepara el reporte de Operaciones Relevantes. ¿Desde qué monto es relevante una operación con billetes y en qué plazo se reporta?","a":"Desde 5,000 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","o":["Desde 5,000 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 7,500 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre de cada año","Desde 7,500 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre"],"x":"La DCG de ITF define la Operación Relevante desde 5,000 USD, sólo con billetes y monedas metálicas (art. 2 XXIV), y el art. 66 manda reportar dentro de los diez primeros días hábiles de enero, abril, julio y octubre, como Bancos. Transmisores y Centros usan el mismo umbral, pero reportan en los diez últimos días hábiles.","ref":"DCG ITF art. 2 fr. XXIV; art. 66 · H5","par":"E046"},{"id":"E066","tema":"h5","tipo":"caso","q":"Una ITF recibe de un Cliente, en efectivo, el equivalente a 800 USD en euros. Según su DCG, ¿qué reporte de operaciones en efectivo con moneda extranjera corresponde?","a":"Uno por cada operación en efectivo en cualquier moneda extranjera desde 500 USD, en los diez primeros días hábiles","o":["Uno por cada operación en efectivo en dólares desde 7,500 USD, en los diez primeros días hábiles del trimestre siguiente","Uno por cada operación en efectivo en cualquier moneda extranjera desde 500 USD, en los diez primeros días hábiles","Uno por cada compra en efectivo de más de 1,000 USD, en los diez últimos días hábiles del trimestre","Ninguno: su DCG no prevé un reporte de operaciones en efectivo con moneda extranjera"],"x":"El art. 67 de la DCG de ITF exige reportar cada Operación con Clientes, o entre ellos, en efectivo en moneda extranjera por 500 USD o más o su equivalente en la moneda en que se realice, dentro de los diez primeros días hábiles de enero, abril, julio y octubre. No se limita a dólares, a diferencia del reporte de USD de Bancos; los transmisores no tienen este reporte.","ref":"DCG ITF art. 67 · H5","par":"E048"},{"id":"E067","tema":"h5","tipo":"caso","q":"El sistema de una ITF detectó el 3 de marzo una operación que podría ser inusual. ¿Desde cuándo y por cuánto tiempo corre el plazo del Comité para dictaminarla?","a":"Hasta 60 días naturales contados desde que la ITF detecta la operación","o":["Hasta 60 días hábiles contados desde que el Oficial de Cumplimiento la presenta al Comité","Hasta 60 días naturales contados desde la siguiente sesión ordinaria del Comité","Hasta 60 días naturales contados desde que la ITF detecta la operación","Hasta 30 días naturales contados desde que la ITF detecta la operación"],"x":"El art. 69 de la DCG de ITF da al Comité un periodo que no excede de sesenta días naturales contados a partir de que la ITF detecte la operación por su sistema, modelo, proceso o empleado, lo que ocurra primero; el reporte se envía dentro de los tres días hábiles siguientes a la sesión que la dictamine. Centros y Transmisores cuentan desde que se genera la alerta.","ref":"DCG ITF art. 69; Centros cambiarios 24ª; Transmisores 26ª · H5"},{"id":"E068","tema":"h5","tipo":"caso","q":"Un Cliente de una ITF vende activos virtuales y recibe a cambio pesos por el equivalente a 8,000 UDIS. ¿Qué reporte corresponde según la DCG de ITF?","a":"Un reporte de esa operación con activos virtuales, en los diez primeros días hábiles de enero, abril, julio y octubre","o":["Un reporte de Operación Relevante, porque toda venta de activos virtuales se equipara a efectivo","Un reporte de esa operación con activos virtuales, dentro de las 24 horas siguientes a su liquidación, como Operación Inusual","Un reporte de esa operación con activos virtuales, en los diez primeros días hábiles de enero, abril, julio y octubre","Ninguno: el umbral del reporte de activos virtuales de las ITF está en 7,500 USD, no en UDIS"],"x":"El art. 74 de la DCG de ITF exige un reporte trimestral, dentro de los diez primeros días hábiles de enero, abril, julio y octubre, cuando el Cliente vende activos virtuales y recibe moneda de curso legal por un monto igual o superior a 7,500 UDIS. El umbral está en UDIS, no en USD como en Bancos.","ref":"DCG ITF art. 74 · H5"},{"id":"E069","tema":"h5","tipo":"caso","q":"Una ITF cuenta con 18 personas para el cumplimiento de sus fines. ¿Qué dispone su DCG sobre el Comité de Comunicación y Control?","a":"No está obligada a constituirlo; sus funciones las ejerce el OC y la ITF lo comunica en 60 días hábiles","o":["Debe constituirlo, pero el Oficial de Cumplimiento puede asumir por sí solo la función de dictaminar las Operaciones Inusuales","No está obligada a constituirlo; sus funciones las ejerce el director general, sin aviso alguno","Debe constituirlo con al menos tres miembros, aunque puede sesionar una vez por trimestre","No está obligada a constituirlo; sus funciones las ejerce el OC y la ITF lo comunica en 60 días hábiles"],"x":"El art. 46 exime de constituir el Comité a las ITF con menos de veinticinco personas; las funciones del art. 45 las ejerce el Oficial de Cumplimiento. El art. 48 obliga a comunicar esa situación a la Secretaría dentro de sesenta días hábiles desde la autorización o desde que se reduce el personal.","ref":"DCG ITF arts. 46, último párrafo, y 48, último párrafo · H5"},{"id":"E070","tema":"h5","tipo":"caso","q":"Una ITF necesita la clave para acceder al sistema electrónico de la CNBV por el que enviará sus reportes. ¿Qué plazo fija su DCG?","a":"Solicitarla y contar con ella al momento de iniciar operaciones","o":["Solicitarla dentro de los 20 días hábiles posteriores a su registro","Solicitarla y contar con ella al momento de iniciar operaciones","Solicitarla dentro de los 10 días hábiles siguientes a que designe a su Oficial de Cumplimiento","Solicitarla dentro de los 15 días hábiles siguientes a que presente su primer reporte trimestral"],"x":"El art. 98 de la DCG de ITF ordena solicitar la clave a la CNBV y contar con ella al momento de iniciar operaciones, como Bancos (69ª-1). Los veinte días hábiles posteriores al registro son la regla de Transmisores (59ª-1) y Centros cambiarios (56ª Bis).","ref":"DCG ITF art. 98; Transmisores 59ª-1 · H5","par":"E049"},{"id":"E071","tema":"h5","tipo":"caso","q":"Un agente relacionado de un transmisor de dinero firma un contrato con una papelería, persona moral, para que ésta entregue a los beneficiarios los recursos que el agente le pase. ¿Qué figura es la papelería según la DCG?","a":"Tercero, por su relación contractual con el agente relacionado","o":["Persona Jurídica Coadyuvante, por ser persona moral que entrega recursos a los beneficiarios","Tercero, por su relación contractual con el agente relacionado","Agente Relacionado del transmisor, por entregar directamente recursos al Usuario Beneficiario","Entidad financiera con contrato con el transmisor, por recibir recursos para entregarlos"],"x":"La 2ª fr. XXXV define al Tercero como la persona física o moral que, por contrato con un Agente Relacionado o una Persona Jurídica Coadyuvante (o con otro transmisor o entidad financiera que tenga contrato con el transmisor), recibe de ellos recursos para entregarlos al beneficiario. Lo tentador es «coadyuvante», pero la Persona Jurídica Coadyuvante pacta directamente con el transmisor (2ª XXVIII). El agente debe firmar con el Tercero un contrato con los mismos requisitos de la 50ª fr. III (inciso k) y el transmisor responde también por los Terceros (50ª fr. I).","ref":"Transmisores 2ª fr. XXVIII y XXXV; 50ª fr. I y fr. III inciso k) · H5"},{"id":"E072","tema":"h5","tipo":"trampa","q":"Un transmisor de dinero evalúa con quiénes firmar contrato para pagar remesas. ¿Cuál de los siguientes NO puede ser Persona Jurídica Coadyuvante?","a":"Otro transmisor de dinero con registro vigente que pagaría los envíos por contrato","o":["Otro transmisor de dinero con registro vigente que pagaría los envíos por contrato","Una sociedad anónima con una cadena de farmacias que pagaría remesas por contrato","Una persona física con actividad empresarial, dueña de una tienda de abarrotes","Una S. de R.L. que vende teléfonos y recibiría por contrato los envíos de remitentes"],"x":"La 2ª fr. XXVIII excluye expresamente de la figura a los transmisores de dinero y a las entidades financieras que, conforme a sus leyes, hacen las operaciones del 81-A Bis y operan por contrato con un transmisor; con ellos la relación se rige por la 50ª fr. II y III Bis. Las otras tres sí encajan: persona moral o persona física con actividad empresarial (secciones I y II, Cap. II, Tít. IV LISR) que pacta recibir o entregar recursos por contrato con el transmisor. Lo tentador es la PFAE: sí puede ser coadyuvante.","ref":"Transmisores 2ª fr. XXVIII; 50ª fr. II y III Bis · H5"},{"id":"E073","tema":"h5","tipo":"caso","q":"Un transmisor de dinero revisa la honorabilidad de los directivos, empleados, apoderados y factores de una Persona Jurídica Coadyuvante que va a contratar. ¿Qué aspecto menciona la DCG como parte de esa honorabilidad?","a":"Que no hayan sido sentenciados por delitos patrimoniales ni inhabilitados","o":["Que acrediten experiencia previa de al menos dos años en entidades financieras supervisadas","Que no tengan adeudos vencidos registrados en una sociedad de información crediticia","Que hayan aprobado un examen de conocimientos en PLD/FT aplicado por la Comisión","Que no hayan sido sentenciados por delitos patrimoniales ni inhabilitados"],"x":"La 49ª obliga a adoptar procedimientos para asegurar la honorabilidad del personal de agentes y coadyuvantes y menciona, entre otros aspectos, no haber sido sentenciados por delitos patrimoniales ni inhabilitados para ejercer el comercio o desempeñar un empleo, cargo o comisión en el servicio público o en el sistema financiero. El examen de conocimientos existe, pero es una obligación contractual del propio agente o coadyuvante con su personal (50ª fr. III inciso i), no un requisito de honorabilidad ni lo aplica la Comisión. Experiencia e historial crediticio no aparecen.","ref":"Transmisores 49ª, segundo párrafo; 50ª fr. III inciso i) · H5"},{"id":"E074","tema":"h5","tipo":"caso","q":"Un transmisor de dinero redacta el contrato con un nuevo agente relacionado que atenderá al público en su local. ¿Qué obligaciones debe pactarle, entre otras?","a":"Operar en establecimiento físico, exhibir ahí copia del registro del transmisor y poner su fecha y número en la publicidad","o":["Designar un Oficial de Cumplimiento propio y comunicar su nombramiento a la Comisión en diez días hábiles","Operar en establecimiento físico, exhibir ahí copia del registro del transmisor y poner su fecha y número en la publicidad","Presentar directamente a la Unidad de Inteligencia Financiera los reportes de las operaciones relevantes que celebre","Obtener ante la Comisión su propio registro como transmisor de dinero antes de iniciar operaciones con el público"],"x":"La 50ª fr. III incisos b), c) y d) obliga a pactar con agentes y coadyuvantes que cuenten con establecimientos físicos, exhiban en ellos copia del registro del transmisor e incluyan en su publicidad la fecha y el número de ese registro. El agente no necesita registro propio: exhibe el del transmisor. Tampoco designa Oficial de Cumplimiento ni reporta a la UIF: entrega al transmisor registros y posibles reportes (inciso g). El contrato debe decir que incumplir es causal de rescisión.","ref":"Transmisores 50ª fr. III incisos b), c), d) y g), y último párrafo; LGOAAC art. 86 · H5"},{"id":"E075","tema":"h5","tipo":"caso","q":"Un transmisor de dinero paga remesas a través de una persona moral con la que firmó contrato como Persona Jurídica Coadyuvante. Respecto de los expedientes de los Usuarios que cobran ahí, ¿qué le corresponde al transmisor?","a":"Pactar en el contrato que el intermediario integre el expediente conforme a las políticas del transmisor","o":["Sólo capturar y conservar datos de remitentes y beneficiarios y vigilar lo que el otro no pueda detectar","Integrar él mismo cada expediente, porque esa obligación no puede pactarse con ningún tipo de intermediario","Nada: la responsabilidad por esas operaciones pasa por completo al intermediario que paga a los Usuarios","Pactar en el contrato que el intermediario integre el expediente conforme a las políticas del transmisor"],"x":"Con agentes y coadyuvantes, la 50ª fr. III inciso f) obliga a pactar que integren el expediente de identificación de los Usuarios y cumplan las políticas de identificación y conocimiento del transmisor; el expediente puede quedarse con ellos, siempre a disposición del transmisor y de la Comisión (inciso g, segundo párrafo). El régimen reducido de «sólo capturar y conservar» es de la 50ª fr. II, para cuando se opera a través de otro transmisor o entidad financiera regulados en PLD/FT: es el distractor más tentador. La responsabilidad nunca se traslada: el transmisor responde (50ª fr. I).","ref":"Transmisores 50ª fr. I, fr. III incisos f) y g) · H5","par":"E076"},{"id":"E076","tema":"h5","tipo":"caso","q":"Un transmisor de dinero paga remesas a través de otro transmisor de dinero, regulado y supervisado en PLD/FT, con el que firmó contrato. Respecto de los expedientes de los Usuarios que cobran ahí, ¿qué le corresponde al transmisor?","a":"Sólo capturar y conservar datos de remitentes y beneficiarios y vigilar lo que el otro no pueda detectar","o":["Sólo capturar y conservar datos de remitentes y beneficiarios y vigilar lo que el otro no pueda detectar","Pactar en el contrato que el intermediario integre el expediente conforme a las políticas del transmisor","Integrar él mismo cada expediente, porque esa obligación no puede pactarse con ningún tipo de intermediario","Nada: la responsabilidad por esas operaciones pasa por completo al intermediario que paga a los Usuarios"],"x":"Cuando opera a través de otro transmisor o de una entidad financiera regulados en PLD/FT, la 50ª fr. II dice que, en expedientes, seguimiento y reportes de inusuales, el transmisor «únicamente» debe capturar y conservar en sus sistemas los datos de remitentes y beneficiarios (inciso a) y dar seguimiento, agrupar y, en su caso, reportar las inusuales que el otro esté imposibilitado a detectar (inciso b). Lo tentador es pactar que el otro integre el expediente con las políticas del transmisor: eso es lo del contrato con agentes y coadyuvantes (fr. III f); al otro transmisor se le pide su RFC y la información en diez días naturales (fr. III Bis). Sigue siendo responsable (fr. I).","ref":"Transmisores 50ª fr. I, II y III Bis · H5","par":"E075"},{"id":"E077","tema":"h5","tipo":"caso","q":"Un transmisor de dinero opera con 40 agentes relacionados y 3 Personas Jurídicas Coadyuvantes, que a su vez trabajan con Terceros. Mientras la Comisión no emita las disposiciones del art. 57 de la Ley, ¿qué aviso debe presentar y cuándo?","a":"Aviso a la Comisión con agentes, coadyuvantes y sus Terceros, en los primeros 15 días hábiles del año","o":["Aviso a la UIF con la lista de agentes y coadyuvantes, dentro de los primeros 15 días hábiles del año","Aviso a la Comisión con agentes, coadyuvantes y sus Terceros, en los primeros 15 días hábiles del año","Aviso a la Comisión sólo de agentes y coadyuvantes, sin Terceros, dentro de 10 días hábiles de cada contrato","Aviso a la UIF con agentes, coadyuvantes y Terceros, dentro de los 15 días hábiles siguientes a cada mes"],"x":"La 50ª Bis obliga a remitir a la Comisión (CNBV) un aviso con la información de agentes, coadyuvantes, otros transmisores y entidades financieras con contrato, y de los Terceros con que operen. La Transitoria Quinta de 2019 dice que se sigue presentando dentro de los primeros quince días hábiles del año, con el formato de 2015, hasta que la Comisión emita las disposiciones del art. 57. Lo tentador es la UIF: no hay un reporte de agentes ante ella. Los 15 días hábiles tras el mes son del reporte de transferencias internacionales (24ª).","ref":"Transmisores 50ª Bis; Transitoria Quinta (DOF 20-mar-2019) · H5"},{"id":"E078","tema":"h5","tipo":"caso","q":"Un Usuario Remitente persona física envía con un transmisor de dinero, en una sola operación, el equivalente a 2,500 USD. Además de los datos de la transferencia, ¿qué debe recabar el transmisor?","a":"Datos como nombre, nacionalidad, fecha y país de nacimiento, domicilio y número de identificación, sin copias","o":["Los datos de identificación del Usuario y, además, copia de la identificación oficial de las personas físicas que intervengan","El expediente completo, integrado antes de operar, con comprobante de domicilio si no coincide con la identificación","Datos como nombre, nacionalidad, fecha y país de nacimiento, domicilio y número de identificación, sin copias","Ninguno adicional: el siguiente escalón de identificación del transmisor inicia en 5,000 USD por operación"],"x":"La 4ª fr. II aplica a Operaciones individuales «igual o superior» a 500 e «inferior a» 3,000 USD: datos de identificación de la persona física (nombre, país de nacimiento, nacionalidad, fecha de nacimiento, domicilio desglosado y número de identificación oficial), recabados al momento y conservados en sus sistemas, sin copias. La copia de la identificación es del escalón de 3,000 a menos de 5,000 (fr. III) y el expediente completo, desde 5,000 (fr. IV). El tipo de cambio es el FIX del día hábil bancario anterior.","ref":"Transmisores 4ª fr. II, III y IV · H5","par":"E079"},{"id":"E079","tema":"h5","tipo":"caso","q":"Un Usuario Remitente persona física envía con un transmisor de dinero, en una sola operación, el equivalente a 4,000 USD. Además de los datos de la transferencia, ¿qué debe recabar el transmisor?","a":"Los datos de identificación del Usuario y, además, copia de la identificación oficial de las personas físicas que intervengan","o":["Datos como nombre, nacionalidad, fecha y país de nacimiento, domicilio y número de identificación, sin copias","El expediente completo, integrado antes de operar, con comprobante de domicilio si no coincide con la identificación","Ninguno adicional: el siguiente escalón de identificación del transmisor inicia en 5,000 USD por operación","Los datos de identificación del Usuario y, además, copia de la identificación oficial de las personas físicas que intervengan"],"x":"La 4ª fr. III aplica a Operaciones individuales «igual o superior» a 3,000 e «inferior a» 5,000 USD: además de los datos de las fr. I y II, copia de la identificación oficial de las personas físicas que intervengan. El expediente completo, previo a la operación, es desde 5,000 USD (fr. IV); por eso el distractor más tentador es el del expediente. Sólo los datos sin copias corresponden al escalón de 500 a menos de 3,000 (fr. II).","ref":"Transmisores 4ª fr. II, III y IV · H5","par":"E078"},{"id":"E080","tema":"h5","tipo":"caso","q":"Una persona moral envía con un transmisor de dinero, en una sola operación, el equivalente a 1,800 USD; acude su representante. Además de los datos de la transferencia, ¿qué debe recabar el transmisor?","a":"Denominación, RFC, FEA si la tiene, domicilio, nacionalidad y datos del representante","o":["Copia del acta constitutiva, de la cédula de identificación fiscal y de los poderes del representante","Denominación, RFC, FEA si la tiene, domicilio, nacionalidad y datos del representante","Estructura accionaria y declaración del representante sobre quiénes son los propietarios reales","Sólo denominación y RFC; el representante se identifica hasta que la operación llega a 5,000 USD"],"x":"En el escalón de 500 a menos de 3,000 USD, la 4ª fr. II inciso B pide de la persona moral: denominación, RFC con homoclave (y número de identificación fiscal extranjero, en su caso), número de serie de FEA cuando cuente con ella, domicilio, nacionalidad y los datos de la persona que acuda en su representación, en los términos del inciso A. Son datos, sin copias. Acta, cédula fiscal, poderes, estructura accionaria y propietarios reales son del expediente completo de 5,000 USD o más (fr. IV inciso B).","ref":"Transmisores 4ª fr. II inciso B; fr. IV inciso B · H5"},{"id":"E081","tema":"h5","tipo":"caso","q":"Un transmisor de dinero paga a un Usuario Beneficiario el equivalente a 6,000 USD y le entrega los recursos en su domicilio. El domicilio declarado no coincide con el de su identificación. Según la regla de la 4ª para esa forma de entrega, ¿qué se considera comprobante de domicilio?","a":"El documento en que conste la recepción de los recursos en el domicilio del beneficiario","o":["Copia de un comprobante documental de domicilio, conforme a la regla general del numeral iii","La comprobación que prevean las DCG de la entidad financiera pagadora, que conservará el comprobante","Ninguno: en el pago de remesas la DCG no exige comprobar el domicilio del Usuario Beneficiario","El documento en que conste la recepción de los recursos en el domicilio del beneficiario"],"x":"La 4ª fr. IV inciso A, subinciso b), numeral iii exige comprobante sólo si el domicilio declarado no coincide con el de la identificación o ésta no lo trae, y da reglas propias del transmisor: si los recursos se entregan en el domicilio del beneficiario, se considera comprobante el documento en que conste la recepción en ese domicilio. El comprobante documental general (recibos de no más de tres meses, contrato de arrendamiento, etc.) es la regla para entregas por agente o coadyuvante desde 5,000 USD; con entidad financiera, rigen las DCG de ésta.","ref":"Transmisores 4ª fr. IV inciso A, subinciso b), numeral iii · H5","par":"E082"},{"id":"E082","tema":"h5","tipo":"caso","q":"Un transmisor de dinero paga a un Usuario Beneficiario el equivalente a 6,000 USD en el local de uno de sus agentes relacionados. El domicilio declarado no coincide con el de su identificación. Según la regla de la 4ª para esa forma de entrega, ¿cómo se comprueba el domicilio?","a":"Copia de un comprobante documental de domicilio, conforme a la regla general del numeral iii","o":["El documento en que conste la recepción de los recursos en el domicilio del beneficiario","La comprobación que prevean las DCG de la entidad financiera pagadora, que conservará el comprobante","Copia de un comprobante documental de domicilio, conforme a la regla general del numeral iii","Ninguno: en el pago de remesas la DCG no exige comprobar el domicilio del Usuario Beneficiario"],"x":"La 4ª fr. IV inciso A, subinciso b), numeral iii dice que en entregas a través de agentes relacionados o coadyuvantes por montos iguales o superiores al equivalente a 5,000 USD, la comprobación se hace en los términos del primer párrafo del numeral: copia de un documento que acredite el domicilio (recibos de servicios o estados de cuenta de no más de tres meses, contrato de arrendamiento vigente, inscripción en el RFC, etc.). La constancia de recepción es para entregas en el domicilio del beneficiario, y remitir a las DCG de la otra entidad, para entregas por entidad financiera con contrato.","ref":"Transmisores 4ª fr. IV inciso A, subinciso b), numeral iii · H5","par":"E081"},{"id":"E083","tema":"h5","tipo":"caso","q":"Un centro cambiario contrata a un transmisor de dinero para enviar al extranjero el equivalente a 8,000 USD. Además del expediente de persona moral, ¿qué debe hacer el transmisor por tratarse de un centro cambiario?","a":"Asentar los datos de su registro ante la Comisión y obtener su constancia de registro","o":["Asentar los datos de su registro ante la Comisión y obtener su constancia de registro","Aplicarle el régimen simplificado del Anexo 1, siempre que lo clasifique con Grado de Riesgo bajo","Recabar la autorización de la Secretaría para operar divisas, en lugar de su acta constitutiva","Ninguna medida adicional: al ser sujeto obligado, basta su declaración de que cumple sus propias DCG"],"x":"La 4ª fr. IV inciso B ordena asentar en el expediente del Usuario que sea centro cambiario, otro transmisor o SOFOM los datos del registro otorgado por la Comisión o la CONDUSEF, tomados de sus registros públicos; la 22ª añade identificar número, monto y frecuencia de sus operaciones y obtener su constancia de registro (arts. 81-B u 87-B). El distractor más tentador es el Anexo 1: centros cambiarios y transmisores no están en esa lista (sí las casas de cambio y las SOFOM), así que no tienen régimen simplificado.","ref":"Transmisores 4ª fr. IV incisos B y D; 22ª; Anexo 1 · H5"},{"id":"E084","tema":"h5","tipo":"caso","q":"Un transmisor de dinero envía al extranjero, a solicitud de un Usuario Remitente que paga en efectivo, el equivalente a 400 USD. ¿Qué información debe acompañar a la transferencia?","a":"El nombre y el domicilio del remitente, y el número de referencia de la transferencia","o":["Sólo el número de referencia; nombre y domicilio se quedan en los registros del transmisor","Nombre, CURP y fecha de nacimiento del remitente, junto con copia de su identificación oficial","Ninguna, porque el envío es menor al umbral de 1,000 USD del reporte de transferencias internacionales","El nombre y el domicilio del remitente, y el número de referencia de la transferencia"],"x":"Para transferencias internacionales o nacionales en moneda extranjera, la 4ª fr. I inciso A, segundo párrafo, obliga a acompañar a la transferencia la información de los numerales i, ii y iii: nombre sin abreviaturas, domicilio y número de referencia; la cuenta del remitente viaja sólo si se usó para procesarla (aquí pagó en efectivo). Rige con independencia del monto. Los 1,000 USD son del reporte mensual (24ª), no de la información que acompaña al envío; la copia de identificación es del escalón de 3,000 USD.","ref":"Transmisores 4ª fr. I inciso A, primer y segundo párrafos; 24ª · H5"},{"id":"E085","tema":"h5","tipo":"caso","q":"Un transmisor de dinero paga en su ventanilla a un Usuario Beneficiario persona física una transferencia nacional en pesos equivalente a 300 USD. ¿Qué datos debe recabar y conservar?","a":"El nombre del ordenante incluido en la transferencia y el del beneficiario, tomado de su identificación","o":["Ninguno, porque la operación es menor a 500 USD, donde empieza la identificación del transmisor","El nombre del ordenante incluido en la transferencia y el del beneficiario, tomado de su identificación","Nombre, domicilio y ocupación del beneficiario, y copia de su identificación oficial vigente","Nombre y domicilio del ordenante, que debe confirmar directamente con el transmisor que le envió los recursos"],"x":"Cuando el transmisor funge como receptor, la 4ª fr. I inciso B pide, con independencia del monto, el nombre completo de quien ordena «que vaya incluido en la transferencia» y el del Usuario Beneficiario, obtenido, cuando sea el caso, de su identificación oficial al momento de la operación. Lo tentador es pensar que bajo 500 USD no se recaba nada: esos 500 son el inicio del escalón de la fr. II. Cuenta o referencia rastreable del ordenante y «tantos datos como» se transmitan sólo se suman en transferencias internacionales o nacionales en moneda extranjera.","ref":"Transmisores 4ª fr. I inciso B, primer y segundo párrafos · H5"},{"id":"E086","tema":"h5","tipo":"caso","q":"Un transmisor de dinero recibe del extranjero una transferencia para pagar en México que llega sin el nombre del ordenante. ¿Qué prevé su DCG?","a":"Aplicar los criterios de riesgo de su Manual para ejecutarla, rechazarla o suspenderla","o":["Rechazarla siempre y devolver de inmediato los recursos al transmisor extranjero que la envió","Pagarla sin más, porque completar esa información corresponde sólo a la entidad que la envía","Aplicar los criterios de riesgo de su Manual para ejecutarla, rechazarla o suspenderla","Suspenderla y presentar, en todos los casos, el reporte de Operación Inusual de 24 horas"],"x":"La 4ª fr. I inciso B, último párrafo, exige políticas en el Manual para identificar, al recibirlas o después, las transferencias sin la información de los numerales i (nombre del ordenante; cuenta o referencia rastreable), y criterios basados en riesgos para decidir si es procedente ejecutarlas, rechazarlas o suspenderlas, con las acciones de seguimiento. Además, la 27ª fr. XI la cuenta como circunstancia de inusualidad. No hay regla de rechazo automático ni de reporte de 24 horas en todos los casos: éste procede ante sospecha fundada (4ª fr. I; 30ª).","ref":"Transmisores 4ª fr. I inciso B, último párrafo; 27ª fr. XI · H5"},{"id":"E087","tema":"h5","tipo":"cifra","q":"Un transmisor de dinero pagó hoy una transferencia a uno de sus Usuarios. ¿En qué plazo debe cargar en sus sistemas los datos de esa transferencia e incorporarlos a su sistema de alertas?","a":"A más tardar dentro de los dos días hábiles siguientes a la operación","o":["A más tardar dentro de los dos días hábiles siguientes a la operación","A más tardar dentro de los dos días naturales siguientes a la operación","Dentro de un plazo que no exceda de diez días naturales desde la operación","Dentro de los quince días hábiles siguientes al último día hábil del mes"],"x":"La 4ª fr. I obliga a los transmisores ordenantes o receptores a cargar en los sistemas de la 40ª, a más tardar dentro de los dos días hábiles siguientes a la operación, la información de sus propios Usuarios sobre cada transferencia, e incorporarla al sistema de alertas de la 16ª. Son días hábiles, no naturales. Los diez días naturales son el plazo máximo que tienen agentes, coadyuvantes y otros transmisores para entregar información al transmisor (50ª fr. III g y III Bis c); los quince días hábiles son del reporte de transferencias internacionales (24ª).","ref":"Transmisores 4ª fr. I; 50ª fr. III inciso g); 24ª · H5"},{"id":"E088","tema":"h5","tipo":"caso","q":"Un transmisor de dinero paga en México a una persona física una remesa internacional equivalente a 1,500 USD. En el reporte de transferencias internacionales, ¿qué datos del Usuario Beneficiario debe especificar?","a":"Nombre completo, fecha de nacimiento y, si le es aplicable, CURP o RFC","o":["Nombre completo, domicilio y ocupación, sin ningún dato fiscal ni de población","Nombre completo, fecha de nacimiento y, si le es aplicable, CURP o RFC","Sólo su nombre completo, porque los demás datos los aporta el Usuario Remitente","Nombre, país de nacimiento y copia de su identificación oficial vigente"],"x":"La 25ª, para transferencias internacionales de remesas iguales o superiores a 1,000 USD, pide especificar en el reporte de la 24ª, si el beneficiario es persona física: nombre y apellidos sin abreviaturas, fecha de nacimiento y, si le es aplicable conforme a la 4ª o 4ª Bis, CURP y/o RFC, número de identificación fiscal y país, o FEA; además, lo que pida el formato. Si es persona moral: denominación, giro y RFC. Los reportes no llevan copias de documentos.","ref":"Transmisores 24ª; 25ª fr. I · H5"},{"id":"E089","tema":"h5","tipo":"caso","q":"Un usuario persona física de nacionalidad mexicana quiere enviar dinero desde la aplicación de un transmisor de dinero que identifica a distancia, pero su dispositivo no entrega la ubicación por GPS ni permite obtenerla por su dirección IP. ¿Puede operar de forma no presencial?","a":"No: sin Geolocalización no debe celebrarse la operación no presencial","o":["Sí, siempre que el monto no exceda de 5,000 USD en el mes calendario","Sí, si el usuario acepta esa circunstancia en los Términos y Condiciones","Sí, y la Geolocalización se recaba en su siguiente operación a distancia","No: sin Geolocalización no debe celebrarse la operación no presencial"],"x":"La 4ª Bis exige requerir y obtener la Geolocalización del Dispositivo además de los datos de la 4ª fr. I y IV, y dice que los transmisores «no deberán» llevar a cabo operaciones no presenciales cuando no recaben ese dato. El tope de 5,000 USD al mes es un umbral del Anexo 2 (art. 2), no una dispensa de la ubicación. La vía no presencial sólo es para mexicanos (PF, PFAE y PM).","ref":"Transmisores 2ª fr. XIII; 4ª Bis; Anexo 2 art. 2 · H5"},{"id":"E090","tema":"h5","tipo":"trampa","q":"Un transmisor de dinero identifica a distancia a un Usuario mexicano conforme a la 4ª Bis. ¿Cuál de estos documentos NO es válido para esa identificación?","a":"Licencia para conducir","o":["Credencial para votar del INE","Pasaporte expedido por la SRE","Licencia para conducir","Certificado de matrícula consular de la SRE"],"x":"Para la vía no presencial, la 4ª Bis fija una lista cerrada: credencial para votar del INE (en el país o en consulados), pasaporte y certificado de matrícula consular, ambos de la SRE. La licencia para conducir (como la cédula profesional) sí vale en la identificación presencial de la 4ª fr. IV inciso A, subinciso b), numeral i, y por eso es el distractor tentador; a distancia no se admite.","ref":"Transmisores 4ª Bis; 4ª fr. IV inciso A, subinciso b), numeral i · H5"},{"id":"E091","tema":"h5","tipo":"caso","q":"Un transmisor de dinero quiere identificar a distancia sólo con verificación biométrica contra los registros del INE (art. 5 del Anexo 2) y con un tope de 5,000 USD al mes. ¿Necesita autorización previa de la Comisión?","a":"No: basta informar previamente a la Comisión la fecha en que empezará a ofrecerlo","o":["No: basta informar previamente a la Comisión la fecha en que empezará a ofrecerlo","Sí: toda identificación no presencial requiere siempre autorización previa de la Comisión","No, ni aviso alguno: el tope de 5,000 USD al mes lo exime de todo trámite","Sí, pero la otorga la Secretaría con opinión previa de la Comisión"],"x":"El art. 7 fr. I del Anexo 2 exige autorización previa de la Comisión, salvo cuando el transmisor se sujeta al umbral del art. 2 fr. I (5,000 USD en un mes calendario) y usa el mecanismo del art. 5 (biometría contra INE, SRE u otra autoridad): entonces basta informar de manera previa a la Comisión la fecha en que empezará a ofrecer operaciones no presenciales, y cumplir las fr. II a VII y los arts. 8 y 9. El aviso se envía a prevencion.lavado@cnbv.gob.mx mientras no haya otro medio (Transitoria Quinta de 2023).","ref":"Transmisores Anexo 2 arts. 2, 5 y 7 fr. I; Transitoria Quinta (2023) · H5"},{"id":"E092","tema":"h5","tipo":"caso","q":"Un Usuario persona física realizó con un transmisor de dinero, durante un mes calendario, operaciones en efectivo en pesos que suman exactamente 1,000,000. ¿Qué le exige su DCG?","a":"Seguimiento más estricto y registro con sus datos, fecha, monto y sucursal de cada operación","o":["Ninguna medida adicional: el seguimiento más estricto aplica sólo por más de un millón de pesos","Aprobación previa de un directivo para cada operación, por el monto acumulado en el mes","Seguimiento más estricto y registro con sus datos, fecha, monto y sucursal de cada operación","Un reporte mensual a la Comisión de las operaciones en efectivo en moneda nacional"],"x":"La 11ª pide mecanismos de seguimiento y agrupación más estrictos para Usuarios que, en un mes calendario, operen en efectivo en moneda nacional por un monto acumulado «igual o superior» a un millón de pesos (o al equivalente a 100,000 USD en moneda extranjera), con un registro de datos de la 4ª o 4ª Bis, ocupación o giro, fecha y monto de cada operación y sucursal del transmisor, agente, coadyuvante, otro transmisor o entidad financiera. Lo tentador es el «superior»: ése es el de la 9ª para pesos (más de 300,000 por operación individual de persona física; más de 500,000 de persona moral o fideicomiso). No hay reporte de efectivo en moneda nacional.","ref":"Transmisores 9ª, segundo párrafo; 11ª · H5"},{"id":"F001","tema":"h6","tipo":"caso","q":"La CNBV detecta que un banco celebró una operación con un cliente que, según se le había informado, ya estaba en la Lista de Personas Bloqueadas. ¿Qué multa prevé la LIC?","a":"Del 10 % al 100 % del monto del acto, operación o servicio realizado","o":["De 30,000 a 100,000 días de salario, por ser conducta de la banda alta","De 5,000 a 50,000 días de salario, por tratarse de un incumplimiento genérico","Del 10 % al 100 % del monto del acto, operación o servicio realizado","De 10 a 100,000 veces el valor diario de la UMA, en una sola banda"],"x":"Operar con alguien que se informó que está en la LPB se multa en porcentaje del monto: 10 % a 100 %. La banda de 30,000 a 100,000 días de salario es para reportes no enviados e incisos a, b, c y e; las UMA son de la LRITF, no de la LIC.","ref":"LIC art. 115 (párrafo de sanciones) · H6"},{"id":"F002","tema":"h6","tipo":"caso","q":"La CNBV detecta que una ITF celebró una operación con un Cliente que, según se le había informado, ya estaba en la Lista de Personas Bloqueadas. ¿Qué multa prevé la LRITF?","a":"Del 10 % al 100 % del monto del acto, operación o servicio realizado","o":["Del 10 % al 100 % del monto del acto, operación o servicio realizado","De 10 a 100,000 veces el valor diario de la UMA, como cualquier otro incumplimiento","De 30,000 a 100,000 días de salario, igual que la banda alta de la LIC","De 10,000 a 100,000 días de salario, igual que la banda alta de la LGOAAC"],"x":"La LRITF conserva la multa en porcentaje para la LPB: 10 % a 100 % del monto, igual que la LIC y la LGOAAC. La banda de 10 a 100,000 UMA es la residual («cualquier otro incumplimiento»), no la de la LPB.","ref":"LRITF art. 105 · H6","par":"F001"},{"id":"F003","tema":"h6","tipo":"caso","q":"Un banco no presentó a la CNBV los reportes de operaciones relevantes de un trimestre. ¿Qué rango de multa prevé la LIC para esta conducta?","a":"De 30,000 a 100,000 días de salario","o":["De 10,000 a 100,000 días de salario","De 5,000 a 50,000 días de salario","Del 10 % al 100 % del monto no reportado","De 30,000 a 100,000 días de salario"],"x":"Los relevantes no reportados están en la banda alta de la LIC: 30,000 a 100,000 días de salario. 10,000 a 100,000 es la banda alta de la LGOAAC (casas de cambio y 95 Bis); el 10 %–100 % es sólo para LPB y OI no reportada.","ref":"LIC art. 115 (párrafo de sanciones) · H6"},{"id":"F004","tema":"h6","tipo":"caso","q":"Una casa de cambio no presentó a la CNBV los reportes de operaciones relevantes de un trimestre. ¿Qué rango de multa prevé su ley?","a":"De 10,000 a 100,000 días de salario","o":["De 30,000 a 100,000 días de salario","De 10,000 a 100,000 días de salario","De 2,000 a 30,000 días de salario","De 10 a 100,000 veces el valor de la UMA"],"x":"La casa de cambio se sanciona por el art. 95 LGOAAC: relevantes no reportados, 10,000 a 100,000 días de salario. La banda de 30,000 a 100,000 es la de Bancos (LIC 115); 2,000 a 30,000 es la de los demás casos de la LGOAAC.","ref":"LGOAAC art. 95 · H6","par":"F003"},{"id":"F005","tema":"h6","tipo":"caso","q":"Una ITF no presentó a la CNBV los reportes de operaciones relevantes de un trimestre. ¿Qué rango de multa prevé la LRITF para esta conducta?","a":"De 10 a 100,000 veces el valor de la UMA","o":["De 30,000 a 100,000 veces el valor de la UMA","De 10 a 100,000 veces el valor de la UMA","De 10,000 a 100,000 días de salario mínimo","De 5,000 a 50,000 días de salario mínimo"],"x":"La LRITF no tiene banda propia para relevantes: cae en «cualquier otro incumplimiento», una sola banda de diez a cien mil veces el valor de la UMA. Las bandas en días de salario son de la LIC y la LGOAAC.","ref":"LRITF art. 105 · H6","par":"F003"},{"id":"F006","tema":"h6","tipo":"cifra","q":"En la LIC, fuera de la LPB, la OI no reportada y las conductas de la banda alta, ¿qué rango aplica a los demás incumplimientos de las disposiciones de PLD/FT?","a":"De 5,000 a 50,000 días de salario","o":["De 2,000 a 30,000 días de salario","De 30,000 a 100,000 días de salario","De 10 a 100,000 veces el valor de la UMA","De 5,000 a 50,000 días de salario"],"x":"La banda residual de la LIC es de 5,000 a 50,000 días de salario. La de 2,000 a 30,000 es la residual de la LGOAAC 95 y 95 Bis, y la de UMA es la de la LRITF.","ref":"LIC art. 115 (párrafo de sanciones) · H6"},{"id":"F007","tema":"h6","tipo":"cifra","q":"En los arts. 95 y 95 Bis de la LGOAAC, ¿qué rango aplica a los demás incumplimientos, distintos de la LPB, la OI no reportada y la banda alta?","a":"De 2,000 a 30,000 días de salario","o":["De 2,000 a 30,000 días de salario","De 5,000 a 50,000 días de salario","De 10,000 a 100,000 días de salario","De 10 a 100,000 veces el valor de la UMA"],"x":"En la LGOAAC la banda residual es de 2,000 a 30,000 días de salario, igual en el 95 y el 95 Bis. La de 5,000 a 50,000 es la residual de la LIC (Bancos).","ref":"LGOAAC arts. 95 y 95 Bis · H6","par":"F006"},{"id":"F008","tema":"h6","tipo":"trampa","q":"Las multas fijas que el art. 115 de la LIC prevé para Bancos por incumplir sus DCG de PLD/FT, ¿en qué unidad están expresadas?","a":"En días de salario mínimo general vigente en el Distrito Federal","o":["En veces el valor diario de la Unidad de Medida y Actualización","En porcentaje del capital neto de la institución de crédito sancionada","En días de salario mínimo general vigente en el Distrito Federal","En pesos fijos que la CNBV actualiza cada año con el índice inflacionario"],"x":"La LIC multa en días de salario mínimo general diario vigente en el Distrito Federal el día de la conducta (109 Bis 1). La trampa es suponer que todas las multas PLD están en UMA: sólo la LRITF usa UMA.","ref":"LIC arts. 115 y 109 Bis 1 · H6"},{"id":"F009","tema":"h6","tipo":"trampa","q":"De las tres leyes de la bibliografía que sancionan el incumplimiento de las DCG de PLD/FT, ¿cuál expresa sus multas fijas en UMA?","a":"La Ley para Regular las Instituciones de Tecnología Financiera","o":["La Ley de Instituciones de Crédito, desde su reforma de 2025","La Ley General de Organizaciones y Actividades Auxiliares del Crédito","La LIC y la LGOAAC, pero sólo en la banda de los demás incumplimientos","La Ley para Regular las Instituciones de Tecnología Financiera"],"x":"Sólo la LRITF (art. 105) habla de «veces el valor de la UMA». La LIC y la LGOAAC siguen en días de salario mínimo en todas sus bandas.","ref":"LRITF art. 105; LIC art. 109 Bis 1; LGOAAC art. 95 · H6"},{"id":"F010","tema":"h6","tipo":"memoria","q":"¿Qué artículo establece las multas por incumplir las DCG de PLD/FT aplicables a las casas de cambio?","a":"El art. 95 de la LGOAAC","o":["El art. 95 Bis de la LGOAAC","El art. 95 de la LGOAAC","El art. 115 de la LIC","El art. 105 de la LRITF"],"x":"El art. 95 LGOAAC alcanza a las organizaciones auxiliares del crédito y a las casas de cambio. El 95 Bis es para SOFOM no reguladas, centros cambiarios y transmisores; la LIC 115, para Bancos.","ref":"LGOAAC art. 95 · H6"},{"id":"F011","tema":"h6","tipo":"caso","q":"Un centro cambiario incumple sus DCG de PLD/FT. ¿Qué artículo prevé su multa?","a":"El art. 95 Bis de la LGOAAC","o":["El art. 95 de la LGOAAC","El art. 115 de la LIC","El art. 95 Bis de la LGOAAC","El art. 105 de la LRITF"],"x":"Centros cambiarios, transmisores y SOFOM no reguladas se sancionan por el art. 95 Bis LGOAAC. El art. 95 es el de las casas de cambio: mismo bloque de cambios y envíos, distinto artículo.","ref":"LGOAAC art. 95 Bis · H6","par":"F010"},{"id":"F012","tema":"h6","tipo":"caso","q":"Una casa de bolsa incumple sus DCG de PLD/FT. Con la bibliografía del temario, ¿qué puede afirmarse sobre la ley que la sanciona?","a":"Sus DCG remiten a su propia ley (LMV), que no forma parte de la bibliografía","o":["Sus DCG remiten a su propia ley (LMV), que no forma parte de la bibliografía","La sanciona el art. 115 de la LIC, con las mismas bandas que a Bancos","La sanciona el art. 95 Bis de la LGOAAC, igual que a los centros cambiarios","La sanciona el art. 105 de la LRITF, por ser una entidad del sector bursátil"],"x":"Las DCG de casas de bolsa remiten a «la Ley», que es la LMV; esa ley no está en la bibliografía, así que el examen sólo exige saber que la sanción está ahí. La LIC 115 es exclusiva de Bancos.","ref":"DCG casas de bolsa 2ª fr. XIX y 65ª–66ª · H6"},{"id":"F013","tema":"h6","tipo":"trampa","q":"La banda alta del art. 95 Bis de la LGOAAC incluye un inciso que la del art. 95 no menciona. ¿Cuál es?","a":"El inciso f","o":["El inciso f","El inciso d","El inciso e","El inciso b"],"x":"El 95 remite a los incisos a, b, c y e del sexto párrafo; el 95 Bis, a los incisos a, b, c, e y f del tercer párrafo. El inciso e está en ambos, por eso no es la diferencia.","ref":"LGOAAC arts. 95 y 95 Bis · H6"},{"id":"F014","tema":"h6","tipo":"memoria","q":"En la banda de 30,000 a 100,000 días de salario, el art. 115 de la LIC incluye el incumplimiento de ciertos incisos. ¿Cómo los cita la ley?","a":"Incisos a, b, c y e del quinto párrafo","o":["Incisos a, b, c y e del sexto párrafo","Incisos a, b, c, e y f del tercer párrafo","Incisos a, b, c y e del quinto párrafo","Incisos a, b, c y d del quinto párrafo"],"x":"La LIC 115 dice literalmente «incisos a., b., c. y e. del quinto párrafo» (conocimiento del cliente, documentación de apertura, resguardo de la información y sistemas automatizados). «Sexto párrafo» es la cita del art. 95 LGOAAC y «tercer párrafo» con el f, la del 95 Bis.","ref":"LIC art. 115 (párrafo de sanciones) · H6"},{"id":"F015","tema":"h6","tipo":"caso","q":"La CNBV emplaza a un banco a un procedimiento de sanción por incumplir sus DCG de PLD/FT. ¿Qué plazo tiene el banco para manifestar lo que a su derecho convenga?","a":"10 días hábiles, ampliables una sola vez por el mismo lapso a petición de parte","o":["15 días hábiles, ampliables por una sola vez hasta por 5 días hábiles adicionales","10 días hábiles, ampliables una sola vez por el mismo lapso a petición de parte","10 días naturales, ampliables cuantas veces lo autorice la Junta de Gobierno","5 días hábiles, sin ampliación posible aunque la entidad lo solicite por escrito"],"x":"La audiencia es de 10 días hábiles, ampliable por una sola ocasión hasta por el mismo lapso, a petición de parte. Los 15 días hábiles son del pago de la multa; los 5, de alegatos.","ref":"LIC art. 107 Bis, fr. I · H6"},{"id":"F016","tema":"h6","tipo":"cifra","q":"En el procedimiento de sanción de la LIC, ¿cuál es el plazo máximo para emitir y notificar la resolución?","a":"180 días hábiles","o":["60 días hábiles","90 días naturales","5 días hábiles","180 días hábiles"],"x":"La resolución se emite en no más de 180 días hábiles. Los 60 días hábiles son el máximo para desahogar pruebas y los 5 días hábiles, para alegatos. La LRITF (art. 98) repite 60 · 5 · 180.","ref":"LIC art. 107 Bis · H6"},{"id":"F017","tema":"h6","tipo":"caso","q":"Un banco comete la misma infracción de PLD/FT 18 meses después de que quedó firme la resolución que lo sancionó por ella. ¿Cómo lo trata la LIC?","a":"Hay reincidencia, y la multa puede llegar hasta el doble de la que corresponda","o":["No hay reincidencia, porque ésta sólo se configura dentro del año siguiente a la notificación","Hay reincidencia, y la multa se triplica sin sujetarse al máximo de la banda que corresponda","Hay reincidencia, y la multa puede llegar hasta el doble de la que corresponda","No hay reincidencia, porque el plazo de 2 años se cuenta desde la fecha de la primera conducta"],"x":"Reincide quien comete la misma infracción dentro de los 2 años siguientes a que quedó firme la resolución; 18 meses está dentro. La consecuencia es una multa de hasta el doble, no el triple. El plazo corre desde que la resolución quedó firme, no desde la conducta.","ref":"LIC art. 107 Bis, fr. III, inciso b) · H6"},{"id":"F018","tema":"h6","tipo":"caso","q":"Una ITF reincide en una infracción de PLD/FT dentro de los 2 años siguientes a que quedó firme la resolución previa. Además de la multa, ¿qué medida prevé la LRITF?","a":"Que la CNBV pueda revocar su autorización, con aprobación del Comité Interinstitucional","o":["Que la CNBV pueda revocar su autorización, con aprobación del Comité Interinstitucional","La cancelación de su registro por la CONDUSEF y su disolución y liquidación forzosa","La revocación de su autorización por la SHCP, sin intervención de la CNBV ni del Comité","La suspensión de su autorización por la UIF hasta que regularice todos sus reportes"],"x":"La LRITF 69 faculta («podrá») a la CNBV, después de escuchar a la ITF y con aprobación del Comité Interinstitucional, a revocar la autorización; la fr. VII exige que se reincida pese a las observaciones y acciones correctivas, y la VIII cubre las conductas graves. La disolución y liquidación es consecuencia de la cancelación de un centro cambiario (LGOAAC), no de una ITF.","ref":"LRITF art. 69, fr. VII; art. 98, fr. III, inciso b) · H6","par":"F017"},{"id":"F019","tema":"h6","tipo":"caso","q":"Un banco paga su multa de PLD/FT dentro de los 15 días hábiles siguientes a la notificación y no interpone medio de defensa. ¿Qué beneficio le da la LIC?","a":"Una reducción del 20 % del monto de la multa","o":["Una reducción de la tercera parte del monto de la multa","Una reducción del 50 % si además resarce el daño causado","La conversión de la multa en una amonestación pública","Una reducción del 20 % del monto de la multa"],"x":"La LIC prevé la reducción del 20 % si se paga en 15 días hábiles y no se interpuso medio de defensa. Resarcir el daño es atenuante, pero no da un 50 %. En la LRITF el requisito cambia: manifestar por escrito la conformidad.","ref":"LIC art. 109 Bis 1 · H6"},{"id":"F020","tema":"h6","tipo":"caso","q":"Una ITF quiere obtener la reducción de su multa de PLD/FT pagándola dentro de los 15 días hábiles. Además del pago oportuno, ¿qué le exige la LRITF?","a":"Manifestar por escrito su conformidad con la resolución","o":["No haber interpuesto ningún medio de defensa en su contra","Manifestar por escrito su conformidad con la resolución","Haber resarcido el daño y aportado información a la CNBV","Obtener la aprobación previa del Comité Interinstitucional"],"x":"La LRITF condiciona la reducción del 20 % a que se manifieste por escrito la conformidad. «No interponer medio de defensa» es el requisito de la LIC (Bancos): mismo beneficio, otra condición.","ref":"LRITF art. 97 · H6","par":"F019"},{"id":"F021","tema":"h6","tipo":"cifra","q":"¿En cuánto tiempo caduca la facultad de la CNBV para imponer sanciones conforme a la LIC y desde cuándo se cuenta?","a":"5 años, desde el día hábil siguiente a aquél en que se realizó la conducta","o":["2 años, desde el día hábil siguiente a aquél en que quedó firme la resolución","5 años, desde el día hábil siguiente a aquél en que se realizó la conducta","5 años, desde que la CNBV notifica el inicio del procedimiento de sanción","10 años, igual que el plazo de conservación de los expedientes del Cliente"],"x":"La caducidad es de 5 años desde el día hábil siguiente a la conducta (igual en la LRITF, art. 106). Los 2 años desde que quedó firme la resolución son los de la reincidencia; los 10 años, los de conservación.","ref":"LIC art. 109 Bis 1; LRITF art. 106 · H6"},{"id":"F022","tema":"h6","tipo":"caso","q":"La CNBV presume que un transmisor de dinero está violando el art. 95 Bis de la LGOAAC. ¿Qué puede ordenar, además de la multa?","a":"Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él","o":["Que la UIF lo incluya en la Lista de Personas Bloqueadas mientras dure el procedimiento de sanción","Que el Banco de México congele sus cuentas hasta que la resolución de la CNBV quede firme","Que la CONDUSEF revoque su autorización y la publique en su portal como información reservada","Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él"],"x":"El 95 Bis faculta a la CNBV para ordenar a instituciones de crédito, casas de bolsa y casas de cambio que suspendan o cancelen contratos con centros cambiarios y transmisores, y se abstengan de nuevas operaciones, cuando presuma que violan el artículo.","ref":"LGOAAC art. 95 Bis · H6"},{"id":"F023","tema":"h6","tipo":"trampa","q":"Una entidad incorporó íntegros a su Manual los Lineamientos 2019 de propietario real. ¿Qué efecto tiene eso sobre sus obligaciones de PR?","a":"Por sí solo no acredita el cumplimiento: la obligación está en las DCG","o":["Por sí solo no acredita el cumplimiento: la obligación está en las DCG","Acredita por sí solo el cumplimiento, porque los Lineamientos sustituyen a las DCG","Acredita el cumplimiento sólo si además los registra ante la UIF en 90 días naturales","Lo vuelve optativo, porque las DCG sólo obligan a quien no adopte los Lineamientos"],"x":"L1: los Lineamientos son criterios enunciativos mas no limitativos que las Entidades «podrán» considerar, y adoptarlos total o parcialmente no significa por sí solo cumplir. La obligación (definición, 25 %, cascada, datos) vive en cada DCG.","ref":"Lineamientos PR 2019, L1; DCG Bancos 4ª fr. VI, último párrafo · H6"},{"id":"F024","tema":"h6","tipo":"memoria","q":"Para Bancos, ¿dónde está la obligación de identificar al propietario real, con su definición y el umbral del 25 %?","a":"En las DCG de Bancos: 2ª fr. VII y XXXII y 4ª fr. II inciso c) y fr. VI","o":["En los Lineamientos 2019 de la SHCP, que son la fuente del umbral del 25 %","En el art. 115 de la LIC, que define al propietario real y fija el umbral","En las DCG de Bancos: 2ª fr. VII y XXXII y 4ª fr. II inciso c) y fr. VI","En el Manual de cada banco, que fija libremente el umbral de participación"],"x":"Definición (2ª XXXII), Control con el 25 % o más (2ª VII), cascada (4ª II c) y datos (4ª VI) están en las DCG. El fallo típico es atribuir el 25 % a los Lineamientos, que sólo orientan.","ref":"DCG Bancos 2ª fr. VII y XXXII; 4ª fr. II inciso c) y fr. VI · H6"},{"id":"F025","tema":"h6","tipo":"memoria","q":"¿Quién emite los Lineamientos para la identificación del propietario real que las Entidades podrán considerar?","a":"La SHCP, por conducto de la Unidad de Banca, Valores y Ahorro","o":["La CNBV, por acuerdo de su Junta de Gobierno y como parte de las DCG","El Banco de México, por conducto de su Dirección de Sistemas de Pagos","La CONDUSEF, como parte de sus disposiciones de transparencia","La SHCP, por conducto de la Unidad de Banca, Valores y Ahorro"],"x":"La 4ª VI de las DCG dice que «la Secretaría» emitirá los lineamientos; los de 2019 los expidió la SHCP por la UBVA. No forman parte de las DCG que emite la CNBV.","ref":"DCG Bancos 4ª fr. VI, último párrafo; Lineamientos PR 2019 · H6"},{"id":"F026","tema":"h6","tipo":"caso","q":"Un banco abre una cuenta a una sociedad anónima en la que ninguna persona física tiene el 25 % o más del capital ni de los derechos de voto, y nadie ejerce el Control por otros medios. ¿A quién considera propietario real?","a":"Al administrador o administradores de la sociedad","o":["Al accionista con la mayor participación, aunque no llegue al 25 %","Al administrador o administradores de la sociedad","Al representante legal que firma la declaración sobre los propietarios reales","A nadie: la cuenta se abre sin propietario real por no haber Control"],"x":"La cascada de la 4ª II c): si nadie tiene igual o superior al 25 % ni ejerce el Control por otros medios, se considera que lo ejerce el administrador o administradores. El representante legal firma la declaración, pero no se vuelve PR por ello.","ref":"DCG Bancos 4ª fr. II, inciso c) · H6"},{"id":"F027","tema":"h6","tipo":"caso","q":"En la misma situación de cascada, el administrador de la sociedad cliente de un banco es otra persona moral. ¿A quién se identifica como propietario real?","a":"A la persona física que esa persona moral nombró como administrador","o":["Al accionista mayoritario de la persona moral que funge como administradora","Al representante legal de la sociedad que abre la cuenta en el banco","A la persona física que esa persona moral nombró como administrador","A la persona moral administradora, con los datos de una persona moral"],"x":"Si el administrador es persona moral o fideicomiso, la 4ª II c) lleva a la persona física nombrada como administrador por ella. El PR siempre es persona física, por eso no puede quedarse en la persona moral administradora.","ref":"DCG Bancos 4ª fr. II, inciso c) · H6"},{"id":"F028","tema":"h6","tipo":"trampa","q":"Un analista afirma que los Lineamientos 2019 imponen una cascada obligatoria que termina en el administrador. ¿Qué establecen en realidad?","a":"Tres vías (propiedad, cargo, otro medio) en lista de prelación o indistintas","o":["Tres vías (propiedad, cargo, otro medio) en lista de prelación o indistintas","La misma cascada de las DCG, que los Lineamientos hacen obligatoria","Tres vías que siempre se aplican en este orden: cargo, propiedad, otro medio","Una sola vía, la del cargo de alto mando, que sustituye a la cascada"],"x":"La cascada al administrador es de las DCG (4ª II c). Los Lineamientos (L3) dan tres vías que «podrán» considerarse y cuyo último párrafo permite fijarlas en lista de prelación o aplicarlas de manera indistinta.","ref":"Lineamientos PR 2019, L3, fr. I a III y último párrafo · H6"},{"id":"F029","tema":"h6","tipo":"trampa","q":"En los Lineamientos 2019, ¿en qué supuesto se usa la expresión «más del 25 %» en lugar de «25 % o más»?","a":"Al sumar titulares con menos del 25 % para ver si, en conjunto, superan ese umbral","o":["Al sumar titulares con menos del 25 % para ver si, en conjunto, superan ese umbral","En la definición de Control por participación en el capital de las DCG de cada sujeto","En la cascada que lleva al administrador cuando nadie tiene participación suficiente","En el voto que confiere Control sobre las decisiones del capital social de la sociedad"],"x":"«Más del 25 %» sólo aparece en L3 I, en el párrafo del capital fraccionado en partes menores al 25 %. Las DCG (2ª VII y 4ª II c) y L3 I a) dicen «25 % o más»; el voto que da Control es «más del 50 %».","ref":"Lineamientos PR 2019, L3, fr. I; DCG Bancos 2ª fr. VII · H6"},{"id":"F030","tema":"h6","tipo":"caso","q":"Una persona física tiene exactamente el 25 % del capital social de una sociedad cliente de un banco y no ocupa ningún cargo. Conforme a las DCG, ¿ejerce el Control?","a":"Sí: la DCG considera Control adquirir el 25 % o más del capital","o":["No: para ejercer el Control se requiere más del 25 % del capital","No: para ejercer el Control se requiere votar más del 50 % del capital","Sí: la DCG considera Control adquirir el 25 % o más del capital","Sólo si además ocupa un cargo de alto mando en la sociedad cliente"],"x":"La 2ª VII de Bancos considera que ejerce Control la persona física que adquiera el 25 % o más del capital; el 25 % exacto queda dentro. «Más del 25 %» es la regla de suma de fracciones de los Lineamientos, no la de las DCG.","ref":"DCG Bancos 2ª fr. VII · H6"},{"id":"F031","tema":"h6","tipo":"caso","q":"Tres hermanos tienen, cada uno, el 10 % del capital de una sociedad cliente. Si la entidad sigue los Lineamientos 2019, ¿qué podrá hacer?","a":"Identificar a cada titular y si existe relación jurídica entre ellos para ver si en conjunto tienen más del 25 %","o":["Descartarlos, porque ninguno alcanza por sí solo el 25 % o más del capital social","Identificar a cada titular y si existe relación jurídica entre ellos para ver si en conjunto tienen más del 25 %","Considerarlos propietarios reales sólo si los tres son personas políticamente expuestas","Tomar de inmediato al administrador como PR, sin analizar a los hermanos ni sus vínculos"],"x":"L3 I: si el capital está fraccionado en partes menores al 25 %, la entidad «podrá» identificar a cada titular y ver si en su conjunto tienen más del 25 %. Descartarlos por no llegar cada uno al 25 % ignora esa regla.","ref":"Lineamientos PR 2019, L3, fr. I · H6"},{"id":"F032","tema":"h6","tipo":"caso","q":"Una persona sin acciones ni cargo en la sociedad cliente decide de hecho sus asuntos por su vínculo familiar con el director general. ¿En qué vía de los Lineamientos 2019 encaja?","a":"Control por otro medio (L3 fr. III)","o":["Control por propiedad (L3 fr. I)","Control por cargo (L3 fr. II)","Medidas razonables (L4 fr. III)","Control por otro medio (L3 fr. III)"],"x":"L3 III cubre el Control sin propiedad visible: participación en las finanzas, relación personal o vínculo familiar con los altos mandos. La vía del cargo (L3 II) exige un cargo de alto mando, que esta persona no tiene.","ref":"Lineamientos PR 2019, L3, fr. III · H6"},{"id":"F033","tema":"h6","tipo":"trampa","q":"Pese a que los Lineamientos 2019 son orientadores, la vía del cargo usa una expresión imperativa. ¿Cuál?","a":"La persona «deberá» contar con un cargo de alto mando","o":["La persona «deberá» tener además el 25 % o más del capital","La persona «podrá» tener cualquier cargo, aun sin ser directivo","La persona «deberá» contar con un cargo de alto mando","La persona «deberá» estar inscrita en el Registro Público de Comercio"],"x":"L3 II b) (control sobre asuntos diarios mediante un cargo directivo) dice que, bajo ese supuesto, la persona «deberá contar con un cargo de alto mando». Es el matiz de la trampa «DCG obligan, Lineamientos orientan».","ref":"Lineamientos PR 2019, L3, fr. II, inciso b) · H6"},{"id":"F034","tema":"h6","tipo":"caso","q":"Una entidad duda de la veracidad del cuestionario de PR que entregó su cliente persona moral. ¿Cuál de estas es una medida razonable prevista en los Lineamientos 2019?","a":"Pedir la certificación de la integración del capital con los asientos del libro de accionistas","o":["Pedir la certificación de la integración del capital con los asientos del libro de accionistas","Pedir a la UIF una constancia oficial que confirme quién es el propietario real del cliente","Solicitar a la CNBV un dictamen previo sobre la estructura accionaria del cliente persona moral","Exigir al cliente que sustituya a su administrador por una persona física antes de operar"],"x":"L4 III c) prevé la certificación de la integración del capital junto con los asientos del libro de registro de accionistas; también actas de asamblea, informe de poderes y consulta al RPC, RNV y RNIE. Ninguna medida consiste en pedir constancias a la UIF o a la CNBV.","ref":"Lineamientos PR 2019, L4, fr. III, inciso c) · H6"},{"id":"F035","tema":"h6","tipo":"caso","q":"Un banco abre una cuenta a un cliente clasificado de riesgo bajo que actúa en beneficio de un propietario real. Conforme a la 4ª VI, ¿qué recaba del PR?","a":"Los mismos datos que de un cliente, sin pedir su comprobante de domicilio","o":["Sólo el nombre completo del PR, sin documentos que acrediten su identidad","Nada: con un cliente de riesgo bajo no se identifica al propietario real","Los mismos datos y documentos, con comprobante de domicilio y pasaporte","Los mismos datos que de un cliente, sin pedir su comprobante de domicilio"],"x":"La 4ª VI pide del PR los mismos datos y documentos de la 4ª I o III; cuando el cliente es de riesgo bajo, no se recaba el comprobante de domicilio del PR. La dispensa es de un documento, no de la identificación del PR.","ref":"DCG Bancos 4ª fr. VI · H6"},{"id":"F036","tema":"h6","tipo":"caso","q":"Una ITF atiende a un Cliente de riesgo bajo que actúa en beneficio de un propietario real. ¿Qué prevé el art. 11 VI de sus DCG respecto de los documentos del PR?","a":"Recaba los datos de identificación de las fr. I o III: no prevé la dispensa por riesgo bajo","o":["Omite el comprobante de domicilio del PR, exactamente igual que los Bancos","Recaba los datos de identificación de las fr. I o III: no prevé la dispensa por riesgo bajo","Omite toda la documentación del PR y sólo pide una declaración del Cliente","Sólo identifica al PR en operaciones de 5,000 USD o más, como las casas de cambio"],"x":"El art. 11 VI de ITF pide del PR los datos de identificación de las fracciones I o III y no trae la regla de Bancos (4ª VI) que exime del comprobante de domicilio cuando el cliente es de riesgo bajo. El umbral de 5,000 USD es de casas de cambio, centros y transmisores, no de ITF.","ref":"DCG ITF art. 11, fr. VI · H6","par":"F035"},{"id":"F037","tema":"h6","tipo":"caso","q":"Un banco detecta que el propietario real de uno de sus clientes es una persona políticamente expuesta. ¿Qué prevé la 4ª VI de sus DCG?","a":"Que al Cliente se le apliquen las reglas 26ª y 28ª","o":["Que se rechace siempre la apertura o se cancele el contrato","Que al Cliente se le apliquen las reglas 26ª y 28ª","Que se envíe un reporte de 24 horas a la SHCP por ese solo hecho","Que el PR quede exento de identificarse por ser servidor público"],"x":"Si el PR es PEP, la 4ª VI remite a las reglas 26ª y 28ª, que se aplican al Cliente. No hay prohibición automática de operar ni un reporte por el solo hecho de ser PEP.","ref":"DCG Bancos 4ª fr. VI · H6"},{"id":"F038","tema":"h6","tipo":"caso","q":"En una casa de bolsa, el propietario real de un cliente de riesgo alto es una persona políticamente expuesta. ¿Qué exige su DCG para iniciar o continuar la relación comercial?","a":"La aprobación del directivo con facultades específicas que prevé la 24ª","o":["Un reporte de operación inusual dentro de 24 horas","La autorización previa de la CNBV para operar con él","La firma de una constancia del delegado fiduciario de la entidad","La aprobación del directivo con facultades específicas que prevé la 24ª"],"x":"La 4ª VII de casas de bolsa remite expresamente a la aprobación de la 24ª. En Bancos el efecto es el mismo por remisión: la 4ª VI manda aplicar al Cliente la 26ª y la 28ª, y la 26ª pide la aprobación de un directivo para PEP de riesgo alto. No se prevé autorización de la CNBV ni un reporte de 24 horas.","ref":"DCG casas de bolsa 4ª fr. VII y 24ª; DCG Bancos 4ª fr. VI y 26ª · H6","par":"F037"},{"id":"F039","tema":"h6","tipo":"caso","q":"Un banco abre una cuenta a una subsidiaria en la que una emisora que cotiza en bolsa tiene participación mayoritaria. Conforme a la 4ª VI, ¿qué ocurre con la identificación del PR?","a":"Aplica la excepción de la 4ª VI para cotizadas y sus subsidiarias con participación mayoritaria","o":["Aplica la excepción de la 4ª VI para cotizadas y sus subsidiarias con participación mayoritaria","Debe recabar los datos de cada accionista de la emisora que tenga el 25 % o más del capital","Debe aplicar la cascada y recabar los datos del administrador de la emisora controladora","Debe pedir la declaración del representante legal y una certificación de la Bolsa de Valores"],"x":"La 4ª VI exceptúa a las personas morales que cotizan en bolsa y a sus subsidiarias con participación mayoritaria. Por eso no se recorre ni el 25 % ni la cascada al administrador.","ref":"DCG Bancos 4ª fr. VI · H6"},{"id":"F040","tema":"h6","tipo":"trampa","q":"Un padre, que no es titular, deposita cada mes recursos en la cuenta de su hija adulta, quien los usa y dispone de ellos en su propio beneficio; el padre no obtiene beneficio alguno. ¿Qué figura es el padre?","a":"Proveedor de Recursos","o":["Propietario real","Beneficiario","Proveedor de Recursos","Cotitular de la cuenta"],"x":"Proveedor de Recursos es quien, sin ser titular, aporta recursos de manera regular sin obtener los beneficios (2ª XXXIII). El propietario real es quien obtiene los beneficios y es el verdadero dueño (2ª XXXII); el Beneficiario es el designado para el caso de fallecimiento (2ª III).","ref":"DCG Bancos 2ª fr. III, XXXII y XXXIII · H6"},{"id":"F041","tema":"h6","tipo":"memoria","q":"Además del verdadero dueño de los recursos y de quien ejerce el Control, ¿a quién comprende la definición de propietario real de la 2ª XXXII de Bancos?","a":"A quien pueda instruir, para su beneficio, actos mediante fideicomisos, mandatos o comisiones","o":["A la persona que aporta los recursos a la cuenta sin obtener los beneficios de ella","A la persona designada por el titular para recibir los recursos en caso de fallecimiento","A todo apoderado que firme el contrato en nombre del Cliente, aunque no se beneficie","A quien pueda instruir, para su beneficio, actos mediante fideicomisos, mandatos o comisiones"],"x":"La 2ª XXXII comprende también a quien pueda instruir o determinar, para su propio beneficio económico, actos realizados a través de fideicomisos, mandatos o comisiones. Quien aporta sin beneficiarse es Proveedor de Recursos; el designado por fallecimiento, Beneficiario.","ref":"DCG Bancos 2ª fr. XXXII · H6"},{"id":"F042","tema":"h6","tipo":"memoria","q":"En las DCG de Bancos, los datos del propietario real están en la 4ª fracción VI. ¿En qué fracción están en las DCG de casas de bolsa?","a":"4ª, fracción VII","o":["4ª, fracción VI","4ª, fracción VII","4ª, fracción III, inciso E","Art. 11, fracción VI"],"x":"Casas de bolsa tienen el PR en la 4ª VII; el contenido es igual al de Bancos, cambia la fracción. La 4ª VI es la de Bancos, SOFOM, asesores, fondos, SOCAP, SOFIPO y uniones; el art. 11 VI, la de ITF.","ref":"DCG casas de bolsa 4ª fr. VII · H6"},{"id":"F043","tema":"h6","tipo":"memoria","q":"En las DCG de Bancos, los datos del propietario real están en la 4ª fracción VI. ¿Dónde están en las DCG de casas de cambio?","a":"4ª, fracción III, inciso E","o":["4ª, fracción VII","4ª, fracción VI","4ª, fracción III, inciso E","Art. 11, fracción VI"],"x":"Casas de cambio y centros cambiarios tienen el PR en la 4ª III inciso E, referido a Usuarios y operaciones de 5,000 USD o más. La 4ª VII es la de casas de bolsa.","ref":"DCG casas de cambio 4ª fr. III, inciso E · H6","par":"F042"},{"id":"F044","tema":"h6","tipo":"cifra","q":"¿A partir de qué monto las DCG de casas de cambio y de centros cambiarios exigen integrar el expediente del Usuario con los datos del propietario real (4ª III inciso E)?","a":"5,000 USD o más","o":["5,000 USD o más","1,000 USD o más","7,500 USD o más","10,000 USD o más"],"x":"Su fracción de PR (4ª III inciso E) aplica a operaciones de 5,000 USD o más; igual en transmisores. 7,500 USD es el umbral de relevantes de Bancos, no el del PR. En casas de cambio, la fr. III se refiere a operaciones en efectivo o con cheques de viajero.","ref":"DCG casas de cambio y centros cambiarios 4ª fr. III, inciso E · H6"},{"id":"F045","tema":"h6","tipo":"caso","q":"Un banco recibe la declaración escrita del representante legal sobre quiénes son los PR de una sociedad cliente, pero hay indicios de que es falsa. ¿Qué dice la 4ª II c)?","a":"Que «deberán» tomar medidas razonables para identificar al PR","o":["Que «deberán» tomar medidas razonables para identificar al PR","Que «podrán» aceptar la declaración sin hacer nada más","Que «deberán» llevar a cabo «acciones», como en las ITF","Que deben cerrar la cuenta y avisar de inmediato a la UIF"],"x":"Ante indicios de falsedad, la 4ª II c) de Bancos dice que las Entidades «deberán tomar medidas razonables». La palabra «acciones» es la que usa la DCG de ITF para el mismo supuesto.","ref":"DCG Bancos 4ª fr. II, inciso c) · H6"},{"id":"F046","tema":"h6","tipo":"caso","q":"Una ITF tiene dudas sobre la declaración de quiénes son los PR de su Cliente persona moral. Frente a la redacción de Bancos, ¿qué término usa su DCG?","a":"Habla de llevar a cabo «acciones», no de «medidas razonables»","o":["Habla de «medidas razonables», exactamente igual que la de Bancos","Remite a los Lineamientos 2019 como única forma de verificar","Habla de llevar a cabo «acciones», no de «medidas razonables»","Ordena aplicar la cascada sin verificar la declaración recibida"],"x":"En ITF, ante dudas, la DCG habla de «acciones»; en Bancos, de «medidas razonables». Es una diferencia de redacción de la cascada del art. 11 II b), que además no menciona los derechos de voto.","ref":"DCG ITF art. 11, fr. II, inciso b) · H6","par":"F045"},{"id":"F047","tema":"h6","tipo":"caso","q":"Un banco que no actúa como fiduciario opera con un fideicomiso. ¿Qué documento le permite la 4ª IX usar para cumplir con el contrato del fideicomiso y con los datos del PR?","a":"Una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria","o":["Una certificación del capital del fideicomiso, firmada por el secretario de su comité técnico","Una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria","Una declaración del fideicomitente, ratificada ante la CNBV, sobre quiénes son los fideicomisarios","Un dictamen del auditor externo del fideicomiso sobre la identidad de sus propietarios reales"],"x":"La 4ª IX de Bancos permite («podrán») a la entidad que no es fiduciaria cumplir mediante una constancia firmada por el delegado fiduciario y el oficial de cumplimiento de la fiduciaria. Es una opción, no una exigencia; la DCG de ITF no la prevé.","ref":"DCG Bancos 4ª fr. IX · H6"},{"id":"F048","tema":"h6","tipo":"caso","q":"En una ITF, el propietario real de un Cliente es un fideicomiso. ¿Qué prevé el art. 11 VI de sus DCG?","a":"Identificar a los fideicomitentes o fideicomisarios; no prevé la opción de la constancia del delegado fiduciario","o":["Cumplir mediante la constancia del delegado fiduciario y del oficial de cumplimiento, como permite Bancos","Aplicar el numeral sobre fideicomisos de los Lineamientos 2019 como único criterio de identificación","Considerar al delegado fiduciario como propietario real y recabar sólo sus datos de identificación","Identificar a los fideicomitentes o fideicomisarios; no prevé la opción de la constancia del delegado fiduciario"],"x":"En ITF, si el PR es un fideicomiso, se identifica a fideicomitentes o fideicomisarios; su DCG no prevé la opción de cumplir con la constancia del delegado fiduciario que la 4ª IX da a Bancos. Los Lineamientos 2019 no tienen numeral sobre fideicomisos.","ref":"DCG ITF art. 11, fr. VI · H6","par":"F047"},{"id":"F049","tema":"h6","tipo":"caso","q":"Una SOFOM, una casa de cambio, un centro cambiario y un transmisor reciben transferencias ordenadas por otros sujetos obligados. ¿En cuál presume su DCG, como la de Bancos, que el ordenante actúa por cuenta de sus clientes?","a":"En la casa de cambio","o":["En la SOFOM","En el centro cambiario","En la casa de cambio","En el transmisor de dinero"],"x":"La presunción de Bancos (31ª) la repiten casas de cambio, SOCAP, SOFIPO y, respecto de «entidades financieras», casas de bolsa. SOFOM, centros cambiarios y transmisores no la prevén: la presunción no sigue familias.","ref":"DCG Bancos 31ª; DCG casas de cambio 22ª · H6"},{"id":"F050","tema":"h6","tipo":"caso","q":"Un banco atiende a una asociación civil clasificada de riesgo alto. ¿Qué procedimiento sobre su propietario real debe prever el Manual conforme a la 32ª II?","a":"Identificar a quien ejerza el Control, independientemente del porcentaje","o":["Identificar a quien ejerza el Control, independientemente del porcentaje","Identificar sólo a los asociados con el 25 % o más de las aportaciones","Identificar sólo a quien vote más del 50 % en la asamblea de asociados","Tomar como PR al presidente del consejo directivo, sin más análisis"],"x":"Para sociedades o asociaciones civiles de riesgo alto, la 32ª II pide identificar a quien tenga el Control «independientemente del porcentaje»: aquí no opera el umbral del 25 %.","ref":"DCG Bancos 32ª, fr. II · H6"},{"id":"F101","tema":"h6","tipo":"caso","q":"Una casa de cambio y un centro cambiario designan a su nuevo oficial de cumplimiento el mismo día. ¿Qué plazo tiene cada uno para avisarlo a la Secretaría, por conducto de la CNBV?","a":"Casa de cambio: 2 días hábiles; centro cambiario: 10 días hábiles","o":["Ambos: 2 días
