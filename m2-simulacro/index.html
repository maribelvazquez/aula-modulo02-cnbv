comercios y lo resguarda en su bóveda. ¿En qué fracción del art. 17 encuadra?","a":"Fr. X","o":["Fr. XI","Fr. IX","Fr. IV","Fr. X"],"x":"La fr. X es la prestación habitual o profesional de servicios de traslado o custodia de dinero o valores (salvo cuando intervienen el Banco de México o las instituciones para el depósito de valores). Que use camiones blindados no la vuelve fr. IX, que es prestar el servicio de blindaje.","ref":"Art. 17, fr. X · H8"},{"id":"G020","tema":"h8","tipo":"caso","q":"Un contador independiente, sin relación laboral con su cliente, maneja en nombre de éste sus cuentas bancarias y de valores. ¿En qué fracción del art. 17 encuadra?","a":"Fr. XI","o":["Fr. IV","Fr. XI","Fr. X","Fr. XII"],"x":"La fr. XI, inciso c), cubre al profesionista independiente que, en nombre y representación del cliente, maneja cuentas bancarias, de ahorro o de valores. La XII es fe pública (notarios, corredores, servidores con fe pública y facilitadores).","ref":"Art. 17, fr. XI, inciso c) · H8"},{"id":"G021","tema":"h8","tipo":"caso","q":"Un centro de apuestas con permiso de la Secretaría de Gobernación vende fichas y paga premios a sus jugadores. ¿En qué fracción del art. 17 encuadra?","a":"Fr. I","o":["Fr. II","Fr. I","Fr. XIII","Fr. XVI"],"x":"La fr. I cubre los juegos con apuesta, concursos o sorteos de organismos descentralizados o con permiso de Gobernación: venta de boletos o fichas y pago de premios. La II es de tarjetas y monederos; la XVI, de activos virtuales.","ref":"Art. 17, fr. I · H8"},{"id":"G022","tema":"h8","tipo":"caso","q":"Una empresa que no es Entidad Financiera emite y comercializa monederos electrónicos recargables. ¿En qué fracción del art. 17 encuadra?","a":"Fr. II","o":["Fr. III","Fr. II","Fr. XVI","Fr. IV"],"x":"La fr. II, inciso c), cubre los instrumentos de almacenamiento de valor monetario emitidos o comercializados por sujetos distintos de las Entidades Financieras. Los activos virtuales (fr. XVI) son otra figura: la ley excluye de ellos la moneda de curso legal.","ref":"Art. 17, fr. II, inciso c) · H8"},{"id":"G023","tema":"h8","tipo":"caso","q":"Una persona facilitadora privada, en términos de la Ley General de Mecanismos Alternativos de Solución de Controversias, formaliza un convenio de transmisión de un inmueble. ¿En qué parte del art. 17 encuadra?","a":"Fr. XII, apartado D","o":["Fr. XI","Fr. XII, apartado A","Fr. XII, apartado D","Fr. XII, apartado C"],"x":"El apartado D de la fr. XII (nuevo 2025) incorpora a las personas facilitadoras públicas y privadas, con las operaciones previstas en el apartado A. El apartado A es el de los notarios; el C, el de los servidores públicos con fe pública.","ref":"Art. 17, fr. XII, apartado D · H8"},{"id":"G024","tema":"h8","tipo":"caso","q":"Una joyería vende a un cliente un reloj por 1 000 veces el valor diario de la UMA, pagado por transferencia. ¿Qué obligación nace?","a":"Identificar al cliente, sin presentar Aviso","o":["Ninguna, porque no alcanza el umbral de identificación","Presentar Aviso a la SHCP, sin necesidad de identificar","Identificar al cliente, sin presentar Aviso","Identificar al cliente y presentar Aviso a la SHCP"],"x":"En la fr. VI se identifica desde 805 y se avisa desde 1 605 veces el valor diario de la UMA; 1 000 está en medio. Identificar no es avisar: aquí sólo nace la identificación.","ref":"Art. 17, fr. VI · H8"},{"id":"G025","tema":"h8","tipo":"caso","q":"Una agencia vende una camioneta en 7 000 veces el valor diario de la UMA, pagada por transferencia. ¿Qué obligación nace?","a":"Identificar al cliente y presentar Aviso a la SHCP","o":["Identificar al cliente y presentar Aviso a la SHCP","Sólo identificar al cliente, porque no llega a 8 025 veces","Sólo presentar Aviso, porque supera 3 210 veces la UMA","Ninguna, porque el pago no se hizo en efectivo"],"x":"En la fr. VIII se identifica desde 3 210 y se avisa desde 6 420 veces el valor diario de la UMA; 7 000 supera ambos. El 8 025 es el umbral de inmuebles, no de vehículos, y la forma de pago no elimina las obligaciones del art. 17.","ref":"Art. 17, fr. VIII · H8"},{"id":"G026","tema":"h8","tipo":"trampa","q":"Un arrendador celebra un contrato de un solo mes con renta de exactamente 1 605 veces el valor diario de la UMA. ¿Qué obligación nace por la fr. XV del art. 17?","a":"Ninguna, porque no es superior a 1 605 veces la UMA","o":["Presentar Aviso, porque toda renta de inmuebles se avisa","Identificar al arrendatario, porque iguala el umbral","Ninguna, porque no es superior a 1 605 veces la UMA","Identificar al arrendatario y presentar Aviso a la SHCP"],"x":"La fr. XV fija la identificación para un valor mensual «superior a» 1 605 veces el valor diario de la UMA: igualarlo no basta. El Aviso, en cambio, es «igual o superior» a 3 210. Al ser un solo mes, tampoco opera la acumulación de seis meses del penúltimo párrafo del art. 17.","ref":"Art. 17, fr. XV · H8"},{"id":"G027","tema":"h8","tipo":"caso","q":"Un arrendador pacta una renta mensual de 3 210 veces el valor diario de la UMA. ¿Qué obligación nace por la fr. XV del art. 17?","a":"Identificar al arrendatario y presentar Aviso a la SHCP","o":["Identificar al arrendatario y presentar Aviso a la SHCP","Sólo identificar, porque el Aviso exige superar 3 210 veces","Sólo presentar Aviso, sin obligación de identificar","Ninguna, porque el arrendamiento no es actividad vulnerable"],"x":"En la fr. XV el Aviso procede cuando el monto mensual es «igual o superior» a 3 210 veces el valor diario de la UMA, y 3 210 también supera el umbral de identificación (superior a 1 605). Sólo la identificación usa «superior a».","ref":"Art. 17, fr. XV · H8"},{"id":"G028","tema":"h8","tipo":"caso","q":"Una asociación civil sin fines de lucro recibe un donativo de 2 000 veces el valor diario de la UMA. ¿Qué obligación nace?","a":"Identificar al donante, sin presentar Aviso","o":["Presentar Aviso a la SHCP, sin necesidad de identificar","Identificar al donante, sin presentar Aviso","Identificar al donante y presentar Aviso a la SHCP","Ninguna, porque los donativos no generan obligaciones"],"x":"En la fr. XIII se identifica desde 1 605 y se avisa desde 3 210 veces el valor diario de la UMA. Con 2 000 nace la identificación, pero todavía no el Aviso.","ref":"Art. 17, fr. XIII · H8"},{"id":"G029","tema":"h8","tipo":"caso","q":"Un casino con permiso de la Secretaría de Gobernación paga a un jugador un premio de 500 veces el valor diario de la UMA. ¿Qué obligación nace?","a":"Identificar al jugador, sin presentar Aviso","o":["Identificar al jugador y presentar Aviso a la SHCP","Presentar Aviso, porque supera 325 veces el valor de la UMA","Ninguna, porque los premios no son operaciones de la fr. I","Identificar al jugador, sin presentar Aviso"],"x":"La fr. I incluye la entrega o pago de premios; se identifica desde 325 y se avisa desde 645 veces el valor diario de la UMA. 500 sólo activa la identificación; 325 no es umbral de Aviso.","ref":"Art. 17, fr. I · H8"},{"id":"G030","tema":"h8","tipo":"trampa","q":"Ante notario se escritura la compraventa de una casa: precio pactado 7 500, valor catastral 6 000 y valor comercial 8 100 veces el valor diario de la UMA. ¿Es objeto de Aviso?","a":"Sí, porque el valor comercial, el más alto, iguala o supera 8 000 veces","o":["Sí, porque el valor comercial, el más alto, iguala o supera 8 000 veces","Sólo si el precio pactado se paga en efectivo, por el límite del art. 32, fr. I","No, porque el precio pactado no alcanza 8 000 veces el valor de la UMA","No, porque ante notario el Aviso de inmuebles exige 8 025 veces la UMA"],"x":"En la fr. XII, apartado A, inciso a), se toma el más alto entre precio pactado, valor catastral, valor comercial o monto garantizado, y el Aviso procede desde 8 000 veces el valor diario de la UMA. El 8 025 es para la fr. V, V Bis, avalúos de corredor y efectivo en inmuebles.","ref":"Art. 17, fr. XII, apartado A, inciso a) · H8"},{"id":"G031","tema":"h8","tipo":"caso","q":"Ante notario se constituye un fideicomiso de garantía por 4 500 veces el valor diario de la UMA, que no garantiza un crédito de una institución del sistema financiero ni de un organismo público de vivienda. ¿Es objeto de Aviso?","a":"Sí, porque el monto iguala o supera 4 000 veces el valor de la UMA","o":["No, porque los fideicomisos ante notario avisan desde 8 000 veces","Sí, porque los fideicomisos ante notario siempre son objeto de Aviso sin umbral","Sí, porque el monto iguala o supera 4 000 veces el valor de la UMA","No, porque los fideicomisos de garantía nunca son objeto de Aviso"],"x":"La fr. XII, apartado A, inciso d), fija el Aviso de fideicomisos traslativos de dominio o de garantía desde 4 000 veces el valor diario de la UMA; sólo excluye los que garantizan créditos del sistema financiero u organismos públicos de vivienda. No es «siempre aviso» como los incisos b), c) y e).","ref":"Art. 17, fr. XII, apartado A, inciso d) · H8"},{"id":"G032","tema":"h8","tipo":"trampa","q":"Una desarrolladora que construye y vende departamentos de forma habitual (fr. V) vende uno en 8 010 veces el valor diario de la UMA. ¿Es objeto de Aviso?","a":"No, porque en la fr. V el Aviso procede desde 8 025 veces la UMA","o":["No, porque en la fr. V el Aviso procede desde 8 025 veces la UMA","No, porque las desarrolladoras sólo avisan si reciben preventas","Sí, porque toda venta de inmuebles es objeto de Aviso sin umbral","Sí, porque las operaciones con inmuebles avisan desde 8 000 veces"],"x":"La fr. V fija el Aviso en 8 025 veces el valor diario de la UMA. El 8 000 es el umbral del notario (fr. XII, apartado A, inciso a)), no el de quien construye o intermedia.","ref":"Art. 17, fr. V · H8"},{"id":"G033","tema":"h8","tipo":"caso","q":"Un notario otorga un poder irrevocable para actos de dominio sobre bienes con valor de 300 veces el valor diario de la UMA. ¿Es objeto de Aviso?","a":"Sí, porque los poderes irrevocables siempre son objeto de Aviso","o":["No, porque el valor no alcanza 8 000 veces el valor de la UMA","Sólo si el poder se otorga para actos de dominio sobre inmuebles","Sí, porque los poderes irrevocables siempre son objeto de Aviso","No, porque los poderes no implican transmisión de propiedad"],"x":"La fr. XII, apartado A, inciso b), dice que el otorgamiento de poderes irrevocables para actos de administración o dominio «siempre» será objeto de Aviso: no hay umbral. Lo mismo ocurre con los incisos c) (personas morales) y e) (mutuo con acreedor no financiero).","ref":"Art. 17, fr. XII, apartado A, inciso b) · H8"},{"id":"G034","tema":"h8","tipo":"caso","q":"Una agencia aduanal promueve, por cuenta ajena, el despacho de un vehículo terrestre usado con valor de 400 veces el valor diario de la UMA. ¿Es objeto de Aviso?","a":"Sí, porque los vehículos en comercio exterior se avisan en todos los casos","o":["Sí, porque los vehículos en comercio exterior se avisan en todos los casos","No, porque el umbral de vehículos en la fr. VIII es de 3 210 veces","Sólo si el vehículo es nuevo y se importa en forma definitiva","No, porque el valor del vehículo no alcanza 6 420 veces el valor diario de la UMA"],"x":"La fr. XIV, inciso a), incluye los vehículos terrestres, aéreos y marítimos, nuevos y usados, «cualquiera que sea el valor de los bienes», y esas actividades son objeto de Aviso en todos los casos. Los umbrales de la fr. VIII son para quien comercializa vehículos, no para el despacho aduanal.","ref":"Art. 17, fr. XIV, inciso a) · H8"},{"id":"G035","tema":"h8","tipo":"trampa","q":"En cuatro meses, un cliente compra en una joyería tres piezas de 600 veces el valor diario de la UMA cada una (1 800 en total). ¿Qué prevé la ley?","a":"La suma podrá considerarse operación sujeta a la obligación de Aviso","o":["La suma será considerada en todo caso operación sujeta a Aviso","La suma podrá considerarse operación sujeta a la obligación de Aviso","No hay obligación, porque cada operación es inferior al umbral","Debe presentarse Aviso dentro de las 24 horas por posible fraccionamiento de operaciones"],"x":"El penúltimo párrafo del art. 17 dice que, si la suma en seis meses supera el umbral de Aviso (aquí 1 605 veces el valor diario de la UMA), «podrá ser considerada» sujeta a Aviso. Es facultativo («podrá»), no automático («será»).","ref":"Art. 17, penúltimo párrafo · H8"},{"id":"G036","tema":"h8","tipo":"caso","q":"Una plataforma de intercambio de activos virtuales (no Entidad Financiera) realiza para un cliente una operación de 150 veces el valor diario de la UMA y le cobra una comisión de 5 veces el valor diario de la UMA. ¿Es objeto de Aviso?","a":"Sí, porque la comisión cobrada iguala o supera 4 veces la UMA","o":["Sí, porque toda operación con activos virtuales es objeto de Aviso","Sí, porque la comisión cobrada iguala o supera 4 veces la UMA","No, porque en activos virtuales sólo cuenta el monto operado","No, porque la operación no alcanza 210 veces el valor de la UMA"],"x":"La fr. XVI tiene dos supuestos de Aviso: a) operación del cliente igual o superior a 210 veces el valor diario de la UMA, o b) contraprestación igual o superior a 4 veces el valor diario de la UMA. Basta el inciso b): la comisión de 5 lo cumple aunque la operación no llegue a 210.","ref":"Art. 17, fr. XVI, inciso b) · H8"},{"id":"G037","tema":"h8","tipo":"caso","q":"Una agencia de autos vende una camioneta a una sociedad anónima. Respecto del Beneficiario Controlador, ¿qué debe hacer la agencia?","a":"Recabar documentos con reconocimiento oficial que identifiquen a su Beneficiario Controlador","o":["Recabar documentos con reconocimiento oficial que identifiquen a su Beneficiario Controlador","Identificar únicamente al representante legal que firma la operación por la sociedad","Consultar a la Secretaría de Economía antes de recabar cualquier dato de la sociedad","Recabar sólo la declaración del representante de la sociedad sobre si conoce a un Beneficiario Controlador"],"x":"El art. 18, fr. III, primer párrafo: si el cliente es persona moral, fideicomiso u otra figura jurídica, se recaban documentos o medios de identificación con reconocimiento oficial que permitan identificar a su Beneficiario Controlador. La sola declaración es la regla para personas físicas.","ref":"Art. 18, fr. III, primer párrafo · H8"},{"id":"G038","tema":"h8","tipo":"caso","q":"Una persona física compra un reloj en una joyería por un monto que obliga a identificarla. Respecto del Beneficiario Controlador, ¿qué debe recabar la joyería?","a":"Su declaración de si conoce o no a un Beneficiario Controlador y, en su caso, la documentación","o":["Una constancia de la SHCP que acredite que no actúa por cuenta de un tercero","Nada, porque el Beneficiario Controlador sólo se identifica en personas morales","Su declaración de si conoce o no a un Beneficiario Controlador y, en su caso, la documentación","Documentos oficiales que identifiquen a su Beneficiario Controlador en todos los casos, sin excepción"],"x":"El art. 18, fr. III, segundo párrafo (nuevo 2025): si el cliente es persona física, se recaba su declaración sobre si tiene o no conocimiento de la existencia de un Beneficiario Controlador y, en su caso, la documentación para identificarlo. No se exige documentarlo siempre, pero tampoco se omite.","ref":"Art. 18, fr. III, segundo párrafo · H8"},{"id":"G039","tema":"h8","tipo":"caso","q":"Un cliente quiere pagar un departamento con recursos cuyo origen no explica; ante las preguntas, retira la oferta y la operación no se celebra. Con base en esa sospecha, ¿qué debe hacer la inmobiliaria?","a":"Presentar Aviso dentro de las 24 horas siguientes, aunque no se celebró la operación","o":["Presentar Aviso a más tardar el día 17 del mes siguiente a aquel en que surgió la sospecha","Presentar Aviso dentro de las 24 horas siguientes, aunque no se celebró la operación","Nada, porque sólo se avisan las operaciones efectivamente celebradas con el cliente","Presentar denuncia ante la Fiscalía dentro de las 72 horas, en lugar de presentar Aviso"],"x":"El art. 18, fr. VI, segundo párrafo (nuevo 2025): ante sospecha o información basada en hechos o indicios, el Aviso se presenta dentro de las 24 horas siguientes, «incluso si el acto u operación no se celebró». El día 17 es el plazo ordinario del art. 23, no el de sospecha.","ref":"Art. 18, fr. VI, segundo párrafo · H8"},{"id":"G040","tema":"h8","tipo":"memoria","q":"La reforma de 2025 agregó al art. 18 las fr. VII a XI (evaluación de riesgos, manual, capacitación, monitoreo y auditoría). ¿Cuándo entran en vigor esas obligaciones?","a":"En los plazos que establezcan las reglas de carácter general","o":["A los nueve meses siguientes a la publicación del Decreto","Al día siguiente de la publicación del Decreto en el DOF","A los sesenta días de la entrada en vigor del Reglamento","En los plazos que establezcan las reglas de carácter general"],"x":"El tercero transitorio del Decreto de 16-jul-2025 dice que las fr. VII a XI del art. 18 entrarán en vigor en los plazos que establezcan las reglas de carácter general. El Decreto en general sí entró en vigor al día siguiente, «salvo las excepciones» de sus transitorios, y ésta es una.","ref":"Tercero transitorio, DOF 16-07-2025 · H8"},{"id":"G041","tema":"h8","tipo":"caso","q":"Un cliente de una agencia de vehículos se niega a entregar su identificación oficial para una operación sujeta a identificación. ¿Qué debe hacer quien realiza la actividad vulnerable?","a":"Abstenerse de realizar la operación, sin responsabilidad alguna","o":["Realizar la operación, anotando la negativa en el expediente","Suspender la operación hasta que la SHCP autorice continuarla","Abstenerse de realizar la operación, sin responsabilidad alguna","Realizar la operación y presentar Aviso de inmediato a la SHCP"],"x":"El art. 21, segundo párrafo: quienes realicen AV deberán abstenerse, sin responsabilidad alguna, de llevar a cabo el acto u operación cuando el cliente se niegue a proporcionar la información o documentación. No se requiere autorización de la SHCP para abstenerse.","ref":"Art. 21, segundo párrafo · H8"},{"id":"G042","tema":"h8","tipo":"caso","q":"Un joyero que opera como persona física realiza una actividad vulnerable y no está afiliado a ninguna Entidad Colegiada. ¿Quién debe cumplir sus obligaciones conforme a la ley?","a":"Él mismo, de manera personal y directa","o":["Su contador externo, como responsable solidario ante la SHCP","Una Representante Encargada del Cumplimiento que debe designar","Él mismo, de manera personal y directa","La Entidad Colegiada de su gremio, a la que debe afiliarse"],"x":"El art. 20, último párrafo: las personas físicas que realicen AV cumplen personal y directamente, salvo el supuesto de la Sección Cuarta (Avisos por conducto de Entidades Colegiadas). La obligación de designar Representante Encargada es para personas morales y quienes actúan mediante fideicomisos u otras figuras.","ref":"Art. 20, último párrafo · H8"},{"id":"G043","tema":"h8","tipo":"caso","q":"Una sociedad que comercializa obras de arte aún no tiene aceptada la designación de su Representante Encargada del Cumplimiento. Mientras tanto, ¿a quién corresponde cumplir las obligaciones de la ley?","a":"A los integrantes del órgano de administración o al administrador único","o":["A nadie, porque la sociedad queda exenta hasta que se acepte la designación","Al accionista mayoritario, por ser su Beneficiario Controlador","Al director de finanzas o, en su defecto, al contador de la sociedad","A los integrantes del órgano de administración o al administrador único"],"x":"El art. 20, segundo párrafo: en tanto no haya Representante Encargada o la designación no sea aceptada, el cumplimiento corresponde a los integrantes del órgano de administración o a quien funja como administrador único. No hay periodo de exención.","ref":"Art. 20, segundo párrafo · H8"},{"id":"G044","tema":"h8","tipo":"cifra","q":"Una agencia vende un vehículo el 5 de marzo y la operación es objeto de Aviso. ¿A más tardar cuándo debe presentarlo?","a":"El 17 de abril","o":["El 17 de marzo","El 17 de abril","El 5 de abril","El 30 de abril"],"x":"El art. 23 fija como plazo el día 17 del mes inmediato siguiente a aquel en que se realizó la operación: marzo → 17 de abril. No se cuentan 30 días desde la operación.","ref":"Art. 23, primer párrafo · H8"},{"id":"G045","tema":"h8","tipo":"cifra","q":"¿Durante cuánto tiempo, como mínimo, debe conservar quien realiza una actividad vulnerable la información y documentación que soporta la actividad?","a":"Al menos 10 años desde la fecha en que se realizó la actividad","o":["Al menos 10 años desde la fecha en que se realizó la actividad","Al menos 10 años desde la fecha en que se presentó el Aviso","Al menos 5 años desde que terminó la relación con el cliente","Al menos 5 años desde la fecha en que se realizó la actividad"],"x":"El art. 18, fr. IV, segundo párrafo: por al menos diez años contados a partir de la fecha de realización de la Actividad Vulnerable. Los 5 años son el alcance de las visitas de verificación (art. 36), no el plazo de conservación.","ref":"Art. 18, fr. IV, segundo párrafo · H8"},{"id":"G046","tema":"h8","tipo":"caso","q":"Por una falla en los sistemas informáticos de una Entidad Colegiada, los Avisos de varios de sus integrantes se presentan fuera de plazo. ¿Quién responde por ese incumplimiento?","a":"La Entidad Colegiada, porque la causa le es imputable","o":["La Entidad Colegiada, porque la causa le es imputable","Cada integrante, porque la obligación de avisar es suya","La Representante Encargada del Cumplimiento de cada integrante","La Entidad Colegiada y los integrantes, de forma solidaria"],"x":"El art. 30: los incumplimientos de los integrantes por causas imputables a la Entidad Colegiada son responsabilidad de ésta; sólo si la causa es imputable al integrante, la Entidad no responde. La ley no establece responsabilidad solidaria.","ref":"Art. 30 · H8"},{"id":"G047","tema":"h8","tipo":"cifra","q":"Una Entidad Colegiada decide dejar de actuar como intermediaria entre sus integrantes y la Secretaría. ¿Con qué anticipación debe informarlo?","a":"Con cuando menos 30 días de anticipación","o":["Con cuando menos 60 días de anticipación","Con cuando menos 15 días de anticipación","Con cuando menos 90 días de anticipación","Con cuando menos 30 días de anticipación"],"x":"El art. 31 obliga a informar a los integrantes y a la Secretaría con cuando menos treinta días de anticipación la intención de extinción, disolución o liquidación, o de dejar de actuar como intermediario. Después, sus integrantes cumplen en forma individual y directa.","ref":"Art. 31, primer párrafo · H8"},{"id":"G048","tema":"h8","tipo":"caso","q":"Un despacho de servicios profesionales firmó con su cliente una cláusula de confidencialidad absoluta y argumenta que presentar Avisos violaría su secreto profesional. ¿Qué establece la ley?","a":"Presentar Avisos no transgrede ningún secreto ni puede impedirse por cláusula de confidencialidad","o":["El secreto profesional exime de presentar Avisos, salvo requerimiento expreso de la Unidad","La cláusula de confidencialidad prevalece si se firmó antes de que naciera la obligación de presentar el Aviso","Presentar Avisos sólo es válido si el cliente autoriza por escrito levantar la confidencialidad","Presentar Avisos no transgrede ningún secreto ni puede impedirse por cláusula de confidencialidad"],"x":"El art. 22: presentar Avisos e información no implica transgresión a obligaciones de confidencialidad o secreto legal, profesional, fiscal, bancario, fiduciario u otro, ni puede ser objeto de cláusula de confidencialidad. No se necesita autorización del cliente.","ref":"Art. 22 · H8"},{"id":"G049","tema":"h8","tipo":"caso","q":"Una galería atiende a un coleccionista con quien tiene una relación formal y habitual. ¿En qué supuesto la ley le exige solicitar al cliente información sobre su actividad u ocupación?","a":"Cuando se establezca una Relación de negocios con el cliente","o":["Sólo cuando la operación con el cliente sea objeto de Aviso","Cuando se establezca una Relación de negocios con el cliente","En toda operación que alcance el umbral de identificación","Sólo cuando el cliente sea Persona Políticamente Expuesta"],"x":"El art. 18, fr. II: «para los casos en que se establezca una Relación de negocios» se solicita la actividad u ocupación, basándose, entre otros, en los avisos al RFC. La Relación de negocios es formal y habitual y excluye lo ocasional (art. 3, fr. XII).","ref":"Art. 18, fr. II · H8"},{"id":"G050","tema":"h8","tipo":"memoria","q":"Cuando se transmiten acciones o partes sociales de una sociedad mercantil, ¿qué aviso debe presentar la propia sociedad conforme al Capítulo IV Bis?","a":"Aviso de la inscripción en su libro de registro, en el sistema de la Secretaría de Economía","o":["Aviso de la inscripción en su libro de registro, en el sistema de la Secretaría de Economía","Aviso a la SHCP por el portal de Actividades Vulnerables, a más tardar el día 17 siguiente","Aviso a la SHCP dentro de las 24 horas siguientes, por tratarse de un cambio de control","Aviso ante el notario que formalizó la transmisión, quien lo remite a la Unidad de la Fiscalía"],"x":"El art. 33 Bis, segundo párrafo: la sociedad presenta aviso respecto de la inscripción en el libro de registro en el sistema electrónico que determine y opere la Secretaría de Economía. No es un Aviso de AV ante la SHCP.","ref":"Art. 33 Bis, segundo párrafo · H8"},{"id":"G051","tema":"h8","tipo":"caso","q":"La evaluación de riesgos de una agencia de vehículos la ubica en riesgo alto. ¿Quién debe revisar y dictaminar en el año calendario la efectividad de su cumplimiento?","a":"Una persona auditora externa independiente","o":["La propia SHCP, mediante una visita de verificación anual","Su Representante Encargada del Cumplimiento, con informe anual","Su área de auditoría interna o un auditor externo, a su elección","Una persona auditora externa independiente"],"x":"El art. 18, fr. XI: con riesgo bajo o medio puede revisar el área de auditoría interna o un auditor externo independiente; con riesgo alto, sólo un auditor externo independiente. La opción «a su elección» es la regla del riesgo bajo o medio.","ref":"Art. 18, fr. XI · H8"},{"id":"G052","tema":"h8","tipo":"caso","q":"Una arrendadora celebra un contrato con un cliente que es persona moral mexicana de derecho público. ¿Cómo debe identificarlo?","a":"Aplicándole un régimen simplificado de identificación, conforme a las reglas","o":["Aplicándole un régimen simplificado de identificación, conforme a las reglas","No debe identificarlo, porque las autoridades están exentas","Con el mismo régimen que a cualquier otra persona moral cliente","Identificando sólo a su Beneficiario Controlador ante la SHCP"],"x":"El art. 19, último párrafo (nuevo 2025): a los clientes personas morales mexicanas de derecho público se les deberá aplicar un régimen simplificado de identificación conforme a las reglas de carácter general. Simplificado no es exento.","ref":"Art. 19, último párrafo · H8"},{"id":"G053","tema":"h8","tipo":"caso","q":"Una persona quiere pagar en efectivo una casa con valor de 9 000 veces el valor diario de la UMA al día del pago. ¿Qué dispone la ley?","a":"Está prohibido, porque iguala o supera 8 025 veces la UMA","o":["Está prohibido sólo si el pago se hace en divisas extranjeras","Está prohibido, porque iguala o supera 8 025 veces la UMA","Está permitido si el efectivo se deposita en una institución de crédito","Está permitido, pero el notario debe presentar Aviso a la SHCP"],"x":"El art. 32, fr. I, prohíbe pagar en efectivo la constitución o transmisión de derechos reales sobre inmuebles desde 8 025 veces el valor diario de la UMA, al día del pago, aun por conducto de una Entidad Financiera, en moneda nacional o divisas.","ref":"Art. 32, fr. I · H8"},{"id":"G054","tema":"h8","tipo":"trampa","q":"Una persona quiere pagar en efectivo, en moneda nacional, una casa con valor de 8 000 veces el valor diario de la UMA al día del pago. ¿Lo prohíbe el art. 32?","a":"No, porque la prohibición para inmuebles inicia en 8 025 veces la UMA","o":["Sí, porque la prohibición para inmuebles inicia en 8 000 veces el valor diario de la UMA","Sí, porque la prohibición inicia en 3 210 veces la UMA para todo bien","No, porque la prohibición para inmuebles inicia en 8 025 veces la UMA","No, siempre que el efectivo se deposite por conducto de un banco"],"x":"El art. 32, fr. I, prohíbe el efectivo en inmuebles desde 8 025 veces el valor diario de la UMA. El 8 000 es el umbral de Aviso del notario, no el de efectivo; el 3 210 aplica a los demás bienes de las fr. II a VII. Pasar el efectivo por un banco no cambia nada: la prohibición rige aun por conducto de una Entidad Financiera.","ref":"Art. 32, fr. I · H8"},{"id":"G055","tema":"h8","tipo":"caso","q":"Para pagar un automóvil de 4 000 veces el valor diario de la UMA, el comprador deposita billetes en ventanilla bancaria a la cuenta de la agencia. ¿Qué dispone la ley?","a":"Está prohibido, aunque el efectivo pase por una Entidad Financiera","o":["Está prohibido sólo si el comprador no es cliente del banco receptor","Está prohibido, aunque el efectivo pase por una Entidad Financiera","Está permitido, porque el pago quedó registrado en el sistema financiero","Está permitido, porque el límite de efectivo en vehículos es de 6 420 veces"],"x":"El art. 32, primer párrafo y fr. II, prohíbe liquidar en efectivo vehículos desde 3 210 veces el valor diario de la UMA, «aun cuando la liquidación o el pago se realice en efectivo por conducto de una Entidad Financiera». El 6 420 es umbral de Aviso de la fr. VIII del art. 17, no límite de efectivo.","ref":"Art. 32, primer párrafo y fr. II · H8"},{"id":"G056","tema":"h8","tipo":"caso","q":"Un cliente ofrece pagar un reloj de 3 300 veces el valor diario de la UMA con monedas de oro. ¿Qué dispone la ley?","a":"Está prohibido, porque los Metales Preciosos están sujetos a la prohibición","o":["Está permitido, porque el límite para relojes es de 8 025 veces la UMA","Está permitido, porque la prohibición sólo alcanza monedas y billetes","Está prohibido sólo si las monedas de oro son de origen extranjero","Está prohibido, porque los Metales Preciosos están sujetos a la prohibición"],"x":"El art. 32 prohíbe pagar o aceptar el pago con monedas y billetes, en moneda nacional o divisas, «y Metales Preciosos»; la fr. III fija para relojes, joyería y piedras preciosas el límite de 3 210 veces el valor diario de la UMA. El oro es Metal Precioso (art. 3, fr. IX).","ref":"Art. 32, primer párrafo y fr. III · H8"},{"id":"G057","tema":"h8","tipo":"caso","q":"Un comprador intenta consignar en efectivo, ante la negativa del vendedor a recibirlo, el pago de un inmueble de 9 000 veces el valor diario de la UMA al día de la consignación. ¿Aplica la prohibición del art. 32?","a":"Sí, la consignación de pago está prohibida con el umbral de su fracción","o":["Sí, la consignación de pago está prohibida con el umbral de su fracción","No, porque el art. 32 sólo regula el pago directo entre las partes","No, porque la consignación de pago es un acto judicial y no una compraventa","Sí, pero sólo cuando la consignación se realiza en divisas extranjeras"],"x":"La fr. VIII del art. 32 (nueva 2025) incluye la consignación de pago relacionada con las operaciones de las fr. I a VII, conforme al umbral de cada fracción al día de la consignación. Para inmuebles, 8 025; aquí 9 000 lo supera.","ref":"Art. 32, fr. VIII · H8"},{"id":"G058","tema":"h8","tipo":"caso","q":"Un socio vende sus acciones de una sociedad anónima por 3 500 veces el valor diario de la UMA y el comprador quiere pagar con billetes. ¿Qué dispone la ley?","a":"Está prohibido, porque iguala o supera 3 210 veces la UMA","o":["Está permitido si el notario identifica la forma de pago","Está prohibido sólo si la operación supera 8 025 veces la UMA","Está prohibido, porque iguala o supera 3 210 veces la UMA","Está permitido, porque las acciones no son bienes del art. 32"],"x":"El art. 32, fr. VI, prohíbe el efectivo en la transmisión de dominio o constitución de derechos sobre títulos representativos de partes sociales o acciones desde 3 210 veces el valor diario de la UMA. El 8 025 es sólo para inmuebles.","ref":"Art. 32, fr. VI · H8"},{"id":"G059","tema":"h8","tipo":"cifra","q":"¿Qué multa corresponde a quien omite presentar los Avisos del art. 17?","a":"De 10 000 a 65 000 veces la UMA, o del 10 % al 100 % del valor del acto, la mayor","o":["De 2 000 a 10 000 veces la UMA, o del 10 % al 100 % del valor del acto, la menor","Del 10 % al 100 % del valor del acto, sin un mínimo expresado en veces la UMA","De 10 000 a 65 000 veces la UMA, o del 10 % al 100 % del valor del acto, la mayor","De 200 a 2 000 veces la UMA, por tratarse de un incumplimiento formal de Avisos"],"x":"El art. 54, fr. III, sanciona la omisión de Avisos (53 VI) y la participación en operaciones prohibidas en efectivo (53 VII) con 10 000 a 65 000 veces el valor diario de la UMA o del 10 al 100 % del valor del acto cuando sea cuantificable, «la que resulte mayor». El rango de 200 a 2 000 es para las fr. I a IV del art. 53.","ref":"Art. 54, fr. III · H8"},{"id":"G060","tema":"h8","tipo":"caso","q":"Una agencia de autos presenta un Aviso 20 días después de la fecha en que debió presentarlo. ¿Cómo se sanciona?","a":"Como Aviso extemporáneo, con multa de 200 a 2 000 veces la UMA","o":["Como omisión de Aviso, con multa de 10 000 a 65 000 veces la UMA","Como Aviso sin requisitos, con multa de 2 000 a 10 000 veces la UMA","No se sanciona, porque se presentó dentro de un plazo de gracia de 30 días","Como Aviso extemporáneo, con multa de 200 a 2 000 veces la UMA"],"x":"El art. 53, fr. III, sanciona presentar Avisos fuera de tiempo cuando se presentan a más tardar dentro de los 30 días siguientes a la fecha debida; esa conducta se multa con 200 a 2 000 veces el valor diario de la UMA (art. 54, fr. I). Un retraso de 20 días es extemporáneo, no omisión, y sí se multa: no hay «plazo de gracia».","ref":"Art. 53, fr. III, y art. 54, fr. I · H8"},{"id":"G061","tema":"h8","tipo":"caso","q":"Una inmobiliaria presenta un Aviso 45 días después de la fecha en que debió presentarlo. ¿Qué consecuencia prevé la ley?","a":"Se aplica la sanción prevista para el caso de omisión del Aviso","o":["Se tiene por no presentado, sin multa si se presenta otro corregido","Se sanciona con la revocación inmediata de su registro en el padrón","Se sanciona como Aviso extemporáneo, porque finalmente se presentó","Se aplica la sanción prevista para el caso de omisión del Aviso"],"x":"El art. 53, fr. III: si la extemporaneidad excede los 30 días siguientes a la fecha en que debió presentarse, se aplica la sanción prevista para el caso de omisión. Presentarlo tarde no lo mantiene como extemporáneo después de ese plazo.","ref":"Art. 53, fr. III, segundo párrafo · H8"},{"id":"G062","tema":"h8","tipo":"caso","q":"Una institución de crédito incumple sus obligaciones de reporte del art. 15. ¿Quién la sanciona?","a":"El órgano desconcentrado de la SHCP facultado para supervisarla","o":["La SHCP directamente, con las multas del art. 54 de la LFPIORPI","La Unidad de la Fiscalía, al tratarse de una Entidad Financiera","El órgano desconcentrado de la SHCP facultado para supervisarla","El Tribunal Federal de Justicia Administrativa, a petición de la SHCP"],"x":"El art. 52, segundo párrafo, exceptúa de la regla general a las Entidades Financieras: sus violaciones al art. 15 las sanciona el órgano desconcentrado facultado para supervisarlas (para un banco, la CNBV). La SHCP sanciona con el art. 54 a quienes realizan las AV del art. 17.","ref":"Art. 52, segundo párrafo · H8"},{"id":"G063","tema":"h8","tipo":"caso","q":"Una casa de bolsa incumple las medidas de identificación de clientes del art. 15. ¿Conforme a qué procedimiento y con qué sanciones se le castiga?","a":"Con el procedimiento y las sanciones de la ley especial que la regula","o":["Con el procedimiento y los tres rangos de multa del art. 54 de la LFPIORPI","Con el procedimiento y las sanciones de la ley especial que la regula","Con el procedimiento de su ley especial, pero con las multas del art. 54","Con el procedimiento de la LFPIORPI, pero con las multas de su ley especial"],"x":"El art. 52, segundo párrafo: la imposición se hará conforme al procedimiento de las leyes especiales de cada Entidad Financiera, «con las sanciones expresamente indicadas en dichas Leyes». Ni el procedimiento ni las multas salen del art. 54.","ref":"Art. 52, segundo párrafo · H8"},{"id":"G064","tema":"h8","tipo":"caso","q":"Una agencia aduanal ya obtuvo una vez que la SHCP se abstuviera de sancionarla. Ahora regulariza otra falta de manera espontánea, antes de la verificación, y la reconoce expresamente dentro del plazo inicial del procedimiento. ¿Qué prevé la ley?","a":"La SHCP reducirá hasta en un 50 % el monto de las multas","o":["La SHCP reducirá hasta en un 50 % el monto de las multas","La SHCP volverá a abstenerse de sancionar, sin límite de veces","La SHCP impondrá la multa máxima por tratarse de reincidencia","La SHCP reducirá la multa en un 25 % fijo por la regularización"],"x":"El art. 55 da la abstención total por única ocasión; si el beneficio ya se ejerció, el segundo párrafo (nuevo 2025) prevé una reducción de hasta el 50 % de las multas, con regularización espontánea previa y reconocimiento expreso de la falta.","ref":"Art. 55, segundo párrafo · H8"},{"id":"G065","tema":"h8","tipo":"memoria","q":"¿Qué medida permite a la SHCP el art. 54 Bis, adicionado en 2025?","a":"Determinar que se suspendan temporalmente operaciones con ciertos clientes","o":["Revocar de inmediato el registro en el padrón sin procedimiento alguno","Determinar que se suspendan temporalmente operaciones con ciertos clientes","Congelar las cuentas bancarias de los clientes de alto riesgo sin orden judicial","Clausurar de forma definitiva el establecimiento de quien realiza la AV"],"x":"El art. 54 Bis permite a la SHCP determinar, conforme a los mecanismos de las reglas de carácter general, que quienes realizan AV suspendan de manera temporal actos u operaciones con determinadas personas Clientes o Usuarias, en tanto se subsane o resuelva el procedimiento.","ref":"Art. 54 Bis · H8"},{"id":"G066","tema":"h8","tipo":"caso","q":"Un cliente entrega a una inmobiliaria un comprobante de domicilio falso, sabiendo que se incorporará al Aviso. ¿Qué pena de prisión prevé la LFPIORPI?","a":"De 2 a 8 años de prisión","o":["De 2 a 8 años de prisión","De 5 a 15 años de prisión","De 4 a 10 años de prisión","De 1 a 5 años de prisión"],"x":"El art. 62, fr. I, sanciona con prisión de dos a ocho años y 500 a 2 000 días multa a quien proporcione información falsa a quienes deban dar Avisos. Los 4 a 10 años del art. 63 son para el uso indebido por servidores públicos o la revelación de un Aviso.","ref":"Art. 62, fr. I · H8"},{"id":"G067","tema":"h8","tipo":"caso","q":"Sin autorización, una empleada de una joyería le revela a un cliente que la joyería presentó un Aviso sobre él. ¿Qué pena de prisión prevé la LFPIORPI?","a":"De 4 a 10 años de prisión","o":["De 4 a 10 años de prisión","De 1 a 5 años de prisión","De 6 a 12 años de prisión","De 2 a 8 años de prisión"],"x":"El art. 63, fr. II, sanciona con cuatro a diez años a quien, sin autorización, revele o divulgue información que vincule a una persona con un Aviso, «independientemente de que el Aviso exista o no». Los 2 a 8 años son del art. 62 (información falsa, alterada o ilegible).","ref":"Art. 63, fr. II · H8"},{"id":"G068","tema":"h8","tipo":"caso","q":"Hasta hace un año, una persona fue servidora pública encargada de investigar delitos. Hoy, como particular, proporciona información falsa para incorporarla a un Aviso. ¿Qué efecto tiene su antecedente?","a":"Las penas del art. 62 se duplican","o":["Las penas del art. 62 aumentan en una mitad","Sólo se le aplica la inhabilitación, sin prisión","No tiene efecto, porque ya no es servidora pública","Las penas del art. 62 se duplican"],"x":"El art. 64 duplica las penas de los arts. 62 y 63, fr. II, si quien comete el ilícito es o fue, dentro de los dos años anteriores, servidor público encargado de prevenir, detectar, investigar o juzgar delitos. Además, se aplica inhabilitación por un tiempo igual al de la prisión.","ref":"Art. 64, primer párrafo · H8"},{"id":"G069","tema":"h8","tipo":"caso","q":"Un taller contrata el blindaje de una camioneta por 3 400 veces el valor diario de la UMA al día del pago, y el cliente quiere liquidarlo con billetes en moneda nacional. ¿Qué dispone la ley?","a":"Está prohibido, porque el blindaje de vehículos tiene límite de 3 210 veces el valor diario de la UMA","o":["Está permitido, porque el límite de efectivo para servicios de blindaje es de 8 025 veces el valor diario de la UMA","Está permitido, porque el art. 32 sólo prohíbe el efectivo en la compraventa del vehículo, no en servicios sobre él","Está prohibido, porque el blindaje de vehículos tiene límite de 3 210 veces el valor diario de la UMA","Está prohibido sólo si el cliente liquida en divisas, porque el pago en moneda nacional no está restringido"],"x":"El art. 32, fr. V, prohíbe pagar en efectivo la prestación de servicios de blindaje de vehículos o inmuebles por un valor igual o superior a 3 210 veces el valor diario de la UMA, y la prohibición abarca moneda nacional y divisas. El 8 025 es el umbral de la fr. I (derechos reales sobre inmuebles), no el del blindaje.","ref":"Art. 32, fr. V · H8"},{"id":"G070","tema":"h8","tipo":"caso","q":"Una persona arrienda un local comercial con renta de 4 000 veces el valor diario de la UMA mensuales y quiere pagar cada mensualidad con billetes. ¿Qué dispone la ley?","a":"Está prohibido, porque el uso o goce tiene límite de 3 210 veces el valor diario de la UMA mensuales","o":["Está prohibido, porque el uso o goce tiene límite de 3 210 veces el valor diario de la UMA mensuales","Está permitido, porque, al tratarse de un inmueble, el límite de efectivo es de 8 025 veces el valor diario de la UMA","Está permitido, porque el art. 32 sólo alcanza la constitución o transmisión de derechos reales sobre inmuebles","Está prohibido sólo si la suma de las rentas del año iguala o supera 8 025 veces el valor diario de la UMA"],"x":"El art. 32, fr. VII, prohíbe el efectivo en la constitución de derechos personales de uso o goce de los bienes de las fr. I, II y V por un valor igual o superior a 3 210 veces el valor diario de la UMA mensuales. Aunque el bien sea inmueble, el 8 025 de la fr. I rige para derechos reales, no para el arrendamiento.","ref":"Art. 32, fr. VII · H8"},{"id":"G071","tema":"h8","tipo":"trampa","q":"¿Qué prevé el último párrafo del art. 32 de la LFPIORPI respecto de los bienes fungibles?","a":"Que la SHCP podrá determinar, mediante reglas de carácter general, los casos en que la prohibición también les aplique, según su grado de riesgo","o":["Que la SHCP debe extender la prohibición a todos los bienes fungibles, sin distinguir el grado de riesgo que representen","Que la SHCP podrá determinar, mediante reglas de carácter general, los casos en que la prohibición también les aplique, según su grado de riesgo","Que la prohibición ya les aplica por ley, desde un valor igual o superior a 3 210 veces el valor diario de la UMA, sin necesidad de reglas","Que la SHCP podrá eximirlos de la prohibición, mediante oficio individual, cuando el pago se realice por conducto del sistema financiero de forma documentada"],"x":"El último párrafo del art. 32 dice que la Secretaría, mediante reglas de carácter general, «podrá» determinar los casos y condiciones en que la prohibición también aplique a bienes fungibles, de acuerdo con su grado de riesgo. Es una facultad, no una obligación ni una prohibición ya vigente por ley.","ref":"Art. 32, último párrafo · H8"},{"id":"G072","tema":"h8","tipo":"caso","q":"Un notario formaliza la compraventa de un inmueble de 9 500 veces el valor diario de la UMA. Respecto del pago, ¿qué le exige el art. 33?","a":"Identificar en el instrumento la forma en que se pagan las obligaciones que derivan del acto","o":["Asentar la declaración bajo protesta de decir verdad de las partes, que basta en cualquier compraventa","Identificar la forma de pago sólo cuando alguna de las partes declare haber pagado una parte en efectivo","Limitarse a presentar el Aviso de la operación ante la SHCP, sin revisar la forma en que se pagó","Identificar en el instrumento la forma en que se pagan las obligaciones que derivan del acto"],"x":"El art. 33, primer párrafo, obliga a las personas depositarias de Fe Pública a identificar la forma de pago cuando la operación tenga un valor igual o superior a 8 025 veces el valor diario de la UMA, sin condicionarlo a que alguien declare efectivo. La declaración bajo protesta sólo basta por debajo de ese valor y con pago previo a la firma (segundo párrafo).","ref":"Art. 33, primer párrafo · H8"},{"id":"G073","tema":"h8","tipo":"caso","q":"Ante notario se formaliza la compraventa de un inmueble de 5 000 veces el valor diario de la UMA, que el comprador pagó en parte antes de la firma. ¿Qué dispone el art. 33 sobre la acreditación de ese pago?","a":"Basta la declaración que bajo protesta de decir verdad hagan las personas Clientes o Usuarias","o":["El notario debe identificar la forma de pago, como en toda compraventa de inmuebles ante fedatario","Basta la declaración que bajo protesta de decir verdad hagan las personas Clientes o Usuarias","El instrumento no puede firmarse, porque el pago debe hacerse en el acto y ante el notario","Debe anexarse el comprobante bancario de cada pago, o el notario debe negarse a formalizar el acto"],"x":"El art. 33, segundo párrafo: si el valor es inferior a 8 025 veces el valor diario de la UMA y el acto fue total o parcialmente pagado antes de la firma, basta la declaración bajo protesta de decir verdad de las personas Clientes o Usuarias. La identificación de la forma de pago por el fedatario se exige desde 8 025 (primer párrafo).","ref":"Art. 33, segundo párrafo · H8"},{"id":"G074","tema":"h8","tipo":"caso","q":"Una joyería vende un collar de 3 500 veces el valor diario de la UMA, pagado por transferencia, sin intervención de fedatario público. Conforme al art. 33, ¿cómo debe formalizarse la operación?","a":"Con factura u otro documento que especifique la forma de pago y anexe el comprobante","o":["Con la declaración bajo protesta de decir verdad del comprador sobre el origen de los recursos","Ante fedatario público, que identifique la forma de pago y la haga constar en un instrumento","Con factura u otro documento que especifique la forma de pago y anexe el comprobante","Con el Aviso a la SHCP, que sustituye la factura cuando el pago se hace por transferencia"],"x":"El art. 33, tercer párrafo: los demás actos de las fr. II a VII del art. 32 se formalizan con certificados, facturas, garantías u otro documento, previa identificación de quienes los realizan y, en su caso, del Beneficiario Controlador, y en ellos se especifica la forma de pago y se anexa el comprobante. La declaración bajo protesta es la vía del segundo párrafo, para actos ante fedatario con pago previo.","ref":"Art. 33, tercer párrafo · H8"},{"id":"G075","tema":"h8","tipo":"caso","q":"Un comerciante de vehículos acepta billetes como pago de un camión de 5 000 veces el valor diario de la UMA. ¿Con qué multa puede sancionarlo la SHCP?","a":"De 10 000 a 65 000 veces el valor diario de la UMA, o del 10 al 100 % del valor del acto, la que resulte mayor","o":["De 10 000 a 65 000 veces el valor diario de la UMA, o del 10 al 100 % del valor del acto, la que resulte mayor","De 2 000 a 10 000 veces el valor diario de la UMA, por incumplir las disposiciones sobre uso de efectivo del Capítulo IV","De 200 a 2 000 veces el valor diario de la UMA, por tratarse de un incumplimiento en la forma de liquidar la operación","De 10 000 a 65 000 veces el valor diario de la UMA, o del 10 al 100 % del valor del acto, la que resulte menor de ambas"],"x":"Participar en un acto prohibido por el art. 32 es la conducta del art. 53, fr. VII, que el art. 54, fr. III, sanciona con 10 000 a 65 000 veces el valor diario de la UMA o del 10 al 100 % del valor del acto cuando sea cuantificable en dinero, la que resulte mayor. El rango de 2 000 a 10 000 (art. 54, fr. II) corresponde al incumplimiento del art. 33 (art. 53, fr. V), no a la operación prohibida.","ref":"Art. 53, fr. VII, y art. 54, fr. III · H8"}],"sitio":{"nombre":"Módulo 2","integrador":"simulacro","integrador_texto":"Simulacro mixto","integrador_href":"m2-simulacro/index.html","etiqueta_n":"H","orden_resultados":"temario","paginas":[{"n":"1","carpeta":"m2-h1-objetivo-kyc","pregunta":"2.1.1–2.1.2 · Objetivo y política de identificación y conocimiento","estado":"integrada"},{"n":"2","carpeta":"m2-h2-reportes-dolares-sistemas","pregunta":"2.1.3–2.1.5 · Reportes, dólares en efectivo y sistemas automatizados","estado":"integrada"},{"n":"3","carpeta":"m2-h3-otras-obligaciones-lpb","pregunta":"2.1.6–2.1.8 · Otras obligaciones, intercambio de información y LPB","estado":"integrada"},{"n":"4","carpeta":"m2-h4-ccc-oficial","pregunta":"2.1.9–2.1.10 · Comité de Comunicación y Control y oficial de cumplimiento","estado":"integrada"},{"n":"5","carpeta":"m2-h5-novedosos-cambios-itf","pregunta":"2.1.11–2.1.14 · Modelos novedosos, centros cambiarios, transmisores e ITF","estado":"integrada"},{"n":"6","carpeta":"m2-h6-sanciones-pr-plazos","pregunta":"2.1.15–2.1.17 · Sanciones, propietario real y plazos","estado":"integrada"},{"n":"7","carpeta":"m2-h7-tipologias","pregunta":"2.1 · Tipologías UIF y de organismos internacionales","estado":"integrada"},{"n":"8","carpeta":"m2-h8-lfpiorpi","pregunta":"2.2.1–2.2.2 · LFPIORPI: actividades vulnerables y uso de efectivo","estado":"integrada"}],"raiz":"../","actual":"m2-simulacro"}}

<script>
(function(){
const D = JSON.parse(document.getElementById("datos").textContent);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// «Por qué no las otras»: q.d = {texto de opción incorrecta: razón}; opts = opciones en el orden en que se muestran
const tuHTML=(q,txt)=>(txt&&txt!==q.a&&q.d&&q.d[txt])?`<div class="tu"><b>Por qué tu respuesta está mal</b>${esc(q.d[txt])}</div>`:"";
const distHTML=(q,opts)=>{ if(!q.d) return ""; const it=opts.map((o,k)=>q.d[o]?`<li><b>${"ABCD"[k]}</b> ${esc(q.d[o])}</li>`:"").join(""); return it?`<div class="dist"><div class="lbl">Por qué no las otras</div><ul>${it}</ul></div>`:""; };
const RUTA = D.meta.ruta||"financiero";
const ACENTOS = {financiero:["morado","turquesa"], av:["turquesa","coral"], transversal:["morado","coral"], gratuito:["morado","turquesa"]}[RUTA]||["morado","turquesa"];
const COLORES = ["c-principal","c-"+ACENTOS[0],"c-"+ACENTOS[1],"c-negro"];
const colorDe = (v,i)=>v?("c-"+v):COLORES[i%4];
document.documentElement.setAttribute("data-ruta", RUTA);
const RUTAS = {financiero:"Ruta Sector financiero", av:"Ruta Actividades vulnerables", transversal:"Transversales", gratuito:"Gratuitos"};

/* ---------- encabezado, portada, trampas, pie ---------- */
$("#brand").innerHTML = `<b>360EDUCA</b><span>${esc(D.meta.modulo||"")}</span><span class="ruta">${esc(RUTAS[D.meta.ruta||"financiero"])}</span>`;
$("#nav").innerHTML = D.secciones.filter(s=>s.nav).map(s=>`<a href="#${s.id}"${s.tipo==="simulador"?' class="cta"':""}>${esc(s.nav)}</a>`).join("");
/* ---------- modo sitio: franja de páginas (opcional) ---------- */
if(D.sitio && Array.isArray(D.sitio.paginas)){
  const S=D.sitio, raiz=S.raiz||"", act=S.actual||"";
  const ETQ={preparacion:"En preparación", proximamente:"Próximamente"};
  const actual=S.paginas.find(p=>p.carpeta===act);
  $("#sitebar").innerHTML = `<a class="sb-mod" href="${esc(raiz)}index.html"${act?"":' aria-current="page"'}>${esc(S.nombre||"Portada")}</a><span class="sb-sep"></span>`+
    S.paginas.map(p=>{
      const tip=`${S.etiqueta_n!=null?S.etiqueta_n:"Sesión "}${p.n} · ${p.pregunta||""}`;
      if(p.estado && p.estado!=="integrada") return `<span class="sb-p off" title="${esc(tip)} · ${esc(ETQ[p.estado]||p.estado)}" aria-disabled="true">${esc(p.n)}</span>`;
      return `<a class="sb-p" href="${esc(raiz+p.carpeta)}/index.html" title="${esc(tip)}"${p.carpeta===act?' aria-current="page"':""}>${esc(p.n)}</a>`;
    }).join("")+
    (S.integrador?`<span class="sb-sep"></span><a class="sb-p sb-cta" href="${esc(S.integrador_href?raiz+S.integrador_href:raiz+"index.html#"+S.integrador)}">${esc(S.integrador_texto||"Integrador")}</a>`:"")+
    (actual?`<span class="sb-ses">${esc(S.etiqueta_n!=null?S.etiqueta_n:"Sesión ")}${esc(actual.n)} · ${esc(actual.pregunta||"")}</span>`:"");
  $("#sitebar").hidden=false;
}
const mapa0 = D.secciones.find(s=>s.tipo==="mapa");
let rhythm = "";
if(Array.isArray(D.meta.ritmo)){ // ritmo puesto a mano: [{n, lb, q, color}]
  const R0=D.meta.ritmo;
  rhythm = `<div><div class="rhythm${R0.length>4?" many":""}">${R0.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${esc(r.n)}</span><span class="lb">${esc(r.lb||"")}</span><span class="q">${esc(r.q||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${D.meta.ritmo_cap?esc(D.meta.ritmo_cap):`${R0.map(r=>r.n).join(" · ")} = ${R0.reduce((a,r)=>a+(+r.n||0),0)} ${esc(D.meta.unidad||"")}`}</div></div>`;
} else if(mapa0 && D.meta.ritmo!==false){
  const counts = mapa0.ramas.map(r=>r.items.length);
  rhythm = `<div><div class="rhythm${mapa0.ramas.length>4?" many":""}">${mapa0.ramas.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${r.items.length}</span><span class="lb">${esc(r.corto||r.letra)}</span><span class="q">${esc(r.ritmo||r.pregunta||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${counts.join(" · ")} = ${counts.reduce((a,b)=>a+b,0)} ${esc(D.meta.unidad||"")}</div></div>`;
}
$("#hero").innerHTML = `<div><div class="lbl">${esc(D.meta.eyebrow||"")}</div>
  <h1>${esc(D.meta.h1_antes||"")} <mark>${esc(D.meta.h1_resaltado||"")}</mark> ${esc(D.meta.h1_despues||"")}</h1>
  <p>${D.meta.intro||""}</p></div>${rhythm}`;
$("#traps").innerHTML = (D.trampas||[]).map((t,i)=>`<div class="trapc"><span class="tag">Trampa ${D.trampas.length>1?i+1:"de examen"}</span><p><b>${esc(t.titulo)}</b> ${t.texto}</p></div>`).join("");
if(!(D.trampas||[]).length) $("#traps").hidden=true;
$("#pie").innerHTML = `<b>GMC360 · 360Educa</b> — ${D.meta.fuente||""} Material didáctico; los textos están resumidos, consulta la publicación oficial para la redacción íntegra.`;

/* ---------- secciones ---------- */
const head = s=>!s.titulo?"":`<div class="sec-head"><h2>${esc(s.titulo)}</h2>${s.intro?`<p>${s.intro}</p>`:""}</div>${s.para?`<div class="para"><b>Para qué sirve</b>${s.para}</div>`:""}`;
const chant = f=>f?`<div class="chant"><div class="lbl">${esc(f.titulo||"Para recitar en voz alta")}</div><p>${f.html}</p></div>`:"";
const R = {};
let ITEMS = {}; // id -> {item, rama, color}
R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="frac"><button aria-expanded="false" data-ficha="${id}"><span class="rom">${esc(it.etiqueta)}</span><span><span class="nm">${esc(it.nombre)}</span><span class="hookt">${esc([it.verbo,it.gancho].filter(Boolean).join(" · "))}</span></span><span class="cnt">${esc(it.conteo||"")}</span></button><ul class="inc" hidden>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul></li>`}).join("")}</ul>`;
    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};
R.tarjetas = s=>head(s)+`<div class="cards">${s.tarjetas.map((c,i)=>{
  const col = colorDe(c.color,i);
  const top = c.encabezado?`<div class="chead"><div class="t">${esc(c.titulo)}</div>${c.subtitulo?`<div class="a">${esc(c.subtitulo)}</div>`:""}</div>`:(c.barra?`<div class="bar"></div>`:"");
  const body = c.filas? c.filas.map(f=>`<div class="frow"><span class="k">${esc(f.k)}</span>${f.v}</div>`).join("")
    : `<div class="cbody">${c.etiqueta?`<div class="lbl">${esc(c.etiqueta)}</div>`:""}${c.encabezado?"":`<h3>${esc(c.titulo)}</h3>`}${c.ref?`<span class="art">${esc(c.ref)}</span>`:""}${c.html?`<p>${c.html}</p>`:""}${c.lista?`<ul>${c.lista.map(l=>`<li>${l}</li>`).join("")}</ul>`:""}</div>`;
  return `<div class="card ${col}${c.ancho?" wide":""}">${top}${body}</div>`;}).join("")}</div>${s.nota?`<div class="note">${s.nota}</div>`:""}`;
R.escala = s=>{const cols=["var(--principal-linea)","#80bcb5","#a663cc","#ff8361","var(--oscuro)"];

function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}

const tbCell=(s,r,j)=>(s._ix||(s._ix=Object.fromEntries(s.celdas.map(c=>[c.rep+"|"+c.suj,c]))))[r+"|"+j]||{rep:r,suj:j,aplica:false,seguro:false};

function tbMatch(st,c){return (!st.frec||c.frec_tag===st.frec)&&(!st.monto||c.monto_tag===st.monto)&&(!st.plazo||c.plazo_tag===st.plazo);}

    $("#tbn-"+id).textContent=val?`${hits} casillas cumplen el filtro en ${shown} reportes.`:`✓ = su DCG lo prevé · punto = no lo prevé · ? = texto dudoso. Toca una casilla para ver monto, plazo y disposición.`;
  } else {

    s.reportes.forEach(r=>{ if(st.grp.size&&!st.grp.has(r.g)) return; cols.forEach(j=>{const c=tbCell(s,r.k,j.k); if(c.aplica&&tbMatch(st,c)) list.push({r,j,c});}); });

document.addEventListener("click",e=>{

const rnd=n=>Math.floor(Math.random()*n);
const mixA=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function ctNew(id){
  const s=tbSec(id), src=tbSec(s.fuente), g=CT[id], nR=s.filas||4, nC=s.columnas||4;
  const reps=src.reportes.filter(r=>!(s.excluir||[]).includes(r.k));
  const allOn=r=>src.sujetos.every(j=>tbCell(src,r.k,j.k).aplica);
  let R0,C0,M;
  for(let t=0;t<400;t++){
    const cs=mixA(src.sujetos).slice(0,nC), rs=mixA(reps).slice(0,nR);
    if(rs.filter(allOn).length>1) continue;
    if(rs.some(r=>cs.some(j=>tbCell(src,r.k,j.k).seguro===false))) continue;
    const m=rs.map(r=>cs.map(j=>!!tbCell(src,r.k,j.k).aplica));
    const pats=new Set(m.map(x=>x.join()));
    if(pats.size<Math.min(3,nR)) continue;
    if(m.filter(x=>!x.some(Boolean)).length>1) continue;
    R0=rs;C0=cs;M=m;break;
  }
  if(!M){R0=reps.slice(0,nR);C0=src.sujetos.slice(0,nC);M=R0.map(r=>C0.map(j=>!!tbCell(src,r.k,j.k).aplica));}
  Object.assign(g,{src,rows:R0,cols:C0,M,done:false});
  if(g.mode==="llena"){g.mine=M.map(x=>x.map(()=>false)); return ctDrawFill(id);}
  const key=m=>m.map(x=>x.map(Number).join("")).join("|"), seen=new Set([key(M)]), opts=[M];
  let guard=0;
  while(opts.length<4&&guard++<500){
    const d=M.map(x=>x.slice()), k=1+rnd(2);
    for(let q=0;q<k;q++){const r=rnd(nR),c=rnd(nC); d[r][c]=!d[r][c];}
    const kk=key(d); if(!seen.has(kk)){seen.add(kk);opts.push(d);}
  }
  g.opts=mixA(opts.map((m,i)=>({m,ok:i===0})));
  ctDrawPick(id);
}
const ctHead=g=>`<tr><th></th>${g.cols.map(j=>`<th title="${esc(j.t)}">${esc(j.corto||j.k)}</th>`).join("")}</tr>`;
function ctDrawPick(id){
  const g=CT[id];
  $("#ct-"+id).innerHTML=`<div class="ctq">¿Cuál tabla dice correctamente qué reporte presenta cada sujeto?</div><div class="ctgrid">${g.opts.map((o,i)=>`<button class="cttab" data-ctp="${id}:${i}"><div class="tl">Tabla ${"ABCD"[i]}</div><table>${ctHead(g)}${g.rows.map((r,ri)=>`<tr><th class="r">${esc(r.corto||r.t)}</th>${g.cols.map((j,ci)=>`<td class="${o.m[ri][ci]?"on":""}" data-rc="${ri}:${ci}">${o.m[ri][ci]?"✓":""}</td>`).join("")}</tr>`).join("")}</table></button>`).join("")}</div><div id="ctfb-${id}"></div>`;
  ctScore(id);
}
function ctWhy(g,ri,ci){const r=g.rows[ri], j=g.cols[ci], c=tbCell(g.src,r.k,j.k); return `<li><b>${esc(j.t)} · ${esc(r.t)}:</b> ${c.aplica?`<b>sí</b>${c.desde&&c.desde!=="sin monto"?` — ${esc(c.desde)}`:""}${c.cuando?`; ${esc(c.cuando)}`:""}`:"<b>no</b> — su DCG no lo prevé"}${c.ref?` <span class="art">${esc(c.ref)}</span>`:""}</li>`;}
function ctPick(id,i){
  const g=CT[id]; if(g.done) return; g.done=true; const o=g.opts[i]; g.n=(g.n||0)+1; if(o.ok) g.ok=(g.ok||0)+1;
  const tabs=document.querySelectorAll(`#ct-${id} .cttab`);
  g.opts.forEach((x,k)=>{const t=tabs[k]; t.disabled=true; if(x.ok) t.classList.add("ok"); if(k===i) t.classList.add("mine");
    t.querySelectorAll("td[data-rc]").forEach(td=>{const [r,c]=td.dataset.rc.split(":").map(Number); if(x.m[r][c]!==g.M[r][c]) td.classList.add("bad");});});
  const diff=[]; g.M.forEach((row,r)=>row.forEach((v,c)=>{ if(g.opts.some(x=>x.m[r][c]!==v)) diff.push([r,c]); }));
  const mineDiff=diff.filter(([r,c])=>o.m[r][c]!==g.M[r][c]);
  $("#ctfb-"+id).innerHTML=`<div class="ctfb fb">${o.ok?'<span class="ok">Correcto</span>':`<span class="no">Incorrecto</span> La correcta es la <b>tabla ${"ABCD"[g.opts.findIndex(x=>x.ok)]}</b>.`}<div class="lbl" style="margin-top:10px">${o.ok?"Las casillas que cambiaban en las otras":"Lo que fallaba en tu tabla"}</div><ul>${(o.ok?diff:mineDiff).map(([r,c])=>ctWhy(g,r,c)).join("")}</ul><div class="qactions"><button class="btn" data-ctnew="${id}">Otra</button></div></div>`;
  ctScore(id);
}
function ctDrawFill(id){
  const g=CT[id];
  $("#ct-"+id).innerHTML=`<div class="ctq">Marca qué reporte presenta cada sujeto y califica.</div><div class="cttab ctfill" style="cursor:default;max-width:640px"><table>${ctHead(g)}${g.rows.map((r,ri)=>`<tr><th class="r">${esc(r.corto||r.t)}</th>${g.cols.map((j,ci)=>`<td><button data-ctt="${id}:${ri}:${ci}" aria-label="${esc(r.t)} · ${esc(j.t)}"></button></td>`).join("")}</tr>`).join("")}</table></div><div class="qactions" style="margin-top:12px"><button class="btn" data-ctchk="${id}">Calificar</button><button class="btn ghost" data-ctnew="${id}">Otra tabla</button></div><div id="ctfb-${id}"></div>`;
