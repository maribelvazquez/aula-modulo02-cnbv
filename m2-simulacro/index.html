con operaciones lícitas","Trata y lenocinio","Estructura corporativa simula operaciones"],"x":"Negocio real en frontera, contrapartes en la Lista de Personas Bloqueadas y dispersión a jóvenes de estrato bajo con esquema de ruta de dinero son Compañía con operaciones lícitas (UIF 2016). Trata y lenocinio (2021) comparte la Lista de Personas Bloqueadas, el mismo domicilio fiscal y la mezcla en un giro comercial, pero su origen es la explotación sexual y no trae el esquema de ruta de dinero.","ref":"Tipología UIF 2016 · Compañía con operaciones lícitas · H7"},{"id":"H049","tema":"h7","tipo":"caso","q":"Al revisar el expediente de una empresa que ordena muchas transferencias pequeñas a distintos beneficiarios fuera del país, el oficial nota que el acta constitutiva tiene fechas ilógicas. En la visita al domicilio se confirma que la empresa no existe físicamente. ¿Qué tipología describe mejor el caso?","a":"Uso de identidad","o":["Uso de identidad","Estructura corporativa simula operaciones","Transferencias a beneficiarios comunes","Cuenta personal para actividad empresarial"],"x":"Documentos falsos, empresa inexistente y muchas transferencias pequeñas a muchos beneficiarios en el extranjero son Uso de identidad (UIF 2009). Transferencias a beneficiarios comunes (2009) es el patrón inverso: muchos ordenantes envían a un mismo beneficiario.","ref":"Tipología UIF 2009 · Uso de identidad · H7"},{"id":"H050","tema":"h7","tipo":"caso","q":"Lavadores de dinero extranjeros reclutan a mexicanos con relaciones en el sector financiero, que acuden a las instituciones con documentos de sociedades cuyas actas resultan falsas; la visita domiciliaria confirma que las empresas no existen y desde ellas se ordenan transferencias al extranjero. ¿Qué tipología describe mejor el caso?","a":"Uso de identidad","o":["Uso de identidad","Cajeros automáticos (skimming)","Estructura corporativa simula operaciones","Transferencias a beneficiarios comunes"],"x":"Lavadores extranjeros que, con cómplices locales, crean empresas inexistentes con documentos falsos describen Uso de identidad (UIF 2009). En Cajeros automáticos (skimming) (2021) también hay una banda extranjera, pero su método es clonar tarjetas en zonas turísticas.","ref":"Tipología UIF 2009 · Uso de identidad · H7"},{"id":"H051","tema":"h7","tipo":"cifra","q":"¿En qué año publicó la UIF la tipología Uso de identidad?","a":"2009","o":["2021","2018","2009","2016"],"x":"Uso de identidad es del informe UIF 2009, junto con Ruta de dinero, Cajas de seguridad, Cuenta personal y Beneficiarios comunes.","ref":"Tipología UIF 2009 · Uso de identidad · H7"},{"id":"H052","tema":"h7","tipo":"caso","q":"Una sucursal en una ciudad fronteriza detecta varias cuentas de reciente apertura cuyos titulares, algunos menores de 25 años, no están inscritos ante el SAT. Las cuentas reciben depósitos en efectivo fraccionados y, casi de inmediato, se envían transferencias a empresas en el extranjero. ¿Qué tipología describe mejor el caso?","a":"Uso de personas jóvenes para enviar dinero","o":["Ruta de dinero","Transferencias a beneficiarios comunes","Cuenta personal para actividad empresarial","Uso de personas jóvenes para enviar dinero"],"x":"Menores de 25 años sin actividad fiscal, cuentas de recién apertura con alta operatividad y envío rápido al extranjero son Uso de personas jóvenes para enviar dinero (UIF 2016). En Ruta de dinero (2009) los titulares son de bajo perfil y retiran los fondos al mismo tiempo, no los transfieren al extranjero.","ref":"Tipología UIF 2016 · Uso de personas jóvenes para enviar dinero · H7"},{"id":"H053","tema":"h7","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Uso de personas jóvenes para enviar dinero?","a":"La edad de los sujetos no es acorde a los montos manejados","o":["Múltiples firmantes sin relación aparente con el titular","Múltiples ordenantes enviando fondos a un mismo beneficiario","La edad de los sujetos no es acorde a los montos manejados","Retiro simultáneo de los recursos sin permanencia en la cuenta"],"x":"Que la edad no corresponda a los montos es señal de Uso de personas jóvenes (UIF 2016). El retiro simultáneo es de Ruta de dinero, los múltiples ordenantes de Beneficiarios comunes y los múltiples firmantes de Cuenta personal (todas de 2009).","ref":"Tipología UIF 2016 · Uso de personas jóvenes para enviar dinero · H7"},{"id":"H054","tema":"h7","tipo":"trampa","q":"Varias tipologías mencionan personas jóvenes. ¿Qué combinación es propia de Uso de personas jóvenes para enviar dinero?","a":"Menores de 25 años sin actividad fiscal, en cuentas de recién apertura con alta operatividad","o":["Jóvenes como representantes legales de varias empresas que venden en preventa de contado","Menores de 25 años sin actividad fiscal, en cuentas de recién apertura con alta operatividad","Empleados jóvenes de bajo perfil como accionistas de empresas con sede en oficina virtual","Personas jóvenes que operan montos elevados y compran criptomonedas en plataforma no registrada"],"x":"Sólo en Uso de personas jóvenes (UIF 2016) los jóvenes son el producto: menores de 25, sin actividad fiscal y con cuentas nuevas muy operadas. Los jóvenes representantes son de Bienes raíces (2016), los accionistas jóvenes de Estructura corporativa (2016) y los jóvenes con cripto de Activos virtuales (2022).","ref":"Tipología UIF 2016 · Uso de personas jóvenes para enviar dinero · H7"},{"id":"H055","tema":"h7","tipo":"caso","q":"Un cliente menor de 25 años abrió su cuenta recientemente, no está inscrito ante el SAT y ya recibe depósitos en efectivo fraccionados desde distintas zonas del país, que después se relacionan con el narcotráfico. Poco después de cada depósito transfiere los recursos a empresas en el extranjero sin relación con su actividad. ¿Qué tipología describe mejor el caso?","a":"Uso de personas jóvenes para enviar dinero","o":["Uso ilícito de activos virtuales","Cuenta personal para actividad empresarial","Ruta de dinero","Uso de personas jóvenes para enviar dinero"],"x":"Un joven sin registro fiscal, con cuenta de recién apertura que recibe efectivo ilícito y lo transfiere rápido al extranjero, encaja en Uso de personas jóvenes para enviar dinero (UIF 2016). En Cuenta personal para actividad empresarial (2009) la cuenta recibe fondos de empresas, no depósitos en efectivo para reenviar.","ref":"Tipología UIF 2016 · Uso de personas jóvenes para enviar dinero · H7"},{"id":"H056","tema":"h7","tipo":"caso","q":"En una ciudad de la frontera norte, una persona cambia dólares en efectivo por pesos y los deposita en cuentas de varias personas de bajo perfil que viven en el interior del país. Poco después, todos los titulares retiran los fondos de manera simultánea y coordinada. ¿Qué tipología describe mejor el caso?","a":"Ruta de dinero","o":["Compañía con operaciones lícitas","Uso de personas jóvenes para enviar dinero","Transferencias a beneficiarios comunes","Ruta de dinero"],"x":"Dólares cambiados en la frontera, depósitos en muchas cuentas de bajo perfil del interior y retiro simultáneo son Ruta de dinero (UIF 2009). Compañía con operaciones lícitas (2016) también ocurre en zona fronteriza, pero es un negocio real que mezcla fondos.","ref":"Tipología UIF 2009 · Ruta de dinero · H7"},{"id":"H057","tema":"h7","tipo":"caso","q":"Varias cuentas de personas con ingresos bajos, en ciudades del centro del país, reciben depósitos en efectivo hechos en sucursales de la frontera. Los recursos no permanecen: los titulares los retiran casi al mismo tiempo en distintas sucursales. ¿Qué tipología describe mejor el caso?","a":"Ruta de dinero","o":["Asociación altruista ¿apoya a migrantes?","Ruta de dinero","Uso de personas jóvenes para enviar dinero","Cuenta personal para actividad empresarial"],"x":"Depósitos en la frontera a cuentas del interior y retiro simultáneo sin permanencia son el rasgo de Ruta de dinero (UIF 2009). Asociación altruista (2020) también reenvía rápido, pero se trata de una OSFL con un testaferro de edad avanzada.","ref":"Tipología UIF 2009 · Ruta de dinero · H7"},{"id":"H058","tema":"h7","tipo":"trampa","q":"Ruta de dinero y Transferencias a beneficiarios comunes son de 2009. ¿Qué rasgo es propio de Ruta de dinero?","a":"Depósitos en la frontera a cuentas del interior y retiro simultáneo sin permanencia","o":["Consolidación de fondos para comprar activos de alto valor, como aeronaves","Centros cambiarios que ordenan transferencias al extranjero por cuenta de terceros","Muchos ordenantes que envían fondos a un mismo beneficiario ubicado en el extranjero","Depósitos en la frontera a cuentas del interior y retiro simultáneo sin permanencia"],"x":"Ruta de dinero (UIF 2009) se reconoce por el retiro simultáneo y coordinado de lo depositado en la frontera. Muchos ordenantes a un beneficiario, los centros cambiarios y las aeronaves son de Transferencias a beneficiarios comunes (2009).","ref":"Tipología UIF 2009 · Ruta de dinero · H7"},{"id":"H059","tema":"h7","tipo":"cifra","q":"¿Cuál de estas tipologías es del informe 2009 de la UIF?","a":"Ruta de dinero","o":["Ruta de dinero","Cajeros automáticos (skimming)","Uso de personas jóvenes para enviar dinero","Fraudes informáticos"],"x":"Ruta de dinero es de 2009. Uso de personas jóvenes es de 2016, Fraudes informáticos de 2018 y Cajeros automáticos (skimming) de 2021.","ref":"Tipología UIF 2009 · Ruta de dinero · H7"},{"id":"H060","tema":"h7","tipo":"caso","q":"Un funcionario público ligado al narcotráfico contrata en su banco un producto para resguardar objetos físicos, aunque su perfil no justifica ese servicio. Acude con mucha frecuencia y se sospecha que guarda efectivo y joyas para no dejar rastro en el sistema financiero. ¿Qué tipología describe mejor el caso?","a":"Uso de cajas de seguridad","o":["Corrupción ex servidor público","Uso de cajas de seguridad","Cuenta personal para actividad empresarial","Uso de personas jóvenes para enviar dinero"],"x":"Resguardar efectivo y joyas fuera del sistema, con accesos frecuentes y un perfil que no justifica el servicio, es Uso de cajas de seguridad (UIF 2009). Corrupción ex servidor público (2020) también involucra a un funcionario, pero lava con empresas fachada, excontratistas y paraísos fiscales.","ref":"Tipología UIF 2009 · Uso de cajas de seguridad · H7"},{"id":"H061","tema":"h7","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Uso de cajas de seguridad?","a":"Titular que es servidor público de áreas de seguridad","o":["Titular que es servidor público de áreas de seguridad","Cuenta «personal» que recibe fondos de empresas","Depósitos en efectivo en la frontera a cuentas del interior del país","Incongruencia entre declaraciones patrimoniales y gastos"],"x":"Que el titular sea un servidor público de áreas de seguridad es señal de Uso de cajas de seguridad (UIF 2009), junto con la alta frecuencia de acceso y un perfil que no justifica el servicio. La cuenta personal que recibe fondos de empresas es de Cuenta personal para actividad empresarial (2009), los depósitos en la frontera de Ruta de dinero (2009) y la incongruencia patrimonial de Corrupción ex servidor público (2020).","ref":"Tipología UIF 2009 · Uso de cajas de seguridad · H7"},{"id":"H062","tema":"h7","tipo":"cifra","q":"¿En qué año publicó la UIF la tipología Uso de cajas de seguridad?","a":"2009","o":["2022","2016","2018","2009"],"x":"Uso de cajas de seguridad es del informe UIF 2009, el año con más tipologías del bloque de productos bancarios.","ref":"Tipología UIF 2009 · Uso de cajas de seguridad · H7"},{"id":"H063","tema":"h7","tipo":"caso","q":"Una persona física que contrató su cuenta para uso personal recibe depósitos frecuentes y de alto monto de varias sociedades mercantiles. Su producto de depósito tiene varios firmantes sin relación aparente con ella y los montos superan por mucho su perfil transaccional. ¿Qué tipología describe mejor el caso?","a":"Cuenta personal para actividad empresarial","o":["Transferencias a beneficiarios comunes","Cuenta personal para actividad empresarial","Uso de personas jóvenes para enviar dinero","Estructura corporativa simula operaciones"],"x":"Una cuenta de persona física que recibe fondos de sociedades, con firmantes sin relación con la titular, es Cuenta personal para actividad empresarial (UIF 2009). En Uso de personas jóvenes (2016) el titular es menor de 25 y recibe efectivo para enviarlo al extranjero.","ref":"Tipología UIF 2009 · Cuenta personal para actividad empresarial · H7"},{"id":"H064","tema":"h7","tipo":"caso","q":"Una institución financiera abrió la cuenta de una persona física que declaró destinarla a gastos personales. Al revisar el contrato y los registros de la cuenta, su analista la contrasta con la tipología Cuenta personal para actividad empresarial (UIF 2009). ¿Qué hallazgo sería señal de alerta de esa tipología?","a":"Recursos que provienen de empresas en una cuenta contratada para uso personal","o":["Depósitos en efectivo en la frontera a cuentas del interior del país","Recursos que provienen de empresas en una cuenta contratada para uso personal","Alta frecuencia de acceso a la caja de seguridad del cliente","Centros cambiarios ordenando transferencias al extranjero"],"x":"Que en una cuenta contratada para uso personal entren recursos de empresas, cuyo origen puede ser una actividad empresarial, es el primer indicador de Cuenta personal para actividad empresarial (UIF 2009). El otro indicador es que los recursos rebasen el perfil transaccional declarado al abrir la cuenta. En el caso, además, había varios firmantes que aparecían como beneficiarios y se presentaban como «amigos». La alta frecuencia de acceso a una caja de seguridad es indicador de Cajas de seguridad, los depósitos en la frontera a cuentas del interior son de Ruta de dinero y los centros cambiarios que ordenan transferencias al extranjero son de Beneficiarios comunes (todas de 2009).","ref":"Tipología UIF 2009 · Cuenta personal para actividad empresarial · H7"},{"id":"H065","tema":"h7","tipo":"caso","q":"Una empleada contrata una cuenta para uso personal; en ella aparecen varios firmantes que dicen ser sus amigos y que no tienen relación aparente con ella. La cuenta recibe recursos de varias sociedades que pertenecen a una red de lavado al servicio de narcotraficantes, en realidad operaciones comerciales que se hacen pasar por movimientos de una persona física. ¿Qué tipología describe mejor el caso?","a":"Cuenta personal para actividad empresarial","o":["Uso de identidad","Cuenta personal para actividad empresarial","Uso de personas jóvenes para enviar dinero","Uso de cajas de seguridad"],"x":"Hacer pasar operaciones comerciales ligadas al narco como movimientos de una persona física es Cuenta personal para actividad empresarial (UIF 2009). Uso de identidad (2009) también oculta al verdadero operador, pero con empresas inexistentes creadas con documentos falsos.","ref":"Tipología UIF 2009 · Cuenta personal para actividad empresarial · H7"},{"id":"H066","tema":"h7","tipo":"trampa","q":"¿Cuál es la diferencia clave entre Cuenta personal para actividad empresarial y Uso de personas jóvenes para enviar dinero?","a":"En la primera, la cuenta de una persona física recibe fondos de empresas; en la segunda, jóvenes sin actividad fiscal reciben efectivo y lo envían al extranjero","o":["En la primera, la cuenta de una persona física recibe fondos de empresas; en la segunda, jóvenes sin actividad fiscal reciben efectivo y lo envían al extranjero","En la primera, la empresa titular no existe físicamente y sus actas tienen fechas ilógicas; en la segunda, los jóvenes son accionistas de empresas fachada con oficinas virtuales","En la primera, los titulares retiran todo al mismo tiempo en varias sucursales; en la segunda, muchos ordenantes jóvenes envían fondos a un mismo beneficiario","En la primera, el titular resguarda efectivo y joyas fuera del sistema financiero; en la segunda, jóvenes representan a varias empresas que venden en preventa"],"x":"Cuenta personal (UIF 2009) camufla actividad de empresas en la cuenta de una persona física; Uso de personas jóvenes (2016) recluta menores de 25 sin actividad fiscal para mover efectivo al extranjero. Los distractores mezclan rasgos de Ruta de dinero, Beneficiarios comunes, Uso de identidad, Cajas de seguridad y Bienes raíces.","ref":"Tipología UIF 2009 · Cuenta personal para actividad empresarial · H7"},{"id":"H067","tema":"h7","tipo":"caso","q":"Varias personas de bajo perfil, sin relación con el destinatario, depositan dólares en efectivo y piden, en distintas instituciones y casas de cambio, transferencias al extranjero. Todas van al mismo beneficiario: el vendedor de aeronaves que adquieren integrantes de organizaciones delictivas. ¿Qué tipología describe mejor el caso?","a":"Transferencias a beneficiarios comunes","o":["Uso de identidad","Transferencias a beneficiarios comunes","Uso de personas jóvenes para enviar dinero","Ruta de dinero"],"x":"Muchos ordenantes sin relación con un mismo beneficiario en el extranjero (el vendedor o un broker de las aeronaves) es Transferencias a beneficiarios comunes (UIF 2009). Uso de identidad (2009) es al revés: una empresa inexistente envía transferencias pequeñas a muchos beneficiarios.","ref":"Tipología UIF 2009 · Transferencias a beneficiarios comunes · H7"},{"id":"H068","tema":"h7","tipo":"caso","q":"Una institución financiera revisa transferencias al extranjero para pagar la compra de aeronaves, contratadas en distintas instituciones y liquidadas con depósitos en efectivo. Su analista las contrasta con la tipología Transferencias a beneficiarios comunes (UIF 2009). ¿Qué hallazgo sobre estas transferencias sería señal de alerta de esa tipología?","a":"Múltiples ordenantes enviando fondos a un mismo beneficiario","o":["Sujetos que no registran actividad fiscal pese a su alta operatividad","Múltiples ordenantes enviando fondos a un mismo beneficiario","Retiro simultáneo de los recursos sin permanencia en las cuentas","Múltiples transferencias pequeñas a múltiples beneficiarios en el extranjero"],"x":"Que varios ordenantes, cuya actividad no tiene relación con el beneficiario, envíen fondos a un mismo beneficiario (beneficiarios comunes con otros clientes con la misma operativa) es señal de Transferencias a beneficiarios comunes (UIF 2009). Las múltiples transferencias pequeñas a muchos beneficiarios en el extranjero parecen defendibles porque también son envíos al exterior, pero son de Uso de identidad (2009) y describen dispersión, no convergencia en un solo destinatario. El retiro simultáneo es de Ruta de dinero (2009) y la falta de actividad fiscal, de Uso de personas jóvenes (2016).","ref":"Tipología UIF 2009 · Transferencias a beneficiarios comunes · H7"},{"id":"H069","tema":"h7","tipo":"trampa","q":"Uso de identidad y Transferencias a beneficiarios comunes (ambas de 2009) implican envíos al extranjero. ¿Qué patrón corresponde a Transferencias a beneficiarios comunes?","a":"Muchos ordenantes → un solo beneficiario, para consolidar fondos y comprar activos de alto valor","o":["Una empresa inexistente → muchos beneficiarios en el extranjero, con transferencias pequeñas y frecuentes","Jóvenes sin actividad fiscal → envíos rápidos al extranjero del efectivo que reciben en cuentas nuevas","Muchos ordenantes → un solo beneficiario, para consolidar fondos y comprar activos de alto valor","Depósitos en muchas cuentas de bajo perfil → retiro simultáneo y coordinado de los recursos"],"x":"Transferencias a beneficiarios comunes (UIF 2009) concentra: muchos envían a uno, que compra activos como aeronaves. Uso de identidad (2009) dispersa desde una empresa inexistente; los otros patrones son Ruta de dinero (2009) y Uso de personas jóvenes (2016).","ref":"Tipología UIF 2009 · Transferencias a beneficiarios comunes · H7"},{"id":"H070","tema":"h7","tipo":"caso","q":"Personas de bajo perfil y sin relación entre sí acuden a distintas sucursales a depositar efectivo y ordenar envíos al extranjero. Al revisar los datos, el oficial ve que todas tienen el mismo destinatario, un intermediario que tramita la compra de aeronaves. ¿Qué tipología describe mejor el caso?","a":"Transferencias a beneficiarios comunes","o":["Cuenta personal para actividad empresarial","Asociación altruista ¿apoya a migrantes?","Ruta de dinero","Transferencias a beneficiarios comunes"],"x":"La convergencia de muchos ordenantes en un solo beneficiario en el extranjero es Transferencias a beneficiarios comunes (UIF 2009). En Ruta de dinero (2009) también hay cuentas de bajo perfil, pero los fondos se retiran en efectivo de forma simultánea, no se envían a un beneficiario.","ref":"Tipología UIF 2009 · Transferencias a beneficiarios comunes · H7"},{"id":"H071","tema":"h7","tipo":"caso","q":"Varios usuarios denuncian una aplicación móvil que les dio préstamos rápidos con intereses exorbitantes. Al retrasarse, reciben amenazas y la app escribe a sus contactos y difunde sus fotos personales para presionarlos. La empresa se presenta como entidad financiera sin tener autorización. ¿Qué tipología describe mejor el caso?","a":"Montadeudas","o":["Fraudes informáticos","Uso ilícito de activos virtuales","Cajeros automáticos (skimming)","Montadeudas"],"x":"Apps de préstamo con intereses exorbitantes, extorsión con contactos y fotos, y una empresa que se ostenta como entidad financiera sin autorización son Montadeudas (UIF 2023). Fraudes informáticos (2018) también usa tecnología, pero desvía pagos con correos hackeados y facturas falsas.","ref":"Tipología UIF 2023 · Montadeudas · H7"},{"id":"H072","tema":"h7","tipo":"caso","q":"Una institución financiera analiza a varias empresas de reciente constitución que otorgan préstamos y cobran intereses mediante cuentas abiertas en distintas instituciones. Su analista compara el comportamiento de esas cuentas con la tipología Montadeudas (UIF 2023). ¿Qué hallazgo sobre el flujo de fondos sería señal de alerta de esa tipología?","a":"Rápido movimiento de fondos vía SPEI a través de FINTECH","o":["Compra de activos virtuales en plataformas no registradas ante el SAT","Incongruencia entre el beneficiario indicado y el titular real de la cuenta","Concentración de retiros en cajeros de zonas turísticas","Rápido movimiento de fondos vía SPEI a través de FINTECH"],"x":"El rápido movimiento de fondos vía SPEI desde los bancos hacia una FINTECH, que dispersa los préstamos y capta los intereses, es señal de Montadeudas (UIF 2023); en la tipología se alcanzaron 600 millones de pesos en un mes. Los cajeros de zonas turísticas son de Skimming (2021), el beneficiario que no coincide con el titular de Fraudes informáticos (2018) y las plataformas no registradas de Activos virtuales (2022); ninguno describe el flujo de un préstamo digital, aunque el beneficiario incongruente podría parecer tentador por tratarse de transferencias.","ref":"Tipología UIF 2023 · Montadeudas · H7"},{"id":"H073","tema":"h7","tipo":"cifra","q":"De las 26 tipologías del temario, ¿cuál es la única del informe 2023 de la UIF?","a":"Montadeudas","o":["Trata y lenocinio","Montadeudas","Uso ilícito de activos virtuales","Personas Políticamente Expuestas (PEPs)"],"x":"Montadeudas es la única tipología del informe 2023. Uso ilícito de activos virtuales y PEPs son de 2022, y Trata y lenocinio es de 2021.","ref":"Tipología UIF 2023 · Montadeudas · H7"},{"id":"H074","tema":"h7","tipo":"caso","q":"Una empresa cliente de una FINTECH recibe muchos pagos pequeños de personas físicas y los mueve de inmediato vía SPEI. En redes sociales se anuncia como otorgante de créditos, aunque no tiene autorización, y hay quejas por cobranza con amenazas. ¿Qué tipología describe mejor el caso?","a":"Montadeudas","o":["Cuenta personal para actividad empresarial","Montadeudas","Fraudes informáticos","Uso ilícito de activos virtuales"],"x":"Ostentarse como entidad financiera sin autorización, cobranza ilegal con amenazas y SPEI rápidos a través de FINTECH son Montadeudas (UIF 2023). En Fraudes informáticos (2018) el dinero también sale rápido, pero proviene de pagos desviados con facturas falsas.","ref":"Tipología UIF 2023 · Montadeudas · H7"},{"id":"H075","tema":"h7","tipo":"caso","q":"Integrantes de una misma familia reciben depósitos en efectivo en sucursales de zonas de riesgo por narcotráfico, triangulan los recursos entre sí y los usan para comprar criptomonedas en una plataforma que no está registrada ante el SAT; también envían y reciben transferencias desde y hacia el extranjero. Varios de ellos son jóvenes que operan montos elevados. ¿Qué tipología describe mejor el caso?","a":"Uso ilícito de activos virtuales","o":["Trata y lenocinio","Uso ilícito de activos virtuales","Trata de personas","Montadeudas"],"x":"Efectivo del narco convertido en criptomonedas en una plataforma no registrada, por un grupo familiar, es Uso ilícito de activos virtuales (UIF 2022). Trata de personas (2019) también usa criptomonedas y red familiar, pero su origen es la explotación sexual de mujeres extranjeras.","ref":"Tipología UIF 2022 · Uso ilícito de activos virtuales · H7"},{"id":"H076","tema":"h7","tipo":"caso","q":"Un banco detecta que integrantes de una familia hacen depósitos en efectivo y, acto seguido, transfieren los fondos a una plataforma de criptomonedas para comprar activos virtuales. ¿Qué hallazgo adicional confirmaría una señal de alerta de la tipología que corresponde?","a":"Que la plataforma de activos virtuales no esté registrada ante el SAT","o":["Que el beneficiario de la factura no coincida con el titular","Que la plataforma de activos virtuales no esté registrada ante el SAT","Que las víctimas denuncien amenazas de cobranza ilegal","Que los retiros se concentren en cajeros de zonas turísticas"],"x":"En Uso ilícito de activos virtuales (UIF 2022) la señal clave es comprar en plataformas no registradas ante el SAT. La cobranza ilegal es de Montadeudas (2023), los cajeros turísticos de Skimming (2021) y el beneficiario que no coincide de Fraudes informáticos (2018).","ref":"Tipología UIF 2022 · Uso ilícito de activos virtuales · H7"},{"id":"H077","tema":"h7","tipo":"trampa","q":"Trata de personas (2019) y Uso ilícito de activos virtuales (2022) mencionan criptomonedas y operación familiar. Si el efectivo proviene del narcotráfico y se convierte en una plataforma no registrada ante el SAT, ¿de cuál tipología se trata?","a":"Uso ilícito de activos virtuales","o":["Trata de personas","Uso de personas jóvenes para enviar dinero","Uso ilícito de activos virtuales","Cajeros automáticos (skimming)"],"x":"Efectivo del narcotráfico convertido en criptomonedas en una plataforma no registrada es Uso ilícito de activos virtuales (UIF 2022). En Trata de personas (2019) las criptomonedas lavan ganancias de la explotación sexual de mujeres extranjeras captadas con un sitio web.","ref":"Tipología UIF 2022 · Uso ilícito de activos virtuales · H7"},{"id":"H078","tema":"h7","tipo":"caso","q":"El área de monitoreo detecta que muchos retiros con tarjetas de distintos clientes se concentran en terminales de retiro de efectivo de un destino turístico. Los fondos terminan en cuentas de extranjeros de la misma nacionalidad, que después compran relojes y vehículos de lujo. ¿Qué tipología describe mejor el caso?","a":"Cajeros automáticos (skimming)","o":["Fraudes informáticos","Cajeros automáticos (skimming)","Uso de identidad","Montadeudas"],"x":"Retiros concentrados en zonas turísticas y beneficiarios extranjeros de la misma nacionalidad son Cajeros automáticos (skimming) (UIF 2021). Uso de identidad (2009) también involucra extranjeros, pero su método son empresas inexistentes con documentos falsos.","ref":"Tipología UIF 2021 · Cajeros automáticos (skimming) · H7"},{"id":"H079","tema":"h7","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Cajeros automáticos (skimming)?","a":"Beneficiarios extranjeros de la misma nacionalidad","o":["Uso de amenazas y de cobranza extrajudicial ilegal","Personas identificadas en fuentes externas en redes de trata","Cuentas abiertas en sucursales lejanas al domicilio del titular","Beneficiarios extranjeros de la misma nacionalidad"],"x":"Que los beneficiarios sean extranjeros de la misma nacionalidad es señal de Cajeros automáticos (skimming) (UIF 2021). Las cuentas en sucursales lejanas son de Fraudes informáticos (2018), las amenazas de Montadeudas (2023) y las redes de trata de Trata de personas (2019).","ref":"Tipología UIF 2021 · Cajeros automáticos (skimming) · H7"},{"id":"H080","tema":"h7","tipo":"caso","q":"Clientes de un banco que vacacionaron en un destino turístico reportan retiros que no reconocen. Se descubre que una banda extranjera instaló en las terminales de retiro dispositivos que copian los datos de las tarjetas, y que el dinero se lava con inversiones inmobiliarias. ¿Qué tipología describe mejor el caso?","a":"Cajeros automáticos (skimming)","o":["Cajeros automáticos (skimming)","Montadeudas","Fraudes informáticos","Bienes raíces con dinero ilícito"],"x":"Clonar tarjetas con dispositivos en terminales de zonas turísticas y lavar con inmuebles es Cajeros automáticos (skimming) (UIF 2021). Bienes raíces con dinero ilícito (2016) también termina en inmuebles, pero se trata de una desarrolladora con preventas de contado, sin clonación de tarjetas.","ref":"Tipología UIF 2021 · Cajeros automáticos (skimming) · H7"},{"id":"H081","tema":"h7","tipo":"caso","q":"Un proveedor habitual aparentemente envía por correo a su cliente una factura con nuevos datos bancarios. El cliente paga, pero la cuenta destino pertenece a un tercero distinto del proveedor, fue abierta en una sucursal lejana al domicilio de su titular y los recursos se retiran de inmediato. ¿Qué tipología describe mejor el caso?","a":"Fraudes informáticos","o":["Fraudes informáticos","Cuenta personal para actividad empresarial","Montadeudas","Cajeros automáticos (skimming)"],"x":"Correos hackeados que envían facturas falsas y desvían pagos a cuentas cuyo titular no coincide con el beneficiario son Fraudes informáticos (UIF 2018). Cajeros automáticos (skimming) (2021) también es fraude tecnológico, pero clona tarjetas en cajeros de zonas turísticas.","ref":"Tipología UIF 2018 · Fraudes informáticos · H7"},{"id":"H082","tema":"h7","tipo":"caso","q":"Una empresa extranjera informa que pagó una factura por servicios a una cuenta en México tras recibir un correo cuyo dominio difería ligeramente del de su proveedor real. La institución que recibió los fondos revisa la cuenta con la tipología Fraudes informáticos (UIF 2018). ¿Qué hallazgo al verificar los datos del pago sería señal de alerta de esa tipología?","a":"Incongruencia entre el beneficiario indicado y el titular real de la cuenta","o":["Concentración de retiros en cajeros ubicados en zonas turísticas del país","Compra de activos virtuales en plataformas no registradas ante el SAT","Incongruencia entre el beneficiario indicado y el titular real de la cuenta","Empresas que se ostentan como entidad financiera sin contar con autorización"],"x":"Que el nombre del beneficiario proporcionado por el defraudador no coincida con el titular real de la cuenta es señal de Fraudes informáticos (UIF 2018), pues las cuentas están a nombre de personas distintas al proveedor real. Ostentarse como entidad financiera sin autorización es de Montadeudas (2023) y, aunque también es una irregularidad, no se relaciona con un pago inducido por un correo falso. Los cajeros turísticos son de Skimming (2021) y las plataformas no registradas de Activos virtuales (2022).","ref":"Tipología UIF 2018 · Fraudes informáticos · H7"},{"id":"H083","tema":"h7","tipo":"cifra","q":"¿Cuál es la única tipología del informe 2018 de la UIF?","a":"Fraudes informáticos","o":["Montadeudas","Cajeros automáticos (skimming)","Uso de identidad","Fraudes informáticos"],"x":"Fraudes informáticos es el único caso del informe UIF 2018. Cajeros automáticos (skimming) es de 2021, Montadeudas de 2023 y Uso de identidad de 2009.","ref":"Tipología UIF 2018 · Fraudes informáticos · H7"},{"id":"H084","tema":"h7","tipo":"caso","q":"Una red integrada en su mayoría por familiares contacta a mujeres sudamericanas con falsas ofertas de trabajo como modelos. Ya en México les quitan sus documentos y las obligan a prostituirse mediante un sitio web de acompañamiento que funciona como fachada; las ganancias se lavan con empresas fantasma y criptomonedas. ¿Qué tipología describe mejor el caso?","a":"Trata de personas","o":["Trata y lenocinio","Uso ilícito de activos virtuales","Trata de personas","Cajeros automáticos (skimming)"],"x":"Víctimas extranjeras engañadas con ofertas de modelaje, un sitio web fachada y lavado con empresas fantasma y criptomonedas son Trata de personas (UIF 2019). En Trata y lenocinio (2021) la red también es mayormente familiar, pero otros integrantes mezclan el efectivo en un giro comercial legítimo.","ref":"Tipología UIF 2019 · Trata de personas · H7"},{"id":"H085","tema":"h7","tipo":"trampa","q":"Trata de personas (2019) frente a Trata y lenocinio (2021): ¿qué rasgo es propio de la tipología de 2019?","a":"Víctimas extranjeras engañadas con ofertas de modelaje y explotadas mediante un sitio web fachada; lavado con empresas fantasma y criptomonedas","o":["Los recursos se transfieren a paraísos fiscales","Disposición de efectivo por montos inusuales y una integrante de la red en la Lista de Personas Bloqueadas","Víctimas extranjeras engañadas con ofertas de modelaje y explotadas mediante un sitio web fachada; lavado con empresas fantasma y criptomonedas","Otros miembros de la familia mezclan el efectivo ilícito con los ingresos de sus negocios legítimos"],"x":"Trata de personas (UIF 2019) se reconoce por las víctimas extranjeras engañadas con ofertas de modelaje, el sitio web fachada y las criptomonedas. La mezcla en un giro comercial, los paraísos fiscales, la disposición inusual de efectivo y la integrante en la Lista de Personas Bloqueadas son de Trata y lenocinio (2021). La compra de inmuebles y los domicilios comunes aparecen en las dos.","ref":"Tipología UIF 2019 · Trata de personas · H7"},{"id":"H086","tema":"h7","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Trata de personas (informe 2019)?","a":"Personas físicas identificadas en fuentes externas en redes de trata","o":["Recepción de recursos de personas incluidas en la Lista de Personas Bloqueadas","Concentración de retiros en cajeros de zonas turísticas del país","Personas físicas identificadas en fuentes externas en redes de trata","Compra de activos virtuales en plataformas no registradas ante el SAT"],"x":"Que fuentes externas identifiquen a las personas en una red internacional de trata es señal de Trata de personas (UIF 2019). Recibir recursos de personas en la Lista de Personas Bloqueadas es señal de Trata y lenocinio (2021), los cajeros turísticos de Cajeros automáticos (2021) y las plataformas no registradas de Activos virtuales (2022).","ref":"Tipología UIF 2019 · Trata de personas · H7"},{"id":"H087","tema":"h7","tipo":"caso","q":"Un cliente compra inmuebles y vehículos de lujo sin un origen claro de recursos, y sus operaciones no corresponden a la actividad que declaró. Fuentes externas lo ubican en una red internacional de trata que trae a mujeres sudamericanas con falsas ofertas de modelaje. ¿Qué tipología describe mejor el caso?","a":"Trata de personas","o":["Uso ilícito de activos virtuales","Trata y lenocinio","Trata de personas","Cajeros automáticos (skimming)"],"x":"La captación de mujeres extranjeras con falsas ofertas de modelaje y la compra de bienes de lujo sin origen claro apuntan a Trata de personas (UIF 2019). Trata y lenocinio (2021) no menciona víctimas extranjeras captadas con ofertas de modelaje; su rasgo es la mezcla en negocios legítimos de la familia.","ref":"Tipología UIF 2019 · Trata de personas · H7"},{"id":"H088","tema":"h7","tipo":"caso","q":"Una red mayormente familiar somete a mujeres a explotación sexual en hoteles de varias entidades. Otros integrantes de la red manejan negocios legítimos donde mezclan el efectivo ilícito con los ingresos; luego compran inmuebles y transfieren recursos a paraísos fiscales. ¿Qué tipología describe mejor el caso?","a":"Trata y lenocinio","o":["Trata y lenocinio","Compañía con operaciones lícitas","Trata de personas","Uso ilícito de activos virtuales"],"x":"Explotación sexual por una red familiar cuyos parientes mezclan el efectivo en negocios legítimos y lavan con bienes raíces y paraísos fiscales es Trata y lenocinio (UIF 2021). Trata de personas (2019) se distingue por víctimas extranjeras, un sitio web de modelaje y criptomonedas.","ref":"Tipología UIF 2021 · Trata y lenocinio · H7"},{"id":"H089","tema":"h7","tipo":"caso","q":"Una institución financiera analiza una red formada en su mayoría por parientes. Uno de sus integrantes entabla relaciones sentimentales con mujeres y niñas, las convence de mudarse a otras entidades del país y ahí las obliga a prostituirse en hoteles; él no tiene cuentas bancarias ni información fiscal. Otros parientes usan un giro comercial para mezclar el efectivo del delito con recursos lícitos, y varios integrantes registran disposición de efectivo por montos inusuales y gastos que sobrepasan su nivel transaccional. ¿Qué tipología describe mejor el caso?","a":"Trata y lenocinio","o":["Trata de personas","Uso ilícito de activos virtuales","Compañía con operaciones lícitas","Trata y lenocinio"],"x":"Una red familiar en la que un integrante seduce a mujeres y niñas, las lleva a otras entidades y las explota sexualmente en hoteles sin tener cuentas a su nombre, mientras otros integrantes mezclan el efectivo en un giro comercial y muestran disposición de efectivo inusual y gastos por encima de su nivel transaccional, es Trata y lenocinio (UIF 2021). Trata de personas (2019) es el distractor más tentador porque también es una red principalmente familiar, pero allí las víctimas son mujeres extranjeras atraídas con ofertas de modelaje y anunciadas en un sitio web fachada, y el dinero se lava con empresas fantasma y criptomonedas. Compañía con operaciones lícitas (2016) también mezcla recursos en un giro lícito, pero no hay explotación sexual: introduce el dinero en la frontera y lo retira mediante ruta de dinero. Uso ilícito de activos virtuales (2022) lava efectivo comprando activos virtuales.","ref":"Tipología UIF 2021 · Trata y lenocinio · H7"},{"id":"H090","tema":"h7","tipo":"trampa","q":"¿Qué pregunta te ayuda a distinguir Trata y lenocinio (2021) de Trata de personas (2019)?","a":"¿Otros miembros de la familia mezclan el efectivo en negocios legítimos?","o":["¿La red criminal que explota a las víctimas está formada principalmente por familiares?","¿Las víctimas son mujeres sometidas a explotación sexual?","¿El dinero termina en la compra de inmuebles de alto valor?","¿Otros miembros de la familia mezclan el efectivo en negocios legítimos?"],"x":"La mezcla del efectivo en negocios legítimos de la familia es el rasgo de Trata y lenocinio (UIF 2021). Red familiar, explotación sexual de mujeres y compra de inmuebles aparecen en las dos tipologías, así que no sirven para distinguirlas.","ref":"Tipología UIF 2021 · Trata y lenocinio · H7"},{"id":"H091","tema":"h7","tipo":"caso","q":"En un caso de explotación sexual a cargo de una red familiar, varios parientes tienen negocios establecidos donde se deposita el efectivo. ¿Qué señal de alerta de esta tipología esperaría encontrar el oficial?","a":"Operaciones entre personas que presentan un mismo domicilio fiscal","o":["Beneficiarios extranjeros de la misma nacionalidad","Operaciones entre personas que presentan un mismo domicilio fiscal","Uso de una persona de edad muy avanzada como testaferro","Compra de activos virtuales en plataformas de intercambio no registradas ante el SAT"],"x":"El caso describe Trata y lenocinio (UIF 2021), cuyas señales incluyen operaciones entre personas con el mismo domicilio fiscal, disposición inusual de efectivo y gastos superiores a lo declarado. Las otras opciones son de Skimming (2021), Activos virtuales (2022) y Asociación altruista (2020).","ref":"Tipología UIF 2021 · Trata y lenocinio · H7"},{"id":"H092","tema":"h7","tipo":"caso","q":"Un cliente paga 1 millón de euros en efectivo por dos pólizas de seguro de vida y las cancela poco después, aceptando perder cerca de 40 % de lo invertido. ¿Qué señal de alerta ilustra el caso?","a":"Cancelación anticipada sin motivo aparente, aceptando el costo económico tras un pago grande en efectivo","o":["Cancelación anticipada sin motivo aparente, aceptando el costo económico tras un pago grande en efectivo","Pago de primas por una tercera persona sin relación clara con el asegurado, como posible figura pantalla en la operación","Cambio reiterado e inexplicable del beneficiario de la póliza contratada","Aseguramiento de bienes valiosos incongruente con el perfil económico del cliente"],"x":"El caso 2 de seguros (cancelación anticipada de pólizas) muestra que no es razonable cancelar sin motivo aparente una póliza asumiendo pérdidas; apunta al indicador de despreocupación por cargos adicionales o costos de cancelación anticipada. El texto, a propósito del caso 5, añade que la vulnerabilidad se relaciona con el periodo mínimo de vigencia (cooling-off period) tras el cual se puede pedir reembolso.","ref":"Tipologías GAFI 2022 (temario), seguros, caso 2 e indicadores 1.3.2 · H7"},{"id":"H093","tema":"h7","tipo":"caso","q":"Un agente de seguros recibe de su cliente un cheque de caja por un seguro de vida de 80 mil dólares. El cliente le confesó que el dinero venía del tráfico de drogas y le pagó una comisión generosa; tres meses después, el agente ejecuta la operación a sabiendas. ¿Qué vulnerabilidad del sector asegurador ilustra el caso?","a":"Complicidad de empleados, agentes o intermediarios","o":["Productos financieros sofisticados ofrecidos por aseguradoras","Operaciones internacionales con reaseguro off-shore","Creación de aseguradoras con capital simulado","Complicidad de empleados, agentes o intermediarios"],"x":"El caso 6 de seguros (Canadá) ilustra la complicidad del intermediario: el agente conoce el origen ilícito, recibe comisión generosa y ejecuta la operación. El texto también incluye entre los indicadores los cargos o comisiones inusualmente altos de intermediarios, o que el cliente acepte una comisión mayor a la normal.","ref":"Tipologías GAFI 2022 (temario), seguros, caso 6 · H7"},{"id":"H094","tema":"h7","tipo":"caso","q":"Una aseguradora extranjera recibe, por numerosas pólizas de vida que gestiona un agente, una sola transferencia «en bloque» a nombre del agente, procedente de terceros por medio de casas de cambio; después el agente detalla qué monto corresponde a cada póliza. Algunas pólizas se pagan con cheques de terceros y órdenes de pago estructuradas. ¿Qué indicador relacionado con las primas ilustra el caso?","a":"Pago de primas por terceras personas y desde múltiples fuentes","o":["Cambio de beneficiarios, sobre todo si es reiterado o inexplicable","Pago de primas por terceras personas y desde múltiples fuentes","Excesivo interés por conocer las opciones de cancelación o redención anticipada","Aseguramiento de bienes valiosos incongruente con el perfil económico"],"x":"El caso 9 de seguros muestra pagos de terceros, pagos en bloque a nombre del agente, cheques de terceros y órdenes de pago estructuradas, lo que corresponde a los indicadores de primas: pago por terceros (posible figura pantalla) y múltiples fuentes de pago. Los otros tres son indicadores relacionados con el asegurado, no con las primas.","ref":"Tipologías GAFI 2022 (temario), seguros, caso 9 e indicadores 1.3.3 · H7"},{"id":"H095","tema":"h7","tipo":"caso","q":"Una agencia de viajes con servicio de envío de dinero al sureste de Asia mezcla transferencias genuinas con dinero ilícito, que a veces recibe fuera del local para evadir la vigilancia. Registra esos depósitos en libros distintos a los de las transferencias legítimas, los deposita en el banco y transfiere por instrucciones de un ordenante en el extranjero. ¿Qué elementos contribuyeron a probar el lavado?","a":"La contabilidad paralela, el volumen de los depósitos y la incapacidad para explicar el origen de los recursos","o":["Operar con una licencia de transmisor que había sido negada meses antes, pese a la advertencia de la autoridad","La contabilidad paralela, el volumen de los depósitos y la incapacidad para explicar el origen de los recursos","Usar mensajeros que viajaban con paquetes vacacionales y cobraban con variaciones de su nombre","Abrir cuentas de tránsito por residentes de una misma región que transferían de inmediato todo a Asia"],"x":"El caso 7 de remesas dice que el volumen de los depósitos, la inhabilidad para explicar el origen de los recursos y la contabilidad paralela contribuyeron a probar el lavado. Los otros elementos pertenecen a otros casos: la licencia negada (caso 8), los mensajeros con paquetes vacacionales (caso 13) y las cuentas de tránsito (caso 9).","ref":"Tipologías GAFI 2022 (temario), remesas, caso 7 · H7"},{"id":"H096","tema":"h7","tipo":"caso","q":"Traficantes exportan lingotes declarados fraudulentamente como otros bienes; en el país de destino se importan correctamente declarados, y joyeros en colusión los funden y los convierten en cerrojos, tornillos y herramientas que se exportan de regreso, donde vuelven a ser lingotes. ¿Qué hacía atractivo repetir el ciclo?","a":"La ley del país de origen otorgaba créditos por exportar un producto manufacturado, y reutilizar el mismo oro permitía repetirlos","o":["Cada ciclo permitía cobrar la devolución de impuestos por sobrefacturar exportaciones de bienes de consumo","La ley del país de origen otorgaba créditos por exportar un producto manufacturado, y reutilizar el mismo oro permitía repetirlos","La fundición fraccionaba el valor del oro en montos menores al umbral de reporte de cada banco","El oro funcionaba como garantía de un crédito back-to-back concedido por el banco central del país"],"x":"El caso 11 de remesas explica que las leyes de exportación colombianas daban créditos por exportar un producto manufacturado, que ocultar el oro permitía transferir su valor y que reutilizarlo daba créditos adicionales por la misma mercancía. La sobrefacturación y la devolución de impuestos corresponden al caso 5, y el back-to-back, a un caso de Egmont.","ref":"Tipologías GAFI 2022 (temario), remesas, caso 11 · H7"},{"id":"H097","tema":"h7","tipo":"cifra","q":"Según el GAFI, en los casos de lavado recopilados en el sector asegurador (alrededor de 525 millones de dólares), ¿qué proporción involucraba algún tipo de seguro de vida?","a":"65 %","o":["30 %","5 %","65 %","85 %"],"x":"El texto de antecedentes dice que el 65 % de los casos involucraba seguro de vida, el 30 % otras variedades de seguro y el 5 % restante reaseguros. El 85 % no es una cifra de esta distribución. El proyecto evaluó el sector en 58 países y encontró pocos reportes de operaciones inusuales.","ref":"Tipologías GAFI 2022 (temario), seguros, antecedentes · H7"},{"id":"H098","tema":"h7","tipo":"memoria","q":"En los indicadores del sector asegurador, ¿cuál se clasifica como relacionado con las primas?","a":"Pago de primas en exceso seguido de solicitud de reembolso, sobre todo si el excedente se transfiere a otras cuentas, terceros o jurisdicciones","o":["Pago de primas en exceso seguido de solicitud de reembolso, sobre todo si el excedente se transfiere a otras cuentas, terceros o jurisdicciones","Interés excesivo del cliente por conocer las opciones de cancelación o redención anticipada de la póliza, más que por proteger un siniestro","Asegurado que resulta ser pariente o socio de un conocido delincuente, lo que exige reforzar el conocimiento del cliente","Cobro inmediato o inusual de un seguro poco tiempo después de haberlo contratado, con posible siniestro fingido"],"x":"El apartado 1.3.3 (relacionados con las primas) incluye: pago de primas por terceros, múltiples fuentes de pago, pago en exceso seguido de solicitud de reembolso, y usar los servicios de la aseguradora para mover fondos como si fuera una cuenta bancaria. Las otras tres son indicadores relacionados con el asegurado (apartado 1.3.2).","ref":"Tipologías GAFI 2022 (temario), seguros, indicadores 1.3.2 y 1.3.3 · H7"},{"id":"H099","tema":"h7","tipo":"caso","q":"Una persona reporta a su aseguradora el robo de joyería valiosa en su casa. Dice que la recibió como parte del pago por la venta de un barco, pero no tiene otros bienes y sus ingresos de los años previos eran mínimos, por lo que no se explica que fuera dueña del barco. ¿Qué mecanismo de lavado ilustra el caso?","a":"Convertir bienes comprados con recursos ilícitos en dinero legítimo al cobrar una póliza constituida sobre esos bienes","o":["Cancelar anticipadamente una póliza de vida pagada en efectivo, aceptando una pérdida para recuperar los fondos como reembolso","Pagar las primas de pólizas de vida con transferencias de cuentas de terceros, después de una compra inicial hecha en efectivo","Obtener un crédito de un banco extranjero y liquidarlo con pólizas de vida que se ceden al banco al vencer","Convertir bienes comprados con recursos ilícitos en dinero legítimo al cobrar una póliza constituida sobre esos bienes"],"x":"Es el caso 3 de seguros: la estructura criminal transforma recursos ilícitos, ya convertidos en bienes, en dinero legítimo mediante el pago de una póliza constituida sobre ellos. La alerta es que la persona no podía justificar ser dueña del barco ni tenía ingresos congruentes con bienes de ese valor. La cancelación anticipada es lo más tentador, pero aquí no se cancela nada ni se pide reembolso de primas: el dinero limpio sale como indemnización por el siniestro. El pago de primas por terceros corresponde al caso 7 y la cesión de pólizas a un banco, al caso 8.","ref":"Tipologías GAFI 2022 (temario), seguros, caso 3 · H7"},{"id":"H100","tema":"h7","tipo":"caso","q":"Una tienda familiar que atiende a una comunidad migrante opera también como remesadora: acepta remesas genuinas y, además, depósitos de origen ilícito que anota en otro juego de libros. El banco de la tienda emite reportes de operaciones inusuales, pero el esquema sigue funcionando. Según el texto, ¿qué debió llevar al banco a considerar altamente sospechosas esas operaciones?","a":"Que los envíos de la comunidad fueran demasiado altos en volumen y frecuencia frente a lo esperable en esa población","o":["Que la tienda exhibiera en el mostrador una lista con los nombres de sus agentes pagadores asociados en el extranjero","Que el dinero se entregara al receptor final en el país de destino, ya fuera en efectivo o con un cheque","Que los envíos de la comunidad fueran demasiado altos en volumen y frecuencia frente a lo esperable en esa población","Que el negocio se presentara como una empresa familiar que presta servicios a una comunidad de migrantes"],"x":"En el caso 6 de remesas el banco emitió reportes, pero no advirtió que los envíos de la comunidad local eran demasiado altos. El texto concluye que conocer las características de esa comunidad y el volumen y la frecuencia de sus remesas habría mostrado que las operaciones eran altamente sospechosas. Los otros tres elementos son parte de la fachada legítima del negocio, no la señal de alerta. La contabilidad paralela, que también aparece, está en poder del negocio y no a la vista del banco: lo que éste sí podía hacer era contrastar los envíos con el perfil de la clientela atendida.","ref":"Tipologías GAFI 2022 (temario), remesas, caso 6 · H7"},{"id":"H101","tema":"h7","tipo":"caso","q":"Un comerciante que vende tarjetas telefónicas prepagadas, alimentos y boletos de avión ofrece también envíos de dinero a migrantes de un país sudamericano que viven en un país europeo; son su principal ingreso. Los clientes depositan en la cuenta del comerciante en el país europeo y, en el país de origen, familiares suyos entregan moneda local a los beneficiarios. Al principio no se movía dinero entre los dos países. ¿Qué mecanismo permitía esos pagos?","a":"Pagar con fondos que el comerciante tenía en el país de destino, mientras el dinero de los clientes quedaba en su cuenta local","o":["Convertir el efectivo en PIN de tarjetas telefónicas prepagadas y revenderlos en el país de destino para recuperar el dinero en efectivo","Pagar a exportadores que sobrefacturaban sus ventas, de modo que los fondos sirvieran para validar solicitudes de devolución de impuestos","Fundir lingotes de oro y convertirlos en herramientas que se exportaban de regreso para cobrar créditos adicionales por exportación","Pagar con fondos que el comerciante tenía en el país de destino, mientras el dinero de los clientes quedaba en su cuenta local"],"x":"En el caso 3 de remesas el comerciante tenía cuentas y capital en el país de destino y acordó con familiares que entregaran moneda local; los clientes depositaban en su cuenta local, así que al principio no había transferencia real entre países. Al crecer los montos recurrió a mensajeros con paquetes de billetes y a compañías especializadas en transferencias, y pedía fraccionar los envíos por debajo de 3 mil dólares. Los PIN de tarjetas telefónicas (caso 10) tientan porque también mueven valor sin pasar por el sistema financiero del destino, pero ahí el valor viaja como bien de consumo que se revende, no como pago local contra un depósito. La sobrefacturación corresponde al caso 5 y el oro, al caso 11.","ref":"Tipologías GAFI 2022 (temario), remesas, caso 3 · H7"},{"id":"H102","tema":"h7","tipo":"caso","q":"Un banco nota que un mismo grupo de personas cambia en varias sucursales más de veinte cheques en menos de dos semanas, todos de una empresa de remesas, por montos parecidos y debajo del umbral de reporte. Llegan juntos pero van a distintas ventanillas y usan el mismo automóvil. ¿Qué técnica describe el caso?","a":"Fraccionamiento de operaciones bajo el umbral de reporte, la llamada operación hormiga","o":["Transferencias back-to-back entre un agente en el extranjero y cuentas de un banco central","Uso de un casino para justificar el origen del efectivo como ganancias de apuestas","Fraccionamiento de operaciones bajo el umbral de reporte, la llamada operación hormiga","Reactivación de una cuenta inactiva con depósitos desde múltiples cuentas del extranjero"],"x":"En Egmont 13, la UIF habla de «una enorme operación hormiga»: múltiples transacciones debajo del límite, de cantidades parecidas, uso múltiple de servicios de envío de dinero y conducta sospechosa en el banco. El grupo fue acusado de tráfico de drogas y lavado. El back-to-back es de Egmont 1; el casino, de Egmont 4; y la cuenta inactiva, de Egmont 10.","ref":"Tipologías Egmont 2022 (temario), caso 13 · H7"},{"id":"H103","tema":"h7","tipo":"caso","q":"Un empleado de un casino ofrece a un cliente entregarle un cheque girado de la cuenta del casino por el efectivo que deposite, menos una comisión de 9 %, de modo que pueda explicar el dinero como ganancia de apuestas. ¿Qué mecanismo da apariencia de licitud al dinero?","a":"Un cheque del casino que permite presentar el efectivo como ganancia de juego","o":["Un préstamo a cinco años que se paga por adelantado en efectivo y se revende como bien","Una donación recibida por una empresa subsidiada que se transfiere a una constructora","La venta de un inmueble a un precio muy inferior al de mercado y su inmediata reventa","Un cheque del casino que permite presentar el efectivo como ganancia de juego"],"x":"En Egmont 4, un empleado de casino ofrece lavar dinero a un agente encubierto con un cheque del casino por el mismo monto menos comisión (9 %), de modo que el beneficiario pueda justificarlo como ganancia de apuestas. La UIF tenía reportes previos con grandes depósitos en efectivo seguidos pronto de retiros por transferencia.","ref":"Tipologías Egmont 2022 (temario), caso 4 · H7"},{"id":"H104","tema":"h7","tipo":"caso","q":"Una empresa subsidiada por el gobierno recibe una donación y la transfiere a una constructora cuyo presidente también controla otras compañías subcontratadas. El presidente pide al banco cambiar el nombre de dos cuentas de sus compañías por el de las subcontratadas, acreditan 340 mil dólares y luego cancela el cambio; el dinero se retira en efectivo y no hubo obra. ¿Qué indicador destaca?","a":"Cambios rápidos y contradictorios de los nombres o beneficiarios de las cuentas","o":["Reactivación de una cuenta inactiva, con ingresos de varias cuentas personales de otro país","Cambios rápidos y contradictorios de los nombres o beneficiarios de las cuentas","Posición defensiva ante un interrogatorio","Documentos emitidos por una institución financiera desconocida"],"x":"Egmont 24 destaca como indicador los cambios rápidos y contradictorios de nombres o beneficiarios de cuentas: al confundir los nombres, el presidente retiró los 340 mil dólares sin atraer la atención del banco, sin que se hiciera trabajo de construcción. La UIF consideró que la construcción era una operación de lavado.","ref":"Tipologías Egmont 2022 (temario), caso 24 · H7"},{"id":"H105","tema":"h7","tipo":"caso","q":"Un cliente compra un auto deportivo de lujo con un préstamo a cinco años y paga el resto en efectivo. La financiera descubre que ha recibido varios préstamos anteriores por la misma cantidad, todos liquidados por adelantado en efectivo; revendía los autos a particulares y a garajes y depositaba los cheques. ¿Qué señal de alerta destaca el caso?","a":"Pago anticipado de préstamos, liquidados en efectivo","o":["Uso del nombre de una compañía similar a otras ya establecidas","Cambios de último minuto en las instrucciones de movimiento de fondos","Pago anticipado de préstamos, liquidados en efectivo","Promesas de ganancias irracionales sobre inversiones"],"x":"El indicador de Egmont 12 es el pago anticipado de préstamos y la actividad inusual del cliente. El efectivo del narcotráfico entraba al sistema bancario como pago del préstamo y los cheques de la reventa lo mostraban como ingreso legítimo; la organización asumía la pérdida como un costo a cambio de fondos limpios.","ref":"Tipologías Egmont 2022 (temario), caso 12 · H7"},{"id":"H106","tema":"h7","tipo":"memoria","q":"En el caso de Egmont donde un supuesto fax del abogado indica los datos de la cuenta de clientes para que el banco deposite 1.3 millones de dólares y un funcionario verifica por teléfono, ¿qué indicador destaca el texto?","a":"Alteración de último minuto de las instrucciones del movimiento de fondos","o":["Alteración de último minuto de las instrucciones del movimiento de fondos","Reactivación de una cuenta inactiva con ingresos de varias cuentas personales","Uso del nombre de una compañía similar a otras ya establecidas en el mercado","Cobertura de los medios de comunicación sobre las actividades del tenedor de la cuenta"],"x":"En Egmont 6, el promotor pretendía que un banco offshore depositara 1,315,000 dólares con un fax falso; el fraude fracasó porque un funcionario telefoneó al abogado, que no reconoció el fax. El indicador del texto es la alteración de último minuto de las instrucciones del movimiento de fondos; el caso fue un intento frustrado y el promotor no se benefició económicamente.","ref":"Tipologías Egmont 2022 (temario), caso 6 · H7"},{"id":"H107","tema":"h7","tipo":"caso","q":"Una mujer, amenazada junto con su hijo por su pareja, abre varias cuentas en pocas semanas y recibe depósitos de personas que no conoce, entre ellas un individuo de un centro financiero europeo y un abogado del país de origen de la pareja; después es obligada a comprar una casa en un centro turístico. ¿Qué indicadores señala el caso?","a":"Muchas cuentas abiertas en un breve periodo y partes no relacionadas que canalizan fondos a una sola cuenta","o":["Muchas cuentas abiertas en un breve periodo y partes no relacionadas que canalizan fondos a una sola cuenta","Uso de documentos falsos o robados y transferencias internacionales justo debajo del umbral de reporte, estructuradas por varios viajeros","Pago anticipado de préstamos y transferencia de bienes a precios inferiores a los de mercado","Cambios rápidos y contradictorios de nombres de cuentas y retiros en efectivo hacia un tercero"],"x":"Egmont 21 señala actividad atípica de la cuenta, muchas cuentas abiertas en un breve periodo y partes no relacionadas que canalizan fondos a una sola cuenta. La UIF relacionó al sujeto, que usaba alias, con una red de contrabando de resina de cannabis; la mujer no fue acusada por la coerción violenta que sufrió.","ref":"Tipologías Egmont 2022 (temario), caso 21 · H7"},{"id":"H108","tema":"h7","tipo":"trampa","q":"Un representante de una compañía de gran prestigio deposita dos cheques por montos muy altos y ordena transferir el dinero a cuentas en varios países. El banco no indaga el origen de los fondos por la reputación de la empresa y, tras transferir una parte, descubre que los cheques eran falsificados. ¿Qué enseña el caso sobre la reputación del cliente?","a":"No exime de verificar el origen de los fondos cuando hay transferencias atípicas hacia jurisdicciones extranjeras","o":["Que un cheque de monto alto sólo amerita análisis si se cobra en efectivo en ventanilla y no cuando se deposita en una cuenta","Que con un cliente de larga trayectoria basta confirmar la identidad de su representante, sin cuestionar el origen de los fondos","No exime de verificar el origen de los fondos cuando hay transferencias atípicas hacia jurisdicciones extranjeras","Que la falsificación de cheques es un fraude y no lavado, por lo que los bancos receptores no debían suspender ni informar sus operaciones"],"x":"El banco no investigó porque confió en el prestigio de la empresa; sólo después de transferir una parte se supo que los cheques eran falsificados. Las alertas eran la transferencia atípica hacia el extranjero y las transacciones de gran escala, no la reputación, y confiar en ella es la trampa. Además, los bancos que recibieron el dinero en otro país pospusieron 24 horas las órdenes de sus clientes e informaron a su UIF, que congeló los fondos y presentó cargos por sospecha de lavado: un fraude de origen también termina en reporte por lavado.","ref":"Tipologías Egmont 2022 (temario), caso 2 · H7"},{"id":"H109","tema":"h7","tipo":"caso","q":"Una compañía publica anuncios que ofrecen inversiones «garantizadas», libres de impuestos, con rendimiento anual de 13.5 % y la posibilidad de más, respaldadas por títulos sobre diamantes sin cortar. Su director mueve los fondos entre varios bancos y retira efectivo, hasta que la prensa publica críticas. ¿Qué indicador ilustran los anuncios con los que capta inversionistas?","a":"Promesas de ganancias irracionales sobre inversiones","o":["Uso de documentos de identificación falsos o robados para abrir las cuentas del negocio","Pago anticipado de préstamos liquidados en efectivo, con actividad inusual del cliente","Uso múltiple de servicios de envío de dinero por parte de un mismo grupo de personas","Promesas de ganancias irracionales sobre inversiones"],"x":"Egmont 11 lista como indicadores las transacciones a gran escala, las promesas de ganancias irracionales sobre inversiones y la cobertura de los medios sobre las actividades de los tenedores de cuentas. Los anuncios ilustran el segundo: un rendimiento «garantizado» y libre de impuestos que no era real, pues los diamantes valían cerca de 2,300 dólares y no los 12,800 prometidos. Las críticas de la prensa son otro indicador distinto: hablan de la cobertura sobre el cuentahabiente, no de la oferta. Los otros tres pertenecen a otros casos.","ref":"Tipologías Egmont 2022 (temario), caso 11 · H7"},{"id":"H110","tema":"h7","tipo":"caso","q":"Varias personas de un país de Europa oriental abren cuentas en bancos de Europa occidental, a su nombre o de sus empresas, y hacen circular por ellas grandes sumas entre distintos países. La UIF sospecha que los titulares son testaferros de otros. ¿Qué indicadores destacan en el caso?","a":"Falta de razón comercial subyacente y movimientos múltiples y repetitivos de fondos entre cuentas","o":["Falta de razón comercial subyacente y movimientos múltiples y repetitivos de fondos entre cuentas","Alteración de último minuto de las instrucciones de movimiento de fondos y documentos que el supuesto emisor no reconoce","Promesas de ganancias irracionales sobre inversiones y cobertura de los medios sobre el cuentahabiente","Cambios rápidos y contradictorios de los nombres de las cuentas y uso de documentos de identificación falsos"],"x":"Egmont 16 señala la falta de razón comercial subyacente y los movimientos múltiples y repetitivos de fondos entre cuentas: las cuentas servían para circular sumas sin justificación económica, lo que llevó a la UIF a sospechar de testaferros; la policía descubrió además una red de tráfico de automóviles robados. La alteración de último minuto es del caso 6, las promesas de ganancias y la prensa son del caso 11, los cambios de nombres de cuentas son del caso 24 y los documentos falsos, del caso 15.","ref":"Tipologías Egmont 2022 (temario), caso 16 · H7"},{"id":"H111","tema":"h7","tipo":"caso","q":"Los clientes de un traficante de heroína le pagan con transferencias a cuentas de su esposa, su hermana y conocidos, en dos monedas y por montos justo debajo del umbral de reporte. Él retira todo en efectivo o lo dispersa de inmediato; dice ser mecánico y su esposa, ama de casa. Los bancos reportan a la UIF. ¿Qué indicador de la tipología respalda mejor el reporte?","a":"Riqueza irreal comparada con el perfil del cliente","o":["Posición defensiva ante un interrogatorio del personal del banco","Riqueza irreal comparada con el perfil del cliente","Alteración de último minuto de las instrucciones de movimiento de fondos","Uso del nombre de una compañía similar a otras ya establecidas en el mercado"],"x":"Egmont 22 lista como indicadores la transferencia atípica de o hacia una jurisdicción extranjera, el cambio sin explicación del comportamiento de la cuenta y la riqueza irreal frente al perfil del cliente. Los bancos reportaron porque las sumas eran extraordinariamente altas para quienes decían ser mecánico, ama de casa, chofer u oficinista. Los otros tres indicadores pertenecen a otros casos: la posición defensiva es del caso 13, la alteración de último minuto del caso 6 y el nombre de compañía similar, del caso 19.","ref":"Tipologías Egmont 2022 (temario), caso 22 · H7"},{"id":"G001","tema":"h8","tipo":"memoria","q":"Según el art. 2 de la LFPIORPI, ¿qué protege la ley como objeto?","a":"El sistema financiero y la economía nacional","o":["La recaudación fiscal y el padrón de contribuyentes","El secreto bancario y la confidencialidad de los clientes","La libre competencia y el comercio exterior del país","El sistema financiero y la economía nacional"],"x":"El art. 2 dice que el objeto es proteger el sistema financiero y la economía nacional, con medidas para prevenir y detectar operaciones con recursos de procedencia ilícita mediante coordinación interinstitucional. Lo fiscal o el secreto bancario no son el objeto de la ley.","ref":"Art. 2 · H8"},{"id":"G002","tema":"h8","tipo":"caso","q":"Una agencia de autos discute con su asesor cómo debe interpretarse, en el ámbito administrativo, una obligación de la LFPIORPI. ¿Qué autoridad es la competente para aplicar e interpretar la ley en ese ámbito?","a":"La Secretaría de Hacienda y Crédito Público","o":["La Unidad especializada de la Fiscalía General de la República","El Servicio de Administración Tributaria, por ser materia fiscal","La Secretaría de Hacienda y Crédito Público","La Comisión Nacional Bancaria y de Valores, como supervisor"],"x":"El art. 5 hace a la Secretaría (SHCP) la autoridad competente para aplicar e interpretar en lo administrativo la ley, su Reglamento y sus reglas. La Unidad de la Fiscalía analiza e investiga; no interpreta la ley en sede administrativa.","ref":"Art. 5 · H8"},{"id":"G003","tema":"h8","tipo":"caso","q":"Una institución de seguros incumple sus medidas para identificar clientes conforme al art. 15. ¿Qué autoridad supervisa, verifica y vigila ese cumplimiento?","a":"La Comisión Nacional de Seguros y Fianzas","o":["La SHCP directamente, como en las demás actividades vulnerables","La Unidad de la Fiscalía, por tratarse de una Entidad Financiera","La Comisión Nacional de Seguros y Fianzas","La Comisión Nacional Bancaria y de Valores, para todo el sector"],"x":"El art. 16 asigna la supervisión de las Entidades Financieras, según corresponda, a la CNBV, la CNSF o la CONSAR; a una aseguradora le corresponde la CNSF. La SHCP supervisa directamente sólo a quienes realizan las AV fuera de la Sección Primera (art. 22 Bis).","ref":"Art. 16, primer párrafo · H8"},{"id":"G004","tema":"h8","tipo":"cifra","q":"Para efectos del Beneficiario Controlador, en el supuesto de control por derechos de voto, ¿a partir de qué porcentaje del capital social se entiende que una persona o grupo de personas controla a una persona moral?","a":"Más del 25 % del capital social","o":["Más del 25 % del capital social","Más del 50 % del capital social","El 25 % o más del capital social","Más del 10 % del capital social"],"x":"El art. 3, fr. III, inciso b), numeral ii), habla de ejercer el voto respecto de «más del veinticinco por ciento» del capital social. Cuidado: exactamente el 25 % no basta por este supuesto; la ley dice «más de».","ref":"Art. 3, fr. III, inciso b), numeral ii) · H8"},{"id":"G005","tema":"h8","tipo":"caso","q":"Dentro de una carpeta de investigación formalmente iniciada, la Unidad de la Fiscalía necesita información de una institución de crédito. ¿Cómo debe formular el requerimiento?","a":"A través de la Secretaría de Hacienda y Crédito Público","o":["A través de la Secretaría de Hacienda y Crédito Público","Por conducto del juez de control que conozca de la investigación","Directamente a la institución de crédito, por escrito","Por conducto del Banco de México, como administrador de pagos"],"x":"El art. 8, fr. X, permite a la Unidad requerir informes en el marco de una investigación formal, pero «en el caso de las Entidades Financieras» los requerimientos se harán a través de la Secretaría. No va directo al banco ni por conducto de un juez.","ref":"Art. 8, fr. X · H8"},{"id":"G006","tema":"h8","tipo":"caso","q":"La SHCP inicia una visita de verificación a una joyería. ¿Qué operaciones puede abarcar la verificación?","a":"Las realizadas en los 5 años inmediatos anteriores al inicio de la visita","o":["Las realizadas en los 5 años anteriores a la notificación de la orden","Todas las realizadas desde el alta de la joyería en el padrón","Las realizadas en los 10 años inmediatos anteriores al inicio de la visita","Las realizadas en los 5 años inmediatos anteriores al inicio de la visita"],"x":"El art. 36 limita las verificaciones a los actos u operaciones realizados dentro de los cinco años inmediatos anteriores a la fecha de inicio de la visita. Los 10 años son el plazo de conservación del art. 18 IV, no el alcance de la visita.","ref":"Art. 36 · H8"},{"id":"G007","tema":"h8","tipo":"caso","q":"En una investigación, el Ministerio Público de la Federación pretende sostener su caso únicamente con los Avisos que presentó una agencia de vehículos. ¿Qué establece la ley?","a":"Los Avisos no tienen por sí mismos valor probatorio pleno; se requieren pruebas del acto","o":["Los Avisos hacen prueba plena una vez que los ratifica la Representante Encargada","Los Avisos hacen prueba plena si se presentaron en tiempo y con los requisitos del art. 24","Los Avisos sólo pueden usarse como prueba si un juez autoriza previamente su consulta","Los Avisos no tienen por sí mismos valor probatorio pleno; se requieren pruebas del acto"],"x":"El art. 42 dice que los Avisos en ningún caso tendrán, por sí mismos, valor probatorio pleno, y que el MP no podrá sostener su investigación exclusivamente en ellos: debe sustentarse en pruebas que acrediten el acto u operación. Presentarlos en tiempo y forma no cambia su valor probatorio.","ref":"Art. 42 · H8"},{"id":"G008","tema":"h8","tipo":"memoria","q":"¿Cómo considera la ley la identidad de quienes presentan Avisos y de las Representantes Encargadas del Cumplimiento designadas conforme al art. 20?","a":"Confidencial y reservada, en términos de la Ley General de Transparencia","o":["Pública, una vez que concluye la visita de verificación de la SHCP","Confidencial y reservada, en términos de la Ley General de Transparencia","Reservada sólo mientras duran la investigación y el proceso penal federal","Confidencial, salvo que la solicite cualquier autoridad fiscal local"],"x":"El art. 38 considera confidencial y reservada, en términos de la Ley General de Transparencia, la información soporte de los Avisos y la identidad de quien los presenta, de la Representante Encargada del Cumplimiento y del representante de la Entidad Colegiada. No hay apertura al concluir la visita.","ref":"Art. 38 · H8"},{"id":"G009","tema":"h8","tipo":"caso","q":"Un juez cita a la Representante Encargada del Cumplimiento de una inmobiliaria para una diligencia relacionada con sus funciones. Para proteger su identidad, ¿qué prevé la LFPIORPI?","a":"Que la diligencia podrá desahogarla la representante legal o apoderada de la inmobiliaria","o":["Que la diligencia deberá desahogarse por escrito, sin intervención de la inmobiliaria ni de terceros","Que la Representante queda exenta de comparecer ante cualquier autoridad judicial","Que la diligencia podrá desahogarla la representante legal o apoderada de la inmobiliaria","Que la diligencia sólo procede si la SHCP la autoriza previamente"],"x":"El art. 41 Bis (nuevo 2025) permite que esas diligencias sean desahogadas por las personas representantes legales o apoderadas de quien realiza la AV. No es una exención: la diligencia se desahoga, sólo que por otra persona.","ref":"Art. 41 Bis · H8"},{"id":"G010","tema":"h8","tipo":"memoria","q":"Conforme a las definiciones de la ley, ¿qué metales son «Metales Preciosos»?","a":"Oro, plata y platino","o":["Oro y plata únicamente","Oro, plata y paladio","Oro, plata y platino","Oro, platino y rodio"],"x":"El art. 3, fr. IX, define Metales Preciosos como el oro, la plata y el platino; el paladio y el rodio no están en la lista. Las Piedras Preciosas son otra definición (fr. X).","ref":"Art. 3, fr. IX · H8"},{"id":"G011","tema":"h8","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. IX del art. 17?","a":"Blindaje de vehículos terrestres y de bienes inmuebles","o":["Subasta o comercialización habitual de obras de arte","Blindaje de vehículos terrestres y de bienes inmuebles","Comercialización de vehículos aéreos, marítimos o terrestres","Traslado o custodia de dinero o valores de terceros"],"x":"La fr. IX es la prestación habitual o profesional de servicios de blindaje de vehículos terrestres, nuevos o usados, y de bienes inmuebles. El traslado o custodia de valores es la fr. X y la venta de vehículos, la VIII.","ref":"Art. 17, fr. IX · H8"},{"id":"G012","tema":"h8","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. XIII del art. 17?","a":"Recepción de donativos por asociaciones y sociedades sin fines de lucro","o":["Servicios de comercio exterior como agente o agencia aduanal","Constitución de derechos personales de uso o goce de inmuebles","Ofrecimiento habitual de préstamos o créditos por sujetos distintos de las Entidades Financieras","Recepción de donativos por asociaciones y sociedades sin fines de lucro"],"x":"La fr. XIII es la recepción de donativos por parte de Asociaciones y Sociedades sin fines de lucro. El comercio exterior es la XIV y el arrendamiento de inmuebles, la XV.","ref":"Art. 17, fr. XIII · H8"},{"id":"G013","tema":"h8","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. XV del art. 17?","a":"Constitución de derechos personales de uso o goce de inmuebles","o":["Recepción de recursos destinados a un Desarrollo Inmobiliario","Intermediación en la transmisión de la propiedad de inmuebles","Fe pública en la transmisión de derechos reales sobre inmuebles","Constitución de derechos personales de uso o goce de inmuebles"],"x":"La fr. XV es la constitución de derechos personales de uso o goce de bienes inmuebles (en la práctica, el arrendamiento). La intermediación inmobiliaria es la fr. V, el Desarrollo Inmobiliario la V Bis y la fe pública la XII.","ref":"Art. 17, fr. XV · H8"},{"id":"G014","tema":"h8","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. V Bis del art. 17, adicionada en 2025?","a":"Recepción de recursos para un Desarrollo Inmobiliario destinado a venta o renta","o":["Construcción o desarrollo habitual de bienes inmuebles con operaciones de compra o venta","Constitución de derechos personales de uso o goce de bienes inmuebles","Realización de avalúos sobre inmuebles por parte de corredores públicos","Recepción de recursos para un Desarrollo Inmobiliario destinado a venta o renta"],"x":"La fr. V Bis (DOF 16-jul-2025) es la recepción de recursos que se destinen a un Desarrollo Inmobiliario cuya finalidad sea su venta o renta. La construcción o desarrollo con compraventa ya estaba en la fr. V; ambas avisan desde 8 025 veces el valor diario de la UMA.","ref":"Art. 17, fr. V Bis · H8"},{"id":"G015","tema":"h8","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. XVI del art. 17?","a":"Intercambio de activos virtuales por sujetos distintos de las Entidades Financieras","o":["Emisión de tarjetas prepagadas y monederos por sujetos distintos de las Entidades Financieras","Intercambio de activos virtuales por sujetos distintos de las Entidades Financieras","Emisión de cheques de viajero por sujetos distintos de las Entidades Financieras","Traslado o custodia de dinero o valores, salvo cuando interviene el Banco de México"],"x":"La fr. XVI es el ofrecimiento habitual y profesional de intercambio de activos virtuales por sujetos distintos de las Entidades Financieras. Tarjetas y monederos son la fr. II; cheques de viajero, la III; traslado de valores, la X.","ref":"Art. 17, fr. XVI · H8"},{"id":"G016","tema":"h8","tipo":"memoria","q":"¿Qué actividad vulnerable regula la fr. IV del art. 17?","a":"Ofrecimiento de mutuos, garantías, préstamos o créditos por no financieros","o":["Emisión de tarjetas de servicios o de crédito por sujetos no financieros","Ofrecimiento de mutuos, garantías, préstamos o créditos por no financieros","Manejo de cuentas bancarias, de ahorro o de valores de clientes por profesionistas independientes","Otorgamiento ante notario de mutuos con acreedor no financiero"],"x":"La fr. IV es el ofrecimiento habitual o profesional de mutuo, garantía, préstamos o créditos, con o sin garantía, por sujetos distintos de las Entidades Financieras. El mutuo ante notario es la fr. XII, apartado A, inciso e), que es otra actividad: la fe pública.","ref":"Art. 17, fr. IV · H8"},{"id":"G017","tema":"h8","tipo":"caso","q":"Una agencia vende yates y lanchas nuevas de forma habitual. ¿En qué fracción del art. 17 encuadra su actividad?","a":"Fr. VIII","o":["Fr. VIII","Fr. VI","Fr. IX","Fr. XIV"],"x":"La fr. VIII cubre la comercialización o distribución habitual o profesional de vehículos nuevos o usados, aéreos, marítimos o terrestres. La XIV es comercio exterior (despacho aduanal) y la IX, blindaje.","ref":"Art. 17, fr. VIII · H8"},{"id":"G018","tema":"h8","tipo":"caso","q":"Una casa de subastas remata pinturas y esculturas de manera habitual. ¿En qué fracción del art. 17 encuadra?","a":"Fr. VII","o":["Fr. XI","Fr. XIV","Fr. VII","Fr. VI"],"x":"La fr. VII es la subasta o comercialización habitual o profesional de obras de arte. La VI es para metales, piedras preciosas, joyas y relojes; la XIV, inciso e), trata obras de arte sólo en despacho aduanal.","ref":"Art. 17, fr. VII · H8"},{"id":"G019","tema":"h8","tipo":"caso","q":"Una empresa privada transporta en camiones blindados el efectivo de
