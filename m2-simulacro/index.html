de la lista (41ª, segundo párrafo)","o":["Ninguno, porque las operaciones celebradas antes de la notificación de la lista quedan fuera del alcance de la DCG y no se reportan","El «Reporte de 24 horas LD» del primer párrafo de la 41ª, porque la operación debe tratarse como una sospecha fundada de lavado de dinero","Un reporte de Operación Inusual en el plazo de 24 horas, por haber celebrado la operación con anterioridad a la notificación de la lista (41ª, segundo párrafo)","El reporte mensual de Operaciones Relevantes, dentro de los quince días hábiles siguientes al último día hábil del mes inmediato anterior, sin leyenda alguna sobre la lista"],"x":"La 41ª, segundo párrafo, obliga a reportar como Operación Inusual, en el mismo plazo de 24 horas, las operaciones celebradas antes de la notificación de la LPB, los intentos posteriores y los terceros que actúen a favor del listado. No se confunde con el «Reporte de 24 horas» del primer párrafo ni con el reporte de la 72ª, cuya leyenda es la de la lista.","ref":"Bancos 41ª, segundo párrafo; 72ª · H3"},{"id":"C067","tema":"h3","tipo":"trampa","q":"Un banco identifica a un cliente en la Lista de Personas Bloqueadas y elabora el reporte correspondiente. ¿Qué leyenda debe insertar en la columna de descripción de la Operación?","a":"«Lista de Personas Bloqueadas»","o":["«Lista de Personas Bloqueadas»","«Operación Interna Preocupante», porque el cliente es una persona que debe ser reportada de inmediato","«Reporte de 24 horas LD», porque el reporte debe presentarse en un plazo de veinticuatro horas","«Reporte de 24 horas FT», porque la lista incluye a personas vinculadas con financiamiento al terrorismo"],"x":"La 72ª II de Bancos ordena insertar la leyenda «Lista de Personas Bloqueadas» en el reporte de OI. Las leyendas «Reporte de 24 horas LD» o «FT» son de la 41ª, primer párrafo, cuando la entidad tiene sospechas fundadas sobre una operación que se pretende realizar.","ref":"Bancos 72ª II; 41ª, primer párrafo · H3"},{"id":"C068","tema":"h3","tipo":"cifra","q":"Una persona incluida en la Lista de Personas Bloqueadas quiere hacer valer sus derechos ante la Unidad de Inteligencia Financiera. ¿De qué plazo dispone para manifestar, aportar pruebas y alegar, y qué ocurre si necesita más tiempo?","a":"Diez días hábiles desde que conoce la suspensión; a petición de parte, el Titular de la UIF puede ampliarlo por una sola ocasión hasta por el mismo lapso","o":["Quince días hábiles desde que recibe el aviso del banco, prorrogables las veces que lo justifiquen las circunstancias particulares del caso","Diez días hábiles desde que conoce la suspensión; a petición de parte, el Titular de la UIF puede ampliarlo por una sola ocasión hasta por el mismo lapso","Diez días hábiles desde que conoce la suspensión, sin posibilidad de ampliación porque el procedimiento concluye con la resolución de la autoridad","Diez días hábiles desde que conoce la suspensión, ampliables de oficio por el Titular de la UIF cuantas veces estime necesario"],"x":"La 73ª I de Bancos otorga audiencia ante el Titular de la UIF para que el interesado, en diez días hábiles desde que conoce la suspensión, manifieste, pruebe y alegue; la ampliación procede a petición de parte, por una sola vez y por el mismo lapso. Luego la UIF resuelve en diez días hábiles y notifica en quince.","ref":"Bancos 73ª I · H3"},{"id":"C069","tema":"h3","tipo":"caso","q":"Un empleado de un banco comenta a un cliente que su nombre aparecerá en la próxima actualización de la Lista de Personas Bloqueadas. ¿Qué dispone la DCG de Bancos?","a":"Está estrictamente prohibido alertar a Clientes, Usuarios o terceros sobre el contenido de la Lista de Personas Bloqueadas, sin perjuicio de la 62ª Quinquies y del aviso de la 72ª","o":["Puede hacerlo si el cliente es un tercero que actúa por cuenta de otro, porque la prohibición sólo protege a los Clientes y Usuarios que ya aparezcan en la lista","Puede hacerlo siempre que se lo informe por escrito y dentro de los diez días hábiles siguientes a que la Secretaría la actualice","Está estrictamente prohibido alertar a Clientes, Usuarios o terceros sobre el contenido de la Lista de Personas Bloqueadas, sin perjuicio de la 62ª Quinquies y del aviso de la 72ª","Puede hacerlo si el cliente aún no ha realizado operaciones con la entidad, pues la prohibición sólo alcanza a quienes ya son Clientes"],"x":"La 52ª IV de Bancos prohíbe alertar a Clientes, Usuarios o terceros sobre el contenido de la LPB. Sólo exceptúa el intercambio autorizado por la 62ª Quinquies y el aviso que el banco da al suspender los servicios (72ª, último párrafo).","ref":"Bancos 52ª IV · H3"},{"id":"C070","tema":"h3","tipo":"caso","q":"El procedimiento ante la UIF resolvió la eliminación de una persona de la Lista de Personas Bloqueadas. ¿Qué debe hacer el banco respecto de los actos, operaciones o servicios que había suspendido?","a":"Reanudarlos inmediatamente con el Cliente o Usuario de que se trate","o":["Reanudarlos sólo con autorización expresa de la Comisión, previa solicitud presentada por el Oficial de Cumplimiento","Reanudarlos después de un periodo de observación de doce meses, con alertas reforzadas sobre las operaciones del cliente","Reanudarlos inmediatamente con el Cliente o Usuario de que se trate","Reanudarlos dentro de los diez días hábiles siguientes a que reciba el oficio con la resolución de la UIF"],"x":"La 74ª de Bancos, último párrafo, ordena reanudar inmediatamente los actos, operaciones o servicios cuando se elimine a la persona de la LPB; la eliminación procede, entre otros supuestos, por resolución del procedimiento de la 73ª (74ª III). No hay plazo de espera ni autorización adicional de la Comisión.","ref":"Bancos 74ª, último párrafo; 74ª III · H3"},{"id":"C071","tema":"h3","tipo":"memoria","q":"Una persona incluida en la Lista de Personas Bloqueadas solicita acceder a ciertos recursos que necesita. ¿En qué términos puede la Secretaría autorizar ese acceso según la DCG de Bancos?","a":"Conforme a los tratados internacionales celebrados por México y a la resolución 1452 (2002) del Consejo de Seguridad de la ONU","o":["Conforme a la resolución 1267 (1999) del Consejo de Seguridad de la ONU, que es la única que prevé excepciones","Conforme a la resolución que emita el Titular de la UIF en la audiencia, que debe autorizarlo siempre que el interesado lo pida","Conforme a la solicitud del banco a la Comisión, que la autoriza dentro de los diez días hábiles siguientes a recibirla","Conforme a los tratados internacionales celebrados por México y a la resolución 1452 (2002) del Consejo de Seguridad de la ONU"],"x":"La 75ª de Bancos permite a la Secretaría autorizar, sin perjuicio del capítulo, el acceso a determinados recursos, derechos, bienes, actos, operaciones o servicios a los Clientes o Usuarios en la LPB, en términos de tratados internacionales y de la resolución 1452 (2002) de la ONU, y a las Entidades respecto de obligaciones contraídas con ellos. Es una excepción que concede la Secretaría, no la Entidad.","ref":"Bancos 75ª I · H3"},{"id":"C072","tema":"h3","tipo":"caso","q":"En una sucursal de un banco, una persona distinta del titular cobra un cheque emitido con cargo a una cuenta corriente de esa misma sucursal. Para efectos del capítulo de la Lista de Personas Bloqueadas, ¿cómo la considera la DCG de Bancos?","a":"No se le considera Usuario, porque el cobro de ese cheque es una de las operaciones excluidas del concepto de Usuario para el capítulo","o":["Se le considera Cliente, porque la sucursal librada mantiene una cuenta en la que el cheque se carga a su valor","No se le considera Usuario, porque el cobro de ese cheque es una de las operaciones excluidas del concepto de Usuario para el capítulo","Se le considera Usuario, por lo que el banco debe cotejarla contra la lista antes de pagar el cheque en ventanilla","Se le considera Usuario sólo si el importe del cheque alcanza el umbral de las Operaciones Relevantes de la Entidad"],"x":"La 70ª, tercer párrafo, de Bancos excluye del concepto de Usuario, para el capítulo de la LPB, a quien cobra cheques de cuenta corriente en sucursales de la Entidad librada siendo distinto del titular y a quien recibe recursos de programas gubernamentales de apoyo. Esta exclusión es exclusiva de Bancos.","ref":"Bancos 70ª, I-II · H3"},{"id":"C073","tema":"h3","tipo":"caso","par":"C074","q":"Una casa de cambio que no forma parte de ningún grupo financiero quiere intercambiar con otra casa de cambio información de operaciones de un usuario para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé su DCG?","o":["Pueden intercambiarla con solicitud de funcionario autorizado y respuesta en no más de 30 días naturales, igual que entre bancos","No contiene esa modalidad: su único intercambio es con entidades de su mismo grupo financiero","Pueden intercambiarla si celebran convenio e informan a la Comisión antes del intercambio","Pueden intercambiarla mediante escrito con motivo y clase, y respuesta por escrito firmado"],"a":"No contiene esa modalidad: su único intercambio es con entidades de su mismo grupo financiero","x":"Las DCG de Casas de cambio sólo regulan el intercambio con las demás entidades del mismo grupo financiero (51ª-1); no tienen intercambio entre entidades del mismo tipo. Esa modalidad sólo la prevén Bancos (62ª), SOFIPO (64ª) e ITF (arts. 77–78). El distractor del escrito firmado describe a SOFIPO e ITF.","ref":"Casas de cambio 51ª-1; Bancos 62ª; SOFIPO 64ª; ITF arts. 77–78 · H3"},{"id":"C074","tema":"h3","tipo":"caso","par":"C073","q":"Una casa de cambio que forma parte de un grupo financiero quiere compartir con el banco del grupo información de las operaciones de sus usuarios, en materia de PLD/FT. ¿Qué exige su DCG?","o":["Celebrar un convenio sobre el tratamiento confidencial y los cargos de los funcionarios autorizados, e informar a la Comisión antes del intercambio","Enviar a la Secretaría, por conducto de la Comisión y de forma previa o simultánea, copia del formato oficial con toda la información intercambiada","Obtener el consentimiento expreso de cada usuario y responder las solicitudes del banco en no más de 30 días naturales","Nada: el intercambio dentro del grupo es libre y sólo requiere que lo pida un funcionario autorizado por escrito"],"a":"Celebrar un convenio sobre el tratamiento confidencial y los cargos de los funcionarios autorizados, e informar a la Comisión antes del intercambio","x":"La 51ª-1 de Casas de cambio permite intercambiar información sobre las operaciones con sus Usuarios con las otras entidades del grupo, siempre que celebren un convenio (confidencialidad y cargos) e informen a la Comisión su suscripción antes del intercambio. La copia del formato a la Secretaría es requisito del intercambio con extranjeras (62ª Ter de Bancos), y el consentimiento del cliente no se exige en el intercambio de grupo.","ref":"Casas de cambio 51ª-1 · H3"},{"id":"C075","tema":"h3","tipo":"trampa","q":"Un banco y una casa de bolsa del mismo grupo financiero quieren que la casa de bolsa use el expediente de identificación que ya integró el banco para abrirle un contrato a un cliente del banco. ¿Qué es correcto?","o":["Es el intercambio de grupo de la 62ª Sexies: basta el convenio de confidencialidad y cargos, y el informe previo a la Comisión","Es el intercambio entre entidades del mismo tipo: la casa de bolsa lo pide y el banco responde en 30 días naturales","No es posible: el expediente de identificación sólo puede integrarlo y conservarlo la entidad que abre la relación","Requiere el consentimiento del cliente y un convenio entre las entidades; es una regla de identificación, no de intercambio PLD"],"a":"Requiere el consentimiento del cliente y un convenio entre las entidades; es una regla de identificación, no de intercambio PLD","x":"La 9ª de Bancos (8ª en Casas de bolsa) permite que otra entidad del grupo integre y conserve el expediente si cuenta con el consentimiento del Cliente y las entidades celebran un convenio para intercambiar los datos y documentos de identificación. Es parte de la identificación (2.1.2). La 62ª Sexies es otra cosa: intercambio de información de operaciones para PLD/FT, sin consentimiento del cliente.","ref":"Bancos 9ª; Casas de bolsa 8ª; Bancos 62ª Sexies · H3"},{"id":"C076","tema":"h3","tipo":"caso","q":"Un asesor en inversiones lee que el art. 79 de las DCG de ITF permite a las ITF intercambiar información con asesores en inversiones. ¿Qué prevé sobre el intercambio de información PLD/FT la DCG de Asesores en inversiones?","o":["Lo regula en un capítulo propio, con convenio, aviso previo a la Comisión y respuesta en 30 días naturales","No contiene disposición de intercambio de información PLD/FT; el art. 79 de ITF los nombra como posibles contrapartes","Lo regula sólo con las ITF, por escrito firmado y con respuesta en no más de 30 días naturales","Lo regula sólo con las entidades de su grupo financiero, con convenio de confidencialidad y aviso previo a la Comisión"],"a":"No contiene disposición de intercambio de información PLD/FT; el art. 79 de ITF los nombra como posibles contrapartes","x":"Las DCG de Asesores en inversiones no tienen ninguna regla de intercambio de información PLD/FT; su única mención de intercambio es la de datos de identificación por convenio con la entidad financiera con la que tiene relación (8ª), que es identificación. El art. 79 de ITF habla de asesores «autorizados para ello en las leyes que los regulan»: abre la puerta del lado de la ITF.","ref":"Asesores en inversiones 8ª; ITF art. 79 · H3"},{"id":"C077","tema":"h3","tipo":"caso","q":"Una ITF quiere intercambiar información de operaciones de un cliente con un transmisor de dinero, para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé su DCG?","o":["No puede: las ITF sólo intercambian información con otras ITF y con las entidades de su grupo financiero","Sólo puede si el transmisor forma parte de su grupo financiero y ambos informan a la CNBV antes del intercambio","Puede, con transmisores autorizados para ello en sus leyes, con las reglas del intercambio entre ITF salvo que se opongan a las del transmisor","Puede, siempre que el intercambio derive de una operación entre ambos y se envíe a la Secretaría, de forma previa o simultánea, copia del formato"],"a":"Puede, con transmisores autorizados para ello en sus leyes, con las reglas del intercambio entre ITF salvo que se opongan a las del transmisor","x":"El art. 79 de ITF permite intercambiar con otras Entidades Financieras y con centros cambiarios, transmisores de dinero y asesores en inversiones autorizados para ello en sus leyes, ajustándose al Capítulo I (intercambio entre ITF), salvo que se oponga a las disposiciones de la contraparte. Derivar de una operación y enviar copia del formato son condiciones del intercambio con extranjeras (art. 81).","ref":"ITF arts. 79 y 81 · H3"},{"id":"C078","tema":"h3","tipo":"caso","q":"Un banco quiere compartir con una entidad financiera extranjera la información de un cliente persona moral de su régimen ilimitado de dólares en efectivo (33ª Bis 1). ¿Qué condición específica exige la 62ª Bis?","o":["Que el intercambio derive de una operación con dólares de los EUA entre el banco y la entidad extranjera","Que la entidad extranjera sea filial del banco o una entidad en la que tenga inversión en su capital social","Que la Secretaría haya determinado previamente a esa entidad extranjera como contraparte autorizada","Que el cliente persona moral otorgue su consentimiento expreso antes de compartir su información"],"a":"Que el intercambio derive de una operación con dólares de los EUA entre el banco y la entidad extranjera","x":"La 62ª Bis permite intercambiar la información de la 33ª Bis 1 con entidades financieras extranjeras con dos condiciones: convenio (confidencialidad y cargos) con aviso previo a la Comisión, y que el intercambio derive de una operación con dólares entre ambas. Filiales e inversiones son de la 62ª Octies; «las que determine la Secretaría» es la regla de ITF (art. 81).","ref":"Bancos 62ª Bis · H3"},{"id":"C079","tema":"h3","tipo":"caso","q":"Un banco quiere compartir el contenido de la Lista de Personas Bloqueadas con otro banco mexicano que no pertenece a su grupo financiero. ¿Qué prevé la 62ª Quinquies?","o":["Puede compartirlo, porque el intercambio entre entidades del mismo tipo comprende la LPB","Puede compartirlo si celebra convenio e informa a la Comisión antes del intercambio","No está previsto: ese banco no es uno de los destinatarios que enumera la disposición","Puede compartirlo por la plataforma tecnológica que opere el Banco de México"],"a":"No está previsto: ese banco no es uno de los destinatarios que enumera la disposición","x":"La 62ª Quinquies enumera cinco destinatarios: oficinas de representación con relación comercial, filiales del exterior, entidades del exterior donde tenga inversión en capital, corresponsales extranjeros y entidades financieras del mismo grupo. Otro banco mexicano ajeno al grupo no está en la lista, y el intercambio general de la 62ª no menciona la LPB.","ref":"Bancos 62ª Quinquies · H3"},{"id":"C080","tema":"h3","tipo":"memoria","q":"Para que un banco proporcione a la plataforma tecnológica de transferencias la información y documentación de un cliente (62ª Quáter), ¿qué debe obtener del cliente?","o":["Una carta firmada en la que libere al banco de responsabilidad por el uso de la información","Su consentimiento, a través de los medios que el banco establezca para esos efectos","Una solicitud por escrito en la que especifique el motivo y la clase de información","Una autorización de la Comisión, tramitada por el banco con el formato oficial"],"a":"Su consentimiento, a través de los medios que el banco establezca para esos efectos","x":"La fr. VIII de la 62ª Quáter exige que el Cliente o Usuario otorgue su consentimiento por los medios que la Entidad establezca, y que conozca la naturaleza y alcance de la información que la plataforma proporcionará. Es el único intercambio del capítulo que pide consentimiento del cliente; el escrito con motivo y clase es la solicitud entre SOFIPO o entre ITF.","ref":"Bancos 62ª Quáter fr. VIII · H3"},{"id":"C081","tema":"h3","tipo":"caso","q":"Un cliente pide por escrito a su banco la información suya que está almacenada en la plataforma tecnológica de transferencias. ¿Qué debe hacer el banco?","o":["Negarse, porque la información de la plataforma sólo puede usarse para los fines de los artículos 52 y 115 Bis","Remitir la solicitud a la Comisión, que es la única autorizada para entregar esa información al cliente","Entregarle sólo los datos estadísticos de número, montos, destinos y procedencias de sus transferencias del periodo","Entregársela, incluida la relación de las demás entidades que la hayan consultado en los periodos de los lineamientos"],"a":"Entregársela, incluida la relación de las demás entidades que la hayan consultado en los periodos de los lineamientos","x":"La fr. VII de la 62ª Quáter obliga a entregar la información almacenada al Cliente o Usuario que la solicite por escrito o por medios electrónicos, incluyendo la relación de las demás Entidades que la hayan consultado. El uso exclusivo para los arts. 52 y 115 Bis (fr. XI) limita a las entidades que consultan, no al titular. Los datos estadísticos son lo que la plataforma entrega a las entidades (fr. VI).","ref":"Bancos 62ª Quáter fr. VII · H3"},{"id":"C082","tema":"h3","tipo":"caso","q":"Un banco recibió de otro banco, por intercambio de la 62ª, antecedentes de un cliente. Ahora un tercer banco le pide esa misma información. ¿Qué prevé la disposición?","o":["Puede compartirla libremente, porque ya forma parte de sus registros y la finalidad es la misma","Sólo puede compartirla si se estableció que la información puede a su vez compartirse con otras Entidades","Puede compartirla si informa a la Comisión antes del intercambio y conserva la documentación soporte respectiva","No puede compartirla en ningún caso: la información recibida sólo puede usarla quien la solicitó"],"a":"Sólo puede compartirla si se estableció que la información puede a su vez compartirse con otras Entidades","x":"La 62ª fr. IV dispone que la información sólo podrá ser utilizada por la Entidad que la solicitó, salvo que se establezca que puede a su vez compartirse con otras Entidades. Por eso el absoluto «en ningún caso» es falso, y tampoco basta informar a la Comisión: el aviso previo es requisito del intercambio en grupo y con extranjeras.","ref":"Bancos 62ª fr. IV · H3"},{"id":"C083","tema":"h3","tipo":"caso","par":"C084","q":"Una ITF detecta un esquema de fraude contra sus propios clientes y quiere intercambiar información con otra ITF para prevenirlo. ¿Qué prevé su DCG sobre la finalidad del intercambio?","o":["Lo permite: además de 139 Quáter y 400 Bis, incluye prevenir delitos en contra de sus Clientes o de la propia ITF","No lo permite: el intercambio se limita a prevenir los delitos de los artículos 139 Quáter y 400 Bis","Lo permite sólo si la otra ITF forma parte de su grupo financiero, con convenio e informe previo a la CNBV","Lo permite sólo con autorización previa de la CNBV, por tratarse de una finalidad distinta de PLD/FT"],"a":"Lo permite: además de 139 Quáter y 400 Bis, incluye prevenir delitos en contra de sus Clientes o de la propia ITF","x":"El art. 77 de ITF amplía la finalidad del intercambio entre ITF: prevenir los supuestos de los arts. 139 Quáter o 400 Bis CPF y la comisión de delitos en contra de sus Clientes o de la propia ITF. SOFIPO, en cambio, lo limita «única y exclusivamente» a 139 Quáter y 400 Bis.","ref":"ITF art. 77; SOFIPO 64ª · H3"},{"id":"C084","tema":"h3","tipo":"caso","par":"C083","q":"Una SOFIPO detecta un esquema de fraude contra sus propios clientes, sin indicios de lavado ni de financiamiento al terrorismo, y quiere intercambiar información con otra SOFIPO para prevenirlo. ¿Qué prevé su DCG?","o":["Lo permite, porque la finalidad incluye los delitos en contra de sus Clientes o de la propia Entidad","Lo permite con escrito firmado por funcionarios autorizados y respuesta en 30 días naturales","No lo prevé: el intercambio se limita única y exclusivamente a prevenir 139 Quáter o 400 Bis","Lo permite si ambas SOFIPO celebran convenio e informan a la Comisión antes del intercambio"],"a":"No lo prevé: el intercambio se limita única y exclusivamente a prevenir 139 Quáter o 400 Bis","x":"La 64ª de SOFIPO limita el intercambio «única y exclusivamente» a fortalecer las medidas para prevenir y detectar los supuestos de los arts. 139 Quáter o 400 Bis CPF. La finalidad ampliada a delitos contra los clientes es propia de ITF (art. 77). El escrito firmado y los 30 días naturales son la forma del intercambio, pero no cambian su finalidad.","ref":"SOFIPO 64ª; ITF art. 77 · H3"},{"id":"D001","tema":"h4","tipo":"caso","q":"Una institución de crédito tiene 22 personas a su servicio, entre empleados directos y personal de una empresa de servicios complementarios. ¿Qué establece su DCG sobre el Comité de Comunicación y Control?","a":"No está obligada a constituirlo; sus funciones las ejerce el Oficial de Cumplimiento, salvo la relativa a la clave de acceso, que va al director general o equivalente","o":["No está obligada a constituirlo; sus funciones las ejerce el Oficial de Cumplimiento, salvo la relativa a la clave de acceso, que va al director general o equivalente","Debe constituirlo, porque la exención por número de personas sólo procede si además tiene menos de 500 Clientes y activos menores a 100 millones de UDIS","Debe constituirlo, porque su exención no depende del número de personas a su servicio sino de que tenga nivel de operación I","No está obligada a constituirlo, y todas sus funciones, incluida la relativa a la clave de acceso, pasan al Oficial de Cumplimiento sin excepción"],"x":"En Bancos la exención es por tener menos de 25 personas a su servicio, directas o indirectas a través de empresas de servicios complementarios. Sin Comité, el Oficial de Cumplimiento ejerce sus funciones, salvo la fr. XI de la 43ª (asegurar que la clave de la 69ª-1 esté a nombre del OC), que corresponde al director general o equivalente.","ref":"Bancos 44ª últ. párr.; 43ª XI · H4","par":"D002"},{"id":"D002","tema":"h4","tipo":"caso","q":"Una sociedad cooperativa de ahorro y préstamo de nivel de operación II tiene 22 personas a su servicio, entre empleados directos y personal de una empresa de servicios complementarios. ¿Qué establece su DCG sobre el Comité de Comunicación y Control?","a":"Debe constituirlo, porque su exención no depende del número de personas a su servicio sino de que tenga nivel de operación I","o":["Debe constituirlo, porque la exención por número de personas sólo procede si además tiene menos de 500 Clientes y activos menores a 100 millones de UDIS","Debe constituirlo, porque su exención no depende del número de personas a su servicio sino de que tenga nivel de operación I","No está obligada a constituirlo; sus funciones las ejerce el Oficial de Cumplimiento, salvo la relativa a la clave de acceso, que va al director general o equivalente","No está obligada a constituirlo, y todas sus funciones, incluida la relativa a la clave de acceso, pasan al Oficial de Cumplimiento sin excepción"],"x":"En SOCAP el criterio de exención no es el número de personas: sólo las Sociedades con nivel de operación I no están obligadas a constituir el Comité (48ª, último párrafo). Una SOCAP de nivel II debe tenerlo aunque tenga 22 personas a su servicio.","ref":"SOCAP 48ª últ. párr. · H4","par":"D001"},{"id":"D003","tema":"h4","tipo":"caso","q":"Una institución de crédito con 18 personas a su servicio no constituye el Comité de Comunicación y Control, como se lo permite su DCG. ¿Quién ejerce las funciones que corresponderían al Comité?","a":"El Oficial de Cumplimiento, salvo asegurar que la clave de acceso se solicite y mantenga a su nombre, que corresponde al director general o equivalente","o":["El consejo de administración, salvo el dictamen de Operaciones Inusuales e Internas Preocupantes, que corresponde al Oficial de Cumplimiento","El director general de la institución, salvo el dictamen de Operaciones Inusuales e Internas Preocupantes, que en todo caso conserva el Oficial de Cumplimiento","El Oficial de Cumplimiento, salvo asegurar que la clave de acceso se solicite y mantenga a su nombre, que corresponde al director general o equivalente","El Oficial de Cumplimiento, todas ellas, sin que la disposición reserve alguna de esas funciones al director general"],"x":"Bancos 44ª, último párrafo: en la Entidad exenta, las funciones del Comité las ejerce el Oficial de Cumplimiento, salvo la fr. XI de la 43ª (clave de la 69ª-1 a nombre del OC o del interino), que corresponde al director general o equivalente.","ref":"Bancos 44ª últ. párr.; 43ª XI · H4","par":"D004"},{"id":"D004","tema":"h4","tipo":"caso","q":"Una institución de tecnología financiera con 18 personas a su servicio no constituye el Comité de Comunicación y Control, como se lo permite su DCG. ¿Quién ejerce las funciones que corresponderían al Comité?","a":"El Oficial de Cumplimiento, todas ellas, sin que la disposición reserve alguna de esas funciones al director general","o":["El director general de la institución, salvo el dictamen de Operaciones Inusuales e Internas Preocupantes, que en todo caso conserva el Oficial de Cumplimiento","El Oficial de Cumplimiento, salvo asegurar que la clave de acceso se solicite y mantenga a su nombre, que corresponde al director general o equivalente","El consejo de administración, salvo el dictamen de Operaciones Inusuales e Internas Preocupantes, que corresponde al Oficial de Cumplimiento","El Oficial de Cumplimiento, todas ellas, sin que la disposición reserve alguna de esas funciones al director general"],"x":"ITF art. 46, último párrafo: con menos de 25 personas «para el cumplimiento de sus fines», las funciones del art. 45 las ejerce el Oficial de Cumplimiento, sin excepción a favor del director general (el art. 45 no contiene la función de la clave).","ref":"ITF art. 46 últ. párr.; art. 45 · H4","par":"D003"},{"id":"D005","tema":"h4","tipo":"caso","q":"Una unión de crédito tiene 8 personas a su servicio, 620 socios y activos totales por 70 millones de UDIS. ¿Está obligada a constituir el Comité de Comunicación y Control?","a":"Sí, porque la exención exige reunir a la vez menos de 10 personas, menos de 500 socios y activos totales por menos de 100 millones de UDIS","o":["Sí, porque la exención exige reunir a la vez menos de 10 personas, menos de 500 socios y activos totales por menos de 100 millones de UDIS","No, porque basta con cumplir dos de las tres condiciones de su DCG: menos de 10 personas y activos totales por menos de 100 millones de UDIS","No, porque basta con tener menos de 10 personas a su servicio, directas o indirectas a través de empresas de servicios complementarios","Sí, porque las uniones de crédito no tienen exención alguna y siempre deben constituirlo con al menos tres miembros"],"x":"Uniones 35ª, último párrafo: no están obligadas las Uniones con menos de 10 personas a su servicio, menos de 500 socios y activos totales por menos de 100 millones de UDIS. El texto une las tres condiciones con «y»: son acumulativas. Con 620 socios, la Unión debe constituir el Comité.","ref":"Uniones 35ª últ. párr. · H4"},{"id":"D006","tema":"h4","tipo":"cifra","q":"Conforme a la DCG de Bancos, ¿qué umbral de personal libera a una institución de crédito de la obligación de constituir y mantener el Comité?","a":"Menos de 25 personas a su servicio, ya sea que realicen funciones de manera directa o indirecta a través de empresas de servicios complementarios","o":["Menos de 50 personas contratadas directamente por la institución, sin computar al personal que le preste servicios a través de empresas de servicios complementarios","Menos de 25 personas a su servicio, ya sea que realicen funciones de manera directa o indirecta a través de empresas de servicios complementarios","Menos de 25 personas contratadas directamente; el personal de empresas de servicios complementarios no se computa para el umbral","Menos de 10 personas a su servicio, siempre que además tenga menos de 500 Clientes y activos menores a 100 millones de UDIS"],"x":"Bancos 44ª, último párrafo: el umbral es menos de 25 personas a su servicio y se cuentan tanto las que trabajan directamente como las que lo hacen indirectamente a través de empresas de servicios complementarios. La combinación 10 personas · 500 socios · 100 millones de UDIS es la de Uniones.","ref":"Bancos 44ª últ. párr. · H4"},{"id":"D007","tema":"h4","tipo":"trampa","q":"¿Qué sujeto NO cuenta con Comité de Comunicación y Control por diseño de su propia DCG, con independencia de su número de personas?","a":"El asesor en inversiones: su DCG prevé un Representante que concentra las funciones de dictamen y cumplimiento","o":["La unión de crédito: su DCG encarga siempre esas funciones al consejo de administración, sin órgano colegiado","El centro cambiario: su DCG sustituye el Comité por un representante designado por el administrador único","El asesor en inversiones: su DCG prevé un Representante que concentra las funciones de dictamen y cumplimiento","La casa de cambio: su DCG encarga el dictamen de operaciones directamente al Oficial de Cumplimiento, sin Comité"],"x":"La DCG de Asesores en inversiones no prevé Comité ni Oficial de Cumplimiento: la persona moral designa un Representante (2ª XXV y 30ª), que dictamina y reporta las operaciones. Uniones, Casas de cambio y Centros cambiarios sí deben tener Comité, salvo su supuesto de exención (Uniones 35ª, Casas de cambio 35a, Centros 31ª).","ref":"Asesores 2ª XXV; 30ª · H4"},{"id":"D008","tema":"h4","tipo":"caso","q":"Una Entidad sujeta a la DCG de fondos de inversión realiza exclusivamente las actividades a que se refieren la fr. V del art. 39 Bis y el último párrafo del art. 40 Bis de la Ley de Fondos de Inversión. ¿Qué estructura interna le exige su DCG?","a":"No le aplican las disposiciones del Comité ni del Oficial de Cumplimiento; su consejo designa un representante que labore en la Entidad","o":["Debe designar un Oficial de Cumplimiento dentro de las tres jerarquías inferiores al director general y queda exenta del Comité aunque tenga más de 25 personas","Su director general asume las funciones del Comité y del Oficial de Cumplimiento, sin necesidad de designación alguna","Debe constituir el Comité con al menos dos miembros de las dos jerarquías inferiores al director general, pero queda relevada de designar Oficial de Cumplimiento","No le aplican las disposiciones del Comité ni del Oficial de Cumplimiento; su consejo designa un representante que labore en la Entidad"],"x":"Fondos 42ª: las Entidades que exclusivamente realicen esas actividades no están obligadas a cumplir la 37ª a 41ª Bis (Comité, integración, sesiones, avisos, Oficial de Cumplimiento e interino) y deben designar, mediante su consejo de administración, un representante que labore en la Entidad, con las funciones de la propia 42ª.","ref":"Fondos 42ª · H4"},{"id":"D009","tema":"h4","tipo":"caso","q":"El consejo de una institución de crédito evalúa incorporar al Comité de Comunicación y Control a un funcionario cuyo cargo está en la tercera jerarquía inmediata inferior a la del director general. Conforme a su DCG, ¿puede participar como miembro?","a":"Sí, porque la DCG admite funcionarios dentro de las tres jerarquías inmediatas inferiores a la del director general","o":["Sí, porque la DCG admite funcionarios dentro de las tres jerarquías inmediatas inferiores a la del director general","No, porque sólo pueden ser miembros los consejeros y el director general, nunca los funcionarios de jerarquías inferiores a la de este","No, porque los funcionarios de jerarquías inferiores sólo pueden participar como suplentes de los consejeros, no como miembros propietarios","No, porque la DCG sólo admite funcionarios dentro de las dos jerarquías inmediatas inferiores a la del director general"],"x":"Bancos 44ª: en el Comité deben participar miembros del consejo, el director general o funcionarios que ocupen cargos dentro de las tres jerarquías inmediatas inferiores a la del director general.","ref":"Bancos 44ª · H4","par":"D010"},{"id":"D010","tema":"h4","tipo":"caso","q":"El consejo de una Entidad sujeta a la DCG de fondos de inversión evalúa incorporar al Comité de Comunicación y Control a un funcionario cuyo cargo está en la tercera jerarquía inmediata inferior a la del director general. Conforme a su DCG, ¿puede participar como miembro?","a":"No, porque la DCG sólo admite funcionarios dentro de las dos jerarquías inmediatas inferiores a la del director general","o":["No, porque los funcionarios de jerarquías inferiores sólo pueden participar como suplentes de los consejeros, no como miembros propietarios","No, porque la DCG sólo admite funcionarios dentro de las dos jerarquías inmediatas inferiores a la del director general","No, porque sólo pueden ser miembros los consejeros y el director general, nunca los funcionarios de jerarquías inferiores a la de este","Sí, porque la DCG admite funcionarios dentro de las tres jerarquías inmediatas inferiores a la del director general"],"x":"Fondos 38ª: a diferencia de Bancos, en el Comité participan miembros del consejo, el director general o funcionarios dentro de las dos jerarquías inmediatas inferiores a la del director general. Un funcionario de la tercera jerarquía no cabe.","ref":"Fondos 38ª · H4","par":"D009"},{"id":"D011","tema":"h4","tipo":"trampa","q":"En el Comité de Comunicación y Control de una institución de crédito, ¿cuál es la posición del auditor interno?","a":"No forma parte del Comité, pero participa en sus sesiones con voz y sin voto","o":["Es miembro con voz y voto, pero sólo en los asuntos relacionados con auditoría","No participa en las sesiones; únicamente recibe copia de las actas firmadas del Comité","No forma parte del Comité, pero participa en sus sesiones con voz y sin voto","Es miembro con voz y voto, aunque no puede ser designado presidente ni secretario"],"x":"Bancos 44ª: «El auditor interno o la persona del área de auditoría que él designe, no formará parte del Comité, sin perjuicio de lo cual deberá participar en las sesiones de dicho Comité con voz, pero sin voto.» Por eso no cuenta para el quórum ni vota.","ref":"Bancos 44ª · H4"},{"id":"D012","tema":"h4","tipo":"caso","q":"Una SOFOM con 40 personas a su servicio no tiene auditor interno. Conforme a su DCG, ¿quién participa en las sesiones de su Comité en lugar del auditor?","a":"El funcionario con labores equivalentes que designe el consejo o administrador único, con voz pero sin voto","o":["El auditor externo independiente, con voz y voto, mientras el consejo de la SOFOM nombra a un auditor interno","El Oficial de Cumplimiento, que en ese supuesto asume también las labores de auditoría interna, con voz y sin voto","El comisario de la sociedad, como miembro propietario del Comité y con voto de calidad en caso de empate","El funcionario con labores equivalentes que designe el consejo o administrador único, con voz pero sin voto"],"x":"SOFOM 36ª: si la Entidad no cuenta con auditor interno, el consejo de administración o administrador único designa al funcionario que desempeñe labores equivalentes, quien participa en las sesiones con voz pero sin voto. El Oficial de Cumplimiento nunca puede tener funciones de auditoría interna (39ª).","ref":"SOFOM 36ª; 39ª · H4"},{"id":"D013","tema":"h4","tipo":"caso","q":"Una institución de tecnología financiera administrada por un consejo de administración integra su Comité de Comunicación y Control. ¿Quiénes deben ser miembros conforme a su DCG?","a":"Al menos un consejero, el director general y funcionarios o empleados de las tres jerarquías inmediatas inferiores al director general","o":["Al menos un consejero, el director general y funcionarios o empleados de las tres jerarquías inmediatas inferiores al director general","El director general o, en su lugar, un consejero, más el auditor interno como miembro propietario con derecho a voto en las sesiones","Sólo funcionarios de las dos jerarquías inmediatas inferiores al director general, sin consejeros en el Comité","Al menos tres consejeros independientes, sin participación del director general ni de los funcionarios de las jerarquías inferiores a este"],"x":"ITF art. 46: si la administración está a cargo de un consejo, deben ser miembros al menos un miembro del consejo, el director general y empleados o funcionarios de las tres jerarquías inmediatas inferiores (con administrador único: el administrador único, el director general y esos funcionarios). La integración es acumulativa, no alternativa como en Bancos. El auditor participa con voz sin voto, sólo si hay área de auditoría interna.","ref":"ITF art. 46 · H4"},{"id":"D014","tema":"h4","tipo":"cifra","q":"Un miembro propietario del Comité de una institución de crédito designó a su suplente. ¿En cuántas sesiones puede el suplente representarlo?","a":"Únicamente en dos sesiones no continuas por semestre","o":["Hasta en tres sesiones no continuas por año calendario","Únicamente en dos sesiones no continuas por semestre","Hasta en cuatro sesiones al año, continuas o no continuas","Únicamente en dos sesiones consecutivas por semestre"],"x":"Bancos 44ª: los miembros propietarios deben asistir a las sesiones y pueden designar suplentes, «quienes únicamente podrán representarlos en dos sesiones no continuas por semestre».","ref":"Bancos 44ª · H4"},{"id":"D015","tema":"h4","tipo":"cifra","q":"¿Con qué periodicidad mínima debe sesionar el Comité de Comunicación y Control de una institución de crédito?","a":"Al menos una vez cada mes del año","o":["Al menos una vez cada trimestre del año","Al menos una vez cada semestre, y cuando lo pida el consejo","Al menos una vez cada mes del año","Al menos una vez cada dos meses, y cuando lo pida el OC"],"x":"Bancos 44ª: «Dicho Comité sesionará con una periodicidad de al menos una vez cada mes del año.» La misma periodicidad rige en todos los sujetos que tienen Comité.","ref":"Bancos 44ª · H4"},{"id":"D016","tema":"h4","tipo":"caso","q":"El Comité de una institución de crédito tiene siete miembros. A la sesión asisten tres miembros y el auditor interno. ¿Puede celebrarse válidamente la sesión?","a":"No, porque se requiere la presencia de la mayoría de los miembros del Comité, es decir, al menos cuatro","o":["Sí, porque basta la presencia del presidente y del secretario del Comité o de sus respectivos suplentes","Sí, porque el quórum se calcula sobre los asistentes y basta con que estén presentes tres miembros","Sí, porque con el auditor interno suman cuatro asistentes, que constituyen la mayoría del Comité","No, porque se requiere la presencia de la mayoría de los miembros del Comité, es decir, al menos cuatro"],"x":"Bancos 44ª: para que las sesiones se celebren válidamente se requiere que esté presente la mayoría de los miembros del propio Comité (4 de 7). El auditor interno no es miembro (participa con voz y sin voto), por lo que no cuenta para el quórum.","ref":"Bancos 44ª · H4"},{"id":"D017","tema":"h4","tipo":"caso","q":"El Comité de una institución de crédito tiene nueve miembros y sesiona con seis presentes, incluido su presidente. Al votar el dictamen de una operación, tres votan por reportarla y tres en contra. ¿Cómo se resuelve?","a":"Decide el voto de calidad del presidente, porque se vota por mayoría de los miembros presentes","o":["Decide el voto de calidad del presidente, porque se vota por mayoría de los miembros presentes","Se pospone a la siguiente sesión, porque la decisión requiere la mayoría de la totalidad de los miembros","Decide el Oficial de Cumplimiento, por ser quien envía los reportes a la Secretaría por conducto de la Comisión","Se reporta la operación como inusual, porque ante un empate debe prevalecer el criterio de reportar"],"x":"Bancos 45ª: las decisiones se toman por el voto favorable de la mayoría de los miembros presentes en la sesión; en caso de empate, el presidente tiene voto de calidad.","ref":"Bancos 45ª · H4"},{"id":"D018","tema":"h4","tipo":"cifra","q":"El Comité de una institución de crédito tiene diez miembros y sesiona válidamente con siete presentes. ¿Cuántos votos favorables se necesitan, como mínimo, para aprobar una decisión?","a":"Cuatro, la mayoría de los miembros presentes en la sesión","o":["Cinco, las dos terceras partes de los miembros presentes","Cuatro, la mayoría de los miembros presentes en la sesión","Seis, la mayoría de la totalidad de los miembros del Comité","Siete, porque el dictamen exige unanimidad de los presentes"],"x":"Son dos reglas distintas: el quórum de instalación es la mayoría de los miembros del Comité (Bancos 44ª: 6 de 10, cumplido con 7); la votación es por mayoría de los miembros presentes (45ª: 4 de 7).","ref":"Bancos 44ª; 45ª · H4"},{"id":"D019","tema":"h4","tipo":"caso","q":"Una unión de crédito conserva los documentos en los que constan las justificaciones por las que su Comité determinó reportar o no las operaciones analizadas en cada sesión. ¿Qué plazo de conservación fija la disposición de su DCG que regula las actas del Comité?","a":"Al menos diez años contados a partir de la fecha en que se generen esos documentos","o":["Al menos cinco años contados a partir de la sesión en que se analizaron las operaciones","Mientras subsista la relación con el Cliente y hasta un año después de terminada","Al menos diez años contados a partir de la fecha en que se generen esos documentos","No fija un plazo propio; sólo exige conservarlos debidamente resguardados"],"x":"Uniones 36ª: las Uniones deben conservar debidamente resguardados, durante al menos diez años contados a partir de la fecha en que se generen, los documentos con las justificaciones de reportar o no cada operación analizada. Es la única DCG de este tema que fija el plazo en esa disposición.","ref":"Uniones 36ª · H4","par":"D020"},{"id":"D020","tema":"h4","tipo":"caso","q":"Una institución de crédito conserva los documentos en los que constan las justificaciones por las que su Comité determinó reportar o no las operaciones analizadas en cada sesión. ¿Qué plazo de conservación fija la disposición de su DCG que regula las actas del Comité?","a":"No fija un plazo propio; sólo exige conservarlos debidamente resguardados","o":["Mientras subsista la relación con el Cliente y hasta un año después de terminada","Al menos diez años contados a partir de la fecha en que se generen esos documentos","Al menos cinco años contados a partir de la sesión en que se analizaron las operaciones","No fija un plazo propio; sólo exige conservarlos debidamente resguardados"],"x":"Bancos 45ª: las Entidades deben conservar debidamente resguardados los documentos con las justificaciones por las que se determinó reportar o no cada operación analizada, pero la disposición no fija un plazo propio (a diferencia de Uniones 36ª, que fija al menos diez años).","ref":"Bancos 45ª · H4","par":"D019"},{"id":"D021","tema":"h4","tipo":"memoria","q":"¿Quién debe firmar el acta de cada sesión del Comité de Comunicación y Control de una institución de crédito?","a":"El presidente y el secretario del Comité o, en su caso, sus respectivos suplentes","o":["El presidente y el secretario del Comité o, en su caso, sus respectivos suplentes","El presidente del Comité y el Oficial de Cumplimiento, con el visto bueno del auditor","Todos los miembros presentes en la sesión y el auditor interno, como testigo","El secretario del Comité y el director general, como representante del consejo"],"x":"Bancos 45ª: de cada sesión se levanta un acta con las resoluciones adoptadas, firmada por el presidente y el secretario del Comité o, en su caso, por sus respectivos suplentes. Presidente y secretario se designan de entre los miembros (44ª).","ref":"Bancos 45ª; 44ª · H4"},{"id":"D022","tema":"h4","tipo":"caso","q":"Una SOFOM no cuenta con comité de auditoría y su Oficial de Cumplimiento ya elaboró el Manual de Cumplimiento. Conforme a su DCG, ¿quién aprueba el Manual?","a":"Su propio Comité de Comunicación y Control, o bien, su consejo de administración o su director general","o":["El comisario de la sociedad, previa opinión favorable del Oficial de Cumplimiento y del auditor interno","Su propio Comité de Comunicación y Control, o bien, su consejo de administración o su director general","Únicamente su propio Comité de Comunicación y Control, sin que el consejo de administración ni el director general puedan aprobarlo","La Comisión, a la que la entidad remite el Manual para su aprobación previa a su aplicación interna"],"x":"SOFOM 35ª I: el Comité somete el Manual a la aprobación del comité de auditoría; si la Entidad no tiene comité de auditoría, lo aprueba su propio Comité, o bien su consejo de administración o director general. Es la regla más abierta del tema.","ref":"SOFOM 35ª I · H4","par":"D023"},{"id":"D023","tema":"h4","tipo":"caso","q":"Una casa de cambio no cuenta con comité de auditoría y su Oficial de Cumplimiento ya elaboró el Manual de Cumplimiento. Conforme a su DCG, ¿quién aprueba el Manual?","a":"Su propio Comité de Comunicación y Control","o":["El comisario de la sociedad, previa opinión favorable del Oficial de Cumplimiento y del auditor interno","Su propio Comité de Comunicación y Control, o bien, su consejo de administración o su director general","Su propio Comité de Comunicación y Control","La Comisión, a la que la entidad remite el Manual para su aprobación previa a su aplicación interna"],"x":"Casas de cambio 34a I: sin comité de auditoría, «corresponderá a su propio Comité aprobar» el Manual. La misma solución tienen Fondos (37ª I), SOCAP (47ª I), Centros (30ª I) y Transmisores (32ª I); SOFOM admite además al consejo o al director general.","ref":"Casas de cambio 34a I · H4","par":"D022"},{"id":"D024","tema":"h4","tipo":"trampa","q":"En una institución de crédito, ¿cómo se reparten la elaboración y la aprobación del Manual de Cumplimiento?","a":"El Oficial de Cumplimiento lo elabora y lo somete al Comité, y el Comité lo somete a la aprobación del comité de auditoría","o":["El Comité lo elabora y el Oficial de Cumplimiento lo somete directamente a la aprobación del consejo de administración","El Oficial de Cumplimiento lo elabora y el Comité lo aprueba en definitiva, sin intervención de otro órgano de la institución","El área de auditoría interna lo elabora y el Comité lo aprueba en definitiva, con aviso posterior al comité de auditoría","El Oficial de Cumplimiento lo elabora y lo somete al Comité, y el Comité lo somete a la aprobación del comité de auditoría"],"x":"Bancos 47ª I: el OC elabora y somete a la consideración del Comité el Manual. Bancos 43ª I: el Comité lo somete, con cualquier modificación, a la aprobación del comité de auditoría. En Bancos, el Comité no lo aprueba en definitiva.","ref":"Bancos 43ª I; 47ª I · H4"},{"id":"D025","tema":"h4","tipo":"trampa","q":"El área del Oficial de Cumplimiento de una institución de crédito concluyó la investigación de una alerta. ¿Quién dictamina si la operación se reporta como inusual y quién envía el reporte?","a":"El Comité la dictamina y el Oficial de Cumplimiento envía el reporte a la Secretaría, por conducto de la Comisión","o":["El Comité la dictamina y el Oficial de Cumplimiento envía el reporte a la Secretaría, por conducto de la Comisión","El Oficial de Cumplimiento la dictamina y el Comité envía el reporte a la Secretaría, por conducto de la Comisión","El auditor interno la dictamina y el Oficial de Cumplimiento envía el reporte a la Secretaría, por conducto de la Comisión","El Comité la dictamina y el director general firma y envía el reporte a la Secretaría, por conducto de la Comisión"],"x":"Bancos 43ª VI: el Comité dictamina las operaciones que deban reportarse como Inusuales o Internas Preocupantes. Bancos 47ª V y VI: el OC coordina el seguimiento e investigaciones para que el Comité dictamine, y envía los reportes, informando al Comité en su siguiente sesión.","ref":"Bancos 43ª VI; 47ª V–VI · H4"},{"id":"D026","tema":"h4","tipo":"caso","q":"El Oficial de Cumplimiento de un centro cambiario prepara el informe que presentará al Comité para efectos de la fracción III de la disposición que fija las funciones del Comité. Conforme a esa fracción, ¿de qué debe conocer el Comité?","a":"De la celebración de Operaciones cuyas características pudieran generar un alto Riesgo","o":["De los Usuarios que por sus características se clasifiquen con Grado de Riesgo alto","De la celebración de Operaciones cuyas características pudieran generar un alto Riesgo","De los Clientes que por sus características se clasifiquen con Grado de Riesgo alto","De las Operaciones realizadas con personas incluidas en la Lista de Personas Bloqueadas durante el mes"],"x":"Centros 30ª III: el Comité conoce de la celebración de Operaciones cuyas características pudieran generar un alto Riesgo para el Centro Cambiario y formula recomendaciones. No se refiere a Clientes ni a Usuarios de riesgo alto (lo mismo ocurre en ITF art. 45 IV).","ref":"Centros 30ª III · H4","par":"D027"},{"id":"D027","tema":"h4","tipo":"caso","q":"El Oficial de Cumplimiento de una casa de cambio prepara el informe que presentará al Comité para efectos de la fracción III de la disposición que fija las funciones del Comité. Conforme a esa fracción, ¿de qué debe conocer el Comité?","a":"De los Usuarios que por sus características se clasifiquen con Grado de Riesgo alto","o":["De la celebración de Operaciones cuyas características pudieran generar un alto Riesgo","De las Operaciones realizadas con personas incluidas en la Lista de Personas Bloqueadas durante el mes","De los Usuarios que por sus características se clasifiquen con Grado de Riesgo alto","De los Clientes que por sus características se clasifiquen con Grado de Riesgo alto"],"x":"Casas de cambio 34a III: el Comité conoce de los Usuarios clasificados con Grado de Riesgo alto, conforme a los informes del OC (igual Transmisores, 32ª III). Bancos habla de Clientes (43ª III); Centros e ITF, de Operaciones de alto Riesgo.","ref":"Casas de cambio 34a III · H4","par":"D026"},{"id":"D028","tema":"h4","tipo":"caso","q":"Una institución de crédito prepara su programa anual de capacitación en PLD/FT. ¿Qué papel tienen el Comité y el Oficial de Cumplimiento?","a":"El Oficial de Cumplimiento define sus características, contenido y alcance, y el Comité aprueba los programas","o":["El Oficial de Cumplimiento define y aprueba los programas, y sólo informa al Comité en la siguiente sesión","El Comité define y aprueba los programas, y el área de recursos humanos los somete al comité de auditoría","El Comité define sus características, contenido y alcance, y el Oficial de Cumplimiento aprueba los programas","El Oficial de Cumplimiento define sus características, contenido y alcance, y el Comité aprueba los programas"],"x":"Bancos 47ª VIII: el OC define las características, contenido y alcance de los programas de capacitación (49ª). Bancos 43ª VII: el Comité aprueba los programas de capacitación del personal.","ref":"Bancos 43ª VII; 47ª VIII · H4"},{"id":"D029","tema":"h4","tipo":"caso","q":"El consejo de una institución de crédito designó el 2 de marzo las áreas cuyos titulares integrarán el Comité. ¿En qué plazo debe comunicar la integración inicial a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 15 días hábiles siguientes a la fecha en que el consejo designó las áreas","o":["Dentro de los 15 días hábiles siguientes a la fecha en que el consejo designó las áreas","Dentro de los 15 días naturales siguientes a la primera sesión que celebre el Comité","Dentro de los 10 días hábiles siguientes a la primera sesión que celebre el Comité","Dentro de los 30 días hábiles siguientes a la fecha en que el consejo designó las áreas"],"x":"Bancos 46ª: la integración inicial (nombre y apellidos sin abreviaturas y cargo de titulares y suplentes) se comunica dentro de los 15 días hábiles siguientes a la fecha en que el consejo designó las áreas. La designación, adición o sustitución de integrantes también se informa dentro de 15 días hábiles.","ref":"Bancos 46ª · H4"},{"id":"D030","tema":"h4","tipo":"cifra","q":"Una institución de tecnología financiera reduce su personal a 20 personas para el cumplimiento de sus fines y queda en el supuesto de no estar obligada a mantener el Comité. ¿En qué plazo debe comunicar esa situación a la Secretaría?","a":"Dentro de 60 días hábiles contados a partir de la fecha en que se reduzca el número de personas contratadas","o":["Dentro de 30 días hábiles contados a partir de la fecha en que se reduzca el número de personas contratadas","Dentro de 60 días hábiles contados a partir de la fecha en que se reduzca el número de personas contratadas","Dentro de 60 días naturales contados a partir de la fecha en que se reduzca el número de personas","Dentro de los 15 días hábiles siguientes a la fecha en que el consejo de administración acuerde disolver el Comité"],"x":"ITF art. 48, último párrafo: la ITF en el supuesto del último párrafo del art. 46 comunica esa situación dentro de 60 días hábiles contados desde su autorización o desde que se reduzca el número de personas contratadas. Los avisos de integración y cambios del Comité son de 15 días hábiles, como en Bancos.","ref":"ITF art. 48 · H4"},{"id":"D031","tema":"h4","tipo":"memoria","q":"En una institución de crédito que sí tiene Comité, ¿quién designa al Oficial de Cumplimiento y de entre quiénes?","a":"El consejo de administración o directivo, o el Comité, de entre los miembros del Comité","o":["El director general, de entre los funcionarios de las tres jerarquías inferiores a él","La asamblea de accionistas, de entre los consejeros independientes de la institución","El consejo de administración o directivo, o el Comité, de entre los miembros del Comité","El comité de auditoría, de entre los titulares de áreas ajenas a la promoción de productos"],"x":"Bancos 47ª: «El consejo de administración, directivo o el Comité de cada Entidad designará, de entre los miembros de dicho Comité, a un funcionario que se denominará Oficial de Cumplimiento.» Además debe ocupar un cargo dentro de las tres jerarquías inmediatas inferiores a la del director general.","ref":"Bancos 47ª · H4"},{"id":"D032","tema":"h4","tipo":"caso","q":"Una institución de crédito con 20 personas a su servicio no tiene Comité. ¿Quién designa a su Oficial de Cumplimiento y qué requisito debe reunir el designado?","a":"Su consejo de administración o directivo; el designado debe cumplir los requisitos para ser integrante del Comité","o":["Su director general; basta con que el designado sea empleado de la institución y no tenga funciones de auditoría","La Comisión, a propuesta del consejo de administración; el designado debe elegirse de entre funcionarios ya certificados","Su comité de auditoría; el designado debe ser un consejero independiente con experiencia en la materia","Su consejo de administración o directivo; el designado debe cumplir los requisitos para ser integrante del Comité"],"x":"Bancos 47ª, segundo párrafo: si la Entidad no cuenta con Comité por ubicarse en el último párrafo de la 44ª, el OC lo designa su consejo de administración o directivo, y debe cumplir los requisitos para ser integrante del Comité.","ref":"Bancos 47ª; 44ª últ. párr. · H4"},{"id":"D033","tema":"h4","tipo":"caso","q":"El consejo de una institución de crédito propone como Oficial de Cumplimiento a su gerente de crédito y captación, área que promueve los productos financieros de la entidad. Respecto del requisito de independencia, ¿es válida la designación?","a":"No, porque el OC debe ser independiente de las unidades encargadas de promover o gestionar los productos o servicios financieros","o":["No, porque el OC debe ser independiente de las unidades encargadas de promover o gestionar los productos o servicios financieros","No, porque el OC sólo puede designarse de entre consejeros que no desempeñen funciones ejecutivas ni comerciales en la entidad de que se trate","Sí, porque su DCG releva del requisito de independencia a la entidad que se ubica en el supuesto de exención del Comité","Sí, siempre que el auditor interno avale por escrito la designación y esta se informe al Comité en su siguiente sesión"],"x":"Bancos 47ª: la designación del OC debe recaer en un funcionario independiente de las unidades encargadas de promover o gestionar los productos o servicios financieros que la Entidad ofrezca a sus Clientes o Usuarios.","ref":"Bancos 47ª · H4","par":"D034"},{"id":"D034","tema":"h4","tipo":"caso","q":"El consejo de una sociedad cooperativa de ahorro y préstamo de nivel de operación I propone como Oficial de Cumplimiento a su gerente de crédito y captación, área que promueve los productos financieros de la entidad. Respecto del requisito de independencia, ¿es válida la designación?","a":"Sí, porque su DCG releva del requisito de independencia a la entidad que se ubica en el supuesto de exención del Comité","o":["No, porque el OC sólo puede designarse de entre consejeros que no desempeñen funciones ejecutivas ni comerciales en la entidad de que se trate","Sí, porque su DCG releva del requisito de independencia a la entidad que se ubica en el supuesto de exención del Comité","Sí, siempre que el auditor interno avale por escrito la designación y esta se informe al Comité en su siguiente sesión","No, porque el OC debe ser independiente de las unidades encargadas de promover o gestionar los productos o servicios financieros"],"x":"SOCAP 51ª: la independencia se exige «salvo que se cumpla con el criterio establecido en el último párrafo de la 48ª», es decir, que la Sociedad tenga nivel de operación I. En ese caso la DCG no la exige; la prohibición de funciones de auditoría interna sí se mantiene.","ref":"SOCAP 51ª; 48ª últ. párr. · H4","par":"D033"},{"id":"D035","tema":"h4","tipo":"caso","q":"Una unión de crédito tiene 8 personas a su servicio y activos totales por 60 millones de UDIS, y cuenta con 300 socios. Designa como Oficial de Cumplimiento a su gerente comercial, que promueve sus productos. ¿Cumple el requisito de independencia?","a":"Sí, porque su DCG no exige la independencia cuando la entidad se ubica en el supuesto de exención del Comité","o":["No, porque en ese supuesto el cargo de OC corresponde necesariamente al director general o a su equivalente en la entidad","Sí, porque el requisito de independencia sólo se exige a las entidades que forman parte de un grupo financiero","Sí, porque su DCG no exige la independencia cuando la entidad se ubica en el supuesto de exención del Comité","No, porque su DCG exige que el OC sea independiente de las unidades que promueven sus productos, aun sin Comité"],"x":"Uniones 38ª: la independencia de las unidades de promoción se exige «salvo que se cumpla con el criterio establecido en el último párrafo de la 35ª» (menos de 10 personas, menos de 500 socios y activos por menos de 100 millones de UDIS, a la vez). Esta Unión reúne las tres condiciones.","ref":"Uniones 38ª; 35ª últ. párr. · H4","par":"D036"},{"id":"D036","tema":"h4","tipo":"caso","q":"Una sociedad financiera popular tiene 8 personas a su servicio y activos totales por 60 millones de UDIS, y cuenta con 300 socios. Designa como Oficial de Cumplimiento a su gerente comercial, que promueve sus productos. ¿Cumple el requisito de independencia?","a":"No, porque su DCG exige que el OC sea independiente de las unidades que promueven sus productos, aun sin Comité","o":["No, porque en ese supuesto el cargo de OC corresponde necesariamente al director general o a su equivalente en la entidad","Sí, porque el requisito de independencia sólo se exige a las entidades que forman parte de un grupo financiero","Sí, porque su DCG no exige la independencia cuando la entidad se ubica en el supuesto de exención del Comité","No, porque su DCG exige que el OC sea independiente de las unidades que promueven sus productos, aun sin Comité"],"x":"SOFIPO 50ª: el OC debe ser independiente de las unidades que promueven o gestionan los productos, sin salvedad. Aunque la SOFIPO esté exenta del Comité por tener menos de 25 personas (47ª), la independencia se mantiene.","ref":"SOFIPO 50ª; 47ª últ. párr. · H4","par":"D035"},{"id":"D037","tema":"h4","tipo":"trampa","q":"Una institución de crédito pretende que su contralor, quien tiene funciones de auditoría interna, sea Oficial de Cumplimiento. ¿Qué afirmación es correcta?","a":"No puede, ni como titular ni como interino: la DCG prohíbe que el cargo recaiga en quien tenga funciones de auditoría interna","o":["No puede, ni como titular ni como interino: la DCG prohíbe que el cargo recaiga en quien tenga funciones de auditoría interna","Puede sólo como interino, hasta por 90 días naturales durante un año calendario, mientras el consejo designa a un nuevo titular","Puede, si el Comité aprueba la designación por mayoría de sus miembros y se informa a la Comisión dentro de 2 días hábiles","Puede, si la institución tiene menos de 25 personas a su servicio y, por tanto, está exenta de constituir y mantener el Comité"],"x":"Bancos 47ª: «En ningún caso, la designación del Oficial de Cumplimiento de una Entidad podrá recaer en persona que tenga funciones de auditoría interna.» Bancos 47ª Bis: el interino tampoco debe tener funciones de auditoría interna.","ref":"Bancos 47ª; 47ª Bis · H4"},{"id":"D038","tema":"h4","tipo":"caso","q":"Una SOFOM administrada por un administrador único sí tiene Comité de Comunicación y Control. ¿Quién puede designar a su Oficial de Cumplimiento?","a":"El administrador único o el Comité, de entre los miembros del Comité","o":["El director general, de entre los funcionarios de las tres jerarquías inferiores a él","El administrador único o el Comité, de entre los miembros del Comité","Sólo la asamblea de accionistas, porque la SOFOM no tiene consejo de administración","El Comité, de entre funcionarios que no sean sus miembros, para preservar su independencia"],"x":"SOFOM 39ª: «El consejo de administración, el administrador único o el Comité de cada Entidad designará, de entre los miembros de dicho Comité», al Oficial de Cumplimiento.","ref":"SOFOM 39ª · H4"},{"id":"D039","tema":"h4","tipo":"caso","q":"Una institución de crédito designa como Oficial de Cumplimiento a un funcionario que no cuenta con la certificación de la Comisión. Conforme a su DCG, ¿qué requisito de certificación aplica al cargo?","a":"Debe contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","o":["Su DCG no prevé un requisito de certificación para el Oficial de Cumplimiento","Debe obtener la certificación dentro de los 90 días naturales siguientes a su designación","Debe contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","Basta con la certificación del auditor externo independiente que evalúa anualmente a la entidad"],"x":"Bancos 47ª (párrafo adicionado DOF 28-ago-2024): el OC debe contar con la certificación vigente del art. 4, fr. X de la LCNBV. El plazo transitorio de 12 meses (Trans. Tercera IV) ya transcurrió, así que el requisito es exigible.","ref":"Bancos 47ª; Trans. Tercera IV (2024) · H4","par":"D040"},{"id":"D040","tema":"h4","tipo":"caso","q":"Una SOFOM designa como Oficial de Cumplimiento a un funcionario que no cuenta con la certificación de la Comisión. Conforme a su DCG, ¿qué requisito de certificación aplica al cargo?","a":"Su DCG no prevé un requisito de certificación para el Oficial de Cumplimiento","o":["Debe contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","Basta con la certificación del auditor externo independiente que evalúa anualmente a la entidad","Debe obtener la certificación dentro de los 90 días naturales siguientes a su designación","Su DCG no prevé un requisito de certificación para el Oficial de Cumplimiento"],"x":"SOFOM 39ª: su DCG no prevé requisito de certificación para el OC. Dentro de las DCG, lo exigen expresamente Bancos (47ª, «vigente») e ITF (art. 50 IV, «haber obtenido»).","ref":"SOFOM 39ª · H4","par":"D039"},{"id":"D041","tema":"h4","tipo":"memoria","q":"¿Cómo formula la DCG de Bancos el requisito de certificación del Oficial de Cumplimiento?","a":"Contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","o":["Contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","Haber obtenido la certificación del art. 4, fr. X de la Ley de la CNBV, conforme al art. 58, párrafo quinto, de la Ley Fintech","Renovar cada año ante la Comisión la certificación, antes de que la entidad presente el aviso de designación","Contar con la acreditación de la Secretaría como experto independiente en prevención de operaciones con recursos de procedencia ilícita"],"x":"Bancos 47ª: «deberá contar con la certificación vigente prevista en el artículo 4, fracción X de la Ley de la Comisión Nacional Bancaria y de Valores» (DOF 28-ago-2024).","ref":"Bancos 47ª · H4","par":"D042"},{"id":"D042","tema":"h4","tipo":"memoria","q":"¿Cómo formula la DCG de las ITF el requisito de certificación del Oficial de Cumplimiento?","a":"Haber obtenido la certificación del art. 4, fr. X de la Ley de la CNBV, conforme al art. 58, párrafo quinto, de la Ley Fintech","o":["Contar con la certificación vigente prevista en el art. 4, fr. X de la Ley de la CNBV","Haber obtenido la certificación del art. 4, fr. X de la Ley de la CNBV, conforme al art. 58, párrafo quinto, de la Ley Fintech","Renovar cada año ante la Comisión la certificación, antes de que la entidad presente el aviso de designación","Contar con la acreditación de la Secretaría como experto independiente en prevención de operaciones con recursos de procedencia ilícita"],"x":"ITF art. 50 IV: requisito de «Haber obtenido la certificación prevista en el artículo 4, fracción X» de la LCNBV, «de conformidad con el artículo 58, párrafo quinto de la Ley». La DCG no dice «vigente» ni fija plazo.","ref":"ITF art. 50 IV · H4","par":"D041"},{"id":"D043","tema":"h4","tipo":"cifra","q":"¿Qué plazo otorgó la reforma a la DCG de Bancos publicada en el DOF el 28 de agosto de 2024 para que el Oficial de Cumplimiento cuente con la certificación vigente?","a":"Doce meses contados a partir de la entrada en vigor de la resolución","o":["Seis meses contados a partir de la designación de cada Oficial de Cumplimiento","Doce meses contados a partir de que la Secretaría publique el formato oficial","Doce meses contados a partir de la entrada en vigor de la resolución","Dieciocho meses contados a partir de la entrada en vigor de la resolución"],"x":"Bancos, Trans. Tercera fr. IV de la resolución DOF 28-ago-2024: doce meses desde su entrada en vigor (al día siguiente de su publicación, Trans. Primera). Los dieciocho meses son para modificar el Manual (fr. I) y actualizar los sistemas automatizados (fr. III).","ref":"Bancos Trans. Tercera IV (2024) · H4"},{"id":"D044","tema":"h4","tipo":"trampa","q":"¿Qué afirmación sobre la certificación del Oficial de Cumplimiento de una casa de bolsa es correcta conforme a su DCG?","a":"Su DCG no prevé un requisito de certificación para el Oficial de Cumplimiento","o":["Debe contar con la certificación vigente, igual que en Bancos, desde la reforma de 2024","Sólo la requiere cuando el OC es común a otras entidades del mismo grupo financiero","Debe haber obtenido la certificación antes de su designación, igual que en las ITF","Su DCG no prevé un requisito de certificación para el Oficial de Cumplimiento"],"x":"Casas de bolsa 48ª: regula designación, jerarquía, independencia, prohibición de auditoría interna y OC común en grupo financiero, pero no prevé certificación. La reforma de 2024 sólo modificó la DCG de Bancos; la exigencia de ITF está en su art. 50 IV.","ref":"Casas de bolsa 48ª · H4"},{"id":"D045","tema":"h4","tipo":"caso","q":"El Oficial de Cumplimiento de una institución de crédito concluyó el diseño de la metodología de evaluación de Riesgos. Conforme a su DCG, ¿qué debe hacer con ella?","a":"Someterla a la aprobación del Comité, junto con los resultados de su implementación","o":["Someterla a la aprobación del Comité, junto con los resultados de su implementación","Presentarla al consejo, que la aprueba sin intervención del Comité de Comunicación y Control","Someterla a la aprobación del comité de auditoría, en los mismos términos que el Manual","Remitirla a la Comisión para su aprobación previa a su implementación en la institución"],"x":"Bancos 47ª I Bis: el OC somete a la aprobación del Comité la metodología de evaluación de Riesgos y los resultados de su implementación. Después, el Comité presenta al consejo los resultados de la implementación (43ª I Bis).","ref":"Bancos 47ª I Bis; 43ª I Bis · H4"},{"id":"D046","tema":"h4","tipo":"caso","q":"El Oficial de Cumplimiento de una institución de crédito envió a la Secretaría, por conducto de la Comisión, un reporte que consideró urgente. ¿Qué debe hacer después respecto del Comité?","a":"Informar de ello al Comité en su siguiente sesión","o":["Pedir a la Comisión que retenga el reporte hasta el dictamen","Informar de ello al Comité en su siguiente sesión","Informar al comité de auditoría dentro de 10 días hábiles","Pedir al Comité que ratifique el dictamen dentro de 24 horas"],"x":"Bancos 47ª VI: el OC envía los reportes de operaciones de la 41ª y los que considere urgentes, «e informar de ello al Comité, en su siguiente sesión».","ref":"Bancos 47ª VI · H4"},{"id":"D047","tema":"h4","tipo":"caso","q":"Antes de que el Comité de una institución de crédito dictamine un lote de operaciones, ¿qué debe verificar el área a cargo del Oficial de Cumplimiento o el personal que este designe?","a":"Que se hayan analizado las alertas correspondientes y documentado las investigaciones respectivas","o":["Que el auditor interno haya validado por escrito cada operación antes de presentarla al Comité","Que cada Cliente involucrado haya sido entrevistado y haya actualizado su expediente de identificación","Que se hayan analizado las alertas correspondientes y documentado las investigaciones respectivas","Que la Comisión haya emitido opinión previa sobre las operaciones que se someterán a dictamen"],"x":"Bancos 47ª V: el OC coordina el seguimiento de operaciones y las investigaciones para que el Comité cuente con los elementos para dictaminarlas; para ello, su área o el personal que designe verifica que se hayan analizado las alertas y documentado las investigaciones.","ref":"Bancos 47ª V · H4"},{"id":"D048","tema":"h4","tipo":"caso","q":"Por conducto de la Comisión llega a una institución de crédito una orden de aseguramiento de cuentas emitida por la autoridad competente en materia de PLD/FT. ¿A quién corresponde recibirla y verificar que la institución dé respuesta?","a":"Al Oficial de Cumplimiento","o":["Al Comité, en su siguiente sesión","Al director jurídico, sin participación del OC","Al auditor interno de la institución","Al Oficial de Cumplimiento"],"x":"Bancos 47ª IX: el OC recibe y verifica que la Entidad dé respuesta a los requerimientos de información y documentación y a las órdenes de aseguramiento o desbloqueo de cuentas que formulen las autoridades por conducto de la Comisión.","ref":"Bancos 47ª IX · H4"},{"id":"D049","tema":"h4","tipo":"caso","q":"Un cajero de una institución de crédito advierte un hecho de su jefe inmediato que podría constituir una Operación Interna Preocupante. ¿Qué área debe recibir directamente su aviso y darle seguimiento?","a":"El área a cargo del Oficial de Cumplimiento","o":["El área a cargo del Oficial de Cumplimiento","El superior jerárquico del jefe, que decide si lo turna","El área de auditoría interna, que lo dictamina de inmediato","El Comité, que lo recibe en sesión extraordinaria"],"x":"Bancos 47ª XI: el OC debe cerciorarse de que el área a su cargo reciba directamente y dé seguimiento a los reportes de empleados y funcionarios sobre hechos y actos susceptibles de ser Operaciones Inusuales o Internas Preocupantes (51ª VIII).","ref":"Bancos 47ª XI · H4"},{"id":"D050","tema":"h4","tipo":"caso","q":"El Oficial de Cumplimiento de una institución de crédito renuncia y deja el puesto. Conforme a su DCG, ¿qué procede respecto del cargo?","a":"Puede nombrarse un OC interino hasta por 90 días naturales durante un año calendario, contados desde que el OC deja el cargo","o":["El director general asume el cargo hasta que el consejo designe a un nuevo OC, sin que la DCG fije un plazo máximo para hacerlo","Puede nombrarse un OC interino hasta por 90 días naturales durante un año calendario, contados desde que el OC deja el cargo","Debe designarse un interino por 30 días hábiles, prorrogables una sola vez con autorización de la Comisión","Debe designarse un nuevo OC al día hábil siguiente; el interinato sólo procede cuando el OC está imposibilitado"],"x":"Bancos 47ª Bis: el Comité, el consejo o el director general podrá nombrar un OC interino hasta por 90 días naturales durante un año calendario, contados desde que el OC deje el cargo, le sea revocado o esté imposibilitado.","ref":"Bancos 47ª Bis · H4","par":"D051"},{"id":"D051","tema":"h4","tipo":"caso","q":"El Oficial de Cumplimiento de una institución de tecnología financiera renuncia y deja el puesto. Conforme a su DCG, ¿qué procede respecto del cargo?","a":"Debe designarse un nuevo OC al día hábil siguiente; el interinato sólo procede cuando el OC está imposibilitado","o":["El director general asume el cargo hasta que el consejo designe a un nuevo OC, sin que la DCG fije un plazo máximo para hacerlo","Puede nombrarse un OC interino hasta por 90 días naturales durante un año calendario, contados desde que el OC deja el cargo","Debe designarse un nuevo OC al día hábil siguiente; el interinato sólo procede cuando el OC está imposibilitado","Debe designarse un interino por 30 días hábiles, prorrogables una sola vez con autorización de la Comisión"],"x":"ITF art. 49: la designación del nuevo OC debe hacerse al día hábil siguiente a que el anterior deje el puesto, le sea revocado o quede imposibilitado; sólo en este último caso cabe el interino del art. 52 (hasta 90 días naturales por año calendario, de forma ininterrumpida o intermitente).","ref":"ITF arts. 49; 52 · H4","par":"D050"},{"id":"D052","tema":"h4","tipo":"cifra","q":"¿Hasta por cuánto tiempo puede desempeñarse un Oficial de Cumplimiento interino en una institución de crédito?","a":"Hasta por 90 días naturales durante un año calendario","o":["Hasta por 60 días naturales, prorrogables por igual plazo","Hasta por 90 días hábiles por cada ausencia del titular","Hasta por seis meses contados desde la revocación del titular","Hasta por 90 días naturales durante un año calendario"],"x":"Bancos 47ª Bis: «hasta por noventa días naturales durante un año calendario». El mismo límite rige en todos los sujetos que prevén interino; Asesores en inversiones no lo prevé.","ref":"Bancos 47ª Bis · H4"},{"id":"D053","tema":"h4","tipo":"caso","q":"El Oficial de Cumplimiento de una institución de crédito queda imposibilitado. ¿Quién puede nombrar a un Oficial de Cumplimiento interino?","a":"El Comité, el consejo de administración o directivo, o el director general","o":["El Comité, el consejo de administración o directivo, o el director general","El propio OC imposibilitado, mediante designación por escrito al Comité","Sólo el consejo de administración, con aviso previo a la Comisión","Sólo el Comité, de entre sus miembros, por mayoría de los presentes"],"x":"Bancos 47ª Bis: «El Comité de cada Entidad o bien, su consejo de administración o directivo, según corresponda, o director general, podrá nombrar a un Oficial de Cumplimiento Interino». El interino no debe tener funciones de auditoría interna.","ref":"Bancos 47ª Bis · H4"},{"id":"D054","tema":"h4","tipo":"caso","q":"En marzo y abril, una institución de crédito tuvo un Oficial de Cumplimiento interino durante 50 días naturales. En octubre del mismo año el titular vuelve a quedar imposibilitado. ¿Por cuánto tiempo más puede nombrar un interino en ese año calendario?","a":"Hasta 40 días naturales, porque el límite es de 90 días naturales durante un año calendario","o":["Hasta 40 días naturales, siempre que la Comisión autorice previamente fraccionar el periodo","Hasta 40 días naturales, porque el límite es de 90 días naturales durante un año calendario","Hasta 40 días hábiles, porque el límite es de 90 días hábiles durante un año calendario","Hasta 90 días naturales más, porque el plazo se renueva con cada nueva ausencia del titular"],"x":"Bancos 47ª Bis: el límite es de 90 días naturales durante un año calendario, y las Entidades pueden hacer efectivo el periodo de interinato conforme a sus necesidades (no exige autorización). Ya usó 50, le quedan 40.","ref":"Bancos 47ª Bis · H4"},{"id":"D055","tema":"h4","tipo":"caso","q":"Una institución de crédito designa a un nuevo Oficial de Cumplimiento. ¿En qué plazo debe informar su nombre a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 2 días hábiles siguientes a la designación","o":["Dentro de los 15 días hábiles siguientes a la designación","Al día hábil siguiente a la fecha de la designación","Dentro de los 2 días hábiles siguientes a la designación","Dentro de los 10 días hábiles siguientes a la designación"],"x":"Bancos 48ª I (modificada DOF 28-ago-2024): el nombre completo sin abreviaturas del OC se informa dentro de los 2 días hábiles siguientes a la designación. Sólo Casas de cambio (39a I) comparte ese plazo.","ref":"Bancos 48ª I · H4","par":"D056"},{"id":"D056","tema":"h4","tipo":"caso","q":"Una SOFOM designa a un nuevo Oficial de Cumplimiento. ¿En qué plazo debe informar su nombre a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 10 días hábi
