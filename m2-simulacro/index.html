<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulador con los bancos de las herramientas del Módulo 2 (Área 2 del temario CNBV PLD/FT, agosto 2026), en proporción a sus temas.">
<title>Simulacro mixto del Módulo 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta y tipografía: guía de diseño 360Educa (27-sep-2026). Principal = color de la ruta; acentos morado, turquesa, amarillo, coral, carbón y negro (verde sólo en ruta financiera). Botones en morado. Montserrat + Inter. Sin sombras.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#747975; --accion:#a663cc; --accion-ink:#ffffff;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--oscuro);
  --line:rgba(57,62,65,.16);
  --shadow:0 0 0 0 transparent;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#ffffff;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.14)}
:root[data-ruta="transversal"]{--principal:#80bcb5;--principal-ink:#1b1b1e;--principal-linea:#80bcb5;--principal-halo:rgba(128,188,181,.22)}
:root[data-ruta="gratuito"]{--principal:#faa916;--principal-ink:#1b1b1e;--principal-linea:#faa916;--principal-halo:rgba(250,169,22,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accion);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta de la guía 360Educa: el principal sale de la ruta; acentos de la guía (verde sólo en ruta financiera) */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#ffffff;--cl:#a663cc}
.c-turquesa{--c:#80bcb5;--ci:#1b1b1e;--cl:#80bcb5}
.c-amarillo{--c:#faa916;--ci:#1b1b1e;--cl:#faa916}
.c-coral{--c:#ff8361;--ci:#1b1b1e;--cl:#ff8361}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--accion);border-color:var(--accion);color:var(--accion-ink);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--accion);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--accion);color:var(--accion-ink)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rhythm.many{flex-wrap:wrap;gap:8px}.rhythm.many .rh{flex:1 1 calc(25% - 8px);padding:10px}.rhythm.many .rh .big{font-size:clamp(30px,3.6vw,44px)}.rhythm.many .rh .lb,.rhythm.many .rh .q{font-size:14px}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map.nmany{grid-template-areas:"izq core der"}
.map .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.map .col.izq{grid-area:izq}.map .col.der{grid-area:der}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:normal;max-width:11em;overflow-wrap:break-word;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode,.rpb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small,.rpb small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"],.rpb[aria-pressed="true"]{background:var(--accion);border-color:var(--accion);color:var(--accion-ink)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}

ria.","ref":"DCG Bancos 1ª · H1"},{"id":"A002","tema":"h1","tipo":"caso","q":"Una persona tiene celebrado con una SOFOM un contrato de arrendamiento financiero. Para las DCG de SOFOM, ¿qué es esa persona?","a":"Cliente, porque utiliza los servicios de la SOFOM al amparo de un contrato","o":["Usuario, porque no es acreditada de la SOFOM ni tiene una cuenta abierta con ella","Usuario, porque la SOFOM no capta recursos y no hay cuenta","Cliente, porque utiliza los servicios de la SOFOM al amparo de un contrato","Cliente sólo si además tiene un crédito vigente con la SOFOM"],"x":"En la SOFOM, Cliente es quien es acreditado o quien utiliza, al amparo de un contrato, sus servicios (2ª III a y b). El Usuario es quien no contrató crédito, arrendamiento financiero ni factoraje financiero (2ª XXXVI). El distractor tentador supone que sólo el acreditado es Cliente; el inciso b) amplía la figura a quien opera al amparo de un contrato.","ref":"DCG SOFOM 2ª III y XXXVI · H1"},{"id":"A003","tema":"h1","tipo":"memoria","q":"¿Qué DCG tienen como fundamento el art. 212 de la Ley del Mercado de Valores?","a":"Las de Casas de bolsa","o":["Las de Casas de bolsa","Las de Asesores en inversiones","Las de Fondos de inversión","Las de Uniones de crédito"],"x":"La 1ª de Casas de bolsa remite al art. 212 de la LMV. El distractor tentador es Asesores en inversiones, que también es bursátil pero se funda en otro artículo de la misma ley (226 Bis LMV); Fondos se funda en el art. 91 de la LFI y Uniones en el art. 129 de la LUC.","ref":"DCG Casas de bolsa 1ª; DCG Asesores 1ª · H1"},{"id":"A004","tema":"h1","tipo":"caso","q":"Una SOFOM no regulada pregunta qué artículo da fundamento a las DCG que debe cumplir. ¿Cuál es?","a":"El art. 95 Bis de la LGOAAC","o":["El art. 87-D de la LGOAAC, que remite al art. 115 de la LIC","El art. 115 de la LIC, igual que a las instituciones de crédito","El art. 95 de la LGOAAC, igual que a las casas de cambio","El art. 95 Bis de la LGOAAC"],"x":"La 1ª de SOFOM tiene fundamento doble: para las reguladas, el 115 LIC (y 71-72 LRASCAP, 124 LACP y 129 LUC) por remisión del art. 87-D LGOAAC; para las no reguladas, el art. 95 Bis LGOAAC. El distractor tentador (87-D) es el fundamento de la SOFOM regulada. A Bancos lo funda el 115 LIC y a las casas de cambio el 95 LGOAAC.","ref":"DCG SOFOM 1ª · H1"},{"id":"A005","tema":"h1","tipo":"caso","q":"Una SOFOM regulada, además de otorgar crédito, empieza a transmitir dinero (art. 81-A Bis LGOAAC). Respecto de esas transmisiones, ¿qué DCG debe cumplir?","a":"Las DCG de transmisores de dinero, en lo conducente","o":["Las DCG de transmisores de dinero, en lo conducente","Sólo las DCG de SOFOM, porque su objeto ya cubre todos sus productos","Las DCG de Bancos, por la remisión del art. 87-D al art. 115 de la LIC","Las DCG de centros cambiarios, por tratarse de un servicio del art. 95 Bis"],"x":"La 1ª de SOFOM dispone que las SOFOM que realicen las actividades del art. 81-A Bis LGOAAC cumplirán, en lo conducente, las DCG del art. 95 Bis aplicables a los transmisores de dinero, únicamente cuando lleven a cabo esas transmisiones. El distractor tentador («sólo las de SOFOM») ignora esa remisión expresa.","ref":"DCG SOFOM 1ª · H1"},{"id":"A006","tema":"h1","tipo":"memoria","q":"¿Qué DCG incluyen entre sus objetos (primera disposición o art. 1) prever la forma y términos en que se presenta a la CNBV el Manual de Cumplimiento?","a":"Las de las ITF","o":["Las de las ITF","Las de Bancos","Las de Casas de bolsa","Las de Transmisores de dinero"],"x":"El art. 1 de las DCG de ITF tiene cinco fracciones; la II es prever la forma y los términos para presentar a la CNBV el Manual de Cumplimiento. Bancos también remite su Manual a la CNBV, pero lo regula en la 64ª, no en su objeto (1ª), que sólo tiene las medidas mínimas y los reportes.","ref":"DCG ITF art. 1 fr. II; DCG Bancos 1ª y 64ª · H1"},{"id":"A007","tema":"h1","tipo":"memoria","q":"¿Qué DCG liberan, para las actividades de los arts. 39 Bis fr. V y 40 Bis de su ley, de ciertos capítulos y de las obligaciones de Cuentas Concentradoras?","a":"Las de Fondos de inversión","o":["Las de Casas de bolsa","Las de Fondos de inversión","Las de Asesores en inversiones","Las de SOFIPO"],"x":"La 1ª de Fondos de inversión (fundamento: art. 91 LFI) dispone que, respecto de las actividades del art. 39 Bis fr. V y del último párrafo del art. 40 Bis de la LFI, no se cumplen los Caps. IV y XIII, ciertas fracciones de la 46ª, el segundo párrafo de la 20ª ni las obligaciones de Cuentas Concentradoras. Casas de bolsa y Asesores son bursátiles, pero sus DCG no tienen esa salvedad.","ref":"DCG Fondos 1ª · H1"},{"id":"A008","tema":"h1","tipo":"caso","q":"En la misma plaza operan una casa de cambio y un centro cambiario. ¿Qué artículo de la LGOAAC fundamenta las DCG de cada uno?","a":"Casa de cambio, art. 95; centro cambiario, art. 95 Bis","o":["Casa de cambio, art. 95; centro cambiario, art. 95 Bis","Ambos, art. 95 Bis, por realizar compraventa de divisas","Casa de cambio, art. 95 Bis; centro cambiario, art. 95","Ambos, art. 95, por ser actividades auxiliares del crédito"],"x":"La 1ª de Casas de cambio remite al art. 95 LGOAAC; la de Centros cambiarios, al art. 95 Bis (que también funda las de transmisores y SOFOM no reguladas). El distractor tentador agrupa a ambos en el 95 Bis porque los dos cambian divisas, pero la casa de cambio es entidad autorizada con artículo propio.","ref":"DCG Casas de cambio 1ª; DCG Centros cambiarios 1ª · H1"},{"id":"A009","tema":"h1","tipo":"memoria","q":"La 2ª fr. XXXVI de las DCG de Bancos define a los «Sujetos Obligados» de otras leyes. ¿A quién exceptúa expresamente?","a":"A los centros cambiarios","o":["A los centros cambiarios","A los transmisores de dinero","A las SOFOM no reguladas","A los asesores en inversiones"],"x":"La fr. XXXVI enumera a los sujetos de diversas leyes (124 LACP, 71-72 LRASCAP, 91 LFI, 212 y 226 Bis LMV, 129 LUC, 95 y 95 Bis LGOAAC, 58 LRITF, entre otros) «exceptuando a los centros cambiarios». Transmisores y SOFOM no reguladas también caen en el 95 Bis, pero no se excluyen.","ref":"DCG Bancos 2ª XXXVI · H1"},{"id":"A010","tema":"h1","tipo":"memoria","q":"¿En qué DCG el sujeto obligado incluye a las sociedades financieras comunitarias de niveles I a IV y a los Organismos de Integración Financiera Rural?","a":"En las de SOFIPO","o":["En las de SOFIPO","En las de SOCAP","En las de Uniones de crédito","En las de SOFOM"],"x":"La 2ª fr. XI de SOFIPO define «Entidades» como las sociedades financieras populares, las sociedades financieras comunitarias con niveles de operación I a IV y los Organismos de Integración Financiera Rural. El distractor tentador es SOCAP, también de ahorro popular, pero su sujeto obligado son sólo las cooperativas de ahorro y préstamo de niveles I a IV.","ref":"DCG SOFIPO 2ª XI · H1"},{"id":"A011","tema":"h1","tipo":"memoria","q":"Según su 2ª, ¿a qué sociedades cooperativas de ahorro y préstamo obligan las DCG de SOCAP?","a":"A las que tienen niveles de operación I a IV","o":["A todas, sin importar su nivel de operación","Sólo a las de niveles III y IV, que captan más recursos","A las que tienen niveles de operación I a IV","Sólo a las que además están afiliadas al Fondo de Protección"],"x":"La 2ª fr. XXXV define «Sociedades» como las SOCAP con niveles de operación del I al IV. No es «todas»: la definición acota por nivel. Ojo con no confundirla con SOFIPO, cuyo sujeto obligado agrega a SOFINCO y Organismos de Integración Financiera Rural.","ref":"DCG SOCAP 2ª XXXV · H1"},{"id":"A012","tema":"h1","tipo":"caso","q":"Una persona sin cuenta en un banco acude a una sucursal a cambiar dólares en efectivo; la operación inicia y concluye en ese acto. Para las DCG de Bancos, ¿qué es?","a":"Usuario, porque no es cuentahabiente y el acto es de ejecución instantánea","o":["Cliente, porque realiza una Operación con la institución de crédito","Cliente ocasional, figura intermedia que prevén las DCG de Bancos","Usuario, porque no es cuentahabiente y el acto es de ejecución instantánea","Usuario sólo si la operación es menor a 500 USD; si la iguala o la supera, Cliente"],"x":"La 2ª XXXVIII define al Usuario como quien opera sin relación comercial permanente, y aclara que no la hay cuando no es cuentahabiente y el acto es de ejecución instantánea. El monto no convierte al Usuario en Cliente: sólo cambia lo que se recaba de él (17ª). Las DCG no prevén un «cliente ocasional».","ref":"DCG Bancos 2ª IV y XXXVIII; 17ª · H1"},{"id":"A013","tema":"h1","tipo":"trampa","q":"¿Cuál de estas DCG NO define la figura de Usuario?","a":"La de Uniones de crédito","o":["La de Casas de bolsa","La de Sociedades financieras populares","La de SOFOM","La de Uniones de crédito"],"x":"Trampa: «el Usuario existe en todas las DCG». Falso. Sólo tienen Cliente: Asesores, Fondos, Uniones (2ª III: socios o terceros) e ITF. Sólo tienen Usuario: Casas de cambio, Centros cambiarios y Transmisores. Casas de bolsa, SOFIPO y SOFOM tienen ambas figuras, como Bancos.","ref":"DCG Uniones 2ª III; DCG Casas de bolsa 2ª XXXVII; DCG SOFIPO 2ª XXXIX; DCG SOFOM 2ª XXXVI · H1"},{"id":"A014","tema":"h1","tipo":"caso","q":"La misma persona, sin cuenta ni contrato, hace una operación aislada en un banco y otra en un fondo de inversión. ¿Cómo la califica cada DCG?","a":"En el banco, Usuario; en el fondo, Cliente, porque su DCG no tiene Usuario","o":["En ambos, Usuario, porque no hay relación comercial permanente","En el banco, Cliente; en el fondo, Usuario, porque no celebró contrato con él","En ambos, Cliente, porque las dos DCG definen así a quien opera","En el banco, Usuario; en el fondo, Cliente, porque su DCG no tiene Usuario"],"x":"Bancos distingue Cliente (cuentahabiente o con contrato) y Usuario (sin relación comercial permanente). Las DCG de Fondos sólo definen Cliente: «cualquier persona física, moral o Fideicomiso que realice Operaciones con las Entidades» (2ª III). El distractor tentador aplica a Fondos la lógica de Bancos.","ref":"DCG Bancos 2ª IV y XXXVIII; DCG Fondos 2ª III · H1"},{"id":"A015","tema":"h1","tipo":"memoria","q":"¿En qué DCG el Usuario se presenta en dos modalidades, Usuario Remitente y Usuario Beneficiario?","a":"En las de Transmisores de dinero","o":["En las de Casas de cambio","En las de Transmisores de dinero","En las de Centros cambiarios","En las de Sociedades financieras populares"],"x":"La 2ª fr. XXXIX de Transmisores define al Usuario en dos supuestos: el Remitente (quien contrata el envío) y el Beneficiario (quien recibe los recursos). Casas de cambio y Centros cambiarios también tienen sólo Usuario, pero sin esas modalidades.","ref":"DCG Transmisores 2ª XXXIX · H1"},{"id":"A016","tema":"h1","tipo":"caso","q":"Una ITF realiza operaciones a través de un fideicomiso para recibir recursos de sus clientes. Según sus DCG, ¿cómo se tratan esas operaciones?","a":"Se les aplica lo relativo a las Cuentas Concentradoras","o":["El fideicomiso se identifica como Cliente, igual que en las DCG de Bancos","Se les aplica lo relativo a las Cuentas Concentradoras","El fideicomiso es Usuario, porque no tiene relación comercial permanente","Quedan fuera de las DCG, porque la ITF sólo identifica a personas físicas"],"x":"El art. 2 fr. IV define al Cliente de la ITF sólo como persona física o moral (sin Fideicomiso, a diferencia de Bancos), y la fr. VII dispone que a las operaciones que las ITF realicen a través de fideicomisos les es aplicable lo relativo a las Cuentas Concentradoras. No quedan fuera de las DCG ni se convierten en Usuario.","ref":"DCG ITF art. 2 fr. IV y VII · H1"},{"id":"A017","tema":"h1","tipo":"cifra","q":"Una institución de crédito modifica su Manual de Cumplimiento. ¿En qué plazo debe remitir a la CNBV las modificaciones con un ejemplar completo?","a":"Dentro de los 20 días hábiles siguientes a que las apruebe su comité de auditoría","o":["Dentro de los 20 días naturales siguientes a que las apruebe su consejo","Dentro de los 30 días hábiles siguientes a que las apruebe el Comité de Comunicación y Control","Dentro de los 10 días hábiles siguientes a que las elabore el Oficial de Cumplimiento","Dentro de los 20 días hábiles siguientes a que las apruebe su comité de auditoría"],"x":"La 64ª fija 20 días hábiles contados desde que el comité de auditoría aprueba las modificaciones; el Comité de Comunicación y Control sólo se las somete (43ª fr. I). El distractor tentador cambia hábiles por naturales: el plazo es en días hábiles.","ref":"DCG Bancos 64ª; 43ª fr. I · H1"},{"id":"A018","tema":"h1","tipo":"caso","q":"Un asesor en inversiones modifica su Manual de Cumplimiento. ¿Desde cuándo corren los 20 días hábiles para remitir las modificaciones a la CNBV?","a":"Desde que su Representante elabora las modificaciones","o":["Desde que su comité de auditoría aprueba las modificaciones","Desde que su consejo de administración las aprueba, previa opinión del Comité","Desde que la CNBV le requiere el ejemplar completo del Manual","Desde que su Representante elabora las modificaciones"],"x":"Igual que Bancos en el plazo (20 días hábiles), salvo el punto de partida: en Asesores corre desde que el Representante elabora las modificaciones (30ª fr. II), porque no tienen comité de auditoría ni Comité de Comunicación y Control. El distractor tentador traslada la regla de Bancos.","ref":"DCG Asesores 38ª; 30ª fr. II · H1"},{"id":"A019","tema":"h1","tipo":"caso","q":"Una SOCAP aprueba modificaciones a su Manual de Cumplimiento. Además de remitirlas a la CNBV, ¿a quién debe enviarlas según su DCG?","a":"Al Comité de Supervisión Auxiliar","o":["Al Comité de Supervisión de su Federación","A la CONDUSEF, por ser sociedad de ahorro popular","A la Unidad de Inteligencia Financiera de la SHCP","Al Comité de Supervisión Auxiliar"],"x":"La 67ª de SOCAP, último párrafo, ordena enviar el Manual y sus modificaciones también al Comité de Supervisión Auxiliar (órgano del Fondo de Protección). El distractor tentador es el «Comité de Supervisión», que corresponde a la SOFIPO (su 67ª). Fuera de ese envío adicional, el plazo es igual que en Bancos; la aprobación también, salvo que sin comité de auditoría aprueba su propio Comité (47ª fr. I).","ref":"DCG SOCAP 67ª; DCG SOFIPO 67ª · H1"},{"id":"A020","tema":"h1","tipo":"memoria","q":"En una ITF, ¿quién aprueba las modificaciones al Manual de Cumplimiento, desde cuya aprobación corren los 20 días hábiles para remitirlas a la CNBV?","a":"Su comisario, comité de auditoría o Comité, en su caso","o":["Sólo su comité de auditoría, como en Bancos","Su Oficial de Cumplimiento, con el visto bueno del consejo","Su comisario, comité de auditoría o Comité, en su caso","Su comité de riesgos, a propuesta del Comité de Comunicación y Control"],"x":"El art. 83 de las DCG de ITF admite tres órganos: comisario, comité de auditoría o Comité (de Comunicación y Control), según corresponda. El distractor tentador reduce la regla a la de Bancos (sólo comité de auditoría). El comité de riesgos aprueba en Bancos el modelo de riesgo de clientes, no el Manual.","ref":"DCG ITF art. 83 · H1"},{"id":"A021","tema":"h1","tipo":"cifra","q":"En el expediente presencial de una persona física en un banco, ¿qué antigüedad máxima puede tener el comprobante de domicilio?","a":"No mayor a 3 meses a su fecha de emisión","o":["No mayor a 3 meses a su fecha de emisión","No mayor a 6 meses a su fecha de emisión","No mayor a 1 año a su fecha de emisión","No mayor a 2 meses a su fecha de emisión"],"x":"La 4ª fr. I exige copia del comprobante de domicilio con antigüedad no mayor a tres meses a su fecha de emisión. El distractor tentador de 6 meses confunde esta cifra con la del perfil y el grado de riesgo iniciales.","ref":"DCG Bancos 4ª fr. I · H1"},{"id":"A022","tema":"h1","tipo":"caso","q":"Un Usuario compra 800 USD en efectivo en la ventanilla de un banco y paga con pesos. Según la 17ª, ¿qué debe hacer el banco?","a":"Recabar y conservar en sus sistemas los datos de identificación del Usuario","o":["Integrar el expediente completo de la 4ª antes de realizar la compra de divisas","Recabar sus datos y, además, copia de su identificación oficial","Recabar y conservar en sus sistemas los datos de identificación del Usuario","Nada todavía: la obligación de recabar datos empieza en 1,000 USD"],"x":"La 17ª fr. I obliga a recabar datos del Usuario en operaciones individuales en efectivo iguales o superiores a 500 USD; la copia de la identificación se exige de 3,000 a menos de 5,000 USD, y el expediente de la 4ª desde 5,000 USD. El umbral de 1,000 USD es el de las casas de cambio y el de transferencias de Usuarios en Bancos (16ª II), no el del efectivo.","ref":"DCG Bancos 17ª fr. I · H1"},{"id":"A023","tema":"h1","tipo":"cifra","q":"Un Usuario quiere comprar en una casa de cambio dólares en efectivo por 800 USD, pagando en pesos. Según los escalones de la 4a de su DCG, ¿desde qué monto debe recabarse su información?","a":"Desde 1,000 USD por operación individual","o":["Desde 1,000 USD por operación individual","Desde 500 USD por operación individual","Desde 3,000 USD por operación individual","Desde 5,000 USD por operación individual"],"x":"Igual que Bancos en la lógica de escalones, salvo los montos: en Casas de cambio el primer escalón es de 1,000 a menos de 3,000 USD (sólo datos), luego 3,000 a menos de 5,000 (más copia de la identificación) y desde 5,000 el expediente. El distractor tentador, 500 USD, es el umbral de efectivo de Bancos y el de Transmisores. Ojo: si el Usuario VENDE dólares en efectivo (la casa de cambio los recibe), no aplican los escalones: la 4a remite únicamente al Cap. III Bis, que exige datos y copia de identificación con independencia del monto (24ª Bis).","ref":"DCG Casas de cambio 4a fr. I a III y último párr.; 24ª Bis; DCG Bancos 17ª · H1"},{"id":"A024","tema":"h1","tipo":"caso","q":"Un Usuario envía desde México a Estados Unidos el equivalente a 800 USD mediante un transmisor de dinero. ¿Qué debe recabar el transmisor?","a":"Datos de la transferencia y del remitente sin importar el monto, los del beneficiario por ser envío internacional, y los datos del escalón de 500 USD","o":["Ninguno, porque la operación de 800 USD es inferior al primer escalón de 1,000 USD que fija su DCG","Datos de la transferencia y del remitente sin importar el monto, los del beneficiario por ser envío internacional, y los datos del escalón de 500 USD","Datos y copia de la identificación oficial del remitente, sin recabar ningún dato del beneficiario del envío","El expediente completo del remitente antes de operar, con su comprobante de domicilio y la entrevista presencial"],"x":"Igual que Bancos, salvo Transmisores: su 4ª fr. I, inciso A, exige con independencia del monto los datos de la transferencia y del Usuario Remitente; los del Usuario Beneficiario se agregan en transferencias nacionales en moneda extranjera o internacionales (como este envío a Estados Unidos) y, cuando el transmisor paga como receptor, en el inciso B. La fr. II agrega datos de 500 a menos de 3,000 USD; la copia de la identificación es de 3,000 a menos de 5,000 (fr. III) y el expediente desde 5,000 (fr. IV). El escalón de 1,000 USD es el de casas de cambio y centros cambiarios. Ojo: en un envío nacional en pesos, la fr. I no pide los datos del beneficiario.","ref":"DCG Transmisores 4ª fr. I (incisos A y B) y fr. II · H1"},{"id":"A025","tema":"h1","tipo":"caso","q":"Una persona quiere hacerse socia de una SOCAP y entregar en ventanilla su aportación al capital social. ¿Cuándo debe integrarse su expediente?","a":"Previamente a recibir la aportación al capital social","o":["Después de recibir la aportación, al abrir su primera cuenta de ahorro","Sólo si la aportación supera el equivalente a 3,000 UDIS","Cuando la asamblea la admita formalmente como socia, al cierre del ejercicio","Previamente a recibir la aportación al capital social"],"x":"Igual que Bancos (expediente previo), salvo que en la SOCAP el expediente también es previo a recibir aportaciones al capital social, además de abrir cuentas o celebrar contratos (4ª). No hay umbral en UDIS para esta obligación.","ref":"DCG SOCAP 4ª · H1"},{"id":"A026","tema":"h1","tipo":"caso","q":"Una IFPE abre de forma remota una cuenta a una persona física que sólo hará pagos nacionales con fondos de pago electrónico, sin efectivo, activos virtuales ni envíos al extranjero. ¿Debe entrevistarla?","a":"No; su DCG exige entrevista sólo con efectivo, activos virtuales o transferencias internacionales","o":["Sí, siempre y de forma presencial, previo a la relación, como lo exige la 7ª de las DCG de Bancos","No; su DCG exige entrevista sólo con efectivo, activos virtuales o transferencias internacionales","Sí, aunque puede hacerla vía remota con cuestionarios automatizados","Sólo si sus operaciones superan el equivalente a 3,000 UDIS al mes"],"x":"Igual que Bancos, salvo la ITF: el art. 11 exige la entrevista sólo en cuentas o contratos que amparen operaciones en efectivo, con activos virtuales o transferencias internacionales, y en ese caso puede ser remota. El distractor tentador (remota con cuestionarios) describe cómo se hace la entrevista cuando sí procede, no este caso.","ref":"DCG ITF art. 11 · H1"},{"id":"A027","tema":"h1","tipo":"memoria","q":"¿Qué regula la fracción IV Bis de la 4ª de las DCG de Bancos?","a":"El expediente de dependencias y entidades públicas del Anexo 1 con grado de riesgo distinto al bajo","o":["El expediente simplificado de las sociedades y entidades del Anexo 1 con riesgo bajo","El expediente de los fideicomisos que actúan como Usuarios de la institución de crédito","El expediente de dependencias y entidades públicas del Anexo 1 con grado de riesgo distinto al bajo","El expediente de personas morales extranjeras con documentos legalizados o apostillados"],"x":"La IV Bis (adicionada en la reforma de 28-ago-2024) regula a dependencias y entidades públicas y demás personas morales de derecho público del Anexo 1 clasificadas con riesgo distinto al bajo. La fr. IV es la que prevé el régimen simplificado del Anexo 1 con riesgo bajo; los fideicomisos Usuarios están en la 4ª Bis. Sólo Bancos tiene la IV Bis.","ref":"DCG Bancos 4ª fr. IV y IV Bis · H1"},{"id":"A028","tema":"h1","tipo":"trampa","q":"¿Cuál de estos sujetos NO tiene en su DCG una fracción para integrar el expediente de un Fideicomiso como Cliente?","a":"La ITF","o":["Bancos","Casas de bolsa","SOFOM","La ITF"],"x":"Trampa: suponer que todas identifican fideicomisos como Clientes. Las DCG de ITF definen al Cliente sólo como persona física o moral; su art. 11 no tiene fracción de Fideicomisos (sólo menciona al fideicomiso cuando es el Propietario Real) y las operaciones a través de fideicomisos se tratan como Cuenta Concentradora. Bancos (4ª IX), Casas de bolsa (4ª X) y SOFOM (4ª IX) sí la tienen.","ref":"DCG ITF arts. 2 fr. IV y VII, y 11; DCG Bancos 4ª IX · H1"},{"id":"A029","tema":"h1","tipo":"memoria","q":"Según la 4ª Ter de las DCG de Bancos, ¿a quién puede abrirse una cuenta no presencial por Dispositivos y qué dato debe obtenerse como regla general?","a":"A personas físicas o morales de nacionalidad mexicana; la Geolocalización del Dispositivo","o":["A personas físicas mexicanas o extranjeras residentes; una videollamada grabada","A personas físicas o morales de nacionalidad mexicana; la Geolocalización del Dispositivo","Sólo a personas físicas mexicanas; la e.firma como único requisito de consentimiento","A personas físicas o morales mexicanas y extranjeras; la CURP validada en línea ante el RENAPO"],"x":"La 4ª Ter permite la apertura no presencial por Dispositivos a Clientes personas físicas o morales, ambas de nacionalidad mexicana, conforme a las disposiciones que emita la CNBV, y exige obtener la Geolocalización del Dispositivo, además del consentimiento (que podrá darse con Firma Electrónica o Firma Electrónica Avanzada) y demás datos. No incluye extranjeros. Salvo las entidades del Anexo 1 con riesgo bajo, sin Geolocalización no se abre.","ref":"DCG Bancos 4ª Ter · H1"},{"id":"A030","tema":"h1","tipo":"caso","q":"Una SOFOM no regulada quiere otorgar en forma no presencial un crédito sin garantía inmobiliaria de 50,000 UDIS a una persona física mexicana. ¿Qué mecanismo de su Anexo 2 le corresponde?","a":"El del art. 5, cuyo tope es de 60,000 UDIS","o":["El del art. 4, cuyo tope es de 60,000 UDIS","El del art. 4, cuyo tope es de 100,000 UDIS","Ninguno: su Anexo 2 sólo cubre depósitos de hasta 30,000 UDIS al mes","El del art. 5, cuyo tope es de 60,000 UDIS"],"x":"En el Anexo 2 de SOFOM (art. 2), para créditos sin garantía inmobiliaria, el mecanismo del art. 4 llega a 30,000 UDIS y el del art. 5 a 60,000 UDIS. Con 50,000 UDIS se rebasa el art. 4, así que corresponde el art. 5. El distractor tentador atribuye al art. 4 el tope de 60,000, que es el de la SOCAP en crédito.","ref":"DCG SOFOM 4ª Ter; Anexo 2 art. 2 · H1"},{"id":"A031","tema":"h1","tipo":"caso","q":"Una SOCAP quiere otorgar en forma no presencial un crédito al consumo de 50,000 UDIS a una persona física mexicana. ¿Hasta dónde le alcanza el mecanismo del art. 4 de su Anexo 2?","a":"Le alcanza: en crédito, el art. 4 llega a 60,000 UDIS","o":["No le alcanza: el art. 4 sólo llega a 30,000 UDIS en cualquier producto","Le alcanza: en crédito, el art. 4 llega a 60,000 UDIS","No le alcanza: la SOCAP sólo identifica a distancia aportaciones y depósitos","Le alcanza: en crédito, el art. 4 llega a 100,000 UDIS"],"x":"Igual que SOFOM en estructura, salvo los montos: en SOCAP el art. 4 cubre aportaciones y depósitos de hasta 30,000 UDIS al mes y créditos de hasta 60,000 UDIS; el art. 5, hasta 60,000 y 100,000 UDIS. El distractor tentador (30,000 para todo) es el tope del art. 4 en depósitos; 100,000 es el del art. 5 en crédito.","ref":"DCG SOCAP 4ª Bis; Anexo 2 art. 2 · H1"},{"id":"A032","tema":"h1","tipo":"cifra","q":"Un transmisor de dinero opera en forma no presencial con una persona moral mexicana usando el mecanismo del art. 5 de su Anexo 2. ¿Cuál es el tope?","a":"7,000 USD en el transcurso de un mes calendario","o":["5,000 USD en el transcurso de un mes calendario","7,000 USD en el transcurso de un mes calendario","5,000 USD por operación, sólo con personas físicas","30,000 UDIS en el transcurso de un mes calendario"],"x":"El Anexo 2 de Transmisores fija para PF, PFAE y PM mexicanas 5,000 USD al mes con el mecanismo del art. 4 y 7,000 USD al mes con el del art. 5. El distractor tentador, 5,000 USD, es el del art. 4; los 30,000 UDIS al mes son el tope del art. 4 en Casas de bolsa, Fondos y Asesores.","ref":"DCG Transmisores 4ª Bis; Anexo 2 art. 2 · H1"},{"id":"A033","tema":"h1","tipo":"caso","q":"Una casa de cambio quiere celebrar operaciones no presenciales por Dispositivos con una persona moral mexicana. ¿Lo prevé su DCG?","a":"No: su 4a Bis sólo contempla Usuarios personas físicas, mexicanas o extranjeras","o":["Sí, en operaciones de hasta 5,000 USD, siempre que obtenga la aprobación previa de la CNBV","Sí, hasta 7,000 USD al mes, igual que los transmisores de dinero","No: su 4a Bis sólo contempla Usuarios personas físicas, mexicanas o extranjeras","Sí, con el mecanismo del art. 4 de su Anexo 2, hasta 30,000 UDIS al mes"],"x":"La 4a Bis de Casas de cambio regula operaciones no presenciales sólo con Usuarios personas físicas (mexicanas o extranjeras), y su Anexo 2, art. 1, habla de PF mexicanas en operaciones de hasta 5,000 USD con aprobación previa de la CNBV. El distractor tentador toma ese tope y lo aplica a una persona moral; Transmisores sí admite PM.","ref":"DCG Casas de cambio 4a Bis; Anexo 2 art. 1 · H1"},{"id":"A034","tema":"h1","tipo":"trampa","q":"¿Cuál de estos sujetos NO prevé en su DCG la identificación o contratación no presencial?","a":"Los centros cambiarios","o":["Las casas de cambio","Los transmisores de dinero","Los centros cambiarios","Las uniones de crédito"],"x":"Trampa: «Cambios y envíos se identifican a distancia igual». Las DCG de Centros cambiarios no tienen 4ª Bis ni 4ª Ter ni Anexo 2 de identificación no presencial, ni hablan de Dispositivos o Geolocalización. Casas de cambio (4a Bis, sólo PF), Transmisores (4ª Bis) y Uniones (4ª Bis, optativa) sí la prevén.","ref":"DCG Centros cambiarios (sin 4ª Bis/Ter ni Anexo 2); DCG Casas de cambio 4a Bis; DCG Transmisores 4ª Bis; DCG Uniones 4ª Bis · H1"},{"id":"A035","tema":"h1","tipo":"caso","q":"Durante la identificación, un banco estima razonablemente que continuar alertaría al posible cliente de que sospecha de sus recursos. ¿Qué prevé la 10ª Ter?","a":"Podrá suspender el proceso y deberá remitir un reporte de Operación Inusual de 24 horas, que puede elaborarse manualmente","o":["Podrá suspender el proceso y deberá remitir un reporte de Operación Inusual de 24 horas, que puede elaborarse manualmente","Deberá concluir la identificación y reportar la operación en el reporte de Operaciones Inusuales ordinario","Podrá suspender el proceso y deberá avisar a la CNBV dentro de los 10 días hábiles siguientes, con su expediente","Deberá suspender el proceso y ya no reportar nada, porque no llegó a celebrarse ninguna Operación con él"],"x":"La 10ª Ter permite (es «podrá») suspender ante (I) posible relación con 139 Quáter o 400 Bis, (II) riesgo de alertar al cliente o (III) riesgos según el Manual; si suspende, debe generar el ROI de 24 horas, que puede hacerse manual, y remitirlo dentro de 24 horas desde que conoce la información. No suspender ni reportar no es opción.","ref":"DCG Bancos 10ª Ter · H1"},{"id":"A036","tema":"h1","tipo":"caso","q":"Una ITF estima razonablemente que, si continúa la identificación, alertaría al cliente de su sospecha. ¿Qué prevé su DCG?","a":"Podrá no continuar y remitirá el reporte de Operación Inusual correspondiente; ese artículo no fija 24 horas","o":["Podrá suspender, como Bancos, también ante riesgos de su Manual, con reporte de 24 horas","Podrá no continuar y remitirá el reporte de Operación Inusual correspondiente; ese artículo no fija 24 horas","Deberá concluir la identificación y someter al cliente a un monitoreo reforzado","Podrá no continuar sin reportar, porque no llegó a celebrarse ninguna Operación"],"x":"Igual que Bancos, salvo la ITF: su art. 28 sólo prevé «no continuar» cuando continuar alertaría al cliente (no las fr. I y III de la 10ª Ter de Bancos) y ordena remitir «el Reporte de Operación Inusual correspondiente» sin fijar en ese artículo el plazo de 24 horas. El plazo de 24 horas puede venir del art. 73 fr. I (Cliente que pretende o intenta una Operación sospechosa).","ref":"DCG ITF art. 28; DCG Bancos 10ª Ter · H1"},{"id":"A037","tema":"h1","tipo":"caso","q":"Una SOCAP recibe una aportación al capital social de una persona a la que no ha podido identificar. ¿Qué dispone su 9ª?","a":"Le prohíbe recibir aportaciones al capital social en las que no se pueda identificar al Cliente","o":["Puede recibirla si la aportación es menor al equivalente a 3,000 UDIS","Le prohíbe recibir aportaciones al capital social en las que no se pueda identificar al Cliente","La 9ª sólo prohíbe cuentas y contratos anónimos; las aportaciones se rigen por sus estatutos","Puede recibirla, siempre que la reporte después como Operación Inusual de 24 horas"],"x":"Igual que Bancos (10ª), salvo que la 9ª de SOCAP extiende la prohibición a recibir aportaciones al capital social anónimas, con nombres ficticios o sin poder identificar al Cliente o al Propietario Real. No hay excepción por monto.","ref":"DCG SOCAP 9ª; DCG Bancos 10ª · H1"},{"id":"A038","tema":"h1","tipo":"cifra","q":"En las DCG de Bancos, ¿qué límites tiene una cuenta nivel 1 de persona física?","a":"Abonos de hasta 750 UDIS al mes y saldo máximo de 1,000 UDIS","o":["Abonos de hasta 1,000 UDIS al mes y saldo máximo de 750 UDIS","Abonos de hasta 750 UDIS al mes y saldo máximo de 1,000 UDIS","Abonos de hasta 3,000 UDIS al mes, sin saldo máximo","Abonos de hasta 750 UDIS al mes y saldo máximo de 3,000 UDIS"],"x":"La 14ª Bis fr. I limita el nivel 1 a abonos equivalentes a 750 UDIS por cliente en un mes calendario y a un saldo máximo de 1,000 UDIS; basta nombre y fecha de nacimiento. El distractor tentador invierte las cifras. 3,000 UDIS al mes es el nivel 2.","ref":"DCG Bancos 14ª Bis fr. I · H1"},{"id":"A039","tema":"h1","tipo":"cifra","q":"Una persona física con cuenta nivel 2 en un banco recibe fondos de un programa gubernamental de apoyo. ¿Cuánto puede recibir por ese concepto?","a":"Hasta 6,000 UDIS al mes, adicionales a los 3,000 UDIS del nivel","o":["Hasta 3,000 UDIS al mes, dentro del mismo límite del nivel","Hasta 6,000 UDIS al mes, adicionales a los 3,000 UDIS del nivel","Hasta 6,000 UDIS al mes, dentro del mismo límite del nivel","Sin límite, porque los fondos de programas gubernamentales están exentos"],"x":"La 14ª Bis fr. II permite recibir fondos de programas gubernamentales hasta 6,000 UDIS por cliente en un mes calendario, adicionales al nivel transaccional máximo de 3,000 UDIS. La palabra clave es «adicional»: no se descuentan del límite del nivel.","ref":"DCG Bancos 14ª Bis fr. II · H1"},{"id":"A040","tema":"h1","tipo":"caso","q":"Una persona moral mexicana residente quiere abrir de forma remota en un banco una cuenta con abonos de 25,000 UDIS al mes. ¿Qué régimen simplificado de la 14ª Bis le corresponde?","a":"El de la fr. IV: abonos de hasta 30,000 UDIS al mes, para PM o PFAE mexicanas residentes contratadas en forma remota","o":["El nivel 3 (fr. III), porque admite personas físicas y morales sin tope mensual de abonos","Ninguno: las personas morales sólo pueden abrir cuentas con el expediente completo","El de la fr. IV: abonos de hasta 30,000 UDIS al mes, para PM o PFAE mexicanas residentes contratadas en forma remota","El nivel 2 (fr. II), que admite personas morales con 6,000 UDIS adicionales al mes"],"x":"La 14ª Bis fr. IV (la norma no la llama «nivel 4») prevé cuentas de hasta 30,000 UDIS al mes contratadas en forma remota por PM o PFAE de nacionalidad mexicana con residencia en territorio nacional. El nivel 3 (PF o PM) llega sólo a 10,000 UDIS al mes, y el nivel 2 es sólo para personas físicas.","ref":"DCG Bancos 14ª Bis fr. II, III y IV · H1"},{"id":"A041","tema":"h1","tipo":"caso","q":"Un cliente con cuenta nivel 2 en un banco abre en la misma institución otra cuenta nivel 1. ¿Qué exige la 14ª Bis?","a":"Entrevista presencial o los mecanismos tecnológicos de la CNBV, y expediente completo","o":["Nada adicional, porque cada cuenta respeta por separado su propio límite","Cancelar la cuenta nivel 1 y conservar únicamente la de nivel más alto","Reclasificarlo como cliente de riesgo alto y avisar de inmediato al Oficial de Cumplimiento","Entrevista presencial o los mecanismos tecnológicos de la CNBV, y expediente completo"],"x":"La 14ª Bis dispone que, si un mismo Cliente tiene más de una cuenta en la misma entidad (con independencia del nivel) o rebasa el monto máximo, debe hacerse la entrevista presencial de la 7ª o aplicarse los mecanismos tecnológicos de la CNBV e integrarse el expediente completo de la 4ª o 4ª Ter. No obliga a cancelar ni a reclasificar por ese solo hecho.","ref":"DCG Bancos 14ª Bis · H1"},{"id":"A042","tema":"h1","tipo":"trampa","q":"Se suele afirmar que «todas las DCG tienen cuentas por niveles, como Bancos». ¿Qué DCG, además de la de Bancos, clasifica cuentas o contratos por niveles?","a":"La de ITF, con niveles 1 y 2","o":["La de ITF, con niveles 1 y 2","La de SOFIPO, con los mismos niveles de cuenta que Bancos","La de Casas de bolsa, con niveles 1 y 2","La de SOFOM, con niveles 1 a 3 de crédito"],"x":"Trampa: «todas tienen cuentas por niveles» es falso. Sólo Bancos clasifica por niveles (1 a 3, más la cuenta remota de 30,000 UDIS de la fr. IV, 14ª Bis) y la ITF niveles 1 y 2 (art. 12). Los demás simplifican de otra forma: SOFOM y Uniones por crédito; Casas de bolsa, Fondos y Asesores con contratos menores a 3,000 UDIS al mes; SOCAP y SOFIPO con una cuenta a la vista de 3,000 UDIS.","ref":"DCG Bancos 14ª Bis; DCG ITF art. 12 · H1"},{"id":"A043","tema":"h1","tipo":"caso","q":"Una persona moral pide un crédito con línea de exactamente 10,000 UDIS. ¿Procede el expediente simplificado de bajo riesgo en una SOFOM y en una unión de crédito?","a":"En la unión de crédito sí (inferior o igual a 10,000 UDIS); en la SOFOM no (exige inferior a 10,000)","o":["En la SOFOM sí (inferior o igual a 10,000 UDIS); en la unión de crédito no (exige inferior a 10,000)","En ambas sí, porque las dos admiten crédito simplificado a personas morales hasta 10,000 UDIS","En la unión de crédito sí (inferior o igual a 10,000 UDIS); en la SOFOM no (exige inferior a 10,000)","En ninguna, porque el crédito simplificado de las dos sólo es para personas físicas"],"x":"SOFOM 13ª fr. II: PF o PM con línea «inferior» a 10,000 UDIS. Uniones 11ª fr. II: «inferior o igual» a 10,000 UDIS. Con exactamente 10,000 UDIS, sólo procede en la unión. Distingue «menor a» de «hasta». Ambas admiten PM en esa fracción; la de ≤ 3,000 UDIS es sólo para PF.","ref":"DCG SOFOM 13ª fr. II; DCG Uniones 11ª fr. II · H1"},{"id":"A044","tema":"h1","tipo":"caso","q":"Una persona moral pacta con un asesor en inversiones un contrato con operaciones de 2,000 UDIS al mes. ¿Puede el asesor integrar el expediente simplificado de su 8ª Ter?","a":"No: la 8ª Ter sólo aplica a Clientes personas físicas","o":["No: la 8ª Ter sólo aplica a Clientes personas físicas","Sí, porque el contrato es inferior a 3,000 UDIS al mes por cliente y asesor","Sí, con denominación, fecha de constitución y domicilio, como lo prevé su 8ª Ter","No, porque el límite de los contratos simplificados del asesor es de 750 UDIS al mes"],"x":"Igual que Casas de bolsa y Fondos (contratos inferiores a 3,000 UDIS al mes), salvo Asesores: su 8ª Ter sólo comprende a Clientes personas físicas. El distractor tentador aplica el monto y olvida el tipo de persona. 750 UDIS es el nivel 1 de Bancos e ITF.","ref":"DCG Asesores 8ª Ter; DCG Casas de bolsa 12ª · H1"},{"id":"A045","tema":"h1","tipo":"caso","q":"Una persona física quiere abrir en una SOCAP, sin acudir a sucursal, la cuenta a la vista simplificada de hasta 3,000 UDIS de abonos al mes (14ª). ¿Qué prevé su DCG?","a":"Puede recabar sus datos de forma remota, en sustitución de la entrevista, validándolos con el Registro Nacional de Población (7ª, cuarto párrafo)","o":["No puede: su DCG no prevé ninguna forma remota para esa cuenta y la persona debe acudir a sucursal","Puede, pero sólo si la cuenta recibe exclusivamente fondos de programas gubernamentales de apoyo","Puede recabar sus datos de forma remota, en sustitución de la entrevista, validándolos con el Registro Nacional de Población (7ª, cuarto párrafo)","Puede, siempre que los abonos de la cuenta no rebasen 750 UDIS en el transcurso de un mes calendario"],"x":"La 14ª de SOCAP describe la cuenta «abierta de forma presencial», pero su segundo párrafo y la 7ª, cuarto párrafo, permiten la captura remota de datos validada con el RENAPO, en sustitución de la entrevista. La SOFIPO (15ª) lo dice desde el primer párrafo: «presencial o en términos de la 7ª, cuarto párrafo». El tope de 750 UDIS es el nivel 1 de Bancos, no la cuenta de SOCAP.","ref":"DCG SOCAP 7ª, 4º párr., y 14ª; DCG SOFIPO 15ª · H1"},{"id":"A046","tema":"h1","tipo":"caso","q":"Un banco abre cuentas de nómina, a petición de una empresa cliente, a nombre de sus trabajadores. ¿Quién puede integrar y conservar el expediente de cada trabajador?","a":"La empresa cliente, si lo conviene con el banco y se lo entrega cuando la CNBV lo requiera","o":["Sólo el banco, sin excepción, porque la obligación de identificar es indelegable","El IMSS, como fuente oficial de los datos laborales de cada trabajador","La empresa cliente, si lo conviene con el banco y se lo entrega cuando la CNBV lo requiera","Cada trabajador, mediante una declaración firmada que el banco conserva"],"x":"La 13ª permite que el expediente de los trabajadores lo integre y conserve el Cliente solicitante (el patrón) en lugar del banco, siempre que se convenga contractualmente que lo mantendrá a disposición y lo proporcionará para presentarlo a la CNBV cuando esta lo requiera.","ref":"DCG Bancos 13ª · H1"},{"id":"A047","tema":"h1","tipo":"cifra","q":"A petición de la SHCP o de la CNBV, ¿en qué plazo debe un banco informar el destino o uso de las tarjetas prepagadas bancarias de la 19ª?","a":"En un plazo que no exceda de dos meses desde la petición","o":["Dentro de las 24 horas siguientes a la petición","Dentro de los 10 días hábiles siguientes a que reciba la petición","Dentro de los 20 días hábiles siguientes a la petición","En un plazo que no exceda de dos meses desde la petición"],"x":"La 19ª obliga a proporcionar, en un plazo que no exceda de dos meses, la información del destino o uso del medio de pago, incluidas las localidades donde se usó. Las 24 horas son del ROI urgente, y los 20 días hábiles, del envío de modificaciones al Manual.","ref":"DCG Bancos 19ª · H1"},{"id":"A048","tema":"h1","tipo":"trampa","q":"Un transmisor de dinero quiere contratar como Agente Relacionado a una sociedad anónima para pagar remesas. ¿Es posible con esa figura?","a":"No: el Agente Relacionado es persona física; una persona moral sería Persona Jurídica Coadyuvante","o":["No: el Agente Relacionado es persona física; una persona moral sería Persona Jurídica Coadyuvante","Sí: el Agente Relacionado puede ser persona física o moral, si celebra contrato","Sí, siempre que la sociedad anónima esté registrada ante la CNBV como transmisor","No: una persona moral sólo puede participar como Tercero de un Agente Relacionado"],"x":"Trampa: «el agente relacionado puede ser persona moral». En las DCG de Transmisores, el Agente Relacionado es la persona física (2ª I); la persona moral o PFAE es la Persona Jurídica Coadyuvante (2ª XXVIII); el Tercero (2ª XXXV) contrata con un agente o coadyuvante, y puede ser PF o PM.","ref":"DCG Transmisores 2ª I, XXVIII y XXXV · H1"},{"id":"A049","tema":"h1","tipo":"cifra","q":"En una IFPE, un cliente realiza en un mes operaciones en efectivo y en fondos de pago electrónico por 8,000 UDIS. ¿Le aplica el seguimiento más estricto del art. 43?","a":"Sí: en las IFPE el umbral es de 7,500 UDIS al mes","o":["No: el umbral es de 12,500 UDIS al mes para toda ITF","Sí: en las IFPE el umbral es de 7,500 UDIS al mes","No: el seguimiento estricto sólo aplica a operaciones con activos virtuales","Sí, pero sólo si además hay transferencias internacionales en el mes"],"x":"El art. 43 exige mecanismos más estrictos en las IFPE desde 7,500 UDIS al mes (efectivo, fondos de pago electrónico o activos virtuales) y en las IFC desde 12,500 UDIS al mes (efectivo o activos virtuales). El distractor tentador toma el umbral de las IFC.","ref":"DCG ITF art. 43 · H1"},{"id":"A050","tema":"h1","tipo":"caso","q":"Una SOFOM conviene con una empresa cliente que esta recabe los datos de los tarjetahabientes. ¿Qué tarjetas a terceros regula la 5ª de las DCG de SOFOM?","a":"Tarjetas de crédito emitidas a personas distintas del titular del contrato","o":["Tarjetas de débito y otros medios de pago, igual que en la 5ª de las DCG de Bancos","Tarjetas prepagadas en moneda nacional para personas extranjeras","Tarjetas recargables emitidas por la propia SOFOM o por otras sociedades","Tarjetas de crédito emitidas a personas distintas del titular del contrato"],"x":"Igual que Bancos en la mecánica (contrato marco en el que el cliente recaba los datos de los tarjetahabientes), salvo el producto: la 5ª de SOFOM trata tarjetas de crédito, mientras que la de Bancos habla de medios de pago, incluidas tarjetas de débito. Las tarjetas recargables son figura de SOCAP y SOFIPO.","ref":"DCG SOFOM 5ª; DCG Bancos 5ª · H1"},{"id":"A051","tema":"h1","tipo":"caso","q":"Un banco clasifica como de riesgo bajo a una persona física que abre una cuenta. ¿Puede verificar sus datos y documentos después de la apertura?","a":"Sí, pero debe informarle que no podrá operar hasta que concluya la verificación","o":["No, la verificación siempre debe concluir antes de abrir la cuenta","Sí, y mientras tanto el cliente puede operar hasta el límite de una cuenta nivel 1","Sí, dentro de los seis meses siguientes, sin restricción para operar","Sí, pero debe informarle que no podrá operar hasta que concluya la verificación"],"x":"La 15ª Bis permite que, en clientes de riesgo bajo, la verificación se haga con posterioridad a la apertura, pero el banco debe informar que no podrán realizarse Operaciones hasta que concluya. La verificación puede ser presencial o no presencial y hacerla un tercero, sin que el banco quede eximido.","ref":"DCG Bancos 15ª Bis · H1"},{"id":"A052","tema":"h1","tipo":"trampa","q":"¿En cuál de estas DCG NO se prevé que la verificación de datos y documentos de un cliente o usuario de riesgo bajo se haga con posterioridad?","a":"En la de Transmisores de dinero","o":["En la de Transmisores de dinero","En la de Bancos","En la de Sociedades financieras de objeto múltiple","En la de Casas de cambio"],"x":"Trampa: suponer que todos pueden diferir la verificación por riesgo bajo. La 8ª Bis de Transmisores no tiene el párrafo de verificación «con posterioridad»: ordena verificar e informar al Usuario que no podrá operar hasta que concluya. Bancos (15ª Bis), SOFOM (13ª Ter) y Casas de cambio (9a Bis) sí lo permiten para riesgo bajo.","ref":"DCG Transmisores 8ª Bis; DCG Bancos 15ª Bis; DCG SOFOM 13ª Ter; DCG Casas de cambio 9a Bis · H1"},{"id":"A053","tema":"h1","tipo":"caso","q":"Un banco tiene un cliente persona moral de riesgo bajo y otro cliente de riesgo alto. ¿Qué exige la 21ª respecto de sus expedientes?","a":"PM: completo, pudiendo optar por no actualizarlo; riesgo alto: verificar al menos una vez al año","o":["Ambos: actualizar los datos y documentos al menos una vez al año","PM de riesgo bajo: actualizar cada año; riesgo alto: cada seis meses","Ninguno: la actualización sólo procede cuando el cliente la solicita","PM: completo, pudiendo optar por no actualizarlo; riesgo alto: verificar al menos una vez al año"],"x":"La 21ª: los expedientes de PM deben estar completos y actualizados con independencia del riesgo, pero si la PM es de riesgo bajo la entidad puede optar por no actualizarlos; los de riesgo alto se verifican cuando menos una vez al año. El distractor tentador («ambos, anual») es la regla de la ITF, no la de Bancos.","ref":"DCG Bancos 21ª · H1"},{"id":"A054","tema":"h1","tipo":"caso","q":"Una ITF tiene un cliente de riesgo bajo cuyo expediente lleva dos años sin revisarse. ¿Qué exige su DCG?","a":"Revisarlo y, en su caso, actualizarlo por lo menos una vez al año, cualquiera que sea el riesgo","o":["Revisarlo y, en su caso, actualizarlo por lo menos una vez al año, cualquiera que sea el riesgo","Nada: la revisión anual sólo es obligatoria para los clientes de riesgo alto","Revisarlo cada seis meses, al reevaluar el grado de riesgo del cliente","Nada: puede optar por no actualizar a los clientes de riesgo bajo"],"x":"Igual que Bancos, salvo la ITF: su art. 24 obliga a revisar y, en su caso, actualizar los expedientes de todos sus Clientes por lo menos una vez al año, con independencia de su Grado de Riesgo. En Bancos la verificación anual es sólo para riesgo alto, y la opción de no actualizar es para PM de riesgo bajo (21ª).","ref":"DCG ITF art. 24; DCG Bancos 21ª · H1"},{"id":"A055","tema":"h1","tipo":"memoria","q":"Para el perfil transaccional de un cliente que opera en forma no presencial, ¿qué elemento adicional debe tomar en cuenta un banco según la 24ª?","a":"La Geolocalización del Dispositivo desde el que se realiza la operación","o":["La dirección IP y el historial de navegación del cliente en la banca digital","El riesgo del país de nacimiento del cliente según las listas del GAFI","La Geolocalización del Dispositivo desde el que se realiza la operación","La calificación crediticia del cliente en las sociedades de información"],"x":"La 24ª basa el perfil en monto, número, tipo, naturaleza y frecuencia de las operaciones, origen y destino de los recursos y el conocimiento del ejecutivo; si la operación es no presencial, añade la Geolocalización del Dispositivo, que puede amparar las operaciones de la sesión activa.","ref":"DCG Bancos 24ª · H1"},{"id":"A056","tema":"h1","tipo":"cifra","q":"¿Con qué periodicidad mínima debe un banco evaluar el perfil transaccional de sus clientes?","a":"Al menos cada seis meses","o":["Al menos cada tres meses","Al menos una vez al año","Sólo cuando el sistema de alertas detecte una desviación","Al menos cada seis meses"],"x":"La 25ª Quáter: perfil transaccional inicial con la información de al menos los seis primeros meses, y evaluación del perfil al menos cada seis meses. El distractor tentador (una vez al año) es el ritmo de Asesores en inversiones.","ref":"DCG Bancos 25ª Quáter · H1"},{"id":"A057","tema":"h1","tipo":"caso","q":"Un asesor en inversiones y una casa de bolsa revisan el perfil transaccional y el grado de riesgo de sus clientes. ¿Cuántas evaluaciones mínimas por año calendario exige cada DCG?","a":"Asesor, una; casa de bolsa, dos","o":["Ambos, dos por año calendario","Asesor, una; casa de bolsa, dos","Asesor, dos; casa de bolsa, una","Ambos, una por año calendario"],"x":"Casas de bolsa (como SOFOM, Fondos, SOCAP, SOFIPO y Uniones) exige al menos dos evaluaciones por año calendario; Asesores, al menos una. En ambos casos, sobre clientes con contrato de al menos seis meses de antigüedad. Bancos e ITF, en cambio, evalúan al menos cada seis meses.","ref":"DCG Asesores 13ª; DCG Casas de bolsa 23ª · H1"},{"id":"A058","tema":"h1","tipo":"memoria","q":"En Bancos, ¿quién aprueba el modelo de evaluación de riesgos con el que se determina el grado de riesgo de los clientes?","a":"El comité de riesgos, a propuesta del Comité de Comunicación y Control, e informa al consejo","o":["El comité de auditoría, a propuesta del Oficial de Cumplimiento, e informa al consejo","El Comité de Comunicación y Control, que después lo informa al comité de riesgos para su registro","El comité de riesgos, a propuesta del Comité de Comunicación y Control, e informa al consejo","El consejo de administración, previa opinión favorable de la CNBV sobre el modelo"],"x":"La 25ª Bis exige un modelo coherente con la metodología del Cap. II Bis, aprobado por el comité de riesgos con base en la propuesta del Comité, el cual lo informa al consejo de administración o directivo. El comité de auditoría aprueba las modificaciones al Manual, no el modelo de riesgo de clientes.","ref":"DCG Bancos 25ª Bis · H1"},{"id":"A059","tema":"h1","tipo":"caso","q":"Una SOFOM y una ITF diseñan la clasificación de sus clientes personas físicas. ¿Cuántos grados de riesgo deben establecer como mínimo?","a":"SOFOM, dos (alto y bajo); ITF, tres (bajo, medio y alto)","o":["Ambas, tres (bajo, medio y alto), porque es el mínimo común de las DCG","SOFOM, dos (alto y bajo); ITF, tres (bajo, medio y alto)","SOFOM, tres; ITF, dos (alto y bajo)","Ambas, dos (alto y bajo)"],"x":"SOFOM (como Casas de bolsa, Fondos, SOCAP, SOFIPO, Uniones y Asesores): mínimo dos grados para PF y tres para PM y fideicomisos. ITF (art. 29): al menos tres grados (bajo, medio y alto) para todos sus clientes. Bancos deja que su modelo fije tantos grados intermedios como necesite.","ref":"DCG SOFOM 21ª; DCG ITF art. 29 · H1"},{"id":"A060","tema":"h1","tipo":"memoria","q":"Según la 28ª de las DCG de Bancos, ¿cuándo y con qué herramienta deben clasificarse los clientes por grado de riesgo?","a":"Al inicio de la relación comercial, con los sistemas automatizados de la 51ª","o":["Al inicio de la relación comercial, con los sistemas automatizados de la 51ª","Al cumplirse seis meses de relación, con el modelo aprobado por el consejo de administración","Al primer reporte de Operación Relevante, con el sistema de alertas","Al cierre de cada ejercicio, con una revisión manual del ejecutivo"],"x":"La 28ª ordena clasificar a los Clientes en función de su grado de riesgo, utilizando los sistemas automatizados de la 51ª, y al inicio de la relación comercial. La información de los seis primeros meses sirve para fijar el grado inicial (25ª Bis), pero la clasificación empieza desde el inicio.","ref":"DCG Bancos 28ª; 25ª Bis · H1"},{"id":"A061","tema":"h1","tipo":"cifra","q":"En las DCG de Bancos, ¿hasta qué grado de parentesco se asimilan los parientes a la PEP, y por cuánto tiempo sigue considerándose PEP nacional a quien deja el cargo?","a":"Hasta el segundo grado; durante el año siguiente","o":["Hasta el cuarto grado; durante los dos años siguientes","Hasta el segundo grado; durante los tres años siguientes","Hasta el segundo grado; durante el año siguiente","Hasta el tercer grado; durante el año siguiente"],"x":"La 2ª XXXI asimila a la PEP al cónyuge, concubina o concubinario, a los parientes por consanguinidad o afinidad hasta el segundo grado y a las PM con las que tenga vínculos patrimoniales; la PEP nacional sigue siéndolo durante el año siguiente a aquel en que dejó el encargo.","ref":"DCG Bancos 2ª XXXI · H1"},{"id":"A062","tema":"h1","tipo":"caso","q":"Una ITF detecta que un cliente es PEP nacional, clasificado de riesgo medio. ¿Necesita la aprobación de un directivo para operar con él?","a":"Sí: su DCG exige aprobación para operar con cualquier PEP, no sólo con la de riesgo alto","o":["No: sólo la PEP que además es de riesgo alto requiere esa aprobación, igual que en Bancos","No: sólo las PEP extranjeras requieren aprobación de un directivo","Sí, pero la otorga el Oficial de Cumplimiento y no un directivo","Sí: su DCG exige aprobación para operar con cualquier PEP, no sólo con la de riesgo alto"],"x":"Igual que Bancos, salvo la ITF: su art. 39 exige aprobación por escrito, digital o electrónica de un directivo con facultades para operar con el Cliente de riesgo alto «o bien» PEP. En Bancos (26ª) la aprobación se pide cuando la PEP además es de riesgo alto.","ref":"DCG ITF art. 39; DCG Bancos 26ª · H1"},{"id":"A063","tema":"h1","tipo":"caso","q":"Un banco tiene como cliente a un alto funcionario federal en funciones (PEP nacional), clasificado de riesgo bajo. ¿Qué exige la 28ª respecto de él?","a":"Mecanismos para valorar si su comportamiento transaccional corresponde a sus funciones, nivel y responsabilidad","o":["Clasificarlo como de riesgo alto desde el inicio, igual que a las PEP extranjeras","Mecanismos para valorar si su comportamiento transaccional corresponde a sus funciones, nivel y responsabilidad","Aprobación de un directivo para continuar la relación, aunque su riesgo sea bajo","Documentación completa de su cónyuge y dependientes económicos, en todo caso"],"x":"La 28ª: las PEP extranjeras son de riesgo alto como mínimo; para las PEP nacionales, la entidad desarrolla mecanismos para establecer el riesgo de sus operaciones y determinar si su comportamiento corresponde razonablemente con sus funciones, nivel y responsabilidad. La aprobación de directivo (26ª) aplica a la PEP de riesgo alto.","ref":"DCG Bancos 28ª; 26ª · H1"},{"id":"A064","tema":"h1","tipo":"caso","q":"Un transmisor de dinero detecta que un Usuario es PEP y además de riesgo alto. ¿Quién puede aprobar la operación?","a":"Un directivo o su equivalente, o una persona con nivel de alta responsabilidad, con facultades para aprobarla","o":["Sólo un directivo o su equivalente con facultades específicas, como en Bancos","El Oficial de Cumplimiento, sin necesidad de intervención de un directivo","Un directivo o su equivalente, o una persona con nivel de alta responsabilidad, con facultades para aprobarla","El Comité de Comunicación y Control, en sesión extraordinaria convocada al efecto"],"x":"Igual que Bancos, salvo Transmisores: su 17ª permite que la aprobación la otorgue un directivo, su equivalente «o una persona con nivel de alta responsabilidad» con facultades específicas. Bancos (26ª) sólo menciona al directivo o su equivalente.","ref":"DCG Transmisores 17ª; DCG Bancos 26ª · H1"},{"id":"A065","tema":"h1","tipo":"caso","q":"¿Cuál de estos clientes debe un banco considerar, como mínimo, de grado de riesgo alto según la 28ª?","a":"Una persona moral que realiza operaciones en efectivo con dólares conforme a la 33ª Bis 1","o":["Una persona moral que realiza operaciones en efectivo con dólares conforme a la 33ª Bis 1","Una PEP nacional en funciones, por el solo hecho de serlo","Una persona física residente en el país con una cuenta nivel 3 abierta en una sucursal","Una sociedad del Anexo 1 clasificada con grado de riesgo bajo"],"x":"La 28ª considera de riesgo alto, al menos, a los clientes no residentes asignados a banca privada o sector similar, a las PEP extranjeras y a las PM que realicen operaciones en efectivo con dólares de los EUA en términos de la 33ª Bis 1. La PEP nacional no es de riesgo alto por sí misma: se valora si su operación corresponde a su cargo.","ref":"DCG Bancos 28ª · H1"},{"id":"A066","tema":"h1","tipo":"trampa","q":"Una casa de bolsa recibe a un cliente no residente asignado a su segmento de banca privada. ¿Qué clientes considera su DCG, como mínimo, de riesgo alto?","a":"Sólo las PEP extranjeras","o":["Los no residentes de banca privada y las PEP extranjeras","Sólo las PEP extranjeras","Las PEP extranjeras y las PM que operan efectivo en dólares","Las PEP nacionales y las extranjeras, sin distinción"],"x":"Trampa: copiar la lista de Bancos. La 26ª de Casas de bolsa (como SOFOM, Asesores, Fondos, SOCAP, SOFIPO, Uniones y Cambios y envíos) sólo nombra como riesgo alto mínimo a las PEP extranjeras. Los no residentes de banca privada y las PM con efectivo en dólares son de la 28ª de Bancos. Nada impide que la casa de bolsa lo califique alto por su propio modelo.","ref":"DCG Casas de bolsa 26ª; DCG Bancos 28ª · H1"},{"id":"A067","tema":"h1","tipo":"caso","q":"Una casa de cambio va a operar con un Usuario que, por sus características, podría ser de riesgo alto. ¿Cuándo debe otorgarse la aprobación del directivo?","a":"Previamente a la celebración de la Operación con ese Usuario","o":["Previamente a la apertura de su cuenta, como en las DCG de Bancos","Dentro de las 24 horas siguientes a la celebración de la Operación","Previamente a la celebración de la Operación con ese Usuario","Al cierre del mes, junto con el reporte de Operaciones Relevantes"],"x":"Igual que Bancos (aprobación por escrito, digital o electrónica de un directivo), salvo el momento: la 20a de Casas de cambio la exige previamente a la celebración de Operaciones, porque sólo hay Usuarios y no cuentas. En Bancos (27ª) es previa a la apertura de la cuenta o celebración del contrato.","ref":"DCG Casas de cambio 20a; DCG Bancos 27ª · H1"},{"id":"A068","tema":"h1","tipo":"caso","q":"Un banco mexicano evalúa prestar corresponsalía a una institución extranjera que no tiene presencia física en ninguna jurisdicción. ¿Qué disponen sus DCG?","a":"Debe abstenerse: la corresponsalía con instituciones sin presencia física está prohibida","o":["Puede hacerlo con aprobación a nivel directivo y certificación de un auditor independiente","Puede hacerlo si aplica medidas de debida diligencia reforzada, por ser de riesgo","Debe abstenerse: la corresponsalía con instituciones sin presencia física está prohibida","Puede hacerlo si la contraparte le entrega su programa de prevención de PLD/FT"],"x":"La 30ª ordena abstenerse de corresponsalía con entidades financieras extranjeras o intermediarios sin presencia física en jurisdicción alguna. La aprobación directiva y la certificación (29ª) y la diligencia reforzada con jurisdicciones de riesgo (30ª) aplican a contrapartes permitidas, no a las que no tienen presencia física.","ref":"DCG Bancos 29ª y 30ª · H1"},{"id":"A069","tema":"h1","tipo":"trampa","q":"¿Cuál de estos sujetos NO prevé en su DCG disposiciones de corresponsalía?","a":"Las uniones de crédito","o":["Las casas de bolsa","Los fondos de inversión","Las SOFIPO","Las uniones de crédito"],"x":"Trampa: «la corresponsalía es de todos». Sólo la prevén Bancos, Casas de bolsa, Fondos, SOCAP y SOFIPO (estas dos, con contrapartes «relacionadas con su objeto»). No la prevén SOFOM, Asesores, Uniones,
