les siguientes a la designación","o":["Dentro de los 2 días hábiles siguientes a la designación","Al día hábil siguiente a la fecha de la designación","Dentro de los 15 días hábiles siguientes a la designación","Dentro de los 10 días hábiles siguientes a la designación"],"x":"SOFOM 40ª I: dentro de los 10 días hábiles siguientes a la designación. Es el plazo de la mayoría de los sujetos; Bancos y Casas de cambio tienen 2 días hábiles, y el Representante de Asesores, 15.","ref":"SOFOM 40ª I · H4","par":"D055"},{"id":"D057","tema":"h4","tipo":"caso","q":"Una casa de cambio designa a la persona que ejercerá las funciones de cumplimiento previstas en su DCG (Oficial de Cumplimiento o Representante, según el caso). ¿En qué plazo debe informar su nombre a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 2 días hábiles siguientes a la designación","o":["Dentro de los 2 días hábiles siguientes a la designación","Al día hábil siguiente a la fecha de la designación","Dentro de los 15 días hábiles siguientes a la designación","Dentro de los 10 días hábiles siguientes a la designación"],"x":"Casas de cambio 39a I: el nombre del OC se informa dentro de los 2 días hábiles siguientes a su designación, igual que en Bancos (48ª I).","ref":"Casas de cambio 39a I · H4","par":"D058"},{"id":"D058","tema":"h4","tipo":"caso","q":"Un asesor en inversiones persona moral designa a la persona que ejercerá las funciones de cumplimiento previstas en su DCG (Oficial de Cumplimiento o Representante, según el caso). ¿En qué plazo debe informar su nombre a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 15 días hábiles siguientes a la designación","o":["Al día hábil siguiente a la fecha de la designación","Dentro de los 15 días hábiles siguientes a la designación","Dentro de los 10 días hábiles siguientes a la designación","Dentro de los 2 días hábiles siguientes a la designación"],"x":"Asesores 31ª: el nombre del Representante se informa dentro de los 15 días hábiles siguientes a su nombramiento. Es el plazo más largo del grupo 2 · 10 · 15.","ref":"Asesores 31ª · H4","par":"D057"},{"id":"D059","tema":"h4","tipo":"caso","q":"Una institución de crédito revoca la designación de su Oficial de Cumplimiento por terminación laboral. ¿En qué plazo debe informar la revocación a la Secretaría, por conducto de la Comisión?","a":"Dentro de los 10 días hábiles siguientes a la revocación","o":["Al día hábil siguiente a la fecha de la revocación","Dentro de los 15 días hábiles siguientes a la revocación","Dentro de los 10 días hábiles siguientes a la revocación","Dentro de los 2 días hábiles siguientes a la revocación"],"x":"Bancos 48ª II: la revocación del OC o del interino (por determinación de la Entidad, rechazo, terminación laboral o imposibilidad) se informa dentro de los 10 días hábiles siguientes.","ref":"Bancos 48ª II · H4","par":"D060"},{"id":"D060","tema":"h4","tipo":"caso","q":"Una casa de cambio revoca la designación de su Oficial de Cumplimiento por terminación laboral. ¿En qué plazo debe informar la revocación a la Secretaría, por conducto de la Comisión?","a":"Al día hábil siguiente a la fecha de la revocación","o":["Dentro de los 15 días hábiles siguientes a la revocación","Dentro de los 2 días hábiles siguientes a la revocación","Dentro de los 10 días hábiles siguientes a la revocación","Al día hábil siguiente a la fecha de la revocación"],"x":"Casas de cambio 39a II: la revocación de la designación del OC se informa al día hábil siguiente a la fecha en que ocurra. También la designación del interino (39a III) se informa al día hábil siguiente.","ref":"Casas de cambio 39a II · H4","par":"D059"},{"id":"D061","tema":"h4","tipo":"trampa","q":"¿Qué combinación de plazos para avisar la designación del Oficial de Cumplimiento es correcta?","a":"Bancos y casas de cambio, 2 días hábiles; SOFOM, SOCAP e ITF, 10 días hábiles","o":["Bancos y casas de cambio, 2 días hábiles; SOFOM, SOCAP e ITF, 10 días hábiles","Bancos y SOFOM, 2 días hábiles; casas de cambio y centros cambiarios, 10 días hábiles","Todos los sujetos, 10 días hábiles, salvo el Representante de Asesores, 15 días hábiles","Bancos, 2 días hábiles; casas de cambio, al día hábil siguiente; ITF, 15 días hábiles"],"x":"Bancos 48ª I y Casas de cambio 39a I: 2 días hábiles. SOFOM 40ª I, SOCAP 52ª I e ITF art. 53 I: 10 días hábiles (igual que Casas de bolsa, Fondos, SOFIPO, Uniones, Centros y Transmisores). Representante de Asesores: 15 días hábiles (31ª).","ref":"Bancos 48ª I; Casas de cambio 39a I; SOFOM 40ª I; SOCAP 52ª I; ITF art. 53 I · H4"},{"id":"D062","tema":"h4","tipo":"caso","q":"El mismo día, el consejo de una institución de crédito sustituye a un integrante del Comité y el Comité designa a ese nuevo integrante como Oficial de Cumplimiento. ¿Qué plazos aplican a los avisos?","a":"15 días hábiles para el cambio de integrante del Comité y 2 días hábiles para la designación del Oficial","o":["2 días hábiles para ambos avisos, porque la designación del Oficial absorbe el cambio en el Comité","15 días hábiles para el cambio de integrante del Comité y 2 días hábiles para la designación del Oficial","15 días hábiles para ambos avisos, porque se trata de un solo acto que se informa en el mismo formato oficial","10 días hábiles para el cambio de integrante del Comité y 2 días hábiles para la designación del Oficial"],"x":"Son avisos distintos: Bancos 46ª (designación, adición o sustitución de integrantes del Comité) dentro de 15 días hábiles; Bancos 48ª I (designación del OC) dentro de 2 días hábiles.","ref":"Bancos 46ª; 48ª I · H4"},{"id":"D063","tema":"h4","tipo":"caso","q":"Un asesor en inversiones persona moral debe organizar su estructura de cumplimiento en PLD/FT. Conforme a su DCG, ¿qué debe hacer?","a":"Designar, mediante su consejo, administrador único o socios administradores, un Representante que labore en la sociedad","o":["Constituir un Comité de al menos tres miembros y designar de entre ellos a un Oficial de Cumplimiento certificado","Encargar las funciones a su director general, sin necesidad de designación ni de aviso a la Secretaría","Designar, mediante su consejo, administrador único o socios administradores, un Representante que labore en la sociedad","Solicitar a la Comisión que le asigne un Representante común para los asesores en inversiones registrados ante ella"],"x":"Asesores 30ª: las personas morales designan, mediante su consejo de administración o de gerentes, administrador único, socio o socios administradores, a un Representante que labore en la sociedad (2ª XXV). Su nombramiento se informa en 15 días hábiles (31ª).","ref":"Asesores 30ª; 2ª XXV; 31ª · H4"},{"id":"D064","tema":"h4","tipo":"caso","q":"Un asesor en inversiones persona física trabaja sin empleados. ¿Qué le permite su DCG respecto de las funciones del Representante?","a":"Realizarlas directamente o designar un Representante, que puede ser el mismo que el de otros asesores personas físicas","o":["Debe designar un Representante exclusivo, que no puede ser compartido con otros asesores en inversiones personas físicas","Queda relevado de esas funciones mientras no tenga empleados ni Clientes clasificados de riesgo alto","Debe designar un Oficial de Cumplimiento con certificación vigente, aunque no tenga empleados a su servicio","Realizarlas directamente o designar un Representante, que puede ser el mismo que el de otros asesores personas físicas"],"x":"Asesores 30ª, último párrafo: las personas físicas pueden optar por realizar de manera directa, y en lo conducente, las funciones del Representante, o bien designar un Representante que puede ser el mismo que el de otros Asesores en Inversiones personas físicas.","ref":"Asesores 30ª · H4"},{"id":"D065","tema":"h4","tipo":"caso","q":"Un asesor en inversiones que no se encuentra en el supuesto del tercer párrafo del art. 225 de la LMV guarda con una entidad financiera la relación a que se refiere ese párrafo. ¿Qué le permite su DCG?","a":"Nombrar, en sustitución del Representante, al oficial de cumplimiento de esa entidad financiera","o":["Nombrar, en sustitución del Representante, al oficial de cumplimiento de esa entidad financiera","Designar como Representante al auditor interno de la entidad financiera con la que guarda la relación","Someter sus operaciones al Comité de Comunicación y Control de la entidad financiera relacionada","Omitir al Representante, porque la entidad financiera reporta por su cuenta las operaciones del asesor"],"x":"Asesores 30ª: «El Asesor en Inversiones que no se encuentre en el supuesto a que se refiere el tercer párrafo del artículo 225 de la Ley, podrá nombrar en sustitución del Representante, al oficial de cumplimiento de la entidad financiera con la que tenga una relación en términos del citado párrafo».","ref":"Asesores 30ª · H4"},{"id":"D066","tema":"h4","tipo":"trampa","q":"En un asesor en inversiones persona moral, ¿quién dictamina las Operaciones Inusuales e Internas Preocupantes y quién las reporta?","a":"El Representante las dictamina y, en su caso, las reporta a la Secretaría","o":["El consejo de administración las dictamina y el Representante las reporta","El Representante las dictamina y, en su caso, las reporta a la Secretaría","El socio administrador las dictamina y el oficial de cumplimiento las reporta","El Comité de Comunicación y Control las dictamina y el Representante las reporta"],"x":"Asesores 30ª VIII: el Representante dictamina las operaciones que deban reportarse y, en su caso, las reporta; documenta sus resoluciones y conserva por escrito los razonamientos del dictamen (fr. IX). En Bancos esas tareas se reparten: el Comité dictamina y el OC envía.","ref":"Asesores 30ª VIII–IX · H4"},{"id":"D067","tema":"h4","tipo":"cifra","q":"Una Entidad sujeta a la DCG de fondos de inversión, en el supuesto de la 42ª, designa al representante que sustituye al Comité y al Oficial de Cumplimiento. ¿En qué plazo informa su nombre a la Secretaría?","a":"Dentro de los 10 días hábiles siguientes a la designación","o":["Dentro de los 2 días hábiles siguientes a la designación","Dentro de los 15 días hábiles siguientes a la designación","Dentro de los 10 días hábiles siguientes a la designación","Al día hábil siguiente a la fecha de la designación"],"x":"Fondos 43ª I: el nombre del OC o del representante de la 42ª se informa dentro de los 10 días hábiles siguientes a la designación. Los 15 días hábiles corresponden al Representante de Asesores (31ª).","ref":"Fondos 43ª I; 42ª · H4"},{"id":"D068","tema":"h4","tipo":"caso","q":"Un centro cambiario forma parte de un grupo empresarial controlado por una misma sociedad, junto con un transmisor de dinero y una SOFOM no regulada. ¿Puede designar el mismo Oficial de Cumplimiento que esas entidades?","a":"Sí; el Oficial común realiza las obligaciones de la DCG y debe laborar en alguna de las entidades del grupo","o":["No; el Oficial de un centro cambiario debe ser exclusivo y no puede compartirse con ninguna otra entidad","Sí, aunque no labore en ninguna de las entidades del grupo, si la Comisión autoriza previamente la designación","No; la DCG de Centros cambiarios sólo admite un Oficial común dentro de un grupo financiero conforme a la LRAF","Sí; el Oficial común realiza las obligaciones de la DCG y debe laborar en alguna de las entidades del grupo"],"x":"Centros 34ª: si el Centro Cambiario es parte de un grupo empresarial integrado por centros cambiarios, transmisores de dinero o SOFOM no reguladas, puede designar un mismo OC, que debe laborar en alguna de las entidades. Grupo empresarial: personas morales en las que una misma sociedad mantiene el control.","ref":"Centros 34ª · H4"},{"id":"D069","tema":"h4","tipo":"caso","q":"Una institución de crédito quiere que su Oficial de Cumplimiento sea el mismo que el de otras entidades financieras con las que guarda vínculos de control. ¿Qué prevé su DCG?","a":"Puede ser el mismo si la entidad forma parte de un grupo financiero conforme a la LRAF y cumple los requisitos de su DCG","o":["Puede ser el mismo si la entidad forma parte de un grupo financiero conforme a la LRAF y cumple los requisitos de su DCG","Puede ser el mismo si forma parte de un grupo empresarial, siempre que el Oficial labore en alguna de esas entidades","Su DCG no prevé que el Oficial de Cumplimiento pueda ser común con el de otras entidades","Puede ser el mismo si la Comisión autoriza previamente la designación conjunta para todas las entidades vinculadas por el control"],"x":"Bancos 47ª: el OC de una Entidad que forme parte de un grupo financiero (LRAF) puede ser el mismo que el de las otras entidades del grupo, siempre que la Entidad cumpla con la 47ª. La regla de grupo empresarial es la de Centros cambiarios (34ª).","ref":"Bancos 47ª · H4","par":"D070"},{"id":"D070","tema":"h4","tipo":"caso","q":"Una sociedad cooperativa de ahorro y préstamo quiere que su Oficial de Cumplimiento sea el mismo que el de otras entidades financieras con las que guarda vínculos de control. ¿Qué prevé su DCG?","a":"Su DCG no prevé que el Oficial de Cumplimiento pueda ser común con el de otras entidades","o":["Puede ser el mismo si la entidad forma parte de un grupo financiero conforme a la LRAF y cumple los requisitos de su DCG","Su DCG no prevé que el Oficial de Cumplimiento pueda ser común con el de otras entidades","Puede ser el mismo si la Comisión autoriza previamente la designación conjunta para todas las entidades vinculadas por el control","Puede ser el mismo si forma parte de un grupo empresarial, siempre que el Oficial labore en alguna de esas entidades"],"x":"SOCAP 51ª: no contiene el párrafo de OC común; tampoco lo prevén Uniones (38ª) ni Transmisores (36ª). Bancos admite OC común en grupo financiero (47ª) y Centros, en grupo empresarial (34ª).","ref":"SOCAP 51ª · H4","par":"D069"},{"id":"E001","tema":"h5","tipo":"caso","q":"Una sociedad mercantil que no es entidad financiera ni está supervisada obtiene autorización temporal para ofrecer, mediante un modelo novedoso, un servicio que requiere autorización conforme a una ley financiera. ¿Qué vigencia puede tener esa autorización según la LRITF?","a":"No mayor a dos años; la autoridad puede prorrogarla hasta un año más si tramita la autorización definitiva","o":["No mayor a dos años; la autoridad puede prorrogarla hasta un año más si tramita la autorización definitiva","No mayor a dos años, prorrogable por única vez por otros dos años si el modelo sigue siendo novedoso en el mercado","No mayor a un año, prorrogable por única vez por otro año más","No mayor a tres años, sin prórroga; al vencer debe obtener la autorización definitiva o iniciar su procedimiento de salida"],"x":"El art. 80 LRITF regula la autorización temporal de personas morales distintas a las ITF, Entidades Financieras y supervisados: duración acorde a los servicios y no mayor a dos años; si la sociedad realiza las acciones para obtener la autorización, registro o concesión definitivos, la autoridad, a su discreción, puede prorrogarla hasta por un año más. El año «prorrogable por única vez» es el régimen del art. 86, propio de entidades ya reguladas.","ref":"LRITF art. 80, párrs. 2 y 5 · H5","par":"E002"},{"id":"E002","tema":"h5","tipo":"caso","q":"Una SOFIPO ya supervisada obtiene autorización temporal para realizar, mediante un modelo novedoso, operaciones de su objeto social que requieren excepciones a las disposiciones generales aplicables. ¿Qué vigencia puede tener esa autorización según la LRITF?","a":"No mayor a un año, prorrogable por única vez por otro año más","o":["No mayor a tres años, sin prórroga; al vencer debe obtener la autorización definitiva o iniciar su procedimiento de salida","No mayor a dos años, prorrogable por única vez por otros dos años si el modelo sigue siendo novedoso en el mercado","No mayor a un año, prorrogable por única vez por otro año más","No mayor a dos años; la autoridad puede prorrogarla hasta un año más si tramita la autorización definitiva"],"x":"El art. 86 LRITF (Modelos Novedosos en Entidades Reguladas) dispone que las autorizaciones temporales a Entidades Financieras, ITF y demás supervisados no pueden tener vigencia mayor a un año, prorrogable por única vez por otro año. Los dos años con prórroga de hasta uno más son de la sociedad no supervisada del art. 80, cuya prórroga depende de que tramite la autorización definitiva.","ref":"LRITF art. 86, último párrafo · H5","par":"E001"},{"id":"E003","tema":"h5","tipo":"caso","q":"Una sociedad no supervisada prepara su solicitud de autorización temporal para operar un modelo novedoso conforme al art. 80 LRITF. ¿Quién debe aprobar la presentación de esa solicitud?","a":"El órgano de administración de la sociedad que pretende ser autorizada","o":["La Junta de Gobierno de la Comisión Supervisora, antes de que la sociedad la presente","El órgano de administración de la sociedad que pretende ser autorizada","El Comité Interinstitucional, integrado por representantes de la SHCP, el Banco de México y la CNBV","La asamblea general extraordinaria de accionistas, con el acta protocolizada ante fedatario público"],"x":"El art. 83, penúltimo párrafo, LRITF exige que la presentación de la solicitud la apruebe el órgano de administración de la sociedad. La Junta de Gobierno interviene del lado de la autoridad, al otorgar la autorización (art. 80, párr. 3); el Comité Interinstitucional acuerda las autorizaciones de ITF (arts. 11 y 35).","ref":"LRITF art. 83, penúltimo párrafo; art. 80, párr. 3 · H5"},{"id":"E004","tema":"h5","tipo":"caso","q":"Una casa de bolsa quiere solicitar autorización temporal para operar con un modelo novedoso conforme al Capítulo II del Título IV de la LRITF (art. 86). ¿Quién debe aprobar la presentación de la solicitud?","a":"Su consejo de administración","o":["Su consejo de administración","Su Comité de Comunicación y Control, por tratarse de un producto nuevo con riesgo de PLD/FT","La Junta de Gobierno de la CNBV, a propuesta del Oficial de Cumplimiento de la entidad","Su director general, con informe posterior al consejo de administración en la siguiente sesión"],"x":"El art. 87, último párrafo, LRITF exige que la presentación de la solicitud la apruebe el consejo de administración de la Entidad Financiera o persona sujeta a supervisión. El Comité de Comunicación y Control no aprueba solicitudes de autorización; la Junta de Gobierno de la Comisión Supervisora actúa al otorgarla (art. 86, párr. 2).","ref":"LRITF art. 87, último párrafo; art. 86, párr. 2 · H5"},{"id":"E005","tema":"h5","tipo":"caso","q":"Un banco quiere realizar una de sus Operaciones mediante un modelo novedoso. Según el texto de la disposición de modelos novedosos de su DCG, ¿cómo designa a quien otorga la autorización y a quién se presenta el resultado de la evaluación de riesgos?","a":"Dice que la otorga «la Comisión»; el resultado se presenta a la Comisión junto con la solicitud","o":["Dice que la otorga «el Comité Interinstitucional»; el resultado se entrega a la Comisión una vez lanzado el producto","Dice que la otorga «la autoridad competente»; el resultado se presenta a la Comisión junto con la solicitud","Dice que la otorga «la Secretaría»; el resultado se presenta a la UIF dentro de los 30 días siguientes al lanzamiento","Dice que la otorga «la Comisión»; el resultado se presenta a la Comisión junto con la solicitud"],"x":"La 69ª-2 de Bancos se dirige a la Entidad que pretenda obtener autorización de la Comisión: (I) evalúa el riesgo antes del lanzamiento conforme al Capítulo II Bis, (II) presenta el resultado a la Comisión junto con su solicitud y (III) se ajusta a las excepciones que fije la autorización, previa opinión de la Secretaría. La misma disposición se repite en las demás DCG; la de SOFOM es la que habla de «la autoridad competente».","ref":"Bancos 69ª-2 · H5","par":"E006"},{"id":"E006","tema":"h5","tipo":"caso","q":"Una SOFOM quiere realizar una de sus Operaciones mediante un modelo novedoso. Según el texto de la disposición de modelos novedosos de su DCG, ¿cómo designa a quien otorga la autorización y a quién se presenta el resultado de la evaluación de riesgos?","a":"Dice que la otorga «la autoridad competente»; el resultado se presenta a la Comisión junto con la solicitud","o":["Dice que la otorga «la autoridad competente»; el resultado se presenta a la Comisión junto con la solicitud","Dice que la otorga «el Comité Interinstitucional»; el resultado se entrega a la Comisión una vez lanzado el producto","Dice que la otorga «la Secretaría»; el resultado se presenta a la UIF dentro de los 30 días siguientes al lanzamiento","Dice que la otorga «la Comisión»; el resultado se presenta a la Comisión junto con la solicitud"],"x":"La 60ª-1 de SOFOM es igual que Bancos, salvo que la autorización, y las excepciones, las da «la autoridad competente», no «la Comisión»; el resultado de la evaluación previa al lanzamiento sí se presenta a la Comisión con la solicitud. El distractor tentador copia la redacción de Bancos (69ª-2). Es una diferencia de redacción: quién otorga en sustancia (art. 86, párr. 2, LRITF) es punto de criterio reservado, sin reactivo.","ref":"SOFOM 60ª-1; Bancos 69ª-2 · H5","par":"E005"},{"id":"E007","tema":"h5","tipo":"caso","q":"Un banco obtuvo autorización para realizar una Operación mediante un modelo novedoso. Según su DCG, ¿conforme a qué excepciones debe ajustarse a las Disposiciones de PLD/FT?","a":"Las que señale la Comisión en la autorización, previa opinión de la Secretaría","o":["Las que acuerde el Comité Interinstitucional para todo el sector, previa opinión de la Comisión y de la UIF","Las que señale la Comisión en la autorización, previa opinión de la Secretaría","Las que publique la Secretaría en disposiciones de carácter general, previa opinión del Banco de México y de la CNBV","Las que señale la Comisión Supervisora o el Banco de México en la autorización, previa opinión de la Secretaría"],"x":"La fr. III de la 69ª-2 de Bancos obliga a ajustarse a las Disposiciones conforme a los casos, términos, plazos, condiciones y excepciones que en la autorización señale la Comisión, previa opinión de la Secretaría. La mención del Banco de México sólo aparece en la DCG de ITF para la Sociedad Autorizada (art. 106).","ref":"Bancos 69ª-2 fr. III; DCG ITF art. 106 · H5","par":"E008"},{"id":"E008","tema":"h5","tipo":"caso","q":"Una Sociedad Autorizada para operar con modelos novedosos (art. 80 LRITF), cuya actividad está sujeta a un régimen de PLD/FT, obtuvo su autorización temporal. Según la DCG de ITF, ¿conforme a qué excepciones debe ajustarse a esas Disposiciones?","a":"Las que señale la Comisión Supervisora o el Banco de México en la autorización, previa opinión de la Secretaría","o":["Las que señale la Comisión Supervisora o el Banco de México en la autorización, previa opinión de la Secretaría","Las que acuerde el Comité Interinstitucional para todo el sector, previa opinión de la Comisión y de la UIF","Las que publique la Secretaría en disposiciones de carácter general, previa opinión del Banco de México y de la CNBV","Las que señale la Comisión en la autorización, previa opinión de la Secretaría"],"x":"El art. 106 de la DCG de ITF ordena a las Sociedades Autorizadas ajustarse a las Disposiciones conforme a las excepciones que en la autorización señale la Comisión Supervisora o el Banco de México, previa opinión de la Secretaría, y precisa que «ITF» se entiende como «Sociedad Autorizada». Antes, el art. 105 les exige evaluar el riesgo y presentar el resultado a la Comisión Supervisora competente. Las demás DCG dicen «la Comisión» (SOFOM, «la autoridad competente»).","ref":"DCG ITF arts. 105–106; art. 2 fr. XXIX · H5","par":"E007"},{"id":"E009","tema":"h5","tipo":"trampa","q":"Sobre la relación entre modelos novedosos e ITF, señala la afirmación que NO es correcta.","a":"La sociedad que obtiene la autorización temporal del art. 80 LRITF tiene el carácter de ITF mientras dure esa autorización","o":["La sociedad que obtiene la autorización temporal del art. 80 LRITF tiene el carácter de ITF mientras dure esa autorización","Una ITF ya autorizada puede obtener una autorización temporal para operar un modelo novedoso conforme al art. 86 LRITF, como entidad regulada","Las ITF son únicamente las instituciones de financiamiento colectivo y las instituciones de fondos de pago electrónico","La autorización temporal del art. 80 LRITF es para personas morales distintas a las ITF y a las Entidades Financieras"],"x":"Modelo novedoso ≠ ITF. El art. 4 fr. XVI define ITF sólo como IFC e IFPE, con autorización definitiva de la CNBV previo acuerdo del Comité Interinstitucional (art. 11); el art. 80 dirige la autorización temporal a sociedades distintas a las ITF. Una ITF sí puede operar un modelo novedoso, pero por el art. 86, como entidad regulada. Por eso en el Anexo 1 de las DCG las ITF y las sociedades autorizadas son renglones distintos.","ref":"LRITF arts. 4 fr. XVI, 11, 80 y 86 · H5"},{"id":"E010","tema":"h5","tipo":"memoria","q":"Según el art. 4 fr. XVII de la LRITF, ¿qué caracteriza a un modelo novedoso?","a":"Usa herramientas o medios tecnológicos con modalidades distintas a las existentes en el mercado al otorgarse la autorización temporal","o":["Usa herramientas o medios tecnológicos con modalidades distintas a las existentes en el mercado al otorgarse la autorización temporal","Presta servicios financieros por medios electrónicos a un número de Clientes que no excede el máximo que fije la CNBV en la autorización temporal","Opera exclusivamente con activos virtuales determinados por el Banco de México y sin sucursales físicas para atender al público","Usa herramientas tecnológicas que no existían en el mercado al momento en que se constituyó la sociedad que lo opera"],"x":"La fr. XVII define el modelo novedoso por sus modalidades tecnológicas distintas a las existentes en el mercado «al momento en que se otorgue la autorización temporal»; la misma definición se copia en la 2ª de las DCG (Centros 2ª XV; Transmisores 2ª XXII). El distractor tentador cambia el momento de referencia a la constitución de la sociedad. Probarse con un número limitado de Clientes es un criterio de evaluación del art. 82, no la definición.","ref":"LRITF art. 4 fr. XVII; art. 82 fr. V · H5"},{"id":"E011","tema":"h5","tipo":"cifra","q":"Una sociedad autorizada para operar con un modelo novedoso llegó al término de la vigencia de su autorización temporal. ¿En qué plazo debe entregar a la autoridad el reporte final?","a":"A más tardar treinta días naturales posteriores al término de la vigencia","o":["A más tardar treinta días hábiles posteriores al término de la vigencia","A más tardar sesenta días naturales contados desde la última operación que haya realizado","A más tardar treinta días naturales posteriores al término de la vigencia","Dentro de los quince días hábiles siguientes a que la autoridad financiera se lo requiera"],"x":"El art. 89 LRITF obliga a entregar un reporte final, con las cifras totales de operaciones, Clientes y situaciones de riesgo, a más tardar treinta días posteriores al término de la vigencia; por el art. 9, los días de la LRITF son naturales salvo que se diga hábiles. Además del final, durante la vigencia se entregan reportes en la periodicidad que fije la autoridad.","ref":"LRITF arts. 89 y 9 · H5"},{"id":"E012","tema":"h5","tipo":"caso","q":"La CNBV analiza otorgar la autorización temporal del art. 80 LRITF a una sociedad que propone un modelo novedoso. ¿Qué requiere la ley para que la CNBV la otorgue?","a":"El previo acuerdo de su Junta de Gobierno","o":["El previo acuerdo del Comité Interinstitucional","La aprobación de la Secretaría, previa opinión de la CONDUSEF","El previo acuerdo de su Junta de Gobierno","La opinión favorable del Banco de México y de la UIF"],"x":"El art. 80, párrafo tercero, LRITF dispone que, tratándose de Comisiones Supervisoras, se requiere previo acuerdo de la Junta de Gobierno respectiva; el art. 86 repite la regla para entidades reguladas. El acuerdo del Comité Interinstitucional corresponde a la autorización de una ITF (arts. 11 y 35).","ref":"LRITF arts. 80, párr. 3; 86, párr. 2 · H5"},{"id":"E013","tema":"h5","tipo":"caso","q":"Una sociedad con autorización temporal del art. 80 LRITF, que no es ITF, pregunta qué régimen de PLD/FT le aplica por ley. ¿Qué responde la LRITF?","a":"El del art. 58 LRITF, por remisión del art. 85; su DCG es la de ITF, que le dedica los arts. 104 a 106","o":["Ninguno durante la vigencia de la autorización temporal, porque las excepciones de la autorización la liberan de ese régimen","El del art. 115 de la LIC y la DCG de Bancos, porque la LRITF remite a esa ley en lo no previsto por ella","El del art. 95 Bis de la LGOAAC y la DCG que corresponda a su actividad, por no ser una entidad financiera","El del art. 58 LRITF, por remisión del art. 85; su DCG es la de ITF, que le dedica los arts. 104 a 106"],"x":"El art. 85 LRITF declara aplicables a las sociedades autorizadas, entre otros, el art. 48, tercer párrafo, y el art. 58 (PLD de las ITF). Por eso la DCG del art. 58 trae un título para la «Sociedad Autorizada» (arts. 104–106), aunque no sea ITF; el art. 106 le hace aplicable el resto de la DCG en lo que señale su autorización, leyendo «ITF» como «Sociedad Autorizada». La autorización puede fijar excepciones, pero no suprime el régimen.","ref":"LRITF art. 85; DCG ITF arts. 104–106 · H5"},{"id":"E014","tema":"h5","tipo":"caso","q":"Un centro cambiario pretende obtener autorización de la Comisión para realizar una de sus Operaciones mediante un modelo novedoso. ¿Qué le exige su DCG?","a":"Evaluar el riesgo antes del lanzamiento conforme al Capítulo II Bis y presentar el resultado a la Comisión con su solicitud","o":["Evaluar el riesgo dentro de los doce meses siguientes al lanzamiento y conservar el resultado a disposición de la Comisión y de la Secretaría","Nada en particular, porque su DCG no contiene una disposición sobre modelos novedosos ni remite a la LRITF","Avisar a la Secretaría veinte días hábiles antes del lanzamiento, con la opinión de su Oficial de Cumplimiento","Evaluar el riesgo antes del lanzamiento conforme al Capítulo II Bis y presentar el resultado a la Comisión con su solicitud"],"x":"Igual que Bancos: la 56ª Ter de Centros cambiarios reproduce la 69ª-2 (evaluar el riesgo antes del lanzamiento conforme al Capítulo II Bis, presentar el resultado a la Comisión junto con la solicitud y ajustarse a las excepciones que fije la Comisión, previa opinión de la Secretaría). Transmisores la tiene en la 59-2ª.","ref":"Centros cambiarios 56ª Ter; Bancos 69ª-2 · H5"},{"id":"E015","tema":"h5","tipo":"caso","q":"La autorización temporal de una sociedad del art. 80 LRITF está por vencer y la sociedad no realizó acciones para obtener la autorización, registro o concesión definitivos. ¿Qué debe hacer?","a":"Llevar a cabo el procedimiento de salida que incluyó en su solicitud","o":["Seguir operando con los Clientes ya contratados hasta que la autoridad resuelva revocar la autorización","Llevar a cabo el procedimiento de salida que incluyó en su solicitud","Solicitar su autorización como ITF, que la CNBV otorga sin acuerdo del Comité Interinstitucional","Pedir la prórroga de hasta un año, que procede aunque no haya tramitado la autorización definitiva"],"x":"El art. 80 obliga a la sociedad a realizar, durante la vigencia, las acciones para obtener la autorización, registro o concesión definitivos; si no las realiza, debe llevar a cabo el procedimiento de salida previsto en la fr. X del art. 83. La prórroga de hasta un año sólo procede si está realizando esas acciones.","ref":"LRITF arts. 80, párr. 5; 83 fr. X · H5"},{"id":"E016","tema":"h5","tipo":"memoria","q":"En el Anexo 1 (régimen simplificado) de la DCG de Transmisores de dinero, ¿cómo aparecen las ITF y las sociedades autorizadas para operar con modelos novedosos?","a":"En renglones distintos: las ITF en el numeral 1 y las sociedades autorizadas en el numeral 28","o":["En un mismo renglón, porque las sociedades autorizadas para operar modelos novedosos son una clase de ITF","En renglones distintos: las ITF en el numeral 1 y las sociedades autorizadas en el numeral 28","Sólo aparecen las sociedades autorizadas; a las ITF se les integra siempre el expediente completo","Sólo aparecen las ITF; las sociedades autorizadas no gozan del régimen simplificado de identificación"],"x":"El Anexo 1 lista a quienes aplica el régimen simplificado: el numeral 1 es «Instituciones de Tecnología Financiera» y el 28, «Sociedades autorizadas para operar con Modelos Novedosos conforme al Título IV» de la LRITF. Que sean renglones distintos confirma que una cosa no es la otra; la numeración es la misma en las demás DCG.","ref":"Transmisores de dinero, Anexo 1, numerales 1 y 28 · H5"},{"id":"E017","tema":"h5","tipo":"caso","q":"Un usuario pide a un centro cambiario venderle en efectivo el equivalente a 12,000 USD en una sola visita. ¿Qué establece la LGOAAC?","a":"Sólo puede venderle hasta el equivalente a 10,000 USD, que es el límite por cliente en un mismo día","o":["Puede venderle el total si integra el expediente completo y recaba copia de su identificación oficial","Puede venderle el total si lo divide en dos operaciones de 6,000 USD cada una durante ese mismo día","Puede venderle hasta 10,000 USD por operación y repetir otra operación ese día sin más restricción","Sólo puede venderle hasta el equivalente a 10,000 USD, que es el límite por cliente en un mismo día"],"x":"Cada fracción del art. 81-A fija un tope no superior al equivalente a diez mil dólares por cada cliente en un mismo día; dividir la operación no cambia el tope diario. El expediente define qué datos se recaban, no amplía el límite legal.","ref":"LGOAAC art. 81-A, fr. I–IV · H5"},{"id":"E018","tema":"h5","tipo":"caso","q":"Un usuario vende dólares en efectivo a un centro cambiario y pide que el contravalor en pesos se le abone por transferencia a su cuenta bancaria. ¿Qué establece la LGOAAC?","a":"No es posible: el contravalor se entrega en el mismo acto, en efectivo, cheques de viajero o cheques en moneda nacional","o":["Es posible con aviso previo a la Comisión, siempre que se use un sistema de pagos autorizado por el Banco de México","Es posible si la operación no rebasa el equivalente a 1,000 USD y se registra en la contabilidad del centro","Es posible si la cuenta está a nombre del propio usuario y el centro conserva el comprobante de la transferencia en su expediente","No es posible: el contravalor se entrega en el mismo acto, en efectivo, cheques de viajero o cheques en moneda nacional"],"x":"El art. 81-A exige entregar el contravalor en el mismo acto y liquidar sólo con efectivo, cheques de viajero o cheques en moneda nacional, sin comprender en ningún caso la transferencia o transmisión de fondos, ni por sistemas de pagos ni por abonos a cuentas. Tampoco puede liquidar por anticipado operaciones de días subsecuentes.","ref":"LGOAAC art. 81-A, párrs. 2 y 3 · H5"},{"id":"E019","tema":"h5","tipo":"caso","q":"Un centro cambiario pregunta qué debe comunicar cada trimestre a la Secretaría, por conducto de la Comisión, sobre las divisas que maneja. ¿Qué dispone su DCG?","a":"Los montos totales de divisas recibidas y entregadas en el trimestre anterior y las instituciones con las que operó el saldo neto","o":["Un reporte por cada transferencia internacional de fondos igual o superior a 1,000 USD, enviada o recibida por sus usuarios","La relación de los usuarios cuyas operaciones del mes sumaron el equivalente a 10,000 USD o más, con su sucursal","Sólo el saldo de divisas en caja al último día hábil del trimestre, sin identificar a las instituciones financieras con que operó","Los montos totales de divisas recibidas y entregadas en el trimestre anterior y las instituciones con las que operó el saldo neto"],"x":"La 49ª de Centros cambiarios ordena comunicar, en los periodos de la 22ª, los montos totales de divisas recibidas y entregadas en el trimestre inmediato anterior, e indicar las instituciones financieras, de México o del exterior, con las que operó el saldo neto en efectivo. Los centros no reportan transferencias internacionales: el 81-A les prohíbe transferir fondos.","ref":"Centros cambiarios 49ª; 22ª · H5"},{"id":"E020","tema":"h5","tipo":"memoria","q":"Según la LGOAAC (art. 81-A), ¿qué forma societaria debe tener una sociedad para operar como centro cambiario?","a":"Exclusivamente sociedad anónima","o":["Sociedad anónima o sociedad de responsabilidad limitada","Sociedad anónima o sociedad civil, con autorización de la Secretaría","Exclusivamente sociedad anónima","Cualquier sociedad mercantil, incluida la sociedad cooperativa de ahorro"],"x":"El art. 81-A reserva las operaciones de centro cambiario exclusivamente a sociedades anónimas organizadas conforme a la LGSM y registradas ante la CNBV; la 2ª fr. II de su DCG repite «sociedades anónimas». La S. de R.L. sólo se admite para el transmisor de dinero (81-A Bis). El centro no necesita autorización de la Secretaría, sino registro ante la CNBV.","ref":"LGOAAC art. 81-A; Centros cambiarios 2ª II · H5","par":"E035"},{"id":"E021","tema":"h5","tipo":"trampa","q":"Sobre centros cambiarios y casas de cambio, señala la afirmación que NO es correcta.","a":"El centro cambiario es una casa de cambio de menor tamaño, por eso su régimen PLD está en el art. 95","o":["El centro cambiario es una casa de cambio de menor tamaño, por eso su régimen PLD está en el art. 95","Lo que dispone el art. 81-A de la LGOAAC sobre centros cambiarios no resulta aplicable a las casas de cambio","El régimen PLD del centro cambiario está en el art. 95 Bis, junto con el de transmisores y SOFOM no reguladas","El centro cambiario necesita estar registrado como tal ante la CNBV para realizar en forma habitual sus operaciones"],"x":"Centro cambiario ≠ casa de cambio chica. Las casas de cambio tienen su régimen PLD en el art. 95 LGOAAC; los centros cambiarios, junto con transmisores y SOFOM no reguladas, en el 95 Bis. El propio art. 81-A excluye de su aplicación a las casas de cambio, y el centro opera con registro ante la CNBV.","ref":"LGOAAC arts. 81-A, 95 y 95 Bis · H5"},{"id":"E022","tema":"h5","tipo":"caso","q":"La CNBV presume que un centro cambiario está violando el art. 95 Bis y sus DCG. Además de supervisar e inspeccionar, ¿qué puede ordenar según la LGOAAC?","a":"Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él","o":["Que sus usuarios suspendan toda operación con el centro, mediante un aviso publicado en su página de internet","Que la Secretaría lo incluya en la Lista de Personas Bloqueadas mientras se aclara la presunción","Que los bancos, casas de bolsa y casas de cambio con que opera suspendan o cancelen sus contratos con él","Que el Banco de México inmovilice de inmediato las cuentas del centro mientras concluye la inspección"],"x":"El 95 Bis faculta a la CNBV a supervisar, vigilar e inspeccionar y, cuando presuma violaciones, a ordenar a las instituciones de crédito, casas de bolsa y casas de cambio con las que operen centros cambiarios y transmisores que suspendan o cancelen los contratos y se abstengan de nuevas operaciones. La Lista de Personas Bloqueadas tiene supuestos de inclusión propios.","ref":"LGOAAC art. 95 Bis, antepenúltimo y penúltimo párrafos · H5"},{"id":"E023","tema":"h5","tipo":"memoria","q":"Además de prevenir, detectar y reportar, ¿qué obligación impone la fracción III del art. 95 Bis LGOAAC a centros cambiarios, transmisores y SOFOM no reguladas?","a":"Registrar en su contabilidad cada operación o acto con sus clientes o usuarios y con instituciones financieras","o":["Registrar en su contabilidad cada operación o acto con sus clientes o usuarios y con instituciones financieras","Renovar ante la Secretaría, cada tres años, su manual de cumplimiento y el registro de su oficial de cumplimiento","Contar con un auditor externo certificado por la CNBV que dictamine cada año sus estados financieros","Conservar por al menos cinco años la información y documentación de identificación de sus clientes y usuarios"],"x":"El 95 Bis tiene tres fracciones: I medidas para prevenir y detectar; II reportes a la SHCP por conducto de la CNBV; III registrar en su contabilidad cada operación o acto con clientes o usuarios y con instituciones financieras. Las DCG las emite la SHCP, previa opinión de la CNBV, y la información de identificación se conserva al menos diez años, no cinco.","ref":"LGOAAC art. 95 Bis, fr. III y párrafo de conservación · H5"},{"id":"E024","tema":"h5","tipo":"caso","q":"Un centro cambiario revisa su manual y duda si debe distinguir entre Clientes y Usuarios, como lo hace la DCG de Bancos. ¿Qué dispone su DCG?","a":"Sólo regula Usuarios; sus Operaciones son las del art. 81-A de la LGOAAC","o":["Sólo regula Clientes, porque toda operación de cambio exige expediente completo","Sólo regula Usuarios; sus Operaciones son las del art. 81-A de la LGOAAC","Regula Clientes y Usuarios con las mismas definiciones que la DCG de Bancos","Regula como Clientes a quienes operan más de 10,000 USD en un mismo día"],"x":"La 2ª de Centros cambiarios define al Usuario (fr. XXVI) como quien realiza cualquier tipo de Operación con el centro, y a las Operaciones (fr. XVII) como las del art. 81-A; no define Cliente. El último distractor, además, supone algo que la ley prohíbe: operar más de 10,000 USD por cliente al día.","ref":"Centros cambiarios 2ª XVII y XXVI · H5"},{"id":"E025","tema":"h5","tipo":"caso","q":"Un usuario persona física vende a un centro cambiario billetes por el equivalente a 4,000 USD en una operación. ¿Qué debe recabar y conservar el centro?","a":"Los datos de identificación del primer escalón y, además, copia de la identificación oficial de quien interviene","o":["Los datos del primer escalón y una entrevista personal documentada por el Oficial de Cumplimiento","Sólo los datos de identificación del primer escalón, porque la operación no llega al equivalente a 5,000 USD","Nada, porque las obligaciones de identificación del centro empiezan en operaciones de 5,000 USD o más","Los datos de identificación del primer escalón y, además, copia de la identificación oficial de quien interviene"],"x":"La 4ª de Centros cambiarios escalona por operación individual: desde 1,000 y menos de 3,000 USD recaba los datos de la fr. I; desde 3,000 y menos de 5,000 USD, además, copia de la identificación oficial de las personas físicas que intervengan (fr. II). A 4,000 USD aplica la fr. II.","ref":"Centros cambiarios 4ª fr. I y II · H5"},{"id":"E026","tema":"h5","tipo":"cifra","q":"¿Desde qué monto de una operación individual debe un centro cambiario recabar y conservar datos de identificación del usuario?","a":"Desde el equivalente a 1,000 USD","o":["Desde el equivalente a 250 USD","Desde el equivalente a 1,000 USD","Desde el equivalente a 3,000 USD por operación individual","Desde el equivalente a 500 USD"],"x":"La 4ª fr. I de Centros cambiarios fija el primer escalón en operaciones iguales o superiores a mil dólares e inferiores a tres mil. Los 500 USD son el primer escalón de los transmisores de dinero (4ª fr. II de su DCG), que además recaban datos de remitente y beneficiario sin importar el monto; los 3,000 USD son el escalón de la copia de la identificación.","ref":"Centros cambiarios 4ª fr. I; Transmisores 4ª fr. II · H5"},{"id":"E027","tema":"h5","tipo":"caso","q":"Un centro cambiario quiere identificar a sus usuarios mexicanos de forma no presencial, mediante una aplicación, para operaciones de bajo monto. ¿Qué prevé su DCG?","a":"No prevé la identificación no presencial: no tiene 4ª Bis ni Anexo 2","o":["La permite sin límite de monto, siempre que recabe la Geolocalización del Dispositivo del usuario","La permite hasta 1,000 USD por operación, con autorización previa de la Secretaría y aviso a la Comisión","No prevé la identificación no presencial: no tiene 4ª Bis ni Anexo 2","La permite conforme a la 4ª Bis y al Anexo 2, hasta 5,000 o 7,000 USD al mes según el mecanismo"],"x":"La DCG de Centros cambiarios no trae disposición de identificación no presencial: no define Dispositivo ni Geolocalización y no tiene Anexo 2; además, el centro entrega el contravalor en el mismo acto (81-A). Los Transmisores sí la prevén (4ª Bis y Anexo 2).","ref":"Centros cambiarios 2ª y 4ª (sin 4ª Bis ni Anexo 2); Transmisores 4ª Bis; Anexo 2 art. 2 · H5","par":"E042"},{"id":"E028","tema":"h5","tipo":"caso","q":"Un usuario persona física quiere realizar con un centro cambiario, en efectivo y en moneda extranjera, una operación individual equivalente a 7,000 USD. ¿Debe activarse el mecanismo de escalamiento de aprobación interna?","a":"Sí: el escalamiento aplica a personas físicas por montos superiores a 5,000 USD","o":["No: el escalamiento de personas físicas aplica por más de 10,000 USD o 300,000 pesos","No: el escalamiento sólo aplica a usuarios personas morales y fideicomisos, no a personas físicas","Sí: el escalamiento aplica a toda operación en efectivo de 1,000 USD o más, sin distinguir tipo de usuario","Sí: el escalamiento aplica a personas físicas por montos superiores a 5,000 USD"],"x":"La 9ª de Centros cambiarios exige escalamiento para operaciones en efectivo con cualquier moneda extranjera de personas físicas por más de 5,000 USD y de personas morales o fideicomisos por más de 8,000 USD. Los 1,000 USD son el umbral de seguimiento y agrupación de la misma 9ª, no del escalamiento.","ref":"Centros cambiarios 9ª · H5","par":"E044"},{"id":"E029","tema":"h5","tipo":"cifra","q":"¿A partir de qué monto acumulado en un mes calendario, en efectivo en moneda extranjera, debe un centro cambiario aplicar mecanismos de seguimiento y agrupación más estrictos a un usuario?","a":"Igual o superior al equivalente a 100,000 USD","o":["Igual o superior al equivalente a 7,500 USD","Igual o superior al equivalente a 100,000 USD","Igual o superior al equivalente a 10,000 USD","Igual o superior al equivalente a 50,000 USD acumulados en el mes"],"x":"La 10ª de Centros cambiarios exige seguimiento más estricto, con un registro de datos, fecha, monto y sucursal de cada operación, para usuarios que en un mes calendario operen en efectivo en moneda extranjera por un acumulado igual o superior a cien mil dólares. Los 10,000 USD son el límite diario por cliente del 81-A.","ref":"Centros cambiarios 10ª · H5"},{"id":"E030","tema":"h5","tipo":"caso","q":"Un centro cambiario prepara el reporte de Operaciones Relevantes. ¿Desde qué monto es relevante una operación con billetes y en qué plazo se reporta?","a":"Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre","o":["Desde 7,500 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre de cada año","Desde 7,500 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 5,000 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre"],"x":"Igual que Bancos, salvo umbral y plazo: la 2ª XX de Centros cambiarios fija la Operación Relevante en 5,000 USD (no 7,500) y la 22ª manda reportar dentro de los últimos diez días hábiles de enero, abril, julio y octubre, por las operaciones de los tres meses anteriores. Bancos reporta desde 7,500 USD en los diez primeros días hábiles.","ref":"Centros cambiarios 2ª XX; 22ª · H5","par":"E031"},{"id":"E031","tema":"h5","tipo":"caso","q":"Un banco prepara el reporte de Operaciones Relevantes. ¿Desde qué monto es relevante una operación con billetes y en qué plazo se reporta?","a":"Desde 7,500 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","o":["Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre","Desde 7,500 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 7,500 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre de cada año","Desde 5,000 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre"],"x":"Bancos es el eje: Operación Relevante desde el equivalente a 7,500 USD (2ª XXX) y reporte trimestral dentro de los diez primeros días hábiles de enero, abril, julio y octubre (34ª). Centros cambiarios y Transmisores bajan el umbral a 5,000 USD y reportan en los últimos diez días hábiles.","ref":"Bancos 2ª XXX; 34ª · H5","par":"E030"},{"id":"E032","tema":"h5","tipo":"caso","q":"Un centro cambiario compra en efectivo a un usuario el equivalente a 6,000 USD. ¿En qué reporte trimestral debe informar esa operación?","a":"En el de compra en efectivo de la 23ª; por ser de 5,000 USD o más, no la incluye en el de relevantes","o":["En ninguno, salvo que el Comité de Comunicación y Control la dictamine como Operación Inusual","En el de compra en efectivo de la 23ª; por ser de 5,000 USD o más, no la incluye en el de relevantes","Sólo en el de Operaciones Relevantes, porque el de compra en efectivo abarca operaciones de hasta 5,000 USD","En ambos: en el de compra en efectivo de la 23ª y en el de Operaciones Relevantes de la 22ª"],"x":"La 23ª obliga a reportar cada compra en efectivo por más de 1,000 USD en los diez últimos días hábiles de enero, abril, julio y octubre, y aclara que, si es igual o superior a 5,000 USD, el centro no está obligado a presentarla en el reporte de relevantes de la 22ª.","ref":"Centros cambiarios 23ª; 22ª · H5"},{"id":"E033","tema":"h5","tipo":"caso","q":"Un mismo grupo empresarial controla dos centros cambiarios y un transmisor de dinero. ¿Puede un centro cambiario del grupo designar como Oficial de Cumplimiento a la misma persona que las otras sociedades?","a":"Sí: su DCG lo admite en un grupo empresarial de centros, transmisores o SOFOM no reguladas, si labora en alguna","o":["No: su DCG no prevé designar a un mismo Oficial de Cumplimiento para varias sociedades del grupo","Sí, pero sólo con autorización previa de la Comisión, que la otorga caso por caso a cada sociedad del grupo","Sí: su DCG lo admite en un grupo empresarial de centros, transmisores o SOFOM no reguladas, si labora en alguna","Sí, pero sólo si el grupo es un grupo financiero que incluya a una institución de crédito o a una casa de cambio"],"x":"La 34ª de Centros cambiarios permite designar un mismo Oficial de Cumplimiento cuando el centro forma parte de un grupo empresarial (una misma sociedad controla a las personas morales) integrado por centros cambiarios, transmisores de dinero o SOFOM no reguladas; esa persona debe laborar en alguna de las entidades. No exige autorización previa ni grupo financiero.","ref":"Centros cambiarios 34ª · H5","par":"E045"},{"id":"E034","tema":"h5","tipo":"caso","q":"Un centro cambiario prepara la información sobre la persona o grupo de personas que ejercen el control en él. ¿Qué plazo prevé su DCG para remitirla a la Secretaría, por conducto de la Comisión?","a":"20 días hábiles desde que la Comisión otorgue el registro, o 10 días hábiles desde el aviso de los accionistas","o":["Sólo 10 días hábiles desde que accionistas, socios o dueños lo comuniquen a la administración","3 días hábiles desde que se inscriba el cambio en el registro del art. 128 de la LGSM","20 días hábiles desde que la Comisión otorgue el registro, o 10 días hábiles desde el aviso de los accionistas","15 días hábiles desde que la Comisión otorgue el registro, o 5 días hábiles desde el aviso de los accionistas"],"x":"La 50ª de Centros cambiarios fija dos momentos: dentro de los veinte días hábiles siguientes a que la Comisión otorgue el registro del 81-B, o dentro de los diez días hábiles siguientes a que los accionistas comuniquen la situación a la administración. Los tres días hábiles son para informar transmisiones de acciones por más del 2 % del capital pagado.","ref":"Centros cambiarios 50ª · H5","par":"E050"},{"id":"E035","tema":"h5","tipo":"memoria","q":"Según la LGOAAC (art. 81-A Bis), ¿qué forma societaria debe tener una sociedad para operar como transmisor de dinero?","a":"Sociedad anónima o sociedad de responsabilidad limitada","o":["Sociedad anónima o sociedad de responsabilidad limitada","Exclusivamente sociedad anónima","Sociedad anónima o sociedad civil, con autorización de la Secretaría","Cualquier sociedad mercantil, incluida la sociedad cooperativa de ahorro"],"x":"El 81-A Bis entiende por transmisor exclusivamente a la sociedad anónima y a la sociedad de responsabilidad limitada organizadas conforme a la LGSM, con registro vigente ante la CNBV; la 2ª fr. XXXVII de su DCG repite ambas formas. El centro cambiario, en cambio, sólo puede ser sociedad anónima (81-A). También pueden actuar como transmisores las dependencias y entidades de la APF facultadas.","ref":"LGOAAC art. 81-A Bis, párrs. 1 y 2; Transmisores 2ª XXXVII · H5","par":"E020"},{"id":"E036","tema":"h5","tipo":"caso","q":"Una tienda de conveniencia constituida como persona moral quiere pagar remesas a los beneficiarios por cuenta de un transmisor de dinero. ¿Con qué figura puede vincularse con el transmisor?","a":"Como Persona Jurídica Coadyuvante, porque el Agente Relacionado sólo puede ser persona física","o":["Como Tercero contratado directamente por el transmisor, sin contrato que le imponga obligaciones PLD","Como Persona Jurídica Coadyuvante, porque el Agente Relacionado sólo puede ser persona física","Como Transmisor de Dinero Extranjero, por recibir recursos que envían remitentes desde el exterior","Como Agente Relacionado, figura que la LGOAAC prevé tanto para personas físicas como para morales"],"x":"Agente relacionado ≠ persona moral. El 81-A Bis y la 2ª fr. I de la DCG definen al Agente Relacionado como persona física. La Persona Jurídica Coadyuvante (2ª XXVIII) es la persona moral o PFAE que, por contrato con el transmisor, entrega o recibe recursos de los Usuarios; es figura de la DCG. El Tercero se vincula con el agente o el coadyuvante, no directamente con el transmisor.","ref":"LGOAAC art. 81-A Bis, párr. 3; Transmisores 2ª I, XXVIII y XXXV · H5"},{"id":"E037","tema":"h5","tipo":"caso","q":"Un agente relacionado de un transmisor de dinero omitió recabar los datos de un Usuario Remitente. ¿Quién responde del cumplimiento del art. 95 Bis por esa operación?","a":"El transmisor, que responde por las operaciones de sus agentes relacionados y de los terceros que contrate","o":["El agente relacionado y la CNBV, en forma solidaria, por ser ésta la autoridad que otorgó el registro","El transmisor, que responde por las operaciones de sus agentes relacionados y de los terceros que contrate","La Unidad de Inteligencia Financiera, por no haber detectado la omisión en los reportes del transmisor","Sólo el agente relacionado, porque la operación se celebró en su establecimiento y con su personal"],"x":"El 81-A Bis hace responsable al transmisor del cumplimiento del 95 Bis y de sus DCG respecto de las operaciones celebradas a través de agentes relacionados y de los terceros que contrate; la 50ª fr. I de la DCG lo extiende a Personas Jurídicas Coadyuvantes, otros transmisores y entidades financieras. Además, el agente no puede operar sin la intervención del transmisor.","ref":"LGOAAC art. 81-A Bis, párrs. 3 y 4; Transmisores 50ª fr. I · H5"},{"id":"E038","tema":"h5","tipo":"trampa","q":"¿Cuál de las siguientes operaciones NO puede realizar un transmisor de dinero según el art. 81-A Bis de la LGOAAC?","a":"Comprar y vender billetes extranjeros, hasta 10,000 USD por cliente al día, como un centro cambiario","o":["Recibir recursos para entregarlos al beneficiario, en una sola exhibición, en el mismo lugar en que los recibió","Comprar y vender billetes extranjeros, hasta 10,000 USD por cliente al día, como un centro cambiario","Recibir recursos en sus oficinas o por medios electrónicos para transferirlos a otro lugar del territorio nacional","Recibir en territorio nacional recursos en moneda extranjera para transferirlos al extranjero según instrucciones del remisor"],"x":"El último párrafo del 81-A Bis prohíbe al transmisor realizar las operaciones del art. 81-A (centro cambiario). Las otras tres son su actividad: recibir recursos en territorio nacional, en oficinas o por cualquier vía, con el único objeto de transferirlos al extranjero, a otro lugar del país o entregarlos en una sola exhibición donde se recibieron.","ref":"LGOAAC art. 81-A Bis, primer y último párrafos · H5"},{"id":"E039","tema":"h5","tipo":"caso","q":"Un transmisor de dinero quiere emitir fondos de pago electrónico para que sus usuarios guarden saldo en una aplicación. ¿Qué exige la LGOAAC?","a":"Constituirse como institución de fondos de pago electrónico conforme a la LRITF","o":["Dar aviso a la Comisión con la información de sus agentes relacionados y coadyuvantes","Constituirse como institución de fondos de pago electrónico conforme a la LRITF","Registrarse además como centro cambiario ante la CNBV y operar con sociedad anónima","Obtener del Banco de México la autorización para operar con activos virtuales"],"x":"El 81-A Bis, quinto párrafo, dispone que si el transmisor pretende emitir fondos de pago electrónico o instrumentos que los almacenen, debe constituirse como IFPE en términos de la LRITF. A la inversa, la IFPE sí puede prestar el servicio de transmisión del 81-A Bis (art. 25 fr. II LRITF).","ref":"LGOAAC art. 81-A Bis, párr. 5; LRITF art. 25 fr. II · H5"},{"id":"E040","tema":"h5","tipo":"caso","q":"Un Usuario Remitente envía al extranjero, por medio de un transmisor de dinero, el equivalente a 200 USD. ¿Qué debe recabar y conservar el transmisor?","a":"Los datos que exige la fracción I de la 4ª, que se recaban con independencia del monto","o":["Sólo el número de referencia de la transferencia, sin datos del remitente ni del beneficiario","El expediente completo del remitente, porque toda transferencia internacional lo exige","Los datos que exige la fracción I de la 4ª, que se recaban con independencia del monto","Nada, porque las obligaciones de identificación del transmisor empiezan en 500 USD"],"x":"La 4ª fr. I de Transmisores obliga, con independencia del monto, a recabar y conservar datos del Usuario Remitente (nombre, domicilio, número de referencia y cuenta o referencia de origen) y, en transferencias internacionales, información del beneficiario. Los 500 USD son el inicio del siguiente escalón (fr. II), no de toda obligación.","ref":"Transmisores 4ª fr. I, inciso A · H5"},{"id":"E041","tema":"h5","tipo":"caso","q":"Un transmisor de dinero recibe de un Usuario Remitente el equivalente a 800 USD para enviarlo. Además de los datos que se recaban con independencia del monto, ¿qué debe recabar?","a":"Los datos de identificación del escalón que va de 500 a menos de 3,000 USD","o":["Copia de la identificación oficial de quien interviene, porque ese escalón inicia en 500 USD","Ninguno adicional, porque el siguiente escalón de identificación inicia en 1,000 USD","El expediente completo del remitente, porque toda transmisión al extranjero lo exige sin importar el monto","Los datos de identificación del escalón que va de 500 a menos de 3,000 USD"],"x":"La 4ª fr. II de Transmisores fija un escalón desde 500 y menos de 3,000 USD con datos de identificación adicionales a los de la fr. I; la copia de la identificación corresponde al escalón de 3,000 a menos de 5,000 (fr. III) y el expediente, desde 5,000 (fr. IV). La IFPE que transmite dinero empieza ese escalón en 1,000 USD (DCG ITF art. 101).","ref":"Transmisores 4ª fr. I–IV; DCG ITF art. 101 · H5","par":"E064"},{"id":"E042","tema":"h5","tipo":"caso","q":"Un transmisor de dinero quiere identificar a sus usuarios mexicanos de forma no presencial, mediante una aplicación, para operaciones de bajo monto. ¿Qué prevé su DCG?","a":"La permite conforme a la 4ª Bis y al Anexo 2, hasta 5,000 o 7,000 USD al mes según el mecanismo","o":["La permite conforme a la 4ª Bis y al Anexo 2, hasta 5,000 o 7,000 USD al mes según el mecanismo","No prevé la identificación no presencial: no tiene 4ª Bis ni Anexo 2","La permite hasta 1,000 USD por operación, con autorización previa de la Secretaría y aviso a la Comisión","La permite sin límite de monto, siempre que recabe la Geolocalización del Dispositivo del usuario"],"x":"La 4ª Bis permite operar por Dispositivos de forma no presencial con personas físicas, PFAE y personas morales mexicanas, recabando previamente el expediente conforme al Anexo 2 y la Geolocalización. El art. 2 del Anexo 2 limita esas operaciones a 5,000 o 7,000 USD en un mes calendario, según el Mecanismo Tecnológico de Identificación. Centros cambiarios no tiene esta figura.","ref":"Transmisores 4ª Bis; Anexo 2, art. 2 · H5","par":"E027"},{"id":"E043","tema":"h5","tipo":"caso","q":"Un transmisor de dinero clasificó a un posible usuario como de riesgo bajo y quiere permitirle operar mientras termina de verificar sus datos y documentos. ¿Qué dispone su DCG?","a":"No puede: debe informarle que no podrá operar hasta que concluya la verificación","o":["Puede, siempre que las operaciones no rebasen el equivalente a 500 USD en el mes calendario","Puede, si la verificación la realiza un tercero contratado y el expediente queda bajo su resguardo","No puede: debe informarle que no podrá operar hasta que concluya la verificación","Puede, porque la verificación de usuarios de riesgo bajo puede concluir después de la primera operación"],"x":"La 8ª Bis de Transmisores obliga a verificar los datos y documentos y a informar a los Usuarios que no podrán realizar Operaciones hasta que concluya la verificación; no trae el supuesto de verificación posterior para riesgo bajo que tienen otras DCG. Un tercero puede verificar, pero eso no exime al transmisor ni le permite operar antes.","ref":"Transmisores 8ª Bis · H5"},{"id":"E044","tema":"h5","tipo":"caso","q":"Un usuario persona física quiere realizar con un transmisor de dinero, en efectivo y en moneda extranjera, una operación individual equivalente a 7,000 USD. ¿Debe activarse el mecanismo de escalamiento de aprobación interna?","a":"No: el escalamiento de personas físicas aplica por más de 10,000 USD o 300,000 pesos","o":["No: el escalamiento de personas físicas aplica por más de 10,000 USD o 300,000 pesos","Sí: el escalamiento aplica a personas físicas por montos superiores a 5,000 USD","No: el escalamiento sólo aplica a usuarios personas morales y fideicomisos, no a personas físicas","Sí: el escalamiento aplica a toda operación en efectivo de 1,000 USD o más, sin distinguir tipo de usuario"],"x":"La 9ª de Transmisores fija el escalamiento para personas físicas por más de 10,000 USD (o más de 300,000 pesos en moneda nacional) y para personas morales o fideicomisos por más de 50,000 USD (o 500,000 pesos). Los 5,000 USD son el umbral de Centros cambiarios para personas físicas.","ref":"Transmisores 9ª; Centros cambiarios 9ª · H5","par":"E028"},{"id":"E045","tema":"h5","tipo":"caso","q":"Un mismo grupo empresarial controla dos transmisores de dinero y un centro cambiario. ¿Qué prevé la DCG de Transmisores sobre designar como Oficial de Cumplimiento del transmisor a la misma persona que en las otras sociedades?","a":"No contiene una regla que permita designar un mismo Oficial de Cumplimiento para varias sociedades del grupo","o":["No contiene una regla que permita designar un mismo Oficial de Cumplimiento para varias sociedades del grupo","Lo admite en un grupo empresarial de centros, transmisores o SOFOM no reguladas, si labora en alguna","Lo admite sólo con autorización previa de la Comisión, que la otorga caso por caso a cada sociedad del grupo","Lo admite sólo si el grupo es un grupo financiero que incluya a una institución de crédito o a una casa de cambio"],"x":"La DCG de Transmisores no contiene la regla de Oficial de Cumplimiento común: su 36ª pide designar a un funcionario del propio transmisor, dentro de las tres jerarquías inmediatas inferiores a su director general, sin prever el supuesto de grupo. La 34ª de Centros cambiarios sí lo admite en un grupo empresarial que incluya transmisores, pero esa regla sólo rige al centro.","ref":"Transmisores 36ª (sin regla de OC común); Centros cambiarios 34ª · H5","par":"E033"},{"id":"E046","tema":"h5","tipo":"caso","q":"Un transmisor de dinero prepara el reporte de Operaciones Relevantes. ¿Desde qué monto es relevante una operación con billetes y en qué plazo se reporta?","a":"Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre","o":["Desde 7,500 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre","Desde 7,500 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre de cada año","Desde 5,000 USD; dentro de los últimos diez días hábiles de enero, abril, julio y octubre","Desde 5,000 USD; dentro de los diez primeros días hábiles de enero, abril, julio y octubre"],"x":"La 2ª XXVII de Transmisores define la Operación Relevante desde 5,000 USD y la 23ª manda reportar dentro de los diez últimos días hábiles de enero, abril, julio y octubre. Igual que Centros cambiarios; las ITF usan el mismo umbral, pero reportan en los diez primeros días hábiles, como Bancos.","ref":"Transmisores 2ª XXVII; 23ª · H5","par":"E065"},{"id":"E047","tema":"h5","tipo":"cifra","q":"Un transmisor de dinero envió al extranjero, por instrucciones de un usuario, el equivalente a 1,200 USD. ¿Qué reporte corresponde y en qué plazo?","a":"El de transferencias internacionales: mensual, dentro de los 15 días hábiles siguientes al último día hábil del mes anterior","o":["El de Operaciones Relevantes, trimestral, dentro de los diez últimos días hábiles de enero, abril, julio y octubre","El de transferencias internacionales, por cada operación, dentro de las 24 horas siguientes a que se ordena","Ninguno: los transmisores de dinero no tienen un reporte de transferencias internacionales de fondos","El de transferencias internacionales: mensual, dentro de los 15 días hábiles siguientes al último día hábil del mes anterior"],"x":"La 24ª de Transmisores, igual que Bancos, exige un reporte mensual, a más tardar dentro de los quince días hábiles siguientes al último día hábil del mes anterior, por cada transferencia internacional igual o superior a 1,000 USD; la 25ª añade datos del beneficiario en remesas. Son los centros cambiarios los que no tienen este reporte.","ref":"Transmisores 24ª–25ª · H5"},{"id":"E048","tema":"h5","tipo":"caso","q":"Un transmisor de dinero recibe de un usuario, en efectivo, el equivalente a 800 USD en euros. Según su DCG, ¿qué reporte de operaciones en efectivo con moneda extranjera corresponde?","a":"Ninguno: su DCG no prevé un reporte de operaciones en efectivo con moneda extranjera","o":["Ninguno: su DCG no prevé un reporte de operaciones en efectivo con moneda extranjera","Uno por cada operación en efectivo en cualquier moneda extranjera desde 500 USD, en los diez primeros días hábiles","Uno por cada operación en efectivo en dólares desde 7,500 USD, en los diez primeros días hábiles del trimestre siguiente","Uno por cada compra en efectivo de más de 1,000 USD, en los diez últimos días hábiles del trimestre"],"x":"La DCG de Transmisores no tiene capítulo de reporte de operaciones en efectivo con moneda extranjera (sí reporta relevantes y transferencias internacionales; los 500 USD de su 9ª son umbral de seguimiento, no de reporte). La ITF sí lo tiene para cualquier moneda extranjera desde 500 USD (art. 67), y el centro cambiario reporta las compras en efectivo de más de 1,000 USD (23ª).","ref":"Transmisores Caps. IV–V (sin ese reporte); 9ª; DCG ITF art. 67; Centros cambiarios 23ª · H5","par":"E066"},{"id":"E049","tema":"h5","tipo":"caso","q":"Un transmisor de dinero necesita la clave para acceder al sistema electrónico de la Comisión por el que enviará sus reportes. ¿Qué plazo fija su DCG?","a":"Solicitarla dentro de los 20 días hábiles posteriores a su registro","o":["Solicitarla dentro de los 20 días hábiles posteriores a su registro","Solicitarla dentro de los 15 días hábiles siguientes a que presente su primer reporte trimestral","Solicitarla y contar con ella al momento de iniciar operaciones","Solicitarla dentro de los 10 días hábiles siguientes a que designe a su Oficial de Cumplimiento"],"x":"La 59ª-1 de Transmisores obliga a solicitar la clave dentro de los veinte días hábiles posteriores a su registro y a mantenerla a nombre del Oficial de Cumplimiento o del interino. Igual en Centros cambiarios (56ª Bis); las ITF, como Bancos, deben contar con ella al iniciar operaciones (art. 98).","ref":"Transmisores 59ª-1; DCG ITF art. 98 · H5","par":"E070"},{"id":"E050","tema":"h5","tipo":"caso","q":"Un transmisor de dinero prepara la información sobre la persona o grupo de personas que ejercen el control en él. ¿Qué plazo prevé su DCG para remitirla a la Secretaría, por conducto de la Comisión?","a":"Sólo 10 días hábiles desde que accionistas, socios o dueños lo comuniquen a la administración","o":["20 días hábiles desde que la Comisión otorgue el registro, o 10 días hábiles desde el aviso de los accionistas","15 días hábiles desde que la Comisión otorgue el registro, o 5 días hábiles desde el aviso de los accionistas","3 días hábiles desde que se inscriba el cambio en el registro del art. 128 de la LGSM","Sólo 10 días hábiles desde que accionistas, socios o dueños lo comuniquen a la administración"],"x":"La 53ª de Transmisores sólo fija diez días hábiles desde que accionistas, socios o dueños comuniquen la situación a la administración; no trae el supuesto de veinte días tras el registro que sí tiene Centros cambiarios (50ª). Los tres días hábiles son para informar transmisiones de acciones o partes sociales por más del 2 % del capital pagado.","ref":"Transmisores 53ª; Centros cambiarios 50ª · H5","par":"E034"},{"id":"E051","tema":"h5","tipo":"caso","q":"Un transmisor de dinero va a contratar nuevos agentes relacionados. ¿Cuándo debe aplicar los procedimientos para asegurar la honorabilidad de los directivos y empleados de esos agentes?","a":"Antes de iniciar la relación contractual y de manera periódica mientras esté vigente, con un esquema basado en riesgos","o":["Sólo cuando la Comisión lo requiera con motivo de una visita de inspección al establecimiento del agente relacionado","Una vez al año, al presentar a la Comisión el aviso con la información de sus agentes y coadyuvantes","Sólo al iniciar la relación contractual, porque después la responsabilidad pasa al agente relacionado","Antes de iniciar la relación contractual y de manera periódica mientras esté vigente, con un esquema basado en riesgos"],"x":"La 49ª de Transmisores obliga a cerciorarse de que agentes relacionados y coadyuvantes cumplan identificación, conocimiento y seguimiento, y a asegurar la honorabilidad de su personal antes de iniciar la relación y periódicamente mientras esté vigente, con un esquema basado en riesgos. El aviso a la Comisión es otra obligación (50ª Bis), en los plazos que la propia Comisión establezca.","ref":"Transmisores 49ª; 50ª Bis · H5"},{"id":"E052","tema":"h5","tipo":"caso","q":"Un agente relacionado pregunta en qué plazo debe entregar al transmisor de dinero los registros de las operaciones que celebra y quién puede conservar los expedientes de los usuarios. ¿Qué dispone la DCG?","a":"En no más de diez días naturales desde la operación; el agente puede conservar el expediente, a disposición del transmisor y la Comisión","o":["En no más de diez días naturales desde la operación; el agente puede conservar el expediente, a disposición del transmisor y la Comisión","En no más de veinte días hábiles desde el cierre del mes; el expediente lo conserva el Oficial de Cumplimiento","Al cierre de cada trimestre; el expediente lo conserva el Tercero que haya entregado los recursos al beneficiario","En no más de diez días hábiles desde la operación; el expediente debe conservarlo siempre el transmisor, aunque el agente lo haya integrado"],"x":"La 50ª fr. III inciso g) de Transmisores obliga a pactar que agentes y coadyuvantes entreguen registros, datos y documentos dentro de un plazo que no exceda de diez días naturales desde la operación (salvo las de la 30ª, que van en el plazo que permita cumplirla), y permite que el expediente lo conserven ellos, siempre a disposición del transmisor y de la Comisión.","ref":"Transmisores 50ª fr. III, inciso g) · H5"},{"id":"E053","tema":"h5","tipo":"memoria","q":"Según el art. 4 fr. XVI de la LRITF, ¿qué instituciones son ITF?","a":"Las instituciones de financiamiento colectivo y las de fondos de pago electrónico","o":["Las de financiamiento colectivo, las de fondos de pago electrónico y las que operan con activos virtuales","Las de financiamiento colectivo, las de fondos de pago electrónico y las sociedades autorizadas para modelos novedosos","Las de fondos de pago electrónico y los transmisores de dinero con registro vigente ante la CNBV","Las instituciones de financiamiento colectivo y las de fondos de pago electrónico"],"x":"La fr. XVI define a las ITF como las IFC y las IFPE, nada más. La sociedad autorizada para operar con modelos novedosos tiene autorización temporal (Título IV) y no es ITF; operar con activos virtuales es una actividad que una ITF puede realizar con autorización del Banco de México, no un tipo de ITF.","ref":"LRITF art. 4 fr. XVI; arts. 30 y 80 · H5"},{"id":"E054","tema":"h5","tipo":"caso","q":"Un grupo de inversionistas quiere constituir una institución de financiamiento colectivo. ¿Quién otorga la autorización y qué forma societaria exige la LRITF?","a":"La CNBV, previo acuerdo del Comité Interinstitucional; debe ser sociedad anónima","o":["La CNBV, previo acuerdo del Comité Interinstitucional; debe ser sociedad anónima","El Banco de México, previa opinión de la CNBV; puede ser cualquier sociedad mercantil","La Secretaría, previa opinión del Banco de México; puede ser S.A. o S. de R.L.","La CNBV, previo acuerdo de su Junta de Gobierno; debe ser sociedad anónima"],"x":"El art. 11 LRITF exige autorización de la CNBV previo acuerdo del Comité Interinstitucional, y el art. 36, que los interesados sean sociedades anónimas. El acuerdo de la Junta de Gobierno es el requisito de las autorizaciones temporales de modelos novedosos (arts. 80 y 86), no de la autorización de una ITF.","ref":"LRITF arts. 11, 35 y 36 · H5"},{"id":"E055","tema":"h5","tipo":"cifra","q":"¿Cómo se integra el Comité Interinstitucional que acuerda las autorizaciones de ITF?","a":"Seis miembros: dos de la Secretaría, dos del Banco de México y dos de la CNBV; lo preside la CNBV","o":["Cinco miembros: dos de la CNBV, uno de la Secretaría, uno del Banco de México y uno de la CONDUSEF","Seis miembros: dos de la Secretaría, dos del Banco de México y dos de la CNBV; lo preside la Secretaría","Seis miembros: dos de la Secretaría, dos del Banco de México y dos de la CNBV; lo preside la CNBV","Nueve miembros: tres de la Secretaría, tres del Banco de México y tres de la CNBV; lo preside el Banco de México"],"x":"El art. 35 LRITF integra el Comité con seis miembros propietarios (dos de la Secretaría, dos del Banco de México y dos de la CNBV), cada uno con suplente; lo preside uno de los representantes de la CNBV y, en su ausencia, el otro. El secretario también se designa entre servidores públicos de la CNBV.","ref":"LRITF art. 35, párrs. 2 y 3 · H5"},{"id":"E056","tema":"h5","tipo":"caso","q":"El Comité Interinstitucional sesiona para resolver la autorización de una institución de fondos de pago electrónico. ¿Qué votación exige la LRITF para otorgarla?","a":"El voto favorable de al menos un representante de cada autoridad representada en el Comité","o":["La unanimidad de los seis miembros propietarios, sin que puedan votar los suplentes","Las dos terceras partes de los miembros, con la presencia de todos los propietarios","La mayoría simple de los miembros presentes, con voto de calidad del presidente en caso de empate","El voto favorable de al menos un representante de cada autoridad representada en el Comité"],"x":"El art. 35 LRITF fija como regla general la mayoría simple de los presentes con voto de calidad del presidente, pero para otorgar autorizaciones de ITF exige el voto favorable de al menos un representante de cada autoridad representada. El quórum es de al menos tres miembros, con todas las autoridades representadas.","ref":"LRITF art. 35, párr. 4 · H5"},{"id":"E057","tema":"h5","tipo":"caso","q":"Una institución de fondos de pago electrónico quiere ofrecer el servicio de transmisión de dinero del art. 81-A Bis de la LGOAAC. ¿Qué prevén la LRITF y su DCG?","a":"Puede prestarlo como actividad del art. 25 fr. II LRITF, sujeta al Título Décimo Quinto de su DCG","o":["No puede: la transmisión de dinero está reservada a S.A. y S. de R.L. con registro de transmisor","Puede prestarlo como actividad del art. 25 fr. II LRITF, sujeta al Título Décimo Quinto de su DCG","Debe registrarse además como transmisor de dinero ante la CNBV y cumplir también la DCG de Transmisores","Sólo puede prestarlo con una autorización temporal para modelo novedoso conforme al art. 86 LRITF"],"x":"El art. 25 fr. II LRITF permite a las IFPE prestar el servicio de transmisión de dinero del 81-A Bis, y el art. 99 de su DCG la sujeta al Título Décimo Quinto (arts. 99–103), con excepciones a otros artículos. No necesita registro como transmisor ni autorización temporal, y puede prestarlo a través de comisionistas.","ref":"LRITF art. 25 fr. II; DCG ITF art. 99 · H5"},{"id":"E058","tema":"h5","tipo":"memoria","q":"Según el art. 58 fr. II, inciso a), de la LRITF, ¿sobre qué actos y operaciones deben presentar reportes las ITF?","a":"Los que realicen con sus Clientes y las Operaciones entre estos, según corresponda","o":["Sólo los que realicen con sus Clientes personas morales y con fideicomisos","Sólo los que realicen con sus Clientes en efectivo, en moneda nacional o extranjera","Los que realicen con sus Clientes y las Operaciones entre estos, según corresponda","Sólo los que superen el equivalente a 7,500 UDIS al mes por Cliente"],"x":"El art. 58 fr. II a) incluye los actos, Operaciones y servicios con sus Clientes «y las Operaciones entre estos», porque en las ITF los Clientes operan entre sí a través de la plataforma. Las DCG las emite la Secretaría, previa opinión de la CNBV, y el inciso b) cubre lo que hagan consejeros, directivos, empleados y apoderados.","ref":"LRITF art. 58, fr. II · H5"},{"id":"E059","tema":"h5","tipo":"caso","q":"Una ITF designó a su Oficial de Cumplimiento y contrató a un tercero independiente para la revisión anual de efectividad. Según la LRITF, ¿quiénes deben obtener la certificación del art. 4 fr. X de la Ley de la CNBV?","a":"Ambos: el Oficial de Cumplimiento y el auditor o tercero independiente responsable de la revisión","o":["Ninguno de los dos: la certificación de la CNBV sólo se exige al personal de las instituciones de crédito","Ambos: el Oficial de Cumplimiento y el auditor o tercero independiente responsable de la revisión","Sólo el Oficial de Cumplimiento, porque el tercero independiente es ajeno a la estructura de la ITF","Sólo el tercero independiente, porque el Oficial de Cumplimiento ya fue aprobado por el Comité"],"x":"El art. 58, quinto párrafo, LRITF exige que tanto el Oficial de Cumplimiento (fr. VI del tercer párrafo) como el auditor o tercero independiente responsable de la revisión anual (fr. VII) obtengan la certificación del art. 4 fr. X de la LCNBV. El mismo artículo fija la conservación de la información en al menos diez años.","ref":"LRITF art. 58, párrs. 3 a 5 · H5"},{"id":"E060","tema":"h5","tipo":"caso","q":"Una ITF quiere operar con un activo virtual que el público usa como medio de pago. ¿Qué exige la LRITF?","a":"Que sea de los activos virtuales que determine el Banco de México y contar con su autorización previa","o":["Que sea de los activos virtuales que determine el Banco de México y contar con su autorización previa","Que el activo esté denominado en divisas y que
