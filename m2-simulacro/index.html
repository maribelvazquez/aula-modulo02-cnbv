 hábiles desde la designación, igual que Bancos","Casa de cambio: 10 días hábiles; centro cambiario: 2 días hábiles","Casa de cambio: 2 días hábiles; centro cambiario: 10 días hábiles","Casa de cambio: día hábil siguiente; centro cambiario: 10 días hábiles"],"x":"Sólo Bancos (reforma 2024) y Casas de cambio avisan la designación del OC en 2 días hábiles; Centros cambiarios, como SOFOM, Transmisores, ITF y los demás, en 10. La trampa es suponer que el centro cambiario sigue a la casa de cambio. El «día hábil siguiente» de la casa de cambio es para la revocación y el interino, no para la designación.","ref":"DCG Casas de cambio 39ª fr. I; DCG Centros cambiarios 35ª fr. I; DCG Bancos 48ª fr. I · H6"},{"id":"F102","tema":"h6","tipo":"memoria","q":"Bancos no prevé informar quién ejerce el Control de la Entidad. ¿Cuál de estos sujetos tiene 20 días hábiles desde que la CNBV le otorga el registro para presentar ese informe inicial?","a":"El centro cambiario","o":["El centro cambiario","La SOCAP","La SOFOM","La casa de cambio"],"x":"Centros cambiarios tiene 20 días hábiles desde el registro para el informe inicial y 10 días hábiles para los cambios. SOFOM, SOCAP, SOFIPO, Casas de cambio y Transmisores fijan 10 días hábiles desde que los accionistas o socios comunican el Control. El distractor más tentador es la casa de cambio, por ser del mismo giro cambiario: fija 10 días hábiles, no 20.","ref":"DCG Centros cambiarios 50ª 1er párr.; DCG Casas de cambio 52ª 1er párr. · H6"},{"id":"F103","tema":"h6","tipo":"caso","q":"El lunes una casa de cambio revoca el nombramiento de su oficial de cumplimiento. ¿Cuándo vence su plazo para avisar la revocación?","a":"Al día hábil siguiente a la revocación","o":["Dentro de los 2 días hábiles, igual que la designación","Dentro de los 10 días hábiles, igual que Bancos","Dentro de los 15 días hábiles, como los cambios al Comité","Al día hábil siguiente a la revocación"],"x":"La casa de cambio es la única que avisa la revocación (y la designación del interino) al día hábil siguiente; Bancos y los demás sujetos con OC tienen 10 días hábiles. Los 2 días hábiles son de la designación, no de la revocación.","ref":"DCG Casas de cambio 39ª fr. II; DCG Bancos 48ª fr. II · H6"},{"id":"F104","tema":"h6","tipo":"caso","q":"El lunes un transmisor de dinero revoca el nombramiento de su oficial de cumplimiento. ¿Qué plazo tiene para avisar la revocación?","a":"10 días hábiles desde que ocurrió la revocación","o":["El día hábil siguiente, igual que la casa de cambio","10 días hábiles desde que ocurrió la revocación","2 días hábiles desde que ocurrió la revocación","15 días hábiles desde que el consejo apruebe la revocación"],"x":"Transmisores sigue a Bancos: 10 días hábiles desde que ocurrió la revocación. El día hábil siguiente es exclusivo de Casas de cambio; los 2 días hábiles son de la designación en Bancos y Casas de cambio, y no en Transmisores (10).","ref":"DCG Transmisores 37ª fr. II; DCG Bancos 48ª fr. II · H6","par":"F103"},{"id":"F105","tema":"h6","tipo":"caso","q":"Una ITF autorizada con 18 personas a su servicio no constituye Comité de Comunicación y Control. ¿Qué plazo tiene para comunicar esa situación?","a":"60 días hábiles desde su autorización","o":["15 días hábiles, igual que un banco con menos de 25 personas","60 días hábiles desde su autorización","60 días naturales desde que inicie operaciones","10 días hábiles desde que designe al oficial de cumplimiento"],"x":"ITF usa el mismo criterio de menos de 25 personas que Bancos, pero comunica en 60 días hábiles, contados desde la autorización o desde que se reduzca el número de personas. Bancos y la mayoría lo comunican en los mismos 15 días hábiles del aviso del Comité. Ojo: son hábiles, no naturales.","ref":"DCG ITF art. 48 últ. párr.; DCG Bancos 44ª últ. párr. y 46ª · H6"},{"id":"F106","tema":"h6","tipo":"caso","q":"Una unión de crédito tiene 20 personas a su servicio, 400 socios y activos por 80 millones de UDIS. ¿Puede dejar de constituir el Comité?","a":"No: para no tenerlo necesita, además, menos de 10 personas","o":["Sí: basta tener menos de 25 personas, como en Bancos","Sí: basta con que sus activos sean menores a 100 millones de UDIS","Sí, si lo comunica dentro de 60 días hábiles, como una ITF","No: para no tenerlo necesita, además, menos de 10 personas"],"x":"Uniones exige tres topes a la vez: menos de 10 personas, menos de 500 socios y activos menores a 100 millones de UDIS. Aquí cumple socios y activos, pero no el de personas. El criterio de menos de 25 personas es el de Bancos y la mayoría; los 60 días hábiles son de ITF.","ref":"DCG Uniones de crédito 35ª últ. párr.; DCG Bancos 44ª últ. párr. · H6"},{"id":"F107","tema":"h6","tipo":"caso","q":"Una SOCAP con nivel de operación I y 40 personas a su servicio decide no constituir el Comité. ¿Qué rige su caso?","a":"Por su nivel I puede no tenerlo y lo comunica en 15 días hábiles","o":["Por su nivel I puede no tenerlo y lo comunica en 15 días hábiles","Debe tenerlo, porque rebasa el tope de 25 personas de Bancos","Puede no tenerlo, pero lo comunica en 60 días hábiles, como ITF","Debe tenerlo, porque rebasa el tope de 10 personas de las Uniones"],"x":"En SOCAP el criterio no es el número de personas sino el nivel de operación: las de nivel I no constituyen Comité y lo comunican en 15 días hábiles. El tope de 25 personas es de Bancos y la mayoría; el de 10 personas (con socios y activos) es de Uniones; los 60 días hábiles, de ITF.","ref":"DCG SOCAP 48ª últ. párr. y 50ª; DCG Uniones de crédito 35ª últ. párr. · H6","par":"F106"},{"id":"F108","tema":"h6","tipo":"caso","q":"Un asesor en inversiones nombra a la persona que cumplirá las funciones de su régimen PLD/FT. ¿Qué plazo tiene para informar el nombramiento?","a":"15 días hábiles: es su Representante, no un OC","o":["2 días hábiles, como el OC de Bancos","10 días hábiles, como el OC de los demás sujetos","15 días hábiles: es su Representante, no un OC","No informa nada: su DCG no prevé avisos de nombramiento"],"x":"Asesores no tiene OC ni Comité: su figura es el Representante, cuyo nombramiento informa dentro de los 15 días hábiles siguientes. Los 2 y 10 días hábiles son del OC de Bancos y de los demás. Bancos no prevé la figura de Representante.","ref":"DCG Asesores en inversiones 31ª · H6"},{"id":"F109","tema":"h6","tipo":"caso","q":"Un transmisor de dinero inscribe en el registro del art. 128 de la LGSM la transmisión del 3 % de su capital pagado. ¿Qué plazo tiene para informarlo?","a":"3 días hábiles desde que la inscribe en el registro","o":["10 días hábiles desde que la inscribe en el registro","3 días hábiles desde que se firma la compraventa","No informa: su DCG, como la de Bancos, no lo prevé","3 días hábiles desde que la inscribe en el registro"],"x":"Transmisores (como SOFOM y Centros cambiarios) informa la transmisión de más del 2 % en 3 días hábiles, contados desde la inscripción en el registro del art. 128 LGSM, no desde la operación. Los 10 días hábiles son de Casas de cambio. Bancos no lo prevé.","ref":"DCG Transmisores 53ª 3er párr. · H6"},{"id":"F110","tema":"h6","tipo":"caso","q":"Una casa de cambio inscribe en el registro del art. 128 de la LGSM la transmisión del 3 % de su capital pagado. ¿Qué plazo tiene para informarlo?","a":"10 días hábiles desde que la inscribe en el registro","o":["3 días hábiles desde que la inscribe en el registro","10 días hábiles desde que la inscribe en el registro","El día hábil siguiente a que la inscribe en el registro","No informa: su DCG, como la de Bancos, no lo prevé"],"x":"Casas de cambio tiene 10 días hábiles desde la inscripción; Centros cambiarios, Transmisores y SOFOM, 3. El día hábil siguiente de la casa de cambio es para la revocación del OC y el interino. Bancos no prevé este informe.","ref":"DCG Casas de cambio 52ª 3er párr.; DCG Centros cambiarios 50ª 3er párr. · H6","par":"F109"},{"id":"F111","tema":"h6","tipo":"caso","q":"Un transmisor de dinero recibe de un Usuario 6,000 dólares en billetes para un envío. Para efectos de Operaciones Relevantes, ¿qué aplica?","a":"Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre","o":["No es Relevante: el umbral es de 7,500 dólares, igual que en Bancos","Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre","Es Relevante y va dentro de los 15 días hábiles siguientes al cierre del mes"],"x":"Transmisores usa umbral de 5,000 USD y reporta en los 10 ÚLTIMOS días hábiles de enero, abril, julio y octubre (igual que SOFOM y Centros cambiarios). Bancos: 7,500 USD y 10 primeros días hábiles. Los 15 días hábiles mensuales son de transferencias internacionales.","ref":"DCG Transmisores 2ª fr. XXVII y 23ª; DCG Bancos 34ª · H6"},{"id":"F112","tema":"h6","tipo":"caso","q":"Una SOFOM recibe de un Cliente 6,000 dólares en billetes para pagar un crédito. Para efectos de Operaciones Relevantes, ¿qué aplica?","a":"No es Relevante: la SOFOM usa el umbral de 7,500 dólares","o":["No es Relevante: la SOFOM usa el umbral de 7,500 dólares","Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre","Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","Va en el reporte trimestral de efectivo en dólares, no en el de Relevantes"],"x":"La SOFOM comparte con Transmisores el calendario de los 10 últimos días hábiles, pero no su umbral: usa 7,500 USD, como Bancos. Con 6,000 USD no hay Relevante. Tampoco tiene reporte de efectivo en dólares (sus montos en USD sólo sirven para registro y alertas).","ref":"DCG SOFOM 2ª fr. XXVII y 28ª · H6","par":"F111"},{"id":"F113","tema":"h6","tipo":"caso","q":"Una ITF recibe de un Cliente 6,000 dólares en billetes. Para efectos de Operaciones Relevantes, ¿qué aplica?","a":"Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","o":["No es Relevante: el umbral es de 7,500 dólares, igual que en Bancos","Es Relevante y va en los 10 últimos días hábiles de enero, abril, julio y octubre, como Transmisores","Es Relevante y va en los 10 primeros días hábiles de enero, abril, julio y octubre","Sólo cuenta si se trata de cheques de viajero o monedas de oro, plata o platino"],"x":"ITF usa el umbral de 5,000 USD, como Transmisores, pero sólo en billetes y monedas metálicas, y reporta en los 10 PRIMEROS días hábiles, como Bancos. Combina el umbral de los transmisores con el calendario de Bancos.","ref":"DCG ITF art. 2 fr. XXIV y art. 66; DCG Transmisores 23ª · H6","par":"F111"},{"id":"F114","tema":"h6","tipo":"caso","q":"Un socio de una SOCAP deposita cheques de viajero por 8,000 dólares. ¿Encuadra en la definición de Operación Relevante de su DCG?","a":"No: su definición sólo abarca billetes y monedas metálicas","o":["No: su definición sólo abarca billetes y monedas metálicas","Sí: rebasa el umbral de 7,500 dólares, igual que en Bancos y Casas de bolsa","Sí: en la SOCAP el umbral es de 5,000 dólares","No: en la SOCAP el umbral es de 10,000 dólares"],"x":"SOCAP (y SOFIPO) conservan los 7,500 USD de Bancos, pero su definición sólo incluye billetes y monedas metálicas de curso legal: no cheques de viajero ni monedas de platino, oro o plata. Los 5,000 USD son de Centros, Transmisores e ITF; los 10,000 USD, del reporte de cheques de caja de Bancos.","ref":"DCG SOCAP 2ª fr. XXIX; DCG Bancos 2ª fr. XXX · H6"},{"id":"F115","tema":"h6","tipo":"memoria","q":"¿Cuál de estos sujetos reporta efectivo en dólares sólo por compras a sus Clientes de 500 dólares o más, sin umbral para Usuarios?","a":"La unión de crédito","o":["La SOFIPO","La casa de bolsa","La SOCAP","La unión de crédito"],"x":"Uniones reporta sólo operaciones de compra en efectivo con USD de Clientes desde 500 USD, sin umbral de Usuarios. SOFIPO, SOCAP y Casas de bolsa usan los dos umbrales de Bancos (Clientes ≥ 500 USD; Usuarios > 250 USD); SOCAP, como Uniones, sólo reporta compras, y Casas de bolsa no incluye depósitos.","ref":"DCG Uniones de crédito 27ª; DCG SOCAP 38ª; DCG Bancos 34ª Bis · H6"},{"id":"F116","tema":"h6","tipo":"caso","q":"Un centro cambiario compra a un Usuario 1,200 dólares en efectivo. ¿Qué reporte genera y cuándo lo envía?","a":"Reporte de compras; 10 últimos días hábiles de enero, abril, julio y octubre","o":["No genera reporte: sólo reporta desde 5,000 dólares, como en Relevantes","Reporte de compras; 10 últimos días hábiles de enero, abril, julio y octubre","Reporte de compras; 10 primeros días hábiles de enero, abril, julio y octubre","Reporte mensual, dentro de los 15 días hábiles siguientes al cierre del mes"],"x":"Centros cambiarios reporta cada compra en efectivo de más de 1,000 USD, sin tope superior, en los 10 ÚLTIMOS días hábiles de enero, abril, julio y octubre por el trimestre anterior. Los 5,000 USD son su umbral de Relevantes; los 10 primeros días hábiles son el calendario de Bancos.","ref":"DCG Centros cambiarios 23ª · H6"},{"id":"F117","tema":"h6","tipo":"trampa","q":"Un centro cambiario compra a un Usuario 6,000 dólares en efectivo. Por esa operación, ¿de qué reporte queda liberado?","a":"Del reporte de Operaciones Relevantes de la 22ª","o":["Del reporte de compras de más de 1,000 dólares de la 23ª","Del reporte de Operaciones Relevantes de la 22ª","Del reporte de montos totales de divisas de la 49ª","Del informe cuantitativo anual de la 48ª Bis"],"x":"La compra en efectivo de 5,000 USD o más SÍ se reporta por la 23ª y, por ella, el centro NO presenta el reporte de Relevantes de la 22ª. Es el mismo mecanismo de Bancos (34ª Bis), pero allá opera desde 7,500 USD. El error común es creer que la operación grande «se va» a Relevantes.","ref":"DCG Centros cambiarios 23ª últ. párr.; DCG Bancos 34ª Bis últ. párr. · H6"},{"id":"F118","tema":"h6","tipo":"caso","q":"Una SOFIPO y una unión de crédito envían cada una al extranjero una transferencia de 2,000 dólares. ¿Qué deben reportar?","a":"SOFIPO: reporte mensual en 15 días hábiles; la Unión no tiene ese reporte","o":["Ambas: reporte mensual dentro de los 15 días hábiles siguientes al último día hábil del mes","Ambas: reporte trimestral en los 10 primeros días hábiles del trimestre","SOFIPO: reporte trimestral en 10 días hábiles; la Unión, mensual en 15","SOFIPO: reporte mensual en 15 días hábiles; la Unión no tiene ese reporte"],"x":"SOFIPO, como Bancos, reporta transferencias internacionales desde 1,000 USD, mensualmente, dentro de los 15 días hábiles siguientes al último día hábil del mes anterior. La DCG de Uniones no prevé este reporte (tampoco SOFOM, Asesores, Fondos ni Centros cambiarios). La trampa es suponer que la Unión sigue a SOCAP y SOFIPO.","ref":"DCG SOFIPO 38ª; DCG Bancos 35ª y 36ª · H6"},{"id":"F119","tema":"h6","tipo":"cifra","q":"Bancos reporta ventas de activos virtuales desde 2,250 dólares. ¿Desde qué monto reporta las ventas una ITF?","a":"7,500 UDIS","o":["7,500 UDIS","2,250 dólares","7,500 dólares","5,000 dólares"],"x":"Sólo Bancos e ITF tienen este reporte trimestral (10 primeros días hábiles). Bancos: compras sin monto mínimo y ventas desde 2,250 USD; ITF: ventas desde 7,500 UDIS. Los 7,500 y 5,000 dólares son umbrales de Relevantes, no de activos virtuales.","ref":"DCG ITF art. 74; DCG Bancos 34ª Quáter · H6"},{"id":"F120","tema":"h6","tipo":"memoria","q":"¿Cuál de estos sujetos presenta, igual que Bancos, el informe cuantitativo anual en los 10 últimos días hábiles de abril?","a":"El transmisor de dinero","o":["La SOFOM","La casa de bolsa","El transmisor de dinero","La casa de cambio"],"x":"El informe cuantitativo anual lo prevén Bancos, Asesores, Uniones, Centros cambiarios y Transmisores, en los 10 últimos días hábiles de abril. SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO, Casas de cambio e ITF no lo prevén. No confundir «últimos» de abril con los «últimos» trimestrales de Relevantes.","ref":"DCG Transmisores 52ª Bis; DCG Bancos 60ª Bis · H6"},{"id":"F121","tema":"h6","tipo":"caso","q":"Ante sospecha fundada sobre una operación que se pretende realizar, ¿a qué decisión liga expresamente cada DCG el plazo de 24 horas: la de Bancos y la de la SOFOM?","a":"Banco: a no realizar la operación; SOFOM: a aceptarla","o":["Banco: a aceptarla; SOFOM: a no realizar la operación","Ambos: a aceptarla, y si no la realizan no reportan","Banco: a no realizar la operación; SOFOM: a aceptarla","Ninguno: las 24 horas corren desde la sesión del Comité"],"x":"Bancos 41ª: «podrá no llevar a cabo» la operación y, en tal caso, reporta dentro de las 24 horas con leyenda LD o FT. SOFOM 33ª: «en el evento en que decida aceptar» la operación, reporta dentro de las 24 horas con la leyenda «Reporte de 24 horas». En ambos, el otro supuesto se reporta «en los términos» de la propia disposición: se reporta la acepte o no. La lógica está invertida.","ref":"DCG Bancos 41ª; DCG SOFOM 33ª · H6"},{"id":"F122","tema":"h6","tipo":"cifra","q":"Bancos y SOFOM regulan el reporte de 24 horas por sospecha fundada. ¿Qué leyenda inserta cada uno en la columna de descripción?","a":"Banco: «Reporte de 24 horas LD» o «FT»; SOFOM: «Reporte de 24 horas»","o":["Ambos: «Reporte de 24 horas LD» o «FT», según el delito","Banco: «Reporte de 24 horas LD» o «FT»; SOFOM: «Reporte de 24 horas»","Banco: «Reporte de 24 horas»; SOFOM: «Reporte de 24 horas LD» o «FT»","Ambos: «Lista de Personas Bloqueadas», por ser de 24 horas"],"x":"La leyenda diferenciada LD/FT es exclusiva de Bancos (41ª); la SOFOM y las otras nueve DCG con este régimen usan la leyenda única «Reporte de 24 horas» (33ª). «Lista de Personas Bloqueadas» es la leyenda del reporte por la LPB, no la de sospecha fundada.","ref":"DCG Bancos 41ª; DCG SOFOM 33ª · H6","par":"F121"},{"id":"F123","tema":"h6","tipo":"caso","q":"Una ITF detecta que un Cliente pretende realizar una operación con recursos de posible origen ilícito. ¿Desde cuándo corren sus 24 horas para reportar?","a":"Desde que la conoce por la alerta o por el informe de un empleado","o":["Desde que decide aceptar la operación, sin importar cuándo la conoció","Desde que concluye la sesión del Comité que la dictamina","Desde que la conoce por la alerta o por el informe de un empleado","Desde que decide no realizarla, como un banco"],"x":"La ITF reporta en no más de 24 horas desde que conoce la operación por la alerta o el informe de un empleado, en tres supuestos: el Cliente pretende o intenta la operación, la ITF la acepta, o hay relación con la Lista de Personas Bloqueadas. No condiciona las 24 horas a aceptar (SOFOM) ni a no realizar (Bancos). La sesión del Comité es el arranque de los 3 días hábiles del reporte ordinario.","ref":"DCG ITF art. 73; DCG SOFOM 33ª · H6"},{"id":"F124","tema":"h6","tipo":"caso","q":"Un banco y una ITF tienen cada uno 60 días naturales para dictaminar una Operación Inusual. ¿Desde cuándo corre el plazo en cada uno?","a":"Banco: desde que se genera la alerta; ITF: desde que detecta la Operación","o":["Banco: desde que se genera la alerta; ITF: desde que detecta la Operación","Ambos: desde que concluye la sesión del Comité que conoce el caso","Banco: desde que detecta la Operación; ITF: desde que se genera la alerta","Ambos: desde el último día hábil del mes en que se celebró la Operación"],"x":"En Bancos y en otras diez DCG los 60 días naturales corren desde que se genera la alerta (sistema, modelo, proceso o empleado, lo que ocurra primero); ITF los cuenta desde que detecta la Operación. La sesión del Comité es el punto de partida de los 3 días hábiles para reportar, no del dictamen.","ref":"DCG Bancos 37ª 1er párr.; DCG ITF art. 69 · H6"},{"id":"F125","tema":"h6","tipo":"trampa","q":"El Manual de una casa de bolsa trae criterios para sumar 30 días naturales al dictamen de una Operación Inusual, como lo hace un banco. ¿Puede aplicarlos?","a":"No: la ampliación de 30 días sólo la prevé la DCG de Bancos","o":["Sí: todas las DCG la permiten si el Manual fija los criterios","Sí, pero sólo con autorización previa de la CNBV en cada caso","No: la ampliación de 30 días sólo la prevé la DCG de Bancos","Sí, aunque sólo para una Operación Interna Preocupante"],"x":"La ampliación de 30 días naturales existe sólo en Bancos, condicionada a que su Manual establezca los criterios conforme a las guías de la Secretaría, y no aplica a la Operación Interna Preocupante. La casa de bolsa tiene los 60 días naturales desde la alerta, sin ampliación.","ref":"DCG Bancos 37ª 2º párr.; DCG Casas de bolsa 38ª · H6"},{"id":"F126","tema":"h6","tipo":"caso","q":"Un asesor en inversiones dictamina una Operación Inusual. ¿Desde cuándo corren sus 3 días hábiles para enviar el reporte?","a":"Desde que su Representante la dictamina","o":["Desde que su Representante la dictamina","Desde que concluye la sesión del Comité que la dictamina","Desde que se generó la alerta en su sistema","Desde que el oficial de cumplimiento firma el dictamen"],"x":"Asesores no tiene Comité ni OC: dictamina el Representante (dentro de los mismos 60 días naturales desde la alerta) y los 3 días hábiles corren desde su dictamen. En Bancos y los demás corren desde que concluye la sesión del Comité. La alerta es el arranque del plazo para dictaminar, no para reportar.","ref":"DCG Asesores en inversiones 20ª; DCG Bancos 37ª · H6"},{"id":"F127","tema":"h6","tipo":"trampa","q":"¿Cuál de estos sujetos NO regula en su DCG el reporte de 24 horas cuando una persona con la que opera aparece en la Lista de Personas Bloqueadas?","a":"El asesor en inversiones","o":["El transmisor de dinero","La ITF","El centro cambiario","El asesor en inversiones"],"x":"Bancos y otras diez DCG ordenan suspender de inmediato y reportar en 24 horas con la leyenda «Lista de Personas Bloqueadas». La DCG de Asesores no regula la Lista. Transmisores, Centros cambiarios e ITF sí la regulan (Transmisores y Centros, para Usuarios; ITF, Fondos y Uniones, sólo para Clientes).","ref":"DCG Bancos 72ª fr. I-II; DCG Transmisores 62ª fr. II; DCG ITF art. 62 fr. II · H6"},{"id":"F128","tema":"h6","tipo":"memoria","q":"Bancos reevalúa el grado de riesgo de sus Clientes al menos cada 6 meses. ¿Cuál de estos sujetos fija en su DCG una sola evaluación por año calendario?","a":"El asesor en inversiones","o":["La casa de cambio","El asesor en inversiones","La SOFOM","La ITF"],"x":"Asesores: al menos una evaluación por año calendario. SOFOM, Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones: dos por año calendario. ITF: cada 6 meses, como Bancos. Casas de cambio, Centros cambiarios y Transmisores no fijan periodicidad.","ref":"DCG Asesores en inversiones 13ª; DCG Bancos 25ª Bis · H6"},{"id":"F129","tema":"h6","tipo":"caso","q":"Una SOFOM quiere copiar en su Manual la periodicidad de Bancos para reevaluar el riesgo de sus Clientes. ¿Qué dice su DCG?","a":"Al menos dos evaluaciones por año calendario","o":["Al menos una evaluación cada 6 meses, igual que Bancos","Al menos dos evaluaciones por año calendario","Al menos una evaluación por año calendario","No fija periodicidad: seguimiento continuo por alertas"],"x":"La SOFOM (como Casas de bolsa, Fondos, SOCAP, SOFIPO y Uniones) hace al menos dos evaluaciones por año calendario, sobre Clientes con contrato de al menos 6 meses. «Cada 6 meses» es la redacción de Bancos e ITF; el examen puede preguntar la redacción. Una por año es de Asesores.","ref":"DCG SOFOM 21ª; DCG Bancos 25ª Bis · H6"},{"id":"F130","tema":"h6","tipo":"caso","q":"Un centro cambiario quiere copiar en su Manual la periodicidad de Bancos para reevaluar el riesgo de sus Usuarios. ¿Qué dice su DCG?","a":"No fija periodicidad: seguimiento continuo por alertas","o":["Al menos una evaluación cada 6 meses, igual que Bancos","Al menos dos evaluaciones por año calendario, como la SOFOM","Al menos una evaluación por año calendario","No fija periodicidad: seguimiento continuo por alertas"],"x":"Centros cambiarios, Casas de cambio y Transmisores no fijan periodicidad: dan seguimiento continuo por alertas y reclasificación. Bancos e ITF: cada 6 meses; SOFOM y otros cinco: dos por año calendario; Asesores: una.","ref":"DCG Centros cambiarios 15ª; DCG Bancos 25ª Bis · H6","par":"F129"},{"id":"F131","tema":"h6","tipo":"caso","q":"Una ITF tiene Clientes de riesgo bajo, medio y alto. ¿Qué expedientes debe verificar al menos una vez al año?","a":"Los de todos sus Clientes, sin importar el grado de riesgo","o":["Los de todos sus Clientes, sin importar el grado de riesgo","Sólo los de Clientes de riesgo alto, igual que Bancos","Los de riesgo alto y medio; los de bajo, cada dos años","Sólo los de Clientes sin operar por más de 180 días naturales"],"x":"ITF verifica por lo menos una vez al año los expedientes de todos sus Clientes. Bancos y la mayoría lo hacen anualmente para los de Grado de Riesgo alto. Los 180 días naturales sin operar son una regla adicional de Transmisores para Usuarios no presenciales.","ref":"DCG ITF art. 24; DCG Bancos 21ª · H6"},{"id":"F132","tema":"h6","tipo":"caso","q":"Un Usuario identificado no presencialmente por un transmisor de dinero no ha operado en 200 días y vuelve a pretender un envío. Además de la revisión anual de riesgo alto, ¿qué exige su DCG?","a":"Confirmar que su expediente esté integrado, por pasar de 180 días naturales","o":["Nada adicional: aplica sólo la revisión anual de riesgo alto","Confirmar que su expediente esté integrado, por pasar de 180 días hábiles","Confirmar que su expediente esté integrado, por pasar de 180 días naturales","Darlo de baja y abrirle un expediente nuevo, por pasar de 90 días naturales sin operar"],"x":"Transmisores, además de la revisión anual de riesgo alto que comparte con Bancos, exige confirmar el expediente de Usuarios identificados no presencialmente que pasaron más de 180 días naturales sin operar, con independencia de su grado de riesgo, cuando pretendan volver a operar. Son naturales, no hábiles. Los 90 días naturales son del interinato del OC.","ref":"DCG Transmisores 12ª; DCG Bancos 21ª · H6","par":"F131"},{"id":"F133","tema":"h6","tipo":"caso","q":"Un asesor en inversiones y una casa de bolsa ejecutan una operación el mismo día. ¿Cuánto tiempo mínimo debe conservar cada uno su registro?","a":"Asesor: 5 años; casa de bolsa: 10 años","o":["Ambos: 10 años desde la ejecución","Asesor: 10 años; casa de bolsa: 5 años","Ambos: 5 años, como la metodología de riesgos","Asesor: 5 años; casa de bolsa: 10 años"],"x":"La regla general es no menos de 10 años desde la ejecución de la Operación (Bancos, Casas de bolsa y todos los demás); Asesores es la excepción con 5. Los 5 años también son la conservación de la metodología y del informe de auditoría, lo que alimenta la confusión.","ref":"DCG Asesores en inversiones 37ª; DCG Casas de bolsa 60ª · H6"},{"id":"F134","tema":"h6","tipo":"caso","q":"Un asesor en inversiones modifica su Manual. ¿Desde cuándo corren sus 20 días hábiles para enviarlo a la CNBV?","a":"Desde que su Representante elabora las modificaciones","o":["Desde que su comité de auditoría aprueba las modificaciones","Desde que su Representante elabora las modificaciones","Desde que su Comité de Comunicación y Control las aprueba","Desde que el comisario, el comité de auditoría o el Comité las aprueban"],"x":"El plazo es de 20 días hábiles en todos; lo que cambia es el arranque. Asesores no tiene comité que apruebe: corre desde que el Representante elabora los cambios. Bancos cuenta desde la aprobación del comité de auditoría; la fórmula de tres aprobadores es de ITF.","ref":"DCG Asesores en inversiones 38ª; DCG Bancos 64ª 5º párr. · H6"},{"id":"F135","tema":"h6","tipo":"caso","q":"Un banco y una SOFOM suspenden a un Cliente que aparece en la Lista de Personas Bloqueadas. ¿Qué dicen sus DCG sobre el aviso al Cliente?","a":"Ambos avisan de inmediato; sólo el banco fija 10 días hábiles para acudir","o":["Ambos avisan de inmediato y fijan 10 días hábiles para acudir ante la autoridad","Banco: aviso inmediato; SOFOM: aviso dentro de 10 días hábiles","Ambos avisan de inmediato; sólo el banco fija 10 días hábiles para acudir","Ambos avisan dentro de las 24 horas siguientes a la suspensión"],"x":"Bancos avisa de inmediato, con fundamentos y causas, y la persona puede acudir a la autoridad dentro de 10 días hábiles desde que recibe el escrito. La SOFOM (como Casas de cambio, Centros cambiarios y Transmisores) avisa de inmediato, pero el texto del aviso no fija los 10 días hábiles. Las 24 horas son del reporte a la autoridad, no del aviso al Cliente.","ref":"DCG Bancos 72ª últ. párr.; DCG SOFOM 63ª últ. párr. · H6"},{"id":"F136","tema":"h6","tipo":"caso","q":"Un transmisor de dinero suspende a un Usuario que aparece en la Lista y se lo avisa por escrito. ¿Desde cuándo cuentan los 10 días hábiles para que el Usuario se defienda ante la UIF?","a":"Desde que el Usuario conoce la suspensión","o":["Desde que el Usuario conoce la suspensión","Desde que el Usuario recibe el escrito de aviso","Desde que la UIF emite su resolución","Desde que el transmisor envía el reporte de 24 horas"],"x":"En Transmisores el aviso inmediato no fija días; los 10 días hábiles son los de la audiencia (63ª fr. I), contados desde que el interesado conoce la suspensión, ampliables una vez. «Desde que recibe el escrito» es la redacción del aviso de Bancos (72ª), que no está en la DCG de Transmisores.","ref":"DCG Transmisores 62ª últ. párr. y 63ª fr. I; DCG Bancos 72ª últ. párr. · H6"},{"id":"F137","tema":"h6","tipo":"caso","q":"En una SOCAP y en una SOFIPO, la UIF resuelve sobre la permanencia de un socio en la Lista. ¿Qué plazos fija cada DCG para resolver y notificar?","a":"Ambas: resolver en 10 días hábiles; sólo SOFIPO fija 15 para notificar","o":["Ambas: resolver en 10 días hábiles y notificar en 15 días hábiles","Ambas: resolver en 10 días hábiles; sólo SOCAP fija 15 para notificar","Ambas: resolver en 10 días hábiles; sólo SOFIPO fija 15 para notificar","SOCAP: resolver en 15 días hábiles; SOFIPO: resolver en 10 días hábiles"],"x":"Las dos fijan 10 días hábiles para resolver desde que se presenta el interesado. Sólo SOFIPO agrega, como Bancos, la notificación por oficio dentro de 15 días hábiles desde la emisión. La trampa es suponer que SOCAP y SOFIPO, por ser sector de ahorro y crédito popular, son idénticas.","ref":"DCG SOFIPO 76ª fr. II; DCG SOCAP 76ª fr. II; DCG Bancos 73ª fr. II · H6"},{"id":"F138","tema":"h6","tipo":"caso","q":"En una casa de cambio y en un centro cambiario, la UIF resuelve sobre la permanencia de un Usuario en la Lista. ¿Cuál de las dos DCG fija 15 días hábiles para notificar la resolución?","a":"Sólo la del centro cambiario","o":["Sólo la del centro cambiario","Sólo la de la casa de cambio","Las dos, igual que Bancos","Las dos, pero en días naturales"],"x":"Fijan 15 días hábiles para notificar sólo Bancos, Fondos, SOFIPO, Centros cambiarios e ITF. Casas de cambio, como SOFOM, Casas de bolsa, SOCAP, Uniones y Transmisores, fija 10 días hábiles para resolver pero no plazo para notificar.","ref":"DCG Centros cambiarios 60ª fr. II; DCG Casas de cambio 62ª fr. II · H6","par":"F137"},{"id":"F139","tema":"h6","tipo":"caso","q":"Un banco (reforma DOF 28-ago-2024) y una SOFOM (reforma DOF 9-sep-2021) deben adecuar su Manual. ¿Qué plazo les dio su transitorio, desde la entrada en vigor?","a":"Banco: 18 meses; SOFOM: 4 meses","o":["Banco: 4 meses; SOFOM: 18 meses","Ambos: 18 meses desde la entrada en vigor","Banco: 12 meses; SOFOM: 9 meses","Banco: 18 meses; SOFOM: 4 meses"],"x":"La reforma 2024 dio a Bancos 18 meses para el Manual (12 para metodología, 18 para sistemas). Las reformas 2021 y 2023 de SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO, Uniones, Centros cambiarios y Transmisores dieron 4 meses. Los 12 y 9 meses son de la metodología.","ref":"DCG Bancos 3ª trans. fr. I (2024); DCG SOFOM 4ª trans. fr. I (2021) · H6"},{"id":"F140","tema":"h6","tipo":"caso","q":"Un transmisor de dinero debe ajustar su metodología de riesgos a la reforma de sus DCG (DOF 5-abr-2023). ¿Qué plazo le dio el transitorio?","a":"9 meses desde la entrada en vigor","o":["12 meses desde la entrada en vigor, igual que Bancos","9 meses desde la entrada en vigor","4 meses desde la entrada en vigor","18 meses desde la entrada en vigor"],"x":"Las reformas 2021 y 2023 siguen el ritmo 4 · 9 · 18 meses (Manual, metodología, sistemas). Transmisores tuvo 9 meses para la metodología desde el 6-abr-2023. Bancos (2024) tuvo 12. Los 4 meses son del Manual y los 18, de los sistemas.","ref":"DCG Transmisores 4ª trans. fr. II (2023); DCG Bancos 3ª trans. (2024) · H6"},{"id":"F141","tema":"h6","tipo":"trampa","q":"Un centro cambiario estudia los transitorios de su reforma (DOF 19-ene-2023). ¿Para qué obligación fijan un plazo en meses?","a":"Sólo para modificar el Manual: 4 meses","o":["Para Manual, metodología y sistemas: 4, 9 y 18 meses","Sólo para modificar el Manual: 4 meses","Para Manual y metodología: 18 y 12 meses, como Bancos","Sólo para los sistemas automatizados: 18 meses"],"x":"La reforma 2023 de Centros cambiarios sólo da 4 meses para modificar el Manual y deja el informe cuantitativo para la fecha que fije la CNBV; no trae plazo para metodología ni sistemas. El esquema 4 · 9 · 18 es de los demás sujetos reformados en 2021 y 2023; 18 y 12, de Bancos 2024.","ref":"DCG Centros cambiarios 3ª y 4ª trans. (2023) · H6"},{"id":"F142","tema":"h6","tipo":"caso","q":"Al comparar el transitorio de Bancos (2024) con el de una unión de crédito (2023), ¿en qué plazo coinciden?","a":"Sistemas automatizados: 18 meses en ambos","o":["Manual de Cumplimiento: 18 meses en ambos","Metodología de riesgos: 12 meses en ambos","Certificación del oficial de cumplimiento: 12 meses","Sistemas automatizados: 18 meses en ambos"],"x":"Los 18 meses para sistemas automatizados coinciden en Bancos y en Uniones (y en SOFOM, Casas de bolsa, Asesores, Fondos, SOCAP, SOFIPO y Transmisores), cada uno contado desde la entrada en vigor de su propia reforma. El Manual (18 contra 4) y la metodología (12 contra 9) difieren; la certificación del OC sólo la trae Bancos.","ref":"DCG Bancos 3ª trans. (2024); DCG Uniones de crédito 4ª trans. fr. I-III (2023) · H6"},{"id":"F143","tema":"h6","tipo":"memoria","q":"¿Cuál de estos sujetos recibió en su reforma de 2021 un plazo de 6 meses para registrar la geolocalización por dirección IP?","a":"La casa de bolsa","o":["La casa de bolsa","La SOFOM","La SOCAP","La SOFIPO"],"x":"Sólo Casas de bolsa y Fondos (5ª trans. fr. IV, 2021) dieron 6 meses para registrar coordenadas por dirección IP. SOFOM y SOFIPO recibieron 12 meses para la nueva solicitud del Anexo 2; SOCAP no trae ninguno de esos plazos. La certificación del OC (12 meses) es sólo de Bancos 2024.","ref":"DCG Casas de bolsa 5ª trans. fr. IV (2021) · H6"},{"id":"F144","tema":"h6","tipo":"caso","q":"Una persona de las previstas en la Octava Disposición Transitoria de la LRITF obtiene su autorización como ITF. Conforme al Segundo transitorio de sus DCG, ¿qué plazo tiene para su metodología y sistemas?","a":"180 días naturales desde que obtiene la autorización","o":["180 días hábiles desde la publicación de las DCG en el DOF","360 días naturales desde la publicación de las DCG en el DOF","180 días naturales desde que obtiene la autorización","18 meses desde que obtiene la autorización, igual que Bancos"],"x":"El Segundo transitorio (DOF 10-sep-2018) aplica sólo a las personas de la Octava transitoria de la LRITF: 180 días naturales para metodología y sistemas y 360 para regularizar los expedientes de Clientes existentes, contados desde que obtienen la autorización, no desde la publicación. Los 18 meses son de Bancos 2024.","ref":"DCG ITF 2º trans. fr. I y II (DOF 10-sep-2018) · H6"},{"id":"H001","tema":"h7","tipo":"caso","q":"Un ex servidor público estatal, señalado por corrupción y por vínculos con un cártel, tiene relación corporativa con once sociedades con esquema de empresas fantasma; varias comparten un domicilio con características de casa habitación y declaran actividades incompatibles entre sí. Su esposa y su padre le ayudan a mover los recursos, y parte del dinero llega a través de una inmobiliaria cuyo accionista está vinculado con gasolineras y probablemente con el robo de combustible. ¿Qué tipología describe mejor el caso?","a":"Personas Políticamente Expuestas (PEPs)","o":["Personas Políticamente Expuestas (PEPs)","Corrupción ex servidor público","Cohecho alto ejecutivo sector energético","Estafa Maestra versión Pemex"],"x":"El ex servidor apoyado por su esposa y su padre, las once empresas fantasma y el vínculo con el robo de combustible apuntan a Personas Políticamente Expuestas (UIF 2022), donde el robo de hidrocarburos figura entre los delitos determinantes. Corrupción ex servidor público (2020) también tiene familiares accionistas de empresas fachada, pero su sello es el nivel de vida incongruente con su salario y la relación con excontratistas de la dependencia; no menciona hidrocarburos.","ref":"Tipología UIF 2022 · Personas Políticamente Expuestas (PEPs) · H7"},{"id":"H002","tema":"h7","tipo":"memoria","q":"¿Qué combinación de rasgos distingue a la tipología Personas Políticamente Expuestas (PEPs)?","a":"La red familiar del ex servidor y el robo de hidrocarburos como uno de los orígenes de los recursos","o":["El soborno de una empresa extranjera, oculto con fideicomisos familiares","La contratación de una universidad para servicios que no puede proveer y que después subcontrata fachadas","El enriquecimiento posterior al cargo, canalizado a paraísos fiscales con apoyo de excontratistas del gobierno","La red familiar del ex servidor y el robo de hidrocarburos como uno de los orígenes de los recursos"],"x":"En la tipología de PEPs (UIF 2022) un ex servidor y su red familiar usan un conglomerado de empresas fachada para lavar recursos de corrupción, delincuencia organizada y robo de hidrocarburos. Las demás opciones describen Corrupción ex servidor público, Cohecho y Estafa Maestra (2020).","ref":"Tipología UIF 2022 · Personas Políticamente Expuestas (PEPs) · H7"},{"id":"H003","tema":"h7","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Personas Políticamente Expuestas (PEPs)?","a":"Vínculos con empresas fantasma y personas en listas negras del SAT","o":["Vínculos con empresas fantasma y personas en listas negras del SAT","Perfil de beneficiarios, como estudiante o ama de casa, incongruente con los fondos","Sindicato que concentra sus operaciones en una o pocas cuentas bancarias","Contratación de universidades para servicios que no pueden proveer"],"x":"Los vínculos con empresas fantasma y con personas señaladas por el SAT en su lista negra son señal de la tipología de PEPs (UIF 2022). El perfil de estudiante o ama de casa es de Cohecho (2020), la contratación de universidades de la Estafa Maestra (2020) y la concentración en pocas cuentas de Abuso de sindicatos (2016).","ref":"Tipología UIF 2022 · Personas Políticamente Expuestas (PEPs) · H7"},{"id":"H004","tema":"h7","tipo":"caso","q":"Un ex funcionario opera, junto con sus familiares, varias sociedades que resultan ser fachada. Hace múltiples depósitos y retiros en efectivo por montos altos, y lo que opera no coincide con sus declaraciones fiscales. La autoridad lo relaciona con corrupción, delincuencia organizada y robo de hidrocarburos. ¿Qué tipología describe mejor el caso?","a":"Personas Políticamente Expuestas (PEPs)","o":["Personas Políticamente Expuestas (PEPs)","Abuso de sindicatos","Cohecho alto ejecutivo sector energético","Corrupción ex servidor público"],"x":"El robo de hidrocarburos, junto con corrupción y delincuencia organizada, apunta a PEPs (UIF 2022). Corrupción ex servidor público (2020) también tiene un ex funcionario con familiares accionistas de empresas fachada y sobornos de la delincuencia organizada, pero no menciona hidrocarburos; su sello es el nivel de vida incongruente con su salario y la relación con excontratistas de la dependencia.","ref":"Tipología UIF 2022 · Personas Políticamente Expuestas (PEPs) · H7"},{"id":"H005","tema":"h7","tipo":"caso","q":"Tras dejar un cargo de alta responsabilidad, un cliente se muda a una zona de lujo en el extranjero. De 2013 a 2018 declara ingresos por cerca de un millón de pesos, pero paga a sus tarjetas de crédito más de ocho millones. Vive en inmuebles de dos personas que fueron contratistas de la dependencia en la que trabajaba, y empresas ligadas a él envían recursos a paraísos fiscales. ¿Qué tipología describe mejor el caso?","a":"Corrupción ex servidor público","o":["Personas Políticamente Expuestas (PEPs)","Corrupción ex servidor público","Cohecho alto ejecutivo sector energético","Estafa Maestra versión Pemex"],"x":"Nivel de vida incongruente con su salario, pagos a tarjetas muy superiores a lo declarado y la relación con excontratistas son el sello de Corrupción ex servidor público (UIF 2020). PEPs (2022) también tiene a un ex servidor con familiares y empresas fantasma, pero la distingue el robo de hidrocarburos entre los delitos determinantes.","ref":"Tipología UIF 2020 · Corrupción ex servidor público · H7"},{"id":"H006","tema":"h7","tipo":"caso","q":"Una institución financiera revisa a un ex funcionario de alto rango que, al dejar el cargo, se mudó al extranjero a una zona residencial exclusiva. Sus declaraciones fiscales de seis años suman alrededor de un millón de pesos, pero en ese lapso pagó a tarjetas de crédito más de ocho millones. Varias sociedades ligadas a él, en las que figuran excontratistas de su antigua dependencia, ingresan fondos al sistema financiero y los dispersan hacia paraísos fiscales. ¿Qué tipología describe mejor el caso?","a":"Corrupción ex servidor público","o":["Corrupción ex servidor público","Cohecho alto ejecutivo sector energético","El Licenciado","Estafa Maestra versión Pemex"],"x":"El nivel de vida incongruente con el salario tras dejar el cargo (se muda a barrios de lujo en el extranjero), los pagos a tarjetas por unos 8.2 millones frente a ingresos declarados de alrededor de un millón entre 2013 y 2018, y las empresas fachada con excontratistas de su dependencia que dispersan fondos a paraísos fiscales son Corrupción ex servidor público (UIF 2020). Cohecho alto ejecutivo sector energético (2020) es el distractor más tentador porque también usa paraísos fiscales, pero allí una empresa extranjera paga sobornos para obtener contratos, y el caso no plantea ese pago. En El Licenciado (2021) un abogado lava con empresas fachada el dinero del líder de un cártel; no hay un ex funcionario que gaste más de lo que declara. Estafa Maestra versión Pemex (2020) desvía recursos de una dependencia mediante entes educativos, que el caso no menciona.","ref":"Tipología UIF 2020 · Corrupción ex servidor público · H7"},{"id":"H007","tema":"h7","tipo":"cifra","q":"¿En qué año publicó la UIF la tipología Corrupción ex servidor público?","a":"2020","o":["2020","2022","2016","2021"],"x":"Corrupción ex servidor público es del informe UIF 2020, junto con Cohecho, Estafa Maestra y las dos OSFL. No la confundas con PEPs, que es de 2022.","ref":"Tipología UIF 2020 · Corrupción ex servidor público · H7"},{"id":"H008","tema":"h7","tipo":"trampa","q":"Tanto PEPs como Corrupción ex servidor público involucran a un ex servidor público. ¿Qué rasgo apunta a Corrupción ex servidor público en lugar de a PEPs?","a":"Nivel de vida incongruente con su salario, relación con excontratistas de la dependencia y fondos enviados a paraísos fiscales","o":["Vínculos con empresas fantasma y con personas que aparecen en las listas negras del SAT","Recursos ligados, entre otros delitos determinantes, al robo de hidrocarburos","Empresas especializadas con un mismo domicilio de casa habitación que declaran perforación de pozos y manejo de sustancias peligrosas","Nivel de vida incongruente con su salario, relación con excontratistas de la dependencia y fondos enviados a paraísos fiscales"],"x":"Corrupción ex servidor público (UIF 2020) se reconoce por el nivel de vida incongruente con su salario y sus declaraciones patrimoniales, los excontratistas y los paraísos fiscales. El robo de hidrocarburos, las empresas especializadas con domicilio común y los vínculos con la lista negra del SAT son de PEPs (2022). Ojo: las dos tienen familiares en las empresas, así que la familia no las distingue.","ref":"Tipología UIF 2020 · Corrupción ex servidor público · H7"},{"id":"H009","tema":"h7","tipo":"caso","q":"Una compañía de otro país quiere ganar contratos de una empresa del ramo de la energía y hace pagos a uno de sus directivos de primer nivel. Los recursos terminan en fideicomisos a nombre de familiares y en cuentas de una estudiante y de un ama de casa cuyo perfil no corresponde a los fondos. ¿Qué tipología describe mejor el caso?","a":"Cohecho alto ejecutivo sector energético","o":["Estafa Maestra versión Pemex","Cohecho alto ejecutivo sector energético","Personas Políticamente Expuestas (PEPs)","Corrupción ex servidor público"],"x":"Quien paga es una empresa extranjera para obtener contratos, y los beneficiarios tienen perfil incongruente (estudiante, ama de casa) con fideicomisos familiares: es Cohecho alto ejecutivo sector energético (UIF 2020). En PEPs (2022) también hay familia, pero no hay un soborno de una empresa extranjera.","ref":"Tipología UIF 2020 · Cohecho alto ejecutivo sector energético · H7"},{"id":"H010","tema":"h7","tipo":"caso","q":"Un directivo de primer nivel de una empresa productiva de energía asigna contratos a una compañía extranjera. Para ocultar los pagos que recibe a cambio se usan programas informáticos sofisticados, empresas fachada en paraísos fiscales y fideicomisos familiares. ¿Qué tipología describe mejor el caso?","a":"Cohecho alto ejecutivo sector energético","o":["Estafa Maestra versión Pemex","Cohecho alto ejecutivo sector energético","Personas Políticamente Expuestas (PEPs)","Corrupción ex servidor público"],"x":"Empresa extranjera que paga para obtener contratos, software sofisticado y fideicomisos familiares son rasgos de Cohecho alto ejecutivo sector energético (UIF 2020). Corrupción ex servidor público también usa paraísos fiscales, pero allí no hay un pagador extranjero sino enriquecimiento posterior al cargo.","ref":"Tipología UIF 2020 · Cohecho alto ejecutivo sector energético · H7"},{"id":"H011","tema":"h7","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Cohecho alto ejecutivo sector energético?","a":"Perfil personal de las presuntas beneficiarias: una estudiante, una consultora y un ama de casa","o":["Perfil personal de las presuntas beneficiarias: una estudiante, una consultora y un ama de casa","Sindicato que concentra sus operaciones en una o pocas cuentas bancarias","Pagos a tarjetas de crédito muy superiores a los ingresos declarados","Vínculos con personas señaladas por el SAT en su lista negra"],"x":"El perfil de las beneficiarias (estudiante, consultora, ama de casa) es la señal 3 de Cohecho alto ejecutivo sector energético (UIF 2020). La concentración en pocas cuentas es de Abuso de sindicatos (2016), la lista negra del SAT de PEPs (2022) y los pagos a tarjetas de Corrupción ex servidor público (2020).","ref":"Tipología UIF 2020 · Cohecho alto ejecutivo sector energético · H7"},{"id":"H012","tema":"h7","tipo":"caso","q":"Funcionarios de la petrolera del Estado contratan a una universidad para asistencia técnica que la institución no tiene capacidad de prestar. La universidad, cobrando una comisión, reparte los recursos entre siete empresas que no hacen el trabajo; varias están catalogadas por el SAT como fantasma y en ellas figuran como accionistas un servidor público de la petrolera y sus familiares. ¿Qué tipología describe mejor el caso?","a":"Estafa Maestra versión Pemex","o":["Institución educativa de nivel superior","Estafa Maestra versión Pemex","Cohecho alto ejecutivo sector energético","Personas Políticamente Expuestas (PEPs)"],"x":"La universidad funciona como conducto: la contratan para servicios que no puede proveer y subcontrata a empresas fachada creadas por un funcionario; es la Estafa Maestra versión Pemex (UIF 2020). En Institución educativa de nivel superior (2019) la universidad recibe el dinero ilícito y lo triangula al extranjero.","ref":"Tipología UIF 2020 · Estafa Maestra versión Pemex · H7"},{"id":"H013","tema":"h7","tipo":"trampa","q":"Dos tipologías tienen una universidad en el centro. ¿Qué rasgo corresponde a la Estafa Maestra versión Pemex?","a":"La contratan para servicios que no puede proveer y el dinero público termina en empresas fachada","o":["Envía transferencias internacionales elevadas sin justificación comercial","Recibe dinero ilícito, lo envía a cuentas en varios países del extranjero y después lo regresa a México","La contratan para servicios que no puede proveer y el dinero público termina en empresas fachada","Utiliza un patronato y gasta fondos públicos en máquinas de juego para lavar el dinero"],"x":"En la Estafa Maestra versión Pemex (UIF 2020) la universidad es el conducto del desvío hacia empresas fachada. Triangular al extranjero, el patronato y las máquinas de juego son rasgos de Institución educativa de nivel superior (2019).","ref":"Tipología UIF 2020 · Estafa Maestra versión Pemex · H7"},{"id":"H014","tema":"h7","tipo":"caso","q":"Un oficial revisa a una universidad pública que recibe contratos de una empresa petrolera del Estado y los subcontrata casi de inmediato a otras sociedades. ¿Qué señal adicional correspondería a la tipología que describe este esquema?","a":"Accionistas de las subcontratadas que son familiares o prestanombres de funcionarios","o":["Recursos enviados a diferentes países del extranjero que luego retornan al país de origen","Inversión de recursos públicos de la universidad en la compra de máquinas de juego","Accionistas de las subcontratadas que son familiares o prestanombres de funcionarios","Pagos a tarjetas de crédito muy superiores a los ingresos declarados por el cliente"],"x":"Universidad contratada que subcontrata de inmediato es la Estafa Maestra versión Pemex (UIF 2020), cuya señal es que los accionistas de las empresas sean familiares o prestanombres de funcionarios. Máquinas de juego y recursos que salen y regresan son de Institución educativa (2019).","ref":"Tipología UIF 2020 · Estafa Maestra versión Pemex · H7"},{"id":"H015","tema":"h7","tipo":"cifra","q":"¿Cuál de estas tipologías publicó la UIF en su informe 2020?","a":"Estafa Maestra versión Pemex","o":["Abuso de sindicatos","Institución educativa de nivel superior","Estafa Maestra versión Pemex","Personas Políticamente Expuestas (PEPs)"],"x":"La Estafa Maestra versión Pemex es del informe UIF 2020. Institución educativa de nivel superior es de 2019, PEPs de 2022 y Abuso de sindicatos de 2016.","ref":"Tipología UIF 2020 · Estafa Maestra versión Pemex · H7"},{"id":"H016","tema":"h7","tipo":"caso","q":"Una organización que agrupa a los trabajadores de una empresa concentra casi todas sus operaciones en unas pocas cuentas. Desde ahí se transfieren recursos para pagar bienes y servicios de lujo para su dirigente, y el dinero casi no permanece en las cuentas destino. ¿Qué tipología describe mejor el caso?","a":"Abuso de sindicatos","o":["Abuso de sindicatos","Asociación altruista ¿apoya a migrantes?","OSFL con actividades religiosas","Corrupción ex servidor público"],"x":"Una organización de trabajadores cuyos fondos se desvían a pocas cuentas para lujos de su líder es Abuso de sindicatos (UIF 2016). OSFL con actividades religiosas (2020) también tiene un líder y bienes de lujo, pero se trata de cinco OSFL religiosas con actividades lucrativas.","ref":"Tipología UIF 2016 · Abuso de sindicatos · H7"},{"id":"H017","tema":"h7","tipo":"caso","q":"Una institución financiera monitorea a un sindicato de trabajadores que tiene registradas numerosas cuentas bancarias a su nombre. Su analista compara el comportamiento de esas cuentas con la tipología Abuso de sindicatos (UIF 2016). ¿Qué hallazgo sobre el uso de las cuentas sería señal de alerta de esa tipología?","a":"Operaciones concentradas en una o pocas de sus cuentas bancarias","o":["Recepción de recursos fraccionados desde múltiples zonas geográficas","Domicilio declarado a la institución que resulta ser una oficina virtual","Operaciones concentradas en una o pocas de sus cuentas bancarias","Ingresos por preventa de inmuebles liquidada de contado"],"x":"Que un sindicato con múltiples cuentas concentre sus operaciones en una o pocas de ellas es señal de Abuso de sindicatos (UIF 2016); en el caso, dos cuentas concentraban el mayor porcentaje de las operaciones reportadas. Las demás también son señales de UIF 2016, pero de otras tipologías: los recursos fraccionados desde múltiples zonas geográficas son de Uso de personas jóvenes, el domicilio en una oficina virtual es de Estructura corporativa simula operaciones y la preventa de inmuebles de contado es de Desarrollo de bienes raíces.","ref":"Tipología UIF 2016 · Abuso de sindicatos · H7"},{"id":"H018","tema":"h7","tipo":"cifra","q":"¿Cuál de estas tipologías del bloque de corrupción publicó la UIF en su informe 2016?","a":"Abuso de sindicatos","o":["Abuso de sindicatos","Institución educativa de nivel superior","Personas Políticamente Expuestas (PEPs)","Corrupción ex servidor público"],"x":"Abuso de sindicatos es del informe UIF 2016, la única del bloque de corrupción de ese año. Corrupción ex servidor público es de 2020, Institución educativa de 2019 y PEPs de 2022.","ref":"Tipología UIF 2016 · Abuso de sindicatos · H7"},{"id":"H019","tema":"h7","tipo":"caso","q":"Una universidad recibe recursos de origen ilícito, los envía a cuentas en varios países y después regresan a México. Además, utiliza un patronato y gasta fondos públicos en máquinas de juego. ¿Qué tipología describe mejor el caso?","a":"Institución educativa de nivel superior","o":["OSFL con actividades religiosas","Estafa Maestra versión Pemex","Cohecho alto ejecutivo sector energético","Institución educativa de nivel superior"],"x":"La universidad que recibe, triangula y regresa el dinero, con patronato y máquinas de juego, es Institución educativa de nivel superior (UIF 2019). En la Estafa Maestra versión Pemex (2020) la universidad sólo es el conducto: la contratan para servicios que no puede proveer.","ref":"Tipología UIF 2019 · Institución educativa de nivel superior · H7"},{"id":"H020","tema":"h7","tipo":"caso","q":"El oficial de cumplimiento observa que una universidad que opera con un patronato envía transferencias internacionales elevadas sin justificación comercial; los recursos pasan por varios países y vuelven a México. ¿Qué tipología describe mejor el caso?","a":"Institución educativa de nivel superior","o":["Estafa Maestra versión Pemex","Compañía con operaciones lícitas","Cohecho alto ejecutivo sector energético","Institución educativa de nivel superior"],"x":"Recursos que van al extranjero y regresan, con un patronato universitario de por medio, describen Institución educativa de nivel superior (UIF 2019). Compañía con operaciones lícitas también triangula, pero es un negocio real en zona fronteriza que mezcla fondos.","ref":"Tipología UIF 2019 · Institución educativa de nivel superior · H7"},{"id":"H021","tema":"h7","tipo":"cifra","q":"¿Cuál de estas tipologías es del informe 2019 de la UIF?","a":"Institución educativa de nivel superior","o":["Cohecho alto ejecutivo sector energético","Estafa Maestra versión Pemex","Institución educativa de nivel superior","Personas Políticamente Expuestas (PEPs)"],"x":"Institución educativa de nivel superior es de 2019 (el otro caso de ese año es Trata de personas). Cohecho y la Estafa Maestra son de 2020, y PEPs de 2022.","ref":"Tipología UIF 2019 · Institución educativa de nivel superior · H7"},{"id":"H022","tema":"h7","tipo":"caso","q":"Un abogado maneja las finanzas del líder de un cártel. Con prestanombres constituye once empresas exportadoras que compran vehículos de lujo y los exportan a un país asiático; además, lava recursos con otras empresas de giros diversos, como seguridad y limpieza o construcción, y con una sociedad civil, y dispersa los recursos vía SPEI entre las empresas del grupo. ¿Qué tipología describe mejor el caso?","a":"El Licenciado","o":["Estructura corporativa simula operaciones","Fentanilo (tráfico y comercio exterior)","El Licenciado","Asociación altruista ¿apoya a migrantes?"],"x":"Un profesionista como operador financiero de un cártel, exportación de vehículos de lujo y una OSFL como pieza del esquema son El Licenciado (UIF 2021). En Estructura corporativa simula operaciones (2016) la red de fachadas ofrece lavado como servicio a otros grupos, con oficinas virtuales.","ref":"Tipología UIF 2021 · El Licenciado · H7"},{"id":"H023","tema":"h7","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología El Licenciado?","a":"Relación profesional cercana con diversos líderes de cárteles","o":["Relación profesional cercana con diversos líderes de cárteles","Empresas que se ostentan como entidad financiera sin autorización","Uso de una persona de edad muy avanzada como testaferro de la organización","Uso de oficinas virtuales o domicilios particulares como sede de varias empresas"],"x":"La relación profesional cercana con líderes de cárteles es señal de El Licenciado (UIF 2021), donde un abogado es el operador financiero del líder. Las oficinas virtuales son de Estructura corporativa (2016), el testaferro de edad avanzada de Asociación altruista (2020) y la ostentación como entidad financiera de Montadeudas (2023).","ref":"Tipología UIF 2021 · El Licenciado · H7"},{"id":"H024","tema":"h7","tipo":"trampa","q":"Tres tipologías usan una OSFL. ¿En cuál la OSFL es sólo una pieza más, junto con empresas fachada, dentro de un esquema armado por un profesionista para el líder de un cártel?","a":"El Licenciado","o":["Estructura corporativa simula operaciones","Asociación altruista ¿apoya a migrantes?","El Licenciado","OSFL con actividades religiosas"],"x":"En El Licenciado (UIF 2021) la OSFL acompaña a empresas fachada como exportadoras de vehículos de lujo y de seguridad. En OSFL con actividades religiosas (2020) son cinco OSFL de un mismo líder, y en Asociación altruista (2020) la clave es el adulto mayor testaferro.","ref":"Tipología UIF 2021 · El Licenciado · H7"},{"id":"H025","tema":"h7","tipo":"cifra","q":"¿En qué año publicó la UIF la tipología El Licenciado?","a":"2021","o":["2016","2022","2021","2020"],"x":"El Licenciado es del informe UIF 2021, el mismo año que León Chino, Fentanilo, Cajeros automáticos (skimming) y Trata y lenocinio.","ref":"Tipología UIF 2021 · El Licenciado · H7"},{"id":"H026","tema":"h7","tipo":"caso","q":"Tres importadoras constituidas el mismo día con capital social mínimo reciben depósitos en efectivo en muchas localidades y envían al extranjero, sobre todo a una misma empresa del país de origen de las mercancías, montos muy superiores al valor de lo que importan. Un grupo de personas físicas repite el mismo patrón con depósitos en efectivo fraccionados. ¿Qué tipología describe mejor el caso?","a":"León Chino (comercio exterior)","o":["Estructura corporativa simula operaciones","Fentanilo (tráfico y comercio exterior)","Uso de identidad","León Chino (comercio exterior)"],"x":"Importaciones de valor muy inferior a lo enviado al extranjero, fondeadas con depósitos en efectivo de «pitufos», son León Chino (UIF 2021). En Fentanilo (2021) también hay importaciones, pero lo que se introduce es la droga misma, declarada como cloruro de calcio.","ref":"Tipología UIF 2021 · León Chino (comercio exterior) · H7"},{"id":"H027","tema":"h7","tipo":"caso","q":"Una empresa importadora recibe depósitos en efectivo fraccionados de muchas personas y envía grandes pagos a proveedores en el extranjero. Si el esquema es el de León Chino, ¿qué señal de alerta esperaría confirmar el oficial?","a":"Que el valor de las importaciones sea muy inferior al monto enviado al extranjero","o":["Que la mercancía importada sea en realidad una droga declarada como otra sustancia","Que la empresa preste servicios de lavado a otros grupos desde oficinas virtuales","Que el valor de las importaciones sea muy inferior al monto enviado al extranjero","Que el acta constitutiva de la empresa tenga fechas ilógicas o inconsistentes"],"x":"La señal clave de León Chino (UIF 2021) es que lo importado vale mucho menos que lo enviado al extranjero. La droga declarada como otra sustancia es Fentanilo (2021), las oficinas virtuales son de Estructura corporativa (2016) y las actas con fechas ilógicas de Uso de identidad (2009).","ref":"Tipología UIF 2021 · León Chino (comercio exterior) · H7"},{"id":"H028","tema":"h7","tipo":"trampa","q":"León Chino y Fentanilo son tipologías de comercio exterior publicadas en 2021. ¿Qué rasgo es exclusivo de León Chino?","a":"Importaciones de valor muy inferior a lo enviado al extranjero, fondeadas con depósitos de pitufos","o":["Una empresa del grupo coordina el envío de 16 toneladas de precursores a una empresa agroindustrial","Importaciones de valor muy inferior a lo enviado al extranjero, fondeadas con depósitos de pitufos","La droga misma se importa con una declaración falsa en la aduana que la hace pasar por otra sustancia","La hija menor de edad del traficante tiene relación corporativa con una de las empresas"],"x":"León Chino (2021) envía al extranjero mucho más de lo que vale lo importado y se fondea con efectivo de pitufos. La droga declarada como otra sustancia, el envío de 16 toneladas de precursores y la hija menor con relación corporativa son de Fentanilo (2021). Ojo: el domicilio común y la mezcla con fondos lícitos aparecen en las dos.","ref":"Tipología UIF 2021 · León Chino (comercio exterior) · H7"},{"id":"H029","tema":"h7","tipo":"caso","q":"Una institución financiera detecta que tres empresas importadoras reciben depósitos en efectivo y que un grupo de personas fracciona depósitos en efectivo en distintas cuentas (pitufeo) para concentrar los recursos. Casi todo se envía a una empresa en el extranjero, mientras que el valor comercial de las importaciones definitivas registradas por esas empresas es significativamente inferior a lo enviado. ¿Qué tipología describe mejor el caso?","a":"León Chino (comercio exterior)","o":["León Chino (comercio exterior)","Compañía con operaciones lícitas","Fentanilo (tráfico y comercio exterior)","Ruta de dinero"],"x":"El pitufeo con efectivo, el envío de recursos a una empresa extranjera y un valor importado muy inferior a lo enviado, que simula actos de comercio exterior, son León Chino (UIF 2021). Fentanilo (2021) también involucra comercio exterior, pero allí el comercio mezcla recursos lícitos e ilícitos y el traficante introduce la droga declarándola como otra sustancia; el caso no plantea mercancía ilícita. Ruta de dinero (2009) usa depósitos en efectivo, pero sin comercio exterior: los recursos depositados en la frontera se retiran de forma simultánea en el interior.","ref":"Tipología UIF 2021 · León Chino (comercio exterior) · H7"},{"id":"H030","tema":"h7","tipo":"caso","q":"Una comercializadora declara en el manifiesto un cargamento como cloruro de calcio, pero las muestras de laboratorio dan positivo a fentanilo. Las mismas empresas importan camisas, plásticos y parquímetros para mezclar recursos lícitos e ilícitos, y comparten domicilio y teléfono con el traficante y su esposa. ¿Qué tipología describe mejor el caso?","a":"Fentanilo (tráfico y comercio exterior)","o":["Fentanilo (tráfico y comercio exterior)","Estructura corporativa simula operaciones","Compañía con operaciones lícitas","León Chino (comercio exterior)"],"x":"Introducir la droga misma con declaración falsa y usar importaciones legales para mezclar fondos es Fentanilo (UIF 2021). León Chino (2021) también es comercio exterior y también tiene domicilios comunes, pero su clave es que el valor importado es muy inferior a lo enviado al extranjero.","ref":"Tipología UIF 2021 · Fentanilo (tráfico y comercio exterior) · H7"},{"id":"H031","tema":"h7","tipo":"caso","q":"Una autoridad aduanera revisa un cargamento declarado en el manifiesto como un compuesto químico industrial y el laboratorio detecta que contiene una droga sintética. El importador y su esposa figuran como socios de varias empresas que importan prendas, plásticos y parquímetros, y la institución financiera observa que esas importaciones legales sirven para mezclar recursos lícitos con las ganancias del tráfico. ¿Qué tipología describe mejor el caso?","a":"Fentanilo (tráfico y comercio exterior)","o":["Estructura corporativa simula operaciones","León Chino (comercio exterior)","Compañía con operaciones lícitas","Fentanilo (tráfico y comercio exterior)"],"x":"Introducir la droga declarándola como otra sustancia y usar empresas fachada que importan bienes legales para mezclar y lavar las ganancias es Fentanilo (UIF 2021). León Chino (2021) es el distractor más tentador porque también simula comercio exterior, pero su clave es que el valor importado es muy inferior a lo enviado al extranjero y no hay mercancía ilícita. Estructura corporativa (2016) y Compañía con operaciones lícitas no incluyen un cargamento de droga en aduanas.","ref":"Tipología UIF 2021 · Fentanilo (tráfico y comercio exterior) · H7"},{"id":"H032","tema":"h7","tipo":"trampa","q":"¿Qué rasgo distingue a Fentanilo de León Chino?","a":"Se importa la droga misma declarada como otra sustancia, y bienes legales sirven para mezclar","o":["Se importa la droga misma declarada como otra sustancia, y bienes legales sirven para mezclar","El esquema se fondea con depósitos masivos en efectivo realizados por numerosos pitufos","El valor de lo importado es muy inferior al monto enviado al país de origen de las mercancías","Empresas constituidas el mismo día con capital mínimo mueven grandes volúmenes de recursos al exterior"],"x":"En Fentanilo (UIF 2021) el comercio exterior transporta la propia droga y los bienes legales sirven para mezclar ganancias. Importaciones de valor muy inferior a lo enviado, pitufos y empresas constituidas el mismo día con capital mínimo son rasgos de León Chino (2021).","ref":"Tipología UIF 2021 · Fentanilo (tráfico y comercio exterior) · H7"},{"id":"H033","tema":"h7","tipo":"caso","q":"Un grupo delictivo registra una extensa red de empresas que usan como sede la misma oficina virtual o domicilios particulares. Sus accionistas son empleados jóvenes de bajo perfil y el grupo ofrece a otras organizaciones criminales el servicio de lavar su dinero. ¿Qué tipología describe mejor el caso?","a":"Estructura corporativa simula operaciones","o":["Estructura corporativa simula operaciones","Uso de personas jóvenes para enviar dinero","Bienes raíces con dinero ilícito","El Licenciado"],"x":"Ofrecer lavado como servicio a terceros, con oficinas virtuales y accionistas jóvenes de bajo perfil, es Estructura corporativa simula operaciones (UIF 2016). En El Licenciado (2021) el esquema se arma para el líder de un cártel específico, con exportadoras de vehículos de lujo y una OSFL.","ref":"Tipología UIF 2016 · Estructura corporativa simula operaciones · H7"},{"id":"H034","tema":"h7","tipo":"trampa","q":"Compañía con operaciones lícitas y Estructura corporativa simula operaciones son de 2016. ¿Qué rasgo apunta a Estructura corporativa?","a":"Empresas fachada creadas para ofrecer lavado de dinero como servicio a otros grupos","o":["Empresas fachada creadas para ofrecer lavado de dinero como servicio a otros grupos","Operación en zona fronteriza con triangulación y dispersión a personas con esquema de ruta de dinero","Un negocio real con alto manejo de efectivo que mezcla fondos ilícitos con sus ventas","Contrapartes que aparecen en la Lista de Personas Bloqueadas de la autoridad"],"x":"Estructura corporativa simula operaciones (UIF 2016) son fachadas que maquilan lavado para otros. En Compañía con operaciones lícitas (2016) el negocio sí es real y mezcla fondos en zona fronteriza, con contrapartes en la Lista de Personas Bloqueadas.","ref":"Tipología UIF 2016 · Estructura corporativa simula operaciones · H7"},{"id":"H035","tema":"h7","tipo":"caso","q":"Una institución financiera identifica a una organización que, mediante agentes independientes, ofrece servicios de lavado de dinero a otras organizaciones delictivas. Para ello dispone de decenas de empresas fachada con giros comerciales diversos, cuyos accionistas son prestanombres de bajo perfil, y varias comparten domicilios que resultan ser oficinas virtuales o casas habitación. ¿Qué tipología describe mejor el caso?","a":"Estructura corporativa simula operaciones","o":["Compañía con operaciones lícitas","Uso de personas jóvenes para enviar dinero","Estructura corporativa simula operaciones","El Licenciado"],"x":"El lavado ofrecido como servicio a otros grupos, con decenas de empresas fachada, prestanombres y oficinas virtuales, es Estructura corporativa simula operaciones (UIF 2016). El Licenciado (2021) es el distractor más tentador por el uso de empresas y un operador financiero, pero allí un abogado arma el esquema para el líder de un cártel y no hay una organización que venda el servicio a terceros. Uso de personas jóvenes (2016) se centra en el envío de dinero por jóvenes cuya edad no corresponde a los montos, y Compañía con operaciones lícitas en recursos de personas bloqueadas.","ref":"Tipología UIF 2016 · Estructura corporativa simula operaciones · H7"},{"id":"H036","tema":"h7","tipo":"caso","q":"Cinco asociaciones con fines de culto, todas dirigidas por la misma persona, hacen inversiones, compran bienes de lujo y transfieren recursos a paraísos fiscales, con lo que su dirigente evade impuestos. ¿Qué tipología describe mejor el caso?","a":"OSFL con actividades religiosas","o":["Abuso de sindicatos","El Licenciado","Asociación altruista ¿apoya a migrantes?","OSFL con actividades religiosas"],"x":"Cinco OSFL religiosas con un mismo líder y actividades lucrativas son OSFL con actividades religiosas (UIF 2020). Abuso de sindicatos (2016) también desvía fondos a lujos de un líder, pero la organización es de trabajadores, no de culto.","ref":"Tipología UIF 2020 · OSFL con actividades religiosas · H7"},{"id":"H037","tema":"h7","tipo":"caso","q":"Al revisar a cinco organizaciones de culto dirigidas por la misma persona, el oficial busca señales de alerta de la tipología que les corresponde. ¿Cuál de estas es una de ellas?","a":"Transferencias a paraísos fiscales","o":["Uso de una persona de edad muy avanzada como testaferro","Transferencias a paraísos fiscales","Retiros frecuentes en efectivo por montos fraccionados","Abogados o contadores participando activamente en el esquema"],"x":"En OSFL con actividades religiosas (UIF 2020) las señales son actos con fines lucrativos, transferencias a paraísos fiscales y bienes de lujo ajenos al objeto social. El testaferro de edad avanzada y los retiros fraccionados son de Asociación altruista (2020), y los profesionistas de El Licenciado (2021).","ref":"Tipología UIF 2020 · OSFL con actividades religiosas · H7"},{"id":"H038","tema":"h7","tipo":"cifra","q":"¿Cuál de estas tipologías es del informe 2020 de la UIF?","a":"OSFL con actividades religiosas","o":["Uso de identidad","Bienes raíces con dinero ilícito","OSFL con actividades religiosas","El Licenciado"],"x":"OSFL con actividades religiosas es de 2020, igual que Asociación altruista. El Licenciado, la tercera tipología con OSFL, es de 2021; Bienes raíces es de 2016 y Uso de identidad de 2009.","ref":"Tipología UIF 2020 · OSFL con actividades religiosas · H7"},{"id":"H039","tema":"h7","tipo":"caso","q":"Una organización civil que dice ayudar a migrantes recibe transferencias que reenvía casi de inmediato y paga 173 cheques liquidados en efectivo por montos fraccionados. Uno de sus cheques, por $505 mil, va a un hombre de 92 años que, además, opera millones en efectivo en su propia cuenta. ¿Qué tipología describe mejor el caso?","a":"Asociación altruista ¿apoya a migrantes?","o":["Asociación altruista ¿apoya a migrantes?","Cuenta personal para actividad empresarial","El Licenciado","OSFL con actividades religiosas"],"x":"La supuesta ayuda a migrantes, el adulto mayor usado como testaferro para operar efectivo y el reenvío rápido son Asociación altruista ¿apoya a migrantes? (UIF 2020). En OSFL con actividades religiosas (2020) hay cinco OSFL de un mismo líder dedicadas a actividades lucrativas.","ref":"Tipología UIF 2020 · Asociación altruista ¿apoya a migrantes? · H7"},{"id":"H040","tema":"h7","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología «Asociación altruista ¿apoya a migrantes?»?","a":"Uso de una persona de edad muy avanzada como testaferro","o":["Uso de una persona de edad muy avanzada como testaferro","Compra de bienes de lujo no acordes al objeto social de la organización","Abogados o contadores activos en el esquema","Transferencias a paraísos fiscales de una OSFL controlada por su líder"],"x":"El testaferro de edad muy avanzada es la señal distintiva de Asociación altruista (UIF 2020). Paraísos fiscales y bienes de lujo son de OSFL con actividades religiosas (2020), y los profesionistas activos son de El Licenciado (2021).","ref":"Tipología UIF 2020 · Asociación altruista ¿apoya a migrantes? · H7"},{"id":"H041","tema":"h7","tipo":"trampa","q":"Pregunta-gancho de las tres OSFL: ¿cinco OSFL religiosas con un líder, un adulto mayor como testaferro o un abogado del cártel? Si la OSFL usa a un adulto mayor como testaferro para operar efectivo, ¿de qué tipología se trata?","a":"Asociación altruista ¿apoya a migrantes?","o":["Estructura corporativa simula operaciones","Asociación altruista ¿apoya a migrantes?","OSFL con actividades religiosas","El Licenciado"],"x":"El adulto mayor como testaferro es el rasgo de Asociación altruista ¿apoya a migrantes? (UIF 2020). Cinco OSFL religiosas con un líder es OSFL con actividades religiosas (2020) y el abogado del cártel es El Licenciado (2021).","ref":"Tipología UIF 2020 · Asociación altruista ¿apoya a migrantes? · H7"},{"id":"H042","tema":"h7","tipo":"caso","q":"Una desarrolladora constituida hace poco arranca proyectos de gran magnitud sin una fuente lícita de financiamiento identificable. Reporta preventas que en un alto porcentaje se liquidan de contado, y sus representantes legales son personas jóvenes que representan a varias empresas. ¿Qué tipología describe mejor el caso?","a":"Bienes raíces con dinero ilícito","o":["Compañía con operaciones lícitas","Trata y lenocinio","Bienes raíces con dinero ilícito","Estructura corporativa simula operaciones"],"x":"Preventas con alto porcentaje de operaciones de contado en una empresa de reciente creación son Bienes raíces con dinero ilícito (UIF 2016). En Estructura corporativa (2016) también hay jóvenes de bajo perfil, pero como accionistas de fachadas que lavan para otros grupos.","ref":"Tipología UIF 2016 · Bienes raíces con dinero ilícito · H7"},{"id":"H043","tema":"h7","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Bienes raíces con dinero ilícito?","a":"Esquemas de preventa con alto porcentaje de operaciones de contado","o":["Recepción de transferencias que son reenviadas rápidamente a terceros","Visitas domiciliarias que constatan la inexistencia física de la empresa","Esquemas de preventa con alto porcentaje de operaciones de contado","Uso de oficinas virtuales como sede de múltiples empresas del grupo"],"x":"Las preventas liquidadas en gran parte de contado son la señal de Bienes raíces con dinero ilícito (UIF 2016). Las oficinas virtuales son de Estructura corporativa (2016), la empresa inexistente de Uso de identidad (2009) y el reenvío rápido de Asociación altruista (2020).","ref":"Tipología UIF 2016 · Bienes raíces con dinero ilícito · H7"},{"id":"H044","tema":"h7","tipo":"cifra","q":"¿Cuál de estas tipologías es del informe 2016 de la UIF?","a":"Bienes raíces con dinero ilícito","o":["León Chino (comercio exterior)","Asociación altruista ¿apoya a migrantes?","Bienes raíces con dinero ilícito","Uso de identidad"],"x":"Bienes raíces con dinero ilícito es de 2016. León Chino es de 2021, Asociación altruista de 2020 y Uso de identidad de 2009.","ref":"Tipología UIF 2016 · Bienes raíces con dinero ilícito · H7"},{"id":"H045","tema":"h7","tipo":"caso","q":"Un negocio que sí opera, en una ciudad fronteriza y con mucho manejo de efectivo, mezcla recursos ilícitos con sus ingresos y triangula fondos con empresas de domicilio común. Los recursos llegan a personas sin relación aparente, ya reportadas por operaciones de «ruta de dinero», y se dispersan a jóvenes de estrato social bajo que los retiran de forma simultánea. ¿Qué tipología describe mejor el caso?","a":"Compañía con operaciones lícitas","o":["Trata y lenocinio","Compañía con operaciones lícitas","Ruta de dinero","Estructura corporativa simula operaciones"],"x":"Un negocio real en zona fronteriza que mezcla fondos y los dispersa a jóvenes de estrato bajo con esquema de ruta de dinero es Compañía con operaciones lícitas (UIF 2016). Trata y lenocinio (2021) también mezcla efectivo en un giro comercial y entra por zonas fronterizas, pero su origen es la explotación sexual. Ruta de dinero (2009) no tiene un negocio real: son depósitos en la frontera a cuentas del interior que se retiran al mismo tiempo.","ref":"Tipología UIF 2016 · Compañía con operaciones lícitas · H7"},{"id":"H046","tema":"h7","tipo":"memoria","q":"¿Qué señal de alerta corresponde a la tipología Compañía con operaciones lícitas?","a":"Personas que reciben recursos de otras que están en la Lista de Personas Bloqueadas","o":["Uso de oficinas virtuales o domicilios particulares como sede de varias empresas del grupo","Concentración de retiros en cajeros automáticos de zonas turísticas","Visitas domiciliarias que constatan la inexistencia física de la empresa que se está revisando","Personas que reciben recursos de otras que están en la Lista de Personas Bloqueadas"],"x":"Recibir recursos de personas en la Lista de Personas Bloqueadas es señal de Compañía con operaciones lícitas (UIF 2016); también aparece en Trata y lenocinio (2021). Las oficinas virtuales son de Estructura corporativa (2016), la empresa inexistente de Uso de identidad (2009) y los cajeros de zonas turísticas de Cajeros automáticos (2021).","ref":"Tipología UIF 2016 · Compañía con operaciones lícitas · H7"},{"id":"H047","tema":"h7","tipo":"trampa","q":"Frente a Uso de identidad, Estructura corporativa simula operaciones y León Chino, ¿qué rasgo apunta a Compañía con operaciones lícitas?","a":"Un negocio real en zona fronteriza, con alto manejo de efectivo, que mezcla fondos ilícitos con sus ingresos legales","o":["Las empresas no existen físicamente y se crearon con documentos constitutivos falsos","Las empresas son fachada y ofrecen servicios de lavado a otros grupos criminales","Las empresas envían al extranjero mucho más que el valor de lo que importan","Un negocio real en zona fronteriza, con alto manejo de efectivo, que mezcla fondos ilícitos con sus ingresos legales"],"x":"En Compañía con operaciones lícitas (UIF 2016) la empresa es real, está en zona fronteriza y mezcla fondos con sus ingresos. Empresas inexistentes con documentos falsos son Uso de identidad (2009), lavado como servicio es Estructura corporativa (2016) y enviar mucho más que lo importado es León Chino (2021). Ojo: mezclar en negocios legítimos también aparece en Trata y lenocinio (2021), donde el origen es la explotación sexual.","ref":"Tipología UIF 2016 · Compañía con operaciones lícitas · H7"},{"id":"H048","tema":"h7","tipo":"caso","q":"Una distribuidora con operación comercial real en una ciudad fronteriza maneja mucho efectivo. El monitoreo detecta que recibe recursos de personas incluidas en la Lista de Personas Bloqueadas y que dispersa fondos, a través de una persona física, a jóvenes de estrato social bajo ya reportados por operaciones de «ruta de dinero», que los retiran de forma simultánea. ¿Qué tipología describe mejor el caso?","a":"Compañía con operaciones lícitas","o":["Fentanilo (tráfico y comercio exterior)","Compañía
