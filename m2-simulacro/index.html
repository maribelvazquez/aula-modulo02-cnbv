tir","Debe remitirlo a la Comisión dentro de los sesenta días naturales siguientes al cierre del ejercicio al que corresponda la revisión"],"x":"La DCG de Asesores en inversiones no contiene revisión o auditoría anual de cumplimiento, ni informe ni remisión a la Comisión: es el único sujeto del bloque sin esa obligación. Los sesenta días naturales y la conservación de cinco años pertenecen a la regla de Bancos (60ª) y de los demás sujetos que sí la prevén.","ref":"Asesores en inversiones (sin disposición equivalente a la 60ª de Bancos) · H3","par":"C003"},{"id":"C005","tema":"h3","tipo":"caso","q":"Un banco contrató a un auditor externo independiente para la revisión anual de cumplimiento PLD/FT. ¿Debe el auditor que elabora y firma el informe contar con la certificación de la CNBV prevista en el artículo 4, fracción X, de su ley?","a":"Sí: la disposición exige que el auditor que elabora y firma el informe cuente con la certificación vigente del artículo 4, fracción X, de la Ley de la CNBV","o":["Sí, pero sólo cuando la entidad forma parte de un grupo financiero y debe tomar en cuenta las revisiones de las demás entidades del grupo","No: la disposición no impone ese requisito al auditor que elabora y firma el informe de la revisión anual","Sí, pero sólo cuando la revisión la realiza un auditor externo independiente y no el área de auditoría interna de la entidad, caso en el cual basta con que el responsable sea contador público","Sí: la disposición exige que el auditor que elabora y firma el informe cuente con la certificación vigente del artículo 4, fracción X, de la Ley de la CNBV"],"x":"El último párrafo de la 60ª de Bancos (añadido el 28 de agosto de 2024) exige que quien elabora y firma el informe tenga la certificación vigente, sin distinguir entre auditoría interna y externa ni entre entidades de grupo o no. Sólo Bancos e ITF imponen este requisito.","ref":"Bancos 60ª, último párrafo · H3","par":"C006"},{"id":"C006","tema":"h3","tipo":"caso","q":"Una SOFOM contrató a un auditor externo independiente para la revisión anual de cumplimiento PLD/FT. ¿Debe el auditor que elabora y firma el informe contar con la certificación de la CNBV prevista en el artículo 4, fracción X, de su ley?","a":"No: la disposición no impone ese requisito al auditor que elabora y firma el informe de la revisión anual","o":["Sí, pero sólo cuando la revisión la realiza un auditor externo independiente y no el área de auditoría interna de la entidad, caso en el cual basta con que el responsable sea contador público","Sí: la disposición exige que el auditor que elabora y firma el informe cuente con la certificación vigente del artículo 4, fracción X, de la Ley de la CNBV","Sí, pero sólo cuando la entidad forma parte de un grupo financiero y debe tomar en cuenta las revisiones de las demás entidades del grupo","No: la disposición no impone ese requisito al auditor que elabora y firma el informe de la revisión anual"],"x":"La 52ª de SOFOM regula la revisión anual (primer periodo desde el registro ante la CONDUSEF, informe a la dirección general y al Comité, cinco años de conservación y sesenta días naturales para remitirlo), pero no exige certificación del auditor. Ese requisito es propio de Bancos (60ª) y de las ITF (art. 76).","ref":"SOFOM 52ª; Bancos 60ª · H3","par":"C005"},{"id":"C007","tema":"h3","tipo":"cifra","q":"Se inscribió en el registro del artículo 128 de la Ley General de Sociedades Mercantiles la transmisión de acciones de una SOFOM por más del 2 % de su capital social pagado. ¿En qué plazo debe remitir a la Secretaría, por conducto del Supervisor, la información de esa transmisión?","a":"Dentro de los tres días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","o":["Dentro de los tres días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","Dentro de los diez días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","Dentro de los veinte días hábiles siguientes a la fecha en que los accionistas comuniquen la transmisión al presidente del consejo de administración","Dentro de los diez días hábiles siguientes a la fecha en que los accionistas informen a la administración sobre el control que ejercen en lo individual o en grupo"],"x":"La 53ª de SOFOM fija tres días hábiles contados desde la inscripción en el registro del artículo 128 de la LGSM de la transmisión de acciones por más del 2 % del capital pagado. No debe confundirse con los diez días hábiles que corren para informar quién ejerce el Control y sus cambios, que se cuentan desde que los accionistas lo comunican a la administración.","ref":"SOFOM 53ª · H3","par":"C008"},{"id":"C008","tema":"h3","tipo":"cifra","q":"Se inscribió en el registro del artículo 128 de la Ley General de Sociedades Mercantiles la transmisión de acciones de una casa de cambio por más del 2 % de su capital social pagado. ¿En qué plazo debe remitir a la Secretaría, por conducto de la Comisión, la información de esa transmisión?","a":"Dentro de los diez días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","o":["Dentro de los diez días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","Dentro de los tres días hábiles siguientes a que inscriba la transmisión en el registro del artículo 128 de la Ley General de Sociedades Mercantiles","Dentro de los diez días hábiles siguientes a la fecha en que los accionistas informen a la administración sobre el control que ejercen en lo individual o en grupo","Dentro de los veinte días hábiles siguientes a la fecha en que los accionistas comuniquen la transmisión al presidente del consejo de administración"],"x":"La 52a de Casas de cambio concede diez días hábiles desde la inscripción de la transmisión de acciones por más del 2 % del capital pagado, frente a los tres días hábiles de SOFOM, Centros cambiarios y Transmisores de dinero. Los diez días son los mismos que corren para informar cambios en quién ejerce el control.","ref":"Casas de cambio 52a; SOFOM 53ª · H3","par":"C007"},{"id":"C009","tema":"h3","tipo":"caso","q":"Un banco está por iniciar operaciones y debe obtener de la Comisión la clave para acceder al sistema electrónico de envío de reportes. ¿Qué establece su DCG sobre el momento de solicitarla y tenerla?","a":"Debe solicitar a la Comisión la clave de acceso al sistema electrónico y contar con ella al momento de iniciar operaciones, actualizada a nombre del Oficial de Cumplimiento","o":["Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los veinte días hábiles posteriores a su registro","Debe solicitar a la Comisión la clave de acceso al sistema electrónico y contar con ella al momento de iniciar operaciones, actualizada a nombre del Oficial de Cumplimiento","Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los diez días hábiles posteriores a que designe a su Oficial de Cumplimiento, y mantenerla a nombre del consejo de administración","Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los quince días hábiles siguientes a la fecha en que inicie operaciones"],"x":"La 69ª-1 de Bancos exige solicitar la clave y contar con ella al momento de iniciar operaciones, y mantenerla actualizada a nombre del Oficial de Cumplimiento (o del interino). El plazo de veinte días hábiles posteriores al registro no es de Bancos: lo tienen Centros cambiarios, Transmisores de dinero y las SOFOM no reguladas.","ref":"Bancos 69ª-1 · H3","par":"C010"},{"id":"C010","tema":"h3","tipo":"caso","q":"Un centro cambiario acaba de obtener su registro y debe obtener de la Comisión la clave para acceder al sistema electrónico de envío de reportes. ¿Qué establece su DCG sobre el momento de solicitarla?","a":"Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los veinte días hábiles posteriores a su registro","o":["Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los veinte días hábiles posteriores a su registro","Debe solicitar a la Comisión la clave de acceso al sistema electrónico y contar con ella al momento de iniciar operaciones, actualizada a nombre del Oficial de Cumplimiento","Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los diez días hábiles posteriores a que designe a su Oficial de Cumplimiento, y mantenerla a nombre del consejo de administración","Debe solicitar a la Comisión la clave de acceso al sistema electrónico dentro de los quince días hábiles siguientes a la fecha en que inicie operaciones"],"x":"La 56ª Bis de Centros cambiarios obliga a solicitar la clave dentro de los veinte días hábiles posteriores a su registro, y a mantenerla a nombre del Oficial de Cumplimiento. A diferencia de Bancos (69ª-1), no se exige tenerla al iniciar operaciones; el mismo plazo posterior al registro rige para Transmisores de dinero y SOFOM no reguladas.","ref":"Centros cambiarios 56ª Bis; Bancos 69ª-1 · H3","par":"C009"},{"id":"C011","tema":"h3","tipo":"caso","q":"Un banco abrió una sucursal en un país donde la legislación local impide aplicar las Disposiciones de PLD/FT mexicanas, y ya agotó las gestiones para lograrlo. ¿Qué debe hacer según su DCG?","a":"Informar por escrito a la Secretaría, por conducto de la Comisión, en un plazo no mayor a veinte días hábiles posteriores a la conclusión de sus gestiones","o":["Informar por escrito a la Comisión, en un plazo no mayor a diez días hábiles contados desde que la oficina en el extranjero inicie operaciones, acompañando el dictamen del auditor externo independiente","Cerrar la oficina en el extranjero, porque la aplicación de las Disposiciones fuera del país es obligatoria sin excepción","Informar por escrito a la Secretaría, por conducto de la Comisión, en un plazo no mayor a veinte días hábiles posteriores a la conclusión de sus gestiones","Nada específico, porque su DCG no contiene la regla de procurar aplicar las Disposiciones en oficinas en el extranjero ni el aviso por imposibilidad"],"x":"La 58ª de Bancos obliga a procurar, en la medida de lo posible, aplicar las Disposiciones en oficinas, sucursales, agencias y filiales en el extranjero; si es imposible, se informa por escrito a la Secretaría, por conducto de la Comisión, en no más de veinte días hábiles tras concluir las gestiones. No es una prohibición absoluta ni exige cerrar la oficina.","ref":"Bancos 58ª · H3","par":"C012"},{"id":"C012","tema":"h3","tipo":"caso","q":"Una SOCAP abrió una oficina en un país donde la legislación local impide aplicar las Disposiciones de PLD/FT mexicanas, y ya agotó las gestiones para lograrlo. ¿Qué establece su DCG sobre ese supuesto?","a":"Nada específico, porque su DCG no contiene la regla de procurar aplicar las Disposiciones en oficinas en el extranjero ni el aviso por imposibilidad","o":["Nada específico, porque su DCG no contiene la regla de procurar aplicar las Disposiciones en oficinas en el extranjero ni el aviso por imposibilidad","Informar por escrito a la Secretaría, por conducto de la Comisión, en un plazo no mayor a veinte días hábiles posteriores a la conclusión de sus gestiones","Cerrar la oficina en el extranjero, porque la aplicación de las Disposiciones fuera del país es obligatoria sin excepción","Informar por escrito a la Comisión, en un plazo no mayor a diez días hábiles contados desde que la oficina en el extranjero inicie operaciones, acompañando el dictamen del auditor externo independiente"],"x":"La DCG de las SOCAP no trae una disposición equivalente a la 58ª de Bancos: ni la regla de procurar aplicar las Disposiciones en oficinas en el extranjero ni el aviso de veinte días hábiles por imposibilidad. Sólo se refiere a esas oficinas al regular la facultad de supervisión de la Comisión (69ª).","ref":"SOCAP (sin disposición equivalente a la 58ª de Bancos; 69ª); Bancos 58ª · H3","par":"C011"},{"id":"C013","tema":"h3","tipo":"caso","q":"Una SOFIPO contrató a un comisionista que ofrece sus productos desde otro país. ¿Qué dispone su DCG sobre el riesgo del país donde opera ese comisionista?","a":"Debe tomar en cuenta la información disponible sobre el nivel de Riesgo del país donde opere el comisionista, además de ser responsable de los datos de las operaciones","o":["Debe obtener la autorización previa de la Secretaría para contratar a cada comisionista extranjero, comunicarla a la Comisión y verificar cada año el nivel de Riesgo del país con una auditoría externa","Su DCG no contiene una regla sobre Operaciones realizadas a través de comisionistas contratados, por lo que no prevé ponderar el Riesgo del país","Debe informar a la Comisión el nivel de Riesgo del país en un plazo de veinte días hábiles posteriores a la contratación del comisionista","Debe tomar en cuenta la información disponible sobre el nivel de Riesgo del país donde opere el comisionista, además de ser responsable de los datos de las operaciones"],"x":"La 65ª de las SOFIPO hace responsable a la Entidad de recabar, registrar y conservar los datos de las operaciones por comisionistas, la obliga a identificar al comisionista en cada operación y, si es extranjero, a tomar en cuenta el nivel de Riesgo del país. Misma regla en SOCAP (65ª); no hay autorización previa ni aviso con plazo.","ref":"SOFIPO 65ª · H3","par":"C014"},{"id":"C014","tema":"h3","tipo":"caso","q":"Una unión de crédito contrató a un comisionista que ofrece sus productos desde otro país. ¿Qué dispone su DCG sobre el riesgo del país donde opera ese comisionista?","a":"Su DCG no contiene una regla sobre Operaciones realizadas a través de comisionistas contratados, por lo que no prevé ponderar el Riesgo del país","o":["Debe informar a la Comisión el nivel de Riesgo del país en un plazo de veinte días hábiles posteriores a la contratación del comisionista","Debe obtener la autorización previa de la Secretaría para contratar a cada comisionista extranjero, comunicarla a la Comisión y verificar cada año el nivel de Riesgo del país con una auditoría externa","Su DCG no contiene una regla sobre Operaciones realizadas a través de comisionistas contratados, por lo que no prevé ponderar el Riesgo del país","Debe tomar en cuenta la información disponible sobre el nivel de Riesgo del país donde opere el comisionista, además de ser responsable de los datos de las operaciones"],"x":"La DCG de Uniones de crédito no regula las Operaciones a través de comisionistas contratados (su 10ª sólo trata los mandatos y comisiones que la propia Unión realiza), por lo que no contiene la regla de ponderar el Riesgo del país. Esa ponderación existe para SOFIPO, SOCAP y Fondos de inversión.","ref":"Uniones de crédito (sin disposición equivalente); SOFIPO 65ª · H3","par":"C013"},{"id":"C015","tema":"h3","tipo":"caso","q":"Un banco modificó su Manual de Cumplimiento y debe remitir a la Comisión las modificaciones junto con un ejemplar completo. ¿Qué plazo establece su DCG y desde cuándo corre?","a":"Dentro de los veinte días hábiles siguientes a la fecha en que su comité de auditoría las apruebe","o":["Dentro de los veinte días hábiles siguientes a la fecha en que su Representante las elabore","Dentro de los veinte días hábiles siguientes a la fecha en que su comité de auditoría las apruebe","Dentro de los veinte días naturales siguientes a la fecha en que su comité de auditoría las apruebe","Dentro de los treinta días hábiles siguientes a la fecha en que su consejo de administración las apruebe"],"x":"La 64ª de Bancos concede veinte días hábiles contados desde que el comité de auditoría aprueba las modificaciones (43ª I). El plazo es uniforme en todas las DCG; lo que cambia es el punto de partida, que en Bancos es la aprobación del comité de auditoría.","ref":"Bancos 64ª; 43ª I · H3","par":"C016"},{"id":"C016","tema":"h3","tipo":"caso","q":"Un asesor en inversiones persona moral modificó su Manual de Cumplimiento y debe remitir a la Comisión las modificaciones junto con un ejemplar completo. ¿Qué plazo establece su DCG y desde cuándo corre?","a":"Dentro de los veinte días hábiles siguientes a la fecha en que su Representante las elabore","o":["Dentro de los veinte días hábiles siguientes a la fecha en que su comité de auditoría las apruebe","Dentro de los treinta días hábiles siguientes a la fecha en que su consejo de administración las apruebe","Dentro de los veinte días hábiles siguientes a la fecha en que su Representante las elabore","Dentro de los veinte días naturales siguientes a la fecha en que su comité de auditoría las apruebe"],"x":"La 38ª de Asesores en inversiones concede veinte días hábiles contados desde que su Representante elabora las modificaciones (30ª II), porque no hay aprobación de un comité de auditoría. El plazo es el mismo que en Bancos; cambia el hecho que lo inicia.","ref":"Asesores en inversiones 38ª; 30ª II; Bancos 64ª · H3","par":"C015"},{"id":"C017","tema":"h3","tipo":"caso","q":"Un directivo de un banco se entera de que existe una orden de aseguramiento, aún no ejecutada, sobre las cuentas de un cliente y piensa avisarle. ¿Qué establece la DCG de Bancos sobre su deber de reserva?","a":"Está estrictamente prohibido alertar al cliente o a un tercero sobre la existencia o presentación de órdenes de aseguramiento antes de que sean ejecutadas","o":["Su reserva prohíbe sólo alertar sobre los reportes y sobre los requerimientos de información o documentación, sin referirse a órdenes de aseguramiento","Está estrictamente prohibido alertar al cliente o a un tercero sobre la existencia o presentación de órdenes de aseguramiento antes de que sean ejecutadas","Puede avisarle, siempre que lo haga por escrito, con la autorización previa del Comité de Comunicación y Control y dejando constancia de que la orden aún no ha sido ejecutada","Puede avisarle una vez que la Comisión haya recibido el reporte de Operación Inusual correspondiente a ese cliente"],"x":"La 52ª de Bancos prohíbe alertar sobre los reportes (I), sobre los requerimientos (II), sobre órdenes de aseguramiento antes de ejecutarse (III) y sobre el contenido de la LPB (IV). La prohibición III no admite salvedad alguna, ni siquiera con autorización del Comité; las salvedades del primer párrafo (autoridad facultada e intercambio del Capítulo XIII) se refieren a la confidencialidad de los reportes.","ref":"Bancos 52ª III · H3","par":"C018"},{"id":"C018","tema":"h3","tipo":"caso","q":"Un directivo de un asesor en inversiones persona moral se entera de que existe una orden de aseguramiento, aún no ejecutada, sobre las cuentas de un cliente y piensa avisarle. ¿Qué establece la DCG de Asesores en inversiones sobre su deber de reserva?","a":"Su reserva prohíbe sólo alertar sobre los reportes y sobre los requerimientos de información o documentación, sin referirse a órdenes de aseguramiento","o":["Puede avisarle una vez que la Comisión haya recibido el reporte de Operación Inusual correspondiente a ese cliente","Su reserva prohíbe sólo alertar sobre los reportes y sobre los requerimientos de información o documentación, sin referirse a órdenes de aseguramiento","Puede avisarle, siempre que lo haga por escrito, con la autorización previa del Comité de Comunicación y Control y dejando constancia de que la orden aún no ha sido ejecutada","Está estrictamente prohibido alertar al cliente o a un tercero sobre la existencia o presentación de órdenes de aseguramiento antes de que sean ejecutadas"],"x":"La 28ª de Asesores en inversiones sólo contiene dos prohibiciones: alertar sobre los reportes y sobre los requerimientos de información o documentación. A diferencia de Bancos (52ª), no menciona órdenes de aseguramiento ni la LPB, y tampoco trae la salvedad del intercambio de información.","ref":"Asesores en inversiones 28ª; Bancos 52ª · H3","par":"C017"},{"id":"C019","tema":"h3","tipo":"caso","q":"Al diseñar la metodología de evaluación de Riesgos de su banco, el responsable de cumplimiento pregunta si debe establecer indicadores específicos de los delitos de los artículos 400 Bis y 139 Quáter del Código Penal Federal para cada elemento de Riesgo. ¿Qué responde la DCG de Bancos?","a":"Sí: debe establecer indicadores específicos relacionados con el artículo 400 Bis y con el 139 Quáter del Código Penal Federal para cada elemento de Riesgo","o":["No: la Comisión fija esos indicadores y la entidad se limita a aplicarlos sin modificarlos ni complementarlos","No: su DCG no exige indicadores específicos de esos delitos por elemento de Riesgo; bastan los indicadores asociados a cada elemento","Sí: debe establecer indicadores específicos relacionados con el artículo 400 Bis y con el 139 Quáter del Código Penal Federal para cada elemento de Riesgo","Sí, pero sólo del 139 Quáter para cada elemento de Riesgo, pues los indicadores del 400 Bis se evalúan únicamente en el Manual de Cumplimiento y no en la metodología"],"x":"La 21ª-2 de Bancos, con la reforma de agosto de 2024, obliga a establecer indicadores específicos del 400 Bis y del 139 Quáter para cada uno de los elementos de Riesgo (productos y servicios, Clientes y Usuarios, países, transacciones y canales). Es un añadido exclusivo de Bancos.","ref":"Bancos 21ª-2 · H3","par":"C020"},{"id":"C020","tema":"h3","tipo":"caso","q":"Al diseñar la metodología de evaluación de Riesgos de su SOFOM, el responsable de cumplimiento pregunta si debe establecer indicadores específicos de los delitos de los artículos 400 Bis y 139 Quáter del Código Penal Federal para cada elemento de Riesgo. ¿Qué responde la DCG de SOFOM?","a":"No: su DCG no exige indicadores específicos de esos delitos por elemento de Riesgo; bastan los indicadores asociados a cada elemento","o":["Sí, pero sólo del 139 Quáter para cada elemento de Riesgo, pues los indicadores del 400 Bis se evalúan únicamente en el Manual de Cumplimiento y no en la metodología","No: su DCG no exige indicadores específicos de esos delitos por elemento de Riesgo; bastan los indicadores asociados a cada elemento","Sí: debe establecer indicadores específicos relacionados con el artículo 400 Bis y con el 139 Quáter del Código Penal Federal para cada elemento de Riesgo","No: la Comisión fija esos indicadores y la entidad se limita a aplicarlos sin modificarlos ni complementarlos"],"x":"La 17ª-2 de SOFOM exige identificar elementos e indicadores asociados y medir su efecto, pero no trae el párrafo de indicadores específicos del 400 Bis y del 139 Quáter por elemento, que sólo está en Bancos (21ª-2, reforma de 2024). La diferencia se aprende como «igual que Bancos, salvo los indicadores específicos de 2024».","ref":"SOFOM 17ª-2; Bancos 21ª-2 · H3","par":"C019"},{"id":"C021","tema":"h3","tipo":"trampa","q":"Señala la afirmación sobre la metodología de evaluación de Riesgos de un banco que NO es correcta.","a":"Debe remitirse a la Comisión como documento autónomo, separado del Manual de Cumplimiento y con un plazo propio de envío","o":["Debe remitirse a la Comisión como documento autónomo, separado del Manual de Cumplimiento y con un plazo propio de envío","La información generada con motivo del capítulo debe conservarse por un plazo no menor a cinco años y ponerse a disposición de la Comisión","Su diseño debe estar establecido en el Manual de Cumplimiento o en otro documento o manual elaborado por la propia entidad","La entidad debe evaluar sus Riesgos con antelación al lanzamiento o uso de nuevos productos, servicios, canales de envío o distribución"],"x":"La metodología no tiene envío autónomo ni plazo propio: va en el Manual o en otro documento referido en él (64ª); el Manual se remite a la Comisión y los documentos distintos sólo quedan a su disposición. Las otras tres afirmaciones son texto de la 21ª-1 y la 21ª-4.","ref":"Bancos 21ª-1; 21ª-4; 64ª · H3"},{"id":"C022","tema":"h3","tipo":"caso","q":"Un banco contrata a una persona que trabajará en atención al público. ¿Cuándo debe recibir capacitación en la materia según la DCG de Bancos?","a":"De manera previa o simultánea a su ingreso o al inicio de sus actividades en esa área","o":["Dentro de los seis meses posteriores a su contratación, siempre que el Comité haya aprobado su perfil","En el siguiente curso anual de la entidad, aun cuando ya haya iniciado sus actividades en atención al público","Dentro de los veinte días hábiles siguientes a su ingreso, con constancia de participación y evaluación posterior","De manera previa o simultánea a su ingreso o al inicio de sus actividades en esa área"],"x":"La 50ª de Bancos exige que quienes vayan a laborar en áreas de atención al público o de administración de recursos reciban la capacitación antes o al mismo tiempo que su ingreso o inicio de actividades. El curso anual de la 49ª no sustituye esa capacitación inicial.","ref":"Bancos 50ª, segundo párrafo; 49ª · H3"},{"id":"C023","tema":"h3","tipo":"caso","q":"Una empleada de un banco duda en enviar un reporte a la Secretaría porque su contrato le impone confidencialidad sobre la información de los clientes. ¿Qué dispone la DCG de Bancos?","a":"El envío de reportes no constituye violación a restricciones de revelación impuestas por vía contractual o por disposición legal, ni implica responsabilidad","o":["Puede enviarlo, pero responde por la restricción contractual si la Comisión considera que el reporte es un indicio fundado de delito","Debe obtener la aprobación del Comité y notificar al cliente una vez enviado, para dejar constancia de la excepción a la confidencialidad pactada en el contrato","El envío de reportes no constituye violación a restricciones de revelación impuestas por vía contractual o por disposición legal, ni implica responsabilidad","Debe recabar antes la autorización por escrito del cliente, pues la confidencialidad contractual sólo cede ante él"],"x":"La 53ª de Bancos protege el envío de reportes frente a restricciones contractuales o legales de revelación y excluye responsabilidad; además, los reportes no se consideran indicios fundados de la comisión de un delito. No requiere consentimiento del cliente ni aviso posterior.","ref":"Bancos 53ª · H3"},{"id":"C024","tema":"h3","tipo":"caso","q":"La Comisión requiere a un banco copia del expediente de identificación de un cliente. ¿Cómo debe presentar la documentación según la DCG de Bancos?","a":"Directamente en la unidad administrativa de la Comisión que se designe, contenida en sobre cerrado","o":["Por correo electrónico al buzón que designe el Oficial de Cumplimiento, sin sobre, para agilizar la revisión de la autoridad","Directamente en la unidad administrativa de la Comisión que se designe, contenida en sobre cerrado","En copia simple y sin archivos electrónicos, porque los archivos en medios electrónicos sólo se entregan a la Secretaría","En original certificado ante notario en todos los casos, ya que la copia simple sólo se admite para los reportes de Operaciones Inusuales"],"x":"La 54ª de Bancos ordena entregar a la Comisión la información directamente en la unidad que se designe y en sobre cerrado, en copia simple (certificada si se solicita) y en archivos electrónicos susceptibles de mostrarse con la aplicación que señale la Secretaría. La DCG no fija un número de días: el plazo lo establece la Comisión.","ref":"Bancos 54ª · H3"},{"id":"C025","tema":"h3","tipo":"cifra","q":"Un banco obtuvo los resultados de la implementación de su metodología de evaluación de Riesgos. Aunque no surjan nuevos riesgos ni se actualice la evaluación nacional de riesgos, ¿en qué plazo máximo debe revisar y actualizar la metodología?","a":"En un plazo no mayor a doce meses a partir de que cuente con los resultados de su implementación","o":["En un plazo no mayor a cinco años, que es el periodo en que debe conservar la información generada","En un plazo no mayor a veinticuatro meses a partir de que cuente con los resultados de su implementación","En un plazo no mayor a doce meses a partir de que cuente con los resultados de su implementación","En un plazo no mayor a seis meses a partir de que la Comisión apruebe el Manual de Cumplimiento"],"x":"La 21ª-4 de Bancos exige revisar y actualizar ante nuevos Riesgos, al actualizarse la evaluación nacional o a más tardar doce meses después de contar con los resultados; consta por escrito y queda a disposición de la Secretaría y la Comisión. Los cinco años son el plazo de conservación, no de revisión.","ref":"Bancos 21ª-4 · H3"},{"id":"C026","tema":"h3","tipo":"trampa","q":"Respecto de la conservación de información en un banco, señala la afirmación que NO es correcta.","a":"Toda la información que conserva por PLD/FT, incluidos la generada con la metodología de riesgos y el informe de la revisión anual, se guarda diez años","o":["La información generada con motivo de la metodología de evaluación de Riesgos se conserva por un plazo no menor a cinco años","El informe de la revisión anual de cumplimiento se conserva por un plazo no menor a cinco años, además de remitirse a la Comisión","La documentación de las operaciones y los registros históricos se conservan por un periodo no menor a diez años contado desde la ejecución de la Operación","Toda la información que conserva por PLD/FT, incluidos la generada con la metodología de riesgos y el informe de la revisión anual, se guarda diez años"],"x":"No existe un plazo único de diez años: operaciones, expedientes, registros y copias de reportes se guardan diez años (59ª), pero el informe de auditoría (60ª) y la información de la metodología de riesgos (21ª-4) se conservan cinco años. Confundirlos es la trampa de «diez años para todos».","ref":"Bancos 59ª; 60ª; 21ª-4 · H3"},{"id":"C027","tema":"h3","tipo":"caso","q":"Un asesor en inversiones que actúa como persona física pregunta cómo cumple la obligación de capacitación en PLD/FT. ¿Qué dispone su DCG?","a":"Debe tomar él mismo, al menos, un curso de capacitación anual que contenga lo señalado en la disposición","o":["Debe tomar él mismo, al menos, un curso de capacitación anual que contenga lo señalado en la disposición","Debe designar a un Representante que tome el curso por él y expida la constancia de participación","Debe tomar un curso cada seis meses, con evaluación y constancia emitidas por la Comisión","Queda exento, porque la obligación de capacitación sólo alcanza a los asesores en inversiones personas morales"],"x":"La 25ª de Asesores en inversiones dirige los programas a las personas morales y, para las personas físicas, ordena que tomen al menos un curso de capacitación anual. El Representante sólo existe en las personas morales (30ª).","ref":"Asesores en inversiones 25ª, último párrafo · H3"},{"id":"C028","tema":"h3","tipo":"caso","q":"Un banco realiza operaciones a través de comisionistas contratados conforme al artículo 46 Bis-1 de la Ley de Instituciones de Crédito. ¿Qué obligación tiene el banco respecto de los datos y documentos de esas operaciones?","a":"Es responsable de recabar, registrar y conservar los datos y documentos como si operara directamente, e identificar al comisionista que tramitó cada Operación","o":["Es responsable de recabar, registrar y conservar los datos y documentos como si operara directamente, e identificar al comisionista que tramitó cada Operación","Debe recabar un expediente simplificado, porque se presume que el comisionista validó la identidad de cada cliente y conserva la documentación que lo acredita","Sólo debe conservar los datos del propio comisionista, porque el expediente de los clientes atendidos lo integra y guarda éste","La responsabilidad de recabar y conservar los datos se traslada al comisionista, que debe identificar al banco en cada Operación realizada, quedando éste como mero receptor"],"x":"La 63ª de Bancos mantiene la responsabilidad en la Entidad: los detalles y características de lo que recaba deben ser los mismos que si operara directamente, y por cada Operación debe identificar al comisionista. No se traslada la obligación al comisionista.","ref":"Bancos 63ª · H3"},{"id":"C029","tema":"h3","tipo":"caso","q":"Un transmisor de dinero opera a través de Agentes Relacionados y Personas Jurídicas Coadyuvantes. ¿Qué debe remitir a la Comisión respecto de ellos según su DCG?","a":"Un aviso con la información de los Agentes Relacionados, Personas Jurídicas Coadyuvantes y demás entes con los que tenga relación contractual, en los plazos que la Comisión establezca","o":["El expediente de identificación de cada usuario atendido por sus agentes, dentro de los veinte días hábiles posteriores a cada operación","Un aviso con la información de los Agentes Relacionados, Personas Jurídicas Coadyuvantes y demás entes con los que tenga relación contractual, en los plazos que la Comisión establezca","Una constancia anual de capacitación de cada agente, firmada por el Oficial de Cumplimiento del propio transmisor","Nada, porque la responsabilidad de esas operaciones recae exclusivamente en los agentes y no en el transmisor"],"x":"La 50ª Bis de Transmisores de dinero ordena remitir a la Comisión un aviso con la información de los Agentes Relacionados, Personas Jurídicas Coadyuvantes, otros transmisores y entidades financieras con relación contractual, y de los terceros con que operen. El transmisor sigue siendo responsable del cumplimiento (50ª) y debe verificar su honorabilidad (49ª).","ref":"Transmisores de dinero 49ª; 50ª; 50ª Bis · H3"},{"id":"C030","tema":"h3","tipo":"caso","q":"Una casa de bolsa ofrece productos de una institución de crédito en su carácter de comisionista de ésta. ¿Quién recaba los datos del expediente de identificación de esos clientes y quién lo conserva según la DCG de Casas de bolsa?","a":"La casa de bolsa recaba y registra los datos y documentos y conserva el expediente en lugar del banco, manteniéndolo a disposición de éste, de la Secretaría y de la Comisión","o":["La casa de bolsa recaba y registra los datos y documentos y conserva el expediente en lugar del banco, manteniéndolo a disposición de éste, de la Secretaría y de la Comisión","El banco recaba los datos y conserva el expediente; la casa de bolsa sólo identifica al cliente y envía los documentos","Ambas conservan una copia completa del expediente, la casa de bolsa por diez años y el banco por cinco años","La casa de bolsa integra el expediente, pero debe entregarlo al banco en cinco días hábiles y éste lo conserva"],"x":"La 62ª de Casas de bolsa regula el supuesto inverso al de Bancos: cuando actúa como comisionista de instituciones de crédito, recaba y registra los datos y conserva el expediente en lugar del banco, con la salvedad de que debe estar siempre a disposición del banco, la Secretaría o la Comisión. En Bancos, en cambio, la 63ª regula a los comisionistas que contrata el banco y lo hace responsable de los datos.","ref":"Casas de bolsa 62ª; Bancos 63ª · H3"},{"id":"C031","tema":"h3","tipo":"caso","q":"Un banco planea lanzar un nuevo canal de distribución digital para sus productos. ¿Cuándo debe evaluar los Riesgos asociados según su DCG?","a":"Con antelación al lanzamiento o uso del nuevo canal de envío o distribución","o":["Dentro de los doce meses posteriores al lanzamiento, junto con la revisión periódica de la metodología de Riesgos","Dentro de los veinte días hábiles siguientes al lanzamiento, dando aviso a la Comisión del resultado obtenido","Cuando la Comisión lo requiera en su siguiente visita de inspección, mediante el programa de supervisión anual","Con antelación al lanzamiento o uso del nuevo canal de envío o distribución"],"x":"La 21ª-1 de Bancos exige llevar a cabo la evaluación de Riesgos con antelación al lanzamiento o uso de nuevos productos, servicios, tipos de Clientes o Usuarios, países o áreas geográficas, canales y transacciones. Los doce meses son el plazo de revisión de la metodología, no el de evaluación previa.","ref":"Bancos 21ª-1, último párrafo · H3"},{"id":"C032","tema":"h3","tipo":"caso","q":"Una ITF quiere encomendar la revisión anual de cumplimiento a una persona ajena a su estructura. ¿Quién puede realizarla conforme a su DCG?","a":"El área de auditoría interna o un tercero independiente, con un responsable que suscriba la revisión y cuente con la certificación del artículo 4, fracción X, de la Ley de la CNBV","o":["El Comité de Comunicación y Control, por ser el órgano responsable de dictaminar la efectividad de las medidas de control","El Oficial de Cumplimiento, siempre que informe sus resultados al administrador único dentro de los veinte días hábiles","Sólo un auditor externo independiente, porque el área de auditoría interna no puede evaluar la efectividad del cumplimiento","El área de auditoría interna o un tercero independiente, con un responsable que suscriba la revisión y cuente con la certificación del artículo 4, fracción X, de la Ley de la CNBV"],"x":"El artículo 76 de la DCG de ITF admite auditoría interna o un «tercero independiente», exige que quien suscriba la revisión tenga la certificación del artículo 4, fracción X, de la LCNBV y que el informe se presente al administrador único o a la dirección general y, en su caso, al Comité. En él no participa ningún miembro del Comité.","ref":"ITF art. 76 · H3"},{"id":"C033","tema":"h3","tipo":"caso","q":"Un banco recibe de otro banco una solicitud de antecedentes de un cliente para fortalecer la prevención de los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé la DCG de Bancos?","a":"Pueden intercambiarla; la respuesta la remiten funcionarios autorizados en un plazo que no debe exceder de 30 días naturales contados desde la solicitud","o":["Pueden intercambiarla sólo con convenio previo sobre confidencialidad y cargos y aviso previo a la Comisión, y la respuesta debe remitirse en un plazo de 30 días hábiles","Pueden intercambiarla únicamente a través de la Secretaría, que recaba la información y la entrega a la entidad que la solicitó","Pueden intercambiarla; la respuesta la remiten funcionarios autorizados en un plazo que no debe exceder de 30 días naturales contados desde la solicitud","Su DCG no contiene capítulo ni disposición que regule el intercambio de información entre entidades del mismo tipo"],"x":"La 62ª de Bancos permite el intercambio entre dos o más Entidades, pedido por funcionarios autorizados con motivo y clase de información, y respondido en no más de 30 días naturales. Entre entidades del mismo tipo no se exige convenio ni aviso previo; esos requisitos son de grupo financiero y de entidades extranjeras.","ref":"Bancos 62ª I-III · H3","par":"C034"},{"id":"C034","tema":"h3","tipo":"caso","q":"Una SOCAP recibe de otra SOCAP una solicitud de antecedentes de un cliente para fortalecer la prevención de los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé la DCG de las SOCAP?","a":"Su DCG no contiene capítulo ni disposición que regule el intercambio de información entre entidades del mismo tipo","o":["Pueden intercambiarla sólo con convenio previo sobre confidencialidad y cargos y aviso previo a la Comisión, y la respuesta debe remitirse en un plazo de 30 días hábiles","Su DCG no contiene capítulo ni disposición que regule el intercambio de información entre entidades del mismo tipo","Pueden intercambiarla únicamente a través de la Secretaría, que recaba la información y la entrega a la entidad que la solicitó","Pueden intercambiarla; la respuesta la remiten funcionarios autorizados en un plazo que no debe exceder de 30 días naturales contados desde la solicitud"],"x":"La DCG de las SOCAP no tiene capítulo ni disposición de intercambio de información de PLD/FT (tampoco dentro de grupo ni con extranjeras). Los 30 días naturales de respuesta existen sólo en Bancos (62ª), SOFIPO (64ª) e ITF (art. 78).","ref":"SOCAP (sin disposición de intercambio); Bancos 62ª · H3","par":"C033"},{"id":"C035","tema":"h3","tipo":"caso","q":"Dos bancos acuerdan intercambiar información de un cliente para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Cómo se lleva a cabo el intercambio según la DCG de Bancos?","a":"Se realiza mediante la plataforma tecnológica que las propias entidades establezcan, conforme a términos que aseguren la confidencialidad de la información","o":["Se realiza en el formato oficial que emita la Secretaría y a través de los medios que ésta señale, con copia a la Comisión antes de que se efectúe el intercambio","Se realiza mediante escrito firmado por los funcionarios autorizados, sin que su DCG prevea una plataforma tecnológica","Se realiza por oficio de la Comisión, que recaba la información de la entidad requerida y la entrega a la solicitante","Se realiza mediante la plataforma tecnológica que las propias entidades establezcan, conforme a términos que aseguren la confidencialidad de la información"],"x":"La 62ª VI de Bancos dispone que el intercambio se realiza mediante la plataforma tecnológica que establezcan las Entidades, siempre que se asegure la confidencialidad. La solicitud y la respuesta pueden remitirse de forma electrónica o digital, y también puede compartirse información sin solicitud previa.","ref":"Bancos 62ª II, III, V, VI · H3","par":"C036"},{"id":"C036","tema":"h3","tipo":"caso","q":"Dos SOFIPO acuerdan intercambiar información de un cliente para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Cómo se lleva a cabo el intercambio según la DCG de las SOFIPO?","a":"Se realiza mediante escrito firmado por los funcionarios autorizados, sin que su DCG prevea una plataforma tecnológica","o":["Se realiza por oficio de la Comisión, que recaba la información de la entidad requerida y la entrega a la solicitante","Se realiza en el formato oficial que emita la Secretaría y a través de los medios que ésta señale, con copia a la Comisión antes de que se efectúe el intercambio","Se realiza mediante la plataforma tecnológica que las propias entidades establezcan, sin que la solicitud deba constar por escrito ni la respuesta deba ir firmada","Se realiza mediante escrito firmado por los funcionarios autorizados, sin que su DCG prevea una plataforma tecnológica"],"x":"La 64ª de las SOFIPO conserva el núcleo de Bancos (funcionarios autorizados, 30 días naturales), pero la solicitud se hace mediante escrito y la respuesta por escrito firmado por funcionarios autorizados. No prevé plataforma tecnológica, estadística de reportes ni intercambio obligatorio de transferencias.","ref":"SOFIPO 64ª II-III; Bancos 62ª VI · H3","par":"C035"},{"id":"C037","tema":"h3","tipo":"caso","q":"Una casa de bolsa y otra entidad financiera del mismo grupo financiero quieren compartir información de las operaciones de sus clientes para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé la DCG de Casas de bolsa?","a":"Pueden intercambiarla si celebran un convenio sobre el tratamiento confidencial y los cargos de los funcionarios autorizados, e informan a la Comisión antes de que se realice","o":["Pueden intercambiarla sin necesidad de convenio, bastando que informen a la Comisión, en el formato oficial, dentro de los 30 días naturales siguientes al intercambio","Su DCG no contiene disposición que regule el intercambio de información dentro de un grupo financiero","Pueden intercambiarla si celebran un convenio sobre el tratamiento confidencial y los cargos de los funcionarios autorizados, e informan a la Comisión antes de que se realice","Pueden intercambiarla únicamente mediante solicitud por escrito firmado, con respuesta en un plazo de 30 días naturales"],"x":"La 61ª-1 de Casas de bolsa permite el intercambio dentro del grupo financiero de información sobre las Operaciones con Clientes y Usuarios, siempre que celebren un convenio (confidencialidad y cargos) y informen a la Comisión antes del intercambio, conservando el soporte. A diferencia de Bancos, no incluye estadística de reportes.","ref":"Casas de bolsa 61ª-1; Bancos 62ª Sexies · H3","par":"C038"},{"id":"C038","tema":"h3","tipo":"caso","q":"Una unión de crédito y otra entidad financiera del mismo grupo financiero quieren compartir información de las operaciones de sus clientes para prevenir los delitos de los artículos 139 Quáter y 400 Bis del Código Penal Federal. ¿Qué prevé la DCG de Uniones de crédito?","a":"Su DCG no contiene disposición que regule el intercambio de información dentro de un grupo financiero","o":["Su DCG no contiene disposición que regule el intercambio de información dentro de un grupo financiero","Pueden intercambiarla si celebran un convenio sobre el tratamiento confidencial y los cargos de los funcionarios autorizados, e informan a la Comisión antes de que se realice","Pueden intercambiarla únicamente mediante solicitud por escrito firmado, con respuesta en un plazo de 30 días naturales","Pueden intercambiarla sin necesidad de convenio, bastando que informen a la Comisión, en el formato oficial, dentro de los 30 días naturales siguientes al intercambio"],"x":"La DCG de Uniones de crédito no regula el intercambio de información, ni entre entidades del mismo tipo ni dentro del grupo ni con extranjeras. El convenio con aviso previo a la Comisión existe en Bancos, SOFOM, Casas de bolsa, Fondos, SOFIPO, Casas de cambio e ITF.","ref":"Uniones de crédito (sin disposición de intercambio); Casas de bolsa 61ª-1 · H3","par":"C037"},{"id":"C039","tema":"h3","tipo":"caso","q":"Un banco desea compartir el contenido de la Lista de Personas Bloqueadas con un corresponsal en el extranjero para fortalecer la prevención de operaciones ilícitas. ¿Qué prevé la DCG de Bancos?","a":"Puede hacerlo, estableciendo en su Manual de Cumplimiento, o en otro documento, las medidas que garanticen el tratamiento confidencial del contenido de la lista","o":["No puede hacerlo, porque la reserva prohíbe alertar sobre el contenido de la Lista de Personas Bloqueadas sin admitir excepción alguna","Sólo puede compartirla con entidades financieras de su mismo grupo financiero que estén facultadas para ello, nunca con entidades, filiales o corresponsales del exterior","Su DCG no contiene disposición que autorice compartir el contenido de la Lista de Personas Bloqueadas con entidades del exterior","Puede hacerlo, estableciendo en su Manual de Cumplimiento, o en otro documento, las medidas que garanticen el tratamiento confidencial del contenido de la lista"],"x":"La 62ª Quinquies de Bancos permite intercambiar el contenido de la LPB con oficinas de representación, filiales del exterior, entidades del exterior donde invierte, corresponsales y entidades de su grupo financiero, bajo medidas de confidencialidad previstas en el Manual. La 52ª IV exceptúa expresamente ese intercambio de la prohibición de alertar.","ref":"Bancos 62ª Quinquies; 52ª IV · H3","par":"C040"},{"id":"C040","tema":"h3","tipo":"caso","q":"Una SOFOM desea compartir el contenido de la Lista de Personas Bloqueadas con un corresponsal en el extranjero para fortalecer la prevención de operaciones ilícitas. ¿Qué prevé la DCG de SOFOM?","a":"Su DCG no contiene disposición que autorice compartir el contenido de la Lista de Personas Bloqueadas con entidades del exterior","o":["Puede hacerlo, estableciendo en su Manual de Cumplimiento, o en otro documento, las medidas que garanticen el tratamiento confidencial del contenido de la lista","Sólo puede compartirla con entidades financieras de su mismo grupo financiero que estén facultadas para ello, nunca con entidades, filiales o corresponsales del exterior","Su DCG no contiene disposición que autorice compartir el contenido de la Lista de Personas Bloqueadas con entidades del exterior","No puede hacerlo, porque la reserva prohíbe alertar sobre el contenido de la Lista de Personas Bloqueadas sin admitir excepción alguna"],"x":"La DCG de SOFOM no tiene una disposición equivalente a la 62ª Quinquies de Bancos: sólo admite el intercambio dentro del grupo financiero (52ª-1) y no regula el intercambio con entidades extranjeras ni la LPB. Compartir el contenido de la lista es exclusivo de Bancos.","ref":"SOFOM (sin disposición equivalente); Bancos 62ª Quinquies · H3","par":"C039"},{"id":"C041","tema":"h3","tipo":"caso","q":"Un banco recibe de otro banco una solicitud de información sobre un cliente, motivada por una disputa comercial entre ambos. ¿Puede responderla con base en el capítulo de intercambio de información de su DCG?","a":"No: el intercambio debe limitarse única y exclusivamente a fortalecer la prevención y detección de los supuestos de los artículos 139 Quáter y 400 Bis del Código Penal Federal y 52 de la Ley","o":["Sí, siempre que la solicite un funcionario autorizado y el banco obtenga el consentimiento del cliente antes de responder","No: el intercambio debe limitarse única y exclusivamente a fortalecer la prevención y detección de los supuestos de los artículos 139 Quáter y 400 Bis del Código Penal Federal y 52 de la Ley","Sí, si la respuesta se remite dentro de los 30 días naturales siguientes a la solicitud, sin importar el motivo que la origine","Sí, previo convenio con el banco solicitante y aviso a la Comisión en el formato oficial que ésta expida"],"x":"La 62ª de Bancos limita el intercambio a los casos cuya finalidad sea fortalecer las medidas para prevenir y detectar operaciones que pudieran actualizar el 139 Quáter o el 400 Bis del CPF y el 52 de la LIC. No basta con que la solicite un funcionario autorizado ni con respetar el plazo.","ref":"Bancos 62ª, primer párrafo · H3"},{"id":"C042","tema":"h3","tipo":"cifra","q":"Un banco recibió de otra entidad una solicitud de información de un cliente por motivos de prevención de operaciones ilícitas. ¿Qué plazo máximo tiene para responder según la DCG de Bancos?","a":"Un plazo que no debe exceder de 30 días naturales, contados a partir de la fecha en que se hubiere solicitado la información","o":["Un plazo que no debe exceder de 15 días hábiles, contados a partir de la fecha en que se hubiere solicitado la información","Un plazo que no debe exceder de 30 días naturales, contados a partir de la fecha en que se hubiere solicitado la información","Un plazo que no debe exceder del día hábil bancario siguiente, por tratarse de un intercambio mediante plataforma tecnológica","Un plazo que no debe exceder de 30 días hábiles, contados a partir de la fecha en que se hubiere recibido la información"],"x":"La 62ª III de Bancos fija que la respuesta se remita en un plazo que no exceda de 30 días naturales contados desde la solicitud. La trampa habitual es leerlos como hábiles; los plazos de día hábil bancario pertenecen a otro intercambio (el obligatorio de transferencias, 62ª Quáter).","ref":"Bancos 62ª III · H3"},{"id":"C043","tema":"h3","tipo":"trampa","q":"¿En cuál de estos intercambios de información de un banco NO se exige convenio ni aviso previo a la Comisión?","a":"Con otra entidad del mismo tipo, conforme al intercambio general del capítulo, que no exige convenio ni aviso previo","o":["Con entidades financieras que formen parte de su mismo grupo financiero, mediante un convenio sobre confidencialidad y cargos y aviso previo a la Comisión","Con otra entidad del mismo tipo, conforme al intercambio general del capítulo, que no exige convenio ni aviso previo","Con entidades financieras extranjeras por una operación en dólares entre ambas, con convenio sobre confidencialidad y cargos y aviso previo a la Comisión","Con instituciones financieras del exterior que sean sus filiales, con convenio sobre confidencialidad y cargos y aviso previo a la Comisión"],"x":"Entre entidades del mismo tipo la 62ª sólo exige funcionarios autorizados, motivo y clase de información y plazo de respuesta. El convenio con aviso previo a la Comisión se exige dentro de grupo (62ª Sexies) y con extranjeras (62ª Bis, Ter y Octies).","ref":"Bancos 62ª; 62ª Bis; 62ª Sexies; 62ª Octies · H3"},{"id":"C044","tema":"h3","tipo":"caso","q":"Un banco intercambia información de clientes y operaciones con una entidad financiera extranjera análoga, en el formato oficial de la Secretaría. Además del convenio y del aviso previo a la Comisión, ¿qué debe hacer?","a":"Enviar a la Secretaría, a través de la Comisión, copia del formato con la información intercambiada, de forma previa o simultánea al intercambio","o":["Enviar a la Comisión copia del formato dentro de los treinta días naturales siguientes al intercambio de la información","Enviar a la Secretaría, a través de la Comisión, copia del formato con la información intercambiada, de forma previa o simultánea al intercambio","Publicar el convenio en su Manual de Cumplimiento y notificar el contenido del formato al Comité de Comunicación y Control","Obtener la autorización expresa de la Secretaría para cada intercambio, previa opinión de la Comisión y del Comité"],"x":"La 62ª Ter exige, con entidades financieras extranjeras análogas, convenio sobre confidencialidad y cargos, aviso previo a la Comisión y copia del formato a la Secretaría, por conducto de la Comisión, antes o al mismo tiempo que el intercambio, y que derive de una Operación entre ellas. Sin esa copia a la Secretaría el intercambio no cumple la 62ª Ter, aunque exista convenio y aviso previo.","ref":"Bancos 62ª Ter · H3"},{"id":"C045","tema":"h3","tipo":"cifra","q":"Un banco envió una transferencia internacional de fondos y debe cumplir el intercambio obligatorio de transferencias previsto en su DCG. ¿Cuándo debe cargar la información de esa transferencia en la plataforma autorizada?","a":"Al cierre de operación de la plataforma del mismo día hábil al de su envío o recepción","o":["Dentro de las veinticuatro horas siguientes a que la Secretaría le requiera la información de esa transferencia","A más tardar el día hábil bancario siguiente a aquel en que envió o recibió la transferencia en cuestión","Dentro de los diez días hábiles siguientes al cierre del mes en que se envió o recibió la transferencia","Al cierre de operación de la plataforma del mismo día hábil al de su envío o recepción"],"x":"La 62ª Quáter IV de Bancos obliga («deberán») a cargar la información de las transferencias al cierre de operación de la plataforma del mismo día hábil. El día hábil bancario siguiente es el plazo para cargar la documentación de los clientes, y las consultas de Usuarios sólo proceden durante los dos días hábiles bancarios siguientes a la transferencia.","ref":"Bancos 62ª Quáter IV, V, X · H3"},{"id":"C046","tema":"h3","tipo":"caso","q":"Un banco quiere compartir con su filial en el exterior estadística de reportes de Operaciones Inusuales y las circunstancias que consideró al dictaminar una de ellas. ¿Qué exige su DCG?","a":"Convenio con la filial sobre confidencialidad y cargos de los funcionarios, aviso previo a la Comisión, medios electrónicos y formato oficial que emita la Secretaría","o":["Sólo aviso a la Comisión dentro de los treinta días naturales posteriores a compartirla, sin necesidad de convenio con la filial","Convenio con la filial sobre confidencialidad y cargos de los funcionarios, aviso previo a la Comisión, medios electrónicos y formato oficial que emita la Secretaría","Autorización de la Unidad de Inteligencia Financiera para cada envío, solicitada por conducto del Oficial de Cumplimiento","Nada: esa estadística únicamente puede compartirse dentro del grupo financiero y nunca con entidades del exterior"],"x":"La 62ª Octies permite intercambiar antecedentes de Clientes y Usuarios y estadística de reportes y dictámenes de OI con filiales del exterior, entidades del exterior donde invierte y corresponsales, con convenio, aviso previo a la Comisión, medios electrónicos y formato oficial de la Secretaría. La estadística de reportes y dictámenes es exclusiva del intercambio de Bancos.","ref":"Bancos 62ª Octies · H3"},{"id":"C047","tema":"h3","tipo":"caso","q":"Una ITF quiere intercambiar información de sus Clientes con una entidad financiera extranjera. ¿Con cuáles puede hacerlo según su DCG?","a":"Únicamente con las entidades financieras extranjeras que determine la Secretaría, con convenio y aviso previo a la CNBV","o":["Con cualquier entidad financiera extranjera que sea filial de la ITF, sin necesidad de convenio ni de aviso previo","Únicamente con las entidades financieras extranjeras que determine la Secretaría, con convenio y aviso previo a la CNBV","Con ninguna: las ITF sólo pueden intercambiar información con otras ITF y con entidades financieras nacionales","Con cualquier entidad financiera extranjera con la que mantenga una relación de corresponsalía, con aviso previo a la CNBV"],"x":"El artículo 81 de la DCG de ITF limita el intercambio con entidades financieras extranjeras a las que determine la Secretaría, con convenio, aviso previo a la CNBV, copia del formato a la Secretaría y derivado de una Operación. No prevé el intercambio de la LPB, exclusivo de Bancos.","ref":"ITF art. 81 · H3"},{"id":"C048","tema":"h3","tipo":"trampa","q":"¿Cuál de los siguientes sujetos NO tiene en su DCG ninguna disposición de intercambio de información de PLD/FT, ni entre entidades del mismo tipo ni dentro de un grupo financiero?","a":"Transmisores de dinero","o":["Transmisores de dinero","SOFOM, que prevén el intercambio dentro de un grupo financiero con convenio y aviso previo a la Comisión","Fondos de inversión, que prevén el intercambio dentro de un grupo financiero con convenio y aviso previo a la Comisión","Casas de cambio, que prevén el intercambio dentro de un grupo financiero con convenio y aviso previo a la Comisión"],"x":"Asesores en inversiones, SOCAP, Uniones de crédito, Centros cambiarios y Transmisores de dinero no regulan el intercambio de información de PLD/FT. Casas de cambio (51ª-1), SOFOM (52ª-1) y Fondos (55-1ª) lo prevén sólo dentro del grupo financiero. No es verdad que todos los sujetos puedan intercambiar información.","ref":"Transmisores de dinero (sin disposición); Casas de cambio 51ª-1; SOFOM 52ª-1; Fondos de inversión 55-1ª · H3"},{"id":"C049","tema":"h3","tipo":"caso","q":"Al cotejar su base de clientes con la Lista de Personas Bloqueadas, el área de cumplimiento de un banco encuentra a uno de ellos. ¿Qué debe hacer según la DCG de Bancos?","a":"Suspender de inmediato todo acto, operación o servicio con él y remitir en 24 horas un reporte de Operación Inusual con la leyenda «Lista de Personas Bloqueadas»","o":["Suspender de inmediato todo acto, operación o servicio con él y remitir en 24 horas un reporte de Operación Inusual con la leyenda «Lista de Personas Bloqueadas»","Remitir en 24 horas un reporte autónomo de Lista de Personas Bloqueadas y suspender el servicio sólo hasta que la UIF resuelva sobre la inclusión del cliente","Su DCG no regula la Lista de Personas Bloqueadas, por lo que no prevé ni la suspensión ni el reporte con esa leyenda","Suspender el servicio y remitir en tres días hábiles un reporte de Operaciones Relevantes con la leyenda de la lista"],"x":"La 72ª de Bancos ordena suspender de inmediato todo acto, operación o servicio con el Cliente o Usuario y remitir a la Secretaría, por conducto de la Comisión, dentro de las veinticuatro horas desde que conozca la información, un reporte de Operación Inusual (41ª) con la leyenda «Lista de Personas Bloqueadas». No es un reporte autónomo.","ref":"Bancos 72ª I-II · H3","par":"C050"},{"id":"C050","tema":"h3","tipo":"caso","q":"Al cotejar su base de clientes con la Lista de Personas Bloqueadas, el Representante de un asesor en inversiones encuentra a uno de ellos. ¿Qué debe hacer según la DCG de Asesores en inversiones?","a":"Su DCG no regula la Lista de Personas Bloqueadas, por lo que no prevé ni la suspensión ni el reporte con esa leyenda","o":["Remitir en 24 horas un reporte autónomo de Lista de Personas Bloqueadas y suspender el servicio sólo hasta que la UIF resuelva sobre la inclusión del cliente","Suspender el servicio y remitir en tres días hábiles un reporte de Operaciones Relevantes con la leyenda de la lista","Su DCG no regula la Lista de Personas Bloqueadas, por lo que no prevé ni la suspensión ni el reporte con esa leyenda","Suspender de inmediato todo acto, operación o servicio con él y remitir en 24 horas un reporte de Operación Inusual con la leyenda «Lista de Personas Bloqueadas»"],"x":"La DCG de Asesores en inversiones no menciona la Lista de Personas Bloqueadas: no tiene capítulo, definición, criterio de Operación Inusual, reporte con leyenda, alerta ni prohibición de alertar. La suspensión inmediata y el reporte de 24 horas son obligaciones de los otros once sujetos del bloque.","ref":"Asesores en inversiones (sin disposición); Bancos 72ª · H3","par":"C049"},{"id":"C051","tema":"h3","tipo":"caso","q":"La Unidad de Inteligencia Financiera emitió su resolución sobre la inclusión de un cliente de un banco en la Lista de Personas Bloqueadas. ¿Qué plazo prevé la DCG de Bancos para notificarla por oficio al interesado?","a":"Dentro de los quince días hábiles siguientes al de su emisión","o":["Dentro de los quince días hábiles siguientes al de su emisión","Dentro de los diez días hábiles siguientes a que el interesado se presente a la audiencia","Su DCG no fija un plazo para notificar por oficio la resolución al interesado","Dentro de los treinta días naturales siguientes a que el interesado tenga conocimiento de la suspensión"],"x":"La 73ª II de Bancos obliga al Titular de la UIF a resolver en diez días hábiles desde que el interesado se presenta, y a notificar por oficio dentro de quince días hábiles siguientes a la emisión. Los diez días hábiles son el plazo para resolver, no el de la notificación.","ref":"Bancos 73ª II · H3","par":"C052"},{"id":"C052","tema":"h3","tipo":"caso","q":"La Unidad de Inteligencia Financiera emitió su resolución sobre la inclusión de un cliente de una SOFOM en la Lista de Personas Bloqueadas. ¿Qué plazo prevé la DCG de SOFOM para notificarla por oficio al interesado?","a":"Su DCG no fija un plazo para notificar por oficio la resolución al interesado","o":["Su DCG no fija un plazo para notificar por oficio la resolución al interesado","Dentro de los diez días hábiles siguientes a que el interesado se presente a la audiencia","Dentro de los treinta días naturales siguientes a que el interesado tenga conocimiento de la suspensión","Dentro de los quince días hábiles siguientes al de su emisión"],"x":"La 64ª II de SOFOM fija diez días hábiles para que el Titular de la UIF resuelva, pero no trae el plazo de quince días hábiles para notificar por oficio que sí aparece en Bancos, Fondos, SOFIPO, Centros cambiarios e ITF. Tampoco lo traen Casas de bolsa, SOCAP, Uniones, Casas de cambio ni Transmisores.","ref":"SOFOM 64ª II; Bancos 73ª II · H3","par":"C051"},{"id":"C053","tema":"h3","tipo":"caso","q":"Un banco suspendió los servicios a un cliente por aparecer en la Lista de Personas Bloqueadas y le avisa por escrito. ¿Qué debe informarle según la DCG de Bancos?","a":"Los fundamentos y la causa o causas de su inclusión y que, dentro de los diez días hábiles siguientes a recibir el escrito, puede acudir ante la autoridad competente","o":["Los fundamentos y la causa o causas de su inclusión y que, dentro de los diez días hábiles siguientes a recibir el escrito, puede acudir ante la autoridad competente","Los fundamentos de la inclusión y que la UIF resolverá su caso dentro de los quince días hábiles siguientes a la audiencia, sin necesidad de que el cliente acuda a ella","Que podrá acudir ante la autoridad competente para efectos del procedimiento ante la UIF, sin que se prevea informarle fundamentos ni causas de la inclusión","Únicamente que sus servicios fueron suspendidos, porque informar la causa de la inclusión está prohibido por el deber de reserva"],"x":"La 72ª, último párrafo, de Bancos exige avisar de inmediato, por escrito o por medios digitales, informando los fundamentos y la causa o causas de la inclusión y que dentro de los diez días hábiles siguientes a recibir el escrito podrá acudir ante la autoridad competente. La reserva (52ª IV) exceptúa expresamente ese aviso.","ref":"Bancos 72ª, último párrafo; 52ª IV · H3","par":"C054"},{"id":"C054","tema":"h3","tipo":"caso","q":"Un transmisor de dinero suspendió los servicios a un usuario por aparecer en la Lista de Personas Bloqueadas y le avisa por escrito. ¿Qué debe informarle según la DCG de Transmisores de dinero?","a":"Que podrá acudir ante la autoridad competente para efectos del procedimiento ante la UIF, sin que se prevea informarle fundamentos ni causas de la inclusión","o":["Los fundamentos de la inclusión y que la UIF resolverá su caso dentro de los quince días hábiles siguientes a la audiencia, sin necesidad de que el cliente acuda a ella","Los fundamentos y la causa o causas de su inclusión y que, dentro de los diez días hábiles siguientes a recibir el escrito, puede acudir ante la autoridad competente","Únicamente que sus servicios fueron suspendidos, porque informar la causa de la inclusión está prohibido por el deber de reserva","Que podrá acudir ante la autoridad competente para efectos del procedimiento ante la UIF, sin que se prevea informarle fundamentos ni causas de la inclusión"],"x":"La 62ª de Transmisores de dinero sólo exige informar al usuario, de inmediato y por escrito o medios digitales, que podrá acudir ante la autoridad competente para efectos de la 63ª. No trae el contenido reforzado de Bancos (fundamentos, causas y diez días hábiles); tampoco lo traen SOFOM, Casas de cambio ni Centros cambiarios.","ref":"Transmisores de dinero 62ª; Bancos 72ª · H3","par":"C053"},{"id":"C055","tema":"h3","tipo":"caso","q":"Una persona está sujeta a proceso penal por financiamiento al terrorismo y todavía no hay sentencia. ¿Puede la Secretaría incluirla en la Lista de Personas Bloqueadas por el supuesto de quienes se relacionan con una sentencia penal, conforme a la DCG de SOCAP?","a":"Sí: la fracción IV alcanza a quienes se encuentren en proceso o estén compurgando sentencia por esos delitos","o":["Sí: la fracción IV alcanza a quienes se encuentren en proceso o estén compurgando sentencia por esos delitos","No: la Lista de Personas Bloqueadas sólo se integra con personas de listas del Consejo de Seguridad de la ONU y de autoridades extranjeras","No: la fracción IV alcanza únicamente a quienes estén compurgando sentencia por esos delitos","Sí, pero sólo si además aparece en la lista de contribuyentes del cuarto párrafo del artículo 69-B del Código Fiscal de la Federación"],"x":"La 74ª IV de las SOCAP permite incluir a quienes «se encuentren en proceso o estén compurgando sentencia» por financiamiento al terrorismo u operaciones con recursos de procedencia ilícita. Bancos, Fondos, SOFIPO, Centros cambiarios e ITF sólo mencionan a quienes compurgan sentencia.","ref":"SOCAP 74ª IV; SOFIPO 74ª IV · H3","par":"C056"},{"id":"C056","tema":"h3","tipo":"caso","q":"Una persona está sujeta a proceso penal por financiamiento al terrorismo y todavía no hay sentencia. ¿Puede la Secretaría incluirla en la Lista de Personas Bloqueadas por el supuesto de quienes se relacionan con una sentencia penal, conforme a la DCG de SOFIPO?","a":"No: la fracción IV alcanza únicamente a quienes estén compurgando sentencia por esos delitos","o":["Sí, pero sólo si además aparece en la lista de contribuyentes del cuarto párrafo del artículo 69-B del Código Fiscal de la Federación","No: la Lista de Personas Bloqueadas sólo se integra con personas de listas del Consejo de Seguridad de la ONU y de autoridades extranjeras","Sí: la fracción IV alcanza a quienes se encuentren en proceso o estén compurgando sentencia por esos delitos","No: la fracción IV alcanza únicamente a quienes estén compurgando sentencia por esos delitos"],"x":"La 74ª IV de las SOFIPO reproduce el texto de Bancos: sólo quienes estén compurgando sentencia por financiamiento al terrorismo u operaciones con recursos de procedencia ilícita. La mención a quienes están «en proceso» aparece en SOFOM, Casas de bolsa, SOCAP, Uniones, Casas de cambio y Transmisores.","ref":"SOFIPO 74ª IV; SOCAP 74ª IV · H3","par":"C055"},{"id":"C057","tema":"h3","tipo":"caso","q":"Una autoridad nacional competente determinó que una persona pretende realizar actividades relacionadas con el financiamiento al terrorismo, aunque aún no las ha realizado. ¿Puede la Secretaría incluirla en la Lista de Personas Bloqueadas por la fracción V conforme a la DCG de Casas de bolsa?","a":"Sí: la fracción V alcanza a quienes hayan realizado, realicen o pretendan realizar esas actividades","o":["No: la fracción V alcanza sólo a quienes hayan realizado o realicen esas actividades","Sí: la fracción V alcanza a quienes hayan realizado, realicen o pretendan realizar esas actividades","Sí, pero sólo si además la persona se encuentra compurgando sentencia por esos delitos en el Código Penal Federal","No: la Lista de Personas Bloqueadas sólo recoge las listas de la ONU y las de autoridades extranjeras o de organismos internacionales"],"x":"La 70ª V de Casas de bolsa incluye a quienes las autoridades nacionales competentes determinen que «hayan realizado, realicen o pretendan realizar» actividades relacionadas con FT u ORPI. La redacción de Bancos (71ª V) sólo dice «hayan realizado o realicen».","ref":"Casas de bolsa 70ª V; Bancos 71ª V · H3","par":"C058"},{"id":"C058","tema":"h3","tipo":"caso","q":"Una autoridad nacional competente determinó que una persona pretende realizar actividades relacionadas con el financiamiento al terrorismo, aunque aún no las ha realizado. ¿Puede la Secretaría incluirla en la Lista de Personas Bloqueadas por la fracción V conforme a la DCG de Bancos?","a":"No: la fracción V alcanza sólo a quienes hayan realizado o realicen esas actividades","o":["No: la Lista de Personas Bloqueadas sólo recoge las listas de la ONU y las de autoridades extranjeras o de organismos internacionales","Sí, pero sólo si además la persona se encuentra compurgando sentencia por esos delitos en el Código Penal Federal","Sí: la fracción V alcanza a quienes hayan realizado, realicen o pretendan realizar esas actividades","No: la fracción V alcanza sólo a quienes hayan realizado o realicen esas actividades"],"x":"La 71ª V de Bancos sólo alcanza a quienes las autoridades nacionales competentes determinen que «hayan realizado o realicen» actividades relacionadas con FT u ORPI; no incluye a quienes pretendan realizarlas, expresión que sí traen SOFOM, Casas de bolsa, SOCAP, Uniones, Casas de cambio y Transmisores. Es la diferencia entre «hayan realizado o realicen» y «hayan realizado, realicen o pretendan realizar».","ref":"Bancos 71ª V; Casas de bolsa 70ª V · H3","par":"C057"},{"id":"C059","tema":"h3","tipo":"memoria","q":"Según la DCG de Bancos, ¿quién pone a disposición de las Entidades la Lista de Personas Bloqueadas y sus actualizaciones?","a":"La Secretaría, a través de la Comisión","o":["La Secretaría, a través de la Comisión","La Comisión, directamente, con base en las listas que le comuniquen las autoridades extranjeras","El Consejo de Seguridad de la ONU, por conducto de la Secretaría de Relaciones Exteriores y de la Comisión","La Unidad de Inteligencia Financiera, mediante oficio dirigido a cada Entidad cuando la actualiza"],"x":"La 70ª de Bancos dispone que la Secretaría pone a disposición de las Entidades, a través de la Comisión, la LPB y sus actualizaciones. La definición está en la 2ª XXI: es la lista a que se refiere el artículo 115, párrafo noveno, de la LIC.","ref":"Bancos 70ª, primer párrafo; 2ª XXI · H3"},{"id":"C060","tema":"h3","tipo":"caso","q":"Un banco quiere verificar si un tercero que actúa por cuenta de uno de sus clientes aparece en la Lista de Personas Bloqueadas. ¿Qué exige su DCG?","a":"Adoptar mecanismos para identificar a los Clientes o Usuarios en la lista, a terceros que actúen en su nombre o por su cuenta y sus operaciones, previstos en el Manual de Cumplimiento","o":["Consultar la lista únicamente al abrir el contrato, sin revisar las operaciones posteriores que realice o pretenda realizar el cliente","Sólo mecanismos para identificar a los Clientes, porque los terceros que actúan por cuenta de ellos no pueden quedar incluidos en la lista","Adoptar mecanismos para identificar a los Clientes o Usuarios en la lista, a terceros que actúen en su nombre o por su cuenta y sus operaciones, previstos en el Manual de Cumplimiento","Mecanismos descritos en un documento separado del Manual de Cumplimiento, que debe remitirse cada año a la Unidad de Inteligencia Financiera"],"x":"La 70ª de Bancos obliga a adoptar e implementar mecanismos que identifiquen a los Clientes o Usuarios en la lista, a cualquier tercero que actúe en su nombre o por su cuenta y a las Operaciones que hayan realizado, realicen o pretendan realizar; esos mecanismos deben estar en el Manual de Cumplimiento. No se remiten por separado: viven en el Manual, que sí se envía a la Comisión.","ref":"Bancos 70ª, segundo párrafo · H3"},{"id":"C061","tema":"h3","tipo":"trampa","q":"¿Cuál afirmación sobre la ubicación y el efecto de la Lista de Personas Bloqueadas en la DCG de Bancos es correcta?","a":"Tiene capítulo propio; el cotejo es un mecanismo previsto en el Manual y su consecuencia es suspender y enviar un reporte de Operación Inusual, no un reporte autónomo","o":["Se regula en las disposiciones generales y su consecuencia es un reporte autónomo de Lista de Personas Bloqueadas, enviado a la Secretaría en 24 horas, sin suspender los servicios del cliente","Se regula únicamente en el capítulo de Operaciones Inusuales, que fija el procedimiento completo de suspensión, audiencia y salida de la lista","Forma parte del capítulo de identificación de Clientes, como un dato más que debe incorporarse al expediente de identificación de cada uno","Tiene capítulo propio; el cotejo es un mecanismo previsto en el Manual y su consecuencia es suspender y enviar un reporte de Operación Inusual, no un reporte autónomo"],"x":"La LPB no es parte de la política de identificación: tiene su propio Capítulo XV (70ª a 75ª). La consecuencia de identificar a un listado no es un reporte autónomo, sino una Operación Inusual con la leyenda «Lista de Personas Bloqueadas»; además aparece en los criterios de OI (38ª XIV), el Comité (43ª V) y las alertas (51ª X).","ref":"Bancos Cap. XV 70ª-75ª; 38ª XIV; 43ª V; 51ª X; 72ª · H3"},{"id":"C062","tema":"h3","tipo":"memoria","q":"Una persona figura en una lista derivada de las resoluciones 1267 (1999) y 1373 (2001) del Consejo de Seguridad de la ONU. ¿En qué supuesto de la 71ª de Bancos puede la Secretaría incluirla en la Lista de Personas Bloqueadas?","a":"En la fracción I, relativa a las listas derivadas de esas resoluciones y a las demás que emitan el Consejo de Seguridad o las organizaciones internacionales","o":["En la fracción III, que exige que una autoridad nacional competente dé a conocer indicios suficientes de relación con esos delitos","En la fracción I, relativa a las listas derivadas de esas resoluciones y a las demás que emitan el Consejo de Seguridad o las organizaciones internacionales","En la fracción VII, relativa a quienes aparezcan en la lista de contribuyentes del cuarto párrafo del artículo 69-B del Código Fiscal de la Federación","En la fracción IV, relativa a quienes estén compurgando sentencia por financiamiento al terrorismo u operaciones con recursos de procedencia ilícita"],"x":"La fracción I de la 71ª de Bancos remite a las listas derivadas de las resoluciones 1267 (1999) y sucesivas y 1373 (2001) del Consejo de Seguridad de la ONU y a las que emitan otras organizaciones internacionales. La Secretaría «podrá» incluirlas; no es automático.","ref":"Bancos 71ª I · H3"},{"id":"C063","tema":"h3","tipo":"caso","q":"Un contribuyente aparece en la lista del cuarto párrafo del artículo 69-B del Código Fiscal de la Federación. ¿Qué prevé la DCG de Bancos?","a":"La Secretaría puede incluirlo en la Lista de Personas Bloqueadas (71ª VII) y debe eliminarlo si se encuentra en el supuesto del sexto párrafo del 69-B (74ª V)","o":["Debe suspenderse automáticamente a todo contribuyente de esa lista, sin que la Secretaría tenga que incluirlo en la Lista de Personas Bloqueadas","Se le incluye en la Lista de Personas Bloqueadas únicamente si además está compurgando sentencia por operaciones con recursos de procedencia ilícita y la Comisión lo confirma por oficio","La Secretaría puede incluirlo en la Lista de Personas Bloqueadas (71ª VII) y debe eliminarlo si se encuentra en el supuesto del sexto párrafo del 69-B (74ª V)","La DCG no lo considera, pues la lista del 69-B sólo da lugar a un reporte de Operaciones Relevantes y no a la Lista de Personas Bloqueadas"],"x":"La fracción VII de la 71ª de Bancos (añadida en 2022) permite incluir a quienes aparezcan en la lista del cuarto párrafo del 69-B del CFF, y la 74ª V ordena su eliminación en el supuesto del sexto párrafo. En ambos casos es la Secretaría quien actúa.","ref":"Bancos 71ª VII; 74ª V · H3"},{"id":"C064","tema":"h3","tipo":"caso","q":"Una persona fue incluida en la Lista de Personas Bloqueadas por estar compurgando sentencia por operaciones con recursos de procedencia ilícita. Tiempo después, el juez penal dicta sentencia absolutoria. ¿Qué dispone la DCG de Bancos para la Secretaría?","a":"Debe eliminarla de la Lista de Personas Bloqueadas, porque el juez penal dictó sentencia absolutoria en el supuesto de la fracción IV de la 71ª","o":["Debe eliminarla sólo si el interesado lo solicita dentro de los diez días hábiles siguientes a la sentencia, mediante la audiencia ante la UIF","Debe sustituir su inclusión por la de la fracción V, mientras las autoridades nacionales determinan si realizó actividades relacionadas","Puede mantenerla en la lista hasta que la Comisión confirme la sentencia absolutoria y la Unidad de Inteligencia Financiera la notifique por oficio","Debe eliminarla de la Lista de Personas Bloqueadas, porque el juez penal dictó sentencia absolutoria en el supuesto de la fracción IV de la 71ª"],"x":"La 74ª II obliga a la Secretaría a eliminar de la LPB a quien, estando en el supuesto de la fracción IV de la 71ª, obtenga sentencia absolutoria o compurgue su condena. No depende de una solicitud ni de confirmación de la Comisión.","ref":"Bancos 74ª II; 71ª IV · H3"},{"id":"C065","tema":"h3","tipo":"cifra","q":"Un banco identifica el lunes a las 10:00 horas que un cliente aparece en la Lista de Personas Bloqueadas. ¿En qué plazo debe remitir el reporte a la Secretaría, por conducto de la Comisión?","a":"Dentro de las veinticuatro horas contadas a partir de que conozca la información, como reporte de Operación Inusual con la leyenda «Lista de Personas Bloqueadas»","o":["Dentro de las veinticuatro horas siguientes a la notificación de la resolución que emita la Unidad de Inteligencia Financiera","Dentro de los tres días hábiles siguientes a que conozca la información, como reporte de Operación Relevante con la leyenda de la lista","Dentro de las cuarenta y ocho horas contadas a partir de que conozca la información, como reporte de Operación Inusual con la leyenda de la lista","Dentro de las veinticuatro horas contadas a partir de que conozca la información, como reporte de Operación Inusual con la leyenda «Lista de Personas Bloqueadas»"],"x":"La 72ª II de Bancos fija veinticuatro horas desde que la Entidad conoce que un Cliente o Usuario está en la LPB; el reporte es una Operación Inusual conforme a la 41ª, con la leyenda en la columna de descripción. La resolución de la UIF es posterior y no inicia ese plazo.","ref":"Bancos 72ª II · H3"},{"id":"C066","tema":"h3","tipo":"trampa","q":"Un banco celebró una operación con un cliente antes de que la Lista de Personas Bloqueadas le fuera notificada, y el cliente aparece después en ella. ¿Qué reporte corresponde por esa operación anterior?","a":"Un reporte de Operación Inusual en el plazo de 24 horas, por haber celebrado la operación con anterioridad a la notificación
